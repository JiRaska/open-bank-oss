  - id: p3-shadow-kill-switch-smoke
    definition: perf/scripts/p3-shadow-kill-switch-smoke.mjs
    execution_mode: manual-sandbox-mutation
    safety_boundary: Mutates sandbox state only for non-money-path incident-response SHADOW cases, then clears the kill-switch. SHADOW cases have no business effect and the harness always restores the pilot. Requires a kubectl context pointing at the target cluster, Keycloak port-forward (8090), and case-coordinator-agent port-forward (8146).
    blocker: Not automated in CI yet; run manually from an operator workstation. Needs KEYCLOAK_CLIENT_SECRET for the openbank-services client in the target Keycloak realm.
    assertions: M2M client_credentials mints a token; POST /api/v1/case-coordinator/cases returns 201 with a caseId; Kafka agent.killswitch.set is consumed from agent-kill-switch-events-in using the agent-service mTLS identity; GET /api/v1/case-coordinator/cases/{caseId} returns status CLOSED with non-zero haltedAtEpochMs and a case.halt POLICY_DECISION entry; agent.killswitch.cleared restores the pilot.
