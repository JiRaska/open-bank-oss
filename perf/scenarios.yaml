version: 1
scenarios:
  - id: context-graph-read-baseline
    definition: perf/k6/context-graph-read-baseline.js
    execution_mode: manual-local-isolated
    safety_boundary: Read-only GETs, but each authorized read writes audit evidence. The script accepts only a localhost target; port-forward an isolated auth-enabled stack with synthetic assigned cases, never a shared sandbox or live investigation.
    blocker: Requires isolated 1x and 10x seeded projections, least-privilege case-assigned tokens for each lens, and a colocated k6 runner before p95/p99 can be claimed. A 401/403, malformed response, or empty projection invalidates the sample.
    assertions: Run complaint, incident, authority, AML, AML-network, KYB and Fraud-network lenses separately with CONTEXT_PERF_URL, CONTEXT_PERF_TOKEN, CONTEXT_PERF_CASE_ID, CONTEXT_PERF_PURPOSE, CONTEXT_PERF_REFERENCE and CONTEXT_PERF_LENS against an isolated local target. The AML-network fixture needs an independently assigned related case with visible shared evidence. KYB requires CONTEXT_PERF_MIN_KYB_REVISIONS (at least 2 for correction history), an ordered, non-restricted reference fixture and independent 1x/10x cardinality verification because the response is capped at 50. Fraud-network requires CONTEXT_PERF_ASSIGNED_CASES and CONTEXT_PERF_EXPECTED_RELATED_CASE_ID beyond the first four IDs; it requires an independently assigned, source-open related case, rejects an omitted case or wrong bounded comparison count, and accepts only verified same-role account or counterparty matches. Every response must be authorized, valid, non-empty and bounded; p95 < 300 ms and p99 < 1 s include policy and audit. Compare 1x and 10x volumes and verify concurrent payment baseline regression stays below 2 percent before rollout.

  - id: money-path-smoke
    definition: perf/k6/money-path-smoke.js
    execution_mode: planned-read-only-sandbox
    safety_boundary: Runs only when a safe read-only money-path target is configured for the GitHub-hosted runner.
    target_schedule: "0 5 * * *"
    blocker: No isolated money-path target, dedicated runner, and verified least-privilege read identity are configured yet; a 401 is rejection evidence, not a handler performance baseline. The current scheduled performance gate measures the non-money-path openbank-product-catalog and openbank-flaky-test-hunter subjects only.

  - id: money-path-write-benchmark
    definition: perf/k6/money-path-write-benchmark.js
    execution_mode: manual-local-isolated
    safety_boundary: Mutates accounts and ledger journals; run only against an isolated disposable docker-compose stack, never the shared sandbox.
    baseline_report: perf/reports/2026-07-10-money-path-write-benchmark.md
    blocker: A repeatable isolated target and synthetic-data teardown are required before this can become a scheduled run.

  - id: security-abuse-smoke
    definition: perf/k6/security-abuse-smoke.js
    execution_mode: manual-local-isolated
    safety_boundary: Every request is invalid by construction (no valid token, no accepted body, nothing created), so the lane is safe against any stack — the rejection path IS the subject. A 200 or 5xx on any probe is a finding, not a pass.
    blocker: Requires an auth-ENABLED disposable boot before it can join the scheduled perf gate — the current perf-gate harness boots with quarkus.oidc.enabled=false, which would make every identity probe a false 200. Wiring = a second boot profile in perf-gate.yml (auth on, disposable identity) reusing the same throwaway postgres; tracked in #8590 #4. Validated locally against a stub in both directions (exit 0 on a well-behaved target, exit 99 with breaches counted on a 200-answering one).
    assertions: no-token and malformed-token probes must 401/403; NUL-byte query param must 400/401/403 (NulByteGuards boundary, never 500); enumeration sweep must 401/403/404 (200 = IDOR) with a latency trend for the timing side-channel; oversized header must 400/401/431.

  # Per-module money-path read baselines (<module>/src/test/k6/*.js).
  # Every one is GET-only, so unlike money-path-write-benchmark they need no isolated
  # target or synthetic-data teardown — only a least-privilege read identity.
  - id: account-read-baseline
    definition: openbank-account-service/src/test/k6/account-read-baseline.js
    execution_mode: planned-read-only-sandbox
    safety_boundary: Read-only by construction — every request is a GET against openbank-account-service; nothing is created, mutated or deleted, so the lane is safe against a shared sandbox.
    target_schedule: "0 5 * * *"
    blocker: Needs a booted openbank-account-service target and a least-privilege read identity (PERF_READ_TOKEN) wired into the perf gate; a 401 is rejection evidence, not a handler baseline. Seeded read fixtures (party/account ids) are required for the id-scoped probes.
    assertions: Exercises account list (partyId, cursor), account detail, account balance, trigram IBAN search. Advisory p95 tripwires per route plus http_req_failed rate<0.01 and checks rate==1.0 — a route that did not answer 200 invalidates the percentile.

