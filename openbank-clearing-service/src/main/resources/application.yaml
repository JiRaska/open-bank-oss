quarkus:
  application:
    name: openbank-clearing-service
  http:
    port: 8124
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_clearing
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_clearing
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Client-credentials token for the outbound ledger journal post (ADR-0281) — same service
  # identity the inbound side authenticates.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none
  redis:
    hosts: redis://localhost:6379
  rest-client:
    # ADR-0281: the net-settlement journal posts to the platform's only ledger ingestion surface.
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
      connect-timeout: 2000
      read-timeout: 3000
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-clearing-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    # health/metrics on the main port in tests — RestAssured targets a single port
    management:
      enabled: false
openbank:
  clearing:
    batch-size: 1000
    netting-enabled: true
    settlement-cycle-hours: 4
  rate-limit:
    enabled: true
    max-concurrent-requests: 500
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137, #2665 Tier 1). Defaults keep local dev/test on
    # PLAINTEXT; the clearing Rollout sets KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      clearing-events-out:
        connector: smallrye-kafka
        client.id: clearing-service-${quarkus.uuid}
        topic: openbank.clearing.batch.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # ADR-0281: self-consumption of the net_settlement.post command on the service's own topic
      # (second consumer group). group.id / auto.offset.reset deliberately NOT set as YAML keys
      # (SmallRye's dotted-key footgun, #686/#703) — group.id falls back to
      # quarkus.application.name, auto.offset.reset stays `latest` so a fresh deploy does not
      # replay historical commands and re-post them (harmless — the ledger idempotency key
      # collapses a replay — but noisy).
      clearing-net-settlement-in:
        # #5745: rethrow only helps if the connector PARKS the record — SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel. The DLQ topic is EXPLICIT (the
        # implicit name derives from the channel name, which repeats across services) and NESTED
        # (a dotted leaf key is quoted by SmallRye's YAML source and never read, #686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.clearing-service.clearing-net-settlement-in
        connector: smallrye-kafka
        topic: openbank.clearing.batch.event
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second
  # approver), independent of the base allow/deny enforce toggle above. Stays false
  # here — this PR only wires the ApprovalStore/endpoint (mirroring the sepa-payment
  # pilot); flipping it is a deliberate, separate follow-up once the maker/checker
  # runbook is reviewed.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
