openapi: 3.1.0
info:
  title: Clearing Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.2 -> 1.3): additive
  # only — GET /approvals (the checker's queue, issue #5679) plus two additive fields on
  # ApprovalResponse (makerId, createdAt). No breaking change.
  version: 1.4.0
  description: Payment clearing and settlement — batch submission, cycle triggering, position management.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8124
    description: Local development
tags:
  - name: Clearing

paths:
  /api/v1/clearing/submit:
    post:
      tags: [Clearing]
      summary: Submit a payment to clearing
      operationId: submitToClearing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPaymentRequest'
      responses:
        '200':
          description: Clearing item created
        '403':
          description: Forbidden — OPA policy denied clearingBatch.submit (ADR-0034 Phase 5)

  /api/v1/clearing/batches:
    get:
      tags: [Clearing]
      summary: List clearing batches
      operationId: listClearingBatches
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: rail
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of batches
        '403':
          description: Forbidden — OPA policy denied clearingBatch.list (ADR-0034 Phase 5)

  /api/v1/clearing/batches/{id}:
    get:
      tags: [Clearing]
      summary: Get clearing batch by ID
      operationId: getClearingBatch
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '200':
          description: Batch detail
        '403':
          description: Forbidden — OPA policy denied clearingBatch.read (ADR-0034 Phase 5)

  /api/v1/clearing/batches/{id}/items:
    get:
      tags: [Clearing]
      summary: Get items in a clearing batch
      operationId: getBatchItems
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '200':
          description: Batch items
        '403':
          description: Forbidden — OPA policy denied clearingBatch.readItems (ADR-0034 Phase 5)

  /api/v1/clearing/batches/{id}/settle:
    post:
      tags: [Clearing]
      summary: Settle a clearing batch
      operationId: settleBatch
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '200':
          description: Settlement initiated
        '403':
          description: Forbidden — OPA policy denied clearingBatch.settle (ADR-0034 Phase 5)

  /api/v1/clearing/cycle/trigger:
    post:
      tags: [Clearing]
      summary: Trigger a clearing cycle
      operationId: triggerClearingCycle
      parameters:
        - name: rail
          in: query
          schema:
            type: string
            default: SEPA_SCT
      responses:
        '200':
          description: Cycle triggered
        '403':
          description: Forbidden — OPA policy denied clearingBatch.triggerCycle (ADR-0034 Phase 5)

  /api/v1/clearing/positions/{cycleId}:
    get:
      tags: [Clearing]
      summary: Get settlement positions for a cycle
      operationId: getSettlementPositions
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Settlement positions
        '403':
          description: Forbidden — OPA policy denied clearingBatch.readPositions (ADR-0034 Phase 5)

  /api/v1/clearing/items/{id}:
    get:
      tags: [Clearing]
      summary: Get clearing item by ID
      operationId: getClearingItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clearing item
        '403':
          description: Forbidden — OPA policy denied clearingBatch.readItem (ADR-0034 Phase 5)

  /api/v1/clearing/items/by-payment/{paymentId}:
    get:
      tags: [Clearing]
      summary: Get clearing items for a payment
      operationId: getClearingItemsByPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clearing items
        '403':
          description: Forbidden — OPA policy denied clearingBatch.readItemsByPayment (ADR-0034 Phase 5)

  /api/v1/clearing/batches/{id}/reconcile:
    get:
      tags: [Clearing]
      summary: Run internal reconciliation check for a settled batch
      operationId: reconcileBatch
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '200':
          description: Reconciliation clean
        '409':
          description: Reconciliation found a discrepancy
        '403':
          description: Forbidden — OPA policy denied clearingBatch.reconcile (ADR-0034 Phase 5)

  /api/v1/clearing/approvals:
    get:
      tags: [Clearing]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2,
        issue #5679). Without it a decision parked at 202 is discoverable only by whoever was
        handed its id. Requires ROLE_PAYMENTS or ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: Forbidden — OPA policy denied clearingBatch.approval.read (ADR-0034 Phase 5)

  /api/v1/clearing/approvals/{id}:
    patch:
      tags: [Clearing]
      summary: Approve or reject a pending four-eyes approval for a clearing (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_PAYMENTS or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          description: No pending approval with that id

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    batchId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SubmitPaymentRequest:
      type: object
      required: [paymentId, rail, amount, currency]
      properties:
        paymentId:
          type: string
          format: uuid
        rail:
          type: string
          enum: [SEPA_SCT, SEPA_SCT_INST, SWIFT, DOMESTIC, INTERNAL]
        amount:
          type: number
        currency:
          type: string
        debtorIban:
          type: string
        creditorIban:
          type: string

    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the gated
        action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide, so the
        queue is readable by anyone who may decide, including the maker (seeing a request is not
        authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
        action:
          type: string
          description: The gated action this approval was raised for.
        resourceId:
          type: string
          nullable: true
        status:
          type: string
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
        decidedBy:
          type: string
          nullable: true
