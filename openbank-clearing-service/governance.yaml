# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: payments
primaryDatastore: PostgreSQL
databaseName: openbank_clearing
dataLineageRole: both
dataClassification: confidential
retentionPolicy: 7 years
evidenceExported: true
databaseLineage:
  ownedDatabases:
    - openbank_clearing
  dependentDatabases:
    - openbank_transactions
