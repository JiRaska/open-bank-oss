# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: identity
primaryDatastore: PostgreSQL
databaseName: openbank_pid
dataLineageRole: both
dataClassification: restricted
retentionPolicy: 10 years
evidenceExported: true
lineage:
  upstream: []
    # Removed (issue #3982): `party-service (api, "documents")` — party-service's clients are
    # account-service, kyc-service, card-service, consent-service and transaction-service, none
    # of them pid-service, and its Deployment env carries no PID_SERVICE_URL. pid-service has no
    # party-service client either. The services that DO call pid-service are customer-edge and
    # delegation-service, and both edges are declared on their own side.
databaseLineage:
  ownedDatabases:
    - openbank_pid
  dependentDatabases:
    - openbank_parties
