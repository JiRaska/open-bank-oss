# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: Banking Context Service API
  version: 1.10.1
  description: Purpose-bound, case-assigned graph views for authorized investigations.
paths:
  /api/v1/context/lending-loans/{loanId}/access:
    get:
      operationId: verifyAssignedLendingLoanAccess
      summary: Verify live access to one exact loan without returning source data
      description: >-
        The human investigator's case ID must equal the loan UUID. A live, reviewed
        LENDING_EXPOSURE_REVIEW assignment to lending-loan:{loanId} and policy allow
        are required. Shared collateral or guarantors confer no access to other loans.
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '204': { description: Exact loan assignment and policy allow; no data returned }
        '400': { description: Case or purpose mismatch }
        '403': { description: Role, assignment or policy denied }
        '503': { description: Authorization unavailable }
  /api/v1/context/lending-loans/{loanId}/approved-guarantees:
    get:
      operationId: getAssignedLendingApprovedGuarantees
      summary: Read approved guarantee evidence for one assigned loan
      description: >-
        Disabled by default. Requires the human investigator's exact loan case ID,
        LENDING_EXPOSURE_REVIEW purpose, current root assignment and policy allow.
        Reads bounded source evidence directly from Lending; shared parties confer no access
        to another loan. The response is uncached and may be truncated.
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: At most 100 approved guarantee facts for this loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LendingGuaranteeHistory' }
        '400': { description: Case or purpose mismatch }
        '403': { description: Role, assignment, policy or source denied }
        '503': { description: Feature disabled, authorization or source unavailable }
  /api/v1/context/lending-loans/{loanId}/assigned-candidates:
    get:
      operationId: getAssignedLendingCandidates
      summary: Return bounded current loan assignments after authorizing the human root
      description: >-
        Disabled by default with Lending source reads. Requires a human bearer, exact loan case ID,
        LENDING_EXPOSURE_REVIEW purpose, and current root assignment and policy allow.
        Returns only other loans assigned to the same investigator with canonical loan roots;
        no loan facts or shared-party inference. The response is uncached and may be truncated.
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: At most 256 other assigned loan IDs and a truncation flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LendingAssignedCandidates' }
        '400': { description: Case or purpose mismatch }
        '403': { description: Role, bearer, assignment or policy denied }
        '503': { description: Feature disabled, authorization or assignment store unavailable }
  /api/v1/context/lending-loans/{loanId}/shared-guarantors:
    get:
      operationId: getAssignedLendingSharedGuarantors
      summary: Explore approved shared guarantors among independently authorized loans
      description: >-
        Disabled by default. Lending matches approved source facts within at most 256 loans
        currently assigned to the same human investigator. Context rechecks each returned loan
        before disclosing bounded evidence. A match is an investigative lead, not a statement
        of current enforceability, exposure, or wrongdoing. Truncation makes the view partial.
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: At most four independently authorized related loans and their source evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LendingSharedGuarantorHistory' }
        '400': { description: Case or purpose mismatch }
        '403': { description: Root or related loan authorization denied }
        '503': { description: Feature disabled, authorization or source unavailable }
  /api/v1/context/fraud-cases/{caseId}/network:
    get:
      operationId: getAssignedFraudCaseNetwork
      summary: Explore explicit shared source references among independently authorized open Fraud cases
      description: >-
        Fraud obtains the first 256 assigned case references directly from Context, then matches
        source-owned identifiers within that set.
        Each returned match is independently authorized and read-audited. A limit or source gap
        makes this a partial one-hop view, never a fraud finding or identity inference.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: Root and at most four related open cases with evidence for each explicit equality
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudCaseNetwork' }
        '400': { description: Case or purpose mismatch }
        '403': { description: Root role, assignment, policy or current source state denied }
        '503': { description: Authorization, reference store or source unavailable }
  /api/v1/context/fraud-cases/{caseId}/access:
    get:
      operationId: verifyAssignedFraudCaseAccess
      summary: Verify a human administrator's active assignment to this exact Fraud case
      description: Returns no case data. Intended for source-owned, case-scoped evidence reads.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '204': { description: Active root-scoped assignment and policy allow }
        '400': { description: Case or purpose mismatch }
        '403': { description: Role, assignment or policy denied }
        '503': { description: Authorization unavailable }
  /api/v1/context/fraud-cases/{caseId}/assigned-candidates:
    get:
      operationId: getAssignedFraudCandidates
      summary: Return a bounded assigned case set after human root authorization
      description: >-
        Used by Fraud's source matcher. The caller cannot supply case IDs for comparison;
        Context selects the human investigator's live assigned open-case references.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: At most 256 case IDs and a truncation flag; no source identifiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudAssignedCandidates' }
        '403': { description: Role, assignment or policy denied }
        '503': { description: Authorization or reference store unavailable }
  /api/v1/context/kyb-cases/{id}/access:
    get:
      operationId: checkAssignedKybCaseAccess
      summary: Check current KYB case assignment without returning ownership history
      description: Uses the human investigator's bearer, exact case and purpose; the decision is read-audited.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '204': { description: Current KYB case access allowed; no case data returned }
        '400': { description: Case and purpose mismatch }
        '403': { description: Role, root assignment or policy denied }
        '503': { description: Authorization unavailable }
  /api/v1/context/kyb-cases/{id}/ownership-observations:
    get:
      operationId: getKybOwnershipObservationReferences
      summary: Read bounded reference-only ownership history for an assigned KYB case
      description: Owner attributes remain in KYB. recordedAt is Context ingestion time, not finding time.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - name: knownAt
          in: query
          description: Omit for the current database-recorded snapshot; provide a timestamp for an exact historical cutoff.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: At most 50 case-scoped references with a truncation flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KybObservationHistory' }
        '400': { description: Case and purpose mismatch or future knownAt }
        '403': { description: Role, root assignment or policy denied }
        '503': { description: Authorization unavailable }
  /api/v1/context/aml-cases/{id}/network:
    get:
      operationId: getAssignedAmlCaseNetwork
      summary: Find explicit shared references among source-open AML cases assigned to the same investigator
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - name: effectiveAt
          in: query
          schema: { type: string, format: date-time }
        - name: knownAt
          in: query
          description: Omit for a current database-recorded snapshot; provide a timestamp for an exact historical knowledge cutoff.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Root and at most four independently authorized case histories; shared identifiers are leads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmlCaseNetwork' }
        '400': { description: Invalid case, purpose or future timestamp }
        '403': { description: Root role, assignment, policy or current source state denied }
        '503': { description: Authorization or AML case source unavailable }
  /api/v1/context/aml-cases/{id}:
    get:
      operationId: getAmlCaseEvidence
      summary: Read source-observed AML case evidence within an approved case root
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - name: effectiveAt
          in: query
          schema: { type: string, format: date-time }
        - name: knownAt
          in: query
          description: Omit for a current database-recorded snapshot; provide a timestamp for an exact historical knowledge cutoff.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Bounded observations after an uncached current-state check with the owning AML service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmlCaseHistory' }
        '400': { description: Invalid case, purpose or future timestamp }
        '403': { description: Role, root assignment, policy or current source case state denied }
        '503': { description: Authorization or AML case source unavailable }
  /api/v1/context/authorizations/{id}:
    get:
      operationId: getAuthorityHistory
      summary: Read immutable source delegation observations for an explicitly approved root
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - name: effectiveAt
          in: query
          schema: { type: string, format: date-time }
        - name: knownAt
          in: query
          description: Omit for a current database-recorded snapshot; provide a timestamp for an exact historical knowledge cutoff.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Bounded source observations; no assertion about authorization of a business action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorityHistory' }
        '400': { description: Invalid purpose, scope or future timestamp }
        '403': { description: Role, root assignment or policy denied }
        '503': { description: Authorization unavailable }
  /api/v1/context/assignment-proposals:
    post:
      operationId: proposeContextAssignment
      summary: Propose time-bounded investigation access for independent approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeAssignment' }
      responses:
        '201': { description: Pending proposal created }
        '400': { description: Invalid scope or validity window }
        '403': { description: Policy denied }
    get:
      operationId: listPendingContextAssignments
      summary: List pending assignment proposals for a checker
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { description: Pending proposals }
        '403': { description: Policy denied }
  /api/v1/context/assignment-proposals/{id}:
    patch:
      operationId: decideContextAssignment
      summary: Approve or reject as a checker distinct from the maker
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideAssignment' }
      responses:
        '200': { description: Decision recorded; an approval creates the assignment atomically }
        '403': { description: Policy denied }
        '404': { description: Proposal not found in the configured bank scope }
        '409': { description: Self-approval or proposal already decided }
  /api/v1/context/assignment-proposals/assignments/{id}:
    delete:
      operationId: revokeContextAssignment
      summary: Immediately revoke active investigation access
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204': { description: Assignment expired and revocation audited }
        '403': { description: Policy denied }
        '404': { description: Assignment not found in the configured bank scope }
  /api/v1/context/assignment-proposals/assignments:
    get:
      operationId: listActiveContextAssignments
      summary: List active investigation assignments for revocation review
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { description: Active time-bounded assignments }
        '403': { description: Policy denied }
  /api/v1/context/complaints/{reference}:
    get:
      operationId: getComplaintContext
      summary: Read a bounded payment-complaint context graph
      description: >-
        The complaint root and direct references use the highest retained source revision
        effective at asOf (source event time). Receipt time is returned separately; this
        endpoint does not reconstruct what was known at that time. Current case assignment
        and policy are rechecked even for historical reads. Missing retained revisions
        return 404; overwritten pre-migration evidence is never inferred from current rows.
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - $ref: '#/components/parameters/asOf'
      responses:
        '200': { description: Authorized bounded neighborhood; a source-confirmed SEPA return may include a REVERSAL_TRANSACTION node and REVERSED_BY edge when transaction-service returned a reversal ID }
        '400': { description: Invalid investigation context or asOf timestamp }
        '403': { description: No active assignment or policy denied }
        '404': { description: No retained complaint revision effective at asOf }
        '503': { description: Authorization decision unavailable }
  /api/v1/context/incidents/{reference}/impact:
    get:
      operationId: getIncidentImpact
      summary: Read aggregate incident impact without affected identifiers
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - $ref: '#/components/parameters/asOf'
      responses:
        '200':
          description: Authorized aggregate projection; missing evidence is not zero business impact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentImpact' }
        '400': { description: Invalid investigation context or asOf timestamp }
        '403': { description: No active assignment or policy denied }
        '503': { description: Authorization decision unavailable }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    reference:
      name: reference
      in: path
      required: true
      schema: { type: string, maxLength: 200 }
    caseId:
      name: X-Investigation-Case-Id
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
    purpose:
      name: X-Investigation-Purpose
      in: header
      required: true
      schema: { type: string, maxLength: 80 }
    asOf:
      name: asOf
      in: query
      required: false
      schema: { type: string, format: date-time }
  schemas:
    LendingSharedGuarantorHistory:
      type: object
      required: [rootLoanId, effectiveAt, knownAt, candidateTruncated, relatedLoansTruncated, relatedLoans]
      properties:
        rootLoanId: { type: string, format: uuid }
        effectiveAt: { type: string, format: date-time }
        knownAt: { type: string, format: date-time }
        candidateTruncated: { type: boolean }
        relatedLoansTruncated: { type: boolean }
        relatedLoans:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/LendingRelatedLoanEvidence' }
    LendingRelatedLoanEvidence:
      type: object
      required: [loanId, guarantees, truncated]
      properties:
        loanId: { type: string, format: uuid }
        truncated: { type: boolean }
        guarantees:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/LendingGuaranteeEvidence' }
    LendingAssignedCandidates:
      type: object
      required: [ids, truncated]
      properties:
        ids:
          type: array
          maxItems: 256
          uniqueItems: true
          items: { type: string, format: uuid }
        truncated: { type: boolean }
    LendingGuaranteeHistory:
      type: object
      required: [loanId, effectiveAt, knownAt, guarantees, truncated]
      properties:
        loanId: { type: string, format: uuid }
        effectiveAt: { type: string, format: date-time }
        knownAt: { type: string, format: date-time }
        truncated: { type: boolean }
        guarantees:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/LendingGuaranteeEvidence' }
    LendingGuaranteeEvidence:
      type: object
      required: [guaranteeId, contractId, revision, guarantorPartyId, capAmount, currency, coverageFraction, seniority, validFrom, sourceDocumentId, sourceSha256, decidedAt]
      properties:
        guaranteeId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        supersedesGuaranteeId: { type: [string, "null"], format: uuid }
        guarantorPartyId: { type: string, format: uuid }
        capAmount: { type: number }
        currency: { type: string }
        coverageFraction: { type: number }
        seniority: { type: integer }
        validFrom: { type: string, format: date-time }
        validTo: { type: [string, "null"], format: date-time }
        sourceDocumentId: { type: string, format: uuid }
        sourceSha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        decidedAt: { type: string, format: date-time }
    FraudAssignedCandidates:
      type: object
      required: [ids, truncated]
      properties:
        ids:
          type: array
          maxItems: 256
          uniqueItems: true
          items: { type: string, format: uuid }
        truncated: { type: boolean }
    FraudCaseNetwork:
      type: object
      required: [root, related, inspectedCandidates, candidateTruncated]
      properties:
        root: { $ref: '#/components/schemas/FraudCaseSourceEvidence' }
        inspectedCandidates:
          type: integer
          minimum: 0
          maximum: 4
          description: Source-matched candidates independently checked by Context.
        comparedCandidates:
          type: integer
          minimum: 0
          maximum: 256
          description: Assigned candidates compared by Fraud; absent in older responses.
        candidateTruncated:
          type: boolean
          description: Assignment scan or source match limit was reached; no exhaustive negative conclusion is possible.
        related:
          type: array
          maxItems: 4
          items:
            type: object
            required: [evidence, shared]
            properties:
              evidence: { $ref: '#/components/schemas/FraudCaseSourceEvidence' }
              shared:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [type, sourceId]
                  properties:
                    type: { type: string, enum: [ACCOUNT, COUNTERPARTY] }
                    sourceId: { type: string, format: uuid }
    FraudCaseSourceEvidence:
      type: object
      required: [caseId, scoreId, accountId, status, revision, openedAt]
      properties:
        caseId: { type: string, format: uuid }
        scoreId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        counterpartyId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [OPEN] }
        revision: { type: integer, format: int64, minimum: 1 }
        openedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
    KybObservationHistory:
      type: object
      required: [root, knownAt, observations, truncated]
      properties:
        root: { type: string, pattern: '^kyb-case:[0-9a-f-]{36}$' }
        knownAt: { type: string, format: date-time }
        observations:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/KybObservationSummary' }
        truncated: { type: boolean }
    KybObservationSummary:
      type: object
      required: [observationId, revision, sourceSha256, recordedAt]
      additionalProperties: false
      properties:
        observationId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        recordedAt: { type: string, format: date-time }
    IncidentImpact:
      type: object
      required: [incidentRef, affectedByType, total, drilldownAvailable, projectionStatus]
      properties:
        incidentRef: { type: string, maxLength: 200 }
        affectedByType:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        total:
          type: integer
          minimum: 0
          description: Count in the retrieved projection slice, never a claim of total business impact
        drilldownAvailable: { type: boolean, const: false }
        projectionStatus:
          type: string
          enum: [MISSING, PARTIAL, AVAILABLE]
          description: MISSING means no root projection; PARTIAL means a query limit was reached; AVAILABLE describes the retrieved projection only, not telemetry coverage
    ProposeAssignment:
      type: object
      required: [principalId, caseId, purpose, validTo]
      properties:
        principalId: { type: string, minLength: 1, maxLength: 200 }
        caseId: { type: string, minLength: 1, maxLength: 200 }
        purpose: { type: string, minLength: 1, maxLength: 80 }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        rootRef:
          type: [string, "null"]
          maxLength: 300
          description: Required exact root for every purpose — delegation:UUID, aml-case:UUID, kyb-case:UUID, fraud-case:UUID, incident:UUID or complaint:reference. An old unscoped assignment never authorizes a graph read.
    DecideAssignment:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
    AmlCaseNetwork:
      type: object
      required: [root, related]
      properties:
        root: { $ref: '#/components/schemas/AmlCaseHistory' }
        related:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/AmlCaseHistory' }
    AmlCaseHistory:
      type: object
      required: [root, effectiveAt, knownAt, observations, truncated]
      properties:
        root: { type: string, maxLength: 45 }
        effectiveAt: { type: string, format: date-time }
        knownAt: { type: string, format: date-time }
        truncated: { type: boolean }
        observations:
          type: array
          maxItems: 100
          items:
            type: object
            required: [evidence, recordedAt, evidenceRef, contentHash]
            properties:
              recordedAt: { type: string, format: date-time }
              evidenceRef: { type: string, maxLength: 300 }
              contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
              evidence: { $ref: '#/components/schemas/AmlCaseObservation' }
    AmlCaseObservation:
      type: object
      required: [eventId, caseId, partyId, eventType, status, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        transactionId: { type: [string, "null"], format: uuid }
        eventType: { type: string, enum: [aml.case.created.v1, aml.case.status_changed.v1] }
        status: { type: string, enum: [OPEN, UNDER_REVIEW, CLEARED, BLOCKED, ESCALATED] }
        previousStatus: { type: [string, "null"], enum: [OPEN, UNDER_REVIEW, CLEARED, BLOCKED, ESCALATED, null] }
        riskLevel: { type: [string, "null"], pattern: '^(LOW|MEDIUM|HIGH|CRITICAL)$' }
        screeningType: { type: [string, "null"], enum: [CUSTOMER_ONBOARDING, TRANSACTION_MONITORING, PERIODIC_REVIEW, MANUAL_INVESTIGATION, null] }
        occurredAt: { type: string, format: date-time }
    AuthorityHistory:
      type: object
      required: [root, effectiveAt, knownAt, observations, truncated, actionAuthorization]
      properties:
        root: { type: string, maxLength: 47 }
        effectiveAt: { type: string, format: date-time }
        knownAt: { type: string, format: date-time }
        truncated: { type: boolean }
        actionAuthorization: { type: string, const: UNKNOWN }
        observations:
          type: array
          maxItems: 100
          items:
            type: object
            required: [evidence, recordedAt, evidenceRef, contentHash]
            properties:
              recordedAt: { type: string, format: date-time }
              evidenceRef: { type: string, maxLength: 300 }
              contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
              evidence: { $ref: '#/components/schemas/AuthorityEvidence' }
    AuthorityEvidence:
      type: object
      required: [delegationId, revision, eventType, grantorPartyId, granteePartyId, capabilities, occurredAt]
      properties:
        delegationId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 0 }
        eventType:
          type: string
