# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: Banking Context Service API
  version: 1.0.0
  description: Purpose-bound, case-assigned graph views for authorized investigations.
paths:
  /api/v1/context/complaints/{reference}:
    get:
      operationId: getComplaintContext
      summary: Read a bounded payment-complaint context graph
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - $ref: '#/components/parameters/asOf'
      responses:
        '200': { description: Authorized bounded neighborhood }
        '403': { description: No active assignment or policy denied }
        '404': { description: Root not projected }
        '503': { description: Authorization decision unavailable }
  /api/v1/context/incidents/{reference}/impact:
    get:
      operationId: getIncidentImpact
      summary: Read aggregate incident impact without affected identifiers
      parameters:
        - $ref: '#/components/parameters/reference'
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/purpose'
        - $ref: '#/components/parameters/asOf'
      responses:
        '200': { description: Authorized aggregate impact }
        '403': { description: No active assignment or policy denied }
        '503': { description: Authorization decision unavailable }
components:
  parameters:
    reference:
      name: reference
      in: path
      required: true
      schema: { type: string, maxLength: 200 }
    caseId:
      name: X-Investigation-Case-Id
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
    purpose:
      name: X-Investigation-Purpose
      in: header
      required: true
      schema: { type: string, maxLength: 80 }
    asOf:
      name: asOf
      in: query
      required: false
      schema: { type: string, format: date-time }
