# OpenBank Developer Portal — static nginx (unprivileged image, listens on 8080, non-root).
# Read-only root filesystem friendly: all temp/runtime paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  types { application/yaml yaml yml; }

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # Writable temp paths so the container root fs can be read-only.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  gzip on;
  gzip_types text/plain text/css application/javascript application/yaml image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth security headers (also set at the ingress edge). The CSP is strict:
    # everything is same-origin. style/worker allowances are the minimum Redoc needs to render.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Liveness/readiness target (cheap, no body).
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }

    # Long-cache the immutable vendored assets; keep HTML uncached. NOTE: use ONLY the `expires`
    # directive here, never `add_header` — nginx resets ALL inherited add_header directives the moment
    # a location declares its own, which would strip the security headers above off every JS/CSS/YAML
    # response (the Redoc bundle included). `expires` sets Cache-Control without that side effect.
    location ~* \.(js|css|svg)$ { expires 7d; }
    location ~* \.ya?ml$       { expires 1h; }
  }
}
