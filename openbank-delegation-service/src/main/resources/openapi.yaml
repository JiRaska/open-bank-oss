openapi: 3.1.0
info:
  title: OpenBank Delegation Service API
  description: |
    Customer-to-party delegated access (ADR-0232): granular, SCA-bound grants over
    products (accounts, savings goals, cards) and single objects (payment, statement,
    document). Lifecycle: OFFERED → ACTIVE → SUSPENDED/REVOKED/EXPIRED/RENOUNCED/DECLINED.
  version: 1.17.0
servers:
  - url: http://localhost:8126
tags:
  - name: Delegations
  - name: Approval groups
  - name: Delegation role presets
  - name: Delegation lifecycle approvals
  - name: Disclosures
paths:
  /api/v1/disclosures/delegations/{delegationId}:
    post:
      tags: [Disclosures]
      summary: Prepare an immutable PDF snapshot for an active DOCUMENT delegation
      parameters:
        - name: delegationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: X-Request-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Snapshot preparation accepted or idempotently replayed
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisclosureResponse' }
        '403': { description: Authenticated party is not the grantor }
        '404': { description: Delegation not found }
        '409': { description: X-Request-ID is bound to a different disclosure }
        '422': { description: Delegation is not active or not a DOCUMENT grant }
  /api/v1/disclosures/{id}:
    get:
      tags: [Disclosures]
      summary: Read snapshot preparation status as the grantor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Disclosure lifecycle state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisclosureResponse' }
        '403': { description: Authenticated party is not the grantor }
        '404': { description: Disclosure not found }
  /api/v1/disclosures/{id}/redemptions:
    post:
      tags: [Disclosures]
      summary: Issue or rotate an unverified recipient redemption
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueDisclosureRedemptionRequest' }
      responses:
        '201':
          description: Redemption issued; deliver the magic token separately from the emailed OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDisclosureRedemptionResponse' }
        '404': { description: Ready disclosure not found for this grantor }
  /api/v1/disclosures/{id}/redemption:
    delete:
      tags: [Disclosures]
      summary: Revoke an active disclosure redemption
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '204': { description: Redemption revoked }
        '404': { description: Active redemption not found for this grantor }
  /api/v1/public/disclosures/verify:
    post:
      tags: [Disclosures]
      security: []
      summary: Exchange a magic token and emailed OTP for a short-lived access ticket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyDisclosureRedemptionRequest' }
      responses:
        '200':
          description: Credentials verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyDisclosureRedemptionResponse' }
        '404': { description: Credentials invalid, expired, locked, revoked, or already exchanged }
  /api/v1/public/disclosures/content:
    post:
      tags: [Disclosures]
      security: []
      summary: Consume one permitted view and return the sealed PDF
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadDisclosureRequest' }
      responses:
        '200':
          description: Immutable sealed disclosure content
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: 'private, no-store, max-age=0' } }
            X-Disclosure-View: { schema: { type: string, example: '1/1' } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Ticket invalid, expired, revoked, or exhausted }
  /api/v1/delegations/approval-groups/sca-reference:
    post:
      tags: [Approval groups]
      summary: Calculate the canonical reference that the management SCA must sign
      parameters:
        - { $ref: '#/components/parameters/CustomerPartyId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalGroupScaReferenceRequest' }
      responses:
        '200':
          description: Opaque, versioned SCA reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupScaReferenceResponse' }
        '400': { description: Invalid create/revise shape }
  /api/v1/delegations/approval-groups:
    get:
      tags: [Approval groups]
      summary: List approval groups owned by the authenticated party
      parameters: [{ $ref: '#/components/parameters/CustomerPartyId' }]
      responses:
        '200':
          description: Versioned groups, including inactive history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApprovalGroupResponse' } }
    post:
      tags: [Approval groups]
      summary: Create an SCA-bound approval group
      parameters:
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/CustomerActorPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalGroupWriteRequest' }
      responses:
        '201': { description: Approval group created }
        '400': { description: Invalid roster or SCA }
        '403': { description: Caller is not the group owner }
  /api/v1/delegations/approval-groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CustomerPartyId'
    get:
      tags: [Approval groups]
      summary: Get an owned approval group
      responses:
        '200':
          description: Approval group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupResponse' }
        '404': { description: Missing or owned by another party }
    put:
      tags: [Approval groups]
      summary: Replace a roster under optimistic revision and a fresh SCA challenge
      parameters: [{ $ref: '#/components/parameters/CustomerActorPartyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalGroupWriteRequest' }
      responses:
        '200': { description: Approval group revised }
        '400': { description: Invalid roster or SCA }
        '409': { description: expectedRevision is stale }
    delete:
      tags: [Approval groups]
      summary: Deactivate the group for future operation snapshots
      parameters: [{ $ref: '#/components/parameters/CustomerActorPartyId' }]
      responses:
        '200': { description: Approval group deactivated }
  /api/v1/delegation-role-presets:
    get:
      tags: [Delegation role presets]
      summary: List reusable delegation role presets
      responses:
        '200':
          description: Presets ordered by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DelegationRolePresetResponse' } }
        '403': { description: ROLE_OPERATOR or ROLE_ADMIN is required }
    post:
      tags: [Delegation role presets]
      summary: Create a delegation role preset
      description: >-
        Idempotent on the natural key (name, resourceType): a retried create replays the original
        preset — no duplicate catalog row (ADR-0292).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRolePresetRequest' }
      responses:
        '201': { description: Preset created }
        '400': { description: Invalid capability/resource combination }
        '403': { description: ROLE_ADMIN is required }
  /api/v1/delegation-role-presets/{id}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    put:
      tags: [Delegation role presets]
      summary: Replace a delegation role preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRolePresetRequest' }
      responses:
        '200': { description: Preset updated }
        '404': { description: Preset not found }
    delete:
      tags: [Delegation role presets]
      summary: Delete a delegation role preset
      responses:
        '204': { description: Preset deleted }
        '404': { description: Preset not found }
  /api/v1/delegations:
    post:
      tags: [Delegations]
      summary: Offer a delegation grant (OFFERED); idempotent via X-Request-ID (ADR-0292)
      parameters:
        - name: X-Request-ID
          in: header
          schema: { type: string }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/CustomerActorPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferDelegationRequest' }
      responses:
        '201':
          description: Grant offered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '400':
          description: |
            Validation or SCA failure. Machine-readable `code`:

            * `CUMULATIVE_LIMIT_UNSUPPORTED` — dailyLimit/monthlyLimit on a grant with no
              money-moving capability, where nothing would ever reserve against them.
            * `SPEND_WITHOUT_CEILING` — ACCOUNT_INITIATE_PAYMENT with neither dailyLimit nor
              monthlyLimit (ADR-0249 D5). Unlimited access to someone else's account is not
              something this platform grants by omission.
            * `APPROVAL_POLICY_UNSUPPORTED` — approvalPolicy other than SOLO; nothing counts approvals.

            All are refused before the SCA challenge is spent, so the customer keeps their ceremony.
        '403': { description: The authenticated party is not the grantor, or the actor has no active authority for it }
        '422': { description: Eligibility gate, or the grantor does not own the resource (ADR-0232 D5, threat model T1) }
        '503': { description: Grantor authority could not be verified; retry is safe because SCA was not consumed }
  /api/v1/delegations/preview:
    post:
      tags: [Delegations]
      summary: Validate a complete delegation draft before starting SCA
      description: >-
        Runs the same caller, constraint, resource-ownership and party-eligibility gates as offer,
        but does not read or consume an SCA challenge, persist a grant, or emit an event. A later
        offer repeats every check; this response is never authorization and must not be cached as
        one. Counterparty names are deliberately not returned, so this endpoint is not a party
        directory.
      parameters:
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/CustomerActorPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewDelegationRequest' }
      responses:
        '200':
          description: The exact draft is currently eligible to proceed to SCA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPreviewResponse' }
        '400': { description: Unsupported or inconsistent constraints }
        '403': { description: The authenticated party is not the grantor, or the actor has no active authority for it }
        '422': { description: Eligibility gate, or resource ownership could not be established }
        '503': { description: Grantor authority could not be verified; the draft was not authorized or cached }
  /api/v1/delegations/{id}:
    get:
      tags: [Delegations]
      summary: Get delegation grant by ID
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '404': { description: Not found, or the caller is not a party to this grant }
    delete:
      tags: [Delegations]
      summary: Revoke a grant (grantor or bank)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: revokedBy
          in: query
          required: false
          deprecated: true
          description: |
            Honoured ONLY for a bank-initiated revoke (operator/admin session, no
            X-Customer-Party-Id). On a customer-scoped call the acting party is taken from
            X-Customer-Party-Id and this parameter is ignored.

            It used to be required and trusted: it both authorised the revoke and became the
            audit field `closedBy`, so any authenticated caller could revoke anyone's grant and
            sign it with someone else's party id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeDelegationRequest' }
      responses:
        '200':
          description: Grant revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: Not the grantor, and not a bank-initiated revoke }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/grantor/{partyId}:
    get:
      tags: [Delegations]
      summary: List grants offered BY a party (Shared by me)
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party may only list its own grants }
  /api/v1/delegations/grantee/{partyId}:
    get:
      tags: [Delegations]
      summary: List grants offered TO a party (Shared with me)
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party may only list its own grants }
  /api/v1/delegations/{id}/accept:
    post:
      tags: [Delegations]
      summary: Accept an OFFERED grant after the grantee's SCA completes
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - name: granteePartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: scaSessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grant activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party is not the grantee }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/decline:
    post:
      tags: [Delegations]
      summary: Decline an OFFERED grant (grantee)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - name: granteePartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grant declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party is not the grantee }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/renounce:
    post:
      tags: [Delegations]
      summary: Renounce an ACTIVE grant (grantee)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - name: granteePartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grant renounced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party is not the grantee }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/suspend:
    post:
      tags: [Delegations]
      summary: Suspend an ACTIVE grant (bank / fraud-AML signal)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendDelegationRequest' }
      responses:
        '200':
          description: Grant suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: Bank-initiated only — requires an operator/admin session and no X-Customer-Party-Id }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/reinstate:
    post:
      tags: [Delegations]
      summary: Reinstate a SUSPENDED grant
      parameters:
        - $ref: '#/components/parameters/DelegationId'
      responses:
        '200':
          description: Grant reinstated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: Bank-initiated only — requires an operator/admin session and no X-Customer-Party-Id }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/approvals:
    get:
      tags: [Delegation lifecycle approvals]
      summary: List durable bank-side lifecycle approval evidence
      description: Read-only operator view; it never decides or executes a proposal.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [PROPOSED, REJECTED, EXECUTED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Lifecycle approvals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' } }
        '403': { description: A human ROLE_OPERATOR or ROLE_ADMIN session is required }
    post:
      tags: [Delegation lifecycle approvals]
      summary: Propose a bank-side lifecycle action
      description: >-
        Dark-launched and unreachable unless the mutation setting is explicitly enabled. The
        admin portal has no mutation route and approval execution remains fail-closed.
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeDelegationLifecycleRequest' }
      responses:
        '201':
          description: Proposal created, or the identical X-Request-ID replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' }
        '404': { description: Mutation capability is disabled, or the delegation does not exist }
        '409': { description: Request key reused for different content, or transition cannot start }
  /api/v1/delegations/approvals/{approvalId}:
    get:
      tags: [Delegation lifecycle approvals]
      summary: Get immutable lifecycle approval evidence
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: Immutable proposal, decision and execution evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' }
        '403': { description: A human ROLE_OPERATOR or ROLE_ADMIN session is required }
        '404': { description: Approval not found }
  /api/v1/delegations/approvals/{approvalId}/decision:
    post:
      tags: [Delegation lifecycle approvals]
      summary: Decide and atomically execute a lifecycle proposal (default-off)
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideDelegationLifecycleRequest' }
      responses:
        '200':
          description: Executed or rejected proposal evidence, or an idempotent terminal replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' }
        '403': { description: Self-decision, non-human principal, or missing operator role }
        '404': { description: Mutation capability is disabled, or approval not found }
        '409': { description: Approval execution unavailable, or conflicting terminal decision — a stale proposal predating the revision-safe lifecycle seam, a grant revision changed since proposal, or an illegal lifecycle transition }
  /api/v1/delegations/check:
    post:
      tags: [Delegations]
      summary: Whether an active grant covers a capability on a resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckDelegationRequest' }
      responses:
        '200':
          description: Decision (never the grant itself)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationCheckResponse' }
  /api/v1/delegations/{id}/reservations:
    post:
      tags: [Delegations]
      summary: Reserve headroom under the grant's per-transaction, daily and monthly ceilings
      description: |
        ADR-0249 D3 — the authoritative cumulative-spend counter. The caller reserves BEFORE
        initiating the payment, confirms on a settled outcome and releases on failure. A RESERVED
        reservation already consumes headroom; that is the point, and it is why two concurrent
        payments cannot both pass a check that neither passes alone.

        A retry under the same `idempotencyKey` and immutable amount/currency/operation tuple
        returns the same reservation. A different tuple is refused. `operationType` defaults to
        `UNSPECIFIED`; `DOMESTIC_PAYMENT` opts into the durable state stream and remains disabled
        until its downstream binding consumer is ready.
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveSpendRequest' }
      responses:
        '201':
          description: Headroom reserved (or an existing reservation replayed under the same key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReservationResponse' }
        '404': { description: No such delegation, or the caller is not its grantee }
        '400': { description: Malformed request, including an idempotency key above its rail limit }
        '409':
          description: >-
            Refused by a ceiling, or the idempotency key names a different immutable tuple.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendRefusalResponse' }
            application/problem+json:
              schema: { $ref: '#/components/schemas/SpendIdempotencyConflictResponse' }
        '503':
          description: Domestic reservation admission is disabled; no reservation was created.
  /api/v1/delegations/{id}/reservations/{rid}/confirm:
    post:
      tags: [Delegations]
      summary: Confirm a reservation — the money moved, the headroom stays consumed
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Confirmed (idempotent on an already-confirmed reservation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReservationResponse' }
        '404': { description: No such reservation on this delegation }
        '409': { description: The reservation was released and cannot be confirmed }
  /api/v1/delegations/{id}/reservations/{rid}/release:
    post:
      tags: [Delegations]
      summary: Release a reservation — the payment did not happen, the headroom comes back
      description: >-
        Must be called on every failure branch. A leaked reservation silently shrinks the
        delegate's ceiling, which is why release is tested alongside confirm rather than after it.
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Released (idempotent on an already-released reservation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReservationResponse' }
        '404': { description: No such reservation on this delegation }
        '409':
          description: >-
            The reservation was confirmed. Releasing settled money would re-open a ceiling the
            delegate has already spent through.
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated effect key, scoped to this operation and credential. Only a
        domain-separated SHA-256 digest is retained. A repeat never replays secret-bearing output;
        it fails closed without applying the effect again. Use a new key only for a deliberate
        credential rotation or a genuinely new permitted view.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerPartyId:
      name: X-Customer-Party-Id
      in: header
      required: false
      description: |
        The party the customer channel authenticated, stamped by customer-edge on every
        customer-scoped call (the fleet's IDOR-guard convention). When present, the service
        refuses any operation whose claimed party differs from it — a party id in a body or
        query string is a claim by the caller, this header is not.

        Absent on an operator/back-office call, which is gated by role and OPA instead.
      schema: { type: string, format: uuid }
    CustomerActorPartyId:
      name: X-Customer-Actor-Party-Id
      in: header
      required: false
      description: |
        The natural person authenticated by customer-edge. Required together with
        X-Customer-Party-Id on customer preview/offer and approval-group mutation calls. It equals the principal for an
        individual profile; for an organization profile it differs and the service verifies the
        actor's active PartyMandate before accepting the request. Never supplied by the app.
      schema: { type: string, format: uuid }
    DelegationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      name: rid
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ApprovalGroupScaReferenceRequest:
      type: object
      required: [name, members, threshold]
      properties:
        groupId: { type: string, format: uuid, description: Present only for revision }
        expectedRevision: { type: integer, format: int64, minimum: 1, description: Required with groupId }
        name: { type: string, minLength: 1, maxLength: 120 }
        members:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        threshold: { type: integer, minimum: 1 }
    ApprovalGroupScaReferenceResponse:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          pattern: '^approval-group:v1:[0-9a-f]{64}$'
          description: Pass as dynamicLinkingData.reference when initiating the SCA challenge.
    ApprovalGroupWriteRequest:
      type: object
      required: [name, members, threshold, scaSessionId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        members:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        threshold: { type: integer, minimum: 1 }
        scaSessionId: { type: string, format: uuid }
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          description: Required on PUT; prevents a stale client from overwriting a newer roster.
    ApprovalGroupResponse:
      type: object
      required: [id, ownerPartyId, name, members, threshold, revision, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerPartyId: { type: string, format: uuid }
        name: { type: string }
        members: { type: array, items: { type: string, format: uuid } }
        threshold: { type: integer }
        revision: { type: integer, format: int64 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DelegationRolePresetRequest:
      type: object
      required: [name, resourceType, capabilities]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    DelegationRolePresetResponse:
      allOf:
        - $ref: '#/components/schemas/DelegationRolePresetRequest'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MoneyDto:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ExposureDto:
      type: object
      properties:
        redactionRules: { type: array, items: { type: string } }
        maxViews: { type: integer }
        watermark: { type: boolean }
        allowDownload: { type: boolean }
    OfferDelegationRequest:
      type: object
      required: [grantorPartyId, granteePartyId, resourceType, resourceId, capabilities, grantScaSessionId]
      properties:
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        resourceId: { type: string, format: uuid }
        capabilities:
          type: array
          items:
            type: string
            enum: [ACCOUNT_VIEW_DETAILS, ACCOUNT_READ_BALANCES, ACCOUNT_READ_TRANSACTIONS,
                   ACCOUNT_DOWNLOAD_STATEMENTS, ACCOUNT_INITIATE_PAYMENT, ACCOUNT_PROPOSE_PAYMENT,
                   ACCOUNT_MANAGE_BENEFICIARIES, ACCOUNT_MANAGE_LIMITS, CARD_VIEW,
                   CARD_VIEW_TRANSACTIONS, CARD_MANAGE_LIMITS, CARD_MANAGE_STATUS, CARD_MANAGE_CHANNELS, SAVINGS_DEPOSIT,
                   SAVINGS_WITHDRAW, SAVINGS_PROPOSE_WITHDRAW, OBJECT_READ, DELEGATION_MANAGE]
        approvalPolicy:
          type: string
          enum: [SOLO, ANY_ONE, ALL, N_OF_M]
          default: SOLO
          description: >-
            SOLO is universal. N_OF_M is enforced only for a SAVINGS_GOAL grant containing exactly
            SAVINGS_PROPOSE_WITHDRAW; ANY_ONE and ALL remain unsupported and fail closed.
          x-unsupported-values: [ANY_ONE, ALL]
        requiredApprovals:
          type: integer
          deprecated: true
          description: >-
            Compatibility input only. For N_OF_M the server derives the threshold from
            approvalGroupId and rejects a supplied mismatch.
        approvalGroupId:
          type: string
          format: uuid
          description: Required for N_OF_M; the server pins its current active revision and threshold.
        perTransactionLimit:
          $ref: '#/components/schemas/MoneyDto'
          description: >-
            Per-amount ceiling. It never accumulates — it caps each payment and says nothing about
            how many there may be, which is why it does NOT satisfy the ADR-0249 D5 requirement
            that ACCOUNT_INITIATE_PAYMENT carry a cumulative ceiling.
        dailyLimit:
          $ref: '#/components/schemas/MoneyDto'
          description: |
            Cumulative ceiling per calendar day, counted authoritatively by the reservation API
            (ADR-0249 D3). Enforced from version 1.4.0; before that the field was rejected because
            nothing counted it.

            The day is a **Europe/Prague** calendar day, not a UTC one — a customer's "5 000 Kč per
            day" is their own day, and a UTC counter would roll over at 01:00/02:00 local and hand
            the delegate a second full ceiling.

            Rejected with 400 CUMULATIVE_LIMIT_UNSUPPORTED on a grant with no money-moving
            capability: nothing would ever reserve against it.
        monthlyLimit:
          $ref: '#/components/schemas/MoneyDto'
          description: >-
            As dailyLimit, over the Europe/Prague calendar month.
        exposure: { $ref: '#/components/schemas/ExposureDto' }
        validTo: { type: string, format: date-time }
        grantScaSessionId: { type: string, format: uuid }
        note: { type: string }
    PreviewDelegationRequest:
      type: object
      required: [grantorPartyId, granteePartyId, resourceType, resourceId, capabilities]
      description: The offer draft without grantScaSessionId; preview never reads or consumes SCA.
      properties:
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        resourceId: { type: string, format: uuid }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ACCOUNT_VIEW_DETAILS, ACCOUNT_READ_BALANCES, ACCOUNT_READ_TRANSACTIONS,
                   ACCOUNT_DOWNLOAD_STATEMENTS, ACCOUNT_INITIATE_PAYMENT, ACCOUNT_PROPOSE_PAYMENT,
                   ACCOUNT_MANAGE_BENEFICIARIES, ACCOUNT_MANAGE_LIMITS, CARD_VIEW,
                   CARD_VIEW_TRANSACTIONS, CARD_MANAGE_LIMITS, CARD_MANAGE_STATUS, CARD_MANAGE_CHANNELS,
                   SAVINGS_DEPOSIT, SAVINGS_WITHDRAW, SAVINGS_PROPOSE_WITHDRAW, OBJECT_READ, DELEGATION_MANAGE]
        approvalPolicy: { type: string, enum: [SOLO, ANY_ONE, ALL, N_OF_M], default: SOLO }
        requiredApprovals: { type: integer, deprecated: true }
        approvalGroupId: { type: string, format: uuid }
        perTransactionLimit: { $ref: '#/components/schemas/MoneyDto' }
        dailyLimit: { $ref: '#/components/schemas/MoneyDto' }
        monthlyLimit: { $ref: '#/components/schemas/MoneyDto' }
        exposure: { $ref: '#/components/schemas/ExposureDto' }
        validTo: { type: string, format: date-time }
    DelegationPreviewResponse:
      type: object
      required: [valid, scaReference]
      properties:
        valid: { type: boolean, const: true }
        scaReference:
          type: string
          description: >-
            Canonical fingerprint of the validated draft. Pass it as dynamicLinkingData.reference
            when creating the DELEGATION_GRANT SCA challenge; offer recomputes and consumes it.
        approvalGroupId: { type: string, format: uuid, nullable: true }
        approvalGroupRevision: { type: integer, format: int64, minimum: 1, nullable: true }
        requiredApprovals: { type: integer, minimum: 2, nullable: true }
    RevokeDelegationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    ProposeDelegationLifecycleRequest:
      type: object
      required: [delegationId, operation, reason]
      properties:
        delegationId: { type: string, format: uuid }
        operation: { type: string, enum: [SUSPEND, REINSTATE, REVOKE] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    DecideDelegationLifecycleRequest:
      type: object
      required: [approve, reason]
      properties:
        approve: { type: boolean }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Mandatory checker rationale retained as immutable decision evidence.
    DelegationLifecycleApprovalResponse:
      type: object
      required: [id, delegationId, operation, requestedReason, state, proposedBy, proposedAt]
      properties:
        id: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        operation: { type: string, enum: [SUSPEND, REINSTATE, REVOKE] }
        requestedReason: { type: string }
        state:
          type: string
          enum: [PROPOSED, REJECTED, EXECUTED]
          description: EXECUTED means the revision-matched lifecycle transition and its outbox event committed atomically.
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        expectedLifecycleRevision:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Grant lifecycle revision inspected by the maker. Null legacy evidence is readable but cannot execute.
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        executedAt: { type: [string, 'null'], format: date-time }
    SuspendDelegationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    CheckDelegationRequest:
      type: object
      required: [granteePartyId, resourceType, resourceId, capability]
      properties:
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        resourceId: { type: string, format: uuid }
        capability: { type: string }
        amount: { $ref: '#/components/schemas/MoneyDto' }
    DelegationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        grantorName:
          type: string
          description: |
            Counterparty display name snapshotted onto the grant at offer time (issue #3604),
            from the pid-service eligibility lookup this service already performs. It is what was
            true when the grant was made, not a live value — an authorisation record must not be
            silently rewritten by a later rename.

            Null on grants offered before this field existed, and when pid-service returns no
            usable name. Clients fall back to the party id; they must not render a blank, which
            on a consent screen reads as a name that failed to load.

            Only ever returned to a party of the grant (the read paths are party-scoped) or to
            role-gated bank staff. This is not a party-name lookup.
        granteeName:
          type: string
          description: As grantorName, for the party receiving the grant.
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        capabilities: { type: array, items: { type: string } }
        approvalPolicy: { type: string }
        requiredApprovals: { type: integer }
        perTransactionLimit: { $ref: '#/components/schemas/MoneyDto' }
        dailyLimit:
          $ref: '#/components/schemas/MoneyDto'
          deprecated: true
          description: >-
            Always null on grants offered after this API version — the field is refused on write.
            A non-null value belongs to a grant stored before that and is NOT enforced: it is a
            number on a record, not a cap on the delegate. Do not render it as a limit.
        monthlyLimit:
          $ref: '#/components/schemas/MoneyDto'
          deprecated: true
          description: >-
            See dailyLimit. Not enforced; do not render it as a limit.
        exposure: { $ref: '#/components/schemas/ExposureDto' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        status:
          type: string
          enum: [OFFERED, ACTIVE, SUSPENDED, REVOKED, DECLINED, EXPIRED, RENOUNCED]
        note: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        closedReason: { type: string }
    DelegationCheckResponse:
      type: object
      properties:
        granted: { type: boolean }
        reason: { type: string }
        code: { type: string }
    DisclosureResponse:
      type: object
      required: [id, requestId, delegationId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        status: { type: string, enum: [REQUESTED, READY, REJECTED] }
        snapshotId: { type: [string, 'null'], format: uuid }
        sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: [integer, 'null'], format: int64, minimum: 1 }
        rejectionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IssueDisclosureRedemptionRequest:
      type: object
      required: [recipient, expiresAt, maxViews]
      properties:
        recipient: { type: string, format: email, maxLength: 255 }
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future and no more than seven days from issuance.
        maxViews: { type: integer, minimum: 1, maximum: 10 }
    IssueDisclosureRedemptionResponse:
      type: object
      required: [redemptionId, magicToken, expiresAt, maxViews]
      properties:
        redemptionId: { type: string, format: uuid }
        magicToken:
          type: string
          minLength: 43
          maxLength: 43
          description: Show once and deliver over a channel separate from the OTP email.
        expiresAt: { type: string, format: date-time }
        maxViews: { type: integer, minimum: 1, maximum: 10 }
    VerifyDisclosureRedemptionRequest:
      type: object
      required: [magicToken, otp]
      properties:
        magicToken: { type: string, minLength: 43, maxLength: 43 }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    VerifyDisclosureRedemptionResponse:
      type: object
      required: [accessTicket]
      properties:
        accessTicket: { type: string, minLength: 43, maxLength: 43 }
    DownloadDisclosureRequest:
      type: object
      required: [accessTicket]
      properties:
        accessTicket: { type: string, minLength: 43, maxLength: 43 }
    ReserveSpendRequest:
      type: object
      required: [amount, currency, idempotencyKey]
      properties:
        amount:
          type: string
          description: Decimal amount in major units, scaled to the currency's minor unit. Never a float.
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey:
          type: string
          maxLength: 200
          description: >-
            The caller's key for this spend, unique per delegation. Enforced by a database
            constraint, so a replay cannot double-count even across replicas.
        operationType:
          type: string
          enum: [UNSPECIFIED, DOMESTIC_PAYMENT]
          default: UNSPECIFIED
          description: Reconciliation rail; it is not workload authentication.
    SpendReservationResponse:
      type: object
      required: [reservationId, delegationId, amount, operationType, state, createdAt]
      properties:
        reservationId: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/MoneyDto' }
        operationType:
          type: string
          enum: [UNSPECIFIED, DOMESTIC_PAYMENT]
        state:
          type: string
          enum: [RESERVED, CONFIRMED, RELEASED]
          description: RESERVED and CONFIRMED consume headroom; RELEASED gives it back.
        createdAt:
          type: string
          format: date-time
          description: The window anchor — a reservation belongs to the day it took the headroom.
        settledAt: { type: string, format: date-time, nullable: true }
    SpendRefusalResponse:
      type: object
      required: [status, reason, error]
      properties:
        status: { type: integer }
        reason:
          type: string
          enum: [PER_TX, DAILY, MONTHLY, GRANT_NOT_ACTIVE, NO_SPEND_CAPABILITY, CURRENCY_MISMATCH]
        ceiling: { $ref: '#/components/schemas/MoneyDto' }
        alreadyCounted: { $ref: '#/components/schemas/MoneyDto' }
        remaining:
          $ref: '#/components/schemas/MoneyDto'
          description: What is still spendable under the breached ceiling, clamped at zero.
        error: { type: string }
    SpendIdempotencyConflictResponse:
      type: object
      required: [type, title, status, detail, code, error]
      properties:
        type: { type: string, enum: ['urn:openbank:error:idempotency-key-reused'] }
        title: { type: string, enum: [Idempotency key reused] }
        status: { type: integer, enum: [409] }
        detail: { type: string }
        code: { type: string, enum: [IDEMPOTENCY_KEY_REUSED] }
        error: { type: string }
