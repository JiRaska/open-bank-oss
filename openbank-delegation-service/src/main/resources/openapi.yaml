openapi: 3.1.0
info:
  title: OpenBank Delegation Service API
  description: |
    Customer-to-party delegated access (ADR-0232): granular, SCA-bound grants over
    products (accounts, savings goals, cards) and single objects (payment, statement,
    document). Lifecycle: OFFERED → ACTIVE → SUSPENDED/REVOKED/EXPIRED/RENOUNCED/DECLINED.
  # Additive ADR-0312 business-signing routes (entity signing policy, trusted payees, approvals).
  version: 1.20.0
servers:
  - url: http://localhost:8126
tags:
  - name: Delegations
  - name: Delegation portfolios
  - name: Delegation role presets
  - name: Delegation lifecycle approvals
  - name: Business signing
paths:
  /api/v1/delegation-portfolios:
    post:
      tags: [Delegation portfolios]
      summary: Create a named account portfolio for the active profile
      description: >-
        A durable account scope owned by the active profile. It is not a grant and never authorizes
        payment or co-signing by itself; for a business profile customer-edge resolves the current
        mandate before forwarding X-Customer-Party-Id, and this route requires it to equal ownerPartyId.
      parameters:
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationPortfolioRequest' }
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPortfolioResponse' }
        '400': { description: Missing idempotency key, name, or account scope }
        '403': { description: Authenticated active profile does not equal ownerPartyId }
        '422': { description: An account is not owned by the active profile }
        '503':
          description: Authoritative account ownership cannot currently be established; safe to retry
          headers:
            Retry-After: { schema: { type: integer } }
  /api/v1/delegation-portfolios/owner/{ownerPartyId}:
    get:
      tags: [Delegation portfolios]
      summary: List portfolios of the active profile
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Portfolios ordered by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DelegationPortfolioResponse' } }
        '403': { description: Authenticated active profile does not equal ownerPartyId }
  /api/v1/delegation-portfolios/{id}:
    get:
      tags: [Delegation portfolios]
      summary: Read a portfolio of the active profile
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPortfolioResponse' }
        '403': { description: Authenticated active profile does not own the portfolio }
        '404': { description: Portfolio not found }
  /api/v1/delegation-role-presets:
    get:
      tags: [Delegation role presets]
      summary: List reusable delegation role presets
      responses:
        '200':
          description: Presets ordered by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DelegationRolePresetResponse' } }
        '403': { description: ROLE_OPERATOR or ROLE_ADMIN is required }
    post:
      tags: [Delegation role presets]
      summary: Create a delegation role preset
      description: >-
        Idempotent on the natural key (name, resourceType): a retried create replays the original
        preset — no duplicate catalog row (ADR-0292).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRolePresetRequest' }
      responses:
        '201': { description: Preset created }
        '400': { description: Invalid capability/resource combination }
        '403': { description: ROLE_ADMIN is required }
  /api/v1/delegation-role-presets/{id}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    put:
      tags: [Delegation role presets]
      summary: Replace a delegation role preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRolePresetRequest' }
      responses:
        '200': { description: Preset updated }
        '404': { description: Preset not found }
    delete:
      tags: [Delegation role presets]
      summary: Delete a delegation role preset
      responses:
        '204': { description: Preset deleted }
        '404': { description: Preset not found }
  /api/v1/delegations:
    post:
      tags: [Delegations]
      summary: Offer a delegation grant (OFFERED); idempotent via X-Request-ID (ADR-0292)
      parameters:
        - name: X-Request-ID
          in: header
          schema: { type: string }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/CustomerActorPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferDelegationRequest' }
      responses:
        '201':
          description: Grant offered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '400':
          description: |
            Validation or SCA failure. Machine-readable `code`:

            * `CUMULATIVE_LIMIT_UNSUPPORTED` — dailyLimit/monthlyLimit on a grant with no
              money-moving capability, where nothing would ever reserve against them.
            * `SPEND_WITHOUT_CEILING` — ACCOUNT_INITIATE_PAYMENT with neither dailyLimit nor
              monthlyLimit (ADR-0249 D5). Unlimited access to someone else's account is not
              something this platform grants by omission.
            * `APPROVAL_POLICY_UNSUPPORTED` — approvalPolicy other than SOLO; nothing counts approvals.
            * `EXPOSURE_UNSUPPORTED` — exposure is non-null. It remains readable on historical grants
              for audit, but cannot authorize a raw object download until transformed-artifact delivery
              can prove redaction, watermark and view-count enforcement.

            All are refused before the SCA challenge is spent, so the customer keeps their ceremony.
        '403': { description: The authenticated party is not the grantor, or the actor has no active authority for it }
        '422': { description: Eligibility gate, or the grantor does not own the resource (ADR-0232 D5, threat model T1) }
        '503': { description: Grantor authority could not be verified; retry is safe because SCA was not consumed }
  /api/v1/delegations/preview:
    post:
      tags: [Delegations]
      summary: Validate a complete delegation draft before starting SCA
      description: >-
        Runs the same caller, constraint, resource-ownership and party-eligibility gates as offer,
        but does not read or consume an SCA challenge, persist a grant, or emit an event. A later
        offer repeats every check; this response is never authorization and must not be cached as
        one. Counterparty names are deliberately not returned, so this endpoint is not a party
        directory.
      parameters:
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/CustomerActorPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewDelegationRequest' }
      responses:
        '200':
          description: The exact draft is currently eligible to proceed to SCA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPreviewResponse' }
        '400': { description: Unsupported or inconsistent constraints, including non-null exposure (EXPOSURE_UNSUPPORTED) }
        '403': { description: The authenticated party is not the grantor, or the actor has no active authority for it }
        '422': { description: Eligibility gate, or resource ownership could not be established }
        '503': { description: Grantor authority could not be verified; the draft was not authorized or cached }
  /api/v1/delegations/recertifications/grantor/{partyId}:
    get:
      tags: [Delegations]
      summary: List overdue delegation recertification tasks for the issuing party
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Pending review tasks; overdue does not suspend any delegation
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DelegationRecertificationResponse' } }
        '403': { description: Caller is not the issuing party }
  /api/v1/delegations/recertifications/{id}/confirm:
    post:
      tags: [Delegations]
      summary: Confirm an explicit review of the current active delegation revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: grantorPartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Review evidence saved; no capability or lifecycle state changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationRecertificationResponse' }
        '400': { description: Missing grantorPartyId or Idempotency-Key }
        '403': { description: Caller is not the issuing party }
        '404': { description: Unknown task }
        '409': { description: Task was already confirmed or the grant lifecycle changed }
  /api/v1/delegations/{id}:
    get:
      tags: [Delegations]
      summary: Get delegation grant by ID
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '404': { description: Not found, or the caller is not a party to this grant }
    delete:
      tags: [Delegations]
      summary: Revoke a grant (grantor or bank)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: revokedBy
          in: query
          required: false
          deprecated: true
          description: |
            Honoured ONLY for a bank-initiated revoke (operator/admin session, no
            X-Customer-Party-Id). On a customer-scoped call the acting party is taken from
            X-Customer-Party-Id and this parameter is ignored.

            It used to be required and trusted: it both authorised the revoke and became the
            audit field `closedBy`, so any authenticated caller could revoke anyone's grant and
            sign it with someone else's party id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeDelegationRequest' }
      responses:
        '200':
          description: Grant revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: Not the grantor, and not a bank-initiated revoke }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/grantor/{partyId}:
    get:
      tags: [Delegations]
      summary: List grants offered BY a party (Shared by me)
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party may only list its own grants }
  /api/v1/delegations/grantee/{partyId}:
    get:
      tags: [Delegations]
      summary: List grants offered TO a party (Shared with me)
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party may only list its own grants }
  /api/v1/delegations/{id}/accept:
    post:
      tags: [Delegations]
      summary: Accept an OFFERED grant after the grantee's SCA completes
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - name: granteePartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: scaSessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grant activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '400': { description: SCA invalid or expired, or EXPOSURE_UNSUPPORTED for a historical exposure grant }
        '403': { description: The authenticated party is not the grantee }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/decline:
    post:
      tags: [Delegations]
      summary: Decline an OFFERED grant (grantee)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - name: granteePartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grant declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party is not the grantee }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/renounce:
    post:
      tags: [Delegations]
      summary: Renounce an ACTIVE grant (grantee)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - name: granteePartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Grant renounced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: The authenticated party is not the grantee }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/suspend:
    post:
      tags: [Delegations]
      summary: Suspend an ACTIVE grant (bank / fraud-AML signal)
      parameters:
        - $ref: '#/components/parameters/DelegationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendDelegationRequest' }
      responses:
        '200':
          description: Grant suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: Bank-initiated only — requires an operator/admin session and no X-Customer-Party-Id }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/{id}/reinstate:
    post:
      tags: [Delegations]
      summary: Reinstate a SUSPENDED grant
      parameters:
        - $ref: '#/components/parameters/DelegationId'
      responses:
        '400': { description: EXPOSURE_UNSUPPORTED for a historical exposure grant }
        '200':
          description: Grant reinstated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationResponse' }
        '403': { description: Bank-initiated only — requires an operator/admin session and no X-Customer-Party-Id }
        '409': { description: A concurrent lifecycle transition won; reload the grant before retrying }
  /api/v1/delegations/approvals:
    get:
      tags: [Delegation lifecycle approvals]
      summary: List durable bank-side lifecycle approval evidence
      description: Read-only operator view; it never decides or executes a proposal.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [PROPOSED, REJECTED, EXECUTED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Lifecycle approvals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' } }
        '403': { description: A human ROLE_OPERATOR or ROLE_ADMIN session is required }
    post:
      tags: [Delegation lifecycle approvals]
      summary: Propose a bank-side lifecycle action
      description: >-
        Dark-launched and unreachable unless the mutation setting is explicitly enabled. The
        admin portal has no mutation route and approval execution remains fail-closed.
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeDelegationLifecycleRequest' }
      responses:
        '201':
          description: Proposal created, or the identical X-Request-ID replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' }
        '404': { description: Mutation capability is disabled, or the delegation does not exist }
        '409': { description: Request key reused for different content, or transition cannot start }
  /api/v1/delegations/approvals/{approvalId}:
    get:
      tags: [Delegation lifecycle approvals]
      summary: Get immutable lifecycle approval evidence
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: Immutable proposal, decision and execution evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' }
        '403': { description: A human ROLE_OPERATOR or ROLE_ADMIN session is required }
        '404': { description: Approval not found }
  /api/v1/delegations/approvals/{approvalId}/decision:
    post:
      tags: [Delegation lifecycle approvals]
      summary: Decide and atomically execute a lifecycle proposal (default-off)
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideDelegationLifecycleRequest' }
      responses:
        '200':
          description: Executed or rejected proposal evidence, or an idempotent terminal replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationLifecycleApprovalResponse' }
        '403': { description: Self-decision, non-human principal, or missing operator role }
        '404': { description: Mutation capability is disabled, or approval not found }
        '409': { description: Approval execution unavailable, or conflicting terminal decision — a stale proposal predating the revision-safe lifecycle seam, a grant revision changed since proposal, or an illegal lifecycle transition }
  /api/v1/delegations/check:
    post:
      tags: [Delegations]
      summary: Whether an active grant covers a capability on a resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckDelegationRequest' }
      responses:
        '200':
          description: Decision (never the grant itself)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationCheckResponse' }
  /api/v1/delegations/{id}/reservations:
    post:
      tags: [Delegations]
      summary: Reserve headroom under the grant's per-transaction, daily and monthly ceilings
      description: |
        ADR-0249 D3 — the authoritative cumulative-spend counter. The caller reserves BEFORE
        initiating the payment, confirms on a settled outcome and releases on failure. A RESERVED
        reservation already consumes headroom; that is the point, and it is why two concurrent
        payments cannot both pass a check that neither passes alone.

        A retry under the same `idempotencyKey` and immutable amount/currency/operation tuple
        returns the same reservation. A different tuple is refused. `operationType` defaults to
        `UNSPECIFIED`; `DOMESTIC_PAYMENT` opts into the durable state stream and remains disabled
        until its downstream binding consumer is ready.
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveSpendRequest' }
      responses:
        '201':
          description: Headroom reserved (or an existing reservation replayed under the same key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReservationResponse' }
        '404': { description: No such delegation, or the caller is not its grantee }
        '400': { description: Malformed request, including an idempotency key above its rail limit }
        '409':
          description: >-
            Refused by a ceiling, or the idempotency key names a different immutable tuple.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendRefusalResponse' }
            application/problem+json:
              schema: { $ref: '#/components/schemas/SpendIdempotencyConflictResponse' }
        '503':
          description: Domestic reservation admission is disabled; no reservation was created.
  /api/v1/delegations/{id}/reservations/{rid}/confirm:
    post:
      tags: [Delegations]
      summary: Confirm a reservation — the money moved, the headroom stays consumed
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Confirmed (idempotent on an already-confirmed reservation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReservationResponse' }
        '404': { description: No such reservation on this delegation }
        '409': { description: The reservation was released and cannot be confirmed }
  /api/v1/delegations/{id}/reservations/{rid}/release:
    post:
      tags: [Delegations]
      summary: Release a reservation — the payment did not happen, the headroom comes back
      description: >-
        Must be called on every failure branch. A leaked reservation silently shrinks the
        delegate's ceiling, which is why release is tested alongside confirm rather than after it.
      parameters:
        - $ref: '#/components/parameters/DelegationId'
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: Released (idempotent on an already-released reservation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendReservationResponse' }
        '404': { description: No such reservation on this delegation }
        '409':
          description: >-
            The reservation was confirmed. Releasing settled money would re-open a ceiling the
            delegate has already spent through.
  # ADR-0312 business payment signing. Internal: the caller is customer-edge's service account
  # (OPA `edge-service-business-signing`). Every error body is `SigningError` with a stable `code`.
  /api/v1/entities/{entityId}/signing/evaluate:
    post:
      tags: [Business signing]
      summary: How many signatures a payment needs, and from whom
      description: >-
        Evaluates the effective policy (stored, or derived from the live register) against one
        payment. A trusted payee lowers `required` to 1 — the initiator's own SCA — unless the amount
        exceeds `trustedPayeeCap`. It is never an SCA exemption.
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigningEvaluateRequest' }
      responses:
        '200':
          description: The evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningEvaluation' }
        '400': { description: Missing or malformed field }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/signing-policy:
    get:
      tags: [Business signing]
      summary: The effective signing policy
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      responses:
        '200':
          description: Stored policy, or the register-derived default (`isDerivedFromRegister`, version 0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningPolicy' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
    put:
      tags: [Business signing]
      summary: Propose a policy change
      description: >-
        Creates a POLICY_CHANGE approval request needing the current policy's strictest round, in
        AWAITING_INITIATOR until the initiator signs it (then PENDING, co-signers notified). The
        policy changes only when that round completes; a change prepared against an older version
        is refused as SUPERSEDED.
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigningPolicyProposal' }
      responses:
        '202': { $ref: '#/components/responses/ApprovalAccepted' }
        '400': { description: Invalid rules }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '422': { $ref: '#/components/responses/SigningUnsatisfiable' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/signer-groups:
    get:
      tags: [Business signing]
      summary: Named signer groups
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      responses:
        '200':
          description: The groups
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SignerGroup' }
    post:
      tags: [Business signing]
      summary: Propose a signer-group create or edit (a POLICY_CHANGE approval request)
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignerGroupProposal' }
      responses:
        '202': { $ref: '#/components/responses/ApprovalAccepted' }
        '400': { description: Invalid group }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '422': { $ref: '#/components/responses/SigningUnsatisfiable' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/trusted-payees:
    get:
      tags: [Business signing]
      summary: ACTIVE trusted payees
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      responses:
        '200':
          description: The payees
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrustedPayee' }
    post:
      tags: [Business signing]
      summary: Propose a trusted payee (PAYEE_ADD); trusted only once the full round completes
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustedPayeeProposal' }
      responses:
        '202': { $ref: '#/components/responses/ApprovalAccepted' }
        '400': { description: Invalid IBAN or name }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '409': { $ref: '#/components/responses/SigningConflict' }
        '422': { $ref: '#/components/responses/SigningUnsatisfiable' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/trusted-payees/{payeeId}:
    delete:
      tags: [Business signing]
      summary: Propose removing a trusted payee (PAYEE_REMOVE)
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: payeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: initiatorPartyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { $ref: '#/components/responses/ApprovalAccepted' }
        '400': { description: initiatorPartyId missing }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '404': { description: No such active trusted payee }
        '422': { $ref: '#/components/responses/SigningUnsatisfiable' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/approval-requests:
    post:
      tags: [Business signing]
      summary: Hold a payment for co-signature (kind PAYMENT)
      description: >-
        `payload` is the exact rail request body (minus secrets) and is frozen: its canonical JSON
        SHA-256 is `payloadSha256`, which every co-signer's SCA is dynamically linked to. The
        initiator's SCA challenge must already be consumed by customer-edge (payment initiation,
        linked to amount/currency/creditor) and counts as the first signature.
      parameters: [ { $ref: '#/components/parameters/EntityId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentApproval' }
      responses:
        '201':
          description: Created — PENDING, or APPROVED when one signature suffices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { description: Missing or malformed field }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '422': { $ref: '#/components/responses/SigningUnsatisfiable' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
    get:
      tags: [Business signing]
      summary: Approval requests of the entity
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
        - name: signer
          in: query
          required: false
          description: Only requests this party may sign or initiated.
          schema: { type: string, format: uuid }
        - name: initiator
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Newest first, at most 200
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { description: Unknown status }
  /api/v1/entities/{entityId}/approval-requests/{approvalId}:
    get:
      tags: [Business signing]
      summary: One approval request
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '404': { description: Not found for this entity }
  /api/v1/entities/{entityId}/approval-requests/{approvalId}/signatures:
    post:
      tags: [Business signing]
      summary: Add a co-signature
      description: >-
        The signer must be eligible, hold an ACTIVE mandate right now (re-read from party-service),
        not have signed already (the initiator never counts twice) and present an SCA challenge that
        delegation-service consumes with the link `approvalRequestId + payloadSha256` (plus amount,
        currency and creditor for a payment). Reaching `required` makes the request APPROVED; an
        administrative change is applied in the same transaction.
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalSignatureRequest' }
      responses:
        '200':
          description: Signed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { description: Missing field }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '404': { description: Not found for this entity }
        '409': { $ref: '#/components/responses/SigningConflict' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/approval-requests/{approvalId}/rejection:
    post:
      tags: [Business signing]
      summary: Reject a pending request
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRejectionRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '403': { $ref: '#/components/responses/SigningForbidden' }
        '404': { description: Not found for this entity }
        '409': { $ref: '#/components/responses/SigningConflict' }
  /api/v1/entities/{entityId}/approval-requests/{approvalId}/release-claim:
    post:
      tags: [Business signing]
      summary: Single-use release claim of an APPROVED payment
      description: >-
        Atomic compare-and-set APPROVED → RELEASED. Exactly one caller receives the claim token and
        the frozen payload; every other and every later claim answers 409. Signers' mandates are
        re-checked live first — a round that no longer holds is refused (MANDATE_LAPSED). Post the
        payload to the rail with `Idempotency-Key = approvalId`, then report `release-result`.
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: This caller won the claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseClaim' }
        '404': { description: Not found for this entity }
        '409': { $ref: '#/components/responses/SigningConflict' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }
  /api/v1/entities/{entityId}/approval-requests/{approvalId}/release-result:
    post:
      tags: [Business signing]
      summary: Record the rail's answer for a claimed payment
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseResult' }
      responses:
        '200':
          description: Recorded (idempotent for the same result)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { description: releaseRef missing on ok }
        '404': { description: Not found for this entity }
        '409': { $ref: '#/components/responses/SigningConflict' }
  /api/v1/parties/{humanId}/approval-requests/pending:
    get:
      tags: [Business signing]
      summary: Everything waiting for this human's signature, across every entity they may sign for now
      parameters:
        - name: humanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Grouped by entity, oldest expiry first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingApprovals' }
        '503': { $ref: '#/components/responses/SigningUnavailable' }

components:
  parameters:
    EntityId:
      name: entityId
      in: path
      required: true
      description: The legal-entity party whose signing policy applies.
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerPartyId:
      name: X-Customer-Party-Id
      in: header
      required: false
      description: |
        The party the customer channel authenticated, stamped by customer-edge on every
        customer-scoped call (the fleet's IDOR-guard convention). When present, the service
        refuses any operation whose claimed party differs from it — a party id in a body or
        query string is a claim by the caller, this header is not.

        Absent on an operator/back-office call, which is gated by role and OPA instead.
      schema: { type: string, format: uuid }
    CustomerActorPartyId:
      name: X-Customer-Actor-Party-Id
      in: header
      required: false
      description: |
        The natural person authenticated by customer-edge. Required together with
        X-Customer-Party-Id on customer preview/offer calls. It equals the principal for an
        individual profile; for an organization profile it differs and the service verifies the
        actor's active PartyMandate before accepting the request. Never supplied by the app.
      schema: { type: string, format: uuid }
    DelegationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      name: rid
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApprovalAccepted:
      description: >-
        An approval request was created in AWAITING_INITIATOR (collected 0, 15-minute expiry);
        nothing changes until the initiator signs and the round completes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalRequest' }
    SigningForbidden:
      description: NOT_ELIGIBLE, MANDATE_NOT_ACTIVE, SCA_NOT_VERIFIED or SCA_NOT_LINKED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SigningError' }
    SigningConflict:
      description: >-
        ALREADY_SIGNED, NOT_PENDING, AWAITING_INITIATOR, EXPIRED, ALREADY_CLAIMED, NOT_APPROVED,
        MANDATE_LAPSED, PAYEE_CHANGE_PENDING, SIGNER_GROUP_CHANGE_PENDING, SCA_CHALLENGE_USED and similar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SigningError' }
    SigningUnsatisfiable:
      description: POLICY_UNSATISFIABLE — fewer distinct eligible signers than the policy needs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SigningError' }
    SigningUnavailable:
      description: party-service or sca-service could not be read; fails closed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SigningError' }
  schemas:
    DelegationPortfolioRequest:
      type: object
      required: [ownerPartyId, name, accountIds]
      properties:
        ownerPartyId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        accountIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    DelegationPortfolioResponse:
      type: object
      required: [id, ownerPartyId, name, accountIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerPartyId: { type: string, format: uuid }
        name: { type: string }
        accountIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DelegationRolePresetRequest:
      type: object
      required: [name, resourceType, capabilities]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    DelegationRolePresetResponse:
      allOf:
        - $ref: '#/components/schemas/DelegationRolePresetRequest'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MoneyDto:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ExposureDto:
      type: object
      properties:
        redactionRules: { type: array, items: { type: string } }
        maxViews: { type: integer }
        watermark: { type: boolean }
        allowDownload: { type: boolean }
    OfferDelegationRequest:
      type: object
      required: [grantorPartyId, granteePartyId, resourceType, resourceId, capabilities, grantScaSessionId]
      properties:
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        resourceId: { type: string, format: uuid }
        capabilities:
          type: array
          items:
            type: string
            enum: [ACCOUNT_VIEW_DETAILS, ACCOUNT_READ_BALANCES, ACCOUNT_READ_TRANSACTIONS,
                   ACCOUNT_DOWNLOAD_STATEMENTS, ACCOUNT_INITIATE_PAYMENT, ACCOUNT_PROPOSE_PAYMENT,
                   ACCOUNT_MANAGE_BENEFICIARIES, ACCOUNT_MANAGE_LIMITS, CARD_VIEW,
                   CARD_VIEW_TRANSACTIONS, CARD_MANAGE_LIMITS, CARD_MANAGE_STATUS, CARD_MANAGE_CHANNELS, SAVINGS_DEPOSIT,
                   SAVINGS_WITHDRAW, SAVINGS_PROPOSE_WITHDRAW, OBJECT_READ, DELEGATION_MANAGE]
        approvalPolicy:
          type: string
          enum: [SOLO, ANY_ONE, ALL, N_OF_M]
          default: SOLO
          description: >-
            Only SOLO is enforced. Any other value is rejected with 400 APPROVAL_POLICY_UNSUPPORTED:
            no service counts approvals against a grant, so a co-signing requirement set here would
            be stored and echoed while a single owner decision still releases the money. The enum
            values remain listed because ADR-0232 D8 describes them as intended; they are not built.
          x-unsupported-values: [ANY_ONE, ALL, N_OF_M]
        requiredApprovals:
          type: integer
          deprecated: true
          description: >-
            Meaningful only with approvalPolicy=N_OF_M, which is rejected. Nothing counts approvals.
        perTransactionLimit:
          $ref: '#/components/schemas/MoneyDto'
          description: >-
            Per-amount ceiling. It never accumulates — it caps each payment and says nothing about
            how many there may be, which is why it does NOT satisfy the ADR-0249 D5 requirement
            that ACCOUNT_INITIATE_PAYMENT carry a cumulative ceiling.
        dailyLimit:
          $ref: '#/components/schemas/MoneyDto'
          description: |
            Cumulative ceiling per calendar day, counted authoritatively by the reservation API
            (ADR-0249 D3). Enforced from version 1.4.0; before that the field was rejected because
            nothing counted it.

            The day is a **Europe/Prague** calendar day, not a UTC one — a customer's "5 000 Kč per
            day" is their own day, and a UTC counter would roll over at 01:00/02:00 local and hand
            the delegate a second full ceiling.

            Rejected with 400 CUMULATIVE_LIMIT_UNSUPPORTED on a grant with no money-moving
            capability: nothing would ever reserve against it.
        monthlyLimit:
          $ref: '#/components/schemas/MoneyDto'
          description: >-
            As dailyLimit, over the Europe/Prague calendar month.
        exposure:
          $ref: '#/components/schemas/ExposureDto'
          deprecated: true
          description: >-
            Non-null values are refused with 400 EXPOSURE_UNSUPPORTED. Historical values remain
            readable only for audit and do not authorize access.
        recertificationAudience:
          type: string
          enum: [PERSONAL, FOP, SME, CORPORATE]
          description: >-
            Review-only context selected by the grantor. PERSONAL and FOP are reviewed every
            12 months, SME every 6 months and CORPORATE every 3 months. It never changes a
            grant's capabilities, eligibility or enforcement. SME versus CORPORATE is explicit;
            the service does not infer company size.
        validTo: { type: string, format: date-time }
        grantScaSessionId: { type: string, format: uuid }
        note: { type: string }
    PreviewDelegationRequest:
      type: object
      required: [grantorPartyId, granteePartyId, resourceType, resourceId, capabilities]
      description: The offer draft without grantScaSessionId; preview never reads or consumes SCA.
      properties:
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        resourceId: { type: string, format: uuid }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ACCOUNT_VIEW_DETAILS, ACCOUNT_READ_BALANCES, ACCOUNT_READ_TRANSACTIONS,
                   ACCOUNT_DOWNLOAD_STATEMENTS, ACCOUNT_INITIATE_PAYMENT, ACCOUNT_PROPOSE_PAYMENT,
                   ACCOUNT_MANAGE_BENEFICIARIES, ACCOUNT_MANAGE_LIMITS, CARD_VIEW,
                   CARD_VIEW_TRANSACTIONS, CARD_MANAGE_LIMITS, CARD_MANAGE_STATUS, CARD_MANAGE_CHANNELS,
                   SAVINGS_DEPOSIT, SAVINGS_WITHDRAW, SAVINGS_PROPOSE_WITHDRAW, OBJECT_READ, DELEGATION_MANAGE]
        approvalPolicy: { type: string, enum: [SOLO, ANY_ONE, ALL, N_OF_M], default: SOLO }
        requiredApprovals: { type: integer }
        perTransactionLimit: { $ref: '#/components/schemas/MoneyDto' }
        dailyLimit: { $ref: '#/components/schemas/MoneyDto' }
        monthlyLimit: { $ref: '#/components/schemas/MoneyDto' }
        exposure:
          $ref: '#/components/schemas/ExposureDto'
          deprecated: true
          description: >-
            Non-null values are refused with 400 EXPOSURE_UNSUPPORTED. Historical values remain
            readable only for audit and do not authorize access.
        recertificationAudience:
          type: string
          enum: [PERSONAL, FOP, SME, CORPORATE]
          description: Review-only context; validated as it will be on offer, without SCA.
        validTo: { type: string, format: date-time }
    DelegationPreviewResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean, const: true }
    DelegationRecertificationResponse:
      type: object
      required: [id, delegationId, expectedLifecycleRevision, audience, sequence, dueAt, status]
      properties:
        id: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        expectedLifecycleRevision: { type: integer, format: int64, minimum: 0 }
        audience: { type: string, enum: [PERSONAL, FOP, SME, CORPORATE] }
        sequence: { type: integer, minimum: 1 }
        dueAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, CONFIRMED] }
        confirmedAt: { type: [string, 'null'], format: date-time }
    RevokeDelegationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    ProposeDelegationLifecycleRequest:
      type: object
      required: [delegationId, operation, reason]
      properties:
        delegationId: { type: string, format: uuid }
        operation: { type: string, enum: [SUSPEND, REINSTATE, REVOKE] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    DecideDelegationLifecycleRequest:
      type: object
      required: [approve, reason]
      properties:
        approve: { type: boolean }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Mandatory checker rationale retained as immutable decision evidence.
    DelegationLifecycleApprovalResponse:
      type: object
      required: [id, delegationId, operation, requestedReason, state, proposedBy, proposedAt]
      properties:
        id: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        operation: { type: string, enum: [SUSPEND, REINSTATE, REVOKE] }
        requestedReason: { type: string }
        state:
          type: string
          enum: [PROPOSED, REJECTED, EXECUTED]
          description: EXECUTED means the revision-matched lifecycle transition and its outbox event committed atomically.
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        expectedLifecycleRevision:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Grant lifecycle revision inspected by the maker. Null legacy evidence is readable but cannot execute.
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        executedAt: { type: [string, 'null'], format: date-time }
    SuspendDelegationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    CheckDelegationRequest:
      type: object
      required: [granteePartyId, resourceType, resourceId, capability]
      properties:
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT] }
        resourceId: { type: string, format: uuid }
        capability: { type: string }
        amount: { $ref: '#/components/schemas/MoneyDto' }
    DelegationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        grantorName:
          type: string
          description: |
            Counterparty display name snapshotted onto the grant at offer time (issue #3604),
            from the pid-service eligibility lookup this service already performs. It is what was
            true when the grant was made, not a live value — an authorisation record must not be
            silently rewritten by a later rename.

            Null on grants offered before this field existed, and when pid-service returns no
            usable name. Clients fall back to the party id; they must not render a blank, which
            on a consent screen reads as a name that failed to load.

            Only ever returned to a party of the grant (the read paths are party-scoped) or to
            role-gated bank staff. This is not a party-name lookup.
        granteeName:
          type: string
          description: As grantorName, for the party receiving the grant.
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        capabilities: { type: array, items: { type: string } }
        approvalPolicy: { type: string }
        requiredApprovals: { type: integer }
        perTransactionLimit: { $ref: '#/components/schemas/MoneyDto' }
        dailyLimit:
          $ref: '#/components/schemas/MoneyDto'
          deprecated: true
          description: >-
            Always null on grants offered after this API version — the field is refused on write.
            A non-null value belongs to a grant stored before that and is NOT enforced: it is a
            number on a record, not a cap on the delegate. Do not render it as a limit.
        monthlyLimit:
          $ref: '#/components/schemas/MoneyDto'
          deprecated: true
          description: >-
            See dailyLimit. Not enforced; do not render it as a limit.
        exposure:
          $ref: '#/components/schemas/ExposureDto'
          deprecated: true
          description: >-
            Historical audit metadata only. New non-null values are refused with 400
            EXPOSURE_UNSUPPORTED and never authorize access.
        recertificationAudience:
          type: string
          nullable: true
          enum: [PERSONAL, FOP, SME, CORPORATE]
          description: >-
            The grant's persisted review context. Null means a legacy grant has not been
            classified; clients must not guess or display a review cadence for it.
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        status:
          type: string
          enum: [OFFERED, ACTIVE, SUSPENDED, REVOKED, DECLINED, EXPIRED, RENOUNCED]
        note: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        closedReason: { type: string }
    DelegationCheckResponse:
      type: object
      properties:
        granted: { type: boolean }
        reason: { type: string }
        code: { type: string }
    ReserveSpendRequest:
      type: object
      required: [amount, currency, idempotencyKey]
      properties:
        amount:
          type: string
          description: Decimal amount in major units, scaled to the currency's minor unit. Never a float.
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey:
          type: string
          maxLength: 200
          description: >-
            The caller's key for this spend, unique per delegation. Enforced by a database
            constraint, so a replay cannot double-count even across replicas.
        operationType:
          type: string
          enum: [UNSPECIFIED, DOMESTIC_PAYMENT]
          default: UNSPECIFIED
          description: Reconciliation rail; it is not workload authentication.
    SpendReservationResponse:
      type: object
      required: [reservationId, delegationId, amount, operationType, state, createdAt]
      properties:
        reservationId: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/MoneyDto' }
        operationType:
          type: string
          enum: [UNSPECIFIED, DOMESTIC_PAYMENT]
        state:
          type: string
          enum: [RESERVED, CONFIRMED, RELEASED]
          description: RESERVED and CONFIRMED consume headroom; RELEASED gives it back.
        createdAt:
          type: string
          format: date-time
          description: The window anchor — a reservation belongs to the day it took the headroom.
        settledAt: { type: string, format: date-time, nullable: true }
    SpendRefusalResponse:
      type: object
      required: [status, reason, error]
      properties:
        status: { type: integer }
        reason:
          type: string
          enum: [PER_TX, DAILY, MONTHLY, GRANT_NOT_ACTIVE, NO_SPEND_CAPABILITY, CURRENCY_MISMATCH]
        ceiling: { $ref: '#/components/schemas/MoneyDto' }
        alreadyCounted: { $ref: '#/components/schemas/MoneyDto' }
        remaining:
          $ref: '#/components/schemas/MoneyDto'
          description: What is still spendable under the breached ceiling, clamped at zero.
        error: { type: string }
    SpendIdempotencyConflictResponse:
      type: object
      required: [type, title, status, detail, code, error]
      properties:
        type: { type: string, enum: ['urn:openbank:error:idempotency-key-reused'] }
        title: { type: string, enum: [Idempotency key reused] }
        status: { type: integer, enum: [409] }
        detail: { type: string }
        code: { type: string, enum: [IDEMPOTENCY_KEY_REUSED] }
        error: { type: string }
    SigningMoney:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
    SigningEvaluateRequest:
      type: object
      required: [amount, currency, creditorIban, rail]
      properties:
        amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        creditorIban: { type: string }
        rail: { type: string, description: 'DOMESTIC, SEPA, SEPA_INSTANT, SWIFT — informational' }
    SigningEvaluation:
      type: object
      required: [required, eligibleSignerIds, trusted, ruleIndex, policyVersion, isDerivedFromRegister]
      properties:
        required: { type: integer, minimum: 1 }
        eligibleSignerIds: { type: array, items: { type: string, format: uuid } }
        mustIncludeGroupId: { type: string, nullable: true }
        trusted: { type: boolean }
        ruleIndex: { type: integer }
        policyVersion: { type: integer }
        isDerivedFromRegister: { type: boolean }
    SigningRule:
      type: object
      required: [requiredSignatures]
      description: >-
        One amount band; first match in list order wins, bounds inclusive, a bound or band currency
        different from the payment's never matches. No match falls back to the strictest rule.
      properties:
        minAmount: { $ref: '#/components/schemas/SigningMoney' }
        maxAmount: { $ref: '#/components/schemas/SigningMoney' }
        currency: { type: string, nullable: true }
        requiredSignatures: { type: integer, minimum: 1, maximum: 10 }
        groupId: { type: string, nullable: true, description: Only members of this group may sign }
        mustIncludeGroupId: { type: string, nullable: true, description: At least one signer must be a member }
    SigningPolicy:
      type: object
      required: [entityPartyId, version, rules, isDerivedFromRegister]
      properties:
        entityPartyId: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        rules: { type: array, items: { $ref: '#/components/schemas/SigningRule' } }
        trustedPayeeCap: { $ref: '#/components/schemas/SigningMoney' }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedByApprovalId: { type: string, format: uuid, nullable: true }
        isDerivedFromRegister: { type: boolean }
    SigningPolicyProposal:
      type: object
      required: [initiatorPartyId, rules]
      properties:
        initiatorPartyId: { type: string, format: uuid }
        rules: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/SigningRule' } }
        trustedPayeeCap: { $ref: '#/components/schemas/SigningMoney' }
    SignerGroup:
      type: object
      required: [id, name, memberPartyIds]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        name: { type: string, maxLength: 120 }
        memberPartyIds: { type: array, items: { type: string, format: uuid } }
    SignerGroupProposal:
      type: object
      required: [initiatorPartyId, id, name, memberPartyIds]
      properties:
        initiatorPartyId: { type: string, format: uuid }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        name: { type: string, maxLength: 120 }
        memberPartyIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
    TrustedPayee:
      type: object
      required: [id, entityPartyId, iban, name, addedAt, addedByApprovalId, status]
      properties:
        id: { type: string, format: uuid }
        entityPartyId: { type: string, format: uuid }
        iban: { type: string, description: Normalised (no spaces, upper case) }
        name: { type: string }
        bic: { type: string, nullable: true }
        addedAt: { type: string, format: date-time }
        addedByApprovalId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, REMOVED] }
    TrustedPayeeProposal:
      type: object
      required: [initiatorPartyId, iban, name]
      properties:
        initiatorPartyId: { type: string, format: uuid }
        iban: { type: string }
        name: { type: string, maxLength: 140 }
        bic: { type: string, nullable: true }
    ApprovalSignatureRequest:
      type: object
      required: [partyId, scaChallengeId]
      properties:
        partyId: { type: string, format: uuid, description: The natural person signing — never the entity }
        scaChallengeId: { type: string, format: uuid }
    CreatePaymentApproval:
      type: object
      required: [initiator, payment, payload]
      properties:
        initiator: { $ref: '#/components/schemas/ApprovalSignatureRequest' }
        payment:
          type: object
          required: [amount, currency, creditorIban, rail]
          properties:
            amount: { type: number }
            currency: { type: string, minLength: 3, maxLength: 3 }
            creditorIban: { type: string }
            creditorName: { type: string, nullable: true }
            rail: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: The exact rail request body, minus secrets. Frozen.
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 259200
          description: Defaults to 72 hours, which is also the maximum.
    ApprovalRejectionRequest:
      type: object
      required: [partyId]
      properties:
        partyId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500, nullable: true }
    ReleaseClaim:
      type: object
      required: [claimToken, payload]
      properties:
        claimToken: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
    ReleaseResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        releaseRef: { type: string, maxLength: 200, nullable: true, description: Required when ok }
        error: { type: string, maxLength: 500, nullable: true }
        claimToken: { type: string, format: uuid, nullable: true, description: When sent, must equal the winning claim }
    ApprovalKind:
      type: string
      enum: [PAYMENT, PAYEE_ADD, PAYEE_REMOVE, POLICY_CHANGE]
    ApprovalStatus:
      type: string
      enum: [AWAITING_INITIATOR, PENDING, APPROVED, REJECTED, EXPIRED, RELEASED, RELEASE_FAILED]
      description: >-
        AWAITING_INITIATOR — an administrative request its initiator has not signed yet: nobody is
        notified, only the initiator may sign, and it expires silently after 15 minutes.
    ApprovalRequest:
      type: object
      required: [id, entityPartyId, kind, status, payload, payloadSha256, policyVersion, required, collected,
                 eligibleSignerIds, initiatorPartyId, signatures, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        entityPartyId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ApprovalKind' }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        payload: { type: object, additionalProperties: true, description: The frozen payload }
        payloadSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the canonical JSON payload }
        summary:
          type: object
          nullable: true
          additionalProperties: true
          description: For PAYMENT — amount, currency, creditorIban, creditorName, rail.
        policyVersion: { type: integer }
        required: { type: integer }
        collected: { type: integer }
        eligibleSignerIds: { type: array, items: { type: string, format: uuid } }
        mustIncludeGroupId: { type: string, nullable: true }
        initiatorPartyId: { type: string, format: uuid }
        signatures:
          type: array
          items:
            type: object
            required: [partyId, scaChallengeId, at]
            properties:
              partyId: { type: string, format: uuid }
              scaChallengeId: { type: string, format: uuid }
              at: { type: string, format: date-time }
        rejection:
          type: object
          nullable: true
          properties:
            partyId: { type: string, format: uuid, nullable: true, description: Null when the system refused it (SUPERSEDED) }
            reason: { type: string, nullable: true }
            at: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time, nullable: true }
        releaseRef: { type: string, nullable: true }
        releaseError: { type: string, nullable: true }
    PendingApprovals:
      type: object
      required: [humanPartyId, total, entities, items]
      properties:
        humanPartyId: { type: string, format: uuid }
        total: { type: integer }
        entities:
          type: array
          items:
            type: object
            required: [entityPartyId, count, oldestExpiresAt]
            properties:
              entityPartyId: { type: string, format: uuid }
              entityName: { type: string, nullable: true }
              count: { type: integer }
              oldestExpiresAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }
    SigningError:
      type: object
      required: [status, error, code]
      properties:
        status: { type: integer }
        error: { type: string }
        code:
          type: string
          description: >-
            Stable machine code — e.g. NOT_ELIGIBLE, MANDATE_NOT_ACTIVE, SCA_NOT_VERIFIED,
            SCA_NOT_LINKED, ALREADY_SIGNED, NOT_PENDING, EXPIRED, ALREADY_CLAIMED, NOT_APPROVED,
            MANDATE_LAPSED, POLICY_UNSATISFIABLE, PAYEE_ALREADY_TRUSTED, MANDATES_UNAVAILABLE,
            SCA_UNAVAILABLE.
