quarkus:
  application:
    name: openbank-delegation-service

  http:
    port: 8126
    # Full-suite Quarkus profiles restart the application in one test worker. A fixed default
    # test port can still be held by the preceding profile during that hand-off, so let Quarkus
    # allocate an available port and propagate it to RestAssured.
    test-port: 0
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
    limits:
      max-body-size: 10M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_delegations
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_delegations

  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  hibernate-orm:
    database:
      generation: none

  redis:
    hosts: redis://localhost:6379

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # OUTBOUND M2M. `quarkus.oidc` above validates bearers this service RECEIVES; it mints nothing.
  # Every REST client here (sca, pid, account, card-issuance) targets an @RolesAllowed endpoint,
  # so without this block the calls carry no Authorization header and 401 — surfacing as the
  # ownership gate's fail-closed "could not be established", never as an auth problem.
  # Same shape as party-service / document-service / sdd-service.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    level: INFO
    console:
      format: '%d{HH:mm:ss} %-5p [%c{3.}] %s%e%n'
      json: false

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-delegation-service

  rest-client:
    sca-service:
      url: ${SCA_SERVICE_URL:http://localhost:8110}
      connect-timeout: 2000
      read-timeout: 2000
    pid-service:
      url: ${PID_SERVICE_URL:http://localhost:8103}
      connect-timeout: 2000
      read-timeout: 2000
    # Resource-ownership gate (ADR-0232 threat model T1): the only services that can answer
    # "does this grantor own that resource?". An outage here refuses new offers — it never
    # affects an existing grant, which is enforced from each product service's own projection.
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8100}
      connect-timeout: 2000
      read-timeout: 2000
    card-issuance-service:
      url: ${CARD_ISSUANCE_SERVICE_URL:http://localhost:8118}
      connect-timeout: 2000
      read-timeout: 2000

  management:
    enabled: true
    port: 8090
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      delegation-events-out:
        connector: smallrye-kafka
        client.id: delegation-service-${quarkus.uuid}
        topic: openbank.delegation.events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
        format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"
    oidc:
      enabled: false

"%test":
  quarkus:
    datasource:
      reactive:
        url: vertx-reactive:postgresql://localhost:5433/openbank_delegations_test
    management:
      enabled: false
    oidc:
      enabled: false
    # Tests mock every REST client, so nothing needs an outbound token — and leaving this on makes
    # the test JVM try to reach a Keycloak that is not there. Same as party-service's test profile.
    oidc-client:
      enabled: false

openbank:
  delegation:
    idempotency-ttl-seconds: 86400
    # Config expression, not a literal in the annotation: DelegationExpirationSweepIT shrinks it
    # so a test can observe a REAL scheduler dispatch. A test that calls the method directly
    # cannot see the defect this sweep had — the direct call supplies the Vert.x context the
    # scheduler does not.
    expiration:
      cron: "0 7 * * * ?"
  outbox:
    dispatch-enabled: true
  rate-limit:
    enabled: true
    max-concurrent-requests: 150
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
