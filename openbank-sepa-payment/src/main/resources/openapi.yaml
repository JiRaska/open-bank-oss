openapi: 3.1.0
info:
  title: SEPA Payment Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.6 -> 1.7): additive
  # only — GET /approvals (the checker's queue, issue #5679) plus two additive fields on
  # ApprovalResponse (makerId, createdAt). No breaking change.
  version: 1.8.0
  description: >-
    SEPA credit transfer lifecycle — create, query, status transitions. On create, debtor and
    creditor names are synchronously screened against the sanctions lists (ADR-0032): a clean payment
    is returned VALIDATED, a sanctions hit is returned REJECTED (SANCTIONS_HIT) with an AML case
    opened, and a sub-threshold potential hit or a screening-service outage holds the payment in
    RECEIVED for review (fail-closed).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8115
    description: Local development
tags:
  - name: SEPA Payments

paths:
  /api/v1/sepa-payments:
    post:
      tags: [SEPA Payments]
      summary: Create a SEPA payment
      operationId: createSepaPayment
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN, ROLE_PAYMENTS]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSepaPaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SepaPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotent replay
    get:
      tags: [SEPA Payments]
      summary: List SEPA payments
      operationId: listSepaPayments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RECEIVED, VALIDATED, PROCESSING, COMPLETED, REJECTED, RETURNED, CANCELLED]
        - name: debtorAccountId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SepaPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-payments/returns:
    post:
      tags: [SEPA Payments]
      summary: Handle inbound pacs.004 payment return from clearing
      operationId: handleSepaPaymentReturn
      security:
        - bearerAuth: [ROLE_API, ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              description: ISO 20022 pacs.004.001.09 XML document
      responses:
        '200':
          description: Payment transitioned to RETURNED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SepaPaymentResponse'
        '400':
          description: Invalid pacs.004 or unknown endToEndId
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sepa-payments/{paymentId}:
    get:
      tags: [SEPA Payments]
      summary: Get SEPA payment by ID
      operationId: getSepaPayment
      security:
        - bearerAuth: [ROLE_VIEWER, ROLE_OPERATOR, ROLE_ADMIN, ROLE_PAYMENTS]
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SepaPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sepa-payments/{paymentId}/confirmation:
    get:
      tags: [SEPA Payments]
      summary: >-
        Download the payment confirmation document for a COMPLETED SEPA payment (ADR-0248 #3).
        Rendered synchronously on this request only, via document-service's non-persisting
        preview endpoint — never pre-generated, never cached, never persisted anywhere.
      operationId: getSepaPaymentConfirmation
      security:
        - bearerAuth: [ROLE_VIEWER, ROLE_OPERATOR, ROLE_ADMIN, ROLE_PAYMENTS]
      parameters:
        - $ref: '#/components/parameters/paymentId'
        - name: locale
          in: query
          schema:
            type: string
            enum: [cs, en]
            default: en
      responses:
        '200':
          description: Rendered confirmation document (HTML)
          content:
            text/html:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Payment exists but is not COMPLETED — no confirmation available
        '502':
          description: document-service unreachable, or no PUBLISHED template for the requested locale

  /api/v1/sepa-payments/{paymentId}/status:
    patch:
      tags: [SEPA Payments]
      summary: Transition SEPA payment status
      operationId: transitionSepaPaymentStatus
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN, ROLE_PAYMENTS]
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStatusRequest'
      responses:
        '200':
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SepaPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-payments/approvals:
    get:
      tags: [SEPA Payment Approvals]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2,
        issue #5679). Without it a decision parked at 202 is discoverable only by whoever was
        handed its id. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-payments/approvals/{id}:
    patch:
      tags: [SEPA Payments]
      summary: Approve or reject a pending four-eyes approval for a SEPA payment (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the gated
        action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide, so the
        queue is readable by anyone who may decide, including the maker (seeing a request is not
        authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: sepaPayment.transitionStatus
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true

    CreateSepaPaymentRequest:
      type: object
      required: [debtorAccountId, creditorIban, creditorName, amount, currencyCode, endToEndId]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        creditorIban:
          type: string
        creditorName:
          type: string
        creditorBic:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
          example: EUR
        endToEndId:
          type: string
        remittanceInfo:
          type: string
        requestedExecutionDate:
          type: string
          format: date

    TransitionStatusRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus:
          type: string
          # The full SepaPaymentStatus vocabulary, which is what the endpoint parses. Which of
          # these is reachable depends on the payment's current state (SepaPayment.canTransitionTo);
          # an illegal transition is a 409, not a 400. RECEIVED is the creation state and is
          # therefore never a legal target from any state.
          enum: [RECEIVED, VALIDATED, PROCESSING, COMPLETED, REJECTED, RETURNED, CANCELLED]
        rejectReason:
          type: string
          # Required by the domain when targetStatus is REJECTED.
          enum: [INSUFFICIENT_FUNDS, INVALID_IBAN, ACCOUNT_CLOSED, ACCOUNT_FROZEN, INVALID_BIC, AMOUNT_LIMIT_EXCEEDED, AML_HOLD, SANCTIONS_HIT, TECHNICAL_ERROR]
        rejectDetail:
          type: string

    SepaPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endToEndId:
          type: string
        debtorAccountId:
          type: string
          format: uuid
        creditorIban:
          type: string
        creditorName:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
