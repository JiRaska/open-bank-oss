# SmallRye YAML quotes dotted Kafka leaf keys, so these connector properties live in a
# real properties source. Earliest ensures Audit replays lifecycle events emitted before
# its new consumer image reaches an environment (subject to topic retention).
mp.messaging.incoming.fraud-case-audit-in.group.id=audit-service-fraud-case
mp.messaging.incoming.fraud-case-audit-in.auto.offset.reset=earliest
