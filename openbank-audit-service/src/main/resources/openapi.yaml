openapi: 3.1.0
info:
  title: Audit Service API
  version: 1.4.0
  description: Immutable audit trail — retrieve event history per aggregate; verify hash-chain integrity (ADR-0086) and externally-signed anchors (ADR-0031 D5).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8113
    description: Local development
tags:
  - name: Audit

paths:
  /api/v1/audit/entries/{aggregateId}:
    get:
      tags: [Audit]
      summary: Get audit trail for an aggregate
      operationId: getAuditTrail
      parameters:
        - name: aggregateId
          in: path
          required: true
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryResponse'

  /api/v1/audit/entries/by-actor/{actorId}:
    get:
      tags: [Audit]
      summary: Get audit entries for one actor across all ingress channels (ADR-0226)
      operationId: getActorTrail
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
        - name: channel
          in: query
          description: Narrow to one ingress channel (ui|mcp|api); omit for all channels
          schema:
            type: string
            enum: [ui, mcp, api]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Audit entries the actor produced, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryResponse'

  /api/v1/audit/integrity:
    get:
      tags: [Audit]
      summary: Verify the audit hash chain (ADR-0086)
      operationId: verifyIntegrity
      security:
        - bearerAuth: []
      parameters:
        - name: fromEventId
          in: query
          required: false
          description: >
            Start the integrity walk from this entry_id (inclusive). The row's own prevHash
            is used as the expected-previous, so the check is self-contained from that point.
            Omit to walk the full chain from the genesis block.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hash-chain integrity result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityResponse'
        '400':
          description: fromEventId is not a valid UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

  /api/v1/audit/anchors:
    get:
      tags: [Audit]
      summary: List recent signed audit anchors (ADR-0031 D5)
      operationId: listAnchors
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of anchors to return (most recent first, clamped 1..200).
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Recent signed anchors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditAnchorResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

  /api/v1/audit/anchors/verify:
    get:
      tags: [Audit]
      summary: Verify all signed audit anchors (ADR-0031 D5)
      operationId: verifyAnchors
      description: >
        Recomputes each anchor digest, verifies its signature, and confirms the attested chain
        head still matches the live chain. Detects a wholesale rewrite of the log that the
        internal hash-chain walk alone cannot.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Anchor verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorVerificationResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IntegrityResponse:
      type: object
      required: [chainStatus, checkedCount, unchainedCount]
      properties:
        chainStatus:
          type: string
          enum: [INTACT, BROKEN]
          description: INTACT when every recomputed link matches; BROKEN on the first mismatch.
        checkedCount:
          type: integer
          format: int64
          description: Number of chained rows verified.
        unchainedCount:
          type: integer
          format: int64
          description: Rows written before the hash-chain migration — counted, not verifiable.
        firstBrokenAt:
          type: string
          format: uuid
          nullable: true
          description: entry_id of the first broken link; null when chainStatus is INTACT.

    AuditAnchorResponse:
      type: object
      required: [chainedCount, chainStatus, anchorDigest, keyId, signedAt]
      description: An externally-signed checkpoint over the audit hash chain (ADR-0031 D5).
      properties:
        lastEntryId:
          type: string
          format: uuid
          nullable: true
          description: entry_id of the chain head at capture time; null only for an empty chain.
        lastRecordHash:
          type: string
          nullable: true
          description: record_hash of the attested chain head.
        chainedCount:
          type: integer
          format: int64
          description: Number of chained rows at capture time.
        chainStatus:
          type: string
          enum: [INTACT, BROKEN]
          description: Chain status observed when the anchor was captured.
        anchorDigest:
          type: string
          description: SHA-256 over the attested fields; the value that was signed.
        signature:
          type: string
          nullable: true
          description: Base64 signature over anchorDigest; null when the signer was unavailable.
        keyId:
          type: string
          description: Identifier of the key that produced the signature.
        signedAt:
          type: string
          format: date-time

    AnchorVerificationResponse:
      type: object
      required: [status, anchorCount, verifiedCount, unsignedCount]
      properties:
        status:
          type: string
          enum: [INTACT, BROKEN]
          description: INTACT when every anchor's signature and attested head verify.
        anchorCount:
          type: integer
          format: int64
        verifiedCount:
          type: integer
          format: int64
          description: Anchors whose signature and attested head both verified.
        unsignedCount:
          type: integer
          format: int64
          description: Anchors stored without a signature (signer unavailable at capture).
        firstBroken:
          nullable: true
          description: The first anchor that failed verification; null when status is INTACT.
          allOf:
            - $ref: '#/components/schemas/AnchorBreak'

    AnchorBreak:
      type: object
      required: [signatureInvalid, headHashMismatch]
      properties:
        lastEntryId:
          type: string
          format: uuid
          nullable: true
        signatureInvalid:
          type: boolean
          description: The anchor's stored signature did not verify over its recomputed digest.
        headHashMismatch:
          type: boolean
          description: The attested head hash no longer matches the live chain (rewrite).

    AuditEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateId:
          type: string
        aggregateType:
          type: string
        eventType:
          type: string
        actorId:
          type: string
        payload:
          type: object
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          nullable: true
        channel:
          type: string
          enum: [ui, mcp, api]
          nullable: true
          description: Ingress channel the event arrived through (ADR-0226); null for pre-V9 rows.
        actChain:
          type: array
          items:
            type: string
          description: Ordered RFC 8693 delegation chain (ADR-0224); empty for direct action.
        sessionId:
          type: string
          nullable: true
          description: Browser or agent session the action belongs to.
