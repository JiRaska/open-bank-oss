openapi: 3.1.0
info:
  title: Audit Service API
  version: 1.7.0
  description: Immutable audit trail — retrieve event history per aggregate; verify hash-chain integrity (ADR-0086) and externally-signed anchors (ADR-0031 D5).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8113
    description: Local development
tags:
  - name: Audit

paths:
  /api/v1/audit/customer/{partyId}:
    get:
      tags: [Audit]
      summary: Get a party's own access log (customer privacy view)
      operationId: getCustomerAccessLog
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Access-log entries for the party (event metadata only, no payloads)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessLogEntryResponse'

  /api/v1/audit/on-behalf-of/{grantorPartyId}:
    get:
      tags: [Audit]
      summary: Actions taken on behalf of a grantor by their delegates (ADR-0232 D5)
      description: >-
        The data behind "what did they do with my account". Returns every audited action
        whose on-behalf-of party is this grantor — i.e. what a DELEGATE did under a
        delegation grant the grantor issued. Distinct from
        `/api/v1/audit/customer/{partyId}`: on a delegated action the grantor is neither
        the actor nor the aggregate, so that view shows nothing about it.


        Same edge-proxy gate and `audit.customerRead` Authorize action as the customer
        access log; the edge injects the party from the JWT, so a client-supplied id never
        reaches this path. Projected to metadata only — the grantor is entitled to know
        that, when and under which grant, not to the raw event payload.
      operationId: getDelegatedActionsForGrantor
      parameters:
        - name: grantorPartyId
          in: path
          required: true
          schema:
            type: string
        - name: delegatePartyId
          in: query
          description: Narrow to one delegate (the actor).
          schema:
            type: string
        - name: delegationId
          in: query
          description: Narrow to one delegation grant.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Delegated actions taken on behalf of the grantor, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DelegatedActionEntryResponse'

  /api/v1/audit/entries/{aggregateId}:
    get:
      tags: [Audit]
      summary: Get audit trail for an aggregate
      operationId: getAuditTrail
      parameters:
        - name: aggregateId
          in: path
          required: true
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryResponse'

  /api/v1/audit/entries/by-actor/{actorId}:
    get:
      tags: [Audit]
      summary: Get audit entries for one actor across all ingress channels (ADR-0226)
      operationId: getActorTrail
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
        - name: channel
          in: query
          description: Narrow to one ingress channel (ui|mcp|api); omit for all channels
          schema:
            type: string
            enum: [ui, mcp, api]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Audit entries the actor produced, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryResponse'

  /api/v1/audit/integrity:
    get:
      tags: [Audit]
      summary: Verify the audit hash chain (ADR-0086)
      operationId: verifyIntegrity
      security:
        - bearerAuth: []
      parameters:
        - name: fromEventId
          in: query
          required: false
          description: >
            Start the integrity walk from this entry_id (inclusive). The row's own prevHash
            is used as the expected-previous, so the check is self-contained from that point.
            Omit to walk the full chain from the genesis block.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hash-chain integrity result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityResponse'
        '400':
          description: fromEventId is not a valid UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

  /api/v1/audit/anchors:
    get:
      tags: [Audit]
      summary: List recent signed audit anchors (ADR-0031 D5)
      operationId: listAnchors
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of anchors to return (most recent first, clamped 1..200).
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Recent signed anchors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditAnchorResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

  /api/v1/audit/anchors/verify:
    get:
      tags: [Audit]
      summary: Verify all signed audit anchors (ADR-0031 D5)
      operationId: verifyAnchors
      description: >
        Recomputes each anchor digest, verifies its signature, and confirms the attested chain
        head still matches the live chain. Detects a wholesale rewrite of the log that the
        internal hash-chain walk alone cannot.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Anchor verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorVerificationResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

  /api/v1/audit/anchors/public-key:
    get:
      tags: [Audit]
      summary: Public key material for the audit anchor signer (ADR-0031 D5)
      operationId: anchorPublicKey
      description: >
        Returns the PEM-encoded SPKI public key for the current anchor signing key. Anchor
        signatures are ECDSA P-256 (SHA256withECDSA, ASN.1/DER, base64), so a third party can
        verify any anchor with this key alone and with no access to the signer. 503 when the key
        cannot be published — an unavailable key is reported as unavailable, never as an empty
        success.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Public key material for the current signing key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorKeyMaterialResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role
        '503':
          description: The signing key's public material could not be published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorKeyMaterialResponse'

  /api/v1/audit/anchors/capture:
    post:
      tags: [Audit]
      summary: Capture a signed audit anchor now (ADR-0031 D5)
      operationId: captureAnchor
      description: >
        Signs the current chain head with the external key, in addition to the scheduled hourly
        capture. Fail-closed: an unavailable or invalid key yields 503 and NO anchor row — an
        unsigned checkpoint is never stored.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: A signed anchor was captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnchorResponse'
        '204':
          description: The audit chain is empty; there is nothing to attest
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-writing role
        '503':
          description: The anchor could not be signed; no anchor was stored

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IntegrityResponse:
      type: object
      required: [chainStatus, checkedCount, unchainedCount]
      properties:
        chainStatus:
          type: string
          enum: [INTACT, BROKEN]
          description: INTACT when every recomputed link matches; BROKEN on the first mismatch.
        checkedCount:
          type: integer
          format: int64
          description: Number of chained rows verified.
        unchainedCount:
          type: integer
          format: int64
          description: Rows written before the hash-chain migration — counted, not verifiable.
        firstBrokenAt:
          type: string
          format: uuid
          nullable: true
          description: entry_id of the first broken link; null when chainStatus is INTACT.

    AuditAnchorResponse:
      type: object
      required: [chainedCount, chainStatus, anchorDigest, keyId, signedAt]
      description: An externally-signed checkpoint over the audit hash chain (ADR-0031 D5).
      properties:
        lastEntryId:
          type: string
          format: uuid
          nullable: true
          description: entry_id of the chain head at capture time; null only for an empty chain.
        lastRecordHash:
          type: string
          nullable: true
          description: record_hash of the attested chain head.
        chainedCount:
          type: integer
          format: int64
          description: Number of chained rows at capture time.
        chainStatus:
          type: string
          enum: [INTACT, BROKEN]
          description: Chain status observed when the anchor was captured.
        anchorDigest:
          type: string
          description: SHA-256 over the attested fields; the value that was signed.
        signature:
          type: string
          nullable: true
          description: >
            Base64 ECDSA P-256 (ASN.1/DER) signature over anchorDigest, verifiable with the public
            key from /api/v1/audit/anchors/public-key. Null only for legacy rows captured before
            signing became fail-closed; a capture that cannot sign now stores nothing.
        keyId:
          type: string
          description: Identifier of the key that produced the signature.
        signedAt:
          type: string
          format: date-time

    AnchorVerificationResponse:
      type: object
      required: [status, anchorCount, verifiedCount, unsignedCount, unverifiableCount]
      properties:
        status:
          type: string
          enum: [INTACT, UNVERIFIABLE, BROKEN]
          description: >
            INTACT when every anchor's signature and attested head verify; UNVERIFIABLE when some
            anchor could not be checked at all (no public key material, or a legacy unsigned row);
            BROKEN when one failed. UNVERIFIABLE is deliberately its own state — an anchor nobody
            can check is not an anchor that passed.
        anchorCount:
          type: integer
          format: int64
        verifiedCount:
          type: integer
          format: int64
          description: Anchors whose signature and attested head both verified.
        unsignedCount:
          type: integer
          format: int64
          description: >
            Legacy anchors stored without a signature. Capture is fail-closed, so this can only be
            non-zero for rows written before that change.
        unverifiableCount:
          type: integer
          format: int64
          description: >
            Signed anchors whose keyId has no published public material in this deployment — never
            counted as verified.
        firstBroken:
          nullable: true
          description: The first anchor that failed verification; null when status is INTACT.
          allOf:
            - $ref: '#/components/schemas/AnchorBreak'

    AnchorKeyMaterialResponse:
      type: object
      required: [keyId]
      properties:
        keyId:
          type: string
          description: Identifier of the anchor signing key (e.g. openbao-transit:transit/audit-anchor).
        publicKeyPem:
          type: string
          nullable: true
          description: >
            PEM-encoded SPKI public key. Null (with HTTP 503) when the material cannot be
            published. Only public material ever appears here.

    AnchorBreak:
      type: object
      required: [signatureInvalid, headHashMismatch]
      properties:
        lastEntryId:
          type: string
          format: uuid
          nullable: true
        signatureInvalid:
          type: boolean
          description: The anchor's stored signature did not verify over its recomputed digest.
        headHashMismatch:
          type: boolean
          description: The attested head hash no longer matches the live chain (rewrite).

    AccessLogEntryResponse:
      type: object
      description: Customer-facing privacy projection of an audit entry — event metadata
        only, deliberately without the payload (AuditResource#getCustomerAccessLog).
      properties:
        eventType:
          type: string
        aggregateType:
          type: string
        actorType:
          type: string
          nullable: true
        sourceService:
          type: string
        occurredAt:
          type: string
          format: date-time

    DelegatedActionEntryResponse:
      type: object
      description: >-
        Grantor-facing projection of one delegated action (ADR-0232 D5). Metadata only —
        the payload is chain-hashed evidence for the auditor-gated routes, not for this view.
      properties:
        entryId:
          type: string
          format: uuid
          description: The audit chain entry; usable as `fromEventId` on /api/v1/audit/integrity.
        eventType:
          type: string
        operation:
          type: string
          nullable: true
          description: The customer-facing verb, e.g. `payments.domestic`.
        delegatePartyId:
          type: string
          nullable: true
          description: Who acted. The actor is the delegate, never the grantor.
        delegationId:
          type: string
          nullable: true
          description: The grant that permitted the action.
        resourceType:
          type: string
        sourceService:
          type: string
        occurredAt:
          type: string
          format: date-time

    AuditEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateId:
          type: string
        aggregateType:
          type: string
        eventType:
          type: string
        actorId:
          type: string
        payload:
          type: object
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          nullable: true
        channel:
          type: string
          enum: [ui, mcp, api]
          nullable: true
          description: Ingress channel the event arrived through (ADR-0226); null for pre-V9 rows.
        actChain:
          type: array
          items:
            type: string
          description: Ordered RFC 8693 delegation chain (ADR-0224); empty for direct action.
        sessionId:
          type: string
          nullable: true
          description: Browser or agent session the action belongs to.
