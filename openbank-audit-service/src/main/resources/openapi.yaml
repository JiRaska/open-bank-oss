openapi: 3.1.0
info:
  title: Audit Service API
  version: 1.1.0
  description: Immutable audit trail — retrieve event history per aggregate; verify hash-chain integrity (ADR-0086).
  license:
    name: MPL-2.0
    url: https://www.mozilla.org/MPL/2.0/
servers:
  - url: http://localhost:8117
    description: Local development
tags:
  - name: Audit

paths:
  /api/v1/audit/entries/{aggregateId}:
    get:
      tags: [Audit]
      summary: Get audit trail for an aggregate
      operationId: getAuditTrail
      parameters:
        - name: aggregateId
          in: path
          required: true
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryResponse'

  /api/v1/audit/integrity:
    get:
      tags: [Audit]
      summary: Verify the audit hash chain (ADR-0086)
      operationId: verifyIntegrity
      security:
        - bearerAuth: []
      parameters:
        - name: fromEventId
          in: query
          required: false
          description: >
            Start the integrity walk from this entry_id (inclusive). The row's own prevHash
            is used as the expected-previous, so the check is self-contained from that point.
            Omit to walk the full chain from the genesis block.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hash-chain integrity result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityResponse'
        '400':
          description: fromEventId is not a valid UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthenticated
        '403':
          description: Caller does not have an audit-reading role

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IntegrityResponse:
      type: object
      required: [chainStatus, checkedCount, unchainedCount]
      properties:
        chainStatus:
          type: string
          enum: [INTACT, BROKEN]
          description: INTACT when every recomputed link matches; BROKEN on the first mismatch.
        checkedCount:
          type: integer
          format: int64
          description: Number of chained rows verified.
        unchainedCount:
          type: integer
          format: int64
          description: Rows written before the hash-chain migration — counted, not verifiable.
        firstBrokenAt:
          type: string
          format: uuid
          nullable: true
          description: entry_id of the first broken link; null when chainStatus is INTACT.

    AuditEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateId:
          type: string
        aggregateType:
          type: string
        eventType:
          type: string
        actorId:
          type: string
        payload:
          type: object
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          nullable: true
