quarkus:
  application:
    name: openbank-audit-service
  http:
    port: 8113
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_audit
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_audit
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-audit-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
      # openbank-infra/gitops/components/audit/audit-service-msg-override.yaml (a properties-file
      # override loaded via QUARKUS_CONFIG_LOCATIONS) for where they're set instead. Summary:
      # SmallRye Config's YAML source unconditionally quotes any leaf map key containing a literal
      # dot (`group.id` registers as the literal property name `"group.id"`, quotes included,
      # regardless of whether the YAML key itself is quoted), so
      # KafkaConnectorIncomingConfiguration's plain lookup never finds it. group.id then silently
      # fell back to Quarkus's default (quarkus.application.name = openbank-audit-service), which
      # the audit-service KafkaUser ACL (kafka-audit-mtls.yaml) does NOT grant Read on (only
      # "audit-service" is granted) — every consumer poll got a silent
      # org.apache.kafka.common.errors.GroupAuthorizationException. A properties file (not an env
      # var) is used because this channel name is hyphenated (audit-events-in): SmallRye's env-var
      # reverse-mapping for hyphenated/dotted channel names is ambiguous and previously broke
      # transaction-service's payment-scheme-accepted channel this way (reverted, #2649→#2659); a
      # properties file carries the exact property name unambiguously. See issue #686.
      audit-events-in:
        connector: smallrye-kafka
        client.id: audit-service-${quarkus.uuid}
        topics: openbank.accounts.account.created,openbank.transactions.transaction.initiated,openbank.balance.events,openbank.party.events,openbank.kyc.events,openbank.consent.events,openbank.customer.audit
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
  openbank:
    audit:
      anchor:
        enabled: false
openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  gdpr:
    audit-retention-days: 3650
  outbox:
    dispatch-enabled: true
  retention:
    # ADR-0118 §2/§5, issue #268: session/access-log TTL cleanup.
    # SAFETY: enabled defaults to false and dry-run defaults to true — this scheduler ships
    # disabled everywhere until a human deliberately flips it per environment (see
    # SessionLogRetentionScheduler kdoc). This differs on purpose from card-issuance-service's
    # and kyc-service's retention schedulers, which were already reviewed and enabled in their
    # own prior PRs (#2479 / #2480); this is new, unreviewed-in-production code.
    session-log:
      enabled: "${RETENTION_SESSION_LOG_ENABLED:false}"
      dry-run: "${RETENTION_SESSION_LOG_DRY_RUN:true}"
      retention-days: "${RETENTION_SESSION_LOG_DAYS:90}"
      cron: "${RETENTION_SESSION_LOG_CRON:0 0 4 * * ?}"
  audit:
    anchor:
      # ADR-0031 D5: externally-signed tamper-evidence checkpoints over the audit hash chain.
      enabled: true
      interval: 1h
      initial-delay: 30s
      # Held outside the audit DB (env/Vault). Production replaces the default HMAC signer with a
      # KMS/cosign-keyed adapter (follow-up); this key is the in-cluster fallback.
      signing-key: ${AUDIT_ANCHOR_SIGNING_KEY:CHANGE_ME_LOCAL_DEV_ONLY}
