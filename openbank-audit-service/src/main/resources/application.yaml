quarkus:
  application:
    name: openbank-audit-service
  http:
    port: 8113
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_audit
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_audit
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-audit-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # D5 provenance is isolated from the legacy mixed stream: its handler only acknowledges a
      # Kafka record after append-only persistence succeeds.
      agent-audit-events-in:
        connector: smallrye-kafka
        enabled: ${AUDIT_AGENT_AUDIT_KAFKA_ENABLED:false}
        client.id: audit-service-agent-provenance-${quarkus.uuid}
        topic: openbank.agent.audit.events
        # #5745, same reasoning as `audit-events-in` below. This channel needs it MORE, not less:
        # it is the strict path — AgentAuditConsumer acknowledges only after append-only
        # persistence succeeds, so it rethrows by design, and SmallRye's default `fail` would stop
        # the D5 provenance stream on the first bad record. Explicit and NESTED (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.audit.agent-audit-events-in
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
      # openbank-infra/gitops/components/audit/audit-service-msg-override.yaml (a properties-file
      # override loaded via QUARKUS_CONFIG_LOCATIONS) for where they're set instead. Summary:
      # SmallRye Config's YAML source unconditionally quotes any leaf map key containing a literal
      # dot (`group.id` registers as the literal property name `"group.id"`, quotes included,
      # regardless of whether the YAML key itself is quoted), so
      # KafkaConnectorIncomingConfiguration's plain lookup never finds it. group.id then silently
      # fell back to Quarkus's default (quarkus.application.name = openbank-audit-service), which
      # the audit-service KafkaUser ACL (kafka-audit-mtls.yaml) does NOT grant Read on (only
      # "audit-service" is granted) — every consumer poll got a silent
      # org.apache.kafka.common.errors.GroupAuthorizationException. A properties file (not an env
      # var) is used here, matching the pattern already established for transaction-service's
      # payment-scheme-accepted channel; it carries the exact hyphenated/dotted property name
      # unambiguously, avoiding any reliance on MicroProfile Config's env-var-name reverse-mapping
      # for channel discovery. See issue #686.
      #
      # Correction (round 2): an earlier version of this comment first cited nonexistent issues
      # #2649/#2659, then over-corrected to claim env vars are "independently verified to work"
      # here — that overstated it too. The genuine concern is real: quarkusio/quarkus#30106 and
      # smallrye/smallrye-reactive-messaging#2028 document a live, unresolved upstream bug where
      # an env-var override of a single leaf property (e.g. `retries`, here `group.id`/
      # `auto.offset.reset`) on a HYPHENATED channel name crashes Quarkus at startup
      # (`SRMSG00071`, "connector attribute must be set for channel <wrong split>") — regardless
      # of whether the channel is already registered via YAML/annotations. Boot tests added
      # during this sweep inject the override via a QuarkusTestResourceLifecycleManager config
      # map, not a real OS env var, so they don't exercise this failure mode. This properties-file
      # mechanism is the CORRECT choice for a hyphenated channel like `audit-events-in`, not
      # merely a stylistic alternative.
      audit-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.audit.audit-events-in
        connector: smallrye-kafka
        client.id: audit-service-${quarkus.uuid}
        # clearing.batch.event / security.ict.incident / security.scan.event added (ADR-0160 #996
        # triage): each publisher's own docs name audit-service as the SOLE intended consumer
        # (clearing: "downstream audit consumers persist it for the statutory period"; scanner:
        # "Consumed by audit-service for tamper-evident 10-year retention" per DORA Art. 17). All
        # three were publish-with-zero-consumer since introduction. AuditConsumer.consume() is
        # generic (stores payload verbatim, best-effort field extraction with "unknown" fallbacks)
        # — no code change needed to accept a new topic's shape.
        #
        # cards.events / dispute.events / domestic.payment.events / sepa.payment.events /
        # statement.event / sanctions.screening.event added in the same #996 sweep, round 2 — each
        # verified to have a REAL producer (a genuine outbox-row write, not just a declared Kafka
        # channel) before being added here. openbank.sepa.instant.events (round 2 correction) DOES
        # have a real, working producer (KafkaSctInstEventPublisher, called from
        # SctInstPaymentService at every lifecycle transition) — an initial #996 triage pass
        # mistook a separate, dead/unused outbox port (SctInstOutboxPort) for the only pipeline
        # and wrongly concluded nothing was ever published; corrected.
        # Round 3: openbank.fx.conversion.completed's producer (KafkaFxEventPublisher, previously a
        # no-op stub) was fixed in #1033/#1054 — now has real events, added here.
        # openbank.documents.document.event is the new document-service (#1037); its own docs name
        # audit-service as the intended consumer (DocumentGenerated / SignatureCeremonyCompleted).
        # openbank.payments.swift.event: verified SwiftService.submitToScheme/settle both call
        # repo.saveWithOutbox with a real payload (swiftMessageId/status/amount/currency) — a
        # genuine producer, not a stub (learned from the #1034 mistake: checked the use-case layer
        # directly rather than assuming from the port/publisher shape alone). #1035's AML-case
        # design for this topic is a SEPARATE, additional consumer with real business logic
        # (case-opening criteria) — this audit-trail consumer does not replace or block that work.
        # openbank.sca.events (issue #5338): sca-service's own DEVICE_ENROLLED producer
        # (ScaService.enroll, KafkaScaOutboxEventPublisher) is a genuine outbox-row write, not
        # a stub — verified directly in ScaService.kt rather than assumed from the port shape
        # alone (#1034's lesson). audit-service was the only one of the topic's two documented
        # consumers (the other being onboarding-service's projection, #4353) that had never
        # subscribed.
        #
        # Issue #6035 (money-path audit gap, found by
        # .github/scripts/check-audit-money-path-subscription.py): four more money-path producers
        # were missing from all three places at once -- this list, TopicAttribution, and the
        # audit-service KafkaUser's Read ACLs -- which is the signature of a set that was never
        # enumerated rather than four independent oversights. Each producer was verified at its
        # own `mp.messaging.outgoing.<channel>.topic` declaration, never by grepping a topic
        # literal (a serialised data-class payload has no literal anywhere, #3883):
        #   openbank.ledger.journal.posted  --
        #     openbank-ledger-service/src/main/resources/application.yaml (the posting record
        #     itself, so the largest of the five named in #6035)
        #   openbank.sdd.event              -- openbank-sdd-service/src/main/resources/application.yaml
        #   openbank.interest.accrual.event -- openbank-interest-service/src/main/resources/application.yaml
        #   openbank.fraud.hold.changed     -- openbank-fraud-service/src/main/resources/application.yaml
        # All four publish through the standard outbox relay, so each record carries the `ce-type`
        # header AuditConsumer reads for event_type; none sets a "sourceService" body field, so
        # they resolve AttributionSource.TOPIC through TopicAttribution.
        #
        # Issue #6035, second and final backfill: the last three producers the check reported as
        # KNOWN_GAPS. Each was baselined rather than fixed the first time because it needed a
        # decision the ratchet should not make silently -- and each of those decisions has now
        # been made, so the gap list is empty and the ratchet covers every money-path topic:
        #   openbank.billing.fee.event            --
        #     openbank-billing-service/src/main/resources/application.yaml -> billing-events-out.
        #     Its KafkaTopic CR was the open question and it EXISTS (components/kafka/kafka.yaml),
        #     so the Read grant points at a declared topic.
        #   openbank.standing-orders.order.event  --
        #     openbank-standing-order-service/src/main/resources/application.yaml ->
        #     standing-order-events-out (components/payments/kafka-topic.yaml).
        # All three publish through the standard outbox relay (`OutboxKafkaHeaders.headersFor`),
        # so each record carries the `ce-type` header AuditConsumer reads for event_type; none
        # sets a "sourceService" body field, so they resolve AttributionSource.TOPIC through
        # TopicAttribution.
        #
        # NOT changed here, deliberately: `auto.offset.reset`. It is already `earliest` for the
        # deployed channel (audit-service-msg-override ConfigMap, config_ordinal=500). A topic
        # already on this list has committed offsets on group `audit-service` and is unaffected;
        # a NEWLY added one has none, so it is read from its retention start on first subscribe.
        # That is the intended audit behaviour, not a mass replay of the existing surface. All
        # three topics added above carry `retention.ms: 604800000` (7 days) in their KafkaTopic
        # CRs, so the backfill is bounded at one week of history per topic -- a one-time
        # first-subscribe load spike worth knowing about, not an unbounded replay.
        topics: openbank.accounts.account.created,openbank.transactions.transaction.initiated,openbank.balance.events,openbank.party.events,openbank.kyc.events,openbank.consent.events,openbank.customer.audit,openbank.clearing.batch.event,openbank.security.ict.incident,openbank.cards.events,openbank.dispute.events,openbank.domestic.payment.events,openbank.sepa.payment.events,openbank.statement.event,openbank.sanctions.screening.event,openbank.sepa.instant.events,openbank.fx.conversion.completed,openbank.documents.document.event,openbank.payments.swift.event,openbank.lending.events,openbank.sca.events,openbank.delegation.events,openbank.delegation.spend-reservation-state,openbank.ledger.journal.posted,openbank.sdd.event,openbank.interest.accrual.event,openbank.fraud.hold.changed,openbank.billing.fee.event,openbank.standing-orders.order.event
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
  openbank:
    audit:
      anchor:
        enabled: false
openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  gdpr:
    audit-retention-days: 3650
  retention:
    # ADR-0118 §2/§5, issue #268: session/access-log TTL cleanup.
    # SAFETY: enabled defaults to false and dry-run defaults to true — this scheduler ships
    # disabled everywhere until a human deliberately flips it per environment (see
    # SessionLogRetentionScheduler kdoc). This differs on purpose from card-issuance-service's
    # and kyc-service's retention schedulers, which were already reviewed and enabled in their
    # own prior PRs (#2479 / #2480); this is new, unreviewed-in-production code.
    session-log:
      enabled: "${RETENTION_SESSION_LOG_ENABLED:false}"
      dry-run: "${RETENTION_SESSION_LOG_DRY_RUN:true}"
      retention-days: "${RETENTION_SESSION_LOG_DAYS:90}"
      cron: "${RETENTION_SESSION_LOG_CRON:0 0 4 * * ?}"
  audit:
    anchor:
      # ADR-0031 D5: externally-signed tamper-evidence checkpoints over the audit hash chain.
      enabled: true
      interval: 1h
      initial-delay: 30s
      # hmac is local development only. Production switches to the dedicated ECC_NIST_P256 KMS
      # key, so the private key never enters the workload.
      signer: ${AUDIT_ANCHOR_SIGNER:hmac}
      signing-required: ${AUDIT_ANCHOR_SIGNING_REQUIRED:false}
      kms-key-id: ${AUDIT_ANCHOR_KMS_KEY_ID:}
      signing-key: ${AUDIT_ANCHOR_SIGNING_KEY:CHANGE_ME_LOCAL_DEV_ONLY}
    chain-verify:
      # ADR-0133: recompute the whole hash chain on a cadence and publish the verdict as metrics.
      # Defaults ON, unlike the retention scheduler above — that one DELETES, so its dangerous
      # state is running; this one only reads, so its dangerous state is NOT running. A control
      # nobody evaluates reports nothing, which reads exactly like a control that always passes.
      enabled: ${AUDIT_CHAIN_VERIFY_ENABLED:true}
      # Full walk, so hourly. Config rather than a literal so an operator can tighten it during a
      # suspected incident, or widen it if the log grows enough for the walk to cost real time —
      # openbank_audit_chain_verify_duration_seconds is what tells them which.
      cron: ${AUDIT_CHAIN_VERIFY_CRON:0 0 * * * ?}
