# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: platform
primaryDatastore: PostgreSQL
schemaName: govaudit_schema
dataLineageRole: internal
dataClassification: internal
retentionPolicy: "7 years"
evidenceExported: false
lineage:
  upstream:
    - serviceName: github
      relationType: api
      description: reads merged-PR metadata (reviews, merge-commit verification, labels, body) via the GitHub API
  downstream:
    - serviceName: admin-ui
      relationType: api
      description: exposes governance-audit findings and HITL approval queue
schemaLineage:
  ownedSchemas:
    - govaudit_schema
  dependentSchemas: []
