quarkus:
  application:
    name: openbank-statement-service
  http:
    port: 8136
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_statement
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_statement
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # M2M client for the outbound account/transaction/balance reads done during period close +
  # reconciliation (those upstreams are role-gated; without a bearer they 401). client_credentials
  # on openbank-services (ROLE_OPERATOR), attached by OidcClientRequestReactiveFilter on the clients.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none
    # #10486 batch 7: the booked-entries search (transaction.search) no longer rides the shared
    # openbank-services principal. TransactionRestClient selects this NAMED client (@OidcClientFilter("m2m")),
    # so its principal is service-account-openbank-statement (ROLE_API only), granted by identity in
    # transaction_rest_ext.rego. Every other rest-client stays on the default client.
    m2m:
      auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
      client-id: openbank-statement
      credentials:
        secret: ${OIDC_M2M_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
      grant:
        type: client
  rest-client:
    transaction-api:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
      scope: jakarta.inject.Singleton
    balance-api:
      url: ${BALANCE_SERVICE_URL:http://localhost:8105}
      scope: jakarta.inject.Singleton
    account-api:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8100}
      scope: jakarta.inject.Singleton
    party-api:
      url: ${PARTY_SERVICE_URL:http://localhost:8111}
      scope: jakarta.inject.Singleton
    # ADR-0248: synchronous, on-demand call to document-service's non-persisting preview endpoint —
    # a new outbound trust-boundary edge (rules.yaml: trust_boundary_diff_change).
    document-api:
      url: ${DOCUMENT_SERVICE_URL:http://localhost:8143}
      scope: jakarta.inject.Singleton
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-statement-service
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    # Dedicated IT Postgres on the warm CI stack (ADR-0043); CI auto-creates any
    # openbank_*_it database referenced here. Dev Services stay OFF — tests hit
    # localhost:5432 exactly as on a workstation.
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_statement_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_statement_it
    management:
      enabled: false
    devservices:
      enabled: false
    oidc:
      enabled: false
    # ADR-0050: disable the @Scheduled outbox tick under test so the integration test
    # drives dispatchScheduledBatch() explicitly and never races the assertions.
    scheduler:
      enabled: false

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"

openbank:
  # Opt in to the libs-runtime OPA sidecar PolicyDecisionPoint producer (replaces the
  # per-service AuthzProducer; same opa.url / opa.path / opa.timeout-ms keys and defaults).
  authz:
    opa-pdp-producer:
      enabled: true
  statement:
    close-cron: "0 30 2 1 * ?"
    scheduled-close:
      # ADR-0069 D3 / issue #470: enabled now that the close cadence is hardened —
      # self-healing catch-up, durable close-run + failure telemetry, period.close_failed
      # events, and Prometheus alerting (ServiceMonitor/PrometheusRule). The cron fires on
      # the 1st at 02:30 and closes through the prior month; missed runs self-heal next pass.
      # Under %test quarkus.scheduler.enabled=false keeps it from firing during tests.
      enabled: true
  temporal:
    enabled: false
    server-url: localhost:7233
    namespace: openbank-statements
    task-queue: openbank-statements
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # Account-service account stream → local AccountRegistry projection (enumeration source for the
      # scheduled monthly period-close). The consumer filters by eventType (AccountCreated) and upserts
      # idempotently; auto.offset.reset=earliest back-fills the full account history on first deploy.
      account-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.statement.account-events-in
        connector: smallrye-kafka
        topic: openbank.accounts.account.created
        group.id: openbank-statement-service
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # auto.offset.reset deliberately unset (#8370): the inert dotted YAML key was a config lie --
        # SmallRye quotes dotted leaf keys, so the connector always ran its default (latest) and the
        # declared `earliest` never applied. Deleting it makes the file match the running reality; to
        # rebuild projections, flip it via the msg-override ConfigMap in an announced replay window.
    outgoing:
      statement-events-out:
        connector: smallrye-kafka
        client.id: statement-service-${quarkus.uuid}
        topic: openbank.statement.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
"%prod":
  quarkus:
    # DocumentTemplateRestAdapter calls document-service. Production uses a named TLS bucket over
    # document-service's private-CA mTLS listener (8443, client auth REQUIRED), the same shape as
    # notification-service's party-authority bucket. Local/test fixtures speak plain HTTP, so this
    # stays under %prod: the client certificate only exists in the cluster.
    tls:
      document-authority:
        key-store:
          pem:
            client:
              cert: /mnt/document-tls/tls.crt
              key: /mnt/document-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/document-tls/ca.crt
        protocols: TLSv1.3
    rest-client:
      document-api:
        tls-configuration-name: document-authority
