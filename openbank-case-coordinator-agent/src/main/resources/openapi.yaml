openapi: 3.1.0
info:
  title: Case Coordinator Agent API
  version: 1.5.0
  description: >-
    Agent-swarm case coordination (ADR-0244): opens durable Temporal case workflows, accepts
    mid-flight agent signals (join / contribute / supersede / request-synthesis), and projects
    case history into the ADR-0246 thread view. Normal cases converge to exactly one
    human-in-the-loop proposal (ADR-0031); the bounded shadow pilot records its terminal result
    without delivery to HITL. This API never writes to a business record.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:8146
    description: Local development
tags:
  - name: Cases
  - name: Service

security:
  - bearerAuth: []

paths:
  /api/v1/case-coordinator/status:
    get:
      tags: [Service]
      summary: Service identity and liveness for operators
      operationId: getCaseCoordinatorStatus
      responses:
        '200':
          description: Service identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'

  /api/v1/case-coordinator/cases:
    post:
      tags: [Cases]
      summary: Open a swarm case (D9 case-open authority)
      operationId: openCase
      description: >-
        Opens a durable Temporal case workflow for one disposition target. Deduplicated by
        deterministic workflow id (class + subject); rate-limited per opening agent and bounded
        by the per-class concurrent-open ceiling from `agents.yaml: case_classes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCaseRequest'
      responses:
        '201':
          description: Case opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenCaseResponse'
        '202':
          description: Open accepted, workflow start pending
        '400':
          description: Missing or invalid request field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: >-
            The authenticated caller may not act as the requested `openedBy` agent identity, or
            case.open is denied by the capability gate, or the case class is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: A case for this class and subject is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Case-open quota or concurrent-case ceiling exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Temporal case workflows disabled or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      tags: [Cases]
      summary: List cases (open first), newest first
      operationId: listCases
      description: >-
        Read model over `case_workflow`. An empty list is the honest empty state (ADR-0231) —
        no synthetic rows.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by case status (OPEN, CONVERGING, CONTESTED, SYNTHESIZED, CLOSED)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Case list (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'

  /api/v1/case-coordinator/cases/{caseId}:
    get:
      tags: [Cases]
      summary: Case detail with the full ADR-0246 thread
      operationId: getCaseThread
      parameters:
        - name: caseId
          in: path
          required: true
          description: Temporal workflow id returned by the open call (case-<class>-<subject>)
          schema:
            type: string
      responses:
        '200':
          description: Case detail and thread entries, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseThread'
        '404':
          description: No case with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/case-coordinator/cases/{caseId}/signals:
    post:
      tags: [Cases]
      summary: Deliver a signal to a running case workflow
      operationId: signalCase
      description: >-
        Signal ingress for swarm participants: join, contribute, supersede (deterministic
        pre-emption, D5) or request-synthesis. Join and contribute require the dedicated OPA
        collaboration decision plus the local charter gate. Authorization, Temporal invocation,
        workflow consumption and contribution persistence remain separate evidence stages.
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
      responses:
        '202':
          description: >-
            Temporal client accepted the signal invocation. This does not assert that the workflow
            consumed the signal or persisted a contribution.
        '400':
          description: Missing or invalid request field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: >-
            The authenticated caller may not act as the requested `agentId`, or the signal type is
            denied by the OPA collaboration policy or the fail-safe local charter gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No running case with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Temporal case workflows disabled or the OPA collaboration policy unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ServiceStatus:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string

    OpenCaseRequest:
      type: object
      required: [caseClass, subjectRef, openedBy, dispositionTarget]
      properties:
        caseClass:
          type: string
          description: Case class from agents.yaml case_classes (e.g. incident-response)
        subjectRef:
          type: string
          description: Stable subject reference; part of the deduplicating workflow id
        openedBy:
          type: string
          description: >-
            Agent identity the call REQUESTS to act as. It is not an identity claim the server
            believes: the caller is proved by its bearer token, and this value is authorised
            against that caller's verified roles before any capability decision uses it.
        dispositionTarget:
          type: string
          description: What the case is deciding about (alert, incident, proposal lineage)

    OpenCaseResponse:
      type: object
      required: [caseId]
      properties:
        caseId:
          type: string

    SignalRequest:
      type: object
      required: [type, agentId]
      properties:
        type:
          type: string
          enum: [join, contribute, supersede, request-synthesis]
        agentId:
          type: string
          description: >-
            Agent identity the signal REQUESTS to act as, and the recorded author of the
            contribution. Authorised against the authenticated caller's verified roles before the
            capability gate consults it.
        role:
          type: string
          description: Participant role for join signals
        summary:
          type: string
          description: Contribution content (required for contribute)
        evidenceRefs:
          type: array
          items:
            type: string
        contested:
          type: boolean
        newEvidenceRef:
          type: string
          description: Required for supersede (pre-emption evidence, D5)
        reason:
          type: string

    CaseSummary:
      type: object
      required:
        - caseId
        - caseClass
        - dispositionTarget
        - status
        - openedAtEpochMs
        - deadlineAtEpochMs
        - contestedRate
        - contributionCount
      properties:
        caseId:
          type: string
        caseClass:
          type: string
        dispositionTarget:
          type: string
        status:
          type: string
        openedAtEpochMs:
          type: integer
          format: int64
        deadlineAtEpochMs:
          type: integer
          format: int64
        contestedRate:
          type: number
        contributionCount:
          type: integer

    CaseListResponse:
      type: object
      required: [cases]
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'

    ThreadEntry:
      type: object
      required: [type, atEpochMs, runtimeEvidence]
      properties:
        type:
          type: string
          enum:
            - CASE_OPENED
            - CONTRIBUTION
            - PROPOSAL_EMITTED
            - SHADOW_RECORDED
            - POLICY_DECISION
            - SIGNAL_INVOKED
            - SIGNAL_CONSUMED
            - CONTRIBUTION_PERSISTED
        atEpochMs:
          type: integer
          format: int64
        actor:
          type: string
        summary:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
        draftVersion:
          type: integer
        superseded:
          type: boolean
          description: True for contributions on a pre-empted draft (D5 fork marker)
        contested:
          type: boolean
        proposalId:
          type: string
        proposalType:
          type: string
        shadow:
          type: boolean
          description: True when this terminal result is recorded for the bounded shadow pilot and was not delivered to HITL.
        tokensUsed:
          type: integer
          minimum: 0
        signalId:
          type: string
          format: uuid
        capability:
          type: string
          enum: [case.join, case.contribute]
        rolloutId:
          type: string
        runtimeEvidence:
          $ref: '#/components/schemas/RuntimeEvidence'

    RuntimeEvidence:
      type: object
      description: Runtime observation backing the rendered entry. Charter configuration never creates runtime evidence.
      required: [evidenceId, source, stage, observedAtEpochMs, correlationId, detail]
      properties:
        evidenceId:
          type: string
        source:
          type: string
          enum:
            - case-coordinator-postgres-read-model
            - case-coordinator-transactional-outbox
            - case-coordinator-signal-evidence
        stage:
          type: string
          enum:
            - AUTHORIZED
            - DENIED
            - INVOKED
            - CONSUMED
            - RECORDED
            - PERSISTED
            - EMITTED
            - PUBLISHED_TO_BROKER
            - PUBLISH_FAILED
            - SHADOW_RECORDED
        observedAtEpochMs:
          type: integer
          format: int64
        correlationId:
          type: string
        detail:
          type: string

    CaseThread:
      type: object
      required:
        - caseId
        - caseClass
        - dispositionTarget
        - status
        - openedAtEpochMs
        - deadlineAtEpochMs
        - contestedRate
        - budgetTokens
        - budgetContributions
        - observedAtEpochMs
        - dataFromEpochMs
        - dataToEpochMs
        - lastSuccessfulLoadEpochMs
        - coverageStatus
        - historySource
        - retentionPolicy
        - entries
      properties:
        caseId:
          type: string
        caseClass:
          type: string
        dispositionTarget:
          type: string
        status:
          type: string
        openedAtEpochMs:
          type: integer
          format: int64
        deadlineAtEpochMs:
          type: integer
          format: int64
        contestedRate:
          type: number
        budgetTokens:
          type: integer
        budgetContributions:
          type: integer
        observedAtEpochMs:
          type: integer
          format: int64
          description: Timestamp of the newest observed durable evidence, not the load time.
        dataFromEpochMs:
          type: integer
          format: int64
          description: Oldest timestamp present in this returned case timeline.
        dataToEpochMs:
          type: integer
          format: int64
          description: Newest timestamp present in this returned case timeline.
        lastSuccessfulLoadEpochMs:
          type: integer
          format: int64
          description: Server time at which all read-model queries for this response completed successfully.
        coverageStatus:
          type: string
          enum: [UNKNOWN_RETENTION]
          description: Coverage cannot be claimed complete or partial while the durable read-model retention duration is not configured.
        historySource:
          type: string
          enum: [case-coordinator-postgres-read-model]
        retentionPolicy:
          type: string
          description: Durable read-model retention policy. `not-configured` means the service makes no retention-duration claim.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEntry'

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
