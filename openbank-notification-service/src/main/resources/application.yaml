quarkus:
  application:
    name: openbank-notification-service
  http:
    port: 8112
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_notifications
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_notifications
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # M2M client for the ADR-0198 D4 consent gate (#2660): the MARKETING consent check fires from
  # a Kafka consumer with no inbound user token, so it needs its own client_credentials grant on
  # openbank-services (carries ROLE_OPERATOR, which consent-service's consent.validate accepts).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none
  rest-client:
    consent-service:
      url: ${CONSENT_SERVICE_URL:http://localhost:8106}
      connect-timeout: 2000
      read-timeout: 2000
    # EMAIL envelope-address resolution (issue #3581). Timeouts match consent-service: a party
    # lookup that hangs must not hold a Kafka record open, and a timeout resolves to "not
    # deliverable", which records FAILED rather than mailing a party id.
    party-service:
      url: ${PARTY_SERVICE_URL:http://localhost:8111}
      connect-timeout: 2000
      read-timeout: 2000
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  mailer:
    host: localhost
    port: 1025
    start-tls: DISABLED
    auth-methods: DISABLED
    from: noreply@openbank.cz
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-notification-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        # ADR-0137: mTLS connector defaults — injected from env so local dev
        # (no env set) stays on plaintext localhost:29092 without any code change.
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      # ADR-0239 D2: the delivery-outcome topic. The channel bean
      # (KafkaNotificationOutboxEventPublisher) and the outbox that feeds it predate this binding by
      # a long way — until now the outbox had no writer and this channel had no topic, so the
      # service produced nothing. `.v1` is in the topic NAME on purpose: this is the first versioned
      # topic in the fleet and the contract evolves additively within v1 (ADR-0006).
      notification-events-out:
        connector: smallrye-kafka
        # client.id: same dotted-key YAML trap as the incoming channels below — set via the gitops
        # ConfigMap, never here (issue #686).
        topic: openbank.notification.outcomes.v1
        # NESTED, not the dotted `value.serializer` the incoming channels below use: Quarkus's YAML
        # source quotes a dotted leaf key so the connector never reads it (issue #686). The existing
        # dotted keys survive only because SmallRye happens to infer String serdes anyway; a new one
        # must not rely on that, and the dotted-key ratchet gate would fail it.
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      notification-events-in:
        connector: smallrye-kafka
        # client.id / group.id / auto.offset.reset are set via the gitops ConfigMap
        # (notification-service-msg-override, QUARKUS_CONFIG_LOCATIONS) instead of
        # here: Quarkus's YAML config source unconditionally quotes any dotted leaf
        # key (`client.id`, `group.id`, `auto.offset.reset`) when flattening YAML, so
        # it silently registers as `mp.messaging.incoming.notification-events-in."group.id"`
        # etc. — properties KafkaConnectorIncomingConfiguration never reads. group.id
        # falls back to quarkus.application.name, which the Strimzi ACL does not grant
        # Read on (issue #686); client.id is cosmetic (broker-side log/JMX label only)
        # but left broken the same way if not moved out too.
        topic: openbank.notification.requests
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # #5745 (sweep of #5698): NotificationConsumer.consume now RETHROWS a processing failure
        # instead of acking it. SmallRye's DEFAULT failure-strategy is `fail`, which STOPS the
        # channel — without this line the rethrow trades silent data loss for a wedged consumer
        # that stops every notification, not only the failed one. `dead-letter-queue` is what
        # makes the fix's KDoc true by effect rather than by assertion (mirrors party-events-in
        # below).
        #
        # The DLQ TOPIC NAME is set in the gitops msg-override ConfigMap, not here: the key is
        # `dead-letter-queue.topic`, a dotted leaf key, and SmallRye's YAML source would register
        # it quoted and never read it (issue #686).
        failure-strategy: dead-letter-queue
      party-events-in:
        connector: smallrye-kafka
        # client.id / group.id / auto.offset.reset: same dotted-key YAML bug as above —
        # set via the gitops ConfigMap instead (issue #686).
        topic: openbank.party.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # #5698: PartyErasureConsumer now RETHROWS a failed GDPR Art. 17 erasure instead of
        # acking it. That is only an improvement if the connector parks the record — SmallRye's
        # DEFAULT failure-strategy is `fail`, which STOPS the channel, so a rethrow without this
        # line trades silent data loss for a wedged consumer. `dead-letter-queue` is what makes
        # the consumer's KDoc true by effect rather than by assertion.
        #
        # The DLQ TOPIC NAME is set in the gitops msg-override ConfigMap, not here: the key is
        # `dead-letter-queue.topic`, a dotted leaf key, and SmallRye's YAML source would register
        # it quoted and never read it (issue #686 — the same footgun as group.id above). Left
        # implicit it would default to `dead-letter-topic-party-events-in`, which account-service
        # ALREADY owns for its own channel of the same name — two services' dead letters in one
        # topic, misattributed by the existing AccountPartyEventDeadLettered alert. Hence the
        # explicit per-service name, mirroring fraud-service's `transaction-signal` channel.
        failure-strategy: dead-letter-queue
      # ADR-0232 delegated-access lifecycle notifications (DelegationNotificationConsumer) — a
      # second consumer of the topic account-service (enforcement projection) and audit-service
      # (onBehalfOf trail) already read.
      delegation-events-in:
        connector: smallrye-kafka
        # client.id / group.id / auto.offset.reset: same dotted-key YAML bug as above —
        # set via the gitops ConfigMap instead (issue #686).
        topic: openbank.delegation.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # #8346 (tail of #5745): DelegationNotificationConsumer.consume returns the Uni it gets
        # from NotificationConsumer.consume, and since #5745 that Uni FAILS rather than recovers —
        # its `.onFailure().invoke` only logs, deliberately, so the connector decides (see the
        # comment at NotificationConsumer.kt:299-314). Without a failure-strategy the connector
        # default is `fail`, which STOPS the channel: one transient DB error and every delegation
        # notification silently ceases. This channel's KDoc asserted the opposite until this
        # change — a comment about configuration going stale exactly like one about remote state.
        failure-strategy: dead-letter-queue
        # NESTED, never the dotted leaf key `dead-letter-queue.topic:` — SmallRye's YAML source
        # quotes any leaf key containing a literal dot, registering it as
        # ...delegation-events-in."dead-letter-queue.topic", which the connector never reads and
        # nothing errors about (issue #686). The nested form resolves correctly; aml-service's
        # DeadLetterQueueConfigResolutionTest proves both directions against the real YAML source.
        #
        # In application.yaml rather than the msg-override ConfigMap, unlike this service's two
        # older channels: the nested form works in every source, so local dev and tests get the
        # same wiring as the deployed pod. It is also the fleet majority — 20 services name their
        # DLQ this way. `group.id`/`client.id`/`auto.offset.reset` stay in the ConfigMap because
        # those keys have no nested spelling the connector reads.
        #
        # EXPLICIT, because SmallRye's implicit default is `dead-letter-topic-<channel>`, derived
        # from the channel name alone. `delegation-events-in` is also declared by account-service
        # and card-issuance-service, so left implicit all three would dead-letter into one topic
        # and every alert over it would misattribute (#5752).
        dead-letter-queue:
          topic: openbank.dlq.notification.delegation-events-in

# ADR-0155 four-eyes, opted into by opsmessage.compose (ADR-0176 D5). Default false, matching
# every other four-eyes-wired service (lending, balance, sepa-payment, sepa-instant, account) —
# the mechanism is wired here (ApprovalConfig producing a Redis-backed ApprovalStore) so it CAN
# be enforced, but flipping it is a deliberate, separate operational decision, not shipped
# enabled by this PR. Unlike lending-service's identical wiring, this one has a real Redis
# behind it in gitops (redis.yaml + QUARKUS_REDIS_HOSTS) — see issue #1354 for what happens when
# a service ships the ApprovalStore bean without that.
authz:
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
    mailer:
      mock: true
"%slack-it":
  # Activates Slack oversight webhook for OversightWebhookIT. The URL is injected at runtime
  # by the SlackMockResource test resource, which sets SLACK_WEBHOOK_URL via System property.
  # This profile extends the test profile (same DB / devservices / mailer overrides).
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_notification_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_notification_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    mailer:
      mock: true
    scheduler:
      enabled: false
    arc:
      remove-unused-beans: false
  openbank:
    notification:
      webhook:
        slack:
          enabled: true
          url: ${SLACK_WEBHOOK_URL:http://localhost:0/slack}
"%test":
  quarkus:
    # Dedicated IT Postgres on the warm CI stack (ADR-0043); CI auto-creates any
    # openbank_*_it database referenced here. Dev Services stay OFF — tests hit
    # localhost:5432 exactly as on a workstation.
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_notification_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_notification_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    # No eager token fetch at test boot: the ADR-0198 D4 consent gate's M2M client
    # (oidc-client, client_credentials) otherwise creates OidcClientImpl eagerly at
    # startup and fails the boot with "OIDC Server is not available" on the CI
    # runners, which have no Keycloak on localhost:8080. Discovery must ALSO be off —
    # NotificationConsumer is a boot-time Kafka consumer, so its @RestClient injection
    # creates OidcClientImpl at startup, and discovery is the call that connects.
    oidc-client:
      early-tokens-acquisition: false
      discovery-enabled: false
      token-path: /realms/openbank/protocol/openid-connect/token
    mailer:
      mock: true
    # Disable the @Scheduled outbox tick under test so the consumer IT never races
    # an unrelated background dispatch against its assertions.
    scheduler:
      enabled: false
openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  outbox:
    dispatch-enabled: true
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  # Outbound oversight webhook (ADR-0059). OFF by default; the URL is injected
  # from Vault via ExternalSecret (never in git). Only anonymized, allow-listed
  # oversight signals egress — see com.openbank.notification.application.OversightWebhook.
  notification:
    push-fallback:
      # #4363: a reviewed policy exists, but e-mail fallback is off until a separate GitOps
      # activation proves a real transport and address-quality gate. Never treat this as live.
      enabled: ${PUSH_FALLBACK_ENABLED:false}
    webhook:
      slack:
        enabled: ${SLACK_WEBHOOK_ENABLED:false}
        url: ${SLACK_WEBHOOK_URL:}
    # Push delivery (FCM / APNs). OFF by default — a disabled adapter records the push as a
    # successful no-op (skipped), exactly like the EMAIL stub. Credentials are injected at
    # runtime from Vault via ExternalSecret (never in git). A PUSH notification fans out to
    # every ACTIVE device token registered for the party (see device_tokens / DeviceResource).
    push:
      fcm:
        enabled: ${FCM_ENABLED:false}
        # Service-account JSON (raw or Base64). Grants the firebase.messaging scope.
        service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
        # Optional; falls back to project_id from the service-account JSON.
        project-id: ${FCM_PROJECT_ID:}
      apns:
        enabled: ${APNS_ENABLED:false}
        key-id: ${APNS_KEY_ID:}
        team-id: ${APNS_TEAM_ID:}
        bundle-id: ${APNS_BUNDLE_ID:tech.openbank.app}
        # .p8 PKCS#8 EC private key (raw PEM or Base64).
        private-key: ${APNS_PRIVATE_KEY:}
        # true → APNs sandbox host (debug builds); false → production.
        sandbox: ${APNS_SANDBOX:false}
