openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.9.0
  description: Notification delivery management — query sent/pending notifications, manage push device tokens.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8112
    description: Local development
tags:
  - name: Notifications
  - name: Devices
  - name: Ops — Dispatch Control
  - name: Operator Messages
  - name: Notification Approvals

paths:
  /api/v1/devices:
    post:
      tags: [Devices]
      summary: Register (upsert) a push device token for a party
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered (token not echoed back)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Devices]
      summary: List a party's registered devices (no tokens returned)
      operationId: listDevices
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Device list
        '400':
          description: partyId query parameter is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: Deactivate a push device token (logout / uninstall)
      operationId: deactivateDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partyId
          in: query
          required: false
          description: When supplied the UPDATE is scoped to this party's token only (customer-edge injects it from JWT).
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device deactivated
        '404':
          description: Device not found or already inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications (paginated)
      description: |
        Page through notifications, optionally narrowed to one party. Items carry metadata
        only — the rendered `body` is returned by `GET /api/v1/notifications/{id}`.
      operationId: listNotifications
      parameters:
        - name: partyId
          in: query
          description: Narrow to a single party. Omit to page the whole store.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Zero-based page index.
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size. Values outside 1..100 are clamped.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'

  /api/v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get notification by ID
      operationId: getNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications/{id}/self:
    get:
      tags: [Notifications]
      summary: Get one of the caller's own notifications (party-scoped, fetch-on-tap)
      description: >-
        Party-scoped single read for the customer app's fetch-on-tap (ADR-0135 §3, issue #1182).
        Push payloads carry no amount/PII; on tap the app loads the full notification detail here.
        The SELECT is scoped by the edge-injected partyId, so a caller can only read their own
        notification (IDOR guard). A missing or other-party id returns 404 with no existence oracle.
      operationId: getOwnNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: Missing partyId
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read (idempotent; scoped to the partyId owner)
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marked read (or already read)
        '400':
          description: Missing partyId
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all of a party's notifications as read
      operationId: markAllNotificationsRead
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Count of notifications flipped to read

  /api/v1/notifications/messages:
    post:
      tags: [Operator Messages]
      summary: Send a customer a message from a reviewed, closed catalogue of templates
      description: |
        `opsmessage.compose` (ADR-0176 D2). ROLE_OPERATOR/ROLE_ADMIN only. EMAIL only. Gated by
        `four_eyes.actions` in rules.yaml: when `AUTHZ_FOUR_EYES_ENFORCE=true`, a maker's call is
        paused with `202` and a pending-approval id; the maker retries with `X-Approval-Id` once a
        different operator decides it via `PATCH /api/v1/notifications/approvals/{id}`.
        `AUTHZ_FOUR_EYES_ENFORCE` defaults `false`, so a `201` is the common response today.
      operationId: composeOperatorMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeMessageRequest'
      responses:
        '201':
          description: Message persisted and sent (or, once four-eyes enforcement is on, approved and sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeMessageResponse'
        '202':
          description: Four-eyes enforcement is on — paused pending a different operator's approval
        '400':
          description: Unknown/missing template variables, or a malformed recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/notifications/approvals:
    get:
      tags: [Notification Approvals]
      summary: List pending four-eyes approvals, oldest first (ADR-0227 D2)
      description: |
        The checker's queue for `opsmessage.approval.decide` (issue #5679). Without it a parked
        `opsmessage.compose` decision is discoverable only by whoever was handed its approval id
        out of band, and the 24h Redis TTL then expires the request silently. ROLE_OPERATOR /
        ROLE_ADMIN only.
      operationId: listPendingNotificationApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'

  /api/v1/notifications/approvals/{id}:
    patch:
      tags: [Notification Approvals]
      summary: Approve or reject a pending four-eyes approval for an operator message
      description: |
        `opsmessage.approval.decide` (ADR-0176 D5). ROLE_OPERATOR/ROLE_ADMIN only; the checker
        must be a different operator than the maker who called `POST /api/v1/notifications/messages`.
      operationId: decideOperatorMessageApproval
      parameters:
        - name: id
          in: path
          required: true
          description: The pending-approval id returned by the paused compose call
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideApprovalRequest'
      responses:
        '200':
          description: Decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: The checker is the same operator who made the original request (self-approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No pending approval with that id
        '409':
          description: The approval is not in a decidable state (already decided or executed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/ops/dispatch:
    get:
      tags: [Ops — Dispatch Control]
      summary: Current dispatch desired-state, deferred-review flag and recent history
      operationId: getDispatchControl
      responses:
        '200':
          description: Current snapshot plus recent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchControlView'

  /api/v1/ops/dispatch/halt:
    post:
      tags: [Ops — Dispatch Control]
      summary: Break-glass — halt dispatch immediately (single actor, deferred review required)
      operationId: haltDispatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: New halted snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchControlSnapshot'

  /api/v1/ops/dispatch/resume/propose:
    post:
      tags: [Ops — Dispatch Control]
      summary: Propose a resume (four-eyes — a different actor must approve)
      operationId: proposeResume
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '202':
          description: Proposal accepted, awaiting a second actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'

  /api/v1/ops/dispatch/resume/{proposalId}/approve:
    post:
      tags: [Ops — Dispatch Control]
      summary: Approve and execute a resume (approver must differ from proposer)
      operationId: approveResume
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: New enabled snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchControlSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Four-eyes violation (approver equals proposer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/ops/dispatch/resume/{proposalId}/reject:
    post:
      tags: [Ops — Dispatch Control]
      summary: Reject a pending resume proposal
      operationId: rejectResume
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Rejected proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    NotificationSummary:
      type: object
      description: Notification metadata, as returned by the list endpoint. Carries no rendered body.
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        template:
          type: string
          description: Template enum name the body was rendered from.
        recipient:
          type: string
          description: Email address, phone number, or — for PUSH — the party id (delivery is by registered device token).
        subject:
          type: string
          description: |
            Rendered subject. Always present: every write path renders one, even though the
            column and entity permit NULL. If a path ever yields NULL, that IS a breaking
            contract change and takes the major bump — do not quietly add `nullable` here.
        status:
          $ref: '#/components/schemas/NotificationStatus'
        sentAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the customer marked it read. Null = unread.
        createdAt:
          type: string
          format: date-time

    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSummary'
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    NotificationResponse:
      type: object
      description: |
        A single notification, including its rendered body. Same fields as
        NotificationSummary plus `body` — kept flat rather than composed with `allOf`,
        because oasdiff does not flatten composition and reports every inherited field
        as removed, which makes the API-contract diff unreadable.
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        template:
          type: string
          description: Template enum name the body was rendered from.
        recipient:
          type: string
          description: Email address, phone number, or — for PUSH — the party id (delivery is by registered device token).
        subject:
          type: string
          description: |
            Rendered subject. Always present: every write path renders one, even though the
            column and entity permit NULL. If a path ever yields NULL, that IS a breaking
            contract change and takes the major bump — do not quietly add `nullable` here.
        body:
          type: string
          description: |
            The rendered message body. For secret-bearing templates (OTP_CODE,
            PASSWORD_RESET) this is a redaction placeholder, never the delivered
            secret — the secret is sent to the customer but never stored.
        status:
          $ref: '#/components/schemas/NotificationStatus'
        sentAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the customer marked it read. Null = unread.
        createdAt:
          type: string
          format: date-time

    NotificationChannel:
      type: string
      enum: [EMAIL, PUSH]

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED, BOUNCED]
      description: |
        Delivery state. Read-state is tracked separately by `readAt`, not by this field.
        BOUNCED is declared by the domain model but not currently assigned by any code path.

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    RegisterDeviceRequest:
      type: object
      required: [partyId, platform, token, appInstance]
      properties:
        partyId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [FCM, APNS]
        token:
          type: string
          description: Provider-issued push token (FCM registration / APNs device token)
        appInstance:
          type: string
          description: Stable per-install identifier
        appVersion:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true

    DeviceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [FCM, APNS]
        appInstance:
          type: string
        appVersion:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, INVALID]
        registeredAt:
          type: string
          format: date-time
          description: When the party first bound this device (immutable; set once on initial registration).
        refreshedAt:
          type: string
          format: date-time
          nullable: true
          description: When the mobile app last called POST /api/v1/devices (foreground refresh). Null for tokens migrated from V6 that have not yet been refreshed post-deploy.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true

    DispatchControlSnapshot:
      type: object
      properties:
        controlKey:
          type: string
        state:
          type: string
          enum: [ENABLED, HALTED]
        version:
          type: integer
          format: int64
        reason:
          type: string
          nullable: true
        actor:
          type: string
          nullable: true
        effectiveFrom:
          type: string
          format: date-time
        deferredReviewRequired:
          type: boolean

    DispatchControlView:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/DispatchControlSnapshot'
        history:
          type: array
          items:
            $ref: '#/components/schemas/DispatchControlSnapshot'

    ProposalView:
      type: object
      properties:
        proposalId:
          type: string
        state:
          type: string
          enum: [PROPOSED, APPROVED, REJECTED, WITHDRAWN, EXECUTED]

    OperatorMessageTemplate:
      type: string
      description: |
        The closed set of messages an operator may send (ADR-0176 D2). Deliberately not
        NotificationTemplate — see OperatorMessageTemplate's own KDoc for why: some
        NotificationTemplate constants feed the ADR-0059 oversight webhook, and reusing that
        enum here would let an operator raise a false lifecycle alert.
      enum: [GENERIC_NOTICE, SUPPORT_FOLLOWUP]

    ComposeMessageRequest:
      type: object
      required: [partyId, template, recipient]
      properties:
        partyId:
          type: string
          format: uuid
        template:
          $ref: '#/components/schemas/OperatorMessageTemplate'
        recipient:
          type: string
          description: Email address. Must be well-formed; rejected with 400 otherwise.
        variables:
          type: object
          additionalProperties:
            type: string
          description: |
            Must exactly match the chosen template's declared variable set — GENERIC_NOTICE
            needs {subject, note}, SUPPORT_FOLLOWUP needs {ticketReference}. Extra or missing
            keys are both rejected with 400.

    ComposeMessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The new notification's id.

    DecideApprovalRequest:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean

    ApprovalResponse:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        resourceId:
          type: string
          nullable: true
        status:
          type: string
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        decidedBy:
          type: string
          nullable: true
