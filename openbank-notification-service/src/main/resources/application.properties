# #10281: Kafka consumer identity for the approval-events-in channel, baked into the image.
#
# These keys contain a literal dot (group.id, auto.offset.reset), and application.yaml cannot carry
# them: SmallRye's YAML source quotes such a leaf key, registering `..."group.id"`, which the Kafka
# connector never reads (issue #686). The fleet's usual answer is the gitops msg-override
# ConfigMap, but a ConfigMap naming a channel the running image cannot serve is an SRMSG00071 boot
# failure (msg-channel-image-parity), so it can only follow a deploy — and until then the channel
# would run under the connector's default group, which the KafkaUser ACL does not grant, i.e.
# consume nothing while reporting healthy. A properties source has no quoting problem and ships in
# the same image as the channel, so the first deployed image consumes. The msg-override ConfigMap
# (config_ordinal=500) still outranks this file (250) if an environment ever needs to override it.
#
# `earliest` is safe: the topic is new, and every notification is deduplicated on
# (eventId, recipient), so a replay creates no second inbox row or push.
mp.messaging.incoming.approval-events-in.group.id=notification-service-approval
mp.messaging.incoming.approval-events-in.client.id=notification-service-approval-${quarkus.uuid}
mp.messaging.incoming.approval-events-in.auto.offset.reset=earliest
