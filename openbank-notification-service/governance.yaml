# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: platform
primaryDatastore: PostgreSQL
databaseName: openbank_notifications
dataLineageRole: consumer
dataClassification: confidential
retentionPolicy: 2 years
evidenceExported: false
lineage:
  upstream: []
    # Removed (issue #3982): `transaction-service (topic, "events")` and
    # `kyc-service (topic, "events")`. notification-service consumes exactly two topics —
    # openbank.notification.requests and openbank.party.events — and neither of those is
    # produced by transaction-service (openbank.transactions.transaction.initiated) or
    # kyc-service (openbank.kyc.events). No overlap in either direction.
  downstream:
    # Direction corrected (issue #3982): declared as `upstream: consent-service`, i.e.
    # consent-service calling notification-service. ConsentServiceClient(configKey =
    # "consent-service") lives in notification-service, and notification-service's Deployment
    # env carries CONSENT_SERVICE_URL. Real edge, declared backwards.
    - serviceName: consent-service
      relationType: api
      description: per-send marketing consent check (ADR-0198 D4)
databaseLineage:
  ownedDatabases:
    - openbank_notifications
