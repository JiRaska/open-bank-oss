quarkus:
  application:
    name: openbank-domestic-payment
  http:
    port: 8116
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_domestic_payments
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_domestic_payments
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token (ADR-0104 D3 / Bug #3): the rest-clients (sanctions, aml,
  # fraud, clearing-simulator) mint an openbank-services M2M token via this oidc-client. Without
  # it the default client is "not initialized" → no Authorization header → downstream 401 (the
  # scheme submission held every payment in VALIDATED). Reuses the resource-server's keycloak URL,
  # client id and secret. Disabled under %test; the IT enables + stubs it, units use a producer.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    sanctions-service:
      url: ${SANCTIONS_SERVICE_URL:http://localhost:8123}
      scope: jakarta.inject.Singleton
    aml-service:
      url: ${AML_SERVICE_URL:http://localhost:8117}
      scope: jakarta.inject.Singleton
    fraud-service:
      url: ${FRAUD_SERVICE_URL:http://localhost:8133}
      scope: jakarta.inject.Singleton
    clearing-simulator:
      url: ${CLEARING_SIMULATOR_URL:http://localhost:8139}
      scope: jakarta.inject.Singleton
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
      scope: jakarta.inject.Singleton
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://account-service.accounts.svc:8100}
      scope: jakarta.inject.Singleton
  redis:
    hosts: redis://localhost:6379
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}"
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-domestic-payment
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137). These connector-wide Kafka client props
    # apply to every smallrye-kafka channel. Defaults keep local dev/test on
    # PLAINTEXT (empty keystore paths are ignored when protocol=PLAINTEXT);
    # the payments Rollout sets the KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      events-out:
        connector: smallrye-kafka
        client.id: domestic-payment-${quarkus.uuid}
        topic: openbank.domestic.payment.events
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    management:
      enabled: false
    devservices:
      enabled: false
  openbank:
    domestic:
      # No real Temporal frontend in @QuarkusTest: don't register the worker (it would fail boot on
      # UNAVAILABLE). Tests that need the workflow drive their own in-process TestWorkflowEnvironment.
      worker:
        enabled: false
openbank:
  bank:
    bic: ${OPENBANK_BIC:OPBKCZ22}
    bank-code: ${OPENBANK_BANK_CODE:2000}
  domestic:
    # #3266: re-screen payments left holding on an unavailable sanctions check. Enabled by default
    # because it only re-runs the designed flow — it re-screens, it never releases.
    screening-redrive:
      enabled: ${DOMESTIC_SCREENING_REDRIVE_ENABLED:true}
      interval: 15m
      initial-delay: 2m
      max-attempts: 5
      min-age-minutes: 10
      batch-limit: 20
    scheme-submission:
      # ADR-0104 D4 Czech clearing pilot. OFF by default; when off, behaviour is exactly as before.
      enabled: ${DOMESTIC_SCHEME_SUBMISSION_ENABLED:false}
    fraud:
      # ADR-0084 §4.2: flips the fraud verdict from SHADOW (observed, logged, ignored) to
      # ENFORCED (REVIEW/CHALLENGE hold the payment for manual release; DECLINE rejects it).
      # OFF by default — a deliberate runbook-gated rollout flip, same convention as the
      # four-eyes `enforce` toggle below. ALLOW always validates regardless of this flag.
      enforcement-enabled: ${DOMESTIC_FRAUD_ENFORCEMENT_ENABLED:false}
  temporal:
    enabled: false
    server-url: temporal-frontend.temporal.svc.cluster.local:7233
    namespace: openbank-payments
    task-queue: openbank-domestic-payments
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  resilience:
    circuit-breaker:
      enabled: true
      request-volume-threshold: 15
      failure-ratio: 0.5
      success-threshold: 5
      delay-ms: 10000
    retry:
      enabled: true
      max-retries: 3
      delay-ms: 500
      jitter-ms: 200
    timeout:
      enabled: true
      value-ms: 15000
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second
  # approver), independent of the base allow/deny enforce toggle above. Stays false
  # here — the ApprovalStore/endpoint are wired and tested, but blocking is a
  # deliberate follow-up flip, not bundled with this PR.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
