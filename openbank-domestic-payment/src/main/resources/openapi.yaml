openapi: 3.1.0
info:
  title: Domestic Payment Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.5 -> 1.6): additive
  # machine-readable 409 for unsafe Idempotency-Key reuse. No request/response field was removed.
  version: 1.7.0
  description: >-
    Czech domestic payment lifecycle (CZ-specific rails, SIPO). On create, debtor and creditor names
    are synchronously screened against the sanctions lists (ADR-0032): a clean payment is returned
    VALIDATED, a sanctions hit is returned REJECTED (SANCTIONS_HIT) with an AML case opened, and a
    sub-threshold potential hit or a screening-service outage holds the payment in RECEIVED for review
    (fail-closed).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8116
    description: Local development
tags:
  - name: Domestic Payments

paths:
  /api/v1/domestic-payments:
    post:
      tags: [Domestic Payments]
      summary: Create a domestic payment
      description: >-
        Idempotency is authoritative in Postgres, atomically with the payment and its outbox event.
        An exact retry by the same authenticated actor returns the existing payment with
        X-Idempotency-Replayed=true. Reusing the key for a different normalized payment command,
        actor scope, delegation or reservation is refused with 409 IDEMPOTENCY_KEY_REUSED. A
        pre-upgrade row without a durable request fingerprint also fails closed with that response.
      operationId: createDomesticPayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomesticPaymentRequest'
      responses:
        '201':
          description: Payment created, or the durable result of an exact request replay
          headers:
            X-Idempotency-Replayed:
              description: Present and true only when this response replays an existing payment.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomesticPaymentResponse'
        '409':
          description: Idempotency-Key is already bound to a different or unverifiable legacy request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflictResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Domestic Payments]
      summary: List domestic payments
      operationId: listDomesticPayments
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: debtorAccountId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomesticPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/domestic-payments/{paymentId}:
    get:
      tags: [Domestic Payments]
      summary: Get domestic payment by ID
      operationId: getDomesticPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomesticPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/domestic-payments/{paymentId}/confirmation:
    get:
      tags: [Domestic Payments]
      summary: Download the payment confirmation document (ADR-0248) — customer-request-only, synchronous, never persisted
      description: >-
        Renders on demand from the payment's own persisted status record via document-service's
        non-persisting preview endpoint (ADR-0248 #3). Only available once the payment has reached
        SETTLED — a payment in any other status answers 409.
      operationId: getDomesticPaymentConfirmation
      parameters:
        - $ref: '#/components/parameters/paymentId'
        - name: lang
          in: query
          description: '`en` for the English template; anything else (including omitted) renders the Czech one.'
          schema:
            type: string
      responses:
        '200':
          description: Rendered confirmation HTML
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Payment has not reached SETTLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: document-service unreachable or has no PUBLISHED confirmation template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/domestic-payments/{paymentId}/status:
    patch:
      tags: [Domestic Payments]
      summary: Transition payment status
      operationId: transitionDomesticPaymentStatus
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStatusRequest'
      responses:
        '200':
          description: Updated payment
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/domestic-payments/approvals:
    get:
      tags: [Domestic Payments]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id.
      description: >-
        PENDING maker-checker approvals on `domestic-payment.transitionStatus`, oldest first. The
        read side of the unified approval inbox — deciding stays on
        PATCH /api/v1/domestic-payments/approvals/{id}. Requires ROLE_OPERATOR, ROLE_ADMIN or
        ROLE_PAYMENTS.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/domestic-payments/approvals/{id}:
    patch:
      tags: [Domestic Payments]
      summary: Approve or reject a pending four-eyes approval for a domestic payment (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: >-
            The caller is the maker of this approval. Segregation of duties is enforced in
            RedisApprovalStore.decide, not per-service.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateDomesticPaymentRequest:
      type: object
      # Property names and optionality mirror the DTO the resource deserializes into
      # (CreateDomesticPaymentRequest in DomesticPaymentDtos.kt). Before #8828 this schema
      # published currencyCode and message, neither of which exists on that DTO, and omitted
      # nine DTO properties including the non-nullable debtorAccountNumber, debtorBankCode,
      # debtorName, creditorName and priority — so a client generated from this document could
      # not create a domestic payment at all.
      required: [debtorAccountId, debtorAccountNumber, debtorBankCode, debtorName,
                 creditorAccountNumber, creditorBankCode, creditorName, amount, currency, priority]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        debtorAccountNumber:
          type: string
        debtorBankCode:
          type: string
          example: "0800"
        debtorName:
          type: string
        creditorAccountNumber:
          type: string
        creditorBankCode:
          type: string
          example: "0100"
        creditorName:
          type: string
        amount:
          type: number
        currency:
          type: string
          example: CZK
        variableSymbol:
          type: string
        specificSymbol:
          type: string
        constantSymbol:
          type: string
        messageForPayee:
          type: string
        priority:
          type: string
        transferScope:
          type: string
        technicalAccountCode:
          type: string
        statementLabel:
          type: string
        endToEndId:
          type: string

    TransitionStatusRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus:
          type: string
        reason:
          type: string

    DomesticPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        debtorAccountId:
          type: string
          format: uuid
        creditorAccountNumber:
          type: string
        creditorBankCode:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
        variableSymbol:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    IdempotencyConflictResponse:
      type: object
      required: [type, title, status, detail, code, error]
      properties:
        type:
          type: string
          enum: ['urn:openbank:error:idempotency-key-reused']
        title:
          type: string
          enum: [Idempotency key reused]
        status:
          type: integer
          enum: [409]
        detail:
          type: string
        code:
          type: string
          enum: [IDEMPOTENCY_KEY_REUSED]
        error:
          type: string

    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the gated
        action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide, so the
        queue is readable by anyone who may decide, including the maker (seeing a request is not
        authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: domestic-payment.transitionStatus
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
