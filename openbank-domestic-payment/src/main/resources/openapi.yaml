openapi: 3.1.0
info:
  title: Domestic Payment Service API
  version: 1.2.0
  description: >-
    Czech domestic payment lifecycle (CZ-specific rails, SIPO). On create, debtor and creditor names
    are synchronously screened against the sanctions lists (ADR-0032): a clean payment is returned
    VALIDATED, a sanctions hit is returned REJECTED (SANCTIONS_HIT) with an AML case opened, and a
    sub-threshold potential hit or a screening-service outage holds the payment in RECEIVED for review
    (fail-closed).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8109
    description: Local development
tags:
  - name: Domestic Payments

paths:
  /api/v1/domestic-payments:
    post:
      tags: [Domestic Payments]
      summary: Create a domestic payment
      operationId: createDomesticPayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomesticPaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomesticPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Domestic Payments]
      summary: List domestic payments
      operationId: listDomesticPayments
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: debtorAccountId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomesticPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/domestic-payments/{paymentId}:
    get:
      tags: [Domestic Payments]
      summary: Get domestic payment by ID
      operationId: getDomesticPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomesticPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/domestic-payments/{paymentId}/status:
    patch:
      tags: [Domestic Payments]
      summary: Transition payment status
      operationId: transitionDomesticPaymentStatus
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStatusRequest'
      responses:
        '200':
          description: Updated payment
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/domestic-payments/approvals/{id}:
    patch:
      tags: [Domestic Payments]
      summary: Approve or reject a pending four-eyes approval for a domestic payment (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                type: object
                required: [id, action, status]
                properties:
                  id:
                    type: string
                  action:
                    type: string
                    description: The gated action this approval was raised for.
                  resourceId:
                    type: string
                    nullable: true
                  status:
                    type: string
                  decidedBy:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateDomesticPaymentRequest:
      type: object
      required: [debtorAccountId, creditorAccountNumber, creditorBankCode, amount, currencyCode]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        creditorAccountNumber:
          type: string
        creditorBankCode:
          type: string
          example: "0100"
        amount:
          type: number
        currencyCode:
          type: string
          example: CZK
        variableSymbol:
          type: string
        specificSymbol:
          type: string
        constantSymbol:
          type: string
        message:
          type: string

    TransitionStatusRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus:
          type: string
        reason:
          type: string

    DomesticPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        debtorAccountId:
          type: string
          format: uuid
        creditorAccountNumber:
          type: string
        creditorBankCode:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
        variableSymbol:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
