openapi: 3.1.0
info:
  title: Domestic Payment Service API
  version: 1.1.0
  description: >-
    Czech domestic payment lifecycle (CZ-specific rails, SIPO). On create, debtor and creditor names
    are synchronously screened against the sanctions lists (ADR-0032): a clean payment is returned
    VALIDATED, a sanctions hit is returned REJECTED (SANCTIONS_HIT) with an AML case opened, and a
    sub-threshold potential hit or a screening-service outage holds the payment in RECEIVED for review
    (fail-closed).
  license:
    name: MPL-2.0
    url: https://www.mozilla.org/MPL/2.0/
servers:
  - url: http://localhost:8109
    description: Local development
tags:
  - name: Domestic Payments

paths:
  /api/v1/domestic-payments:
    post:
      tags: [Domestic Payments]
      summary: Create a domestic payment
      operationId: createDomesticPayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomesticPaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomesticPaymentResponse'
    get:
      tags: [Domestic Payments]
      summary: List domestic payments
      operationId: listDomesticPayments
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: debtorAccountId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomesticPaymentResponse'

  /api/v1/domestic-payments/{paymentId}:
    get:
      tags: [Domestic Payments]
      summary: Get domestic payment by ID
      operationId: getDomesticPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomesticPaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/domestic-payments/{paymentId}/status:
    patch:
      tags: [Domestic Payments]
      summary: Transition payment status
      operationId: transitionDomesticPaymentStatus
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStatusRequest'
      responses:
        '200':
          description: Updated payment

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateDomesticPaymentRequest:
      type: object
      required: [debtorAccountId, creditorAccountNumber, creditorBankCode, amount, currencyCode]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        creditorAccountNumber:
          type: string
        creditorBankCode:
          type: string
          example: "0100"
        amount:
          type: number
        currencyCode:
          type: string
          example: CZK
        variableSymbol:
          type: string
        specificSymbol:
          type: string
        constantSymbol:
          type: string
        message:
          type: string

    TransitionStatusRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus:
          type: string
        reason:
          type: string

    DomesticPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        debtorAccountId:
          type: string
          format: uuid
        creditorAccountNumber:
          type: string
        creditorBankCode:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
        variableSymbol:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
