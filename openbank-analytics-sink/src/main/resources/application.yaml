quarkus:
  application:
    name: openbank-analytics-sink
    # PRE-EXISTING ISSUE, out of scope for this fix (Refs #686): this repo's convention is to
    # NEVER set quarkus.application.version explicitly — it should derive from version.txt at
    # build time via the Quarkus Gradle plugin (enforced fleet-wide for released components by
    # check-app-version-override.sh). This service has no version.txt yet (not a released
    # component — see build.gradle.kts `version = "0.1.0-SNAPSHOT"`), so there is nothing to
    # derive from; deleting this line now would leave the value undefined rather than fix
    # anything. Resolve this when the service is registered as a released component
    # (release-please-config.json + .release-please-manifest.json) by deleting this key.
    version: 0.1.0
  http:
    port: 8134
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  # NOTE: no datasource / flyway / hibernate blocks. This service owns no OLTP database
  # (ADR-0022). Its store of record is the analytics warehouse, written through the
  # AnalyticsSink port. The default LoggingAnalyticsSink needs no external system, so the
  # service boots and is testable with zero infra.
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-analytics-sink
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8086
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    incoming:
      analytics-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.analytics-sink.analytics-events-in
        connector: smallrye-kafka
        client.id: analytics-sink-${quarkus.uuid}
        # Same domain-event topics the audit service ingests. The analytics layer is fed
        # from the existing outbox stream (ADR-0003) — it is NOT a second extraction path
        # (no Debezium/WAL CDC), so it adds no read load on the operational databases.
        # Domain-event topics feeding analytics. party/kyc/consent already cover most of the onboarding
        # lifecycle; sca.events (DEVICE_ENROLLED) and documents.document.event (framework-agreement
        # signed) close the funnel's tail, and onboarding.funnel.events carries the pre-session client
        # steps (welcome/identity/email/consent) that no domain event can see. See admin cockpit funnel.
        # feedback.events (ADR-0192) is the qualitative counterpart to the funnel: the funnel says
        # WHERE users struggle, screen feedback says WHY. Metadata only — the screenshot stays in
        # object storage and only its key rides on the event.
        # engagement.events closes campaign attribution from accepted PUSH handoff to the app's
        # observed impression/click/dismiss/conversion signal. Campaign ids in this stream are
        # resolved by campaign-service from an opaque interactionRef, never trusted from the app.
        # credit.funnel.events (ADR-0269 rule 8) is the credit-journey counterpart of the
        # onboarding funnel, and a SEPARATE topic on purpose: the onboarding stream is written from
        # an anonymous public endpoint, these events only from an authenticated request. Keep them
        # separate downstream too — unioning them would give the anonymous stream's trust level to
        # the credit one.
        # lending.events (#8893) is the credit LIFECYCLE stream, and is not the same thing as
        # credit.funnel.events above: the funnel is what a customer did on the way to applying,
        # this is what the bank decided and what the book then did — engine outcome with its
        # ADR-0213 evidence, disbursement, IFRS 9 staging, ECL. It is the source V14's marts read;
        # before this line they were views over an aggregate_type that had never arrived.
        # Its events name their own aggregateType/aggregateId (#8928), which is a PRECONDITION,
        # not a detail: without it the consumer falls back to the topic (LENDING for every type)
        # and then to `?: accountId ?: partyId` for the id, so six of the eleven types would land
        # keyed by the BORROWER and silver_current_state would collapse every loan of one customer
        # into a single aggregate.
        # Every topic here also needs a Read ACL on the analytics-sink KafkaUser
        # (openbank-infra/gitops/components/analytics/kafka-analytics-sink-mtls.yaml).
        # kyb.events (ADR-0284 D8) is the business half of the customer graph: which legal
        # entities exist, who is authorised to act for them, and how far each case got. It is what
        # lets Customer 360 see that a personal customer also runs two companies — the connection
        # the ADR is for. The payload's signerName and legalName are masked by PayloadMasker: a
        # company name is not personal data, but a SOLE TRADER's legal name IS their own name, and
        # no field-name-keyed rule can tell the two apart. The identifier stays in the clear, so
        # nothing analytics needs is lost.
        topics: openbank.accounts.account.created,openbank.transactions.transaction.initiated,openbank.balance.events,openbank.party.events,openbank.kyc.events,openbank.consent.events,openbank.sca.events,openbank.documents.document.event,openbank.onboarding.funnel.events,openbank.feedback.events,openbank.engagement.events,openbank.credit.funnel.events,openbank.lending.events,openbank.kyb.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
        # openbank-fraud-service's application.yaml / openbank-anacredit-service's
        # application.yaml for the reference wording (Refs #686). Summary: SmallRye Config's
        # YAML source unconditionally quotes any leaf map key containing a literal dot
        # (`group.id` becomes the registered property name `"group.id"`, quotes included —
        # true whether or not the YAML key itself is quoted), so
        # KafkaConnectorIncomingConfiguration's plain config.getOptionalValue("group.id", ...)
        # never finds it. group.id then silently falls back to Quarkus's default
        # (quarkus.application.name), and auto.offset.reset silently falls back to Kafka's
        # client default (latest) instead of earliest — a consumer would silently skip
        # backlogged messages on first boot.
        #
        # Both keys ARE set — from the deployed manifest, not from this file. The
        # analytics-sink-msg-override ConfigMap in
        # openbank-infra/gitops/components/analytics/analytics-sink.yaml carries them in its
        # override.properties, mounted at /mnt/msg-config and loaded via the container's
        # QUARKUS_CONFIG_LOCATIONS env var (a properties source, so no dot-quoting):
        #   mp.messaging.incoming.analytics-events-in.group.id=analytics-sink
        #   mp.messaging.incoming.analytics-events-in.auto.offset.reset=earliest
        # Same ConfigMap/mount/env-var structure as onboarding-service
        # (openbank-infra/gitops/components/onboarding/onboarding-service-msg-override.yaml)
        # and the other services in the #686 sweep. Change either value THERE, not here.
        # (Separately: this service still has no version.txt and is absent from
        # release-please-config.json — it is deployed, but not a released component.)
        # Do NOT set these via
        # MP_MESSAGING_INCOMING_ANALYTICS_EVENTS_IN_* env vars — SmallRye's env-var
        # reverse-mapping is ambiguous for hyphenated channel names like
        # analytics-events-in and can crash at boot (quarkusio/quarkus#30106,
        # smallrye/smallrye-reactive-messaging#2028; this was tried and reverted for
        # fraud-service, PR #685 -> #698). Do not re-add them as dotted YAML keys either —
        # that reintroduces this exact bug.

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    management:
      enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  analytics:
    # Selects the AnalyticsSink binding at BUILD time. Default (unset) keeps the offline,
    # zero-infra LoggingAnalyticsSink (@Default). Set to "clickhouse" to activate the durable
    # ClickHouseAnalyticsSink (@Alternative @Priority(100)), which writes bronze over the
    # ClickHouse HTTP interface using the config below.
    sink:
      type: ${ANALYTICS_SINK_TYPE:}
    # ClickHouse target for the bronze layer. Consumed by ClickHouseAnalyticsSink when
    # openbank.analytics.sink.type=clickhouse. The default LoggingAnalyticsSink ignores these.
    clickhouse:
      url: ${CLICKHOUSE_URL:http://localhost:8123}
      database: ${CLICKHOUSE_DB:openbank_analytics}
      username: ${CLICKHOUSE_USER:analytics}
      password: ${CLICKHOUSE_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # The bronze layer is the log of record; it MUST be retained at least this long
    # (mirrors AnalyticsRetention.BRONZE_MINIMUM). The ClickHouse TTL is set to match.
    bronze-retention-years: 10
    reconcile:
      # Periodic OLTP-vs-warehouse drift check. Cron, not fixed-rate, so it runs off-peak and
      # never competes with customer traffic. Compares per-aggregate max(version) on both sides.
      cron: ${ANALYTICS_RECONCILE_CRON:0 30 2 * * ?}
      source:
        # Selects the OLTP source-side reader at BUILD time (ADR-0026). Default (unset) keeps the
        # offline @Default NoOpReconciliationSource, so reconciliation runs warehouse-only with zero
        # infra (no regression). Set to "http" to activate HttpReconciliationSource, which fans out to
        # each service's role-gated /api/v1/analytics/reconciliation-summary endpoint over the JDK
        # HttpClient (no new dependency). Phase 0 leaves this unset.
        backend: ${ANALYTICS_RECONCILE_SOURCE_BACKEND:}
        # Comma-separated service=baseUrl pairs the http source fans out to (used only when
        # source.backend=http). Add a service as it implements the contract (phased rollout, ADR-0026
        # §D6). Example: account=http://openbank-account-service:8081,balance=http://openbank-balance-service:8082
        endpoints: ${ANALYTICS_RECONCILE_SOURCE_ENDPOINTS:}
    backfill:
      # Window size a (possibly multi-year) reload is split into, so each chunk is restartable and
      # each warehouse insert is a sane size. ISO-8601 duration.
      chunk: ${ANALYTICS_BACKFILL_CHUNK:PT24H}
    schema:
      # Selects the SchemaCatalogSource at BUILD time. Default (unset) = the config catalogue below.
      # Set to "apicurio" to load the catalogue from the Apicurio registry (ApicurioSchemaCatalogSource).
      backend: ${ANALYTICS_SCHEMA_BACKEND:}
      # Schema governance (F7). Comma-separated eventType:maxVersion the sink accepts. Empty = gate
      # open (accept all, backwards-compatible). Used by the default (config) catalogue source.
      known: ${ANALYTICS_SCHEMA_KNOWN:}
      # When true, an unknown/newer-than-known schema is quarantined to the DLQ instead of written.
      strict: ${ANALYTICS_SCHEMA_STRICT:false}
      # Apicurio registry coordinates (used only when schema.backend=apicurio). Provisioned in
      # openbank-infra by the `apicurio` ArgoCD Application as Service `apicurio-registry` on port
      # 8080 in namespace `messaging` (gitops/components/apicurio/registry.yaml). group is the
      # Apicurio artifact group.
      #
      # This previously read "service schema-registry:8081" and defaulted to
      # http://localhost:8081 — wrong host AND wrong port, in the prose and in the value. Nothing
      # could have said so: a unit test stubs the catalogue source and the IT serves a local
      # fixture, so an in-cluster hostname is unfalsifiable by every test layer here (the same
      # shape as the fx-service CNB URL that was a 404 for the life of the service). The value is
      # now checked by .github/scripts/check-incluster-hostnames.py, which resolves it against the
      # Services gitops actually declares (issue #1916).
      apicurio:
        url: ${ANALYTICS_SCHEMA_APICURIO_URL:http://apicurio-registry.messaging.svc:8080}
        group: ${ANALYTICS_SCHEMA_APICURIO_GROUP:default}
    erasure:
      # Selects the CryptoErasure backend at BUILD time. Default (unset) = NoOpCryptoErasure (logs).
      # Set to "vault" to crypto-shred via Vault Transit key destruction (VaultCryptoErasure, F6).
      backend: ${ANALYTICS_ERASURE_BACKEND:}
    vault:
      # Vault coordinates for crypto-shredding (used only when erasure.backend=vault). Provisioned in
      # openbank-infra as service vault:8200 (dev). The Transit engine must be enabled (see
      # docker/openbao/init/init.sh) and the token must allow transit key config + delete.
      url: ${ANALYTICS_VAULT_URL:http://localhost:8200}
      token: ${ANALYTICS_VAULT_TOKEN:}
      transit-mount: ${ANALYTICS_VAULT_TRANSIT_MOUNT:transit}
      key-prefix: ${ANALYTICS_VAULT_KEY_PREFIX:analytics}
    worm:
      # Selects the authoritative WormArchive backend at BUILD time (F2). Default (unset) keeps the
      # operator-mutable ClickHouse mirror (when sink.type=clickhouse) or LoggingWormArchive. Set to
      # "s3" to seal integrity anchors into an S3 Object Lock (COMPLIANCE) bucket — immutable even to
      # root until retention expires. Targets the S3 API standard (AWS S3 in prod); deliberately NOT
      # MinIO (community edition archived/abandoned in 2026) and not a local emulator (none faithfully
      # enforce Object Lock), so this gate is left unset in dev.
      backend: ${ANALYTICS_WORM_BACKEND:}
      s3:
        # Path-style S3 endpoint, region and Object-Lock-enabled bucket. Credentials should be a
        # narrowly-scoped key that may PutObject (with retention) but NOT bypass governance retention.
        # Region is the estate region (ADR-0175 §Decision 1: eu-north-1); every bucket in the account
        # is eu-north-1, and nothing overrides these in gitops (issue #3962).
        endpoint: ${ANALYTICS_WORM_S3_ENDPOINT:https://s3.eu-north-1.amazonaws.com}
        region: ${ANALYTICS_WORM_S3_REGION:eu-north-1}
        bucket: ${ANALYTICS_WORM_S3_BUCKET:openbank-analytics-worm}
        access-key: ${ANALYTICS_WORM_S3_ACCESS_KEY:}
        secret-key: ${ANALYTICS_WORM_S3_SECRET_KEY:}
        # Retention applied per sealed anchor; must be >= the bronze minimum (10y) it protects.
        retention-years: ${ANALYTICS_WORM_S3_RETENTION_YEARS:10}
    health:
      # Readiness goes DOWN above these thresholds (F8 / DORA RPO). Lag = now - event.occurredAt.
      max-lag-seconds: ${ANALYTICS_MAX_LAG_SECONDS:900}
      max-dead-letters: ${ANALYTICS_MAX_DEAD_LETTERS:100}
    residency:
      # Data residency guard checked at startup (F9 / GDPR Art. 44). Boot aborts if region not allowed.
      # eu-north-1 is the estate region decided by ADR-0175 §Decision 1 (NOT by any README — §Decision 2
      # explicitly rejects the eu-central-1 pin openbank-infra/aws/README.md infers from ADR-0027).
      # These two defaults previously said eu-central-1 / [eu-central-1, eu-west-1], which made the only
      # bootable configuration one that misstates the region: the guard logged "data residency OK:
      # region=eu-central-1" for a warehouse in eu-north-1, and setting the region truthfully aborted
      # boot because eu-north-1 was not on the allow-list (issue #3962).
      region: ${ANALYTICS_RESIDENCY_REGION:eu-north-1}
      allowed: ${ANALYTICS_RESIDENCY_ALLOWED:eu-north-1}
      enforce: ${ANALYTICS_RESIDENCY_ENFORCE:true}
