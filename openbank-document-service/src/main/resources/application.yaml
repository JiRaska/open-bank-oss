quarkus:
  application:
    name: openbank-document-service
  http:
    port: 8143
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_documents
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_documents
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token (ADR-0162 D4): ScaVerificationAdapter's REST client mints an
  # openbank-services M2M token via this oidc-client so sca-service's GET challenge endpoint accepts
  # the call. Disabled under %test (unit tests mock SignerVerificationPort directly).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    sca-service:
      url: ${SCA_SERVICE_URL:http://localhost:8121}
      scope: jakarta.inject.Singleton
    product-catalog-api:
      url: ${PRODUCT_CATALOG_SERVICE_URL:http://localhost:8104}
      connect-timeout: 3000
      read-timeout: 5000
    # Fill the RAMCOVA_SMLOUVA template's {{party.*}}/{{account.*}}/{{product.*}} clauses at
    # sign time — was `data = emptyMap()` on every render, so a real signed contract read
    # "(the "Customer")" with a blank address. Fail-open (PartyAdapter/AccountAdapter): an
    # outage degrades the render, never blocks the signature.
    party-service-api:
      url: ${PARTY_SERVICE_URL:http://localhost:8111}
      connect-timeout: 3000
      read-timeout: 5000
    account-service-api:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8100}
      connect-timeout: 3000
      read-timeout: 5000
  redis:
    hosts: redis://localhost:6379
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-document-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8088
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
  openbank:
    signature:
      # No organizational keystore locally, so the seal falls back to a throwaway cert. Allow it —
      # a dev seal is not evidence of anything and nobody is relying on it (ADR-0172 D2).
      allow-ephemeral-seals: true
"%test":
  quarkus:
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    management:
      enabled: false
  openbank:
    signature:
      allow-ephemeral-seals: true
openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s
  # ADR-0161: shared ObjectStorePort backend selection. postgres is the default/dev/test adapter
  # (BYTEA table, see V4__add_object_store_blobs.sql); s3 is the production adapter.
  objectstore:
    backend: ${OBJECTSTORE_BACKEND:postgres}
    s3:
      bucket: ${OBJECTSTORE_S3_BUCKET:openbank-documents-dev}
      region: ${OBJECTSTORE_S3_REGION:eu-central-1}
      # endpoint-override deliberately NOT declared here: it's an Optional<String> on the shared
      # S3ObjectStore adapter, and a "${VAR:}" empty-string default would resolve to
      # Optional.of("") (present-but-blank) instead of Optional.empty() — S3ObjectStore would then
      # call URI.create("") and blow up. Only set OBJECTSTORE_S3_ENDPOINT_OVERRIDE (e.g. for
      # localstack) when an override is actually wanted; leave the key wholly absent otherwise.
  # ADR-0162 D3: PdfRenderPort HTTP adapter profile. weasyprint (default) = openbank-document-renderer
  # sidecar; gotenberg = opt-in, per-template full-CSS/Office-fidelity fallback.
  render:
    profile: ${RENDER_PROFILE:weasyprint}
    weasyprint-url: ${WEASYPRINT_URL:http://localhost:8200}
    gotenberg-url: ${GOTENBERG_URL:http://localhost:3000}
  # ADR-0162 D4: signature.keystore-path / keystore-password are intentionally NOT declared here
  # (same Optional<String> reasoning as objectstore.s3.endpoint-override above) — leaving them
  # wholly absent is what makes PdfBoxPadesSealAdapter fall back to its DEV-ONLY ephemeral
  # certificate. Production sets both via real config/secrets, never a blank-string default.
  #
  # ADR-0162 D4 continued: client-pki.* all have code-level defaults (OpenBaoClientSignatureAdapter's
  # @ConfigProperty defaultValue) pointing at the real in-cluster OpenBao address/mount/role, so
  # nothing needs overriding here for production. Locally/in tests, the projected ServiceAccount
  # token simply doesn't exist at that path, so the adapter falls back to its own DEV-ONLY ephemeral
  # identity without any config needed either.
  signature:
    # ADR-0162 D4 continued — go-live gate for real (non-DEV-ONLY) signatures. Default off keeps the
    # service runnable on the ephemeral fallback (both the seal's in-memory cert and the client's
    # ephemeral leaf). Flip OPENBANK_SIGNATURE_REQUIRE_TRUSTED_ISSUER=true in the deployment env once
    # a real seal keystore + the OpenBao pki-document-signing engine are provisioned: any signing act
    # that then cannot obtain a trusted certificate fails loud (fail-closed) rather than silently
    # producing evidence-worthless output, and the service refuses to boot without a real seal key.
    require-trusted-issuer: ${OPENBANK_SIGNATURE_REQUIRE_TRUSTED_ISSUER:false}
    # ADR-0172 D2 — the seal-time half of the same gate, and the one that protects evidence.
    #
    # `require-trusted-issuer` above is a BOOT gate and is off by default on purpose: the rollout
    # order (gitops env/volume wiring vs. OpenBao KV seeding) must never crash-loop this service.
    # That left the ephemeral fallback with nothing stopping it — a service whose keystore secret
    # failed to materialise booted fine, logged one WARN, then sealed documents with a throwaway
    # cert. Legally worthless output that looks exactly like success.
    #
    # So: booting on an ephemeral identity stays allowed; SIGNING with one does not. Fail closed by
    # default. %dev/%test override to true below so the service is runnable out of the box. Any
    # environment that genuinely wants throwaway seals must say so out loud with
    # OPENBANK_SIGNATURE_ALLOW_EPHEMERAL_SEALS=true — a reviewable line in gitops, not an invisible
    # code default.
    allow-ephemeral-seals: ${OPENBANK_SIGNATURE_ALLOW_EPHEMERAL_SEALS:false}

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      document-events-out:
        connector: smallrye-kafka
        client.id: document-service-${quarkus.uuid}
        topic: openbank.documents.document.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # ADR-0162 D7: onboarding wiring — consumes account-service's own AccountCreated event
      # (same topic balance-service's BalanceInitConsumer already consumes) so document-service
      # stays off the synchronous account-opening path (ADR-0086) entirely.
      account-created-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.document.account-created-in
        connector: smallrye-kafka
        topic: openbank.accounts.account.created
        group.id: openbank-document-service
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # auto.offset.reset deliberately unset (#8370): the inert dotted YAML key was a config lie --
        # SmallRye quotes dotted leaf keys, so the connector always ran its default (latest) and the
        # declared `earliest` never applied. Deleting it makes the file match the running reality; to
        # rebuild projections, flip it via the msg-override ConfigMap in an announced replay window.
      # ADR-0248: the annual statement of fees is the one template family that still needs an
      # async push trigger (PAD Art. 5 duty — the bank must send it, not wait for the customer).
      # billing-service's own billing-outbox drains ALL its events (fee.post-intent, reversal-intent,
      # and this one) to the SAME topic via its one "billing-events-out" channel — confirmed against
      # openbank-billing-service/src/main/resources/application.yaml. eventType filtering (see
      # AnnualFeeSummaryReadyConsumer) is what makes sharing that topic with billing's other events safe.
      billing-outbox-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.document.billing-outbox-events-in
        connector: smallrye-kafka
        topic: openbank.billing.fee.event
        group.id: openbank-document-service
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # auto.offset.reset deliberately unset (#8370): the inert dotted YAML key was a config lie --
        # SmallRye quotes dotted leaf keys, so the connector always ran its default (latest) and the
        # declared `earliest` never applied. Deleting it makes the file match the running reality; to
        # rebuild projections, flip it via the msg-override ConfigMap in an announced replay window.

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
