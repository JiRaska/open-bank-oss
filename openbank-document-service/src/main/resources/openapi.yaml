openapi: 3.1.0
info:
  title: Document Service API
  version: 1.5.0
  description: >-
    Document Management — templates, rendering, storage with lifecycle/retention metadata,
    and e-signature ceremonies. Not on the synchronous money path (emits events, never a
    blocking fund-release gate).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8143
    description: Local development
tags:
  - name: Templates
  - name: Documents
  - name: Signature Ceremonies
  - name: Business Agreements

paths:
  /api/v1/documents/templates:
    post:
      tags: [Templates]
      summary: Create a document template (DRAFT)
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created
    get:
      tags: [Templates]
      summary: List document templates (bounded, not cursor-paginated)
      operationId: listTemplates
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Templates

  /api/v1/documents/templates/preview:
    post:
      tags: [Templates]
      summary: Merge sample data into an unsaved template body — dynamic preview, no persistence
      operationId: previewTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewTemplateRequest'
      responses:
        '200':
          description: Rendered preview HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewTemplateResponse'
        '400':
          description: bodyHtml exceeds the preview size limit

  /api/v1/documents/templates/{id}:
    get:
      tags: [Templates]
      summary: Get a template by ID
      operationId: getTemplate
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Template detail
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/documents/templates/{id}/publish:
    post:
      tags: [Templates]
      summary: Publish a DRAFT template
      operationId: publishTemplate
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Published

  /api/v1/documents/templates/{id}/retire:
    post:
      tags: [Templates]
      summary: Retire a PUBLISHED template
      operationId: retireTemplate
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Retired

  /api/v1/documents/render:
    post:
      tags: [Documents]
      summary: Render a document from a published template + data map
      operationId: renderDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderDocumentRequest'
      responses:
        '201':
          description: Document generated

  /api/v1/documents/onboarding-agreement:
    post:
      tags: [Documents]
      summary: Get-or-create a party's onboarding framework agreement in a language (ADR-0169 D3)
      description: >-
        Idempotent, language-correct. Returns an already-signed agreement untouched; reuses a
        pending agreement already in the requested language; supersedes (archives + re-renders) a
        pending agreement in a different language. customer-edge proxies this for ROLE_CUSTOMER,
        forcing partyRef to the caller's token.
      operationId: ensureOnboardingAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureOnboardingAgreementRequest'
      responses:
        '200':
          description: The ceremony to sign + the exact rendered agreement it is scoped to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAgreementResponse'
        '400':
          description: partyRef is required

  /api/v1/documents:
    get:
      tags: [Documents]
      summary: One page of a party's documents, newest first (compliance/legal browse)
      description: >-
        Bounded and policy-gated (#8082). The read was previously unbounded — a party's document
        count grows with every rendered statement and agreement, and the whole set was serialised
        into a single response. It also carried only a role gate while its by-id siblings are
        @Authorize-gated; it now requires the `document.list` policy decision, so the endpoint that
        returns a party's whole document file is one the PDP can actually speak about.
      operationId: listDocumentsByParty
      parameters:
        - name: partyRef
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          description: Clamped to 1..200. A caller-supplied page size is a caller-supplied amount of work.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: >-
            One page of the party's documents. The body stays an array and the page metadata
            travels in headers, so adding pagination is an additive change rather than a new
            response type.
          headers:
            X-Total-Count:
              description: >-
                Documents held for this party. Without it a caller cannot tell "this is everything"
                from "this is the first page of many" — the two render identically and mean
                opposite things to whoever is judging whether they have seen the party's whole file.
              schema: { type: integer, format: int64 }
            X-Page:
              schema: { type: integer }
            X-Page-Size:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: partyRef query parameter is required, or page is negative
        '403':
          description: The document.list policy decision denied the caller

  /api/v1/documents/{id}:
    get:
      tags: [Documents]
      summary: Get document metadata by ID
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Document metadata
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/documents/{id}/content:
    get:
      tags: [Documents]
      summary: Get document content bytes
      operationId: getDocumentContent
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Document bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/signature-ceremonies:
    post:
      tags: [Signature Ceremonies]
      summary: Open a signature ceremony over a document
      operationId: openCeremony
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCeremonyRequest'
      responses:
        '201':
          description: Ceremony opened

  /api/v1/signature-ceremonies/{id}:
    get:
      tags: [Signature Ceremonies]
      summary: Get a ceremony by ID
      operationId: getCeremony
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Ceremony detail
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/signature-ceremonies/{id}/decisions:
    post:
      tags: [Signature Ceremonies]
      summary: Record a signer decision (SIGNED / DECLINED)
      operationId: recordDecision
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        '200':
          description: Decision recorded

  /api/v1/business-agreements:
    post:
      tags: [Business Agreements]
      summary: Render (or return) a company's onboarding agreement and open its multi-signer ceremony
      description: >-
        Internal (kyb-service, ROLE_API; OPA action document.business-agreement.ensure). Idempotent
        per (caseId, lang): the same request returns the same agreement. A changed request
        re-renders the agreement only while nobody has signed it (the old ceremony is withdrawn as
        EXPIRED and the document archived); once any signer has signed, or the agreement is SIGNED,
        a changed request - or a request in the other language - answers 409. The agreement and
        every disclosure are stored with partyRef = entityPartyId and caseRef = caseId; disclosures
        are rendered once per case and code and then reused, so the returned set is stable. The
        ceremony's signers are signers[].partyRef in request order (signature level ADVANCED); each
        SIGNED decision is SCA-verified against sha256, and the bank's PAdES seal is applied when
        the last signer signs, after which sealedSha256 is set.
      operationId: ensureBusinessAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureBusinessAgreementRequest'
      responses:
        '200':
          description: The agreement, its ceremony and its annexed disclosures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAgreement'
        '400':
          description: Invalid request (missing field, unsupported lang, duplicate or non-UUID signer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not permitted by policy
        '409':
          description: The agreement for this case is already (partly) signed and cannot be replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: A required template or the product's fee schedule is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/business-agreements/{caseId}:
    get:
      tags: [Business Agreements]
      summary: Get a company's onboarding agreement by kyb case
      description: >-
        Internal (ROLE_API; OPA action document.business-agreement.read). With lang, the agreement
        in that language; without it, the signed agreement if any, else the first one found.
      operationId: getBusinessAgreement
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [cs, en]
      responses:
        '200':
          description: The agreement, its ceremony and its annexed disclosures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAgreement'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateTemplateRequest:
      type: object
      required: [code, version, name, bodyHtml]
      properties:
        code:
          type: string
          example: LOAN_AGREEMENT
        version:
          type: string
          example: 1.0.0
        name:
          type: string
        engine:
          type: string
          enum: [HANDLEBARS]
        bodyHtml:
          type: string
        locale:
          type: string
        productRef:
          type: string
          nullable: true
        classification:
          type: string

        createdBy:
          type: string
    PreviewTemplateRequest:
      type: object
      required: [bodyHtml]
      properties:
        bodyHtml:
          type: string
        data:
          type: object
          additionalProperties: true

    PreviewTemplateResponse:
      type: object
      required: [renderedHtml]
      properties:
        renderedHtml:
          type: string

    RenderDocumentRequest:
      type: object
      required: [templateCode]
      properties:
        templateCode:
          type: string
        templateVersion:
          type: string
          nullable: true
          description: >-
            Exact version to render. Omit to render the current PUBLISHED version of
            templateCode (a template code has at most one PUBLISHED version at a time).
        data:
          type: object
          additionalProperties: true
        contentType:
          type: string
        partyRef:
          type: string
          nullable: true
        caseRef:
          type: string
          nullable: true
        productRef:
          type: string
          nullable: true
        retainUntil:
          type: string
          format: date
          nullable: true

    OpenCeremonyRequest:
      type: object
      required: [documentId, signerPartyRefs]
      properties:
        documentId:
          type: string
          format: uuid
        signerPartyRefs:
          type: array
          items:
            type: string
        signatureLevel:
          type: string
          enum: [ADVANCED, QUALIFIED]

    RecordDecisionRequest:
      type: object
      required: [partyRef, decision]
      properties:
        partyRef:
          type: string
        decision:
          type: string
          enum: [SIGNED, DECLINED]
        evidenceRef:
          type: string
          nullable: true
          description: >-
            SCA challenge/approval reference (ADR-0021) proving partyRef's identity/consent.
            Required and verified when decision is SIGNED; not required for DECLINED.

    EnsureOnboardingAgreementRequest:
      type: object
      required: [partyRef]
      properties:
        partyRef:
          type: string
        lang:
          type: string
          description: ISO-639-1 language (cs/en); unsupported values fall back to the default locale.
          default: cs

    OnboardingAgreementResponse:
      type: object
      required: [ceremonyId, documentId, templateCode, templateVersion, sha256, documentStatus]
      properties:
        ceremonyId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        templateCode:
          type: string
        templateVersion:
          type: string
        sha256:
          type: string
          description: Content address of the exact rendered PDF — the value the SCA challenge binds to (ADR-0169 D2).
        documentStatus:
          type: string
          enum: [GENERATED, PENDING_SIGNATURE, SIGNED, ARCHIVED]

    DocumentResponse:
      type: object
      required:
        [id, templateCode, templateVersion, sha256, storageKey, contentType, sizeBytes, status,
         metadata, partyRef, caseRef, productRef, retainUntil, createdAt]
      properties:
        id:
          type: string
          format: uuid
        templateCode:
          type: string
        templateVersion:
          type: string
        sha256:
          type: string
        storageKey:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [GENERATED, PENDING_SIGNATURE, SIGNED, ARCHIVED]
        metadata:
          type: object
          additionalProperties:
            type: string
        partyRef:
          type: [string, 'null']
        caseRef:
          type: [string, 'null']
        productRef:
          type: [string, 'null']
        retainUntil:
          type: [string, 'null']
          format: date
        createdAt:
          type: string
          format: date-time

    EnsureBusinessAgreementRequest:
      type: object
      required: [caseId, entityPartyId, lang, entity, signers, signingRule, product]
      properties:
        caseId:
          type: string
          format: uuid
        entityPartyId:
          type: string
          format: uuid
        lang:
          type: string
          enum: [cs, en]
        entity:
          type: object
          required: [name, ico, seat, legalForm]
          properties:
            name:
              type: string
            ico:
              type: string
            seat:
              type: string
              description: Registered office on a single line.
            legalForm:
              type: string
        representatives:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              partyRef:
                type: [string, 'null']
              name:
                type: string
              role:
                type: string
        signers:
          type: array
          minItems: 1
          description: Ceremony signers, in signing order. partyRef values must be distinct party UUIDs.
          items:
            type: object
            required: [partyRef, name, role]
            properties:
              partyRef:
                type: string
                format: uuid
              name:
                type: string
              role:
                type: string
        signingRule:
          type: string
          description: The manner of acting for the company as registered.
        product:
          type: object
          required: [code, name, currency]
          properties:
            code:
              type: string
              description: Product reference product-catalog resolves (e.g. prod-004); its fee list feeds the fee schedule.
            name:
              type: string
            currency:
              type: string

    BusinessAgreement:
      type: object
      required: [caseId, documentId, templateCode, templateVersion, sha256, ceremonyId, ceremonyStatus, signers, disclosures]
      properties:
        caseId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        templateCode:
          type: string
          description: RAMCOVA_SMLOUVA_PO_CS or RAMCOVA_SMLOUVA_PO_EN.
        templateVersion:
          type: string
        sha256:
          type: string
          description: Digest of the agreement as rendered — the value every signer's SCA challenge binds to. Never changes.
        sealedSha256:
          type: [string, 'null']
          description: Digest of the stored PDF after the bank's PAdES seal; null until the ceremony completes.
        ceremonyId:
          type: string
          format: uuid
        ceremonyStatus:
          type: string
          enum: [DRAFT, PENDING, PARTIALLY_SIGNED, COMPLETED, DECLINED, EXPIRED]
        signers:
          type: array
          items:
            type: object
            required: [partyRef, status]
            properties:
              partyRef:
                type: string
              status:
                type: string
                enum: [PENDING, SIGNED, DECLINED]
              signedAt:
                type: [string, 'null']
                format: date-time
        disclosures:
          type: array
          description: Annexes in print order (VOP, SAZEBNIK_PO, PREDSMLUVNI_INFORMACE_PO, INFORMACE_POJISTENI_VKLADU), each suffixed with the language.
          items:
            type: object
            required: [code, version, title, sha256, documentId]
            properties:
              code:
                type: string
              version:
                type: string
              title:
                type: string
              sha256:
                type: string
              documentId:
                type: string
                format: uuid

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
