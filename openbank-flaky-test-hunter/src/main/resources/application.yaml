quarkus:
  application:
    name: flaky-test-hunter
  http:
    port: 8148
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # Reactive client for the app (Panache); JDBC URL is for Flyway migrations only.
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_flakytest}
      idle-timeout: 5M
      max-lifetime: 30M
      max-size: 20
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_flakytest}
  hibernate-orm:
    # Flyway owns the schema; Hibernate validates against it, never generates.
    database:
      generation: none
  flyway:
    migrate-at-start: true
  shutdown:
    timeout: 30S
  log:
    level: INFO
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      tls:
        verification: none
      enabled: false

"%test":
  quarkus:
    oidc:
      enabled: false
    management:
      enabled: false
    http:
      # Ephemeral: this module now has more than one @QuarkusTest profile, so there is more than
      # one application boot per run, and on the fixed default the second dies with
      # QuarkusBindException whenever anything else on the machine holds the port.
      test-port: 0

openbank:
  api:
    # Major matches the served /api/v1 path and openapi.yaml (ADR-0048).
    version: 1
  temporal:
    enabled: ${TEMPORAL_ENABLED:false}
    server-url: ${TEMPORAL_HOST:temporal-frontend.temporal:7233}
    namespace: ${TEMPORAL_NAMESPACE:openbank}
    task-queue: flaky-test-hunter
  flaky-test-hunter:
    # No periodic sweep cron. The weekly sweep (ADR-0168) was removed on 2026-10-17: the deployed
    # pod has no repository checkout, so the sweep scanned an empty tree every Sunday and could
    # never find anything. The agent's production input is the Admin UI Test Intelligence
    # snapshot (POST /api/v1/flaky-test-hunter/evidence/analyze); the scan path stays reachable
    # through the webhook and operator triggers where a checkout exists.
    github-api-url: ${GITHUB_API_URL:https://api.github.com}
    github-repo: ${GITHUB_REPO:JiRaska/open-bank-oss}
    # Optional (Optional<String>, no default): absent until openbank/flaky-test-hunter is seeded in
    # OpenBao, and the writer fails closed on a blank value (see GitHubProposalAdapter).
    github-token: ${FLAKY_TEST_HUNTER_GITHUB_TOKEN:}
    llm-gateway-url: ${LLM_GATEWAY_URL:http://litellm.ai-platform:4000}
    # Filesystem path to a monorepo checkout for TestScanPort (webhook / operator scan path only;
    # the deployed pod mounts none — see the note above).
    repo-root: ${FLAKY_TEST_HUNTER_REPO_ROOT:.}
    # ADR-0031 D9 phase 3: policy pre-flight gate on the rare gh.pr.open write path. Deny-by-
    # default — in-process charter re-check against the packaged agents.yaml, then an OPA sidecar
    # query; ANY OPA connectivity/parse error denies with reason pdp_unreachable (fail closed,
    # unlike the agent-service MCP read gate's advisory degradation: a write path must not open
    # a PR on the word of a PDP that cannot answer).
    policy-gate:
      # False disables PR writes with policy_gate_disabled; it never bypasses policy checks.
      enabled: ${FLAKY_TEST_HUNTER_POLICY_GATE_ENABLED:true}
      opa-url: ${OPA_SIDECAR_URL:http://localhost:8181}
      timeout: ${FLAKY_TEST_HUNTER_POLICY_GATE_TIMEOUT:PT0.5S}
