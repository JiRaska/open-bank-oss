# Test fixture: an explicit object-shaped deny entry beats the grant for the same (tier, resource)
# pair — mirroring agents.rego's decision shape (ADR-0031 D9 phase 3).
agents:
  - id: flaky-test-hunter
    enabled: true
    tools:
      allow:
        - tier: write_proposal
          resources:
            - github-pr
          base_refs: [main]   # so the deny is for the reason under test, not a missing ref
      deny:
        - tier: write_proposal
          resources:
            - github-pr
