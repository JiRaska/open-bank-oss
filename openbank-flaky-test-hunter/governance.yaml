# SPDX-License-Identifier: AGPL-3.0-only
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: platform
primaryDatastore: PostgreSQL
databaseName: openbank_flakytest
dataLineageRole: internal
dataClassification: internal
retentionPolicy: "7 years"
evidenceExported: false
lineage:
  upstream:
    - serviceName: github
      relationType: api
      description: reads fleet-wide */src/test/kotlin/**/*.kt test sources, .github/scripts/*.sh CI
        guard scripts, and JUnit/Gradle test-result reports via a repo checkout
databaseLineage:
  ownedDatabases:
    - openbank_flakytest
  dependentDatabases: []
