# JDK selection
# ─────────────────────────────────────────────────────────────────────────────
# Kotlin 2.0.21 cannot compile under JDK 24+ (cryptic "26.0.1" failure when
# JDK 26 is the Gradle launcher). We pin the daemon launcher to a 17–21 JDK
# and let Toolchain auto-download JDK 21 for compilation if it's not installed.
#
# `org.gradle.java.home` is intentionally NOT committed — each developer
# overrides it in `~/.gradle/gradle.properties` or via the JAVA_HOME env var.
# Example (zsh, macOS):
#     echo "org.gradle.java.home=$(/usr/libexec/java_home -v 21 2>/dev/null \
#         || /usr/libexec/java_home -v 20)" >> ~/.gradle/gradle.properties
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Daemon
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning

# Dependency verification (supply-chain integrity, ADR-0030 / rules.yaml
# dependencies.artifact_integrity)
# ─────────────────────────────────────────────────────────────────────────────
# gradle/verification-metadata.xml pins SHA-256 checksums for every resolved
# artifact. LENIENT while the metadata soaks (mismatches are build WARNINGS,
# not failures) — flips to strict per the ADR-0144 graduation date in
# rules.yaml. Dependabot PRs get their metadata refreshed automatically by
# .github/workflows/dependabot-verification-metadata.yml; for a manual bump run:
#     ./gradlew --write-verification-metadata sha256 testClasses
org.gradle.dependency.verification=lenient
