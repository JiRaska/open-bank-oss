# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only.
# Schema: openbank-libs/governance/governance.schema.json
#
# openbank-clearing-simulator is a NON-PRODUCTION scheme/clearing counterparty (ADR-0104 D2):
# no posting authority and no real payment network. The new receipted submission contract
# owns a database; the legacy endpoint is still stateless during migration.
dataDomain: payments
primaryDatastore: PostgreSQL
databaseName: openbank_clearing_simulator
dataLineageRole: internal
dataClassification: internal
retentionPolicy: pending owner approval for sandbox submission receipts
evidenceExported: false
databaseLineage:
  ownedDatabases:
    - openbank_clearing_simulator
lineage:
  upstream:
    - serviceName: sepa-payment
      relationType: api
      description: receives pacs.008 credit transfers (D3 pilot), returns pacs.002 / camt.054
