quarkus:
  application:
    name: openbank-party-service
  http:
    port: 8111
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_parties
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_parties
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  # Four-eyes ApprovalStore backing store (ADR-0155). party-service has no other Redis
  # usage. The cluster value comes from QUARKUS_REDIS_HOSTS on the Deployment, pointing at
  # gitops/components/party/redis.yaml — without a reachable Redis the ApprovalConfig bean
  # still resolves (so the interceptor believes four-eyes is wired) and every gated merge
  # fails on a connection error instead: issue #1354.
  redis:
    hosts: redis://localhost:6379
    # Kept OUT of the readiness probe, deliberately — a deviation from the other
    # ApprovalStore-wired services, and the reason matters. The Quarkus Redis extension
    # registers a readiness check by default, so a dead Redis would flip party-service to
    # NotReady and stop ALL party traffic: the registry reads and POST /parties that every
    # onboarding depends on, plus the GDPR export. Trading a whole service outage for a
    # four-eyes store that today gates exactly one operator action (and is not even enforced
    # yet) is the wrong bargain. A Redis failure still surfaces loudly and precisely — the
    # merge call errors — instead of silently amputating the service. The other services
    # leave this on because their Redis is on the money path itself; party-service's is not.
    health:
      enabled: false
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Shared outbound M2M client (client_credentials grant), reused by two independent callers:
  # - ADR-0179: the merge account guard calls account-service; the token resolves to
  #   ROLE_OPERATOR, which is what account-service's list endpoint actually accepts.
  # - The GDPR Art. 15 aggregation hops call kyc-service / card-service. The export reads
  #   another service's PII on the data subject's behalf, so party-service authenticates as
  #   the service, not as the human caller (whose own token has no KYC/card role and never
  #   leaves customer-edge anyway).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    account-service:
      # account-service listens on 8100 in the `accounts` namespace (gitops
      # components/accounts/account-service.yaml). 8102 is transaction-service — this repo has
      # already been bitten once by a copy-pasted neighbouring port.
      url: ${ACCOUNT_SERVICE_URL:http://account-service.accounts:8100}
    transaction-service:
      # GDPR Art. 20 portability export (ADR-0204 D2): transaction history per account.
      url: ${TRANSACTION_SERVICE_URL:http://transaction-service.payments:8102}
    kyc-service:
      url: ${OPENBANK_KYC_SERVICE_URL:http://localhost:8114}
      scope: jakarta.inject.Singleton
    card-service:
      url: ${OPENBANK_CARD_SERVICE_URL:http://localhost:8118}
      scope: jakarta.inject.Singleton
    consent-service:
      # consent-service listens on 8106 in the `consent` namespace (gitops
      # components/consent/consent-service.yaml). ADR-0206 D5 marketing-consent forwarder.
      url: ${OPENBANK_CONSENT_SERVICE_URL:http://consent-service.consent:8106}
      scope: jakarta.inject.Singleton
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-party-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      # `party-events-out` (the direct, non-transactional emitter) was removed with issue #4007.
      # Party lifecycle events now leave only through the outbox dispatcher below, which targets
      # the SAME topic — so consumers are unaffected, and there is exactly one publisher.
      party-outbox-out:
        connector: smallrye-kafka
        client.id: party-outbox-service-${quarkus.uuid}
        topic: openbank.party.events
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # KYC + AML activation gate: consume the KYC and AML case-lifecycle
      # topics and flip the party to ACTIVE only when both clear (two-key gate).
      kyc-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.party.kyc-events-in
        connector: smallrye-kafka
        topic: openbank.kyc.events
        group.id: openbank-party-service
        auto.offset.reset: earliest
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      aml-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.party.aml-events-in
        connector: smallrye-kafka
        topic: openbank.aml.events
        group.id: openbank-party-service
        auto.offset.reset: earliest
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Marketing-consent projection (ADR-0205 D4): the whole consent-service outbox topic,
      # filtered in-consumer to the fixed internal grantee id — see MarketingConsentEventConsumer.
      consent-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.party.consent-events-in
        connector: smallrye-kafka
        topic: openbank.consent.events
        group.id: openbank-party-service
        auto.offset.reset: earliest
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_party_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_party_it
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    devservices:
      enabled: false
  authz:
    enforce: false
openbank:
  outbox:
    dispatch-enabled: true
  rate-limit:
    enabled: true
    max-concurrent-requests: 150
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  gdpr:
    retention-days: 2555
  # Feature flags (ADR-0067) — first pilot adopter. flagd serves OFREP HTTP on :8016
  # (8013 is gRPC, 8014 is management). Fail-static: no sidecar reachable → every flag
  # resolves to its caller default, so the same image runs locally without flagd.
  flags:
    url: "${OPENBANK_FLAGS_URL:http://localhost:8016}"
    timeout-ms: "${OPENBANK_FLAGS_TIMEOUT_MS:100}"
  # ADR-0072: pepper for RČ blind index dedup. Sourced from Vault/OpenBao (gitops secret).
  # When absent the dedup gate is silently off — POST /parties/resolve returns 503.
  identity:
    rc-pepper: "${OPENBANK_IDENTITY_RC_PEPPER:}"

# OPA sidecar (ADR-0034). Defaults match the per-service deployment manifest
# (sidecar bound to 8181, bundle exposing data.openbank.rest.allow). Override
# in CI / cluster envs as needed.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"

# Phase 3 pilot ships in ADVISORY mode (ADR-0034 D5): @Authorize-annotated
# methods are evaluated and denies are logged at WARN, but the request still
# proceeds. The flip to enforce is Phase 5 — after CI audit confirms the
# policy is rejecting the right calls.
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
  # ADR-0155: four-eyes ENFORCEMENT (pausing a maker's `party.merge` pending a second
  # approver), independent of the base allow/deny enforce toggle above — the interceptor
  # reaches the four-eyes branch on an ALLOW regardless of `authz.enforce`. Stays false by
  # default, the same deliberate separate rollout decision every other service wiring an
  # ApprovalStore makes (billing/sepa-payment/consent/notification carry the identical
  # comment): flipping AUTHZ_FOUR_EYES_ENFORCE is a runbook-gated follow-up, not bundled
  # with the ApprovalStore wiring itself. Until it is flipped in
  # gitops/components/party/party-service.yaml, the gate is WIRED BUT INERT — the
  # interceptor records authz_four_eyes{outcome="required_not_enforced"} and proceeds.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
