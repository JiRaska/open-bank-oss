openapi: 3.1.0
info:
  title: Party Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.8 -> 1.9): additive
  # only — a new PATCH /api/v1/parties/approvals/{id} endpoint and an additional 202 response
  # on POST /{id}/merge (ADR-0155 four-eyes). No existing response or schema changed.
  version: 1.12.0
  description: Legal entity and individual party management with document storage.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8111
    description: Local development
tags:
  - name: Parties

paths:
  /api/v1/parties:
    get:
      tags: [Parties]
      summary: List parties (paginated). Optional ?status= filter for onboarding cockpit funnel views (ADR-0068).
      operationId: listParties
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter by party status. When omitted all parties are returned.
          schema:
            type: string
            enum: [PENDING_KYC, ACTIVE, SUSPENDED, CLOSED]
      responses:
        '200':
          description: Party list with optional statusFilter echo
    post:
      tags: [Parties]
      summary: Create a party
      operationId: createParty
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
      responses:
        '201':
          description: Party created

  /api/v1/parties/search:
    get:
      tags: [Parties]
      summary: Search parties by business keys, cursor-paginated
      description: >-
        Case-insensitive substring match over legal name / trading name / email / phone /
        tax id / company registration number (ADR-0055, extended by ADR-0228).
        Blank, '*', or a term shorter than 2 characters returns an empty page (no
        full-table enumeration from this surface — use GET /api/v1/parties to list).
        Page size is clamped to [1,100]. Birth number is never searchable here
        (GDPR data-minimisation; it stays encrypted in pid-service).
      operationId: searchParties
      parameters:
        - name: q
          in: query
          required: true
          description: Name fragment (>= 2 chars after trim)
          schema:
            type: string
            minLength: 2
            maxLength: 128
            example: Novak
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          description: Opaque keyset cursor for the next page
          schema:
            type: string
      responses:
        '200':
          description: Cursor-paginated search results (data-minimised party summaries)
        '401':
          description: Missing or invalid credentials
        '403':
          description: Caller lacks a permitted role

  /api/v1/parties/{id}:
    get:
      tags: [Parties]
      summary: Get party by ID
      operationId: getParty
      parameters:
        - $ref: '#/components/parameters/partyId'
      responses:
        '200':
          description: Party detail
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Parties]
      summary: Update party
      operationId: updateParty
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyRequest'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Parties]
      summary: Erase party — GDPR Art. 17 right to erasure
      description: >-
        Anonymises all PII held for the party. Requires ROLE_ADMIN. The erasure itself is recorded
        for the Art. 30 records-of-processing trail (who erased which subject), so the action is
        auditable after the data is gone.
      operationId: eraseParty
      parameters:
        - $ref: '#/components/parameters/partyId'
      responses:
        '204':
          description: Party erased
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parties/{id}/merge:
    post:
      tags: [Parties]
      summary: Merge a duplicate party into a surviving party (ADR-0179)
      description: >-
        Retires {id} as a duplicate of mergedIntoPartyId, setting status MERGED. All PII and
        history are preserved and a PARTY_MERGED event is emitted — this is NOT GDPR Art. 17
        erasure (DELETE /api/v1/parties/{id}), which anonymizes instead. Refused with 409 while
        the duplicate still owns an open account: sweep the balances with a ledger ADJUSTMENT
        journal entry and close the account first.
      operationId: mergeParty
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePartyRequest'
      responses:
        '200':
          description: The retired party, carrying status MERGED and mergedIntoPartyId
        '202':
          description: >-
            Four-eyes gate (ADR-0155): the merge is paused pending a second approver. The body
            carries `{"status":"PENDING_APPROVAL","approvalId":"<id>"}`. A DIFFERENT operator
            decides it via PATCH /api/v1/parties/approvals/{approvalId}; the maker then retries
            this same request with an `X-Approval-Id` header, which unlocks it exactly once.
            Only returned when four-eyes enforcement is enabled for this deployment
            (`AUTHZ_FOUR_EYES_ENFORCE`); off by default.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [PENDING_APPROVAL] }
                  approvalId: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            A merge precondition failed — already merged, the target is itself merged (chains are
            refused), a party is erased, or the duplicate still owns an open account.

  /api/v1/parties/approvals/{id}:
    patch:
      tags: [Parties]
      summary: >-
        Approve or reject a pending four-eyes approval for a gated party action
        (party.merge, ADR-0155/ADR-0179)
      description: >-
        The checker half of the maker-checker gate. The decider must be a DIFFERENT identity from
        the maker — enforced in the shared ApprovalStore, not just here — and an approval can be
        decided once and consumed once.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        '200':
          description: The decided approval
        '403':
          description: >-
            The decider is the original maker — segregation of duties (SelfApprovalNotAllowedMapper
            in openbank-libs-runtime).
        '404':
          description: No pending approval with that id
        '409':
          description: >-
            The approval is not PENDING — already decided, or already consumed
            (InvalidApprovalStateMapper in openbank-libs-runtime).

  /api/v1/parties/{id}/consent:
    patch:
      tags: [Parties]
      summary: Update the party's post-onboarding marketing consent (revocable; consentGdpr is not — see UpdateConsentRequest)
      operationId: updateConsent
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsentRequest'
      responses:
        '200':
          description: Updated
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parties/{id}/documents:
    post:
      tags: [Parties]
      summary: Add document to party
      operationId: addDocument
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentRequest'
      responses:
        '201':
          description: Document added
    get:
      tags: [Parties]
      summary: List party documents
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/partyId'
      responses:
        '200':
          description: Documents

  /api/v1/parties/me:
    get:
      summary: Get my party (mobile self-registration)
      tags: [Parties]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Party found
        '404':
          description: Not yet registered
  /api/v1/parties/self-register:
    post:
      summary: Self-register as a new party (mobile onboarding, idempotent)
      tags: [Parties]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Party created
        '200':
          description: Existing party returned (resumed)
        '403':
          description: Email not verified
  /api/v1/parties/{id}/documents/{fileId}/content:
    get:
      tags: [Parties]
      summary: Download KYC document content (operators only)
      description: >-
        The document bytes themselves, as opposed to the metadata listing at
        `/api/v1/parties/{id}/documents`. Requires ROLE_VIEWER, ROLE_OPERATOR, ROLE_ADMIN or
        ROLE_KYC.
      operationId: getPartyDocumentContent
      parameters:
        - $ref: '#/components/parameters/partyId'
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The stored document content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parties/{id}/documents/upload:
    post:
      summary: Upload KYC document binary (mobile)
      tags: [Parties]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded
  /api/v1/parties/resolve:
    post:
      tags: [Parties]
      summary: Resolve a party by RČ blind index (ADR-0072 dedup gate, internal only)
      description: >-
        Internal-only endpoint. Returns the party whose Czech RČ (rodné číslo) matches
        the supplied value via HMAC-SHA256 blind index (ADR-0072). The RČ is never
        echoed in the response. Returns 503 when the pepper is not configured (dedup off)
        so callers can distinguish "not found" from "uniqueness not guaranteed".
      operationId: resolveParty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePartyRequest'
      responses:
        '200':
          description: Party found — returns the same fields as GET /parties/{id} summary view
        '404':
          description: No party matches the supplied RČ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: RČ dedup pepper not configured; callers must not assume uniqueness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/parties/{id}/kyc-status:
    put:
      tags: [Parties]
      summary: Update KYC status
      operationId: updateKycStatus
      parameters:
        - $ref: '#/components/parameters/partyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycStatusRequest'
      responses:
        '200':
          description: Updated

  /api/v1/parties/{id}/gdpr-export:
    get:
      tags: [Parties]
      summary: Export all PII held for a party — GDPR Art. 15 Right of Access
      description: >-
        Returns the full PII set held for the data subject: the party-service-direct data
        (personal details, address, identity-document metadata) plus the KYC case and card
        records aggregated from kyc-service and card-issuance-service (ADR-0118 §6).
        A downstream that is unreachable or holds no record degrades to an absent section;
        a downstream that *refuses* the aggregation call on authorization grounds fails the
        whole export with 502, because a silently incomplete Art. 15 response is
        indistinguishable from a complete one.
      operationId: exportPartyGdpr
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/partyId'
      responses:
        '200':
          description: GDPR Art. 15 subject-access export (ROLE_ADMIN only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GdprExport'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: >-
            A downstream aggregation hop (kyc-service or card-issuance-service) refused the
            call with 401/403. The export is NOT returned — retry once the M2M grant is fixed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  parameters:
    partyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    GdprExport:
      type: object
      description: GDPR Art. 15 subject-access export (party-service-direct PII).
      properties:
        subject:
          type: object
          description: The party's personal data held by party-service.
          properties:
            id: { type: string, format: uuid }
            partyType: { type: string }
            status: { type: string }
            legalName: { type: string }
            tradingName: { type: string, nullable: true }
            dateOfBirth: { type: string, nullable: true }
            nationality: { type: string, nullable: true }
            taxId: { type: string, nullable: true }
            registrationNumber: { type: string, nullable: true }
            email: { type: string }
            phone: { type: string, nullable: true }
            address:
              type: object
              nullable: true
            kycStatus: { type: string }
            amlStatus: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        documents:
          type: array
          description: Identity-document metadata (no binary content).
          items:
            type: object
            properties:
              documentType: { type: string }
              documentNumber: { type: string }
              issuingCountry: { type: string }
              expiryDate: { type: string, nullable: true }
              verifiedAt: { type: string, format: date-time, nullable: true }
              createdAt: { type: string, format: date-time }
        exportedAt:
          type: string
          format: date-time
        scope:
          type: string
          description: What this export does and does not cover.
    CreatePartyRequest:
      type: object
      # email is mandatory: a party is uniquely keyed by email (DB unique + not-null),
      # the duplicate check (409) and findByEmail lookup both depend on it, and GDPR
      # erasure keeps a tombstone email to satisfy the constraint. Omitting it returns
      # 400 VALIDATION_ERROR ("email is required") — see PartyResource.CreatePartyRequest.
      required: [partyType, legalName, email]
      properties:
        partyType:
          type: string
          enum: [INDIVIDUAL, SOLE_TRADER, COMPANY, TRUST]
        legalName:
          type: string
        tradingName:
          type: string
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
          description: ISO 3166-1 alpha-3 country code
        taxId:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
          format: email
          description: Required. Unique across all parties.
        phone:
          type: string
        address:
          $ref: '#/components/schemas/AddressDto'
        consentGdpr:
          type: boolean
          description: >-
            Onboarding consent capture (mobile app "Agreement" step, ADR-0069). Omitted for
            operator-created parties. When present, the service stamps a capture timestamp.
        consentMarketing:
          type: boolean
          description: Optional marketing-communications consent from the same onboarding step.

    UpdatePartyRequest:
      type: object
      properties:
        legalName:
          type: string
        tradingName:
          type: string
        address:
          $ref: '#/components/schemas/AddressDto'

    MergePartyRequest:
      type: object
      required: [mergedIntoPartyId, reason]
      properties:
        mergedIntoPartyId:
          type: string
          format: uuid
          description: >-
            The surviving party. Must be live and must not itself be merged — resolve chains to
            the final survivor before calling.
        reason:
          type: string
          description: Operator-supplied justification, recorded on the audit event.
        approvalReference:
          type: string
          nullable: true
          description: >-
            The ledger approval that authorised the balance sweep, linking the ADJUSTMENT journal
            entries to this identity retirement.

    UpdateConsentRequest:
      type: object
      required: [marketingConsent]
      properties:
        marketingConsent:
          type: boolean
          description: >-
            Live, revocable marketing-communications preference (mobile app Profile screen).
            Not the onboarding-time consentGdpr snapshot — that isn't Art 6(1)(a) consent and
            has no update path.

    AddDocumentRequest:
      type: object
      required: [documentType, documentNumber, issuingCountry]
      properties:
        documentType:
          type: string
          enum: [PASSPORT, ID_CARD, DRIVING_LICENSE, COMPANY_REGISTRATION]
        documentNumber:
          type: string
        issuingCountry:
          type: string
        expiryDate:
          type: string
          format: date

    KycStatusRequest:
      type: object
      required: [kycStatus]
      properties:
        kycStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED, EXPIRED]

    AddressDto:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string

    ResolvePartyRequest:
      type: object
      description: ADR-0072 dedup gate — caller supplies the raw RČ; server normalises and hashes it.
      required: [rc]
      properties:
        rc:
          type: string
          description: Czech rodné číslo (RČ) in any locally accepted format (slashes optional).

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
