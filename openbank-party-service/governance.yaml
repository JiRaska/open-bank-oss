# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: identity
primaryDatastore: PostgreSQL
databaseName: openbank_parties
dataLineageRole: producer
dataClassification: restricted
retentionPolicy: 10 years
evidenceExported: true
lineage:
  upstream: []
  downstream:
    # Direction corrected (issue #3982): both were declared as `upstream` (account-service
    # "owner", kyc-service "updates"), i.e. those services calling party-service. The clients
    # live in party-service — AccountServiceClient(configKey = "account-service") and
    # GdprDownstreamClients(configKey = "kyc-service") — and party-service's Deployment env
    # carries ACCOUNT_SERVICE_URL and KYC_SERVICE_URL. Real edges, declared backwards.
    - serviceName: account-service
      relationType: api
      description: reads/queries the party's accounts (also GDPR erasure fan-out)
    - serviceName: kyc-service
      relationType: api
      description: GDPR erasure fan-out via GdprDownstreamClients
    - serviceName: audit-service
      relationType: topic
      description: events
    - serviceName: account-service
      relationType: topic
      description: opens account on PARTY_CREATED
databaseLineage:
  ownedDatabases:
    - openbank_parties
  dependentDatabases:
    - openbank_accounts
    - openbank_kyc
