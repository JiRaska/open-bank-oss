quarkus:
  application:
    name: openbank-mcp-service
  http:
    port: 8150
    limits:
      # ADR-0383 D5: bound a request body before it is parsed. Global to this service, which only
      # serves small JSON-RPC and session-control bodies; oversize requests get HTTP 413.
      max-body-size: ${MCP_MAX_BODY_SIZE:64K}
    # ADR-0383 D5 / #16847: behind the edge, quarkus-oidc's own DPoP check (enabled for the
    # customers tenant by `token.authorization-scheme: DPoP`, BearerAuthenticationMechanism) compares
    # the proof `htu` with HttpServerRequest.absoluteURI() — measured: "DPoP proof HTTP request uri
    # claim https://… does not match the request HTTP uri http://localhost:…". This service's own
    # admission checks `htu` against the static published resource; it is the TENANT that needs the
    # external scheme/host. Off by default. Quarkus applies these headers ONLY from
    # `quarkus.http.proxy.trusted-proxies` (deliberately not defined here: set it in the deployment);
    # ProxyForwardingGuard refuses to boot with any forwarding switch on and no narrow literal list.
    proxy:
      proxy-address-forwarding: ${MCP_PROXY_FORWARDING:false}
      allow-x-forwarded: ${MCP_PROXY_FORWARDING:false}
      enable-forwarded-host: ${MCP_PROXY_FORWARDING:false}
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.iam.svc:8080/realms/openbank}
    # ADR-0195 step 4: resource-server mode enabled. Quarkus now validates any presented Bearer
    # token and populates JsonWebToken from it; without this flip the Authorization header is never
    # even inspected, so CallerContextResolver could never see a real `sub`/`consent_id` no matter
    # what a caller sent. No @Authenticated/permission policy is added — a request WITHOUT a token
    # still reaches McpEndpoint (anonymous JsonWebToken, subject null); CallerContextResolver's own
    # null-check + the now-removed McpEndpoint placeholder fallback is what turns "no token" into a
    # deny, not a framework-level 401. A PRESENT-but-invalid/expired token IS rejected by Quarkus
    # OIDC itself before reaching the endpoint (fail-closed either way).
    tenant-enabled: true
    # ADR-0383 D1: the customers realm is a SEPARATE tenant selected by the token's `iss`. Both the
    # tenant and issuer-based resolution stay OFF unless the customer channel is enabled, so the staff
    # tenant's behaviour is unchanged by default. Not yet verified against a live Keycloak (ADR-0383 P3).
    resolve-tenants-with-issuer: ${MCP_CUSTOMER_ENABLED:false}
    customers:
      tenant-enabled: ${MCP_CUSTOMER_ENABLED:false}
      auth-server-url: ${MCP_CUSTOMER_OIDC_URL:http://keycloak.iam.svc:8080/realms/openbank-customers}
      token:
        # Keycloak signs with its frontend URL, not the in-cluster discovery URL.
        issuer: ${mcp.customer.issuer}
        # RFC 9449: customer tokens arrive as `Authorization: DPoP <token>`.
        authorization-scheme: DPoP
  # Outbound M2M client-credentials auth (ADR-0195 step 3) — mirrors agent-service's oidc-client
  # exactly: DownstreamClients / ConsentValidateClient (@RegisterProvider
  # OidcClientRequestReactiveFilter) mint an `openbank-services` token and attach it as a Bearer, so
  # RealAccountReadPort reaches consent/account/balance/transaction-service as the SAME shared
  # least-privilege service principal (service-account-openbank-services) those services already
  # grant reads to (rest.rego: service-consent-m2m / service-account-read / service-balance-read;
  # transaction-service via base rest.rego operator-read-any, since the shared client's token
  # carries ROLE_OPERATOR — no NEW rego grant needed for any of the four downstream services).
  # Not yet consumed: RealAccountReadPort / DownstreamClients / ConsentValidateClient stay @Vetoed
  # until step 4's CDI cutover, so this config is inert (Quarkus only validates it once injected).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.iam.svc:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: ${OIDC_TLS_VERIFICATION:required}
    # #10486 batch 7: the MCP read ports whose upstream grant depended on the shared client's
    # ROLE_OPERATOR (transaction list, SEPA and domestic payment confirmation) mint from this NAMED client
    # instead, so the upstream sees service-account-openbank-mcp (ROLE_API only) and grants it only what the
    # mcp-anonymous charter can reach.
    m2m:
      auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
      client-id: openbank-mcp
      credentials:
        secret: ${OIDC_M2M_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
      grant:
        type: client
  rest-client:
    # In-cluster ClusterIPs — same targets + ports agent-service's ServiceClients already use.
    account-service:
      url: http://localhost:8100
      connect-timeout: 2000
      read-timeout: 5000
    balance-service:
      url: http://localhost:8103
      connect-timeout: 2000
      read-timeout: 5000
    transaction-service:
      url: http://localhost:8102
      connect-timeout: 2000
      read-timeout: 5000
    consent-service:
      url: http://localhost:8106
      connect-timeout: 2000
      read-timeout: 5000
    # get_statement / get_payment_confirmation (issue #4109, ADR-0248). Same M2M principal as the
    # four clients above (service-account-openbank-services via oidc-client) reaching them through
    # base rest.rego operator-read-any — statement.read / sepaPayment.read / domestic-payment.read
    # all end in `.read`, and the shared client's token already carries ROLE_OPERATOR, so no new
    # rego grant is needed (same reasoning as transaction-service above).
    statement-service:
      url: http://localhost:8136
      connect-timeout: 2000
      read-timeout: 5000
    sepa-payment-service:
      url: http://localhost:8115
      connect-timeout: 2000
      read-timeout: 5000
    domestic-payment-service:
      url: http://localhost:8116
      connect-timeout: 2000
      read-timeout: 5000
    # ADR-0383 D3: the customer's MCP_CLIENT grant lookup (mcp-service's own m2m identity).
    delegation-service:
      url: http://localhost:8126
      connect-timeout: 2000
      read-timeout: 3000
    # ADR-0383 D4: the customers-realm token endpoint for the RFC 8693 exchange.
    customer-token-exchange:
      url: ${MCP_CUSTOMER_OIDC_URL:http://keycloak.iam.svc:8080/realms/openbank-customers}
      connect-timeout: 2000
      read-timeout: 3000
  smallrye-openapi:
    info-title: OpenBank MCP Server
    info-version: "1.0.0"

  # ADR-0224 D2: the agent-session store (this service's first persistence).
  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_mcp
      max-size: 20
      # Reactive pool eviction. openbank-libs META-INF/microprofile-config.properties carries
      # these fleet-wide (issue #1682), but this service depends only on openbank-libs-domain /
      # openbank-libs-runtime, neither of which ships that file — so it inherited neither, and
      # both levers are OFF by Quarkus default. Eviction-only: they purge dead/aged connections
      # and add no reconnect aggression. Also the compensating control recorded in the
      # CVE-2025-14969 VEX statement (hibernate-reactive connection-leak DoS): a leaked pooled
      # connection ages out instead of persisting until a pod restart.
      idle-timeout: 5M
      max-lifetime: 30M
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_mcp
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none

# OPA PDP (ADR-0034). Phase 1: no sidecar deployed yet, so the default localhost:8181 fails closed
# (every tools/call denied) until the gitops component ships the sidecar (deploy follow-up).
opa:
  url: ${OPA_URL:http://localhost:8181}
  path: ${OPA_PATH:/v1/data/openbank/rest/allow}
  timeout-ms: 500

mcp:
  server:
    name: openbank-mcp
    version: "0.1.0"
    protocol-version: "2025-06-18"
  # Customer MCP channel (ADR-0383 / ADR-0385, #16590). OFF by default. With it on, the service
  # refuses to boot unless the issuer is set and the client allowlist exists and parses
  # (CustomerChannel is @Startup).
  # #16847: `mcp.edge.client-address-header` (env MCP_EDGE_CLIENT_ADDRESS_HEADER) names the ONE
  # edge-set header carrying the client address (e.g. X-Envoy-External-Address), read only from a peer
  # in quarkus.http.proxy.trusted-proxies. Deliberately not defined here: unset = never read.
  # ClientAddressResolver never uses Quarkus' leftmost X-Forwarded-For for the audit key.
  customer:
    enabled: ${MCP_CUSTOMER_ENABLED:false}
    issuer: ${MCP_CUSTOMER_ISSUER:https://kc.open-bank.tech/realms/openbank-customers}
    allowlist: ${MCP_CUSTOMER_ALLOWLIST:classpath:mcp-client-allowlist.yaml}
    # ADR-0383 D3: positive grant lookups are cached at most this long (capped at PT30S in code), so
    # a revoked MCP_CLIENT grant stops working within this bound. "No grant" and lookup failures are
    # never cached.
    grant-cache-ttl: ${MCP_CUSTOMER_GRANT_CACHE_TTL:PT15S}
    # ADR-0383 D4: the customers-realm client that performs the RFC 8693 exchange (derived into the
    # realm by gen-mcp-realm-clients.py). Its secret is read ONLY from the environment
    # (MCP_CUSTOMER_EXCHANGE_CLIENT_SECRET, OpenBao keycloak/mcp-service-customer-exchange); with
    # none set, every customer read is refused rather than falling back to another credential.
    exchange:
      client-id: ${MCP_CUSTOMER_EXCHANGE_CLIENT_ID:openbank-mcp-service}

# Per-acting-agent rate limit on tools/call (#2409). The defaults are the code defaults
# (McpRateLimiter); `calls-per-day` mirrors the `mcp-anonymous` charter's `limits.runs_per_day`
# in openbank-libs/governance/agents.yaml, which nothing read before this landed.
openbank:
  # Opt in to the libs-runtime OPA sidecar PolicyDecisionPoint producer (replaces the
  # per-service AuthzProducer; same opa.url / opa.path / opa.timeout-ms keys and defaults).
  authz:
    opa-pdp-producer:
      enabled: true
  mcp:
    rate-limit:
      enabled: ${MCP_RATE_LIMIT_ENABLED:true}
      calls-per-minute: ${MCP_RATE_LIMIT_PER_MINUTE:60}
      calls-per-day: ${MCP_RATE_LIMIT_PER_DAY:1000}
      # Shared by ALL requests with no resolvable caller (ADR-0383 D5).
      anonymous-calls-per-minute: ${MCP_RATE_LIMIT_ANON_PER_MINUTE:10}
      # Concurrent in-flight tool calls per caller.
      max-in-flight: ${MCP_RATE_LIMIT_MAX_IN_FLIGHT:4}

"%dev":
  quarkus:
    oidc-client:
      tls:
        verification: none

"%test":
  quarkus:
    # No Keycloak in @QuarkusTest: OIDC resource-server and the outbound oidc-client stay off.
    oidc:
      tenant-enabled: false
    oidc-client:
      enabled: false
