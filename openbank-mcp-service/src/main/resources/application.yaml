quarkus:
  application:
    name: openbank-mcp-service
  http:
    port: 8150
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.iam.svc:8080/realms/openbank}
    # ADR-0195 step 4: resource-server mode enabled. Quarkus now validates any presented Bearer
    # token and populates JsonWebToken from it; without this flip the Authorization header is never
    # even inspected, so CallerContextResolver could never see a real `sub`/`consent_id` no matter
    # what a caller sent. No @Authenticated/permission policy is added — a request WITHOUT a token
    # still reaches McpEndpoint (anonymous JsonWebToken, subject null); CallerContextResolver's own
    # null-check + the now-removed McpEndpoint placeholder fallback is what turns "no token" into a
    # deny, not a framework-level 401. A PRESENT-but-invalid/expired token IS rejected by Quarkus
    # OIDC itself before reaching the endpoint (fail-closed either way).
    tenant-enabled: true
  # Outbound M2M client-credentials auth (ADR-0195 step 3) — mirrors agent-service's oidc-client
  # exactly: DownstreamClients / ConsentValidateClient (@RegisterProvider
  # OidcClientRequestReactiveFilter) mint an `openbank-services` token and attach it as a Bearer, so
  # RealAccountReadPort reaches consent/account/balance/transaction-service as the SAME shared
  # least-privilege service principal (service-account-openbank-services) those services already
  # grant reads to (rest.rego: service-consent-m2m / service-account-read / service-balance-read;
  # transaction-service via base rest.rego operator-read-any, since the shared client's token
  # carries ROLE_OPERATOR — no NEW rego grant needed for any of the four downstream services).
  # Not yet consumed: RealAccountReadPort / DownstreamClients / ConsentValidateClient stay @Vetoed
  # until step 4's CDI cutover, so this config is inert (Quarkus only validates it once injected).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.iam.svc:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: ${OIDC_TLS_VERIFICATION:none}
  rest-client:
    # In-cluster ClusterIPs — same targets + ports agent-service's ServiceClients already use.
    account-service:
      url: http://localhost:8100
    balance-service:
      url: http://localhost:8103
    transaction-service:
      url: http://localhost:8102
    consent-service:
      url: http://localhost:8106
    # get_statement / get_payment_confirmation (issue #4109, ADR-0248). Same M2M principal as the
    # four clients above (service-account-openbank-services via oidc-client) reaching them through
    # base rest.rego operator-read-any — statement.read / sepaPayment.read / domestic-payment.read
    # all end in `.read`, and the shared client's token already carries ROLE_OPERATOR, so no new
    # rego grant is needed (same reasoning as transaction-service above).
    statement-service:
      url: http://localhost:8136
    sepa-payment-service:
      url: http://localhost:8115
    domestic-payment-service:
      url: http://localhost:8116
  smallrye-openapi:
    info-title: OpenBank MCP Server
    info-version: "1.0.0"

  # ADR-0224 D2: the agent-session store (this service's first persistence).
  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_mcp
      # Reactive pool eviction. openbank-libs META-INF/microprofile-config.properties carries
      # these fleet-wide (issue #1682), but this service depends only on openbank-libs-domain /
      # openbank-libs-runtime, neither of which ships that file — so it inherited neither, and
      # both levers are OFF by Quarkus default. Eviction-only: they purge dead/aged connections
      # and add no reconnect aggression. Also the compensating control recorded in the
      # CVE-2025-14969 VEX statement (hibernate-reactive connection-leak DoS): a leaked pooled
      # connection ages out instead of persisting until a pod restart.
      idle-timeout: 5M
      max-lifetime: 30M
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_mcp
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none

# OPA PDP (ADR-0034). Phase 1: no sidecar deployed yet, so the default localhost:8181 fails closed
# (every tools/call denied) until the gitops component ships the sidecar (deploy follow-up).
opa:
  url: ${OPA_URL:http://localhost:8181}
  path: ${OPA_PATH:/v1/data/openbank/rest/allow}
  timeout-ms: 500

mcp:
  server:
    name: openbank-mcp
    version: "0.1.0"
    protocol-version: "2025-06-18"

# Per-acting-agent rate limit on tools/call (#2409). The defaults are the code defaults
# (McpRateLimiter); `calls-per-day` mirrors the `mcp-anonymous` charter's `limits.runs_per_day`
# in openbank-libs/governance/agents.yaml, which nothing read before this landed.
openbank:
  mcp:
    rate-limit:
      enabled: ${MCP_RATE_LIMIT_ENABLED:true}
      calls-per-minute: ${MCP_RATE_LIMIT_PER_MINUTE:60}
      calls-per-day: ${MCP_RATE_LIMIT_PER_DAY:1000}
