openapi: 3.0.3
info:
  title: OpenBank MCP Server
  version: 1.4.0
  description: >
    Model Context Protocol (JSON-RPC 2.0 over HTTP POST) exposing curated consent-scoped read tools
    and a HITL payment proposal to governed AI agents (ADR-0181). Every tools/call is authorized by
    the ADR-0034 OPA PDP as an AI_AGENT principal. In tools/list, domain is the canonical
    English business-domain label derived from packaged governance declarations. Shared tools
    report a domain only when their source owners agree; otherwise they report Unclassified.
paths:
  /api/v1/mcp/sessions:
    post:
      summary: Issue a staff OBO agent session (ADR-0224 D2)
      description: >-
        Creates a session for the authenticated operator with a role ceiling bounded to
        requested ∩ held roles, a client binding and a TTL. Requires ROLE_OPERATOR or
        ROLE_ADMIN (OPA action mcp.session.create).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string, default: admin-ui }
                roleCeiling:
                  type: array
                  items: { type: string }
                purpose: { type: string, nullable: true }
      responses:
        "201":
          description: Session created
        "403":
          description: Role ceiling is not a non-empty subset of the caller's roles
  /api/v1/mcp/sessions/{id}/bind:
    patch:
      summary: Bind a session to the jti of its exchanged token (ADR-0224 D2)
      description: >-
        One-time binding performed by the BFF after a successful Keycloak token exchange
        (OPA action mcp.session.bind; owner or ROLE_ADMIN). 409 if the session is already
        bound or the jti is taken.
      operationId: bindSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jti]
              properties:
                jti: { type: string }
      responses:
        "200": { description: Session bound }
        "404": { description: Not found }
        "409": { description: Already bound or jti taken }
  /api/v1/mcp/sessions/{id}:
    get:
      summary: Session status
      operationId: getSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Session status }
        "404": { description: Not found }
    delete:
      summary: Revoke a session immediately (self or admin)
      operationId: revokeSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "404": { description: No active session }
  /mcp:
    post:
      summary: MCP JSON-RPC endpoint (initialize, tools/list, tools/call, ping)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: { type: string, example: "2.0" }
                id: {}
                method: { type: string, example: tools/list }
                params: { type: object }
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
        "401":
          description: >-
            Customer channel only (ADR-0383 / ADR-0385, off by default). No token, a token not
            admitted for this server (audience, unlisted client, not DPoP-bound) or an invalid DPoP
            proof. `WWW-Authenticate` uses the `DPoP` scheme and carries the RFC 9728
            `resource_metadata` URL.
          headers:
            WWW-Authenticate:
              schema: { type: string }
        "429":
          description: Customer channel only. The DPoP proof quota for this key is exhausted.
        "503":
          description: Customer channel only. The DPoP replay store cannot answer; fails closed.
  /customer/mcp:
    post:
      summary: Customer MCP channel JSON-RPC endpoint (ADR-0383 / ADR-0385, #16847)
      description: >-
        The customer channel's own root, off by default. Served only on the mTLS listener the edge
        reaches (404 on plain HTTP). The customers realm authenticates DPoP and allowlisted Tier H
        bearer credentials. DPoP proof `htu` must match the externally visible URL. Tier H bearer
        requests require the signed identifier of the active approved connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: { type: string, example: "2.0" }
                id: {}
                method: { type: string, example: tools/list }
                params: { type: object }
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
        "401":
          description: >-
            No token, a token that is not an admitted customers-realm token, or an invalid DPoP proof.
            `WWW-Authenticate` uses the `DPoP` scheme and carries the RFC 9728 `resource_metadata` URL.
          headers:
            WWW-Authenticate:
              schema: { type: string }
        "404":
          description: The customer channel is disabled, or the request did not arrive over mTLS
        "429":
          description: The DPoP proof quota for this key is exhausted.
        "503":
          description: The DPoP replay store cannot answer; fails closed.
  /.well-known/oauth-protected-resource/customer/mcp:
    get:
      summary: RFC 9728 path-suffixed protected-resource metadata for the `/customer/mcp` resource
      responses:
        "200":
          description: Metadata (only while the customer channel is enabled, and only over mTLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
        "404":
          description: The customer channel is disabled, or the request did not arrive over mTLS
  /.well-known/oauth-protected-resource:
    get:
      summary: RFC 9728 protected-resource metadata for the customer MCP channel
      responses:
        "200":
          description: Metadata (only while the customer channel is enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
        "404":
          description: The customer channel is disabled
  /.well-known/oauth-protected-resource/mcp:
    get:
      summary: RFC 9728 path-suffixed protected-resource metadata for the `/mcp` resource
      responses:
        "200":
          description: Metadata (only while the customer channel is enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
        "404":
          description: The customer channel is disabled
  /.well-known/oauth-authorization-server/oauth/hosted:
    get:
      summary: Discover the hosted OAuth issuer
      operationId: hostedOAuthMetadata
      responses:
        "200":
          description: OAuth authorization server metadata for the enabled hosted clients
          content:
            application/json:
              schema: { type: object }
        "404": { description: Hosted OAuth unavailable }
  /oauth/hosted/authorize:
    get:
      summary: Start bank approval for a registered hosted OAuth client
      operationId: startHostedOAuth
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: response_type
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { type: string }
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "303":
          description: Continue with the bank or return to the registered hosted client
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { description: Invalid authorization request or browser transaction }
        "404": { description: Hosted OAuth unavailable }
  /oauth/hosted/callback:
    get:
      summary: Complete the bank-approved browser transaction
      operationId: completeHostedOAuth
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "303":
          description: Continue with the bank or return to the registered hosted client
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { description: Invalid authorization request or browser transaction }
        "404": { description: Hosted OAuth unavailable }
  /oauth/hosted/token:
    post:
      summary: Exchange a hosted authorization code or rotate a hosted refresh token
      operationId: issueHostedOAuthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, resource]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                resource: { type: string, format: uri }
                client_id: { type: string }
                client_assertion: { type: string }
                client_assertion_type: { type: string }
                client_secret: { type: string }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string, format: uri }
                refresh_token: { type: string }
                scope: { type: string }
      responses:
        "200":
          description: A read-only token pair for the approved connection
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, scope]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in: { type: integer, minimum: 1 }
                  scope: { type: string }
        "400":
          description: OAuth request rejected
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "404": { description: Hosted OAuth unavailable }
components:
  schemas:
    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: { type: string, format: uri }
        authorization_servers:
          type: array
          items: { type: string, format: uri }
        bearer_methods_supported:
          type: array
          items: { type: string }
        dpop_signing_alg_values_supported:
          type: array
          items: { type: string }
        dpop_bound_access_tokens_required: { type: boolean }
