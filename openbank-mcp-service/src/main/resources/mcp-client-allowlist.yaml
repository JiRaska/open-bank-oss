#
# THE MCP CLIENT ALLOWLIST — ADR-0385 D1 ("one declaration drives both mcp-service and Keycloak").
#
# This file is the single source for:
#   1. the customers-realm client config of every MCP client
#      (openbank-infra/gitops/components/keycloak/customers-realm-template.json — the `clients[]`
#      entries carrying `openbank.mcp.tier`, and the `openbank-mcp-fresh-passkey` browser flow they
#      are bound to). Those entries are DERIVED: never hand-edit them, run
#        python3 .github/scripts/gen-mcp-realm-clients.py
#   2. mcp-service's tier admission (the tier is read from HERE, keyed by `azp`, never from a
#      token claim or client-supplied metadata — ADR-0385 D1).
#
# Enforced by the `mcp-client-realm-parity` gate (.github/scripts/check-mcp-client-realm-parity.py):
# a realm client that does not match its declared tier, an undeclared realm client carrying the
# MCP marker, or a client-secret exception past its expiry date fails CI.
#
# The tier is assigned by REGISTRATION BEHAVIOUR (redirect type, whether it authenticates, whether
# it sends DPoP), never by product name. Client ids here are bank-assigned and name no vendor.
#
#   H  hosted confidential client: fixed HTTPS redirect, client authentication at the token AND
#      refresh endpoints. `auth.method: private_key_jwt` (default) pins the JWKS by content: the
#      key set is committed under mcp-clients/ and its sha256 is declared below, so a changed key
#      set is a reviewed diff, not a remote fetch. `client_secret` is admitted ONLY with a
#      `secret_exception` (owner risk acceptance, <= 6 months); after `expires` the gate fails and
#      the client must be disabled or re-accepted.
#   L  local public client: loopback redirect `http://127.0.0.1` / `http://[::1]` (RFC 8252,
#      variable port, never `localhost`), DPoP-bound tokens required.
#
# Every client is declared `enabled: false` until ADR-0383's exposure order holds (no route to
# mcp-service exists before every delivery check passes). The two `*-reference` clients are the
# shape templates the gate and the live-Keycloak verification run against; neither is a real
# platform registration and the reference key set's private half was never stored.

schema_version: 1

# RFC 8707 resource / RFC 9728 protected resource. Access tokens carry aud = `audience`.
resource: https://mcp.open-bank.tech/customer/mcp
audience: openbank-mcp-service

# The default browser-flow override (ADR-0385 D2.2): a fresh
# passwordless WebAuthn assertion, NO auth-cookie alternative.
flow:
  alias: openbank-mcp-fresh-passkey
  id: 6d1c0b8e-3f4a-4c2e-9a51-0385d2f2a001

# A Tier H client can opt in with `browser_flow: native-passkey`.
native_flow:
  alias: openbank-mcp-native-passkey
  id: efd9751b-94d8-4ae5-80dc-3f078a671b2d

# ADR-0383 D4: the RFC 8693 exchange mcp-service performs for every customer read. DERIVED into the
# realm by gen-mcp-realm-clients.py and asserted by the parity gate:
#   * `requester` is mcp-service's confidential customers-realm client. Its client_id MUST equal
#     `audience` above: Keycloak's standard exchange only accepts a subject token whose `aud` names
#     the requesting client, and every MCP client's tokens carry exactly that audience. Exchange is
#     enabled on THIS client only (every MCP client keeps it explicitly false), it has no flow and
#     no service account, and its tokens live at most 60 s.
#   * each `audiences` entry is one downstream service and the ONE read scope that adds it to the
#     exchanged token's `aud`. mcp-service's `DownstreamAudience` enum must name the same pairs
#     (McpExchangeAllowlistParityTest).
exchange:
  requester:
    client_id: openbank-mcp-service
    secret_placeholder: __MCP_CUSTOMER_EXCHANGE_CLIENT_SECRET__
    access_token_lifespan: 60
  audiences:
    - client_id: openbank-balance-service
      scope: mcp-customer-balance-read
    - client_id: openbank-transaction-service
      scope: mcp-customer-transaction-read

clients:
  - client_id: https://chatgpt.com/oauth/client.json
    tier: H
    enabled: false
    browser_flow: native-passkey
    display_name: "ChatGPT"
    redirect_uris:
      - https://chatgpt.com/connector_platform_oauth_redirect
    auth:
      method: private_key_jwt
      signing_alg: RS256
      jwks_file: mcp-clients/chatgpt.jwks.json
      jwks_sha256: e92c2799a5b8d33b19231421ffe6609a2770edba72d0212bae10919472a26e4b

  - client_id: mcp-claude-sandbox
    tier: H
    enabled: false
    browser_flow: native-passkey
    display_name: "Claude"
    redirect_uris:
      - https://claude.ai/api/mcp/auth_callback
    auth:
      method: client_secret
      secret_placeholder: __MCP_CLAUDE_SANDBOX_CLIENT_SECRET__
    secret_exception:
      accepted: "2026-11-24"
      expires: "2026-12-24"
      risk_acceptance: "Owner-approved 30-day synthetic sandbox exception recorded in PR #17242"

  - client_id: mcp-hosted-reference
    tier: H
    enabled: false
    display_name: "Reference hosted assistant (template, not a registration)"
    redirect_uris:
      - https://mcp-client.example/oauth/callback
    auth:
      method: private_key_jwt
      signing_alg: ES256
      jwks_file: mcp-clients/mcp-hosted-reference.jwks.json
      jwks_sha256: f55634da1e50148546228de3c0acff83e16332e710ee17d662d513db9356b1ff

  - client_id: mcp-local-reference
    tier: L
    enabled: false
    display_name: "Reference local assistant (template, not a registration)"
    redirect_uris:
      - http://127.0.0.1/callback
      - http://[::1]/callback
