openapi: "3.0.3"
info:
  title: OpenBank Settlement Service
  # 1.9 -> 1.10 (#11588): additive verified makerActorKind on approval responses.
  version: "1.10.0"
  description: "Settlement orchestration service (ADR-0101 P3)"
paths:
  /api/v1/settlements:
    post:
      tags: [Settlements]
      summary: Originate a settlement and start its workflow
      operationId: originateSettlement
      description: >-
        settlement.create is four-eyes gated (ADR-0155, rules.yaml four_eyes.actions). Where the
        service runs with authz.four-eyes.enforce=true, the first call answers 202 with an
        approvalId and creates nothing; a different operator decides it via
        PATCH /api/v1/settlements/approvals/{id}; the maker then repeats the IDENTICAL request
        with X-Approval-Id, which executes once. An approval is bound to the exact instruction.
      parameters:
        - name: X-Approval-Id
          in: header
          required: false
          description: Id of an APPROVED four-eyes approval for this exact request; consumed once.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementRequest"
      responses:
        "201":
          description: Settlement created (PENDING); the workflow settles it asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "202":
          description: >-
            Four-eyes approval required; nothing was created. The body carries the approvalId of a
            PENDING approval bound to this exact request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApprovalResponse"
        "400":
          description: Malformed instruction; refused before any approval is created or consumed.
        "401":
          description: Unauthenticated.
        "403":
          description: >-
            Not authorized. Requires SERVICE/OPERATOR/ADMIN (RBAC) and an allow decision
            from the fine-grained `settlement.create` OPA policy, enforced as of
            ADR-0034 Phase 5 (issue #266).
  /api/v1/settlements/{id}:
    get:
      tags: [Settlements]
      summary: Read a settlement's persisted status
      operationId: getSettlement
      description: >-
        Returns the stored settlement for operator reconciliation. Reading never starts, resumes
        or retries the settlement workflow. Only BOOKED confirms completion; PENDING with
        recoveryRequired=true means a balance movement may have committed and needs reconciliation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Persisted settlement state. Not cacheable.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "400":
          description: The id is not a canonical UUID.
        "401":
          description: Unauthenticated.
        "403":
          description: >-
            Not authorized. Requires a human OPERATOR or ADMIN (RBAC) and an allow decision for the
            `settlement.read` OPA action; service-account identities are refused.
        "404":
          description: No settlement with this id.
  /api/v1/settlements/approvals:
    get:
      tags: [Settlement Approvals]
      summary: List pending four-eyes approvals, oldest first (ADR-0227 D2)
      description: >-
        The checker's queue. Human operators only — every service-account principal is denied by
        policy, because the queue exposes the maker and the bound instruction of each request.
      operationId: listPendingSettlementApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalResponse"
        "401":
          description: Unauthenticated.
        "403":
          description: Not authorized (ROLE_OPERATOR/ROLE_ADMIN and settlement.approval.read).
  /api/v1/settlements/approvals/{id}:
    get:
      tags: [Settlement Approvals]
      summary: Read one four-eyes approval with its bound instruction, in any status
      operationId: getSettlementApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The approval and its evidence, including expired and consumed approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementApprovalDetail"
        "401":
          description: Unauthenticated.
        "403":
          description: Not authorized (ROLE_OPERATOR/ROLE_ADMIN and settlement.approval.read).
        "404":
          description: No approval with this id.
    patch:
      tags: [Settlement Approvals]
      summary: Approve or reject a pending four-eyes approval (ADR-0155)
      description: >-
        The checker is the authenticated principal, never the body, and must differ from the
        maker. An approval can be decided once.
      operationId: decideSettlementApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          description: Missing body.
        "401":
          description: Unauthenticated.
        "403":
          description: >-
            Not authorized (ROLE_OPERATOR/ROLE_ADMIN and settlement.approval.decide), or the
            checker is the maker.
        "404":
          description: No pending approval with this id.
        "409":
          description: The approval was already decided.
components:
  schemas:
    PendingApprovalResponse:
      type: object
      required: [status, approvalId]
      properties:
        status: { type: string, enum: [PENDING_APPROVAL] }
        approvalId: { type: string }
    DecideApprovalRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
    ApprovalResponse:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        resourceId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXECUTED] }
        makerId: { type: string, nullable: true }
        makerActorKind: { type: string, enum: [HUMAN, AI_AGENT, SERVICE_ACCOUNT, CUSTOMER_PARTY, UNKNOWN] }
        createdAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true }
    SettlementApprovalDetail:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        resourceId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXECUTED] }
        makerId: { type: string }
        makerActorKind: { type: string, enum: [HUMAN, AI_AGENT, SERVICE_ACCOUNT, CUSTOMER_PARTY, UNKNOWN] }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }
        expired:
          type: boolean
          description: True once the authorization expired; an expired approval can no longer be decided or claimed.
        summary:
          type: string
          nullable: true
          description: >-
            Bounded, redacted rendering of the exact request the approval is bound to (endpoint and
            arguments) — what the checker reviews. Informational; the binding itself is a fingerprint.
    CreateSettlementRequest:
      type: object
      required: [idempotencyKey, payerAccountId, payeeAccountId, amount, currency]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          description: "Caller-supplied dedup token; re-submitting the same key returns the original settlement."
        payerAccountId: { type: string, format: uuid }
        payeeAccountId: { type: string, format: uuid }
        amount: { type: string, description: "Positive decimal amount, e.g. 250.00" }
        currency: { type: string, minLength: 3, maxLength: 3, example: CZK }
    SettlementResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        payerAccountId: { type: string, format: uuid }
        payeeAccountId: { type: string, format: uuid }
        amount:
          type: string
          description: Persisted decimal amount, using the database precision of four fractional digits.
        currency: { type: string }
        status:
          type: string
          description: >
            Settlement saga state. The compensation outcomes are distinct values on purpose
            (issue #6037): REVERSED and CREDITED_REVERSED mean balance-service accepted the
            counter-movement and the money is back; REVERSAL_FAILED means a reversal was attempted
            and refused (typically the payee has spent the funds) and the money is still moved;
            LEDGER_REVERSAL_UNSUPPORTED means a journal for this settlement was confirmed to
            exist in the general ledger and was not reversed, so the GL needs a manual correcting
            entry; LEDGER_NOT_POSTED means the ledger was asked and holds no journal for the
            settlement, so nothing was owed and nothing was done; LEDGER_STATE_UNKNOWN means the
            lookup itself failed and neither of those two could be established (issue #6410).
            Those three are separate values rather than one because they call for different
            actions, and reporting the wrong one either summons an accountant to correct an entry
            that does not exist or asserts a clean ledger nobody checked.
            An uncertain forward balance movement is exposed as PENDING with recoveryRequired=true
            and recoveryReason=BALANCE_STATE_UNKNOWN. PENDING does not prove no money has moved.
            LEDGER_REVERSED is deprecated and is no longer produced —
            the code path that wrote it updated this column without reversing anything.
            REJECTED means the saga unwound COMPLETELY: it is written only when every compensation
            succeeded (issue #6286). A settlement whose compensation was refused stays in
            REVERSAL_FAILED and is never rejected, so REJECTED never has to be read as "possibly
            still owed".
          enum:
            - PENDING
            - DEBITED
            - CREDITED
            - BOOKED
            - REJECTED
            - REVERSED
            - CREDITED_REVERSED
            - REVERSAL_FAILED
            - LEDGER_REVERSAL_UNSUPPORTED
            - LEDGER_NOT_POSTED
            - LEDGER_STATE_UNKNOWN
            - LEDGER_REVERSED
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        recoveryRequired:
          type: boolean
          description: An uncertain forward balance movement requires reconciliation before settlement can finish.
        recoveryReason:
          type: string
          nullable: true
          description: >-
            Reason for required reconciliation, or null. BALANCE_STATE_UNKNOWN means a forward
            debit or credit may have committed without a reliable completion result. Clients must
            tolerate additional reasons. No automatic counter-movement or rejection is attempted.
