openapi: "3.0.3"
info:
  title: OpenBank Settlement Service
  version: "1.6.0"
  description: "Settlement orchestration service (ADR-0101 P3)"
paths:
  /api/v1/settlements:
    post:
      tags: [Settlements]
      summary: Originate a settlement and start its workflow
      operationId: originateSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementRequest"
      responses:
        "201":
          description: Settlement created (PENDING); the workflow settles it asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "401":
          description: Unauthenticated.
        "403":
          description: >-
            Not authorized. Requires SERVICE/OPERATOR/ADMIN (RBAC) and an allow decision
            from the fine-grained `settlement.create` OPA policy, enforced as of
            ADR-0034 Phase 5 (issue #266).
components:
  schemas:
    CreateSettlementRequest:
      type: object
      required: [idempotencyKey, payerAccountId, payeeAccountId, amount, currency]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          description: "Caller-supplied dedup token; re-submitting the same key returns the original settlement."
        payerAccountId: { type: string, format: uuid }
        payeeAccountId: { type: string, format: uuid }
        amount: { type: string, description: "Positive decimal amount, e.g. 250.00" }
        currency: { type: string, minLength: 3, maxLength: 3, example: CZK }
    SettlementResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        payerAccountId: { type: string, format: uuid }
        payeeAccountId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string }
        status:
          type: string
          description: >
            Settlement saga state. The compensation outcomes are distinct values on purpose
            (issue #6037): REVERSED and CREDITED_REVERSED mean balance-service accepted the
            counter-movement and the money is back; REVERSAL_FAILED means a reversal was attempted
            and refused (typically the payee has spent the funds) and the money is still moved;
            LEDGER_REVERSAL_UNSUPPORTED means a journal for this settlement was confirmed to
            exist in the general ledger and was not reversed, so the GL needs a manual correcting
            entry; LEDGER_NOT_POSTED means the ledger was asked and holds no journal for the
            settlement, so nothing was owed and nothing was done; LEDGER_STATE_UNKNOWN means the
            lookup itself failed and neither of those two could be established (issue #6410).
            Those three are separate values rather than one because they call for different
            actions, and reporting the wrong one either summons an accountant to correct an entry
            that does not exist or asserts a clean ledger nobody checked.
            LEDGER_REVERSED is deprecated and is no longer produced —
            the code path that wrote it updated this column without reversing anything.
            REJECTED means the saga unwound COMPLETELY: it is written only when every compensation
            succeeded (issue #6286). A settlement whose compensation was refused stays in
            REVERSAL_FAILED and is never rejected, so REJECTED never has to be read as "possibly
            still owed".
          enum:
            - PENDING
            - DEBITED
            - CREDITED
            - BOOKED
            - REJECTED
            - REVERSED
            - CREDITED_REVERSED
            - REVERSAL_FAILED
            - LEDGER_REVERSAL_UNSUPPORTED
            - LEDGER_NOT_POSTED
            - LEDGER_STATE_UNKNOWN
            - LEDGER_REVERSED
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
