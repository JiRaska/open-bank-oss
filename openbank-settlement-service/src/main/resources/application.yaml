quarkus:
  application:
    name: openbank-settlement-service
  http:
    port: 8138
  datasource:
    db-kind: postgresql
    reactive:
      url: "${QUARKUS_DATASOURCE_REACTIVE_URL:vertx-reactive:postgresql://localhost:5432/settlement}"
    username: "${QUARKUS_DATASOURCE_USERNAME:openbank_settlement}"
    password: "${QUARKUS_DATASOURCE_PASSWORD:settlement}"
    # The DEFAULT (Agroal/JDBC) datasource Flyway migrates. Without it `migrate-at-start` kills
    # the boot with "Unable to find datasource '<default>'" — settlement-service has the same
    # defect as the four named in #3080, which the issue missed. Env var wins in the cluster.
    jdbc:
      url: "${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/settlement}"
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  log:
    level: INFO
    category:
      "com.openbank":
        level: DEBUG
  rest-client:
    # Local-dev defaults ONLY. The in-cluster URLs are supplied by the Rollout's env
    # (BALANCE_SERVICE_URL / LEDGER_SERVICE_URL in
    # openbank-infra/gitops/components/payments/payments-services.yaml), which is the fleet
    # convention every other consumer of these two services follows (transaction, billing,
    # statement, lending). The previous defaults named `openbank-balance-service:8080` and
    # `openbank-ledger-service:8080` — no Service of either name exists in any namespace, and
    # the ports were wrong too (balance is 8103, ledger is 8101). Because the Rollout carried
    # no env override, those were the EFFECTIVE values in the cluster, so every settlement
    # debit/credit and every GL posting dialled a name that cannot resolve (issue #3931).
    balance-api:
      url: "${BALANCE_SERVICE_URL:http://localhost:8103}"
      scope: jakarta.inject.Singleton
    ledger-api:
      url: "${LEDGER_SERVICE_URL:http://localhost:8101}"
      scope: jakarta.inject.Singleton

openbank:
  temporal:
    # ADR-0209 D1 (#2572): server-url and namespace were previously carried as this service's own
    # @WithDefault values in a per-service TemporalConfig copy. The shared contract in
    # openbank-libs-runtime cannot hold 14 different defaults, so the effective values are written
    # here explicitly — behaviour-preserving, and now visible rather than buried in a Kotlin default.
    server-url: localhost:7233
    namespace: openbank-settlement
    task-queue: openbank-settlement
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  settlement:
    gl:
      debit-account-id: "${SETTLEMENT_GL_DEBIT_ACCOUNT_ID:a0000000-0000-0000-0000-000000000002}"
      credit-account-id: "${SETTLEMENT_GL_CREDIT_ACCOUNT_ID:a0000000-0000-0000-0000-000000000002}"

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"

"%test":
  quarkus:
    oidc:
      enabled: false
    management:
      enabled: false
    rest-client:
      balance-api:
        url: http://localhost:${quarkus.http.port}
      ledger-api:
        url: http://localhost:${quarkus.http.port}
  openbank:
    settlement:
      # No real Temporal frontend in @QuarkusTest: don't register the worker (it would fail boot on
      # UNAVAILABLE). Tests that need the workflow drive their own in-process TestWorkflowEnvironment.
      worker:
        enabled: false
      gl:
        debit-account-id: "a0000000-0000-0000-0000-000000000002"
        credit-account-id: "a0000000-0000-0000-0000-000000000002"
