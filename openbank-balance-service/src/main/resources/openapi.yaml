openapi: 3.1.0
info:
  title: Balance Service API
  version: 1.9.1
  description: >-
    Account balance management — holds, credits, debits, multi-currency. Per ADR-0039 (Phase A) a
    read-only reconciliation ties out, per currency, the ledger deposit-control balance against the
    sum of booked balances here, surfacing any drift between the two writers until balance becomes a
    true ledger projection.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8103
    description: Local development
tags:
  - name: Balances
  - name: Reconciliation

paths:
  /api/v1/balances/{accountId}:
    get:
      tags: [Balances]
      summary: Get all balances for an account
      operationId: getBalances
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: All currency balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/{accountId}/{currency}:
    get:
      tags: [Balances]
      summary: Get balance for specific currency
      operationId: getBalance
      parameters:
        - $ref: '#/components/parameters/accountId'
        - name: currency
          in: path
          required: true
          schema:
            type: string
            example: CZK
        - name: asOf
          in: query
          required: false
          description: >-
            Optional point-in-time read: returns the end-of-day booked balance as of this date
            (rewinding the current balance by ledger-projection deltas booked after it). Omit for the
            current live balance. Available equals booked and holds are omitted for historical reads.
          schema:
            type: string
            format: date
            example: '2026-06-07'
      responses:
        '200':
          description: Balance for currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/balances/{accountId}/{currency}/overdraft-limit:
    put:
      tags: [Balances]
      summary: Set the arranged overdraft limit on a balance
      description: >-
        A supervisory limit override, not a money movement: requires ROLE_SUPERVISOR or ROLE_ADMIN
        (authorize action `balance.overdraftLimit`) — deliberately narrower than the credit/debit
        endpoints, which the transaction saga's service identity may call.
      operationId: setOverdraftLimit
      parameters:
        - $ref: '#/components/parameters/accountId'
        - name: currency
          in: path
          required: true
          schema:
            type: string
            example: CZK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arrangedOverdraftLimit]
              properties:
                arrangedOverdraftLimit:
                  type: number
                  description: The arranged (authorised) overdraft floor for this balance.
      responses:
        '200':
          description: The updated balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/balances/{accountId}/holds:
    post:
      tags: [Balances]
      summary: Place a hold on funds
      description: >-
        Idempotent on the natural key (accountId, currency, referenceId): the referenceId names one
        durable business fact (a payment authorisation), so a retried placeHold with the same triple
        replays the original hold and reserves nothing a second time (ADR-0287).
      operationId: placeHold
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceHoldRequest'
      responses:
        '200':
          description: Hold placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/holds/{holdId}:
    delete:
      tags: [Balances]
      summary: Release a hold
      operationId: releaseHold
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Hold released
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/{accountId}/credit:
    post:
      tags: [Balances]
      summary: Credit an account
      description: >-
        Idempotent on the request `referenceId`: a retried credit with the same referenceId applies
        the movement exactly once (the dedup marker and the balance change are written in one
        transaction), so an at-least-once delivery or client retry never double-counts.
      operationId: creditAccount
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyMovementRequest'
      responses:
        '200':
          description: Updated balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/{accountId}/debit:
    post:
      tags: [Balances]
      summary: Debit an account
      description: >-
        Idempotent on the request `referenceId` (see credit): a retried debit applies exactly once;
        the overdraft guard runs only on the first application, and a duplicate returns the
        already-debited balance without re-checking funds.
      operationId: debitAccount
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyMovementRequest'
      responses:
        '200':
          description: Updated balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Insufficient funds

  /api/v1/balances/{accountId}/initialize:
    post:
      tags: [Balances]
      summary: Initialize balance for a new account
      description: >-
        Idempotent on the natural key (accountId, currency): a repeat call for an already
        initialized pair returns the existing balance unchanged (ADR-0287).
      operationId: initializeBalance
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeBalanceRequest'
      responses:
        '201':
          description: Balance initialized
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/reconciliation:
    post:
      tags: [Reconciliation]
      summary: Run the control-account ⇄ sub-ledger reconciliation for a date
      description: >-
        Runs the ADR-0039 Phase A tie-out as of the given date (default today), comparing the ledger
        deposit-control balance against the sum of booked balances per currency, persisting the run
        and surfacing drift. Read-only — mutates no balance; a re-run for the same date records a
        fresh report row by design (an audit trail of runs), so a retry has no double effect
        (ADR-0287).
      operationId: runReconciliation
      parameters:
        - name: asOf
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '201':
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/reconciliation/latest:
    get:
      tags: [Reconciliation]
      summary: Get the most recent reconciliation run
      operationId: getLatestReconciliation
      responses:
        '200':
          description: Latest reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No reconciliation has been run yet

  /api/v1/balances/approvals:
    get:
      tags: [Balances]
      summary: List pending balance approvals, oldest first
      description: >-
        PENDING maker-checker approvals for balance credit/debit actions. This read-only queue is
        consumed by the unified approval inbox; deciding remains on PATCH
        /api/v1/balances/approvals/{id}. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending balance approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/balances/approvals/{id}:
    patch:
      tags: [Balances]
      summary: Approve or reject a pending four-eyes approval for a balance adjustment (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes balance approval. makerId identifies who requested the money-path action; the
        shared ApprovalStore requires a different authenticated principal to decide it.
      required: [id, action, status]
      properties:
        id:
          type: string
        action:
          type: string
          description: The gated balance action this approval was raised for.
        resourceId:
          type: string
          nullable: true
        status:
          type: string
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Request time; pending approvals expire after 24 hours.
        decidedBy:
          type: string
          nullable: true

    BalanceResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        currency:
          type: string
        availableBalance:
          type: number
        currentBalance:
          type: number
        reservedBalance:
          type: number
        pendingBalance:
          type: number
        lastUpdatedAt:
          type: string
          format: date-time
        notYetEffectiveCredit:
          type: number
          description: >-
            ADR-0178 Phase 2 (#1745). The posted-but-not-yet-effective CREDIT tail for this
            (account, currency): the sum of projected booked deltas that are strictly positive and
            value-dated after the current accounting day. A payment arriving after the 16:00 Prague
            cut-off or at a weekend is booked to the next business day, so the general ledger — whose
            control balance is value-dated (entry_date <= asOf) — does not recognise it until then.

            Spendable funds are `availableAmount - notYetEffectiveCredit`: the cover decision
            (POST /{accountId}/holds) subtracts this, so a not-yet-effective credit cannot be
            reserved before its value date. ZERO for any account with nothing booked forward, which
            is the overwhelmingly common case.

            Deliberately credits only. Netting future-dated DEBITS in would add spendable money back
            for a payment that has not yet left, which is the unsafe direction.
          readOnly: true
        effectiveAvailableAmount:
          type: string
          format: decimal
          example: "3000.00"
          description: >-
            What may actually be spent right now: `availableAmount - notYetEffectiveCredit`,
            computed per read.

            Added because publishing `notYetEffectiveCredit` alone left the correction in a field
            no consumer read — `openbank-account-service` mapped its own `available` straight from
            `availableAmount` and dropped the tail, so every caller behind it kept spending the
            pre-fix figure while the invariant looked fixed. A consumer deciding "can this be
            spent" reads THIS; `availableAmount` deliberately keeps its meaning for anything
            reconciling against the raw projection.
          readOnly: true

    PlaceHoldRequest:
      type: object
      required: [amount, currency, reason]
      properties:
        amount:
          type: number
        currency:
          type: string
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time

    HoldResponse:
      type: object
      properties:
        holdId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    MoneyMovementRequest:
      type: object
      required: [amount, currency, referenceId, description]
      properties:
        amount:
          type: number
        currency:
          type: string
        referenceId:
          type: string
        description:
          type: string

    InitializeBalanceRequest:
      type: object
      required: [currency]
      properties:
        currency:
          type: string
        initialAmount:
          type: number
          default: 0

    ReconciliationReport:
      type: object
      description: >-
        One ADR-0039 Phase A reconciliation run — per-currency tie-out of the ledger deposit-control
        balance against the sum of balance-service booked balances.
      properties:
        asOf:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        tolerance:
          type: number
          description: Absolute difference tolerated before a currency is flagged as drifted.
        hasDrift:
          type: boolean
          description: True when any currency drifted beyond tolerance — the alerting signal.
        driftedCurrencies:
          type: array
          items:
            type: string
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyReconciliation'

    CurrencyReconciliation:
      type: object
      properties:
        currency:
          type: string
        ledgerControlBalance:
          type: number
          description: Ledger deposit-control credit-normal balance (credit − debit) for the currency.
        subLedgerBookedSum:
          type: number
          description: Sum of balance-service booked amounts across all accounts in the currency.
        difference:
          type: number
          description: >-
            subLedgerBookedSum − ledgerControlBalance; zero (within tolerance) means agreement. Both
            sides are on the ledger's value-date basis (ADR-0178 Phase 1), so this is UNEXPLAINED
            drift — value-date timing cannot contribute to it.
        withinTolerance:
          type: boolean
        futureValueDatedPipeline:
          type: number
          default: 0
          description: >-
            ADR-0178 Phase 3 — the future-value-dated pipeline: sum of projected booked deltas whose
            value date is strictly after asOf. These movements are POSTED but not yet effective, so
            neither side of the tie-out counts them and they never contribute to `difference`.
            Reported so an operator can see the expected upcoming movement rather than an unexplained
            gap between subLedgerBookedSum and the raw materialized booked total. Absent on runs
            recorded before this field existed; treat as 0.

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
