#
# ADR-0006: every Kafka topic is documented in AsyncAPI 3.0 under openbank-contracts/<service>/.
# Everything below is DERIVED from the code that runs — the payload classes in
# `TreasuryEventPayloads.kt` and `KafkaTreasuryOutboxEventPublisher`, which emits them verbatim.

asyncapi: 3.0.0

info:
  title: OpenBank Treasury Service — deal events
  version: 1.7.0
  description: |
    1.7.0 (additive): `DealBooked.rollDirection` (FROM_START | FROM_END) — the deal's roll
    direction. A leg whose `stub` is `NONE` has no stub of its own: the roll direction places it
    (FROM_START -> SHORT_FINAL, FROM_END -> SHORT_INITIAL), the rule `StubType.resolve` in
    libs-finance owns. Absent on older events = FROM_END, the deal default. Also
    `DealBooked.calendars` (the deal header's calendar codes, joint when several) and
    `DealBooked.businessDayConvention`: the conventions a leg without its own inherits, so a
    consumer derives the schedule treasury generated. Absent = the leg currency's calendar and the
    consumer's default convention.

    1.7.0 (additive, ADR-0344 contract 9): the bank-own payment rail. Release is ASYNC and ATOMIC:
    `treasury.payment.released.v1` is written on the NEW channel `openbank.treasury.payments` in
    the same transaction that moves the payment to RELEASED (rail from the SSI: CZK CERTIS, EUR
    TARGET2, other SWIFT; idempotency key `treasury:<dealId>:<flowId>:payment` or
    `treasury:netted:<sha256>`). Treasury CONSUMES the rail's status feed `openbank.swift.institution-transfers` (its contract is
    swift-service's asyncapi) (ACCEPTED keeps RELEASED and records the rail reference,
    SENT -> SENT, SETTLED -> SETTLED, REJECTED -> FAILED), idempotent on (paymentId, status);
    a status it cannot apply is dead-lettered to `openbank.dlq.treasury.institution-transfer-status-in`.
    `PaymentStatusChanged.status` gains FAILED as a reachable value and `rail` now carries the
    institution-transfer rail once released. RAIL_NOT_SUPPORTED remains only for a payment whose
    SSI determines no rail. `PaymentReleased.ssiVersion` (additive to contract 9.1) names the SSI
    version re-verified under lock at release; a changed instruction is refused 409 SSI_CHANGED.
    Also new in 1.7.0 (ADR-0344 D7) on the deal feed: `treasury.deal.corrected.v1` — a four-eyes
    correction was approved; the new terms version and its cash-flow ledger committed in the same
    transaction (a `treasury.cashflow.generated.v1` accompanies it unless the deal was fully
    unwound) and `deltaJournals` journals are owed to the ledger under `treasury:<dealId>:correction:*`.

    1.7.0 (additive, ADR-0344 D5): `CashFlowGenerated.flows` carries the stored rows (the risk
    engine's stored-flow consumer requires them; before 1.7.0 it acked every such event as
    malformed). New on the same topic: `treasury.cashflow.fixed.v1` — floating flows of one deal
    version moved PROJECTED/MISSING -> FIXED from an observed index value that passed the quality
    gate, with the value, its source and SHA-256 provenance hash. `treasury.payment.status-changed.v1`
    (ADR-0344 D6): an own-account payment moved (PROPOSED, RELEASED, SENT, RAIL_NOT_SUPPORTED,
    SETTLED, MANUALLY_SETTLED, RETURNED, CANCELLED), keyed by the payment id, written in the
    transaction of the change.

    1.7.0 (additive, ADR-0344 slice 2): `DealBooked` gains `kind` (ACTUAL | PLANNED — absent means
    ACTUAL; a consumer that books exposure must ignore PLANNED), `bookId`, `legs`, `scheduleVersion`
    and `scheduleHash`; `ProductType` lists the leg-described products (a consumer must tolerate a
    product it does not model, as the risk engine already does). New on the same topic:
    `treasury.cashflow.generated.v1` (a cash-flow ledger version was stored) and
    `treasury.cashflow.overridden.v1` (a four-eyes override was approved or rejected).

    Lifecycle of the bank's own money-market deals (ADR-0315): MM placements, MM borrowings, the
    ČNB overnight deposit facility and ČNB lombard (marginal lending) borrowings.

    1.6.0 (additive): `DealBooked.productLimit` (ADR-0315 D4) — the product limit the booking was
    evaluated against at approval (decision WITHIN_LIMIT, the maximum principal in the deal's
    currency and the maximum tenor). Null only on events emitted before this version.

    1.5.0 (additive): `treasury.nostro.break-aged.v1` (ADR-0315 D7) on the same topic — an open
    nostro reconciliation break passed the configured age and amount threshold. Keyed by the
    break id; emitted once per break, in the same transaction that stamps it alerted.

    **Transactional outbox.** Events are written to `treasury_outbox` in the same transaction as
    the deal row, its timeline entry and its ledger journal reference, and dispatched afterwards
    (`TreasuryOutboxDispatcher`, `KafkaTreasuryOutboxEventPublisher`). A published event always
    corresponds to a committed change — and, for settled / matured / reversed, to a journal the
    ledger has already accepted (`ledgerJournalId`).

    **Money-path topic.** audit-service subscribes (`audit-money-path-subscription`). The risk
    engine may consume it as `MONEY_MARKET_DEAL` instruments (ADR-0314 D4); today the risk engine
    reads the treasury GL accounts from the trial balance instead.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

defaultContentType: application/json

servers:
  sandbox:
    host: openbank-cluster-kafka-bootstrap.messaging.svc:9093
    protocol: kafka-secure
    description: "Strimzi cluster `openbank-cluster` in `messaging`; mTLS, per-service KafkaUser (`treasury-service`)."

channels:
  treasuryDealEvents:
    address: openbank.treasury.deal.events
    title: Treasury deal lifecycle
    description: |
      `openbank-infra/gitops/components/treasury/kafka-topic.yaml`. A change feed, not a source of
      truth: a consumer rebuilding a projection seeds from `GET /api/v1/treasury/deals`.

      **Partitioning key: `aggregateId`** = the deal id (`OutboxKafkaHeaders.partitionKey`), so
      every event about one deal stays ordered.
    messages:
      DealBooked:
        $ref: '#/components/messages/DealBooked'
      DealConfirmed:
        $ref: '#/components/messages/DealConfirmed'
      DealSettled:
        $ref: '#/components/messages/DealSettled'
      DealMatured:
        $ref: '#/components/messages/DealMatured'
      DealReversed:
        $ref: '#/components/messages/DealReversed'
      NostroBreakAged:
        $ref: '#/components/messages/NostroBreakAged'
      CashFlowGenerated:
        $ref: '#/components/messages/CashFlowGenerated'
      CashFlowOverridden:
        $ref: '#/components/messages/CashFlowOverridden'
      CashFlowFixed:
        $ref: '#/components/messages/CashFlowFixed'
      DealCorrected:
        $ref: '#/components/messages/DealCorrected'
      PaymentStatusChanged:
        $ref: '#/components/messages/PaymentStatusChanged'

  treasuryPayments:
    address: openbank.treasury.payments
    title: Bank-own payment instructions to the institution-transfer rail
    description: |
      Contract 9.1. The KafkaTopic CR lives with the rail (swift-service component): treasury Write,
      swift Read. **Partitioning key: `aggregateId`** = the payment id.
    messages:
      PaymentReleased:
        $ref: '#/components/messages/PaymentReleased'

operations:
  publishTreasuryPayments:
    action: send
    channel:
      $ref: '#/channels/treasuryPayments'
    summary: treasury-service hands a released bank-own payment to the institution-transfer rail.
  publishTreasuryDealEvents:
    action: send
    channel:
      $ref: '#/channels/treasuryDealEvents'
    summary: treasury-service publishes money-market deal lifecycle events.

components:
  messages:
    DealBooked:
      name: treasury.deal.booked.v1
      summary: "A second person approved the deal (four-eyes). Nothing has posted yet."
      payload:
        $ref: '#/components/schemas/DealBooked'
    DealConfirmed:
      name: treasury.deal.confirmed.v1
      summary: "The counterparty confirmed the booked terms (ADR-0315 D2). Nothing has posted."
      payload:
        $ref: '#/components/schemas/DealConfirmed'
    DealSettled:
      name: treasury.deal.settled.v1
      summary: "Principal exchanged on the value date; the settlement journal is in the ledger."
      payload:
        $ref: '#/components/schemas/DealSettled'
    DealMatured:
      name: treasury.deal.matured.v1
      summary: "Principal and ACT/360 interest repaid; the maturity journal is in the ledger."
      payload:
        $ref: '#/components/schemas/DealMatured'
    DealReversed:
      name: treasury.deal.reversed.v1
      summary: "A booked, confirmed or settled deal was undone; a settled one by an offsetting journal."
      payload:
        $ref: '#/components/schemas/DealReversed'
    NostroBreakAged:
      name: treasury.nostro.break-aged.v1
      summary: "An open nostro reconciliation break reached the alert age and amount (ADR-0315 D7). Nothing posted."
      payload:
        $ref: '#/components/schemas/NostroBreakAged'
    CashFlowGenerated:
      name: treasury.cashflow.generated.v1
      summary: "A cash-flow ledger version was generated and stored with the submission (ADR-0344 D4)."
      payload:
        $ref: '#/components/schemas/CashFlowGenerated'
    CashFlowOverridden:
      name: treasury.cashflow.overridden.v1
      summary: "A four-eyes override of one cash flow was approved or rejected (ADR-0344 D4). Nothing posted."
      payload:
        $ref: '#/components/schemas/CashFlowOverridden'
    PaymentStatusChanged:
      name: treasury.payment.status-changed.v1
      summary: "An own-account payment changed status (ADR-0344 D6)."
      payload:
        $ref: '#/components/schemas/PaymentStatusChanged'
    PaymentReleased:
      name: treasury.payment.released.v1
      summary: "A human released an own-account payment; the rail is to transfer it (contract 9.1)."
      payload:
        $ref: '#/components/schemas/PaymentReleased'
    DealCorrected:
      name: treasury.deal.corrected.v1
      summary: "A four-eyes correction of a booked deal was approved; its delta journals are owed to the ledger (ADR-0344 D7)."
      payload:
        $ref: '#/components/schemas/DealCorrected'
    CashFlowFixed:
      name: treasury.cashflow.fixed.v1
      summary: "Floating flows of one deal version were FIXED from an observed index value that passed the quality gate (ADR-0344 D5)."
      payload:
        $ref: '#/components/schemas/CashFlowFixed'

  schemas:
    DealCorrected:
      type: object
      description: "Constructor properties of `DealCorrected` in `TreasuryEventPayloads.kt`."
      required: [dealId, correctionId, product, fromVersion, toVersion, scheduleVersion, fullUnwind, changedFlows, deltaJournals, effectiveFrom, reason, proposedBy, approvedBy, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        correctionId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        fromVersion: { type: integer }
        toVersion: { type: integer }
        scheduleVersion: { type: integer }
        fullUnwind: { type: boolean, description: "True: the deal ended REVERSED and every posted journal is offset." }
        changedFlows: { type: integer }
        deltaJournals: { type: integer }
        effectiveFrom: { type: string, format: date }
        reason: { type: string }
        proposedBy: { type: string }
        approvedBy: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }
    ProductType:
      type: string
      enum: [MM_PLACEMENT, MM_BORROWING, CNB_DEPOSIT_FACILITY, CNB_LOMBARD, FX_SPOT, CASH, TREASURY_BILL, BOND, BILL_OF_EXCHANGE, LOAN, FX_FORWARD, FX_SWAP, FRA, IRS, REPO, REVERSE_REPO]
    DealKind:
      type: string
      enum: [ACTUAL, PLANNED, HYPOTHETICAL]
    FxSide:
      type: [string, 'null']
      enum: [BUY, SELL, null]
      description: FX_SPOT only (#10896) — the bank's side on the foreign `currency`; null for money-market deals.

    CounterAmount:
      type: [number, 'null']
      description: FX_SPOT only (#10896) — the CZK leg, principal x rate (2 dp); null for money-market deals.

    SourceService:
      type: string
      const: treasury-service
      description: The producer's own attribution claim; audit-service would otherwise derive one.

    DealBooked:
      type: object
      description: "Constructor properties of `DealBooked` in `TreasuryEventPayloads.kt`."
      required: [dealId, product, counterpartyId, currency, principal, rate, valueDate, maturityDate, createdBy, approvedBy, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        counterpartyId: { type: string }
        currency: { type: string, enum: [CZK, EUR] }
        principal: { type: number }
        rate: { type: number, description: 'Annual percentage, ACT/360' }
        valueDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        createdBy: { type: string }
        approvedBy: { type: string, description: 'Never equal to createdBy (four-eyes, enforced in the domain and the database).' }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }
        fxSide: { $ref: '#/components/schemas/FxSide' }
        counterAmount: { $ref: '#/components/schemas/CounterAmount' }
        productLimit:
          type: [object, 'null']
          description: "ADR-0315 D4: `ProductLimitApplied` — the product limit re-checked at approval."
          properties:
            decision: { type: string, enum: [WITHIN_LIMIT] }
            maxPrincipal: { type: [number, 'null'], description: "In the deal's currency" }
            maxTenorDays: { type: [integer, 'null'], description: 'Null = no tenor cap (FX_SPOT)' }
        kind: { $ref: '#/components/schemas/DealKind' }
        bookId: { type: [string, 'null'] }
        legs:
          type: array
          description: "`LegSpec` in `Legs.kt` (rates as annual percentages; dayCount as the enum name, e.g. ACT_360)."
          items: { type: object, additionalProperties: true }
        scheduleVersion: { type: integer }
        scheduleHash: { type: [string, 'null'] }
        rollDirection: { type: string, enum: [FROM_START, FROM_END], description: 'Absent = FROM_END. Places a leg whose stub is NONE.' }
        calendars: { type: array, items: { type: string }, description: 'Deal header calendar codes; a leg without paymentCalendars uses their joint calendar. Empty/absent = leg currency calendar.' }
        businessDayConvention: { type: [string, 'null'], description: 'Deal header convention a leg without its own inherits.' }

    DealConfirmed:
      type: object
      description: "Constructor properties of `DealConfirmed` in `TreasuryEventPayloads.kt`."
      required: [dealId, product, counterpartyId, currency, principal, valueDate, confirmedBy, simulated, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        counterpartyId: { type: string }
        currency: { type: string, enum: [CZK, EUR] }
        principal: { type: number }
        valueDate: { type: string, format: date }
        confirmedBy: { type: string, description: 'A back-office person (never the creator or submitter), or system:simulated-market.' }
        simulated: { type: boolean, description: 'True when the simulated counterparty set (ADR-0315 D9, sandbox only) confirmed it: a SYNTHETIC confirmation.' }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }
        kind: { $ref: '#/components/schemas/DealKind' }

    DealSettled:
      type: object
      description: "Constructor properties of `DealSettled` in `TreasuryEventPayloads.kt`."
      required: [dealId, product, counterpartyId, currency, principal, valueDate, maturityDate, ledgerJournalId, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        counterpartyId: { type: string }
        currency: { type: string, enum: [CZK, EUR] }
        principal: { type: number }
        valueDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        ledgerJournalId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }
        fxSide: { $ref: '#/components/schemas/FxSide' }
        counterAmount: { $ref: '#/components/schemas/CounterAmount' }

    DealMatured:
      type: object
      description: "Constructor properties of `DealMatured` in `TreasuryEventPayloads.kt`."
      required: [dealId, product, counterpartyId, currency, principal, interest, maturityDate, ledgerJournalId, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        counterpartyId: { type: string }
        currency: { type: string, enum: [CZK, EUR] }
        principal: { type: number }
        interest: { type: number, description: 'ACT/360, 2 dp half-up' }
        maturityDate: { type: string, format: date }
        ledgerJournalId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }

    DealReversed:
      type: object
      description: "Constructor properties of `DealReversed` in `TreasuryEventPayloads.kt`."
      required: [dealId, product, counterpartyId, currency, principal, reversedBy, reason, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        counterpartyId: { type: string }
        currency: { type: string, enum: [CZK, EUR] }
        principal: { type: number }
        reversedBy: { type: string }
        reason: { type: string }
        ledgerJournalId:
          type: [string, 'null']
          format: uuid
          description: Null when reversed from BOOKED or CONFIRMED, before anything had posted.
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }
        kind: { $ref: '#/components/schemas/DealKind' }
        fxSide: { $ref: '#/components/schemas/FxSide' }
        counterAmount: { $ref: '#/components/schemas/CounterAmount' }

    NostroBreakAged:
      type: object
      description: "Constructor properties of `NostroBreakAged` in `TreasuryEventPayloads.kt`. No reference or narrative: a statement line's remittance text can name a customer."
      required: [breakId, iban, glCode, currency, side, ourSide, amount, bookingDate, firstSeenOn, ageBusinessDays, thresholdDays, occurredAt, sourceService]
      properties:
        breakId: { type: string, format: uuid }
        iban: { type: string, description: The bank's own nostro account at the correspondent }
        glCode: { type: string }
        currency: { type: string }
        side: { type: string, enum: [STATEMENT, LEDGER], description: 'Which side the unmatched item is on' }
        ourSide: { type: string, enum: [DEBIT, CREDIT], description: "From the bank's side; a statement CRDT is a DEBIT" }
        amount: { type: number }
        bookingDate: { type: string, format: date }
        firstSeenOn: { type: string, format: date }
        ageBusinessDays: { type: integer }
        thresholdDays: { type: integer, description: 'openbank.treasury.nostro.break-alert-age-days at the time of the alert' }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }

    CashFlowGenerated:
      type: object
      description: "Constructor properties of `CashFlowGenerated` in `TreasuryEventPayloads.kt`."
      required: [dealId, product, kind, dealVersion, scheduleVersion, scheduleHash, flowCount, projectedCount, carriedOverrides, conflicts, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        kind: { $ref: '#/components/schemas/DealKind' }
        bookId: { type: [string, 'null'] }
        dealVersion: { type: integer }
        scheduleVersion: { type: integer }
        scheduleHash: { type: string }
        flowCount: { type: integer }
        projectedCount: { type: integer, description: Floating flows whose amount awaits a fixing }
        carriedOverrides: { type: integer }
        conflicts: { type: integer, description: Approved overrides that could not be carried over }
        occurredAt: { type: string, format: date-time }
        flows:
          type: array
          maxItems: 20000
          description: 1.7.0 — the stored rows (absent before 1.7.0)
          items: { $ref: '#/components/schemas/LedgerFlowItem' }
        sourceService: { $ref: '#/components/schemas/SourceService' }

    CashFlowOverridden:
      type: object
      description: "Constructor properties of `CashFlowOverridden` in `TreasuryEventPayloads.kt`."
      required: [dealId, flowId, overrideId, status, reason, proposedBy, decidedBy, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        flowId: { type: string, format: uuid }
        overrideId: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, REJECTED] }
        paymentDate: { type: [string, 'null'], format: date }
        amount: { type: [number, 'null'] }
        originalPaymentDate: { type: [string, 'null'], format: date }
        originalAmount: { type: [number, 'null'] }
        reason: { type: string }
        proposedBy: { type: string }
        decidedBy: { type: string, description: Never equal to proposedBy (four-eyes) }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }

    LedgerFlowItem:
      type: object
      description: "Constructor properties of `LedgerFlowItem` in `TreasuryEventPayloads.kt`."
      required: [flowId, legIndex, periodIndex, kind, direction, currency, paymentDate, rateSource, state, manual]
      properties:
        flowId: { type: string, format: uuid }
        legIndex: { type: integer }
        periodIndex: { type: integer }
        kind: { type: string, enum: [PRINCIPAL, INTEREST, FEE, NOTIONAL_EXCHANGE, PREMIUM] }
        direction: { type: string, enum: [IN, OUT] }
        currency: { type: string }
        accrualStart: { type: [string, 'null'], format: date }
        accrualEnd: { type: [string, 'null'], format: date }
        fixingDate: { type: [string, 'null'], format: date }
        paymentDate: { type: string, format: date }
        notional: { type: [number, 'null'] }
        rate: { type: [number, 'null'] }
        rateSource: { type: string, enum: [FIXED, OBSERVED, PROJECTED, RATE_UNTIL_FIRST_FIXING, MISSING] }
        amount: { type: [number, 'null'] }
        state: { type: string, enum: [PROJECTED, FIXED, DUE, SETTLED, POSTED, CANCELLED] }
        manual: { type: boolean }

    CashFlowFixed:
      type: object
      description: "Constructor properties of `CashFlowFixed` in `TreasuryEventPayloads.kt`."
      required: [dealId, dealVersion, scheduleVersion, index, fixingDate, value, source, sha256, flows, occurredAt, sourceService]
      properties:
        dealId: { type: string, format: uuid }
        dealVersion: { type: integer }
        scheduleVersion: { type: integer }
        index: { type: string }
        fixingDate: { type: string, format: date }
        value: { type: number, description: The observed index value in percent }
        source: { type: string, enum: [IMPORT, MANUAL, FEED] }
        sha256: { type: string, description: 'SHA-256 of index|date|value|source' }
        flows:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FixedFlowItem' }
        occurredAt: { type: string, format: date-time }
        sourceService: { $ref: '#/components/schemas/SourceService' }

    FixedFlowItem:
      type: object
      description: "Constructor properties of `FixedFlowItem` in `TreasuryEventPayloads.kt`."
      required: [flowId, legIndex, periodIndex, kind, direction, currency, paymentDate, rate, amount, rateSource, state]
      properties:
        flowId: { type: string, format: uuid }
        legIndex: { type: integer }
        periodIndex: { type: integer }
        kind: { type: string }
        direction: { type: string, enum: [IN, OUT] }
        currency: { type: string }
        accrualStart: { type: [string, 'null'], format: date }
        accrualEnd: { type: [string, 'null'], format: date }
        paymentDate: { type: string, format: date }
        rate: { type: number }
        amount: { type: number }
        rateSource: { type: string, enum: [OBSERVED] }
        state: { type: string, enum: [FIXED] }

    PaymentStatusChanged:
      type: object
      description: "Constructor properties of `PaymentStatusChanged` in `PaymentService.kt`."
      required: [paymentId, status, direction, counterpartyId, currency, amount, valueDate, nettedFlowIds, dealIds, occurredAt, sourceService]
      properties:
        paymentId: { type: string, format: uuid }
        status: { type: string, enum: [PROPOSED, RELEASED, SENT, SETTLED, FAILED, CANCELLED, RAIL_NOT_SUPPORTED, MANUALLY_SETTLED, RETURNED] }
        direction: { type: string, enum: [IN, OUT] }
        counterpartyId: { type: string }
        currency: { type: string }
        amount: { type: number }
        valueDate: { type: string, format: date }
        rail: { type: [string, 'null'] }
        railReference: { type: [string, 'null'] }
        nettedFlowIds: { type: array, items: { type: string, format: uuid } }
        dealIds: { type: array, items: { type: string, format: uuid } }
        actor: { type: [string, 'null'] }
