#
# ADR-0006: every Kafka topic is documented in AsyncAPI 3.0 under openbank-contracts/<service>/.
# This is the FIRST contract in the tree — `openbank-contracts/` did not exist before it — so it
# also sets the shape the fleet's remaining 34 producer topics will follow (#1916).
#
# WHAT IS AND IS NOT ENFORCED HERE. `check-event-contract-coverage.py` asserts this FILE EXISTS;
# nothing validates its content, and no AsyncAPI linter is wired despite ADR-0006's delivery table
# claiming one is (line 16, "CI linting gate — Shipped"). Nor is any schema registered in Apicurio:
# the registry runs, but zero topics have a registered schema, so a producer that violates this
# document fails nowhere. Everything below is therefore DERIVED from the code that runs, and each
# claim names its source so the next reader can re-check it rather than trust it.

asyncapi: 3.0.0

info:
  title: OpenBank Delegation Service — events
  version: 1.2.0
  description: |
    Domain events emitted when a customer-to-party delegation grant changes state (ADR-0232).

    A grant is one party letting another act on a resource they own, scoped to explicit
    capabilities and a validity window. Every state transition on the aggregate is published here.

    **Transactional outbox.** Events are written to `delegation_outbox` in the same transaction as
    the state change and dispatched afterwards, so a published event always corresponds to a
    committed transition. The dispatcher is `DelegationOutboxDispatcher`; the publisher is
    `KafkaDelegationOutboxEventPublisher`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

defaultContentType: application/json

servers:
  sandbox:
    host: openbank-cluster-kafka-bootstrap.messaging.svc:9093
    protocol: kafka-secure
    description: |
      Strimzi cluster `openbank-cluster` in the `messaging` namespace. mTLS; the plaintext 9092
      listener is ACL-denied. Producers authenticate with a per-service KafkaUser certificate.

channels:
  delegationEvents:
    address: openbank.delegation.events
    title: Delegation grant lifecycle
    description: |
      One partition, one replica, `cleanup.policy: delete`, `retention.ms: 604800000` (7 days) —
      declared in `openbank-infra/gitops/components/delegation/kafka-topic.yaml`.

      **Retention is 7 days and the topic is not compacted, so it is a change feed, not a source of
      truth.** A consumer rebuilding a projection from scratch cannot replay history beyond a week;
      it must seed from the delegation-service REST API and then follow the topic. Anything that
      needs the full history needs this topic changed to `compact`, which is a decision for whoever
      first needs it — not something to assume.

      **Partitioning key: `aggregateId`** — the grant id, as a UUID string
      (`OutboxKafkaHeaders.partitionKey`, which returns `entry.aggregateId.toString()`). All events
      for one grant therefore land on one partition and are ordered with respect to each other.
      Ordering across different grants is NOT guaranteed, and with `partitions: 1` today the
      distinction is invisible — it will become real the moment the topic is scaled out, so do not
      write a consumer that depends on cross-grant ordering.
    messages:
      DelegationOffered:
        $ref: '#/components/messages/DelegationOffered'
      DelegationActivated:
        $ref: '#/components/messages/DelegationActivated'
      DelegationDeclined:
        $ref: '#/components/messages/DelegationDeclined'
      DelegationRevoked:
        $ref: '#/components/messages/DelegationRevoked'
      DelegationSuspended:
        $ref: '#/components/messages/DelegationSuspended'
      DelegationReinstated:
        $ref: '#/components/messages/DelegationReinstated'
      DelegationRenounced:
        $ref: '#/components/messages/DelegationRenounced'
      DelegationExpired:
        $ref: '#/components/messages/DelegationExpired'
      SpendReserved:
        $ref: '#/components/messages/SpendReserved'
      SpendConfirmed:
        $ref: '#/components/messages/SpendConfirmed'
      SpendReleased:
        $ref: '#/components/messages/SpendReleased'
  spendReservationState:
    address: openbank.delegation.spend-reservation-state
    title: Delegated domestic-payment reservation state
    description: |
      Compacted, single-partition bootstrap stream. Keys are `reservationId:v1` and
      `reservationId:v2`, so a delayed RESERVED retry cannot compact away terminal evidence.
      Consumers group by payload reservationId and apply the greatest reservationVersion.
      Terminal snapshots are ordinary values, never Kafka tombstones.
    messages:
      DelegationSpendReservationStateChanged:
        $ref: '#/components/messages/DelegationSpendReservationStateChanged'

operations:
  publishDelegationEvents:
    action: send
    title: Publish delegation grant transitions
    channel:
      $ref: '#/channels/delegationEvents'
    description: |
      **Producer: `openbank-delegation-service`** — the sole producer, and the owner of this
      contract. Configured as `mp.messaging.outgoing.delegation-events-out` in its
      `application.yaml`.

      **Consumers:** `openbank-account-service` (`account_delegation_projection`) and
      `openbank-card-issuance-service` (`card_delegation_projection`). Both build a local enforcement
      model so authorising a delegated action never requires a synchronous call to this service.
      Their durable per-grant lifecycle cursors compare `lifecycleRevision`; Kafka delivery order,
      `occurredAt` and wall-clock arrival are not used as conflict resolution.
    messages:
      - $ref: '#/channels/delegationEvents/messages/DelegationOffered'
      - $ref: '#/channels/delegationEvents/messages/DelegationActivated'
      - $ref: '#/channels/delegationEvents/messages/DelegationDeclined'
      - $ref: '#/channels/delegationEvents/messages/DelegationRevoked'
      - $ref: '#/channels/delegationEvents/messages/DelegationSuspended'
      - $ref: '#/channels/delegationEvents/messages/DelegationReinstated'
      - $ref: '#/channels/delegationEvents/messages/DelegationRenounced'
      - $ref: '#/channels/delegationEvents/messages/DelegationExpired'
      - $ref: '#/channels/delegationEvents/messages/SpendReserved'
      - $ref: '#/channels/delegationEvents/messages/SpendConfirmed'
      - $ref: '#/channels/delegationEvents/messages/SpendReleased'
  publishSpendReservationState:
    action: send
    title: Publish delegated domestic-payment reservation snapshots
    channel:
      $ref: '#/channels/spendReservationState'
    description: |
      Produced atomically by delegation-service. New DOMESTIC_PAYMENT admission remains
      default-off until a compatible downstream binding consumer is deployed and healthy.
    messages:
      - $ref: '#/channels/spendReservationState/messages/DelegationSpendReservationStateChanged'

components:
  messageTraits:
    outboxHeaders:
      headers:
        type: object
        required: [ce-id, ce-type, idempotency-key]
        properties:
          ce-id:
            type: string
            format: uuid
            description: Event id. Stable across redeliveries of the same event.
          ce-type:
            type: string
            description: Event type, equal to the payload's `eventType`.
          idempotency-key:
            type: string
            format: uuid
            description: |
              Equal to `ce-id` — see `OutboxKafkaHeaders.headersFor`. The outbox dispatcher offers
              at-least-once delivery, so a consumer MUST deduplicate on this value rather than
              assume each event arrives once.

  schemas:
    spendReservationState:
      type: object
      required:
        - eventId
        - aggregateId
        - aggregateType
        - eventType
        - version
        - occurredAt
        - sourceService
        - reservationId
        - delegationId
        - grantorPartyId
        - granteePartyId
        - resourceType
        - resourceId
        - amount
        - currency
        - idempotencyKeyHash
        - operationType
        - state
        - reservationVersion
        - createdAt
        - settledAt
      properties:
        eventId: { type: string, format: uuid }
        aggregateId: { type: string, format: uuid }
        aggregateType: { type: string, const: DelegationSpendReservation }
        eventType: { type: string, const: DelegationSpendReservationStateChanged }
        version: { type: integer, const: 1 }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, const: delegation-service }
        reservationId: { type: string, format: uuid }
        delegationId: { type: string, format: uuid }
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        resourceType: { type: string, const: ACCOUNT }
        resourceId: { type: string, format: uuid }
        amount: { type: number, format: decimal, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKeyHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase SHA-256 over UTF-8
            `openbank.delegation.spend-reservation.idempotency-key.v1\u0000` followed by the raw
            key. The raw caller text is never published.
        operationType: { type: string, const: DOMESTIC_PAYMENT }
        state: { type: string, enum: [RESERVED, CONFIRMED, RELEASED] }
        reservationVersion: { type: integer, enum: [1, 2] }
        createdAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }

    # The D4 audit trail (SpendReserved/SpendConfirmed/SpendReleased). Property names mirror the
    # serialised data classes in `DelegationEvents.kt` — `check-event-contract-code-agreement.py`
    # compares both directions, so a renamed Kotlin property fails here until this file follows.
    spendReserved:
      type: object
      required:
        - eventId
        - aggregateId
        - aggregateType
        - eventType
        - version
        - occurredAt
        - reservationId
        - grantorPartyId
        - granteePartyId
        - amount
        - idempotencyKey
        - sourceService
      properties:
        eventId: { type: string, format: uuid }
        aggregateId:
          type: string
          format: uuid
          description: The delegation GRANT id — also the partition key.
        aggregateType: { type: string, const: DelegationGrant }
        eventType: { type: string, const: SpendReserved }
        version: { type: integer, const: 1 }
        occurredAt: { type: string, format: date-time }
        reservationId: { type: string, format: uuid }
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        amount:
          type: object
          description: EventMoney — `amount` (decimal) and `currency` (ISO-4217).
        idempotencyKey:
          type: string
          description: >-
            The caller's key for the spend this reservation backs — the only link from the audit
            trail to the payment that consumed the headroom. Opaque and caller-chosen; never PII.
        sourceService: { type: string, const: delegation-service }

    spendSettled:
      type: object
      description: Shared payload of SpendConfirmed and SpendReleased — the terminal pair.
      required:
        - eventId
        - aggregateId
        - aggregateType
        - eventType
        - version
        - occurredAt
        - reservationId
        - grantorPartyId
        - granteePartyId
        - amount
        - settledAt
        - sourceService
      properties:
        eventId: { type: string, format: uuid }
        aggregateId:
          type: string
          format: uuid
          description: The delegation GRANT id — also the partition key.
        aggregateType: { type: string, const: DelegationGrant }
        eventType: { type: string, enum: [SpendConfirmed, SpendReleased] }
        version: { type: integer, const: 1 }
        occurredAt: { type: string, format: date-time }
        reservationId: { type: string, format: uuid }
        grantorPartyId: { type: string, format: uuid }
        granteePartyId: { type: string, format: uuid }
        amount:
          type: object
          description: EventMoney — `amount` (decimal) and `currency` (ISO-4217).
        settledAt: { type: string, format: date-time }
        sourceService: { type: string, const: delegation-service }

    resourceType:
      type: string
      description: The kind of resource a grant is over.
      enum: [ACCOUNT, SAVINGS_GOAL, CARD, PAYMENT, STATEMENT, DOCUMENT]
    capability:
      type: string
      description: |
        A single delegated permission. `ACCOUNT_PROPOSE_PAYMENT` and `SAVINGS_PROPOSE_WITHDRAW` are
        propose-only — they create a proposal for the grantor to approve, they do not move money.
      enum:
        - ACCOUNT_READ_BALANCES
        - ACCOUNT_READ_TRANSACTIONS
        - ACCOUNT_INITIATE_PAYMENT
        - ACCOUNT_PROPOSE_PAYMENT
        - CARD_VIEW
        - CARD_MANAGE_LIMITS
        - SAVINGS_DEPOSIT
        - SAVINGS_WITHDRAW
        - SAVINGS_PROPOSE_WITHDRAW
        - OBJECT_READ
        - DELEGATION_MANAGE
    envelope:
      type: object
      description: |
        Fields every event carries, from `com.openbank.libs.domain.event.DomainEvent`. The payload
        is the serialized event data class itself — there is no wrapper object.
      required: [eventId, aggregateId, aggregateType, eventType, version, occurredAt, lifecycleRevision]
      properties:
        eventId:
          type: string
          format: uuid
        aggregateId:
          type: string
          format: uuid
          description: The delegation grant id. Also the partition key.
        aggregateType:
          type: string
          const: DelegationGrant
        eventType:
          type: string
        version:
          type: integer
          const: 1
          description: Schema version of this event type. Bump on a breaking payload change.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601 instant at which the transition happened, not when it was published.
        lifecycleRevision:
          type: integer
          format: int64
          minimum: 0
          description: |
            Monotonic status-transition revision for this grant. Zero is OFFERED and every legal
            lifecycle transition increments exactly once. Consumers MUST compare this value with
            their durable per-grant cursor and apply only a strictly newer event; arrival time and
            `occurredAt` are not ordering controls. An authority-opening event without this field
            must fail closed. A revisionless authority-removing event is legacy input and must
            install an irreversible tombstone until the grant is reconciled or reissued.
    parties:
      type: object
      required: [grantorPartyId, granteePartyId]
      properties:
        grantorPartyId:
          type: string
          format: uuid
          description: The party who owns the resource and gave the grant.
        granteePartyId:
          type: string
          format: uuid
          description: The party the grant was given to.
    resource:
      type: object
      required: [resourceType, resourceId]
      properties:
        resourceType:
          $ref: '#/components/schemas/resourceType'
        resourceId:
          type: string
          format: uuid
    capabilities:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/capability'

    # The enforceable window and the ceiling. Present on the events that make a grant enforceable
    # — Offered, Activated, Reinstated — and on no other, because nothing else changes them.
    #
    # These were ADDED in #3410. Before that the aggregate carried all three and no event did, so
    # both projections read fields the producer never sent and defaulted them: `validFrom ?: now`
    # made a future-dated grant enforceable immediately, `validTo = null` meant it never expired
    # locally, and no consumer could apply a per-transaction ceiling at all.
    enforcement:
      type: object
      required: [validFrom]
      properties:
        validFrom:
          type: string
          format: date-time
          description: >-
            When the grant becomes enforceable. Consumers MUST NOT treat an absent value as "now" —
            that is the defect this field closes.
        validTo:
          type: string
          format: date-time
          nullable: true
          description: >-
            End of the window, or null for open-ended. A consumer still receives DelegationExpired
            from the producer's sweep; this field lets it stop authorising WITHOUT waiting for it.
        perTransactionLimit:
          type: object
          nullable: true
          required: [amount, currency]
          properties:
            amount: { type: string, format: decimal }
            currency:
              type: string
              minLength: 3
              maxLength: 3
              description: >-
                ISO 4217, flat — NOT the domain `CurrencyCode`, which Jackson renders as
                `{"code":"CZK"}` while every consumer reads this as text. Matches the fleet's
                event convention (AccountEvents, LedgerEvents).

  messages:
    DelegationSpendReservationStateChanged:
      name: DelegationSpendReservationStateChanged
      title: Full current state of a delegated domestic-payment reservation
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        $ref: '#/components/schemas/spendReservationState'

    # ADR-0249 D4 (#5728) — the spend audit trail. Unlike the state stream above these are
    # emitted for EVERY operation type, carry the raw (caller-chosen) idempotencyKey rather than
    # its hash, and are partition-keyed on the GRANT so a reserve and a revoke of the same
    # authority stay ordered. `aggregateId` is the grant; the reservation is a field.
    SpendReserved:
      name: SpendReserved
      title: Headroom was taken under the grant's ceilings — before the money moves
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        $ref: '#/components/schemas/spendReserved'

    SpendConfirmed:
      name: SpendConfirmed
      title: The money moved — the headroom stays consumed (terminal)
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        $ref: '#/components/schemas/spendSettled'

    SpendReleased:
      name: SpendReleased
      title: The payment did not happen — the headroom comes back (terminal)
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        $ref: '#/components/schemas/spendSettled'

    DelegationOffered:
      name: DelegationOffered
      title: A grant was offered and awaits the grantee's acceptance
      summary: |
        Emitted by `DelegationService.offer` after the grantor's ownership of the resource has been
        verified and an SCA challenge has been spent. The grant is NOT yet usable — it confers no
        authority until `DelegationActivated`.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'
          - $ref: '#/components/schemas/capabilities'
          - $ref: '#/components/schemas/enforcement'

    DelegationActivated:
      name: DelegationActivated
      title: The grantee accepted — the grant is now in force
      summary: |
        **The only event that grants authority.** A projection must treat a grant as usable from
        this event and not from `DelegationOffered`.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'
          - $ref: '#/components/schemas/capabilities'
          - $ref: '#/components/schemas/enforcement'

    DelegationDeclined:
      name: DelegationDeclined
      title: The grantee refused the offer
      summary: Terminal. Carries no resource or capabilities — the offer never took effect.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'

    DelegationRevoked:
      name: DelegationRevoked
      title: The grantor withdrew the grant
      summary: |
        Terminal, and **authority-removing** — a consumer that has not applied this event is
        enforcing a grant that no longer exists. `reason` is derived from the authenticated caller's
        input, never from a query parameter.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'
          - $ref: '#/components/schemas/capabilities'
          - type: object
            required: [reason]
            properties:
              reason:
                type: string

    DelegationSuspended:
      name: DelegationSuspended
      title: An operator suspended the grant
      summary: |
        Authority-removing but NOT terminal — a suspended grant can return via
        `DelegationReinstated`. Restricted to `ROLE_OPERATOR` / `ROLE_ADMIN`.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'
          - $ref: '#/components/schemas/capabilities'
          - type: object
            required: [reason]
            properties:
              reason:
                type: string

    DelegationReinstated:
      name: DelegationReinstated
      title: A suspended grant was returned to force
      summary: Authority-restoring. Only follows `DelegationSuspended`.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'
          - $ref: '#/components/schemas/capabilities'
          - $ref: '#/components/schemas/enforcement'

    DelegationRenounced:
      name: DelegationRenounced
      title: The grantee gave the grant back
      summary: |
        Terminal and authority-removing. Distinct from `DelegationRevoked` in who acted — the
        grantee, not the grantor — which is why both exist. Carries no capabilities.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'

    DelegationExpired:
      name: DelegationExpired
      title: The validity window closed
      summary: |
        Terminal and authority-removing. Emitted by the scheduled expiry sweep
        (`DelegationExpirationJob.sweepExpiredGrants`), so it arrives on the sweep's cadence rather
        than at the instant of expiry. **A consumer must therefore enforce the window itself and not
        wait for this event** — between the grant's end instant and the next sweep, no event has
        been published and the grant is already invalid.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - $ref: '#/components/schemas/parties'
          - $ref: '#/components/schemas/resource'
