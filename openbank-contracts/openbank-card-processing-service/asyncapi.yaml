asyncapi: 3.0.0
info:
  title: OpenBank Card Processing Service — card money-path events
  version: 1.1.0
  description: |
    What the card money path publishes (ADR-0283 phase 1, #8809): an authorisation decision, the
    clearing presentments against it, and the release of a hold nobody presented against.

    A SEPARATE channel from `openbank.cards.events`, which carries card LIFECYCLE (issued, blocked,
    limits changed). Folding them together would put an authorisation stream through consumers
    written for a handful of lifecycle events a day.

    Every message is the JSON serialisation of a Kotlin data class in
    `com.openbank.cardprocessing.domain.event`, so each field below is a property name — there is no
    literal key anywhere in the source to grep for. Read the type, not a grep.

    No PAN, no card credential and no CVV appears in any message: a card is referenced by its
    card-issuance id.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
servers:
  sandbox:
    host: openbank-cluster-kafka-bootstrap.messaging.svc:9093
    protocol: kafka-secure
    description: mTLS Kafka; card-processing-service publishes with its dedicated KafkaUser.
channels:
  cardProcessingEvents:
    address: openbank.card.processing.events
    description: |
      Producer: card-processing-service, via the transactional outbox (ADR-0050) — the row and the
      business state commit together, and the dispatcher drains to Kafka afterwards.

      Consumers: audit-service (evidentiary trail; the topic is in its incoming list and its
      KafkaUser Read ACL, without which the subscription is ACL-denied as a silent retry loop).

      Partitioning key: the aggregate id — the authorisation id for the money-path messages, and the
      token registration or dispute case id for the lifecycle ones (ADR-0283 phase 3). Each aggregate
      is ordered against itself, which is what a consumer needs; a random key would let a clearing
      arrive before the authorisation it belongs to, or a token deletion before its provisioning.

      Retention: 7 days (`retention.ms: 604800000`), cleanup policy delete — matching the sibling
      payments topics. The durable record is the database row under a 7-year accounting retention;
      the topic is a transport, not the archive.
    messages:
      cardAuthorised:
        $ref: '#/components/messages/cardAuthorised'
      cardDeclined:
        $ref: '#/components/messages/cardDeclined'
      cardCleared:
        $ref: '#/components/messages/cardCleared'
      cardHoldReleased:
        $ref: '#/components/messages/cardHoldReleased'
      cardTokenProvisioned:
        $ref: '#/components/messages/cardTokenProvisioned'
      cardTokenStatusChanged:
        $ref: '#/components/messages/cardTokenStatusChanged'
      cardDisputeOpened:
        $ref: '#/components/messages/cardDisputeOpened'
      cardDisputeEvidenceSubmitted:
        $ref: '#/components/messages/cardDisputeEvidenceSubmitted'
      cardDisputeStatusChanged:
        $ref: '#/components/messages/cardDisputeStatusChanged'
operations:
  publishCardProcessingEvents:
    action: send
    channel:
      $ref: '#/channels/cardProcessingEvents'
components:
  messages:
    cardAuthorised:
      name: card.authorised.v1
      title: An authorisation was approved and funds are held
      payload:
        $ref: '#/components/schemas/cardAuthorised'
    cardDeclined:
      name: card.declined.v1
      title: An authorisation was refused
      payload:
        $ref: '#/components/schemas/cardDeclined'
    cardCleared:
      name: card.cleared.v1
      title: A clearing presentment was applied
      payload:
        $ref: '#/components/schemas/cardCleared'
    cardHoldReleased:
      name: card.hold_released.v1
      title: A hold was released without the money moving
      payload:
        $ref: '#/components/schemas/cardHoldReleased'
    cardTokenProvisioned:
      name: card.token.provisioned.v1
      title: A network token was provisioned for a card
      payload:
        $ref: '#/components/schemas/cardTokenProvisioned'
    cardTokenStatusChanged:
      name: card.token.status_changed.v1
      title: A network token was suspended, resumed or deleted
      payload:
        $ref: '#/components/schemas/cardTokenStatusChanged'
    cardDisputeOpened:
      name: card.dispute.opened.v1
      title: A chargeback case was opened with the network
      payload:
        $ref: '#/components/schemas/cardDisputeOpened'
    cardDisputeEvidenceSubmitted:
      name: card.dispute.evidence_submitted.v1
      title: Evidence was filed against an open case
      payload:
        $ref: '#/components/schemas/cardDisputeEvidenceSubmitted'
    cardDisputeStatusChanged:
      name: card.dispute.status_changed.v1
      title: A dispute moved, in both vocabularies
      payload:
        $ref: '#/components/schemas/cardDisputeStatusChanged'
  schemas:
    presentmentChannel:
      type: string
      enum: [CONTACTLESS, ONLINE, ATM, CHIP_AND_PIN]
    cardAuthorised:
      type: object
      required: [authorizationId, cardId, accountId, partyId, amountMinorUnits, currencyCode, channel, category, expiresAt, occurredAt, sourceService]
      properties:
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        amountMinorUnits:
          type: integer
          format: int64
          description: Minor units, as the scheme message carries it. Never a decimal.
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        channel: { $ref: '#/components/schemas/presentmentChannel' }
        mcc: { type: string, nullable: true }
        category:
          type: string
          description: The merchant category card-issuance judged the MCC as; kept so a later clearing does not re-judge it.
        merchantName: { type: string, nullable: true }
        merchantCountry: { type: string, nullable: true }
        expiresAt:
          type: string
          format: date-time
          description: When an unpresented hold is released. A hold that never expires is a permanent freeze.
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardDeclined:
      type: object
      required: [authorizationId, cardId, accountId, partyId, amountMinorUnits, currencyCode, channel, reason, category, occurredAt, sourceService]
      properties:
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        amountMinorUnits: { type: integer, format: int64 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        channel: { $ref: '#/components/schemas/presentmentChannel' }
        reason:
          type: string
          description: |
            card-issuance's own DeclineReason name, carried verbatim, or ISSUER_UNAVAILABLE when the
            issuer could not be reached. The two must never look alike: in a dispute, "the issuer was
            down" and "you turned gambling off" are different facts.
        category: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardCleared:
      type: object
      required: [authorizationId, cardId, accountId, clearedAmountMinorUnits, cumulativeClearedMinorUnits, currencyCode, fullyCleared, category, occurredAt, sourceService]
      properties:
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        clearedAmountMinorUnits:
          type: integer
          format: int64
          description: This presentment's amount.
        cumulativeClearedMinorUnits:
          type: integer
          format: int64
          description: Everything presented so far, which can never exceed the authorised amount.
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        fullyCleared:
          type: boolean
          description: False for a partial presentment, where the remainder stays held.
        category: { type: string }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardHoldReleased:
      type: object
      required: [authorizationId, cardId, accountId, releasedAmountMinorUnits, currencyCode, releaseKind, occurredAt, sourceService]
      properties:
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        releasedAmountMinorUnits:
          type: integer
          format: int64
          description: What the customer got back. The status alone does not say how much.
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        releaseKind:
          type: string
          enum: [REVERSAL, EXPIRY]
          description: |
            Operationally different and deliberately not one value: a rising EXPIRY share means
            acquirers are not presenting, a rising REVERSAL share means they are cancelling.
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardScheme:
      type: string
      description: Which adapter answered — not which brand the card carries. SIMULATOR is a real value.
      enum: [VISA, MASTERCARD, SIMULATOR]
    networkTokenStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DELETED]
    cardTokenProvisioned:
      type: object
      required: [registrationId, cardId, tokenReference, requestorId, requestorLabel, scheme, status, occurredAt, sourceService]
      properties:
        registrationId:
          type: string
          format: uuid
          description: This bank's mirror row. The network owns the token; this id is ours.
        cardId: { type: string, format: uuid }
        tokenReference:
          type: string
          description: The network's opaque handle. Never a PAN and never derived from one.
        requestorId: { type: string }
        requestorLabel: { type: string }
        scheme: { $ref: '#/components/schemas/cardScheme' }
        status: { $ref: '#/components/schemas/networkTokenStatus' }
        expiry: { type: string, format: date, nullable: true }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardTokenStatusChanged:
      type: object
      required: [registrationId, cardId, tokenReference, previousStatus, status, scheme, occurredAt, sourceService]
      properties:
        registrationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        tokenReference: { type: string }
        previousStatus:
          $ref: '#/components/schemas/networkTokenStatus'
        status: { $ref: '#/components/schemas/networkTokenStatus' }
        scheme: { $ref: '#/components/schemas/cardScheme' }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardDisputeOpened:
      type: object
      required: [disputeId, authorizationId, cardId, networkCaseId, reasonCode, amountMinorUnits, currencyCode, scheme, occurredAt, sourceService]
      properties:
        disputeId: { type: string, format: uuid }
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        networkCaseId:
          type: string
          description: Assigned by the network. No case exists here without one.
        reasonCode:
          type: string
          description: The scheme's own code, verbatim. Never translated into a bank vocabulary.
        amountMinorUnits: { type: integer, format: int64 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        respondByDate:
          type: string
          format: date
          nullable: true
          description: The network's deadline, carried so a consumer need not re-derive it.
        scheme: { $ref: '#/components/schemas/cardScheme' }
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardDisputeEvidenceSubmitted:
      type: object
      required: [disputeId, authorizationId, cardId, networkCaseId, documentReference, occurredAt, sourceService]
      properties:
        disputeId: { type: string, format: uuid }
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        networkCaseId: { type: string }
        documentReference:
          type: string
          description: A handle for the evidence. The document itself never travels on this topic.
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
    cardDisputeStatusChanged:
      type: object
      required: [disputeId, authorizationId, cardId, networkCaseId, previousStatus, status, schemeStatus, occurredAt, sourceService]
      properties:
        disputeId: { type: string, format: uuid }
        authorizationId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        networkCaseId: { type: string }
        previousStatus: { type: string, enum: [OPEN, EVIDENCE_SUBMITTED, WON, LOST, WITHDRAWN] }
        status: { type: string, enum: [OPEN, EVIDENCE_SUBMITTED, WON, LOST, WITHDRAWN] }
        schemeStatus:
          type: string
          description: |
            The network's own status string, verbatim and unmapped. A scheme value this bank does
            not recognise leaves `status` where it was rather than being guessed into it.
        occurredAt: { type: string, format: date-time }
        sourceService: { type: string, enum: [card-processing-service] }
