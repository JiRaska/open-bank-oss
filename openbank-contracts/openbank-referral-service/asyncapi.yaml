asyncapi: 2.6.0
info:
  title: Referral lifecycle events
  version: 1.0.0
  description: |
    CONTRACT ONLY — no producer is wired in this build. The referral service hands every event to
    UnwiredReferralEventPublisher, which DROPS it and counts it as
    openbank_referral_events_dropped_total{reason="transport_not_wired"}. Do not build a consumer
    against these channels expecting traffic until the event-schema slice wires an outbox producer.
channels:
  referral.qualified.v1:
    publish: {operationId: referralQualified, message: {$ref: '#/components/messages/Qualified'}}
  referral.reward.requested.v1:
    publish: {operationId: referralRewardRequested, message: {$ref: '#/components/messages/RewardRequested'}}
  referral.reward.outcome.v1:
    publish: {operationId: referralRewardOutcome, message: {$ref: '#/components/messages/RewardOutcome'}}
components:
  messages:
    Qualified: {payload: {type: object, required: [eventId, inviteId, qualificationEventId]}}
    RewardRequested: {payload: {type: object, required: [eventId, inviteId, rewardReference, amount, currency]}}
    RewardOutcome: {payload: {type: object, required: [eventId, inviteId, rewardReference, outcome]}}
