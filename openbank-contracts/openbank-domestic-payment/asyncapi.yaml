asyncapi: 3.0.0

info:
  title: OpenBank Domestic Payment Service — events
  version: 1.4.0
  description: >-
    Events produced by the Czech domestic-payment lifecycle. A delegated payment carries one
    indivisible delegationId/reservationId pair from creation through every status transition;
    owner-initiated payments omit both fields. The input reservation-state contract remains owned
    by openbank-delegation-service and is referenced below rather than copied into this document.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

defaultContentType: application/json

x-openbank-consumes:
  - channel: openbank.delegation.spend-reservation-state
    contract: ../openbank-delegation-service/asyncapi.yaml#/channels/spendReservationState
    description: >-
      Compacted reservation snapshots are applied by monotonic reservationVersion, not event
      timestamps. Source timestamps are canonicalized to microsecond precision before persistence
      and comparison, including older nanosecond payloads. Terminal evidence is retained so a
      delayed RESERVED revision 1 cannot reopen it.

servers:
  local:
    host: localhost:29092
    protocol: kafka
    description: Local development broker; deployed endpoints are supplied by environment config.

channels:
  domesticPaymentEvents:
    address: openbank.domestic.payment.events
    messages:
      DOMESTIC_PAYMENT_CREATED:
        $ref: '#/components/messages/DOMESTIC_PAYMENT_CREATED'
      DOMESTIC_PAYMENT_STATUS_CHANGED:
        $ref: '#/components/messages/DOMESTIC_PAYMENT_STATUS_CHANGED'
      DELEGATED_SPEND_FINALIZED_ABSENT:
        $ref: '#/components/messages/DELEGATED_SPEND_FINALIZED_ABSENT'
      PAYMENT_HELD:
        $ref: '#/components/messages/PAYMENT_HELD'
  notificationRequests:
    address: openbank.notification.requests
    description: >-
      Existing notification-service delivery command (see openbank-campaign-service/asyncapi.yaml),
      emitted here for a rejected domestic payment via KafkaNotificationSendAdapter (#8352).

operations:
  publishDomesticPaymentEvents:
    action: send
    channel:
      $ref: '#/channels/domesticPaymentEvents'
    messages:
      - $ref: '#/channels/domesticPaymentEvents/messages/DOMESTIC_PAYMENT_CREATED'
      - $ref: '#/channels/domesticPaymentEvents/messages/DOMESTIC_PAYMENT_STATUS_CHANGED'
      - $ref: '#/channels/domesticPaymentEvents/messages/DELEGATED_SPEND_FINALIZED_ABSENT'
      - $ref: '#/channels/domesticPaymentEvents/messages/PAYMENT_HELD'

components:
  messageTraits:
    outboxHeaders:
      headers:
        type: object
        required: [ce-id, ce-type, idempotency-key]
        properties:
          ce-id: {type: string, format: uuid}
          ce-type: {type: string}
          idempotency-key: {type: string, format: uuid}

  schemas:
    paymentStatus:
      type: string
      description: >-
        HELD (1.4.0, ADR-0374) is emitted only while the payment admission chain is switched on for
        this rail. A consumer that projects statuses must accept it as a non-terminal stage.
      enum: [RECEIVED, HELD, VALIDATED, SENT_TO_CLEARING, SETTLED, REJECTED, RETURNED, CANCELLED]

    delegationContext:
      type: object
      description: >-
        Additive delegated-spend context. delegationId and reservationId are both UUIDs or both
        absent/null. initiatedByPartyId identifies the authenticated customer who initiated the
        payment and is independent of whether the payment was delegated.
      properties:
        initiatedByPartyId:
          type: [string, 'null']
          format: uuid
        delegationId:
          type: [string, 'null']
          format: uuid
        reservationId:
          type: [string, 'null']
          format: uuid

    delegatedSpendTuple:
      type: object
      required:
        - reservationId
        - delegationId
        - grantorPartyId
        - granteePartyId
        - resourceType
        - resourceId
        - operationType
        - amount
        - currency
        - idempotencyKeyHash
      properties:
        reservationId: {type: string, format: uuid}
        delegationId: {type: string, format: uuid}
        grantorPartyId: {type: string, format: uuid}
        granteePartyId: {type: string, format: uuid}
        resourceType: {type: string, const: ACCOUNT}
        resourceId: {type: string, format: uuid}
        operationType: {type: string, const: DOMESTIC_PAYMENT}
        amount: {type: number, format: decimal, exclusiveMinimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, pattern: '^[A-Z]{3}$'}
        idempotencyKeyHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase SHA-256 hex over UTF-8 bytes of
            openbank.delegation.spend-reservation.idempotency-key.v1, one NUL byte, then the raw
            Idempotency-Key. The raw caller-controlled key is never retained in compacted state.

  messages:
    PAYMENT_HELD:
      name: PAYMENT_HELD
      title: Payment held by the admission chain and waiting for a case decision
      description: >-
        ADR-0374 D13. Written in the transaction that moves the payment to HELD (or, for a hold
        caused by an unavailable control, when its automatic re-evaluation is exhausted), so a hold
        that needs a human always has this event. aml-service opens the hold's one case from it,
        idempotent on caseKey, and the rail accepts a release or a reject only from the case of the
        hold's current review. The
        eventType is rail-neutral; rail names the producer. Carries no name: evidence holds list
        entries, statuses and scores, never the screened names. May be delivered more than once.
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        type: object
        required:
          - paymentId
          - rail
          - caseKey
          - debtorAccountId
          - customerReference
          - reasons
          - steps
          - heldAt
          - expiresAt
          - occurredAt
          - aggregateRevision
          - eventType
          - sourceService
        properties:
          paymentId: {type: string, format: uuid}
          rail: {type: string, const: DOMESTIC}
          caseKey:
            type: string
            description: >-
              payment-hold:domestic:<paymentId> for the first review of the hold, and
              payment-hold:domestic:<paymentId>:<review> for a later one. A consumer derives it from
              rail, paymentId and review and refuses any other value.
          review:
            type: integer
            minimum: 1
            description: >-
              Which review of the hold this requests; absent means 1. A hold has one review unless,
              at release, a control reports something the decided case was not asked about. Then a
              further review is requested, as a case of its own, within the same hold and expiry.
          debtorAccountId: {type: string, format: uuid}
          debtorPartyId:
            type: [string, 'null']
            format: uuid
            description: >-
              Absent when account standing could not be read. The case is opened without a party
              and the case service establishes it afterwards.
          customerReference: {type: string, maxLength: 128}
          reasons:
            type: array
            items: {type: string}
          steps:
            type: array
            items:
              type: object
              required: [step, outcome, evidence]
              properties:
                step: {type: string}
                outcome: {type: string, enum: [DECIDED, UNAVAILABLE, NOT_APPLICABLE, NOT_REACHED]}
                decision: {type: [string, 'null'], enum: [ALLOW, CHALLENGE, HOLD, REJECT, null]}
                reason: {type: [string, 'null']}
                evidence:
                  type: object
                  additionalProperties: {type: string}
          heldAt: {type: string, format: date-time}
          expiresAt: {type: string, format: date-time}
          occurredAt: {type: string, format: date-time}
          aggregateRevision: {type: integer, minimum: 1}
          eventType: {type: string, const: PAYMENT_HELD}
          sourceService: {type: string, const: domestic-payment}

    DOMESTIC_PAYMENT_CREATED:
      name: DOMESTIC_PAYMENT_CREATED
      title: Domestic payment created
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/delegationContext'
          - type: object
            required:
              - paymentId
              - idempotencyKey
              - status
              - debtorAccountId
              - debtorAccountNumber
              - debtorBankCode
              - creditorAccountNumber
              - creditorBankCode
              - amount
              - currency
              - priority
              - endToEndId
              - occurredAt
              - eventType
              - sourceService
            properties:
              paymentId: {type: string, format: uuid}
              idempotencyKey: {type: string}
              status: {$ref: '#/components/schemas/paymentStatus'}
              debtorAccountId: {type: string, format: uuid}
              debtorAccountNumber: {type: string}
              debtorBankCode: {type: string}
              creditorAccountNumber: {type: string}
              creditorBankCode: {type: string}
              amount: {type: number}
              currency: {type: string}
              priority: {type: string, enum: [STANDARD, URGENT, INSTANT]}
              endToEndId: {type: string}
              occurredAt: {type: string, format: date-time}
              aggregateRevision:
                type: integer
                minimum: 1
                description: Database-backed monotonic ordering token; optional only for retained pre-1.2 events.
              eventType: {type: string, const: DOMESTIC_PAYMENT_CREATED}
              sourceService: {type: string, const: domestic-payment}

    DOMESTIC_PAYMENT_STATUS_CHANGED:
      name: DOMESTIC_PAYMENT_STATUS_CHANGED
      title: Domestic payment status changed
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/delegationContext'
          - type: object
            required:
              - paymentId
              - previousStatus
              - newStatus
              - occurredAt
              - eventType
              - sourceService
            properties:
              paymentId: {type: string, format: uuid}
              previousStatus: {$ref: '#/components/schemas/paymentStatus'}
              newStatus: {$ref: '#/components/schemas/paymentStatus'}
              rejectReason: {type: [string, 'null']}
              rejectDetail: {type: [string, 'null']}
              occurredAt: {type: string, format: date-time}
              settledAt:
                type: [string, 'null']
                format: date-time
                description: Persisted domestic settlement transition time; optional for older status events.
              aggregateRevision:
                type: integer
                minimum: 1
                description: Database-backed monotonic ordering token; optional only for retained pre-1.2 events.
              eventType: {type: string, const: DOMESTIC_PAYMENT_STATUS_CHANGED}
              sourceService: {type: string, const: domestic-payment}

    DELEGATED_SPEND_FINALIZED_ABSENT:
      name: DELEGATED_SPEND_FINALIZED_ABSENT
      title: Domestic payment permanently finalized a reservation without creating a payment
      summary: >-
        Emitted transactionally with PENDING to FINALIZED_ABSENT by the default-off finalizer.
        delegation-service must release only after the full immutable tuple matches.
      traits:
        - $ref: '#/components/messageTraits/outboxHeaders'
      payload:
        allOf:
          - $ref: '#/components/schemas/delegatedSpendTuple'
          - type: object
            required:
              - reservationState
              - reservationVersion
              - finalizedAt
              - occurredAt
              - eventType
              - sourceService
              - version
            properties:
              reservationState: {type: string, const: RESERVED}
              reservationVersion: {type: integer, const: 1}
              finalizedAt: {type: string, format: date-time}
              occurredAt: {type: string, format: date-time}
              eventType: {type: string, const: DELEGATED_SPEND_FINALIZED_ABSENT}
              sourceService: {type: string, const: domestic-payment}
              version: {type: integer, const: 1}
