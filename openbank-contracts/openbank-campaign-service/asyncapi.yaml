asyncapi: 3.0.0
info:
  title: OpenBank Campaign Service — commands
  version: 1.1.0
  description: |
    Commands emitted while executing an approved campaign journey. Campaign service owns the
    decision, consent gate and opaque interaction id; destination services own delivery/rendering.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
servers:
  sandbox:
    host: openbank-cluster-kafka-bootstrap.messaging.svc:9093
    protocol: kafka-secure
    description: mTLS Kafka; campaign-service publishes with its dedicated KafkaUser.
channels:
  notificationRequests:
    address: openbank.notification.requests
    description: |
      Existing notification-service delivery command emitted by KafkaNotificationSendAdapter.
      The optional v1 deduplicationKey equals the producer's correlationId (the durable send-log
      row id). A replay of the same logical handoff therefore resolves against one notification
      fact; consumers accepting older requests without this field remain compatible.
    messages:
      notificationRequest:
        $ref: '#/components/messages/notificationRequest'
  campaignBannerPlacements:
    address: openbank.campaign.banner.placements
    description: |
      First-party app-surface placement command emitted by KafkaBannerPlacementAdapter and consumed
      by engagement-service. The compacted record key is the opaque interactionRef, so retries
      remain idempotent and do not create a second customer surface.
operations:
  publishNotificationRequest:
    action: send
    channel:
      $ref: '#/channels/notificationRequests'
    messages:
      - $ref: '#/channels/notificationRequests/messages/notificationRequest'
components:
  messages:
    notificationRequest:
      name: NotificationRequest
      contentType: application/json
      payload:
        $ref: '#/components/schemas/notificationRequest'
  schemas:
    notificationRequest:
      type: object
      required: [partyId, channel, template, recipient, variables, correlationId]
      properties:
        partyId: { type: string, format: uuid }
        channel: { type: string, enum: [EMAIL, PUSH] }
        template: { type: string, description: Reviewed notification template identifier. }
        recipient: { type: string, description: Party identifier resolved by notification-service. }
        variables:
          type: object
          additionalProperties: { type: string }
        correlationId: { type: string, format: uuid, description: Campaign send-log row id. }
        deduplicationKey:
          type: string
          format: uuid
          description: Optional v1 field; equal to correlationId for campaign handoffs.
        deepLink: { type: string, description: Closed authenticated app route for PUSH. }
        interactionRef: { type: string, format: uuid, description: Opaque app interaction reference for PUSH. }
    campaignBannerPlacement:
      type: object
      required: [interactionRef, partyId, campaignId, stepOrder, template, variables, deepLink, inAppSurface]
      properties:
        interactionRef: { type: string, format: uuid, description: Campaign send-log id and opaque app interaction reference. }
        partyId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        stepOrder: { type: integer, minimum: 0 }
        template:
          type: string
          enum: [MARKETING_PRODUCT_OFFER_BANNER, MARKETING_PRODUCT_OFFER_CAROUSEL, MARKETING_PRODUCT_OFFER_PRODUCT_FEED, MARKETING_PRODUCT_OFFER_REWARDS_HUB]
        inAppSurface: { type: string, enum: [HOME_BANNER, HOME_CAROUSEL, PRODUCT_FEED, REWARDS_HUB] }
        variables:
          type: object
          additionalProperties: { type: string }
        deepLink:
          type: string
          description: Closed openbank app route; never an author-entered URL.
