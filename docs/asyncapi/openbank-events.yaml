          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        occurredAt:
          type: string
          format: date-time

    NotificationRequestPayload:
      type: object
      required: [partyId, channel, template, recipient, variables]
      properties:
        partyId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, PUSH]
        template:
          type: string
          description: Closed notification-service template identifier.
        recipient:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string
        correlationId:
          type: string
          format: uuid
          description: Optional producer-owned delivery-outcome correlation id.
        deduplicationKey:
          type: string
          format: uuid
          description: >-
            Optional producer-owned durable business-fact key. Repeated requests with the same
            key produce no second notification row or delivery attempt.
        deepLink:
          type: string
          enum: [openbank://home, openbank://savings, openbank://cards, openbank://payments, openbank://products]
          description: Optional allow-listed mobile route for a PUSH tap. Never customer content.
        interactionRef:
          type: string
          format: uuid
          description: >-
            Optional opaque producer-owned PUSH interaction reference. campaign-service supplies
            its send-log id; it is neither a campaign id nor party identity and is not a delivery
            outcome correlation.

    SwiftMessageEventPayload:
      # A hand-built map of seven keys. The previous revision declared senderBic, receiverBic,
      # transactionReference, amountMinorUnits, previousStatus, newStatus, ackRef and
      # rejectionReason — none of which the producer has ever emitted.
      type: object
      required: [swiftMessageId, status, messageType, occurredAt]
      properties:
        swiftMessageId:
          type: string
          format: uuid
        paymentSagaRef:
          type: [string, 'null']
        status:
          type: string
          enum: [PENDING, VALIDATED, SENT, ACKNOWLEDGED, REJECTED, FAILED]
          description: >-
            The only state on the wire. `ce-type` is always `swift.message.status-changed`, so the
            transition must be inferred from this field, not from the event type.
        messageType:
          type: string
          enum: [MT103, MT202, MT900, MT910, MT940, MT950, MT199]
        amount:
          type: number
        currency:
          type: string
        occurredAt:
          type: string
          format: date-time

