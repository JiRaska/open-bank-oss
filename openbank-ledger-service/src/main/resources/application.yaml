quarkus:
  application:
    name: openbank-ledger-service

  http:
    port: 8101

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_ledger
    # The DEFAULT (Agroal/JDBC) datasource Flyway migrates. Declaring only the reactive URL above
    # leaves it unconfigured, and `migrate-at-start` then kills the boot with "Unable to find
    # datasource '<default>' … Bean is not active: SYNTHETIC bean [class=AgroalDataSource]" —
    # so the service could start only where the gitops env supplied QUARKUS_DATASOURCE_JDBC_URL,
    # never from this file alone (#3080). The env var still wins in the cluster; the literal is
    # the local-dev default, matching the reactive URL above and the fleet convention.
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/openbank_ledger}

  flyway:
    # Flyway (blocking/JDBC) migrates the DEFAULT datasource, whose JDBC URL is declared above.
    # A `quarkus.flyway.datasource.*` block would NOT define one — that key names which existing
    # datasource Flyway should use — which is why the three services that carried such a block
    # failed to boot in exactly the same way (#3080).
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  redis:
    hosts: redis://localhost:6379

  rest-client:
    fx-service:
      url: ${FX_SERVICE_URL:http://localhost:8119}
      scope: jakarta.inject.Singleton

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-ledger-service

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137, #2665 Tier 1). Defaults keep local dev/test on
    # PLAINTEXT; the ledger Rollout sets KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      ledger-events-out:
        connector: smallrye-kafka
        client.id: ledger-service-${quarkus.uuid}
        topic: openbank.ledger.journal.posted
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second
  # approver), independent of the base allow/deny enforce toggle above. Stays false
  # here — this PR only wires the ApprovalStore/endpoint (mirrors the sepa-payment
  # pilot); flipping this is a deliberate, separate follow-up once the maker/checker
  # runbook is reviewed, not bundled with the wiring itself.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  outbox:
    dispatch-enabled: true
  ledger:
    # Day-granular period lock (ADR-0207 D3). Modes: off | shadow | enforce.
    #
    # SHIPS IN SHADOW and must stay there until the counter below reads zero (or every hit is
    # explained). In shadow the check runs and records what it WOULD have refused without
    # refusing, so the volume of currently-legal backdated postings is measured before any of
    # them start failing. #1197 is what happens when a new money-path refusal is turned on blind:
    # five workloads dead for four days.
    #
    # Evidence to read before flipping to enforce:
    #   openbank_ledger_day_lock_decisions_total{outcome="would_refuse"}
    # and the WARN lines from AccountingDayLock, which carry the entry date so the backdated
    # postings can be attributed rather than only counted.
    day-lock:
      mode: "${LEDGER_DAY_LOCK_MODE:shadow}"
    # Period-granular lock (ADR-0096 D1). Modes: off | shadow | enforce. Same staged rollout and
    # the same reason as the day lock above — it ships in SHADOW and refuses nothing until the
    # counter openbank_ledger_period_lock_decisions_total{outcome="would_refuse"} reads zero (or
    # every hit is explained). The two locks are independent: a month can be FROZEN inside an
    # unattested year, and a day LOCKED inside an unfrozen month.
    period-lock:
      mode: "${LEDGER_PERIOD_LOCK_MODE:shadow}"
    # journal_entries partition lifecycle (JournalPartitionMaintainer). Roll-forward is always
    # active; retention is DETACH-only and dry-run by default. Flip drop-enabled + dry-run only
    # as a deliberate, archived operator action — DROP is physically destructive.
    partition:
      future-years: 2       # pre-create this many years ahead of the current year
      retention-years: 10   # keep at least this many calendar years attached (CZ účetnictví / AML)
      drop-enabled: false   # when true, expired partitions are DROPped instead of DETACHed
      dry-run: true         # when true, DETACH/DROP are audited but not executed
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_ledger_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_ledger_it
    management:
      enabled: false
    oidc:
      enabled: false
    devservices:
      enabled: false
    # The outbox dispatcher is driven explicitly in LedgerOutboxDispatchIT (await the Uni),
    # so the 5s tick must not race the assertions or double-publish. Other ITs call their
    # collaborators directly, so a disabled scheduler is safe fleet-wide in test.
    scheduler:
      enabled: false
