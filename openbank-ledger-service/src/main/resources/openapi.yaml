openapi: 3.1.0
info:
  title: Ledger Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.15 -> 1.16): additive
  # only — GET /journals/approvals (the checker's queue, issue #5679) plus two additive fields on
  # ApprovalResponse (makerId, createdAt). No breaking change.
  version: 1.17.0
  description: Double-entry journal ledger — query journal entries and transaction postings.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8101
    description: Local development
tags:
  - name: Ledger
  - name: YearClose
  - name: AccountingDay
  - name: ClosedPeriod

paths:
  /api/v1/journals:
    get:
      tags: [Ledger]
      summary: List journal entries (cursor-paginated)
      description: >
        Lists journal entries whose entry date falls in [fromDate, toDate], newest-window
        pagination via an opaque cursor. toDate defaults to today.
      operationId: listJournals
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
            default: '2020-01-01'
        - name: toDate
          in: query
          description: Defaults to today when omitted.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Journal entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Ledger]
      summary: Post a balanced journal entry
      description: >
        Books a double-entry journal (at least 2 lines; debits must equal credits within each
        settlement currency, ADR-0025). Idempotent via `idempotencyKey` — replaying the same key
        returns the originally created entry. Fails closed with 409 when the entry date falls in
        an ATTESTED (locked) fiscal period (#869), and with 422 when the entry is unbalanced or
        references an invalid GL account.
      operationId: postJournal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostJournalRequest'
      responses:
        '201':
          description: Journal entry created
          headers:
            Location:
              description: URL of the created journal entry (/api/v1/journals/{journalId}).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '400':
          description: >-
            Malformed body — an unparseable date, a null element in `lines`, or no request body at
            all. All three are caller errors, and each was previously answered as a 500 (#7860).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Entry date falls in an ATTESTED (locked) fiscal period, or a conflicting state was detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unbalanced journal (debits != credits per currency) or GL account validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/journals/{journalId}:
    get:
      tags: [Ledger]
      summary: Get journal entry by ID
      operationId: getJournal
      parameters:
        - name: journalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal entry detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/journals/{journalId}/reverse:
    post:
      tags: [Ledger]
      summary: Reverse a posted journal entry
      description: >
        Posts a compensating journal entry (sides flipped, same amounts and entry date) that
        nets the original to zero. The reversal is itself a journal entry with its own entry
        number. Fails closed with 409 when the original is already reversed (or otherwise not
        reversible) or when its entry date falls in an ATTESTED (locked) fiscal period —
        corrections to a closed year must be booked as an adjustment in the open period.
      operationId: reverseJournal
      parameters:
        - name: journalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseJournalRequest'
      responses:
        '200':
          description: The compensating (reversal) journal entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Journal already reversed / not reversible, or its fiscal period is ATTESTED (period lock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/journals/replay-booked-changes:
    post:
      tags: [Ledger]
      summary: Re-emit historical AccountBookedChanged events for a date window (ops recovery, #860)
      description: >
        Operations-recovery action. Reconstructs and re-enqueues the ledger's own already-posted
        booked movements for a date window so a downstream projection that missed them (e.g.
        balance-service's deposit-control sub-ledger, ADR-0039) can catch up idempotently — the
        consumer dedups on `(journalEntryId, accountId, currency)`, so only genuinely-missing
        deltas land. Posts NO journal and mutates NO ledger state. `dryRun` (default true) previews
        the counts and net delta per currency without emitting anything.
      operationId: replayBookedChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayBookedChangesRequest'
      responses:
        '200':
          description: Replay summary — counts and net booked delta per currency for the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayBookedChangesResponse'
        '400':
          description: Invalid window (`from` after `to`) or unparseable date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/journals/trial-balance:
    get:
      tags: [Ledger]
      summary: Trial balance — debit/credit totals per GL account (must net to zero)
      description: >
        Aggregates POSTED journal lines per GL account as of the given date (defaults to
        today). The double-entry invariant (sum of debits == sum of credits over the whole GL)
        is reported as `balanced`.
      operationId: getTrialBalance
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/journals/sub-ledger-balances:
    get:
      tags: [Ledger]
      summary: Per-customer deposit-control sub-ledger balances (ADR-0039 Phase B)
      description: >
        Aggregates POSTED journal lines that carry a sub_account_id, grouped by
        (subAccountId, currency). Used to tie the GL deposit-control account out against the
        per-account balance read-model (analytická evidence, CNB 563/1991 + 501/2002).
      operationId: getSubLedgerBalances
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
            format: date
        - name: subAccountId
          in: query
          description: Optional filter to a single customer account.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sub-ledger balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubLedgerBalancesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/journals/transaction/{transactionId}:
    get:
      tags: [Ledger]
      summary: Get journal entries for a transaction
      operationId: getJournalsByTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Journal entries for transaction
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/control-accounts/{controlAccountId}/tie-out:
    get:
      tags: [Ledger]
      summary: Sub-ledger tie-out for a deposit-control GL account (ADR-0039 Phase B)
      description: >
        Asserts Σ(per-customer sub-ledger lines) == GL aggregate balance for the given
        deposit-control account. A non-zero delta is a reconciliation break (incident).
        Returns one entry per currency found in the control account's posted lines.
        Empty list means no posted activity yet.
      operationId: controlAccountTieOut
      parameters:
        - name: controlAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tie-out result per currency
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ControlAccountTieOutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/fx-revaluation:
    post:
      tags: [Ledger]
      summary: Run the daily mark-to-ČNB revaluation of foreign-currency positions
      description: >-
        Revalues open FX positions against the ČNB fixing for a business day. Requires
        ROLE_OPERATOR (authorize action `ledger.trigger`). The same work runs on a scheduler;
        this endpoint is the operator re-drive for a day the scheduled run missed.
      operationId: runFxRevaluation
      parameters:
        - name: date
          in: query
          description: Business day to revalue. Omit for today in Europe/Prague.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The revaluation result for that business day
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/close/trial-balance:
    get:
      tags: [YearClose]
      summary: Fiscal-year GL trial balance, grouped by account type (ADR-0078 D5)
      description: >
        Computed on demand from POSTED journal activity with entryDate inside the fiscal year,
        per GL account, grouped by ASSET/LIABILITY/EQUITY/INCOME/EXPENSE. The double-entry
        invariant (sum of debits == sum of credits over the whole GL) is reported as `balanced`;
        `contentHash` is the SHA-256 of the canonical trial-balance JSON — the attestation anchor.
      operationId: getFiscalYearTrialBalance
      parameters:
        - name: fiscalYear
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Fiscal-year trial balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalYearTrialBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/close/{fiscalYear}:
    get:
      tags: [YearClose]
      summary: Get the year-close record for a fiscal year
      operationId: getYearClose
      parameters:
        - $ref: '#/components/parameters/FiscalYearPath'
      responses:
        '200':
          description: Year-close record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearCloseRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [YearClose]
      summary: Create or refresh the DRAFT year-close record from the current trial balance
      description: >
        Idempotent per fiscal year while the record is DRAFT (the record id is stable; the
        snapshot — totals, account count, content hash, computedAt — is refreshed). Conflicts
        (409) once the year is ATTESTED, or when the GL does not balance.
      operationId: createYearCloseDraft
      parameters:
        - $ref: '#/components/parameters/FiscalYearPath'
      responses:
        '200':
          description: DRAFT year-close record (created or refreshed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearCloseRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/ledger/close/{fiscalYear}/attest:
    post:
      tags: [YearClose]
      summary: Attest the DRAFT year close (DRAFT → ATTESTED)
      description: >
        Re-verifies the draft's content hash against a FRESH trial-balance computation; any
        drift (late postings into the closed year) fails closed with 409. The attesting
        principal is taken from the verified JWT. Emits a YearCloseAttested event via the
        transactional outbox in the same transaction as the status flip. Only a fiscal year
        that has fully ended can be attested.
      operationId: attestYearClose
      parameters:
        - $ref: '#/components/parameters/FiscalYearPath'
      responses:
        '200':
          description: ATTESTED year-close record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearCloseRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/ledger/close/{fiscalYear}/verify:
    get:
      tags: [YearClose]
      summary: Re-verify a year close against a fresh trial balance (read-only)
      description: >
        Recomputes the fiscal-year trial balance and compares its content hash to the one anchored
        on the year-close record, WITHOUT flipping any state. Reports drift (matches=false) rather
        than failing, so an auditor can continuously prove a sealed (ATTESTED) period is unchanged
        or detect a stale DRAFT. Only an absent record is an error (404).
      operationId: verifyYearClose
      parameters:
        - $ref: '#/components/parameters/FiscalYearPath'
      responses:
        '200':
          description: Verification verdict (match / drift, both hashes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearCloseVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ledger/accounting-days/current:
    get:
      tags: [AccountingDay]
      summary: The current accounting day (ADR-0207 D1)
      description: >
        The single supported answer to "what accounting day is it", from the business-date
        authority (bank zone + cutoff) rather than from a wall clock. Also reports whether that day
        has been opened, so a caller can tell "today is 2026-07-31 and it is OPEN" from "today is
        2026-07-31 and nobody has opened it yet".
      operationId: getCurrentAccountingDay
      responses:
        '200':
          description: The current accounting day and its state, if opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountingDayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/accounting-days:
    get:
      tags: [AccountingDay]
      summary: List accounting days in a date range
      operationId: listAccountingDays
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Accounting days ascending by business date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingDayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/accounting-days/{businessDate}:
    get:
      tags: [AccountingDay]
      summary: Get one accounting day's state
      operationId: getAccountingDay
      parameters:
        - $ref: '#/components/parameters/BusinessDatePath'
      responses:
        '200':
          description: Accounting day state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingDayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [AccountingDay]
      summary: Open an accounting day for posting
      description: >
        Creates the day in OPEN. A day is opened once — a repeat is 409, not an idempotent no-op.
        A future business date is refused (422).
      operationId: openAccountingDay
      parameters:
        - $ref: '#/components/parameters/BusinessDatePath'
      responses:
        '201':
          description: Accounting day opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingDayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The day is already open
        '422':
          description: The business date is in the future

  /api/v1/ledger/accounting-days/{businessDate}/transitions/{to}:
    post:
      tags: [AccountingDay]
      summary: Advance an accounting day one step (ADR-0207 D2)
      description: >
        Monotonic single-step progression OPEN → CUTOFF → TIED_OUT → LOCKED. Skipping a stage,
        repeating the current stage, or moving backwards is 409 — there is deliberately no reopen,
        because a day that must be corrected after cutoff is corrected forward (a reversal books
        into the current open day with a link to the original entry), never rewritten in place.
        Each transition is published on the outbox as AccountingDayTransitioned; consumers react to
        that rather than polling this service per posting.
      operationId: transitionAccountingDay
      parameters:
        - $ref: '#/components/parameters/BusinessDatePath'
        - name: to
          in: path
          required: true
          description: The target status; must be the immediate successor of the current one.
          schema:
            type: string
            enum: [CUTOFF, TIED_OUT, LOCKED]
      responses:
        '200':
          description: Accounting day advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingDayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Illegal transition (not the immediate successor), or a concurrent transition won

  /api/v1/ledger/periods:
    get:
      tags: [ClosedPeriod]
      summary: List closed-period records overlapping a date range (ADR-0096 D1)
      operationId: listClosedPeriods
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Closed-period records, ascending by period start
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClosedPeriodResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/periods/{type}/{date}:
    get:
      tags: [ClosedPeriod]
      summary: Get the close record for the period containing the date
      operationId: getClosedPeriod
      parameters:
        - $ref: '#/components/parameters/PeriodTypePath'
        - $ref: '#/components/parameters/PeriodDatePath'
      responses:
        '200':
          description: Closed-period record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosedPeriodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ClosedPeriod]
      summary: Create or refresh the DRAFT close from the current journal
      description: >
        Idempotent while DRAFT — a refresh keeps the record id and moves only the snapshot, so the
        checker always reviews a draft with a known author. Refused with 409 if the period is
        already FROZEN, if the GL does not balance over it, or if the period has not ended yet.
      operationId: createClosedPeriodDraft
      parameters:
        - $ref: '#/components/parameters/PeriodTypePath'
        - $ref: '#/components/parameters/PeriodDatePath'
      responses:
        '200':
          description: DRAFT close record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosedPeriodResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/ledger/periods/{type}/{date}/trial-balance:
    get:
      tags: [ClosedPeriod]
      summary: Operational trial balance for the period
      description: >
        Operational read. It returns LINES_V1 evidence for a new FROZEN close, but may recompute
        the current journal for DRAFT/no-close or historical HASH_ONLY closes. Regulatory readers
        MUST use frozen-trial-balance, which fails closed unless immutable LINES_V1 exists.
      operationId: getPeriodTrialBalance
      parameters:
        - $ref: '#/components/parameters/PeriodTypePath'
        - $ref: '#/components/parameters/PeriodDatePath'
      responses:
        '200':
          description: Period trial balance with its content hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodTrialBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ledger/periods/{type}/{date}/frozen-trial-balance:
    get:
      tags: [ClosedPeriod]
      summary: Immutable FROZEN LINES_V1 trial balance for regulatory reporting
      description: >
        Fail-closed evidence read. DRAFT, missing and pre-V23 HASH_ONLY closes return 409 instead
        of a mutable recomputation. FINREP/COREP consumes this endpoint exclusively.
      operationId: getFrozenPeriodTrialBalance
      parameters:
        - $ref: '#/components/parameters/PeriodTypePath'
        - $ref: '#/components/parameters/PeriodDatePath'
      responses:
        '200':
          description: Hash-attested immutable period trial balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodTrialBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/ledger/periods/{type}/{date}/verify:
    get:
      tags: [ClosedPeriod]
      summary: Re-verify a close against a fresh trial balance (read-only)
      description: >
        Recomputes the period trial balance and compares its content hash to the one anchored on the
        record, WITHOUT flipping state. Reports drift (matches=false) rather than failing, so an
        auditor can continuously prove a FROZEN period is unchanged, or detect a stale DRAFT.
      operationId: verifyClosedPeriod
      parameters:
        - $ref: '#/components/parameters/PeriodTypePath'
        - $ref: '#/components/parameters/PeriodDatePath'
      responses:
        '200':
          description: Verification verdict (match / drift, both hashes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosedPeriodVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ledger/periods/{type}/{date}/freeze:
    post:
      tags: [ClosedPeriod]
      summary: Freeze the DRAFT close (DRAFT → FROZEN)
      description: >
        Re-verifies the content hash against a fresh computation fail-closed, then seals the period:
        the trial balance becomes immutable evidence and no journal may be dated into it. Four-eyes —
        the freezing principal must differ from the draft author, and a draft with no recorded author
        can never be frozen.
      operationId: freezeClosedPeriod
      parameters:
        - $ref: '#/components/parameters/PeriodTypePath'
        - $ref: '#/components/parameters/PeriodDatePath'
      responses:
        '200':
          description: FROZEN close record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosedPeriodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/journals/approvals:
    get:
      tags: [Ledger]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id.
      description: >-
        PENDING maker-checker approvals on `ledger.reverse`, oldest first. The read side of the
        unified approval inbox — deciding stays on PATCH /api/v1/journals/approvals/{id}. Requires
        ROLE_OPERATOR or ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/journals/approvals/{id}:
    patch:
      tags: [Ledger]
      summary: Approve or reject a pending four-eyes approval for a ledger journal (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: >-
            The caller is the maker of this approval. Segregation of duties is enforced in
            RedisApprovalStore.decide, not per-service.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    FiscalYearPath:
      name: fiscalYear
      in: path
      required: true
      schema:
        type: integer

    PeriodTypePath:
      name: type
      in: path
      required: true
      description: Statutory period granularity.
      schema:
        type: string
        enum: [MONTH, QUARTER, YEAR]

    PeriodDatePath:
      name: date
      in: path
      required: true
      description: Any date inside the period; normalised server-side to the whole calendar period.
      schema:
        type: string
        format: date

    BusinessDatePath:
      name: businessDate
      in: path
      required: true
      description: The accounting day, ISO-8601 (ADR-0207).
      schema:
        type: string
        format: date

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated but not authorized for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Malformed request (e.g. a path/query value that is not an ISO-8601 date)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflict (fail-closed close invariant — attested immutability, hash drift, unbalanced GL, open year)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    PeriodTrialBalanceResponse:
      type: object
      description: Trial balance for one statutory period, with its attestation anchor (ADR-0096 D1).
      required: [period, from, to, totalDebit, totalCredit, balanced, accountCount, contentHash, lines]
      properties:
        period: { type: string, description: "Stable label, e.g. MONTH:2026-05 / QUARTER:2026-Q2 / YEAR:2026." }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalDebit: { type: string }
        totalCredit: { type: string }
        balanced: { type: boolean, description: "Double-entry holds over the period: debits == credits." }
        accountCount: { type: integer }
        contentHash: { type: string, description: "SHA-256 of the canonical trial-balance JSON." }
        lines:
          type: array
          description: Exact persisted evidence for FROZEN periods; computed only for DRAFT/no close.
          items:
            $ref: '#/components/schemas/PeriodTrialBalanceLineResponse'

    PeriodTrialBalanceLineResponse:
      type: object
      required: [code, type, currency, totalDebit, totalCredit, net]
      properties:
        code: { type: string }
        type: { type: string }
        currency: { type: string }
        totalDebit: { type: string }
        totalCredit: { type: string }
        net: { type: string }

    ClosedPeriodResponse:
      type: object
      description: The persisted statutory close for one period (ADR-0096 D1).
      required: [id, period, periodType, from, to, status, evidenceState, computedAt, contentHash]
      properties:
        id: { type: string, format: uuid }
        period: { type: string }
        periodType: { type: string, enum: [MONTH, QUARTER, YEAR] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        status:
          type: string
          enum: [DRAFT, FROZEN]
          description: DRAFT is recomputable; FROZEN has an immutable hash anchor.
        evidenceState:
          type: string
          enum: [NONE, HASH_ONLY, LINES_V1]
          description: HASH_ONLY is a V22 historical close; only LINES_V1 is line-level regulatory evidence.
        computedAt: { type: string, format: date-time }
        totalDebits: { type: string }
        totalCredits: { type: string }
        accountCount: { type: integer }
        contentHash: { type: string }
        draftedBy: { type: string, nullable: true, description: "Maker (four-eyes)." }
        frozenBy: { type: string, nullable: true, description: "Checker; must differ from the maker." }
        frozenAt: { type: string, format: date-time, nullable: true }

    ClosedPeriodVerificationResponse:
      type: object
      description: Read-only re-verification of a close against a fresh computation.
      required: [period, status, recordedHash, recomputedHash, matches, balanced, recomputedAt]
      properties:
        period: { type: string }
        status: { type: string, enum: [DRAFT, FROZEN] }
        recordedHash: { type: string }
        recomputedHash: { type: string }
        matches:
          type: boolean
          description: False on a FROZEN period means a reported figure moved after it was sealed.
        balanced: { type: boolean }
        recomputedAt: { type: string, format: date-time }

    CurrentAccountingDayResponse:
      type: object
      description: The current accounting day per the business-date authority (ADR-0207 D1).
      required: [businessDate, opened]
      properties:
        businessDate:
          type: string
          format: date
        status:
          type: string
          nullable: true
          enum: [OPEN, CUTOFF, TIED_OUT, LOCKED]
          description: Null when the day has not been opened.
        opened:
          type: boolean

    AccountingDayResponse:
      type: object
      description: One accounting day's owned, persisted state (ADR-0207 D2).
      required: [id, businessDate, status, acceptsPostings, openedAt, openedBy, version]
      properties:
        id:
          type: string
          format: uuid
        businessDate:
          type: string
          format: date
        status:
          type: string
          enum: [OPEN, CUTOFF, TIED_OUT, LOCKED]
        acceptsPostings:
          type: boolean
          description: True only for OPEN — the day lock's input.
        openedAt:
          type: string
          format: date-time
        openedBy:
          type: string
        cutoffAt:
          type: string
          format: date-time
          nullable: true
        tiedOutAt:
          type: string
          format: date-time
          nullable: true
        lockedAt:
          type: string
          format: date-time
          nullable: true
        lastTransitionBy:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
          description: Optimistic-concurrency counter; a transition is conditional on it.

    ControlAccountTieOutResponse:
      type: object
      description: Sub-ledger tie-out result for one deposit-control account and one currency.
      properties:
        controlAccountId:
          type: string
          format: uuid
        currency:
          type: string
        asOf:
          type: string
          format: date
        glNet:
          type: number
          description: GL aggregate net (credit minus debit) for the control account.
        subLedgerNet:
          type: number
          description: Sum of per-customer sub-ledger nets for the control account.
        delta:
          type: number
          description: glNet minus subLedgerNet. Zero means tied-out; non-zero is a break.
        tiedOut:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SubLedgerBalanceLineResponse'

    SubLedgerBalanceLineResponse:
      type: object
      properties:
        subAccountId:
          type: string
          format: uuid
        currency:
          type: string
        totalDebit:
          type: number
        totalCredit:
          type: number
        net:
          type: number

    JournalLineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        glAccountId:
          type: string
          format: uuid
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          description: Amount in the line's transaction currency.
        currencyCode:
          type: string
        baseAmount:
          type: number
          description: Amount in the settlement (base) currency; balance is asserted per base currency (ADR-0025).
        baseCurrencyCode:
          type: string
        sequence:
          type: integer
          description: Stable 1-based ordering of the line within its journal entry.
        subAccountId:
          type: string
          format: uuid
          nullable: true
          description: Sub-ledger dimension; present only on deposit-control legs (ADR-0039 Phase B).

    SubLedgerBalanceResponse:
      type: object
      properties:
        subAccountId:
          type: string
          format: uuid
        currency:
          type: string
        totalDebit:
          type: number
        totalCredit:
          type: number
        net:
          type: number
          description: Customer-owed booked amount (credit − debit; liability is credit-normal).

    SubLedgerBalancesResponse:
      type: object
      properties:
        asOf:
          type: string
          format: date
        balances:
          type: array
          items:
            $ref: '#/components/schemas/SubLedgerBalanceResponse'

    JournalEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entryNumber:
          type: integer
          format: int64
          nullable: true
          description: Monotonic ledger sequence number, assigned on posting.
        transactionId:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
        description:
          type: string
        status:
          type: string
          enum: [PENDING, POSTED, REVERSED]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLineResponse'
        createdAt:
          type: string
          format: date-time

    JournalPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntryResponse'
        pagination:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean

    ReverseJournalRequest:
      type: object
      required: [reason, reversedBy]
      properties:
        reason:
          type: string
          description: Business reason for the reversal; carried on the JournalReversed event.
        reversedBy:
          type: string
          format: uuid
          description: Operator posting the reversal.

    ReplayBookedChangesRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
          description: Inclusive start of the entry-date window to replay.
        to:
          type: string
          format: date
          description: Inclusive end of the entry-date window to replay.
        dryRun:
          type: boolean
          default: true
          description: >
            When true (default) only previews the counts and net delta per currency without
            emitting any event. Set false to actually re-enqueue the booked-change events.

    ReplayBookedChangesResponse:
      type: object
      required: [dryRun, from, to, journalEntriesScanned, bookedChangeEvents, accountsTouched, netDeltaByCurrency]
      properties:
        dryRun:
          type: boolean
          description: Whether this run only previewed (true) or actually emitted (false) the events.
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        journalEntriesScanned:
          type: integer
          description: POSTED journal entries scanned in the window.
        bookedChangeEvents:
          type: integer
          description: AccountBookedChanged events that were (or, in a dry run, would be) re-emitted.
        accountsTouched:
          type: integer
          description: Distinct customer accounts touched by the replay.
        netDeltaByCurrency:
          type: object
          additionalProperties:
            type: number
          description: Net booked delta per currency across the window — a sanity preview of what the replay carries.

    PostJournalLineRequest:
      type: object
      required: [glAccountId, side, amount, currencyCode, baseAmount, baseCurrencyCode]
      properties:
        glAccountId:
          type: string
          format: uuid
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          description: Amount in the line's transaction currency.
        currencyCode:
          type: string
        fxRate:
          type: number
          nullable: true
          description: Transaction-to-base conversion rate; omitted for same-currency lines.
        baseAmount:
          type: number
          description: Amount in the settlement (base) currency; debits must equal credits per base currency (ADR-0025).
        baseCurrencyCode:
          type: string
        subAccountId:
          type: string
          format: uuid
          nullable: true
          description: Sub-ledger dimension; set only on deposit-control legs (ADR-0039 Phase B).

    PostJournalRequest:
      type: object
      required: [idempotencyKey, transactionId, entryDate, valueDate, createdBy, lines]
      properties:
        idempotencyKey:
          type: string
          description: Caller-supplied idempotency key; replaying the same key returns the original entry.
        transactionId:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
        description:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid
          description: Operator posting the journal.
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/PostJournalLineRequest'

    TrialBalanceLineResponse:
      type: object
      properties:
        glAccountId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
        currency:
          type: string
        totalDebit:
          type: number
        totalCredit:
          type: number
        net:
          type: number
          description: totalDebit − totalCredit.

    TrialBalanceResponse:
      type: object
      description: Point-in-time GL trial balance (all POSTED activity up to `asOf`).
      properties:
        asOf:
          type: string
          format: date
        totalDebit:
          type: number
        totalCredit:
          type: number
        balanced:
          type: boolean
          description: Double-entry invariant over the whole GL — sum(debits) == sum(credits).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceLineResponse'

    TrialBalanceSectionResponse:
      type: object
      properties:
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
        totalDebit:
          type: number
        totalCredit:
          type: number
        net:
          type: number
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceLineResponse'

    FiscalYearTrialBalanceResponse:
      type: object
      properties:
        fiscalYear:
          type: integer
        totalDebit:
          type: number
        totalCredit:
          type: number
        balanced:
          type: boolean
          description: Double-entry invariant over the whole GL — sum(debits) == sum(credits).
        accountCount:
          type: integer
          description: Distinct GL accounts with activity in the fiscal year.
        contentHash:
          type: string
          description: SHA-256 (lowercase hex) of the canonical trial-balance JSON — the attestation anchor.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceSectionResponse'

    YearCloseRecordResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fiscalYear:
          type: integer
        status:
          type: string
          enum: [DRAFT, ATTESTED]
        computedAt:
          type: string
          format: date-time
        totalDebits:
          type: number
        totalCredits:
          type: number
        accountCount:
          type: integer
        contentHash:
          type: string
        draftedBy:
          type: string
          nullable: true
          description: >
            OIDC subject of the maker — who created or last refreshed the DRAFT (from the verified
            JWT). Four-eyes (#869): the attestor must differ from this author; a null value (a
            draft predating four-eyes tracking) cannot be attested and yields a 409.
        attestedBy:
          type: string
          nullable: true
          description: OIDC subject of the attesting principal (from the verified JWT).
        attestedAt:
          type: string
          format: date-time
          nullable: true

    YearCloseVerificationResponse:
      type: object
      description: Read-only re-verification of a year-close record against a fresh trial balance.
      properties:
        fiscalYear:
          type: integer
        status:
          type: string
          enum: [DRAFT, ATTESTED]
        recordedHash:
          type: string
          description: The content hash anchored on the year-close record.
        recomputedHash:
          type: string
          description: The content hash of a freshly computed trial balance for the same year.
        matches:
          type: boolean
          description: True if recordedHash == recomputedHash (the period is unchanged).
        balanced:
          type: boolean
          description: True if the freshly computed trial balance still balances (debits == credits).
        recomputedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the gated
        action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide, so the
        queue is readable by anyone who may decide, including the maker (seeing a request is not
        authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: ledger.reverse
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
