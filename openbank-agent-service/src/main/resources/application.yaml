quarkus:
  application:
    name: openbank-agent-service

  http:
    port: 8109
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,X-Session-Id

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  oidc:
    # LOCAL DEFAULT ONLY. Every deployed environment overrides this with
    # QUARKUS_OIDC_AUTH_SERVER_URL (an env var outranks application.yaml in SmallRye Config),
    # and a deployment that forgets to is not obviously broken: anonymous requests still answer
    # 200/401 normally and only requests carrying a bearer fail — with 500, because token
    # validation cannot reach an issuer at localhost inside the pod. security-scanner and
    # analytics-sink shipped exactly that (#3433). Note also that QUARKUS_OIDC_ENABLED cannot
    # switch OIDC off from the environment: quarkus.oidc.enabled is a BUILD-TIME property, so
    # setting it in a manifest reads as "auth is off here" while the pod keeps validating.
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      # `none` is correct for the in-cluster plain-http Keycloak leg; a real https deploy
      # overrides it to `required` via OIDC_TLS_VERIFICATION to enforce certificate validation.
      verification: ${OIDC_TLS_VERIFICATION:none}

  # Outbound service-to-service auth (client-credentials). The MCP tool REST clients
  # (ServiceClients, @RegisterProvider OidcClientRequestReactiveFilter) use this default
  # oidc-client to mint an `openbank-services` token and attach it as a Bearer, so the
  # assistant reaches the downstream banking services as a least-privilege service principal.
  # Reuses the same client-id/secret/issuer as the resource-server oidc block above.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: ${OIDC_TLS_VERIFICATION:none}

  smallrye-openapi:
    path: /q/openapi
    info-title: OpenBank Agent Service

    info-version: 1.8.0
    info-description: MCP server exposing OpenBank tools to AI agents

  shutdown:
    timeout: 30S

  log:
    level: INFO
    console:
      format: "%d{HH:mm:ss} %-5p traceId=%X{traceId} corrId=%X{correlationId} [%c{2.}] %s%e%n"

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

  rest-client:
    account-service:
      url: http://localhost:8100
    opa:
      url: http://localhost:8181
    transaction-service:
      url: http://localhost:8102
    balance-service:
      url: http://localhost:8103
    consent-service:
      url: http://localhost:8106
    psd2-service:
      url: http://localhost:8107
    product-catalog:
      url: http://localhost:8104
    ledger-service:
      url: http://localhost:8101
    aml-service:
      url: http://localhost:8117
    sanctions-service:
      url: http://localhost:8118
    fx-service:
      url: http://localhost:8119
    clearing-service:
      url: http://localhost:8124
    interest-service:
      url: http://localhost:8125
    dispute-service:
      url: http://localhost:8135
    sepa-instant-service:
      url: http://localhost:8127
    # Observability stack (anonymous in-cluster read; no OIDC filter on these clients).
    prometheus:
      url: http://localhost:9090
    loki:
      url: http://localhost:3100
    alertmanager:
      url: http://localhost:9093

  # Proposals store (ADR-0031 D4 HITL approval queue). The agent is otherwise stateless;
  # this is its only table. In-cluster the URL/credentials come from the agent-db CNPG
  # secret via QUARKUS_DATASOURCE_* env. Imperative JDBC + Flyway so the synchronous MCP
  # tool path can write directly (the read tools stay reactive).
  datasource:
    db-kind: postgresql
    username: ${QUARKUS_DATASOURCE_USERNAME:openbank}
    password: ${QUARKUS_DATASOURCE_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/openbank_agent}
  flyway:
    migrate-at-start: true
    connect-retries: 10

  # Cross-replica PoP nonce replay guard (issue #4728) — only consulted by RedisNonceStore,
  # which is only bound when agent.identity.svid.nonce-store=redis (a build-time flag CI sets).
  # An in-cluster deploy overrides this with QUARKUS_REDIS_HOSTS, same pattern as every other
  # Redis-consuming service (redis.<namespace>.svc — a per-namespace Deployment, not shared).
  redis:
    hosts: redis://localhost:6379

"%dev":
  quarkus:
    oidc:
      enabled: false
    log:
      level: DEBUG

# No inbound auth when bootstrapped under @QuarkusTest — the unit/contract tests don't drive
# the HTTP security layer, and a missing Keycloak would otherwise fail the resource-server init.
"%test":
  quarkus:
    oidc:
      enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 50
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

mcp:
  server:
    name: openbank-mcp
    version: 0.1.0
    protocol-version: "2024-11-05"

# Model gateway (ADR-0031 D6). Provider-agnostic: adding a model is a `models` entry, adding a
# new backend kind is one ModelProvider adapter. The sandbox ships only the offline `mock`
# provider; real backends (a hosted public API, a self-hosted vLLM endpoint) are added here with
# no code change. Sensitive (PII / money-path) context routes to a `self-hosted` model when one
# is registered.
model-gateway:
  # Offline `mock-echo` stays the default so the build/tests need no network or API key. Point a
  # demo at a real backend by setting AGENT_DEFAULT_MODEL (or pick it in the admin-UI model picker).
  default-model: ${AGENT_DEFAULT_MODEL:mock-echo}
  models:
    - id: mock-echo
      provider: mock
      sensitivity: hosted
    # `id` is sent verbatim as the upstream model name, and is the CALLER-FACING id: it is a
    # `model_name` in litellm-config, never a provider's own id. Served by the single
    # `openai-compat` adapter; needs an API key (see agent.model.openai).
    #
    # ADR-0174/0175 (#1919): the LiteLLM gateway is the single pod allowed to leave the cluster to
    # a US LLM provider, so the provider key never lands in this pod. The endpoint therefore
    # DEFAULTS to the in-cluster gateway — the same value the deployment sets in
    # AGENT_MODEL_ENDPOINT — which is also the fleet convention (`LLM_GATEWAY_URL` in
    # finops-agent, docs-truth-agent, governance-auditor, release-steward, flaky-test-hunter and
    # authz-policy-auditor). Local dev reaches it with `kubectl port-forward -n ai-platform
    # svc/litellm 4000:4000`, or overrides AGENT_MODEL_ENDPOINT; nothing here is needed for the
    # build or the tests, which run on `mock-echo`.
    #
    # It used to default direct-to-Groq. That was wrong in two ways once #6041 landed: Groq
    # DECOMMISSIONED `llama-3.3-70b-versatile` (404 `model_not_found`, issue #5736), and the two
    # ids below have never been Groq ids at all — the gateway resolves all three to DeepInfra.
    # A provider base-URL hard-coded next to a caller-facing id is the bug: it asserts a mapping
    # this file cannot see. There are now ZERO `model: groq/` routes in litellm-config.
    - id: llama-3.3-70b-versatile
      provider: openai-compat
      endpoint: ${AGENT_MODEL_ENDPOINT:http://litellm.ai-platform.svc:4000/v1}
      sensitivity: hosted
    # Alternatives to the entry above, served through the SAME gateway endpoint and the same
    # virtual key — a model entry here plus a route in litellm-config, no code change.
    #
    # WHY THESE TWO AND NOT WHATEVER IS TOP OF A LEADERBOARD: they were measured against a real
    # Czech admin prompt through the gateway before being registered — gpt-oss-120b in 1-3s,
    # DeepSeek-V4-Pro in 2.6-9.6s, both cleanly. Kimi-K3 was rejected on latency (44.7s) and
    # Llama-4-Maverick answered HTTP 429 "Model busy"; GLM-5.2 is perfectly usable at 6.9s and is
    # simply not needed as a third option. A config review cannot see any of that.
    #
    # BOTH REGISTERED MODELS ARE REASONING MODELS, which constrains one number here: the token
    # budget is spent on reasoning BEFORE any answer text, so a low max_tokens returns an EMPTY
    # content field rather than a short answer. Measured on gpt-oss-120b: 40 -> empty
    # (finish_reason=length), 128 -> truncated mid-sentence, 512 -> finishes in 189 tokens. The
    # loop's MAX_OUTPUT_TOKENS is 512, so this works; lowering it to save tokens would silently
    # turn replies into blanks, which the UI renders as "(no reply)".
    #
    # Both stay `sensitivity: hosted`: they are off-cluster US providers, so the ADR-0031 D6
    # sensitive-context routing must not choose them. That tier still needs a self-hosted model,
    # which is the `vLLM` line ADR-0265 left as planned.
    - id: openai/gpt-oss-120b
      provider: openai-compat
      endpoint: ${AGENT_MODEL_ENDPOINT:http://litellm.ai-platform.svc:4000/v1}
      sensitivity: hosted
    - id: deepseek-ai/DeepSeek-V4-Pro
      provider: openai-compat
      endpoint: ${AGENT_MODEL_ENDPOINT:http://litellm.ai-platform.svc:4000/v1}
      sensitivity: hosted
    # The SAME openai-compat adapter serves any OpenAI-shaped backend — just change endpoint+key:
    # - id: qwen2.5                       # self-hosted Ollama for the SELF_HOSTED (sensitive) tier
    #   provider: openai-compat
    #   endpoint: http://ollama:11434/v1
    #   sensitivity: self-hosted

# Agent policy gate (ADR-0031 D2/D9). The PDP is now the live OPA sidecar (ADR-0018):
# agent.policy.enforcement controls D9 (ADR-0031): `advisory` audits every decision but never
# blocks (safe to flip to `block` once an OPA sidecar is present in every deploy target).
# With `block`, AgentPolicyGate blocks DENY calls UNLESS the PDP itself is unavailable, in which
# case it degrades to advisory + logs a warn (so a dead OPA sidecar does not lock the assistant).
# Set AGENT_POLICY_ENFORCEMENT=block in the k8s deployment env to enable enforcement in the sandbox.
agent:
  # API key for the openai-compat model backend. Empty in the committed config; supplied at runtime
  # from OpenBao via ESO — never in git. In a deployed environment (ADR-0174/0175, #1919) this is the
  # LiteLLM *virtual* key (AGENT_MODEL_API_KEY), not a provider key: the provider credential lives
  # only in the ai-platform gateway pod. GROQ_API_KEY stays as the fallback so a local dev shell — and
  # a deployed pod still running a pre-#1919 image — keeps working unchanged (nested-default
  # expansion: AGENT_MODEL_API_KEY wins when set, GROQ_API_KEY otherwise, empty if neither).
  model:
    openai:
      api-key: ${AGENT_MODEL_API_KEY:${GROQ_API_KEY:}}
  policy:
    enforcement: ${AGENT_POLICY_ENFORCEMENT:advisory}
    opa:
      enabled: true
  # D3 (ADR-0031): verifiable agent identity. The /mcp surface authenticates the operator (Keycloak
  # bearer, @RolesAllowed); this binds WHICH agent identity that operator may assert via X-Agent-Id
  # to their verified roles — deny-by-default — so a lower-privileged operator cannot forge a
  # higher-privileged charter. Enforced only when authenticated (OIDC off in %dev/%test → anonymous
  # → legacy header trust, tests unaffected). Interim hardening; the short-TTL SPIFFE/SVID per run
  # (D3b) replaces the header entirely.
  identity:
    binding-enforced: ${AGENT_IDENTITY_BINDING_ENFORCED:true}
    # role -> assertable agent ids (comma list; '*' = any). Deny-by-default for unlisted roles.
    role-bindings: ${AGENT_IDENTITY_ROLE_BINDINGS:ROLE_ADMIN=*;ROLE_OPERATOR=ui-assistant;ROLE_COMPLIANCE=compliance-officer,ui-assistant}
    # D3b (ADR-0031): verify a PoP-signed pki-agent cert (#2405) as the per-run agent identity
    # (CN = agent id) — strongest evidence, checked before the header binding. DISABLED until the CA
    # is supplied (ca-cert empty → fall back to the binding). `enforced: true` rejects a missing/
    # invalid SVID instead of falling back — flip it once PR5b-2 has the BFF presenting certs.
    svid:
      ca-cert: ${AGENT_IDENTITY_SVID_CA_CERT:}
      enforced: ${AGENT_IDENTITY_SVID_ENFORCED:false}
      max-skew-seconds: ${AGENT_IDENTITY_SVID_MAX_SKEW_SECONDS:60}
      # BUILD-TIME (Quarkus @IfBuildProperty — resolved at augmentation, a runtime env var
      # cannot reach it, same trap the analytics-sink ANALYTICS_SINK_TYPE comment documents).
      # Empty/default -> the offline-buildable InMemoryNonceStore (correct only at replicas: 1).
      # `redis` -> the cross-replica RedisNonceStore (issue #4728); set via AGENT_SVID_NONCE_STORE
      # in the CI build step (auto-deploy.yml), never here, so local/dev builds stay infra-free.
      nonce-store: ${AGENT_SVID_NONCE_STORE:}
  # D2 (ADR-0031): per-agent charter limits enforced by CharterRateLimiter. Mirrors the canonical
  # values in openbank-libs/governance/agents.yaml; code reads from config so no YAML parsing at
  # runtime. Adding an agent = one entry here + the charter entry in agents.yaml.
  # Prompt-injection guardrail (ADR-0031 D6, pentest FIND-S4-05 follow-up). `block` stops a
  # run whose user input matches a known injection phrasing; `advisory` only audits. Tool
  # results are always wrapped in untrusted-data markers regardless of mode.
  guardrail:
    mode: ${AGENT_GUARDRAIL_MODE:block}
  # Kill switch (ADR-0031 D7). Config baseline: global-enabled false halts every agent; per-agent
  # `enabled` (charter entry below, default true) halts one. The runtime override is the
  # agent_kill_switch table flipped via /api/v1/admin/agents (KillSwitchService), which wins.
  kill-switch:
    global-enabled: ${AGENT_KILL_SWITCH_GLOBAL_ENABLED:true}
  # Scheduled compliance-officer oversight sweeps (ADR-0031 D9 phase 2). Off by default —
  # the sandbox enables it with AGENT_OVERSIGHT_ENABLED=true. Every 30 minutes matches the
  # charter's runs_per_day: 48 (agents.yaml); the charter rate limiter enforces it on top.
  oversight:
    enabled: ${AGENT_OVERSIGHT_ENABLED:false}
    cron: ${AGENT_OVERSIGHT_CRON:0 0/30 * * * ?}
  charter:
    charters:
      - agent-id: ui-assistant
        model: llama-3.3-70b-versatile
        tokens-per-run: 100000
        runs-per-day: 500
        # ADR-0080 P0: mirrors tools.allow for ui-assistant in agents.yaml. The gate denies any
        # capability outside this set in-process (fail-safe, independent of the OPA sidecar), and
        # only these tools are offered to the model / listed over MCP. AML/sanctions/payments reads
        # were removed after the pentest drove aml_list_cases via prompt injection (FIND-S4-05).
        allowed-capabilities:
          - query.ledger.readonly
          - query.gl.readonly
          - query.catalog.readonly
          - draft.ticket
      # Runtime projection of the compliance-officer charter in agents.yaml (limits + tools.allow),
      # deliberately NARROWER: flags.write is omitted for the unattended sweep — every finding goes
      # through draft.ticket into the HITL queue instead. The charter is the upper bound, the
      # runtime grant must be a subset (least privilege; the model is never offered the schema).
      # Unlike the blanket admin bot this agent IS allowed the compliance/payments/disputes reads.
      - agent-id: compliance-officer
        model: llama-3.3-70b-versatile
        tokens-per-run: 200000
        runs-per-day: 48
        allowed-capabilities:
          - query.ledger.readonly
          - query.gl.readonly
          - query.catalog.readonly
          - read.logs
          - read.governance
          - draft.ticket
          - query.compliance.readonly
          - query.payments.readonly
          - query.disputes.readonly
          - query.observability.readonly
  # Model-based content safety (Llama Guard via the LiteLLM gateway, ADR-0031 guardrails /
  # ADR-0265). Complements the deterministic filter above; neither replaces the other. Off by
  # default, and when off every classification reports `unavailable` rather than `safe`, so the
  # state is visible in openbank_guardrail_classifications{decision="unavailable"} instead of
  # looking like a clean bill of health.
  content-safety:
    enabled: ${AGENT_CONTENT_SAFETY_ENABLED:false}
    # The in-cluster gateway; the provider key never reaches this pod (ADR-0175).
    endpoint: ${AGENT_CONTENT_SAFETY_ENDPOINT:}
    model: ${AGENT_CONTENT_SAFETY_MODEL:meta-llama/llama-guard-4-12b}
    api-key: ${AGENT_CONTENT_SAFETY_API_KEY:}
    # What an UNAVAILABLE verdict means on the operator plane. false: refusing an operator's
    # read-only question because a classifier is down is worse than answering it, and the charter
    # allow-list, the OPA gate and the HITL queue still bound what any answer can cause.
    fail-closed: ${AGENT_CONTENT_SAFETY_FAIL_CLOSED:false}

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      oversight-events:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.agent.oversight-events
        connector: smallrye-kafka
        topic: ${AGENT_OVERSIGHT_KAFKA_TOPIC:openbank.oversight-triggers}
        enabled: ${AGENT_OVERSIGHT_KAFKA_ENABLED:false}
        # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
        # openbank-infra/gitops/components/agent/agent-service-msg-override.yaml (mounted via
        # QUARKUS_CONFIG_LOCATIONS) for where they're set instead. Summary: SmallRye Config's
        # YAML source unconditionally quotes any leaf map key containing a literal dot
        # (`group.id` becomes the registered property name `"group.id"`, quotes included — true
        # whether or not the YAML key itself is quoted), so KafkaConnectorIncomingConfiguration's
        # plain config.getOptionalValue("group.id", ...) never finds it. group.id then silently
        # falls back to Quarkus's default (quarkus.application.name = openbank-agent-service),
        # which the agent-service KafkaUser ACL never granted — every poll would hit
        # GroupAuthorizationException. auto.offset.reset silently falls back to Kafka's client
        # default (latest) instead of the intended latest-is-fine-here value, but the same bug
        # class applies regardless (issue #686).
        #
        # A properties-file override (not MP_MESSAGING_INCOMING_*_GROUP_ID env vars) is used,
        # matching the pattern already established for transaction-service's
        # payment-scheme-accepted channel. A properties file carries the exact hyphenated
        # property key unambiguously, avoiding any reliance on MicroProfile Config's env-var-name
        # reverse-mapping for channel discovery.
        #
        # Correction (round 2): an earlier version of this comment first cited nonexistent issues
        # #2649/#2659, then over-corrected to claim env vars are "independently verified to work"
        # here — that overstated it too. The genuine concern is real: quarkusio/quarkus#30106 and
        # smallrye/smallrye-reactive-messaging#2028 document a live, unresolved upstream bug where
        # an env-var override of a single leaf property (e.g. `retries`, here `group.id`/
        # `auto.offset.reset`) on a HYPHENATED channel name crashes Quarkus at startup
        # (`SRMSG00071`, "connector attribute must be set for channel <wrong split>") — regardless
        # of whether the channel is already registered via YAML/annotations. Boot tests added
        # during this sweep inject the override via a QuarkusTestResourceLifecycleManager config
        # map, not a real OS env var, so they don't exercise this failure mode. This properties-file
        # mechanism is the CORRECT choice for a hyphenated channel like `oversight-events`, not
        # merely a stylistic alternative.
    outgoing:
      agent-audit-events-out:
        connector: smallrye-kafka
        topic: ${AGENT_AUDIT_KAFKA_TOPIC:openbank.agent.audit.events}
        enabled: ${AGENT_AUDIT_KAFKA_ENABLED:false}
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
