openapi: 3.1.0
info:
  title: Dispute Service API
  version: 1.4.0
  description: >-
    Payment dispute management — open, evidence, escalate, withdraw, resolve, timeline — plus
    regulatory complaints handling with a statutory deadline clock (ADR-0085). Evidence is a
    tamper-evident hash chain and resolution emits a remediation event (ADR-0117 hardening).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8135
    description: Local development
tags:
  - name: Disputes
  - name: Complaints

paths:
  /api/v1/disputes:
    post:
      tags: [Disputes]
      summary: Open a new dispute
      operationId: openDispute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDisputeRequest'
      responses:
        '201':
          description: Dispute opened
    get:
      tags: [Disputes]
      summary: List disputes by status
      operationId: listDisputes
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of disputes

  /api/v1/disputes/{id}:
    get:
      tags: [Disputes]
      summary: Get dispute by ID
      operationId: getDispute
      parameters:
        - $ref: '#/components/parameters/disputeId'
      responses:
        '200':
          description: Dispute detail
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Disputes]
      summary: Update dispute status/resolution
      operationId: updateDispute
      parameters:
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDisputeRequest'
      responses:
        '200':
          description: Updated

  /api/v1/disputes/reference/{ref}:
    get:
      tags: [Disputes]
      summary: Get dispute by reference
      operationId: getDisputeByRef
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dispute

  /api/v1/disputes/account/{accountId}:
    get:
      tags: [Disputes]
      summary: List disputes for an account
      operationId: listDisputesByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Disputes

  /api/v1/disputes/{id}/evidence:
    post:
      tags: [Disputes]
      summary: Add evidence to a dispute
      operationId: addEvidence
      parameters:
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeEvidence'
      responses:
        '201':
          description: Evidence added
    get:
      tags: [Disputes]
      summary: Get dispute evidence
      operationId: getEvidence
      parameters:
        - $ref: '#/components/parameters/disputeId'
      responses:
        '200':
          description: Evidence list

  /api/v1/disputes/{id}/withdraw:
    post:
      tags: [Disputes]
      summary: Withdraw a dispute
      operationId: withdrawDispute
      parameters:
        - $ref: '#/components/parameters/disputeId'
        - name: actor
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Withdrawn

  /api/v1/disputes/{id}/escalate:
    post:
      tags: [Disputes]
      summary: Escalate a dispute
      operationId: escalateDispute
      parameters:
        - $ref: '#/components/parameters/disputeId'
        - name: actor
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Escalated

  /api/v1/disputes/{id}/resolve:
    post:
      tags: [Disputes]
      summary: Record a dispute's remediation outcome
      description: >-
        Evidence-backed resolution (UPHELD/REJECTED/PARTIAL, ADR-0117 hardening). An UPHELD or
        PARTIAL outcome emits a `dispute.remediation_requested` event for a future downstream
        consumer (e.g. a billing/ledger reversal flow) — this service does not itself post to
        the ledger. Only reachable from an evidence-gathering status (OPEN, UNDER_REVIEW,
        PENDING_CUSTOMER, PENDING_MERCHANT).
      operationId: resolveDispute
      parameters:
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeRequest'
      responses:
        '200':
          description: Resolved dispute
        '409':
          description: Dispute is not in an evidence-gathering status
        '422':
          description: Invalid request (e.g. PARTIAL outcome without a valid remediationAmount)

  /api/v1/disputes/{id}/timeline:
    get:
      tags: [Disputes]
      summary: Get dispute timeline
      operationId: getDisputeTimeline
      parameters:
        - $ref: '#/components/parameters/disputeId'
      responses:
        '200':
          description: Timeline events

  /api/v1/disputes/{id}/evidence/verify:
    get:
      tags: [Disputes]
      summary: Walk and verify a dispute's evidence hash chain
      description: >-
        Recomputes each evidence item's record_hash from (prevHash + content) and reports the
        first broken link, if any (ADR-0117 §2 / ADR-0133 pattern applied per-dispute).
      operationId: verifyEvidenceChain
      parameters:
        - $ref: '#/components/parameters/disputeId'
      responses:
        '200':
          description: Chain verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChainVerification'

  /api/v1/complaints:
    post:
      tags: [Complaints]
      summary: File a new complaint
      operationId: fileComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileComplaintRequest'
      responses:
        '201':
          description: Complaint filed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
    get:
      tags: [Complaints]
      summary: List complaints, optionally filtered by status
      operationId: listComplaints
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RECEIVED, RESOLVED, CLOSED]
      responses:
        '200':
          description: List of complaints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Complaint'

  /api/v1/complaints/{id}:
    get:
      tags: [Complaints]
      summary: Get complaint by ID
      operationId: getComplaint
      parameters:
        - $ref: '#/components/parameters/disputeId'
      responses:
        '200':
          description: Complaint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/complaints/{id}/interim-reply:
    post:
      tags: [Complaints]
      summary: Record an interim reply (extends the statutory deadline to 35 business days)
      operationId: complaintInterimReply
      parameters:
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterimReplyRequest'
      responses:
        '200':
          description: Updated complaint with extended due date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/complaints/{id}/resolve:
    post:
      tags: [Complaints]
      summary: Resolve a complaint (records an outcome + optional redress flag)
      operationId: resolveComplaint
      parameters:
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveComplaintRequest'
      responses:
        '200':
          description: Resolved complaint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/complaints/{id}/close:
    post:
      tags: [Complaints]
      summary: Close a complaint (records outcome + root-cause code + optional redress flag)
      operationId: closeComplaint
      parameters:
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseComplaintRequest'
      responses:
        '200':
          description: Closed complaint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    disputeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    OpenDisputeRequest:
      type: object
      required: [accountId, transactionId]
      properties:
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        disputeType:
          type: string
          enum: [UNAUTHORIZED, DUPLICATE, GOODS_NOT_RECEIVED, NOT_AS_DESCRIBED, CREDIT_NOT_PROCESSED, TECHNICAL_ERROR, OTHER]
        amount:
          type: number
        currency:
          type: string
        description:
          type: string

        merchantName:
          type: string
          nullable: true
        merchantId:
          type: string
          nullable: true
        transactionDate:
          type: string
          format: date
    UpdateDisputeRequest:
      type: object
      properties:
        status:
          type: string
        resolution:
          type: string
        chargebackAmount:
          type: number
          nullable: true
        resolvedBy:
          type: string
          nullable: true
    DisputeEvidence:
      type: object
      description: >-
        An append-only, tamper-evident evidence item (ADR-0117 §2/§4). sequence/prevHash/recordHash
        are stamped by the service on submission and form a per-dispute SHA-256 hash chain (the
        ADR-0133 pattern applied per-dispute rather than globally); clients only need to supply
        submittedBy/evidenceType/description/fileReference.
      required: [submittedBy, evidenceType]
      properties:
        id:
          type: string
          format: uuid
        disputeId:
          type: string
          format: uuid
        submittedBy:
          type: string
        evidenceType:
          type: string
          description: Free-text category, e.g. DOCUMENT, SCREENSHOT, STATEMENT, TRANSACTION_REF, PSD2_MESSAGE_ID.
        description:
          type: string
          nullable: true
        fileReference:
          type: string
          nullable: true
          description: Opaque reference to supporting material (e.g. an object-storage key or URL). No blob storage is implemented by this service.
        submittedAt:
          type: string
          format: date-time
          readOnly: true
        sequence:
          type: integer
          format: int64
          readOnly: true
          description: 0-based position in this dispute's evidence chain.
        prevHash:
          type: string
          readOnly: true
          nullable: true
        recordHash:
          type: string
          readOnly: true
          nullable: true

    ResolveDisputeRequest:
      type: object
      required: [outcome, resolvedBy]
      properties:
        outcome:
          type: string
          enum: [UPHELD, REJECTED, PARTIAL]
        remediationAmount:
          type: number
          nullable: true
          description: Required and must be in (0, claimAmount) when outcome is PARTIAL.
        resolvedBy:
          type: string
        notes:
          type: string
          nullable: true

    EvidenceChainVerification:
      type: object
      properties:
        disputeId:
          type: string
          format: uuid
        intact:
          type: boolean
        itemsChecked:
          type: integer
        firstBrokenEvidenceId:
          type: string
          format: uuid
          nullable: true

    FileComplaintRequest:
      type: object
      required: [category, channel, description]
      properties:
        category:
          type: string
          enum: [PAYMENT_SERVICE, FEES, ACCOUNT_SERVICE, LENDING, CONDUCT, DATA_PROTECTION, OTHER]
        channel:
          type: string
          enum: [APP, BRANCH, EMAIL, ARBITER]
        description:
          type: string
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        disputeId:
          type: string
          format: uuid
          nullable: true

    InterimReplyRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ResolveComplaintRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
        redressGranted:
          type: boolean
          nullable: true

    CloseComplaintRequest:
      type: object
      required: [outcome, rootCauseCode]
      properties:
        outcome:
          type: string
        rootCauseCode:
          type: string
        redressGranted:
          type: boolean
          nullable: true

    Complaint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        category:
          type: string
          enum: [PAYMENT_SERVICE, FEES, ACCOUNT_SERVICE, LENDING, CONDUCT, DATA_PROTECTION, OTHER]
        channel:
          type: string
          enum: [APP, BRANCH, EMAIL, ARBITER]
        description:
          type: string
        status:
          type: string
          enum: [RECEIVED, RESOLVED, CLOSED]
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        disputeId:
          type: string
          format: uuid
          nullable: true
        receivedDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: Statutory deadline (PSD2 15 business days; 35 after an interim reply).
        breached:
          type: boolean
          description: Derived — today is past dueDate and the complaint is not RESOLVED/CLOSED.
        interimReplyReason:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
        redressGranted:
          type: boolean
          nullable: true
        rootCauseCode:
          type: string
          nullable: true

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
