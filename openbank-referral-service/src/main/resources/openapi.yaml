openapi: 3.0.3
info:
  title: OpenBank Referral Service
  version: 1.1.0
paths:
  /api/v1/referrals/programs:
    post:
      summary: Create a draft referral program
      responses: {"201": {description: Created}}
  /api/v1/referrals/programs/{id}/publish:
    post:
      summary: Publish after independent checker approval
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Published}, "409": {description: Conflict}}
  /api/v1/referrals/programs/{id}:
    get:
      summary: Resolve one published referral program revision for a trusted operator
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Published immutable program reference
          content:
            application/json:
              schema:
                type: object
                required: [id, name, version]
                additionalProperties: false
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  version: {type: integer, minimum: 1}
        "404": {description: Program is missing, unpublished, or expired}
  /api/v1/referrals/programs/{id}/invites:
    post:
      summary: Issue an opaque invite token
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      responses: {"201": {description: Issued}}
  /api/v1/referrals/invites/{token}/attribute:
    post:
      summary: Attribute an invite, rejecting self and replay
      parameters: [{name: token, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      responses: {"200": {description: Attributed}, "409": {description: Conflict}}
  /api/v1/referrals/invites/{token}/qualify:
    post:
      summary: Qualify one event and request a fixed reward
      parameters: [{name: token, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      responses: {"202": {description: Reward requested}}
