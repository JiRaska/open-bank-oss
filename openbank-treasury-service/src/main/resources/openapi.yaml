openapi: 3.1.0
info:
  title: OpenBank Treasury Service API
  # 1.0.0: first contract (ADR-0315 MVP, issue #10618) — money-market deals (MM_PLACEMENT,
  #        MM_BORROWING, CNB_DEPOSIT_FACILITY) with four-eyes booking, counterparty limits and
  #        per-currency daily positions.
  # 1.1.0: additive — POST /deals/{id}/override-limit (ROLE_TREASURY_SENIOR_APPROVER) and
  #        Deal.limitOverride: a senior override of a counterparty-limit breach (ADR-0315 D4).
  # 1.5.0: additive — product CNB_LOMBARD (#10896): overnight borrowing from the ČNB marginal
  #        lending (lombard) facility. The RESPONSE ProductType is now x-extensible-enum (the
  #        product set grows); the request keeps a closed enum (DraftProductType), one value wider (ADR-0315 D2).
  # 1.6.0: additive — GET /limits/utilisation (#10896): per-counterparty limit, utilised,
  #        available, utilisation %, breached flag and active senior-override count.
  # 1.7.0: additive — nostro reconciliation (#10896): POST /nostro/statements (camt.053 upload,
  #        ROLE_TREASURY_APPROVER) and GET /nostro/statements/{id}/reconciliation.
  # 1.8.0: additive — FX_SPOT deal terms, settlement and response fields (#10896).
  #        Invalid rates and rounded-to-zero counter amounts return 400.
  # 1.10.0: additive — DraftDealRequest.inputs / Deal.inputs: the JSON object an AI agent's draft was
  #         built from, required with `rationale` when an agent drafts (ADR-0315 D10).
  # 1.11.0: additive — native-currency nostro balance reconciliation; unknown GL remains explicitly
  #         unstated, and an unavailable ledger balance is a 502.
  # 1.12.0: additive — POST /deals/{id}/confirm and DealState CONFIRMED (ADR-0315 D2): the
  #        counterparty's confirmation of a BOOKED deal; settlement requires it unless
  #        openbank.treasury.confirmation.required is false.
  # 1.13.0: additive — GET /quotes (ADR-0315 D9): SYNTHETIC bid/ask of the simulated
  #        counterparties off the risk engine's latest curve set plus a configured spread.
  # 1.14.0: additive — nostro reconciliation breaks and MT940 (ADR-0315 D7): GET
  #         /nostro/{account}/breaks (age in business days, alert threshold) and POST
  #         /nostro/statements/mt940 (SWIFT MT940 mapped onto the camt.053 statement model).
  # 1.15.0: skipped — it was reserved for the daily-position change below, which landed after 1.16.0.
  # 1.16.0: additive — DealEvent.limitSnapshot carries the limit-check figures of a limit note,
  #         so clients render them instead of parsing `note`.
  # 1.17.0: additive — GET /positions answers basis ACTUAL | PROJECTED, the accounting day `today`
  #         (Europe/Prague) it was judged against, the counted deal states, and a per-currency
  #         dealCount. A date after today is a projection of concluded deals, no longer all zeros.
  # 1.18.0: additive — product limits (ADR-0315 D4): per-product allowed currencies, maximum
  #         principal and maximum tenor, declared in configuration. Enforced at submit and
  #         re-checked at approval: 422 PRODUCT_LIMIT_BREACHED with Error.breaches. Not overridable.
  # 1.19.0: additive — portfolio statements of holdings (ADR-0337 amendment): POST
  #         /portfolio/statements (custodian semt.002; a correction supersedes, the prior version is
  #         kept), GET /portfolio/statements?date= (the version trail) and GET
  #         /portfolio/period-end?date= (tax-reporting's PSP 34-12 PS source; 409 when no statement).
  # 1.20.0: additive — ADR-0344 slice 2: effective-dated four-eyes reference data
  #         (/reference/{kind}), deal v2 request/response fields (kind, bookId, legs, calendars,
  #         securities, regulatory terms; eleven more request products), the stored cash-flow
  #         ledger with four-eyes overrides and conflicts, and deal versions. 422
  #         REFERENCE_NOT_EFFECTIVE lists Error.missingReferences. Slice 3 (same unreleased
  #         version): fixings and market data (/fixings, /market-data/*, ADR-0344 D5), the
  #         day-completion record with the ADR-0342 participation it sends, and the
  #         internal-rate-sheet reference kind; own-account payments (/payments, ADR-0344 D6).
  #         Slice 4 (same unreleased version): four-eyes corrections of a booked deal
  #         (/deals/{id}/corrections, ADR-0344 D7) with a preview of the new flows and the delta
  #         journals they post.
  version: 1.20.0
  description: |
    The bank's own money-market deals (ADR-0315). A deal moves
    `DRAFT → PENDING_APPROVAL → BOOKED → CONFIRMED → SETTLED → MATURED`, or to `CANCELLED` (before
    booking) or `REVERSED` (after). A rejection returns a pending deal to `DRAFT` with the reason
    on its timeline. `CONFIRMED` records that the counterparty confirmed the booked terms (a
    back-office person, never the deal's creator or submitter; in the sandbox the simulated
    counterparty set). Settlement requires `CONFIRMED`; a deployment with
    `openbank.treasury.confirmation.required=false` may also settle straight from `BOOKED`.

    **Four-eyes is enforced in the domain**: the approver must be neither the deal's creator nor
    its submitter (422 `FOUR_EYES_VIOLATION`), and only a human may submit, approve, reject,
    cancel, confirm, settle or reverse — an AI agent (`sub` prefixed `agent:`) or a service account is
    refused with 403 `ACTOR_NOT_PERMITTED`. An AI agent may draft, and must then supply a
    `rationale` and the `inputs` it used (ADR-0315 D10); its draft consumes no limit, and only a
    human dealer can submit it.

    **Counterparty limits** cap outstanding PLACED principal per counterparty and currency
    (placements and the ČNB facility; a borrowing consumes no limit). Checked at submission and
    again at approval; a breach blocks booking (422 `LIMIT_BREACHED`). A senior approver may record
    a bounded override with a reason; four-eyes separation still applies at booking.

    **Product limits** (ADR-0315 D4) are the bank's mandate per product, declared in configuration:
    the currencies a product may be dealt in, the largest principal per deal in each, and the
    longest tenor. A product with no declared limit is not permitted. Enforced at submission and
    re-checked at approval (the mandate may have been tightened in between); a breach is 422
    `PRODUCT_LIMIT_BREACHED` with `breaches`. It is not overridable — the senior override covers
    the counterparty limit only.

    **Interest** is ACT/360 simple interest at maturity (the CZK and EUR money-market
    convention); `rate` is an annual percentage. **Overnight** means the next business day of the
    currency's calendar — CERTIS (Czech holidays) for CZK, TARGET2 for EUR (ADR-0344 D1, since
    1.19.0; before it, Monday-Friday only). The ČNB deposit facility is always overnight and CZK only.

    **ČNB lombard** (`CNB_LOMBARD`): overnight borrowing from the ČNB marginal lending facility.
    CZK only, counterparty `CNB`, maturity always the next business day (`maturityDate` ignored),
    `rate` is the ČNB lombard rate entered by the dealer and must be > 0. Same four-eyes lifecycle
    and ACT/360 interest as a money-market borrowing; like any borrowing it consumes no limit.
    Settlement credits the ledger's "Borrowings from CNB" liability (2320). The collateral pledge
    that backs a lombard loan is NOT modelled.

    **FX spot** (`FX_SPOT`): the bank buys or sells a foreign currency against CZK. Name the legs
    with `buyCurrency`/`sellCurrency` (one must be CZK); `principal` is the FOREIGN amount and
    `rate` the dealer's rate in CZK per unit. `valueDate` defaults to T+2 business days (both
    currencies' calendars open, since 1.19.0) and may not be later. Same four-eyes lifecycle; the limit check runs against the
    counterparty's CZK limit on the CZK equivalent, consumed until settlement. Settlement posts
    both legs through the ledger's FX position accounts; an FX spot never accrues or matures
    (`mature` is 409). The rate may be checked against fx-service's mid within a configured
    tolerance — a deviation FLAGS the deal (`fx.rateFlag`), it never blocks it.

    **Ledger postings** go through ledger-service's journal API only, keyed
    `treasury:<dealId>:<event>` and balanced per currency: settlement, maturity (principal plus
    interest) and, for a settled deal, reversal. Nothing posts before `BOOKED`; booking itself
    posts nothing. Each posted journal is listed on the deal as `journals[]`.

    **Idempotency**: every command POST requires an `Idempotency-Key` header (money-path rule).

    **Sandbox**: a SYNTHETIC simulated counterparty set settles booked deals on their value date
    and matures settled deals on their maturity date (ADR-0315 D9). Real market connectivity is
    out of scope.
servers:
  - url: http://localhost:8160
tags:
  - name: Treasury
security:
  - bearerAuth: []

paths:
  /api/v1/treasury/deals:
    get:
      tags: [Treasury]
      operationId: listDeals
      summary: Dealer blotter — deals, newest first, filtered (every filter optional and ANDed)
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DealState'
        - { name: instrument, in: query, required: false, schema: { type: string }, description: A product type }
        - { name: bookId, in: query, required: false, schema: { type: string } }
        - { name: counterpartyId, in: query, required: false, schema: { type: string } }
        - { name: currency, in: query, required: false, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/DealKind' } }
        - { name: hideMatured, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: hideAuthorised, in: query, required: false, schema: { type: boolean, default: false }, description: 'Hide BOOKED and later' }
        - { name: text, in: query, required: false, schema: { type: string, maxLength: 100 }, description: 'Case-insensitive match on deal id, counterparty, counterparty reference or note' }
        - { name: tradeDateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: tradeDateTo, in: query, required: false, schema: { type: string, format: date } }
        - { name: maturityFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: maturityTo, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Deals (without journal references; see GET /deals/{id}). The match count is in X-Total-Count.
          headers:
            X-Total-Count:
              description: Number of deals matching the filters
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deal'
        '401': { description: Unauthenticated }
        '403': { description: Requires ROLE_TREASURY_DEALER, ROLE_TREASURY_APPROVER or ROLE_ADMIN }
    post:
      tags: [Treasury]
      operationId: draftDeal
      summary: Draft a deal (ROLE_TREASURY_DEALER). Nothing posts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftDealRequest'
      responses:
        '201':
          description: The new DRAFT deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400': { description: Invalid deal (dates, currency, product/counterparty mismatch, unknown counterparty) }
        '403': { description: Not a dealer, or a service account }

  /api/v1/treasury/deals/{id}:
    get:
      tags: [Treasury]
      operationId: getDeal
      summary: One deal with its lifecycle timeline and ledger journal references
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: The deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '404': { description: No such deal }
    put:
      tags: [Treasury]
      operationId: editDraftDeal
      summary: New terms for a DRAFT deal; the terms version grows (ADR-0344)
      description: >-
        Only a DRAFT is edited (409 otherwise); a human may edit any draft, an AI agent only its own;
        the product cannot change. The new terms pass every check a new draft passes.
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftDealRequest' }
      responses:
        '200':
          description: The edited draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '400': { description: Invalid terms }
        '403': { description: Not permitted (another agent's draft) }
        '404': { description: No such deal }
        '409': { description: The deal is not a DRAFT }

  /api/v1/treasury/deals/{id}/submit:
    post:
      tags: [Treasury]
      operationId: submitDeal
      summary: Submit a DRAFT for approval (ROLE_TREASURY_DEALER); records the limit check
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such deal }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422':
          description: PRODUCT_LIMIT_BREACHED — the deal is outside its product limit (ADR-0315 D4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/deals/{id}/approve:
    post:
      tags: [Treasury]
      operationId: approveDeal
      summary: Four-eyes approval — books the deal (ROLE_TREASURY_APPROVER)
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such deal }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422':
          description: >-
            FOUR_EYES_VIOLATION (approver created or submitted the deal), LIMIT_BREACHED (counterparty
            limit, not covered by a senior override) or PRODUCT_LIMIT_BREACHED (the deal is outside its
            product limit as declared NOW — re-checked at approval; not overridable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/deals/{id}/reject:
    post:
      tags: [Treasury]
      operationId: rejectDeal
      summary: Reject a PENDING_APPROVAL deal back to DRAFT (ROLE_TREASURY_APPROVER)
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '400': { description: Missing reason }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /api/v1/treasury/deals/{id}/override-limit:
    post:
      tags: [Treasury]
      operationId: overrideDealLimit
      summary: Senior override of a counterparty-limit breach, with a reason (ROLE_TREASURY_SENIOR_APPROVER)
      description: >
        ADR-0315 D4. The deal must be PENDING_APPROVAL and its limit check breached. The overrider is
        never the deal's creator or submitter, and booking still needs a different approver. The
        override covers the exposure measured now; if exposure grows before booking, approval refuses
        again.
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '400': { description: Missing reason }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /api/v1/treasury/deals/{id}/cancel:
    post:
      tags: [Treasury]
      operationId: cancelDeal
      summary: Cancel a DRAFT or PENDING_APPROVAL deal
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /api/v1/treasury/deals/{id}/confirm:
    post:
      tags: [Treasury]
      operationId: confirmDeal
      summary: Record the counterparty's confirmation of a BOOKED deal (CONFIRMED); posts nothing
      description: |
        ADR-0315 D2. ROLE_TREASURY_APPROVER (the back office). The confirmer must be neither the
        deal's creator nor its submitter (422 `FOUR_EYES_VIOLATION`); an AI agent or a service
        account is refused (403). Emits `treasury.deal.confirmed.v1`.
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422':
          description: FOUR_EYES_VIOLATION (the creator or submitter may not confirm the deal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/deals/{id}/settle:
    post:
      tags: [Treasury]
      operationId: settleDeal
      summary: Settle a CONFIRMED deal on or after its value date; posts the settlement journal
      description: |
        A BOOKED deal answers 409 until confirmed, unless the deployment sets
        `openbank.treasury.confirmation.required=false`.
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /api/v1/treasury/deals/{id}/mature:
    post:
      tags: [Treasury]
      operationId: matureDeal
      summary: Mature a SETTLED deal on or after its maturity date; posts principal and interest
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /api/v1/treasury/deals/{id}/reverse:
    post:
      tags: [Treasury]
      operationId: reverseDeal
      summary: Reverse a BOOKED, CONFIRMED or SETTLED deal; a settled one gets an offsetting journal
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422':
          description: FOUR_EYES_VIOLATION (the creator may not reverse their own deal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/counterparties:
    get:
      tags: [Treasury]
      operationId: listCounterparties
      summary: Counterparty limits with current exposure and headroom, one row per currency line
      responses:
        '200':
          description: Counterparty limit lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CounterpartyLimit'

  /api/v1/treasury/limits/utilisation:
    get:
      tags: [Treasury]
      operationId: getLimitsUtilisation
      summary: >-
        Per-counterparty limit utilisation: limit, utilised (sum of principal of deals on book),
        available, utilisation %, breached flag and count of active senior overrides (ADR-0315 D4)
      responses:
        '200':
          description: Limit utilisation lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitUtilisation'

  /api/v1/treasury/positions:
    get:
      tags: [Treasury]
      operationId: getPositions
      summary: Daily position per currency — placed, borrowed, at ČNB, net
      parameters:
        - name: asOf
          in: query
          required: false
          description: |
            Defaults to the bank's accounting day today (Europe/Prague). A counted deal is in the
            position when valueDate <= asOf < maturityDate. Up to and including today the basis is
            ACTUAL and only SETTLED or MATURED deals count; after today it is PROJECTED and BOOKED
            and CONFIRMED deals count too, on their contracted dates — no new deals are assumed.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positions'

  /api/v1/treasury/quotes:
    get:
      tags: [Treasury]
      operationId: getSimulatedQuotes
      summary: SYNTHETIC bid/ask of the simulated counterparties for a product, currency and tenor
      description: |
        ADR-0315 D9, sandbox only. Each SYNTHETIC bank counterparty with a configured half-spread
        quotes the risk engine's latest curve set (CZK → CZEONIA, EUR → ESTR; linear on zero rates,
        flat outside the pillars) converted to ACT/360 simple percent, ± its spread. `bid` is what
        the counterparty pays for a deposit (a placement is struck at the bid), `ask` what it charges
        to lend (a borrowing is struck at the ask). `synthetic` is always true. With the simulated
        market or its quotes switched off the endpoint answers 409; when no quote can be priced (no
        curve set or curve, risk engine unreachable or refusing) 503 `QUOTE_UNAVAILABLE`.
      parameters:
        - name: product
          in: query
          required: true
          schema:
            type: string
            enum: [MM_PLACEMENT, MM_BORROWING]
        - name: currency
          in: query
          required: true
          schema:
            type: string
            enum: [CZK, EUR]
        - name: tenorDays
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: The quote board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteBoard'
        '400':
          description: Missing or invalid product, currency or tenorDays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '503':
          description: QUOTE_UNAVAILABLE — no curve set or curve, or the risk engine unreachable or refusing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/nostro/statements:
    post:
      tags: [Nostro reconciliation]
      operationId: uploadNostroStatement
      summary: Upload a correspondent's camt.053 end-of-day statement for a configured nostro account
      description: |
        Exactly one `Stmt`, with OPBD and CLBD balances; only booked (`BOOK`) entries are read and
        they must foot (opening + entries = closing). The account IBAN must be configured
        (`openbank.treasury.nostro.accounts`) against a treasury nostro GL in the statement
        currency. DOCTYPE declarations are refused. Nothing is posted to the ledger.
        A replay of the Idempotency-Key with the same bytes returns the original statement; the
        same key with different bytes, or the same (IBAN, statement id) under a new key, is 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '201':
          description: The stored statement (or the original one on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NostroStatement'
        '400':
          description: Missing Idempotency-Key, malformed camt.053, a statement that does not foot, or an unconfigured account, an amount beyond 4 decimal places or 15 integer digits, or a statement spanning more than 31 days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/treasury/nostro/statements/mt940:
    post:
      tags: [Nostro reconciliation]
      operationId: uploadNostroStatementMt940
      summary: Upload a correspondent's SWIFT MT940 statement for a configured nostro account
      description: |
        ADR-0315 D7: MT940 mapped onto the same statement model as camt.053, then stored and
        reconciled identically. Reads `:20:` `:25:` `:28C:` `:60F:` `:61:` `:86:` `:62F:`; the SWIFT
        envelope may be present. `statementId` is `:20:` + "/" + `:28C:`. A multi-page statement
        (`:60M:`/`:62M:`), an unsupported field, a control character, invalid UTF-8 or a body over
        1 MiB is refused. Same Idempotency-Key contract as the camt.053 upload; nothing is posted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/x-swift-mt940:
            schema:
              type: string
      responses:
        '201':
          description: The stored statement (or the original one on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NostroStatement'
        '400':
          description: Missing Idempotency-Key, malformed MT940, a statement that does not foot, an entry outside its period, or an unconfigured account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidState'

  /api/v1/treasury/nostro/{account}/breaks:
    get:
      tags: [Nostro reconciliation]
      operationId: listNostroBreaks
      summary: Reconciliation breaks of a configured nostro account, with age in business days
      description: |
        ADR-0315 D7. Every item a reconciliation left unmatched — a statement line (`STATEMENT`) or
        a ledger line on the nostro GL (`LEDGER`) — with the day it was first seen and its age in
        business days (Monday–Friday, no holiday calendar). A break resolves the day a later
        reconciliation matches it; recent statements are re-reconciled by an hourly sweep. `aged`
        is true for an open break at least `alertAgeDays` old with an amount of at least
        `alertMinAmount` in its own currency; such a break is announced once as
        `treasury.nostro.break-aged.v1`. Oldest first. Nothing is ever posted.
      parameters:
        - name: account
          in: path
          required: true
          description: The nostro IBAN (spaces ignored)
          schema:
            type: string
        - name: includeResolved
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The account's breaks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NostroBreakList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not a configured nostro account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/nostro/statements/{id}/reconciliation:
    get:
      tags: [Nostro reconciliation]
      operationId: getNostroReconciliation
      summary: Statement vs the ledger's nostro GL for the statement date
      description: |
        Computed on read against ledger-service (real, booked journals only). Pass 1 matches on
        amount + direction + date + reference (EndToEndId / AcctSvcrRef / remittance equal to the
        journal's transaction id or contained in its description); pass 2 pairs a remaining item on
        amount + direction + date only when exactly one candidate exists on each side
        (`AMOUNT_DATE`). Everything else is listed as unmatched. Nostro is an asset: a statement
        CRDT is a ledger DEBIT. Differences are statement minus ledger. Nothing is ever posted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NostroReconciliation'
        '404':
          description: No such statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            ledger-service answered the balance read with something that is neither a balance nor
            its unknown-account 404 (e.g. a ledger that does not serve the route yet) — the
            reconciliation cannot be computed (`LEDGER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/deals/{id}/cash-flows/overrides:
    get:
      tags: [Treasury]
      operationId: listDealCashFlowOverrides
      summary: The deal's cash-flow overrides, optionally by status
      parameters:
        - $ref: '#/components/parameters/DealId'
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CONFLICT] } }
      responses:
        '200':
          description: Overrides, oldest first
          content:
            application/json:
              schema: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/CashFlowOverride' } }
        '404': { description: No such deal }

  /api/v1/treasury/cash-flow-overrides:
    get:
      tags: [Treasury]
      operationId: listCashFlowOverrideQueue
      summary: The four-eyes override queue across deals (default PENDING, oldest first)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CONFLICT], default: PENDING } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Overrides
          content:
            application/json:
              schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/CashFlowOverride' } }
        '400': { description: limit outside 1..500 }

  /api/v1/treasury/day-completion/{date}:
    get:
      tags: [Treasury]
      operationId: getDayCompletion
      summary: The treasury accounting day's completion record (ADR-0344 D7)
      description: >-
        Every step (FIXINGS, ACCRUALS, PAYMENTS, REVALUATION, CORRECTIONS, MATURITIES) with the last
        outcome a run recorded for that bank day; a step no run recorded is PENDING with `at` null.
        `closeParticipation` is the ADR-0342 report treasury sends the ledger for the day (RAN /
        SKIPPED / REFUSED), or null while a due step has not finished (the ledger then waits).
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  steps:
                    type: array
                    maxItems: 6
                    items:
                      type: object
                      properties:
                        step: { type: string, enum: [FIXINGS, ACCRUALS, PAYMENTS, REVALUATION, CORRECTIONS, MATURITIES] }
                        status: { type: string, enum: [DONE, SKIPPED, FAILED, REFUSED, PENDING] }
                        count: { type: [integer, 'null'] }
                        journals: { type: integer, minimum: 0 }
                        refused: { type: integer, minimum: 0 }
                        detail: { type: [string, 'null'] }
                        at: { type: [string, 'null'], format: date-time }
                  closeParticipation:
                    type: [object, 'null']
                    properties:
                      participant: { type: string }
                      outcome: { type: string, enum: [RAN, SKIPPED, REFUSED] }
                      journalsPosted: { type: integer, minimum: 0 }
                      itemsProcessed: { type: integer, minimum: 0 }
                      reason: { type: [string, 'null'], maxLength: 1000 }

  /api/v1/treasury/deals/{id}/cash-flows:
    get:
      tags: [Treasury]
      operationId: getDealCashFlows
      summary: The deal's stored cash-flow ledger (ADR-0344 D4) — latest schedule version unless `version` is given
      parameters:
        - $ref: '#/components/parameters/DealId'
        - name: version
          in: query
          required: false
          description: A schedule version; omitted means the latest.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The cash-flow ledger. A deal that was never submitted has scheduleVersion 0 and no flows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowLedger' }
        '404': { description: No such deal or schedule version }

  /api/v1/treasury/deals/{id}/cash-flows/conflicts:
    get:
      tags: [Treasury]
      operationId: listCashFlowConflicts
      summary: Approved overrides a regeneration could not carry over because their producing leg spec changed
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: Open conflicts; nothing is dropped silently
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashFlowConflict' }
        '404': { description: No such deal }

  /api/v1/treasury/deals/{id}/cash-flows/{flowId}/overrides:
    post:
      tags: [Treasury]
      operationId: proposeCashFlowOverride
      summary: Propose an override of one flow's payment date and/or amount (ROLE_TREASURY_BACK_OFFICE). Four-eyes — PENDING until a different human approves.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/FlowId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashFlowOverrideRequest' }
      responses:
        '201':
          description: The PENDING override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowOverride' }
        '400': { description: Neither paymentDate nor amount given, blank reason, or an amount on a flow that has none }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such deal or flow }
        '409': { $ref: '#/components/responses/InvalidState' }

  /api/v1/treasury/deals/{id}/cash-flows/{flowId}/overrides/{overrideId}/approve:
    post:
      tags: [Treasury]
      operationId: approveCashFlowOverride
      summary: Approve a pending override. The approver must differ from the proposer; an AI agent may never approve.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/OverrideId'
      responses:
        '200':
          description: The approved override; the flow now carries it with its original beside it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowOverride' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such override }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION — the proposer may not approve }

  /api/v1/treasury/deals/{id}/cash-flows/{flowId}/overrides/{overrideId}/reject:
    post:
      tags: [Treasury]
      operationId: rejectCashFlowOverride
      summary: Reject a pending override with a reason
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/OverrideId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: The rejected override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowOverride' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such override }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION — the proposer may not reject their own override }

  /api/v1/treasury/deals/{id}/versions:
    get:
      tags: [Treasury]
      operationId: listDealVersions
      summary: The deal's versions, oldest first, each with a summary of what changed
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: Deal versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DealVersion' }
        '404': { description: No such deal }

  /api/v1/treasury/deals/{id}/journals:
    get:
      tags: [Treasury]
      operationId: listDealJournals
      summary: The journals the ledger accepted for the deal (ADR-0344 D7)
      description: >-
        Every journal posted for the deal, oldest first, with its event and the idempotency key the
        ledger deduplicates on (`treasury:<dealId>:<event>[:<flowId|date>]`).
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: Posted journals
          content:
            application/json:
              schema:
                type: array
                maxItems: 100000
                items: { $ref: '#/components/schemas/JournalRef' }
        '404': { description: No such deal }

  /api/v1/treasury/posting-rules:
    get:
      tags: [Treasury]
      operationId: listPostingRules
      summary: 'The posting-rule matrix: (product, event, IFRS 9 category) to journal template (ADR-0344 D7)'
      responses:
        '200':
          description: Every posting rule of every product, versioned
          content:
            application/json:
              schema:
                type: array
                maxItems: 10000
                items: { $ref: '#/components/schemas/PostingRule' }

  /api/v1/treasury/reference/{kind}:
    get:
      tags: [Treasury]
      operationId: listReferenceRecords
      summary: Reference records of one kind (ADR-0344 D3), optionally those effective on `asOf` and/or in one status
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - name: asOf
          in: query
          required: false
          description: Only records effective on this date (validFrom <= asOf and (validTo is null or asOf < validTo)).
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReferenceStatus' }
      responses:
        '200':
          description: Matching records, by key then version
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReferenceRecord' }
        '400': { description: Unknown kind or status }
    post:
      tags: [Treasury]
      operationId: proposeReferenceRecord
      summary: >-
        Propose a new version of a reference record (ROLE_TREASURY_REFERENCE_EDITOR or
        ROLE_TREASURY_BACK_OFFICE; an AI agent may propose). PENDING until a different human approves.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReferenceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceProposal' }
      responses:
        '201':
          description: The PENDING version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceRecord' }
        '400': { description: Unknown kind, a payload that fails the kind's schema, a key that does not match the payload, or a blank reason }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/treasury/reference/{kind}/{key}:
    get:
      tags: [Treasury]
      operationId: getReferenceRecord
      summary: The currently active version of one record and its full version history
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceKey'
      responses:
        '200':
          description: Active version (null if none is active today) and every version, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceHistory' }
        '404': { description: No version of this record exists }

  /api/v1/treasury/reference/{kind}/{key}/versions/{version}/approve:
    post:
      tags: [Treasury]
      operationId: approveReferenceRecord
      summary: >-
        Approve a PENDING version (ROLE_TREASURY_APPROVER; for kind `counterparty`, whose records carry
        the credit limits, ROLE_TREASURY_SENIOR_APPROVER — a raised limit is refused otherwise with 403
        SENIOR_APPROVAL_REQUIRED, and the limits before and after are recorded in approvalNote). A
        counterparty or ssi version may not start before today (422 REFERENCE_BACKDATED). It becomes ACTIVE; an ACTIVE version
        of the same key it overlaps is closed at its validFrom (or SUPERSEDED when it would start
        no earlier). The proposer may not approve; an AI agent may never approve.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceKey'
        - $ref: '#/components/parameters/ReferenceVersion'
      responses:
        '200':
          description: The ACTIVE version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such version }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION }

  /api/v1/treasury/reference/{kind}/{key}/versions/{version}/reject:
    post:
      tags: [Treasury]
      operationId: rejectReferenceRecord
      summary: Reject a PENDING version with a reason (ROLE_TREASURY_APPROVER; not the proposer)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceKey'
        - $ref: '#/components/parameters/ReferenceVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: The REJECTED version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such version }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION }

  /api/v1/treasury/reference/{kind}/{key}/versions/{version}/verify:
    post:
      tags: [Treasury]
      operationId: verifyReferenceRecord
      summary: >-
        Mark a version's content as verified against its source (ROLE_TREASURY_APPROVER; not the
        proposer; never an AI agent). An unverified record may be used but is never silently trusted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceKey'
        - $ref: '#/components/parameters/ReferenceVersion'
      responses:
        '200':
          description: The version with verified=true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such version }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION }

  /api/v1/treasury/reference/dependencies/{kind}/{key}:
    get:
      tags: [Treasury]
      operationId: getReferenceDependencies
      summary: What references this record — deals, indices, securities and other reference records
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
        - $ref: '#/components/parameters/ReferenceKey'
      responses:
        '200':
          description: Dependants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceDependencies' }
        '400': { description: Unknown kind }

  /api/v1/treasury/deals/export:
    get:
      tags: [Treasury]
      operationId: exportDeals
      summary: Export deals (all matching the blotter filters, or a selection of ids) as CSV or JSON
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, json], default: json } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [all, selection], default: all } }
        - { name: layout, in: query, required: false, schema: { type: string, enum: [STANDARD, REGULATORY], default: STANDARD } }
        - name: ids
          in: query
          required: false
          description: scope=selection only — comma-separated deal ids
          schema: { type: string }
      responses:
        '200':
          description: The export
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } }
        '400': { description: Unknown format/layout, or scope=selection without ids }

  /api/v1/treasury/deals/{id}/history:
    get:
      tags: [Treasury]
      operationId: getDealHistory
      summary: The deal's timeline and its versions with what changed
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealId: { type: string, format: uuid }
                  transitions: { type: array, items: { $ref: '#/components/schemas/Transition' } }
                  versions: { type: array, items: { $ref: '#/components/schemas/DealVersion' } }
        '404': { description: No such deal }

  /api/v1/treasury/deals/{id}/schedule-preview:
    post:
      tags: [Treasury]
      operationId: previewDealSchedule
      summary: Generate the deal's cash-flow ledger WITHOUT storing it (the ticket's "generate" button)
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: The ledger the deal would have now; scheduleVersion is the one a submission would write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowLedger' }
        '404': { description: No such deal }
        '422': { description: REFERENCE_NOT_EFFECTIVE or SCHEDULE_ENGINE_UNAVAILABLE }

  /api/v1/treasury/deals/{id}/send-confirmation:
    post:
      tags: [Treasury]
      operationId: sendDealConfirmation
      summary: Record that the bank's confirmation was sent to the counterparty (ROLE_TREASURY_BACK_OFFICE or ROLE_TREASURY_APPROVER); never the deal's creator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId: { type: [string, 'null'], description: The confirmation artefact's id in the document store }
                channel: { type: [string, 'null'], maxLength: 64 }
      responses:
        '200': { $ref: '#/components/responses/DealOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION }

  /api/v1/treasury/positions/close-of-day:
    post:
      tags: [Treasury]
      operationId: closePositions
      summary: Record a close-of-day position snapshot (ROLE_TREASURY_BACK_OFFICE)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionCloseRequest' }
      responses:
        '201':
          description: The recorded close
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionClose' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/treasury/positions/close-of-day/special:
    post:
      tags: [Treasury]
      operationId: closePositionsSpecial
      summary: Record a special (out-of-cycle or scenario) position close (ROLE_TREASURY_BACK_OFFICE)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionCloseRequest' }
      responses:
        '201':
          description: The recorded close
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionClose' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/treasury/views/deal-filters:
    get:
      tags: [Treasury]
      operationId: listDealFilters
      summary: The caller's saved blotter filters
      responses:
        '200':
          description: Saved filters
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedDealFilter' } }
    post:
      tags: [Treasury]
      operationId: saveDealFilter
      summary: Save (or replace by name) one of the caller's blotter filters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedDealFilter' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedDealFilter' }
        '400': { description: Blank name or a filter that is not an object }

  /api/v1/treasury/views/deal-filters/{name}:
    delete:
      tags: [Treasury]
      operationId: deleteDealFilter
      summary: Delete one of the caller's saved filters
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { description: No such filter for the caller }

  /api/v1/treasury/calendar:
    get:
      tags: [Treasury]
      operationId: getEventCalendar
      summary: Treasury events between two dates — refixings, payments, maturities, settlements
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: bookId, in: query, required: false, schema: { type: string } }
        - name: types
          in: query
          required: false
          description: Comma-separated event types; omitted = all
          schema: { type: string }
      responses:
        '200':
          description: Events by date
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TreasuryEvent' } }
        '400': { description: Missing or reversed range, more than 366 days, or an unknown type }

  /api/v1/treasury/reference/{kind}/export:
    get:
      tags: [Treasury]
      operationId: exportReferenceRecords
      summary: Every version of every record of one kind, in the same JSON shape as GET /reference/{kind}
      parameters:
        - $ref: '#/components/parameters/ReferenceKind'
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReferenceRecord' } }

  /api/v1/treasury/reference/{kind}/import:
    post:
      tags: [Treasury]
      operationId: importReferenceRecords
      summary: >-
        Propose many versions at once (ROLE_TREASURY_REFERENCE_EDITOR or ROLE_TREASURY_BACK_OFFICE).
        Each item becomes a PENDING proposal exactly as POST /reference/{kind} would make it; nothing
        activates without four-eyes approval. All-or-nothing: one invalid item rejects the import.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReferenceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ReferenceProposal' } }
      responses:
        '201':
          description: The PENDING versions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReferenceRecord' } }
        '400': { description: An invalid item (its index is in the message) }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/treasury/reference/user-activity:
    get:
      tags: [Treasury]
      operationId: getReferenceUserActivity
      summary: Read-only — who proposed, approved, rejected or verified reference data, newest first
      parameters:
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, format: date-time }
                    actor: { type: string }
                    action: { type: string, enum: [PROPOSE, APPROVE, REJECT, VERIFY] }
                    kind: { type: string }
                    key: { type: string }
                    version: { type: integer }

  /api/v1/treasury/reference/application-version-history:
    get:
      tags: [Treasury]
      operationId: getApplicationVersionHistory
      summary: Read-only — the schema migrations applied to this service's store, oldest first
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version: { type: string }
                    description: { type: string }
                    installedOn: { type: string, format: date-time }

  /api/v1/treasury/portfolio/statements:
    post:
      tags: [Portfolio]
      operationId: uploadPortfolioStatement
      summary: Upload a custodian's semt.002 period-end statement of holdings
      description: |
        ADR-0337 amendment. One complete page (`Pgntn` page 1, last page) of a complete (`UpdTp`
        COMP) semt.002 for a configured safekeeping account of this deployment's entity. Every
        holding needs an ISIN, a quantity, a valuation in the account base currency (one currency
        for the whole statement) and a CFI the configured prefix mapping covers — an unmapped or
        missing CFI refuses the WHOLE statement, naming every unclassifiable ISIN. DOCTYPE is
        refused. Nothing is posted.
        Idempotent: the same Idempotency-Key with the same bytes, or the same bytes as the date's
        current version under any key, returns the stored version. Different bytes for an account and date that
        already has a statement are a CORRECTION: stored as the next version, which supersedes the
        current one; the superseded version is kept. The key reused on other bytes is 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '201':
          description: The stored version (or the existing one on an idempotent re-ingestion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioStatement'
        '400':
          description: Missing Idempotency-Key, malformed or partial semt.002, unmapped CFI, unconfigured account or no portfolio entity on this deployment, mixed valuation currencies, or a figure the store cannot hold exactly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidState'
    get:
      tags: [Portfolio]
      operationId: listPortfolioStatementVersions
      summary: Every account version stored for a statement date, oldest first (the correction trail)
      parameters:
        - $ref: '#/components/parameters/PortfolioDate'
      responses:
        '200':
          description: The versions, oldest first (empty when none is stored)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PortfolioStatement'}
        '400':
          description: Missing or malformed date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/treasury/portfolio/period-end:
    get:
      tags: [Portfolio]
      operationId: getPeriodEndPortfolio
      summary: The portfolio at exactly that date (tax-reporting's PSP 34-12 PS source)
      description: |
        The complete entity portfolio from CURRENT statements for every configured account at exactly `date`.
        If any configured account lacks that date's statement, the answer is 409 `PORTFOLIO_SNAPSHOT_MISSING` — never an empty list: an
        empty portfolio (a statement with no holdings, 200 with `positions: []`) and a missing
        statement must not look the same. Decimals are strings.
      parameters:
        - $ref: '#/components/parameters/PortfolioDate'
      responses:
        '200':
          description: The portfolio at that date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodEndPortfolio'
        '400':
          description: Missing or malformed date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: One or more configured accounts lacks a statement for that date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/treasury/fixings:
    get:
      tags: [Treasury]
      operationId: listFixings
      summary: The fixings of one date (ADR-0344 D5) — DUE, FIXED or BLOCKED by the market-data quality gate
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DUE, FIXED, BLOCKED] } }
      responses:
        '200':
          description: One row per (index, fixing date)
          content:
            application/json:
              schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Fixing' } }
        '400': { description: Missing or malformed date or status }

  /api/v1/treasury/fixings/run:
    post:
      tags: [Treasury]
      operationId: runFixings
      summary: Fix every due index of the date that passes the quality gate; block (and open a case for) the rest
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  fixedFlows: { type: integer, minimum: 0 }
                  fixedIndices: { type: array, maxItems: 500, items: { type: string } }
                  blocked: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Fixing' } }
                  failures: { type: integer, minimum: 0 }

  /api/v1/treasury/market-data/internal-rate-sheets:
    get:
      tags: [Treasury]
      operationId: listRateSheets
      summary: Internal rate sheets the bank publishes, newest first (contract 8.5)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, ACTIVE, REJECTED, SUPERSEDED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: The sheets
          content:
            application/json:
              schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/RateSheet' } }
    post:
      tags: [Treasury]
      operationId: proposeRateSheet
      summary: Propose a rate sheet (back office) — PENDING until a different human approves it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, effectiveFrom, rates]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                effectiveFrom: { type: string, format: date }
                rates:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [label, value]
                    properties:
                      label: { type: string, minLength: 1, maxLength: 64 }
                      value: { type: number, minimum: -100, maximum: 100, description: Percent, at most 6 decimals }
      responses:
        '201':
          description: The PENDING sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateSheet' }
        '400':
          description: A bad name, date or rate
  /api/v1/treasury/market-data/internal-rate-sheets/{id}/approve:
    post:
      tags: [Treasury]
      operationId: approveRateSheet
      summary: Approve a rate sheet (four-eyes, never its proposer or an AI agent); supersedes the ACTIVE sheet of the same name
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ACTIVE sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateSheet' }
        '404':
          description: No such sheet
        '409':
          description: RATE_SHEET_STALE — no longer PENDING
        '422':
          description: FOUR_EYES_VIOLATION (an AI or machine principal is 403 ACTOR_NOT_PERMITTED)
  /api/v1/treasury/market-data/internal-rate-sheets/{id}/reject:
    post:
      tags: [Treasury]
      operationId: rejectRateSheet
      summary: Reject a rate sheet with a reason (four-eyes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The REJECTED sheet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateSheet' }
        '409':
          description: RATE_SHEET_STALE — no longer PENDING

  /api/v1/treasury/analysis/cash-flows:
    post:
      tags: [Treasury]
      operationId: analyseCashFlows
      summary: Contractual cash flows from the stored ledger by currency — gross, net or cumulative, daily or monthly — optionally converted at the approved FX fixing of the calculation date (contract 8.4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calculationDate, referenceCurrency]
              properties:
                calculationDate: { type: string, format: date }
                referenceCurrency: { type: string, pattern: '^[A-Z]{3}$' }
                convertToReference: { type: boolean, default: false }
                expression: { type: string, enum: [GROSS, NET, CUMULATIVE], default: NET }
                scenario: { type: string, enum: [CONTRACTUAL, BEHAVIOURAL, STRESS], default: CONTRACTUAL }
                splitMonthly: { type: boolean, default: false }
                bookId: { type: string, maxLength: 64, nullable: true, description: The book and every descendant in the ACTIVE book hierarchy }
                bankAccountId: { type: string, maxLength: 64, nullable: true, description: The deal's settlement cash account }
                includePlanned: { type: boolean, default: false, description: Include PLANNED deals beside ACTUAL ones }
                horizonDays: { type: integer, minimum: 1, maximum: 3660, default: 366 }
      responses:
        '200':
          description: Series per currency, the reference-currency series (null when not converting or when any currency lacks a fixing), drill-down flows (at most 2000) and data gaps
          content:
            application/json:
              schema:
                type: object
                properties:
                  to: { type: string, format: date }
                  series:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/CashFlowSeries' }
                  reference: { allOf: [{ $ref: '#/components/schemas/CashFlowSeries' }], nullable: true }
                  flows:
                    type: array
                    maxItems: 2000
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        currency: { type: string }
                        amount: { type: number, description: Signed, + in and − out }
                        referenceAmount: { type: number, nullable: true }
                        dealId: { type: string, format: uuid }
                        legIndex: { type: integer }
                        flowId: { type: string, format: uuid }
                        kind: { type: string }
                        dealKind: { type: string, enum: [ACTUAL, PLANNED] }
                        state: { type: string }
                  flowsTruncated: { type: boolean }
                  fxRates:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      properties:
                        currency: { type: string }
                        index: { type: string, description: 'FX_<CCY>_<REF>: units of the reference currency per one unit of CCY' }
                        rate: { type: number }
                        date: { type: string, format: date }
                  dataGaps:
                    type: array
                    maxItems: 400
                    items:
                      type: object
                      properties:
                        currency: { type: string, nullable: true }
                        reason: { type: string }
        '400':
          description: A bad parameter (date, currency, horizon, enum, identifier length)
        '422':
          description: SCENARIO_NOT_AVAILABLE (BEHAVIOURAL or STRESS — no scenario model is published yet), or ANALYSIS_TOO_LARGE (more than 50000 flows in the horizon)

  /api/v1/treasury/revaluations:
    get:
      tags: [Treasury]
      operationId: listRevaluations
      summary: The fair-value revaluations recorded for one valuation date (ADR-0344 D7/D8)
      parameters:
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: One row per revalued deal
          content:
            application/json:
              schema: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/Revaluation' } }

  /api/v1/treasury/revaluations/run:
    post:
      tags: [Treasury]
      operationId: runRevaluation
      summary: Revalue the fair-value deals (or one, by dealId) off the risk engine's TIED_OUT valuation of the date; a deal it did not value is a gap, never a zero
      parameters:
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - { name: dealId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { type: string, format: date }
                  snapshotId: { type: string, format: uuid, nullable: true }
                  revalued: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/Revaluation' } }
                  journals: { type: integer, minimum: 0 }
                  reposted: { type: integer, minimum: 0, description: Rows claimed by an earlier run and owed to the ledger that this run posted first }
                  owed: { type: integer, minimum: 0, description: Rows still claimed but unposted after the run; any one FAILS the REVALUATION day step }
                  gaps:
                    type: array
                    maxItems: 5000
                    items:
                      type: object
                      properties:
                        dealId: { type: string, format: uuid }
                        reason: { type: string, maxLength: 500 }
                  failures: { type: array, maxItems: 5000, items: { type: string, maxLength: 500 } }
        '409':
          description: REVALUATION_OUT_OF_ORDER, or PRIOR_REVALUATION_UNPOSTED (the deal's latest revaluation is claimed but not yet posted; the next whole-book run re-posts it first) — a single-deal run for a date not after the deal's latest revaluation that is not an exact replay (dates are strictly increasing per deal; an earlier date is never back-filled)

  /api/v1/treasury/fixings/{index}/{date}/manual:
    post:
      tags: [Treasury]
      operationId: proposeManualFixing
      summary: Propose a manual fixing — PENDING until a different human approves (never an AI agent)
      parameters:
        - { name: index, in: path, required: true, schema: { type: string, maxLength: 32 } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate, reason, source]
              properties:
                rate: { type: number, description: Percent, within ±100, at most 8 decimals }
                reason: { type: string, minLength: 1, maxLength: 900 }
                source: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201': { description: The PENDING batch, content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataBatch' } } } }
        '400': { description: Invalid rate, reason or source }
        '422': { description: The index is not effective on that date }

  /api/v1/treasury/fixings/{index}/{date}/manual/{batchId}/approve:
    post:
      tags: [Treasury]
      operationId: approveManualFixing
      summary: Approve a manual fixing (422 FOUR_EYES_VIOLATION for its proposer, 403 for a non-human)
      parameters:
        - { name: index, in: path, required: true, schema: { type: string } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: APPROVED, content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataBatch' } } } }
        '403': { description: Not a human approver }
        '409': { description: Not PENDING, or an ACTIVE value already exists for that index-date }
        '422': { description: Four-eyes violation }

  /api/v1/treasury/fixings/{index}/{date}/manual/{batchId}/reject:
    post:
      tags: [Treasury]
      operationId: rejectManualFixing
      summary: Reject a manual fixing
      parameters:
        - { name: index, in: path, required: true, schema: { type: string } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } } } }
      responses:
        '200': { description: REJECTED, content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataBatch' } } } }

  /api/v1/treasury/market-data/factors:
    get:
      tags: [Treasury]
      operationId: listMarketFactors
      summary: ACTIVE index observations (factor history), optionally of one index
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: index, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        '200':
          description: Observations
          content:
            application/json:
              schema: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/IndexObservation' } }

  /api/v1/treasury/market-data/export:
    get:
      tags: [Treasury]
      operationId: exportMarketData
      summary: CSV export of ACTIVE observations; every cell quoted and formula-leading cells neutralised
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: index, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }

  /api/v1/treasury/market-data/import:
    post:
      tags: [Treasury]
      operationId: importMarketData
      summary: Import observations (CSV index,date,value or a JSON array) as one PENDING four-eyes batch; at most 1 MiB and 5000 rows
      parameters:
        - { name: reason, in: query, required: true, schema: { type: string, maxLength: 1000 } }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, maxLength: 1048576 } }
          application/json:
            schema:
              type: array
              maxItems: 5000
              items: { type: object, properties: { index: { type: string }, date: { type: string, format: date }, value: { type: number } } }
      responses:
        '201': { description: The PENDING batch, content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataBatch' } } } }
        '400': { description: A bad row (the whole file is refused), or over the size or row bounds }

  /api/v1/treasury/market-data/imports:
    get:
      tags: [Treasury]
      operationId: listMarketDataBatches
      summary: Market-data batches (imports and manual fixings), newest first
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/MarketDataBatch' } }

  /api/v1/treasury/market-data/imports/{batchId}/approve:
    post:
      tags: [Treasury]
      operationId: approveMarketDataImport
      summary: Approve an import — its observations become ACTIVE (four-eyes, human only)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: APPROVED, content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataBatch' } } } }
        '403': { description: Not a human approver }
        '404': { description: No such batch }
        '409': { description: Not PENDING, or an ACTIVE value already exists for one of its index-dates }
        '422': { description: Four-eyes violation }

  /api/v1/treasury/market-data/imports/{batchId}/reject:
    post:
      tags: [Treasury]
      operationId: rejectMarketDataImport
      summary: Reject an import
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } } } }
      responses:
        '200': { description: REJECTED, content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataBatch' } } } }

  /api/v1/treasury/market-data/quality:
    get:
      tags: [Treasury]
      operationId: getMarketDataQuality
      summary: Suspicious (stale, jump) and missing values for the indices due on a date
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The quality report
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  suspicious:
                    type: array
                    maxItems: 500
                    items:
                      type: object
                      properties:
                        index: { type: string }
                        date: { type: string, format: date }
                        value: { type: [number, 'null'] }
                        previous: { type: [number, 'null'] }
                        jumpBp: { type: [integer, 'null'] }
                        staleDays: { type: [integer, 'null'] }
                        reason: { type: [string, 'null'] }
                  missing:
                    type: array
                    maxItems: 500
                    items: { type: object, properties: { index: { type: string }, date: { type: string, format: date }, dealCount: { type: integer } } }

  /api/v1/treasury/payments:
    get:
      tags: [Treasury]
      operationId: listPayments
      summary: Own-account payments with a value date in from..to (ADR-0344 D6)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        '200': { description: Payments, content: { application/json: { schema: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/Payment' } } } } }

  /api/v1/treasury/payments/{id}:
    get:
      tags: [Treasury]
      operationId: getPayment
      summary: One payment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { description: No such payment }

  /api/v1/treasury/payments/propose:
    post:
      tags: [Treasury]
      operationId: proposePayments
      summary: Propose payments for the FIXED flows inside the cut-off window (netted per agreement, addressed from the SSI)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: The proposal run, content: { application/json: { schema: { type: object } } } }

  /api/v1/treasury/payments/{id}/release:
    post:
      tags: [Treasury]
      operationId: releasePayment
      summary: >-
        Release a PROPOSED payment (ROLE_TREASURY_PAYMENT_RELEASER only; never a netted deal's creator or term
        author nor an override proposer or approver of a netted flow; never an AI agent). Refused 422
        FUNDING_EXCEEDED when the funding account would go negative on the value date, net of released
        payments. Contract 9: the release writes the rail instruction to the outbox in the same
        transaction (status RELEASED); the rail's status events move it to SENT / SETTLED / FAILED.
        An SSI from which no institution-transfer rail follows ends it RAIL_NOT_SUPPORTED.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Released (RELEASED or RAIL_NOT_SUPPORTED), content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '403': { description: Not a human payment releaser }
        '409': { description: Not PROPOSED }
        '422': { description: FOUR_EYES_VIOLATION or FUNDING_EXCEEDED }

  /api/v1/treasury/payments/{id}/cancel:
    post:
      tags: [Treasury]
      operationId: cancelPayment
      summary: Cancel a PROPOSED payment (its flows become proposable again); a released payment is never cancelled
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { description: CANCELLED, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '409': { description: Not PROPOSED }

  /api/v1/treasury/payments/{id}/resolve:
    post:
      tags: [Treasury]
      operationId: resolvePayment
      summary: Resolve a released payment MANUALLY_SETTLED or RETURNED (an approver who is neither its releaser nor a term author); its flows stay linked
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, reason]
              properties:
                outcome: { type: string, enum: [MANUALLY_SETTLED, RETURNED] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '409': { description: Not released }
        '422': { description: FOUR_EYES_VIOLATION }

  /api/v1/treasury/deals/{id}/corrections:
    get:
      tags: [Treasury]
      operationId: listDealCorrections
      summary: The deal's corrections, oldest first
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: Every correction of the deal with its preview
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: '#/components/schemas/DealCorrection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such deal }
    post:
      tags: [Treasury]
      operationId: proposeDealCorrection
      summary: >-
        Propose a correction of a BOOKED, CONFIRMED or SETTLED leg-described deal (PENDING). The
        answer carries the preview - the flows the new version generates, the flows that change and
        the delta journals it would post (what the new version implies minus what was posted, per
        event and flow). At most one PENDING correction per deal (409 CORRECTION_STALE).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionRequest' }
      responses:
        '201':
          description: The PENDING correction with its preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCorrection' }
        '400': { description: Malformed or missing reason / effectiveFrom, or no change at all }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such deal }
        '409': { description: INVALID_STATE (not correctable) or CORRECTION_STALE (one is already pending) }
        '422': { description: 'REFERENCE_NOT_EFFECTIVE, PRODUCT_LIMIT_BREACHED, or LIMIT_BREACHED (without requestLimitOverride)' }

  /api/v1/treasury/deals/{id}/corrections/{correctionId}:
    get:
      tags: [Treasury]
      operationId: getDealCorrection
      summary: One correction with its preview
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/CorrectionId'
      responses:
        '200':
          description: The correction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCorrection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such correction on the deal }

  /api/v1/treasury/deals/{id}/corrections/{correctionId}/approve:
    post:
      tags: [Treasury]
      operationId: approveDealCorrection
      summary: >-
        Approve a pending correction. The approver is a human who is neither its proposer nor any
        term author of the deal (creator, submitter, draft editors, authors of earlier corrections).
        In one transaction under the deal lock: refused 409 PAYMENT_RELEASED while a payment that is
        released, sent or failed covers a CHANGED flow; PROPOSED payments of changed flows are
        withdrawn; the new deal version and its regenerated ledger (stored observed fixings
        re-supplied, overrides carried or conflicted) commit. The delta journals then post into the
        open accounting day (a closed day moves them to today, recording the original value date);
        the correction is POSTED once they all have, APPROVED until then.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/CorrectionId'
      responses:
        '200':
          description: The approved (or already posted) correction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCorrection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such correction on the deal }
        '409': { description: PAYMENT_RELEASED, CORRECTION_STALE (the deal moved on), FLOW_CHANGED (its schedule was written meanwhile) or INVALID_STATE }
        '422': { description: 'FOUR_EYES_VIOLATION, LIMIT_BREACHED (re-measured now and under the lock) or PRODUCT_LIMIT_BREACHED' }

  /api/v1/treasury/deals/{id}/corrections/{correctionId}/override-limit:
    post:
      tags: [Treasury]
      operationId: overrideDealCorrectionLimit
      summary: >-
        A senior approver overrides the counterparty-limit breach a correction's terms cause
        (proposed with requestLimitOverride). Bounded to the exposure measured now; the senior is
        no term author and may not also approve it; approval re-measures under the lock.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/CorrectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: The correction carrying the override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCorrection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such correction on the deal }
        '409': { description: INVALID_STATE - not pending, no override requested, or no breach to override }
        '422': { description: FOUR_EYES_VIOLATION }

  /api/v1/treasury/deals/{id}/corrections/{correctionId}/reject:
    post:
      tags: [Treasury]
      operationId: rejectDealCorrection
      summary: Reject a pending correction with a reason (same four-eyes rule as approval)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/CorrectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: The rejected correction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCorrection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such correction on the deal }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { description: FOUR_EYES_VIOLATION }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PortfolioDate:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated, one per user intent (e.g. a UUID), stable across automatic retries.
        Stored with the state change it produced, in the same transaction: a replay returns the
        deal as it now stands instead of acting twice; the same key on a different command or
        deal is 400. 1..128 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DealId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowId:
      name: flowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OverrideId:
      name: overrideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrectionId:
      name: correctionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceKind:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ReferenceKind' }
    ReferenceKey:
      name: key
      in: path
      required: true
      description: The record key; for `ssi` it is `counterpartyId:currency`, for `regulatory-code` `list:code`.
      schema: { type: string, minLength: 1, maxLength: 128 }
    ReferenceVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    DealOk:
      description: The deal after the transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Deal'
    Forbidden:
      description: Wrong role, or ACTOR_NOT_PERMITTED (an AI agent or service account attempting a person's step)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: INVALID_STATE — the transition is not allowed from the deal's current state or date
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    RateSheet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        effectiveFrom: { type: string, format: date }
        status: { type: string, enum: [PENDING, ACTIVE, REJECTED, SUPERSEDED] }
        rates:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: number }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
    CashFlowSeries:
      type: object
      properties:
        currency: { type: string }
        buckets:
          type: array
          maxItems: 4000
          items:
            type: object
            properties:
              date: { type: string, format: date, description: The day, or the first of the month when split monthly }
              inflow: { type: number }
              outflow: { type: number, description: Signed (≤ 0) }
              net: { type: number }
              cumulative: { type: number }
              value: { type: number, description: 'The figure the expression asks for: GROSS → inflow + |outflow|, NET → net, CUMULATIVE → cumulative' }
    Revaluation:
      type: object
      description: One deal's revaluation on one date (ADR-0344 D7/D8); amounts in the deal currency
      properties:
        dealId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        snapshotId: { type: string, format: uuid }
        fairValue: { type: number, description: The clean fair value the risk engine reported }
        carrying: { type: number, description: Amortised cost for a security, zero for a derivative }
        cumulative: { type: number, description: Cumulative fair-value adjustment after this date }
        change: { type: number, description: The change this date posted through the REVALUATION event }
        journalId: { type: string, format: uuid, nullable: true }
    CorrectionChanges:
      type: object
      description: The partial terms a correction changes; absent = unchanged. Legs are replaced as a whole.
      properties:
        legs:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/LegSpec' }
        rate: { type: number }
        calendars:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 32 }
        businessDayConvention: { type: string, enum: [UNADJUSTED, FOLLOWING, MODIFIED_FOLLOWING, PRECEDING, MODIFIED_PRECEDING] }
        note: { type: string, maxLength: 2000 }
    CorrectionRequest:
      type: object
      required: [reason, effectiveFrom]
      properties:
        changes: { $ref: '#/components/schemas/CorrectionChanges' }
        fullUnwind:
          type: boolean
          description: True unwinds the deal completely - every posted journal is offset and the deal ends REVERSED (the way a SETTLED matrix deal is taken back). No changes may be given with it.
        reason: { type: string, minLength: 1, maxLength: 500 }
        effectiveFrom: { type: string, format: date }
        requestLimitOverride:
          type: boolean
          description: >-
            The corrected terms are vetted exactly as a booking (references, FX flag, product mandate,
            counterparty limit). A counterparty-limit breach is refused (422 LIMIT_BREACHED) unless this
            is true; then approval waits for a senior's override. A product-mandate breach is always 422.
    PostedDelta:
      type: object
      properties:
        idempotencyKey: { type: string }
        journalId: { type: string, format: uuid }
        entryDate: { type: string, format: date }
        originalValueDate:
          type: [string, 'null']
          format: date
          description: Set when the original day was closed and the journal posted into today's open day.
    DealCorrection:
      type: object
      properties:
        correctionId: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, POSTED, REJECTED] }
        baseVersion: { type: integer }
        newVersion: { type: [integer, 'null'] }
        fullUnwind: { type: boolean }
        reason: { type: string }
        effectiveFrom: { type: string, format: date }
        changes: { $ref: '#/components/schemas/CorrectionChanges' }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        limitOverrideRequested: { type: boolean }
        limitOverrideBy: { type: [string, 'null'] }
        limitOverrideCoversExposureUpTo: { type: [number, 'null'] }
        posted:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/PostedDelta' }
        preview:
          type: object
          description: '`{ newFlows, changedFlows: [{slot, before, after}], deltaJournals: [{sourceEvent, key, valueDate, idempotencyKey, lines}] }` as computed when proposed.'
          additionalProperties: true
    PaymentStatus:
      type: string
      enum: [PROPOSED, RELEASED, SENT, SETTLED, FAILED, CANCELLED, RAIL_NOT_SUPPORTED, MANUALLY_SETTLED, RETURNED]
    Payment:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        direction: { type: string, enum: [IN, OUT] }
        counterpartyId: { type: string }
        currency: { type: string }
        amount: { type: number }
        valueDate: { type: string, format: date }
        rail: { type: [string, 'null'], enum: [CERTIS, SEPA, TARGET2, SWIFT, null] }
        ssi: { type: [object, 'null'] }
        nettedFlowIds: { type: array, maxItems: 500, items: { type: string, format: uuid } }
        dealIds: { type: array, maxItems: 500, items: { type: string, format: uuid } }
        idempotencyKey: { type: string }
        railReference: { type: [string, 'null'] }
        transferRail: { type: [string, 'null'], enum: [CERTIS, TARGET2, SWIFT, null], description: "Contract 9.1: the institution-transfer rail chosen at release." }
        releasedBy: { type: [string, 'null'] }
        statusReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Fixing:
      type: object
      properties:
        index: { type: string }
        fixingDate: { type: string, format: date }
        status: { type: string, enum: [DUE, FIXED, BLOCKED] }
        rate: { type: [number, 'null'] }
        source: { type: [string, 'null'] }
        dealCount: { type: integer }
        flowIds: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
        blockReason: { type: [string, 'null'] }
        staleDays: { type: [integer, 'null'] }
        jumpBp: { type: [integer, 'null'] }
        missing: { type: boolean }
    IndexObservation:
      type: object
      properties:
        index: { type: string }
        date: { type: string, format: date }
        value: { type: number, description: Percent }
        source: { type: string, enum: [IMPORT, MANUAL, FEED] }
        status: { type: string, enum: [PENDING, ACTIVE, REJECTED] }
        batchId: { type: string, format: uuid }
        sha256: { type: string, description: 'SHA-256 of index|date|value|source' }
    MarketDataBatch:
      type: object
      properties:
        batchId: { type: string, format: uuid }
        kind: { type: string, enum: [IMPORT, MANUAL_FIXING, FEED] }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reason: { type: string }
        fileSha256: { type: [string, 'null'] }
        rowCount: { type: integer }
        rows: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/IndexObservation' } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
    ProductType:
      type: string
      # x-extensible-enum, not enum (1.8.0, #10896): products GROW as ADR-0315 D2 lands them
      # (CNB_LOMBARD and FX_SPOT now). A client must tolerate an unknown product; a closed set would make every
      # new product a URL-major break. The same idiom as risk-engine's Position.kind.
      x-extensible-enum: [MM_PLACEMENT, MM_BORROWING, CNB_DEPOSIT_FACILITY, CNB_LOMBARD, FX_SPOT, CASH, TREASURY_BILL, BOND, BILL_OF_EXCHANGE, LOAN, FX_FORWARD, FX_SWAP, FRA, IRS, REPO, REVERSE_REPO]
    DraftProductType:
      # What a client may SEND: closed, so the server's validation is what the document says. A new
      # product widens it (additive for a request). Responses use the open ProductType above.
      type: string
      enum: [MM_PLACEMENT, MM_BORROWING, CNB_DEPOSIT_FACILITY, CNB_LOMBARD, FX_SPOT, CASH, TREASURY_BILL, BOND, BILL_OF_EXCHANGE, LOAN, FX_FORWARD, FX_SWAP, FRA, IRS, REPO, REVERSE_REPO]
    DealState:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, BOOKED, CONFIRMED, SETTLED, MATURED, CANCELLED, REVERSED]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            FOUR_EYES_VIOLATION, LIMIT_BREACHED, PRODUCT_LIMIT_BREACHED, ACTOR_NOT_PERMITTED,
            INVALID_STATE, NOT_FOUND, REFERENCE_NOT_EFFECTIVE, REFERENCE_BACKDATED, SENIOR_APPROVAL_REQUIRED, SCHEDULE_ENGINE_UNAVAILABLE
        message:
          type: [string, 'null']
        breaches:
          type: array
          description: PRODUCT_LIMIT_BREACHED only — each product-limit rule the deal breaks.
          items:
            type: object
            required: [rule, limit, actual]
            properties:
              rule:
                type: string
                enum: [PRODUCT_NOT_PERMITTED, CURRENCY_NOT_PERMITTED, MAX_PRINCIPAL, MAX_TENOR]
              limit: { type: string, description: 'The declared limit, e.g. "2000000000.00 CZK" or "366"' }
              actual: { type: string, description: "The deal's figure in the same unit" }
        missingReferences:
          type: array
          description: REFERENCE_NOT_EFFECTIVE only — each `kind:key` with no ACTIVE version on the trade date.
          items: { type: string }
    DraftDealRequest:
      type: object
      required: [product, counterpartyId, principal, rate]
      properties:
        product: { $ref: '#/components/schemas/DraftProductType' }
        counterpartyId: { type: string, examples: [SIMBK-A] }
        currency:
          type: string
          enum: [CZK, EUR]
          description: Required for money-market deals. For FX_SPOT optional; if given, the foreign currency.
        principal: { type: number, exclusiveMinimum: 0, description: 'For FX_SPOT the foreign-currency amount' }
        rate:
          type: number
          minimum: 0
          description: 'Annual percentage, ACT/360 (must be > 0 for CNB_LOMBARD); for FX_SPOT the deal rate in CZK per 1 unit of the foreign currency'
        tradeDate: { type: string, format: date, description: Defaults to today }
        valueDate:
          type: string
          format: date
          description: Required for money-market deals. For FX_SPOT defaults to T+2 business days, and may not be later.
        buyCurrency:
          type: string
          enum: [CZK, EUR]
          description: FX_SPOT only (required there) — the currency the bank buys.
        sellCurrency:
          type: string
          enum: [CZK, EUR]
          description: FX_SPOT only (required there) — the currency the bank sells.
        maturityDate:
          type: string
          format: date
          description: Omit for overnight (next business day). Ignored for CNB_DEPOSIT_FACILITY and CNB_LOMBARD (always overnight).
        rationale:
          type: string
          description: Required when an AI agent drafts (ADR-0315 D10).
        inputs:
          type: object
          additionalProperties: true
          description: >
            The data an AI agent built the draft from (quote, curve point, headroom, position), as a
            JSON object. Required with `rationale` when an AI agent drafts (ADR-0315 D10); optional
            for a human dealer. Stored and returned verbatim.
        kind: { $ref: '#/components/schemas/DealKind' }
        bookId: { type: string, description: A `book` reference key; required for the products added in 1.19.0 }
        calendars: { type: array, items: { type: string }, description: '`calendar` reference keys, e.g. [CERTIS, TARGET2]' }
        businessDayConvention: { $ref: '#/components/schemas/BusinessDayConvention' }
        rollDirection: { type: string, enum: [FROM_START, FROM_END] }
        legs:
          type: array
          description: >-
            Required for IRS, FRA, FX_FORWARD, FX_SWAP, REPO, REVERSE_REPO, LOAN; derived
            server-side from the flat fields for the five products before 1.19.0.
          items: { $ref: '#/components/schemas/LegSpec' }
        securityIsin: { type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$' }
        nominal: { type: number, exclusiveMinimum: 0 }
        cleanPrice: { type: number, exclusiveMinimum: 0 }
        yield: { type: number }
        linkedDealIds: { type: array, items: { type: string, format: uuid } }
        collateral: { $ref: '#/components/schemas/Collateral' }
        regulatory: { $ref: '#/components/schemas/RegulatoryTerms' }
        legalEntityId: { type: string, description: 'The booking entity; defaults to the bank' }
        counterpartyReference: { type: string, maxLength: 64, description: "The counterparty's own deal number" }
        channel: { type: string, enum: [PLATFORM, VOICE, ELECTRONIC, INTERNAL] }
        tradeDateTime: { type: string, format: date-time, description: tradeDate is derived from it in the bank zone when given }
        effectiveDate: { type: string, format: date }
        validFrom: { type: string, format: date, description: Framework or revolving deals }
        validTo: { type: string, format: date }
        jurisdiction: { type: string, pattern: '^[A-Z]{2}$' }
        fixedConvention: { type: boolean, default: false, description: Conventions frozen at trade; later reference-data changes do not regenerate the schedule }
        notionalExchange: { type: boolean }
        singleCurrency: { type: boolean }
        note: { type: string, maxLength: 2000 }
        settlementAccounts: { $ref: '#/components/schemas/SettlementAccounts' }
        documents: { type: array, items: { $ref: '#/components/schemas/DealDocument' } }
        fees: { type: array, items: { $ref: '#/components/schemas/DealFee' } }
        linkedDeals: { type: array, items: { $ref: '#/components/schemas/LinkedDeal' } }
        originalDealId: { type: [string, 'null'], format: uuid }
        securityTerms: { $ref: '#/components/schemas/SecurityTerms' }
        fxTerms: { $ref: '#/components/schemas/FxDealTerms' }
        fraTerms: { $ref: '#/components/schemas/FraTerms' }
    QuoteBoard:
      type: object
      required: [product, currency, tenorDays, synthetic, quotes]
      properties:
        product: { type: string, enum: [MM_PLACEMENT, MM_BORROWING] }
        currency: { type: string }
        tenorDays: { type: integer }
        synthetic: { type: boolean, const: true, description: Always true — invented counterparties, never a dealable market price. }
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/SimulatedQuote'
    SimulatedQuote:
      type: object
      required: [counterpartyId, synthetic, bid, ask, dealRate, mid, spreadBp, curveSetId, curveAsOf, curveIndex, curveProvenance]
      properties:
        counterpartyId: { type: string }
        synthetic: { type: boolean, const: true }
        bid: { type: number, description: 'Annual %, ACT/360 simple; what the counterparty pays for a deposit (floored at 0).' }
        ask: { type: number, description: 'Annual %, ACT/360 simple; what the counterparty charges to lend.' }
        dealRate: { type: number, description: 'The side a deal of the requested product is struck at: bid for MM_PLACEMENT, ask for MM_BORROWING.' }
        mid: { type: number, description: The curve mid for the tenor. }
        spreadBp: { type: integer, description: The counterparty's configured half-spread in basis points. }
        curveSetId: { type: string, format: uuid }
        curveAsOf: { type: string, format: date }
        curveIndex: { type: string }
        curveProvenance: { type: string, description: "The risk engine's label for the curve's market data (synthetic / production)." }
    ConfirmRequest:
      type: object
      properties:
        reference:
          type: [string, 'null']
          maxLength: 200
          description: The counterparty's confirmation reference, recorded on the deal's timeline.
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    LimitCheck:
      type: object
      properties:
        currency: { type: string }
        limit: { type: number }
        exposureBefore: { type: number }
        exposureAfter: { type: number }
        headroomAfter: { type: number }
        breached: { type: boolean }
    Transition:
      type: object
      properties:
        from: { oneOf: [{ $ref: '#/components/schemas/DealState' }, { type: 'null' }] }
        to: { $ref: '#/components/schemas/DealState' }
        actor: { type: string }
        actorType: { type: string, enum: [HUMAN, AI_AGENT, SERVICE, SYSTEM] }
        at: { type: string, format: date-time }
        note: { type: [string, 'null'] }
        limitSnapshot:
          description: >
            The limit-check figures when `note` is a limit note (submit/approve), else null. Added
            in 1.16.0 so clients render the figures instead of parsing `note`, which stays as is.
          oneOf:
            - type: 'null'
            - type: object
              properties:
                limit: { type: number }
                currency: { type: string }
                exposureAfter: { type: number }
                headroomAfter: { type: number }
    PostingRule:
      type: object
      required: [product, event, recognition, lines, version]
      properties:
        product: { $ref: '#/components/schemas/ProductType' }
        event:
          type: string
          x-extensible-enum: [SETTLED, ACCRUED, MATURED, REVERSED, TRADE, SETTLEMENT, ACCRUAL, FIXING, PAYMENT,
                              AMORTISATION, REVALUATION, MATURITY, EARLY_TERMINATION, CORRECTION]
        ifrs9Category: { type: [string, 'null'], enum: [AMORTISED_COST, FVOCI, FVTPL, null], description: 'null = every category' }
        recognition: { type: string, enum: [TRADE_DATE, SETTLEMENT_DATE] }
        flowKind: { type: [string, 'null'], description: 'the flow kind the row applies to; null = any' }
        flowDirection: { type: [string, 'null'], enum: [IN, OUT, null] }
        lines:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              side: { type: string, enum: [DEBIT, CREDIT] }
              accountingClass: { type: string, maxLength: 64, description: 'ledger accounting class (ADR-0341 D3); DEBT_SECURITY resolves by the book''s IFRS 9 category. The ledger maps class + role + currency to a GL account.' }
              accountingRole: { type: string, maxLength: 32 }
              amountExpression: { type: string }
        version: { type: integer }
    JournalRef:
      type: object
      properties:
        event:
          type: string
          description: >-
            The posting event. Open set: the legacy products post settled/accrued/matured/reversed (the
            server has always returned accrued), the posting-rule matrix adds its own events (ADR-0344 D7).
          x-extensible-enum: [settled, accrued, matured, reversed, trade, settlement, accrual, fixing, payment, amortisation,
                              revaluation, maturity, early-termination, correction]
        idempotencyKey: { type: string, examples: ['treasury:0191c0de-0000-7000-8000-000000000001:settled'] }
        journalId: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
    LimitOverride:
      type: object
      description: A senior approver's override of a counterparty-limit breach (ADR-0315 D4).
      properties:
        by: { type: string }
        reason: { type: string }
        at: { type: string, format: date-time }
        coversExposureUpTo: { type: number }
        limitAtOverride: { type: number }
    FxTerms:
      type: object
      description: FX_SPOT only (#10896) — both legs from the bank's side, and the rate check.
      properties:
        side: { type: string, enum: [BUY, SELL], description: The bank's side on the foreign currency }
        buyCurrency: { type: string }
        buyAmount: { type: number }
        sellCurrency: { type: string }
        sellAmount: { type: number }
        dealRate: { type: number, description: CZK per 1 unit of the foreign currency }
        midRate: { type: [number, 'null'], description: fx-service mid at drafting, when the check ran }
        rateFlag: { type: [string, 'null'], description: Why the rate was flagged; null when not flagged }
    Deal:
      type: object
      properties:
        dealId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductType' }
        counterpartyId: { type: string }
        currency: { type: string }
        principal: { type: number }
        rate: { type: number }
        dayCount: { type: string, enum: [ACT/360] }
        days: { type: integer }
        interest: { type: number, description: 'ACT/360 interest at maturity, 2 dp half-up' }
        tradeDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        state: { $ref: '#/components/schemas/DealState' }
        createdBy: { type: string }
        createdByType: { type: string }
        submittedBy: { type: [string, 'null'] }
        approvedBy: { type: [string, 'null'] }
        rationale: { type: [string, 'null'] }
        inputs:
          type: [string, 'null']
          description: The JSON object an AI agent's draft was built from, serialised verbatim (ADR-0315 D10).
        limitCheck:
          oneOf:
            - $ref: '#/components/schemas/LimitCheck'
            - type: 'null'
        limitOverride:
          oneOf:
            - $ref: '#/components/schemas/LimitOverride'
            - type: 'null'
        fx:
          oneOf:
            - $ref: '#/components/schemas/FxTerms'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          items: { $ref: '#/components/schemas/Transition' }
        journals:
          type: array
          items: { $ref: '#/components/schemas/JournalRef' }
        kind: { $ref: '#/components/schemas/DealKind' }
        bookId: { type: [string, 'null'] }
        legs:
          type: array
          items: { $ref: '#/components/schemas/LegSpec' }
        scheduleVersion: { type: integer, description: 0 until the first schedule is generated at submission }
        scheduleHash: { type: [string, 'null'] }
        version: { type: integer }
        securityIsin: { type: [string, 'null'] }
        regulatory:
          oneOf:
            - $ref: '#/components/schemas/RegulatoryTerms'
            - type: 'null'
        linkedDealIds: { type: array, items: { type: string, format: uuid } }
        collateral:
          oneOf:
            - $ref: '#/components/schemas/Collateral'
            - type: 'null'
        legalEntityId: { type: string, description: 'The booking entity; defaults to the bank' }
        counterpartyReference: { type: string, maxLength: 64, description: "The counterparty's own deal number" }
        channel: { type: string, enum: [PLATFORM, VOICE, ELECTRONIC, INTERNAL] }
        tradeDateTime: { type: string, format: date-time, description: tradeDate is derived from it in the bank zone when given }
        effectiveDate: { type: string, format: date }
        validFrom: { type: string, format: date, description: Framework or revolving deals }
        validTo: { type: string, format: date }
        jurisdiction: { type: string, pattern: '^[A-Z]{2}$' }
        fixedConvention: { type: boolean, default: false, description: Conventions frozen at trade; later reference-data changes do not regenerate the schedule }
        notionalExchange: { type: boolean }
        singleCurrency: { type: boolean }
        note: { type: string, maxLength: 2000 }
        settlementAccounts: { oneOf: [{ $ref: '#/components/schemas/SettlementAccounts' }, { type: 'null' }] }
        documents: { type: array, items: { $ref: '#/components/schemas/DealDocument' } }
        fees: { type: array, items: { $ref: '#/components/schemas/DealFee' } }
        linkedDeals: { type: array, items: { $ref: '#/components/schemas/LinkedDeal' } }
        originalDealId: { type: [string, 'null'], format: uuid }
        securityTerms: { $ref: '#/components/schemas/SecurityTerms' }
        fxTerms: { $ref: '#/components/schemas/FxDealTerms' }
        fraTerms: { $ref: '#/components/schemas/FraTerms' }
        counterpartyName: { type: [string, 'null'] }
        notional: { type: number, description: First leg notional (= principal for the legacy products) }
        lastChangedAt: { type: string, format: date-time }
        lastChangedBy: { type: string }
        creditExposureCheck:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                counterparty: { $ref: '#/components/schemas/LimitCheck' }
                product: { type: object, properties: { breached: { type: boolean }, breaches: { type: array, items: { type: object } } } }
                override: { oneOf: [{ $ref: '#/components/schemas/LimitOverride' }, { type: 'null' }] }
    CounterpartyLimit:
      type: object
      properties:
        counterpartyId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [BANK, CENTRAL_BANK] } # 1.19.0: CORPORATE and ISSUER counterparties are not listed here (closed response enum); see GET /reference/counterparty
        synthetic: { type: boolean }
        currency: { type: string }
        limit: { type: number }
        exposure: { type: number }
        headroom: { type: number }
    LimitUtilisation:
      type: object
      properties:
        limits:
          type: array
          items:
            type: object
            properties:
              counterpartyId: { type: string }
              name: { type: string }
              synthetic: { type: boolean }
              currency: { type: string }
              limit: { type: number }
              utilised: { type: number }
              available: { type: number }
              utilisationPercent: { type: number }
              breached: { type: boolean }
              activeOverrides: { type: integer }
    Positions:
      type: object
      properties:
        asOf: { type: string, format: date }
        today: { type: string, format: date, description: The accounting day (Europe/Prague) asOf was judged against }
        basis:
          type: string
          enum: [ACTUAL, PROJECTED]
          description: ACTUAL when asOf <= today (settled deals only), PROJECTED when asOf is after today
        countedStates:
          type: array
          description: The deal states this answer counted
          items: { $ref: '#/components/schemas/DealState' }
        positions:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              dealCount: { type: integer, description: Deals outstanding in this currency on asOf }
              placed: { type: number }
              borrowed: { type: number }
              atCnb: { type: number }
              net: { type: number, description: placed + atCnb − borrowed }
    NostroStatement:
      type: object
      properties:
        id: {type: string, format: uuid}
        statementId: {type: string}
        iban: {type: string}
        glCode: {type: string}
        currency: {type: string}
        statementDate: {type: string, format: date}
        openingBalance: {type: number, description: Signed from the bank's side; positive = CRDT}
        closingBalance: {type: number}
        entryCount: {type: integer}
        sha256: {type: string, description: SHA-256 of the uploaded bytes}
        uploadedBy: {type: string}
        uploadedAt: {type: string, format: date-time}
    NostroBreak:
      type: object
      required: [breakId, side, ourSide, amount, currency, bookingDate, statementUuid, firstSeenOn, ageBusinessDays, aged]
      properties:
        breakId: {type: string, format: uuid}
        side: {type: string, enum: [STATEMENT, LEDGER], description: Which side the unmatched item is on}
        ourSide: {type: string, enum: [DEBIT, CREDIT], description: From the bank's side; a statement CRDT is a DEBIT}
        amount: {type: number}
        currency: {type: string}
        bookingDate: {type: string, format: date}
        reference: {type: [string, 'null']}
        statementUuid: {type: string, format: uuid, description: The statement whose reconciliation first saw it}
        statementSequence: {type: [integer, 'null']}
        ledgerLineId: {type: [string, 'null'], format: uuid}
        firstSeenOn: {type: string, format: date}
        resolvedOn: {type: [string, 'null'], format: date}
        ageBusinessDays: {type: integer, description: Business days from firstSeenOn to today (or to resolvedOn)}
        aged: {type: boolean, description: Open and over both alert thresholds}
        alertedAt: {type: [string, 'null'], format: date-time}
    NostroBreakList:
      type: object
      required: [iban, alertAgeDays, alertMinAmount, breaks]
      properties:
        iban: {type: string}
        alertAgeDays: {type: integer}
        alertMinAmount: {type: number}
        breaks:
          type: array
          items: {$ref: '#/components/schemas/NostroBreak'}
    NostroStatementEntry:
      type: object
      properties:
        sequence: {type: integer}
        amount: {type: number}
        currency: {type: string}
        direction: {type: string, enum: [CRDT, DBIT]}
        bookingDate: {type: string, format: date}
        reference: {type: [string, 'null']}
    NostroLedgerLine:
      type: object
      properties:
        journalId: {type: string, format: uuid}
        lineId: {type: string, format: uuid}
        transactionId: {type: string, format: uuid}
        entryDate: {type: string, format: date}
        side: {type: string, enum: [DEBIT, CREDIT]}
        amount: {type: number}
        currency: {type: string}
        description: {type: [string, 'null']}
    NostroMatch:
      type: object
      properties:
        matchType: {type: string, enum: [EXACT, AMOUNT_DATE]}
        entry: {$ref: '#/components/schemas/NostroStatementEntry'}
        ledgerLine: {$ref: '#/components/schemas/NostroLedgerLine'}
    NostroReconciliation:
      type: object
      properties:
        statementUuid: {type: string, format: uuid}
        statementId: {type: string}
        iban: {type: string}
        glCode: {type: string}
        currency: {type: string}
        statementDate: {type: string, format: date}
        statementOpeningBalance: {type: number}
        ledgerOpeningBalance:
          type: [number, 'null']
          description: >
            Ledger GL net (debit − credit of native amounts in the statement currency) as of the
            opening (OPBD) balance's date. NULL only when the ledger does not hold the
            GL account (see balanceNotStated).
        openingDifference: {type: [number, 'null'], description: NULL whenever ledgerOpeningBalance is}
        statementClosingBalance: {type: number}
        ledgerClosingBalance:
          type: [number, 'null']
          description: Ledger GL net in the statement currency as of the closing (CLBD) balance's date. NULL as ledgerOpeningBalance.
        closingDifference: {type: [number, 'null'], description: NULL whenever ledgerClosingBalance is}
        balanceNotStated:
          type: [string, 'null']
          description: >
            Why the ledger balances are NULL. Balances are read in the statement currency for every
            nostro (CZK and foreign alike), so this is set only when the ledger answers that it
            does not hold the GL account (404) — a chart not yet migrated in that environment. NULL
            whenever the balances are stated.
        reconciled:
          type: [boolean, 'null']
          description: >
            true when no item is unmatched on either side and both differences are zero; false on
            any unmatched item or non-zero difference; NULL when every item matched but the
            balances could not be compared (balanceNotStated).
        matches:
          type: array
          items: {$ref: '#/components/schemas/NostroMatch'}
        unmatchedStatementEntries:
          type: array
          items: {$ref: '#/components/schemas/NostroStatementEntry'}
        unmatchedLedgerLines:
          type: array
          items: {$ref: '#/components/schemas/NostroLedgerLine'}
        outOfPeriodEntries:
          type: array
          description: >
            Statement entries booked outside the period its balances describe (after the OPBD date,
            up to the CLBD date). Refused at upload today; a statement stored before that rule still
            reconciles, and each such entry is listed here AND in unmatchedStatementEntries.
          items: {$ref: '#/components/schemas/NostroStatementEntry'}
    PortfolioPosition:
      type: object
      required: [instrumentClass, isin, cfi, quantity, quantityBasis, valuation, valuationCurrency]
      properties:
        instrumentClass:
          type: string
          description: Mapped from the CFI by the configured prefix mapping (openbank.treasury.portfolio.cfi-classes)
        isin: {type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$'}
        cfi: {type: string, pattern: '^[A-Z]{6}$'}
        quantity: {type: string, description: 'Quantity in quantityBasis, as stated (decimal string)'}
        quantityBasis:
          type: string
          enum: [UNIT, FACE_AMOUNT, AMORTISED_VALUE]
          description: Custodian-stated quantity dimension; never inferred from CFI. Unknown legacy dimensions refuse the report.
        valuation: {type: string, description: 'Holding value in valuationCurrency (decimal string)'}
        valuationCurrency: {type: string}
    PeriodEndPortfolio:
      type: object
      required: [asOf, entity, currency, sourceStatements, positions]
      properties:
        asOf: {type: string, format: date}
        entity: {type: string}
        currency: {type: string}
        sourceStatements:
          type: array
          minItems: 1
          description: Current statement for every configured safekeeping account; sorted by account.
          items: {$ref: '#/components/schemas/PortfolioSourceStatement'}
        positions:
          type: array
          items: {$ref: '#/components/schemas/PortfolioPosition'}
    PortfolioSourceStatement:
      type: object
      required: [safekeepingAccount, statementUuid, version]
      properties:
        safekeepingAccount: {type: string}
        statementUuid: {type: string, format: uuid}
        statementId: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
    PortfolioStatement:
      type: object
      required: [id, entity, safekeepingAccount, statementDate, currency, version, positionCount, sha256, uploadedBy, uploadedAt]
      properties:
        id: {type: string, format: uuid}
        entity: {type: string}
        statementId: {type: [string, 'null']}
        safekeepingAccount: {type: string}
        statementDate: {type: string, format: date}
        currency: {type: string}
        version: {type: integer, minimum: 1}
        supersedes: {type: [string, 'null'], format: uuid}
        supersededBy: {type: [string, 'null'], format: uuid}
        supersededAt: {type: [string, 'null'], format: date-time}
        positionCount: {type: integer}
        sha256: {type: string}
        uploadedBy: {type: string}
        uploadedAt: {type: string, format: date-time}
    DealKind:
      type: string
      description: >-
        ACTUAL books, posts and pays; PLANNED feeds the liquidity forecast and never posts or pays;
        HYPOTHETICAL is priced only and can never be submitted (ADR-0344 D2).
      enum: [ACTUAL, PLANNED, HYPOTHETICAL]
    BusinessDayConvention:
      type: string
      enum: [UNADJUSTED, FOLLOWING, MODIFIED_FOLLOWING, PRECEDING, MODIFIED_PRECEDING]
    DayCountConvention:
      type: string
      enum: [ACT/360, ACT/365F, ACT/ACT_ISDA, 30/360, 30E/360]
    Frequency:
      type: string
      enum: [ONCE, DAILY, WEEKLY, MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL]
    LegRate:
      type: object
      required: [type]
      description: '`type: FIXED` needs `rate`; `type: FLOATING` needs `index` (and takes the rest).'
      properties:
        type: { type: string, enum: [FIXED, FLOATING, NONE], description: NONE is an exchange-only leg (FX) }
        rate: { type: [number, 'null'], description: FIXED — annual percentage }
        index: { type: [string, 'null'], description: 'FLOATING — an `index` reference key, e.g. PRIBOR_3M' }
        spread: { type: [number, 'null'], description: FLOATING — added to the index, in percentage points }
        fixingLagBusinessDays: { type: [integer, 'null'], minimum: 0 }
        resetFrequency: { oneOf: [{ $ref: '#/components/schemas/Frequency' }, { type: 'null' }] }
        cap: { type: [number, 'null'] }
        floor: { type: [number, 'null'] }
        capFloorAppliesTo: { type: [string, 'null'], enum: [INDEX, INDEX_PLUS_SPREAD, null] }
        rateUntilFirstFixing: { type: [number, 'null'] }
    Amortisation:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [BULLET, LINEAR, ANNUITY, CUSTOM] }
        schedule:
          type: array
          description: CUSTOM only — principal repayments.
          items:
            type: object
            required: [date, amount]
            properties:
              date: { type: string, format: date }
              amount: { type: number }
    LegSpec:
      type: object
      description: One leg of an instrument; mirrors the shared schedule engine's leg spec (ADR-0344 D2).
      required: [payReceive, currency, notional, accrualStart, accrualEnd, dayCount, rate]
      properties:
        payReceive: { type: string, enum: [PAY, RECEIVE] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        notional: { type: number, exclusiveMinimum: 0 }
        amortisation: { $ref: '#/components/schemas/Amortisation' }
        accrualStart: { type: string, format: date }
        accrualEnd: { type: string, format: date }
        accrualFrequency: { $ref: '#/components/schemas/Frequency' }
        paymentFrequency: { $ref: '#/components/schemas/Frequency' }
        stub: { type: string, enum: [SHORT_INITIAL, LONG_INITIAL, SHORT_FINAL, LONG_FINAL, NONE] }
        adjustPaymentDate: { type: boolean, default: true }
        adjustAccrualPeriod: { type: boolean, default: false }
        paymentLagBusinessDays: { type: integer, minimum: 0, default: 0 }
        dayCount: { $ref: '#/components/schemas/DayCountConvention' }
        rate: { $ref: '#/components/schemas/LegRate' }
        initialNotionalExchange: { type: boolean, default: false }
        finalNotionalExchange: { type: boolean, default: false }
        amortisationStart: { type: [string, 'null'], format: date }
        paymentCalendars: { type: array, items: { type: string }, description: '`calendar` keys; empty = the deal calendars' }
        endOfMonth: { type: boolean, default: false, description: 'ISDA end-of-month rule: a month-end anchor rolls to month ends' }
    RegulatoryTerms:
      type: object
      properties:
        tradeReporting:
          type: [object, 'null']
          properties:
            uti: { type: [string, 'null'], maxLength: 52 }
            counterpartyLei: { type: [string, 'null'], pattern: '^[A-Z0-9]{20}$' }
            clearingObligation: { type: [boolean, 'null'] }
            collateralisation: { type: [string, 'null'], enum: [UNCOLLATERALISED, PARTIALLY, ONE_WAY, FULLY, null] }
        centralBankCodes: { type: array, items: { type: string } }
        emir:
          description: Deprecated alias of tradeReporting (kept for the first 1.19.0 drafts).
          type: [object, 'null']
          properties:
            uti: { type: [string, 'null'], maxLength: 52 }
            reportingCounterpartyLei: { type: [string, 'null'], pattern: '^[A-Z0-9]{20}$' }
            clearingObligation: { type: boolean }
            collateralisation: { type: string, enum: [UNCOLLATERALISED, PARTIALLY, ONE_WAY, FULLY] }
        cnbCodes: { type: array, items: { type: string } }
        lcrCategory: { type: [string, 'null'] }
        nsfrCategory: { type: [string, 'null'] }
    Collateral:
      type: object
      required: [securityIsin, nominal, haircutPercent]
      properties:
        securityIsin: { type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$' }
        nominal: { type: number, exclusiveMinimum: 0 }
        haircutPercent: { type: number, minimum: 0, maximum: 100 }
        dirtyPrice: { type: [number, 'null'] }
        substitutionAllowed: { type: boolean, default: false }
        marginCallThreshold: { type: [number, 'null'] }
    CashFlowLedger:
      type: object
      required: [dealId, dealVersion, scheduleVersion, flows]
      properties:
        dealId: { type: string, format: uuid }
        dealVersion: { type: integer }
        scheduleVersion: { type: integer, description: 0 when no schedule has been generated }
        scheduleHash: { type: [string, 'null'], description: SHA-256 over the leg specs and the reference data used }
        generatedAt: { type: [string, 'null'], format: date-time }
        flows:
          type: array
          items: { $ref: '#/components/schemas/CashFlow' }
    CashFlow:
      type: object
      required: [flowId, legIndex, periodIndex, kind, direction, currency, paymentDate, rateSource, state, manual]
      properties:
        flowId: { type: string, format: uuid }
        legIndex: { type: integer, minimum: 0 }
        periodIndex: { type: integer, minimum: -1, description: '-1 is the initial notional exchange' }
        kind: { type: string, enum: [PRINCIPAL, INTEREST, FEE, NOTIONAL_EXCHANGE, PREMIUM] }
        direction: { type: string, enum: [IN, OUT], description: "From the bank's side" }
        currency: { type: string }
        accrualStart: { type: [string, 'null'], format: date }
        accrualEnd: { type: [string, 'null'], format: date }
        fixingDate: { type: [string, 'null'], format: date }
        paymentDate: { type: string, format: date, description: "The effective date (the override's when one is approved)" }
        notional: { type: [number, 'null'] }
        rate: { type: [number, 'null'] }
        rateSource: { type: string, enum: [FIXED, OBSERVED, PROJECTED, RATE_UNTIL_FIRST_FIXING, MISSING] }
        amount: { type: [number, 'null'], description: Null while a floating amount is unknown }
        state:
          type: string
          enum: [PROJECTED, FIXED, DUE, SETTLED, POSTED, CANCELLED]
        manual: { type: boolean, description: true when an approved override changed this flow }
        original:
          description: The generated values an approved override replaced
          oneOf:
            - type: 'null'
            - type: object
              properties:
                paymentDate: { type: string, format: date }
                amount: { type: [number, 'null'] }
        override:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                overrideId: { type: string, format: uuid }
                reason: { type: string }
                by: { type: string }
                approvedBy: { type: string }
        paymentId: { type: [string, 'null'] }
        journalRefs: { type: array, items: { type: string } }
    CashFlowOverrideRequest:
      type: object
      required: [reason]
      properties:
        paymentDate: { type: [string, 'null'], format: date }
        amount: { type: [number, 'null'], minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CashFlowOverride:
      type: object
      required: [overrideId, dealId, flowId, status, reason, proposedBy, proposedAt]
      properties:
        overrideId: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        flowId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CONFLICT] }
        paymentDate: { type: [string, 'null'], format: date }
        amount: { type: [number, 'null'] }
        reason: { type: string }
        proposedBy: { type: string }
        proposedByType: { type: string, enum: [HUMAN, AI_AGENT, SERVICE, SYSTEM] }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
    CashFlowConflict:
      type: object
      required: [conflictId, dealId, overrideId, legIndex, periodIndex, detectedAt, reason]
      properties:
        conflictId: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        overrideId: { type: string, format: uuid }
        legIndex: { type: integer }
        periodIndex: { type: integer }
        fromScheduleVersion: { type: integer }
        toScheduleVersion: { type: integer }
        detectedAt: { type: string, format: date-time }
        reason: { type: string }
    DealVersion:
      type: object
      required: [dealId, version, createdAt]
      properties:
        dealId: { type: string, format: uuid }
        version: { type: integer }
        scheduleVersion: { type: [integer, 'null'] }
        scheduleHash: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        changes:
          type: array
          description: Field-level summary of what differs from the previous version
          items: { type: string }
    ReferenceKind:
      type: string
      enum: [calendar, index, counterparty, ssi, netting, security, book, bucket-set, regulatory-code,
             party-group, party-type, country, document-type, account, settlement-place, product-type,
             loan-type, communication-channel, market-factor, own-capital-item, period-length, scenario,
             behavioural-scenario, calculation-settings, limit-settings, derivative-conversion-factor,
             collateral-haircut, portfolio-group, accounting-settings, balance-sheet-side, dealing-filter,
             internal-rate-sheet]
    ReferenceStatus:
      type: string
      enum: [PENDING, ACTIVE, SUPERSEDED, REJECTED]
    ReferenceProposal:
      type: object
      required: [key, validFrom, payload, reason]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date, description: Exclusive end; null is open-ended }
        payload: { $ref: '#/components/schemas/ReferencePayload' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ReferenceRecord:
      type: object
      required: [kind, key, version, status, validFrom, verified, payload, createdBy, createdAt]
      properties:
        kind: { $ref: '#/components/schemas/ReferenceKind' }
        key: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/ReferenceStatus' }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        verified: { type: boolean }
        payload: { $ref: '#/components/schemas/ReferencePayload' }
        createdBy: { type: string }
        createdByType: { type: string, enum: [HUMAN, AI_AGENT, SERVICE, SYSTEM] }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        verifiedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'] }
        approvalNote: { type: [string, 'null'], description: 'What the approval changed, e.g. a counterparty''s limits before and after' }
    ReferenceHistory:
      type: object
      required: [kind, key, versions]
      properties:
        kind: { $ref: '#/components/schemas/ReferenceKind' }
        key: { type: string }
        active:
          oneOf:
            - $ref: '#/components/schemas/ReferenceRecord'
            - type: 'null'
        versions:
          type: array
          items: { $ref: '#/components/schemas/ReferenceRecord' }
    ReferenceDependencies:
      type: object
      required: [kind, key, dependants]
      properties:
        kind: { $ref: '#/components/schemas/ReferenceKind' }
        key: { type: string }
        dependants:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, description: 'deal, or a reference kind (index, security, ssi, netting, book, ...)' }
              id: { type: string }
              field: { type: string, description: Which field of the dependant names this record }
    ReferencePayload:
      description: The payload for the record's kind; validated per kind on proposal.
      anyOf:
        - $ref: '#/components/schemas/CalendarPayload'
        - $ref: '#/components/schemas/IndexPayload'
        - $ref: '#/components/schemas/CounterpartyPayload'
        - $ref: '#/components/schemas/SsiPayload'
        - $ref: '#/components/schemas/NettingPayload'
        - $ref: '#/components/schemas/SecurityPayload'
        - $ref: '#/components/schemas/BookPayload'
        - $ref: '#/components/schemas/BucketSetPayload'
        - $ref: '#/components/schemas/RegulatoryCodePayload'
        - $ref: '#/components/schemas/ProductTypePayload'
        - $ref: '#/components/schemas/GenericReferencePayload'
    CalendarPayload:
      type: object
      required: [code, baseCalendar]
      properties:
        code: { type: string }
        baseCalendar: { type: string, enum: [CERTIS, TARGET2, WEEKEND_ONLY] }
        extraHolidays: { type: array, items: { type: string, format: date } }
        removedHolidays: { type: array, items: { type: string, format: date } }
    IndexPayload:
      type: object
      required: [code, currency, tenor, dayCount, fixingLagBusinessDays, fixingCalendar, source]
      properties:
        code: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        tenor: { type: string, pattern: '^(ON|[0-9]+[DWMY])$' }
        dayCount: { $ref: '#/components/schemas/DayCountConvention' }
        fixingLagBusinessDays: { type: integer, minimum: 0 }
        fixingCalendar: { type: string }
        source: { type: string, enum: [CNB, ECB, MANUAL, FEED] }
        staleAfterBusinessDays: { type: integer, minimum: 0 }
        suspiciousJumpBp: { type: integer, minimum: 0 }
    CounterpartyPayload:
      type: object
      required: [id, name, kind, countryCode]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [BANK, CENTRAL_BANK, CORPORATE, ISSUER] }
        lei: { type: [string, 'null'], pattern: '^[A-Z0-9]{20}$' }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        limits: { type: object, additionalProperties: { type: number, minimum: 0 } }
        nettingAgreementId: { type: [string, 'null'] }
    SsiPayload:
      type: object
      required: [counterpartyId, currency, rail, beneficiaryAccount]
      properties:
        counterpartyId: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        rail: { type: string, enum: [CERTIS, SEPA, TARGET2, SWIFT] }
        beneficiaryAccount: { type: string, minLength: 1, maxLength: 34 }
        bic: { type: [string, 'null'], pattern: '^[A-Z0-9]{8}([A-Z0-9]{3})?$' }
        intermediaryBic: { type: [string, 'null'], pattern: '^[A-Z0-9]{8}([A-Z0-9]{3})?$' }
    NettingPayload:
      type: object
      required: [id, counterpartyId, currencies, paymentNetting]
      properties:
        id: { type: string }
        counterpartyId: { type: string }
        currencies: { type: array, items: { type: string } }
        paymentNetting: { type: boolean }
    SecurityPayload:
      type: object
      required: [isin, name, issuerId, type, currency, issueDate, maturityDate, denomination, dayCount, businessDayConvention, calendar]
      properties:
        isin: { type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$' }
        name: { type: string }
        issuerId: { type: string }
        type: { type: string, enum: [BOND, TREASURY_BILL, BILL_OF_EXCHANGE] }
        currency: { type: string }
        issueDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        denomination: { type: number, exclusiveMinimum: 0 }
        couponRate: { type: [number, 'null'] }
        couponFrequency: { oneOf: [{ $ref: '#/components/schemas/Frequency' }, { type: 'null' }] }
        dayCount: { $ref: '#/components/schemas/DayCountConvention' }
        businessDayConvention: { $ref: '#/components/schemas/BusinessDayConvention' }
        calendar: { type: string }
    BookPayload:
      type: object
      required: [id, name, purpose, ifrs9Category]
      properties:
        id: { type: string }
        parentId: { type: [string, 'null'] }
        name: { type: string }
        purpose: { type: string, enum: [BANKING_BOOK, TRADING_BOOK] }
        ifrs9Category: { type: string, enum: [AMORTISED_COST, FVOCI, FVTPL] }
    BucketSetPayload:
      type: object
      required: [id, name, buckets]
      properties:
        id: { type: string }
        name: { type: string }
        buckets:
          type: array
          minItems: 1
          items:
            type: object
            required: [label, fromDays]
            properties:
              label: { type: string }
              fromDays: { type: integer, minimum: 0 }
              toDays: { type: [integer, 'null'] }
    RegulatoryCodePayload:
      type: object
      required: [list, code, label]
      properties:
        list: { type: string, enum: [CNB, DISIFE23, EMIR_PRODUCT, LCR, NSFR, TRADE_REPORTING, CLASSIFICATION] }
        code: { type: string }
        label: { type: string }
    SettlementAccounts:
      type: object
      properties:
        cashAccountId: { type: string }
        securitiesAccountId: { type: [string, 'null'] }
    DealDocument:
      type: object
      required: [documentId, type]
      properties:
        documentId: { type: string }
        type: { type: string, enum: [CONFIRMATION, TERM_SHEET, SIGNED_SCAN, OTHER] }
    DealFee:
      type: object
      required: [type, amount, currency, paymentDate]
      properties:
        type: { type: string, maxLength: 32 }
        amount: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        paymentDate: { type: string, format: date }
    LinkedDeal:
      type: object
      required: [dealId, relation]
      properties:
        dealId: { type: string, format: uuid }
        relation: { type: string, enum: [HEDGE, ROLLOVER, NETTING_SET, AMENDS, ORIGINAL] }
    SecurityTerms:
      type: object
      description: Securities products (bond, bill, repo collateral side)
      properties:
        securityIsin: { type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$' }
        nominal: { type: number, exclusiveMinimum: 0 }
        cleanPrice: { type: [number, 'null'] }
        yield: { type: [number, 'null'] }
        accruedInterest: { type: [number, 'null'] }
        settlementPlace: { type: [string, 'null'], description: A `settlement-place` reference key }
        custodyAccountId: { type: [string, 'null'] }
    FxDealTerms:
      type: object
      description: FX forward / swap terms
      properties:
        buyCurrency: { type: string }
        buyAmount: { type: number }
        sellCurrency: { type: string }
        sellAmount: { type: number }
        rate: { type: number }
        forwardPoints: { type: [number, 'null'] }
        nearDate: { type: [string, 'null'], format: date }
        farDate: { type: [string, 'null'], format: date }
        nearRate: { type: [number, 'null'] }
        farRate: { type: [number, 'null'] }
    FraTerms:
      type: object
      properties:
        period: { type: string, pattern: '^[0-9]+x[0-9]+$', examples: ['3x6'] }
        settlementConvention: { type: string, enum: [ADVANCE_DISCOUNTED, ARREARS] }
    PositionCloseRequest:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        bookId: { type: [string, 'null'] }
        scenario: { type: [string, 'null'] }
    PositionClose:
      type: object
      properties:
        snapshotId: { type: string, format: uuid }
        date: { type: string, format: date }
        bookId: { type: [string, 'null'] }
        scenario: { type: [string, 'null'] }
        special: { type: boolean }
        closedBy: { type: string }
        closedAt: { type: string, format: date-time }
        positions: { type: array, items: { type: object, additionalProperties: true } }
    SavedDealFilter:
      type: object
      required: [name, filter]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        filter: { type: object, additionalProperties: true, description: The GET /deals query parameters }
        updatedAt: { type: string, format: date-time }
    TreasuryEvent:
      type: object
      required: [date, type, description, dealId]
      properties:
        date: { type: string, format: date }
        type: { type: string, enum: [REFIXING, INTEREST_PAYMENT, PRINCIPAL_PAYMENT, MATURITY, OPTION_EXERCISE, MARGIN_CALL, SETTLEMENT] }
        description: { type: string }
        dealId: { type: string, format: uuid }
        flowId: { type: [string, 'null'], format: uuid }
        paymentId: { type: [string, 'null'] }
        responsibleRole: { type: string }
    ProductTypePayload:
      type: object
      description: 'product-type: the mandate per product (migrated from configuration); authoritative over the configured seed'
      required: [code, permitted]
      properties:
        code: { type: string }
        permitted: { type: boolean }
        allowedCurrencies: { type: array, items: { type: string } }
        maxPrincipal: { type: object, additionalProperties: { type: number }, description: Per currency }
        maxTenorDays: { type: [integer, 'null'] }
    GenericReferencePayload:
      type: object
      description: >-
        The kinds without a dedicated schema yet: a JSON object whose `code` (or `id`) is the record
        key, plus `name`; other fields are stored as given.
      properties:
        code: { type: string }
        id: { type: string }
        name: { type: string }
      additionalProperties: true
