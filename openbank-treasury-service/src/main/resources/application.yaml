quarkus:
  application:
    name: openbank-treasury-service
  http:
    port: 8160
    test-port: 0
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      Referrer-Policy:
        value: no-referrer
      Permissions-Policy:
        value: geolocation=(), microphone=(), camera=()
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: max-age=31536000; includeSubDomains
    limits:
      max-body-size: 1M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_treasury
      idle-timeout: 5M
      max-lifetime: 30M
      max-size: 20
    # A LITERAL jdbc url: Flyway migrates the DEFAULT (Agroal/JDBC) datasource (#3080).
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_treasury

  flyway:
    # Committing migrations does not run them — this key defaults to FALSE (#3350).
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  hibernate-orm:
    database:
      generation: none

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    # No `tls.verification: none` here: %prod keeps the default `required`. The relaxation lives
    # under "%dev" only (security review, HIGH).

  # The ledger rest-client carries @OidcClientFilter("m2m"): its bearer is minted by the NAMED
  # client below — Keycloak client `openbank-treasury`, ROLE_API only (#10486) — and
  # ledger_rest_ext.rego grants that principal exactly ledger.create. The default client exists
  # because quarkus-oidc-client expects one; no rest-client here uses it.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    m2m:
      auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
      client-id: openbank-treasury
      credentials:
        secret: ${OIDC_M2M_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
      grant:
        type: client

  rest-client:
    ledger-service:
      # Local default only. The in-cluster URL (ledger's mTLS listener, 8443) is declared in the
      # gitops Deployment env where gen-network-policies.py can see the edge.
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
      connect-timeout: 2000
      read-timeout: 5000
    # ADR-0315 D9: the risk engine's curve sets for the simulated quotes (read-only, m2m identity).
    # Local default only; the in-cluster URL (the engine's mTLS listener, 8443) is declared in the
    # gitops Deployment env where gen-network-policies.py can see the edge.
    risk-engine:
      url: ${RISK_ENGINE_URL:http://localhost:8159}
      connect-timeout: 2000
      read-timeout: 5000

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    console:
      format: '%d{HH:mm:ss} %-5p [%c{3.}] %s%e%n'

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-treasury-service

  management:
    enabled: true
    port: 8090
    host: 0.0.0.0
    root-path: /q

  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      treasury-events-out:
        connector: smallrye-kafka
        client.id: treasury-service-${quarkus.uuid}
        topic: openbank.treasury.deal.events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      # Contract 9.1: treasury.payment.released.v1, written by the release transaction into the
      # outbox, read by the institution-transfer rail. The topic CR lives with the rail.
      treasury-payments-out:
        connector: smallrye-kafka
        client:
          id: treasury-service-payments-${quarkus.uuid}
        topic: openbank.treasury.payments
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # Contract 9.2: the rail's status of each released payment (ACCEPTED/SENT/SETTLED/REJECTED).
      # group.id / auto.offset.reset NESTED (a dotted leaf key never reaches the connector, #686);
      # earliest so a status published before the first join is not skipped — the consumer is
      # idempotent on (paymentId, status), so a re-read is harmless.
      institution-transfer-status-in:
        connector: smallrye-kafka
        topic: openbank.swift.institution-transfers
        client:
          id: treasury-service-rail-status-${quarkus.uuid}
        group:
          id: treasury-institution-transfer-status
        auto:
          offset:
            reset: earliest
        # An unknown payment, a foreign key or a contradicting status is rethrown and PARKED here
        # for a human, never dropped. EXPLICIT per-service topic in the NESTED form (#686, #5752).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.treasury.institution-transfer-status-in
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer

openbank:
  authz:
    # libs-runtime OpaPolicyDecisionPointProducer (replaced this service's own AuthzProducer;
    # same opa.url / opa.path / opa.timeout-ms keys and defaults). BUILD-time switch.
    opa-pdp-producer:
      enabled: true
  outbox:
    # Defaults to FALSE fleet-wide. Without this line no treasury.deal.* event ever leaves
    # treasury_outbox: no error, attempt_count stays 0, the audit trail stays empty.
    dispatch-enabled: true
  treasury:
    ledger:
      # ADR-0341 D3 rollout switch. false (default): journal legs carry the explicit glAccountId an
      # older ledger understands, so deploying treasury BEFORE the ledger that serves accounting
      # classes cannot fail a posting. true: legs name an accountingClass and the ledger resolves the
      # account. Flip to true only after the ledger carrying migration V32 is live; then delete the
      # LegacyGlChart shim. A reversal always names the original posting's account either way.
      post-by-class: ${OPENBANK_TREASURY_LEDGER_POST_BY_CLASS:false}
    revaluation:
      # ADR-0344 D7/D8: the daily revaluation of the accounting day off the risk engine's TIED_OUT
      # snapshot of that date (read as treasury's own m2m identity, risk.snapshot.list +
      # risk.valuation.read). A deal the engine could not value marks the REVALUATION step FAILED.
      enabled: ${OPENBANK_TREASURY_REVALUATION_ENABLED:true}
    fixing:
      # ADR-0344 D5: the hourly fixing pass for the accounting day (re-runs are harmless). It fixes
      # only from ACTIVE (four-eyes approved) observations that pass the quality gate; a blocked
      # index-date opens a case and holds the FIXINGS step of the day until resolved.
      enabled: ${OPENBANK_TREASURY_FIXING_ENABLED:true}
    payments:
      # ADR-0344 D6: FIXED flows paid within cut-off-window-days of the accounting day are proposed
      # as payments (netted per netting agreement, addressed from the effective SSI). Release is a
      # human payment releaser's act. Contract 9: release writes treasury.payment.released.v1 in the
      # same transaction (rail from the SSI: CZK CERTIS, EUR TARGET2, other SWIFT); the rail's status
      # events move it to SENT / SETTLED / FAILED. RAIL_NOT_SUPPORTED only when no rail follows.
      enabled: ${OPENBANK_TREASURY_PAYMENTS_ENABLED:true}
      # Contract 9.1 debtor agent: the bank's own BIC (the sandbox bank's, as the fleet uses).
      own-bic: ${OPENBANK_BIC:OPBKCZ22}
      cut-off-window-days: 2
    close:
      # ADR-0342: treasury is a day-close participant. Every tick re-offers the last lookback-days
      # completed accounting days to the ledger (PUT /api/v1/ledger/accounting-days/{date}/participants/
      # treasury) as RAN / SKIPPED / REFUSED, folded from the day-completion record. due-steps are the
      # steps every accounting day must finish before the day is reported; a day with one unfinished
      # (or FAILED) is withheld, so the ledger waits and pages. Must match rules.yaml close_participants.
      enabled: ${OPENBANK_TREASURY_CLOSE_ENABLED:true}
      due-steps: ${OPENBANK_TREASURY_CLOSE_DUE_STEPS:ACCRUALS,FIXINGS,PAYMENTS,REVALUATION,CORRECTIONS}
      lookback-days: 3
    confirmation:
      # ADR-0315 D2: a deal settles only once CONFIRMED (counterparty confirmation received). The
      # simulated market confirms every BOOKED deal first, so the sandbox lifecycle is unchanged.
      # false = settle straight from BOOKED, the pre-CONFIRMED behaviour, for a deployment with no
      # confirmation step. Deals already BOOKED are NOT migrated: with true they wait for a confirm.
      required: ${OPENBANK_TREASURY_CONFIRMATION_REQUIRED:true}
    simulated-market:
      # ADR-0315 D9: SYNTHETIC counterparties that settle and mature booked deals in the sandbox.
      # On by default because the sandbox is the only environment; an environment with real
      # market connectivity sets OPENBANK_TREASURY_SIMULATED_MARKET_ENABLED=false.
      enabled: ${OPENBANK_TREASURY_SIMULATED_MARKET_ENABLED:true}
      interval: 60s
      quotes:
        # ADR-0315 D9: the simulated counterparties quote the risk engine's latest curve set (CZK
        # CZEONIA, EUR ESTR) ± a half-spread, read as treasury's own identity (risk_rest_ext.rego
        # grants risk.curve-set.read to service-account-openbank-treasury only). On, a simulated
        # counterparty confirms a quoted MM deal only when it was struck at its quote or better;
        # off, it confirms every BOOKED deal (the pre-quote behaviour) and GET /quotes is 409.
        # Off by default until the grant, the network edge and the TLS bucket are verified live.
        enabled: ${OPENBANK_TREASURY_SIMULATED_QUOTES_ENABLED:false}
        # Half-spread in basis points around the curve mid, per SYNTHETIC counterparty. A
        # counterparty missing here does not quote; a non-synthetic one never does.
        spread-bp:
          SIMBK-A: 5
          SIMBK-B: 10
          SIMBK-C: 20
    product-limits:
      # ADR-0315 D4 product limits, declared as code: per product, the largest principal per deal by
      # currency (a currency not listed may not be dealt in that product) and the longest tenor in
      # days. Enforced at submit AND re-checked at approval; a breach is 422 PRODUCT_LIMIT_BREACHED
      # and is NOT overridable — dealing outside a mandate means changing it here, under review.
      # A product missing from this map is not permitted at all (fail-closed). Sandbox-sized: each
      # cap sits at or above the largest synthetic counterparty line, so the counterparty limit
      # stays the binding constraint in the sandbox.
      MM_PLACEMENT:
        max-principal:
          CZK: 2000000000.00
          EUR: 50000000.00
        max-tenor-days: 366
      MM_BORROWING:
        max-principal:
          CZK: 2000000000.00
          EUR: 50000000.00
        max-tenor-days: 366
      CNB_DEPOSIT_FACILITY:
        max-principal:
          CZK: 100000000000.00
        # Overnight to the next business day: 7 covers the longest Czech holiday bridge.
        max-tenor-days: 7
      CNB_LOMBARD:
        max-principal:
          CZK: 10000000000.00
        max-tenor-days: 7
      FX_SPOT:
        # The foreign leg; the CZK equivalent is bounded by the counterparty's CZK limit.
        max-principal:
          EUR: 50000000.00
    nostro:
      # Configure correspondent IBAN -> treasury GL code in deployment-specific configuration.
      # An unconfigured account is refused; no sample account is active in production.
      accounts: {}
      # ADR-0315 D7: an OPEN reconciliation break alerts (outbox treasury.nostro.break-aged.v1, the
      # openbank_treasury_nostro_breaks_aged gauge) once it is this many BUSINESS days old AND at
      # least this amount in its own currency (0 = any amount).
      break-alert-age-days: ${OPENBANK_TREASURY_NOSTRO_BREAK_ALERT_AGE_DAYS:3}
      break-alert-min-amount: ${OPENBANK_TREASURY_NOSTRO_BREAK_ALERT_MIN_AMOUNT:0}
    portfolio:
      # ADR-0337 amendment: the custodian's semt.002 statement of holdings (PSP 34-12 PS). Only the
      # treasury-pension-co deployment keeps a portfolio: it sets the entity and its safekeeping
      # account(s) in its own configuration. Without an entity every upload is refused and every
      # period-end read answers 409 — the bank's own treasury keeps no portfolio here. Set
      # OPENBANK_TREASURY_PORTFOLIO_ENTITY and OPENBANK_TREASURY_PORTFOLIO_SAFEKEEPING_ACCOUNTS
      # on that deployment (both deliberately absent here: no default entity exists).
      # Instrument class per CFI PREFIX (ISO 10962; longest prefix wins). A CFI no prefix covers
      # refuses the WHOLE statement at upload — a holding is never classified by guess.
      cfi-classes:
        DB: DEBT_SECURITY
        DY: MONEY_MARKET_INSTRUMENT
        ES: EQUITY
        EP: EQUITY
        CI: FUND_UNIT
        CE: FUND_UNIT
    nostro-breaks:
      # Hourly sweep: re-reconcile statements of the last 31 days (a late ledger booking resolves
      # its break), then age every open break and alert once on those over the threshold.
      enabled: ${OPENBANK_TREASURY_NOSTRO_BREAKS_ENABLED:true}
      interval: 1h
    accrual:
      # ADR-0315 D5: daily accrual of interest on SETTLED deals into the accrued-interest accounts.
      # Hourly and idempotent per day, so a missed pass is caught up by the next one.
      enabled: ${OPENBANK_TREASURY_ACCRUAL_ENABLED:true}
      interval: 1h
    fx-spot:
      rate-check:
        # #10896: flag (never block) an FX spot deal whose dealer-entered rate deviates from
        # fx-service's mid by more than tolerance-percent. OFF: treasury has no fx-service client
        # yet, and switched on without one it flags every FX deal "mid unavailable".
        enabled: false
        tolerance-percent: 2.0
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"

authz:
  enforce: "${AUTHZ_ENFORCE:true}"
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

"%prod":
  quarkus:
    http:
      # East-west mTLS on the 8443 listener (ADR-0337: tax-reporting reads the pension company's
      # portfolio from the treasury-pension-co instance). `quarkus.http.ssl.client-auth` is a
      # BUILD-TIME property: the container env cannot set it, so it lives in the file the image is
      # built from. Under `%prod` only: with `quarkus.http.ssl.*` set and no certificate Quarkus
      # refuses to start, which would break every dev run and @QuarkusTest. In the cluster BOTH
      # deployments supply the certificate files (treasury-pension-co: treasury-service-internal-tls;
      # the bank's treasury: treasury-internal-tls, server usage added for exactly this). The bank
      # treasury's certificate wiring ships in the SAME change as this setting, so no deploy order
      # can leave an image requiring a certificate its manifest does not supply.
      ssl:
        client-auth: required
      # Keep the plain-HTTP port (8160): with client-auth REQUIRED Quarkus otherwise drops the HTTP
      # listener, and the readiness probe and admin-ui's staff path use it. Runtime property, #10441.
      insecure-requests: enabled
      # Listener parity (ADR-0337): with client-auth on, Quarkus ALSO registers its mTLS
      # authentication mechanism, which turns a trusted client certificate into a SecurityIdentity
      # of its own — on 8443 only. The API must be authenticated identically on both listeners, by
      # the OIDC bearer OPA decides on, so /api/* accepts the bearer mechanism ONLY; the certificate
      # stays transport authentication. Measured: without this, a trusted certificate with no bearer
      # reached the handler as an authenticated principal (403 from authz, not 401).
      # ListenerAuthParityIT holds both listeners to 401 without a bearer.
      auth:
        permission:
          bearer-only:
            paths: /api/*
            policy: permit
            auth-mechanism: bearer
    # ledger-service's 8443 listener is private-CA mTLS with client auth REQUIRED; the
    # treasury-internal-tls certificate is mounted at /mnt/ledger-tls in the cluster only.
    tls:
      ledger-authority:
        key-store:
          pem:
            client:
              cert: /mnt/ledger-tls/tls.crt
              key: /mnt/ledger-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/ledger-tls/ca.crt
        protocols: TLSv1.3
      # The risk engine's 8443 listener is private-CA mTLS with client auth REQUIRED too. Same
      # treasury-internal-tls client certificate and the same openbank-ca trust, its own bucket so
      # each edge names what it trusts.
      risk-authority:
        key-store:
          pem:
            client:
              cert: /mnt/ledger-tls/tls.crt
              key: /mnt/ledger-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/ledger-tls/ca.crt
        protocols: TLSv1.3
    rest-client:
      ledger-service:
        tls-configuration-name: ledger-authority
      risk-engine:
        tls-configuration-name: risk-authority

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      enabled: false
      tls:
        verification: none
  authz:
    enforce: "false"

"%test":
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
  authz:
    enforce: "false"
  openbank:
    treasury:
      simulated-market:
        enabled: false
      accrual:
        enabled: false
