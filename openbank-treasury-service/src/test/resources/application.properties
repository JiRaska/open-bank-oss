quarkus.oidc.enabled=false
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=openbank
quarkus.datasource.password=openbank_secret
quarkus.datasource.reactive.url=postgresql://localhost:5432/openbank_treasury_it
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openbank_treasury_it
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:29092
kafka.bootstrap.servers=localhost:29092
quarkus.otel.sdk.disabled=true
quarkus.log.level=WARN
quarkus.log.category."com.openbank".level=INFO
authz.enforce=false

# Synthetic correspondent accounts for nostro reconciliation integration tests.
openbank.treasury.nostro.accounts.CZ1299990000000000001001=1001
openbank.treasury.nostro.accounts.CZ8299990000000000001002=1002

# ADR-0315 D7: the hourly break sweep stays off in the shared profile (it would re-reconcile other
# tests' statements mid-run); NostroBreakSweepIT drives the REAL scheduler under its own profile.
openbank.treasury.nostro-breaks.enabled=false
# Portfolio statements of holdings (ADR-0337): a synthetic pension-company deployment.
openbank.treasury.portfolio.entity=pension-co
openbank.treasury.portfolio.safekeeping-accounts=PSCO-OWN-0001
