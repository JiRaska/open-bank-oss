quarkus:
  application:
    name: openbank-pension-fund-service
  http:
    port: 8162
    test-port: 0
    cors:
      ~: true
      origins: http://localhost:3000
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      Referrer-Policy:
        value: no-referrer
      Permissions-Policy:
        value: geolocation=(), microphone=(), camera=()
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: max-age=31536000; includeSubDomains
    limits:
      max-body-size: 1M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_pension_fund
    # A LITERAL jdbc url, not only an env expression: Flyway migrates the DEFAULT (Agroal/JDBC)
    # datasource, and a service that boots only because the environment supplied one cannot start
    # from this repo alone (check-flyway-default-datasource.py, #3080).
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_pension_fund

  flyway:
    # Committing migrations does not run them — this key defaults to FALSE. security-scanner
    # shipped V2+V3 with it set nowhere and its deployed database held zero tables, every write
    # answering 42P01 as a 500, while the pod stayed Ready (#3350).
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  hibernate-orm:
    database:
      generation: none

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}


  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    console:
      format: '%d{HH:mm:ss} %-5p [%c{3.}] %s%e%n'

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-pension-fund-service

  management:
    enabled: true
    port: 8090
    host: 0.0.0.0
    root-path: /q

  dev-ui:
    enabled: false

openbank:
  pension-fund:
    strategy-change:
      # Days between approval (participants notified) and the earliest effective date. A
      # deployment default only; the statutory value belongs to the jurisdiction pack (ADR-0334 §3).
      minimum-notice-days: 30
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  # A Duration, not a millisecond Long: see AuthzProducer for why the Kotlin field cannot carry
  # an initializer, which a primitive would need.
  timeout: "${OPA_TIMEOUT:PT0.5S}"

authz:
  enforce: "${AUTHZ_ENFORCE:true}"
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      tls:
        verification: none
      enabled: false
  authz:
    enforce: "false"

"%test":
  quarkus:
    datasource:
      reactive:
        url: vertx-reactive:postgresql://localhost:5433/openbank_pension_fund_test
    management:
      enabled: false
    oidc:
      enabled: false
  authz:
    enforce: "false"

"%prod":
  quarkus:
    http:
      # East-west mTLS on the 8443 listener: tax-reporting is its only caller and presents
      # tax-reporting-internal-tls (ADR-0337 pattern, as treasury). `quarkus.http.ssl.client-auth`
      # is BUILD-TIME, so it lives in the file the image is built from; %prod only, because with
      # quarkus.http.ssl.* set and no certificate Quarkus refuses to start in dev and @QuarkusTest.
      # The manifest supplies the server certificate and the openbank-ca trust store
      # (QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILES) in the same change.
      ssl:
        client-auth: required
      # Keep the plain-HTTP port: with client-auth REQUIRED Quarkus otherwise drops it, and the
      # probes and existing in-cluster callers use it until their own HTTPS cutover.
      insecure-requests: enabled
      # Listener parity: with client-auth on, Quarkus also registers its mTLS mechanism, which
      # turns a trusted client certificate into a SecurityIdentity of its own. The certificate is
      # transport authentication only — /api/* accepts the OIDC bearer OPA decides on, on both
      # listeners. ListenerAuthParityIT holds both to 401 without a bearer.
      auth:
        permission:
          bearer-only:
            paths: /api/*
            policy: permit
            auth-mechanism: bearer
