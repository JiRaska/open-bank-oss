openapi: 3.1.0
info:
  title: Tax Reporting Service API
  version: 1.1.0
  description: >
    §38d Vyúčtování daně vybírané srážkou podle zvláštní sazby daně — the platform's system of
    record for the monthly withholding-tax return (ADR-0180). Consumes
    interest.withholding.remitted.v1, aggregates per §38d period, and records what was filed.
    EPO XML rendering is not built in v1; see /export-capability, which reports that plainly.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8152
    description: Local development
tags:
  - name: TaxFiling
  - name: StatutoryReturn
    description: Catalogue-defined regulatory returns (ADR-0336) — Czech pension company ČNB PSP/PEF first

paths:
  /api/v1/tax/filings:
    get:
      tags: [TaxFiling]
      summary: List filing periods, newest first
      operationId: listTaxFilings
      responses:
        '200':
          description: Filing periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxFilingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tax/filings/overdue:
    get:
      tags: [TaxFiling]
      summary: Filings past the §38d deadline and not yet filed
      description: >
        The alertable set. A return that is late is a compliance failure that produces no error
        anywhere else — nothing throws when a filing simply does not happen.
      operationId: listOverdueTaxFilings
      responses:
        '200':
          description: Overdue filings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxFilingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tax/filings/export-capability:
    get:
      tags: [TaxFiling]
      summary: Whether EPO XML rendering is available
      description: >
        Reports the truth rather than implying a capability. In v1 this returns false: the GFŘ EPO
        XSD is a specific published schema and a guess at it would produce a file that looks valid
        and is wrong at the finanční úřad.
      operationId: getExportCapability
      responses:
        '200':
          description: Capability report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportCapabilityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tax/filings/{period}:
    get:
      tags: [TaxFiling]
      summary: Get one filing period
      operationId: getTaxFiling
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: Filing period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxFilingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tax/filings/{period}/remittances:
    get:
      tags: [TaxFiling]
      summary: The remittance batches making up a period
      description: The audit trail behind the total — which batches produced this figure.
      operationId: listPeriodRemittances
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: Observed remittances, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObservedRemittanceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tax/filings/{period}/assemble:
    post:
      tags: [TaxFiling]
      summary: Assemble the period, freezing its totals (OPEN → ASSEMBLED)
      description: >
        Refused with 409 if the month has not ended, if the period is not OPEN, or if the observed
        remittances span more than one currency (§38d withholding is CZK-only, ADR-0033 §E — summing
        across currencies would put a meaningless figure on a tax return).
      operationId: assembleTaxFiling
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: Assembled filing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxFilingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tax/filings/{period}/filed:
    post:
      tags: [TaxFiling]
      summary: Record that the assembled return was submitted (ASSEMBLED → FILED)
      description: >
        Four-eyes — the actor who assembled the period may not also record it as filed, and an
        assembly with no recorded author can never be filed. The reference is mandatory: a filing
        recorded without one cannot be evidenced later.
      operationId: markTaxFilingFiled
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkFiledRequest' }
      responses:
        '200':
          description: Filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxFilingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/statutory-returns:
    get:
      tags: [StatutoryReturn]
      summary: List return revisions, newest period first
      operationId: listStatutoryReturns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatutoryReturnResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/statutory-returns/catalogues:
    get:
      tags: [StatutoryReturn]
      summary: Jurisdiction return catalogues this deployment reports under
      operationId: listReturnCatalogues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnCatalogueResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/statutory-returns/breaches:
    get:
      tags: [StatutoryReturn]
      summary: Returns past their deadline without a submitted revision, including never-assembled ones
      operationId: listStatutoryReturnBreaches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnBreachResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Reporting start or fund roster is unconfigured; deadline status is unavailable

  /api/v1/statutory-returns/capability:
    get:
      tags: [StatutoryReturn]
      summary: Whether a data source and a wire renderer are bound
      operationId: getStatutoryReturnCapability
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnCapabilityResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/statutory-returns/{id}:
    get:
      tags: [StatutoryReturn]
      summary: Get one return revision
      operationId: getStatutoryReturn
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatutoryReturnResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/statutory-returns/assemble:
    post:
      tags: [StatutoryReturn]
      summary: Assemble and validate a return from sourced figures (→ ASSEMBLED); 503 while no data source is bound
      operationId: assembleStatutoryReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssembleReturnRequest' }
      responses:
        '200':
          description: The return after the transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatutoryReturnResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: No data source is bound for this return
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/statutory-returns/{id}/approve:
    post:
      tags: [StatutoryReturn]
      summary: Approve and attest the content hash (ASSEMBLED → APPROVED; the assembler may not approve)
      operationId: approveStatutoryReturn
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The return after the transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatutoryReturnResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/statutory-returns/{id}/submitted:
    post:
      tags: [StatutoryReturn]
      summary: Record the regulator submission reference (APPROVED → SUBMITTED; refused if content differs from the attestation)
      operationId: recordStatutoryReturnSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordSubmissionRequest' }
      responses:
        '200':
          description: The return after the transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatutoryReturnResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/corporate-register:
    get:
      tags: [CorporateRegister]
      summary: Every corporate-register entry of an entity, any status — the audit trail (#12425)
      operationId: listCorporateRegister
      parameters:
        - { name: entityId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Entries, by fact, effective date and version
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CorporateRegisterEntry' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CorporateRegister]
      summary: Propose a corporate figure (maker); it feeds no return until another operator approves it
      operationId: proposeCorporateFact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeCorporateFactRequest' }
      responses:
        '201':
          description: The proposed entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporateRegisterEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/corporate-register/effective:
    get:
      tags: [CorporateRegister]
      summary: The approved figure of each fact effective for a period; a fact with none approved is absent
      operationId: effectiveCorporateFacts
      parameters:
        - { name: entityId, in: query, required: true, schema: { type: string } }
        - { name: periodStart, in: query, required: true, schema: { type: string, format: date } }
        - { name: periodEnd, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Fact name to value
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: number } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/corporate-register/{id}/approve:
    post:
      tags: [CorporateRegister]
      summary: Approve a proposed figure (checker; the proposer may not)
      operationId: approveCorporateFact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The decided entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporateRegisterEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/corporate-register/{id}/reject:
    post:
      tags: [CorporateRegister]
      summary: Reject a proposed figure (checker; the proposer may not)
      operationId: rejectCorporateFact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The decided entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporateRegisterEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    PeriodPath:
      name: period
      in: path
      required: true
      description: The §38d withholding month, YYYY-MM.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: No filing for that period
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Fail-closed lifecycle invariant (wrong state, period not ended, four-eyes, mixed currency)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnprocessableEntity:
      description: Domain validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    ProposeCorporateFactRequest:
      type: object
      required: [entityId, fact, value, effectiveFrom, reason, evidence]
      properties:
        entityId: { type: string, description: The reporting company id (openbank.statutory-returns.company-id) }
        fact: { type: string, enum: [SHARE_CAPITAL, REGULATORY_CAPITAL, CAPITAL_REQUIREMENT, EMPLOYEES_COUNT, QUALIFYING_SHAREHOLDERS_COUNT, BOARD_OF_DIRECTORS_MEMBERS, SUPERVISORY_BOARD_MEMBERS, DIVIDEND_PAID_OR_PLANNED] }
        value: { type: number, minimum: 0, description: Counts must be whole numbers }
        effectiveFrom: { type: string, format: date }
        reason: { type: string }
        evidence: { type: string, description: The source document (minutes, capital calculation, HR report) }
    CorporateRegisterEntry:
      type: object
      required: [id, entityId, fact, value, effectiveFrom, version, reason, evidence, status, proposedBy, proposedAt]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string }
        fact: { type: string, enum: [SHARE_CAPITAL, REGULATORY_CAPITAL, CAPITAL_REQUIREMENT, EMPLOYEES_COUNT, QUALIFYING_SHAREHOLDERS_COUNT, BOARD_OF_DIRECTORS_MEMBERS, SUPERVISORY_BOARD_MEMBERS, DIVIDEND_PAID_OR_PLANNED] }
        value: { type: number }
        effectiveFrom: { type: string, format: date }
        version: { type: integer, minimum: 1 }
        reason: { type: string }
        evidence: { type: string }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED] }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
    AssembleReturnRequest:
      type: object
      required: [catalogueId, returnCode, entityId, period]
      properties:
        catalogueId: { type: string, example: cz-pension-cnb }
        returnCode: { type: string, example: PSP10-12-FUND }
        entityId: { type: string }
        period: { type: string, description: 'YYYY-MM, YYYY-Qn or YYYY per the return periodicity' }
    RecordSubmissionRequest:
      type: object
      required: [reference]
      properties:
        reference: { type: string }
    ReturnCapabilityResponse:
      type: object
      required: [dataSourceAvailable, wireFormatAvailable, note]
      properties:
        dataSourceAvailable: { type: boolean }
        wireFormatAvailable: { type: boolean }
        note: { type: string }
    ReturnBreachResponse:
      type: object
      required: [catalogueId, returnCode, entityId, period, dueDate, kind]
      properties:
        catalogueId: { type: string }
        returnCode: { type: string }
        entityId: { type: string }
        period: { type: string }
        dueDate: { type: string, format: date }
        kind: { type: string, enum: [NOT_ASSEMBLED, NOT_SUBMITTED] }
    ReturnDefinitionResponse:
      type: object
      required: [code, name, scope, periodicity, deadlineDaysAfterPeriodEnd, legalBasis, datapoints]
      properties:
        code: { type: string }
        name: { type: string }
        scope: { type: string, enum: [COMPANY, FUND] }
        periodicity: { type: string, enum: [MONTH, QUARTER, YEAR] }
        deadlineDaysAfterPeriodEnd: { type: integer }
        legalBasis: { type: string }
        datapoints: { type: array, items: { type: string } }
    ReturnCatalogueResponse:
      type: object
      required: [id, version, jurisdiction, wireFormatVerified, returns]
      properties:
        id: { type: string }
        version: { type: integer }
        jurisdiction: { type: string }
        wireFormatVerified: { type: boolean }
        returns: { type: array, items: { $ref: '#/components/schemas/ReturnDefinitionResponse' } }
    StatutoryReturnResponse:
      type: object
      required: [id, catalogueId, catalogueVersion, returnCode, entityId, periodicity, period, revision, status, datapoints, contentHash, dueDate, assembledBy, assembledAt]
      properties:
        id: { type: string, format: uuid }
        catalogueId: { type: string }
        catalogueVersion: { type: integer }
        returnCode: { type: string }
        entityId: { type: string }
        periodicity: { type: string, enum: [MONTH, QUARTER, YEAR] }
        period: { type: string }
        revision: { type: integer }
        status: { type: string, enum: [ASSEMBLED, APPROVED, SUBMITTED] }
        datapoints: { type: object, additionalProperties: { type: number } }
        contentHash: { type: string, description: SHA-256 of the canonical content }
        dueDate: { type: string, format: date }
        assembledBy: { type: string }
        assembledAt: { type: string, format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        attestedHash: { type: [string, 'null'] }
        submittedBy: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        submissionReference: { type: [string, 'null'] }
    ApiError:
      type: object
      properties:
        error: { type: string }

    MarkFiledRequest:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          description: The FÚ/EPO submission reference. Mandatory — a filing without one cannot be evidenced.

    ExportCapabilityResponse:
      type: object
      required: [epoXmlAvailable, note]
      properties:
        epoXmlAvailable: { type: boolean }
        note: { type: string }

    TaxFilingResponse:
      type: object
      required: [id, period, status, currency, totalTaxAmount, remittanceCount, itemCount, dueDate]
      properties:
        id: { type: string, format: uuid }
        period: { type: string, description: 'YYYY-MM' }
        status: { type: string, enum: [OPEN, ASSEMBLED, FILED] }
        currency: { type: string }
        totalTaxAmount: { type: string }
        remittanceCount: { type: integer }
        itemCount: { type: integer }
        dueDate: { type: string, format: date, description: '§38d odst. 3 deadline.' }
        assembledAt: { type: string, format: date-time, nullable: true }
        assembledBy: { type: string, nullable: true }
        filedAt: { type: string, format: date-time, nullable: true }
        filedBy: { type: string, nullable: true }
        filingReference: { type: string, nullable: true }

    ObservedRemittanceResponse:
      type: object
      required: [remittanceId, period, currency, totalTaxAmount, itemCount, dueDate, observedAt]
      properties:
        remittanceId: { type: string, format: uuid }
        period: { type: string }
        currency: { type: string }
        totalTaxAmount: { type: string }
        itemCount: { type: integer }
        dueDate: { type: string, format: date }
        observedAt: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
