quarkus:
  application:
    name: openbank-tax-reporting-service
  http:
    port: 8152
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:openbank}
    password: ${DB_PASSWORD:openbank}
    reactive:
      url: ${DB_REACTIVE_URL:vertx-reactive:postgresql://localhost:5432/openbank_tax_reporting}
    jdbc:
      url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/openbank_tax_reporting}
  hibernate-orm:
    database:
      generation: none
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
  oidc:
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: ${OIDC_CLIENT_ID:openbank-tax-reporting-service}
    tls:
      verification: ${OIDC_TLS_VERIFICATION:required}
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # #12425: tax-reporting-service's OWN machine identity — Keycloak client `openbank-tax-reporting`,
  # ROLE_API only — for the pension reporting read models. pension-service and pension-fund-service
  # admit their aggregate routes for service-account-openbank-tax-reporting and staff alone; never
  # the shared openbank-services client.
  oidc-client:
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-tax-reporting
    credentials:
      secret: ${OIDC_TAX_REPORTING_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client

  rest-client:
    pension-service:
      url: ${PENSION_SERVICE_URL:http://localhost:8171}
      connect-timeout: 2000
      read-timeout: 10000
    pension-fund-service:
      url: ${PENSION_FUND_SERVICE_URL:http://localhost:8162}
      connect-timeout: 2000
      read-timeout: 10000
    # ADR-0337: the PENSION COMPANY's own ledger-service instance — never the bank's ledger. The
    # configKey is the provider module's; the URL names the company's deployment.
    ledger-service:
      url: ${PENSION_COMPANY_LEDGER_URL:http://localhost:8099}
      connect-timeout: 2000
      read-timeout: 10000
    # ADR-0337: the PENSION COMPANY's own treasury-service instance (PSP 34-12 PS, its own
    # portfolio). No default on purpose: unset = PSP 34-12 PS is refused (503, "not configured")
    # rather than read from whichever treasury happens to answer on a default port.
    treasury-service:
      url: ${PENSION_COMPANY_TREASURY_URL:}
      connect-timeout: 2000
      read-timeout: 10000

mp:
  messaging:
    incoming:
      # ADR-0180: a SECOND consumer group on the topic interest-service already publishes to — no
      # change to its contract. group.id / auto.offset.reset are deliberately NOT set as YAML keys
      # (SmallRye's dotted-key footgun, #686/#703): group.id falls back to quarkus.application.name,
      # which is what makes this a distinct group from interest-service's own settlement consumer.
      #
      # auto.offset.reset stays `latest`, so a fresh deploy does not replay historical remittances
      # into filing periods that were already assembled. Backfilling an earlier period is an
      # explicit operator action, not something a deploy does by accident.
      withholding-remitted-in:
        connector: smallrye-kafka
        topic: openbank.interest.accrual.event
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer

openbank:
  api:
    version: "1"
  # ADR-0336: catalogue-defined statutory returns. Until the reporting start and fund roster are
  # configured, deadline checks fail closed and workflow liveness cannot report success.
  statutory-returns:
    catalogues: statutory-returns/cz/pension-cnb.v1.json
    company-id: company
    deadline-check-every: 1h
    # ADR-0337: the first day of the pension company's books. Unset = every company-books return
    # is refused (503), because a balance summed from an unknown start cannot be shown complete.
    # company-books.opened: 2025-01-01
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

"%prod":
  quarkus:
    # East-west mTLS to the pension company's treasury-service instance (8443, client auth REQUIRED,
    # ADR-0337): the call carries a bearer token and the cluster has no mesh, so plaintext 8160 is
    # not an option (ASVS V9.1). Client certificate tax-reporting-internal-tls, mounted at
    # /mnt/internal-tls in the cluster only (gitops); the server is verified against openbank-ca
    # with HTTPS hostname verification (the default — never set to NONE). %prod only: the files
    # exist only in the cluster, and the TLS registry loads them at boot. The bucket is the shared
    # `internal-authority` that #12500 (ledger), #12507 (pension, pension-fund) also name: ONE `tls:`
    # and ONE `rest-client:` map under %prod (SnakeYAML keeps only the last of a repeated key).
    tls:
      internal-authority:
        key-store:
          pem:
            client:
              cert: /mnt/internal-tls/tls.crt
              key: /mnt/internal-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/internal-tls/ca.crt
        protocols: TLSv1.3
    rest-client:
      treasury-service:
        tls-configuration-name: internal-authority

"%test":
  quarkus:
    datasource:
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_tax_reporting_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_tax_reporting_it
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    devservices:
      enabled: false
    scheduler:
      enabled: false
