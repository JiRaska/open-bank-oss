quarkus.oidc.enabled=false
quarkus.oidc-client.enabled=false
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=openbank
quarkus.datasource.password=openbank_secret
quarkus.datasource.reactive.url=postgresql://localhost:5432/openbank_kyb_it
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openbank_kyb_it
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:29092
kafka.bootstrap.servers=localhost:29092
quarkus.otel.sdk.disabled=true
quarkus.log.level=WARN
quarkus.log.category."com.openbank".level=INFO
authz.enforce=false
# The related-party screening gate is ON for every @QuarkusTest in this module, against the
# StubRelatedPartyScreening double (clear unless a test names someone). It ships OFF; running the
# ITs with it on is what proves the journeys still complete when it is switched on.
openbank.kyb.screening.enabled=true
