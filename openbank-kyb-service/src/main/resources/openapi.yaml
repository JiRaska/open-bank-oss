openapi: 3.1.0
info:
  title: OpenBank KYB Service API
  # 1.2.0 -> 1.3.0 (#9711): additive — representation attestation. 1.2.0 shipped the name
  # search (#9707); this is the next free minor as of live main.
  # 1.5.0 -> 1.6.0: additive — AML questionnaire, declarations, business agreement + acceptance,
  # prefill; `sign` keeps its schema and gains stricter, documented semantics.
  # 1.6.0 -> 1.7.0: additive — company-scoped PSC record and corporate registration evidence.
  # 1.7.0 -> 1.8.0: additive — related-party sanctions / PEP screening: `Case.screening` (operator
  # view only), the operator disposition route for a finding, the 503 SCREENING_PENDING refusal on
  # `sign` and `review/resolve`, and the 422 SCREENING_FINDING_* refusal on `review/resolve`.
  # 1.8.0 -> 1.9.0: additive — ongoing monitoring of approved cases (ADR-0376). Operator-only
  # response fields `Case.monitoring` (the findings reported after approval, each with its own
  # decision, and the exit state read off them) and `ScreeningSubject.monitoringState`; two
  # operator routes, `monitoring/findings/{findingId}/disposition` and `monitoring/exit/complete`;
  # and the `monitoring=open` filter on `GET /cases`. Nothing existing changes: a case's `status`,
  # `updatedAt` and every existing route answer the same whatever monitoring found, and
  # `status=MANUAL_REVIEW` still returns MANUAL_REVIEW cases only.
  # 1.9.0 -> 1.10.0: additive — representation mode on the attestation and current-attestation corroboration for Delegation.
  version: 1.10.0
  description: |
    Legal-entity verification and business onboarding (ADR-0284). Business identifiers are
    verified against public registers (ARES for CZ, GLEIF for LEI, manual attestation elsewhere);
    the onboarding case derives its signer requirement from the register's representation rule and
    binds each identity-verified signer to the entity party as a representation mandate.
    Customer routes are reached through the customer edge with `X-Customer-Party-Id`.
servers:
  - url: http://localhost:8157
tags:
  - name: KYB
security:
  - bearerAuth: []
paths:
  /api/v1/kyb/schemes:
    get:
      tags: [KYB]
      summary: Identifier schemes an applicant from a country may enter
      operationId: listSchemes
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
      responses:
        '200':
          description: Schemes the country pack (ADR-0284 D2) accepts, national first then cross-border
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: [string, 'null']
                  pack:
                    type: [object, 'null']
                    properties:
                      version:
                        type: integer
                      registry:
                        type: string
                      uboFallback:
                        type: string
                  schemes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scheme'
  /api/v1/kyb/lookup:
    post:
      tags: [KYB]
      summary: Look a business identifier up in its public register
      operationId: lookupEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
      responses:
        '200':
          description: Normalised register extract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryExtract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/RegistryUnavailable'
  /api/v1/kyb/registry/search:
    get:
      tags: [KYB]
      summary: Find a company by name, optionally narrowed by town
      description: >-
        For the customer who does not know their identifier. Returns only what tells two companies
        apart; a chosen row still goes through /lookup, so a search hit can never bind a case by
        itself. `tooManyMatches` is a distinct outcome, not an error: the register refuses to
        answer a query above its match cap (ARES: 1 000) and the customer should narrow it.
        404 when the register for `country` declares no name search (see `supportsNameSearch`
        on /schemes).
      operationId: searchRegistry
      parameters:
        - name: country
          in: query
          required: true
          schema: { type: string, example: CZ }
        - name: name
          in: query
          required: true
          description: Free text matched against the registered company name (min 3 characters)
          schema: { type: string, minLength: 3 }
        - name: city
          in: query
          required: false
          description: Narrowing hint matched against the registered seat; the seat is often an accountant's address, so absence of a match is not absence of the company
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Candidate rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/RegistryUnavailable'
  /api/v1/kyb/cases:
    post:
      tags: [KYB]
      summary: Start a business onboarding case
      operationId: startCase
      parameters:
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCaseRequest'
      responses:
        '201':
          description: Case created (REGISTRY_VERIFIED or MANUAL_REVIEW)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/RegistryUnavailable'
    get:
      tags: [KYB]
      summary: Cases a party is involved in, or the operator review queue by status
      operationId: listCases
      parameters:
        - $ref: '#/components/parameters/customerPartyId'
        - name: partyId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: monitoring
          in: query
          description: >-
            Operator only. `open` lists the cases ongoing monitoring holds for an operator — a
            finding awaiting a decision, or a confirmed sanctions match whose exit is not yet
            recorded as carried out — oldest first. Such a case keeps the status it was approved
            in, so this is its own queue and cannot be combined with `status` (400).
          schema:
            type: string
            enum: [open]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/kyb/cases/{id}:
    get:
      tags: [KYB]
      summary: One case; 404 for a customer who is neither initiator nor signer
      operationId: getCase
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kyb/cases/{id}/initiator:
    post:
      tags: [KYB]
      summary: The initiator states which listed representative they are
      operationId: matchInitiator
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchInitiatorRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Refused. The initiator's verified identity does not match the chosen listed representative,
            the initiator is not a listed representative, or their identity is not yet verified. An
            address mismatch alone is NOT this: it moves the case to MANUAL_REVIEW instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: INITIATOR_IDENTITY_MISMATCH}
                  message: {type: string}
  /api/v1/kyb/cases/{id}/cosigners:
    post:
      tags: [KYB]
      summary: Invite listed representatives to co-sign
      operationId: inviteCosigners
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCosignersRequest'
      responses:
        '200':
          description: Case with invitation tokens (initiator view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/invitations/{token}/claim:
    post:
      tags: [KYB]
      summary: An invited representative binds their own verified party to the case
      operationId: claimInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInvitationRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/cases/{id}/questionnaire:
    put:
      tags: [KYB]
      summary: Answer the company's AML / FATCA / CRS questionnaire
      description: >-
        Company-level questions only (AML Act 253/2008 §9: purpose and intended nature of the
        relationship, turnover, source of funds, cash, countries; the ENTITY's tax residency and
        FATCA/CRS class). Nothing about a person is asked here. Caller must be the initiator or an
        identified signer; open in INITIATOR_MATCHED, AWAITING_COSIGNERS and READY_TO_SIGN, and
        closed once any signature has been given (409). Re-answering replaces the answers.
      operationId: answerQuestionnaire
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Questionnaire'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/cases/{id}/questionnaire/prefill:
    get:
      tags: [KYB]
      summary: What the app may pre-fill instead of asking again
      description: >-
        `knownPersons` are the people on the case the bank already knows as customers (initiator,
        identified co-signers). `pepOnFile` tells the app not to ask for that person's PEP status;
        `pep` itself is rendered only for the caller's own entry. `previousQuestionnaire` is the
        questionnaire the caller last answered on another case, offered as a starting point.
      operationId: questionnairePrefill
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      responses:
        '200':
          description: Prefill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnairePrefill'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kyb/cases/{id}/declarations:
    put:
      tags: [KYB]
      summary: Confirm the beneficial owners, declare PEP status and truthfulness
      description: >-
        `truthful` must be true and a UBO discrepancy needs `uboDiscrepancyNote` (400 otherwise).
        Every reportable natural-person beneficial owner and every listed representative must be
        covered by a PEP status — taken from the person's customer profile where the bank holds
        one (such a person may be omitted; a declared value that contradicts the profile is ignored
        and becomes a review flag), declared in `peps` otherwise (400 when missing).
      operationId: makeDeclarations
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclarationsRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/cases/{id}/agreement:
    post:
      tags: [KYB]
      summary: Render the business framework agreement and its signature ceremony
      description: >-
        Idempotent. Requires the questionnaire and the declarations (409
        AGREEMENT_PREREQUISITES_MISSING) and every required signer identified (status
        READY_TO_SIGN, else 409 INVALID_TRANSITION). kyb builds the request from the case and asks
        document-service; the ceremony it returns is recorded on the case. A re-rendered agreement
        resets acceptance; one already signed is never replaced (409 AGREEMENT_LOCKED).
      operationId: prepareAgreement
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [cs, en]
            default: cs
      responses:
        '200':
          description: The agreement as document-service holds it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAgreement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgreementConflict'
  /api/v1/kyb/cases/{id}/agreement/accept:
    post:
      tags: [KYB]
      summary: Accept the agreement's disclosure documents
      description: >-
        The set must equal EXACTLY the disclosures document-service currently lists for the
        agreement (code, version, sha256) — otherwise 409 DISCLOSURES_STALE. Each signer accepts
        for themself; signing requires the caller's own acceptance.
      operationId: acceptAgreement
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDisclosuresRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgreementConflict'
  /api/v1/kyb/cases/{id}/sign:
    post:
      tags: [KYB]
      summary: Record one signer's completed signature ceremony
      description: >-
        `signatureRef` MUST be the case's ceremony id (`agreement.ceremonyId`). The caller must have
        accepted the disclosures, and document-service must record the caller as SIGNED in that
        ceremony, whose document belongs to this case. Refusals are 409 with a distinct `error`:
        AGREEMENT_NOT_PREPARED, DISCLOSURES_NOT_ACCEPTED, SIGNATURE_REF_MISMATCH,
        CEREMONY_NOT_FOUND, CEREMONY_CASE_MISMATCH, CEREMONY_NOT_SIGNED. After the last required
        signature any AML risk flag (PEP, FATCA status other than ACTIVE_NFFE, a tax residency
        outside the entity's country, cash-intensive, a high-risk country, a UBO discrepancy, a PEP
        declaration contradicting the customer profile) moves the case to MANUAL_REVIEW with every
        flag named in `reviewReason`; activation then waits for the reviewer. Where related-party
        screening is switched on, the LAST required signature is refused with 503 SCREENING_PENDING
        (and not recorded) until the entity, every listed representative and every reportable
        beneficial owner and every person named in the declarations has a screening answer and the
        beneficial-owner lookup is available. The subject list is rebuilt from the case's current
        parties on every attempt. A sanctions hit, a potential hit or a PEP match moves the case to
        MANUAL_REVIEW and adds nothing to `reviewReason`; the finding is in the operator-only
        `Case.screening`. On a customer response an AML review reads "AML risk review before
        activation" whatever raised it; the flags are in the operator's `reviewReason` only.
      operationId: signCase
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgreementConflict'
        '503':
          $ref: '#/components/responses/ScreeningPending'
  /api/v1/kyb/cases/{id}/abandon:
    post:
      tags: [KYB]
      summary: The initiator abandons the case
      operationId: abandonCase
      parameters:
        - $ref: '#/components/parameters/caseId'
        - $ref: '#/components/parameters/customerPartyId'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kyb/cases/{id}/review/resolve:
    post:
      tags: [KYB]
      summary: Operator confirms a manually attested extract or power of attorney
      operationId: resolveReview
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReviewRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ScreeningFinding'
        '503':
          $ref: '#/components/responses/ScreeningPending'
  /api/v1/kyb/representation/{scheme}/{identifier}:
    get:
      tags: [KYB]
      summary: What the attestation store says about this entity's current register rule text
      operationId: representationDecision
      parameters:
        - $ref: '#/components/parameters/reprScheme'
        - $ref: '#/components/parameters/reprIdentifier'
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepresentationDecision'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [KYB]
      summary: Operator confirms how this entity is represented; supersedes any earlier confirmation
      operationId: attestRepresentation
      parameters:
        - $ref: '#/components/parameters/reprScheme'
        - $ref: '#/components/parameters/reprIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestRepresentationRequest'
      responses:
        '200':
          description: The stored attestation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
        '409':
          description: The register rule text changed since the form was opened; re-read and confirm again
  /api/v1/kyb/representation/{scheme}/{identifier}/history:
    get:
      tags: [KYB]
      summary: Every confirmation ever made for this entity, superseded ones included
      operationId: representationHistory
      parameters:
        - $ref: '#/components/parameters/reprScheme'
        - $ref: '#/components/parameters/reprIdentifier'
      responses:
        '200':
          description: Attestations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attestation'
  /api/v1/kyb/cases/{id}/screening/findings/{subjectKey}/disposition:
    post:
      tags: [KYB]
      summary: Operator decides one screening finding
      description: >-
        Sets the disposition of one OPEN finding (a sanctions hit, a potential hit or a PEP match)
        to CLEARED_FALSE_POSITIVE or CONFIRMED, recording the authenticated operator, the reason
        and the time. Accepted only while the case is in MANUAL_REVIEW (409 otherwise). It never
        moves the case: approval stays a separate act, and a case that has ever had a finding is
        approved only by an operator resolving the review, never by the last signature alone. A CONFIRMED sanctions
        finding leaves only rejection. A decided finding cannot be decided again (409).
      operationId: disposeScreeningFinding
      parameters:
        - $ref: '#/components/parameters/caseId'
        - name: subjectKey
          in: path
          required: true
          description: '`key` of the subject in `Case.screening.subjects`.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisposeFindingRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/cases/{id}/monitoring/findings/{findingId}/disposition:
    post:
      tags: [KYB]
      summary: Operator decides one finding of ongoing monitoring on an approved case
      description: >-
        Sets the disposition of one OPEN monitoring finding to CLEARED_FALSE_POSITIVE or CONFIRMED,
        recording the authenticated operator, the reason and the time. Each finding is decided by
        itself and once (409 after that): a later finding about the same subject never reopens or
        replaces an earlier decision. The case's `status` and `updatedAt` do not change. The first
        CONFIRMED finding that is not a PEP match makes an exit owed
        (`monitoring.exitOwedSince`) and publishes BUSINESS_RELATIONSHIP_EXIT_REQUIRED once; a
        confirmed PEP match is a risk fact and publishes nothing. The case stays monitored.
      operationId: decideMonitoringFinding
      parameters:
        - $ref: '#/components/parameters/caseId'
        - name: findingId
          in: path
          required: true
          description: '`findingId` of the finding in `Case.monitoring.findings`.'
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisposeFindingRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/cases/{id}/monitoring/exit/complete:
    post:
      tags: [KYB]
      summary: Operator records that the exit a confirmed sanctions match requires has been carried out
      description: >-
        The only way monitoring of a case with a confirmed sanctions match ends. Accepted when an
        exit is owed and no finding is still undecided (409 otherwise, and 409 when already
        recorded). Records the authenticated operator, the time and the evidence, and withdraws
        the case's subjects from the monitored-subject registry. The case's `status` does not
        change. This service does not carry the exit out; it records that it was.
      operationId: completeMonitoringExit
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteExitRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/kyb/cases/{id}/reject:
    post:
      tags: [KYB]
      summary: Operator rejects the case
      operationId: rejectCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kyb/ubo:
    get:
      tags: [KYB]
      summary: Beneficial owners of a business identifier, as its jurisdiction's register states them
      operationId: lookupBeneficialOwners
      description: >-
        Always 200. `source` is the field to read first: REGISTER means a beneficial-ownership
        register answered, SELF_DECLARATION means the jurisdiction has no queryable register and the
        customer must declare, UNAVAILABLE means a register exists and could not be reached. An empty
        `owners` list means something different under each, which is why a filed register statement
        ("no individual PSC identified") is carried separately rather than collapsed into the absence.
      security:
        - bearerAuth: []
      parameters:
        - name: scheme
          in: query
          required: true
          schema: { type: string, example: GB_CRN }
        - name: identifier
          in: query
          required: true
          schema: { type: string, example: "OC123456" }
      responses:
        '200':
          description: What is known about the entity's beneficial owners right now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UboFinding' }
        '400':
          description: Missing or unparseable scheme/identifier
  /api/v1/kyb/cases/{id}/statutory-representation:
    post:
      tags: [KYB]
      summary: Publish an active case's verified statutory representation rule to party-service
      description: >-
        Staff publication requires a current human attestation and identity-linked signers from
        the case's verified document ceremony. A fixed quorum requires enough verified signers
        for the attested count and offices. Joint-all requires all register representatives.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestationId]
              properties:
                attestationId: {type: string, format: uuid, description: The current confirmation displayed to the reviewer}
      responses:
        '200':
          description: The exact attestation published
          content:
            application/json:
              schema:
                type: object
                required: [attestationId]
                properties:
                  attestationId: {type: string, format: uuid}
        '400': {description: Missing attestation identifier}
        '403': {description: Only authenticated KYB staff can publish, and never the staff member who attested the rule (SEPARATION_OF_DUTIES)}
        '404': {description: Case or complete verified statutory evidence unavailable, or the attestation changed}
  /api/v1/kyb/cases/{id}/statutory-representation/{attestationId}/current:
    get:
      tags: [KYB]
      summary: Verify that an exact statutory representation attestation remains current
      description: This check is restricted to the verified delegation service identity.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: attestationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: entityPartyId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: The case's verified statutory attestation is current
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
        '400': {description: Missing entity party}
        '403': {description: Only delegation-service can verify the source revision}
        '404':
          description: Case or entity mismatch, incomplete evidence, or superseded attestation
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    reprScheme:
      name: scheme
      in: path
      required: true
      schema: { type: string }
    reprIdentifier:
      name: identifier
      in: path
      required: true
      schema: { type: string }
    caseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    customerPartyId:
      name: X-Customer-Party-Id
      in: header
      required: false
      description: The authenticated customer, stamped by the customer edge. Required on customer routes.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is not the party the route is scoped to
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        The transition is not valid in the case's current state (`error` = INVALID_TRANSITION), or
        the case was changed concurrently and nothing was written (`error` = CASE_CONCURRENT_UPDATE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ScreeningFinding:
      description: >-
        Operator routes only. The review cannot be resolved while a screening finding has no
        disposition (`error` = SCREENING_FINDING_OPEN), or after a sanctions finding was confirmed
        (`error` = SCREENING_FINDING_CONFIRMED; the case can only be rejected). Any finding the
        call itself discovered is stored and visible in `Case.screening`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ScreeningPending:
      description: >-
        Approval was asked for before the related-party screening has a complete answer
        (`error` = SCREENING_PENDING). Nothing was recorded; the same request succeeds once the
        screening has finished. The body is identical for every case.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AgreementConflict:
      description: >-
        A state conflict. `error` is CASE_CONCURRENT_UPDATE when the case was changed by someone
        else between this caller's read and its write (nothing was written; read it again), or
        INVALID_TRANSITION, or one of the agreement codes
        (AGREEMENT_PREREQUISITES_MISSING, AGREEMENT_NOT_PREPARED, AGREEMENT_LOCKED, DISCLOSURES_STALE,
        DISCLOSURES_NOT_ACCEPTED, SIGNATURE_REF_MISMATCH, CEREMONY_NOT_FOUND, CEREMONY_CASE_MISMATCH,
        CEREMONY_NOT_SIGNED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RegistryUnavailable:
      description: The public register could not be reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SearchHit:
      type: object
      required: [scheme, identifier, name]
      properties:
        scheme: { type: string, example: CZ_ICO }
        identifier: { type: string, example: "27074358" }
        name: { type: string }
        legalFormCode: { type: string, nullable: true }
        legalForm: { type: string, nullable: true, description: Label from the country pack, when the code is known }
        registeredAddress: { type: string, nullable: true }
    SearchResponse:
      type: object
      required: [hits, totalMatches, tooManyMatches]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        totalMatches: { type: integer, description: The register's own count; may exceed hits.length }
        tooManyMatches: { type: boolean, description: The register refused the query as too broad; narrow it }
    Attestation:
      type: object
      required: [id, scheme, identifier, ruleTextHash, parsedMode, confirmedSigners, confirmedRoles, attestedBy, attestedAt]
      properties:
        id: { type: string, format: uuid }
        scheme: { type: string }
        identifier: { type: string }
        ruleTextHash:
          type: string
          description: SHA-256 of the register rule text after case/diacritic/whitespace folding.
        ruleText: { type: string, nullable: true }
        parsedMode:
          type: string
          description: What the heuristic parser said when the operator was asked. Recorded to measure the parser, never to gate on.
        parsedSigners: { type: integer, nullable: true }
        confirmedSigners:
          type: integer
          minimum: 1
          description: What the human decided. This is what binds an agreement.
        confirmedMode:
          type: [string, 'null']
          enum: [SOLE, JOINT_N, JOINT_ALL, null]
          description: Explicitly confirmed mode. Legacy count-only attestations have no confirmed mode.
        confirmedRoles:
          type: array
          items: { type: string }
          description: The offices that must sign. Empty means a plain count — any listed representatives may sign.
        attestedBy: { type: string }
        attestedAt: { type: string, format: date-time }
        supersededAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    AttestRepresentationRequest:
      type: object
      required: [confirmedSigners, ruleTextHash]
      properties:
        confirmedSigners: { type: integer, minimum: 1 }
        confirmedMode:
          type: string
          enum: [SOLE, JOINT_N, JOINT_ALL]
          description: An explicit mode is required to publish a joint statutory representation revision.
        confirmedRoles:
          type: array
          items: { type: string }
        ruleTextHash:
          type: string
          description: Hash of the text the operator actually read; a mismatch answers 409.
        note: { type: string }
    RepresentationDecision:
      type: object
      required: [state, ruleTextHash, parserMode, parserSuggestsRoles]
      properties:
        state:
          type: string
          enum: [ATTESTED, UNATTESTED, SUPERSEDED]
          description: >-
            SUPERSEDED means this entity HAS been confirmed before and the register text has since
            changed — the old confirmation must not be reused.
        ruleText: { type: string, nullable: true }
        ruleTextHash: { type: string }
        parserSuggestsSigners: { type: integer, nullable: true }
        parserSuggestsRoles:
          type: array
          items: { type: string }
        parserMode: { type: string }
        attestation:
          allOf: [{ $ref: '#/components/schemas/Attestation' }]
          nullable: true
        previous:
          allOf: [{ $ref: '#/components/schemas/Attestation' }]
          nullable: true
          description: The confirmation that was superseded, so the reviewer is told what changed.
    UboFinding:
      type: object
      properties:
        scheme: { type: string }
        identifier: { type: string }
        source:
          type: string
          enum: [REGISTER, SELF_DECLARATION, UNAVAILABLE]
        owners:
          type: array
          items: { $ref: '#/components/schemas/BeneficialOwner' }
        registerStatements:
          type: array
          description: Statements the company filed, e.g. that no individual PSC has been identified.
          items: { type: string }
        threshold:
          type: number
          format: double
          description: The jurisdiction's ownership threshold from its country pack (AMLD5 default 0.25).
        registerName: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true }
        requiresDeclaration:
          type: boolean
          description: True whenever the source is not a register — the bank still has to ask a human.
        fetchedAt: { type: string, format: date-time }
      required: [scheme, identifier, source, owners, registerStatements, threshold, requiresDeclaration, fetchedAt]
    BeneficialOwner:
      type: object
      description: >-
        One person or entity a register names as a beneficial owner. `band` is a band and never a
        percentage: the UK PSC register publishes `ownership-of-shares-25-to-50-percent` and nothing
        finer, so a precise figure would be invented rather than reported. `natureOfControl` carries
        the register's own vocabulary verbatim.
      properties:
        fullName: { type: string }
        sourceRecordRef:
          type: [string, 'null']
          description: >-
            Companies House PSC record path scoped to this company. This identifies the source
            observation, not the natural or legal person across companies. Null when absent or invalid.
        registrationNumber:
          type: [string, 'null']
          description: >-
            Corporate PSC registration number as filed by Companies House. Together with its
            jurisdiction this is candidate identity evidence, not an automatic entity match.
        countryRegistered:
          type: [string, 'null']
          description: >-
            Filed jurisdiction of a corporate PSC. Null when absent, invalid or not corporate.
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Null where the register publishes only a partial date (Companies House gives month and year).
        nationality: { type: string, nullable: true }
        countryOfResidence: { type: string, nullable: true }
        band:
          type: string
          enum: [BELOW_THRESHOLD, PCT_25_TO_50, PCT_50_TO_75, PCT_75_TO_100, UNQUANTIFIED]
        natureOfControl:
          type: array
          items: { type: string }
        notifiedOn: { type: string, format: date, nullable: true }
        corporate:
          type: boolean
          description: True when the owner is itself a company, so the ownership chain does not end here.
      required: [fullName, band, natureOfControl, corporate]
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: [string, 'null']
    IdentifierScheme:
      type: string
      enum: [CZ_ICO, SK_ICO, PL_NIP, PL_KRS, DE_HRB, AT_FN, GB_CRN, FR_SIREN, NL_KVK, LEI, EUID, EU_VAT, DUNS]
    LegalFormClass:
      type: string
      enum: [SOLE_TRADER, LIMITED_COMPANY, JOINT_STOCK, PARTNERSHIP, COOPERATIVE, FOUNDATION, PUBLIC_BODY, BRANCH, OTHER]
    EntityStatus:
      type: string
      enum: [ACTIVE, DISSOLVED, IN_LIQUIDATION, INSOLVENT, UNKNOWN]
    RepresentationMode:
      type: string
      enum: [SOLE, JOINT_ALL, JOINT_N, UNKNOWN]
    CaseStatus:
      type: string
      enum: [IDENTIFIER_ENTERED, REGISTRY_VERIFIED, INITIATOR_MATCHED, AWAITING_COSIGNERS, READY_TO_SIGN, SIGNED, ACTIVE, MANUAL_REVIEW, REJECTED, ABANDONED]
    SignerStatus:
      type: string
      enum: [INVITED, IDENTIFIED, SIGNED, DECLINED]
    Scheme:
      type: object
      properties:
        scheme:
          $ref: '#/components/schemas/IdentifierScheme'
        country:
          type: [string, 'null']
        displayName:
          type: string
        checksum:
          type: boolean
        example:
          type: string
    DeclaredEntity:
      type: object
      required: [legalName, countryCode]
      properties:
        legalName:
          type: string
        countryCode:
          type: string
        legalFormClass:
          $ref: '#/components/schemas/LegalFormClass'
        addressLine1:
          type: [string, 'null']
        city:
          type: [string, 'null']
        postalCode:
          type: [string, 'null']
    LookupRequest:
      type: object
      required: [scheme, identifier]
      properties:
        scheme:
          $ref: '#/components/schemas/IdentifierScheme'
        identifier:
          type: string
        declared:
          $ref: '#/components/schemas/DeclaredEntity'
    StartCaseRequest:
      type: object
      required: [scheme, identifier, initiatorPartyId]
      properties:
        scheme:
          $ref: '#/components/schemas/IdentifierScheme'
        identifier:
          type: string
        initiatorPartyId:
          type: string
          format: uuid
        declared:
          $ref: '#/components/schemas/DeclaredEntity'
    MatchInitiatorRequest:
      type: object
      required: [claimedName]
      properties:
        representativeIndex:
          type: [integer, 'null']
        claimedName:
          type: string
        dateOfBirth:
          type: [string, 'null']
          format: date
    InviteCosignersRequest:
      type: object
      required: [representativeIndexes]
      properties:
        representativeIndexes:
          type: array
          items:
            type: integer
    ClaimInvitationRequest:
      type: object
      properties:
        partyId:
          type: string
          format: uuid
    SignRequest:
      type: object
      required: [signatureRef]
      properties:
        signatureRef:
          type: string
    ResolveReviewRequest:
      type: object
      required: [requiredSignatures]
      properties:
        requiredSignatures:
          type: integer
          minimum: 1
        requiredSignerRoles:
          type: array
          items:
            type: string
          description: >-
            The offices that must sign, when the register names them. Absent or empty means a plain
            count — any listed representative may sign. Optional, and additive: the server has
            always parsed it (ResolveReviewRequest.requiredSignerRoles), and it decides whether the
            case goes straight to READY_TO_SIGN or waits for the named offices
            (BusinessOnboardingCase.reviewResolved). Publishing it is what lets a generated client
            send it at all.
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
    Representative:
      type: object
      properties:
        index:
          type: integer
        fullName:
          type: string
        dateOfBirth:
          type: [string, 'null']
          format: date
        body:
          type: [string, 'null']
        role:
          type: [string, 'null']
        since:
          type: [string, 'null']
          format: date
    RegistryExtract:
      type: object
      properties:
        scheme:
          $ref: '#/components/schemas/IdentifierScheme'
        identifier:
          type: string
        country:
          type: [string, 'null']
        legalName:
          type: string
        legalFormCode:
          type: [string, 'null']
        legalFormClass:
          $ref: '#/components/schemas/LegalFormClass'
        status:
          $ref: '#/components/schemas/EntityStatus'
        registeredAddress:
          type: [object, 'null']
          properties:
            line1:
              type: [string, 'null']
            city:
              type: [string, 'null']
            postalCode:
              type: [string, 'null']
            countryCode:
              type: string
        incorporatedOn:
          type: [string, 'null']
          format: date
        taxId:
          type: [string, 'null']
        representatives:
          type: array
          items:
            $ref: '#/components/schemas/Representative'
        representationRule:
          type: object
          properties:
            mode:
              $ref: '#/components/schemas/RepresentationMode'
            requiredSigners:
              type: [integer, 'null']
            sourceText:
              type: [string, 'null']
        source:
          type: string
        sourceRef:
          type: [string, 'null']
        verification:
          type: string
          enum: [VERIFIED, UNVERIFIED]
        fetchedAt:
          type: string
          format: date-time
    Signer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        representativeIndex:
          type: [integer, 'null']
        fullName:
          type: string
        partyId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/SignerStatus'
        isInitiator:
          type: boolean
        invitedAt:
          type: [string, 'null']
          format: date-time
        identifiedAt:
          type: [string, 'null']
          format: date-time
        signedAt:
          type: [string, 'null']
          format: date-time
        invitationToken:
          type: [string, 'null']
          description: Present only in the initiator's view.
    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CaseStatus'
        scheme:
          $ref: '#/components/schemas/IdentifierScheme'
        identifier:
          type: string
        country:
          type: [string, 'null']
        initiatorPartyId:
          type: string
          format: uuid
        entityPartyId:
          type: [string, 'null']
          format: uuid
        requiredSignatures:
          type: [integer, 'null']
        requiredSignerRoles:
          type: array
          items: { type: string }
          description: >-
            The offices the attested rule requires. Empty means a plain count — any listed
            representatives may sign. Non-empty means each office must be filled by a distinct signer.
        signedCount:
          type: integer
        extract:
          oneOf:
            - $ref: '#/components/schemas/RegistryExtract'
            - type: 'null'
        signers:
          type: array
          items:
            $ref: '#/components/schemas/Signer'
        reviewReason:
          type: [string, 'null']
          description: >-
            Why the case is under review. On a customer response an AML review carries no flags and
            no cause; an operator response carries the flags the customer's own answers raised.
        questionnaire:
          oneOf:
            - $ref: '#/components/schemas/Questionnaire'
            - type: 'null'
        declarations:
          oneOf:
            - $ref: '#/components/schemas/Declarations'
            - type: 'null'
        agreement:
          oneOf:
            - $ref: '#/components/schemas/AgreementSummary'
            - type: 'null'
        screening:
          description: >-
            Related-party sanctions / PEP screening. Operator view only — always null on a response
            a customer can read.
          oneOf:
            - $ref: '#/components/schemas/CaseScreening'
            - type: 'null'
        monitoring:
          description: >-
            What ongoing monitoring reported after approval and what was decided. Null when
            nothing was reported. Operator view only — always null on a response a customer can
            read. The case's `status` and `updatedAt` are the same whatever is here.
          oneOf:
            - $ref: '#/components/schemas/CaseMonitoring'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DisposeFindingRequest:
      type: object
      required: [disposition, reason]
      properties:
        disposition:
          type: string
          enum: [OPEN, CLEARED_FALSE_POSITIVE, CONFIRMED]
          description: >-
            CLEARED_FALSE_POSITIVE or CONFIRMED. OPEN is the state a finding starts in and is
            refused here with 400: a decision cannot be withdrawn through this route.
        reason:
          type: string
          minLength: 10
    CaseScreening:
      type: object
      required: [complete, openFindings, subjects]
      properties:
        openFindings:
          type: integer
          description: Findings with no disposition. The case cannot be approved while this is above zero.
        complete:
          type: boolean
          description: >-
            Every subject has an answer and the beneficial owners were established. False while any
            subject is PENDING, and while `ownerSource` is UNAVAILABLE.
        ownerSource:
          type: [string, 'null']
          enum: [REGISTER, SELF_DECLARATION, UNAVAILABLE, null]
          description: Where the beneficial owners among the subjects came from when the list was last built.
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningSubject'
    ScreeningSubject:
      type: object
      required: [key, kind, name, organisation, sanctions, pep, current]
      properties:
        key:
          type: string
          description: Identifies the subject on the disposition route.
        current:
          type: boolean
          description: False for a subject that left the case and is kept because of its finding.
        disposition:
          type: [string, 'null']
          enum: [OPEN, CLEARED_FALSE_POSITIVE, CONFIRMED, null]
          description: Null when there is nothing to decide.
        disposedBy:
          type: [string, 'null']
        dispositionReason:
          type: [string, 'null']
        disposedAt:
          type: [string, 'null']
          format: date-time
        kind:
          type: string
          enum: [ENTITY, REPRESENTATIVE, BENEFICIAL_OWNER, DECLARED_PERSON]
        name:
          type: string
        organisation:
          type: boolean
          description: True for a legal person, false for a natural person.
        sanctions:
          type: string
          enum: [PENDING, CLEAR, POTENTIAL_HIT, HIT]
          description: PENDING means no answer was obtained — never "clear".
        pep:
          type: boolean
          description: A politically exposed person match. A customer-risk fact, never a sanctions hit.
        matchedName:
          type: [string, 'null']
        screenedAt:
          type: [string, 'null']
          format: date-time
        monitoringState:
          type: [string, 'null']
          description: >-
            Where the subject stands with the monitored-subject registry: PENDING (owed), SYNCED
            (accepted) or REFUSED (the registry's validation rejects it as it is — the subject is
            approved and NOT monitored). Null when the subject is not to be registered, and on
            list responses.
    CaseMonitoring:
      type: object
      required: [findings]
      properties:
        reviewSince:
          type: [string, 'null']
          format: date-time
          description: Since when a finding has been waiting for a decision; null when none is.
        exitOwedSince:
          type: [string, 'null']
          format: date-time
          description: >-
            Since when a confirmed sanctions match requires an exit that is not yet recorded as
            carried out. Read off the findings; nobody sets it.
        exitCompleted:
          oneOf:
            - $ref: '#/components/schemas/ExitCompletion'
            - type: 'null'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/MonitoringFinding'
    ExitCompletion:
      type: object
      required: [completedAt, completedBy, evidence]
      properties:
        completedAt:
          type: string
          format: date-time
        completedBy:
          type: string
        evidence:
          type: string
    CompleteExitRequest:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: string
          minLength: 10
          description: What was done and where the record of it is. Who records it is the authenticated operator.
    MonitoringFinding:
      type: object
      description: >-
        One finding of sanctions-service's ongoing monitoring, as received on
        MONITORED_SUBJECT_MATCHED, and its decision. It names a list entry and a subject key,
        never a person. `matchKind`, `listType`, `matchStatus` and `detection` are the producer's
        values kept verbatim as text, so a value added there is shown here rather than rejected.
      required: [findingId, subjectKey, matchKind, listType, listEntryRef, listEntryVersion, matchScore, matchStatus, detection, receivedAt, disposition]
      properties:
        findingId:
          type: string
          format: uuid
        subjectKey:
          type: string
          description: '`key` of the subject in `Case.screening.subjects`.'
        matchKind:
          type: string
          description: SANCTIONS, TERRORIST, PEP or JURISDICTION today. A confirmed PEP match is a risk fact; every other confirmed value requires an exit.
        listType:
          type: string
        listEntryRef:
          type: string
        listEntryVersion:
          type: string
        matchScore:
          type: number
        matchStatus:
          type: string
        detection:
          type: string
          description: LIST_DELTA, BASELINE_SWEEP or PERIODIC_SWEEP today.
        receivedAt:
          type: string
          format: date-time
        disposition:
          type: string
          enum: [OPEN, CLEARED_FALSE_POSITIVE, CONFIRMED]
        decidedBy:
          type: [string, 'null']
        decisionReason:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
    Questionnaire:
      type: object
      required: [purpose, expectedMonthlyTurnover, sourceOfFunds, cashIntensive, countries, taxResidencies, fatcaStatus, crsStatus]
      properties:
        purpose:
          type: string
          enum: [OPERATING_ACCOUNT, SAVINGS, PAYMENTS_ESHOP, HOLDING, OTHER]
        purposeNote:
          type: [string, 'null']
          maxLength: 500
          description: Required when purpose is OTHER.
        expectedMonthlyTurnover:
          type: string
          enum: [UP_TO_100K, UP_TO_1M, UP_TO_10M, OVER_10M]
          description: CZK per month.
        sourceOfFunds:
          type: array
          minItems: 1
          items:
            type: string
            enum: [BUSINESS_REVENUE, SHARE_CAPITAL, LOANS, INVESTMENTS, OTHER]
        sourceOfFundsNote:
          type: [string, 'null']
          maxLength: 500
          description: Required when sourceOfFunds includes OTHER.
        cashIntensive:
          type: boolean
        countries:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[A-Z]{2}$' }
        taxResidencies:
          type: array
          minItems: 1
          description: The ENTITY's tax residencies (ISO-3166 alpha-2).
          items: { type: string, pattern: '^[A-Z]{2}$' }
        fatcaStatus:
          type: string
          enum: [ACTIVE_NFFE, PASSIVE_NFFE, FINANCIAL_INSTITUTION, US_PERSON]
        crsStatus:
          type: string
          enum: [ACTIVE_NFE, PASSIVE_NFE, FINANCIAL_INSTITUTION]
        answeredAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
        answeredBy:
          type: [string, 'null']
          format: uuid
          readOnly: true
    PepEntryRequest:
      type: object
      required: [name, isPep]
      properties:
        name: { type: string }
        isPep: { type: boolean }
        detail:
          type: [string, 'null']
          description: The public function; required when isPep is true.
    DeclarationsRequest:
      type: object
      required: [uboConfirmed, truthful]
      properties:
        uboConfirmed:
          type: boolean
          description: True when the register's beneficial-owner list is correct.
        uboDiscrepancyNote:
          type: [string, 'null']
          maxLength: 500
        peps:
          type: array
          items:
            $ref: '#/components/schemas/PepEntryRequest'
        truthful:
          type: boolean
          description: Must be true.
    Declarations:
      type: object
      properties:
        uboConfirmed: { type: boolean }
        uboDiscrepancyNote: { type: [string, 'null'] }
        peps:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              isPep: { type: boolean }
              detail: { type: [string, 'null'] }
              fromProfile:
                type: boolean
                description: The value came from the person's customer profile, not this declaration.
        truthful: { type: boolean }
        profileConflicts:
          type: array
          items: { type: string }
          description: Names whose declared PEP status contradicted their customer profile.
        declaredAt: { type: [string, 'null'], format: date-time }
        declaredBy: { type: [string, 'null'], format: uuid }
    DisclosureRef:
      type: object
      required: [code, version, sha256]
      properties:
        code: { type: string }
        version: { type: string }
        sha256: { type: string }
    AcceptDisclosuresRequest:
      type: object
      required: [disclosures]
      properties:
        disclosures:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureRef'
    AgreementSummary:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        ceremonyId:
          type: string
          format: uuid
          description: The only value `POST /sign` accepts as signatureRef.
        templateCode: { type: string }
        templateVersion: { type: string }
        sha256: { type: string }
        lang: { type: string, enum: [cs, en] }
        acceptedDisclosures:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureRef'
        acceptedAt: { type: [string, 'null'], format: date-time }
        acceptedBy: { type: [string, 'null'], format: uuid }
        acceptedByParties:
          type: array
          items: { type: string, format: uuid }
    BusinessAgreement:
      type: object
      description: document-service's BusinessAgreement, passed through.
      properties:
        caseId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        templateCode: { type: string }
        templateVersion: { type: string }
        sha256: { type: string }
        sealedSha256: { type: [string, 'null'] }
        ceremonyId: { type: string, format: uuid }
        ceremonyStatus:
          type: string
          enum: [PENDING, PARTIALLY_SIGNED, COMPLETED, DECLINED, EXPIRED]
        signers:
          type: array
          items:
            type: object
            properties:
              partyRef: { type: string, format: uuid }
              status: { type: string, enum: [PENDING, SIGNED, DECLINED] }
              signedAt: { type: [string, 'null'] }
        disclosures:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              version: { type: string }
              title: { type: [string, 'null'] }
              sha256: { type: string }
              documentId: { type: [string, 'null'], format: uuid }
    QuestionnairePrefill:
      type: object
      properties:
        knownPersons:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              partyId: { type: string, format: uuid }
              pep:
                type: [boolean, 'null']
                description: Rendered only for the caller's own entry.
              pepOnFile:
                type: boolean
                description: The bank holds this person's PEP status; do not ask for it.
        previousQuestionnaire:
          oneOf:
            - $ref: '#/components/schemas/Questionnaire'
            - type: 'null'
