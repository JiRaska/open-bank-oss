openapi: 3.1.0
info:
  title: OpenBank Risk Engine API
  # 1.0.0: first contract (ADR-0314 phase 0, issue #10618).
  # 1.1.0: curve sets and snapshot cash flows (ADR-0313 D4, ADR-0314 D6) — additive.
  # 1.2.0: loans as contract-level instruments (ADR-0314 D4) — LOAN position kind (Position.kind is
  #        now declared x-extensible-enum: kinds grow with each contract source), instrumentId,
  #        GET .../instruments; cash flows now expand loans. Additive.
  # 1.3.0: bounded run and curve-set lists (GET /snapshots, GET /curve-sets) for the admin console
  #        (#10618) — additive. Readable by ROLE_RISK / ROLE_FINANCE as well as operators; writes
  #        by ROLE_RISK / ROLE_OPERATOR / ROLE_ADMIN humans only.
  # 1.4.0: IRRBB read GET /snapshots/{id}/irrbb (ADR-0313 phase 1) — repricing gap, ΔEVE under the
  #        six BCBS d368 scenarios, ΔNII, optional caller-supplied Tier 1. Additive.
  # 1.5.0: LCR / NSFR read GET /snapshots/{id}/liquidity (ADR-0313 phase 1) — BCBS d238 / d295
  #        standard factors from a versioned parameter set. Additive.
  # 1.6.0: Pillar 1 credit-risk capital GET /snapshots/{id}/capital (ADR-0313 phase 2) — BCBS d424
  #        standardised-approach RWA, 8% own-funds requirement and capital ratios. Additive.
  version: 1.6.0
  description: |
    Read-only balance-sheet risk engine (ADR-0313, ADR-0314). A snapshot run pulls the ledger
    trial balance and the deposit-control sub-ledger balances for an as-of date, expands them into
    contract-level positions and ties those out to the trial balance per (GL account, currency)
    with zero tolerance. A run that does not tie out is stored and flagged but its positions are
    never served (ADR-0314 D3).

    Positions carry the trial-balance sign convention (`debit − credit`). Every run states its
    `provenance` — `synthetic` or `production` (ADR-0313 D13).

    Loans (ADR-0314 D4) are read from lending's loan book at snapshot time — a deliberate pull,
    since no event carries a loan's remaining schedule — and enter the run as contract-level
    instruments (`LOAN` positions on Loans Receivable 1200–1203), tied out to the ledger exactly
    like customer deposits. The loan book is part of the run's input hash.

    Curve sets are uploaded by operators as simple money-market quotes (tenors up to 1Y) and
    bootstrapped into continuously-compounded zero curves (ACT/365F, linear on zero rates, flat
    extrapolation). Cash flows are derived per request from a TIED_OUT run, a curve set and a
    named, versioned behavioural model, and are never stored (ADR-0314 D6). Flow amounts are
    signed from the bank's side: inflow positive, outflow negative.
servers:
  - url: http://localhost:8159
tags:
  - name: Risk
security:
  - bearerAuth: []

paths:
  /api/v1/risk/snapshots:
    get:
      tags: [Risk]
      operationId: listSnapshots
      summary: The most recently recorded snapshot runs, newest first
      description: |
        Run manifests without their mismatch rows (`mismatchCount` only; the mismatches are on
        `GET /snapshots/{id}`). Requires ROLE_RISK, ROLE_FINANCE, ROLE_OPERATOR or ROLE_ADMIN.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1..100 (default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: The runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRunList'
        '400':
          description: '`limit` outside 1..100'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
    post:
      tags: [Risk]
      operationId: createSnapshot
      summary: Build (or replay) the balance-sheet snapshot for an as-of date
      description: |
        Idempotent on `(asOf, inputHash)`, where `inputHash` is the SHA-256 of a canonical,
        order-independent serialisation of both ledger reads. The same ledger at the same as-of
        returns the existing run with 200; changed ledger data at the same as-of creates a new run
        (201) with a later `recordedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequest'
      responses:
        '201':
          description: New run stored (TIED_OUT or UNTIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRun'
        '200':
          description: Replay — the run already stored for this as-of and input hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRun'
        '400':
          description: Missing or malformed `asOf`
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /api/v1/risk/snapshots/{id}:
    get:
      tags: [Risk]
      operationId: getSnapshot
      summary: Run manifest, including every tie-out mismatch
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRun'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run

  /api/v1/risk/snapshots/{id}/positions:
    get:
      tags: [Risk]
      operationId: getSnapshotPositions
      summary: Positions of a TIED_OUT run
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run's positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Positions'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run
        '409':
          description: The run is UNTIED; its positions are never served (ADR-0314 D3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Untied'

  /api/v1/risk/snapshots/{id}/instruments:
    get:
      tags: [Risk]
      operationId: getSnapshotInstruments
      summary: Contract-level instruments of a TIED_OUT run (ADR-0314 D4)
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run's instruments (loans in this slice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instruments'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run
        '409':
          description: The run is UNTIED; its instruments are never served (ADR-0314 D3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Untied'

  /api/v1/risk/snapshots/{id}/cash-flows:
    get:
      tags: [Risk]
      operationId: getSnapshotCashFlows
      summary: Bucketed cash flows and PV of a TIED_OUT run under a curve set
      description: |
        Phase 0 expands every SUB_LEDGER (customer deposit) position as a non-maturity deposit
        under the behavioural model named in the response. GL_ACCOUNT positions are counted in
        `notExpanded`, not dropped; loans are not in the snapshot yet. A currency with no
        discounting curve in the set (CZK → CZEONIA, EUR → ESTR) is listed in `unpriced` with a
        null `presentValue`, never valued at zero. The curve set must be as of the run's date.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: curveSetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The run's derived cash flows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlows'
        '400':
          description: Missing or malformed `curveSetId`, or a curve set for another as-of date
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run or curve set
        '409':
          description: The run is UNTIED; nothing derived from it is served (ADR-0314 D3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Untied'

  /api/v1/risk/snapshots/{id}/irrbb:
    get:
      tags: [Risk]
      operationId: getSnapshotIrrbb
      summary: IRRBB of a TIED_OUT run under a curve set
      description: |
        Repricing gap per currency (by repricing date), ΔEVE per currency under the six BCBS d368
        Annex 2 scenarios (`deltaEve = PV(shocked) − PV(base)`, negative is a loss), ΔNII over 12
        months under parallel up/down, the worst case, and the assumptions that produced them.
        Shock sizes are configuration: a currency without them is listed in `shockNotConfigured`
        and gets no scenarios. `tier1Capital` is optional and only ever the caller's; without it
        the supervisory outlier ratio is not computed. Derived on request, never stored.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: curveSetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: tier1Capital
          in: query
          required: false
          description: Tier 1 capital in the book's currency, positive. Never defaulted.
          schema:
            type: string
            pattern: '^[0-9]+(\.[0-9]+)?$'
      responses:
        '200':
          description: The run's IRRBB figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Irrbb'
        '400':
          description: Missing or malformed `curveSetId` / `tier1Capital`, or a curve set for another as-of date
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run or curve set
        '409':
          description: The run is UNTIED; nothing derived from it is served (ADR-0314 D3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Untied'

  /api/v1/risk/snapshots/{id}/liquidity:
    get:
      tags: [Risk]
      operationId: getSnapshotLiquidity
      summary: LCR and NSFR of a TIED_OUT run
      description: |
        Liquidity Coverage Ratio (BCBS d238) and Net Stable Funding Ratio (BCBS d295) per currency,
        with a total only for a single-currency book. Every component line carries its factor, the
        configuration key it came from and the BCBS paragraph. Factors and classification choices
        come from the versioned parameter set `openbank.risk.liquidity.*`, named on the result.
        BCBS standard factors; EU CRR / Delegated Regulation (EU) 2015/61 deviations not applied.
        A GL balance the configured classification does not name is listed in `unclassified` and
        counted nowhere. Derived on request, never stored.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run's LCR and NSFR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liquidity'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run
        '409':
          description: The run is UNTIED; nothing derived from it is served (ADR-0314 D3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Untied'

  /api/v1/risk/snapshots/{id}/capital:
    get:
      tags: [Risk]
      operationId: getSnapshotCapital
      summary: Pillar 1 credit-risk capital (standardised approach) of a TIED_OUT run
      description: |
        Credit-risk risk-weighted assets under the BCBS d424 standardised approach, per exposure
        class and per position, with the risk weight, its configuration key and its d424
        paragraph; the own-funds requirement (8% × RWA, bcbs189 ¶50); and CET1 / Tier 1 / Total
        capital ratios when own funds are in the snapshot (`ratiosNotComputable` says why not).
        BCBS d424 SA weights; EU CRR Part Three Title II Chapter 2 not applied. The ratios use
        CREDIT-RISK RWA only, so they are an upper bound. Per currency; total, requirement and
        ratios only for a single-currency book. A GL balance the classification does not name is
        listed in `unclassified` and counted nowhere. Derived on request, never stored.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run's credit-risk RWA, requirement and ratios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capital'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such run
        '409':
          description: The run is UNTIED; nothing derived from it is served (ADR-0314 D3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Untied'

  /api/v1/risk/curve-sets:
    get:
      tags: [Risk]
      operationId: listCurveSets
      summary: The most recently recorded curve sets, newest first
      description: |
        Curve sets without their pillars (`indices` names the curves each holds). Requires
        ROLE_RISK, ROLE_FINANCE, ROLE_OPERATOR or ROLE_ADMIN.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1..100 (default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: The curve sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurveSetList'
        '400':
          description: '`limit` outside 1..100'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
    post:
      tags: [Risk]
      operationId: createCurveSet
      summary: Upload money-market quotes per index; they are bootstrapped and stored
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCurveSetRequest'
      responses:
        '201':
          description: Curve set stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurveSet'
        '400':
          description: Missing or invalid field, unknown index, tenor beyond 1Y or duplicate tenor
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /api/v1/risk/curve-sets/{id}:
    get:
      tags: [Risk]
      operationId: getCurveSet
      summary: A stored curve set with its pillars and discount factors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The curve set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurveSet'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: No such curve set

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateSnapshotRequest:
      type: object
      required: [asOf]
      properties:
        asOf:
          type: string
          format: date

    Mismatch:
      type: object
      required: [currency, ledgerNet, positionsNet, difference]
      properties:
        glAccountCode:
          type: [string, 'null']
          description: Null for positions that could not be mapped to any GL account.
        currency:
          type: string
        ledgerNet:
          type: number
        positionsNet:
          type: number
        difference:
          type: number
          description: positionsNet − ledgerNet.

    SnapshotRun:
      type: object
      required: [id, asOf, recordedAt, inputHash, provenance, status, positionCount, mismatchCount, mismatches]
      properties:
        id:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        recordedAt:
          type: string
          format: date-time
        inputHash:
          type: string
          description: SHA-256 (lowercase hex) of the canonical ledger inputs.
        provenance:
          type: string
          enum: [synthetic, production]
        status:
          type: string
          enum: [TIED_OUT, UNTIED]
        positionCount:
          type: integer
        mismatchCount:
          type: integer
        mismatches:
          type: array
          items:
            $ref: '#/components/schemas/Mismatch'

    SnapshotRunSummary:
      type: object
      required: [id, asOf, recordedAt, provenance, status, positionCount, mismatchCount]
      properties:
        id:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        recordedAt:
          type: string
          format: date-time
        provenance:
          type: string
          enum: [synthetic, production]
        status:
          type: string
          enum: [TIED_OUT, UNTIED]
        positionCount:
          type: integer
        mismatchCount:
          type: integer

    SnapshotRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotRunSummary'

    Position:
      type: object
      required: [kind, currency, amount]
      properties:
        kind:
          type: string
          # x-extensible-enum, not enum: the position kinds GROW as ADR-0314 D4 brings contract
          # sources in (LOAN now, treasury kinds with ADR-0315). A client must tolerate an unknown
          # kind; declaring the set closed would make every new source a URL-major break.
          x-extensible-enum: [SUB_LEDGER, GL_ACCOUNT, LOAN]
          description: >-
            SUB_LEDGER (a customer balance on deposit control), GL_ACCOUNT (a GL account with no finer
            breakdown) or LOAN (a loan from lending's loan book, ADR-0314 D4). The set grows.
        glAccountCode:
          type: [string, 'null']
        glAccountType:
          type: [string, 'null']
        currency:
          type: string
        subAccountId:
          type: [string, 'null']
          format: uuid
        amount:
          type: number
          description: Trial-balance sign convention, debit − credit.
        instrumentId:
          type: [string, 'null']
          description: For a LOAN position, the instrument it came from.

    Instrument:
      type: object
      required: [id, kind, currency, outstanding]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [AMORTISING_LOAN, BULLET, NON_MATURITY_DEPOSIT, TERM_DEPOSIT, CURRENT_ACCOUNT, FX_POSITION,
            CASH_NOSTRO, BOND, MONEY_MARKET_DEAL, DERIVATIVE_LEG, EQUITY_CAPITAL]
        glAccountCode:
          type: [string, 'null']
        currency:
          type: string
        outstanding:
          type: number
          description: Trial-balance sign convention, debit − credit (a loan is positive).
        valueDate:
          type: [string, 'null']
          format: date
        maturityDate:
          type: [string, 'null']
          format: date
        rateTerms:
          type: [object, 'null']
          properties:
            rateType:
              type: string
              enum: [FIXED, FLOATING]
            currentAnnualRate:
              type: [number, 'null']
            index:
              type: [string, 'null']
              enum: [CZEONIA, PRIBOR_1M, PRIBOR_3M, PRIBOR_6M, ESTR, EURIBOR_3M, null]
            spread:
              type: [number, 'null']
            resetFrequencyMonths:
              type: [integer, 'null']
            nextResetDate:
              type: [string, 'null']
              format: date
        counterpartyRef:
          type: [string, 'null']
          description: Opaque party reference; identity stays in party-service.
        ifrs9Stage:
          type: [string, 'null']
        loan:
          type: [object, 'null']
          properties:
            method:
              type: string
              enum: [ANNUITY, EQUAL_PRINCIPAL, BULLET]
            periodsPerYear:
              type: integer
            remainingPeriods:
              type: integer
            nextDueDate:
              type: [string, 'null']
              format: date
            remainingInstallments:
              type: array
              items:
                type: object
                properties:
                  number:
                    type: integer
                  dueDate:
                    type: string
                    format: date
                  principal:
                    type: number
                  interest:
                    type: number

    Instruments:
      type: object
      required: [runId, asOf, instruments]
      properties:
        runId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'

    Positions:
      type: object
      required: [runId, asOf, positions]
      properties:
        runId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    Untied:
      type: object
      required: [error, runId, mismatches]
      properties:
        error:
          type: string
          const: UNTIED
        runId:
          type: string
          format: uuid
        mismatches:
          type: array
          items:
            $ref: '#/components/schemas/Mismatch'

    CurveIndex:
      type: string
      enum: [CZEONIA, PRIBOR_1M, PRIBOR_3M, PRIBOR_6M, ESTR, EURIBOR_3M]

    Quote:
      type: object
      required: [tenor, rate]
      properties:
        tenor:
          type: string
          description: ON, or <n>D (n ≤ 7), <n>W, <n>M (n ≤ 12), 1Y.
          examples: [ON, 1W, 3M, 12M]
        rate:
          type: number
          description: Simple money-market rate as a fraction (0.035 = 3.5 %).

    CreateCurveSetRequest:
      type: object
      required: [asOf, provenance, source, curves]
      properties:
        asOf:
          type: string
          format: date
        provenance:
          type: string
          enum: [synthetic, production]
        source:
          type: string
          maxLength: 256
        curves:
          type: object
          description: Quotes per curve index; keys are CurveIndex values.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Quote'

    Pillar:
      type: object
      required: [date, zeroRate, discountFactor]
      properties:
        date:
          type: string
          format: date
        zeroRate:
          type: number
          description: Continuously-compounded zero rate, ACT/365F.
        discountFactor:
          type: number

    Curve:
      type: object
      required: [index, currency, pillars]
      properties:
        index:
          $ref: '#/components/schemas/CurveIndex'
        currency:
          type: string
        pillars:
          type: array
          items:
            $ref: '#/components/schemas/Pillar'

    CurveSet:
      type: object
      required: [id, asOf, provenance, source, recordedAt, curves]
      properties:
        id:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        provenance:
          type: string
          enum: [synthetic, production]
        source:
          type: string
        recordedAt:
          type: string
          format: date-time
        curves:
          type: array
          items:
            $ref: '#/components/schemas/Curve'

    CurveSetSummary:
      type: object
      required: [id, asOf, provenance, source, recordedAt, indices]
      properties:
        id:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        provenance:
          type: string
          enum: [synthetic, production]
        source:
          type: string
        recordedAt:
          type: string
          format: date-time
        indices:
          type: array
          items:
            type: string

    CurveSetList:
      type: object
      required: [curveSets]
      properties:
        curveSets:
          type: array
          items:
            $ref: '#/components/schemas/CurveSetSummary'

    BehaviouralModel:
      type: object
      required: [id, version, coreRatio, coreRunoffYears, annualDepositRate]
      properties:
        id:
          type: string
        version:
          type: string
        coreRatio:
          type: number
        coreRunoffYears:
          type: integer
        annualDepositRate:
          type: number

    Bucket:
      type: object
      required: [bucket, amount]
      properties:
        bucket:
          type: string
          enum: [overnight, <1M, 1-3M, 3-6M, 6-12M, 1-2Y, 2-3Y, 3-5Y, 5-10Y, '>10Y']
        amount:
          type: number
          description: Sum of flows in the bucket, bank-signed.

    CurrencyCashFlows:
      type: object
      required: [currency, positions, priced, buckets, total]
      properties:
        currency:
          type: string
        discountIndex:
          type: [string, 'null']
        positions:
          type: integer
        priced:
          type: boolean
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
        total:
          type: number
        presentValue:
          type: [number, 'null']
          description: Null when the curve set has no discounting curve for the currency.

    CashFlows:
      type: object
      required:
        - runId
        - asOf
        - provenance
        - curveSetId
        - curveSetProvenance
        - model
        - expandedPositions
        - notExpanded
        - notExpandedReason
        - currencies
        - unpriced
      properties:
        runId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        provenance:
          type: string
          enum: [synthetic, production]
        curveSetId:
          type: string
          format: uuid
        curveSetProvenance:
          type: string
          enum: [synthetic, production]
        model:
          $ref: '#/components/schemas/BehaviouralModel'
        expandedPositions:
          type: integer
        notExpanded:
          type: integer
        notExpandedReason:
          type: string
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyCashFlows'
        unpriced:
          type: array
          items:
            type: string

    GapBucket:
      type: object
      required: [bucket, assets, liabilities, gap, cumulativeGap]
      properties:
        bucket: {type: string}
        assets: {type: number}
        liabilities: {type: number, description: Magnitude of liabilities repricing in the bucket}
        gap: {type: number}
        cumulativeGap: {type: number}

    CurrencyGap:
      type: object
      required: [currency, buckets, totalAssets, totalLiabilities, totalGap]
      properties:
        currency: {type: string}
        buckets:
          type: array
          items: {$ref: '#/components/schemas/GapBucket'}
        totalAssets: {type: number}
        totalLiabilities: {type: number}
        totalGap: {type: number}

    CurrencyScenario:
      type: object
      required: [currency, basePv, shockedPv, deltaEve, eveLoss]
      properties:
        currency: {type: string}
        basePv: {type: number}
        shockedPv: {type: number}
        deltaEve: {type: number, description: PV(shocked) − PV(base); negative is a loss}
        eveLoss: {type: number, description: max(0, −deltaEve) — the d368 sign convention}
        deltaNii: {type: [number, 'null'], description: Parallel up/down only}

    Scenario:
      type: object
      required: [scenario, currencies]
      properties:
        scenario:
          type: string
          enum: [parallel-up, parallel-down, steepener, flattener, short-up, short-down]
        currencies:
          type: array
          items: {$ref: '#/components/schemas/CurrencyScenario'}
        aggregateLoss: {type: [number, 'null'], description: Sum of currency losses; single-currency books only}

    IrrbbAssumptions:
      type: object
      required: [model, shockSizes, shockSource, shortDecayYears, postShockFloorSource, nmdRepricing,
        floatingRepricing, eveBasis, niiBasis, niiHorizonMonths, currencyAggregation]
      properties:
        model: {$ref: '#/components/schemas/BehaviouralModel'}
        shockSizes:
          type: array
          items:
            type: object
            required: [currency, parallelBp, shortBp, longBp]
            properties:
              currency: {type: string}
              parallelBp: {type: number}
              shortBp: {type: number}
              longBp: {type: number}
        shockSource: {type: string}
        shortDecayYears: {type: number}
        postShockFloor:
          type: [object, 'null']
          properties:
            atZeroBp: {type: number}
            slopeBpPerYear: {type: number}
        postShockFloorSource: {type: string}
        nmdRepricing: {type: string}
        floatingRepricing: {type: string}
        eveBasis: {type: string}
        niiBasis: {type: string}
        niiHorizonMonths: {type: integer}
        currencyAggregation: {type: string}

    Irrbb:
      type: object
      required: [runId, asOf, provenance, curveSetId, curveSetProvenance, curveSetSource, gaps, scenarios,
        worstCase, outlierTest, shockNotConfigured, unpriced, assumptions]
      properties:
        runId: {type: string, format: uuid}
        asOf: {type: string, format: date}
        provenance: {type: string}
        curveSetId: {type: string, format: uuid}
        curveSetProvenance: {type: string}
        curveSetSource: {type: string}
        gaps:
          type: array
          items: {$ref: '#/components/schemas/CurrencyGap'}
        scenarios:
          type: array
          items: {$ref: '#/components/schemas/Scenario'}
        worstCase:
          type: object
          required: [byCurrency]
          properties:
            scenario: {type: [string, 'null']}
            loss: {type: [number, 'null']}
            currency: {type: [string, 'null']}
            byCurrency:
              type: object
              additionalProperties: {type: string}
        outlierTest:
          type: object
          required: [tier1Supplied, threshold, note]
          properties:
            tier1Supplied: {type: boolean}
            tier1Capital: {type: [number, 'null']}
            currency: {type: [string, 'null']}
            threshold: {type: number}
            ratio: {type: [number, 'null']}
            breached: {type: [boolean, 'null']}
            note: {type: string}
        shockNotConfigured:
          type: array
          items: {type: string}
        unpriced:
          type: array
          items: {type: string}
        assumptions: {$ref: '#/components/schemas/IrrbbAssumptions'}

    LiquidityLine:
      type: object
      required: [label, amount, weighted, citation]
      properties:
        label: {type: string}
        glAccountCode: {type: [string, 'null']}
        amount: {type: number, description: Balance the factor applies to (positive for a normal balance)}
        factor: {type: [number, 'null'], description: Null for a line reported but not weighted}
        factorKey: {type: [string, 'null']}
        weighted: {type: number}
        citation: {type: string}

    Hqla:
      type: object
      required: [lines, level1, level2a, level2b, adjustmentFor15Cap, adjustmentFor40Cap, level2bCapBinding,
        level2CapBinding, stock]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [level, glClass, glAccountCode, marketValue, haircut, afterHaircut]
            properties:
              level: {type: string, enum: [L1, L2A, L2B]}
              glClass: {type: string}
              glAccountCode: {type: string}
              marketValue: {type: number}
              haircut: {type: number}
              afterHaircut: {type: number}
        level1: {type: number}
        level2a: {type: number}
        level2b: {type: number}
        adjustmentFor15Cap: {type: number}
        adjustmentFor40Cap: {type: number}
        level2bCapBinding: {type: boolean}
        level2CapBinding: {type: boolean}
        stock: {type: number}

    CurrencyLiquidity:
      type: object
      required: [currency, lcr, nsfr]
      properties:
        currency: {type: string}
        lcr:
          type: object
          required: [hqla, outflows, inflows, totalOutflows, totalInflows, inflowCap, cappedInflows,
            inflowCapBinding, netOutflows]
          properties:
            hqla: {$ref: '#/components/schemas/Hqla'}
            outflows:
              type: array
              items: {$ref: '#/components/schemas/LiquidityLine'}
            inflows:
              type: array
              items: {$ref: '#/components/schemas/LiquidityLine'}
            totalOutflows: {type: number}
            totalInflows: {type: number}
            inflowCap: {type: number}
            cappedInflows: {type: number}
            inflowCapBinding: {type: boolean}
            netOutflows: {type: number}
            ratio: {type: [number, 'null'], description: HQLA / net outflows; null when there are none}
        nsfr:
          type: object
          required: [asf, rsf, totalAsf, totalRsf]
          properties:
            asf:
              type: array
              items: {$ref: '#/components/schemas/LiquidityLine'}
            rsf:
              type: array
              items: {$ref: '#/components/schemas/LiquidityLine'}
            totalAsf: {type: number}
            totalRsf: {type: number}
            ratio: {type: [number, 'null'], description: ASF / RSF; null when RSF is zero}

    GlMapping:
      type: object
      required: [key, glClass, description]
      properties:
        key: {type: string}
        glClass: {type: string}
        description: {type: string}

    LiquidityAssumptions:
      type: object
      required: [parameterSetId, parameterSetVersion, source, scope, factors, classification, hqlaCapMethod,
        loanInflows, loanRsf, notInData, currencyAggregation]
      properties:
        parameterSetId: {type: string}
        parameterSetVersion: {type: string}
        source: {type: string}
        scope: {type: string}
        factors:
          type: array
          items:
            type: object
            required: [key, value, citation]
            properties:
              key: {type: string}
              value: {type: number}
              citation: {type: string}
        classification:
          type: object
          required: [retailStableShare, operationalDepositShare, tier2OverOneYearShare,
            loansQualifyForLowRiskWeight, glAccounts, glAccountTypes, choices]
          properties:
            retailStableShare: {type: number}
            operationalDepositShare: {type: number}
            tier2OverOneYearShare: {type: number}
            loansQualifyForLowRiskWeight: {type: boolean}
            glAccounts:
              type: array
              items: {$ref: '#/components/schemas/GlMapping'}
            glAccountTypes:
              type: array
              items: {$ref: '#/components/schemas/GlMapping'}
            choices:
              type: array
              items: {type: string}
        hqlaCapMethod: {type: string}
        loanInflows: {type: string}
        loanRsf: {type: string}
        notInData: {type: string}
        currencyAggregation: {type: string}

    Liquidity:
      type: object
      required: [runId, asOf, provenance, parameterSetId, parameterSetVersion, currencies, unclassified, notes,
        assumptions]
      properties:
        runId: {type: string, format: uuid}
        asOf: {type: string, format: date}
        provenance: {type: string}
        parameterSetId: {type: string}
        parameterSetVersion: {type: string}
        currencies:
          type: array
          items: {$ref: '#/components/schemas/CurrencyLiquidity'}
        total:
          oneOf:
            - {$ref: '#/components/schemas/CurrencyLiquidity'}
            - {type: 'null'}
          description: Present only for a single-currency book
        unclassified:
          type: array
          items:
            type: object
            required: [currency, amount, reason]
            properties:
              glAccountCode: {type: [string, 'null']}
              glAccountType: {type: [string, 'null']}
              currency: {type: string}
              amount: {type: number}
              reason: {type: string}
        notes:
          type: array
          items: {type: string}
        assumptions: {$ref: '#/components/schemas/LiquidityAssumptions'}

    ExposureLine:
      type: object
      required: [exposureClass, label, ead, riskWeight, rwa, factorKey, citation]
      properties:
        exposureClass:
          type: string
          x-extensible-enum: [sovereign-and-central-bank, bank, retail, corporate, defaulted, cash,
            cash-items-in-collection, other-asset]
        label: {type: string}
        glAccountCode: {type: [string, 'null']}
        instrumentId: {type: [string, 'null']}
        ead: {type: number}
        riskWeight: {type: number}
        rwa: {type: number}
        factorKey: {type: string}
        citation: {type: string}

    CurrencyCapital:
      type: object
      required: [currency, classes, lines, totalEad, totalRwa]
      properties:
        currency: {type: string}
        classes:
          type: array
          items:
            type: object
            required: [exposureClass, ead, rwa, citations]
            properties:
              exposureClass: {type: string}
              ead: {type: number}
              rwa: {type: number}
              citations:
                type: array
                items: {type: string}
        lines:
          type: array
          items: {$ref: '#/components/schemas/ExposureLine'}
        totalEad: {type: number}
        totalRwa: {type: number}
        ownFunds:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [lines, cet1BeforeDeductions, cet1Deductions, cet1, at1, tier1, tier2, total]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [glAccountCode, glClass, contribution]
                    properties:
                      glAccountCode: {type: string}
                      glClass: {type: string}
                      contribution: {type: number}
                cet1BeforeDeductions: {type: number}
                cet1Deductions: {type: number}
                cet1: {type: number}
                at1: {type: number}
                tier1: {type: number}
                tier2: {type: number}
                total: {type: number}

    CapitalRatio:
      type: object
      required: [ratio, minimum, meetsMinimum, citation]
      properties:
        ratio: {type: number}
        minimum: {type: number}
        meetsMinimum: {type: boolean}
        citation: {type: string}

    CapitalAssumptions:
      type: object
      required: [parameterSetId, parameterSetVersion, source, scope, factors, classification, exposureValue,
        creditRiskMitigation, offBalanceSheet, defaulted, ownFunds, creditRiskOnly, currencyAggregation]
      properties:
        parameterSetId: {type: string}
        parameterSetVersion: {type: string}
        source: {type: string}
        scope: {type: string}
        factors:
          type: array
          items:
            type: object
            required: [key, value, citation]
            properties:
              key: {type: string}
              value: {type: number}
              citation: {type: string}
        classification:
          type: object
          required: [retailTreatment, bankScraGrade, domesticCurrency, glAccounts, glAccountTypes, choices]
          properties:
            retailTreatment: {type: string}
            bankScraGrade: {type: string}
            domesticCurrency: {type: string}
            glAccounts:
              type: array
              items: {$ref: '#/components/schemas/GlMapping'}
            glAccountTypes:
              type: array
              items: {$ref: '#/components/schemas/GlMapping'}
            choices:
              type: array
              items: {type: string}
        exposureValue: {type: string}
        creditRiskMitigation: {type: string}
        offBalanceSheet: {type: string}
        defaulted: {type: string}
        ownFunds: {type: string}
        creditRiskOnly: {type: string}
        currencyAggregation: {type: string}

    Capital:
      type: object
      required: [runId, asOf, provenance, parameterSetId, parameterSetVersion, currencies, unclassified, notes,
        assumptions]
      properties:
        runId: {type: string, format: uuid}
        asOf: {type: string, format: date}
        provenance: {type: string}
        parameterSetId: {type: string}
        parameterSetVersion: {type: string}
        currencies:
          type: array
          items: {$ref: '#/components/schemas/CurrencyCapital'}
        total:
          oneOf:
            - {$ref: '#/components/schemas/CurrencyCapital'}
            - {type: 'null'}
          description: Present only for a single-currency book
        ownFundsRequirement:
          type: [number, 'null']
          description: min-total-capital-ratio (8%, bcbs189 ¶50) × total credit-risk RWA
        ratios:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [cet1, tier1, total]
              properties:
                cet1: {$ref: '#/components/schemas/CapitalRatio'}
                tier1: {$ref: '#/components/schemas/CapitalRatio'}
                total: {$ref: '#/components/schemas/CapitalRatio'}
        ratiosNotComputable: {type: [string, 'null']}
        unclassified:
          type: array
          items:
            type: object
            required: [currency, amount, reason]
            properties:
              glAccountCode: {type: [string, 'null']}
              glAccountType: {type: [string, 'null']}
              currency: {type: string}
              amount: {type: number}
              reason: {type: string}
        notes:
          type: array
          items: {type: string}
        assumptions: {$ref: '#/components/schemas/CapitalAssumptions'}
