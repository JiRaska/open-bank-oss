quarkus:
  application:
    name: openbank-risk-engine
  http:
    port: 8159
    test-port: 0
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      Referrer-Policy:
        value: no-referrer
      Permissions-Policy:
        value: geolocation=(), microphone=(), camera=()
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: max-age=31536000; includeSubDomains
    limits:
      max-body-size: 1M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_risk
    # A LITERAL jdbc url, not only an env expression: Flyway migrates the DEFAULT (Agroal/JDBC)
    # datasource, and a service that boots only because the environment supplied one cannot start
    # from this repo alone (check-flyway-default-datasource.py, #3080).
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_risk

  flyway:
    # Committing migrations does not run them — this key defaults to FALSE (#3350).
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # LedgerClient carries OidcClientRequestReactiveFilter, which mints its bearer token from HERE.
  # Without an oidc-client the ledger call leaves unauthenticated and ledger answers 401
  # (check-oidc-client-configured.py).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}

  rest-client:
    ledger-service:
      # Local default only. The in-cluster URL (ledger's mTLS listener, 8443) is declared in the
      # gitops Deployment env, where gen-network-policies.py can see the edge; a cluster URL
      # baked in here would be an edge that generator cannot see (network-policy-code-edges).
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
    # ADR-0314 D4: lending's loan-book read. Local default only, as for ledger above; the gitops
    # Deployment points it at lending's private-CA mTLS listener (8443, #10732).
    lending-service:
      url: ${LENDING_SERVICE_URL:http://localhost:8126}

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    console:
      format: '%d{HH:mm:ss} %-5p [%c{3.}] %s%e%n'

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-risk-engine

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q

  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # fx-service's central-bank fixings (ADR-0314 D5), reference data for every snapshot.
      #
      # Every multi-part key below is NESTED, never a dotted leaf: SmallRye's YAML source quotes a
      # leaf key containing a dot, so `group.id: x` registers as ..."group.id" and the connector
      # silently uses its default (#686, #2945). The nested form resolves to the plain property.
      #
      # failure-strategy: the consumer acks malformed events and RETHROWS a failed write after
      # bounded retries. SmallRye's default `fail` would then STOP the channel, so the record is
      # parked in an EXPLICIT per-service dead-letter topic instead (#5745): the implicit name is
      # derived from the channel name alone, which repeats across services. The topic's KafkaTopic
      # CR and this service's Write ACL on it live in openbank-infra (kafka-dlq-topics.yaml,
      # kafka-risk-engine-mtls.yaml) — all four parts or the DLQ send itself wedges.
      fx-fixing-in:
        connector: smallrye-kafka
        topic: openbank.fx.fixing.published
        client:
          id: risk-engine-fx-fixing-${quarkus.uuid}
        group:
          id: risk-engine-fx-fixing
        # A new group with no committed offset: read the retained fixings (30 days) rather than
        # only those published after the first deploy. No replay risk — nothing was consumed yet.
        auto:
          offset:
            reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.risk-engine.fx-fixing-in
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer

openbank:
  risk:
    # ADR-0313 D13: a run says which world it describes. Defaults to synthetic, so a run is
    # labelled production only where an environment explicitly says so.
    provenance: ${OPENBANK_RISK_PROVENANCE:synthetic}
    lending:
      # ADR-0314 D4: read lending's loan book into every snapshot (loans become contract-level
      # instruments tied out on Loans Receivable). Off = Loans Receivable stays GL-level.
      enabled: ${OPENBANK_RISK_LENDING_ENABLED:true}
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout: "${OPA_TIMEOUT:PT0.5S}"

authz:
  enforce: "${AUTHZ_ENFORCE:true}"
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

"%prod":
  quarkus:
    # ledger-service terminates a private-CA mTLS listener on 8443 with client auth REQUIRED, so
    # the ledger rest-client names its own TLS bucket. Local/test fixtures speak plain HTTP, so
    # this stays under %prod: the client certificate only exists in the cluster.
    tls:
      ledger-authority:
        key-store:
          pem:
            client:
              cert: /mnt/ledger-tls/tls.crt
              key: /mnt/ledger-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/ledger-tls/ca.crt
        protocols: TLSv1.3
      # lending-service's 8443 listener (#10732) requires a client certificate from the same
      # private CA, so the same risk-internal-tls pair authenticates this engine to it. A bucket
      # of its own so the two edges stay independently configurable.
      lending-authority:
        key-store:
          pem:
            client:
              cert: /mnt/ledger-tls/tls.crt
              key: /mnt/ledger-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/ledger-tls/ca.crt
        protocols: TLSv1.3
    rest-client:
      ledger-service:
        tls-configuration-name: ledger-authority
      lending-service:
        tls-configuration-name: lending-authority

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      enabled: false
  authz:
    enforce: "false"

"%test":
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
  authz:
    enforce: "false"
