quarkus:
  application:
    name: openbank-risk-engine
  http:
    port: 8159
    test-port: 0
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      Referrer-Policy:
        value: no-referrer
      Permissions-Policy:
        value: geolocation=(), microphone=(), camera=()
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: max-age=31536000; includeSubDomains
    limits:
      max-body-size: 1M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_risk
    # A LITERAL jdbc url, not only an env expression: Flyway migrates the DEFAULT (Agroal/JDBC)
    # datasource, and a service that boots only because the environment supplied one cannot start
    # from this repo alone (check-flyway-default-datasource.py, #3080).
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_risk

  flyway:
    # Committing migrations does not run them — this key defaults to FALSE (#3350).
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}

  # LedgerClient carries OidcClientRequestReactiveFilter, which mints its bearer token from HERE.
  # Without an oidc-client the ledger call leaves unauthenticated and ledger answers 401
  # (check-oidc-client-configured.py).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}

  rest-client:
    ledger-service:
      # Local default only. The in-cluster URL (ledger's mTLS listener, 8443) is declared in the
      # gitops Deployment env, where gen-network-policies.py can see the edge; a cluster URL
      # baked in here would be an edge that generator cannot see (network-policy-code-edges).
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
    # ADR-0314 D4: lending's loan-book read. Local default only, as for ledger above; the gitops
    # Deployment points it at lending's private-CA mTLS listener (8443, #10732).
    lending-service:
      url: ${LENDING_SERVICE_URL:http://localhost:8126}

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    console:
      format: '%d{HH:mm:ss} %-5p [%c{3.}] %s%e%n'

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-risk-engine

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q

  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # fx-service's central-bank fixings (ADR-0314 D5), reference data for every snapshot.
      #
      # Every multi-part key below is NESTED, never a dotted leaf: SmallRye's YAML source quotes a
      # leaf key containing a dot, so `group.id: x` registers as ..."group.id" and the connector
      # silently uses its default (#686, #2945). The nested form resolves to the plain property.
      #
      # failure-strategy: the consumer acks malformed events and RETHROWS a failed write after
      # bounded retries. SmallRye's default `fail` would then STOP the channel, so the record is
      # parked in an EXPLICIT per-service dead-letter topic instead (#5745): the implicit name is
      # derived from the channel name alone, which repeats across services. The topic's KafkaTopic
      # CR and this service's Write ACL on it live in openbank-infra (kafka-dlq-topics.yaml,
      # kafka-risk-engine-mtls.yaml) — all four parts or the DLQ send itself wedges.
      fx-fixing-in:
        connector: smallrye-kafka
        topic: openbank.fx.fixing.published
        client:
          id: risk-engine-fx-fixing-${quarkus.uuid}
        group:
          id: risk-engine-fx-fixing
        # A new group with no committed offset: read the retained fixings (30 days) rather than
        # only those published after the first deploy. No replay risk — nothing was consumed yet.
        auto:
          offset:
            reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.risk-engine.fx-fixing-in
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # fx-service's ČNB policy rates and minimum-reserve facts: the reserve ratio and its
      # remuneration in effect on a snapshot's as-of date come from here, never from constants.
      # Same rules as above: nested keys only, an explicit per-service DLQ (KafkaTopic CR + Write
      # ACL in openbank-infra). The topic is COMPACTED on (instrument, effectiveFrom), so a new
      # group reading from `earliest` rebuilds the full history however late it starts — the
      # facts change a few times a year and would be long gone from a time-retained topic.
      cnb-policy-rate-in:
        connector: smallrye-kafka
        topic: openbank.fx.cnb-policy-rate.published
        client:
          id: risk-engine-cnb-policy-rate-${quarkus.uuid}
        group:
          id: risk-engine-cnb-policy-rate
        auto:
          offset:
            reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.risk-engine.cnb-policy-rate-in
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # treasury-service's `treasury.deal.*` events (ADR-0315 D6): the bank's own money-market deals,
      # kept in treasury_deal and carried into every snapshot as instruments. Same rules as above:
      # nested keys only, an explicit per-service DLQ (KafkaTopic CR + Write ACL in openbank-infra).
      # earliest: a new group reads the retained deal events once, so deals settled before this
      # consumer existed still reach the book; the book is monotonic, so a replay changes nothing.
      treasury-deal-in:
        connector: smallrye-kafka
        topic: openbank.treasury.deal.events
        client:
          id: risk-engine-treasury-deal-${quarkus.uuid}
        group:
          id: risk-engine-treasury-deal
        auto:
          offset:
            reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.risk-engine.treasury-deal-in
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
    outgoing:
      # ADR-0313 D9: risk-limit early-warning / breach events, relayed from risk_outbox by
      # RiskOutboxDispatcher. The KafkaTopic CR is openbank-infra/gitops/components/risk/kafka-topic.yaml
      # and the Write ACL is on this service's KafkaUser (kafka-risk-engine-mtls.yaml). Nested keys only
      # (#686, #2945).
      risk-limit-events-out:
        connector: smallrye-kafka
        topic: openbank.risk.limit.events
        client:
          id: risk-engine-limit-events-${quarkus.uuid}
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

openbank:
  outbox:
    # Defaults to FALSE fleet-wide. Without this line no risk.limit.* event ever leaves risk_outbox:
    # no error, attempt_count stays 0, and a breach reaches nobody.
    dispatch-enabled: true
  risk:
    # ADR-0313 D13: a run says which world it describes. Defaults to synthetic, so a run is
    # labelled production only where an environment explicitly says so.
    provenance: ${OPENBANK_RISK_PROVENANCE:synthetic}
    treasury:
      # ADR-0315 D6: carry the bank's money-market deals (from treasury's events) into every
      # snapshot as MONEY_MARKET_DEAL instruments on 1500/1501/1510/2300/2301/2320. Off keeps those
      # accounts GL-level, as before deals were modelled.
      enabled: ${OPENBANK_RISK_TREASURY_ENABLED:true}
    lending:
      # ADR-0314 D4: read lending's loan book into every snapshot (loans become contract-level
      # instruments tied out on Loans Receivable). Off = Loans Receivable stays GL-level.
      enabled: ${OPENBANK_RISK_LENDING_ENABLED:true}
    eod-snapshot:
      # ADR-0314: once per business day, drive the SAME SnapshotUseCase.createSnapshot the
      # POST /api/v1/risk/snapshots endpoint calls, for today's as-of date — replay-idempotent on
      # (asOf, inputHash), so a re-run or a restart mid-day is a no-op, not a duplicate. Off by
      # default: ADR-0314 shipped operator-driven, and this scheduler is opt-in per environment,
      # same shape as openbank.risk.lending.enabled above.
      enabled: ${OPENBANK_RISK_EOD_SNAPSHOT_ENABLED:false}
      # `openbank.risk.eod-snapshot.cron` defaults to "0 30 22 * * ?" in the @Scheduled annotation
      # itself (EodSnapshotScheduler) — same property-naming and Europe/Prague zone convention as
      # ledger-service's openbank.ledger.accounting-day.cron (AccountingDayScheduler). No key here
      # unless an environment needs to override it, same as that scheduler's own application.yaml.
    reference-curves:
      # ADR-0313 D4/D13: give every recent snapshot as-of date the sandbox reference curve set —
      # illustrative demo quotes, provenance `synthetic`, source text "NOT market data" — so IRRBB,
      # cash flows and the liquidity forecast have a curve set as of the run's own date. Off by
      # default; the seeder refuses outright where openbank.risk.provenance is production.
      # Cadence keys `every` (10m) and `delay` (30s) default in the @Scheduled annotation.
      enabled: ${OPENBANK_RISK_REFERENCE_CURVES_ENABLED:false}
    # ADR-0313 phase 1: IRRBB supervisory shocks, `CCY=parallel/short/long` in bp, `;`-separated.
    # Shock sizes (parallel/short/long, bp) and the post-shock floor are the EU supervisory outlier
    # test values: Commission Delegated Regulation (EU) 2024/856 (RTS on SOT, Art. 98(5a) CRD),
    # OJ L 24.4.2024. Annex Part A lists CZK and EUR by name, both 200/250/100 (#10896). The same
    # EUR values are in BCBS d368 Annex 2 Table 1; CZK is not in d368. The regulation names the six
    # scenarios (Art. 1(1)) without formulas; the formulas and scalars (x=4, 0.65/0.9, 0.8/0.6) are
    # BCBS d368 Annex 2 as carried into EBA/GL/2018/02 Annex III, which the regulation builds on
    # (recital 1). Art. 3(7) floor: -150 bp at immediate maturity, +3 bp per year, 0 % from 50 years,
    # and an observed rate already below it is kept (PostShockFloor implements exactly that).
    # A currency outside Annex Part A must be calibrated per Annex Part B, never guessed.
    irrbb:
      shock-sizes: ${OPENBANK_RISK_IRRBB_SHOCK_SIZES:EUR=200/250/100;CZK=200/250/100}
      shock-source: ${OPENBANK_RISK_IRRBB_SHOCK_SOURCE:Delegated Regulation (EU) 2024/856 Annex Part A (CZK, EUR); scenario formulas BCBS d368 Annex 2 / EBA/GL/2018/02 Annex III (x=4)}
      post-shock-floor: ${OPENBANK_RISK_IRRBB_POST_SHOCK_FLOOR:-150/3}
      post-shock-floor-source: ${OPENBANK_RISK_IRRBB_POST_SHOCK_FLOOR_SOURCE:Delegated Regulation (EU) 2024/856 Art. 3(7)}
    # ADR-0313 phase 1: LCR and NSFR. VERSIONED parameter sets — bump a set's version on any
    # change to it; every /liquidity result names the id and version it was computed with.
    # BCBS: d238 = "Basel III: The Liquidity Coverage Ratio and liquidity risk monitoring tools"
    # (Jan 2013); d295 = "Basel III: the net stable funding ratio" (Oct 2014). EU (default, #10860):
    # Delegated Regulation (EU) 2015/61 and CRR Part Six Title IV.
    # Every key below is required (LiquidityConfig is a mapping; the domain rejects missing or
    # unknown factor keys and values outside [0, 1]), so nothing here has a code default.
    liquidity:
      # Which set below is applied. The platform is an EU (Czech) credit institution, so the EU set
      # is the default; the BCBS set stays declared and selectable (OPENBANK_RISK_LIQUIDITY_PARAMETER_SET_ID).
      # Bump a set's version on any change to its factors; every result names id and version.
      parameter-set-id: eu-2015-61-crr2
      parameter-sets:
        bcbs-d238-d295:
          # "2": treasury GL accounts classified (ADR-0315, #10618) — 1510 ČNB deposit facility as HQLA L1.
          # "3": ČNB lombard (GL 2320, #10896) — central-bank secured funding factors added.
          # "4": contract-level MM placements maturing ≤ 30 days are an LCR inflow (lcr-inflow-fi-placement-30d).
          # "5": GL 1100, 1990, 1991, 1995, 2200 classified (#11107) — POLICY CHOICES, in classification below.
          version: "5"
          regime: bcbs
          source: "BCBS d238 (Jan 2013) LCR and BCBS d295 (Oct 2014) NSFR, standard factors; EU CRR / Delegated Regulation 2015/61 deviations not applied"
          factors:
            lcr-l1-haircut: 0                    # d238 ¶49
            lcr-l2a-haircut: 0.15                # d238 ¶52
            lcr-l2b-rmbs-haircut: 0.25           # d238 ¶54(a)
            lcr-l2b-other-haircut: 0.50          # d238 ¶54(b),(c)
            lcr-level2-cap: 0.40                 # d238 ¶46, ¶51, Annex 1
            lcr-level2b-cap: 0.15                # d238 ¶47, Annex 1
            lcr-retail-stable-runoff: 0.05       # d238 ¶75 (¶78: a jurisdiction may allow 3%)
            lcr-retail-less-stable-runoff: 0.10  # d238 ¶79 (minimum)
            lcr-operational-deposit-runoff: 0.25 # d238 ¶93
            lcr-other-contractual-outflow: 1.00  # d238 ¶141
            lcr-central-bank-secured-outflow: 0  # d238 ¶114-115
            lcr-retail-loan-inflow: 0.50         # d238 ¶153
            lcr-fi-inflow: 1.00                  # d238 ¶154
            lcr-inflow-fi-placement-30d: 1.00    # d238 ¶154; MM placements maturing ≤ 30 days
            lcr-operational-deposit-inflow: 0    # d238 ¶156 (and ¶98)
            lcr-inflow-cap: 0.75                 # d238 ¶69, ¶144
            nsfr-asf-capital: 1.00               # d295 ¶21(a)
            nsfr-asf-retail-stable: 0.95         # d295 ¶22
            nsfr-asf-retail-less-stable: 0.90    # d295 ¶23
            nsfr-asf-operational-deposit: 0.50   # d295 ¶24(b)
            nsfr-asf-other: 0                    # d295 ¶25
            nsfr-asf-central-bank-under-6m: 0    # d295 ¶25 — sub-paragraph UNVERIFIED
            nsfr-rsf-cash-and-reserves: 0        # d295 ¶36(a),(b)
            nsfr-rsf-l1-securities: 0.05         # d295 ¶37
            nsfr-rsf-l2a: 0.15                   # d295 ¶39(a)
            nsfr-rsf-l2b: 0.50                   # d295 ¶40(a)
            nsfr-rsf-fi-under-6m: 0.15           # d295 ¶39(b)
            nsfr-rsf-operational-deposit-at-fi: 0.50 # d295 ¶40(d)
            nsfr-rsf-loan-under-1y: 0.50         # d295 ¶40(e), amortising split per ¶29
            nsfr-rsf-loan-1y-low-rw: 0.65        # d295 ¶41(b)
            nsfr-rsf-loan-1y-other: 0.85         # d295 ¶42(b)
            nsfr-rsf-other-asset: 1.00           # d295 ¶43(c)
        # Commission Delegated Regulation (EU) 2015/61 (LCR, as amended by (EU) 2018/1620) and
        # Regulation (EU) 575/2013 Part Six Title IV, Art. 428a-428az (NSFR, as amended by CRR2).
        # Only categories the engine models; factors marked UNVERIFIED keep the BCBS value (see
        # LiquidityFactor KDoc). Retail higher-outflow categories (Art. 25(2)-(3)) and non-operational
        # corporate deposits (Art. 28) are not modelled: no GL class maps to them.
        eu-2015-61-crr2:
          # "2": ČNB lombard (GL 2320, #10896) — central-bank secured funding factors added.
          # "3": contract-level MM placements maturing ≤ 30 days are an LCR inflow (lcr-inflow-fi-placement-30d).
          # "4": GL 1100, 1990, 1991, 1995, 2200 classified (#11107) — POLICY CHOICES, in classification below.
          version: "4"
          regime: eu
          source: "Delegated Regulation (EU) 2015/61 as amended by (EU) 2018/1620 (LCR) and Regulation (EU) 575/2013 Part Six Title IV as amended by (EU) 2019/876 (NSFR); UNVERIFIED factors keep the BCBS d238/d295 value"
          factors:
            lcr-l1-haircut: 0                           # 2015/61 Art. 10(1)
            lcr-l2a-haircut: 0.15                       # 2015/61 Art. 11(2)
            lcr-l2b-rmbs-haircut: 0.25                  # 2015/61 Art. 13(14)(a)
            lcr-l2b-other-haircut: 0.50                 # 2015/61 Art. 12(1)(b),(c) — haircut paragraph UNVERIFIED
            lcr-level2-cap: 0.40                        # 2015/61 Art. 17(1)(b), Annex I
            lcr-level2b-cap: 0.15                       # 2015/61 Art. 17(1)(c), Annex I
            lcr-retail-stable-runoff: 0.05              # 2015/61 Art. 24(1)
            lcr-retail-less-stable-runoff: 0.10         # 2015/61 Art. 25(1); Art. 25(2)-(3) categories not modelled
            lcr-operational-deposit-runoff: 0.25        # 2015/61 Art. 27(1)(a), 27(2)
            lcr-other-contractual-outflow: 1.00         # 2015/61 Art. 22(1) — paragraph UNVERIFIED, conservative 100%
            lcr-central-bank-secured-outflow: 0         # 2015/61 Art. 28(3)(a)
            lcr-retail-loan-inflow: 0.50                # 2015/61 Art. 32(3)(a)
            lcr-fi-inflow: 1.00                         # 2015/61 Art. 32(2)(a)
            lcr-inflow-fi-placement-30d: 1.00           # 2015/61 Art. 32(1), 32(2)(a); MM placements ≤ 30 days
            lcr-operational-deposit-inflow: 0           # 2015/61 Art. 32(3)(d)
            lcr-inflow-cap: 0.75                        # 2015/61 Art. 33(1)
            nsfr-asf-capital: 1.00                      # CRR Art. 428o
            nsfr-asf-retail-stable: 0.95                # CRR Art. 428n
            nsfr-asf-retail-less-stable: 0.90           # CRR Art. 428m
            nsfr-asf-operational-deposit: 0.50          # CRR Art. 428l — point UNVERIFIED
            nsfr-asf-other: 0                           # CRR Art. 428k
            nsfr-asf-central-bank-under-6m: 0           # CRR Art. 428k — paragraph UNVERIFIED
            nsfr-rsf-cash-and-reserves: 0               # CRR Art. 428r(1)
            nsfr-rsf-l1-securities: 0                   # CRR Art. 428r(1) — DIFFERS from d295 ¶37 (5%)
            nsfr-rsf-l2a: 0.15                          # UNVERIFIED — BCBS d295 ¶39(a) value kept
            nsfr-rsf-l2b: 0.50                          # UNVERIFIED — BCBS d295 ¶40(a) value kept
            nsfr-rsf-fi-under-6m: 0.15                  # UNVERIFIED — BCBS d295 ¶39(b) value kept
            nsfr-rsf-operational-deposit-at-fi: 0.50    # CRR Art. 428ad — point UNVERIFIED
            nsfr-rsf-loan-under-1y: 0.50                # CRR Art. 428ad — point UNVERIFIED
            nsfr-rsf-loan-1y-low-rw: 0.65               # CRR Art. 428ag
            nsfr-rsf-loan-1y-other: 0.85                # CRR Art. 428ah
            nsfr-rsf-other-asset: 1.00                  # CRR Art. 428ah-428ai — article UNVERIFIED
      classification:
        # d238 ¶80: deposit-insurance coverage and depositor relationship are not in the data, so
        # ALL retail deposits are "less stable". Raise only with evidence of ¶75 eligibility.
        retail-stable-share: 0
        # d238 ¶93-104: operational treatment needs a clearing/custody/cash-management
        # relationship and supervisory approval. None unless configured.
        operational-deposit-share: 0
        # d295 ¶21(a): Tier 2 counts 100% only for residual maturity ≥ 1 year; maturities of
        # capital instruments are not in the ledger, so none is assumed.
        tier2-over-one-year-share: 0
        # d295 ¶41(b) vs ¶42(b): risk weights are not in the data -> the 85% (conservative) factor.
        loans-qualify-for-low-risk-weight: false
        # GL code -> class. ONLY accounts named here count; any other balance is reported as not
        # classified. The only HQLA account is treasury's 1510 (below); otherwise the chart has no
        # central-bank reserve account, and
        # 1000 "Cash and Cash Equivalents" is not known to be coins/banknotes/reserves (d238
        # ¶50(a),(b)) — map it here only once it is. Nostro 1001 is a balance at a commercial
        # bank: never HQLA; treated as operational (clearing) -> 0% inflow (d238 ¶156), 50% RSF
        # (d295 ¶40(d)), the conservative reading of both.
        #
        # Treasury (ADR-0315, #10618). 1510 "Deposit Facility at CNB" is an OVERNIGHT deposit at the
        # central bank: Level 1 as central-bank reserves (d238 ¶50(b) and its footnote on overnight
        # deposits with the central bank). 1002 EUR nostro is treated like 1001. Money-market
        # placements 1500/1501 are claims on banks whose d238 ¶154 100% inflow and d295 ¶39(b) 15%
        # RSF both depend on RESIDUAL MATURITY (≤30 days / <6 months), which a GL-level mapping
        # cannot see — so they are mapped conservatively as other-asset (no inflow, 100% RSF). A
        # placement read as a contract-level MONEY_MARKET_DEAL instrument whose maturity is ≤ 30 days
        # additionally counts as an LCR inflow (lcr-inflow-fi-placement-30d); a GL-level balance
        # (no contract data) still does not. Borrowings 2300/2301 are unsecured wholesale funding from
        # financial institutions: other-liability (100% outflow, d238 ¶141 conservative; 0% ASF,
        # d295 ¶25(b)). Accrued interest follows its principal's side.
        gl-accounts:
          "1001": deposit-at-fi-operational
          "1002": deposit-at-fi-operational
          "1500": other-asset
          "1501": other-asset
          "1510": hqla-l1-cash-or-reserves
          "1520": other-asset
          "1521": other-asset
          "2300": other-liability
          "2301": other-liability
          "2310": other-liability
          "2311": other-liability
          # 2320 "Borrowings from CNB (lombard)" (#10896): OVERNIGHT, secured on collateral pledged at
          # the ČNB. 0% LCR outflow (2015/61 Art. 28(3)(a); d238 ¶114-115) and 0% ASF as a central-bank
          # liability < 6 months (CRR Art. 428k, paragraph UNVERIFIED; d295 ¶25, sub-paragraph
          # UNVERIFIED). The pledged collateral is NOT modelled: while 2320 is non-zero every result
          # carries a note that HQLA may be overstated.
          "2320": central-bank-secured-funding
          "1300": other-asset
          "1301": other-asset
          "1302": other-asset
          "1303": other-asset
          "6000": capital
          "6010": capital
          "6020": capital
          "6030": capital
          "6040": capital-deduction
          "6050": capital
          "6060": capital-tier2
          # #11107 — these five were unclassified, so LCR and NSFR (and their limits) were NOT_EVALUABLE.
          # Every choice is a POLICY CHOICE (#11107), made so that no ratio is better than the unknown
          # facts permit. Accrued-interest rule (EU 2015/61 Art. 32 / follow-the-principal) does not
          # apply: none of the five is accrued interest.
          #
          # 1100 "Customer Cash Clearing" (CZK; posted by transaction-service payments, domestic-payment
          # settlement, clearing net settlement, lending funding): funds in transit, no counterparty or
          # maturity recorded. Debit: not HQLA (not coins/banknotes or a central-bank reserve, EU 2015/61
          # Art. 10(1)(a),(b)), no inflow claimed (Art. 32(1) needs a contractual claim; Art. 32(3)
          # items in collection not evidenced), 100% RSF (CRR Art. 428ah, article UNVERIFIED). Credit:
          # an obligation of unknown nature, 100% outflow (Art. 22(1), paragraph UNVERIFIED), 0% ASF
          # (CRR Art. 428k). Same "no counterparty class" reasoning as its capital mapping (other-asset).
          "1100": technical-or-clearing
          # 1990 / 1991 "FX Position CZK / EUR" (treasury FX deals, customer currency conversions,
          # ADR-0025) and 1995 "FX Position Counter-Value EUR (CZK)" (ledger daily ČNB revaluation,
          # ADR-0031): currency-position bookkeeping legs, not a claim on or debt to anyone, and they do
          # NOT net to zero per account by design (they stay open while customers hold FX). Not
          # excludable, so the conservative two-sided treatment: a debit never counts as HQLA or an
          # inflow and carries 100% RSF; a credit counts as a 100% outflow with 0% ASF — never as a
          # negative RSF line (which `other-asset` would produce on a credit balance).
          "1990": technical-or-clearing
          "1991": technical-or-clearing
          "1995": technical-or-clearing
          # 2200 "Withholding Tax Payable" (CZK; interest-service capitalisation, remitted monthly to
          # the tax office, ADR-0038): a liability falling due within the 30-day horizon -> 100%
          # outflow (EU 2015/61 Art. 22(1), paragraph UNVERIFIED; d238 ¶141) and 0% ASF (CRR Art. 428k;
          # d295 ¶25).
          "2200": other-liability
        # Income / expense accounts not yet closed to equity: 0% ASF (d295 ¶25(a)); no LCR flow.
        gl-account-types:
          INCOME: current-year-result
          EXPENSE: current-year-result
    # ADR-0313 phase 2: Pillar 1 credit-risk capital, STANDARDISED APPROACH. VERSIONED parameter
    # sets under parameter-sets.<id> — bump a set's version on any change to it; every /capital
    # result names the id and version it was computed with. Every key is required (CapitalConfig is
    # a mapping; the domain rejects missing or unknown keys, risk weights outside [0, 12.5] and
    # minimum ratios outside (0, 1]; every DECLARED set is validated at startup, and an undeclared
    # parameter-set-id fails the boot) — nothing has a code default.
    capital:
      sa:
        # Which set below is applied. The platform is an EU (Czech) credit institution and finrep
        # reports COREP C 02.00 under the CRR, so the EU CRR set is the default; the BCBS d424 set
        # stays declared and selectable (OPENBANK_RISK_CAPITAL_SA_PARAMETER_SET_ID=bcbs-d424-sa).
        parameter-set-id: eu-crr3-sa
        parameter-sets:
          # Risk weights: BCBS d424 "Basel III: Finalising post-crisis reforms" (Dec 2017), Part I.
          # Minimum ratios: bcbs189 "Basel III: A global regulatory framework ..." (Dec 2010, rev.
          # June 2011) ¶50. EU CRR Part Three Title II Chapter 2 is NOT applied in this set.
          bcbs-d424-sa:
            # "2": GL 1100-1113, 1400-1403, 1990-1997 classified (#10896, #11107) — POLICY CHOICES,
            # in classification below (shared by every set). "3": GL 1001/1002 nostro (#11107).
            version: "3"
            regime: bcbs
            source: "BCBS d424 (Dec 2017) Part I standardised approach for credit risk; minima BCBS bcbs189 (rev. June 2011) ¶50. BCBS d424 SA weights; EU CRR Part Three Title II Chapter 2 not applied"
            # d424 ¶55's criteria (product, EUR 1m per obligor, 0.2% granularity) and ¶54's "individual
            # person" cannot be verified from the snapshot: not-defaulted loans are "other retail"
            # (¶57, 100%). corporate-unrated (¶40-41 / ¶58, also 100%) is the equivalent reading for
            # SMEs; regulatory-retail (75%) only with evidence of ALL ¶55 criteria.
            retail-treatment: other-retail
            factors:
              rw-sovereign-unrated: 1.00             # d424 ¶7 Table 1 (unrated)
              # d424 ¶8 is a NATIONAL DISCRETION ("a lower risk weight may be applied") for the bank's
              # own central bank in domestic currency, funded in it. 0 is the value the discretion is
              # normally exercised with; it applies ONLY in classification.domestic-currency below, and
              # is shown as a discretion in every result. Set it to rw-sovereign-unrated to decline it.
              rw-sovereign-domestic-currency: 0
              rw-bank-scra-grade-a: 0.40             # d424 ¶21 Table 7 base (¶22-23)
              rw-bank-scra-grade-b: 0.75             # d424 ¶21 Table 7 base (¶25-27)
              rw-bank-scra-grade-c: 1.50             # d424 ¶21 Table 7 base (¶28-29)
              rw-retail-regulatory: 0.75             # d424 ¶55
              rw-retail-other: 1.00                  # d424 ¶57
              rw-corporate-unrated: 1.00             # d424 ¶40 Table 10 (unrated), ¶41
              rw-defaulted: 1.50                     # d424 ¶92 (specific provisions < 20%)
              rw-cash: 0                             # d424 ¶96(i)
              rw-cash-items-in-collection: 0.20      # d424 ¶97
              rw-other-asset: 1.00                   # d424 ¶95
              min-cet1-ratio: 0.045                  # bcbs189 ¶50
              min-tier1-ratio: 0.06                  # bcbs189 ¶50
              min-total-capital-ratio: 0.08          # bcbs189 ¶50 (the 8% own-funds requirement)
          # Regulation (EU) 575/2013 (CRR) as amended by CRR2 (EU) 2019/876 and CRR3 (EU) 2024/1623:
          # Part Three Title II Chapter 2 (standardised approach) risk weights and Art. 92(1) minima,
          # for the exposure classes this engine models. UNVERIFIED = the article and the weight are
          # relied on but the PARAGRAPH is not confirmed against the consolidated CRR3 text (#11107):
          # Art. 121 (SCRA table), Art. 122 (unrated corporate), Art. 123 (retail 75%) and Art. 134
          # (which of (2)/(3) is cash in hand 0% and which cash items in collection 20%).
          eu-crr3-sa:
            # "2": GL 1001/1002 classified nostro (#11107), in the shared classification below.
            version: "2"
            regime: eu
            source: "Regulation (EU) 575/2013 as amended by (EU) 2019/876 and (EU) 2024/1623, Part Three Title II Chapter 2 (standardised approach) and Art. 92(1); paragraphs marked UNVERIFIED in the factor citations are not confirmed against the consolidated text"
            # CRR has NO "other retail" class: an exposure that does not meet ALL Art. 123 criteria
            # (natural person or SME; one of a significant number of similar exposures; total owed by
            # the obligor group ≤ EUR 1m) is a corporate exposure, Art. 122. None of those criteria is
            # verifiable from the snapshot, so loans and overdrafts are corporate-unrated (100%);
            # regulatory-retail (75%, Art. 123) only with evidence. other-retail is REFUSED here.
            retail-treatment: corporate-unrated
            factors:
              rw-sovereign-unrated: 1.00             # CRR Art. 114(1)
              # CRR Art. 114(4): Member State central government / central bank, denominated AND
              # funded in its domestic currency: 0% — a rule, not a discretion as in d424 ¶8. Applies
              # only in classification.domestic-currency (the ČNB in CZK).
              rw-sovereign-domestic-currency: 0
              # CRR3 Art. 121 SCRA, unrated institutions — paragraph UNVERIFIED. Short-term weights
              # (original maturity ≤ 3 months: A 20%, B 50%, C 150%) need maturities a GL balance does
              # not carry, so the base weights apply; the grade in use is classification.bank-scra-grade.
              rw-bank-scra-grade-a: 0.40             # CRR Art. 121 — paragraph UNVERIFIED
              rw-bank-scra-grade-b: 0.75             # CRR Art. 121 — paragraph UNVERIFIED
              rw-bank-scra-grade-c: 1.50             # CRR Art. 121 — paragraph UNVERIFIED
              rw-retail-regulatory: 0.75             # CRR Art. 123 — paragraph UNVERIFIED
              # No CRR counterpart (see retail-treatment above). Required by the factor list, never
              # applied: the set refuses retail-treatment other-retail.
              rw-retail-other: 1.00
              rw-corporate-unrated: 1.00             # CRR Art. 122 (unrated) — paragraph UNVERIFIED
              # CRR Art. 127(1): 150% where specific credit risk adjustments < 20% of the unsecured
              # part, 100% otherwise. The adjustment per loan is not in the data, so 150% for every
              # defaulted loan — the CONSERVATIVE bucket.
              rw-defaulted: 1.50
              rw-cash: 0                             # CRR Art. 134 cash in hand — paragraph UNVERIFIED; no GL mapped
              rw-cash-items-in-collection: 0.20      # CRR Art. 134 items in collection — paragraph UNVERIFIED; no GL mapped
              rw-other-asset: 1.00                   # CRR Art. 134(1) other items
              min-cet1-ratio: 0.045                  # CRR Art. 92(1)(a)
              min-tier1-ratio: 0.06                  # CRR Art. 92(1)(b)
              min-total-capital-ratio: 0.08          # CRR Art. 92(1)(c) (the 8% own-funds requirement)
        # Shared by every set above.
        classification:
          # No external ratings and no counterparty capital disclosures in the data: every bank
          # exposure is SCRA (d424 ¶17(b), ¶21; CRR Art. 121), and d424 ¶23 / ¶26 send a counterparty
          # whose published requirements are not made available to Grade C. Short-term weights
          # (d424 ¶30; CRR Art. 121 short-term, original maturity ≤ 3 months) need maturities a GL
          # balance does not carry, so base weights.
          bank-scra-grade: C
          # The currency the d424 ¶8 discretion / CRR Art. 114(4) covers (the ČNB, in CZK).
          domestic-currency: CZK
          # GL code -> class. ONLY accounts named here (or by type below) are classified; any
          # other ASSET balance is listed as not classified, never weighted. Deliberately absent:
          # 1000 Cash and Cash Equivalents (not known to be physical cash, d424 ¶96(i) / CRR Art. 134
          # cash in hand; NOT treated like 1100: cash may qualify for 0%, so a 100% default would be
          # a different claim).
          #
          # Version "2" (#10896, #11107): the three blocks below were unclassified and gapped every
          # COREP C 02.00 credit-risk row on the sandbox. Each is a POLICY CHOICE awaiting owner
          # sign-off; each is chosen so that RWA is never lower than the unknown facts permit.
          gl-accounts:
            # POLICY CHOICE (#11107): nostro at a correspondent bank. Debit = claim on an institution,
            # weighted as "bank" (SCRA Grade C above: no counterparty rating is in the data); credit =
            # the nostro is overdrawn, owed TO the correspondent, so no exposure (not listed as a
            # credit balance on an exposure account, which would leave every ratio not evaluable).
            "1001": nostro                       # nostro CZK
            "1002": nostro                       # nostro EUR
            "1500": bank                         # money-market placements with banks
            "1501": bank
            "1520": bank                         # accrued interest follows its principal
            "1521": bank
            "1510": central-bank                 # ČNB deposit facility (ADR-0315)
            "1200": retail                       # Loans Receivable, only when read at GL level
            "1201": retail                       # (lending read off); contract-level loans are
            "1202": retail                       # weighted per instrument with their IFRS 9 stage
            "1203": retail
            "1300": other-asset                  # interest receivable (¶95)
            "1301": other-asset
            "1302": other-asset
            "1303": other-asset
            # POLICY CHOICE (#11107): 1100-1113 customer cash clearing / scheme settlement. The
            # counterparty and maturity are not recorded, so no counterparty class can be shown:
            # "other assets" at 100% (BCBS d424 ¶95; CRR Art. 134(1) "other items"), the strictest
            # standard weight short of a default class. Not ¶97 cash items in collection (20%):
            # that needs the item to be known as cash in collection. Sandbox-heavy (1100 carried
            # +16.1m CZK on 2026-09-29); #10969 (synthetic loan void) is expected to shrink it.
            "1100": other-asset
            "1101": other-asset
            "1102": other-asset
            "1103": other-asset
            "1104": other-asset
            "1105": other-asset
            "1106": other-asset
            "1107": other-asset
            "1108": other-asset
            "1109": other-asset
            "1110": other-asset
            "1111": other-asset
            "1112": other-asset
            "1113": other-asset
            # POLICY CHOICE (#11107): 1400-1403 loan loss allowance (contra-asset, credit balance).
            # Netting a credit-risk adjustment against an exposure value (CRR Art. 111(1); d424 ¶92
            # for defaulted loans) requires it to be ALLOCATED to that exposure, which the GL does
            # not record. So it is not an exposure: it neither reduces RWA nor stays unclassified.
            # Conservative: loans are weighted gross of the allowance.
            "1400": not-an-exposure
            "1401": not-an-exposure
            "1402": not-an-exposure
            "1403": not-an-exposure
            # POLICY CHOICE (#11107): 1990-1997 FX position / counter-value accounts of the ledger's
            # FX revaluation. They are currency positions — foreign-exchange risk, a market-risk
            # charge (CRR Part Three Title IV Chapter 3, Art. 351 ff.) — not a claim on any
            # counterparty, so not a credit exposure under d424 Part I. The FX-risk charge on them
            # is NOT computed here: excluding them from credit RWA does not make them riskless.
            "1990": not-an-exposure
            "1991": not-an-exposure
            "1992": not-an-exposure
            "1993": not-an-exposure
            "1994": not-an-exposure
            "1995": not-an-exposure
            "1996": not-an-exposure
            "1997": not-an-exposure
            "6000": own-funds-cet1               # CET1 capital instruments
            "6010": own-funds-cet1               # CET1 share premium
            "6020": own-funds-cet1               # retained earnings
            "6030": own-funds-cet1               # other reserves
            "6040": own-funds-cet1-deduction     # CET1 regulatory deductions (debit balance)
            "6050": own-funds-at1
            "6060": own-funds-tier2
          # Not credit exposures. EQUITY outside 6000-6060 is NOT own funds; INCOME / EXPENSE not
          # yet closed to retained earnings are not counted as capital either.
          gl-account-types:
            LIABILITY: not-an-exposure
            EQUITY: not-an-exposure
            INCOME: not-an-exposure
            EXPENSE: not-an-exposure
    # ČNB minimum reserve requirement (povinné minimální rezervy, PMR) — ADR-0313 treasury gap,
    # ADR-0315. Source: Opatření ČNB o povinných minimálních rezervách (Provision of the ČNB on
    # minimum reserves). Every key is required (MinReservesConfig is a mapping; the domain rejects
    # a rate outside [0, 1] and an unknown class), so nothing here has a code default. Change a
    # value -> bump parameter-set-version; every /min-reserves result names id and version.
    # UNVERIFIED (not checked against the provision's current wording, so no article numbers are
    # cited): the exact list of base items and exclusions, the maintenance-period calendar, the
    # rounding of the requirement, and whether foreign-currency liabilities enter the base.
    min-reserves:
      parameter-set-id: cnb-pmr
      parameter-set-version: "3"     # 3: ratio + remuneration from ČNB facts, not config; 2: GL 2320 excluded-bank-or-cnb
      # The reserve RATIO and its REMUNERATION are not configured here (they were, as 2 % / 0 — and
      # 2 % had been wrong since 2025-01-02, when the ratio became 4 %). They are ČNB facts read per
      # as-of date from cnb_policy_rate_fact, fed by fx-service (fx.cnb-policy-rate.published.v1);
      # with no fact in effect the requirement is NOT_EVALUABLE, never defaulted.
      source: "Opatření ČNB o povinných minimálních rezervách: liabilities up to 2 years excl. banks subject to PMR and the ČNB; ratio and remuneration per ČNB fact in effect on the as-of date"
      holding-currency: CZK          # held on the bank's current account at the ČNB
      classification:
        # GL code -> class. Customer deposits need no entry: they are sub-ledger positions on
        # deposit control 2100-2103 and always join the base (liabilities to non-bank clients).
        #
        # HOLDINGS: the ledger chart (ledger-service db/migration V1..V29) has NO current account at
        # the ČNB, so no account is mapped reserve-holding and holdings / surplus are NOT STATED (null,
        # with holdingsNotStated) until one exists — never a stand-in zero.
        # 1510 "Deposit Facility at CNB" (V29) is the ČNB overnight DEPOSIT FACILITY, a separate
        # instrument from the current account on which reserves are held: never a reserve holding.
        # 1000 / 1001 / 1002 are cash and nostro balances at commercial banks: not the ČNB account.
        gl-accounts:
          "1510": not-a-holding
          # MM borrowings from banks (V29) and their accrued interest: liabilities to banks. Mapped
          # as EXCLUDED on the assumption that the counterparty is a bank itself subject to PMR —
          # UNVERIFIED: the ledger does not record the counterparty; a bank NOT subject to ČNB PMR
          # (e.g. a foreign bank) would put the liability back into the base.
          "2300": excluded-bank-or-cnb
          "2301": excluded-bank-or-cnb
          "2310": excluded-bank-or-cnb
          "2311": excluded-bank-or-cnb
          # ČNB lombard borrowing (arriving with the ledger chart change in #11087): a liability to the
          # ČNB itself, which the provision excludes from the base. Mapped ahead of the account so a
          # lombard balance is excluded from the first snapshot that carries it, not unclassified.
          "2320": excluded-bank-or-cnb
        # Any LIABILITY not named above (e.g. 2200 Withholding Tax Payable) is deliberately NOT
        # mapped by type: whether it is in the base is a reading of the provision, so it is listed
        # as unclassified instead of guessed.
        gl-account-types:
          ASSET: not-a-holding
          EQUITY: not-a-liability
          INCOME: not-a-liability
          EXPENSE: not-a-liability
      # Maintenance-period calendar (ADR-0315 D8): reserves are held on AVERAGE over each period.
      # STATUS sample-unverified: the ČNB publishes the maintenance-period calendar, and it was NOT
      # checked for this file. The periods below are CALENDAR MONTHS of 2026 with the base taken on
      # the last day of the previous month — a stand-in that makes the averaging computable, NOT the
      # official calendar. Every /min-reserves/periods response repeats the status and a SAMPLE note.
      # Replacing it with the published calendar: set status verified, cite it in source, bump
      # version (tracked in #11107).
      maintenance-calendar:
        id: cnb-pmr-maintenance-calendar
        version: "1"
        status: sample-unverified
        source: "SAMPLE / UNVERIFIED: calendar months of 2026, base on the last day of the previous month; not the ČNB calendar"
        periods:
          - id: "2026-01"
            start: "2026-01-01"
            end: "2026-01-31"
            base-reference-date: "2025-12-31"
          - id: "2026-02"
            start: "2026-02-01"
            end: "2026-02-28"
            base-reference-date: "2026-01-31"
          - id: "2026-03"
            start: "2026-03-01"
            end: "2026-03-31"
            base-reference-date: "2026-02-28"
          - id: "2026-04"
            start: "2026-04-01"
            end: "2026-04-30"
            base-reference-date: "2026-03-31"
          - id: "2026-05"
            start: "2026-05-01"
            end: "2026-05-31"
            base-reference-date: "2026-04-30"
          - id: "2026-06"
            start: "2026-06-01"
            end: "2026-06-30"
            base-reference-date: "2026-05-31"
          - id: "2026-07"
            start: "2026-07-01"
            end: "2026-07-31"
            base-reference-date: "2026-06-30"
          - id: "2026-08"
            start: "2026-08-01"
            end: "2026-08-31"
            base-reference-date: "2026-07-31"
          - id: "2026-09"
            start: "2026-09-01"
            end: "2026-09-30"
            base-reference-date: "2026-08-31"
          - id: "2026-10"
            start: "2026-10-01"
            end: "2026-10-31"
            base-reference-date: "2026-09-30"
          - id: "2026-11"
            start: "2026-11-01"
            end: "2026-11-30"
            base-reference-date: "2026-10-31"
          - id: "2026-12"
            start: "2026-12-01"
            end: "2026-12-31"
            base-reference-date: "2026-11-30"
    # ADR-0313 D9: declarative risk limits, evaluated on every TIED_OUT run (GET .../limits, and by the
    # EOD scheduler, which writes an event per EARLY_WARNING / BREACH to the outbox). VERSIONED sets —
    # bump a set's version on ANY change to it; every evaluation and every event names id and version.
    # The metric fixes the direction (lcr / nsfr / total-capital-ratio are floors; irrbb-eve-outlier /
    # large-exposure-bank are ceilings); early-warning sits on the safe side of the limit. Every key is
    # required (LimitsConfig is a mapping), so nothing here has a code default.
    # Not declared: an open FX position per currency — the snapshot carries no FX derivative legs and
    # the ledger's FX revaluation accounts (1990-1997) are not modelled, so no net open position is
    # computable from the data.
    limits:
      parameter-set-id: openbank-risk-appetite
      parameter-sets:
        openbank-risk-appetite:
          version: "1"
          source: "Regulatory minima (CRR, Delegated Regulations (EU) 2015/61 and 2024/856) as limits; every early-warning threshold is a risk-appetite POLICY choice awaiting ALCO sign-off"
          limits:
            lcr-min:
              metric: lcr
              limit: 1.00
              early-warning: 1.10
              citation: "Delegated Regulation (EU) 2015/61 Art. 4(1), CRR Art. 412(1): LCR at least 100 %; early warning 110 % POLICY"
            nsfr-min:
              metric: nsfr
              limit: 1.00
              early-warning: 1.05
              citation: "CRR Art. 413(1), Art. 428b(1): NSFR at least 100 %; early warning 105 % POLICY"
            total-capital-ratio-min:
              metric: total-capital-ratio
              limit: 0.08
              early-warning: 0.105
              citation: "CRR Art. 92(1)(c): total capital ratio 8 %; early warning 10.5 % = 8 % + 2.5 % capital conservation buffer (CRD Art. 129) POLICY — Pillar 2 and other buffers not applied"
            irrbb-eve-outlier:
              metric: irrbb-eve-outlier
              limit: 0.15
              early-warning: 0.12
              citation: "CRD Art. 98(5)(a), Delegated Regulation (EU) 2024/856: supervisory outlier test, EVE decline over 15 % of Tier 1; early warning 12 % POLICY"
            large-exposure-bank-max:
              metric: large-exposure-bank
              limit: 0.25
              early-warning: 0.20
              citation: "CRR Art. 395(1): exposure to one client or group at most 25 % of Tier 1; the EUR 150m alternative for institutions is NOT applied (conservative); early warning 20 % POLICY"
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout: "${OPA_TIMEOUT:PT0.5S}"

authz:
  enforce: "${AUTHZ_ENFORCE:true}"
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

"%prod":
  quarkus:
    http:
      # East-west mTLS listener (8443): the listener must VALIDATE the caller's certificate.
      # `quarkus.http.ssl.client-auth` is BUILD TIME, so it has to live in this file (#10441);
      # under %prod because with no certificate configured dev/@QuarkusTest would refuse to start.
      ssl:
        client-auth: required
      # Keep plain HTTP/8159: with client-auth REQUIRED Quarkus otherwise drops the HTTP listener
      # and every existing caller and probe gets connection refused (#10505).
      insecure-requests: enabled
      # Listener parity (#12511, the #12506 pattern): with client-auth on, Quarkus ALSO registers its
      # mTLS authentication mechanism, which turns any trusted client certificate into an authenticated
      # SecurityIdentity of its own — on 8443 only. The API must be authenticated identically on both
      # listeners, by the OIDC bearer OPA decides on, so /api/* accepts the bearer mechanism ONLY; the
      # certificate stays transport authentication. Measured before this: a fleet-CA certificate with no
      # bearer reached the API as an authenticated principal (403 from authz, not 401).
      # RiskListenerAuthParityIT holds both listeners to it with the production listener shape.
      auth:
        permission:
          bearer-only:
            paths: /api/*
            policy: permit
            auth-mechanism: bearer
    # ledger-service terminates a private-CA mTLS listener on 8443 with client auth REQUIRED, so
    # the ledger rest-client names its own TLS bucket. Local/test fixtures speak plain HTTP, so
    # this stays under %prod: the client certificate only exists in the cluster.
    tls:
      ledger-authority:
        key-store:
          pem:
            client:
              cert: /mnt/ledger-tls/tls.crt
              key: /mnt/ledger-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/ledger-tls/ca.crt
        protocols: TLSv1.3
      # lending-service's 8443 listener (#10732) requires a client certificate from the same
      # private CA, so the same risk-internal-tls pair authenticates this engine to it. A bucket
      # of its own so the two edges stay independently configurable.
      lending-authority:
        key-store:
          pem:
            client:
              cert: /mnt/ledger-tls/tls.crt
              key: /mnt/ledger-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/ledger-tls/ca.crt
        protocols: TLSv1.3
    rest-client:
      ledger-service:
        tls-configuration-name: ledger-authority
      lending-service:
        tls-configuration-name: lending-authority

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      tls:
        verification: none
      enabled: false
  authz:
    enforce: "false"

"%test":
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
  authz:
    enforce: "false"
