quarkus.oidc.enabled=false
# oidc-client stays ENABLED in tests: `enabled` is build-time fixed, so disabling it here makes it
# impossible for a @TestProfile (the E2E suite's RiskDownstreamWireMockResource) to point the token
# endpoint at a stub. The client only dials out on the first downstream call, and the ITs stub the
# ports at the CDI level so the REST clients never leave the process; same shape as vop-service.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=openbank
quarkus.datasource.password=openbank_secret
quarkus.datasource.reactive.url=postgresql://localhost:5432/openbank_risk_it
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openbank_risk_it
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:29092
kafka.bootstrap.servers=localhost:29092
quarkus.otel.sdk.disabled=true
quarkus.log.level=WARN
quarkus.log.category."com.openbank".level=INFO
authz.enforce=false
# No broker in the tests: rows written to risk_outbox stay PENDING so the outbox IT can read them.
openbank.outbox.dispatch-enabled=false
