openapi: 3.1.0
info:
  title: Sanctions Screening Service API
  # major == openbank.api.version == newest served URL major (ADR-0048).
  # ADR-0227 D1: additive projection fields (summary, domain, amount, currency, riskClass,
  # payloadRef — all optional) on ApprovalResponse; no breaking change.
  # 2.3.0 (#11694): optional subjectId on screen requests/results and clearanceExpiresAt on results.
  # 2.3.0 -> 3.0.0 (#10760): CZ_TERRORISTS is a new response enum value, so the six operations
  # returning SanctionsCheck move to parallel /api/v3 contracts. Their /api/v1 schemas retain the
  # original seven values throughout the deprecation window; list administration is unchanged.
  # 3.0.0 -> 3.1.0 (#14780): POST /api/v2/sanctions/lists/{listType}/refresh (202) is added — the
  # single-list sibling of #9048's refresh-all. ADDITIVE only: the v1 single-list operation is
  # unchanged (synchronous import, 200 + the refreshed list). Moving it would flip its meaning from
  # "imported" to "queued", which #9048 treated as breaking for refresh-all. v1 additionally
  # documents 409 for a refresh of the same list already in flight (additive response).
  # 3.1.0 -> 3.2.0 (#15723): ADDITIVE on /api/v3 only. The screen request gains optional `profile`
  # (PAYMENT | CUSTOMER), `country` and `bankIdentifier`; the result gains optional `profile`,
  # `country`, `bankIdentifier`, `pepStatus` and, per match, `matchKind`. A request without any of
  # them behaves and answers exactly as before. /api/v1 is frozen and rejects the new inputs (400);
  # its request schema names the three fields only to say so, because the shared request type
  # parses them and a parsed field that is not published is a contract gap.
  # 3.2.0 -> 3.3.0 (ADR-0376): ADDITIVE. PUT and DELETE
  # /api/v3/sanctions/monitored-subjects/{ownerService}/{subjectRef} register a subject for ongoing
  # monitoring and withdraw it. No existing operation, schema or response changes. Registration
  # answers 503 while `openbank.sanctions.monitoring.enabled` is false, which is the default.
  version: 3.3.0
  # 1.4.0 -> 2.0.0 (#9048, ADR-0048): POST /lists/refresh-all could not keep answering 200 — that
  # required the whole external-feed fan-out to finish inside the request, which was the defect.
  # oasdiff classifies 200 -> 202 as breaking, and a breaking change here means a new URL major:
  # /api/v2/sanctions/lists/refresh-all (202) now carries the operation, while the v1 path keeps
  # its 200 + array shape for the deprecation window (both defer the imports to the scheduler).
  description: >-
    Real-time sanctions screening against EU, UN, OFAC, HM Treasury and CNB lists. PATCH
    /approvals/{id} decides a four-eyes approval paused by the platform's ADR-0155 maker-checker
    gate on `sanctions.clear` (maker != checker).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8123
    description: Local development
tags:
  - name: Sanctions
  - name: SanctionsLists
  - name: Monitoring

paths:
  /api/v1/sanctions:
    get:
      tags: [Sanctions]
      summary: List all sanctions checks
      deprecated: true
      operationId: listSanctionsChecks
      responses:
        '200':
          description: All checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheck'

  /api/v1/sanctions/screen:
    post:
      tags: [Sanctions]
      summary: Screen an entity against all enabled sanctions lists
      deprecated: true
      operationId: screenEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenEntityCommand'
      responses:
        '201':
          description: Screening result created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheck'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/sanctions/review:
    post:
      tags: [Sanctions]
      summary: >-
        Submit a manual review decision for a hit or potential hit. Subject to the four-eyes
        `clear` verb (ADR-0155) — a maker's call may be paused (202, PendingApproval) pending a
        distinct checker's decision via /approvals/{id}, then retried with an X-Approval-Id header.
      deprecated: true
      operationId: reviewSanctionsHit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCommand'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheck'
        '202':
          description: Four-eyes pending — a second, distinct principal must approve via /approvals/{id}.

  /api/v1/sanctions/hits:
    get:
      tags: [Sanctions]
      summary: List all confirmed hits
      deprecated: true
      operationId: listSanctionsHits
      responses:
        '200':
          description: Confirmed hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheck'

  /api/v1/sanctions/pending:
    get:
      tags: [Sanctions]
      summary: List potential hits awaiting manual review
      deprecated: true
      operationId: listPendingReviews
      responses:
        '200':
          description: Potential hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheck'

  /api/v1/sanctions/{id}:
    get:
      tags: [Sanctions]
      summary: Get a sanctions check by ID
      deprecated: true
      operationId: getSanctionsCheck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanctions check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheck'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v3/sanctions:
    get:
      tags: [Sanctions]
      summary: List all sanctions checks, including the Czech anti-terrorism list
      operationId: listSanctionsChecksV3
      responses:
        '200':
          description: All checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheckV3'

  /api/v3/sanctions/screen:
    post:
      tags: [Sanctions]
      summary: Screen an entity against the lists of an explicit profile, or all enabled lists
      operationId: screenEntityV3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenEntityCommandV3'
      responses:
        '201':
          description: Screening result created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheckV3'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v3/sanctions/monitored-subjects/{ownerService}/{subjectRef}:
    parameters:
      - name: ownerService
        in: path
        required: true
        description: The service that owns the subject and receives its findings, e.g. `kyc-service`.
        schema:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
      - name: subjectRef
        in: path
        required: true
        description: >-
          The owning service's stable reference for the subject — the value it sends as `subjectId`
          when it screens the subject, so that an analyst's clearance is honoured by monitoring.
        schema:
          type: string
          minLength: 1
          maxLength: 255
    put:
      tags: [Monitoring]
      summary: Register a subject for ongoing monitoring, or replace its attributes
      description: >-
        Idempotent. Registering the same attributes again changes nothing; different attributes
        replace the stored ones and the subject is evaluated afresh. The response describes the
        registration only: whether the subject matches anything is never returned over REST, it is
        published to the owning service as a `MONITORED_SUBJECT_MATCHED` event.
      operationId: registerMonitoredSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoredSubjectRequest'
      responses:
        '200':
          description: The subject was already registered; its attributes are as sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoredSubjectRegistration'
        '201':
          description: The subject is now monitored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoredSubjectRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Ongoing monitoring is not enabled in this environment; nothing was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Monitoring]
      summary: Stop monitoring a subject and delete what is stored about it
      description: >-
        Deletes the registry row and every finding recorded for it. Idempotent: the answer is 204
        whether or not the subject was registered. Works while monitoring is disabled.
      operationId: deregisterMonitoredSubject
      responses:
        '204':
          description: The subject is not monitored and nothing about it is stored

  /api/v3/sanctions/review:
    post:
      tags: [Sanctions]
      summary: Submit a manual review decision for a hit or potential hit
      description: >-
        Subject to the four-eyes `clear` verb (ADR-0155) — a maker's call may be paused (202,
        PendingApproval) pending a distinct checker's decision via /approvals/{id}, then retried
        with an X-Approval-Id header.
      operationId: reviewSanctionsHitV3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCommand'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheckV3'
        '202':
          description: Four-eyes pending — a second, distinct principal must approve via /approvals/{id}.

  /api/v3/sanctions/hits:
    get:
      tags: [Sanctions]
      summary: List all confirmed hits
      operationId: listSanctionsHitsV3
      responses:
        '200':
          description: Confirmed hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheckV3'

  /api/v3/sanctions/pending:
    get:
      tags: [Sanctions]
      summary: List potential hits awaiting manual review
      operationId: listPendingReviewsV3
      responses:
        '200':
          description: Potential hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheckV3'

  /api/v3/sanctions/{id}:
    get:
      tags: [Sanctions]
      summary: Get a sanctions check by ID
      operationId: getSanctionsCheckV3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanctions check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheckV3'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sanctions/lists:
    get:
      tags: [SanctionsLists]
      summary: List all configured sanctions lists
      operationId: listSanctionsLists
      responses:
        '200':
          description: All lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsList'

  /api/v1/sanctions/lists/{id}:
    get:
      tags: [SanctionsLists]
      summary: Get a sanctions list by ID
      operationId: getSanctionsList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanctions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [SanctionsLists]
      summary: Update a sanctions list configuration
      operationId: updateSanctionsList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSanctionsListRequest'
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sanctions/lists/{listType}/refresh:
    post:
      tags: [SanctionsLists]
      summary: Trigger manual refresh of a specific list
      operationId: refreshSanctionsList
      parameters:
        - name: listType
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refresh triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '409':
          description: >-
            A refresh of this list is already running (another request or the scheduler); this
            request was not queued behind it. Retry after the Retry-After interval (#14780).

  /api/v2/sanctions/lists/{listType}/refresh:
    post:
      tags: [SanctionsLists]
      summary: Trigger manual refresh of a specific list
      description: >-
        Flags one enabled list for refresh and answers immediately. The import runs on the next
        scheduler tick, and progress is observable through the list's lastUpdatedAt on
        GET /api/v1/sanctions/lists.
      operationId: refreshSanctionsListV2
      parameters:
        - name: listType
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Required on money-path POSTs (#8351). Flagging is idempotent by construction, so a
            retried key converges to the same state.
          schema:
            type: string
      responses:
        '202':
          description: Refresh of the list queued on the scheduler.
          content:
            application/json:
              schema:
                type: object
                required: [requested]
                properties:
                  requested:
                    type: string
                    description: The list type flagged for refresh.
        '400':
          description: Idempotency-Key header missing.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The list is disabled; the scheduler would never refresh it.

  /api/v1/sanctions/lists/refresh-all:
    post:
      tags: [SanctionsLists]
      summary: Trigger manual refresh of all enabled lists (deprecated v1 shape)
      description: >-
        DEPRECATED — use POST /api/v2/sanctions/lists/refresh-all, which answers 202 (#9048).
        This v1 operation keeps its 200 + array shape for the deprecation window but no longer
        performs the imports in-request: it flags every enabled list for the scheduler and
        returns the enabled lists in their PRE-refresh state immediately. Per-list progress is
        observable through each list's lastUpdatedAt.
      deprecated: true
      operationId: refreshAllSanctionsLists
      responses:
        '200':
          description: Enabled lists flagged for refresh (pre-refresh state)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsList'

  /api/v2/sanctions/lists/refresh-all:
    post:
      tags: [SanctionsLists]
      summary: Trigger manual refresh of all enabled lists
      description: >-
        Flags every enabled list for refresh and answers immediately (#9048). The imports run
        on subsequent scheduler ticks, one list at a time, and per-list progress is observable
        through each list's lastUpdatedAt on GET /api/v1/sanctions/lists.
      operationId: refreshAllSanctionsListsV2
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Required on money-path POSTs (#8351). Flagging is idempotent by construction, so a
            retried key converges to the same state.
          schema:
            type: string
      responses:
        '202':
          description: Refresh of all enabled lists queued on the scheduler.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested:
                    type: integer
                    description: How many enabled lists were flagged for refresh.

  /api/v1/sanctions/approvals:
    get:
      tags: [Sanctions]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'

  /api/v1/sanctions/approvals/{id}:
    patch:
      tags: [Sanctions]
      summary: Approve or reject a pending four-eyes approval for a gated sanctions action (ADR-0155)
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: >-
            The caller is the maker of this approval. Segregation of duties is enforced in
            RedisApprovalStore.decide, not per-service.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: Invalid request (e.g. an unrecognised sanctions list type in listTypes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the gated
        action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide, so the
        queue is readable by anyone who may decide, including the maker (seeing a request is not
        authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: sanctions.clear
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        makerActorKind:
          type: string
          enum: [HUMAN, AI_AGENT, SERVICE_ACCOUNT, CUSTOMER_PARTY, UNKNOWN]
          description: Origin captured at creation; UNKNOWN for legacy records.
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
          description: >-
            Bounded human-readable description of the paused request, persisted with the
            approval (ADR-0227 D1). Null when the approval was created by application code
            rather than by the intercepting pause.
        domain:
          type: string
          nullable: true
          description: >-
            The service's domain in the unified approval inbox (ADR-0227 D1), derived from
            quarkus.application.name. Informational; the inbox keys items off its own source
            list.
        amount:
          type: string
          nullable: true
          description: >-
            The maker's original request amount, when a future phase persists one (ADR-0227
            D1). Always null today - the request body is not persisted, only its SHA-256
            fingerprint. Absent never means zero.
        currency:
          type: string
          nullable: true
          description: ISO 4217 currency of `amount`, when an amount is present. Null today.
        riskClass:
          type: string
          nullable: true
          enum: [MONEY_PATH, DESTRUCTIVE, OPERATIONAL, UNKNOWN]
          description: >-
            Coarse action-class risk (ADR-0227 D1/D3). UNKNOWN from the service side - the
            authoritative classification lives in rules.yaml four_eyes metadata the store
            cannot see; the admin-UI BFF re-derives it per action.
        payloadRef:
          type: string
          nullable: true
          description: >-
            Retrievable pointer to the maker's original request payload, when a future phase
            persists one. Null today - the persisted fingerprint is an integrity digest, not
            a payload pointer.
    ScreenEntityCommand:
      type: object
      required: [idempotencyKey, entityType, name]
      properties:
        idempotencyKey:
          type: string
          description: Client-assigned idempotency key; identical key returns the original result.
        subjectId:
          type: string
          description: >-
            Stable party identifier, separate from the per-attempt idempotency key. Every new key
            causes a fresh screen. A WHITELISTED clearance applies for at most 90 days, only to
            exactly the same subject attributes and only to the reviewed match identities.
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
          default: []
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
          description: ISO 3166-1 alpha-2 country code
        identifiers:
          type: object
          additionalProperties:
            type: string
          description: "Arbitrary identifiers e.g. passport, taxId"
          default: {}
        listTypes:
          type: array
          description: >-
            Restrict screening to these lists. Omitted, null or empty means the original seven
            enabled v1 lists. An unrecognised name is rejected with 400 — it is never dropped, because a dropped
            entry would produce a screening result narrower than the caller asked for while
            reporting success.
          items:
            type: string
            enum:
              - OFAC_SDN
              - EU_CONSOLIDATED
              - UN_CONSOLIDATED
              - HM_TREASURY
              - FATF_HIGH_RISK
              - PEP_GLOBAL
              - CNB_DOMESTIC
        profile:
          type: string
          description: >-
            Not accepted on /api/v1. The request body is parsed by the same type as
            /api/v3/sanctions/screen, so the field is recognised — and any value is rejected with
            400 instead of being silently ignored. Use /api/v3/sanctions/screen.
        country:
          type: string
          description: >-
            Not accepted on /api/v1: any value is rejected with 400. Use /api/v3/sanctions/screen.
        bankIdentifier:
          type: string
          description: >-
            Not accepted on /api/v1: any value is rejected with 400. Use /api/v3/sanctions/screen.

    ScreenEntityCommandV3:
      type: object
      required: [idempotencyKey, entityType, name]
      properties:
        idempotencyKey:
          type: string
          description: Client-assigned idempotency key; identical key returns the original result.
        subjectId:
          type: string
          description: >-
            Stable party identifier, separate from the per-attempt idempotency key. Every new key
            causes a fresh screen. A WHITELISTED clearance applies for at most 90 days, only to
            exactly the same subject attributes and only to the reviewed match identities.
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
          default: []
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
          description: ISO 3166-1 alpha-2 country code
        identifiers:
          type: object
          additionalProperties:
            type: string
          description: "Arbitrary identifiers e.g. passport, taxId"
          default: {}
        listTypes:
          type: array
          description: >-
            Restrict screening to these lists. Omitted, null or empty means every enabled list,
            including CZ_TERRORISTS. An unrecognised name is rejected with 400 — it is never dropped.
            Cannot be combined with `profile` (400).
          items:
            type: string
            enum:
              - OFAC_SDN
              - EU_CONSOLIDATED
              - UN_CONSOLIDATED
              - HM_TREASURY
              - FATF_HIGH_RISK
              - PEP_GLOBAL
              - CNB_DOMESTIC
              - CZ_TERRORISTS
        profile:
          type: string
          enum: [PAYMENT, CUSTOMER]
          description: >-
            Explicit purpose of the screen; fixes the list set. PAYMENT consults the sanctions
            lists, the national terrorist list and the jurisdiction reference data, and no PEP
            list — a PEP name cannot stop a payment. CUSTOMER adds the PEP list and reports PEP
            matches apart (`matchKind: PEP`, `pepStatus`); they never raise `status` or
            `overallScore`. Omitted keeps the profile-less behaviour, in which every list counts
            toward `status`. An unknown value is rejected with 400.
        country:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: >-
            ISO 3166-1 alpha-2 country of the screened counterparty. A country present in the
            jurisdiction reference data matches independently of the name: an EMBARGO entry yields
            HIT, a HIGH_RISK entry POTENTIAL_HIT with score 0.65 (manual review). The reference
            data is versioned and changed only through reviewed migrations; it has no automated
            feed, and an empty data set never matches.
        bankIdentifier:
          type: string
          pattern: '^[A-Za-z]{4}[A-Za-z]{2}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$'
          description: >-
            BIC (8 or 11 characters) of the counterparty's bank. Its country code is checked
            against the jurisdiction reference data exactly like `country`. The BIC is not matched
            against listed entities: the imported list sources carry no bank identifiers.

    MonitoredSubjectRequest:
      type: object
      required: [entityType, name]
      description: >-
        The attributes the CUSTOMER screening profile reads. Send the same values as on the
        subject's live screen; no document identifiers are accepted or stored.
      properties:
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
          minLength: 1
          maxLength: 500
        aliases:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 500
        dateOfBirth:
          type: [string, 'null']
        nationality:
          type: [string, 'null']
        country:
          type: [string, 'null']
          pattern: '^[A-Za-z]{2}$'
          description: ISO 3166-1 alpha-2. A listed jurisdiction raises a finding whatever the name is.
    MonitoredSubjectRegistration:
      type: object
      required: [ownerService, subjectRef, registeredAt, updatedAt]
      properties:
        ownerService:
          type: string
        subjectRef:
          type: string
        registeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the stored attributes last changed; unchanged by an identical registration.
    ReviewCommand:
      type: object
      required: [checkId, reviewedBy, note, newStatus]
      properties:
        checkId:
          type: string
          format: uuid
        reviewedBy:
          type: string
        note:
          type: string
        newStatus:
          type: string
          enum: [CLEAR, HIT, POTENTIAL_HIT, WHITELISTED, ESCALATED]

    SanctionsCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        subjectId:
          type: string
          nullable: true
          description: Stable party identifier supplied on the screen request; null on legacy checks.
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          nullable: true
        identifiers:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [CLEAR, HIT, POTENTIAL_HIT, WHITELISTED, ESCALATED]
        matches:
          type: array
          items:
            $ref: '#/components/schemas/SanctionsMatch'
        overallScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        checkedLists:
          type: array
          items:
            type: string
            enum: [OFAC_SDN, EU_CONSOLIDATED, UN_CONSOLIDATED, HM_TREASURY, FATF_HIGH_RISK, PEP_GLOBAL, CNB_DOMESTIC]
        reviewedBy:
          type: string
          nullable: true
        reviewNote:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        clearanceExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            End of the 90-day WHITELISTED clearance on this check; null for other statuses and
            legacy checks. A new attempt receives WHITELISTED only while this clearance is valid
            and covers the fresh result's subject and match identities.

    SanctionsMatch:
      type: object
      properties:
        listType:
          type: string
          enum: [OFAC_SDN, EU_CONSOLIDATED, UN_CONSOLIDATED, HM_TREASURY, FATF_HIGH_RISK, PEP_GLOBAL, CNB_DOMESTIC]
        matchType:
          type: string
          enum: [EXACT, FUZZY, PHONETIC, ALIAS]
        matchScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        matchedName:
          type: string
        matchedId:
          type: string
          nullable: true
        listEntryDate:
          type: string
          nullable: true
        programs:
          type: array
          items:
            type: string

    SanctionsCheckV3:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        subjectId:
          type: string
          nullable: true
          description: Stable party identifier supplied on the screen request; null on legacy checks.
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          nullable: true
        identifiers:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [CLEAR, HIT, POTENTIAL_HIT, WHITELISTED, ESCALATED]
        matches:
          type: array
          items:
            $ref: '#/components/schemas/SanctionsMatchV3'
        overallScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        checkedLists:
          type: array
          items:
            type: string
            enum: [OFAC_SDN, EU_CONSOLIDATED, UN_CONSOLIDATED, HM_TREASURY, FATF_HIGH_RISK, PEP_GLOBAL, CNB_DOMESTIC, CZ_TERRORISTS]
        reviewedBy:
          type: string
          nullable: true
        reviewNote:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        clearanceExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            End of the 90-day WHITELISTED clearance on this check; null for other statuses and
            legacy checks. A new attempt receives WHITELISTED only while this clearance is valid
            and covers the fresh result's subject and match identities.
        profile:
          type: string
          enum: [PAYMENT, CUSTOMER]
          description: The profile the screen was requested with. Absent on profile-less checks.
        country:
          type: string
          description: Country the screen was asked about, upper-cased. Absent when none was supplied.
        bankIdentifier:
          type: string
          description: BIC the screen was asked about, upper-cased. Absent when none was supplied.
        pepStatus:
          type: string
          enum: [CLEAR, HIT, POTENTIAL_HIT, WHITELISTED, ESCALATED]
          description: >-
            PEP outcome of a CUSTOMER-profile screen, reported apart from `status`. Absent for any
            other profile and for profile-less checks. It shares the vocabulary of `status`, but
            only CLEAR, POTENTIAL_HIT and HIT are ever produced: a PEP match is not whitelisted or
            escalated the way a sanctions hit is.

    SanctionsMatchV3:
      type: object
      properties:
        listType:
          type: string
          enum: [OFAC_SDN, EU_CONSOLIDATED, UN_CONSOLIDATED, HM_TREASURY, FATF_HIGH_RISK, PEP_GLOBAL, CNB_DOMESTIC, CZ_TERRORISTS]
        matchType:
          type: string
          enum: [EXACT, FUZZY, PHONETIC, ALIAS]
        matchScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        matchedName:
          type: string
        matchedId:
          type: string
          nullable: true
        listEntryDate:
          type: string
          nullable: true
        programs:
          type: array
          items:
            type: string
        matchKind:
          type: string
          enum: [SANCTIONS, TERRORIST, PEP, JURISDICTION]
          description: >-
            What the match means, set only on checks screened with a `profile`. A JURISDICTION
            match names the listed country in `matchedName`,
            `country:<code>:<source list>:<measure>:v<version>` in `matchedId` and
            the measure and reference-data version in `programs`.

    SanctionsList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listType:
          type: string
