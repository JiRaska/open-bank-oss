openapi: 3.1.0
info:
  title: Sanctions Screening Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.1 -> 1.2): additive
  # only — GET /approvals (the checker's queue, issue #3472) plus two additive fields on
  # ApprovalResponse (makerId, createdAt). No breaking change.
  version: 1.3.0
  description: >-
    Real-time sanctions screening against EU, UN, OFAC, HM Treasury and CNB lists. PATCH
    /approvals/{id} decides a four-eyes approval paused by the platform's ADR-0155 maker-checker
    gate on `sanctions.clear` (maker != checker).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8123
    description: Local development
tags:
  - name: Sanctions
  - name: SanctionsLists

paths:
  /api/v1/sanctions:
    get:
      tags: [Sanctions]
      summary: List all sanctions checks
      operationId: listSanctionsChecks
      responses:
        '200':
          description: All checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheck'

  /api/v1/sanctions/screen:
    post:
      tags: [Sanctions]
      summary: Screen an entity against all enabled sanctions lists
      operationId: screenEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenEntityCommand'
      responses:
        '201':
          description: Screening result created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheck'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/sanctions/review:
    post:
      tags: [Sanctions]
      summary: >-
        Submit a manual review decision for a hit or potential hit. Subject to the four-eyes
        `clear` verb (ADR-0155) — a maker's call may be paused (202, PendingApproval) pending a
        distinct checker's decision via /approvals/{id}, then retried with an X-Approval-Id header.
      operationId: reviewSanctionsHit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCommand'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheck'
        '202':
          description: Four-eyes pending — a second, distinct principal must approve via /approvals/{id}.

  /api/v1/sanctions/hits:
    get:
      tags: [Sanctions]
      summary: List all confirmed hits
      operationId: listSanctionsHits
      responses:
        '200':
          description: Confirmed hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheck'

  /api/v1/sanctions/pending:
    get:
      tags: [Sanctions]
      summary: List potential hits awaiting manual review
      operationId: listPendingReviews
      responses:
        '200':
          description: Potential hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsCheck'

  /api/v1/sanctions/{id}:
    get:
      tags: [Sanctions]
      summary: Get a sanctions check by ID
      operationId: getSanctionsCheck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanctions check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsCheck'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sanctions/lists:
    get:
      tags: [SanctionsLists]
      summary: List all configured sanctions lists
      operationId: listSanctionsLists
      responses:
        '200':
          description: All lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsList'

  /api/v1/sanctions/lists/{id}:
    get:
      tags: [SanctionsLists]
      summary: Get a sanctions list by ID
      operationId: getSanctionsList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanctions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [SanctionsLists]
      summary: Update a sanctions list configuration
      operationId: updateSanctionsList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSanctionsListRequest'
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sanctions/lists/{listType}/refresh:
    post:
      tags: [SanctionsLists]
      summary: Trigger manual refresh of a specific list
      operationId: refreshSanctionsList
      parameters:
        - name: listType
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refresh triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsList'

  /api/v1/sanctions/lists/refresh-all:
    post:
      tags: [SanctionsLists]
      summary: Trigger manual refresh of all enabled lists
      operationId: refreshAllSanctionsLists
      responses:
        '200':
          description: All enabled lists refreshed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SanctionsList'

  /api/v1/sanctions/approvals:
    get:
      tags: [Sanctions]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'

  /api/v1/sanctions/approvals/{id}:
    patch:
      tags: [Sanctions]
      summary: Approve or reject a pending four-eyes approval for a gated sanctions action (ADR-0155)
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: >-
            The caller is the maker of this approval. Segregation of duties is enforced in
            RedisApprovalStore.decide, not per-service.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: Invalid request (e.g. an unrecognised sanctions list type in listTypes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the gated
        action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide, so the
        queue is readable by anyone who may decide, including the maker (seeing a request is not
        authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: sanctions.clear
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
    ScreenEntityCommand:
      type: object
      required: [idempotencyKey, entityType, name]
      properties:
        idempotencyKey:
          type: string
          description: Client-assigned idempotency key; identical key returns the original result.
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
          default: []
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
          description: ISO 3166-1 alpha-2 country code
        identifiers:
          type: object
          additionalProperties:
            type: string
          description: "Arbitrary identifiers e.g. passport, taxId"
          default: {}
        listTypes:
          type: array
          description: >-
            Restrict screening to these lists. Omitted, null or empty means every enabled list.
            An unrecognised name is rejected with 400 — it is never dropped, because a dropped
            entry would produce a screening result narrower than the caller asked for while
            reporting success.
          items:
            type: string
            enum:
              - OFAC_SDN
              - EU_CONSOLIDATED
              - UN_CONSOLIDATED
              - HM_TREASURY
              - FATF_HIGH_RISK
              - PEP_GLOBAL
              - CNB_DOMESTIC

    ReviewCommand:
      type: object
      required: [checkId, reviewedBy, note, newStatus]
      properties:
        checkId:
          type: string
          format: uuid
        reviewedBy:
          type: string
        note:
          type: string
        newStatus:
          type: string
          enum: [CLEAR, HIT, POTENTIAL_HIT, WHITELISTED, ESCALATED]

    SanctionsCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        entityType:
          type: string
          enum: [INDIVIDUAL, ORGANIZATION, VESSEL, AIRCRAFT]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          nullable: true
        identifiers:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [CLEAR, HIT, POTENTIAL_HIT, WHITELISTED, ESCALATED]
        matches:
          type: array
          items:
            $ref: '#/components/schemas/SanctionsMatch'
        overallScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        checkedLists:
          type: array
          items:
            type: string
            enum: [OFAC_SDN, EU_CONSOLIDATED, UN_CONSOLIDATED, HM_TREASURY, FATF_HIGH_RISK, CNB_DOMESTIC]
        reviewedBy:
          type: string
          nullable: true
        reviewNote:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    SanctionsMatch:
      type: object
      properties:
        listType:
          type: string
          enum: [OFAC_SDN, EU_CONSOLIDATED, UN_CONSOLIDATED, HM_TREASURY, FATF_HIGH_RISK, CNB_DOMESTIC]
        matchType:
          type: string
          enum: [EXACT, FUZZY, PHONETIC, ALIAS]
        matchScore:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        matchedName:
          type: string
        matchedId:
          type: string
          nullable: true
        listEntryDate:
          type: string
          nullable: true
        programs:
          type: array
          items:
            type: string

    SanctionsList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listType:
          type: string
        displayName:
          type: string
        sourceUrl:
          type: string
        enabled:
          type: boolean
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
        lastEntryCount:
          type: integer
          nullable: true
        cronHour:
          type: integer
          minimum: 0
          maximum: 23
        cronMinute:
          type: integer
          minimum: 0
          maximum: 59
        cronDays:
          type: string
          example: "MON,TUE,WED,THU,FRI"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateSanctionsListRequest:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        cronHour:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
        cronMinute:
          type: integer
          minimum: 0
          maximum: 59
          nullable: true
        cronDays:
          type: string
          nullable: true
          example: "MON,WED,FRI"

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
