quarkus:
  application:
    name: openbank-sanctions-service
    version: 0.2.0
  http:
    port: 8123
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_sanctions
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_sanctions
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

mp:
  messaging:
    connector:
      smallrye-kafka:
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    outgoing:
      sanctions-events-out:
        connector: smallrye-kafka
        client.id: sanctions-service-${quarkus.uuid}
        topic: openbank.sanctions.screening.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: false
