quarkus:
  application:
    name: openbank-sanctions-service
  http:
    port: 8123
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_sanctions
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_sanctions
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      enabled: false
  openbank:
    sanctions:
      eu:
        # Local dev has no business downloading the ~25 MB first-party feed on every refresh —
        # run on the Flyway-seeded sample entries instead, explicitly labelled non-production by
        # the reported import outcome (seed_fallback_non_production, issue #8362).
        source: ${SANCTIONS_EU_SOURCE:seed}
"%test":
  quarkus:
    oidc:
      enabled: false
    # Keep the scheduledRefresh() @Scheduled tick from firing during tests — otherwise it could
    # race test assertions and would attempt live outbound calls to OFAC/OpenSanctions on a real
    # timer. Same pattern as openbank-statement-service's scheduled-close disable under %test.
    scheduler:
      enabled: false
  # OPA is not present in a test JVM, and AuthorizeInterceptor fails CLOSED with 503 when the PDP is
  # unreachable and enforce is on (ADR-0034) — so every @Authorize endpoint, including
  # POST /api/v1/sanctions/screen, would answer 503 to SanctionsPactProviderVerificationTest.
  # Advisory mode under %test only; the deployed default (AUTHZ_ENFORCE, above) is untouched.
  # Same override, same reason, as openbank-aml-service's %test profile.
  authz:
    enforce: "false"

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137). These connector-wide Kafka client props apply to every
    # smallrye-kafka channel. Defaults keep local dev/test on PLAINTEXT (empty keystore paths
    # are ignored when protocol=PLAINTEXT); the sanctions Deployment sets the KAFKA_* env in prod
    # to switch to mTLS.
    connector:
      smallrye-kafka:
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      sanctions-events-out:
        connector: smallrye-kafka
        client.id: sanctions-service-${quarkus.uuid}
        topic: openbank.sanctions.screening.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second approver),
  # independent of the base allow/deny enforce toggle above. Stays false by default — same
  # deliberate, separate rollout decision every other money-path service in the fleet makes
  # (billing-service's/sepa-payment's application.yaml have the identical comment); flipping
  # this is a runbook-gated follow-up, not bundled with the ApprovalStore wiring itself.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true
  sanctions:
    # Issue #8362: the EU consolidated list imports from the first-party EU FSF XML endpoint by
    # default; `opensanctions` selects the OpenSanctions CSV mirror (rollback), `seed` keeps the
    # Flyway V6 sample entries — NON-PRODUCTION, local dev only (the import reports outcome
    # seed_fallback_non_production so a dashboard can never confuse it with a working provider).
    eu:
      source: ${SANCTIONS_EU_SOURCE:eu-fsf}
    eu-fsf:
      url: ${SANCTIONS_EU_FSF_URL:https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw}
