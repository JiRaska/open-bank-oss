quarkus:
  application:
    name: openbank-anacredit-service
  http:
    port: 8137
    cors:
      ~: true
      origins: "http://localhost:3000,http://openbank-admin-ui:3000"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: ${QUARKUS_OIDC_CLIENT_ID:openbank-services}
    credentials:
      secret: ${QUARKUS_OIDC_CREDENTIALS_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # Single datasource backing both the CreditExposure store (ADR-0037 v2) and the
  # loan_stage_projection read-model (ADR-0037 follow-up, issue #638) — same physical DB
  # (anacredit-db.yaml), same `openbank` owner, two independent Flyway-migrated tables.
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # Reactive client for the app (Panache); JDBC URL is for Flyway migrations only.
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_anacredit}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_anacredit}
  hibernate-orm:
    # Flyway owns the schema; Hibernate validates against it, never generates.
    database:
      generation: none
  flyway:
    migrate-at-start: true
    # Retries give the Kafka-consumer-carrying pod time to reach the DB on a cold cluster boot,
    # where CNPG and the app can race (issue #638).
    connect-retries: 10
    connect-retries-interval: 2S

  log:
    level: INFO
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # loan.stage_changed -> update the durable stage projection (issue #638). earliest so a
      # redeployed/rejoined consumer group backfills from the start of the retained topic rather than
      # only future transitions; applyIfNewer is idempotent so replay never regresses the projection.
      #
      # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
      # openbank-infra/gitops/components/anacredit/anacredit-service-msg-override.yaml
      # (a properties-file ConfigMap loaded via QUARKUS_CONFIG_LOCATIONS) for why and where
      # they're set instead. Summary: SmallRye Config's YAML source unconditionally quotes any
      # leaf map key containing a literal dot (`group.id` becomes the registered property name
      # `"group.id"`, quotes included), so KafkaConnectorIncomingConfiguration's plain
      # config.getOptionalValue("group.id", ...) never finds it. group.id then falls back to
      # Quarkus's default (quarkus.application.name = "openbank-anacredit-service"), which the
      # anacredit-service KafkaUser ACL does NOT grant (kafka-anacredit-mtls.yaml only grants
      # Read on group "anacredit-service-lending") — every poll would hit
      # org.apache.kafka.common.errors.GroupAuthorizationException. NOT env vars: SmallRye's
      # env-var reverse-mapping is ambiguous for hyphenated channel names like
      # lending-events-in and can crash at boot (quarkusio/quarkus#30106,
      # smallrye/smallrye-reactive-messaging#2028). Refs #686.
      lending-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.anacredit.lending-events-in
        connector: smallrye-kafka
        client.id: anacredit-service-lending-${quarkus.uuid}
        topic: openbank.lending.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

# OPA sidecar (ADR-0034 Phase 5, issue #938 bootstrap). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"

"%test":
  quarkus:
    # No OIDC discovery at boot in tests — @TestSecurity covers auth scenarios.
    oidc:
      enabled: false
    management:
      enabled: false
    devservices:
      enabled: false
