# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: open-banking
primaryDatastore: PostgreSQL
databaseName: openbank_wealth
dataLineageRole: producer
dataClassification: confidential
retentionPolicy: 10 years
evidenceExported: false
# No `lineage:` block yet, deliberately. The customer-edge net-worth composition that will read
# this service is ADR-0301 D2 and is not built (issue #9772), so declaring the edge now would be a
# lineage claim with no backing code — exactly what the lineage-vs-code audit exists to catch
# (#889). It is added in the change that adds the caller.
databaseLineage:
  ownedDatabases:
    - openbank_wealth
  dependentDatabases: []
