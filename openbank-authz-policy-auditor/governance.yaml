# SPDX-License-Identifier: AGPL-3.0-only
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: platform
primaryDatastore: PostgreSQL
databaseName: openbank_authzaudit
dataLineageRole: internal
dataClassification: internal
retentionPolicy: "7 years"
evidenceExported: false
lineage:
  upstream:
    - serviceName: github
      relationType: api
      description: reads openbank-infra/opa/policies/*.rego, openbank-libs/governance/policies/*.rego,
        openbank-libs-runtime AuthorizeInterceptor.kt, and openbank-libs/governance/agents.yaml via a
        repo checkout
databaseLineage:
  ownedDatabases:
    - openbank_authzaudit
  dependentDatabases: []
