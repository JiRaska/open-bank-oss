quarkus:
  application:
    name: openbank-standing-order-service
  http:
    port: 8121
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_standing_orders
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_standing_orders
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token (#889): the SEPA rest-client mints an openbank-services M2M
  # token (ROLE_OPERATOR) via this oidc-client so sepa-payment's createPayment accepts the call.
  # Disabled under %test (units call the consumer directly; the boot IT never dispatches a payment).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    sepa-payment-service:
      url: ${SEPA_PAYMENT_SERVICE_URL:http://localhost:8115}
      scope: jakarta.inject.Singleton
    # DOMESTIC/INTERNAL routing (#889 follow-up): resolve the creditor IBAN, then book the
    # transfer directly when it is one of ours.
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://account-service.accounts.svc:8100}
      scope: jakarta.inject.Singleton
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://transaction-service.payments.svc:8102}
      scope: jakarta.inject.Singleton
  redis:
    hosts: redis://localhost:6379
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-standing-order-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    management:
      enabled: false
  openbank:
    outbox:
      # #7539: the real StandingOrderOutboxDispatcher scheduled tick (poll-interval 5s,
      # initial-delay 5s) is otherwise live during every @QuarkusTest in this module and can
      # race a test's own manual outbox manipulation (e.g. StandingOrderOutboxClaimIT stomping
      # claimed_at to force a stale row) -- the scheduler can claim/dispatch/markSent the row
      # out from under the test before its own assertion runs, an intermittent false failure of
      # the reclaim assertion, not a defect in claimProcessable itself.
      dispatch-enabled: false
openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s
  scheduler:
    # Quarkus scheduler uses Quartz-style cron: 6 fields (sec min hour dom mon dow),
    # not the 5-field Unix form. "0 3 * * ?" parsed as 5 parts and crashed the app at
    # boot (IllegalArgumentException: Cron expression contains 5 parts but we expect
    # one of [6, 7]). "0 0 3 * * ?" = 03:00:00 daily, the original intent.
    execution-cron: "0 0 3 * * ?"
    execution-enabled: true

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      standing-order-events-out:
        connector: smallrye-kafka
        client.id: standing-order-service-${quarkus.uuid}
        topic: openbank.standing-orders.order.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # #889: self-consume the due events the outbox dispatches, and initiate the real payment
      # (StandingOrderDueConsumer). group.id / auto.offset.reset are deliberately NOT set as YAML
      # keys here: SmallRye Config's YAML source quotes any leaf key containing a dot, so they would
      # silently not resolve (the #686/#703 dotted-key footgun). The defaults are exactly what we
      # want anyway — group.id falls back to quarkus.application.name (openbank-standing-order-service,
      # a service-scoped consumer group), and auto.offset.reset stays `latest` so a fresh deploy does
      # NOT replay historical due events and re-initiate old payments.
      standing-order-due-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.standing-order.standing-order-due-in
        connector: smallrye-kafka
        topic: openbank.standing-orders.order.event
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
