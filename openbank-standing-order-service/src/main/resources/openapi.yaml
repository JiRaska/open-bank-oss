openapi: 3.1.0
info:
  title: Standing Order Service API
  # 1.7 -> 1.8 (#11938): additive — create documents 400 CURRENCY_NOT_ALLOWED (a SEPA_CREDIT
  # order executes as an SCT, which is euro-only).
  # 1.8 -> 1.9: additive contract — GET /{id} returned the raw domain entity (leaking idempotencyKey and
  # failureCount, omitting the computed amount/description); it now returns StandingOrderResponse
  # like every sibling endpoint, and the response schema is declared for the first time.
  version: 1.9.0
  description: Recurring payment orders — create, pause, resume, cancel.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8121
    description: Local development
tags:
  - name: Standing Orders

paths:
  /api/v1/standing-orders:
    get:
      tags: [Standing Orders]
      summary: List every standing order
      description: >-
        The unfiltered collection. Requires ROLE_API, ROLE_OPERATOR or ROLE_ADMIN.
      operationId: listStandingOrders
      responses:
        '200':
          description: All standing orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingOrderResponse'
    post:
      tags: [Standing Orders]
      summary: Create a standing order
      operationId: createStandingOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStandingOrderRequest'
      description: >-
        With `replacesStandingOrderId` (an edit, #10281) the new order is created and the replaced
        one cancelled in ONE transaction: both run never, neither-runs never. A replay of the same
        `idempotencyKey` returns the order already created and changes nothing.
      responses:
        '201':
          description: Standing order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'
        '400':
          description: >-
            CURRENCY_NOT_ALLOWED (#11938) — `paymentType` is SEPA_CREDIT and `currency` is not EUR;
            a SEPA_CREDIT order executes as an SCT, which is euro-only. Applies to an edit
            (`replacesStandingOrderId`) too. Nothing is created or cancelled; the violation names
            `currency` and the rejected value is not echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: >-
            `replacesStandingOrderId` is not an ACTIVE or PAUSED order of the same party; nothing
            was created or cancelled.

  /api/v1/standing-orders/{id}:
    get:
      tags: [Standing Orders]
      summary: Get standing order by ID
      operationId: getStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Standing order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Standing Orders]
      summary: Cancel a standing order
      operationId: cancelStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '204':
          description: Cancelled

  /api/v1/standing-orders/party/{partyId}:
    get:
      tags: [Standing Orders]
      summary: List standing orders for a party
      operationId: listStandingOrdersByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Standing orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingOrderResponse'

  /api/v1/standing-orders/{id}/pause:
    post:
      tags: [Standing Orders]
      summary: Pause a standing order
      operationId: pauseStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'

  /api/v1/standing-orders/{id}/resume:
    post:
      tags: [Standing Orders]
      summary: Resume a paused standing order
      operationId: resumeStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'

  /api/v1/standing-orders/{id}/record-execution:
    patch:
      tags: [Standing Orders]
      summary: Rail confirms payment dispatched — resets consecutive failure count
      operationId: recordExecution
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Execution confirmed; failure count reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/standing-orders/{id}/record-failure:
    patch:
      tags: [Standing Orders]
      summary: Rail reports payment dispatch failed — increments failure count; transitions to FAILED after 3
      operationId: recordFailure
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Failure recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    StandingOrderResponse:
      type: object
      # Mirrors StandingOrderResponse.kt (toResponse) exactly — the shape EVERY endpoint now
      # serves after the 1.8.1 GET /{id} correction. Kotlin non-null constructor parameters are
      # required; remittanceInfo/description are nullable. The wire shape is pinned field-by-field
      # by StandingOrderLifecycleE2E.
      required: [id, partyId, debtorAccountId, creditorIban, creditorName, status, frequency, paymentType, amountMinorUnits, amount, currency, nextExecutionDate, remittanceInfo, description, executionCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        debtorAccountId:
          type: string
          format: uuid
        creditorIban:
          type: string
        creditorName:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELLED, COMPLETED, FAILED]
        frequency:
          type: string
          enum: [ONCE, DAILY, WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, ANNUALLY]
        paymentType:
          type: string
          enum: [SEPA_CREDIT, DOMESTIC, INTERNAL]
        amountMinorUnits:
          type: integer
          format: int64
        amount:
          description: amountMinorUnits in major units (e.g. 12500 -> 125.0).
          type: number
          format: double
        currency:
          type: string
        nextExecutionDate:
          type: string
          format: date
        remittanceInfo:
          type: string
          nullable: true
        description:
          description: Alias of remittanceInfo, kept for older consumers.
          type: string
          nullable: true
        executionCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStandingOrderRequest:
      type: object
      # Mirrors the served DTO (CreateStandingOrderRequest.kt) exactly: Kotlin non-default
      # constructor parameters are REQUIRED (Jackson 400s when absent); parameters with a
      # `= null` default are optional. Nullable-without-default (creditorBic, remittanceInfo,
      # endDate) must be present but may carry null. The previous schema named fields the DTO
      # never had (debtorAccountId, amount, currencyCode) and omitted five the DTO requires —
      # a client following it could never succeed. Corrected under ADR-0048 D5 'correction'
      # (#8351 burn-down: idempotencyKey was already enforced by the code and the dedup
      # replay is covered by StandingOrderServiceTest).
      required: [idempotencyKey, partyId, debitAccountId, creditorIban, creditorName, creditorBic, amountMinorUnits, currency, frequency, paymentType, remittanceInfo, startDate, endDate]
      properties:
        idempotencyKey:
          description: >-
            Caller-chosen dedup key. A retry with the same key returns the originally created
            order instead of double-creating (findByIdempotencyKey short-circuits the create).
          type: string
          minLength: 1
        partyId:
          type: string
          format: uuid
        debitAccountId:
          type: string
          format: uuid
        debtorIban:
          description: >-
            Debtor account IBAN, captured at creation and used to initiate the SEPA credit transfer
            when the order is due (#889). Optional for backward compatibility; a SEPA_CREDIT order
            without it cannot be executed.
          type: string
          nullable: true
        debtorName:
          description: Debtor display name for the SEPA credit transfer (#889). Optional; see debtorIban.
          type: string
          nullable: true
        creditorIban:
          type: string
        creditorName:
          type: string
        creditorBic:
          type: string
          nullable: true
        amountMinorUnits:
          description: Amount in minor units (haléře/cents); the response also exposes `amount` in major units.
          type: integer
          format: int64
        currency:
          type: string
          description: >-
            Must be EUR (case-insensitive) when `paymentType` is SEPA_CREDIT — any other currency is a
            400 CURRENCY_NOT_ALLOWED (#11938). DOMESTIC and INTERNAL are not constrained here.
        frequency:
          type: string
          enum: [ONCE, DAILY, WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, ANNUALLY]
        paymentType:
          type: string
          enum: [SEPA_CREDIT, DOMESTIC, INTERNAL]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        remittanceInfo:
          type: string
          nullable: true
        replacesStandingOrderId:
          type: string
          format: uuid
          nullable: true
          description: Edit — cancel this order atomically with creating the new one (#10281).

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
