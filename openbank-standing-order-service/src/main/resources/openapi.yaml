openapi: 3.1.0
info:
  title: Standing Order Service API
  # 1.8 -> 1.9 (#12317): additive authenticated standing-order receipt lookup.
  version: 1.9.0
  description: Recurring payment orders — create, pause, resume, cancel.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8121
    description: Local development
tags:
  - name: Standing Orders

paths:
  /api/v1/standing-orders:
    get:
      tags: [Standing Orders]
      summary: List every standing order
      description: >-
        The unfiltered collection. Requires ROLE_API, ROLE_OPERATOR or ROLE_ADMIN.
      operationId: listStandingOrders
      responses:
        '200':
          description: All standing orders
    post:
      tags: [Standing Orders]
      summary: Create a standing order
      operationId: createStandingOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStandingOrderRequest'
      description: >-
        With `replacesStandingOrderId` (an edit, #10281) the new order is created and the replaced
        one cancelled in ONE transaction: both run never, neither-runs never. A replay of the same
        `idempotencyKey` and identical authenticated request returns the order already created;
        reusing the key for a different payload, actor or debit account is a 409.
      responses:
        '201':
          description: Standing order created
        '400':
          description: >-
            CURRENCY_NOT_ALLOWED (#11938) — `paymentType` is SEPA_CREDIT and `currency` is not EUR;
            a SEPA_CREDIT order executes as an SCT, which is euro-only. Applies to an edit
            (`replacesStandingOrderId`) too. Nothing is created or cancelled; the violation names
            `currency` and the rejected value is not echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: >-
            `replacesStandingOrderId` is not an ACTIVE or PAUSED order of the same party; nothing
            was created or cancelled.
        '409':
          description: Idempotency key was already used for a different request or legacy unbound row.

  /api/v1/standing-orders/receipts/lookup:
    post:
      tags: [Standing Orders]
      summary: Reconcile a standing-order create by its original idempotency key
      operationId: lookupStandingOrderReceipt
      description: >-
        Read-only customer-edge request. The key is carried in the body, never the URL. The
        authenticated edge identity and its customer party/actor provenance must match the
        durable create record, including the original debit account and, for a company profile,
        one representation mandate verified by the edge at creation. On lookup the service
        checks that stored ID against the edge's fresh bounded ACTIVE set, so a second current
        role remains usable while a revoked mandate or re-grant cannot recover the former receipt.
        Missing, in-flight,
        unbound legacy and mismatched records all return UNKNOWN; no receipt is inferred from
        an absent order. The edge must verify debit-account ownership before forwarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingOrderReceiptLookupRequest'
      responses:
        '200':
          description: Bound durable receipt, or UNKNOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderReceipt'
        '403':
          description: Customer provenance did not come from the authenticated edge.

  /api/v1/standing-orders/{id}:
    get:
      tags: [Standing Orders]
      summary: Get standing order by ID
      operationId: getStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Standing order detail
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Standing Orders]
      summary: Cancel a standing order
      operationId: cancelStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '204':
          description: Cancelled

  /api/v1/standing-orders/party/{partyId}:
    get:
      tags: [Standing Orders]
      summary: List standing orders for a party
      operationId: listStandingOrdersByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Standing orders

  /api/v1/standing-orders/{id}/pause:
    post:
      tags: [Standing Orders]
      summary: Pause a standing order
      operationId: pauseStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Paused

  /api/v1/standing-orders/{id}/resume:
    post:
      tags: [Standing Orders]
      summary: Resume a paused standing order
      operationId: resumeStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Resumed

  /api/v1/standing-orders/{id}/record-execution:
    patch:
      tags: [Standing Orders]
      summary: Rail confirms payment dispatched — resets consecutive failure count
      operationId: recordExecution
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Execution confirmed; failure count reset
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/standing-orders/{id}/record-failure:
    patch:
      tags: [Standing Orders]
      summary: Rail reports payment dispatch failed — increments failure count; transitions to FAILED after 3
      operationId: recordFailure
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Failure recorded
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateStandingOrderRequest:
      type: object
      # Mirrors the served DTO (CreateStandingOrderRequest.kt) exactly: Kotlin non-default
      # constructor parameters are REQUIRED (Jackson 400s when absent); parameters with a
      # `= null` default are optional. Nullable-without-default (creditorBic, remittanceInfo,
      # endDate) must be present but may carry null. The previous schema named fields the DTO
      # never had (debtorAccountId, amount, currencyCode) and omitted five the DTO requires —
      # a client following it could never succeed. Corrected under ADR-0048 D5 'correction'
      # (#8351 burn-down: idempotencyKey was already enforced by the code and the dedup
      # replay is covered by StandingOrderServiceTest).
      required: [idempotencyKey, partyId, debitAccountId, creditorIban, creditorName, creditorBic, amountMinorUnits, currency, frequency, paymentType, remittanceInfo, startDate, endDate]
      properties:
        idempotencyKey:
          description: >-
            Caller-chosen dedup key. A retry with the same authenticated request returns the
            originally created order. Reuse for different content or actor returns 409.
          type: string
          minLength: 1
        partyId:
          type: string
          format: uuid
        debitAccountId:
          type: string
          format: uuid
        debtorIban:
          description: >-
            Debtor account IBAN, captured at creation and used to initiate the SEPA credit transfer
            when the order is due (#889). Optional for backward compatibility; a SEPA_CREDIT order
            without it cannot be executed.
          type: string
          nullable: true
        debtorName:
          description: Debtor display name for the SEPA credit transfer (#889). Optional; see debtorIban.
          type: string
          nullable: true
        creditorIban:
          type: string
        creditorName:
          type: string
        creditorBic:
          type: string
          nullable: true
        amountMinorUnits:
          description: Amount in minor units (haléře/cents); the response also exposes `amount` in major units.
          type: integer
          format: int64
        currency:
          type: string
          description: >-
            Must be EUR (case-insensitive) when `paymentType` is SEPA_CREDIT — any other currency is a
            400 CURRENCY_NOT_ALLOWED (#11938). DOMESTIC and INTERNAL are not constrained here.
        frequency:
          type: string
          enum: [ONCE, DAILY, WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, ANNUALLY]
        paymentType:
          type: string
          enum: [SEPA_CREDIT, DOMESTIC, INTERNAL]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        remittanceInfo:
          type: string
          nullable: true
        replacesStandingOrderId:
          type: string
          format: uuid
          nullable: true
          description: Edit — cancel this order atomically with creating the new one (#10281).

    StandingOrderReceiptLookupRequest:
      type: object
      required: [idempotencyKey, debitAccountId]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
        debitAccountId:
          type: string
          format: uuid

    StandingOrderReceipt:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [FOUND, UNKNOWN]
        orderId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELLED, COMPLETED, FAILED]
          nullable: true

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
