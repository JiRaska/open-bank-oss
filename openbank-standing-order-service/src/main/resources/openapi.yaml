openapi: 3.1.0
info:
  title: Standing Order Service API
  version: 1.1.0
  description: Recurring payment orders — create, pause, resume, cancel, and execution feedback.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8116
    description: Local development
tags:
  - name: Standing Orders

paths:
  /api/v1/standing-orders:
    post:
      tags: [Standing Orders]
      summary: Create a standing order
      operationId: createStandingOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStandingOrderRequest'
      responses:
        '201':
          description: Standing order created

  /api/v1/standing-orders/{id}:
    get:
      tags: [Standing Orders]
      summary: Get standing order by ID
      operationId: getStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Standing order detail
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Standing Orders]
      summary: Cancel a standing order
      operationId: cancelStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '204':
          description: Cancelled

  /api/v1/standing-orders/party/{partyId}:
    get:
      tags: [Standing Orders]
      summary: List standing orders for a party
      operationId: listStandingOrdersByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Standing orders

  /api/v1/standing-orders/{id}/pause:
    post:
      tags: [Standing Orders]
      summary: Pause a standing order
      operationId: pauseStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Paused

  /api/v1/standing-orders/{id}/resume:
    post:
      tags: [Standing Orders]
      summary: Resume a paused standing order
      operationId: resumeStandingOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Resumed

  /api/v1/standing-orders/{id}/record-execution:
    patch:
      tags: [Standing Orders]
      summary: Rail service confirms successful dispatch — resets consecutive failure count
      operationId: recordExecution
      security:
        - bearerAuth: [ROLE_SERVICE, ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Execution confirmed, failure count reset
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/standing-orders/{id}/record-failure:
    patch:
      tags: [Standing Orders]
      summary: Rail service reports dispatch failure — increments count, FAILED after 3
      operationId: recordFailure
      security:
        - bearerAuth: [ROLE_SERVICE, ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Failure recorded; order FAILED when consecutiveFailures reaches 3
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateStandingOrderRequest:
      type: object
      required: [debtorAccountId, creditorIban, creditorName, amount, currencyCode, frequency, startDate]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        creditorIban:
          type: string
        creditorName:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        frequency:
          type: string
          enum: [DAILY, WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, ANNUALLY]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        remittanceInfo:
          type: string

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
