quarkus:
  application:
    name: openbank-tpp-registry-service
    version: 0.1.0

  http:
    port: 8108

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
    limits:
      max-body-size: 10M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_tpp_registry
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_tpp_registry

  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S

  hibernate-orm:
    database:
      generation: none

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    level: INFO
    console:
      json: true

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-tpp-registry-service

  swagger-ui:
    always-include: true
    path: /api/docs

  redis:
    hosts: redis://localhost:6379

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
        format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"
    oidc:
      enabled: false

"%test":
  quarkus:
    oidc:
      enabled: false
    # health/metrics on the main HTTP port under test — RestAssured targets a single port,
    # so the management interface (default :8085) must be folded back in (else /q/health/* 404s).
    management:
      enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 50
  tpp-registry:
    eba-sync-timeout-ms: 3000
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s

mp:
  messaging:
    outgoing:
      tpp-events-out:
        connector: smallrye-kafka
        client.id: tpp-registry-service-${quarkus.uuid}
        topic: openbank.tpp.registry.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
