quarkus:
  application:
    name: openbank-lending-service
  http:
    port: 8126
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_lending
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_lending
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none
  rest-client:
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
      connect-timeout: 2000
      read-timeout: 3000
    # A disbursement's cash leg lands in the loan book (ledger-service, above) AND has to reach
    # the borrower's own account — transaction-service is the only path that credits a balance
    # (#3931). account-service resolves which of the party's accounts that is.
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
      connect-timeout: 2000
      read-timeout: 3000
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://account-service.accounts.svc:8100}
      connect-timeout: 2000
      read-timeout: 3000
    product-catalog:
      url: ${PRODUCT_CATALOG_URL:http://localhost:8104}
      connect-timeout: 2000
      read-timeout: 3000
    # ADR-0269 rule 1: the CREDIT_OFFERS consent read behind the credit-offer gate. Short timeouts
    # on purpose — the gate fails CLOSED, so a slow consent-service costs a suppressed offer, never
    # an unconsented one, and a customer waiting on a screen is the worse failure to optimise for.
    consent-service:
      url: ${CONSENT_SERVICE_URL:http://localhost:8107}
      connect-timeout: 2000
      read-timeout: 3000
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-lending-service
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8086
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    # health/metrics on the main HTTP port under test — RestAssured targets a single port,
    # so the management interface (default :8086) must be folded back in (else /q/health/* 404s).
    management:
      enabled: false
  lending:
    origination:
      # No real Temporal frontend in @QuarkusTest: don't register the timers worker (it would
      # fail boot on Connection refused). Workflow tests drive their own TestWorkflowEnvironment.
      worker:
        enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true
  temporal:
    # ADR-0211 D2 durable origination timers.
    #
    # ⚠ BUILD-TIME PROPERTY. TemporalOriginationWorkflowAdapter is selected with @IfBuildProperty,
    # resolved during augmentation and frozen into the image — the losing bean's class is removed
    # outright. A container env var is read at RUNTIME and cannot change it. That is #6085: the
    # Rollout set OPENBANK_TEMPORAL_ENABLED=true, the image had been augmented with the `false`
    # default below, and NoOpOriginationWorkflowPort was what shipped — so no document-SLA,
    # offer-expiry or reflection/cooling-off timer was ever armed, while the no-op returned the
    # real adapter's success value. What decides the shipped image is therefore the DEFAULT, per
    # profile — hence the `%prod` override further down, which is the value that actually ships.
    # LendingAdapterBindingVerifier refuses to boot if the two ever disagree again.
    #
    # Note this gates only the CLIENT half. OriginationTimersWorkerRegistrar is not build-time
    # gated (it is switched by lending.origination.worker.enabled), so the deployed pod has been
    # polling the task queue all along with nothing ever starting a workflow on it.
    enabled: ${OPENBANK_TEMPORAL_ENABLED:false}
    server-url: ${TEMPORAL_FRONTEND_URL:temporal-frontend.temporal.svc.cluster.local:7233}
    namespace: ${OPENBANK_TEMPORAL_NAMESPACE:openbank-lending}
    task-queue: ${OPENBANK_TEMPORAL_TASK_QUEUE:openbank-lending-origination}

# Ledger posting (ADR-0028 D3). `backend=rest` build-time-activates RestLedgerPostingAdapter against
# ledger-service; left as `none` the @Default no-op stays bound and the service builds/boots offline.
#
# ⚠ THIS IS A BUILD-TIME PROPERTY (@IfBuildProperty, resolved during augmentation and frozen into
# the image). Setting LENDING_LEDGER_BACKEND as a container env var CANNOT change it — the losing
# bean's class is not in the image at all. That is #6057: the Rollout set the env var, the image had
# been augmented with the `none` default below, and every lending general-ledger posting was
# discarded by a no-op that returned success. What decides the shipped image is therefore the
# DEFAULT, per profile — hence the `%prod` override further down, which is the value that actually
# ships. The env var is kept only so a deliberately-built image can be told to disable the adapter,
# and LendingAdapterBindingVerifier refuses to boot if the two ever disagree again.
lending:
  ledger:
    backend: ${LENDING_LEDGER_BACKEND:none}
    system-actor-id: ${LENDING_LEDGER_SYSTEM_ACTOR_ID:00000000-0000-0000-0000-0000000000aa}
    # The leaf GL accounts are no longer configuration — they are platform-fixed, seeded, and selected
    # per loan currency by LendingGlChart (issue #1275), matching how transaction-service hardcodes its
    # seeded accounts. The former lending.ledger.gl.* @WithDefault placeholders were the footgun behind
    # #1275/#1720: a missing/wrong single-currency mapping booted green and 422ed at first posting.
  # Disbursement's customer-facing leg (#3931): AccountServiceClient + BorrowerCreditClient. Was
  # absent from this file entirely, so the @IfBuildProperty gate saw a MISSING property and disabled
  # the real clients in every image ever built, while the Rollout set the env var (#6057). Same
  # build-time caveat as lending.ledger.backend above; the shipping value is the `%prod` override.
  borrower-credit:
    backend: ${LENDING_BORROWER_CREDIT_BACKEND:none}
  compliance:
    # Fail-closed origination guard (ADR-0212 D2/D4 bootstrap). Restart-required; flip to true only
    # after the CZ reference pack is seeded and four-eyes-activated — with enforcement on and no
    # active pack for the request's (jurisdiction, productType), origination is REFUSED.
    enforce-pack: ${LENDING_ENFORCE_PACK:false}
    # How often each pod re-reads the activation table to pick up a pack approved on a SIBLING
    # replica (#3467). The registry is per-pod in-memory, so before this existed a pack was
    # enforceable only on the pod that served the approval until every other pod restarted — an
    # unbounded window in which the same application is judged against different rules. This is the
    # bound on that window; it is not a cache TTL, and lowering it costs one indexed read per pod.
    refresh-interval: ${LENDING_COMPLIANCE_REFRESH_INTERVAL:30s}
  # Customer self-service origination intake (ADR-0211 "Customer intake" row; CustomerIntakeResource).
  # Default OFF. `caller-principal` is the ONLY identity permitted to submit on a customer's behalf —
  # left blank, EVERY call is refused, deliberately: customer-edge's M2M token carries ROLE_OPERATOR
  # and nothing else, so "unset means any operator" would be an over-grant arriving by omission.
  # There is no default price: an unpriced product refuses rather than guessing a rate.
  intake:
    enabled: ${LENDING_INTAKE_ENABLED:false}
    caller-principal: ${LENDING_INTAKE_CALLER_PRINCIPAL:}
    jurisdiction: ${LENDING_INTAKE_JURISDICTION:CZ}
    product-type: ${LENDING_INTAKE_PRODUCT_TYPE:CONSUMER_CREDIT}
    currency: ${LENDING_INTAKE_CURRENCY:CZK}
    nominal-annual-rate: ${LENDING_INTAKE_NOMINAL_ANNUAL_RATE:}
    min-amount: ${LENDING_INTAKE_MIN_AMOUNT:5000}
    max-amount: ${LENDING_INTAKE_MAX_AMOUNT:1000000}
    min-term-months: ${LENDING_INTAKE_MIN_TERM_MONTHS:6}
    max-term-months: ${LENDING_INTAKE_MAX_TERM_MONTHS:120}
  origination:
    # Sandbox straight-through (ADR-0211 D5, ADR-0116 pattern): a submitted application is driven to
    # READY_TO_DISBURSE by the 'sandbox-auto-approval' actor so sandbox e2e runs without an operator.
    # Restart-required. MUST stay false in production — it bypasses the four-eyes gate entirely.
    auto-approve: ${LENDING_ORIGINATION_AUTO_APPROVE:false}
    worker:
      enabled: ${LENDING_ORIGINATION_WORKER_ENABLED:true}
    timers:
      offer-validity-days: ${LENDING_OFFER_VALIDITY_DAYS:30}
      docs-sla-days: ${LENDING_DOCS_SLA_DAYS:14}
  # Outbox event write (ADR-0003 transactional outbox). `backend=jpa` build-time-activates
  # JpaLoanEventEmitter, persisting each domain event to `lending_outbox` for LendingOutboxDispatcher
  # to publish. Defaults to `jpa` (unlike ledger.backend above) — the write targets this service's own
  # Postgres schema, already a hard boot dependency, so there is no offline-build story to protect;
  # leaving this unwired left loan.disbursed/interest_accrued/written_off/provisioned events silently
  # dropped at the @Default no-op (LoggingLoanEventEmitter).
  outbox:
    backend: ${LENDING_OUTBOX_BACKEND:jpa}
  # Servicing posting loop: scheduled accrual-basis interest recognition (ADR-0028 Phase 2).
  servicing:
    accrual:
      every: ${LENDING_ACCRUAL_EVERY:24h}
      batch-size: ${LENDING_ACCRUAL_BATCH_SIZE:500}
  # IFRS 9 provisioning cycle (ADR-0028 Phase 3): scheduled stage/ECL re-bucketing over the live book,
  # posting only the delta versus the last cycle's ECL per loan. PD/LGD are the conservative
  # placeholders from RiskParameterSource (ConservativeRiskParameterSource) until a real risk-parameter
  # adapter is bound — see the ADR for the explicit "not production-calibrated" caveat.
  provisioning:
    cycle:
      every: ${LENDING_PROVISIONING_EVERY:720h} # ~30 days; a monthly-cadence batch, not calendar-month aware
      batch-size: ${LENDING_PROVISIONING_BATCH_SIZE:500}

# Build-time adapter selection for the PACKAGED IMAGE. `quarkusBuild` augments with the `prod`
# profile active, so these — not the offline defaults above — are what ArC bakes in. Kept as a
# separate block precisely so the offline story (dev, test, `./gradlew quarkusDev`) is unchanged:
# only the shipped artifact posts to the real ledger and pays real borrowers.
"%prod":
  lending:
    ledger:
      backend: ${LENDING_LEDGER_BACKEND:rest}
    borrower-credit:
      backend: ${LENDING_BORROWER_CREDIT_BACKEND:rest}
    outbox:
      backend: ${LENDING_OUTBOX_BACKEND:jpa}
  openbank:
    temporal:
      # #6085. Binds TemporalOriginationWorkflowAdapter in the packaged image, so the durable
      # origination timers are armed for real. This is a customer-visible change: offers begin to
      # expire, unanswered document requests begin to time out, and the consumer-credit reflection
      # period begins to advance on its own — behaviour ADR-0211 D2 always specified and which has
      # never once executed in this environment.
      enabled: ${OPENBANK_TEMPORAL_ENABLED:true}

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      lending-events-out:
        connector: smallrye-kafka
        client.id: lending-service-${quarkus.uuid}
        topic: openbank.lending.events
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second
  # approver), independent of the base allow/deny enforce toggle above. Stays false
  # here — this PR only wires the ApprovalStore/endpoint (mirrors the sepa-payment
  # pilot); flipping it to block `lending.disburse` / `lending.collateralRegister`
  # (issue #621) is a deliberate, separate follow-up once the maker/checker runbook
  # is reviewed. Independent of this flag, `lending.collateralRegister` is ALWAYS
  # gated at the domain level: LendingService.decide() requires a distinct checker
  # before a Collateral moves out of PENDING, and applyCollateral() only ever sums
  # APPROVED collateral into the IFRS 9 LGD adjustment — so a pending registration
  # cannot lower a loan's provisioning even while this flag is false.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
