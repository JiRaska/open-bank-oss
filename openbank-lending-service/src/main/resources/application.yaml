quarkus:
  application:
    name: openbank-lending-service
  http:
    port: 8126
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_lending
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_lending
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none
  rest-client:
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
      connect-timeout: 2000
      read-timeout: 3000
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-lending-service
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8086
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    # health/metrics on the main HTTP port under test — RestAssured targets a single port,
    # so the management interface (default :8086) must be folded back in (else /q/health/* 404s).
    management:
      enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true

# Ledger posting (ADR-0028 D3). `backend=rest` build-time-activates RestLedgerPostingAdapter against
# ledger-service; left as `none` the @Default no-op stays bound and the service builds/boots offline.
lending:
  ledger:
    backend: ${LENDING_LEDGER_BACKEND:none}
    system-actor-id: ${LENDING_LEDGER_SYSTEM_ACTOR_ID:00000000-0000-0000-0000-0000000000aa}
    gl:
      loans-receivable: ${LENDING_GL_LOANS_RECEIVABLE:a0000000-0000-0000-0000-000000001200}
      funding-clearing: ${LENDING_GL_FUNDING_CLEARING:a0000000-0000-0000-0000-000000001100}
      interest-income: ${LENDING_GL_INTEREST_INCOME:a0000000-0000-0000-0000-000000004100}
      interest-receivable: ${LENDING_GL_INTEREST_RECEIVABLE:a0000000-0000-0000-0000-000000001300}
      loan-loss-expense: ${LENDING_GL_LOAN_LOSS_EXPENSE:a0000000-0000-0000-0000-000000005100}
  # Servicing posting loop: scheduled accrual-basis interest recognition (ADR-0028 Phase 2).
  servicing:
    accrual:
      every: ${LENDING_ACCRUAL_EVERY:24h}
      batch-size: ${LENDING_ACCRUAL_BATCH_SIZE:500}

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      lending-events-out:
        connector: smallrye-kafka
        client.id: lending-service-${quarkus.uuid}
        topic: openbank.lending.events
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
