openapi: 3.1.0
info:
  title: Lending Service API
  version: 1.19.0
  description: >-
    Loan origination, servicing, collateral and IFRS 9 provisioning (ADR-0028). The loan book posts
    cash events to ledger-service and never owns balances. Credit decisions and collateral
    registration are four-eyes (maker-checker), enforced server-side from the authenticated JWT
    subject.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8126
tags:
  - name: Lending
    description: Loan origination, servicing, collateral and IFRS 9 provisioning
security:
  - bearerAuth: []
paths:
  /api/v1/lending/applications:
    post:
      tags: [Lending]
      operationId: applyForLoan
      summary: Submit a loan application (maker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationRequest'
      responses:
        '201':
          description: Application accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Lending]
      operationId: listApplications
      summary: List a party's loan applications
      parameters:
        - name: partyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Applications for the party
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/intake/applications:
    post:
      tags: [Lending]
      operationId: submitCustomerIntake
      summary: Submit a loan application on behalf of an authenticated customer (customer-edge only)
      description: >-
        Customer self-service origination intake (ADR-0211). The party id is taken from the
        X-Customer-Party-Id header set by customer-edge from the customer JWT — never from the body.
        Price, jurisdiction and product type are lending-side configuration, so an applicant can
        neither price their own loan nor choose which ADR-0212 compliance pack judges them. Only the
        configured customer-edge service principal may call it; any other caller is refused 403.
        This is the MAKER leg only — the application still needs a human four-eyes decision.
      parameters:
        - name: X-Customer-Party-Id
          in: header
          required: true
          description: The applicant's party id, set by customer-edge from the customer JWT.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerIntakeRequest'
      responses:
        '201':
          description: Application accepted into the origination graph
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Refused by the origination guard (e.g. no active compliance pack)
    get:
      tags: [Lending]
      operationId: listCustomerCreditJourneys
      summary: The caller's own credit applications as customer-readable journeys (customer-edge only)
      description: >-
        ADR-0269 rule 3. Scoped to the party in X-Customer-Party-Id; carries no rate, instalment or
        APRC — that is ADR-0269 rule 4, served by /quotes below. Only the configured customer-edge principal may
        call it.
      parameters:
        - name: X-Customer-Party-Id
          in: header
          required: true
          description: The applicant's party id, set by customer-edge from the customer JWT.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The party's credit applications (possibly empty)
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/lending/intake/applications/{id}:
    get:
      tags: [Lending]
      operationId: getCustomerCreditJourney
      summary: One of the caller's own credit applications as a customer-readable journey
      description: >-
        A journey belonging to another party answers 404, not 403 — a not-found and a not-yours must
        be indistinguishable, or the id space leaks.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: X-Customer-Party-Id
          in: header
          required: true
          description: The applicant's party id, set by customer-edge from the customer JWT.
          schema: { type: string, format: uuid }
      responses:
        '200': { description: The credit application journey }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404': { description: No such application for this caller }

  /api/v1/lending/intake/financial-health:
    get:
      tags: [Lending]
      operationId: getCustomerFinancialHealth
      summary: The caller's four-pillar financial health (customer-edge only, no score)
      description: >-
        ADR-0269 rule 5. Assembled here because the pillars need the credit profile, the loan book
        and (later) balances, all of which this service already reaches. The judgement itself is a
        pure function in libs; this route only fetches. Any pillar may answer UNKNOWN, and one
        unavailable upstream greys out one pillar rather than the whole view.
      parameters:
        - name: X-Customer-Party-Id
          in: header
          required: true
          description: The applicant's party id, set by customer-edge from the customer JWT.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The four pillars
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/lending/intake/quotes:
    post:
      tags: [Lending]
      operationId: quoteCustomerCredit
      summary: Indicative, non-binding price for a requested amount and term (customer-edge only)
      description: >-
        ADR-0269 rule 4 — the only place an instalment or an APRC may come from. Nothing is
        persisted: an indicative price with an id would be one lookup away from being treated as a
        binding offer. Price, currency and bounds are lending-side configuration; the body carries
        only the amount and term. Refused 409 with a reason code when the ADR-0269 rule-2 distress
        floor suppresses pricing — never a 200 with empty numbers, which a client renders as zero.
      parameters:
        - name: X-Customer-Party-Id
          in: header
          required: true
          description: The applicant's party id, set by customer-edge from the customer JWT.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerQuoteRequest'
      responses:
        '200':
          description: The indicative quote (binding is always false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Pricing suppressed by the distress floor; body carries the reason code

  /api/v1/lending/applications/{id}:
    get:
      tags: [Lending]
      operationId: getApplication
      summary: Get a loan application
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: The application }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404': { description: Not found }
  /api/v1/lending/applications/summary:
    get:
      tags: [Lending]
      operationId: summariseApplications
      summary: Per-state application totals across the whole book
      description: >-
        The answer /applications/recent cannot give. That endpoint is a capped list (the server
        clamps limit to 1..100), so any count taken from it is "of the newest N", never the book —
        and a console rendering a capped count as a total turns a staffing decision into a guess
        (issue #3294). Aggregated in the database, one round trip, bounded by the number of
        (state, currency) pairs rather than by the size of the book.
      responses:
        '200':
          description: One entry per origination state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApplicationStateSummary' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/loans/summary:
    get:
      tags: [Lending]
      operationId: summariseLoans
      summary: Per-status loan-book totals
      description: >-
        Companion to /applications/summary for the loan book (issue #3294), so "book size" and
        "loans in trouble" stop being "of the newest 100".
      responses:
        '200':
          description: One entry per loan status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoanStateSummary' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/risk/decisions:
    get:
      tags: [Lending]
      operationId: riskDecisions
      summary: Engine-evaluated applications with decoded ADR-0213 evidence (newest first)
      description: >-
        The credit-risk console's primary read (ADR-0230 D1). Each row is one application the
        deterministic engine evaluated: outcome, price band, machine-readable reason codes with the
        rule that fired, matched rule ids, pinned policy versions, input snapshot hash and the
        affordability ratios the engine read — decoded server-side from the evidence fields the
        application pins (ADR-0214), never recomputed. Read-only; the console renders decisions and
        never makes them (ADR-0227 D4).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
          description: Clamped server-side to 1..1000. A caller wanting the whole history uses the warehouse.
      responses:
        '200':
          description: Newest evaluation first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CreditDecisionView' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/risk/decisions/summary:
    get:
      tags: [Lending]
      operationId: riskDecisionSummary
      summary: Book-wide engine outcome × price-band totals, grouped in the database
      description: >-
        The figure /risk/decisions cannot give (it is capped): how many applications the engine
        approved, referred and declined over the whole book, per price band. Same reasoning as
        /applications/summary (issue #3294).
      responses:
        '200':
          description: One entry per (outcome, priceBand) pair
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DecisionOutcomeSummary' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/risk/portfolio:
    get:
      tags: [Lending]
      operationId: riskPortfolio
      summary: Loans with their latest IFRS 9 provisioning record (null where never assessed)
      description: >-
        Stage, DPD bucket, expected credit loss, outstanding balance and the PD/LGD model version
        that produced them, read back from loan_provisioning (ADR-0028 Phase 3). A loan the
        scheduled cycle has never assessed carries assessment=null — a real state the console shows
        as such, never as Stage 1 with zero ECL.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Newest disbursement first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoanRiskView' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/risk/policy:
    get:
      tags: [Lending]
      operationId: riskPolicy
      summary: The credit policy bundle the engine evaluates as of a date
      description: >-
        Every decision table (exclusion, eligibility, affordability, pricing band) with its rules,
        version and effective window (ADR-0213 D1). codeSeeded is true while the ADR-0213 D3
        starter policy is the binding — i.e. before the four-eyes table store D4 describes exists —
        so a risk committee reading the table knows whether anyone can change it and how.
      parameters:
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date }
          description: ISO-8601 date; defaults to today. A malformed value is a 400.
      responses:
        '200':
          description: The active bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPolicyView' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/applications/recent:
    get:
      tags: [Lending]
      operationId: listRecentApplications
      summary: Backoffice queue — newest applications fleet-wide (ADR-0230)
      description: >-
        Fleet-wide application list for the lending console (newest first, optional status
        filter). Requires ROLE_OPERATOR, ROLE_ADMIN, ROLE_LENDING_OFFICER or ROLE_CREDIT_RISK.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PROPOSED, APPROVED, REJECTED, DISBURSED, DRAFT, SUBMITTED, KYC_PENDING,
              DOCS_REQUIRED, ASSESSMENT, DECISION_PENDING, FOUR_EYES, OFFERED, AWAITING_SIGNATURE,
              SIGNED, REFLECTION_PERIOD, READY_TO_DISBURSE, WITHDRAWN, DECLINED, EXPIRED]
        - name: limit
          in: query
          description: Clamped server-side into 1..100.
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Recent applications }
        '400': { description: Unknown status value }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/loans/{id}/settlement-quote:
    post:
      tags: [Lending]
      operationId: requestSettlementQuote
      summary: Issue a binding early-repayment settlement quote (ADR-0215 D2)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201': { description: Quote issued and persisted with its validity window }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Loan not in a quotable state }
  /api/v1/lending/loans/{id}/settle:
    post:
      tags: [Lending]
      operationId: settleLoan
      summary: Settle the loan against a still-valid quote (expired quotes refused)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Loan settled and closed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: No valid quote or invalid state }
  /api/v1/lending/loans/{id}/withdrawal:
    post:
      tags: [Lending]
      operationId: withdrawLoan
      summary: Statutory withdrawal inside the pack's cooling-off window (ADR-0215 D4)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Contract unwound with statutory day interest }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Cooling-off window closed or no pack }
  /api/v1/lending/loans/{id}/mark-delinquent:
    post:
      tags: [Lending]
      operationId: markLoanDelinquent
      summary: Mark the loan delinquent
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Loan marked DELINQUENT }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: No past-due installment }
  /api/v1/lending/loans/{id}/mark-defaulted:
    post:
      tags: [Lending]
      operationId: markLoanDefaulted
      summary: Mark the loan defaulted (CRR Art. 178 DPD threshold)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Loan marked DEFAULTED }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: DPD below threshold }
  /api/v1/lending/loans/{id}/forbearance:
    post:
      tags: [Lending]
      operationId: recordForbearance
      summary: Record the mandatory forbearance assessment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Assessment recorded (FORBEARANCE_ASSESSED) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Not in DEFAULTED state }
  /api/v1/lending/loans/{id}/termination/propose:
    post:
      tags: [Lending]
      operationId: proposeTermination
      summary: Propose bank-initiated termination (maker)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Termination proposed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Ground not permitted by the pinned pack }
  /api/v1/lending/loans/{id}/termination/decide:
    post:
      tags: [Lending]
      operationId: decideTermination
      summary: Decide a termination proposal (checker, must differ from maker)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: TERMINATION_NOTICED with the pack notice period }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Four-eyes violation }
  /api/v1/lending/loans/{id}/accelerate:
    post:
      tags: [Lending]
      operationId: accelerateLoan
      summary: Accelerate after the notice period elapses
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Loan ACCELERATED — full balance due }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Notice period not yet elapsed }
  /api/v1/lending/applications/{id}/evidence:
    get:
      tags: [Lending]
      operationId: getApplicationEvidence
      summary: Ordered evidence bundle for one loan application (ADR-0214)
      description: >-
        The application lifecycle as recorded in the transactional outbox, oldest first —
        the same events the audit chain (ADR-0133) ingests. ROLE_COMPLIANCE / ROLE_CREDIT_RISK / ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Ordered evidence events with attestation marker }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/applications/{id}/advance:
    post:
      tags: [Lending]
      operationId: advanceApplication
      summary: Advance an application one step along the canonical origination graph (ADR-0211)
      description: >-
        Moves the application to the next forward state, validated by the state machine; optional
        states (DOCS_REQUIRED, REFLECTION_PERIOD) are skipped unless the pinned compliance pack
        makes them mandatory. Advancement stops at READY_TO_DISBURSE — booking is the disburse
        endpoint. Legacy status names (PROPOSED/APPROVED/REJECTED) remain accepted by the
        listRecentApplications filter for compatibility; retired rows were migrated by V9.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Application advanced to the next state }
        '404': { description: Application not found }
        '422': { description: No forward transition from the current state }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/applications/{id}/decision:
    post:
      tags: [Lending]
      operationId: decideApplication
      summary: Approve or reject an application (checker; must differ from maker)
      description: Requires ROLE_CREDIT_RISK or ROLE_ADMIN. The checker identity is the JWT subject.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200': { description: Decision applied }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/lending/applications/{id}/disburse:
    post:
      tags: [Lending]
      operationId: disburseLoan
      summary: Disburse an approved application, booking the loan and its schedule
      description: Requires ROLE_LENDING_OFFICER or ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201': { description: Loan disbursed and booked }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/lending/loans/active:
    get:
      tags: [Lending]
      operationId: listActiveLoans
      summary: Backoffice portfolio — active loans fleet-wide (ADR-0230)
      description: >-
        Fleet-wide active-loan list for the lending console. Requires a lending desk role,
        ROLE_OPERATOR or ROLE_ADMIN (viewer and compliance read-only).
      parameters:
        - name: limit
          in: query
          description: Clamped server-side into 1..100.
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Active loans }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/loans:
    get:
      tags: [Lending]
      operationId: listLoans
      summary: List a party's loans
      parameters:
        - name: partyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Loans for the party }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/loans/{id}:
    get:
      tags: [Lending]
      operationId: getLoan
      summary: Get a loan
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: The loan }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404': { description: Not found }
  /api/v1/lending/loans/{id}/schedule:
    get:
      tags: [Lending]
      operationId: getSchedule
      summary: Get a loan's repayment schedule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: The repayment schedule }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/loans/{id}/installments/{installmentId}/repay:
    post:
      tags: [Lending]
      operationId: recordRepayment
      summary: Record a repayment against an installment
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: installmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Repayment recorded }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/lending/loans/{id}/writeoff:
    post:
      tags: [Lending]
      operationId: writeOffLoan
      summary: Write off an uncollectible loan's remaining exposure
      description: Requires ROLE_CREDIT_RISK, ROLE_COMPLIANCE or ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOffRequest'
      responses:
        '200': { description: Loan written off }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/lending/loans/{id}/reschedule:
    post:
      tags: [Lending]
      operationId: rescheduleLoan
      summary: Restructure a loan, replacing its remaining schedule and optionally forgiving principal
      description: >-
        Requires ROLE_CREDIT_RISK, ROLE_COMPLIANCE or ROLE_ADMIN. The acting principal is the JWT
        subject. Already-paid installments are untouched; a new schedule replaces only the unpaid
        tail, generated from the outstanding balance net of any principalForgiveness.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200': { description: Loan rescheduled }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/lending/loans/{id}/collateral:
    post:
      tags: [Lending]
      operationId: registerCollateral
      summary: Register collateral against a loan (maker; PENDING until a checker approves it)
      description: >-
        The registrant identity is the JWT subject. The registered collateral is PENDING and is not
        consulted by the IFRS 9 ECL calculation until a different principal approves it via
        POST /api/v1/lending/collateral/{id}/decision.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollateralRequest'
      responses:
        '201': { description: Collateral registered (PENDING) }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Lending]
      operationId: listCollateral
      summary: List collateral registered against a loan (any status)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Collateral for the loan }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/collateral/{id}/decision:
    post:
      tags: [Lending]
      operationId: decideCollateral
      summary: Approve or reject a pending collateral registration (checker; must differ from registrant)
      description: Requires ROLE_CREDIT_RISK or ROLE_ADMIN. The checker identity is the JWT subject.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollateralDecisionRequest'
      responses:
        '200': { description: Decision applied }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/lending/loans/{id}/provisioning:
    get:
      tags: [Lending]
      operationId: provisioning
      summary: IFRS 9 staging + ECL snapshot for a loan
      description: Requires ROLE_CREDIT_RISK, ROLE_COMPLIANCE or ROLE_ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: IFRS 9 snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404': { description: Not found }
  /api/v1/lending/approvals:
    get:
      tags: [Lending]
      summary: List pending four-eyes approvals (ADR-0227 inbox federation)
      description: >-
        PENDING maker-checker approvals, oldest first. The read side of the unified approval
        inbox — deciding stays on PATCH /api/v1/lending/approvals/{id}.
        Requires ROLE_LENDING_OFFICER, ROLE_CREDIT_RISK or ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/lending/approvals/{id}:
    patch:
      tags: [Lending]
      summary: Approve or reject a pending four-eyes approval for a lending (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                type: object
                required: [id, action, status]
                properties:
                  id:
                    type: string
                  action:
                    type: string
                    description: The gated action this approval was raised for.
                  resourceId:
                    type: string
                    nullable: true
                  status:
                    type: string
                  decidedBy:
                    type: string
                    nullable: true
        '404':
          description: No pending approval with that id
  /api/v1/lending/compliance-packs/proposals:
    post:
      tags: [Lending]
      operationId: proposeCompliancePack
      summary: Propose a compliance pack for four-eyes activation (maker, ROLE_COMPLIANCE)
      description: >-
        Strict, fail-closed pack decoding (ADR-0212): an unknown key, enum value or type rejects the
        whole proposal. The pack activates only after a DIFFERENT compliance principal approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: Proposal registered, awaiting a checker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackActivationView' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/compliance-packs/proposals/{id}/decide:
    post:
      tags: [Lending]
      operationId: decideCompliancePack
      summary: Approve or reject a pack activation (checker, must differ from maker)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: Decision recorded; an approved pack is active in-memory immediately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackActivationView' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Four-eyes violation (maker equals checker) or the proposal is not decidable
  /api/v1/lending/compliance-packs/proposals/pending:
    get:
      tags: [Lending]
      operationId: listPendingCompliancePacks
      summary: List pack proposals awaiting a checker
      responses:
        '200':
          description: Pending proposals, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackActivationView' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/lending/compliance-packs/active:
    get:
      tags: [Lending]
      operationId: listActiveCompliancePacks
      summary: List packs currently active in the origination guard
      responses:
        '200':
          description: Active packs with content hashes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackActivationView' }
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: State conflict (e.g. four-eyes violation, illegal loan state transition)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    PackActivationView:
      type: object
      required:
        - id
        - jurisdiction
        - productType
        - packVersion
        - effectiveFrom
        - contentHash
        - state
        - proposedBy
        - pack
      properties:
        id: { type: string, format: uuid }
        jurisdiction: { type: string }
        productType: { type: string, enum: [CONSUMER_CREDIT, MORTGAGE, OVERDRAFT, SME_CREDIT] }
        packVersion: { type: integer }
        effectiveFrom: { type: string, format: date }
        contentHash: { type: string, description: SHA-256 fingerprint of the exact reviewed pack }
        state: { type: string, enum: [PROPOSED, APPROVED, REJECTED, EXECUTED] }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
        pack:
          $ref: '#/components/schemas/CompliancePack'
    CompliancePack:
      type: object
      description: Exact reviewed pack content, returned so operators can inspect what the hash identifies.
      additionalProperties: true
      required: [jurisdiction, productType, version, effectiveFrom]
      properties:
        jurisdiction: { type: string }
        productType: { type: string, enum: [CONSUMER_CREDIT, MORTGAGE, OVERDRAFT, SME_CREDIT] }
        version: { type: integer }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
    ApiError:
      type: object
      properties:
        error: { type: string }
    ApprovalResponse:
      type: object
      required: [id, action, status]
      properties:
        id: { type: string }
        action: { type: string, description: The gated action the maker requested (e.g. lending.disburse) }
        resourceId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXECUTED] }
        makerId: { type: string, nullable: true, description: Principal that created the request }
        createdAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true }
    ProvisioningSnapshot:
      type: object
      required: [loanId, asOf, outstandingBalance, daysPastDue, bucket, stage, horizon, expectedCreditLoss, modelVersion]
      properties:
        loanId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        outstandingBalance:
          $ref: '#/components/schemas/Money'
        daysPastDue: { type: integer }
        bucket:
          type: string
          enum: [CURRENT, DPD_1_30, DPD_31_60, DPD_61_90, DPD_90_PLUS]
        stage:
          type: string
          enum: [STAGE_1, STAGE_2, STAGE_3]
        horizon:
          type: string
          enum: [TWELVE_MONTH, LIFETIME]
        expectedCreditLoss:
          $ref: '#/components/schemas/Money'
        modelVersion:
          type: string
          description: >-
            The risk-parameter model version that produced this ECL figure (issue #8364) — the
            audit trail from a provision back to the exact PD/LGD parameter set. A change to the
            underlying parameters always ships with a new version string.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, description: ISO-4217 currency code }
    MoneyTotal:
      type: object
      required: [currency, amount]
      description: >-
        A total for ONE currency. Money is never returned as a single summed number here: the
        currency column is per row, so one figure would be CZK added to EUR — authoritative-looking
        and meaningless. A caller wanting one number must say which currency it means.
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount: { type: number }
    ApplicationStateSummary:
      type: object
      required: [status, count, requested]
      properties:
        status:
          type: string
          description: An OriginationState value.
        count: { type: integer, format: int64 }
        oldestCreatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Oldest application in this state — the one a desk should act on first. Null only when
            the state is empty, which `count` already says.
        requested:
          type: array
          items: { $ref: '#/components/schemas/MoneyTotal' }
    LoanStateSummary:
      type: object
      required: [status, count, principal]
      properties:
        status: { type: string }
        count: { type: integer, format: int64 }
        principal:
          type: array
          items: { $ref: '#/components/schemas/MoneyTotal' }
    DecisionReasonView:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [INPUT_MISSING, RULE_NOT_EVALUABLE, POLICY_TABLE_MISSING, EXCLUSION_MATCHED, ELIGIBILITY_FAILED, AFFORDABILITY_FAILED, PRICING_BAND_UNMATCHED]
        ruleId: { type: string, nullable: true }
    AffordabilityRatios:
      type: object
      required: [dsti, dti, dstiIncludingExistingDebt]
      description: >-
        dsti is the new installment over verified income — what PolicyAttribute.DSTI carries into
        the affordability table. dstiIncludingExistingDebt adds existingDebtServiceMonthly (the
        CNB/EBA total-debt-service definition); it is exposed so the console can show the gap, and
        is NOT what the engine evaluates today.
      properties:
        dsti: { type: number }
        dti: { type: number }
        dstiIncludingExistingDebt: { type: number }
    CreditDecisionView:
      type: object
      required: [applicationId, partyId, status, createdAt, requestedAmount, currency, termPeriods, nominalAnnualRate, productKind, engineOutcome, reasons, matchedRuleIds, policyVersions]
      properties:
        applicationId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        status: { type: string, description: The current OriginationState. }
        createdAt: { type: string, format: date-time }
        requestedAmount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        termPeriods: { type: integer }
        nominalAnnualRate: { type: number }
        jurisdiction: { type: string, nullable: true }
        productType: { type: string, nullable: true }
        productKind: { type: string }
        packVersion: { type: integer, nullable: true }
        engineOutcome: { type: string, enum: [APPROVE, REFER, DECLINE, UNEVALUATED] }
        priceBand: { type: string, nullable: true }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/DecisionReasonView' }
        matchedRuleIds:
          type: array
          items: { type: string }
        policyVersions:
          type: object
          additionalProperties: { type: integer }
          description: Pinned table version per PolicyTableKind name.
        inputSnapshotHash: { type: string, nullable: true }
        decidedEngineAt: { type: string, format: date-time, nullable: true }
        affordability:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AffordabilityRatios' }]
        verifiedIncomeMonthly: { type: number, nullable: true }
        existingDebtServiceMonthly: { type: number, nullable: true }
        ageYears: { type: integer, nullable: true }
        residency: { type: string, nullable: true }
        employmentTenureMonths: { type: integer, nullable: true }
        humanDecidedBy: { type: string, nullable: true }
        humanDecisionReason: { type: string, nullable: true }
        humanDecidedAt: { type: string, format: date-time, nullable: true }
    DecisionOutcomeSummary:
      type: object
      required: [engineOutcome, count]
      properties:
        engineOutcome: { type: string, enum: [APPROVE, REFER, DECLINE] }
        priceBand: { type: string, nullable: true }
        count: { type: integer, format: int64 }
    LoanRiskAssessmentView:
      type: object
      required: [period, asOf, outstandingBalance, daysPastDue, bucket, stage, expectedCreditLoss, modelVersion]
      properties:
        period: { type: string, description: Reporting period key, yyyy-MM. }
        asOf: { type: string, format: date }
        outstandingBalance: { type: number }
        daysPastDue: { type: integer }
        bucket: { type: string, enum: [CURRENT, DPD_1_30, DPD_31_60, DPD_61_90, DPD_90_PLUS] }
        stage: { type: string, enum: [STAGE_1, STAGE_2, STAGE_3] }
        expectedCreditLoss: { type: number }
        modelVersion: { type: string, description: The PD/LGD parameter set that produced the ECL. }
    LoanRiskView:
      type: object
      required: [loanId, applicationId, partyId, status, principal, currency, nominalAnnualRate, termPeriods, disbursedAt]
      properties:
        loanId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        status: { type: string }
        principal: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        nominalAnnualRate: { type: number }
        termPeriods: { type: integer }
        disbursedAt: { type: string, format: date-time }
        assessment:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/LoanRiskAssessmentView' }]
    PolicyRuleView:
      type: object
      required: [id, attribute, operator, values, detail]
      properties:
        id: { type: string }
        attribute: { type: string }
        operator: { type: string, enum: [GT, GTE, LT, LTE, EQ, NEQ, IN, NOT_IN] }
        threshold: { type: number, nullable: true }
        values:
          type: array
          items: { type: string }
        band: { type: string, nullable: true }
        detail: { type: string }
    PolicyTableView:
      type: object
      required: [kind, name, version, effectiveFrom, rules]
      properties:
        kind: { type: string, enum: [EXCLUSION, ELIGIBILITY, AFFORDABILITY, PRICING_BAND] }
        name: { type: string }
        version: { type: integer }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRuleView' }
    CreditPolicyView:
      type: object
      required: [asOf, source, codeSeeded, tables]
      properties:
        asOf: { type: string, format: date }
        source: { type: string, description: The CreditPolicyPort binding's class name. }
        codeSeeded: { type: boolean }
        tables:
          type: array
          items: { $ref: '#/components/schemas/PolicyTableView' }
    CustomerQuoteRequest:
      type: object
      required: [amount, termMonths]
      description: >-
        The same two fields the intake accepts, and for the same reason: a customer may choose how
        much and how long, never at what price.
      properties:
        amount: { type: string, description: Decimal in the product's configured currency }
        termMonths: { type: integer, minimum: 1 }

    CustomerQuote:
      type: object
      required: [amount, currency, termMonths, nominalAnnualRatePercent, monthlyPayment,
                 totalPayable, totalCostOfCredit, validUntil, binding]
      description: >-
        An indicative price. Structurally distinct from a binding offer: no id, no accept path.
      properties:
        amount: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        termMonths: { type: integer }
        nominalAnnualRatePercent: { type: string }
        monthlyPayment: { type: string }
        totalPayable: { type: string }
        totalCostOfCredit: { type: string }
        aprcPercent:
          type: string
          nullable: true
          description: >-
            RPSN/APRC. NULL means "could not be computed" and must be rendered as an absent figure —
            never as 0%, which reads to a customer as free credit.
        validUntil: { type: string, format: date-time }
        binding:
          type: boolean
          description: >-
            Always false. Present so a client never has to infer it; an unwritten assumption is the
            kind that gets forgotten.

    CustomerIntakeRequest:
      type: object
      required: [amount, termMonths]
      description: >-
        What a customer app may state. Note what is absent — partyId, nominalAnnualRate,
        jurisdiction, productType. Those are the trusted header and server configuration
        respectively; accepting any of them from the applicant would let them submit for another
        party, price their own loan, or select the compliance pack that judges them.
      properties:
        amount:
          type: number
          description: Requested principal, in the configured self-service currency.
        termMonths:
          type: integer
          description: Requested term. Bounds are server configuration; outside them is a 400.
    LoanApplicationRequest:
      type: object
      required: [partyId, requestedAmount, nominalAnnualRate, termPeriods, firstDueDate]
      properties:
        partyId: { type: string, format: uuid }
        requestedAmount: { $ref: '#/components/schemas/Money' }
        nominalAnnualRate: { type: number }
        termPeriods: { type: integer }
        periodsPerYear: { type: integer, default: 12 }
        method:
          type: string
          enum: [ANNUITY, EQUAL_PRINCIPAL, BULLET]
          default: ANNUITY
        firstDueDate: { type: string, format: date }
        jurisdiction:
          type: string
          nullable: true
          description: >-
            Origination jurisdiction (e.g. CZ). Required when compliance-pack enforcement is on
            (ADR-0212 D2): without an active pack for (jurisdiction, productType) the request is
            refused fail-closed.
        productType:
          type: string
          nullable: true
          enum: [CONSUMER_CREDIT, MORTGAGE, OVERDRAFT, SME_CREDIT, null]
          description: Credit product type resolved against the compliance pack registry (ADR-0212).
        verifiedIncomeMonthly:
          $ref: '#/components/schemas/Money'
          description: >-
            Verified net monthly income — feeds DSTI/DTI at the ASSESSMENT evaluation (ADR-0213);
            absent input fails closed to REFER.
        existingDebtServiceMonthly:
          $ref: '#/components/schemas/Money'
          description: Existing monthly debt service, if any (nullable).
        ageYears: { type: integer, nullable: true, description: Applicant age in years (majority floor) }
        residency: { type: string, nullable: true, description: Residency country code (e.g. CZ) }
        employmentTenureMonths: { type: integer, nullable: true }
        catalogOfferingId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional published catalog offering. When supplied, its immutable revision sets the
            rate, currency, tenor and amortization constraints and is retained with the application.
    DecisionRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        reason: { type: string, nullable: true }
    CollateralRequest:
      type: object
      required: [type, marketValue]
      properties:
        type: { type: string }
        description: { type: string, nullable: true }
        marketValue: { $ref: '#/components/schemas/Money' }
        haircut: { type: number, default: 0 }
    CollateralDecisionRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        reason: { type: string, nullable: true }
    WriteOffRequest:
      type: object
      description: >-
        The acting principal is the authenticated JWT subject (server-side), never a client-supplied
        field, so only the audit reason is carried in the body.
      properties:
        reason: { type: string, nullable: true }
    RescheduleRequest:
      type: object
      description: >-
        The acting principal is the authenticated JWT subject (server-side), never a client-supplied
        field. principalForgiveness defaults conceptually to zero (no debt relief) — pass a Money of
        zero for a pure term/rate change with no forgiveness.
      required: [newNominalAnnualRate, newTermPeriods, newFirstDueDate, principalForgiveness]
      properties:
        newNominalAnnualRate: { type: number }
        newTermPeriods: { type: integer }
        newFirstDueDate: { type: string, format: date }
        principalForgiveness: { $ref: '#/components/schemas/Money' }
        reason: { type: string, nullable: true }
