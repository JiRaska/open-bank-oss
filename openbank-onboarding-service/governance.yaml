# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: compliance
primaryDatastore: PostgreSQL
databaseName: openbank_onboarding
dataLineageRole: both
dataClassification: confidential
retentionPolicy: 7 years
evidenceExported: false
lineage:
  upstream: []
    # Removed (issue #3982): `kyc-service (api, "triggers KYC")` — kyc-service's only client is
    # sanctions-service and its Deployment env carries no onboarding URL; onboarding-service has
    # no kyc-service client. The edge exists in neither direction. (Consistent with the note
    # below: onboarding is a read model, so nothing calls INTO it either.)
  downstream:
    # Direction corrected (issue #3982): declared as `upstream: party-service ("creates party")`,
    # i.e. party-service calling onboarding-service. PartyServiceClient(configKey =
    # "party-service") is onboarding-service's ONLY @RegisterRestClient — the read model reads
    # party-service, party-service does not push to it.
    - serviceName: party-service
      relationType: api
      description: reads party state via PartyServiceClient
  # No account-service downstream edge: onboarding-service is a passive funnel-tracking read model
  # (OnboardingEventConsumer projects party/kyc/sca events), not an orchestrator — it has
  # no AccountServiceClient and opens no account. Account opening is driven directly by
  # account-service's PartyEventConsumer on PARTY_CREATED (ADR-0267 §1); the real edge is
  # party-service --topic--> account-service, declared on party-service's own downstream.
  # The former `account-service (api, "opens account")` edge here was fabricated boilerplate
  # with no backing @RegisterRestClient (issue #1501, found by check-governance-lineage.py).
databaseLineage:
  ownedDatabases:
    - openbank_onboarding
  dependentDatabases:
    - openbank_parties
    - openbank_kyc
