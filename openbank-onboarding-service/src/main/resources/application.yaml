quarkus:
  application:
    name: openbank-onboarding-service
  http:
    port: 8130
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_onboarding
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_onboarding
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  rest-client:
    # Local-dev default ONLY — the in-cluster URL comes from PARTY_SERVICE_URL on the Deployment
    # (openbank-infra/gitops/components/onboarding/onboarding-service.yaml), as customer-edge,
    # statement-service and document-service already do. The previous default named
    # `openbank-party-service:8090`: no Service of that name exists in any namespace, and the
    # port was wrong too (party-service is 8111 in namespace `party`). The Deployment carried no
    # override, so that was the EFFECTIVE value and AbandonedRegistrationCleaner's party lookup
    # could never resolve (issue #3931).
    "party-service":
      url: ${PARTY_SERVICE_URL:http://localhost:8111}
      connect-timeout: 3000
      read-timeout: 5000
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-onboarding-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137, #2665 Tier 2c). Defaults keep local dev/test on
    # PLAINTEXT; the onboarding Rollout sets KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    # NOTE (issue #686): group.id / auto.offset.reset (and client.id) are intentionally
    # NOT set here for party-events-in / kyc-events-in / sca-events-in. Quarkus's YAML
    # config source unconditionally quotes any mp.messaging.incoming.<channel> leaf key
    # containing a literal dot when registering it as a MicroProfile Config property, so
    # a YAML `group.id: foo` here would register as the literal property
    # `mp.messaging.incoming.<channel>."group.id"` — never the plain
    # `mp.messaging.incoming.<channel>.group.id` that KafkaConnectorIncomingConfiguration
    # actually reads. group.id then silently falls back to quarkus.application.name,
    # which the Strimzi KafkaUser ACL (kafka-onboarding-mtls.yaml) does NOT grant Read on
    # for any of these three groups -> silent GroupAuthorizationException on every poll.
    # These keys are instead supplied via a properties-file override
    # (onboarding-service-msg-override ConfigMap, QUARKUS_CONFIG_LOCATIONS,
    # config_ordinal=500) whose flat key=value lines carry the exact dotted property
    # name unambiguously. Same pattern as transaction-service's msg-override (ADR-0137).
    incoming:
      party-events-in:
        connector: smallrye-kafka
        topic: openbank.party.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      kyc-events-in:
        connector: smallrye-kafka
        topic: openbank.kyc.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      sca-events-in:
        connector: smallrye-kafka
        topic: openbank.sca.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false

"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_onboarding_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_onboarding_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    scheduler:
      enabled: false
