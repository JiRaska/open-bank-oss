quarkus:
  application:
    name: openbank-onboarding-service
  http:
    port: 8130
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_onboarding
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_onboarding
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  rest-client:
    "party-service":
      url: ${PARTY_SERVICE_URL:http://openbank-party-service:8090}
      connect-timeout: 3000
      read-timeout: 5000
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-onboarding-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137, #2665 Tier 2c). Defaults keep local dev/test on
    # PLAINTEXT; the onboarding Rollout sets KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      party-events-in:
        connector: smallrye-kafka
        client.id: onboarding-service-party-${quarkus.uuid}
        topic: openbank.party.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
        # openbank-infra/gitops/components/onboarding/onboarding-service.yaml
        # (MP_MESSAGING_INCOMING_PARTY_EVENTS_IN_* env vars) for why and where they're set
        # instead. Summary: SmallRye Config's YAML source unconditionally quotes any leaf map key
        # containing a literal dot (`group.id` becomes the registered property name `"group.id"`,
        # quotes included — true whether or not the YAML key itself is quoted), so
        # KafkaConnectorIncomingConfiguration's plain config.getOptionalValue("group.id", ...) never
        # finds it. group.id then falls back to Quarkus's default (quarkus.application.name), which
        # the onboarding-service KafkaUser ACL (kafka-onboarding-mtls.yaml) never granted Read on —
        # every poll would hit org.apache.kafka.common.errors.GroupAuthorizationException. Same
        # pattern/fix as PR #685 (openbank-fraud-service), issue #695.
      kyc-events-in:
        connector: smallrye-kafka
        client.id: onboarding-service-kyc-${quarkus.uuid}
        topic: openbank.kyc.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # group.id / auto.offset.reset: see comment on party-events-in above — same bug, same fix
        # (MP_MESSAGING_INCOMING_KYC_EVENTS_IN_* env vars in onboarding-service.yaml).
      sca-events-in:
        connector: smallrye-kafka
        client.id: onboarding-service-sca-${quarkus.uuid}
        topic: openbank.sca.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # group.id / auto.offset.reset: see comment on party-events-in above — same bug, same fix
        # (MP_MESSAGING_INCOMING_SCA_EVENTS_IN_* env vars in onboarding-service.yaml).

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false

"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_onboarding_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_onboarding_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    scheduler:
      enabled: false
