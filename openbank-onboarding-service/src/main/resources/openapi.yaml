openapi: 3.1.0
info:
  title: Onboarding Service API
  version: 1.2.0
  description: >-
    Read-model projection of the onboarding funnel (ADR-0068). Aggregates events from
    party-service, kyc-service and sca-service into a denormalised view for operator
    dashboards and the four-eyes approval queue.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8130
    description: Local development
tags:
  - name: Onboarding
  - name: Business onboarding

security:
  - bearerAuth: []

paths:
  /api/v1/onboarding/records:
    get:
      tags: [Onboarding]
      summary: List onboarding records (paginated). Optional ?stage= filter for funnel columns.
      operationId: listOnboardingRecords
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: stage
          in: query
          description: Filter by funnel stage. When omitted all records are returned.
          schema:
            type: string
            enum:
              - REGISTERED
              - KYC_OPEN
              - KYC_DOCUMENTS_REQUIRED
              - KYC_UNDER_REVIEW
              - SCA_PENDING
              - ACTIVE
              - BLOCKED
      responses:
        '200':
          description: Paginated list of onboarding records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/onboarding/records/{partyId}:
    get:
      tags: [Onboarding]
      summary: Get onboarding record for a single party
      operationId: getOnboardingRecord
      security:
        - bearerAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Onboarding record detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRecordDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/onboarding/funnel:
    get:
      tags: [Onboarding]
      summary: KPI tile counts — number of records per funnel stage
      operationId: getFunnelCounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Map of FunnelStage → count
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
                example:
                  REGISTERED: 12
                  KYC_OPEN: 45
                  KYC_DOCUMENTS_REQUIRED: 8
                  KYC_UNDER_REVIEW: 23
                  SCA_PENDING: 6
                  ACTIVE: 301
                  BLOCKED: 4

  /api/v1/onboarding/business/cases:
    get:
      tags: [Business onboarding]
      summary: Business onboarding cases, newest activity first
      operationId: listBusinessCases
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: stage
          in: query
          required: false
          description: >-
            Funnel stage filter. Blank or absent means no filter; a value that is not a stage is
            rejected with 400 rather than silently widening the result set.
          schema:
            type: string
            enum: [STARTED, AWAITING_INITIATOR, AWAITING_SIGNATURES, AWAITING_CHECKS, ACTIVE, NEEDS_REVIEW, CLOSED]
      responses:
        '200':
          description: A page of business onboarding cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusinessOnboardingCase' }
        '400':
          description: Unparseable stage filter
  /api/v1/onboarding/business/cases/{caseId}:
    get:
      tags: [Business onboarding]
      summary: One business onboarding case
      operationId: getBusinessCase
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessOnboardingCase' }
        '404':
          description: No such case
  /api/v1/onboarding/business/funnel:
    get:
      tags: [Business onboarding]
      summary: KPI tile counts — business cases per funnel stage
      operationId: getBusinessFunnelCounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Total plus a count for every stage, zeroes included
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, format: int64 }
                  stages:
                    type: object
                    additionalProperties: { type: integer, format: int64 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    BusinessOnboardingCase:
      type: object
      description: >-
        Projection of one kyb-service case (ADR-0284 D6). caseStatus is the status kyb-service
        published; stage is the cockpit board column derived from it.
      properties:
        caseId: { type: string, format: uuid }
        identifierScheme: { type: string, example: ICO }
        identifier: { type: string, example: "27074358" }
        country: { type: string, nullable: true, example: CZ }
        legalName: { type: string, nullable: true }
        legalFormClass: { type: string, nullable: true, example: LIMITED_COMPANY }
        initiatorPartyId: { type: string, format: uuid }
        entityPartyId: { type: string, format: uuid, nullable: true }
        caseStatus: { type: string, example: AWAITING_COSIGNERS }
        stage:
          type: string
          enum: [STARTED, AWAITING_INITIATOR, AWAITING_SIGNATURES, AWAITING_CHECKS, ACTIVE, NEEDS_REVIEW, CLOSED]
        requiredSignatures: { type: integer, nullable: true }
        signedCount: { type: integer }
        reviewReason:
          type: string
          nullable: true
          description: Carried verbatim from kyb-service; never paraphrased for display.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [caseId, identifierScheme, identifier, initiatorPartyId, caseStatus, stage, signedCount, createdAt, updatedAt]
    OnboardingRecordDto:
      type: object
      properties:
        partyId:
          type: string
          format: uuid
        legalName:
          type: string
        email:
          type: string
        partyStatus:
          type: string
          enum: [PENDING_KYC, ACTIVE, SUSPENDED, CLOSED]
        kycCaseId:
          type: string
          format: uuid
          nullable: true
        kycStatus:
          type: string
          nullable: true
          enum: [OPEN, DOCUMENTS_REQUIRED, UNDER_REVIEW, APPROVED, REJECTED, EXPIRED]
        scaEnrolled:
          type: boolean
        deviceCount:
          type: integer
        funnelStage:
          type: string
          enum: [REGISTERED, KYC_OPEN, KYC_DOCUMENTS_REQUIRED, KYC_UNDER_REVIEW, SCA_PENDING, ACTIVE, BLOCKED]
        blockedReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OnboardingRecordPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingRecordDto'
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
        stageFilter:
          type: string
          nullable: true

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
