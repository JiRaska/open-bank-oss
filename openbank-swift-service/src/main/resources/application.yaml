quarkus:
  application:
    name: openbank-swift-service
  http:
    port: 8122
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_swift
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_swift
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token (ADR-0104 D4): the rest-clients (clearing-simulator) mint
  # an openbank-services M2M token via this oidc-client. Without it the default client is "not
  # initialized" → no Authorization header → downstream 401. Reuses the resource-server's
  # keycloak URL, client id and secret. Disabled under %test; the IT enables + stubs it.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    clearing-simulator:
      url: ${CLEARING_SIMULATOR_URL:http://localhost:8139}
      scope: jakarta.inject.Singleton
    # ADR-0108: books settled MT103 funds after scheme ACSC confirmation.
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
      scope: jakarta.inject.Singleton
  redis:
    hosts: redis://localhost:6379
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-swift-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    http:
      test-port: 0
    # Kafka Dev Services starts a Redpanda Testcontainer whenever the messaging-kafka extension is
    # present and no bootstrap server is configured — even though SwiftBootSmokeIT swaps the lone
    # `swift-events-out` channel to the in-memory connector and needs NO broker. Disabling it is a
    # BUILD-TIME decision, so it must live here (the `quarkus.devservices.enabled=false` that
    # PostgresRedisTestResource injects at runtime is too late and is ignored). Without this the
    # unnecessary Redpanda container is pulled at test time; on CI runners where the ECR pre-warm
    # didn't seed that image it egresses via the (blocked) NAT and the boot hangs to the 45-min job
    # timeout, cancelling the whole fleet Services CI run. (#2404)
    kafka:
      devservices:
        enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    # health/metrics on the main HTTP port under test — RestAssured targets a single port,
    # so the management interface (default :8085) must be folded back in (else /q/health/* 404s).
    management:
      enabled: false
openbank:
  swift:
    scheme-submission:
      # ADR-0104 D4 SWIFT pilot. OFF by default; when off, behaviour is exactly as before.
      enabled: ${SWIFT_SCHEME_SUBMISSION_ENABLED:false}
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  resilience:
    circuit-breaker:
      enabled: true
      request-volume-threshold: 10
      failure-ratio: 0.4
      success-threshold: 3
      delay-ms: 15000
    retry:
      enabled: true
      max-retries: 2
      delay-ms: 1000
      jitter-ms: 500
    timeout:
      enabled: true
      value-ms: 60000
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137). These connector-wide Kafka client props
    # apply to every smallrye-kafka channel. Defaults keep local dev/test on
    # PLAINTEXT (empty keystore paths are ignored when protocol=PLAINTEXT);
    # the payments Rollout sets the KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      swift-events-out:
        connector: smallrye-kafka
        client.id: swift-service-${quarkus.uuid}
        topic: openbank.payments.swift.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
