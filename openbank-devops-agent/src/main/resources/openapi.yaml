# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.0.3
info:
  title: OpenBank DevOps Agent API
  version: 1.3.0
  description: Internal operational analysis and read-only delivery evidence. Finding
    decisions and analysis triggers require ROLE_ADMIN. Delivery evidence and findings
    may be read by ROLE_ADMIN or ROLE_VIEWER.
security:
- bearerAuth: []
paths:
  /api/v1/devops/analysis/trigger:
    post:
      operationId: analysis_trigger
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevOpsRunReport'
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
  /api/v1/devops/findings:
    get:
      operationId: findings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevOpsFinding'
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
  /api/v1/devops/findings/{id}:
    get:
      operationId: findings_finding
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevOpsFinding'
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
        '404':
          description: Finding not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/devops/findings/{id}/approve:
    post:
      operationId: findings_finding_approve
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevOpsFinding'
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
        '404':
          description: Finding not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/devops/findings/{id}/reject:
    post:
      operationId: findings_finding_reject
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevOpsFinding'
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
        '404':
          description: Finding not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/devops/delivery/overview:
    get:
      operationId: getDeliveryOverview
      description: Read-only SHADOW observation. Workflow cohorts are selected by
        creation time in the last 24 hours. CD automation success is not verified
        deployment. Partial or unavailable PR data never yields an exact throughput
        rate. Cached observations retain their original observation time for at most
        five minutes.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOverview'
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
  /api/v1/devops/delivery/history:
    get:
      operationId: getDeliveryHistory
      description: Bounded immutable shadow samples. Rolling 24-hour PR rates overlap;
        do not sum them. Reading does not collect or mutate evidence.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 288
          default: 288
      responses:
        '200':
          description: Persisted history, including explicit sampling status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryHistory'
        '400':
          description: Invalid limit
        '401':
          description: Authentication required
        '403':
          description: Read or admin role required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DevOpsFinding:
      type: object
      additionalProperties: true
    DevOpsRunReport:
      type: object
      additionalProperties: true
      properties:
        ciGateProfile:
          $ref: '#/components/schemas/CiGateProfileEvidence'
    CiGateProfileEvidence:
      type: object
      nullable: true
      description: A bounded read of one verified CI artifact. Partial coverage is never a pipeline-wide ranking or a saving estimate.
      required: [repository, observedAt, state, gates]
      properties:
        repository:
          type: string
        observedAt:
          type: string
          format: date-time
          description: Time this bounded collection was observed; artifactCreatedAt records producer time.
        state:
          type: string
          enum: [COMPLETE, PARTIAL, UNAVAILABLE]
        reason:
          type: string
          nullable: true
        provenance:
          $ref: '#/components/schemas/CiGateProfileProvenance'
        gates:
          type: array
          items:
            $ref: '#/components/schemas/CiGateObservation'
    CiGateProfileProvenance:
      type: object
      nullable: true
      required: [sourceSha, runId, runAttempt, artifactId, artifactName, artifactDigest, artifactCreatedAt]
      properties:
        sourceSha:
          type: string
        runId:
          type: integer
          format: int64
        runAttempt:
          type: integer
        artifactId:
          type: integer
          format: int64
        artifactName:
          type: string
        artifactDigest:
          type: string
        artifactCreatedAt:
          type: string
          format: date-time
    CiGateObservation:
      type: object
      description: Producer costs include setup and self-tests. CPU accounting may exclude detached descendants. No cost is inferred for absent evidence.
      required: [id, mode, status, wallSeconds, cpuSeconds, selftestSeconds, selftestDeclared, selftestSkipped, wallOverBudget]
      properties:
        id:
          type: string
        group:
          type: string
          nullable: true
        mode:
          type: string
          enum: [enforced, advisory]
        status:
          type: string
          enum: [ok, failed, warned, skipped, unfalsified]
        failureKind:
          type: string
          nullable: true
        wallSeconds:
          type: number
          minimum: 0
        cpuSeconds:
          type: number
          minimum: 0
        budgetSeconds:
          type: number
          nullable: true
        selftestSeconds:
          type: number
          minimum: 0
        selftestDeclared:
          type: boolean
        selftestPassed:
          type: boolean
          nullable: true
        selftestSkipped:
          type: boolean
        subjects:
          type: integer
          nullable: true
        minSubjects:
          type: integer
          nullable: true
        wallOverBudget:
          type: boolean
    DeliveryWorkflowSummary:
      type: object
      required:
      - family
      properties:
        family:
          type: string
          enum:
          - CI
          - CD_AUTOMATION
          - OTHER
        observedRuns:
          type: integer
          nullable: true
          minimum: 0
        completed:
          type: integer
          nullable: true
          minimum: 0
        successful:
          type: integer
          nullable: true
          minimum: 0
        unsuccessful:
          type: integer
          nullable: true
          minimum: 0
        cancelled:
          type: integer
          nullable: true
          minimum: 0
        waiting:
          type: integer
          nullable: true
          minimum: 0
        running:
          type: integer
          nullable: true
          minimum: 0
        runsWithReruns:
          type: integer
          nullable: true
          minimum: 0
        startDelaySamples:
          type: integer
          nullable: true
          minimum: 0
        startDelayP50Seconds:
          type: integer
          nullable: true
          minimum: 0
        startDelayP95Seconds:
          type: integer
          nullable: true
          minimum: 0
    DeliveryOverview:
      type: object
      required:
      - mode
      - observedAt
      - windowStart
      - windowEnd
      - repository
      - workflowEvidence
      - pullRequestEvidence
      - deploymentVerification
      - workflows
      properties:
        observedAt:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        repository:
          type: string
        workflowEvidence:
          type: string
          enum:
          - COMPLETE
          - PARTIAL
          - UNAVAILABLE
        workflowReason:
          type: string
          nullable: true
        workflowPagesRead:
          type: integer
          minimum: 0
          maximum: 5
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryWorkflowSummary'
        pullRequestEvidence:
          type: string
          enum:
          - COMPLETE
          - PARTIAL
          - UNAVAILABLE
        pullRequestReason:
          type: string
          nullable: true
        pullRequestPagesRead:
          type: integer
          minimum: 0
          maximum: 5
        observedMergedPrs:
          type: integer
          nullable: true
          minimum: 0
        mergedPrsPerDay:
          type: integer
          nullable: true
          minimum: 0
        mode:
          type: string
          enum:
          - SHADOW
        deploymentVerification:
          type: string
          enum:
          - NOT_COLLECTED
        verifiedDeploymentsPerDay:
          type: integer
          nullable: true
          minimum: 0
    DeliveryObservation:
      type: object
      required:
      - slotStart
      - recordedAt
      - collectorVersion
      - schemaVersion
      - overview
      properties:
        slotStart:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        collectorVersion:
          type: string
        schemaVersion:
          type: integer
          enum:
          - 1
        overview:
          $ref: '#/components/schemas/DeliveryOverview'
    DeliveryHistory:
      type: object
      required:
      - samplingEnabled
      - slotIntervalSeconds
      - retentionDays
      - observations
      - samplingCron
      properties:
        samplingEnabled:
          type: boolean
        retentionDays:
          type: integer
          enum:
          - 30
        observations:
          type: array
          maxItems: 288
          items:
            $ref: '#/components/schemas/DeliveryObservation'
        slotIntervalSeconds:
          type: integer
          enum:
          - 300
        samplingCron:
          type: string
          description: Effective configured collection cron; slot interval is independent.
