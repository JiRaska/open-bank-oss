# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: open-banking
primaryDatastore: PostgreSQL
databaseName: openbank_psd2
dataLineageRole: consumer
dataClassification: confidential
retentionPolicy: 5 years
evidenceExported: true
lineage:
  downstream:
    - serviceName: consent-service
      relationType: api
      description: checks
    - serviceName: sca-service
      relationType: api
      description: triggers
    - serviceName: tpp-registry-service
      relationType: api
      description: validates
databaseLineage:
  dependentDatabases:
    - openbank_consents
    - openbank_sca
    - openbank_tpp_registry
