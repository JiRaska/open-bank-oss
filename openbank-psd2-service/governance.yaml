# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: open-banking
primaryDatastore: PostgreSQL
databaseName: openbank_psd2
dataLineageRole: consumer
dataClassification: confidential
retentionPolicy: 5 years
evidenceExported: true
lineage:
  downstream:
    - serviceName: consent-service
      relationType: api
      description: checks
    # Removed (issue #3982): `sca-service (api, "triggers")`. psd2-service's only REST client is
    # ConsentServiceRestClient, and its Deployment env reaches consent-service and
    # tpp-registry-service only — never sca-service. SCA is reached INDIRECTLY: psd2 returns an
    # `scaRedirect` link and consent-service holds the ScaChallengeClient. The mirror of this
    # same edge was declared a second time on sca-service's `upstream` under a different
    # `openbank-` spelling, and both halves counted as separate findings until the audit learned
    # to canonicalize edge keys.
    - serviceName: tpp-registry-service
      relationType: api
      description: validates
databaseLineage:
  dependentDatabases:
    - openbank_consents
    - openbank_sca
    - openbank_tpp_registry
