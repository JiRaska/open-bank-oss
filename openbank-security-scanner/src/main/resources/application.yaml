quarkus:
  application:
    name: openbank-security-scanner
    version: 0.1.1
  http:
    port: 8120
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false

mp:
  messaging:
    outgoing:
      security-events-out:
        connector: smallrye-kafka
        bootstrap.servers: kafka:9092
        client.id: security-scanner-${quarkus.uuid}
        topic: openbank.security.scan.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
      ict-incident-events-out:
        connector: smallrye-kafka
        bootstrap.servers: kafka:9092
        client.id: security-scanner-ict-${quarkus.uuid}
        topic: openbank.security.ict.incident
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

openbank:
  outbox:
    poll-interval: 5s
    initial-delay: 5s
  security-scanner:
    scan-interval-minutes: 30
    # URLs use full Kubernetes in-cluster DNS (<name>.<namespace>.svc:<port>)
    # so the scanner can reach services across namespaces without host-network
    # access or a proxy. Health probes hit /q/health/ready (management port 8085)
    # which is auth-free — no credentials needed, no OIDC token in flight.
    services:
      - name: account-service
        url: http://account-service.accounts.svc:8100
        port: 8100
      - name: ledger-service
        url: http://ledger-service.ledger.svc:8101
        port: 8101
