        port: 8102
      - name: balance-service
        url: http://balance-service.balances.svc:8103
        port: 8103
      - name: product-catalog
        url: http://product-catalog.accounts.svc:8104
        port: 8104
      - name: pid-service
        url: http://pid-service.pid.svc:8105
        port: 8105
      - name: consent-service
        url: http://consent-service.consent.svc:8106
        port: 8106
