quarkus:
  application:
    name: openbank-security-scanner
  http:
    port: 8120
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false
  # quarkus-flyway was a build dependency and `db/migration/` held V2/V3, but nothing ever
  # told Flyway to run: `migrate-at-start` defaults to false, and no deployment env set it
  # either. So the deployed database had ZERO tables and no flyway_schema_history at all,
  # and every write hit `ERROR: relation "security_outbox" does not exist (42P01)` -> a 500
  # out of /api/v1/security/report. Nothing was red about it: the pod is Ready (the health
  # probes do not touch the schema), the migrations look present in the repo, and the
  # console blamed the caller with "scanner HTTP 401" from a *separate* auth defect that
  # masked this one. The datasource itself comes from QUARKUS_DATASOURCE_* env in the
  # deployment; only the migrate switch was missing. Mirrors sanctions/fraud.
  #
  # The datasource is declared here with literal local defaults, not left to the deployment env.
  # Flyway migrates the DEFAULT (Agroal/JDBC) datasource, and a service that only boots because
  # gitops happens to export QUARKUS_DATASOURCE_JDBC_URL cannot be started from this repo alone
  # — the failure mode #3080 catalogued across five money-path services, and what
  # check-flyway-default-datasource.py enforces. The reactive URL is the one the Panache entities
  # use; both are overridden by QUARKUS_DATASOURCE_* in every deployed environment.
  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_security
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_security
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  # quarkus-oidc was already a build dependency but never configured — every REST endpoint
  # was reachable with no authentication at all (issue found alongside the AmlCaseResource /
  # StandingOrderResource / TppRegistryResource unauthenticated-endpoint sweep).
  oidc:
    # LOCAL DEFAULT ONLY — and this service is the reason the warning is worth writing down.
    # Its deployment carried `QUARKUS_OIDC_ENABLED=false` and no issuer URL, which reads as
    # "auth is off here" and is not: quarkus.oidc.enabled is a BUILD-TIME property, so an env
    # var cannot switch OIDC off in a built image. The pod therefore validated every bearer
    # against this localhost default, inside its own pod, where nothing listens. Anonymous
    # requests answered 200/401 normally; every request WITH a token answered 500, which is
    # what the admin-ui Security screen hit. Fixed by setting QUARKUS_OIDC_AUTH_SERVER_URL in
    # the gitops manifest (#3443, #3433) — an env var outranks this value in SmallRye Config.
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false

"%test":
  quarkus:
    oidc:
      enabled: false

mp:
  messaging:
    outgoing:
      security-events-out:
        connector: smallrye-kafka
        bootstrap.servers: kafka:9092
        client.id: security-scanner-${quarkus.uuid}
        topic: openbank.security.scan.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
      ict-incident-events-out:
        connector: smallrye-kafka
        bootstrap.servers: kafka:9092
        client.id: security-scanner-ict-${quarkus.uuid}
        topic: openbank.security.ict.incident
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

openbank:
  outbox:
    poll-interval: 5s
    initial-delay: 5s
  security-scanner:
    scan-interval-minutes: 30
    # URLs use full Kubernetes in-cluster DNS (<name>.<namespace>.svc:<port>)
    # so the scanner can reach services across namespaces without host-network
    # access or a proxy. Health probes hit /q/health/ready (management port 8085)
    # which is auth-free — no credentials needed, no OIDC token in flight.
    services:
      - name: account-service
        url: http://account-service.accounts.svc:8100
        port: 8100
      - name: ledger-service
        url: http://ledger-service.ledger.svc:8101
        port: 8101
      - name: transaction-service
        url: http://transaction-service.payments.svc:8102
        port: 8102
      - name: balance-service
        url: http://balance-service.balances.svc:8103
        port: 8103
      - name: product-catalog
        url: http://product-catalog.accounts.svc:8104
        port: 8104
      - name: pid-service
        url: http://pid-service.pid.svc:8105
        port: 8105
      - name: consent-service
        url: http://consent-service.consent.svc:8106
        port: 8106
      - name: psd2-service
        url: http://psd2-service.psd2.svc:8107
        port: 8107
      - name: tpp-registry-service
        url: http://tpp-registry-service.tpp-registry.svc:8108
        port: 8108
      - name: agent-service
        url: http://agent-service.platform.svc:8109
        port: 8109
      - name: sca-service
        url: http://sca-service.sca.svc:8110
        port: 8110
      - name: party-service
