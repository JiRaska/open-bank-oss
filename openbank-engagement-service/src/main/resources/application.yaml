quarkus:
  application:
    name: openbank-engagement-service
  http:
    port: 8153
    test-port: 0
  datasource:
    db-kind: postgresql
    reactive:
      url: postgresql://localhost:5432/openbank_engagement
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_engagement
    username: ${DB_USER:engagement}
    password: ${DB_PASSWORD:engagement}
  flyway:
    migrate-at-start: true
  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
  # Outbound M2M token for the consent-service check (ContactPolicyGate's consent port).
  # Its inbound block two lines up reads KEYCLOAK_URL, which is what the workload sets; this
  # one read QUARKUS_OIDC_AUTH_SERVER_URL, which it does not — so the outbound URL silently
  # fell back to localhost, i.e. this pod, and the consent check went out unauthenticated.
  oidc-client:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    consent-service:
      url: ${CONSENT_SERVICE_URL:http://localhost:8106}
      scope: jakarta.inject.Singleton
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  log:
    level: INFO

openbank:
  engagement:
    marketing-grantee: party-service:marketing-comms
    impression-budget-per-window: 1
  # Every service with an outbox entity must flip this explicitly — it defaults to false, and a
  # service that forgets ships an outbox that fills forever with no error anywhere.
  outbox:
    dispatch-enabled: true

mp:
  messaging:
    outgoing:
      engagement-outbox-out:
        connector: smallrye-kafka
        client.id: engagement-service-${quarkus.uuid}
        topic: openbank.engagement.events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      campaign-banner-placements-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.engagement.campaign-banner-placements-in
        connector: smallrye-kafka
        topic: openbank.campaign.banner.placements
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # group.id / auto.offset.reset for the channels below are set via the
      # engagement-service-msg-override ConfigMap (override.properties), NOT here — a dotted leaf
      # map key under mp.messaging.incoming.<channel> in YAML never resolves to the plain
      # MicroProfile Config property name SmallRye reads (issue #686, ADR-0137 pattern).
      lending-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.engagement.lending-events-in
        connector: smallrye-kafka
        topic: openbank.lending.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      party-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.engagement.party-events-in
        connector: smallrye-kafka
        topic: openbank.party.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      fraud-hold-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.engagement.fraud-hold-events-in
        connector: smallrye-kafka
        topic: openbank.fraud.hold.changed
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      dispute-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.engagement.dispute-events-in
        connector: smallrye-kafka
        topic: openbank.dispute.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer

"%test":
  # `authz.enforce` carries defaultValue = "true" in AuthorizeInterceptor, and a test JVM has no
  # PolicyDecisionPoint bean — so every @Authorize call on SurfaceResource's two endpoints fails
  # closed with 503 before the handler runs, and SurfaceRestContractIT's status assertions fail.
  # Measured in #4128: removing this key alone turns all four of those tests red with 503.
  # Advisory HERE ONLY, same pattern and reasoning as campaign-service: that IT is about the HTTP
  # contract, not about who may call what — the OPA gate and the rego tests own that, and neither
  # needs the app running. The deployed posture is unchanged, decided by the sidecar (#4068).
  authz:
    enforce: false
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
  openbank:
    outbox:
      dispatch-enabled: false
