#
# NOTE ON THE `is`/`has`-PREFIXED FIELD NAMES (isBalanced, isDataGap, hasDataGaps):
# both resources return the DOMAIN objects directly (`Response.ok(template)`), so these key names
# are produced by the Jackson/Kotlin naming interplay rather than by an explicit REST DTO. They were
# measured, not assumed — `TemplateWireFormatTest` asserts the exact key SET this file documents and
# fails if a Jackson/Kotlin upgrade ever changes it. Do not "tidy" `isBalanced` to `balanced` here:
# that would make the published contract disagree with the bytes on the wire.
openapi: 3.0.3
info:
  title: OpenBank FINREP / COREP Service
  description: >-
    Supervisory financial and prudential reporting (ADR-0097): renders EBA FINREP templates
    (F01.01 Assets, F01.02 Liabilities, F01.03 Equity, F02.00 Profit & Loss) and the COREP C 01.00
    Own Funds template from
    openbank-ledger-service's GL trial balance. Derive-only and stateless — it holds no datastore,
    moves no money, and has NO ČNB transmission channel. It exposes an EBA XBRL-CSV *preflight*
    only: the preflight evaluates governed mapping and trial-balance controls before a future
    renderer can create a local artifact. It never creates an XBRL file or submits anything.

    FINREP maps every active account in the governed ledger chart to official EBA 4.2 facts and
    fails closed with `UNCLASSIFIED_GL_ACCOUNT` when a new active code has no mapping. Zero-only
    official facts are not emitted by this structured preview. COREP derives its subtotals from
    explicit capital source accounts; missing source data remains a flagged zero (`isDataGap`).
  version: 1.16.0
tags:
  - name: FINREP
  - name: COREP
  - name: Submissions
paths:
  /api/v1/finrep/templates/{templateId}/xbrl-csv/preflight:
    get:
      tags: [FINREP]
      summary: Check whether a FINREP preview is eligible for future XBRL-CSV rendering
      description: >-
        Returns an explicit, local readiness result; it does not produce an XBRL-CSV archive,
        validate an XBRL instance, or contact ČNB. Missing official mappings and a trial-balance
        disagreement are blockers. A `READY_FOR_RENDERING` result is not a validated regulatory
        artifact and does not imply a submission is possible.
      operationId: getFinrepXbrlCsvPreflight
      parameters:
        - name: templateId
          in: path
          required: true
          description: EBA FINREP template identifier
          schema: { type: string, enum: [F01.01, F01.02, F01.03, F02.00] }
        - name: asOf
          in: query
          required: false
          description: Reporting reference date, ISO yyyy-MM-dd. Defaults to today when omitted.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Local rendering preflight; a blocked result is a successful safety check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XbrlCsvPreflight' }
        '400':
          description: Unknown templateId or an invalid reporting date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/periods:
    get:
      tags: [FINREP]
      summary: List reporting dates backed by immutable ledger evidence
      description: >-
        Returns only MONTH closes whose status is FROZEN and evidence state is LINES_V1. DRAFT,
        legacy HASH_ONLY, quarter/year and missing closes are excluded; clients must not guess a
        reporting date or fall back to a mutable trial balance.
      operationId: listFinrepReportingPeriods
      responses:
        '200':
          description: Available dates, newest first; latest is null when none are available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportingPeriods' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/templates/{templateId}:
    get:
      tags: [FINREP]
      summary: Render a FINREP template as of a reporting date
      description: >-
        Derives the template from the ledger GL trial balance as of `asOf`. Supported
        `templateId` values are `F01.01` (Assets), `F01.02` (Liabilities), `F01.03` (Equity) and
        `F02.00` (Profit & Loss); any other value is rejected. Every active account in the governed
        chart has an explicit mapping; an unclassified active code produces a visible data gap.
        `FROZEN` (the default) requires immutable FROZEN / LINES_V1 evidence. `LIVE_PREVIEW`
        explicitly reads the mutable period aggregate for internal review only; callers must label
        it provisional and must not export or submit it as a regulatory artefact.
      operationId: getFinrepTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          description: EBA FINREP template identifier
          schema: { type: string, enum: [F01.01, F01.02, F01.03, F02.00] }
        - name: asOf
          in: query
          required: false
          description: Reporting reference date, ISO yyyy-MM-dd. Defaults to today when omitted.
          schema: { type: string, format: date }
        - name: evidence
          in: query
          required: false
          description: Evidence source. LIVE_PREVIEW is mutable and for internal review only.
          schema: { type: string, enum: [FROZEN, LIVE_PREVIEW], default: FROZEN }
      responses:
        '200':
          description: The rendered FINREP template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinrepTemplate' }
        '400':
          description: >-
            Unknown templateId. The use case rejects it with an IllegalArgumentException, which the
            shared CommonExceptionMappers renders as this envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks one of the SERVICE / ADMIN / OPERATOR roles

  /api/v1/corep/templates/{templateId}:
    get:
      tags: [COREP]
      summary: Render a COREP template as of a reporting date
      description: >-
        `C_01.00` (Own Funds) is derived from the ledger GL trial balance as of `asOf`. `C_02.00`
        (Own Funds Requirements, EBA framework 4.0 CA2 layout, column c0010) is read from the risk
        engine's Pillar 1 standardised-approach result for the most recent TIED_OUT snapshot at
        exactly `asOf` (ADR-0313 D6); `evidence` does not apply to it. Row r0010 (TREA), the classes
        the engine does not model and market/operational/CVA risk are always `isDataGap: true`, and
        every credit-risk row is a gap with its reason when no tied snapshot exists or the read is
        not enabled. The four LCR previews use the EBA Reporting Framework 4.2 total-currency
        (`.a`) table coordinates and the same TIED_OUT
        risk-engine snapshot. `evidence` does not apply. They cover a subset of the tables for
        internal use. Each cell is a data gap with its reason when the snapshot is unavailable,
        the read is disabled, balances are unclassified, or the engine cannot state a combined
        CZK total (including a missing FX fixing for a multi-currency book). Unsupported
        breakdowns are absent or marked `isDataGap: true` where explicitly represented.

        `C_72.00` (liquid assets) gives market value in c0010 and Article 9 value before the
        Level 2 caps in c0040. Level 2 total is r0220, Level 2A r0230 and Level 2B r0310. Coins
        and banknotes (r0040) and withdrawable central bank reserves (r0050) are gaps because
        the engine does not split them.

        `C_73.00` (outflows) gives amount in c0010 and weighted outflow in c0060 for the engine
        total (r0010) and central-bank secured funding (r0930). Deposit rows (r0030, r0050, r0080,
        r0110, r0120 and r0210) and other liabilities and due commitments (r0885) are classification
        gaps. The weighted figure is a gap if the applicable engine factor or parameter set differs
        from the EU 2015/61 assumption.

        `C_74.00` (inflows) gives amount in c0010 and weighted inflows before the reduction in
        c0140 for the 75% cap bucket. It includes the engine total (r0010), operational financial
        claims (r0110) and non-operational financial claims (r0160). Non-financial claims
        (r0030), central-bank claims (r0150) and secured-lending inflows (r0263) are classification
        gaps. Both columns require the engine's EU 75% cap, and the weighted column requires the
        expected factors. The render checks that the capped value equals min(uncapped, cap).

        `C_76.00` (calculations, c0010) gives the post-cap liquidity buffer (r0010), net outflows
        (r0020), the ratio in percent (r0030, unit `%`, 2 dp), total outflows (r0300), weighted
        inflows subject to the 75% cap (r0330) and their reduction (r0360). Fully exempt and
        90%-cap amounts and reductions are data gaps. The 75%-cap amounts require a reported
        cap. A missing post-cap buffer or non-positive net outflows gaps the respective buffer
        or ratio. The render checks the ties across the engine's buffer, net outflows, ratio
        and capped inflows. Any other template id is rejected.

        The mapper derives CET1, Tier 1 and own funds from explicit ledger accounts 6000-6060; it
        never plugs capital as assets minus liabilities. With no recognised capital source every
        row is an explicit zero with `isDataGap: true`; absent optional categories in an otherwise
        recognised capital structure are genuine zeroes. `FROZEN` (the default)
        requires immutable evidence; `LIVE_PREVIEW` is a mutable internal working view that must
        never be exported or submitted as a regulatory artefact.
      operationId: getCorepTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          description: EBA COREP template identifier
          schema: { type: string, enum: [C_01.00, C_02.00, C_72.00, C_73.00, C_74.00, C_76.00] }
        - name: asOf
          in: query
          required: false
          description: Reporting reference date, ISO yyyy-MM-dd. Defaults to today when omitted.
          schema: { type: string, format: date }
        - name: evidence
          in: query
          required: false
          description: Evidence source. LIVE_PREVIEW is mutable and for internal review only.
          schema: { type: string, enum: [FROZEN, LIVE_PREVIEW], default: FROZEN }
      responses:
        '200':
          description: The rendered COREP template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorepTemplate' }
        '400':
          description: >-
            Unknown or unimplemented templateId. The use case rejects it with an
            IllegalArgumentException, which the shared CommonExceptionMappers renders as this
            envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks one of the SERVICE / ADMIN / OPERATOR roles

  /api/v1/finrep/submissions:
    post:
      tags: [Submissions]
      summary: Open (or return) the submission for a return revision
      description: >-
        Idempotent per (templateId, referencePeriod, revision): the first call creates a DRAFT and
        answers 201, a repeat answers 200 with the same submission.
      operationId: openFinrepSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenSubmissionRequest' }
      responses:
        '201':
          description: Submission created in DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '200':
          description: Submission already existed for this revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '400':
          description: Missing or invalid field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR
    get:
      tags: [Submissions]
      summary: List submissions, newest reference period first
      operationId: listFinrepSubmissions
      parameters:
        - name: templateId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupervisorySubmission' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/submissions/{id}:
    get:
      tags: [Submissions]
      summary: Read one submission
      operationId: getFinrepSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '404':
          description: Unknown submission id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/submissions/{id}/package:
    post:
      tags: [Submissions]
      summary: Package a DRAFT return once the XBRL-CSV preflight is READY_FOR_RENDERING
      description: >-
        Records a package MANIFEST (identity plus framework/taxonomy versions, SHA-256 hashed). No
        XBRL-CSV archive is rendered. Idempotent: an already-packaged submission is returned as is.
      operationId: packageFinrepSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submission in PACKAGED (or later) state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '409':
          description: Preflight BLOCKED; the blocker codes are in the message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Unknown submission id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/submissions/{id}/submit:
    post:
      tags: [Submissions]
      summary: Hand a PACKAGED return to the configured supervisory transport
      description: >-
        Every call records an attempt. The default transport is a dry run: it transmits nothing,
        records outcome DRY_RUN and leaves the submission PACKAGED. Only a SUBMITTED transport
        outcome moves it to SUBMITTED. A return already SUBMITTED, ACKNOWLEDGED or REJECTED is
        returned unchanged without another transport call.
      operationId: submitFinrepSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submission after the attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '409':
          description: >-
            Submission is still DRAFT, or another request holds the transmission claim
            (SUBMISSION_IN_PROGRESS), or its outcome is unknown and an ADMIN must reconcile it
            (OUTCOME_UNKNOWN). The claim is a conditional PACKAGED -> SUBMITTING update, so
            concurrent submits never call the transport twice. A transport error or a cancelled
            request records UNKNOWN and moves the return to OUTCOME_UNKNOWN, never back to PACKAGED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Unknown submission id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/submissions/{id}/acknowledgement:
    post:
      tags: [Submissions]
      summary: Record the supervisor's acknowledgement of a SUBMITTED return
      operationId: acknowledgeFinrepSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgementRequest' }
      responses:
        '200':
          description: Submission now ACKNOWLEDGED (accepted) or REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '400':
          description: Missing field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Submission is not SUBMITTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: A concurrent acknowledgement settled the submission first; nothing was recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Unknown submission id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

  /api/v1/finrep/submissions/{id}/reconcile:
    post:
      tags: [Submissions]
      summary: Resolve an OUTCOME_UNKNOWN return after checking with the supervisor (ADMIN only)
      description: >-
        Allowed from OUTCOME_UNKNOWN, or from SUBMITTING once the claim lease has expired (the
        claim is lapsed to OUTCOME_UNKNOWN first). `sent: true` (with the supervisor's reference)
        moves the return to SUBMITTED; `sent: false` releases it to PACKAGED. Recorded as an
        attempt by `operator-reconcile`.
      operationId: reconcileFinrepSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileRequest' }
      responses:
        '200':
          description: Submission after reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorySubmission' }
        '400':
          description: Missing field, or sent=true without a reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Submission is not in a reconcilable state (NOT_RECONCILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Unknown submission id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN

  /api/v1/finrep/submissions/{id}/attempts:
    get:
      tags: [Submissions]
      summary: List transport attempts for a submission
      operationId: listFinrepSubmissionAttempts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Attempts in order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubmissionAttempt' }
        '404':
          description: Unknown submission id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Missing or invalid access token
        '403':
          description: Token lacks ROLE_ADMIN or ROLE_OPERATOR

components:
  schemas:
    OpenSubmissionRequest:
      type: object
      required: [templateId, referencePeriod, revision]
      properties:
        templateId: { type: string }
        referencePeriod: { type: string, format: date }
        revision: { type: integer, minimum: 1 }
    ReconcileRequest:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
        reference: { type: string }
        note: { type: string }
    AcknowledgementRequest:
      type: object
      required: [accepted, reference]
      properties:
        accepted: { type: boolean }
        reference: { type: string }
        message: { type: string }
    SupervisorySubmission:
      type: object
      required: [id, templateId, referencePeriod, revision, state, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string }
        referencePeriod: { type: string, format: date }
        revision: { type: integer }
        state: { type: string, enum: [DRAFT, PACKAGED, SUBMITTING, OUTCOME_UNKNOWN, SUBMITTED, ACKNOWLEDGED, REJECTED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        reportingFrameworkVersion: { type: string, nullable: true }
        taxonomyVersion: { type: string, nullable: true }
        packageHash: { type: string, nullable: true }
        packagedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        transportReference: { type: string, nullable: true }
        acknowledgementAccepted: { type: boolean, nullable: true }
        acknowledgementReference: { type: string, nullable: true }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
    SubmissionAttempt:
      type: object
      required: [attemptNo, transport, outcome, attemptedBy, attemptedAt]
      properties:
        attemptNo: { type: integer }
        transport: { type: string }
        outcome: { type: string, enum: [SUBMITTED, DRY_RUN, REJECTED, FAILED, UNKNOWN] }
        transportReference: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        attemptedBy: { type: string }
        attemptedAt: { type: string, format: date-time }
    XbrlCsvPreflight:
      type: object
      description: >-
        Local safeguard result for a future EBA XBRL-CSV renderer. This is not an XBRL artifact,
        validation result, or regulator submission acknowledgement.
      required: [templateId, period, reportingFrameworkVersion, dpmVersion, taxonomyVersion, state, blockers]
      properties:
        templateId: { type: string, example: F01.01 }
        period: { type: string, format: date }
        reportingFrameworkVersion: { type: string, example: '4.2' }
        dpmVersion: { type: string, example: '4.2.1' }
        taxonomyVersion: { type: string, example: '4.2.0.0' }
        state:
          type: string
          enum: [READY_FOR_RENDERING, BLOCKED]
          description: >-
            READY_FOR_RENDERING only means the implemented safeguards pass. It is not a validated
            XBRL-CSV artifact and must not be submitted to a regulator.
        blockers:
          type: array
          items: { $ref: '#/components/schemas/XbrlCsvBlocker' }
    XbrlCsvBlocker:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
          enum: [INCOMPLETE_OFFICIAL_MAPPING, TRIAL_BALANCE_NOT_AGREED]
        reason: { type: string }

    ReportingPeriods:
      type: object
      required: [periods]
      properties:
        latest:
          type: string
          format: date
          nullable: true
        periods:
          type: array
          items: { type: string, format: date }

    FinrepCell:
      type: object
      description: One FINREP template cell — an (row, column) coordinate with its monetary value.
      required: [rowRef, colRef, value, currency]
      properties:
        rowRef:
          type: string
          description: EBA FINREP row reference
          example: r0380
        colRef:
          type: string
          description: EBA FINREP column reference
          example: c0010
        value: { type: number }
        currency: { type: string, example: CZK }

    FinrepTemplate:
      type: object
      description: >-
        A governed FINREP preview using official EBA Reporting Framework 4.2 coordinates for assets,
        liabilities, equity and profit or loss. Aggregate and material-detail facts are emitted for
        the platform's closed chart; zero-only facts are omitted. It is structured data, not an XBRL
        artifact or regulator submission. Values use their natural reporting sign.
      required: [templateId, period, cells, dataGaps, hasDataGaps, isBalanced, balanceVerdict]
      properties:
        templateId: { type: string, example: F01.01 }
        period:
          type: string
          format: date
          description: The reporting reference date the template was rendered as of
        cells:
          type: array
          items: { $ref: '#/components/schemas/FinrepCell' }
        dataGaps:
          type: array
          description: Machine-readable findings covering the official cells this preview cannot derive.
          items: { $ref: '#/components/schemas/FinrepDataGap' }
        hasDataGaps:
          type: boolean
          description: >-
            Derived from `dataGaps`. A true value makes this bounded preview ineligible for use as
            a complete regulatory artifact.
        isBalanced:
          type: boolean
          description: >-
            Whether the double-entry identity of the trial balance this template was rendered from
            holds: the sum of every GL line's debit-minus-credit net is zero, evaluated per
            currency and required to hold for all of them. An empty trial balance holds trivially
            — that is an under-reporting condition, reported separately, not a balance failure.
            Serialized as `isBalanced`, not `balanced` — see the note at the top of this file.

            Historical note (issue #5987): up to API version 1.0.0 both producers passed a
            hardcoded `true` and F01.01 derived equity as `assets - liabilities`, so the value was
            a constant and no consumer could ever observe `false`. Do not read a `true` served by
            an older deployment as evidence that anything was checked.

            Since API version 1.2.0 (issue #6011) `true` additionally requires that
            openbank-ledger-service's OWN published `balanced` verdict for the same frozen trial
            balance agrees — it is exactly `balanceVerdict == AGREED_BALANCED`. Requiring both is
            what makes a truncated response visible: lines lost in transport whose survivors happen
            to still sum to zero satisfy this service's recomputation on their own.
        balanceVerdict:
          type: string
          enum: [AGREED_BALANCED, AGREED_IMBALANCED, SOURCES_DISAGREE, LEDGER_FLAG_ABSENT]
          description: >-
            Which of the two independent balance verdicts objected (issue #6011). `AGREED_BALANCED`
            and `AGREED_IMBALANCED` are the two sources agreeing; `SOURCES_DISAGREE` means the lines
            this service evaluated are not the lines the ledger evaluated (a truncated, filtered or
            paginated response — an evidence defect, not an accounting one); `LEDGER_FLAG_ABSENT`
            means the ledger response carried no verdict at all, which is a contract change rather
            than a statement about the books, and is kept distinct from a verdict of `false`.

    FinrepDataGap:
      type: object
      required: [code, affectedScope, reason]
      properties:
        code: { type: string, example: UNMAPPED_OFFICIAL_CELLS }
        affectedScope: { type: string, example: "F01.01 except r0380/c0010" }
        reason:
          type: string
          description: Why the affected official cells cannot be derived and why submission is blocked.

    CorepCell:
      type: object
      description: One COREP template cell — an (row, column) coordinate with its monetary value.
      required: [rowRef, colRef, label, value, currency, isDataGap]
      properties:
        rowRef:
          type: string
          description: EBA COREP row reference
          example: r010
        colRef:
          type: string
          description: EBA COREP column reference
          example: c010
        label: { type: string, example: OWN FUNDS }
        value: { type: number }
        currency: { type: string, example: CZK }
        isDataGap:
          type: boolean
          description: >-
            True when the value could NOT be honestly derived from data available in the platform
            today and is reported as an explicit flagged zero. MUST NOT be read as an attested
            zero balance.
        gapReason:
          type: string
          nullable: true
          description: Why the cell is a gap. Present only when `isDataGap` is true.

    CorepTemplate:
      type: object
      description: >-
        One rendered COREP template. A structured representation of the template's cells — NOT an
        EBA XBRL/DPM taxonomy rendering. Always fully rendered: every row is present even when its
        value is a flagged gap.
      required: [templateId, period, cells, hasDataGaps]
      properties:
        templateId: { type: string, example: C_01.00 }
        period:
          type: string
          format: date
          description: The reporting reference date the template was rendered as of
        cells:
          type: array
          items: { $ref: '#/components/schemas/CorepCell' }
        hasDataGaps:
          type: boolean
          description: >-
            Derived — true when at least one cell has `isDataGap`. A template with data gaps is
            still fully rendered, never silently truncated.
        sourceRunId:
          type: string
          nullable: true
          description: >-
            The risk-engine snapshot run the figures were read from (C_02.00, C_72.00-C_76.00);
            null for a template not built from a run, or when no run was found.
        provenance:
          type: string
          nullable: true
          description: >-
            That run's provenance, `synthetic` or `production` (ADR-0313 D13). `synthetic` means
            the figures come from a synthetic book and must be presented as such; null when
            `sourceRunId` is.

    ApiError:
      type: object
      description: >-
        Shared error envelope served by openbank-libs-runtime's CommonExceptionMappers
        (`com.openbank.libs.api.error.ApiError`). Null fields are omitted.
      required: [traceId, status, code, message]
      properties:
        traceId: { type: string }
        status: { type: integer }
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
              rejectedValue: {}
