quarkus:
  application:
    name: openbank-finrep-service
  http:
    port: 8140
    cors:
      ~: true
      origins: "http://localhost:3000,http://openbank-admin-ui:3000"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization

  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: ${QUARKUS_OIDC_CLIENT_ID:openbank-services}
    credentials:
      secret: ${QUARKUS_OIDC_CREDENTIALS_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # OIDC CLIENT (outbound M2M) — the token this service PRESENTS when it calls another.
  # Distinct from `quarkus.oidc` above, which is the inbound resource-server side that VALIDATES
  # tokens arriving here. The two blocks carry the same three field names and differ by one
  # hyphen, which is how this went missing: the config reads correct at a glance and configures
  # the wrong half. Any client annotated `@RegisterProvider(OidcClientRequestReactiveFilter)`
  # mints its bearer token from HERE, and with no `quarkus.oidc-client` the filter has no client
  # to mint from, so the call leaves unauthenticated and the callee answers 401 — not 403, which
  # is the tell: there is no token at all, rather than a token missing a role.
  # Enforced by .github/scripts/check-oidc-client-configured.py.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}

  rest-client:
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://ledger-service.ledger.svc:8101}

  log:
    level: INFO

  # The management interface the Kubernetes probes and the Prometheus scrape target.
  #
  # This block was missing, and its absence is why the finrep pod could never become ready: the
  # gitops manifest probes and scrapes port 8085 (`port: management`), Quarkus never opened it, and
  # kubelet got connection refused. Without a management port Quarkus keeps /q/health on the main
  # HTTP port, so nothing was wrong with the probe PATH — only with the port it was asked for.
  # 8085 matches every other service in the fleet (ledger, transaction, …), so the manifest was
  # right and the service configuration was the half that never landed.
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs

openbank:
  service:
    name: finrep-service
    port: 8140
  # API-contract major (ADR-0048 D2). MUST equal major(openapi.yaml:info.version) and the
  # /api/v{N} segment both resources are mounted under; the api-contract gate asserts all three.
  # Previously absent: the runtime fell back to the openbank-libs default of "1" (so the served
  # X-API-Version was already v1) while the gate read no key and skipped that half of the check —
  # moot anyway, since finrep had no openapi.yaml to assert anything against (#2255).
  api:
    version: "1"

"%test":
  quarkus:
    http:
      test-port: 0
      header:
        X-Frame-Options:
          value: SAMEORIGIN
    management:
      enabled: false
    devservices:
      enabled: false
