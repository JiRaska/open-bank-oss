quarkus:
  application:
    name: openbank-finrep-service
  http:
    port: 8140
    cors:
      ~: true
      origins: "http://localhost:3000,http://openbank-admin-ui:3000"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: ${QUARKUS_OIDC_CLIENT_ID:openbank-services}
    credentials:
      secret: ${QUARKUS_OIDC_CREDENTIALS_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  rest-client:
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://ledger-service.ledger.svc:8101}

  log:
    level: INFO
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q

openbank:
  service:
    name: finrep-service
    port: 8140
  # API-contract major (ADR-0048 D2). MUST equal major(openapi.yaml:info.version) and the
  # /api/v{N} segment both resources are mounted under; the api-contract gate asserts all three.
  # Previously absent: the runtime fell back to the openbank-libs default of "1" (so the served
  # X-API-Version was already v1) while the gate read no key and skipped that half of the check —
  # moot anyway, since finrep had no openapi.yaml to assert anything against (#2255).
  api:
    version: "1"

"%test":
  quarkus:
    oidc:
      enabled: false
    management:
      enabled: false
    devservices:
      enabled: false
