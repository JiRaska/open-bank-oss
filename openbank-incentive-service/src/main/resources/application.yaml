quarkus:
  application:
    name: openbank-incentive-service
  http:
    port: 8156
    test-port: 0
  datasource:
    db-kind: postgresql
    username: ${DB_USER:openbank}
    password: ${DB_PASSWORD:openbank_secret}
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_incentive}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_incentive}
  flyway:
    migrate-at-start: true
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
  management:
    enabled: true
    port: 8087
    host: 0.0.0.0
    root-path: /q
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      incentive-events-out:
        connector: smallrye-kafka
        client:
          id: incentive-service-${quarkus.uuid}
        topic: openbank.incentive.events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

openbank:
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s
  incentive:
    code-pepper: ${PROMO_CODE_PEPPER:}
    reservation-ttl: ${PROMO_RESERVATION_TTL:PT15M}
    # Fail closed: only customer-edge's configured workload principal may assert a customer party.
    customer-caller-principal: ${INCENTIVE_CUSTOMER_CALLER_PRINCIPAL:}

"%test":
  openbank:
    outbox:
      dispatch-enabled: false
    incentive:
      customer-caller-principal: maker@openbank.test
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
