quarkus:
  application:
    name: openbank-ap2-service
  http:
    port: 8151
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.iam.svc:8080/realms/openbank}
    client-id: openbank-ap2-service
    token:
      audience: openbank-ap2-service
    # Agent identity comes only from a validated bearer token. No agent caller is provisioned yet.
    tenant-enabled: true
  smallrye-openapi:
    info-title: OpenBank AP2 Mandate Verifier
    info-version: "2.0.0"

# OPA PDP (ADR-0034). An unreachable sidecar fails verification closed.
opa:
  url: ${OPA_URL:http://localhost:8181}
  path: ${OPA_PATH:/v1/data/openbank/rest/allow}
  timeout-ms: 500

# AP2 issuer trust list (phase 1). Semicolon-separated `issuer=<x509-spki-base64>` pairs. Empty =
# no trusted issuer, so every mandate fails signature-stage closed until issuers are configured.
ap2:
  trust-list: ${AP2_TRUST_LIST:}

openbank:
  api:
    version: 2
  # Opt in to the libs-runtime OPA sidecar PolicyDecisionPoint producer (replaces the
  # per-service AuthzProducer; same opa.url / opa.path / opa.timeout-ms keys and defaults).
  authz:
    opa-pdp-producer:
      enabled: true

"%prod":
  quarkus:
    http:
      # East-west mTLS: the 8443 listener must VALIDATE the caller's certificate, not merely offer
      # TLS. `quarkus.http.ssl.client-auth` is a BUILD-TIME property, so the container env
      # QUARKUS_HTTP_SSL_CLIENT_AUTH could never set it; it has to live in the file the image is
      # built from. Under `%prod` only: with no certificate configured, dev runs and @QuarkusTest
      # would refuse to start. `prod` is the active profile during quarkusBuild, so it is baked in.
      ssl:
        client-auth: required
      # Keep the plain-HTTP port. With client-auth REQUIRED, Quarkus defaults `insecure-requests`
      # to `disabled` and drops the HTTP listener, breaking the readiness probe and every existing
      # in-cluster plaintext caller. mTLS applies to the 8443 listener only.
      insecure-requests: enabled
      # Listener parity (#12511, the #12506 pattern): with client-auth on, Quarkus ALSO registers its
      # mTLS authentication mechanism, which turns any trusted client certificate into an authenticated
      # SecurityIdentity of its own — on 8443 only. The API must be authenticated identically on both
      # listeners, by the OIDC bearer OPA decides on, so /api/v2/ap2/* accepts bearer ONLY; the
      # certificate stays transport authentication. Measured before this: a fleet-CA certificate with no
      # bearer reached the API as an authenticated principal (403 from authz, not 401).
      # Ap2ListenerAuthParityIT holds both listeners to it with the production listener shape.
      auth:
        permission:
          bearer-only:
            paths: /api/v2/ap2/*
            policy: authenticated
            auth-mechanism: bearer

"%test":
  quarkus:
    oidc:
      # Unit and contract tests use Quarkus test identity; real listener tests override this.
      tenant-enabled: false
