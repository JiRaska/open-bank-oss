# -----------------------------------------------------------------------------
# Certificate Transparency + CAA watch (#16292).
#
# Daily: does the published CAA set equal the one OpenTofu declares, and has any CA logged an
# unexpired certificate for the public domain from an issuer CAA does not allow? Reasoning,
# and why an empty CT answer is never treated as clean, live in the script header.
#
# Verdicts: 0 clean; 2 finding (red + high-severity tracking issue); 3 could not verify
# (warning + its own tracking issue, so a blind source is visible without a daily red run).
# PR lane: self-test + offline CAA derivation only, no network probes.
# -----------------------------------------------------------------------------
name: CT and CAA watch

on:
  schedule:
    - cron: "25 6 * * *"
  pull_request:
    paths:
      - ".github/scripts/check-ct-caa.py"
      - ".github/workflows/ct-caa-watch.yml"
      - "openbank-infra/aws/modules/dns/main.tf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-caa-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: ct-caa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the verdicts
        run: python3 .github/scripts/check-ct-caa.py --self-test

      - name: Derive the expected CAA set from OpenTofu (offline)
        run: python3 .github/scripts/check-ct-caa.py --offline

      - name: Ask DNS and Certificate Transparency
        id: probe
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # Optional second CT source. Without it crt.sh alone is used, and the script's
          # known-positive control decides whether that answer can be trusted at all.
          CERTSPOTTER_TOKEN: ${{ secrets.CERTSPOTTER_TOKEN }}
        run: |
          set +e
          python3 .github/scripts/check-ct-caa.py > "$RUNNER_TEMP/ct.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/ct.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) ;;
            2) echo "::error::CAA drift or a certificate from a CA that CAA does not allow - investigate now."; exit 2 ;;
            3) echo "::warning::CT or DNS could not be verified - this is NOT a clean verdict." ;;
            *) exit "$code" ;;
          esac

      - name: Open or refresh the tracking issue
        if: ${{ always() && github.event_name != 'pull_request' && (steps.probe.outputs.code == '2' || steps.probe.outputs.code == '3') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.probe.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CODE" = "2" ]; then
            title="Certificate Transparency or CAA finding for the public domain"
            severity="severity:high"
            lead="The daily watch found CAA drift or an unexpired certificate from a CA that CAA does not allow. Treat it as a possible mis-issuance until proven otherwise."
          else
            title="Certificate Transparency watch cannot verify - CT source blind"
            severity="severity:medium"
            lead="The daily watch could not verify CT or DNS. Usually the CT source does not contain the certificates our own hosts serve, so it cannot see a foreign one either. Add a second source (repository secret CERTSPOTTER_TOKEN) or fix the probe."
          fi
          body="$RUNNER_TEMP/issue-body.md"
          {
            echo "$lead"
            echo
            echo '```'
            cat "$RUNNER_TEMP/ct.txt"
            echo '```'
            echo
            echo "Probe: \`.github/scripts/check-ct-caa.py\`. Expected CAA is derived from \`openbank-infra/aws/modules/dns/main.tf\`."
            echo "Run: $RUN_URL"
          } > "$body"
          status_file="$RUNNER_TEMP/resolve-status"
          issue=$(bash .github/scripts/resolve-tracking-issue.sh --title "$title" \
            --create-body-file "$body" --create-label security --create-label "$severity" \
            --status-file "$status_file")
          if [ "$(cat "$status_file")" = "existing" ]; then
            gh issue edit "$issue" -R "$GH_REPO" --body-file "$body"
          fi
          echo "Tracking issue: #$issue"
