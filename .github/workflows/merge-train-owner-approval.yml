# Owner decisions are separate from CI and from the required merge-train status.
name: Merge train owner approval

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Exact codex PR number"
        required: true
        type: string
      head:
        description: "Full current head SHA (approval expires after any push)"
        required: true
        type: string
      decision:
        description: "Owner decision for this PR and head"
        required: true
        type: choice
        options: [approve, revoke]
        default: approve
  pull_request:
    paths:
      - .github/workflows/merge-train-owner-approval.yml
      - .github/scripts/merge-train.py
      - .github/scripts/test-merge-train-owner-approval.py

permissions:
  contents: read

# Serialize owner decisions separately from untrusted PR verification runs.
# The group is keyed per decision subject AND per actor/ref: GitHub keeps ONE pending run
# per group and evaluates the group before any job `if`, so anyone with write access can
# dispatch a run that is rejected later as non-owner yet, while pending, would REPLACE the
# owner's pending revoke in a shared group. Including the actor means a non-owner run can
# never share, and so never cancel, an owner group. Different PRs never share a group
# (4 of 7 back-to-back approvals were silently cancelled with one shared group).
# Per owner+PR the single pending slot still serialises: the newest pending decision
# replaces an older pending one, so the last decision dispatched is the last to run.
# The status is written to that PR's own head commit, so PRs never write the same status.
# Residual risk: a run cancelled while still PENDING never executes at all, so the owner
# must confirm a revoke landed by reading the status printed in the run summary.
concurrency:
  group: merge-train-owner-approval-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test-merge-train-owner-approval.py

  decide:
    # Check BOTH actors before minting credentials; reruns never re-apply old decisions.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate decision inputs (fail closed, before anything else)
        env:
          OWNER_PR: ${{ inputs.pr }}
          OWNER_HEAD: ${{ inputs.head }}
          OWNER_DECISION: ${{ inputs.decision }}
        run: |
          set -euo pipefail
          [[ "$OWNER_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must match ^[1-9][0-9]*$"; exit 1; }
          [[ "$OWNER_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head must be a full lowercase 40-hex SHA"; exit 1; }
          [[ "$OWNER_DECISION" == approve || "$OWNER_DECISION" == revoke ]] || { echo "::error::bad decision"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Mint the GitHub App installation token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - name: Revoke first (any non-success App status revokes; approval is only the exact success text)
        if: inputs.decision == 'revoke'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER_PR: ${{ inputs.pr }}
          OWNER_HEAD: ${{ inputs.head }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$OWNER_HEAD" -f state=failure \
            -f context=merge-train/owner-approval -f description="owner-revoked PR #$OWNER_PR" >/dev/null
      - name: Record exact-head owner decision (no PR code)
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER_PR: ${{ inputs.pr }}
          OWNER_HEAD: ${{ inputs.head }}
          OWNER_DECISION: ${{ inputs.decision }}
          MERGE_TRAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null show HEAD:.github/scripts/merge-train.py > "$RUNNER_TEMP/merge-train-owner-approval.py"
          python3 -I -S "$RUNNER_TEMP/merge-train-owner-approval.py" owner-approval \
            --repo "$GITHUB_REPOSITORY" --pr "$OWNER_PR" --head "$OWNER_HEAD" --decision "$OWNER_DECISION"
      - name: Print the status that was written (App-created only)
        if: always()
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER_HEAD: ${{ inputs.head }}
          OWNER_DECISION: ${{ inputs.decision }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -uo pipefail
          rc=0
          line="$(python3 -I -S "$RUNNER_TEMP/merge-train-owner-approval.py" owner-status \
            --repo "$GITHUB_REPOSITORY" --head "$OWNER_HEAD")" || rc=$?
          { echo "### merge-train/owner-approval on ${OWNER_HEAD}"; echo "${line:-no App status found}"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] && [ "$OWNER_DECISION" = revoke ]; then
            echo "::error::no App-created owner-approval status found; the revoke is unconfirmed"
            exit 1
          fi
