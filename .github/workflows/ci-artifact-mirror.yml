# CI artifact mirror (ADR-0366, rollout step 2).
#
# Copies every (entry, platform) of ci/artifacts.lock into ECR Public as an OCI artifact at
#   public.ecr.aws/<alias>/ci-artifacts/<name>:<version>[-<platform>]
# using the resolver's own naming (fetch-artifact.py mirror_ref), so CI can fetch its tools
# and charts when GitHub Releases / *.github.io are down. The lock's sha256 is the trust
# anchor: bytes whose digest differs are never pushed. The job goes RED if any entry cannot
# be mirrored (missing repository, upstream unreachable, digest mismatch).
#
# Lock schema (ci/artifacts.lock, JSON, owned by the step-1 PR and check-artifact-lock.py):
#   {"schema": 1, "artifacts": [
#     {"name": "gitleaks", "kind": "binary-archive|helm-chart", "version": "8.21.2",
#      "platforms": {"linux-amd64": {"url": "https://...|oci://...", "sha256": "<64 hex>"}}}]}
# One ECR repository per entry name, derived from the same file by
# openbank-infra/aws/envs/sandbox-platform/ci-artifact-mirror.tf. An absent lock is a notice.
#
# oras bootstraps this job, so it is fetched MIRROR-FIRST (anonymous) and upstream only as a
# fallback, verified against ORAS_SHA256 either way, and mirrored as the extra entry `oras`.
#
# Repository variables (set by the owner after `tofu apply`; no account ids in this file):
#   CI_ARTIFACT_MIRROR_ROLE_ARN  tofu output ci_artifact_mirror_role_arn
#   CI_ARTIFACT_MIRROR_ALIAS     the ECR Public registry alias the image mirrors use
name: CI artifact mirror

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ci/artifacts.lock
      - .github/scripts/mirror-ci-artifacts.py
      - .github/workflows/ci-artifact-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-artifact-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main' && github.repository == 'JiRaska/open-bank-oss'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      LOCK: ci/artifacts.lock
      ORAS_EXTRA: "oras,1.3.6,linux-amd64,https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz,66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test the planner
        run: python3 -I .github/scripts/mirror-ci-artifacts.py --selftest

      - name: Check lock and configuration
        id: pre
        env:
          ROLE_ARN: ${{ vars.CI_ARTIFACT_MIRROR_ROLE_ARN }}
          ALIAS: ${{ vars.CI_ARTIFACT_MIRROR_ALIAS }}
        run: |
          if [ ! -f "$LOCK" ]; then
            echo "::notice::$LOCK does not exist yet (ADR-0366 step 1 not merged); nothing to mirror."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ROLE_ARN" ] || [ -z "$ALIAS" ]; then
            echo "::error::repository variables CI_ARTIFACT_MIRROR_ROLE_ARN and CI_ARTIFACT_MIRROR_ALIAS must be set"
            exit 1
          fi
          echo "registry=public.ecr.aws/$ALIAS" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install oras (mirror first, then upstream; sha256-verified)
        if: steps.pre.outputs.skip == 'false'
        env:
          REGISTRY: ${{ steps.pre.outputs.registry }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/oras.tgz"
          python3 -I .github/scripts/mirror-ci-artifacts.py bootstrap \
            --registry "$REGISTRY" --extra "$ORAS_EXTRA" --out "$tgz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" oras
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Plan (anonymous read of the mirror)
        if: steps.pre.outputs.skip == 'false'
        env:
          REGISTRY: ${{ steps.pre.outputs.registry }}
        run: python3 -I .github/scripts/mirror-ci-artifacts.py plan --lock "$LOCK" --registry "$REGISTRY" --extra "$ORAS_EXTRA"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.pre.outputs.skip == 'false'
        with:
          role-to-assume: ${{ vars.CI_ARTIFACT_MIRROR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR Public
        if: steps.pre.outputs.skip == 'false'
        run: |
          set -euo pipefail
          aws ecr-public get-login-password --region us-east-1 \
            | oras login --username AWS --password-stdin public.ecr.aws

      - name: Mirror missing or stale entries
        if: steps.pre.outputs.skip == 'false'
        env:
          REGISTRY: ${{ steps.pre.outputs.registry }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/mirror-ci-artifacts.py apply --lock "$LOCK" --registry "$REGISTRY" --extra "$ORAS_EXTRA"
