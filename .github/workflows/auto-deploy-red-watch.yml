# -----------------------------------------------------------------------------
# auto-deploy red watch (issue #9130).
#
# WHY THIS EXISTS
#   auto-deploy.yml never triggers main-red-watch: that watch listens on
#   `workflow_run` of push-on-main workflows, and auto-deploy runs on schedule /
#   workflow_dispatch / its own chaining, so no push event exists to fire on.
#   Measured 2026-09-07/08: four consecutive auto-deploy failures over seven
#   hours (pact REGRESSION blocks on sdd/vop/swift) surfaced only because a human
#   went looking for whether two fixes had reached sandbox. Red runs were then
#   roughly 40 minutes apart, with nobody addressed: a broken pipeline
#   reading as background
#   noise — and because deploys still PARTIALLY land, the estate looks healthy
#   while three services sit pinned.
#
# ESCALATION, not redness — the same shape as main-red-watch (issue #4019): a
#   scheduled job going red would reproduce the blind spot it exists to close.
#   So this opens or refreshes ONE issue (label `fleet-health`, marker
#   `<!-- auto-deploy-red -->`), reopens it if hand-closed while the pipeline is
#   still failing, and closes it itself on the next green SCHEDULED run.
#
# THE POPULATION IS THE SCHEDULED LANE ONLY. Until 2026-09-13 this read the three
#   newest completed runs of any event. auto-deploy also runs on `push` (the
#   services a merge touched) and those runs are green legitimately — about a
#   different subject — and they land between scheduled ticks. Ten scheduled
#   failures over 27 hours never escalated: `2271 schedule ✗ | 2270 schedule ✗ |
#   2269 push ✓` read as not stuck, and the not-stuck branch would have CLOSED
#   any issue on that push green. The decision now lives in
#   .github/scripts/detect-auto-deploy-stuck.py, where --self-test holds it to
#   exactly that fixture, and the `auto-deploy-red-watch-declaration` gate keeps
#   it from being re-inlined here where no test can reach it.
#
# THRESHOLD: three consecutive completed scheduled failures. One failure can be
#   a transient broker hiccup the next tick clears; three in a row is a stuck
#   pipeline by any reading, and the gate itself says a REGRESSION block "will
#   not clear on its own" (ADR-0092, #2549). Cancelled runs are not failures
#   (concurrency-group supersede is normal, #2185) and in-progress runs are
#   simply not a verdict yet.
# -----------------------------------------------------------------------------
name: auto-deploy red watch

on:
  schedule:
    # Off-peak minutes by convention. Auto-deploy now schedules every three
    # hours; this watcher checks twice an hour and rejects old verdicts.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-deploy-red-watch
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      contents: read
      actions: read
      issues: write  # github-script opens/refreshes/closes the one red-streak issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A verdict from logic that has never been falsified is not a verdict.
      - name: Self-test the watcher
        run: python3 .github/scripts/detect-auto-deploy-stuck.py --self-test

      # One bounded, unfiltered API page; the script selects the scheduled lane
      # and rejects stale/incomplete pages (#12189). The older whole-history
      # pagination made ~228 calls per tick and hit the installation rate limit.
      - name: Evaluate the scheduled lane
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 .github/scripts/detect-auto-deploy-stuck.py --evaluate \
            --repo "$GITHUB_REPOSITORY" --json /tmp/auto-deploy-red.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "scheduled auto-deploy lane not stuck." ;;
            2) echo "::warning::scheduled auto-deploy lane is stuck red — escalating." ;;
            1) echo "::error::The watch could not read the scheduled lane. That is a"
               echo "::error::failure of THIS WATCH, not a 'not stuck' verdict."
               exit 1 ;;
            *) echo "::error::Unexpected exit $code."; exit "$code" ;;
          esac

      - name: Escalate or stand down
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const v = JSON.parse(fs.readFileSync('/tmp/auto-deploy-red.json', 'utf8'))
            const LABEL = 'fleet-health'
            const MARKER = '<!-- auto-deploy-red -->'

            const findOpen = async (state) => {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...context.repo, state, labels: LABEL, per_page: 100,
                sort: 'updated', direction: 'desc',
              })
              return issues.find(i => (i.body || '').includes(MARKER))
            }

            if (!v.stuck) {
              const open = await findOpen('open')
              // Only a green SCHEDULED run newer than the streak closes the issue
              // (R3). A green push is a fact about other services; the script
              // never puts one in close_on.
              if (open && v.close_on) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `the scheduled auto-deploy lane is green again ([run ${v.close_on.id}](${v.close_on.html_url}), ${v.close_on.created_at}) — closing. _(\`${context.workflow}\` run ${context.runId})_`,
                })
                await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed' })
                core.info(`closed #${open.number}`)
              } else if (open) {
                core.info(`#${open.number} stays open: below threshold but no green scheduled run yet.`)
              } else {
                core.info('scheduled auto-deploy lane not stuck; nothing to do.')
              }
              return
            }

            const recent = v.recent
            const first = recent[0]
            const last = recent[recent.length - 1]
            const title = `auto-deploy has failed ${v.threshold}+ scheduled runs in a row — services pinned to their last deployable images`
            const body = [
              MARKER,
              '## auto-deploy is stuck red — the estate looks deployed and is not',
              '',
              `${v.threshold} consecutive completed SCHEDULED auto-deploy runs failed:`,
              '',
              ...recent.map(r => `- [run ${r.id}](${r.html_url}) — ${r.created_at} — head \`${(r.head_sha || '').slice(0, 9)}\``),
              '',
              `Newest: ${first.created_at}; oldest of the streak: ${last.created_at}.`,
              '',
              'Only the scheduled (reconcile) lane counts here: a green `push` run deploys the',
              'services one merge touched and says nothing about the services that are pinned.',
              '',
              'A REGRESSION block does not clear on its own — the reconcile tick',
              're-offers it forever (ADR-0092, #2549). PENDING_BUILD can clear when CI catches up.',
              'Partial deploys still land, so the fleet',
              'looks healthy while blocked services stay pinned. Read the can-i-deploy job of the',
              'newest run above for the per-service class and the failing pact verification.',
              'See #9130 for the first measured instance (four failures over seven hours, found',
              'by accident).',
              '',
              'This issue refreshes in place while the streak continues and closes itself on the',
              `next green scheduled run. Hand-closing while still red reopens it. _(\`${context.workflow}\` run ${context.runId})_`,
            ].join('\n')

            const open = await findOpen('open')
            if (open) {
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, title, body })
              core.info(`refreshed #${open.number}`)
              return
            }
            // Reopen a hand-closed one if it is still true; otherwise file fresh.
            const closed = await findOpen('closed')
            if (closed) {
              await github.rest.issues.update({ ...context.repo, issue_number: closed.number, title, body, state: 'open' })
              core.info(`reopened #${closed.number}`)
              return
            }
            const created = await github.rest.issues.create({ ...context.repo, title, body, labels: [LABEL] })
            core.info(`opened #${created.data.number}`)

      # #9898: the workflow-level streak above is retained as a fallback while
      # per-service artifacts accumulate. Only this lane can identify a durable
      # blocked service despite green runs for unrelated services.
      - name: Self-test the per-service watch
        run: python3 .github/scripts/detect-auto-deploy-subjects.py --self-test

      - name: Evaluate per-service scheduled verdicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/detect-auto-deploy-subjects.py --evaluate \
            --repo "$GITHUB_REPOSITORY" --json /tmp/auto-deploy-subjects.json

      - name: Escalate durable service subjects
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('/tmp/auto-deploy-subjects.json', 'utf8'))
            if (!report.ready) {
              core.info('No per-service artifacts yet; retaining the existing lane watch.')
              return
            }
            const LABEL = 'fleet-health'
            const marker = service => `<!-- auto-deploy-subject:${service} -->`
            const active = report.active
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            })
            const closedRecent = await github.rest.issues.listForRepo({
              ...context.repo, state: 'closed', labels: LABEL, per_page: 100,
              sort: 'updated', direction: 'desc',
            })
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000
            for (const subject of active) {
              const match = issue => (issue.body || '').includes(marker(subject.service))
              const existing = open.find(match)
              const closed = closedRecent.data.find(i =>
                i.closed_at && Date.parse(i.closed_at) >= cutoff && match(i))
              const pairs = (subject.blocked_on || []).map(p =>
                `- \`${p.consumer}\` → \`${p.provider}\`: ` +
                (p.verification_id ? `verification #${p.verification_id}` : 'verification missing'))
              const title = `auto-deploy: ${subject.service} durably blocked [${subject.class}]`
              const body = [
                marker(subject.service),
                `## ${subject.service} remains blocked by the contract gate`,
                '',
                `Class: \`${subject.class}\`; money path: \`${subject.money_path}\`; ` +
                  `durable scheduled verdicts: ${subject.streak}/${subject.threshold}.`,
                `Latest selected run: ${subject.run_id}, head \`${subject.head_sha}\`.`,
                '',
                ...(pairs.length ? pairs : ['Blocking pair/verification identity was not established.']),
                '',
                'A green run for another service, a transient verdict, or a passing contract',
                'gate does not prove this service reached a healthy live rollout.',
                'Keep this issue open until the running image and exact current source are',
                'attested. This watch currently escalates and refreshes; it never auto-closes',
                'on a proxy signal. Refs #9898.',
              ].join('\n')
              if (existing) {
                await github.rest.issues.update({ ...context.repo,
                  issue_number: existing.number, title, body })
                core.info(`refreshed #${existing.number}: ${subject.service}`)
              } else if (closed) {
                await github.rest.issues.update({ ...context.repo,
                  issue_number: closed.number, title, body, state: 'open' })
                core.info(`reopened #${closed.number}: ${subject.service}`)
              } else {
                const created = await github.rest.issues.create({
                  ...context.repo, title, body, labels: [LABEL],
                })
                core.info(`opened #${created.data.number}: ${subject.service}`)
              }
            }
            core.info(`${active.length} durable service subject(s); existing subject issues are never closed without runtime proof.`)
