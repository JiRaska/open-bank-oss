name: Tune Hetzner runner hosts (aio-max-nr)

# Applies openbank-infra/scripts/tune-runner-host.sh on every Hetzner runner host
# to raise fs.aio-max-nr so Redpanda/Kafka Testcontainers don't flake (ADR-0082).
# The ARC/AWS pool handles this via an init container; Hetzner hosts need it host-side.
# Run manually or whenever a new Hetzner host is provisioned.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tune:
    # Runs on the shared openbank-build pool (actual label all self-hosted runners
    # register with, per reregister-runner.sh RUNNER_LABELS default). The labels
    # hetzner-cpx42-1/2 were the intended target but those labels were never registered;
    # runs-on: openbank-build reaches Hetzner hosts as well as ARC/Mac runners.
    # The tune-runner-host.sh script skips gracefully on macOS and on non-root —
    # it is a no-op on runners where it can't apply, so this is safe to fan out.
    # Trigger multiple dispatches to ensure BOTH Hetzner hosts get tuned.
    name: "tune host"
    strategy:
      matrix:
        attempt: [1, 2]
      fail-fast: false
    runs-on: openbank-build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check sudo access
        run: sudo -n true && echo "sudo ok" || { echo "❌ sudo NOPASSWD not configured for runner user"; exit 1; }

      - name: Apply aio-max-nr tuning
        run: sudo openbank-infra/scripts/tune-runner-host.sh

      - name: Verify
        run: |
          echo "fs.aio-max-nr = $(sysctl -n fs.aio-max-nr)"
          cat /etc/sysctl.d/99-openbank-runner-aio.conf 2>/dev/null || echo "drop-in not found"
