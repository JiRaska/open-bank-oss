# SPDX-License-Identifier: Apache-2.0
# k6 performance smoke gate — advisory phase (ADR-0243)
#
# Boot a service in Quarkus dev mode against a throwaway postgres, run a short k6
# load test against its HTTP surface, and fail on threshold breach. This is NOT a
# PR gate during the pilot: it runs weekly on openbank-batch and on manual
# dispatch, and its failures create issues rather than blocking merges.
#
# v1 scope: openbank-product-catalog only. Money-path services follow once the
# harness is proven (issue #3348).
name: Performance gate

on:
  schedule:
    - cron: "0 6 * * 3"   # weekly Wed 06:00 UTC
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated service modules to test (blank = openbank-product-catalog)"
        required: false
        default: "openbank-product-catalog"

permissions:
  contents: read

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: derive perf-gate scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive service matrix
        id: derive
        env:
          OVERRIDE: ${{ github.event.inputs.services }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          # The declared v1 scope (ADR-0243, issue #3348). Kept as a named constant so the
          # summary can say what the run was SUPPOSED to measure, not only what it did.
          DECLARED = ["openbank-product-catalog"]
          override = (os.environ.get("OVERRIDE") or "").split()
          services = override or list(DECLARED)
          matrix, skipped = [], []
          for svc in services:
              app = pathlib.Path(svc) / "src/main/resources/application.yaml"
              script = pathlib.Path(svc) / "src/test/k6" / f"{svc.replace('openbank-','').replace('-service','')}-smoke.js"
              if not app.is_file():
                  skipped.append((svc, "no application.yaml"))
                  continue
              if not script.is_file():
                  skipped.append((svc, f"no k6 script at `{script}`"))
                  continue
              raw = app.read_text()
              port = re.search(r"^  http:\n(?:.*\n)?\s*port:\s*(\d+)", raw, re.M)
              db = re.search(r"(?:jdbc:)?(?:vertx-reactive:)?postgresql://[^/]+/([A-Za-z0-9_]+)", raw)
              if not port or not db:
                  skipped.append((svc, "cannot derive port/DB"))
                  continue
              matrix.append({"service": svc, "port": int(port.group(1)), "db": db.group(1)})
          for svc, why in skipped:
              print(f"::warning::perf-gate: {svc} EXCLUDED — {why}")
          print(f"perf-gate: {len(matrix)} service(s); {len(skipped)} excluded")

          # A run's CONCLUSION is not a coverage statement. The fuzz lane proved it (#4695):
          # its first-ever green had fuzzed ONE service because of a dispatch override, and
          # read identically to a full pass. perf-gate carries the same two shapes — a
          # `services:` input silently REPLACES the declared scope, and every candidate can be
          # dropped by a `continue`, leaving a zero-length matrix that produces no jobs and no
          # failure. "Latency was within budget" means nothing without the denominator, so it
          # is printed where a reader lands.
          denom = len(services)
          summary = [
              "## Performance gate scope",
              "",
              f"**{len(matrix)} of {denom} requested service(s) actually measured.**",
              "",
          ]
          if override:
              summary += [
                  f"> ⚠️ **Scope was OVERRIDDEN by dispatch input** — this run does NOT measure "
                  f"the declared v1 scope (`{' '.join(DECLARED)}`). "
                  f"Requested: `{' '.join(override)}`",
                  "",
              ]
              print(
                  "::warning::perf-gate: scope OVERRIDDEN by dispatch input "
                  f"({len(matrix)} of {denom} requested service(s)) — this run is not a coverage measurement"
              )
          if skipped:
              summary += ["| Excluded | Why |", "|---|---|"]
              summary += [f"| `{svc}` | {why} |" for svc, why in skipped]
              summary += [""]
          summary += ["Measured: " + (", ".join(f"`{m['service']}`" for m in matrix) or "_none_")]
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as fh:
              fh.write("\n".join(summary) + "\n")

          # An empty scope must never read as a pass. A zero-length matrix runs no jobs and the
          # workflow succeeds having measured nothing — the exact shape this repo keeps
          # rediscovering. Fail here, where the reason is still in hand.
          if not matrix:
              print("::error::perf-gate: derived scope is EMPTY — nothing would be measured")
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps(matrix) + "\n")
          PY

  perf:
    name: "k6 smoke (${{ matrix.service }})"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      POSTGRES_PASSWORD: "perf-ci-throwaway"
      SERVICE: ${{ matrix.service }}
      PORT: ${{ matrix.port }}
      DB: ${{ matrix.db }}
      # Official Grafana GHCR linux/amd64 manifest for k6 v0.54.0. A version tag alone is
      # mutable; the digest is the executable supply-chain identity.
      K6_IMAGE: ghcr.io/grafana/k6:0.54.0@sha256:32000aaa40b848add83425ed7cc77535c343ca473498b0bd29464d00fdca6c79
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Resolve pinned k6 runtime
        run: |
          set -euo pipefail
          docker pull "${K6_IMAGE}"
          docker run --rm "${K6_IMAGE}" version

      - name: Run k6 smoke test
        run: |
          set -euo pipefail
          mkdir -p perf-reports

          echo "==> [${SERVICE}] starting postgres db=${DB}"
          docker rm -f perf-pg >/dev/null 2>&1 || true
          docker run -d --name perf-pg -p 5432:5432 \
            -e POSTGRES_USER=openbank \
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            -e POSTGRES_DB="${DB}" \
            postgres:16.3-alpine >/dev/null

          PG_UP=0
          for _ in $(seq 1 30); do
            docker exec perf-pg pg_isready -U openbank >/dev/null 2>&1 && { PG_UP=1; break; }
            sleep 2
          done
          if [ "$PG_UP" != "1" ]; then
            echo "::error::[${SERVICE}] postgres never became ready"
            exit 1
          fi

          echo "==> [${SERVICE}] starting quarkusDev on port ${PORT}"
          ./gradlew ":${SERVICE}:quarkusDev" \
            -Dquarkus.datasource.jdbc.url="jdbc:postgresql://localhost:5432/${DB}" \
            -Dquarkus.datasource.reactive.url="postgresql://localhost:5432/${DB}" \
            -Dquarkus.datasource.username=openbank \
            -Dquarkus.datasource.password="${POSTGRES_PASSWORD}" \
            -Dquarkus.oidc.enabled=false \
            -Dquarkus.security.auth.enabled-in-dev-mode=false \
            -Dquarkus.management.enabled=false \
            -Dquarkus.console.basic=true \
            --console=plain --quiet \
            > "perf-reports/${SERVICE}-boot.log" 2>&1 &
          DEV_PID=$!

          UP=0
          for _ in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/q/health/ready" || true)"
            if [ "$code" = "200" ]; then UP=1; break; fi
            kill -0 "$DEV_PID" 2>/dev/null || break
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "::error::[${SERVICE}] failed to boot — see ${SERVICE}-boot.log"
            tail -50 "perf-reports/${SERVICE}-boot.log" || true
            exit 1
          fi

          SCRIPT="${SERVICE}/src/test/k6/$(echo "${SERVICE}" | sed 's/^openbank-//;s/-service$//')-smoke.js"

          # A readiness probe is not proof the PROBED route answers. This gate spent its whole
          # life measuring 401s: /q/health/ready returned 200, @Authenticated rejected every
          # request to the route the script actually calls, and k6 reported a p95 for the
          # rejection. Assert one real 200 on that route before handing k6 the clock.
          SMOKE_PATH="$(python3 .github/scripts/k6-smoke-path.py "$SCRIPT")"
          probe="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}${SMOKE_PATH}" || true)"
          if [ "$probe" != "200" ]; then
            echo "::error::[${SERVICE}] ${SMOKE_PATH} answered ${probe}, not 200 — k6 would time the error path. Refusing to report a latency for a request that never reached the handler."
            tail -50 "perf-reports/${SERVICE}-boot.log" || true
            exit 1
          fi
          echo "==> [${SERVICE}] ${SMOKE_PATH} answered 200 — the probe reaches its subject"

          echo "==> [${SERVICE}] running k6 ${SCRIPT}"
          docker run --rm \
              --network host \
              --user "$(id -u):$(id -g)" \
              --env "BASE_URL=http://localhost:${PORT}" \
              --volume "$PWD:/work" \
              --workdir /work \
              "${K6_IMAGE}" run \
              --summary-export "perf-reports/${SERVICE}-summary.json" \
              "$SCRIPT" | tee "perf-reports/${SERVICE}-k6.log"

          kill "$DEV_PID" 2>/dev/null || true
          pkill -f "quarkusDev" 2>/dev/null || true
          docker rm -f perf-pg >/dev/null 2>&1 || true

      - name: Build performance Test Intelligence envelope
        if: always()
        continue-on-error: true
        run: |
          python3 .github/scripts/collect-test-run-evidence.py \
            --service "${{ matrix.service }}" \
            --performance-summary "perf-reports/${{ matrix.service }}-summary.json" \
            --out "perf-reports/${{ matrix.service }}-run.json"

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-reports-${{ matrix.service }}
          path: perf-reports/
          retention-days: 30

  # ── The alarm (ADR-0243 decision 2, issue #3768) ──────────────────────────────
  # ADR-0243 and this file's own header both promise that an advisory-phase threshold
  # breach "creates issues rather than blocking merges". Until now nothing did: a breach
  # only turned the weekly scheduled run red, and a red scheduled workflow on main is
  # addressed to nobody (dependency-submission.yml, #1449). Same raise-or-refresh shape
  # as fleet-attestation.yml and dependency-submission.yml — deliberately not a new one.
  #
  # Scheduled runs only: a workflow_dispatch failure is already in front of the person
  # who dispatched it, and filing a repo issue for it would be noise. All reasoning about
  # HOW the body is derived lives in the script header, not in a run: block — an oversized
  # run: step makes the whole workflow silently unparseable (19000-char gate).
  raise-issue:
    name: Raise issue on perf-gate failure
    needs: perf
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read   # gh run download reads this run's own artifacts
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Artifacts may legitimately be absent (failure before the matrix, or upload itself
      # failed); the renderer handles an empty directory and says so rather than implying
      # a clean measurement. `|| true` so that case does not mask the real escalation.
      - name: Download perf reports from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --dir perf-artifacts || true

      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BODY_FILE="${RUNNER_TEMP:-/tmp}/perf-gate-issue-body.md"
          TITLE="$(python3 .github/scripts/perf-gate-issue-body.py --print-title)"
          python3 .github/scripts/perf-gate-issue-body.py \
            --reports-dir perf-artifacts \
            --run-url "${RUN_URL}" \
            --event "${EVENT}" \
            --out "${BODY_FILE}"
          cat "${BODY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "${BODY_FILE}"
          else
            gh issue create --title "$TITLE" --body-file "${BODY_FILE}" \
              --label tech-debt --label "severity:medium"
          fi
