# CodeQL SAST — free for public repos (ADR-0029 security gate).
# Scans Kotlin/Java and JavaScript on every push to main and PRs.
# Results appear in Security → Code scanning alerts.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full weekly scan (catches new CVE signatures even without code change)
    - cron: "27 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: openbank-build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
        include:
          - language: java-kotlin
            build-mode: none   # CodeQL auto-build for Gradle
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: "/language:${{ matrix.language }}"