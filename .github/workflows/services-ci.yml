  # Nightly-only: turn a failed full-fleet build into an actionable, deduplicated issue.
  # Runs solely for the scheduled run so PR/push failures (already visible as red checks)
  # don't spam issues.
  nightly-health-alert:
    name: nightly fleet-health alert
    needs: [changes, all-green]
    if: always() && github.event_name == 'schedule' && (needs.all-green.result == 'failure' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # actions/github-script (not the `gh` CLI): the self-hosted `openbank-build`
      # runners have no `gh` binary, so the previous `gh issue create` step failed
      # with `gh: command not found` (exit 127) on every nightly — the fleet rotted
      # red for days with NO issue ever opened. github-script talks to the REST API
      # over the runner's bundled node, which IS present (it runs admin-ui and other
      # JS actions), so the alert actually fires.
      - name: Open or update the fleet-health tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const detected = new Date().toISOString();
            // Dedupe on the BUILD-specific marker label, NOT the shared 'fleet-health'
            // umbrella: the fleet-lint alert also carries 'fleet-health', so deduping on
            // the umbrella made this build alert comment its breakage onto whatever
            // fleet-health issue was open (usually the LINT one) instead of opening its
            // own — the build rot then hid as a comment on an unrelated issue for days.
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'fleet-health-build',
            });
            if (open.length > 0) {
              const n = open[0].number;
              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: `Still failing as of the latest nightly full-fleet run.\n\nRun: ${runUrl}\nDetected: ${detected}`,
              });
              core.info(`Commented on existing fleet-health-build issue #${n}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo,
                title: 'Nightly full-fleet build is failing',
                labels: ['fleet-health', 'fleet-health-build', 'bug'],
                body: `The scheduled full-fleet build failed — a service on \`main\` no longer compiles or its tests are red, even though no recent PR touched it (path-scoped CI cannot catch this). Investigate which module is red in the run and open a fix PR.\n\nRun: ${runUrl}\nDetected: ${detected}`,
              });
              core.info(`Opened a new fleet-health issue #${created.number}.`);
            }
