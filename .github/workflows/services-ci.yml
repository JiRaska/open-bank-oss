# Per-service CI dispatcher.
#
#  changes  -> works out which Gradle modules a push/PR actually touched and emits
#              a JSON matrix. Shared changes (openbank-libs, version catalog, root
#              build) fan out to EVERY module because everything depends on them.
#              Main pushes are also path-scoped; unattributable changes fall back
#              to the full fleet. A CI recipe change uses one canary module.
#  build    -> calls the reusable _service-ci.yml once per changed module (matrix),
#              so each service reports its own green/red status check.
#
# Why the matrix is path-scoped and runs are superseded:
#  - path-scoped matrix: a typical PR builds only the handful of touched services
#  - concurrency: cancel superseded runs on the same ref (PR pushes only — a push to
#    main gets a per-commit lane, see the concurrency block below)
#
# NOT a hosted-minutes budget. This header used to read "Minutes governance (GitHub Free,
# private repo = 2000 min/mo)". That stopped being true when the repository went public:
# GitHub-hosted minutes on a public repo are free and UNLIMITED — there is no monthly
# allowance to govern and nothing here is billed by GitHub. The comment at the nightly
# matrix further down this same file already said so, so the file contradicted itself and
# the stale half was the one framing the whole design.
#
# The two constraints that are real are different resources, and conflating them is how the
# wrong thing gets optimised:
#
#  - COST is AWS, not GitHub. The self-hosted ARC pool runs on EKS nodes we pay for, and it
#    has a hard capacity ceiling as well (#2039: maxRunners is far below a full-fleet run,
#    so an unscoped fan-out starves the queue for hours). That is the resource worth being
#    careful with, and the only one attached to a bill.
#  - WALL-CLOCK LATENCY is everyone's, on either pool. A full-fleet fan-out is minutes of
#    waiting per PR whether or not anyone is charged for it.
#
# GitHub's own limit is a throughput cap, not a cost: the Free plan allows 20 concurrent
# hosted jobs account-wide, shared with other repositories.
name: Services CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full-fleet health build. PRs are path-scoped (only changed services build),
  # so a PR that breaks a service it does NOT touch ships green and the breakage only
  # surfaces post-merge — where nobody watches. (account-service did not compile on main
  # for ~14 commits this way.) This scheduled run rebuilds EVERY module daily and, on
  # failure, opens an actionable tracking issue so a rotting fleet is caught in <24h.
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Don't let the nightly run cancel an in-flight PR/main run (or vice-versa): give the
  # scheduled/manual fleet build its own concurrency lane. A manual fleet run is
  # additionally keyed by its run id: it is an operator-requested diagnostic and
  # must never cancel (or be cancelled by) the required PR gate on the same ref.
  #
  # For push-to-main, github.ref is always refs/heads/main regardless of commit — so
  # without a per-SHA key, any push landing while a prior main push is still building
  # (bot commits from release-please/auto-deploy land every few minutes) cancels that
  # run outright. A cancelled run never reaches the Pact publish step, so the broker's
  # "latest main tag" consumer pact freezes at the last commit that happened to finish
  # uninterrupted, and can-i-deploy keeps citing that stale/failed verification forever
  # (issue #846). Key push-to-main by SHA so every commit gets its own lane and is never
  # cancelled; PR pushes keep the superseding behavior (a new push to the same branch
  # should cancel the old run).
  group: services-ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'workflow_dispatch' && github.run_id || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci')) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admission: ${{ steps.admit.outputs.proceed }}
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
      verification-modules: ${{ steps.detect.outputs.verification-modules }}
      verification-modules-json: ${{ steps.detect.outputs.verification-modules-json }}
      admin-ui-pact-changed: ${{ steps.detect.outputs.admin-ui-pact-changed }}
    steps:
      # Read admission policy from the trusted base before checking out PR code.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Admission policy and pinned requirements must come from the current
          # trusted base branch; base.sha is frozen for older pull requests.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/agent-admission-venv"
          "$RUNNER_TEMP/agent-admission-venv/bin/python" -m pip install --quiet --require-hashes -r .github/workflows/requirements/public-readiness.txt
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "$RUNNER_TEMP/agent-prs.json"
          "$RUNNER_TEMP/agent-admission-venv/bin/python" .github/scripts/agent-admission.py "$RUNNER_TEMP/agent-prs.json" --current-pr "$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - if: steps.admit.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        if: steps.admit.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Canonical Gradle module list — DISCOVERED from the tree exactly like
          # settings.gradle.kts (every `openbank-*` dir with a build.gradle.kts), NOT hardcoded.
          # A hardcoded list silently drifts: a newly-added service is absent from it, so its
          # build job is skipped on the PR that introduces it AND in the nightly full-fleet run,
          # yet `all-green` passes (skipped != failed) — a branch-protection hole that let
          # openbank-fraud-service (and anacredit-service, analytics-sink) merge unbuilt (#1001).
          # Deriving it from the same rule as settings.gradle.kts keeps CI and the build in sync
          # and builds a new service on its introducing PR. `openbank-admin-ui` (Next.js) and
          # `openbank-infra` (OpenTofu) have no build.gradle.kts, so neither is picked up.
          ALL=$(for d in openbank-*/; do if [ -f "${d}build.gradle.kts" ]; then printf '%s ' "${d%/}"; fi; done)

          # The sourced selector is exercised by positive and negative controls before it
          # can select a build matrix. Unknown paths still take the conservative fallback.
          # shellcheck source=.github/scripts/service-ci-pact-modules.sh
          source .github/scripts/service-ci-pact-modules.sh
          pact_build_modules_self_test
          python3 .github/scripts/test-service-ci-job-roster.py
          python3 .github/scripts/test-service-ci-path-selection.py
          # Validate the shared image-preparation logic once before matrix fan-out.
          python3 .github/scripts/tests/test_prewarm_ci_postgres.py
          python3 .github/scripts/coverage-floor-only-diff.py --self-test

          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Event ${{ github.event_name }} -> build all modules (full-fleet)."
            CHANGED="$ALL"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Scope service and Pact changes; inert release/docs/infra changes build nothing.
            # Unknown build inputs fall back to the full fleet below. Full history makes
            # HEAD~1 available on main (squash-merged pushes are single commits).
            DIFF_BASE=HEAD~1
            FILES=$(git diff --name-only "$DIFF_BASE" HEAD 2>/dev/null || true)
            if admin_ui_pact_changed "$FILES"; then
              echo "admin-ui-pact-changed=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Push changed files:"; echo "$FILES"
            # Inert = provably cannot change a compile input or a contract. A service's
            # source, any build input, Pact, or unknown automation path remains relevant and
            # therefore keeps the conservative scoped/full-fleet behavior below.
            RELEVANT=""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! is_inert_service_path "$f"; then RELEVANT="${RELEVANT}${RELEVANT:+$'\n'}${f}"; fi
            done <<< "$FILES"
            RELEVANT_COUNT=$(grep -c . <<< "$RELEVANT" || true)
            if [ "${RELEVANT_COUNT:-0}" -eq 0 ]; then
              echo "Decision: push changed only inert paths (release/docs/admin-ui/infra/external workflows) -> build nothing."
              CHANGED=""
            else
              # Scope the main-push build instead of always full-fleeting (#1208/#2039). Full-fleet
              # on ANY build-relevant change is ~30 jobs and, on the 6-runner pool, wedges the queue
              # for hours (a merged contract fix sits unverified behind it — the #1348 drain, #945).
              # The safe direction is still over-build: the moment a changed path is NOT cleanly
              # attributable to a module or a pact pair, fall back to full-fleet. Never under-build
              # the Pact graph.
              #   - code-global input (core libs, gradle, build-logic) -> full-fleet.
              #     libs-lending and libs-iso20022 follow their declared Gradle consumers.
              #     Lib test-only paths excepted (filter-lib-test-only-paths.py).
              #   - pacts/<consumer>-<provider>.json changed -> build both Gradle modules. The
              #     Admin UI consumer is not a Gradle module: its separate trusted Pact workflow
              #     publishes it, so only its provider belongs in this matrix.
              #   - <module>/... changed -> that module.
              #   - openbank-libs/governance/ -> data for CI checks/admin-ui, not a compile input.
              #   - the CI recipe itself -> canary below.
              #   - anything else -> unattributable -> full-fleet (safety).
              FILES_CODE=$(grep -vE '^openbank-libs/governance/' <<< "$RELEVANT" || true)
              FILES_GLOBAL=$(python3 .github/scripts/filter-lib-test-only-paths.py <<< "$FILES_CODE")
              # An exact raised-floor-only diff stays local to libs-domain.
              if grep -Fxq 'openbank-libs-domain/build.gradle.kts' <<< "$FILES_GLOBAL" && python3 .github/scripts/coverage-floor-only-diff.py --base "$DIFF_BASE"; then
                echo "Decision: shared domain build script changes only its raised coverage floor."
                FILES_GLOBAL=$(grep -vFx 'openbank-libs-domain/build.gradle.kts' <<< "$FILES_GLOBAL" || true)
              fi
              if grep -qE '^(openbank-libs[^/]*/|gradle/|settings\.gradle\.kts|build\.gradle\.kts|gradle\.properties|build-logic/)' <<< "$FILES_GLOBAL"; then
                echo "Decision: code-global change -> full-fleet."
                CHANGED="$ALL"
              else
                CHANGED=""
                SCOPE_OK=1
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  case "$f" in
                    pacts/*.json)
                      if ! modules=$(pact_build_modules "$f"); then SCOPE_OK=0; continue; fi
                      while IFS= read -r p; do
                        if grep -qE "(^| )${p}( |$)" <<< " $ALL "; then CHANGED="$CHANGED $p"; else SCOPE_OK=0; fi
                      done <<< "$modules" ;;
                    openbank-libs/governance/*) : ;;
                    .github/workflows/services-ci.yml|.github/workflows/_service-ci.yml|.github/scripts/service-ci-pact-modules.sh|.github/scripts/service-ci-library-dependents.py|.github/scripts/await-admin-ui-pact-publication.py|.github/scripts/test-await-admin-ui-pact-publication.py) : ;;
                    openbank-*/*)
                      m="${f%%/*}"
                      if grep -qE "(^| )${m}( |$)" <<< " $ALL "; then CHANGED="$CHANGED $m"; else SCOPE_OK=0; fi ;;
                    *) SCOPE_OK=0 ;;
                  esac
                done <<< "$RELEVANT"
                if [ "$SCOPE_OK" -eq 0 ]; then
                  echo "Decision: a changed path is not cleanly attributable -> full-fleet (safety)."
                  CHANGED="$ALL"
                else
                  # Include direct and transitive consumers of the small shared libraries.
                  CHANGED="$CHANGED $(python3 .github/scripts/service-ci-library-dependents.py "$ALL" <<< "$FILES_GLOBAL")"
                  # (No dedup here: the matrix JSON below is built with `sort -u`, so a service
                  # named by both its src and a pact edge collapses to one job downstream.)
                  # DST-harness edge (ADR-0115/#267) — same as the PR path.
                  if { grep -qE '(^| )openbank-(ledger|balance|transaction|billing|interest|statement)-service( |$)' <<< " $CHANGED " \
                       || grep -qE '(^| )openbank-sepa-payment( |$)' <<< " $CHANGED " \
                       || grep -qE '(^| )openbank-settlement-service( |$)' <<< " $CHANGED "; } \
                     && ! grep -qE '(^| )openbank-simulation( |$)' <<< " $CHANGED "; then
                    CHANGED="$CHANGED openbank-simulation"
                  fi
                  # Generated-client edge (ADR-0319) — same as the PR path.
                  if grep -qE '(^| )openbank-product-catalog( |$)' <<< " $CHANGED " \
                     && ! grep -qE '(^| )openbank-client-product-catalog( |$)' <<< " $CHANGED "; then
                    CHANGED="$CHANGED openbank-client-product-catalog"
                  fi
                  CHANGED="$CHANGED $(python3 .github/scripts/derive-fleet-scanning-test-modules.py \
                    --expand "$CHANGED" --input-paths-stdin <<< "$FILES_GLOBAL")"
                  # Recipe-only change -> one canary (same as the PR path).
                  if [ -z "${CHANGED// /}" ] \
                     && grep -qE '^(\.github/workflows/(services-ci|_service-ci)\.yml|\.github/scripts/(service-ci-pact-modules\.sh|service-ci-library-dependents\.py|(test-)?await-admin-ui-pact-publication\.py))$' <<< "$FILES"; then
                    CHANGED="openbank-libs"
                  fi
                  echo "Decision: scoped main-push build -> ${CHANGED:-<none>}"
                fi
              fi
            fi
          else
            BASE="origin/${{ github.base_ref }}"
            # Persistent self-hosted runners REUSE the git workdir between jobs,
            # so the `origin/<base>` remote-tracking ref can be stale from an
            # earlier run. Force it to the true remote tip with an explicit
            # refspec (a bare `git fetch origin main` updates FETCH_HEAD but does
            # NOT reliably move refs/remotes/origin/main). A stale base silently
            # mis-computes the diff and under-builds changed services — a
            # branch-protection hole. Full depth (no --depth=1): a shallow graft
            # would break merge-base once main advances past this PR's base.
            git fetch --no-tags --force origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
              >/dev/null 2>&1 || { echo "::error::Cannot refresh ${BASE}; build scope is unknown."; exit 1; }
            # Compute the merge-base explicitly rather than leaning on the
            # three-dot shorthand's ref resolution, then diff from it. Equivalent
            # to BASE...HEAD but observable and robust to odd ref state.
            MB=$(git merge-base "$BASE" HEAD 2>/dev/null) || { echo "::error::Cannot find merge-base with ${BASE}; build scope is unknown."; exit 1; }
            DIFF_BASE="$MB"
            FILES=$(git diff --name-only "$MB" HEAD)
            echo "Detect: base=$BASE merge-base=$MB changed-files=$(echo "$FILES" | grep -c . || true)"
            echo "Changed files:"; echo "$FILES" | sed 's/^/  /'

            # Code-global inputs every module compiles/tests against -> rebuild all.
            # Except a lib's own test sources (filter-lib-test-only-paths.py header).
            # (openbank-libs*, version catalog, root build, gradle.properties,
            # build-logic.) A change here can alter any service's compile or test
            # inputs, so the whole fleet must rebuild.
            # NB: feed grep via a here-string, NOT `echo "$FILES" | grep -q`: under
            # pipefail the SIGPIPE (141) racily reads a match as FALSE and drops modules.
            # Governance catalogs (openbank-libs/governance/) are data for CI
            # checks + admin-ui, not a compile/test input of any module — an
            # ADR/control-catalog edit must not cost a 28-module fleet run.
            #
            # `openbank-libs/` alone is stale since ADR-0122 split the module in two
            # (#33/#34): openbank-libs-domain and openbank-libs-runtime are compiled
            # into EVERY service exactly like openbank-libs was, and
            # openbank-libs-testing supplies the shared Pact/authz/outbox conformance
            # kits every service's test source set depends on (testImplementation) —
            # i.e. it can change *how* a provider's Pact verification test runs
            # without touching that provider's own src/ or any pacts/*.json, and
            # without a `pacts/` diff to catch it downstream (issue #1208 triage,
            # gap #2). A literal `^openbank-libs/` prefix does not match any of the
            # three split module names, so before this fix a change to any of them
            # fell through to the per-module fan-out below and rebuilt only that
            # module itself — a silent under-build of every other service's compile
            # and Pact-provider-test inputs. auto-deploy.yml's analogous SHARED_CHANGED
            # check already lists openbank-libs-domain/openbank-libs-runtime
            # explicitly (#376); this brings services-ci.yml's PR-path trigger in
            # line with it, plus openbank-libs-testing (auto-deploy correctly omits
            # it — it's test-only, never shipped in a runtime image).
            # Release-bookkeeping paths are inert here for the SAME reason the push path
            # above already treats them as inert (the `RELEVANT` filter): version.txt,
            # CHANGELOG.md and the release-please manifest cannot alter any module's
            # compile inputs or any pact. Without this the PR lane fanned out per-module
            # on `^<module>/`, so every release-please PR built the service it bumps —
            # 194 of them in the week of 2026-07-25, each a build of a two-line diff whose
            # post-merge push is then skipped as inert anyway. It also makes the single
            # aggregated Release PR (separate-pull-requests: false) build NOTHING rather
            # than full-fleet, which is what makes the aggregation affordable.
            # The version bump is not unchecked: check-app-version-override.sh holds the
            # quarkus.application.version invariant and check-admin-ui-version-sync.sh the
            # package.json one, both unconditionally in the gate job.
            FILES_CODE=$(grep -vE '^openbank-libs/governance/|(/version\.txt$)|(/CHANGELOG\.md$)|(^\.release-please-manifest\.json$)|(^release-please-config\.json$)' <<< "$FILES" || true)
            FILES_GLOBAL=$(python3 .github/scripts/filter-lib-test-only-paths.py <<< "$FILES_CODE")
            # Match the push selector: an exact raised-floor-only diff stays local.
            if grep -Fxq 'openbank-libs-domain/build.gradle.kts' <<< "$FILES_GLOBAL" && python3 .github/scripts/coverage-floor-only-diff.py --base "$DIFF_BASE"; then
              echo "Decision: shared domain build script changes only its raised coverage floor."
              FILES_GLOBAL=$(grep -vFx 'openbank-libs-domain/build.gradle.kts' <<< "$FILES_GLOBAL" || true)
            fi
            if grep -qE '^(openbank-libs[^/]*/|gradle/|settings\.gradle\.kts|build\.gradle\.kts|gradle\.properties|build-logic/)' <<< "$FILES_GLOBAL"; then
              echo "Decision: code-global change -> build all modules."
              CHANGED="$ALL"
            else
              echo "Decision: per-module fan-out (no code-global change)."
              CHANGED=""
              for m in $ALL; do
                if grep -qE "^${m}/" <<< "$FILES_CODE"; then
                  CHANGED="$CHANGED $m"
                fi
              done
              CHANGED="$CHANGED $(python3 .github/scripts/service-ci-library-dependents.py "$ALL" <<< "$FILES_GLOBAL")"
              # A changed pact builds BOTH sides, exactly as the main-push path above already
              # does. Without this the PR path attributes files ONLY by `^<module>/`, so a
              # pact-only PR matched no module, built nothing, and merged green — then broke the
              # PROVIDER's build on main, where nobody is watching a service they did not touch.
              # That is #8697: three consumer pacts gained a "no valid M2M identity is presented"
              # interaction, transaction-service had no such provider state, and main went red
              # with the causing PR long merged (issue #8984).
              # Derivation matches the push path (split on the LAST '-openbank-'). A consumer that
              # is not a Gradle module is skipped rather than failing the scoping: openbank-admin-ui
              # authors five of the committed pacts and builds in its own workflow. A PROVIDER that
              # does not resolve to a module is not skippable — it is the side that verifies — so
              # that falls back to the full fleet, the safe direction this detector always takes.
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                base=$(basename "$f" .json)
                case "$base" in
                  *-openbank-*) ;;
                  *) echo "Pact ${f} does not carry a '<consumer>-openbank-<provider>' name -> full-fleet."
                     CHANGED="$ALL"; break ;;
                esac
                prov="openbank-${base##*-openbank-}"
                cons="${base%-openbank-*}"
                if ! grep -qE "(^| )${prov}( |\$)" <<< " $ALL "; then
                  echo "Pact ${f} names provider ${prov}, which is not a module -> full-fleet."
                  CHANGED="$ALL"; break
                fi
                CHANGED="$CHANGED $prov"
                if grep -qE "(^| )${cons}( |\$)" <<< " $ALL "; then CHANGED="$CHANGED $cons"; fi
              done <<< "$(grep -E '^pacts/.*\.json$' <<< "$FILES_CODE" || true)"
              # DST harness dependency edge (ADR-0115). openbank-simulation validates money-path
              # invariants against the ledger/balance/transaction domains, but this detector is
              # per-directory, NOT dependency-aware: a change to one of those services would build
              # only that service and silently skip the simulation that depends on it. Add the edge
              # explicitly so the invariant checker runs on every money-path change (it already runs
              # on its own edits, on push to main, and nightly). Code-global changes (libs etc.)
              # already build everything incl. the simulation, so this only matters per-module.
              # Issue #267 (ADR-0100 full-service adoption) extended the same project-dependency
              # binding to sepa-payment (directory openbank-sepa-payment, no "-service" suffix)
              # and settlement-service. Billing, interest and statement are also imported into
              # the DST runner: without these edges their domain changes could ship without
              # running the invariant/fault sweep that exercises them.
              if { grep -qE '(^| )openbank-(ledger|balance|transaction|billing|interest|statement)-service( |$)' <<< " $CHANGED " \
                   || grep -qE '(^| )openbank-sepa-payment( |$)' <<< " $CHANGED " \
                   || grep -qE '(^| )openbank-settlement-service( |$)' <<< " $CHANGED "; } \
                 && ! grep -qE '(^| )openbank-simulation( |$)' <<< " $CHANGED "; then
                echo "Decision: money-path change -> add openbank-simulation (DST harness, ADR-0115/#267)."
                CHANGED="$CHANGED openbank-simulation"
              fi
              # Generated-client edge (ADR-0319): the client's input is the provider's openapi.yaml.
              if grep -qE '(^| )openbank-product-catalog( |$)' <<< " $CHANGED " \
                 && ! grep -qE '(^| )openbank-client-product-catalog( |$)' <<< " $CHANGED "; then
                CHANGED="$CHANGED openbank-client-product-catalog"
              fi
              # Derive cross-module test readers from filtered inputs (#11513, #11560).
              CHANGED="$CHANGED $(python3 .github/scripts/derive-fleet-scanning-test-modules.py \
                --expand "$CHANGED" --input-paths-stdin <<< "$FILES_GLOBAL")"
              # A change to the CI recipe itself (services-ci / _service-ci) can NOT
              # alter any service's compile/test inputs, so it does NOT warrant a
              # 28-module fan-out -- that is what turned the trivial #547 cache-flag
              # flip into a flaky full-fleet run. The recipe still needs validating
              # end-to-end, so build ONE canary: openbank-libs runs the same job
              # template -- checkout, toolchain, setup-gradle and :build (each service's
              # tests boot their own Testcontainers, #578; there is no shared infra boot
              # step left to exercise) -- exercising the entire recipe on a single job.
              # Skip the canary if a real service is already in the matrix (it validates
              # the recipe too).
              if [ -z "${CHANGED// /}" ] \
                 && grep -qE '^(\.github/workflows/(services-ci|_service-ci)\.yml|\.github/scripts/(service-ci-pact-modules\.sh|service-ci-library-dependents\.py|(test-)?await-admin-ui-pact-publication\.py))$' <<< "$FILES"; then
                echo "Decision: recipe-only change -> build canary openbank-libs."
                CHANGED="openbank-libs"
              fi
            fi
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] \
             && service_ci_has_unowned_input "$ALL" <<< "$FILES"; then
            CHANGED="$ALL"
            echo "Decision: unowned PR input -> full-fleet."
          fi

          # Empty selection is valid; tolerate grep exit 1.
          CHANGED=$(echo "$CHANGED" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' || true)
          # Emit both module-plan formats from the same validated changed-file set.
          printf '%s\n' "${FILES:-}" | python3 .github/scripts/derive-verification-modules.py >> "$GITHUB_OUTPUT"
          echo "Modules to build: ${CHANGED:-<none>}"
          if [ -z "${CHANGED// /}" ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' $CHANGED | sort -u | jq -R . | jq -cs .)
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # Admission rejection leaves the trusted base in a depth-1 checkout. The
      # all-green job fails closed on admission=false; do not run a PR diff here
      # until the full PR checkout above has actually happened.
      - name: Require service documentation with production changes
        if: github.event_name == 'pull_request' && steps.admit.outputs.proceed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            .github/scripts/check-service-docs-freshness.py \
            .github/scripts/check-service-docs-freshness_test.py \
            .github/workflows/services-ci.yml; then
            python3 .github/scripts/check-service-docs-freshness_test.py
          fi
          python3 .github/scripts/check-service-docs-freshness.py --base "$BASE_SHA" --head "$HEAD_SHA"

  publication-ready:
    name: Await exact-SHA Admin UI Pact publication
    # Only a hosted runner waits. The broker is private, so the published job's
    # exact-SHA GitHub result is the cross-workflow handoff before ARC verification.
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.admin-ui-pact-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 37
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require verified publication before provider builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/test-await-admin-ui-pact-publication.py
          python3 .github/scripts/await-admin-ui-pact-publication.py

  build:
    needs: [changes, publication-ready]
    if: always() && needs.changes.outputs.any == 'true' && (needs.publication-ready.result == 'success' || needs.publication-ready.result == 'skipped')
    # The reusable workflow assumes openbank-arc-build-runner via GitHub OIDC for ECR auth
    # (needed on the Hetzner pool, which has no ambient AWS creds). A job that calls a reusable
    # workflow must grant the token here; the callee cannot elevate beyond the caller.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Cap concurrent matrix jobs. Each matrix entry now fans out into _service-ci.yml's
      # `build` job (ubuntu-latest, EVERY event including main-push, ADR-0250 Phase 2, #4414)
      # plus, on main-push only, a `contract` job on the self-hosted `openbank-build` ARC pool.
      #
      # The governing constraint for `build` is GitHub's 20-concurrent-hosted-job cap, shared
      # ACCOUNT-WIDE with every other repo and workflow — not the old self-hosted-pool AIO
      # rationale this comment used to carry (Hetzner/Redpanda async-I/O contexts, #1329/
      # 2026-06-23). That rationale is stale for `build` specifically: it never applied to a
      # hosted runner, and `build` runs hosted on every event now, including main-push, which
      # is the event that changed. It is NOT stale for `contract`, which is still self-hosted
      # and still bounded by the same ARC pool (12 runners, Phase 1, #4319) — max-parallel is
      # a single number governing the WHOLE matrix, so it bounds both jobs' concurrency at
      # once. Eight stays below the 12-runner ARC pool, leaving four slots for targeted
      # verification/deploy work when contract jobs can run.
      # On PRs the contract job is skipped, so twelve matrix lanes use hosted runners only
      # and leave eight of the account's twenty hosted slots for other workflows. On main,
      # schedules and manual runs, retain eight lanes to preserve ARC capacity.
      #
      # Full-fleet PR run 37403901088: 79 hosted builds used 603 runner-minutes; eight
      # lanes stayed occupied for almost all of the 79-minute build span. Twelve lanes
      # lower the work floor from ~75 to ~50 minutes; hosted timing still needs measurement.
      max-parallel: ${{ github.event_name == 'pull_request' && 12 || 8 }}
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: ${{ matrix.service }}
    # Pass the Pact Broker password only when the callee's contract job can run
    # (ADR-0092). PRs and schedules must not receive a write-capable broker secret.
    # vars.PACT_BROKER_URL/_USERNAME are available to the callee automatically.
    # Named explicitly rather than `secrets: inherit` — inherit hands the called
    # workflow EVERY repo secret, and this is the only one it reads.
    secrets:
      PACT_BROKER_PASSWORD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.PACT_BROKER_PASSWORD || '' }}

  # Single required status check that aggregates the matrix, so branch protection
  # can require "Services CI / all-green" without enumerating every service.
  # Human PRs never get their verification metadata refreshed: the producer
  # (dependabot-verification-metadata.yml) is gated on
  # `github.actor == 'dependabot[bot]'`, deliberately, because it pushes a commit
  # back to the PR branch. So this VERIFIES instead of writing — regeneration runs
  # against a throwaway copy and the committed file is restored, which keeps that
  # trust boundary intact while still catching an unpinned artifact. See #3218.
  #
  # Scoped to modules whose build files changed, with one process and timeout per
  # module. A real 11-module PR exceeded the old single-job 30-minute budget twice;
  # the verifier already regenerates each module independently to bound heap use.
  verification-metadata:
    name: verification-metadata (${{ matrix.module }})
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.verification-modules != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.verification-modules-json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # READ-ONLY. This job cannot get an exact-key hit from setup-java's own
          # `cache: gradle` — that key hashes `**/*.gradle*`, and this job only runs
          # when a build file changed, so the key's input has changed by construction.
          # What it did instead was WRITE a fresh ~1.1 GB Gradle-home entry per PR into
          # a pool already over the 10 GB ceiling, evicting other jobs' caches (#3299).
          # Reading the shared entry maintained by the writing lanes (_service-ci.yml's
          # self-hosted lane, auto-deploy.yml) is a better hit and costs the pool nothing.
          cache-read-only: true

      - name: Check verification metadata covers the changed modules
        run: |
          python3 .github/scripts/check-verification-metadata-complete.py \
            --modules "${{ matrix.module }}" --enforce

  # SCOPE: this job is about SERVICE BUILDS ONLY — despite the name (#3955).
  #
  # `needs` is the whole story: `changes`, `publication-ready`, `build`, `verification-metadata`. It never observes
  # ci.yml's `gates (*)` shards, and therefore says nothing about `Validate manifests`, which
  # aggregates them. Both are required contexts in the `main-protection` ruleset, and it is the
  # PAIR that covers builds + gates — neither half alone is merge-readiness.
  #
  # This is not theoretical. On #3932 this job reported SUCCESS at 23:08:08 while
  # `Validate manifests` had already reported FAILURE at 23:04:58 on the same commit — three
  # minutes earlier, so not a race. The ruleset held (the PR stayed BLOCKED and merged only once
  # `Validate manifests` went green), but a reader scanning the checks list for `all-green ✓`
  # would have called that PR ready, and so would anything keying off this context alone.
  #
  # So: do not treat a green here as "the PR is mergeable", and do not add a downstream consumer
  # that does. The name overpromises and cannot cheaply be fixed — a required context cannot be
  # renamed in place (see the same warning on issue-hygiene.yml); it takes a two-step ruleset
  # change. #3955 tracks that decision.
  all-green:
    name: all-green
    needs: [changes, publication-ready, build, verification-metadata]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Verify no service failed
        run: |
          if [ "${{ needs.changes.result }}" != 'success' ] || [ "${{ needs.changes.outputs.admission }}" != 'true' ]; then
            echo "Agent PR admission refused or failed; service builds did not run."; exit 1
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Changed-service detection did not succeed; build scope is unknown."; exit 1
          fi
          if [ "${{ needs.changes.outputs.admin-ui-pact-changed }}" = "true" ] \
             && [ "${{ needs.publication-ready.result }}" != "success" ]; then
            echo "Exact-SHA Admin UI Pact publication was not proven; refusing a green service gate."; exit 1
          fi
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "One or more service builds failed."; exit 1
          fi
          if [ -n "${{ needs.changes.outputs.verification-modules }}" ] \
             && [ "${{ needs.verification-metadata.result }}" != "success" ]; then
            echo "verification-metadata has no successful verdict for changed build files (#3218)."; exit 1
          fi
          echo "All changed services built green (or nothing to build)."
      # `needs.build.result` can report success when a reusable matrix child was cancelled
      # before receiving a runner (run 37347641780: Treasury cancelled, all-green passed).
      # Audit every selected build in this exact attempt instead of trusting that summary.
      - name: Require every selected service build to pass
        if: needs.changes.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
          JOB_FILE: ${{ runner.temp }}/service-ci-jobs.ndjson
        run: |
          set -euo pipefail
          # A transient Jobs API 502 made run 37789735793 red after all 79 builds
          # passed. Fetch into a temporary file on EACH attempt: pagination may have
          # emitted partial output before failing, and a retry must never duplicate it.
          for attempt in 1 2 3; do
            if gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | {name,conclusion}' > "${JOB_FILE}.pending" 2> "${JOB_FILE}.error"; then
              mv "${JOB_FILE}.pending" "$JOB_FILE"
              rm -f "${JOB_FILE}.error"
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'HTTP 5[0-9][0-9]' "${JOB_FILE}.error"; then
              cat "${JOB_FILE}.error" >&2
              exit 1
            fi
            sleep $(( attempt * 5 ))
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          services = json.loads(os.environ["SERVICES_JSON"])
          if not isinstance(services, list) or not services or len(services) != len(set(services)):
              raise SystemExit("Invalid selected-service matrix")
          expected = {f"build ({service}) / {service} (build)" for service in services}
          observed = {}
          for line in Path(os.environ["JOB_FILE"]).read_text().splitlines():
              job = json.loads(line)
              name = job["name"]
              if name.startswith("build (") and name.endswith(" (build)"):
                  observed.setdefault(name, []).append(job["conclusion"])
          if set(observed) != expected:
              missing = sorted(expected - set(observed))
              extra = sorted(set(observed) - expected)
              raise SystemExit(f"Service build roster mismatch: missing={missing}, extra={extra}")
          bad = {name: verdicts for name, verdicts in observed.items() if verdicts != ["success"]}
          if bad:
              raise SystemExit(f"Service builds without one successful verdict: {bad}")
          print(f"Verified {len(expected)} selected service builds in this workflow attempt")
          PY

  # Nightly-only: turn a failed full-fleet build into an actionable, deduplicated issue.
  # Runs solely for the scheduled run so PR/push failures (already visible as red checks)
  # don't spam issues.
  nightly-health-alert:
    name: nightly fleet-health alert
    needs: [changes, build]
    if: always() && github.event_name == 'schedule' && (needs.build.result == 'failure' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # actions/github-script (not the `gh` CLI): the self-hosted `openbank-build`
      # runners have no `gh` binary, so the previous `gh issue create` step failed
      # with `gh: command not found` (exit 127) on every nightly — the fleet rotted
      # red for days with NO issue ever opened. github-script talks to the REST API
      # over the runner's bundled node, which IS present (it runs admin-ui and other
      # JS actions), so the alert actually fires.
      - name: Open or update the fleet-health tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const detected = new Date().toISOString();
            // Dedupe on the BUILD-specific marker label, NOT the shared 'fleet-health'
            // umbrella: the fleet-lint alert also carries 'fleet-health', so deduping on
            // the umbrella made this build alert comment its breakage onto whatever
            // fleet-health issue was open (usually the LINT one) instead of opening its
            // own — the build rot then hid as a comment on an unrelated issue for days.
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'fleet-health-build',
            });
            if (open.length > 0) {
              const n = open[0].number;
              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: `Still failing as of the latest nightly full-fleet run.\n\nRun: ${runUrl}\nDetected: ${detected}`,
              });
              core.info(`Commented on existing fleet-health-build issue #${n}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo,
                title: 'Nightly full-fleet build is failing',
                labels: ['fleet-health', 'fleet-health-build', 'bug'],
                body: `The scheduled full-fleet build failed — a service on \`main\` no longer compiles or its tests are red, even though no recent PR touched it (path-scoped CI cannot catch this). Investigate which module is red in the run and open a fix PR.\n\nRun: ${runUrl}\nDetected: ${detected}`,
              });
              core.info(`Opened a new fleet-health issue #${created.number}.`);
            }
