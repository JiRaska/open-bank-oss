#
# Admin-UI CI build and deploy (ADR-0029 Layer B).
#
# Triggered by successful main-branch CI, Services CI, and Pact workflow completions
# after a one-shot exact-source readiness check; manual and scheduled runs remain
# available for recovery. This
# mirrors openbank-infra/scripts/build-push-admin-ui.sh: runs all repo-derived
# collectors, builds the Next.js image, pushes to ECR, then pins the image on the bot-owned
# deploy/sandbox branch (ADR-0358) as a signed GitHub App commit; ArgoCD's admin-ui
# Application renders from that pin. No PR into main, so a deploy never moves main and never
# waits on the merge train. admin-ui-repin.yml re-pins the manifests after a manifest change.
#
# This eliminates the manual rebuild step that previously caused release notes
# and governance data (ADR list, threat models, service catalog) to go stale
# between operator-triggered builds.
#
# Key differences from the local script for CI:
#   - OIDC replaces AWS SSO profiles (configure-aws-credentials sets env vars
#     that the AWS CLI picks up automatically, overriding AWS_PROFILE).
#   - --no-sbom: Gradle sbomAll is skipped (too heavy for CI). Instead, the
#     per-service-sboms artifact from the latest security.yml run is downloaded
#     and staged at openbank-*/build/reports/bom.json before the Docker build,
#     so the sbom-collector stage in the Dockerfile bundles them automatically.
#   - The pin is written by .github/scripts/publish-deploy-pin.py, not sed+git.
#
# Security:
#   - OIDC → arn:aws:iam::265175468565:role/openbank-arc-build-runner (same as
#     auto-deploy.yml, has ECR push + KMS cosign alias/openbank-cosign-signing).
#   - The pin lands on deploy/sandbox, whose ruleset admits only the deploy App, requires
#     signed commits and forbids force-push and deletion. The commit is checked against the
#     deploy-pin-branch-contract before it is written (check-deploy-pin-branch.py).
#   - A GitHub App installation token (GITOPS_APP_ID + GITOPS_APP_PRIVATE_KEY) writes it:
#     GitHub signs createCommitOnBranch only for an App token. There is no fallback.

name: Admin-UI deploy

on:
  # Every main push starts both Services CI and CI. Their successful completions
  # trigger a one-shot exact-source readiness check; the check admits only after
  # both are green and Pact is green when this source triggered Pact. The daily
  # run is recovery when GitHub suppresses or delays an event.
  workflow_run:
    # Reject PR-branch completions before allocating a workflow run (Refs #9031).
    branches: [main]
    # Services CI produces fleet envelopes; CI produces the Admin UI envelope; Pact
    # publishes verified contracts. Each completion rechecks all exact-source gates.
    workflows: ["Services CI", "CI", "Pact drift check"]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  # CI and Services CI already start on every main push. Their completion events
  # provide the source-change liveness path without holding a runner during validation.
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger (informational)"
        required: false
        default: "manual"

# Restrictive top-level default (Scorecard Token-Permissions wants an explicit top-level
# block); the build-push job below declares its own override for the access it needs.
permissions:
  contents: read

concurrency:
  # One admin-ui deploy at a time — a second push while a deploy PR is open would
  # produce conflicting image tags. cancel-in-progress must stay FALSE: the
  # build-push job pushes to ECR and only then signs + attests (build-push-admin-ui.sh
  # → cosign_sign_and_attest), so cancelling mid-job can strand a pushed-but-unattested
  # image that Kyverno's verify-images policy denies on the next reschedule — days
  # later, far from the cause (same hazard auto-deploy.yml documents). Queueing is
  # safe: GitHub keeps only the newest pending run per group, so the latest commit
  # still wins — it just waits for the in-flight deploy to finish signing.
  # Job-level `if:` is evaluated only after concurrency admission. A workflow_run that is
  # successful but belongs to an OLDER main SHA can therefore enter the shared queue, evict the
  # pending deploy for a newer push, and only then discover that it must skip. That exact race
  # cancelled the pending Test Intelligence deploy for 29dc20e2 in favour of a stale evidence
  # refresh (#7211). Keep every source in a SHA-scoped queue; deploy-source independently
  # rejects a source SHA that has been superseded by build-relevant work before the privileged
  # build. This also serializes a scheduled refresh with a workflow_run refresh for the same main
  # tip. Without that boundary both build distinct immutable tags, update the same PR branch and
  # invalidate its exact-head review and required checks (#9657). A waiting source remains eligible
  # when main advanced solely through
  # this workflow's own image-pin commit; otherwise that harmless commit can starve the source that
  # produced it and leave newer UI code undeployed.
  # A failed/cancelled upstream workflow_run is skipped by deploy-source. It must not
  # replace a pending successful source before that job can evaluate its `if:`; repeated
  # non-verdict completions for one SHA otherwise starve the actual deploy.
  group: >-
    admin-ui-deploy-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && 'nonverdict' || 'eligible' }}
  cancel-in-progress: false

jobs:
  deploy-source:
    name: Authorize deploy source
    # A GitOps image bump runs the ordinary CI workflows on main. Their successful
    # workflow_run event has no head_commit payload, so the old build-push condition
    # could not recognise the self-generated `chore(admin-ui): deploy ...` commit and
    # rebuilt the image again. Resolve the exact producer SHA before allocating the
    # arm64/OIDC build job and expose one closed boolean to the downstream job.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Readiness runs are serialized so overlapping CI/Pact/Services-CI completions
    # cannot race duplicate-PR admission. A later event retries if another validator
    # was pending. No polling runner is held open for an upstream completion.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && 'admin-ui-evidence-source' || format('admin-ui-source-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
    outputs:
      proceed: ${{ steps.post_validation.outputs.proceed }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      # Always checkout the event's trusted default-branch revision. In particular, a
      # workflow_run must never feed its payload SHA into checkout: that trigger carries
      # repository secrets and a write-capable downstream job, so coupling it to a payload
      # ref is a repository-compromise primitive even when today's branch filter says main.
      # workflow_run.head_sha remains queue metadata above; no file from that payload SHA is
      # executed. deploy-source proves the checked-out revision against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 1
      # Use the existing installation with only this repository's read permissions.
      # A configured App mint failure is terminal; never fall back after a failed mint.
      - name: Mint repository read token
        id: read_token
        if: env.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - id: source
        name: Reject stale or self-generated deploy source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          bash .github/scripts/check-admin-ui-deploy-admission.sh "$source_sha" "$EVENT_NAME"
      - id: validation
        name: Require exact-source Admin UI validation
        if: steps.source.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            # Pending counterpart workflows emit their own completion event and retry.
            python3 .github/scripts/await-admin-ui-source-validation.py --check | tee -a "$GITHUB_OUTPUT"
          else
            # Operator and recovery runs retain bounded waiting semantics.
            python3 .github/scripts/await-admin-ui-source-validation.py
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi
      # Recheck eligibility after the readiness check or manual/scheduled wait. Main may
      # have advanced while waiting or while queued for serialized build admission.
      - id: post_validation
        name: Recheck deploy source after validation
        if: steps.validation.outputs.proceed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
        run: bash .github/scripts/check-admin-ui-deploy-admission.sh "${{ steps.source.outputs.source_sha }}" "$EVENT_NAME"

  build-push:
    name: Build + push admin-ui
    # Source jobs finish before this job starts. Serialize builds across their
    # SHA-scoped workflow runs so they cannot race on the same GitOps PR branch.
    # Never cancel a running build between image push and signing/attestation.
    concurrency:
      group: admin-ui-build-push
      cancel-in-progress: false
    # Skip if the push was generated by this workflow's own GitOps PR (loop-breaker).
    # The GitOps commit message always starts with "chore(admin-ui): deploy".
    #
    # The PR step now scopes the deploy commit to the GitOps manifest, which prevents a direct
    # push-path match. CI still runs for that main commit, though, and its workflow_run completion
    # is a second trigger route; deploy-source closes that route using the producer's exact SHA.
    # `deploy-source` resolves workflow_run.head_sha and rejects a deploy generated
    # by this workflow before this privileged, arm64 build job can start.
    needs: deploy-source
    if: needs.deploy-source.outputs.proceed == 'true'
    # Native arm64 GitHub-hosted runner (free on public repos): the admin-ui image
    # is linux/arm64. ECR push + cosign use the same GitHub-OIDC role as before.
    runs-on: ubuntu-24.04-arm
    permissions:
      # The pin is written with the GitHub App token, never with GITHUB_TOKEN (ADR-0358).
      contents: read
      id-token: write  # GitHub OIDC → openbank-arc-build-runner
      actions: read    # gh run list / gh run download for SBOM staging; also read by
                       # collect-gate-health.mjs (ADR-0255) for the same reason — no new grant
    timeout-minutes: 30
    env:
      ECR_REGISTRY: "265175468565.dkr.ecr.eu-north-1.amazonaws.com"
      ECR_REPO: openbank-admin-ui
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      # Read-only token for the separate private customer-app repository. It is optional:
      # missing scope/evidence renders an explicit blocked client row; it never blocks deploy.
      APP_RO_TOKEN: ${{ secrets.OPENBANK_APP_RO_TOKEN }}

    outputs:
      tag: ${{ steps.build.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact SHA validated by deploy-source, never a workflow_run payload ref.
          ref: ${{ needs.deploy-source.outputs.source_sha }}
          # Full history — collect-dora.mjs walks git log for deployment frequency.
          fetch-depth: 0
          # persist-credentials: true (default) — needed so git in the collectors
          # can read the repo; the gitops step uses a separate checkout.

      # This job is serialized behind other image pushes. Recheck after acquiring that
      # slot: a validated source can become stale while queued. A false result skips every
      # later step, including OIDC, registry login, image publication and GitOps writes.
      # Use the existing installation with only this repository's read permissions.
      # A configured App mint failure is terminal; never fall back after a failed mint.
      - name: Mint repository read token
        id: read_token
        if: env.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - id: build_admission
        name: Recheck source at serialized build entry
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
        run: bash .github/scripts/check-admin-ui-deploy-admission.sh "${{ needs.deploy-source.outputs.source_sha }}" "$EVENT_NAME"

      - name: Checkout mobile RUM capability metadata
        if: ${{ steps.build_admission.outputs.proceed == 'true' && env.APP_RO_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JiRaska/openbank-app
          token: ${{ secrets.OPENBANK_APP_RO_TOKEN }}
          path: .app-src
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.build_admission.outputs.proceed == 'true'
        with:
          # Matches the runtime image (openbank-admin-ui/Dockerfile: node:26-alpine). Pinned at 20
          # it was three majors behind what ships, and #3569's jsdom bump made that fatal:
          # jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26 and pulls undici 8, whose
          # cachestorage calls webidl.util.markAsUncloneable. On 20 every vitest worker died
          # with "Failed to start forks worker", the run collected ZERO tests, and the job
          # still reported a plain red — engine-strict is off, so npm ci installed it happily.
          node-version: "26"
          cache: 'npm'
          cache-dependency-path: openbank-admin-ui/package-lock.json

      - name: Install admin-ui dependencies
        if: steps.build_admission.outputs.proceed == 'true'
        # Needed by the collector scripts (generate-governance.mjs, etc.) which
        # import `yaml` and other packages from openbank-admin-ui/node_modules.
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: openbank-admin-ui

      - name: Configure AWS credentials (GitHub OIDC)
        if: steps.build_admission.outputs.proceed == 'true'
        # Sets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN in env.
        # The role has ECR push + KMS sign permissions.
        # See "Stub AWS profile" step below for why a stub ~/.aws/config entry is also needed.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1

      - name: Stub AWS profile for build script
        if: steps.build_admission.outputs.proceed == 'true'
        # build-push-admin-ui.sh hard-codes `export AWS_PROFILE="${AWS_PROFILE:-openbank}"`
        # for local SSO use. In CI, the OIDC env vars are the real credentials, but the
        # AWS CLI throws "config profile not found" before reaching the env-var provider
        # if the named profile doesn't exist in ~/.aws/config. Creating a minimal stub
        # (region only, no credentials) makes the profile loader succeed; the CLI then
        # falls through to AWS_ACCESS_KEY_ID / AWS_SESSION_TOKEN from the OIDC step.
        run: |
          mkdir -p ~/.aws
          # Idempotent: on PERSISTENT runners (Hetzner/Mac) a bare `>>` appended a
          # duplicate [profile openbank] section every run; awscli v2 then rejects the
          # whole file ("Unable to parse config file"), breaking aws for any other job
          # that lands on the same host (e.g. tofu plan/apply on the openbank-batch pool).
          # Only add the stub if it isn't already present.
          grep -q '^\[profile openbank\]' ~/.aws/config 2>/dev/null \
            || printf '[profile openbank]\nregion = eu-north-1\n' >> ~/.aws/config

      - name: Clear stale ECR credentials (macOS keychain)
        if: ${{ steps.build_admission.outputs.proceed == 'true' && runner.os == 'macOS' }}
        run: |
          docker logout "$ECR_REGISTRY" 2>/dev/null || true
          # docker logout clears ~/.docker/config.json but leaves the osxkeychain entry;
          # the subsequent docker login then fails with "already exists in the keychain".
          security delete-internet-password -s "$ECR_REGISTRY" 2>/dev/null || true
          # Remove credsStore=osxkeychain from Docker config so amazon-ecr-login stores
          # credentials in the config file rather than the macOS Keychain. The Keychain
          # requires interactive unlocking (-25308: errSecInteractionNotAllowed) which
          # fails in non-interactive CI sessions. File-based credentials are safe here:
          # the runner is ephemeral per-job and ECR tokens expire in 12 h anyway.
          python3 -c "import json,pathlib; p=pathlib.Path.home()/'.docker'/'config.json'; d=json.loads(p.read_text()) if p.exists() else {}; d.pop('credsStore',None); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(d))"

      - name: ECR login
        if: steps.build_admission.outputs.proceed == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Rebuild ob-deploy-builder with native arm64 image
        if: steps.build_admission.outputs.proceed == 'true'
        # ob-deploy-builder's BuildKit container was created from an amd64 moby/buildkit
        # image. On OrbStack arm64, the amd64 container runs via QEMU x86 emulation.
        # QEMU crashes with SIGILL when Node.js npm ci hits ARM instructions the bundled
        # QEMU version doesn't emulate.
        #
        # Fix: remove the amd64 BuildKit image from Docker's local cache (docker buildx rm
        # only removes the builder config, not the image), force-pull the arm64 variant,
        # then recreate the builder pinned to that image. The --driver-opt image= pin
        # ensures Docker uses the arm64 image we just pulled, not whatever is cached.
        run: |
          docker buildx rm ob-deploy-builder 2>/dev/null || true
          docker image rm moby/buildkit:buildx-stable-1 2>/dev/null || true
          docker pull --platform linux/arm64 moby/buildkit:buildx-stable-1
          docker buildx create \
            --name ob-deploy-builder \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:buildx-stable-1" \
            --platform linux/arm64 \
            --bootstrap \
            --use
          docker buildx inspect ob-deploy-builder

      - name: Initialize collector request trace directory
        if: steps.build_admission.outputs.proceed == 'true'
        run: |
          trace_dir="$(mktemp -d "${RUNNER_TEMP}/admin-ui-http-trace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX" 2>/dev/null || true)"
          if [ -n "${trace_dir}" ]; then
            printf 'ADMIN_UI_TRACE_DIR=%s\n' "${trace_dir}" >> "${GITHUB_ENV}"
          else
            echo "::warning::collector request trace directory unavailable; final trace will be incomplete"
            printf 'ADMIN_UI_TRACE_DIR=\n' >> "${GITHUB_ENV}"
          fi
      - name: Validate collector request-send tracing
        if: steps.build_admission.outputs.proceed == 'true'
        run: |
          if python3 .github/scripts/test-admin-ui-request-trace.py \
            && (cd openbank-admin-ui && node --test scripts/request-send-trace.test.mjs); then
            printf 'ADMIN_UI_TRACE_TESTS=passed\n' >> "${GITHUB_ENV}"
          else
            printf 'ADMIN_UI_TRACE_TESTS=failed\n' >> "${GITHUB_ENV}"
            echo "::warning::request-send trace fixture failed; collector report will be incomplete"
          fi
      - name: Stage per-service SBOMs from latest security run
        if: steps.build_admission.outputs.proceed == 'true'
        id: stage_sbom
        # security.yml uploads `per-service-sboms` (openbank-*-sbom.cdx.json). We download
        # and stage them as openbank-*/build/reports/bom.json so the Dockerfile
        # sbom-collector stage bundles them — without running Gradle here.
        #
        # Look the artifact up BY NAME across all runs (newest first), not by scanning a
        # window of recent security.yml runs. The run-window approach could not work:
        # security.yml runs on every main push (dozens/day) but emits per-service-sboms
        # only when dependencies change (its detect-deps gate), so the freshest SBOM is
        # routinely OLDER than the last 30 runs. Measured 2026-07-17: the 30-run window
        # spanned 18 h while the newest non-expired artifact was ~2 h older than its
        # oldest run — i.e. the scan missed it every single time, then slept 2×90 s
        # before degrading to "SBOMs unavailable". The retry+sleep never had a
        # mechanism to help: re-querying the same runs cannot conjure an artifact that
        # was never uploaded there. This is the same by-name lookup the JUnit staging
        # step below already uses.
        #
        # Provenance: per-service-sboms is uploaded only by security.yml's
        # sbom-per-service job, which is gated on detect-deps and never runs on PRs —
        # so the artifact always comes from a main push or a scheduled audit. The
        # head_branch == main filter below asserts that here rather than depending on a
        # condition in another workflow, because these SBOMs get baked into a shipped image.
        #
        # Best-effort: nothing to stage exits 0 (SBOMs degrade to "not available") but
        # emits a ::warning:: — the previous silent exit is what let this bug hide.
        #
        # Uses curl + python3 (not gh CLI) because the self-hosted Mac mini runner user
        # (/home/runner) does not have gh in PATH. curl and python3 are standard macOS tools.
        # Requires actions: read permission on GITHUB_TOKEN (added to permissions above).
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage sbom)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage sbom --auth github -- curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }
          staged=false
          # Sort by created_at ourselves: the API's ordering is not contractual.
          ARTIFACT=$(api \
            "https://api.github.com/repos/${REPO}/actions/artifacts?name=per-service-sboms&per_page=20" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('artifacts',[]) if not x['expired'] and (x.get('workflow_run') or {}).get('head_branch')=='main']; a.sort(key=lambda x: x['created_at'], reverse=True); print(str(a[0]['id'])+' '+a[0]['created_at'] if a else '')" \
            2>/dev/null || true)
          if [ -n "${ARTIFACT}" ]; then
            ARTIFACT_ID="${ARTIFACT%% *}"
            mkdir -p sbom-downloads
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
                -L -o /tmp/per-service-sboms.zip 2>/dev/null; then
              unzip -q /tmp/per-service-sboms.zip -d sbom-downloads/ 2>/dev/null || true
              echo "Downloaded per-service-sboms artifact ${ARTIFACT_ID} (created ${ARTIFACT#* })"
              staged=true
            fi
          fi

          if [ "${staged}" != "true" ]; then
            echo "::warning title=SBOM staging degraded::no non-expired per-service-sboms artifact from a main run — the admin-ui image ships without bundled per-service SBOMs (they will show as unavailable). security.yml's sbom-per-service job may not have run within the 14-day artifact retention."
            exit 0
          fi

          for f in sbom-downloads/*.cdx.json; do
            [ -f "$f" ] || continue
            svc="$(basename "$f" "-sbom.cdx.json")"
            mkdir -p "${svc}/build/reports"
            cp "$f" "${svc}/build/reports/bom.json"
            echo "  staged ${svc}/build/reports/bom.json"
          done
          echo "SBOM staging complete."

      - name: Stage Test Intelligence evidence (per-service latest artifact)
        if: steps.build_admission.outputs.proceed == 'true'
        id: stage_service_ti
        # services-ci.yml uploads one artifact per service: test-reports-{service}
        # (7-day retention). The old approach (download from ONE run) fails with
        # path-scoped CI: only recently-changed services have artifacts in any single
        # run, so unchanged services always show 0 tests in the UI.
        #
        # Fix: look up the most recent non-expired artifact for EACH known service
        # independently from the named-artifact endpoint.  A global artifact list
        # with `per_page=1` is unsound here: its newest item can be an unmerged PR
        # artifact, and filtering it out would hide the older valid main artifact.
        # Look up the latest non-expired main result by exact artifact name,
        # so unrelated runs cannot evict an unchanged service's proof.
        #
        # Uses curl + python3 (not gh CLI) — see SBOM staging step comment.
        # A successful inventory lookup with no artifact is legitimately not-run.
        # An API failure is not: fail the image build instead of replacing a
        # complete sandbox snapshot with a partially empty one.
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage service_ti)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage service_ti --auth github -- curl -fsS --retry 3 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }

          # Released components come from version.txt. The deterministic-simulation
          # harness is an explicitly governed tooling component without a release
          # version; it emits the same v1 envelope and must not disappear between
          # producer and deployment merely because it is intentionally unreleased.
          mapfile -t SERVICES < <(
            {
              find . -mindepth 2 -maxdepth 2 -name version.txt -printf '%h\n' | sed 's#^./##'
              [ ! -d openbank-simulation ] || printf '%s\n' openbank-simulation
            } | sort -u
          )

          ARTIFACT_NAMES=()
          for svc in "${SERVICES[@]}"; do
            ARTIFACT_NAMES+=("test-intelligence-${svc}")
          done
          LOOKUP_RESULT="$(mktemp)"
          # Resolve the inventory before downloading anything. API and malformed-
          # JSON failures are not absence: abort rather than baking an incomplete
          # Test Intelligence snapshot and stop amplifying an exhausted quota.
          if ! python3 .github/scripts/find-latest-main-artifacts.py \
            --repo "${REPO}" "${ARTIFACT_NAMES[@]}" > "${LOOKUP_RESULT}"; then
            echo "::error::Test Intelligence artifact inventory is unavailable; refusing an incomplete deployment snapshot"
            exit 1
          fi
          mapfile -t ARTIFACT_IDS < "${LOOKUP_RESULT}"
          if [ "${#ARTIFACT_IDS[@]}" -ne "${#SERVICES[@]}" ]; then
            echo "::error::artifact inventory did not return one verdict per service"
            exit 1
          fi

          # Inventory/provenance lookup above remains complete and serial. Only
          # independent service output directories are staged concurrently.
          STAGING_TMP="$(mktemp -d)"
          trap 'rm -rf "${STAGING_TMP}"' EXIT
          stage_service() {
            local svc="$1" art_id="$2"
            art_name="test-intelligence-${svc}"
            # This image represents deployed main, not the newest PR candidate.
            # Keep branch provenance explicit: an unmerged artifact must never be
            # presented in the sandbox as evidence for the deployed revision.
            if [ -z "${art_id}" ]; then
              echo "  ${svc}: no artifact (skip)"
              return 0
            fi
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${art_id}/zip" \
                -L -o "${STAGING_TMP}/${art_name}.zip"; then
              TMPDIR_ART="${STAGING_TMP}/${art_name}-extracted"
              rm -rf "${TMPDIR_ART}" && mkdir -p "${TMPDIR_ART}"
              if ! unzip -tq "${STAGING_TMP}/${art_name}.zip" >/dev/null 2>&1; then
                echo "  ${svc}: artifact archive is invalid; refusing incomplete Test Intelligence image" >&2
                exit 1
              fi
              unzip -q "${STAGING_TMP}/${art_name}.zip" -d "${TMPDIR_ART}"
              # actions/upload-artifact strips the uploaded directory prefix: the
              # service envelope is therefore normally `run.json` at the archive
              # root.  Keep accepting the previous nested layout too, so the UI
              # retains the latest per-service execution evidence across action
              # layout changes rather than silently falling back to stale JUnit.
              RUN_JSON="$(find "${TMPDIR_ART}" -type f \( -name 'run.json' -o -path '*/test-intelligence/run.json' \) -print -quit)"
              # The shared extractor validates complete v1/v2 envelopes and
              # main provenance before this service-specific identity check.
              if [ -z "${RUN_JSON}" ] || ! python3 .github/scripts/extract-test-intelligence-envelope.py \
                  --validate-component "${RUN_JSON}" "${svc}"; then
                echo "  ${svc}: run envelope is missing or invalid; refusing incomplete Test Intelligence image" >&2
                exit 1
              fi
              mkdir -p "${svc}/build/test-intelligence"
              cp "${RUN_JSON}" "${svc}/build/test-intelligence/run.json"
              # Inside the zip: test-results/*/TEST-*.xml (actions/upload-artifact@v7 strips
              # the leading service/build/ prefix). Reconstruct the full target path.
              find "${TMPDIR_ART}" -path "*/test-results/*/TEST-*.xml" | while read -r xml; do
                rel="test-results/${xml#*/test-results/}"
                target="${svc}/build/${rel}"
                mkdir -p "$(dirname "${target}")"
                cp "${xml}" "${target}"
              done
              find "${TMPDIR_ART}" -path '*/reports/kover/report.xml' | while read -r xml; do
                mkdir -p "${svc}/build/reports/kover"
                cp "${xml}" "${svc}/build/reports/kover/report.xml"
              done
              touch "${STAGING_TMP}/${svc}.staged"
              echo "  ${svc}: staged"
            else
              echo "  ${svc}: artifact download failed; refusing incomplete Test Intelligence image" >&2
              exit 1
            fi
          }
          # Drain every worker before reporting failure. Keep accounting in the
          # parent: background shells cannot update its counters reliably.
          PIDS=()
          STAGING_FAILED=0
          drain_workers() {
            for pid in "${PIDS[@]}"; do
              if ! wait "${pid}"; then STAGING_FAILED=1; fi
            done
            PIDS=()
          }
          for index in "${!SERVICES[@]}"; do
            stage_service "${SERVICES[$index]}" "${ARTIFACT_IDS[$index]:-}" &
            PIDS+=("$!")
            if [ "${#PIDS[@]}" -eq 4 ]; then drain_workers; fi
          done
          drain_workers
          if [ "${STAGING_FAILED}" -ne 0 ]; then
            echo "::error::Test Intelligence artifact staging failed; refusing incomplete deployment snapshot"
            exit 1
          fi
          DOWNLOADED=$(find "${STAGING_TMP}" -maxdepth 1 -name '*.staged' | wc -l | tr -d ' ')
          COUNT=$(find . -path "*/build/test-results/*/TEST-*.xml" | wc -l | tr -d ' ')
          RUN_COUNT=$(find . -path "*/build/test-intelligence/run.json" | wc -l | tr -d ' ')
          echo "Staged ${RUN_COUNT} run envelopes and ${COUNT} JUnit XML files from ${DOWNLOADED}/${#SERVICES[@]} services."

      - name: Stage customer-app Test Intelligence evidence
        id: stage_customer_ti
        # Cross-repository evidence is read-only and best-effort. The compact JSON artifact
        # contains counts and provenance only; it never imports private source or test output.
        if: ${{ steps.build_admission.outputs.proceed == 'true' && env.APP_RO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.OPENBANK_APP_RO_TOKEN }}
          APP_REPO: JiRaska/openbank-app
        run: |
          set -u
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage customer_ti)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage customer_ti --auth app_ro -- curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/client-test-evidence
          # Only reviewed default-branch evidence may enter a deployed control plane. A newer
          # PR artifact remains visible in GitHub but cannot replace the sandbox verdict.
          ARTIFACTS="$(api "https://api.github.com/repos/${APP_REPO}/actions/artifacts?per_page=100" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('artifacts',[]) if x['name'].startswith('openbank-app-test-intelligence-') and not x['expired'] and (x.get('workflow_run') or {}).get('head_branch') == 'main']; a.sort(key=lambda x:x['created_at'], reverse=True); [print(x['id']) for x in a[:20]]" 2>/dev/null || true)"
          while read -r artifact_id; do
            [ -n "${artifact_id}" ] || continue
            archive="/tmp/openbank-app-test-intelligence-${artifact_id}.zip"
            api "https://api.github.com/repos/${APP_REPO}/actions/artifacts/${artifact_id}/zip" -L -o "${archive}" 2>/dev/null || continue
            evidence="$(unzip -Z1 "${archive}" | awk '/\.json$/{print; exit}')"
            [ -n "${evidence}" ] || continue
            # Every producer artifact contains `openbank-app-unit.json`. Preserve a unique
            # deployment-local name or older downloads overwrite the newest observation.
            unzip -p "${archive}" "${evidence}" > "openbank-admin-ui/client-test-evidence/openbank-app-${artifact_id}.json"
          done <<< "${ARTIFACTS}"
          echo "Staged $(find openbank-admin-ui/client-test-evidence -name '*.json' | wc -l | tr -d ' ') mobile client evidence artifact(s)."

      - name: Restore staged test-run history (diff-forward, #8690 option B1)
        if: steps.build_admission.outputs.proceed == 'true'
        # This step cost ~105 installation-API requests per build (5 inventory pages + up to
        # 100 zip downloads) and re-downloaded the whole envelope set every time, for a set
        # that is almost entirely identical to the previous build's. The staged history is
        # small JSON envelopes, so it lives in an Actions cache that persists across builds:
        # restore the previous staging, download only envelopes the cache has never seen
        # (tracked by artifact id in .staged-ids), save under this run's key; restore-keys
        # picks the most recent prior staging. Steady state is ~5 requests (the inventory
        # pages) instead of ~105. Side effect measured as desirable in #8690 option A: the
        # cache outlives artifact expiry, so the history stops being a 0.6-hour snapshot.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openbank-admin-ui/test-run-history
          key: test-run-history-${{ github.run_id }}
          restore-keys: test-run-history-

      - name: Stage immutable per-attempt Test Intelligence history
        if: steps.build_admission.outputs.proceed == 'true'
        id: stage_immutable_ti
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          python3 .github/scripts/extract-test-intelligence-envelope.py --self-test
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage immutable_ti)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage immutable_ti --auth github -- curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/test-run-history
          touch openbank-admin-ui/test-run-history/.staged-ids
          # The restored cache can predate ZIP validation. Remove non-main or malformed
          # envelopes before the collector reads them; a missing file overrides its old
          # .staged-ids entry so an available artifact is re-fetched, not suppressed.
          python3 .github/scripts/extract-test-intelligence-envelope.py \
            --prune-cache openbank-admin-ui/test-run-history || exit 1
          # The cache preserves history past artifact expiry. Bound only the number of
          # candidates downloaded by this build, not the retained history.
          MAX_ENVELOPES=100
          # The workflow-runs endpoint is dominated by deploy-only Services CI runs, which
          # produce no per-service envelope.  Even a 100-run scan can therefore find zero
          # evidence while fresh immutable artifacts exist. Query the artifact inventory
          # directly, retaining only non-expired main-branch envelopes. The artifact list is
          # newest-first across the entire repository; one 100-item page is readily filled
          # by per-service evidence, so page it before applying the bounded 100-envelope cap.
          # GitHub's `name` filter is exact-match and cannot select run-id-suffixed artifacts.
          # High-volume PR CI can push the latest main browser run beyond five
          # repository-wide artifact pages (observed 2026-09-18). Fetch that producer's
          # latest completed main run directly so a valid browser verdict cannot vanish
          # merely because unrelated branches uploaded many artifacts.
          KNOWN_BEFORE=$(wc -l < openbank-admin-ui/test-run-history/.staged-ids | tr -d ' ')
          {
            browser_run_id="$(api "https://api.github.com/repos/${REPO}/actions/workflows/admin-ui-browser-synthetic.yml/runs?branch=main&status=completed&per_page=1" \
              | python3 -c "import json,sys; a=[r for r in json.load(sys.stdin).get('workflow_runs',[]) if r.get('head_branch') == 'main']; print(a[0]['id'] if a else '')" 2>/dev/null || true)"
            if [ -n "${browser_run_id}" ]; then
              api "https://api.github.com/repos/${REPO}/actions/runs/${browser_run_id}/artifacts?per_page=100" \
                | python3 -c "import json,sys; [print(a['id'],a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('test-intelligence-run-openbank-admin-ui-') and not a['expired'] and (a.get('workflow_run') or {}).get('head_branch') == 'main']" 2>/dev/null || true
            fi
            synthetic_run_id="$(api "https://api.github.com/repos/${REPO}/actions/workflows/synthetic-journeys.yml/runs?branch=main&status=completed&per_page=1" \
              | python3 -c "import json,sys; a=[r for r in json.load(sys.stdin).get('workflow_runs',[]) if r.get('head_branch') == 'main']; print(a[0]['id'] if a else '')" 2>/dev/null || true)"
            if [ -n "${synthetic_run_id}" ]; then
              api "https://api.github.com/repos/${REPO}/actions/runs/${synthetic_run_id}/artifacts?per_page=100" \
                | python3 -c "import json,sys; [print(a['id'],a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('test-intelligence-run-openbank-platform-') and not a['expired'] and (a.get('workflow_run') or {}).get('head_branch') == 'main']" 2>/dev/null || true
            fi
            for page in 1 2 3 4 5; do
              api "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${page}" \
                | python3 -c "import json,sys; [print(a['id'],a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('test-intelligence-run-') and not a['expired'] and (a.get('workflow_run') or {}).get('head_branch') == 'main']" 2>/dev/null || true
            done
          } \
            | awk '!seen[$1]++' \
            | head -"${MAX_ENVELOPES}" \
            | while read -r artifact_id artifact_name; do
                [ -n "${artifact_id}" ] || continue
                # Diff-forward: a validated cached file is authoritative, even if its ID
                # ledger entry is missing. A stale ID without a file must not suppress repair.
                # The candidate list is bounded before any download.
                cached="openbank-admin-ui/test-run-history/${artifact_name}.json"
                if [ -f "${cached}" ]; then
                  grep -qx "${artifact_id}" openbank-admin-ui/test-run-history/.staged-ids \
                    || echo "${artifact_id}" >> openbank-admin-ui/test-run-history/.staged-ids
                  continue
                fi
                archive="/tmp/${artifact_name}.zip"
                api "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}/zip" -L -o "${archive}" 2>/dev/null || continue
                # Browser variants retain run-chromium.json / run-firefox.json,
                # unlike service envelopes named run.json. Require exactly one
                # schema-valid main envelope; never guess among ZIP members.
                if ! python3 .github/scripts/extract-test-intelligence-envelope.py \
                  "${archive}" "${cached}"; then
                  continue
                fi
                grep -qx "${artifact_id}" openbank-admin-ui/test-run-history/.staged-ids \
                  || echo "${artifact_id}" >> openbank-admin-ui/test-run-history/.staged-ids
              done
          echo "Staged $(find openbank-admin-ui/test-run-history -name '*.json' | wc -l | tr -d ' ') immutable run envelopes, $(($(wc -l < openbank-admin-ui/test-run-history/.staged-ids | tr -d ' ') - KNOWN_BEFORE)) new artifact IDs recorded this build."

      - name: Save staged test-run history
        if: steps.build_admission.outputs.proceed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openbank-admin-ui/test-run-history
          key: test-run-history-${{ github.run_id }}

      - name: Stage pitest mutation results from latest completed weekly run
        if: steps.build_admission.outputs.proceed == 'true'
        id: stage_pit
        # pitest.yml uploads one artifact per governed lane (30-day retention).
        # collect-test-intelligence.mjs reads openbank-*/build/reports/pitest/mutations.xml.
        # Uses curl + python3 (not gh CLI) — see SBOM staging step comment.
        # Do not filter to success: a failed/latest attempt must not disappear behind an
        # older green run. Confirmed absence stays visible as missing evidence;
        # an API failure must stop the deploy instead of erasing PIT results.
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage pit)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage pit --auth github -- curl -fsS --retry 3 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }
          # A single completed-runs response has omitted a newer retained main PIT
          # run and silently projected an older failed report. Cross-check the
          # filtered and unfiltered API views before selecting by attempt time;
          # retry transient disagreement, then fail closed rather than regress.
          filtered_inventory="${RUNNER_TEMP}/pitest-completed-runs.json"
          all_inventory="${RUNNER_TEMP}/pitest-all-runs.json"
          RUN_ID=""
          selected=false
          for selection_attempt in 1 2 3; do
            api "https://api.github.com/repos/${REPO}/actions/workflows/pitest.yml/runs?branch=main&status=completed&per_page=100" \
              -o "${filtered_inventory}" || exit 1
            api "https://api.github.com/repos/${REPO}/actions/workflows/pitest.yml/runs?branch=main&per_page=100" \
              -o "${all_inventory}" || exit 1
            if RUN_ID=$(python3 .github/scripts/stage-pitest-artifacts.py select-run \
                "${filtered_inventory}" "${all_inventory}"); then
              selected=true
              break
            fi
            [ "${selection_attempt}" -eq 3 ] || sleep 2
          done
          [ "${selected}" = true ] || { echo "PIT run inventory remained inconsistent" >&2; exit 1; }
          if [ -z "${RUN_ID}" ]; then
            echo "No completed pitest run found — skipping pitest staging."
            exit 0
          fi
          echo "Staging pitest results from run ${RUN_ID}..."
          ARTIFACT_INVENTORY=$(api \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100") || exit 1
          # Preflight the whole run: duplicate names or projected lanes must fail
          # before any report can be promoted into the deployment snapshot.
          ARTIFACTS=$(python3 .github/scripts/stage-pitest-artifacts.py plan <<< "${ARTIFACT_INVENTORY}") || exit 1
          if [ -z "${ARTIFACTS}" ]; then
            echo "No pitest artifacts found in run ${RUN_ID} — skipping."
            exit 0
          fi
          DOWNLOADED=0
          while IFS=$'\t' read -r art_id art_name svc; do
            [ -n "${art_id}" ] || continue
            archive="${RUNNER_TEMP}/pitest-${art_id}.zip"
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${art_id}/zip" \
                -L -o "${archive}"; then
              # The ZIP contains report contents, not the module prefix. Stage
              # each evidence lane in a fresh private directory and publish it
              # atomically; never merge two archives or prompt on overwrite.
              python3 .github/scripts/stage-pitest-artifacts.py stage "${archive}" "${svc}" . --run-id "${RUN_ID}" || exit 1
              DOWNLOADED=$((DOWNLOADED + 1))
            else
              echo "PIT artifact ${art_name} could not be downloaded; refusing incomplete Test Intelligence image" >&2
              exit 1
            fi
          done <<< "${ARTIFACTS}"
          COUNT=$(find . -path "*/build/reports/pitest/mutations.xml" | wc -l | tr -d ' ')
          echo "Staged ${COUNT} mutations.xml files from ${DOWNLOADED} artifacts."

      - name: Stage performance evidence from latest complete k6 run
        if: steps.build_admission.outputs.proceed == 'true'
        id: stage_performance
        # The Test Intelligence collector reads k6 summaries only from the deployment-local
        # perf-artifacts directory.  A declared scenario is deliberately not promoted to a
        # result, so bring in the newest authoritative completed main-run evidence even when
        # that attempt failed or was cancelled.  The money-path baseline may intentionally emit
        # only a `not-run` envelope when no safe runner target exists; retain that provenance too.
        # A positively-proven narrowed perf-gate dispatch is useful for diagnosis, but must not
        # replace the broader declared-scope snapshot with one service's result. A scheduled or
        # default dispatch whose matrix is incomplete is instead an authoritative stop barrier.
        # Select the newest completed run whose latest-view jobs prove BOTH declared v1
        # subjects, regardless of conclusion; artifact completeness is evaluated only after
        # that run is selected.
        # REST does not promise workflow-run ordering, and a rerun advances run_started_at;
        # order candidates by that attempt timestamp (then id) before selecting evidence.
        # GitHub retains artifacts from every rerun attempt under one run id. Latest-view jobs
        # identify a successful sibling carried by "re-run failed jobs"; a job that actually
        # reran must have a new artifact after its job start. Stop at that authoritative run
        # even when one bundle is missing, so an older green run can never replace it.
        # Missing or expired evidence remains `not-run` in the
        # UI; this best-effort staging step must never turn absence into a deployment failure.
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage performance)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage performance --auth github -- curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }
          SELECTOR=.github/scripts/select-performance-evidence.py
          SELECTOR_DIR="$(mktemp -d)"
          fetch_artifact_pages() {
            local run_id="$1"
            local prefix="$2"
            local page=1
            local page_size
            local artifact_page
            ARTIFACT_ARGS=()
            while [ "${page}" -le 100 ]; do
              artifact_page="${SELECTOR_DIR}/${prefix}-${page}.json"
              if ! api "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/artifacts?per_page=100&page=${page}" \
                -o "${artifact_page}"; then
                return 1
              fi
              ARTIFACT_ARGS+=(--artifacts "${artifact_page}")
              if ! page_size=$(python3 "${SELECTOR}" artifact-page-size --artifacts "${artifact_page}"); then
                return 1
              fi
              if [ "${page_size}" -lt 100 ]; then
                return 0
              fi
              page=$((page + 1))
            done
            return 1
          }
          fetch_run_pages() {
            local workflow="$1"
            local prefix="$2"
            local page=1
            local page_size
            local run_page
            RUN_ARGS=()
            while [ "${page}" -le 100 ]; do
              run_page="${SELECTOR_DIR}/${prefix}-${page}.json"
              if ! api "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&status=completed&per_page=100&page=${page}" \
                -o "${run_page}"; then
                return 1
              fi
              RUN_ARGS+=(--runs "${run_page}")
              if ! page_size=$(python3 "${SELECTOR}" run-page-size --runs "${run_page}"); then
                return 1
              fi
              if [ "${page_size}" -lt 100 ]; then
                return 0
              fi
              page=$((page + 1))
            done
            return 1
          }
          mkdir -p openbank-admin-ui/perf-artifacts
          RUN_ID=""
          ARTIFACTS=""
          if fetch_run_pages perf-gate.yml gate-runs; then
            RUN_CANDIDATES=$(python3 "${SELECTOR}" runs "${RUN_ARGS[@]}" 2>/dev/null || true)
          else
            RUN_CANDIDATES=""
            echo "::warning::Could not enumerate all completed perf-gate runs; refusing partial history."
          fi
          while read -r candidate candidate_started_at candidate_attempt candidate_event; do
            [ -n "${candidate}" ] && [ -n "${candidate_started_at}" ] \
              && [ -n "${candidate_attempt}" ] && [ -n "${candidate_event}" ] || continue
            candidate_jobs="${SELECTOR_DIR}/gate-${candidate}-jobs.json"
            if ! api "https://api.github.com/repos/${REPO}/actions/runs/${candidate}/jobs?filter=latest&per_page=100" \
              -o "${candidate_jobs}"; then
              echo "::warning::Could not classify perf-gate run ${candidate} scope; refusing older evidence."
              break
            fi
            candidate_scope_log="${SELECTOR_DIR}/gate-${candidate}-scope.log"
            candidate_scope_args=()
            candidate_prepare_job=$(python3 "${SELECTOR}" prepare-job \
              --jobs "${candidate_jobs}" 2>/dev/null || true)
            if [ -n "${candidate_prepare_job}" ] && api \
              "https://api.github.com/repos/${REPO}/actions/jobs/${candidate_prepare_job}/logs" \
              -L -o "${candidate_scope_log}" 2>/dev/null; then
              candidate_scope_args=(--scope-log "${candidate_scope_log}")
            fi
            if candidate_scope=$(python3 "${SELECTOR}" gate \
              --attempt-start "${candidate_started_at}" --event "${candidate_event}" \
              --jobs "${candidate_jobs}" "${candidate_scope_args[@]}" --scope-only 2>/dev/null); then
              :
            else
              candidate_status=$?
              if [ "${candidate_status}" -eq 3 ]; then
                continue
              fi
              echo "::warning::Could not prove perf-gate run ${candidate} scope; refusing older evidence."
              break
            fi
            [ "${candidate_scope}" = full ] || break

            RUN_ID="${candidate}"
            echo "Selecting authoritative perf-gate run ${RUN_ID}, attempt ${candidate_attempt}."
            if ! fetch_artifact_pages "${candidate}" "gate-${candidate}-artifacts"; then
              echo "::warning::Could not inspect perf-gate run ${candidate} artifacts; refusing older evidence."
            else
              ARTIFACTS=$(python3 "${SELECTOR}" gate --attempt-start "${candidate_started_at}" \
                --event "${candidate_event}" --jobs "${candidate_jobs}" \
                "${candidate_scope_args[@]}" "${ARTIFACT_ARGS[@]}" 2>/dev/null || true)
            fi
            break
          done <<< "${RUN_CANDIDATES}"
          if [ -z "${RUN_ID}" ]; then
            echo "No completed full-scope performance run found — performance evidence remains not-run."
          elif [ -z "${ARTIFACTS}" ]; then
            echo "Perf-gate run ${RUN_ID} has no attributable current-attempt evidence — it remains not-run."
          else
            DOWNLOADED=0
            while IFS=' ' read -r artifact_id artifact_name; do
              [ -n "${artifact_id}" ] || continue
              archive="/tmp/${artifact_name}.zip"
              if api "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}/zip" -L -o "${archive}" 2>/dev/null; then
                unzip -q "${archive}" -d openbank-admin-ui/perf-artifacts 2>/dev/null || true
                DOWNLOADED=$((DOWNLOADED + 1))
              fi
            done <<< "${ARTIFACTS}"
            COUNT=$(find openbank-admin-ui/perf-artifacts -name '*-summary.json' | wc -l | tr -d ' ')
            echo "Staged ${COUNT} k6 summary file(s) from ${DOWNLOADED} performance artifact(s), run ${RUN_ID}."
          fi

          if fetch_run_pages perf-baseline.yml baseline-runs; then
            BASELINE_RUN=$(python3 "${SELECTOR}" runs --latest "${RUN_ARGS[@]}" 2>/dev/null || true)
          else
            BASELINE_RUN=""
            echo "::warning::Could not enumerate all completed baseline runs; refusing partial history."
          fi
          read -r BASELINE_RUN_ID BASELINE_STARTED_AT BASELINE_ATTEMPT BASELINE_EVENT <<< "${BASELINE_RUN}"
          if [ -z "${BASELINE_RUN_ID}" ] || [ -z "${BASELINE_STARTED_AT}" ] \
            || [ -z "${BASELINE_ATTEMPT}" ] || [ -z "${BASELINE_EVENT}" ]; then
            echo "No completed money-path baseline run found — it remains declared but unmeasured."
          else
            if fetch_artifact_pages "${BASELINE_RUN_ID}" "baseline-${BASELINE_RUN_ID}-artifacts"; then
              BASELINE_ARTIFACT_ROW=$(python3 "${SELECTOR}" baseline \
                --attempt-start "${BASELINE_STARTED_AT}" \
                "${ARTIFACT_ARGS[@]}" 2>/dev/null || true)
            else
              BASELINE_ARTIFACT_ROW=""
            fi
            BASELINE_ARTIFACT="${BASELINE_ARTIFACT_ROW%% *}"
            if [ -z "${BASELINE_ARTIFACT}" ]; then
              echo "Money-path baseline ${BASELINE_RUN_ID} has no retained evidence artifact."
            else
              BASELINE_DIR="$(mktemp -d)"
              if ! api "https://api.github.com/repos/${REPO}/actions/artifacts/${BASELINE_ARTIFACT}/zip" -L -o /tmp/k6-money-path-summary.zip \
                || ! unzip -q /tmp/k6-money-path-summary.zip -d "${BASELINE_DIR}"; then
                echo "::warning::Could not stage money-path baseline evidence from run ${BASELINE_RUN_ID}."
              else
                BASELINE_SUMMARY=$(find "${BASELINE_DIR}" -name 'perf-summary.json' -print -quit)
                BASELINE_ENVELOPE=$(find "${BASELINE_DIR}" -name 'perf-run.json' -print -quit)
                SUMMARY_STATUS=no
                if [ -n "${BASELINE_SUMMARY}" ]; then
                  cp "${BASELINE_SUMMARY}" openbank-admin-ui/perf-artifacts/money-path-smoke-summary.json
                  SUMMARY_STATUS=yes
                fi
                ENVELOPE_STATUS=no
                if [ -n "${BASELINE_ENVELOPE}" ]; then
                  cp "${BASELINE_ENVELOPE}" openbank-admin-ui/perf-artifacts/money-path-smoke-summary.json.run.json
                  ENVELOPE_STATUS=yes
                fi
                echo "Staged money-path baseline ${BASELINE_RUN_ID}: summary=${SUMMARY_STATUS} envelope=${ENVELOPE_STATUS}."
              fi
            fi
          fi

      - name: Collect production-readiness scorecard
        if: steps.build_admission.outputs.proceed == 'true'
        # Derives C1–C9 maturity scores from the repo and writes
        # openbank-admin-ui/prod-readiness.json so the Dockerfile bakes it into
        # the image. build-push-admin-ui.sh also calls the Python version as a
        # belt-and-suspenders fallback; this Node step runs first so the bundle
        # is already present when the Docker build starts.
        # Best-effort: a failure must not abort the deploy.
        working-directory: openbank-admin-ui
        run: |
          if ! node scripts/collect-prod-readiness.mjs 2>&1; then
            echo "::warning::prod-readiness collector failed — scorecard page will show no data"
          fi

      - name: Collect CI gate-estate health snapshot (ADR-0255)
        id: stage_gate_health
        # During migration only: configured installations publish this dataset independently.
        if: ${{ steps.build_admission.outputs.proceed == 'true' && vars.ADMIN_UI_EVIDENCE_WRITER_ROLE_ARN == '' }}
        # Derives gate-health.json from the GitHub Actions API — same read-only,
        # baked-at-build-time shape as prod-readiness above and DORA (ADR-0061):
        # the token this step holds (actions: read, job-scoped) never reaches the
        # runtime pod. Best-effort: a failure must not abort the deploy, same as
        # the prod-readiness collector — a missing snapshot degrades the DevOps
        # page's QG panel to a small inline notice, never a build failure.
        working-directory: openbank-admin-ui
        env:
          GITHUB_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
        run: |
          eval "$(python3 ../.github/scripts/admin_ui_trace_ipc.py begin --stage gate_health)" || true
          if ! node scripts/collect-gate-health.mjs 2>&1; then
            echo "::warning::gate-health collector failed — QG panel will show no data"
          fi

      - name: Install Trivy
        if: steps.build_admission.outputs.proceed == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Stage Test Intelligence deployment history
        if: steps.build_admission.outputs.proceed == 'true'
        id: stage_deploy_ti
        env:
          GH_TOKEN: ${{ env.GITOPS_APP_ID == '' && github.token || steps.read_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          eval "$(python3 .github/scripts/admin_ui_trace_ipc.py begin --stage deploy_ti)" || true
          api() { python3 .github/scripts/trace-admin-ui-curl.py --stage deploy_ti --auth github -- curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/test-intelligence-history
          # Query the owning workflow's successful main runs, not the repository-wide artifact
          # stream. Every services-ci run contributes many artifacts and previously pushed a
          # snapshot beyond the fixed five-page search window. A successful Admin-UI deploy owns
          # at most one immutable snapshot, so this route is complete without unrelated artifacts.
          # Measured 2026-08-26: 30 retained snapshots were found in 51 runs (52 API calls).
          # The 100-run ceiling bounds pathological missing-artifact cases;
          # fewer results remain explicit in the rendered history (#6614).
          snapshot_ids="${RUNNER_TEMP}/test-intelligence-snapshot-ids"
          : > "${snapshot_ids}"
          snapshot_count=0
          run_ids="$(api "https://api.github.com/repos/${REPO}/actions/workflows/admin-ui-deploy.yml/runs?branch=main&status=success&per_page=100" \
            | python3 -c "import json,sys; [print(x['id']) for x in json.load(sys.stdin).get('workflow_runs',[])]" 2>/dev/null || true)"
          while read -r deploy_run_id; do
            [ -n "${deploy_run_id}" ] || continue
            [ "${snapshot_count}" -lt 30 ] || break
            api "https://api.github.com/repos/${REPO}/actions/runs/${deploy_run_id}/artifacts?per_page=100" \
              | python3 -c "import json,sys; [print(x['id']) for x in json.load(sys.stdin).get('artifacts',[]) if x['name'].startswith('test-intelligence-snapshot-') and not x['expired']]" \
              >> "${snapshot_ids}" 2>/dev/null || true
            snapshot_count="$(awk '!seen[$0]++' "${snapshot_ids}" | wc -l | tr -d ' ')"
          done <<< "${run_ids}"
          awk '!seen[$0]++' "${snapshot_ids}" | head -30 \
            | while read -r artifact_id; do
                [ -n "${artifact_id}" ] || continue
                api "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}/zip" -L -o "/tmp/test-intelligence-${artifact_id}.zip" 2>/dev/null || continue
                unzip -joq "/tmp/test-intelligence-${artifact_id}.zip" '*.json' -d openbank-admin-ui/test-intelligence-history 2>/dev/null || true
              done

      - name: Expose short-lived BuildKit cache credentials
        if: steps.build_admission.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name} for cache v2`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Build, collect, push
        if: steps.build_admission.outputs.proceed == 'true'
        id: build
        env:
          ADMIN_UI_BUILDKIT_CACHE: gha
          ADMIN_UI_BUILD_METADATA_FILE: ${{ runner.temp }}/admin-ui-build-metadata.json
          # The build script's quality collector reads these only to fetch the
          # Pact Broker's per-Pact provider-verification verdict before the
          # immutable Test Intelligence snapshot is baked. Docker receives no
          # build arg for them, so they cannot enter the image or browser bundle.
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          # Optional: enables source-map upload to GlitchTip (#3235). Unset = no upload, normal
          # build — the maps are what turn a captured error into a file and a line.
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # build-push-admin-ui.sh derives the tag from git (dirty check runs BEFORE
          # the collectors, so a fresh CI checkout yields a clean tag). --no-sbom
          # skips ./gradlew sbomAll (too heavy for CI); SBOMs are staged from the
          # security workflow artifact in the preceding step instead.
          # --no-bump skips the sed+git step; the gitops PR job handles the bump.
          # ECR tags are immutable. An operator-initiated or scheduled evidence
          # refresh can intentionally rebuild the same commit after new artifacts
          # arrive, so make that refresh unique while retaining commit provenance.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ]; then
            export ADMIN_UI_IMAGE_TAG_SUFFIX="run${GITHUB_RUN_ID}"
          fi
          bash openbank-infra/scripts/build-push-admin-ui.sh --no-sbom --no-bump --no-login \
            2>&1 | tee /tmp/build-admin-ui.log

          # Extract the tag from the script's own "==> pushed <image>:<tag>" line.
          # Avoids SHA length drift: `git rev-parse --short` uses a dynamic length
          # (repo-dependent, typically 7) while a hardcoded ::N substring might differ
          # — a mismatch would rewrite GitOps to a tag never pushed to ECR.
          PUSHED="$(grep '^==> pushed ' /tmp/build-admin-ui.log | tail -1 | awk '{print $3}')"
          TAG="${PUSHED##*:}"
          [ -n "${TAG}" ] || { echo "ERROR: could not extract pushed image tag"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          DIGEST="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync(process.env.ADMIN_UI_BUILD_METADATA_FILE,"utf8"))["containerimage.digest"]; if(!/^sha256:[0-9a-f]{64}$/.test(d)) process.exit(1); process.stdout.write(d)')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed tag: ${TAG}"

      - name: Remove BuildKit cache credentials from later steps
        if: ${{ steps.build_admission.outputs.proceed == 'true' && always() }}
        run: |
          echo 'ACTIONS_RUNTIME_TOKEN=' >> "$GITHUB_ENV"
          echo 'ACTIONS_RESULTS_URL=' >> "$GITHUB_ENV"

      - name: Install image browser probe
        if: steps.build_admission.outputs.proceed == 'true'
        working-directory: openbank-admin-ui
        run: npx playwright install --with-deps chromium

      - name: Test the signed image by digest before GitOps promotion
        if: steps.build_admission.outputs.proceed == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          bash openbank-infra/scripts/test-admin-ui-image.sh \
            "${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}@${IMAGE_DIGEST}" "$(git rev-parse --short HEAD)"

      - name: Retain image identity and browser proof
        if: ${{ steps.build_admission.outputs.proceed == 'true' && always() && steps.build.outputs.digest != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-image-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/admin-ui-build-metadata.json
            openbank-admin-ui/test-results/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize collector request-send trace
        if: ${{ steps.build_admission.outputs.proceed == 'true' && always() }}
        env:
          TRACE_STATUS_SBOM: ${{ steps.stage_sbom.outcome || 'not_run' }}
          TRACE_STATUS_SERVICE_TI: ${{ steps.stage_service_ti.outcome || 'not_run' }}
          TRACE_STATUS_CUSTOMER_TI: ${{ steps.stage_customer_ti.outcome || 'not_run' }}
          TRACE_STATUS_IMMUTABLE_TI: ${{ steps.stage_immutable_ti.outcome || 'not_run' }}
          TRACE_STATUS_PIT: ${{ steps.stage_pit.outcome || 'not_run' }}
          TRACE_STATUS_PERFORMANCE: ${{ steps.stage_performance.outcome || 'not_run' }}
          TRACE_STATUS_GATE_HEALTH: ${{ steps.stage_gate_health.outcome || 'not_run' }}
          TRACE_STATUS_DEPLOY_TI: ${{ steps.stage_deploy_ti.outcome || 'not_run' }}
          TRACE_APP_RO_CONFIGURED: ${{ env.APP_RO_TOKEN != '' }}
          TRACE_PACT_BROKER_CONFIGURED: ${{ vars.PACT_BROKER_URL != '' }}
        run: python3 .github/scripts/aggregate-admin-ui-http-trace.py

      - name: Retain immutable Test Intelligence snapshot
        if: steps.build_admission.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-intelligence-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: openbank-admin-ui/test-intelligence.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare directly discoverable evidence seed
        if: steps.build_admission.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ needs.deploy-source.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'test-intelligence-seed'
          destination.mkdir()
          shutil.copyfile('openbank-admin-ui/test-intelligence.json', destination / 'test-intelligence.json')
          provenance = {'schemaVersion': 1, 'runId': int(os.environ['GITHUB_RUN_ID']),
                        'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                        'sourceSha': os.environ['SOURCE_SHA'], 'workflowSha': os.environ['GITHUB_SHA']}
          (destination / 'seed-provenance.json').write_text(json.dumps(provenance) + '\n')
          PY

      - name: Retain directly discoverable evidence seed
        if: steps.build_admission.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-test-intelligence-seed
          overwrite: true  # reruns replace only this run's alias; immutable snapshots stay retained
          path: ${{ runner.temp }}/test-intelligence-seed/
          if-no-files-found: error
          retention-days: 1

      # ADR-0358: the image pin lives on the bot-owned deploy/sandbox branch, not in main.
      # No PR, no deploy window, no supersede: publish-deploy-pin.py builds the candidate
      # pin, runs the deploy-pin-branch-contract check on it (digest present, deploy_holds,
      # every sha an ancestor of main, never older than the pin already there) and only then
      # writes it as a signed GitHub App commit with expectedHeadOid = the parent it checked.
      # An App installation token is the only credential the deploy/sandbox ruleset admits
      # and the only one GitHub signs createCommitOnBranch for; there is no fallback.
      - name: Mint a GitHub App installation token
        id: app_token
        if: ${{ steps.build_admission.outputs.proceed == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Install pin checker dependencies
        if: ${{ steps.build_admission.outputs.proceed == 'true' }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/deploy-pin-venv"
          "${RUNNER_TEMP}/deploy-pin-venv/bin/python" -m pip install --quiet --require-hashes \
            -r .github/scripts/pyyaml-requirements.txt

      - name: Pin the image on deploy/sandbox
        id: pin
        if: ${{ steps.build_admission.outputs.proceed == 'true' }}
        env:
          DEPLOY_PIN_TOKEN: ${{ steps.app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          "${RUNNER_TEMP}/deploy-pin-venv/bin/python" .github/scripts/publish-deploy-pin.py deploy \
            --component admin-ui \
            --image-source-sha "${{ needs.deploy-source.outputs.source_sha }}" \
            --tag "${{ steps.build.outputs.tag }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
