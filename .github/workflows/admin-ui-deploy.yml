#
# Admin-UI CI build and deploy (ADR-0029 Layer B).
#
# Triggered by any push to main that touches admin-ui source, governance bundles,
# or the release-please CHANGELOG.md / version.txt (= a new release cut). This
# mirrors openbank-infra/scripts/build-push-admin-ui.sh: runs all repo-derived
# collectors, builds the Next.js image, pushes to ECR, then opens a GitOps PR
# (auto-merged once CI is green) so ArgoCD syncs the new tag automatically.
#
# This eliminates the manual rebuild step that previously caused release notes
# and governance data (ADR list, threat models, service catalog) to go stale
# between operator-triggered builds.
#
# Key differences from the local script for CI:
#   - OIDC replaces AWS SSO profiles (configure-aws-credentials sets env vars
#     that the AWS CLI picks up automatically, overriding AWS_PROFILE).
#   - --no-sbom: Gradle sbomAll is skipped (too heavy for CI). Instead, the
#     per-service-sboms artifact from the latest security.yml run is downloaded
#     and staged at openbank-*/build/reports/bom.json before the Docker build,
#     so the sbom-collector stage in the Dockerfile bundles them automatically.
#   - GitOps manifest bump is done by peter-evans/create-pull-request, not sed+git.
#
# Security:
#   - OIDC → arn:aws:iam::265175468565:role/openbank-arc-build-runner (same as
#     auto-deploy.yml, has ECR push + KMS cosign alias/openbank-cosign-signing).
#   - GitOps change lands via a PR (never direct push to main) — normal review gate.
#   - A GitHub App installation token (GITOPS_APP_ID + GITOPS_APP_PRIVATE_KEY) opens the
#     PR: it both triggers the required checks and gets its commit signed by GitHub, which
#     required_signatures demands. Falls back only to GITHUB_TOKEN (manual-merge only — its
#     PRs do not trigger workflows); the GITOPS_PR_TOKEN user-PAT rung was retired in #1305
#     (its commits were unsigned and stranded the PR anyway). See issue #1269.

name: Admin-UI deploy

on:
  # CI evidence changes far more frequently than the Admin UI source. A successful
  # main Services CI and CI immediately rebuild the read-only evidence projection; the
  # daily run is its recovery path when GitHub suppresses or delays an event. Both
  # use the same signed image and GitOps-PR path as source-triggered deploys.
  workflow_run:
    # Services CI produces fleet envelopes; CI produces the Admin UI envelope.  Subscribe
    # to both: refreshing after Services CI alone can snapshot a stale Admin UI verdict
    # before the same main commit's UI test artifact is available.
    workflows: ["Services CI", "CI"]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      # Admin-UI source — includes CHANGELOG.md + version.txt (release-please merge)
      - "openbank-admin-ui/**"
      # Governance bundles baked into the image (ADRs, threat models, agent charters, flags, compliance)
      - "docs/adr/**"
      - "docs/threat-models/**"
      - "docs/agents/**"
      - "openbank-infra/gitops/components/*/feature-flags.yaml"
      - "openbank-libs/governance/agents.yaml"
      - "openbank-libs/governance/compliance-controls.yaml"
      # Test Intelligence's governed performance plans are baked into
      # test-intelligence.json. Without these inputs a GitOps manifest can be Synced
      # while the running UI still presents the prior plan/blocker snapshot.
      - "perf/scenarios.yaml"
      - "perf/k6/**"
      - "openbank-libs/governance/rules.yaml"
      # Test Intelligence snapshot inputs. A journey catalog/manifest change must rebuild
      # the image: the sandbox CronJob alone proves runtime, but the operator's bundled
      # inventory and blockers would otherwise remain stale until an unrelated UI edit.
      - "openbank-infra/gitops/components/observability/cronjob-journey-*.yaml"
      - "openbank-libs/governance/journeys.yaml"
      # openbank-libs/docs is the ONLY docs tree baked into the image: the Dockerfile's
      # docs-collector copies /repo/openbank-*/docs, and src/lib/services/docs.ts serves the
      # `libs` service from /app/docs-bundle rather than from a running pod. Every other
      # service's docs are read live off its JAR, so they ride auto-deploy.yml's
      # openbank-*/src/main/** trigger — this tree has no such path and would otherwise merge
      # and never reach the page (landed is not live).
      - "openbank-libs/docs/**"
      # The deploy workflow itself — changes here should immediately trigger a rebuild
      - ".github/workflows/admin-ui-deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger (informational)"
        required: false
        default: "manual"

# Restrictive top-level default (Scorecard Token-Permissions wants an explicit top-level
# block); the build-push job below declares its own override for the access it needs.
permissions:
  contents: read

concurrency:
  # One admin-ui deploy at a time — a second push while a deploy PR is open would
  # produce conflicting image tags. cancel-in-progress must stay FALSE: the
  # build-push job pushes to ECR and only then signs + attests (build-push-admin-ui.sh
  # → cosign_sign_and_attest), so cancelling mid-job can strand a pushed-but-unattested
  # image that Kyverno's verify-images policy denies on the next reschedule — days
  # later, far from the cause (same hazard auto-deploy.yml documents). Queueing is
  # safe: GitHub keeps only the newest pending run per group, so the latest commit
  # still wins — it just waits for the in-flight deploy to finish signing.
  # Job-level `if:` is evaluated only after concurrency admission. A workflow_run that is
  # successful but belongs to an OLDER main SHA can therefore enter the shared queue, evict the
  # pending deploy for a newer push, and only then discover that it must skip. That exact race
  # cancelled the pending Test Intelligence deploy for 29dc20e2 in favour of a stale evidence
  # refresh (#7211). Keep workflow-run events in a SHA-scoped queue; deploy-source independently
  # rejects a source SHA that is no longer main before the privileged build. Push, dispatch and
  # schedule retain one queue, so the newest operator/source-triggered deploy still wins normally.
  group: >-
    admin-ui-deploy-${{
      github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'eligible'
    }}
  cancel-in-progress: false

jobs:
  deploy-source:
    name: Authorize deploy source
    # A GitOps image bump runs the ordinary CI workflows on main. Their successful
    # workflow_run event has no head_commit payload, so the old build-push condition
    # could not recognise the self-generated `chore(admin-ui): deploy ...` commit and
    # rebuilt the image again. Resolve the exact producer SHA before allocating the
    # arm64/OIDC build job and expose one closed boolean to the downstream job.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.source.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - id: source
        name: Reject stale or self-generated deploy source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$main_sha" ]; then
            echo "::error::could not resolve origin/main; refusing a privileged build from an unverified source"
            exit 1
          fi
          if [ "$source_sha" != "$main_sha" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale source $source_sha; main is now $main_sha. A newer push/workflow run owns deployment."
            exit 0
          fi

          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == "chore(admin-ui): deploy "* ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping self-generated GitOps commit; its image is already built, signed and attested."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build + push admin-ui
    # Skip if the push was generated by this workflow's own GitOps PR (loop-breaker).
    # The GitOps commit message always starts with "chore(admin-ui): deploy".
    #
    # The PR step now scopes the deploy commit to the GitOps manifest, which prevents a direct
    # push-path match. CI still runs for that main commit, though, and its workflow_run completion
    # is a second trigger route; deploy-source closes that route using the producer's exact SHA.
    # `deploy-source` resolves workflow_run.head_sha and rejects a deploy generated
    # by this workflow before this privileged, arm64 build job can start.
    needs: deploy-source
    if: needs.deploy-source.outputs.proceed == 'true'
    # Native arm64 GitHub-hosted runner (free on public repos): the admin-ui image
    # is linux/arm64. ECR push + cosign use the same GitHub-OIDC role as before.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # GitHub OIDC → openbank-arc-build-runner
      actions: read    # gh run list / gh run download for SBOM staging; also read by
                       # collect-gate-health.mjs (ADR-0255) for the same reason — no new grant
    timeout-minutes: 30
    env:
      ECR_REGISTRY: "265175468565.dkr.ecr.eu-north-1.amazonaws.com"
      ECR_REPO: openbank-admin-ui
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      MANIFEST: openbank-infra/gitops/components/admin-ui/admin-ui.yaml
      # Mirrored into env because the `secrets` context is NOT available in a step-level `if:`
      # — only job-level env can read it. Used solely to decide whether to mint an App token.
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      # Read-only token for the separate private customer-app repository. It is optional:
      # missing scope/evidence renders an explicit blocked client row; it never blocks deploy.
      APP_RO_TOKEN: ${{ secrets.OPENBANK_APP_RO_TOKEN }}

    outputs:
      tag: ${{ steps.build.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — collect-dora.mjs walks git log for deployment frequency.
          fetch-depth: 0
          # persist-credentials: true (default) — needed so git in the collectors
          # can read the repo; the gitops step uses a separate checkout.

      - name: Checkout mobile RUM capability metadata
        if: env.APP_RO_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JiRaska/openbank-app
          token: ${{ secrets.OPENBANK_APP_RO_TOKEN }}
          path: .app-src
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the runtime image (openbank-admin-ui/Dockerfile: node:26-alpine). Pinned at 20
          # it was three majors behind what ships, and #3569's jsdom bump made that fatal:
          # jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26 and pulls undici 8, whose
          # cachestorage calls webidl.util.markAsUncloneable. On 20 every vitest worker died
          # with "Failed to start forks worker", the run collected ZERO tests, and the job
          # still reported a plain red — engine-strict is off, so npm ci installed it happily.
          node-version: "26"
          cache: 'npm'
          cache-dependency-path: openbank-admin-ui/package-lock.json

      - name: Install admin-ui dependencies
        # Needed by the collector scripts (generate-governance.mjs, etc.) which
        # import `yaml` and other packages from openbank-admin-ui/node_modules.
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: openbank-admin-ui

      - name: Configure AWS credentials (GitHub OIDC)
        # Sets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN in env.
        # The role has ECR push + KMS sign permissions.
        # See "Stub AWS profile" step below for why a stub ~/.aws/config entry is also needed.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1

      - name: Stub AWS profile for build script
        # build-push-admin-ui.sh hard-codes `export AWS_PROFILE="${AWS_PROFILE:-openbank}"`
        # for local SSO use. In CI, the OIDC env vars are the real credentials, but the
        # AWS CLI throws "config profile not found" before reaching the env-var provider
        # if the named profile doesn't exist in ~/.aws/config. Creating a minimal stub
        # (region only, no credentials) makes the profile loader succeed; the CLI then
        # falls through to AWS_ACCESS_KEY_ID / AWS_SESSION_TOKEN from the OIDC step.
        run: |
          mkdir -p ~/.aws
          # Idempotent: on PERSISTENT runners (Hetzner/Mac) a bare `>>` appended a
          # duplicate [profile openbank] section every run; awscli v2 then rejects the
          # whole file ("Unable to parse config file"), breaking aws for any other job
          # that lands on the same host (e.g. tofu plan/apply on the openbank-batch pool).
          # Only add the stub if it isn't already present.
          grep -q '^\[profile openbank\]' ~/.aws/config 2>/dev/null \
            || printf '[profile openbank]\nregion = eu-north-1\n' >> ~/.aws/config

      - name: Clear stale ECR credentials (macOS keychain)
        if: runner.os == 'macOS'
        run: |
          docker logout "$ECR_REGISTRY" 2>/dev/null || true
          # docker logout clears ~/.docker/config.json but leaves the osxkeychain entry;
          # the subsequent docker login then fails with "already exists in the keychain".
          security delete-internet-password -s "$ECR_REGISTRY" 2>/dev/null || true
          # Remove credsStore=osxkeychain from Docker config so amazon-ecr-login stores
          # credentials in the config file rather than the macOS Keychain. The Keychain
          # requires interactive unlocking (-25308: errSecInteractionNotAllowed) which
          # fails in non-interactive CI sessions. File-based credentials are safe here:
          # the runner is ephemeral per-job and ECR tokens expire in 12 h anyway.
          python3 -c "import json,pathlib; p=pathlib.Path.home()/'.docker'/'config.json'; d=json.loads(p.read_text()) if p.exists() else {}; d.pop('credsStore',None); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(d))"

      - name: ECR login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Rebuild ob-deploy-builder with native arm64 image
        # ob-deploy-builder's BuildKit container was created from an amd64 moby/buildkit
        # image. On OrbStack arm64, the amd64 container runs via QEMU x86 emulation.
        # QEMU crashes with SIGILL when Node.js npm ci hits ARM instructions the bundled
        # QEMU version doesn't emulate.
        #
        # Fix: remove the amd64 BuildKit image from Docker's local cache (docker buildx rm
        # only removes the builder config, not the image), force-pull the arm64 variant,
        # then recreate the builder pinned to that image. The --driver-opt image= pin
        # ensures Docker uses the arm64 image we just pulled, not whatever is cached.
        run: |
          docker buildx rm ob-deploy-builder 2>/dev/null || true
          docker image rm moby/buildkit:buildx-stable-1 2>/dev/null || true
          docker pull --platform linux/arm64 moby/buildkit:buildx-stable-1
          docker buildx create \
            --name ob-deploy-builder \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:buildx-stable-1" \
            --platform linux/arm64 \
            --bootstrap \
            --use
          docker buildx inspect ob-deploy-builder
      - name: Stage per-service SBOMs from latest security run
        # security.yml uploads `per-service-sboms` (openbank-*-sbom.cdx.json). We download
        # and stage them as openbank-*/build/reports/bom.json so the Dockerfile
        # sbom-collector stage bundles them — without running Gradle here.
        #
        # Look the artifact up BY NAME across all runs (newest first), not by scanning a
        # window of recent security.yml runs. The run-window approach could not work:
        # security.yml runs on every main push (dozens/day) but emits per-service-sboms
        # only when dependencies change (its detect-deps gate), so the freshest SBOM is
        # routinely OLDER than the last 30 runs. Measured 2026-07-17: the 30-run window
        # spanned 18 h while the newest non-expired artifact was ~2 h older than its
        # oldest run — i.e. the scan missed it every single time, then slept 2×90 s
        # before degrading to "SBOMs unavailable". The retry+sleep never had a
        # mechanism to help: re-querying the same runs cannot conjure an artifact that
        # was never uploaded there. This is the same by-name lookup the JUnit staging
        # step below already uses.
        #
        # Provenance: per-service-sboms is uploaded only by security.yml's
        # sbom-per-service job, which is gated on detect-deps and never runs on PRs —
        # so the artifact always comes from a main push or a scheduled audit. The
        # head_branch == main filter below asserts that here rather than depending on a
        # condition in another workflow, because these SBOMs get baked into a shipped image.
        #
        # Best-effort: nothing to stage exits 0 (SBOMs degrade to "not available") but
        # emits a ::warning:: — the previous silent exit is what let this bug hide.
        #
        # Uses curl + python3 (not gh CLI) because the self-hosted Mac mini runner user
        # (/home/runner) does not have gh in PATH. curl and python3 are standard macOS tools.
        # Requires actions: read permission on GITHUB_TOKEN (added to permissions above).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }
          staged=false
          # Sort by created_at ourselves: the API's ordering is not contractual.
          ARTIFACT=$(api \
            "https://api.github.com/repos/${REPO}/actions/artifacts?name=per-service-sboms&per_page=20" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('artifacts',[]) if not x['expired'] and (x.get('workflow_run') or {}).get('head_branch')=='main']; a.sort(key=lambda x: x['created_at'], reverse=True); print(str(a[0]['id'])+' '+a[0]['created_at'] if a else '')" \
            2>/dev/null || true)
          if [ -n "${ARTIFACT}" ]; then
            ARTIFACT_ID="${ARTIFACT%% *}"
            mkdir -p sbom-downloads
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
                -L -o /tmp/per-service-sboms.zip 2>/dev/null; then
              unzip -q /tmp/per-service-sboms.zip -d sbom-downloads/ 2>/dev/null || true
              echo "Downloaded per-service-sboms artifact ${ARTIFACT_ID} (created ${ARTIFACT#* })"
              staged=true
            fi
          fi

          if [ "${staged}" != "true" ]; then
            echo "::warning title=SBOM staging degraded::no non-expired per-service-sboms artifact from a main run — the admin-ui image ships without bundled per-service SBOMs (they will show as unavailable). security.yml's sbom-per-service job may not have run within the 14-day artifact retention."
            exit 0
          fi

          for f in sbom-downloads/*.cdx.json; do
            [ -f "$f" ] || continue
            svc="$(basename "$f" "-sbom.cdx.json")"
            mkdir -p "${svc}/build/reports"
            cp "$f" "${svc}/build/reports/bom.json"
            echo "  staged ${svc}/build/reports/bom.json"
          done
          echo "SBOM staging complete."

      - name: Stage Test Intelligence evidence (per-service latest artifact)
        # services-ci.yml uploads one artifact per service: test-reports-{service}
        # (7-day retention). The old approach (download from ONE run) fails with
        # path-scoped CI: only recently-changed services have artifacts in any single
        # run, so unchanged services always show 0 tests in the UI.
        #
        # Fix: look up the most recent non-expired artifact for EACH known service
        # independently from the named-artifact endpoint.  A global artifact list
        # with `per_page=1` is unsound here: its newest item can be an unmerged PR
        # artifact, and filtering it out would hide the older valid main artifact.
        # Scan a bounded number of pages for the latest non-expired main result,
        # so unrelated frequent main runs cannot evict an unchanged service's proof.
        #
        # Uses curl + python3 (not gh CLI) — see SBOM staging step comment.
        # Best-effort: expired or absent → shows tests:0 (accurate "not run recently").
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }

          # Released components come from version.txt. The deterministic-simulation
          # harness is an explicitly governed tooling component without a release
          # version; it emits the same v1 envelope and must not disappear between
          # producer and deployment merely because it is intentionally unreleased.
          mapfile -t SERVICES < <(
            {
              find . -mindepth 2 -maxdepth 2 -name version.txt -printf '%h\n' | sed 's#^./##'
              [ ! -d openbank-simulation ] || printf '%s\n' openbank-simulation
            } | sort -u
          )

          latest_main_artifact() {
            local artifact_name="$1" page artifact
            # Artifact results are newest-first for this exact name.  Five pages
            # cap this best-effort collector at 295 read calls for 59 components;
            # a hit normally arrives on page one.
            for page in 1 2 3 4 5; do
              artifact="$(api "https://api.github.com/repos/${REPO}/actions/artifacts?name=${artifact_name}&per_page=100&page=${page}" \
                | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('artifacts',[]) if not x['expired'] and (x.get('workflow_run') or {}).get('head_branch') == 'main']; print(str(a[0]['id']) if a else '')" \
                2>/dev/null || true)"
              if [ -n "${artifact}" ]; then
                printf '%s\n' "${artifact}"
                return 0
              fi
            done
            return 1
          }

          DOWNLOADED=0
          for svc in "${SERVICES[@]}"; do
            art_name="test-intelligence-${svc}"
            # This image represents deployed main, not the newest PR candidate.
            # Keep branch provenance explicit: an unmerged artifact must never be
            # presented in the sandbox as evidence for the deployed revision.
            art_id="$(latest_main_artifact "${art_name}" || true)"
            if [ -z "${art_id}" ]; then
              echo "  ${svc}: no artifact (skip)"
              continue
            fi
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${art_id}/zip" \
                -L -o "/tmp/${art_name}.zip" 2>/dev/null; then
              TMPDIR_ART="/tmp/${art_name}-extracted"
              rm -rf "${TMPDIR_ART}" && mkdir -p "${TMPDIR_ART}"
              unzip -q "/tmp/${art_name}.zip" -d "${TMPDIR_ART}" 2>/dev/null || true
              # actions/upload-artifact strips the uploaded directory prefix: the
              # service envelope is therefore normally `run.json` at the archive
              # root.  Keep accepting the previous nested layout too, so the UI
              # retains the latest per-service execution evidence across action
              # layout changes rather than silently falling back to stale JUnit.
              RUN_JSON="$(find "${TMPDIR_ART}" -type f \( -name 'run.json' -o -path '*/test-intelligence/run.json' \) -print -quit)"
              if [ -n "${RUN_JSON}" ]; then
                mkdir -p "${svc}/build/test-intelligence"
                cp "${RUN_JSON}" "${svc}/build/test-intelligence/run.json"
              fi
              # Inside the zip: test-results/*/TEST-*.xml (actions/upload-artifact@v7 strips
              # the leading service/build/ prefix). Reconstruct the full target path.
              find "${TMPDIR_ART}" -path "*/test-results/*/TEST-*.xml" | while read -r xml; do
                rel="test-results/${xml#*/test-results/}"
                target="${svc}/build/${rel}"
                mkdir -p "$(dirname "${target}")"
                cp "${xml}" "${target}"
              done
              find "${TMPDIR_ART}" -path '*/reports/kover/report.xml' | while read -r xml; do
                mkdir -p "${svc}/build/reports/kover"
                cp "${xml}" "${svc}/build/reports/kover/report.xml"
              done
              DOWNLOADED=$((DOWNLOADED + 1))
              echo "  ${svc}: staged"
            else
              echo "  ${svc}: download failed (skip)"
            fi
          done
          COUNT=$(find . -path "*/build/test-results/*/TEST-*.xml" | wc -l | tr -d ' ')
          RUN_COUNT=$(find . -path "*/build/test-intelligence/run.json" | wc -l | tr -d ' ')
          echo "Staged ${RUN_COUNT} run envelopes and ${COUNT} JUnit XML files from ${DOWNLOADED}/${#SERVICES[@]} services."

      - name: Stage customer-app Test Intelligence evidence
        # Cross-repository evidence is read-only and best-effort. The compact JSON artifact
        # contains counts and provenance only; it never imports private source or test output.
        if: env.APP_RO_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.OPENBANK_APP_RO_TOKEN }}
          APP_REPO: JiRaska/openbank-app
        run: |
          set -u
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/client-test-evidence
          # Only reviewed default-branch evidence may enter a deployed control plane. A newer
          # PR artifact remains visible in GitHub but cannot replace the sandbox verdict.
          ARTIFACTS="$(api "https://api.github.com/repos/${APP_REPO}/actions/artifacts?per_page=100" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('artifacts',[]) if x['name'].startswith('openbank-app-test-intelligence-') and not x['expired'] and (x.get('workflow_run') or {}).get('head_branch') == 'main']; a.sort(key=lambda x:x['created_at'], reverse=True); [print(x['id']) for x in a[:20]]" 2>/dev/null || true)"
          while read -r artifact_id; do
            [ -n "${artifact_id}" ] || continue
            archive="/tmp/openbank-app-test-intelligence-${artifact_id}.zip"
            api "https://api.github.com/repos/${APP_REPO}/actions/artifacts/${artifact_id}/zip" -L -o "${archive}" 2>/dev/null || continue
            evidence="$(unzip -Z1 "${archive}" | awk '/\.json$/{print; exit}')"
            [ -n "${evidence}" ] || continue
            # Every producer artifact contains `openbank-app-unit.json`. Preserve a unique
            # deployment-local name or older downloads overwrite the newest observation.
            unzip -p "${archive}" "${evidence}" > "openbank-admin-ui/client-test-evidence/openbank-app-${artifact_id}.json"
          done <<< "${ARTIFACTS}"
          echo "Staged $(find openbank-admin-ui/client-test-evidence -name '*.json' | wc -l | tr -d ' ') mobile client evidence artifact(s)."

      - name: Stage immutable per-attempt Test Intelligence history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/test-run-history
          MAX_ENVELOPES=100
          # The workflow-runs endpoint is dominated by deploy-only Services CI runs, which
          # produce no per-service envelope.  Even a 100-run scan can therefore find zero
          # evidence while fresh immutable artifacts exist. Query the artifact inventory
          # directly, retaining only non-expired main-branch envelopes. The artifact list is
          # newest-first across the entire repository; one 100-item page is readily filled
          # by per-service evidence, so page it before applying the bounded 100-envelope cap.
          # GitHub's `name` filter is exact-match and cannot select run-id-suffixed artifacts.
          for page in 1 2 3 4 5; do
            api "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${page}" \
              | python3 -c "import json,sys; [print(a['id'],a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('test-intelligence-run-') and not a['expired'] and (a.get('workflow_run') or {}).get('head_branch') == 'main']" 2>/dev/null || true
          done \
            | head -"${MAX_ENVELOPES}" \
            | while read -r artifact_id artifact_name; do
                [ "$(find openbank-admin-ui/test-run-history -name '*.json' | wc -l | tr -d ' ')" -lt "$MAX_ENVELOPES" ] || break
                [ -n "${artifact_id}" ] || continue
                archive="/tmp/${artifact_name}.zip"
                api "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}/zip" -L -o "${archive}" 2>/dev/null || continue
                # actions/upload-artifact strips the uploaded directory prefix, so the
                # immutable service envelope is normally `run.json` at the zip root.
                # Keep accepting a nested path for compatibility with an artifact action
                # layout change, but never require a source-tree path that is not retained.
                envelope="$(unzip -Z1 "${archive}" | awk '$0 == "run.json" || /\/run\.json$/ { print; exit }' || true)"
                [ -n "${envelope}" ] || continue
                unzip -p "${archive}" "${envelope}" > "openbank-admin-ui/test-run-history/${artifact_name}.json"
              done
          echo "Staged $(find openbank-admin-ui/test-run-history -name '*.json' | wc -l | tr -d ' ') immutable run envelopes."

      - name: Stage pitest mutation results from latest weekly run
        # pitest.yml uploads one artifact per service: pitest-{service} (30-day retention).
        # collect-quality-report.mjs reads openbank-*/build/reports/pitest/mutations.xml.
        # Uses curl + python3 (not gh CLI) — see SBOM staging step comment.
        # Best-effort: absent → mutations tab stays empty (acceptable, never blocks build).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }
          RUN_ID=$(api \
            "https://api.github.com/repos/${REPO}/actions/workflows/pitest.yml/runs?branch=main&status=success&per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs',[]); print(r[0]['id'] if r else '')" \
            2>/dev/null || true)
          if [ -z "${RUN_ID}" ]; then
            echo "No successful pitest run found — skipping pitest staging."
            exit 0
          fi
          echo "Staging pitest results from run ${RUN_ID}..."
          ARTIFACTS=$(api \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | python3 -c "import json,sys; [print(a['id'],a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('pitest-') and not a['expired']]" \
            2>/dev/null || true)
          if [ -z "${ARTIFACTS}" ]; then
            echo "No pitest artifacts found in run ${RUN_ID} — skipping."
            exit 0
          fi
          DOWNLOADED=0
          while IFS=' ' read -r art_id art_name; do
            [ -n "${art_id}" ] || continue
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${art_id}/zip" \
                -L -o "/tmp/${art_name}.zip" 2>/dev/null; then
              # The artifact is named pitest-<service>; its zip top-level is the pitest
              # report contents (mutations.xml, index.html, com.openbank.*/ …) because
              # actions/upload-artifact@v7 strips the <service>/build/reports/pitest/
              # prefix (pitest.yml uploads that dir as `path`). Reconstruct that exact
              # path so collect-quality-report.mjs finds it — never `-d .`, which dumps
              # a full report into the repo root and gets it committed (#1104).
              svc="${art_name#pitest-}"
              dest="${svc}/build/reports/pitest"
              mkdir -p "${dest}"
              unzip -q "/tmp/${art_name}.zip" -d "${dest}" 2>/dev/null || true
              DOWNLOADED=$((DOWNLOADED + 1))
            fi
          done <<< "${ARTIFACTS}"
          COUNT=$(find . -path "*/build/reports/pitest/mutations.xml" | wc -l | tr -d ' ')
          echo "Staged ${COUNT} mutations.xml files from ${DOWNLOADED} artifacts."

      - name: Stage performance evidence from latest complete k6 run
        # The Test Intelligence collector reads k6 summaries only from the deployment-local
        # perf-artifacts directory.  A declared scenario is deliberately not promoted to a
        # result, so bring in only artifacts emitted by the latest successful main run of the
        # governed performance workflows.  The money-path baseline may intentionally emit only
        # a `not-run` envelope when no safe runner target exists; retain that provenance too.
        # A manually narrowed perf-gate dispatch is useful for diagnosis, but must not replace
        # the broader declared-scope snapshot with one service's result.  Select the newest
        # successful run that retained BOTH declared v1 artifacts instead.
        # Missing or expired evidence remains `not-run` in the
        # UI; this best-effort staging step must never turn absence into a deployment failure.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/perf-artifacts
          RUN_ID=""
          RUN_IDS=$(api \
            "https://api.github.com/repos/${REPO}/actions/workflows/perf-gate.yml/runs?branch=main&status=success&per_page=20" \
            | python3 -c "import json,sys; [print(r['id']) for r in json.load(sys.stdin).get('workflow_runs',[])]" \
            2>/dev/null || true)
          for candidate in ${RUN_IDS}; do
            candidate_artifacts=$(api \
              "https://api.github.com/repos/${REPO}/actions/runs/${candidate}/artifacts?per_page=100" \
              | python3 -c "import json,sys; [print(a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if not a['expired']]" \
              2>/dev/null || true)
            if grep -qx 'perf-reports-openbank-product-catalog' <<< "${candidate_artifacts}" \
              && grep -qx 'perf-reports-openbank-flaky-test-hunter' <<< "${candidate_artifacts}"; then
              RUN_ID="${candidate}"
              break
            fi
          done
          if [ -z "${RUN_ID}" ]; then
            echo "No successful complete declared-scope performance run found — performance evidence remains not-run."
            exit 0
          fi
          ARTIFACTS=$(api \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | python3 -c "import json,sys; [print(a['id'],a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('perf-reports-') and not a['expired']]" \
            2>/dev/null || true)
          if [ -z "${ARTIFACTS}" ]; then
            echo "No non-expired performance artifacts in run ${RUN_ID} — performance evidence remains not-run."
            exit 0
          fi
          DOWNLOADED=0
          while IFS=' ' read -r artifact_id artifact_name; do
            [ -n "${artifact_id}" ] || continue
            archive="/tmp/${artifact_name}.zip"
            if api "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}/zip" -L -o "${archive}" 2>/dev/null; then
              unzip -q "${archive}" -d openbank-admin-ui/perf-artifacts 2>/dev/null || true
              DOWNLOADED=$((DOWNLOADED + 1))
            fi
          done <<< "${ARTIFACTS}"
          COUNT=$(find openbank-admin-ui/perf-artifacts -name '*-summary.json' | wc -l | tr -d ' ')
          echo "Staged ${COUNT} k6 summary file(s) from ${DOWNLOADED} performance artifact(s), run ${RUN_ID}."

          BASELINE_RUN_ID=$(api \
            "https://api.github.com/repos/${REPO}/actions/workflows/perf-baseline.yml/runs?branch=main&status=success&per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs',[]); print(r[0]['id'] if r else '')" \
            2>/dev/null || true)
          if [ -z "${BASELINE_RUN_ID}" ]; then
            echo "No successful money-path baseline run found — it remains declared but unmeasured."
            exit 0
          fi
          BASELINE_ARTIFACT=$(api \
            "https://api.github.com/repos/${REPO}/actions/runs/${BASELINE_RUN_ID}/artifacts?per_page=100" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('artifacts',[]) if x['name']=='k6-money-path-summary' and not x['expired']]; print(a[0]['id'] if a else '')" \
            2>/dev/null || true)
          if [ -z "${BASELINE_ARTIFACT}" ]; then
            echo "Money-path baseline ${BASELINE_RUN_ID} has no retained evidence artifact."
            exit 0
          fi
          BASELINE_DIR="$(mktemp -d)"
          if ! api "https://api.github.com/repos/${REPO}/actions/artifacts/${BASELINE_ARTIFACT}/zip" -L -o /tmp/k6-money-path-summary.zip \
            || ! unzip -q /tmp/k6-money-path-summary.zip -d "${BASELINE_DIR}"; then
            echo "::warning::Could not stage money-path baseline evidence from run ${BASELINE_RUN_ID}."
            exit 0
          fi
          BASELINE_SUMMARY=$(find "${BASELINE_DIR}" -name 'perf-summary.json' -print -quit)
          BASELINE_ENVELOPE=$(find "${BASELINE_DIR}" -name 'perf-run.json' -print -quit)
          SUMMARY_STATUS=no
          if [ -n "${BASELINE_SUMMARY}" ]; then
            cp "${BASELINE_SUMMARY}" openbank-admin-ui/perf-artifacts/money-path-smoke-summary.json
            SUMMARY_STATUS=yes
          fi
          ENVELOPE_STATUS=no
          if [ -n "${BASELINE_ENVELOPE}" ]; then
            cp "${BASELINE_ENVELOPE}" openbank-admin-ui/perf-artifacts/money-path-smoke-summary.json.run.json
            ENVELOPE_STATUS=yes
          fi
          echo "Staged money-path baseline ${BASELINE_RUN_ID}: summary=${SUMMARY_STATUS} envelope=${ENVELOPE_STATUS}."

      - name: Collect production-readiness scorecard
        # Derives C1–C9 maturity scores from the repo and writes
        # openbank-admin-ui/prod-readiness.json so the Dockerfile bakes it into
        # the image. build-push-admin-ui.sh also calls the Python version as a
        # belt-and-suspenders fallback; this Node step runs first so the bundle
        # is already present when the Docker build starts.
        # Best-effort: a failure must not abort the deploy.
        working-directory: openbank-admin-ui
        run: |
          if ! node scripts/collect-prod-readiness.mjs 2>&1; then
            echo "::warning::prod-readiness collector failed — scorecard page will show no data"
          fi

      - name: Collect CI gate-estate health snapshot (ADR-0255)
        # Derives gate-health.json from the GitHub Actions API — same read-only,
        # baked-at-build-time shape as prod-readiness above and DORA (ADR-0061):
        # the token this step holds (actions: read, job-scoped) never reaches the
        # runtime pod. Best-effort: a failure must not abort the deploy, same as
        # the prod-readiness collector — a missing snapshot degrades the DevOps
        # page's QG panel to a small inline notice, never a build failure.
        working-directory: openbank-admin-ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! node scripts/collect-gate-health.mjs 2>&1; then
            echo "::warning::gate-health collector failed — QG panel will show no data"
          fi

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Stage Test Intelligence deployment history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api() { curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p openbank-admin-ui/test-intelligence-history
          # Query the owning workflow's successful main runs, not the repository-wide artifact
          # stream. Every services-ci run contributes many artifacts and previously pushed a
          # snapshot beyond the fixed five-page search window. A successful Admin-UI deploy owns
          # at most one immutable snapshot, so this route is complete without unrelated artifacts.
          # Measured 2026-08-26: 30 retained snapshots were found in 51 runs (52 API calls).
          # The 100-run ceiling bounds pathological missing-artifact cases;
          # fewer results remain explicit in the rendered history (#6614).
          snapshot_ids="${RUNNER_TEMP}/test-intelligence-snapshot-ids"
          : > "${snapshot_ids}"
          snapshot_count=0
          run_ids="$(api "https://api.github.com/repos/${REPO}/actions/workflows/admin-ui-deploy.yml/runs?branch=main&status=success&per_page=100" \
            | python3 -c "import json,sys; [print(x['id']) for x in json.load(sys.stdin).get('workflow_runs',[])]" 2>/dev/null || true)"
          while read -r deploy_run_id; do
            [ -n "${deploy_run_id}" ] || continue
            [ "${snapshot_count}" -lt 30 ] || break
            api "https://api.github.com/repos/${REPO}/actions/runs/${deploy_run_id}/artifacts?per_page=100" \
              | python3 -c "import json,sys; [print(x['id']) for x in json.load(sys.stdin).get('artifacts',[]) if x['name'].startswith('test-intelligence-snapshot-') and not x['expired']]" \
              >> "${snapshot_ids}" 2>/dev/null || true
            snapshot_count="$(awk '!seen[$0]++' "${snapshot_ids}" | wc -l | tr -d ' ')"
          done <<< "${run_ids}"
          awk '!seen[$0]++' "${snapshot_ids}" | head -30 \
            | while read -r artifact_id; do
                [ -n "${artifact_id}" ] || continue
                api "https://api.github.com/repos/${REPO}/actions/artifacts/${artifact_id}/zip" -L -o "/tmp/test-intelligence-${artifact_id}.zip" 2>/dev/null || continue
                unzip -joq "/tmp/test-intelligence-${artifact_id}.zip" '*.json' -d openbank-admin-ui/test-intelligence-history 2>/dev/null || true
              done

      - name: Build, collect, push
        id: build
        env:
          # The build script's quality collector reads these only to fetch the
          # Pact Broker's per-Pact provider-verification verdict before the
          # immutable Test Intelligence snapshot is baked. Docker receives no
          # build arg for them, so they cannot enter the image or browser bundle.
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          # Optional: enables source-map upload to GlitchTip (#3235). Unset = no upload, normal
          # build — the maps are what turn a captured error into a file and a line.
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # build-push-admin-ui.sh derives the tag from git (dirty check runs BEFORE
          # the collectors, so a fresh CI checkout yields a clean tag). --no-sbom
          # skips ./gradlew sbomAll (too heavy for CI); SBOMs are staged from the
          # security workflow artifact in the preceding step instead.
          # --no-bump skips the sed+git step; the gitops PR job handles the bump.
          # ECR tags are immutable. An operator-initiated or scheduled evidence
          # refresh can intentionally rebuild the same commit after new artifacts
          # arrive, so make that refresh unique while retaining commit provenance.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ]; then
            export ADMIN_UI_IMAGE_TAG_SUFFIX="run${GITHUB_RUN_ID}"
          fi
          bash openbank-infra/scripts/build-push-admin-ui.sh --no-sbom --no-bump --no-login \
            2>&1 | tee /tmp/build-admin-ui.log

          # Extract the tag from the script's own "==> pushed <image>:<tag>" line.
          # Avoids SHA length drift: `git rev-parse --short` uses a dynamic length
          # (repo-dependent, typically 7) while a hardcoded ::N substring might differ
          # — a mismatch would rewrite GitOps to a tag never pushed to ECR.
          PUSHED="$(grep '^==> pushed ' /tmp/build-admin-ui.log | tail -1 | awk '{print $3}')"
          TAG="${PUSHED##*:}"
          [ -n "${TAG}" ] || { echo "ERROR: could not extract pushed image tag"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Pushed tag: ${TAG}"

      - name: Retain immutable Test Intelligence snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-intelligence-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: openbank-admin-ui/test-intelligence.json
          if-no-files-found: error
          retention-days: 30

      - name: Rewrite GitOps image tag
        id: rewrite
        run: |
          set -euo pipefail
          # Recompute the bump against LIVE main, not against github.sha (#3194). The checkout
          # above has no `ref:`, so on a push it holds the commit that triggered the build. The
          # build takes minutes, admin-ui deploys are frequent, and if another one merges in that
          # window create-pull-request branches from a main that no longer exists — both sides
          # having rewritten the same `image:` line. The PR is then born CONFLICTED, which means
          # no refs/pull/<n>/merge, which means NO workflow run at all: not skipped, absent. It
          # reads as "waiting", never as broken, and the image is simply never deployed (four in
          # one day, three closed undeployed).
          #
          # Safe because the rewrite is deterministic — set `image:` to the tag just built — so
          # recomputing it against a newer main is always correct. It is what a human does when
          # resolving this by hand.
          git fetch origin main
          git reset --hard origin/main
          TAG="${{ steps.build.outputs.tag }}"
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}"

          old_tag="$(grep -oE "${IMAGE}:sandbox-[A-Za-z0-9._-]+" "${MANIFEST}" | head -1 | cut -d: -f2 || true)"
          if [ "${old_tag}" = "${TAG}" ]; then
            echo "Manifest already at ${TAG} — no change needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            sed -i.bak -E "s#(image: ${IMAGE}:)[^[:space:]]+#\1${TAG}#" "${MANIFEST}"
            rm -f "${MANIFEST}.bak"
            echo "Updated ${MANIFEST}: ${old_tag:-?} → ${TAG}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub signs API-created commits for GitHub *App* tokens (and the web UI's web-flow
      # key) — never for a user PAT. The old GITOPS_PR_TOKEN was a user PAT, so `sign-commits:
      # true` below faithfully routed the commit through the API and GitHub declined to sign it:
      # every bot deploy commit that fell to the PAT came out `verified=false; reason=unsigned`,
      # and required_signatures stranded the PR until a human re-signed it by hand (issue #1269).
      # That is exactly why the PAT was retired (#1305): an App installation token is the only
      # option that satisfies both constraints at once — it triggers the required checks
      # (GITHUB_TOKEN does not) AND its commits get signed (a PAT's do not).
      - name: Mint a GitHub App installation token
        id: app_token
        if: ${{ steps.rewrite.outputs.changed == 'true' && env.GITOPS_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Open GitOps PR (auto-merge)
        id: gitops_pr
        if: steps.rewrite.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Preference order, and why each rung exists:
          #   1. App installation token — triggers required checks AND gets its commit signed.
          #      The only rung that actually works end-to-end (issue #1269). Proven on both
          #      axes, so it is now the sole real path (the GITOPS_PR_TOKEN user PAT was retired
          #      here, issue #1305 — its commits were unsigned and stranded the PR anyway).
          #   2. GITHUB_TOKEN — last-resort only; a PR opened with it does NOT trigger workflows
          #      (anti-recursion), so the required checks never run and there is nothing to
          #      auto-merge against (an admin merges it by hand). Degraded fallback, not a
          #      working path — it exists so a broken App-token mint still opens a rescuable PR.
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          # Route the commit through the GitHub API so GitHub can sign it. Necessary but NOT
          # sufficient on its own — the token above decides whether the signing actually
          # happens. The "Verify the deploy commit is signed" step below is what proves it did.
          sign-commits: true
          # Commit ONLY the manifest the rewrite step edited. Without this, create-pull-request
          # sweeps the whole dirty tree — and build-push-admin-ui.sh has just regenerated six
          # derived dossiers into it (catalog, service-graph, security-graph, governance,
          # infra-lifecycle, cluster-topology). Committing those was never a decision; it was a
          # side effect, and it cost three separate defects:
          #   1. Two concurrent deploy PRs conflict BY CONSTRUCTION. cluster-topology.json and
          #      infra-lifecycle.json carry a wall-clock `generatedAt`, so every deploy PR
          #      rewrites that line with a different value. #2618 went DIRTY on exactly that —
          #      not on the image tag, which is what everyone assumes (issue #2621).
          #   2. A deploy loop, worked around by the `if:` on this job (line ~83): the PR touches
          #      openbank-admin-ui/**, which is this workflow's own path filter.
          #   3. agent-review (retired #2161) flagged the derived churn as an infra decision, piling up
          #      #596/#608/#609 unmerged on 2026-07-08 — worked around by path exclusions in
          #      agent-review.yml, i.e. at the symptom.
          # The dossiers are still generated on every build and still baked by the Dockerfile;
          # the committed copies remain as the build-context fallback. Nothing needs them to be
          # rewritten by a deploy. Scoping the commit removes all three at the cause.
          add-paths: ${{ env.MANIFEST }}
          branch: chore/admin-ui-deploy-${{ github.sha }}
          delete-branch: true
          commit-message: "chore(admin-ui): deploy ${{ steps.build.outputs.tag }}"
          title: "chore(admin-ui): deploy ${{ steps.build.outputs.tag }}"
          body: |
            Auto-deploy from [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Triggered by commit ${{ github.sha }} on `main`.

            ## Linked issues

            N/A — automated admin-ui GitOps update (ADR-0029 Layer B).
          labels: |
            chore
            gitops

      # Close every OLDER open deploy PR now that this one exists. A deploy PR rewrites an image tag
      # to the newest build, so two are never additive and both edit the same manifest line — left
      # open, whichever merges first leaves the rest conflicting while still reading as healthy
      # (green checks, auto-merge armed). branch-cleanup.yml already assumed this close happened
      # ("a superseded deploy PR is CLOSED-unmerged"); nothing ever performed it, and the backlog
      # reached 7 of the repo's 23 open PRs. Runs BEFORE the signature guard so a run that later
      # fails the guard still leaves exactly one current deploy PR behind, not a growing pile.
      # `add-paths` scopes the commit — which introduces a failure mode the workflow could not
      # previously have: if that path ever resolves to nothing (a renamed manifest, an empty
      # env.MANIFEST), create-pull-request commits nothing, opens no PR, and every later step is
      # gated on `pull-request-number != ''` and skips. The run then goes GREEN having built and
      # pushed an image that nothing will ever pin — a silent non-deploy, which is strictly worse
      # than a red run. The rewrite step already told us a change was needed; if no PR carries it,
      # that is a hard failure.
      - name: Fail if a needed deploy produced no PR
        if: steps.rewrite.outputs.changed == 'true' && steps.gitops_pr.outputs.pull-request-number == ''
        run: |
          echo "::error::Rewrite step updated ${MANIFEST} to ${{ steps.build.outputs.tag }}, but no" \
               "GitOps PR was opened — so the pushed image will never be pinned. Most likely the" \
               "create-pull-request 'add-paths' pathspec matched nothing (check MANIFEST=${MANIFEST})."
          exit 1

      - name: Close superseded deploy PRs
        if: steps.gitops_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .github/scripts/supersede-deploy-prs.sh \
            'chore/admin-ui-deploy-' '${{ steps.gitops_pr.outputs.pull-request-number }}'
      # Enable auto-merge so ArgoCD gets the new tag without a manual PR merge.
      # Uses the same retry pattern as auto-deploy.yml (required checks register with
      # a small lag after PR creation → keep retrying until enablePullRequestAutoMerge
      # accepts, or give up after 8 attempts and leave it for a human).
      # Runs BEFORE the signature guard on purpose: arming auto-merge is what lets a manual
      # re-sign land by itself, so it must happen even on the run where the guard then fails.
      - name: Enable auto-merge
        if: steps.gitops_pr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = Number('${{ steps.gitops_pr.outputs.pull-request-number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number,
            });
            const mutation = `mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                pullRequest { number }
              }
            }`;
            for (let i = 1; i <= 8; i++) {
              try {
                await github.graphql(mutation, { id: pr.node_id });
                core.info(`auto-merge enabled (attempt ${i})`);
                return;
              } catch (e) {
                core.info(`attempt ${i}/8 not ready: ${e.message}`);
                await new Promise(r => setTimeout(r, 12000));
              }
            }
            // setFailed, NOT notice (issue #6231): a deploy PR with auto-merge unarmed never
            // merges, so the deploy silently does not happen while every job stays green and
            // the only evidence is one notice line in a job nobody opens. Same change as
            // auto-deploy.yml — the two share this step verbatim.
            core.setFailed(
              `auto-merge could not be enabled on PR #${pull_number} after 8 attempts, so this deploy ` +
              `will NOT land on its own — the PR stays open until someone merges it. Check the App ` +
              `token (GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY) and branch protection.`
            );

      # The failure this guards against is silent by construction: create-pull-request logs
      # "Commit verified: false; reason: unsigned" and exits 0, the PR opens with every check
      # green and auto-merge armed, and it simply never merges. That reads as healthy from
      # every angle except the one nobody checks — which is how #806 shipped a fix that
      # no-opped for five days and stranded seven deploy PRs at once (issue #1269).
      # Fail loudly instead: an unsigned commit means required_signatures WILL strand this PR.
      #
      # Keep this LAST in the job, and `always()`: core.setFailed() skips every subsequent
      # step that is not always(), so any step appended after this one would be silently
      # starved on exactly the runs where it matters most.
      - name: Verify the deploy commit is signed
        if: ${{ always() && steps.gitops_pr.outputs.pull-request-number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = Number('${{ steps.gitops_pr.outputs.pull-request-number }}');
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner, repo: context.repo.repo, pull_number,
            });
            const unsigned = commits.filter(c => !c.commit.verification?.verified);
            if (unsigned.length === 0) {
              core.info(`all ${commits.length} commit(s) on PR #${pull_number} are signed and verified`);
              return;
            }
            for (const c of unsigned) {
              core.error(`${c.sha}: verified=false reason=${c.commit.verification?.reason ?? 'unknown'} committer=${c.commit.committer?.name}`);
            }
            core.setFailed(
              `PR #${pull_number} carries ${unsigned.length} unsigned commit(s); the main ruleset's ` +
              `required_signatures will block it and this deploy will never land. ` +
              `Most likely cause: no GitHub App token — GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY unset, so the ` +
              `run fell back to GITHUB_TOKEN, whose PR does not trigger the required checks (anti-recursion), ` +
              `so auto-merge can never fire (the GITOPS_PR_TOKEN user-PAT fallback was retired in #1305). ` +
              `To rescue this PR by hand: amend the commit locally with a GPG signature and force-push, then ` +
              `re-run the required checks — auto-merge fires on its own once they pass and the signature is valid. ` +
              `The durable fix is to restore the App token (GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY).`
            );
