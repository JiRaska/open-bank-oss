# Dependabot PR workflows cannot read Actions secrets. Consume only the classification
# artifact from the read-only workflow, validate it against the live PR and run origin,
# then arm native auto-merge with an App token. App-authored merges trigger main CI;
# GITHUB_TOKEN-authored merges suppress it and leave exact-source Pact proof absent.
name: Dependabot privileged auto-merge

on:
  workflow_run:
    workflows: [Dependabot auto-merge]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: dependabot-privileged-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  arm:
    name: Arm verified Dependabot patch PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Find patch eligibility artifact
        id: eligible
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "dependabot-auto-merge-eligibility" and (.expired | not))] | length')"
          case "$count" in
            0) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::ambiguous Dependabot eligibility artifacts'; exit 1 ;;
          esac

      - name: Download patch eligibility
        if: steps.eligible.outputs.exists == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-auto-merge-eligibility
          run-id: ${{ github.event.workflow_run.id }}
          path: eligibility
          github-token: ${{ github.token }}

      # Checkout the protected default branch only; never execute code from the PR
      # or from the downloaded artifact. The artifact is parsed as untrusted JSON.
      - name: Checkout trusted validator
        if: steps.eligible.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate run and current PR identity
        if: steps.eligible.outputs.exists == 'true'
        id: validate
        run: |
          python3 .github/scripts/validate-dependabot-auto-merge.py \
            eligibility/dependabot-eligibility.json "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint GitHub App token
        if: steps.eligible.outputs.exists == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Arm native auto-merge under App identity
        if: steps.eligible.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_URL: ${{ steps.validate.outputs.pr_url }}
        run: gh pr merge --auto --squash "$PR_URL"
