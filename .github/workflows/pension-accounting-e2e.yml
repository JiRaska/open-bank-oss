name: Pension accounting E2E

on:
  pull_request:
    paths:
      - "openbank-ledger-service/**"
      - "openbank-pension-fund-service/**"
      - "openbank-libs*/**"
      - "openbank-infra/gitops/components/ledger/**"
      - "openbank-infra/gitops/components/ledger-pension-co/**"
      - "openbank-infra/gitops/components/pension-fund/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/pension-accounting-e2e.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pension-accounting-e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Three-application pension accounting proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: false
          cache-read-only: true
          gradle-home-cache-strict-match: false

      - name: Install checksum-verified OPA
        # Same version and Linux AMD64 checksum as opa-policy.yml.
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/pension-accounting-bin"
          mkdir -p "$tool_dir"
          if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "$tool_dir/opa" \
            https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -o "$tool_dir/opa" \
              https://openpolicyagent.org/downloads/v1.21.1/opa_linux_amd64
          fi
          # Only a download failure selects the fallback; a checksum mismatch fails closed.
          printf '%s  %s\n' \
            '23c654cdb52fc80c3f30e85c0c884a15f78a10173d0a5a060aa25eac15f48fbb' \
            "$tool_dir/opa" | sha256sum --check --strict
          chmod +x "$tool_dir/opa"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/opa" version

      - name: Build the two production fast jars
        run: |
          ./gradlew :openbank-ledger-service:quarkusBuild :openbank-pension-fund-service:quarkusBuild \
            -Dquarkus.package.jar.type=fast-jar --build-cache --no-daemon --no-parallel --max-workers=2 \
            --console=plain --configure-on-demand

      - name: Exercise segregated books with local OIDC, OPA and mutual TLS
        run: |
          python3 openbank-pension-fund-service/e2e/accounting_close.py \
            --report "$RUNNER_TEMP/pension-accounting-assertions.json"

      - name: Upload assertion names only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pension-accounting-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          # The runner's temporary directory contains generated keys and must never be uploaded.
          path: ${{ runner.temp }}/pension-accounting-assertions.json
          if-no-files-found: warn
          retention-days: 7
