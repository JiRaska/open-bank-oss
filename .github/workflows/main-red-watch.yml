# -----------------------------------------------------------------------------
# main's own CI conclusion watch (issue #4019).
#
# WHY THIS EXISTS
#   A red push-triggered workflow on `main` is addressed to nobody: no PR carries
#   the check, no reviewer sees it, nothing notifies. The next PR opened against
#   that commit inherits a red it did not cause. On 2026-08-07/08 `main` was red
#   four times in three independent ways (Services CI / engagement-service, CI /
#   Admin UI build, Security scan / Trivy fs scan) and each was found only because
#   a human swept the Actions tab; two PRs merged onto it meanwhile.
#
#   Before this, the repo's only `workflow_run` listener was auto-retry-cancelled
#   .yml, which re-runs SPOT-KILLED runs and escalates nothing. deploy-drift-watch
#   .yml is the near-miss -- its name is "Deployed == main watch" but it compares
#   the DEPLOYED IMAGE to main and never reads main's CI conclusion, so a red
#   commit that deployed reads as perfectly in sync.
#
# ESCALATION, not redness. A workflow_run job going red would reproduce the very
#   blind spot it exists to close (auto-retry-cancelled.yml's header says the same
#   thing). So this opens or refreshes ONE `main-red` issue per watched workflow,
#   reopens it if hand-closed while main is still red, and closes it itself when
#   that workflow next goes green on main. Refreshed in place, never stacked --
#   the #3891 lesson.
#
# ATTEMPT SCOPING is the detail that decides whether this works at all. The
#   verdict comes from `/actions/runs/<id>/attempts/<n>/jobs`, never the unscoped
#   `/actions/runs/<id>/jobs`, which returns the LATEST attempt: once anybody
#   hand-re-runs a run, the unscoped endpoint answers about a different attempt
#   than the event fired for -- silently, with no error. Enforced by R4 of
#   check-main-red-watch.py.
#
# WHY IT IS NOT A REQUIRED CHECK
#   `workflow_run` and `paths:`-filtered workflows cannot be required contexts. The
#   BINDING copy of the declaration half is the `main-red-watch-declaration` gate
#   in .github/gates/gates.yaml, which runs unconditionally inside `Validate
#   manifests`; this workflow's pull_request lane is the fast echo.
#
# All reasoning lives in the script headers, never in a `run:` block: an oversized
#   `run:` step makes the WHOLE workflow unparseable with no size error (#3135).
# -----------------------------------------------------------------------------
name: main red watch

on:
  workflow_run:
    # Reject PR-branch completions before allocating a workflow run (Refs #9031).
    branches: [main]
    # R1: every workflow that pushes to main with no paths filter. These run on
    # every commit, so their conclusion IS main's health. The list is not
    # hand-maintained scope -- check-main-red-watch.py --check-declaration fails
    # when a new one appears and is neither here nor in its NOT_WATCHED map.
    workflows:
      - "CI"
      - "Services CI"
      - "Security scan"
      - "Secret scan"
      - "OPA policy"
      - "Dependency submission"
      - "Gradle wrapper validation"
      - "Release Please"
      # ADR-0279 #16/#20: the Semgrep IaC lane is a security gate; its red on main is a
      # container/manifest regression and must not stay silent.
      - "Semgrep IaC security"
      # Pushes to main unconditionally (issue #4240). Its red is meaningful in a way worth
      # naming: it means the watch could NOT read the ruleset bypass log — a permission-shaped
      # absence, not "nothing was bypassed". Exactly the state that must not stay silent.
      - "merged past red check watch"
      # Pushes to main unconditionally. Its red means armed PRs are no longer being kept
      # current (App token, API) and will sit `behind` forever again under the strict policy.
      - "Auto-update armed PRs"
      # R2: post-merge guards. Path-filtered, so they do NOT run on every commit —
      # but each is a governance verdict that only ever renders on main, which
      # makes them the LEAST likely reds to be seen and the most likely to rot.
      # Heals a derived artefact stale on main (#9755). Its red is the one state that must
      # not stay silent: either the regeneration itself broke, or a generator stopped being a
      # pure projection of its sources — and in both cases the fleet-wide merge freeze this
      # workflow exists to end is back, with nothing else reporting it.
      - "Derived artefact autoheal"
      - "ADR registry"
      # Builds, signs and pushes the IdP and LLM-gateway images (#11265). A red run on main
      # means a merged Dockerfile fix (a CVE bump) is not in the registry and not deployed.
      - "Platform images"
      - "Agent charter registry"
      - "AI governance snapshot"
      - "API contract post-merge guard"
      - "EU AI Act registry"
      - "Evals - copilot proposal quality"
      - "Evals - fraud review"
      - "Fleet lint"
      - "Label sync"
      - "Pact drift check"
      - "Product Catalog Native Build (T1 enabler smoke test)"
      - "Schema registry apply (document-service pilot)"
      - "Synthetic journeys"
      - "Admin UI browser synthetic"
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check-main-red-watch.py"
      - ".github/scripts/main-red-watch-order.cjs"
      - ".github/scripts/test-main-red-watch-order.cjs"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Falsify the watch against a known run id (no issue is touched)"
        required: false
      attempt:
        description: "Attempt number to inspect (defaults to the run's latest)"
        required: false

permissions:
  contents: read

concurrency:
  # Serialise real verdicts per watched workflow so two completions cannot race
  # the same issue. GitHub replaces an older PENDING run in a group even with
  # cancel-in-progress=false; a cancelled/skipped/neutral source event must not
  # evict a pending red or green verdict. Those events get a separate group and
  # skip the watch job without allocating a runner.
  group: >-
    main-red-watch-${{ github.event.workflow_run.name || github.ref }}-${{
    contains(fromJSON('["cancelled","skipped","neutral"]'), github.event.workflow_run.conclusion)
    && 'ignored' || 'verdict' }}
  cancel-in-progress: false

jobs:
  # PR / dispatch lane: prove the watch's coverage set and its classifier are
  # honest. Cheap, offline, and it is the only lane that runs on a PR.
  declaration:
    name: main-red-watch declaration
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-pyyaml-hash-pinned.sh
      - name: Self-test the watcher
        run: |
          python3 .github/scripts/check-main-red-watch.py --self-test
          node .github/scripts/test-main-red-watch-order.cjs
      - name: Every push-on-main workflow is watched or declared
        run: python3 .github/scripts/check-main-red-watch.py --check-declaration

  watch:
    name: main red watch
    # Only completions of a PUSH to main are a verdict on main. Without this the
    # watch fires on every PR run of all eight workflows and opens issues about
    # branches. `workflow_dispatch` with a run_id enters here too, for
    # falsification against a known-red and a known-green run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       !contains(fromJSON('["cancelled","skipped","neutral"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-pyyaml-hash-pinned.sh

      # A verdict that has only ever said "green" is indistinguishable from a
      # classifier that finds nothing. This step failing voids the run.
      - name: Self-test the watcher
        run: python3 .github/scripts/check-main-red-watch.py --self-test

      - name: Classify the run this event fired for
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          ATTEMPT: ${{ inputs.attempt || github.event.workflow_run.run_attempt }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set +e
          python3 .github/scripts/check-main-red-watch.py --inspect-run \
            --repo "$TARGET_REPO" \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" \
            --json /tmp/main-red.json | tee /tmp/main-red.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) : ;;
            1) echo "::error::The main-red watch could not answer for run $RUN_ID"
               echo "::error::attempt $ATTEMPT. That is a failure of THIS WATCH, not a"
               echo "::error::'main is green' verdict — see check-main-red-watch.py."
               exit 1 ;;
            2) echo "::warning::main is red — escalating onto a main-red issue." ;;
            3) echo "::warning::main-red-watch could not REACH the API for run $RUN_ID"
               echo "::warning::attempt $ATTEMPT — a quota or transport failure, not a verdict"
               echo "::warning::about main. Not failing this run: 18 red watches in 6 hours, ten"
               echo "::warning::of ten saying 'could not answer', is how a genuinely red main"
               echo "::warning::stops being visible (#9697). The next push re-reads main." ;;
            *) echo "::error::Unexpected exit $code."; exit "$code" ;;
          esac

      - name: Escalate or stand down
        # A manual dispatch inspects without touching an issue: falsifying the
        # watch must not manufacture the thing it reports.
        #
        # Exit 3 (the API refused to answer) is excluded for TWO independent reasons, either of
        # which alone would be a defect: `--json` is never written on that path, so this step
        # would die reading /tmp/main-red.json; and the branch below treats "not red" as a reason
        # to CLOSE this workflow's open main-red issue — so a rate limit would silently declare a
        # genuinely red main fixed. Not answering must change nothing (#9697).
        if: ${{ github.event_name == 'workflow_run' && steps.verdict.outputs.code != '3' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CODE: ${{ steps.verdict.outputs.code }}
        with:
          script: |
            const fs = require('fs')
            const { waitForCurrentVerdict, latestIndexedRun, remainingFailureLines, withFailureLines, mergeFailureLines, unresolvedAfterLaterRuns, successfulAfterLaterRuns, fetchCompleteAttemptJobs } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/main-red-watch-order.cjs`)
            const v = JSON.parse(fs.readFileSync('/tmp/main-red.json', 'utf8'))
            const LABEL = 'main-red'
            const slug = (v.workflow || 'unknown').toLowerCase().replace(/[^a-z0-9]+/g, '-')
            const marker = `<!-- main-red:${slug} -->`
            const REOPEN_WINDOW_DAYS = 14

            // Find this workflow's issue by MARKER, not by title: a title carries the
            // sha and moves every time the issue is refreshed.
            const findByMarker = async (state) => {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...context.repo, state, labels: LABEL, per_page: 100,
                sort: 'updated', direction: 'desc',
              })
              return issues.find(i => (i.body || '').includes(marker))
            }

            // Completion order differs from commit order. A slow old CI run may finish
            // after a newer green one and reopen an already-healed main-red issue.
            // Query only when an issue would change, to spare the installation API quota.
            if (v.status !== 'red' && v.status !== 'green') {
              core.info(`${v.workflow} concluded ${v.status}; leaving issue state unchanged.`)
              return
            }
            const openIssue = v.status === 'green' ? await findByMarker('open') : null
            if (v.status === 'green' && !openIssue) {
              core.info(`${v.workflow} green on main; nothing open.`)
              return
            }
            const workflowId = context.payload.workflow_run?.workflow_id
            if (!Number.isSafeInteger(workflowId) || workflowId < 1) {
              throw new Error('workflow_run has no valid workflow_id; refusing issue mutation')
            }
            let completedRuns = []
            const { superseded } = await waitForCurrentVerdict(
              v,
              async () => {
                const completed = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: workflowId, branch: 'main', event: 'push',
                  status: 'completed', per_page: 100,
                })
                completedRuns = completed.data.workflow_runs || []
                return latestIndexedRun(v, completedRuns)
              },
              ms => new Promise(resolve => setTimeout(resolve, ms)),
            )
            let currentFailures = v.failing.map(f =>
              `- \`${f.job}\` [${f.conclusion}] — ${f.steps.length ? f.steps.map(s => `\`${s}\``).join(', ') : '_no step-level failure reported_'} ([log](${f.job_url}))`)
            let successfulJobs = v.successful_jobs
            if (superseded) {
              // Later path-scoped runs may omit this event's jobs; replay only actual executions.
              const laterRuns = completedRuns.filter(r =>
                r.id > v.run_id || (r.id === v.run_id && r.run_attempt > v.attempt))
                .sort((a, b) => a.id - b.id || a.run_attempt - b.run_attempt)
              const laterJobs = []
              for (const run of laterRuns) {
                laterJobs.push(await fetchCompleteAttemptJobs(async page => {
                  const response = await github.rest.actions.listJobsForWorkflowRunAttempt({
                    ...context.repo, run_id: run.id, attempt_number: run.run_attempt,
                    per_page: 100, page,
                  })
                  return response.data
                }))
              }
              if (v.status === 'red') {
                currentFailures = unresolvedAfterLaterRuns(currentFailures, laterJobs)
                if (!currentFailures.length) {
                  core.info(`All jobs from superseded red run ${v.run_id} have since succeeded.`)
                  return
                }
                const newerIssue = await findByMarker('open')
                if (newerIssue) {
                  const prior = remainingFailureLines(newerIssue.body, [])
                  if (prior === null) throw new Error('Cannot read open main-red failure inventory')
                  await github.rest.issues.update({
                    ...context.repo, issue_number: newerIssue.number,
                    body: withFailureLines(newerIssue.body, mergeFailureLines(prior, currentFailures)),
                  })
                  core.info(`Added unresolved jobs from late red run ${v.run_id} to #${newerIssue.number}.`)
                  return
                }
              } else {
                successfulJobs = successfulAfterLaterRuns(successfulJobs, laterJobs)
              }
            }

            if (v.status === 'green') {
              // A path-scoped green run can omit the job that made main red (#12314).
              const remaining = remainingFailureLines(openIssue.body, successfulJobs)
              if (remaining === null) throw new Error('Cannot read open main-red failure inventory')
              if (remaining.length) {
                if (remaining.length !== remainingFailureLines(openIssue.body, []).length) {
                  await github.rest.issues.update({
                    ...context.repo, issue_number: openIssue.number,
                    body: withFailureLines(openIssue.body, remaining),
                  })
                }
                core.info(`${v.workflow} green, but the previously failing jobs did not all run successfully; keeping #${openIssue.number} open.`)
                return
              }
              await github.rest.issues.createComment({
                ...context.repo, issue_number: openIssue.number,
                body: `\`${v.workflow}\` is green again on main at \`${(v.head_sha||'').slice(0,9)}\` — closing. _(\`${context.workflow}\` run ${context.runId})_`,
              })
              await github.rest.issues.update({
                ...context.repo, issue_number: openIssue.number, state: 'closed',
              })
              core.info(`closed #${openIssue.number}`)
              return
            }

            const first = v.failing.find(f => currentFailures.some(line => line.startsWith(`- \`${f.job}\` `)))
            const gate = first.steps.length ? `${first.job} / ${first.steps[0]}` : first.job
            const sha = (v.head_sha || '').slice(0, 9)
            const title = `main is red: ${v.workflow} — ${gate} @ ${sha}`
            let body = [
              marker,
              `## \`main\` is red — nothing else would have told you`,
              '',
              '| | |',
              '|---|---|',
              `| workflow | \`${v.workflow}\` |`,
              `| first failing gate | \`${gate}\` |`,
              `| head sha | \`${v.head_sha}\` |`,
              `| run | [${v.run_id} attempt ${v.attempt}](${v.html_url}) |`,
              '',
              '### Unresolved failing jobs',
              '',
              ...currentFailures,
              '',
              'Read this as: **every PR that runs this workflow from now on inherits a red it',
              'did not cause**, and a PR merged onto this commit merges onto a broken tree.',
              'Step conclusions above come from the attempt-scoped jobs API, not a log grep —',
              'a job log contains the step\'s own `run:` script, so a grep matches strings that',
              'never executed.',
              '',
              'This issue is refreshed in place while main stays red and is closed by the watch',
              'once each listed job has succeeded on a later main run. Closing it by hand',
              'does not fix main — the watch reopens it. To accept the red knowingly, say so in',
              'a comment; a silent red main is the only unacceptable state.',
              '',
              `_Automated: \`${context.workflow}\` run ${context.runId} (issue #4019)._`,
            ].join('\n')

            const open = await findByMarker('open')
            if (open) {
              const prior = remainingFailureLines(open.body, v.successful_jobs)
              if (prior === null) throw new Error('Cannot read open main-red failure inventory')
              body = withFailureLines(body, mergeFailureLines(prior, currentFailures))
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number, title, body,
              })
              core.info(`refreshed #${open.number}`)
              return
            }
            const closed = await findByMarker('closed')
            const fresh = closed && closed.closed_at &&
              (Date.now() - Date.parse(closed.closed_at)) < REOPEN_WINDOW_DAYS * 864e5
            if (fresh) {
              await github.rest.issues.update({
                ...context.repo, issue_number: closed.number, title, body, state: 'open',
              })
              await github.rest.issues.createComment({
                ...context.repo, issue_number: closed.number,
                body: `main is red again on \`${v.workflow}\` — reopening rather than stacking a new issue. _(\`${context.workflow}\` run ${context.runId})_`,
              })
              core.info(`reopened #${closed.number}`)
              return
            }
            const created = await github.rest.issues.create({
              ...context.repo, title, body, labels: [LABEL, 'fleet-health'],
            })
            core.info(`opened #${created.data.number}`)
