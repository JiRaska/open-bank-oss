name: Runner image

# Rebuild + push the custom ARC runner image (ADR-0053) whenever its source
# changes on main. Runs on the openbank-deploy scale set — the only pool whose
# pod ServiceAccount carries the IRSA role allowed to push to ECR (the build
# pool has no cloud-write creds, by design). PR jobs never target this pool.
#
# This pushes the :latest tag and prints the immutable digest to the job
# summary. local.runner_image in arc-runners.tf pins that digest by hand — bump
# it from the digest below, then `tofu apply` to roll the scale sets. (Fully
# automating the digest bump + apply is a deliberate follow-up: it needs a
# write-back token + tofu in CI.)

on:
  push:
    branches: [main]
    paths:
      - openbank-infra/aws/envs/sandbox-platform/runner-image/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPO: openbank-ci-runner

jobs:
  build-push:
    name: build + push runner image
    runs-on: openbank-deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # IRSA on the openbank-deploy pod SA provides the AWS identity. This action
      # consumes those ambient pod creds via the AWS SDK and configures the dind
      # docker auth — so the runner image needs no aws CLI baked in (it isn't;
      # the image bakes only the CI toolchain — see runner-image/Dockerfile).
      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build + push (arm64)
        working-directory: openbank-infra/aws/envs/sandbox-platform/runner-image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPO}"
          docker buildx create --use --name obrunner --driver docker-container >/dev/null 2>&1 || docker buildx use obrunner
          docker buildx build --platform linux/arm64 --provenance=false \
            --metadata-file /tmp/buildx-meta.json \
            -t "${IMAGE}:latest" --push .

      - name: Resolve + report digest
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPO}"
          # Digest comes straight from the buildx push metadata — no aws CLI /
          # ECR describe round-trip (jq is baked into the runner image).
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/buildx-meta.json)"
          echo "IMAGE_DIGEST_REF=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          {
            echo "## Runner image pushed"
            echo ""
            echo "\`${IMAGE}@${DIGEST}\`"
            echo ""
            echo "Pin this digest in \`local.runner_image\` (arc-runners.tf) and \`tofu apply\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # cosign is now baked into the image (Dockerfile) — see that file's own comment for
      # why the previous runtime-download-with-no-retry was the actual root cause of this
      # workflow's real-world silent attestation failures (issue #310). BUT: this exact
      # workflow run executes on the runner image that existed BEFORE this fix rolls out
      # (bootstrapping problem — the fixed image doesn't exist until this run produces it),
      # so cosign is not guaranteed to be on PATH yet. Fall back to a retrying download only
      # if it's genuinely missing; once the fixed image is live and pinned in arc-runners.tf,
      # this whole step becomes a no-op every future run.
      - name: Ensure cosign is available
        run: |
          set -uo pipefail
          if command -v cosign >/dev/null 2>&1; then
            echo "cosign already present (baked into the runner image): $(cosign version 2>/dev/null | head -1)"
            exit 0
          fi
          echo "::warning::cosign not baked into this runner image yet (expected on the first run after this fix) — falling back to a retrying download."
          COSIGN_VERSION="v2.4.3"
          COSIGN_SHA256="bd0f9763bca54de88699c3656ade2f39c9a1c7a2916ff35601caf23a79be0629"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o /tmp/cosign-fallback "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-arm64"
          echo "${COSIGN_SHA256}  /tmp/cosign-fallback" | sha256sum -c -
          chmod +x /tmp/cosign-fallback
          sudo mv /tmp/cosign-fallback /usr/local/bin/cosign
          cosign version

      # Supply-chain provenance for the runner image itself (ADR-0030 D4 step 4, issue #310).
      # Sources openbank-infra/scripts/lib/cosign-attest.sh instead of hand-rolling trivy +
      # cosign, which is the repo-wide rule (root CLAUDE.md) and is what this workflow got
      # wrong: it signed and attested a CycloneDX SBOM and NEVER attested SLSA provenance.
      # #8847 then added verify-openbank-image-slsa-provenance scoped to `openbank-*`, which
      # matches openbank-ci-runner, so from 2026-09-05 every runner image failed that policy
      # and every runner Pod was denied at admission — Kyverno reports "unverified image" on
      # the two Enforce policies as well, with the missing SLSA predicate as the only logged
      # error. Measured 2026-09-12: the passing control image (openbank-ledger-service) has
      # cyclonedx AND slsaprovenance; openbank-ci-runner had cyclonedx only.
      #
      # cosign_sign_and_attest does all three — sign, CycloneDX SBOM, SLSA provenance — with
      # the same KMS key, and each step proves its own envelope landed with a
      # verify-attestation bound to THIS run rather than trusting an append-only .att tag.
      #
      # continue-on-error is GONE, deliberately. It was justified as "a cosign/trivy hiccup
      # must never block a runner rebuild", and that trade was wrong: an unsigned or
      # unattested runner image is not a degraded image, it is one no Pod can run. A build
      # that produces it has failed and must say so.
      - name: Sign + attest runner image (cosign + KMS, shared lib)
        id: attest
        timeout-minutes: 15
        run: |
          set -uo pipefail
          # shellcheck source=openbank-infra/scripts/lib/cosign-attest.sh
          source openbank-infra/scripts/lib/cosign-attest.sh
          # linux/arm64 is REQUIRED: this image is built arm64 and trivy defaults to amd64
          # for REMOTE scans regardless of host arch, which silently leaves the image
          # unattested (the 2026-07-12 fleet bug). The lib takes it as an argument.
          cosign_sign_and_attest "${IMAGE_DIGEST_REF}" linux/arm64

      # Independent of the step above: assert from OUTSIDE the producer that all three
      # artifacts a runner Pod needs are present and verifiable with the key Kyverno pins.
      # The cyclonedx-only version of this step is exactly why the SLSA gap survived a green
      # run on 2026-09-04 — it verified what the workflow produced, not what admission
      # requires. Each predicate here corresponds to one ClusterPolicy.
      - name: Verify signature + both attestations actually landed
        if: always()
        run: |
          set -uo pipefail
          COSIGN_KEY="awskms:///alias/openbank-cosign-signing"
          FAIL=0
          if ! cosign verify --key "$COSIGN_KEY" "$IMAGE_DIGEST_REF" >/dev/null 2>&1; then
            echo "::error::signature verification FAILED — rejected by verify-openbank-image-sbom-attestation (Enforce), which verifies the image signature too."
            FAIL=1
          fi
          if ! cosign verify-attestation --key "$COSIGN_KEY" --type cyclonedx "$IMAGE_DIGEST_REF" >/dev/null 2>&1; then
            echo "::error::CycloneDX SBOM attestation verification FAILED — rejected by verify-openbank-image-sbom-attestation (Enforce)."
            FAIL=1
          fi
          if ! cosign verify-attestation --key "$COSIGN_KEY" --type slsaprovenance "$IMAGE_DIGEST_REF" >/dev/null 2>&1; then
            echo "::error::SLSA provenance attestation verification FAILED — verify-openbank-image-slsa-provenance is Audit, but its failure still denies every runner Pod (#9793)."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "See the 'Sign + attest runner image' step's log above for the underlying error." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ signature + CycloneDX SBOM + SLSA provenance all verified present on ${IMAGE_DIGEST_REF}"
