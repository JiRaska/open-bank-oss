name: Ruleset bypass evidence

# Runs from the default branch, including on reruns of CI. Never executes PR code
# or consumes its artifacts/caches. Bootstrap this workflow through a reviewed PR
# before enabling its consumer; an unmerged copy cannot provide trusted evidence.
on:
  workflow_run:
    workflows: [CI]
    types: [in_progress]

permissions: {}

jobs:
  collect:
    name: Read ruleset bypass configuration
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mint repository-scoped ruleset reader
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # GitHub only includes bypass_actors for a ruleset writer. Metadata:read
          # is implicit. No contents/status/check/PR permission or bypass is granted.
          # Installation must already allow this; never fall back to a broad PAT.
          permission-administration: write
      - name: Collect configuration using GET requests only
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const summaries = await github.paginate('GET /repos/{owner}/{repo}/rulesets', {
              ...context.repo, per_page: 100, request: {timeout: 15000}
            });
            if (!Array.isArray(summaries)) throw new Error('Ruleset list is unreadable');
            const details = {};
            for (const rule of summaries) {
              if (rule.enforcement !== 'active' || rule.target !== 'branch') continue;
              if (!Number.isSafeInteger(rule.id) || rule.id <= 0) throw new Error('Invalid ruleset id');
              const {data} = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
                ...context.repo, ruleset_id: rule.id, request: {timeout: 15000}
              });
              // Missing fields stay missing; the consumer must report NOT_EVALUATED.
              details[String(rule.id)] = data;
            }
            const target = context.payload.workflow_run;
            const snapshot = {
              version: 1, repository: `${context.repo.owner}/${context.repo.repo}`,
              run_id: String(target.id), run_attempt: String(target.run_attempt),
              source_run_id: process.env.GITHUB_RUN_ID,
              source_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              summaries, details
            };
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/snapshot.json`, JSON.stringify(snapshot));
      - name: Publish data only for the triggering CI attempt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruleset-bypass-${{ github.event.workflow_run.id }}-a${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 1
      # create-github-app-token revokes the token in its post step (default).
      # The consumer accepts evidence only after this workflow completes successfully.
