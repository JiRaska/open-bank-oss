# -----------------------------------------------------------------------------
# Agent charter registry gate (ADR-0031 / ADR-0156 "agent charters as markdown").
#
# Runs `.github/scripts/check-agent-charter-registry.sh` on every PR that touches
# either half of the agent charter split: the enforced registry
# (openbank-libs/governance/agents.yaml) or its narrative companion
# (docs/agents/*.md). Enforces full id parity between the two — see the script's
# header for the drift class this prevents. Mirrors adr-registry.yml: small,
# named, own workflow rather than a step buried in the services-ci matrix.
#
# WHERE THE TEETH ACTUALLY ARE (2026-07-25): like adr-registry.yml and
# eu-ai-act-registry.yml, this workflow is NOT in the main-protection ruleset's
# required-status-checks list, and cannot be — it is path-filtered, and GitHub holds
# a required context that never runs as permanently "Expected", which would block
# every PR touching none of the paths below. The binding gate is the
# `agent charter registry parity` step inside the REQUIRED `Validate manifests` job
# in ci.yml, which runs this same script unconditionally. This workflow is the fast,
# path-filtered echo. Do not delete either without moving the other.
# -----------------------------------------------------------------------------
name: Agent charter registry

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'openbank-libs/governance/agents.yaml'
      - 'docs/agents/**'
      - '.github/scripts/check-agent-charter-registry.sh'
      - '.github/workflows/agent-charter-registry.yml'
  push:
    branches: [main]
    paths:
      - 'openbank-libs/governance/agents.yaml'
      - 'docs/agents/**'
      - '.github/scripts/check-agent-charter-registry.sh'
      - '.github/workflows/agent-charter-registry.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  group: agent-charter-registry-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  agent-charter-registry:
    name: agent-charter-registry
    # Pure bash over agents.yaml + docs/agents/, no Gradle/Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check agent charter registry parity
        run: bash .github/scripts/check-agent-charter-registry.sh
