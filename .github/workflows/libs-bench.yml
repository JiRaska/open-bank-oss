# SPDX-License-Identifier: Apache-2.0
# Shared-libs JMH benchmarks: run them, keep the numbers, compare ALLOCATION to the baseline.
#
# Gated: gc.alloc.rate.norm (B/op) against openbank-libs-benchmarks/alloc-baseline.json, by
#        .github/scripts/check-bench-alloc-baseline.py (enforced; rules.yaml:
#        libs_bench_alloc_baseline). Allocation per op is a property of the code.
# Never gated: ns/op. It is a property of the runner; the JSON is uploaded for reading only.
#
# The required Services CI all-green gate checks these exact-head results on applicable PRs.

name: Libs benchmarks

on:
  pull_request:
    paths:
      - ".github/scripts/pitest-libs-advisory.init.gradle"
      - ".github/workflows/pitest.yml"
      - "openbank-libs*/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/services-ci.yml"
      - ".github/workflows/libs-quality.yml"
      - ".github/workflows/libs-bench.yml"
      - ".github/workflows/cflite-pr.yml"
      - ".github/scripts/library_quality_scope.py"
      - ".github/scripts/test_library_quality_scope.py"
      - ".github/scripts/check_library_quality_evidence.py"
      - ".github/scripts/test_library_quality_evidence.py"
      - ".github/scripts/check-bench-alloc-baseline.py"
      - ".github/scripts/test_bench_ratchet.py"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: libs-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jmh:
    name: JMH allocation baseline (enforced)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # -f 1 -wi 3 -i 3 -prof gc -rf json, -XX:+UseSerialGC -Xmx512m: set in the module's
      # build.gradle.kts `jmh {}` block, so a local run and this one are the same run.
      - name: Run JMH (:openbank-libs-benchmarks:jmh)
        run: ./gradlew :openbank-libs-benchmarks:jmh --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      - name: Upload JMH results (ns/op is report-only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libs-bench-jmh-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-libs-benchmarks/build/reports/jmh/results.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the committed allocation baseline
        run: |
          python3 .github/scripts/check-bench-alloc-baseline.py \
            --results openbank-libs-benchmarks/build/reports/jmh/results.json --enforce
