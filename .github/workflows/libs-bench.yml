# SPDX-License-Identifier: Apache-2.0
# Shared-libs JMH benchmarks: run them, keep the numbers, compare ALLOCATION to the baseline.
#
# Gated: gc.alloc.rate.norm (B/op) against openbank-libs-benchmarks/alloc-baseline.json, by
#        .github/scripts/check-bench-alloc-baseline.py (enforced; rules.yaml:
#        libs_bench_alloc_baseline). Explicitly unstable allocation kernels remain report-only.
# Also gated: ProductInterpreter sampled p99 against its ADR-0352 absolute budget.
# Other wall-clock results are report-only and require comparable runners; they are not
# production request latency or throughput evidence.
#
# The required Services CI all-green gate checks these exact-head results on applicable PRs.

name: Libs benchmarks

on:
  pull_request:
    paths:
      - ".github/scripts/pitest-libs-advisory.init.gradle"
      - ".github/workflows/pitest.yml"
      - "openbank-libs*/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/services-ci.yml"
      - ".github/workflows/libs-quality.yml"
      - ".github/workflows/libs-bench.yml"
      - ".github/workflows/cflite-pr.yml"
      - ".github/scripts/library_quality_scope.py"
      - ".github/scripts/test_library_quality_scope.py"
      - ".github/scripts/check_library_quality_evidence.py"
      - ".github/scripts/test_library_quality_evidence.py"
      - ".github/scripts/check-bench-alloc-baseline.py"
      - ".github/scripts/test_bench_ratchet.py"

  # The same paths on main. Without this the baseline was compared only on pull requests, so a
  # change that moved an allocation landed green-or-lucky and the red surfaced on the NEXT
  # unrelated PR that touched a libs path, which could do nothing about it. A main run makes the
  # breach the merging commit's, where main-red-watch and the train already look.
  push:
    branches: [main]
    paths:
      # Benchmark inputs only: the shared libs it measures, the harness and its gate.
      - "openbank-libs*/**"
      - ".github/workflows/libs-bench.yml"
      - ".github/scripts/check-bench-alloc-baseline.py"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Per commit on main and never cancelled there: each main result belongs to one commit.
  group: libs-bench-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  jmh:
    name: JMH allocation baseline (enforced)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # -f 3 -wi 3 -i 3 -prof gc -rf json, -XX:+UseSerialGC -Xmx512m: set in the module's
      # build.gradle.kts `jmh {}` block, so a local run and this one are the same run.
      - name: Run JMH (:openbank-libs-benchmarks:jmh)
        run: ./gradlew :openbank-libs-benchmarks:jmh --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      - name: Upload JMH results (ns/op is report-only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libs-bench-jmh-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-libs-benchmarks/build/reports/jmh/results.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the committed allocation baseline
        run: |
          python3 .github/scripts/check-bench-alloc-baseline.py \
            --results openbank-libs-benchmarks/build/reports/jmh/results.json --enforce
