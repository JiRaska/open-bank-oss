name: Release Please

# Per-service RELEASE-axis automation (ADR-0029 Layer B, refined by ADR-0048).
# On every push to main, release-please reads merged Conventional Commits and opens/maintains
# ONE aggregated Release PR covering every component with pending changes — when it is merged
# it bumps each version.txt, writes each per-service CHANGELOG, and cuts one tagged GitHub
# Release <component>-v<version> per component. Versioning is still entirely per-component;
# only the PR is shared (release-please-config.json: separate-pull-requests: false). The steps
# below still loop over "release PRs" plural because the filter is by label/title prefix and
# must keep working while an old per-component PR is still open.
#
# Scope: the RELEASE axis only (version.txt == quarkus.application.version == git tag). The API
# contract version (openapi.yaml:info.version) is a SEPARATE axis governed by ADR-0048 / oasdiff
# and is intentionally NOT touched here. Rules: openbank-libs/governance/rules.yaml (versioning)
# and openbank-libs/governance/RELEASE.md.
#
# Commit signing: release-please CANNOT sign its own commits, so this workflow re-signs them
# afterwards (see "Re-sign release PR commits" below). Unlike the deploy workflows — where
# handing peter-evans/create-pull-request a GitHub App token was the whole fix (#1276) —
# swapping the token here would change nothing. Signing depends on WHICH endpoint authors the
# commit, not only on the token type: GitHub auto-signs the GraphQL createCommitOnBranch
# mutation and the Contents API, but never the Git Data API, whose `signature` field is
# caller-supplied. release-please@17 delegates to code-suggester@5, which calls
# `octokit.git.createCommit` (Git Data) and passes no signer — so its commit is unsigned no
# matter who authenticates. Upstream tracks this as release-please-action#1171 / #1124, both
# open with no workaround.

on:
  push:
    branches: [main]

# Restrictive top-level default (Scorecard Token-Permissions wants an explicit top-level
# block, not just job-level grants — otherwise a job without its own override would fall
# back to the repo's default token permissions, which this workflow can't see/control).
# Jobs below that need more (contents/pull-requests write) declare their own override.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
      # All per-path outputs (incl. `<path>--tag_name`/`--version`) as JSON — the
      # AUTHORITATIVE tag release-please actually cut. The evidence job must use this,
      # never re-read .release-please-manifest.json: when several release PRs merge
      # close together the run's checked-out manifest can lag the version just tagged
      # (caused kyc-service-v0.4.0 to be mis-tagged v0.3.1 → upload to a missing release).
      rp_outputs: ${{ toJSON(steps.rp.outputs) }}
    steps:
      # MUST stay the first step: everything below authenticates as the App, and a
      # `steps.app_token.outputs.token` read before this step runs is silently the empty
      # string — which would degrade the `rp` token to GITHUB_TOKEN and stall the whole
      # release queue without a single red signal.
      #
      # Deliberately ungated and unfallback'd. Every other identity available here is a dead
      # end: GITHUB_TOKEN opens PRs that trigger no workflows (anti-recursion), so the required
      # checks never run and nothing can ever auto-merge; the GITOPS_PR_TOKEN user PAT worked
      # but has been retired (#1305). So if the App credentials are missing or invalid,
      # failing here loudly is the only honest outcome — a fallback would buy a green run that
      # quietly produces a release queue that can never drain.
      - name: Mint a GitHub App installation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # An App installation token, not GITHUB_TOKEN: a release-PR merge made under
          # GITHUB_TOKEN does NOT trigger another workflow (recursion guard), so the merge would
          # never trigger the run that cuts the release. The App token lets the merge re-trigger
          # release-please (cut the tag + run the evidence job) and rebase the remaining separate
          # release PRs — so auto-merge below actually drains the queue.
          #
          # This does NOT make release-please's commit signed — it commits through the Git Data
          # API, which GitHub never signs for any token (see the header comment). The "Re-sign
          # release PR commits" step below is what handles that, and it is why swapping this
          # token was safe to do independently: the PAT and the App token behave identically
          # here, both producing an unsigned commit that gets re-signed afterwards.
          token: ${{ steps.app_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Rewrite each release branch's unsigned commit as a GitHub-signed one, because
      # release-please structurally cannot emit a signed commit (see the header comment).
      # Without this the commit lands `verified=false; reason=unsigned`, required_signatures
      # blocks the PR, and the release strands with every check green and auto-merge armed —
      # the same silent failure mode as the deploy PRs in #1269, and equally invisible.
      #
      # Method: createCommitOnBranch replays the branch's file changes onto a scratch branch
      # (which GitHub signs), then force-moves the release ref onto the resulting commit. The
      # scratch branch is what keeps this non-destructive: resetting the release ref back to
      # its parent and re-committing in place would leave the PR momentarily empty if the
      # mutation failed in between. No push-triggered workflow watches a scratch branch —
      # every `on: push` in this repo is filtered to `main` (runner-smoke.yml to
      # `ci/self-hosted-runner`) — so it fires nothing on create or delete.
      #
      # Idempotent by design, because it has to be: release-please force-pushes each release
      # branch on every push to main, which re-unsigns it. Already-verified PRs are skipped, so
      # a run that arrives between signing and merging simply re-signs on the next one.
      - name: Re-sign release PR commits
        id: resign
        # Best-effort, same reasoning as the auto-merge step below: a failure here must never
        # fail this job, because that would skip release-evidence (needs: release-please) and
        # strand an already-cut tag with no SBOM/SLSA/VEX bundle. The separate
        # verify-release-pr-signatures job is what raises the loud signal instead.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            const releasePrs = prs.filter(p =>
              p.labels.some(l => l.name === 'autorelease: pending') ||
              p.title.startsWith('chore(main): release'));

            const mutation = `mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid } }
            }`;

            let signed = 0, alreadySigned = 0, skipped = 0;
            for (const pr of releasePrs) {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner, repo, pull_number: pr.number,
              });
              if (commits.every(c => c.commit.verification?.verified)) {
                alreadySigned++;
                continue;
              }
              // release-please keeps exactly one commit per release branch (code-suggester
              // force-pushes a single squashed commit). More than one means someone amended
              // or pushed by hand — leave it alone rather than silently flattening their work.
              if (commits.length !== 1) {
                skipped++;
                core.warning(`#${pr.number}: ${commits.length} commits, expected 1 — not re-signing`);
                continue;
              }
              const c = commits[0];
              const parent = c.parents[0]?.sha;
              if (!parent) {
                skipped++;
                core.warning(`#${pr.number}: ${c.sha} has no parent — not re-signing`);
                continue;
              }

              // Rebuild the commit's contents from the diff against its own parent — NOT
              // against main's current head. release-please rebases, so the parent is the only
              // authoritative base; comparing against a moved main would replay unrelated files.
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${parent}...${c.sha}`,
              });
              const additions = [], deletions = [];
              let unreadable = null;
              for (const f of cmp.files ?? []) {
                if (f.status === 'removed') { deletions.push({ path: f.filename }); continue; }
                if (f.status === 'renamed' && f.previous_filename) {
                  deletions.push({ path: f.previous_filename });
                }
                const { data: blob } = await github.rest.git.getBlob({ owner, repo, file_sha: f.sha });
                if (blob.encoding !== 'base64') { unreadable = f.filename; break; }
                // getBlob line-wraps its base64; the mutation wants it unwrapped.
                additions.push({ path: f.filename, contents: blob.content.replace(/\n/g, '') });
              }
              if (unreadable) {
                skipped++;
                core.warning(`#${pr.number}: ${unreadable} blob is not base64 — not re-signing`);
                continue;
              }
              if (!additions.length && !deletions.length) {
                skipped++;
                core.warning(`#${pr.number}: ${c.sha} changes no files — not re-signing`);
                continue;
              }

              const [headline, ...rest] = c.commit.message.split('\n');
              const body = rest.join('\n').trim();
              const scratch = `release-please-sign/${pr.number}-${context.runId}`;
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${scratch}`, sha: parent });
                const res = await github.graphql(mutation, {
                  input: {
                    branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: scratch },
                    message: body ? { headline, body } : { headline },
                    fileChanges: { additions, deletions },
                    expectedHeadOid: parent,
                  },
                });
                const oid = res.createCommitOnBranch.commit.oid;

                // Prove the replay reproduced the commit EXACTLY before force-moving the ref onto
                // it. Identical tree sha == byte-identical content, so the only difference left is
                // the signature. Without this the failure mode is the worst one available: a subtly
                // wrong fileChanges reconstruction force-pushed onto the release branch, which
                // auto-merge — already armed — would then happily land as a corrupted release.
                // A signature is never worth rewriting content to get.
                const [{ data: was }, { data: now }] = await Promise.all([
                  github.rest.git.getCommit({ owner, repo, commit_sha: c.sha }),
                  github.rest.git.getCommit({ owner, repo, commit_sha: oid }),
                ]);
                if (was.tree.sha !== now.tree.sha) {
                  skipped++;
                  core.warning(`#${pr.number}: replayed tree ${now.tree.sha.slice(0, 8)} != original ${was.tree.sha.slice(0, 8)} — not re-signing`);
                  continue;
                }

                // updateRef has no compare-and-swap, so check the release ref still points at
                // the commit we just rebuilt. Without this, a release-please force-push landing
                // in the seconds since pulls.list would be clobbered by our older content.
                const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                if (ref.object.sha !== c.sha) {
                  skipped++;
                  core.warning(`#${pr.number}: head moved ${c.sha.slice(0, 8)} -> ${ref.object.sha.slice(0, 8)} mid-flight — not re-signing`);
                  continue;
                }
                await github.rest.git.updateRef({
                  owner, repo, ref: `heads/${pr.head.ref}`, sha: oid, force: true,
                });
                signed++;
                core.info(`#${pr.number}: re-signed ${c.sha.slice(0, 8)} -> ${oid.slice(0, 8)}`);
              } catch (e) {
                skipped++;
                core.warning(`#${pr.number}: re-sign failed — ${e.message}`);
              } finally {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${scratch}` });
                } catch (e) {
                  core.info(`#${pr.number}: scratch branch ${scratch} not cleaned up — ${e.message}`);
                }
              }
            }
            core.info(`re-signed ${signed}, already signed ${alreadySigned}, skipped ${skipped}, of ${releasePrs.length} open release PR(s)`);

      # Auto-merge every open release PR (ADR-0029 Layer B hygiene): the ruleset requires 0
      # approvals, so GitHub merges each as soon as its required checks pass. With separate PRs
      # they share .release-please-manifest.json and conflict, so they drain sequentially — each
      # merge re-triggers release-please (via the PAT) which rebases the rest, cascading until the
      # queue is empty. Idempotent: re-enabling on an already-armed PR is a no-op.
      #
      # Runs AFTER the re-sign step so it arms against the signed head rather than a sha that
      # is about to be replaced.
      - name: Enable auto-merge on open release PRs
        # Never let an arming hiccup (API blip on pulls.list) fail the release-please job —
        # that would skip the evidence job (needs: release-please). Draining is best-effort.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const releasePrs = prs.filter(p =>
              p.labels.some(l => l.name === 'autorelease: pending') ||
              p.title.startsWith('chore(main): release'));
            const mutation = `mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                pullRequest { number }
              }
            }`;
            for (const pr of releasePrs) {
              try {
                await github.graphql(mutation, { id: pr.node_id });
                core.info(`auto-merge enabled on #${pr.number} (${pr.title})`);
              } catch (e) {
                core.info(`#${pr.number}: ${e.message}`);  // already merging / mergeable-unknown / checks pending
              }
            }
            core.info(`processed ${releasePrs.length} open release PR(s)`);

  # ---------------------------------------------------------------------------
  # Signature guard for the release PRs (issue #1269's failure mode, release axis).
  # ---------------------------------------------------------------------------
  # An unsigned release commit fails silently by construction: release-please exits 0, the PR
  # opens with every check green and auto-merge armed, and it simply never merges. That reads
  # as healthy from every angle except the one nobody checks — which is how #806's deploy fix
  # no-opped for five days and stranded seven PRs at once. Assert the outcome instead.
  #
  # A SEPARATE job, not a final step of release-please: a failing step there would fail the job,
  # and release-evidence (needs: release-please) would be skipped — costing an already-cut tag
  # its SBOM/SLSA/VEX bundle. As its own job this reds the run without starving anything.
  #
  # This used to warn rather than fail when GITOPS_APP_ID was unset, because back then no App
  # existed and every release PR was knowingly unsigned. The App is now the job's only identity
  # — a missing one fails the run at the mint step — so that branch is gone: any unsigned
  # release PR reaching here is a real regression.
  verify-release-pr-signatures:
    name: Verify release PR commits are signed
    needs: release-please
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            const releasePrs = prs.filter(p =>
              p.labels.some(l => l.name === 'autorelease: pending') ||
              p.title.startsWith('chore(main): release'));

            const unsigned = [];
            for (const pr of releasePrs) {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner, repo, pull_number: pr.number,
              });
              // Only the PR's own branch commits prove anything. The squash commit on main is
              // signed by GitHub itself and always reads verified=true — it would pass this
              // guard while the branch commit that actually blocks the merge stays unsigned.
              for (const c of commits.filter(c => !c.commit.verification?.verified)) {
                unsigned.push({ pr: pr.number, sha: c.sha, reason: c.commit.verification?.reason ?? 'unknown' });
              }
            }

            if (unsigned.length === 0) {
              core.info(`all commits on ${releasePrs.length} open release PR(s) are signed and verified`);
              return;
            }
            for (const u of unsigned) {
              core.error(`#${u.pr}: ${u.sha} verified=false reason=${u.reason}`);
            }
            core.setFailed(
              `${unsigned.length} unsigned commit(s) across ${new Set(unsigned.map(u => u.pr)).size} open release PR(s); ` +
              `the main ruleset's required_signatures blocks each of them and those releases will never land. ` +
              `The re-sign step should have fixed this — check its warnings in the release-please job. ` +
              `To rescue a PR by hand meanwhile: amend its commit locally with a GPG signature and force-push — ` +
              `auto-merge is already armed and fires on its own once the signature is valid.`
            );

  # ---------------------------------------------------------------------------
  # Release evidence bundle (ADR-0029 D2 / ADR-0030 D4).
  # ---------------------------------------------------------------------------
  # Realises rules.yaml: provenance.evidence_bundle. When a Release PR merge cuts
  # one or more tags, for EACH released component build + KMS-cosign-sign and attach
  # to the GitHub Release: the CycloneDX SBOM, a SLSA v1.0 provenance statement, an
  # OpenVEX vuln inventory, and the evidence manifest tying them together (version,
  # commit, digests, changelog, AI attribution, scan/coverage/test refs). Assembly:
  # .github/scripts/build-release-evidence.sh. The SBOM/docs are *attached to the
  # release, not orphaned* — the model rules.yaml requires.
  #
  # NON-BLOCKING in v1 (continue-on-error): the release + tag are already cut by the
  # job above, so an evidence hiccup must never red the release train. Promote to the
  # enforced rules.yaml: provenance.gate once proven on real releases. Still planned:
  # native GitHub attestation (private-repo GHAS gate), embedded coverage/test, and
  # OpenVEX human triage (RELEASE.md "wired vs planned").
  release-evidence:
    name: Release evidence (SBOM + SLSA + VEX bundle)
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write       # upload release assets
      id-token: write       # GitHub OIDC → assume the build-runner role for KMS cosign
      attestations: write   # native GitHub artifact attestation (activates when repo is public)
    outputs:
      # JSON array of release tags (strings) whose signed evidence bundle was
      # successfully attached — feeds the provenance-subjects job below. Mirrors
      # released.tsv minus any tag the evidence step skipped/failed for.
      tags_matrix: ${{ steps.matrix.outputs.tags_matrix }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
      RP_OUTPUTS: ${{ needs.release-please.outputs.rp_outputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1   # KMS cosign key + ECR live in eu-north-1 (matches auto-deploy)

      - name: Map released components → tags
        id: map
        run: |
          # paths_released is a JSON array of package dirs (e.g. ["openbank-pid-service"]).
          # Use the AUTHORITATIVE per-path action outputs for the tag/version that
          # release-please actually cut (`<path>--tag_name`, `<path>--version`) — NOT the
          # checked-out manifest, which can lag when several release PRs merge together.
          python3 - "$PATHS_RELEASED" "$RP_OUTPUTS" > released.tsv <<'PY'
          import json, sys
          paths = json.loads(sys.argv[1] or "[]")
          outs = json.loads(sys.argv[2] or "{}")
          cfg = json.load(open("release-please-config.json"))["packages"]
          for p in paths:
              comp = (cfg.get(p) or {}).get("component")
              tag = outs.get(f"{p}--tag_name")
              ver = outs.get(f"{p}--version")
              # upload_url is the API endpoint for attaching assets — used instead of the
              # `gh` CLI, which is not present on every runner in the openbank-batch pool.
              upurl = (outs.get(f"{p}--upload_url") or "").split("{")[0]
              if not tag and comp and ver:
                  tag = f"{comp}-v{ver}"           # last-resort fallback
              if comp and tag:
                  ver = ver or tag.rsplit("-v", 1)[-1]
                  print("\t".join([p, comp, ver, tag, upurl]))
          PY
          echo "Released components:"; cut -f1-4 released.tsv
          # Gradle task list for components that carry the cyclonedx plugin.
          tasks=""
          while IFS=$'\t' read -r p comp ver tag upurl; do
            [ -n "$p" ] && tasks="$tasks :$p:cyclonedxBom"
          done < released.tsv
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      - name: Generate per-component SBOMs
        if: steps.map.outputs.tasks != ''
        run: ./gradlew ${{ steps.map.outputs.tasks }} --console=plain --no-daemon || true

      # trivy is NOT preinstalled on hosted runners — without it the non-Gradle SBOM
      # fallback below silently falls through (`command -v trivy` guard) and every
      # module without the cyclonedx plugin releases NAKED (no evidence bundle at all;
      # every admin-ui release since the hosted-runner move shipped without assets).
      # Same maintained, commit-pinned setup action security.yml / auto-deploy.yml use.
      - name: Install Trivy (SBOM fallback for non-Gradle modules)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Build, sign and attach the release evidence bundle
        run: |
          set -uo pipefail
          # Evidence bundle per released component (ADR-0029 D2 / ADR-0030 D4):
          # CycloneDX SBOM + SLSA provenance + OpenVEX + the bundle manifest, each
          # signed with the AWS KMS cosign key and attached to the GitHub Release.
          COSIGN_KEY="awskms:///alias/openbank-cosign-signing"
          COSIGN_VERSION="v2.4.3"
          arch="$(uname -m)"; case "$arch" in aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"; case "$os" in darwin) os=darwin ;; *) os=linux ;; esac
          bin="$(command -v cosign || true)"
          if ! { [ -n "$bin" ] && cosign version 2>/dev/null | grep -Eq 'GitVersion:[[:space:]]*v2\.'; }; then
            bin="${RUNNER_TEMP}/cosign2"
            # sha256 pins from the release's cosign_checksums.txt — bump together with
            # COSIGN_VERSION. Unverified: a MITM'd cosign binary could fake every signature.
            case "${os}-${arch}" in
              linux-amd64)  COSIGN_SHA256="caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708" ;;
              linux-arm64)  COSIGN_SHA256="bd0f9763bca54de88699c3656ade2f39c9a1c7a2916ff35601caf23a79be0629" ;;
              darwin-amd64) COSIGN_SHA256="98a3bfd691f42c6a5b721880116f89210d8fdff61cc0224cd3ef2f8e55a466fb" ;;
              darwin-arm64) COSIGN_SHA256="edfc761b27ced77f0f9ca288ff4fac7caa898e1e9db38f4dfdf72160cdf8e638" ;;
              *) echo "::error::no pinned cosign checksum for ${os}-${arch}"; exit 1 ;;
            esac
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -o "$bin" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${os}-${arch}"
            SHATOOL="sha256sum"; command -v sha256sum >/dev/null 2>&1 || SHATOOL="shasum -a 256"
            echo "${COSIGN_SHA256}  ${bin}" | ${SHATOOL} -c - \
              || { echo "::error::cosign ${COSIGN_VERSION} download failed checksum verification"; exit 1; }
            chmod +x "$bin"
          fi
          sign() { COSIGN_YES=true "$bin" sign-blob --key "$COSIGN_KEY" --output-signature "${1}.sig" "$1"; }
          # Upload one asset via the REST API (gh CLI is absent on part of the runner pool).
          upload_asset() {
            local upbase="$1" file="$2" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "${upbase}?name=$(basename "$file")")"
            case "$code" in
              201) echo "  uploaded $file" ;;
              422) echo "::notice::$file already present (HTTP 422) — skipping" ;;
              *)   echo "::warning::upload of $file failed (HTTP $code)"; return 1 ;;
            esac
          }

          while IFS=$'\t' read -r p comp ver tag upurl; do
            [ -n "$p" ] || continue
            sbom_out="${tag}.cdx.json"
            bom="$p/build/reports/bom.json"
            if [ -f "$bom" ]; then
              cp "$bom" "$sbom_out"
            elif command -v trivy >/dev/null 2>&1 && trivy fs --format cyclonedx --output "$sbom_out" "$p" 2>/dev/null && [ -s "$sbom_out" ]; then
              # Non-Gradle module (e.g. admin-ui / Next.js): no cyclonedx plugin, so derive the
              # SBOM from the source tree (package-lock.json etc.) with trivy fs.
              echo "::notice::$p has no gradle SBOM — generated via trivy fs"
            else
              echo "::warning::no SBOM for $p (no gradle plugin and trivy fs produced none) — skipping $tag"
              continue
            fi
            sign "$sbom_out" || { echo "::warning::cosign sign-blob failed for $sbom_out"; continue; }

            # Assemble SLSA provenance + OpenVEX + evidence manifest (references the signed SBOM).
            bash .github/scripts/build-release-evidence.sh "$comp" "$ver" "$tag" "$p" "$sbom_out" \
              || echo "::warning::evidence assembly failed for $tag"

            assets="$sbom_out ${sbom_out}.sig"
            for doc in "${tag}.slsa.json" "${tag}.vex.json" "${tag}.evidence.json"; do
              [ -f "$doc" ] || continue
              sign "$doc" && assets="$assets $doc ${doc}.sig" \
                || echo "::warning::cosign sign-blob failed for $doc"
            done

            if [ -z "$upurl" ]; then
              echo "::warning::no upload_url for $tag — cannot attach assets"; continue
            fi
            for f in $assets; do upload_asset "$upurl" "$f" || true; done
            echo "Attached signed evidence bundle to release $tag: $assets"
            echo "$tag" >> provenance_ok.tags
          done < released.tsv

      # Native GitHub artifact attestation (Sigstore-backed SLSA provenance, verifiable
      # with `gh attestation verify`). Artifact attestations are free for public repos but
      # gated on a paid plane while this repo is PRIVATE — same gate as CodeQL/SARIF in
      # security.yml. So this auto-activates the moment the repo goes public; until then it
      # is skipped (the cosign-signed *.slsa.json above is the provenance that works today).
      - name: Attest SBOMs (native, public repos only)
        if: ${{ !github.event.repository.private && hashFiles('*.cdx.json') != '' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "*.cdx.json"

      - name: Emit tags matrix for SLSA provenance job
        id: matrix
        run: |
          # Scorecard's Signed-Releases check only recognizes provenance as a release
          # asset literally named "*.intoto.jsonl" (probes/releasesHaveProvenance) — our
          # hand-authored <tag>.slsa.json above does NOT satisfy it regardless of content.
          # Build the matrix (one entry per tag whose signed SBOM made it onto the release)
          # for the separate `provenance` job, which calls the official
          # slsa-framework/slsa-github-generator reusable workflow per component/tag.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          tags = []
          try:
              with open("provenance_ok.tags") as f:
                  tags = [line.strip() for line in f if line.strip()]
          except FileNotFoundError:
              pass
          print("tags_matrix=" + json.dumps(tags))
          PY
          echo "tags for SLSA provenance: $(cat provenance_ok.tags 2>/dev/null | tr '\n' ' ')"

  # ---------------------------------------------------------------------------
  # SLSA provenance (OpenSSF Scorecard Signed-Releases, rules.yaml: provenance).
  # ---------------------------------------------------------------------------
  # Generates verifiable SLSA v1.0 build provenance via the OFFICIAL
  # slsa-framework/slsa-github-generator reusable workflow and attaches a
  # `<sbom>.intoto.jsonl` asset to EACH released component's GitHub Release — one
  # call per tag (matrix), matching the per-service independent release model. This
  # does NOT replace the cosign-signed evidence bundle above (SBOM/VEX/manifest,
  # regulator-facing audit trail) — it is an ADDITIONAL, narrowly-scoped attestation
  # whose sole purpose is to satisfy Scorecard's file-extension-based provenance
  # detector (probes/releasesHaveProvenance only recognizes a release asset literally
  # named "*.intoto.jsonl" — content is irrelevant), which the evidence bundle's
  # *.slsa.json cannot satisfy regardless of how well-formed it is. Subject = the
  # already-uploaded, cosign-signed CycloneDX SBOM for that release, so provenance
  # covers the same artifact operators already download and verify.
  provenance-subjects:
    name: Hash SBOMs for SLSA provenance
    needs: [release-please, release-evidence]
    if: needs.release-please.outputs.releases_created == 'true' && needs.release-evidence.outputs.tags_matrix != '[]'
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # JSON object { "<tag>": "<base64 sha256sum line>", ... } — only tags whose SBOM
      # asset was found and hashed successfully.
      hashes_by_tag: ${{ steps.hash.outputs.hashes_by_tag }}
      # JSON array of just those same tags, in the same order — this (not
      # release-evidence's tags_matrix) is what the `provenance` job below matrixes
      # over, so a job never starts for a tag whose hash lookup failed. A single
      # (non-matrix) job, because job outputs from a `strategy.matrix` job do NOT fan
      # back out per-index to a downstream matrix job (`needs.<job>.outputs.x`
      # collapses to one arbitrary matrix run's value) — per-tag hashes are computed
      # here in one pass and indexed by tag in the `provenance` job.
      tags_matrix: ${{ steps.hash.outputs.tags_matrix }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAGS_MATRIX: ${{ needs.release-evidence.outputs.tags_matrix }}
    steps:
      - name: Download each release's signed SBOM and hash it
        id: hash
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          python3 -c "import json; [print(t) for t in json.loads('''$TAGS_MATRIX''')]" > tags.txt
          echo "{" > map.json
          : > ok.tags
          first=true
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            rel="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
            aid="$(echo "$rel" | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin).get('assets',[]) if x['name']=='${tag}.cdx.json']; print(a[0]['id'] if a else '')")"
            if [ -z "$aid" ]; then echo "::warning::no ${tag}.cdx.json asset on release ${tag} — skipping provenance"; continue; fi
            curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
              -o "${tag}.cdx.json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${aid}"
            if [ ! -s "${tag}.cdx.json" ]; then echo "::warning::downloaded ${tag}.cdx.json is empty — skipping"; continue; fi
            hash="$(sha256sum "${tag}.cdx.json" | base64 -w0)"
            $first || echo "," >> map.json
            first=false
            printf '"%s": %s' "$tag" "$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$hash")" >> map.json
            echo "$tag" >> ok.tags
          done < tags.txt
          echo "}" >> map.json
          {
            echo "hashes_by_tag=$(python3 -c "import json; print(json.dumps(json.load(open('map.json'))))")"
            echo "tags_matrix=$(python3 -c "import json; print(json.dumps([l.strip() for l in open('ok.tags') if l.strip()]))")"
          } >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance (${{ matrix.tag }})
    needs: [release-please, release-evidence, provenance-subjects]
    if: needs.provenance-subjects.outputs.tags_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.provenance-subjects.outputs.tags_matrix) }}
    permissions:
      actions: read         # required by the generator to detect the GitHub Actions environment
      id-token: write       # provenance signing (Sigstore/Rekor) via OIDC
      contents: write       # upload the provenance asset to the release
    # Pinned by semver tag, NOT commit SHA (deviates from this repo's usual SHA-pin
    # convention): the generator's own docs require a `@vX.Y.Z` ref — it verifies its
    # own workflow identity against the tag for the builder-id in the provenance it
    # issues, so a SHA pin breaks that self-verification. https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md#referencing-the-slsa-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ fromJSON(needs.provenance-subjects.outputs.hashes_by_tag)[matrix.tag] }}
      upload-assets: true
      upload-tag-name: ${{ matrix.tag }}
