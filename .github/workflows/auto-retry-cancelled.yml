# Auto-retry spot-killed CI runs (issue #2330).
#
# WHY THIS EXISTS
# The ARC runners burst pool (`runners` NodePool) is spot-only — ADR-0053's FinOps thesis is
# scale-to-zero on Karpenter's Graviton spot pool, and that is the right cost model. Its price
# is the spot reclaim: AWS reclaims in capacity blocks with a 2-minute warning, and a ~45-min
# CI job cannot finish in 2 minutes, so a reclaim lands mid-build as
#   "##[error]The runner has received a shutdown signal ... The operation was canceled."
# Because the reclaim hits every spot node in the block at once, several unrelated PRs die
# within seconds of each other (measured 2026-07-25, 12:25:14-12:25:15 UTC: four jobs on
# unrelated services, unrelated PRs, same second). Until now every one of those needed a human
# to notice and `gh run rerun` — and `gh run rerun --failed` is a no-op against `cancelled`
# conclusions, so the rerun is always the full one.
#
# WHAT THIS DOES
# When one of the watched workflows completes `cancelled`, this re-runs it automatically,
# bounded to one retry (run_attempt 1 only — see LOOP SAFETY below). A spot reclaim then costs
# one queued re-run instead of a human round-trip; the job lands on a fresh spot node (or the
# on-demand warm pool) and proceeds.
#
# ALSO `failure` — a reclaim that takes only PART of a multi-job run (issue #2841).
# A spot kill sets the killed STEP to `cancelled`, which makes its JOB `failure`, which makes
# the whole RUN `failure` as soon as any sibling job succeeded. Gating on a run-level
# `cancelled` therefore missed every partial kill: `security.yml` has 6 jobs and
# `services-ci.yml` fans out per service, so the common case never matched. Measured on
# security.yml run 30627400819 — CodeQL java-kotlin killed by
# "The runner has received a shutdown signal", five sibling jobs green, run `failure`, no
# retry — while three concurrency-superseded `cancelled` runs the same hour WERE retried.
# The mechanism was firing on the harmless case and missing the one it was built for.
#
# A run-level `failure` is NOT retried on its own — that is the normal outcome of a broken
# build, and blanket-retrying it would burn runner time and turn a deterministic red into a
# flaky-looking one. The run is retried when AT LEAST ONE failed job carries the spot-kill
# SIGNATURE: at least one `cancelled` step and NO `failed` step. A genuine build failure has a
# `failure` step followed by `skipped` ones, never a `cancelled` one. Read from the jobs API,
# so no log download is needed.
#
# MIXED RUNS ARE THE NORMAL CASE, and the rule above is a per-RUN decision, not a per-JOB
# filter. `gh run rerun --failed` re-runs every failed job, so a run containing both a
# spot-killed job and a genuinely broken one re-runs both. That is accepted: the reclaimed job
# needs the retry, the broken one fails again for the same reason, and `run_attempt == 1`
# bounds the whole thing to a single extra attempt.
#
# Do not read the rule as "only spot-killed jobs are re-run" — it isn't, and the very first
# live firing was already a mixed run. Services CI 30630120640 (main, 63 jobs) had three
# failed jobs: `build (openbank-product-catalog)` killed by a reclaim (1 cancelled step, 0
# failed), `build (openbank-mcp-service)` genuinely broken (0 cancelled, 1 failed), and
# `all-green` failing downstream of them. The signature matched on one job and the whole set
# was re-run. If per-job precision is ever wanted, it needs `gh run rerun --job <id>` per
# killed job, which is a different and larger change.
#
# LOOP SAFETY
# github.event.workflow_run.run_attempt is 1 for the original run and 2 for the first rerun,
# so gating on run_attempt == 1 gives exactly one automatic retry per run — a cancelled retry
# (run_attempt 2) never re-triggers, and a run cancelled for a real reason (superseded by a
# newer push to the same PR — the concurrency group's normal operation) is only retried once,
# where it fails fast if the branch has moved. Deliberately NOT retried: `action_required`
# (approval gates are a human's job).
#
# This paragraph used to end "and runs cancelled by anything other than the runner dying —
# indistinguishable from the outside, so we accept one wasted retry on a manually cancelled run".
# HALF of that is now false and the correction cost one API call: a reclaim kills a RUNNING job,
# so a run whose cancelled jobs never started a step cannot have been reclaimed. That case is now
# skipped (see the `cancelled` branch below). The other half stands — a human who cancels WHILE
# jobs are running is still indistinguishable, and is still retried once.
#
# The accepted waste was priced for an idle pool, and the case where someone cancels is precisely
# the case where the pool is NOT idle: draining a 19-hour, 23-run backlog put all 19 runs straight
# back in the queue, so the drain silently needed two passes and the re-added load landed on
# everyone else's PRs (#3208, capacity itself is #2039).
#
# `-R` ON EVERY `gh run rerun` IS LOAD-BEARING (issue #2841 follow-up)
# This job has no `actions/checkout`, so there is no git repository for `gh` to infer the
# target repo from, and a bare `gh run rerun <id>` dies with
#   failed to determine base repo: failed to run git: fatal: not a git repository
# That is not a new hazard: it is how this workflow behaved from the day it was written, so
# the auto-retry from #2330 had NEVER once succeeded — every invocation exited 1. Nothing
# caught it because a `workflow_run` job's red is addressed to nobody (the same blind spot
# `dependency-submission` hit for three days, which is why that one raises an issue now).
# Verified from a non-git directory: without `-R` the command cannot resolve the repo; with
# it, the call reaches the API. Do not drop the flag, and do not "fix" this by adding a
# checkout — cloning the repo to make one API call is pure waste.
#
# WATCH LIST
# Only the lanes that run on the spot pool and hurt when killed mid-flight: the PR services CI
# and the two slow security lanes. Do NOT add auto-deploy here — it has its own reconcile tick.
name: Auto-retry spot-killed CI runs

on:
  workflow_run:
    workflows: ["Services CI", "Security scan", "Dependency submission"]
    types: [completed]

permissions:
  actions: write   # re-run the cancelled workflow

jobs:
  retry:
    name: Re-run spot-killed run (once)
    runs-on: ubuntu-latest
    # `failure` is admitted here only so the step below can inspect the jobs; the decision to
    # re-run is made there, not by this expression. A job-level `if:` cannot reach the jobs API.
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-run only if the runner was reclaimed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Belt AND braces with the `-R` on every call (see the header note): this job has no
          # actions/checkout, so without one of the two `gh` exits 1 with "failed to determine
          # base repo" — the defect behind 208 silent failures (#2898). `-R` stays because it
          # is the explicit one; GH_REPO covers any `gh` call added later that forgets it, and
          # is what check-gh-repo-context.py reads at PR time.
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          # ── EVIDENCE (issue #4595) ──────────────────────────────────────────────────
          # Every exit path records ONE line saying what was examined and what was decided,
          # into the job summary as well as the log. Before this, a no-op and a success were
          # both "green with a notice buried in a log nobody opens", so the only observable
          # difference between "the control ran and correctly declined" and "the control ran
          # and did nothing because it could not tell" was a log download. `decision=` is the
          # field to read; it is one of skipped-queue-cancel / rerun-cancelled /
          # no-spot-kill-signature / jobs-unreadable / rerun-partial.
          decide() { # decide <decision> <human sentence>
            echo "spot-kill-auto-retry run=${RUN_ID} conclusion=${CONCLUSION} decision=$1"
            echo "| \`${CONCLUSION}\` | [${RUN_ID}](${RUN_URL}) | \`$1\` | $2 |" \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          printf '%s\n' \
            '| triggering conclusion | run | decision | detail |' \
            '|---|---|---|---|' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # ── TRANSIENT-FAILURE RETRY (issue #4595) ───────────────────────────────────
          # The re-run API call itself can fail transiently, and when it does the whole point
          # of this workflow is lost: the reclaimed run stays red and waits for the human
          # round-trip #2330 removed. Measured on run 31710803432 — detection was correct
          # ("1 job(s) interrupted mid-flight"), and `gh run rerun` answered
          #   failed to rerun: HTTP 502: Server Error
          # with no retry, so the step exited 1, raise-issue filed #4595, and the target run
          # (31710216158) only reached attempt 2 seventeen minutes later by a human hand.
          # Note what that failure was NOT: not "never triggered" and not "never detected" —
          # 3 of 10 sampled runs the same day issued a real re-run that landed as attempt 2.
          # Only 5xx / 429 / a transport error are retried. A 403/404/422 is a real answer
          # (run too old, already re-running, no permission); retrying those just burns the
          # budget and delays the alarm, so they fail immediately.
          rerun_with_retry() {
            # Written with `if ... fi`, never `[ x ] && cmd`, because a trailing AND-list that
            # evaluates false is a FAILING last command and `set -e` would exit the whole step
            # from inside the success path — the shape that turns a retry helper into a new
            # silent failure.
            local out
            for attempt in 1 2 3; do
              if out="$(gh run rerun -R "${GITHUB_REPOSITORY}" "$@" 2>&1)"; then
                echo "${out}"
                if [ "${attempt}" -gt 1 ]; then
                  echo "gh run rerun succeeded on attempt ${attempt}/3 after a transient error"
                fi
                return 0
              fi
              echo "gh run rerun attempt ${attempt}/3 failed: ${out}"
              case "${out}" in
                *"HTTP 5"*|*"HTTP 429"*|*"Server Error"*|*"connection reset"*|*"EOF"*|*"timeout"*) ;;
                *) echo "::error title=spot-kill auto-retry::Non-transient error from gh run rerun; not retrying: ${out}"
                   return 1 ;;
              esac
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            echo "::error title=spot-kill auto-retry::gh run rerun failed 3/3 times on ${RUN_URL} (last: ${out}). Needs a manual re-run."
            return 1
          }

          if [ "${CONCLUSION}" = "cancelled" ]; then
            # A reclaim kills a RUNNING job. So if not one cancelled job ever started a step,
            # nothing was running and a reclaim is impossible — this was a queue cancel, and
            # re-running it puts back exactly the load whoever cancelled was removing (#3208).
            #
            # `steps` is empty for a job that was still queued when the run was cancelled;
            # a job interrupted mid-flight carries its steps with their conclusions. Verified on
            # both sides against real runs: 30693441813 (operator drain) has 5 cancelled jobs and
            # 0 with steps, while contemporaneous cancels that hit running jobs report 1-2 with
            # steps. Attempt-scoped for the same reason the failure branch below is.
            #
            # ONE-DIRECTIONAL on purpose. This only rules a reclaim OUT; it never claims one
            # happened. A human who cancels while jobs are running still looks exactly like a
            # reclaim and is still retried once — unchanged, and still the accepted waste the
            # LOOP SAFETY note describes. What it removes is the case the header never priced:
            # draining a deep queue, where every cancelled job is one that never started, and the
            # retry silently undid the drain (#3208, #2039).
            RUNNING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/1/jobs?per_page=100" \
                        --jq '[.jobs[] | select(.conclusion == "cancelled") | select((.steps | length) > 0)] | length')"
            if [ "${RUNNING:-0}" -eq 0 ]; then
              echo "::notice title=spot-kill auto-retry::NOT re-running ${RUN_URL} — no cancelled job had started a step, so no runner was reclaimed. Treating it as a deliberate cancel (#3208)."
              decide skipped-queue-cancel "0 cancelled jobs had started a step — deliberate cancel, not a reclaim (#3208)"
              exit 0
            fi

            # At least one job was interrupted mid-flight: a reclaim is possible, so retry once.
            # `--failed` is a no-op against `cancelled`, so this is always the full re-run.
            echo "Re-running cancelled run ${RUN_URL} (${RUNNING} job(s) interrupted mid-flight; issue #2330)"
            rerun_with_retry "${RUN_ID}"
            echo "::notice title=spot-kill auto-retry::Re-ran cancelled run ${RUN_URL} (attempt 2 of max 2; a second kill stays for a human)"
            decide rerun-cancelled "${RUNNING} job(s) interrupted mid-flight — full re-run issued (attempt 2 of max 2)"
            exit 0
          fi

          # conclusion == failure: retry ONLY on the partial-spot-kill signature.
          # ATTEMPT-SCOPED on purpose: /actions/runs/<id>/jobs returns the LATEST attempt's jobs,
          # so a concurrent manual re-run would make this inspect a different (possibly green)
          # attempt and silently decline to retry. The `if:` above already pins run_attempt to 1;
          # this pins the query to match. Caught by running the real script against a fixture run
          # that had since been re-run by hand — the unscoped query reported "no spot-kill
          # signature" for a run whose attempt 1 was unambiguously spot-killed.
          killed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/1/jobs?per_page=100" \
            --jq '[.jobs[]
                   | select(.conclusion == "failure")
                   | select(([.steps[]? | select(.conclusion == "cancelled")] | length) > 0)
                   | select(([.steps[]? | select(.conclusion == "failure")]  | length) == 0)]
                  | length' 2>/dev/null || echo "")"

          if [ -z "${killed}" ]; then
            echo "::warning title=spot-kill auto-retry::Could not read jobs for ${RUN_URL}; not re-running. A genuine reclaim will need a manual re-run."
            decide jobs-unreadable "the jobs API could not be read — a genuine reclaim here needs a MANUAL re-run"
            exit 0
          fi

          if [ "${killed}" -eq 0 ]; then
            echo "::notice title=spot-kill auto-retry::${RUN_URL} failed with no spot-kill signature (no job has a cancelled step and no failed step) — treating it as a real failure and NOT re-running."
            decide no-spot-kill-signature "no failed job has a cancelled step and no failed step — a real build failure"
            exit 0
          fi

          echo "Re-running ${RUN_URL}: ${killed} job(s) killed mid-step by a runner reclaim (issue #2841)"
          rerun_with_retry "${RUN_ID}" --failed
          echo "::notice title=spot-kill auto-retry::Re-ran ${killed} spot-killed job(s) in ${RUN_URL} (attempt 2 of max 2; a second kill stays for a human)"
          decide rerun-partial "${killed} job(s) carry the spot-kill signature — failed jobs re-run (attempt 2 of max 2)"

  # ── The alarm (issue #2901) ───────────────────────────────────────────────────
  # Why this exists: this workflow failed 208 times without anyone noticing. It is
  # `workflow_run`-triggered, so there is no PR to show a red check on and no commit status
  # anyone reads — its red is addressed to nobody, the same blind spot dependency-submission
  # sat in for three days before it grew a raise-issue job.
  #
  # It is the sharp case rather than an ordinary one: the whole POINT of this workflow is to
  # act unattended, so "nobody is looking" is the design, not an accident. A silent failure is
  # therefore indistinguishable from a silent success — the spot-killed run just sits there
  # red, looking like an ordinary build failure, which is exactly the human round-trip #2330
  # existed to remove.
  #
  # The defect behind those 208 (a bare `gh run rerun` with no repo context, #2898) is fixed
  # and the workflow now succeeds. This job is about the NEXT one: it cannot prevent a
  # breakage, only make it arrive as an addressed issue instead of two quiet days.
  #
  # A separate job, not a step: a guard that fails in place is either skipped or strips the
  # job of dependents. `retry` has none today, but keeping escalation independent of what the
  # retry step does next is the pattern CLAUDE.md records.
  raise-issue:
    name: Raise issue on retry failure
    needs: retry
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5 # API calls only
    permissions:
      contents: read
      issues: write
    # No actions/checkout, so gh cannot infer the repo from a git remote (#2841).
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          TITLE="Spot-kill auto-retry is failing — reclaimed CI runs are not being re-run"
          # Body written with a plain redirect + --body-file, NOT `BODY=$(cat <<EOF ...)`.
          # A heredoc nested inside $( ) mis-parses an apostrophe as an opening quote on
          # bash 3.2 (still the default /bin/bash on macOS), so that shape cannot be dry-run
          # locally — a step only its own CI can syntax-check is a step nobody tests before
          # pushing. Flush-left because `run: |` strips only the common YAML indent.
          cat > "${RUNNER_TEMP:-/tmp}/issue-body.md" <<EOF
          \`auto-retry-cancelled.yml\` FAILED, so a CI run killed by a spot reclaim was **not**
          re-run and is sitting red waiting for a human.

          | | |
          |---|---|
          | this run | ${RUN_URL} |
          | triggering run | ${TARGET_URL} |
          | triggering workflow | \`${TARGET_NAME}\` |
          | its conclusion | \`${TARGET_CONCLUSION}\` |

          **Which branch was taken** follows from that conclusion: \`cancelled\` is the
          whole-run path (full re-run), \`failure\` is the partial-spot-kill path, which
          re-runs only the failed jobs and only when one of them has a \`cancelled\` step and
          no \`failed\` step.

          **This is latent, not cosmetic.** The reclaimed run looks like an ordinary build
          failure from every angle, so the cost is the human round-trip #2330 removed —
          silently reinstated. Nothing else reports it: a \`workflow_run\` job has no PR to
          redden and no commit status anyone reads, which is why this job exists (#2901).

          **Check the repo context first.** The 208 failures that preceded this job were all
          one cause: \`gh run rerun\` with no \`-R\` in a job with no \`actions/checkout\`, so
          \`gh\` could not resolve the repository and exited 1 (\`failed to determine base
          repo\`, fixed in #2898). If the log says that, something dropped the \`-R\` or the
          \`GH_REPO\` env — \`.github/scripts/check-gh-repo-context.py\` should have caught it
          at PR time, so check that gate too.

          **If instead the log says \`HTTP 5xx\` / \`Server Error\`, detection worked and only
          the API call lost.** Since #4595 that call is retried 3x with backoff, so reaching
          this issue on a 5xx means all three attempts lost — re-run the triggering run by
          hand and check GitHub's status page. The \`decision=\` line in the retry job's log
          and step summary says what was examined and what was decided on every path,
          including the no-op ones.

          Read the step output from **after the last** \`##[endgroup]\`: GitHub prints the
          step's own script into the log header, so grepping the whole log matches strings
          that never executed.

          This issue is refreshed on each further failure; close it once a run is green.
          EOF
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "${RUNNER_TEMP:-/tmp}/issue-body.md"
          else
            gh issue create --title "$TITLE" --body-file "${RUNNER_TEMP:-/tmp}/issue-body.md" \
              --label tech-debt --label "severity:high"
          fi
