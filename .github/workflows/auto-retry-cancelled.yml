# Auto-retry spot-killed CI runs (issue #2330).
#
# WHY THIS EXISTS
# The ARC runners burst pool (`runners` NodePool) is spot-only — ADR-0053's FinOps thesis is
# scale-to-zero on Karpenter's Graviton spot pool, and that is the right cost model. Its price
# is the spot reclaim: AWS reclaims in capacity blocks with a 2-minute warning, and a ~45-min
# CI job cannot finish in 2 minutes, so a reclaim lands mid-build as
#   "##[error]The runner has received a shutdown signal ... The operation was canceled."
# Because the reclaim hits every spot node in the block at once, several unrelated PRs die
# within seconds of each other (measured 2026-07-25, 12:25:14-12:25:15 UTC: four jobs on
# unrelated services, unrelated PRs, same second). Until now every one of those needed a human
# to notice and `gh run rerun` — and `gh run rerun --failed` is a no-op against `cancelled`
# conclusions, so the rerun is always the full one.
#
# WHAT THIS DOES
# When one of the watched workflows completes `cancelled`, this re-runs it automatically,
# bounded to one retry (run_attempt 1 only — see LOOP SAFETY below). A spot reclaim then costs
# one queued re-run instead of a human round-trip; the job lands on a fresh spot node (or the
# on-demand warm pool) and proceeds.
#
# ALSO `failure` — a reclaim that takes only PART of a multi-job run (issue #2841).
# A spot kill sets the killed STEP to `cancelled`, which makes its JOB `failure`, which makes
# the whole RUN `failure` as soon as any sibling job succeeded. Gating on a run-level
# `cancelled` therefore missed every partial kill: `security.yml` has 6 jobs and
# `services-ci.yml` fans out per service, so the common case never matched. Measured on
# security.yml run 30627400819 — CodeQL java-kotlin killed by
# "The runner has received a shutdown signal", five sibling jobs green, run `failure`, no
# retry — while three concurrency-superseded `cancelled` runs the same hour WERE retried.
# The mechanism was firing on the harmless case and missing the one it was built for.
#
# A run-level `failure` is NOT retried on its own — that is the normal outcome of a broken
# build, and blanket-retrying it would burn runner time and turn a deterministic red into a
# flaky-looking one. The run is retried when AT LEAST ONE failed job carries the spot-kill
# SIGNATURE: at least one `cancelled` step and NO `failed` step. A genuine build failure has a
# `failure` step followed by `skipped` ones, never a `cancelled` one. Read from the jobs API,
# so no log download is needed.
#
# MIXED RUNS ARE THE NORMAL CASE, and the rule above is a per-RUN decision, not a per-JOB
# filter. `gh run rerun --failed` re-runs every failed job, so a run containing both a
# spot-killed job and a genuinely broken one re-runs both. That is accepted: the reclaimed job
# needs the retry, the broken one fails again for the same reason, and `run_attempt == 1`
# bounds the whole thing to a single extra attempt.
#
# Do not read the rule as "only spot-killed jobs are re-run" — it isn't, and the very first
# live firing was already a mixed run. Services CI 30630120640 (main, 63 jobs) had three
# failed jobs: `build (openbank-product-catalog)` killed by a reclaim (1 cancelled step, 0
# failed), `build (openbank-mcp-service)` genuinely broken (0 cancelled, 1 failed), and
# `all-green` failing downstream of them. The signature matched on one job and the whole set
# was re-run. If per-job precision is ever wanted, it needs `gh run rerun --job <id>` per
# killed job, which is a different and larger change.
#
# LOOP SAFETY
# github.event.workflow_run.run_attempt is 1 for the original run and 2 for the first rerun,
# so gating on run_attempt == 1 gives exactly one automatic retry per run — a cancelled retry
# (run_attempt 2) never re-triggers, and a run cancelled for a real reason (superseded by a
# newer push to the same PR — the concurrency group's normal operation) is only retried once,
# where it fails fast if the branch has moved. Deliberately NOT retried: `action_required`
# (approval gates are a human's job).
#
# This paragraph used to end "and runs cancelled by anything other than the runner dying —
# indistinguishable from the outside, so we accept one wasted retry on a manually cancelled run".
# HALF of that is now false and the correction cost one API call: a reclaim kills a RUNNING job,
# so a run whose cancelled jobs never started a step cannot have been reclaimed. That case is now
# skipped (see the `cancelled` branch below). The other half stands — a human who cancels WHILE
# jobs are running is still indistinguishable, and is still retried once.
#
# The accepted waste was priced for an idle pool, and the case where someone cancels is precisely
# the case where the pool is NOT idle: draining a 19-hour, 23-run backlog put all 19 runs straight
# back in the queue, so the drain silently needed two passes and the re-added load landed on
# everyone else's PRs (#3208, capacity itself is #2039).
#
# WHERE THE DECISION LIVES (issue #6255)
# The classify-and-re-run logic is `.github/scripts/spot-kill-retry.sh`, not a `run:` block
# here. It moved because inline it was unfalsifiable — GitHub Actions on a real `workflow_run`
# event was its only executor, so the branches that exist for the rare case could only be
# exercised BY the rare case, and #6255 is what that cost: the detection `gh api` call had no
# transient handling while the `gh run rerun` call beside it had three attempts with backoff,
# and one installation rate limit (HTTP 403) killed the step before it emitted any `decision=`
# line at all. Its target, run 32499371733, had two jobs interrupted mid-flight and is still at
# `run_attempt: 1`. The script's `--self-test` now drives every decision and every error class
# against a stub `gh` on every PR (gate `spot-kill-retry-selftest`), including the two
# prevent-proofs: a reclaim IS re-run, a deliberate queue cancel is NOT.
#
# `-R` ON EVERY `gh run rerun` IS LOAD-BEARING (issue #2841 follow-up)
# This job used to have no `actions/checkout` at all — it now takes a sparse one for the script
# above, and `-R` stays regardless, because a checkout that fails must not silently restore the
# shape below. Without a git repository for `gh` to infer the target repo from, a bare
# `gh run rerun <id>` dies with
#   failed to determine base repo: failed to run git: fatal: not a git repository
# That is not a new hazard: it is how this workflow behaved from the day it was written, so
# the auto-retry from #2330 had NEVER once succeeded — every invocation exited 1. Nothing
# caught it because a `workflow_run` job's red is addressed to nobody (the same blind spot
# `dependency-submission` hit for three days, which is why that one raises an issue now).
# Verified from a non-git directory: without `-R` the command cannot resolve the repo; with
# it, the call reaches the API. Do not drop the flag, and do not "fix" this by adding a
# checkout — cloning the repo to make one API call is pure waste.
#
# WATCH LIST
# Only the lanes that run on the spot pool and hurt when killed mid-flight: the PR services CI
# and the two slow security lanes. Do NOT add auto-deploy here — it has its own reconcile tick.
name: Auto-retry spot-killed CI runs

on:
  workflow_run:
    workflows: ["Services CI", "Security scan", "Dependency submission"]
    types: [completed]

permissions:
  actions: write   # re-run the cancelled workflow

jobs:
  retry:
    name: Re-run spot-killed run (once)
    runs-on: ubuntu-latest
    # A rate-limit wait is now "until the limit resets" (capped at GH_RETRY_MAX_WAIT_SECONDS,
    # 600s here) rather than a flat 15s, because a 45-second budget cannot outlast an
    # installation limit whose window is minutes — that is #6853/#7976 and it reproduced on run
    # 33738356244. Four waits at 600s is ~40 min worst case; this bounds it rather than letting
    # the job sit for the 360-min default. ubuntu-latest is free on a public repo, so the trade
    # is a concurrency slot against a reclaimed CI run that otherwise needs a human.
    timeout-minutes: 50
    # `failure` is admitted here only so the step below can inspect the jobs; the decision to
    # re-run is made there, not by this expression. A job-level `if:` cannot reach the jobs API.
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.run_attempt == 1
    steps:
      # A SPARSE checkout, added by #6255. The header note above says this job has none, and
      # that was true and load-bearing while the decision logic lived inline in this file. It
      # had a price nobody had paid attention to: a `run:` block is executable ONLY by GitHub
      # Actions on a real `workflow_run` event, so its error paths were unfalsifiable and the
      # detection call shipped with no transient handling at all (#6255). The logic now lives
      # in `.github/scripts/spot-kill-retry.sh`, which has a `--self-test` run by the
      # `spot-kill-retry-selftest` gate on every PR. Fetching one file at depth 1 is not the
      # "clone the repo to make one API call" waste that note warned about — and `-R` stays on
      # every `gh` call regardless, because a checkout that fails must not silently restore the
      # #2898 shape (a bare `gh run rerun` resolving no repo, 208 silent failures).
      #
      # No `ref:` on purpose: a `workflow_run` checkout defaults to the DEFAULT BRANCH, which is
      # what a privileged control should execute. Checking out the triggering branch here would
      # let any PR author rewrite this script and have it run with `actions: write`.
      - name: Fetch the decision script (sparse, default branch)
        uses: actions/checkout@v5
        with:
          # BOTH files: spot-kill-retry.sh `source`s gh-retry.sh, so fetching only the first
          # gives a job that dies on line 1 with "No such file or directory". A sparse checkout
          # is a hand-kept list of what the script needs — the failure mode CLAUDE.md warns
          # about for any gate whose scope is maintained separately from its subject.
          sparse-checkout: |
            .github/scripts/spot-kill-retry.sh
            .github/scripts/gh-retry.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Re-run only if the runner was reclaimed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Belt AND braces with the `-R` the script puts on every call: GH_REPO covers any
          # `gh` call added later that forgets it, and is what check-gh-repo-context.py reads
          # at PR time.
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Cap on a SINGLE wait inside gh-retry.sh. Kept under the job's timeout-minutes above
          # with room for four of them plus the calls themselves.
          GH_RETRY_MAX_WAIT_SECONDS: "600"
          # GH_RETRY_DEAD_LETTER is deliberately NOT set. The library files its own
          # `ci-dead-letter` issue when a caller has no other way to be heard; this workflow
          # already has one — `raise-issue` below, which exists for exactly this (#2901) and
          # writes a far better body. Turning both on would file two issues per incident and
          # split the signal, which is the #5266/#5285 split-ledger failure in a new place.
        # Exit 0 = a decision was reached (re-run issued, or correctly declined). Exit 1 = the
        # control could not do its job, which routes to raise-issue below. The script's header
        # carries the full rationale, including why an unreadable jobs API is NOT a pass here
        # and why a rate limit must be told from a permission denial by message text.
        run: bash .github/scripts/spot-kill-retry.sh

  # ── The alarm (issue #2901) ───────────────────────────────────────────────────
  # Why this exists: this workflow failed 208 times without anyone noticing. It is
  # `workflow_run`-triggered, so there is no PR to show a red check on and no commit status
  # anyone reads — its red is addressed to nobody, the same blind spot dependency-submission
  # sat in for three days before it grew a raise-issue job.
  #
  # It is the sharp case rather than an ordinary one: the whole POINT of this workflow is to
  # act unattended, so "nobody is looking" is the design, not an accident. A silent failure is
  # therefore indistinguishable from a silent success — the spot-killed run just sits there
  # red, looking like an ordinary build failure, which is exactly the human round-trip #2330
  # existed to remove.
  #
  # The defect behind those 208 (a bare `gh run rerun` with no repo context, #2898) is fixed
  # and the workflow now succeeds. This job is about the NEXT one: it cannot prevent a
  # breakage, only make it arrive as an addressed issue instead of two quiet days.
  #
  # A separate job, not a step: a guard that fails in place is either skipped or strips the
  # job of dependents. `retry` has none today, but keeping escalation independent of what the
  # retry step does next is the pattern CLAUDE.md records.
  raise-issue:
    name: Raise issue on retry failure
    needs: retry
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5 # API calls only
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # A sparse checkout for `resolve-tracking-issue.sh` only. This job used to have none, and
      # the note that lived here said so — that was load-bearing when the whole job was one
      # inline `run:`, and `-R`/`GH_REPO` (both still set, above and in the script) is what
      # actually defends against #2841's `failed to determine base repo`. Fetching one file at
      # depth 1 is not the "clone the repo to make one API call" waste; the `retry` job took the
      # same trade in #6255 for the same reason — an inline expression is only executable by a
      # real `workflow_run` event, so its branches cannot be falsified before they misfire.
      #
      # No `ref:` on purpose: a `workflow_run` checkout defaults to the DEFAULT BRANCH, which is
      # what a job holding `issues: write` should execute.
      - name: Fetch the issue-resolver (sparse, default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/resolve-tracking-issue.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          TITLE="Spot-kill auto-retry is failing — reclaimed CI runs are not being re-run"
          # Body written with a plain redirect + --body-file, NOT `BODY=$(cat <<EOF ...)`.
          # A heredoc nested inside $( ) mis-parses an apostrophe as an opening quote on
          # bash 3.2 (still the default /bin/bash on macOS), so that shape cannot be dry-run
          # locally — a step only its own CI can syntax-check is a step nobody tests before
          # pushing. Flush-left because `run: |` strips only the common YAML indent.
          cat > "${RUNNER_TEMP:-/tmp}/issue-body.md" <<EOF
          \`auto-retry-cancelled.yml\` FAILED, so a CI run killed by a spot reclaim was **not**
          re-run and is sitting red waiting for a human.

          | | |
          |---|---|
          | this run | ${RUN_URL} |
          | triggering run | ${TARGET_URL} |
          | triggering workflow | \`${TARGET_NAME}\` |
          | its conclusion | \`${TARGET_CONCLUSION}\` |

          **Which branch was taken** follows from that conclusion: \`cancelled\` is the
          whole-run path (full re-run), \`failure\` is the partial-spot-kill path, which
          re-runs only the failed jobs and only when one of them has a \`cancelled\` step and
          no \`failed\` step.

          **This is latent, not cosmetic.** The reclaimed run looks like an ordinary build
          failure from every angle, so the cost is the human round-trip #2330 removed —
          silently reinstated. Nothing else reports it: a \`workflow_run\` job has no PR to
          redden and no commit status anyone reads, which is why this job exists (#2901).

          **Check the repo context first.** The 208 failures that preceded this job were all
          one cause: \`gh run rerun\` with no \`-R\` in a job with no \`actions/checkout\`, so
          \`gh\` could not resolve the repository and exited 1 (\`failed to determine base
          repo\`, fixed in #2898). If the log says that, something dropped the \`-R\` or the
          \`GH_REPO\` env — \`.github/scripts/check-gh-repo-context.py\` should have caught it
          at PR time, so check that gate too.

          **If instead the log says \`HTTP 5xx\` / \`Server Error\` or a rate limit, detection
          worked and only the API call lost.** Both calls go through
          \`.github/scripts/gh-retry.sh\`, which retries a 5xx/connection error with exponential
          backoff and waits out a rate limit until it RESETS (capped at
          \`GH_RETRY_MAX_WAIT_SECONDS\`), for \`SPOT_KILL_ATTEMPTS\` attempts — so reaching this
          issue means every attempt lost across that whole window. Re-run the triggering run by
          hand and check GitHub's status page. The \`decision=\` line in the retry job's log and
          step summary says what was examined and what was decided on every path, including the
          no-op ones, and now names the actual last error rather than \`unknown\`.

          Read the step output from **after the last** \`##[endgroup]\`: GitHub prints the
          step's own script into the log header, so grepping the whole log matches strings
          that never executed.

          This issue is refreshed on each further failure; close it once a run is green.
          EOF
          # `.[0].number` off a title search used to live here. It pins nothing: the candidate
          # set's size was never checked, so two same-titled issues silently split the alarm
          # between them and each half reads as a quieter problem than it is. That is exactly
          # what happened to the flake ledger below (#5266/#5285). The resolver makes an
          # ambiguous set exit 1 instead of an arbitrary pick, and it still creates the issue
          # when there is genuinely none — same one `gh issue list` call as before.
          status_file="${RUNNER_TEMP:-/tmp}/resolve-status"
          existing=$(bash .github/scripts/resolve-tracking-issue.sh \
            --title "$TITLE" \
            --create-body-file "${RUNNER_TEMP:-/tmp}/issue-body.md" \
            --create-label tech-debt --create-label "severity:high" \
            --status-file "$status_file")
          # A freshly created issue already carries this text as its BODY; only an issue that
          # already existed gets it again as a refresh comment.
          if [ "$(cat "$status_file")" = "existing" ]; then
            gh issue comment "$existing" --body-file "${RUNNER_TEMP:-/tmp}/issue-body.md"
          else
            echo "Opened #${existing} with this text as its body; no refresh comment needed."
          fi

  # ── Flake recording (issue #4878) ────────────────────────────────────────────
  # Why this lives HERE, in the workflow that already re-runs things, and not in a new listener:
  # the flake evidence exists exactly once, at the moment a re-run's FINAL attempt concludes --
  # after that, a query over run conclusions sees only `success` and the fact that attempt 1 was
  # genuinely red is gone. This job is the second `workflow_run` listener on the same three
  # workflows (`retry` above is the first), triggered independently by the SAME event.
  #
  # NOT every re-run is a flake. `retry` re-runs a run for one of two reasons -- a whole-run
  # spot-kill (`cancelled`, at least one job's steps show it was running when reclaimed) or a
  # partial spot-kill (`failure`, at least one job has a `cancelled` step and no `failure` step).
  # Neither of those is "the test disagreed with itself" -- it's a runner reclaim, explained by
  # infrastructure. What #4878 asks to record is the OTHER shape: a job that failed for a real
  # reason (a `failure` step, not merely a `cancelled` one) and later, on a subsequent attempt of
  # the SAME run, went green with no source change in between. `record-rerun-flake.py` carries
  # the exact predicate (`has_spot_kill_signature`) so the two workflows never drift apart on
  # what counts as "explained by infra" vs "genuinely flaky".
  #
  # This does NOT depend on `retry` and does not require `retry` to have fired -- a run can also
  # be re-run by a human (`gh run rerun --failed`), and that re-run is just as much evidence of a
  # flake as an automatic one. Gating only on `run_attempt > 1` and the FINAL conclusion being
  # `success` catches both.
  record-flake:
    name: Record a flake if a re-run turned a genuine failure green
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1
    runs-on: ubuntu-latest
    timeout-minutes: 5 # API + a handful of small artifact downloads
    permissions:
      contents: read
      actions: read   # read prior-attempt jobs and download the JUnit XML artifact from #4983
      issues: write   # the flake-tracking issue
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      FINAL_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Find genuinely-failed jobs from the attempt this run just recovered from
        id: classify
        run: |
          set -euo pipefail
          PREV_ATTEMPT=$((FINAL_ATTEMPT - 1))
          echo "prev-attempt=${PREV_ATTEMPT}" >> "${GITHUB_OUTPUT}"

          gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${PREV_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs' > "${RUNNER_TEMP}/prev-jobs.json"

          python3 .github/scripts/record-rerun-flake.py classify \
            --jobs-file "${RUNNER_TEMP}/prev-jobs.json" > "${RUNNER_TEMP}/candidates.json"

          count=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" \
            "${RUNNER_TEMP}/candidates.json")
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" -eq 0 ]; then
            echo "Attempt ${PREV_ATTEMPT} of ${RUN_URL}: every failed job carried the spot-kill "
            echo "signature (or none failed) -- explained by infrastructure, nothing to record."
          else
            echo "Attempt ${PREV_ATTEMPT} of ${RUN_URL}: ${count} job(s) failed for a real reason "
            echo "and the run is now green at attempt ${FINAL_ATTEMPT} -- recording as flake(s)."
          fi

      - name: "Build one record per flake candidate, with JUnit XML if #4983's artifact exists"
        if: steps.classify.outputs.count != '0'
        id: build
        run: |
          set -euo pipefail
          PREV_ATTEMPT="${{ steps.classify.outputs.prev-attempt }}"
          DETECTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > "${RUNNER_TEMP}/context.json" <<JSON
          {
            "workflow": "${WORKFLOW_NAME}",
            "run_id": ${RUN_ID},
            "run_url": "${RUN_URL}",
            "prev_attempt": ${PREV_ATTEMPT},
            "final_attempt": ${FINAL_ATTEMPT},
            "head_sha": "${HEAD_SHA}",
            "head_branch": "${HEAD_BRANCH}"
          }
          JSON

          python3 .github/scripts/record-rerun-flake.py build-records \
            --candidates "${RUNNER_TEMP}/candidates.json" \
            --context "${RUNNER_TEMP}/context.json" \
            --detected-at "${DETECTED_AT}" > "${RUNNER_TEMP}/records.json"

          mkdir -p "${RUNNER_TEMP}/comments"
          i=0
          jq -c '.[]' "${RUNNER_TEMP}/records.json" | while read -r record; do
            i=$((i + 1))
            echo "${record}" > "${RUNNER_TEMP}/record-${i}.json"
            service=$(echo "${record}" | jq -r '.service // empty')

            # `-a<PREV_ATTEMPT>` matches the naming #4983 gave the JUnit-XML-only upload; only
            # Services CI job names resolve to a service (see `extract_service`'s docstring), so
            # a Security-scan or Dependency-submission job legitimately has no such artifact --
            # `continue-on-error` there is expected, not a failure of this step.
            tests_file="${RUNNER_TEMP}/tests-${i}.json"
            echo "[]" > "${tests_file}"
            if [ -n "${service}" ]; then
              artifact_dir="${RUNNER_TEMP}/junit-${i}"
              if gh run download "${RUN_ID}" -n "junit-xml-${service}-a${PREV_ATTEMPT}" \
                   -D "${artifact_dir}" 2>"${RUNNER_TEMP}/download-${i}.log"; then
                python3 .github/scripts/record-rerun-flake.py parse-junit \
                  --path "${artifact_dir}" > "${tests_file}"
              else
                echo "No junit-xml-${service}-a${PREV_ATTEMPT} artifact on ${RUN_URL} (may have expired, or the job failed before producing test output); recording at job level only."
              fi
            fi

            merged=$(python3 .github/scripts/record-rerun-flake.py merge-tests \
              --record "${RUNNER_TEMP}/record-${i}.json" --tests "${tests_file}")
            echo "${merged}" > "${RUNNER_TEMP}/comments/record-${i}.json"
          done

      - name: Open or refresh the flake-tracking issue, one comment per recorded flake
        if: steps.classify.outputs.count != '0'
        run: |
          set -euo pipefail
          # THE LEDGER IS PINNED BY NUMBER, and auto-creation is deliberately gone (#5266).
          #
          # This used to be `--search "$TITLE in:title" ... .[0].number` plus "create one if the
          # search finds nothing", and both halves failed together. GitHub's issue search index
          # is eventually consistent, so a second `workflow_run` listener querying moments after
          # the first one created the issue legitimately sees nothing and creates a RIVAL ledger
          # with the same title. That is how #5266 (14:45Z) and #5285 (17:37Z) came to exist:
          # same author, same labels, byte-identical bodies. `.[0]` then chose between them by
          # whatever order the search API happened to return — and it CHANGED: the first record
          # landed on #5266 at 16:19Z and every record from 17:37Z onward on #5285, leaving 85
          # records in one and 1 in the other with nothing anywhere saying so.
          #
          # A split ledger is worse than a missing one. Each half reads as a low flake count and
          # neither reader can tell they are seeing part of the data — `list-recorded-flakes.py`
          # takes one `--issue` and would have reported either half as the whole truth.
          #
          # Sorting the candidates would not have fixed it: that still selects by a mutable
          # property of an unbounded set. The number below is the identity. If it must change,
          # it changes in a reviewed PR — the ledger cannot relocate itself.
          LEDGER_ISSUE="5285"
          TITLE="Flaky test observations (recorded from CI re-run evidence)"
          # Verifies open + still titled as expected, and exits 1 otherwise. Exiting 1 is the
          # point: a record that cannot be filed correctly must not be filed somewhere plausible.
          existing=$(bash .github/scripts/resolve-tracking-issue.sh \
            --title "$TITLE" --pinned "$LEDGER_ISSUE")

          for f in "${RUNNER_TEMP}"/comments/record-*.json; do
            [ -e "$f" ] || continue
            python3 .github/scripts/record-rerun-flake.py render --record "$f" \
              > "${RUNNER_TEMP}/comment-body.md"
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/comment-body.md"
          done
