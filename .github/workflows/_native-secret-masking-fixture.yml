# This worker exercises GitHub's native secret channel, not the guarded recorder.
# No production worker, credential, endpoint or repository configuration is used.
name: Harmless native secret masking worker

on:
  workflow_call:
    secrets:
      fixture_url:
        required: true
      fixture_issuer:
        required: true

permissions: {}

jobs:
  observe-masking:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FIXTURE_URL: ${{ secrets.fixture_url }}
      FIXTURE_ISSUER: ${{ secrets.fixture_issuer }}
      PLAIN_ENV_CONTROL: PUBLIC_PLAIN_ENV_CONTROL_e59c7a2b
    steps:
      - name: Exercise first-step headers and output without credentials
        run: |
          python3 - <<'PY'
          import os

          for name in ("FIXTURE_URL", "FIXTURE_ISSUER"):
              value = os.environ[name]
              assert len(value) >= 24, "missing harmless native-secret fixture"
              print(f"{name}={value}")
          print("NATIVE_MASKING_FIXTURE_EXECUTED")
          print(f"PLAIN_ENV_CONTROL={os.environ['PLAIN_ENV_CONTROL']}")
          PY
