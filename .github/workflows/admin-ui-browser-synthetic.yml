# SPDX-License-Identifier: Apache-2.0
name: Admin UI browser synthetic

on:
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      expected_build_sha:
        description: "Full or short SHA expected from the deployed Admin UI build attestation"
        required: false
  push:
    branches: [main]
    paths:
      - 'openbank-admin-ui/scripts/admin-login-synthetic.mjs'
      - 'openbank-admin-ui/scripts/admin-operator-journey.mjs'
      - '.github/workflows/admin-ui-browser-synthetic.yml'
      # The security-excellence probe below must run when its page changes, not just
      # when the probe script does.
      - 'openbank-admin-ui/src/app/security/**'

permissions:
  contents: read

jobs:
  sso-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: openbank-admin-ui/package-lock.json
      - working-directory: openbank-admin-ui
        run: npm ci --no-audit --no-fund
      - working-directory: openbank-admin-ui
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - id: synthetic
        working-directory: openbank-admin-ui
        env:
          OPENBANK_BROWSER: ${{ matrix.browser }}
          OPENBANK_SYNTHETIC_JOURNEY: admin-ui-sso-boundary
          ADMIN_UI_EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}
          OPENBANK_BROWSER_VITALS_OUTPUT: build/test-intelligence/browser-vitals-${{ matrix.browser }}.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: build/test-results/e2e/admin-login-synthetic-${{ matrix.browser }}.xml
        run: node scripts/admin-login-synthetic.mjs
      - if: always()
        run: |
          python3 .github/scripts/collect-test-run-evidence.py \
            --service openbank-admin-ui --component openbank-admin-ui \
            --synthetic-journey admin-ui-sso-boundary \
            --synthetic-variant ${{ matrix.browser }} \
            --browser-vitals openbank-admin-ui/build/test-intelligence/browser-vitals-${{ matrix.browser }}.json \
            --out openbank-admin-ui/build/test-intelligence/run-${{ matrix.browser }}.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-intelligence-run-openbank-admin-ui-browser-${{ matrix.browser }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/build/test-intelligence/run-${{ matrix.browser }}.json
          retention-days: 30
          if-no-files-found: error

  # Authenticated operator journey (journeys.yaml: admin-operator-access, ADR-0252). A
  # least-privilege bank-owned canary operator completes the deployed sandbox SSO flow in a
  # real browser, reaches the Test Intelligence workspace, and is REFUSED on an admin-only
  # BFF route. Fail-closed by contract: until the owner provisions the canary identity
  # (openbank-infra/scripts/provision-synthetic-operator.sh) and sets the two workflow
  # secrets, the script logs "credential absent" and fails every check — red, never green.
  # Chromium only: the realm 'openbank' login ceremony is template-verified on Chromium, and
  # the role-boundary assertion is one verdict, not a per-engine matrix.
  admin-operator-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: openbank-admin-ui/package-lock.json
      - working-directory: openbank-admin-ui
        run: npm ci --no-audit --no-fund
      - working-directory: openbank-admin-ui
        run: npx playwright install --with-deps chromium
      - id: synthetic
        working-directory: openbank-admin-ui
        env:
          OPENBANK_BROWSER: chromium
          OPENBANK_SYNTHETIC_JOURNEY: admin-operator-access
          SYNTHETIC_OPERATOR_USERNAME: ${{ secrets.SYNTHETIC_OPERATOR_USERNAME }}
          SYNTHETIC_OPERATOR_PASSWORD: ${{ secrets.SYNTHETIC_OPERATOR_PASSWORD }}
          ADMIN_UI_EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}
          OPENBANK_BROWSER_VITALS_OUTPUT: build/test-intelligence/browser-vitals-admin-operator-access.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: build/test-results/e2e/admin-operator-journey.xml
        run: node scripts/admin-operator-journey.mjs
      - if: always()
        run: |
          python3 .github/scripts/collect-test-run-evidence.py \
            --service openbank-admin-ui --component openbank-admin-ui \
            --synthetic-journey admin-operator-access \
            --synthetic-variant chromium \
            --browser-vitals openbank-admin-ui/build/test-intelligence/browser-vitals-admin-operator-access.json \
            --out openbank-admin-ui/build/test-intelligence/run-admin-operator-access.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-intelligence-run-openbank-admin-ui-admin-operator-access-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/build/test-intelligence/run-admin-operator-access.json
          retention-days: 30
          if-no-files-found: error

  # Credential-free probe of the Security Excellence console. Beyond the shared
  # SSO-boundary / Web Vitals / attestation checks it asserts the AUTH GATE itself:
  # an unauthenticated request must redirect to /auth/login — a 200 here would be
  # an auth-bypass regression on the bank's security console.
  security-excellence-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: openbank-admin-ui/package-lock.json
      - working-directory: openbank-admin-ui
        run: npm ci --no-audit --no-fund
      - working-directory: openbank-admin-ui
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - id: synthetic
        working-directory: openbank-admin-ui
        env:
          OPENBANK_BROWSER: ${{ matrix.browser }}
          OPENBANK_SYNTHETIC_JOURNEY: admin-ui-security-excellence
          ADMIN_UI_SYNTHETIC_URL: https://admin.open-bank.tech/security/excellence
          ADMIN_UI_SYNTHETIC_EXPECT_AUTH_GATE: '1'
          ADMIN_UI_EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}
          OPENBANK_BROWSER_VITALS_OUTPUT: build/test-intelligence/browser-vitals-security-excellence-${{ matrix.browser }}.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: build/test-results/e2e/security-excellence-synthetic-${{ matrix.browser }}.xml
        run: node scripts/admin-login-synthetic.mjs
      - if: always()
        run: |
          python3 .github/scripts/collect-test-run-evidence.py \
            --service openbank-admin-ui --component openbank-admin-ui \
            --synthetic-journey admin-ui-security-excellence \
            --synthetic-variant ${{ matrix.browser }} \
            --browser-vitals openbank-admin-ui/build/test-intelligence/browser-vitals-security-excellence-${{ matrix.browser }}.json \
            --out openbank-admin-ui/build/test-intelligence/run-security-excellence-${{ matrix.browser }}.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-intelligence-run-openbank-admin-ui-security-excellence-${{ matrix.browser }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/build/test-intelligence/run-security-excellence-${{ matrix.browser }}.json
          retention-days: 30
          if-no-files-found: error

  # Merge every journey envelope from this run into ONE and publish it to the
  # commit-addressed evidence store (#13201) under the commit the DEPLOYED image
  # attests — the same key the Test Intelligence matrix overlays for the running
  # build. Without this job the journeys only ever existed as workflow artifacts,
  # so the matrix showed "no synthetic evidence" for a fully green fleet. Write-once:
  # the first publication for a commit stands (412 = kept). Runs even when a journey
  # failed — a red observation is evidence too, and hiding it would launder the gap.
  publish-journey-evidence:
    name: Publish journey evidence to the evidence store
    needs: [sso-boundary, admin-operator-access, security-excellence-probe]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts/publish-test-evidence.sh
            openbank-admin-ui/scripts/publish-test-evidence.mjs
            openbank-admin-ui/scripts/merge-synthetic-run-envelopes.mjs
            openbank-admin-ui/src/lib/test-intelligence-run-projection.mjs
            openbank-admin-ui/version.txt
            openbank-libs/governance/rules.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Download journey envelopes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-intelligence-run-openbank-admin-ui-*
          merge-multiple: true
          path: ${{ runner.temp }}/journey-envelopes

      - name: Resolve the deployed commit from the build attestation
        id: deployed
        run: |
          set -euo pipefail
          attested="$(curl -fsS --retry 3 https://admin.open-bank.tech/.well-known/openbank-build-attestation | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).gitSha))')"
          case "${attested}" in
            ''|unknown) echo "::error::build attestation unavailable or unknown"; exit 1 ;;
          esac
          # Images built before the full-sha attestation change report the short
          # prefix; expand it against main. An ambiguous prefix fails rev-parse,
          # which is correct — never guess a commit for evidence.
          if [ "${#attested}" -ne 40 ]; then
            attested="$(git rev-parse --verify --quiet "${attested}^{commit}")" || {
              echo "::error::attested sha ${attested} does not resolve to a unique commit on main"; exit 1; }
          fi
          echo "commit=${attested}" >> "$GITHUB_OUTPUT"
          echo "Deployed commit: ${attested}"

      - name: Merge journey envelopes
        run: |
          set -euo pipefail
          shopt -s nullglob
          envelopes=( "${{ runner.temp }}"/journey-envelopes/*.json )
          [ "${#envelopes[@]}" -ge 1 ] || { echo "::error::no journey envelopes downloaded"; exit 1; }
          node openbank-admin-ui/scripts/merge-synthetic-run-envelopes.mjs \
            --commit "${{ steps.deployed.outputs.commit }}" \
            --out "${{ runner.temp }}/merged-run.json" "${envelopes[@]}"

      - name: Assume the evidence-writer role (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-sandbox-test-evidence-writer
          aws-region: eu-north-1

      - name: Publish write-once to the evidence store
        run: |
          bash .github/scripts/publish-test-evidence.sh openbank-admin-ui \
            "${{ steps.deployed.outputs.commit }}" "${{ steps.deployed.outputs.commit }}" \
            identical "${{ runner.temp }}/merged-run.json"
