# Fast full-fleet lint + compile gate.
#
# WHY THIS EXISTS (the gap it closes):
#  Per-service CI (services-ci.yml) is path-scoped — a PR builds only the modules it
#  touches. So a change to openbank-libs (or a detekt/ktlint ruleset bump) can leave the
#  REST of the fleet silently non-compliant with the current ruleset until something
#  forces a full rebuild. The defect class:
#    - a libs constructor change breaks a downstream service's *test* compile,
#    - a ruleset tightening leaves pre-existing detekt/ktlint violations in untouched
#      modules (cf. "latent wildcard imports"),
#  all invisible on the touching PR and dumped, en masse, on the next libs PR's
#  full-fleet rebuild (which then blocks every libs PR — #1689 chain).
#
#  services-ci.yml already runs a NIGHTLY full `:build` per module, but that is heavy
#  (Testcontainers, ~28 services, max-parallel 4) and shares the integration-test flake
#  surface, so a red nightly is easy to dismiss. This gate is the COMPLEMENT: it runs
#  ONLY compile + static analysis (detekt + ktlintCheck + testClasses) across the whole
#  fleet in one Gradle invocation — no Docker, no Testcontainers, deterministic — so the
#  compile/lint drift class is caught:
#    - CONTINUOUSLY (every push to main, in minutes — not up to 24h later), and
#    - with a CLEAN signal nobody can write off as "just a flaky container".
#
#  It does NOT run tests (that stays with the nightly `:build`); coverage/IT drift is the
#  nightly's job. This gate is purely "does the whole fleet still compile and lint?".
name: Fleet lint

on:
  # Continuous: the moment a libs/ruleset change lands on main, re-lint the whole fleet.
  # Skip the bulk of main churn that cannot change a Gradle compile/detekt/ktlint result —
  # gitops deploy commits (openbank-infra/**, the dominant main-push volume), the JS admin-ui
  # (not a Gradle module), docs and markdown. The daily `schedule` below is the belt-and-braces
  # full sweep, so a code path missed by this filter is still caught within ~12h. This stops
  # every sandbox-deploy chore commit from spinning up (then cancelling, via the concurrency
  # group) a full-fleet run and contending for the shared runner pool.
  push:
    branches: [main]
    paths-ignore:
      - 'openbank-infra/**'
      - 'openbank-admin-ui/**'
      - 'docs/**'
      - '**/*.md'
  # Belt-and-braces daily sweep, offset 12h from the 03:00 nightly `:build` so the fleet
  # gets a compile/lint signal twice a day at different times.
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC daily
  workflow_dispatch: {}

# Deliberately NOT on pull_request: a per-PR full-fleet lint would defeat the path-scoped
# minutes governance that services-ci.yml is built around. This gate is the post-merge /
# scheduled safety net for what path-scoping cannot see.

permissions:
  contents: read

concurrency:
  # One fleet-lint per ref; a newer main push supersedes an in-flight one.
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  # A scheduled run must not share a lane with a manual dispatch: both fall to the
  # 'ci' key otherwise, so a workflow_dispatch cancels an in-flight nightly. Same
  # separation services-ci.yml already makes for the nightly fleet build.
  group: fleet-lint-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci') }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  fleet-lint:
    name: fleet lint + compile
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      # UTF-8 locale so the JVM's sun.jnu.encoding (filename charset) is UTF-8. Without it,
      # on a C/POSIX-locale runner the Gradle remote build cache fails to decode .class entries
      # whose names contain non-ASCII chars (Kotlin backtick test names with em-dashes, e.g.
      # "...$screen checks aliases — hit via alias search wins$1$1.class") → "Malformed input or
      # input contains unmappable characters" → fatal cache-load failure across the fleet compile.
      # -Dsun.jnu.encoding also forces a fresh daemon (distinct jvmargs) so a stale C-locale daemon
      # on a persistent runner isn't reused. file.encoding=UTF-8 alone does NOT fix filename decoding.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Heap is a RATCHET, and nothing measures it — expect to raise it again as the fleet grows.
      # This is the only workflow that configures AND executes every module in ONE invocation, so
      # its peak heap scales with the whole task graph (455 actionable tasks and climbing), not with
      # one service. At -Xmx4g it started dying with `java.lang.OutOfMemoryError: Java heap space`
      # in Gradle's MissingTaskDependencyDetector / ExecutionNodeAccessHierarchy — the execution-time
      # VFS hierarchy that records every task's input/output locations, which grows with the graph.
      # An OOM here is worse than a slow run: it aborts PART-WAY (235 of 455 tasks executed), so the
      # modules after the abort are never linted at all, and the red check reads as "the fleet is
      # broken" when nothing is. dependency-submission.yml already ratcheted 4g→6g for this same
      # OOM class, and security.yml runs at 6g; ubuntu-latest has 16 GB, so 6g leaves ample room for
      # the separate Kotlin compile daemon and the worker processes.
      #
      # DO NOT raise this because the heap sampler reports "94% of -Xmx" (#5949). That percentage
      # tracks the ceiling, not demand: measured on this exact task graph with identical work
      # (1140 actionable tasks, --rerun-tasks), 3g -> 99% and died, 6g -> 95% and passed,
      # 10g -> 85% and passed. Raising 6g to 10g does not even clear the 85% line. Raise it when a
      # run actually aborts (`kind=infra` below), not when the occupancy figure is high.
      #
      # And when that day comes, note this value is not one 6 GB budget. Nothing sets
      # `kotlin.daemon.jvmargs`, so the Kotlin compile daemon inherits these jvmargs and runs with
      # the SAME ceiling — both daemons were sampled at 6144 MiB here. On a 16 GB runner already
      # observed dipping to ~1.3 GB free at its floor, raising this raises two ceilings at once, so
      # pin the Kotlin daemon separately rather than letting the raise multiply.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Most modules pin kotlin { jvmToolchain(25) }; a few use 21. Install both so
      # Gradle's toolchain resolution picks the right one with zero Foojay downloads.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Probe the in-cluster Reposilite Maven mirror (issue #849): zero NAT for
      # in-cluster ARC runners; Hetzner/Mac runners ECONNREFUSED fast and skip.
      - name: Probe Reposilite in-cluster Maven mirror
        run: |
          if curl -sf --connect-timeout 2 \
              http://reposilite.reposilite.svc.cluster.local:8080/api/status \
              > /dev/null 2>&1; then
            echo "REPOSILITE_MIRROR_URL=http://reposilite.reposilite.svc.cluster.local:8080" \
              >> "$GITHUB_ENV"
            echo "::notice title=Reposilite active::in-cluster Maven mirror responding (zero NAT)"
          else
            echo "::notice title=Reposilite unavailable::falling back to GCS mirror + CodeArtifact"
          fi

      # CodeArtifact Maven mirror (FinOps): in-VPC, S3-gateway backed → dep downloads
      # never exit the VPC. Soft-fail to public Maven Central if IRSA/aws CLI absent.
      - name: Configure CodeArtifact Maven mirror
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: eu-north-1
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            echo "::warning title=CodeArtifact mirror skipped::aws CLI not on this runner — falling back to public Maven Central."
            exit 0
          fi
          CA_TOKEN=$(aws codeartifact get-authorization-token \
            --domain openbank-sandbox \
            --domain-owner 265175468565 \
            --region eu-north-1 \
            --query authorizationToken --output text) || {
            echo "::warning title=CodeArtifact mirror skipped::token fetch failed — falling back to public Maven Central."
            exit 0
          }
          CA_URL="https://openbank-sandbox-265175468565.d.codeartifact.eu-north-1.amazonaws.com/maven/maven-central-proxy/"
          mkdir -p "${GRADLE_USER_HOME}/init.d"
          cat > "${GRADLE_USER_HOME}/init.d/codeartifact-mirror.gradle" <<GRADLE_INIT
          allprojects {
            repositories.all { repo ->
              if (repo instanceof MavenArtifactRepository) {
                def url = repo.url.toString()
                if (url.contains("repo1.maven.org") || url.contains("repo.maven.apache.org") ||
                    url.contains("plugins.gradle.org")) {
                  repo.setUrl("${CA_URL}")
                  repo.credentials {
                    username "aws"
                    password "${CA_TOKEN}"
                  }
                }
              }
            }
          }
          GRADLE_INIT

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Only main saves the Actions cache; scheduled/dispatch restore read-only.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The whole point: compile main + test AND run static analysis for EVERY module in
      # one invocation, with NO test execution (no Testcontainers, no Docker).
      #  - testClasses  → compiles main + test sources fleet-wide (catches the
      #                   libs-constructor-breaks-a-downstream-test compile drift class).
      #  - detekt       → static analysis with type resolution (depends on compile).
      #  - ktlintCheck  → formatting/import drift (the latent-wildcard class).
      # --continue: don't stop at the first red module — report ALL drift in one run so a
      # fleet-wide ruleset bump surfaces the full list, not one-module-at-a-time.
      #
      # An OOM here is a VACUOUS RED, not just a failure (issue #2177). The heap dies
      # part-way through the task graph, so every module after the abort is never linted at
      # all — measured on run 30142905147: 455 actionable tasks executed against a true 920
      # once the heap was raised. Roughly half the fleet was unchecked while the check
      # reported a plain red, indistinguishable from a real lint violation. On the one gate
      # whose purpose is to be un-dismissable, that is the mirror of a vacuous green: the
      # reader cannot tell "your code is bad" from "the runner ran out of memory before
      # reaching your code".
      #
      # So classify the failure instead of letting both land in the same bucket. The step
      # still fails either way — an OOM'd run has NOT linted the fleet and must not read as
      # a pass — but it says which kind it was, and the alert issue says so too.
      - name: Fleet compile + detekt + ktlint
        id: lint
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/fleet-lint.log"
          rc=0
          # Wrapped in the heap sampler (#2177 problem 1). The classifier below makes an OOM
          # legible AFTER it happens; this records how close each healthy run came, so the next
          # -Xmx raise can be anticipated instead of discovered by going red. The pipeline runs
          # inside the wrapper (not the wrapper inside the pipeline) so the sampler observes the
          # whole build, and `pipefail` is re-set in the inner shell so `tee` cannot mask Gradle's
          # exit code — the failure this repo has already been burnt by twice.
          # shellcheck disable=SC2016  # $1 is the INNER bash's positional, deliberately unexpanded
          .github/scripts/gradle-heap-headroom.sh fleet-lint -- \
            bash -c 'set -o pipefail; ./gradlew testClasses detekt ktlintCheck \
              --continue --build-cache --console=plain --stacktrace 2>&1 | tee "$1"' _ "$log" || rc=$?

          # "N actionable tasks" is Gradle's own count of what it actually got through, so a
          # number well below the healthy fleet total is itself evidence of an early abort.
          tasks=$(grep -oE '[0-9]+ actionable tasks' "$log" | tail -1 || true)

          if [ "$rc" -eq 0 ]; then
            echo "fleet-lint: clean (${tasks:-task count not reported})."
            exit 0
          fi

          # Infrastructure aborts, not findings: the JVM died, so the task graph stopped
          # early and the modules after it were never examined.
          # Deliberately narrow: each pattern is unambiguous about the JVM dying. In
          # particular do NOT match a bare "Daemon will be stopped at the end of the build" —
          # Gradle prints that for ordinary reasons too, and a pattern that also fires on a
          # healthy build would relabel real lint findings as infrastructure, which is the
          # same mislabelling in the other direction.
          # `running out of JVM heap space` is Gradle's OWN wording when the daemon dies of heap
          # exhaustion, and it is the wording this failure actually produces: a fleet-lint run
          # forced to -Xmx3g died after 9 of 1140 tasks with "Daemon will be stopped at the end of
          # the build after running out of JVM heap space" and NO `OutOfMemoryError` anywhere in
          # the log — so the four patterns below classified a 9-task truncation as `kind=lint`, a
          # "real finding", which is the precise mislabelling this classifier exists to prevent
          # (#5949). It stays inside the narrow rule stated above: it names heap exhaustion
          # explicitly and cannot fire on a healthy build, unlike a bare "Daemon will be stopped".
          # Verified BOTH ways against real logs — the 3g truncation now matches, and a clean 6g
          # run (1140 tasks, BUILD SUCCESSFUL) still does not.
          if grep -qE 'OutOfMemoryError|GC overhead limit exceeded|Gradle build daemon disappeared|out of JVM memory|running out of JVM heap space' "$log"; then
            echo "kind=infra" >> "$GITHUB_OUTPUT"
            echo "::error title=fleet-lint ABORTED (infrastructure, not a lint finding)::The Gradle daemon ran out of memory, so the task graph stopped part-way and the modules after the abort were NEVER LINTED. This red does not mean the fleet is broken and it does not mean it is clean — it means the gate did not run. Raise -Xmx in this workflow's GRADLE_OPTS (a ratchet; see the comment there) and re-run. Reached: ${tasks:-unknown}."
            exit 1
          fi

          echo "kind=lint" >> "$GITHUB_OUTPUT"
          echo "::error title=fleet-lint findings::A module no longer compiles or violates the current detekt/ktlint ruleset. This is a real finding — see the per-module list above. Reached: ${tasks:-unknown}."
          exit "$rc"

      # Same lesson as the nightly build alert: a scheduled/push failure that only shows
      # as a red check in the Actions tab goes unwatched. Turn it into the SAME
      # deduplicated fleet-health issue so a rotting fleet is impossible to miss.
      # github-script (not `gh`): the self-hosted runners have no gh binary.
      - name: Alert on fleet-lint failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILURE_KIND: ${{ steps.lint.outputs.kind }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const detected = new Date().toISOString();
            const trigger = context.eventName; // push | schedule | workflow_dispatch
            // Dedupe on the LINT-specific marker label, NOT the shared 'fleet-health'
            // umbrella — otherwise this alert and the services-ci build alert (both carry
            // 'fleet-health') collide on a single issue and one source's failures hide as
            // comments on the other's issue.
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'fleet-health-lint',
            });
            // Say WHICH failure this was. An OOM'd run and a real lint violation used to
            // produce the identical note, so the issue could not be triaged from its own
            // body — the exact indistinguishability #2177 is about.
            const kind = process.env.FAILURE_KIND || 'unknown';
            const cause = kind === 'infra'
              ? 'ABORTED on infrastructure, **not** a lint finding: the Gradle daemon ran out of memory, so the task graph stopped part-way and every module after the abort was never linted. This run is not evidence that the fleet is broken, nor that it is clean — the gate did not run. Raise `-Xmx` in `fleet-lint.yml`\'s `GRADLE_OPTS` (a ratchet — see the comment there) and re-run.'
              : kind === 'lint'
                ? 'a module no longer compiles or violates the current detekt/ktlint ruleset, even though path-scoped PR CI was green. See the run for the full per-module list.'
                : 'failed before the classification step could run (setup, checkout, or toolchain) — read the run log directly.';
            const note = `The fast fleet-lint gate (compile + detekt + ktlint, no tests) failed on \`${trigger}\` — ${cause}\n\nRun: ${runUrl}\nDetected: ${detected}`;
            if (open.length > 0) {
              const n = open[0].number;
              await github.rest.issues.createComment({
                owner, repo, issue_number: n, body: note,
              });
              core.info(`Commented on existing fleet-health-lint issue #${n}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo,
                title: 'Full-fleet lint gate is failing',
                labels: ['fleet-health', 'fleet-health-lint', 'bug'],
                body: note,
              });
              core.info(`Opened a new fleet-health-lint issue #${created.number}.`);
            }
