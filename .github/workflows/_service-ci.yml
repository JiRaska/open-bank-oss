# Reusable per-service CI. Called by services-ci.yml once per changed Gradle module.
#
# Why a reusable workflow + matrix (not 29 copy-pasted jobs):
#  - single source of truth for the build recipe -> DRY, auditable
#  - each service gets its OWN status check (green/red per service)
#
# Test infrastructure (issue #578, ADR-0044):
#  - Each @QuarkusTest IT boots its OWN PostgreSQL + Redpanda (+ Valkey where needed)
#    per test JVM via Testcontainers (`*TestResource` QuarkusTestResourceLifecycleManager),
#    injecting their dynamic URLs as highest-precedence config. There is therefore NO
#    shared, fixed-name compose stack to boot, warm-reuse, or reset between jobs.
#  - This kills the correlated full-fleet flakes the shared stack caused: a job
#    rebooting the one openbank-postgres/kafka/valkey set, a global Valkey FLUSHALL, or
#    the Postgres bootstrap-restart race used to take concurrent neighbours down with
#    `endpoint with name openbank-kafka already exists` / `Connection refused`.
#  - Services with no infra-touching @QuarkusTest (anacredit, product-catalog, …) and
#    pure-unit modules need nothing here; their tests boot no containers at all.
#
# ADR-0250 Phase 2 (issue #4414): this file used to be a SINGLE job that ran `build`
# (compile/test/quarkusBuild/consumer-pact generation) AND provider-verification against the
# Pact Broker as one unit, on the scarce self-hosted `openbank-build` ARC pool on every
# main push — because provider verification needs in-cluster DNS to reach the broker
# (ADR-0056: no public ingress). Filtering which TESTS ran with `--tests` never decoupled the
# two: `-Dpactbroker.url` is a tracked INPUT of the `test` task, so a broker-configured
# invocation is always a different Gradle cache key from an unconfigured one, forcing a full
# recompile+retest regardless of what `--tests` selects. It is now split into two jobs:
#   - `build`  — compile, `test` (incl. consumer-pact generation), quarkusBuild. Hosted
#     (`ubuntu-latest`, free/unlimited on this public repo), for EVERY event including
#     main-push. Uploads this service's freshly-generated consumer pacts as an artifact.
#   - `contract` — provider verification against the Pact Broker + publishing consumer
#     pacts. Stays on `openbank-build` (in-cluster ARC, the only pool that resolves the
#     broker's cluster-DNS name) and runs ONLY on a main push / an on-main workflow_dispatch
#     (verify-provider.yml). Downloads `build`'s pact artifact rather than regenerating it —
#     a missing/failed download FAILS the job (no silent skip): see the download step.
#     Runs the `providerPactTest` Gradle task when the module exposes one
#     (build-logic/src/main/kotlin/openbank.quarkus-service.gradle.kts) — a source set/task
#     independent of `test`, so invoking it never forces `test` to re-run. Consumer-only and
#     non-service modules still publish their consumer contracts, but correctly skip provider
#     verification rather than failing on a task they do not own.
name: _service-ci

on:
  workflow_call:
    inputs:
      service:
        description: "Service directory, e.g. openbank-ledger-service"
        required: true
        type: string
      ref:
        # #3306: a provider verification is published against the sha the build ran on
        # (-Dpact.provider.version below), and a dispatch runs on the tip of main. On a repo
        # merging this often the tip is almost never the sha a counterpart has DEPLOYED, so
        # can-i-deploy asks about a version no verification will ever target. Passing the
        # deployed sha here makes the verification land where the gate looks. Empty keeps the
        # previous behaviour exactly: check out whatever ref triggered the run.
        description: "Commit to check out and publish the verification against. Blank = the triggering ref."
        required: false
        default: ""
        type: string
      provider_version:
        # Blank preserves the ordinary claim: the verification is published for exactly the
        # checked-out ref. A distinct value is accepted only by the proof step below.
        description: "Provider version to publish. Blank = checked-out ref."
        required: false
        default: ""
        type: string
      require_provider_pact_test:
        # A targeted historical provider re-verification has a different contract from an
        # ordinary fleet build: success must mean a provider result was actually published.
        # Leave ordinary consumer-only/service-less modules unaffected.
        description: "Fail when this targeted verification has no providerPactTest."
        required: false
        default: false
        type: boolean
    outputs:
      platform_results:
        description: "Typed platform job results; callers strictly validate the result-only schema."
        value: ${{ toJSON(jobs) }}
    secrets:
      PACT_BROKER_PASSWORD:
        # Must be declared here for the caller to pass it explicitly: an undeclared
        # secret in the caller's `secrets:` map is a workflow-file error. Optional so
        # the workflow still loads where the secret is unset (forks) — the pact steps
        # already gate on pactbroker.url / an empty password.
        description: "Pact Broker password (ADR-0092) — publishing pacts + verification results."
        required: false

permissions:
  contents: read

jobs:
  # ── build: compile, test, quarkusBuild, consumer-pact generation ────────────────────────
  # Hosted, every event (PR, push, schedule, workflow_dispatch) — free/unlimited on this
  # public repo (ADR-0250). Never touches the Pact Broker: PACT_BROKER_URL is not set here
  # at all, so the @PactBroker-annotated provider-verification classes stay
  # @EnabledIfSystemProperty-skipped (identical to the pre-existing PR-lane behaviour) and
  # the git-pact (@PactFolder) classes run unconditionally, same as before.
  build:
    name: ${{ inputs.service }} (build)
    # The main-only context pilot produces the exact native platform used by deployment.
    runs-on: ${{ inputs.service == 'openbank-context-service' && github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ref == '' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    # This job executes pull-request code.  Keep the OIDC token unavailable even though the
    # trusted contract job below needs it for the private ECR pull-through cache.
    permissions:
      contents: read
      actions: read  # optional class-order hints from trusted main evidence
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      # Force a UTF-8 locale so the JVM's sun.jnu.encoding (the *filename* charset,
      # derived from the OS locale at startup — NOT from -Dfile.encoding) is UTF-8.
      # Kotlin test names with non-ASCII chars (e.g. a Czech '—' em-dash) otherwise produce
      # an unmappable .class path -> InvalidPathException -> compileTestKotlin internal
      # compiler error.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A historical provider ref may predate the retry helpers used by this workflow.
          # Stage the helpers from the trusted triggering SHA before switching to that ref.
          ref: ${{ inputs.ref != '' && github.sha || '' }}
          fetch-depth: ${{ inputs.ref == '' && 1 || 0 }}

      - name: Stage trusted service CI step helpers
        run: |
          set -euo pipefail
          helper_dir="$(mktemp -d "${RUNNER_TEMP}/service-ci-helpers.XXXXXX")"
          cp .github/scripts/service-ci-steps/*.sh "$helper_dir/"
          cp .github/scripts/heal-gradle-verification-failure.sh "$helper_dir/"
          chmod 600 "$helper_dir/"*.sh
          bash "$helper_dir/diagnostic-actions.sh" stage "$helper_dir"
          echo "SERVICE_CI_HELPERS=$helper_dir" >> "$GITHUB_ENV"

      - name: Stage trusted build retry helpers
        if: inputs.ref != ''
        run: |
          set -euo pipefail
          for helper in retry-testcontainers-ebusy.sh retry-gradle-verification-cache.sh heal-gradle-verification-failure.sh; do
            cp ".github/scripts/${helper}" "${RUNNER_TEMP}/${helper}"
          done

      - name: Check out historical service source with trusted helpers
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          bash .github/scripts/tests/test-resolve-historical-service-ref.sh
          git fetch --quiet origin main
          resolved_ref="$(bash .github/scripts/resolve-historical-service-ref.sh "$REF")"
          git merge-base --is-ancestor "$resolved_ref" origin/main || {
            echo '::error::Historical provider ref is not on main.'
            exit 1
          }
          git checkout --detach --quiet "$resolved_ref"
          for helper in retry-testcontainers-ebusy.sh retry-gradle-verification-cache.sh heal-gradle-verification-failure.sh; do
            cp "${RUNNER_TEMP}/${helper}" ".github/scripts/${helper}"
          done
          bash "$SERVICE_CI_HELPERS/diagnostic-actions.sh" restore "$SERVICE_CI_HELPERS"

      # Resolve GRADLE_USER_HOME. This job is ALWAYS `runner.environment == 'github-hosted'`
      # now (never self-hosted), so it always takes the default-home branch below — restoring
      # the warm cache fleet-lint keeps on main via setup-gradle's cross-job cache restore.
      # NOTE: env context is NOT available in job-level env: blocks of reusable workflows
      # (workflow_call) — GitHub rejects "Unrecognized named-value: 'env'" at parse time —
      # so this is resolved in a step where env IS available, same as the original single job.
      - name: Resolve GRADLE_USER_HOME
        run: echo "GRADLE_USER_HOME=${HOME}/.gradle" >> "$GITHUB_ENV"

      - name: Normalize DOCKER_HOST for Testcontainers (#873)
        run: |
          if [ -z "${DOCKER_HOST:-}" ] || [ "${DOCKER_HOST:-}" = "tcp://localhost:2375" ]; then
            echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
            echo "normalized DOCKER_HOST -> unix:///var/run/docker.sock"
          else
            echo "DOCKER_HOST left as: ${DOCKER_HOST}"
          fi

      # Raise fs.aio-max-nr so parallel Testcontainers don't exhaust the kernel's default
      # 65536 AIO pool (Redpanda/Seastar + Quarkus reactive). Advisory, best-effort; a
      # GitHub-hosted runner is an isolated VM so this is safe to attempt unconditionally.
      - name: Raise fs.aio-max-nr for Testcontainers (best-effort, Linux)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          cur=$(cat /proc/sys/fs/aio-max-nr 2>/dev/null || echo 0)
          if [ "${cur:-0}" -lt 1048576 ]; then
            if sudo -n sysctl -w fs.aio-max-nr=1048576 >/dev/null 2>&1; then
              echo "raised fs.aio-max-nr: ${cur} -> 1048576"
            else
              echo "::warning::could not raise fs.aio-max-nr (currently ${cur}); parallel Testcontainers may exhaust the AIO pool on this runner (no passwordless sudo?)"
            fi
          else
            echo "fs.aio-max-nr already ${cur} (>= 1048576)"
          fi

      # Most modules pin kotlin { jvmToolchain(25) }; a few use 21. Installing both
      # lets Gradle's toolchain resolution pick the right one with zero Foojay
      # downloads at build time (faster, fewer billed minutes).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # This job is always GitHub-hosted now — the Actions cache is network-internal
          # and free there, and there is no in-cluster remote build cache to fall back on
          # (that cache is only reachable from ARC pods, see the `contract` job below).
          cache-disabled: false
          # RESTORE the warm cache fleet-lint keeps on main, but never WRITE — writing 40+
          # per-service home caches on PR branches would churn the Actions cache quota.
          cache-read-only: true
          gradle-home-cache-strict-match: false

      # No `-Dpactbroker.*` flags here at all (unlike the pre-split single job): this job
      # never has a broker URL to forward, so the @PactBroker-gated provider-verification
      # test stays skipped and there is no #1009-style cache-key hazard to guard against —
      # `test` here has ONE stable set of inputs regardless of which event triggered it.
      # -Dquarkus.smallrye-openapi.store-schema-directory writes the document Quarkus
      # actually serves, as a side effect of the SAME quarkusBuild task this :build already
      # runs. Read by the openapi-request-schema-conformance step below.
      #
      # The path is RELATIVE TO THE SUBPROJECT, not to the repo root. Passing
      # "<svc>/build/openapi-generated" therefore wrote to <svc>/<svc>/build/..., the step
      # below found nothing at the path it was given, and — because a missing document is
      # "Not a finding" there — the gate reported clean for six weeks having compared zero
      # schemas. Measured 2026-09-05 by running the same command locally:
      #   openbank-interest-service/openbank-interest-service/build/openapi-generated/openapi.yaml
      # With the path corrected, that one service alone yields "2 request schema(s) compared,
      # 21 finding(s)". Keep this relative to the subproject.
      - name: Prepare optional context test ordering
        if: inputs.service == 'openbank-context-service' && inputs.ref == ''
        timeout-minutes: 1
        continue-on-error: true  # history is optional; a failed fetch keeps the full default suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/prepare-test-priority.py \
            --repo "$GITHUB_REPOSITORY" --component openbank-context-service \
            --out "$RUNNER_TEMP/context-test-priority.json"
          echo "OPENBANK_TEST_PRIORITY_FILE=$RUNNER_TEMP/context-test-priority.json" >> "$GITHUB_ENV"

      - name: Build + test (:${{ inputs.service }})
        env:
          SERVICE: ${{ inputs.service }}
          DEPLOY_ARTIFACT_PILOT: ${{ inputs.service == 'openbank-context-service' && github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ref == '' }}
        run: bash -e "$SERVICE_CI_HELPERS/build-test.sh"

      # Keep advisory diagnostics in runner-loaded local actions instead of repeating
      # their step definitions in every reusable workflow expansion.
      - name: Retain Gradle task profile
        if: always() && (inputs.service == 'openbank-lending-service' || inputs.service == 'openbank-pension-service')
        continue-on-error: true
        uses: ./.github/actions/service-ci-gradle-profile
        env:
          SERVICE: ${{ inputs.service }}

      - name: Package verified context deployment build
        id: deploy_bundle
        # Optional cache production runs AFTER the mandatory build/test/SBOM task graph.
        # A failure here cannot hide a build failure; the consumer performs its normal build.
        continue-on-error: true
        if: inputs.service == 'openbank-context-service' && github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ref == ''
        env:
          ANALYTICS_SINK_TYPE: clickhouse
          AGENT_SVID_NONCE_STORE: redis
        run: |
          python3 .github/scripts/service-build-artifact.py pack \
            --service openbank-context-service --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/deploy-build"

      - name: Retain verified context deployment build
        if: steps.deploy_bundle.outcome == 'success'
        continue-on-error: true  # upload availability is not a correctness gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-build-openbank-context-service-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-build/deploy-build.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # A Docker Hub pull failure surfaces as NAMED TEST FAILURES, ~900 lines above the actual
      # cause, so the reader goes hunting for a test bug that is not there. Diagnostic only:
      # it reads JUnit XML already on disk, always exits 0, and can never change the verdict.
      - name: "Explain a Docker registry pull failure (diagnostic)"
        if: failure()
        run: |
          python3 .github/scripts/check-testcontainers-registry-failure.py \
            --service "${{ inputs.service }}"

      # rules.yaml: openapi_request_schema_conformance (enforced).
      - name: "openapi request-schema conformance"
        run: |
          SPEC="${{ inputs.service }}/src/main/resources/openapi.yaml"
          if [ ! -f "$SPEC" ]; then
            echo "openapi-request-schema-conformance: ${{ inputs.service }} has no openapi.yaml — skipping."
            exit 0
          fi
          python3 .github/scripts/check-openapi-request-schema-conformance.py \
            --service "${{ inputs.service }}" \
            --generated "${{ inputs.service }}/build/openapi-generated/openapi.yaml" \
            --enforce

      # Coverage upload is tokenless for this public repository. It is advisory only —
      # never gates the build — and deliberately must not regain an OIDC token in this
      # untrusted PR-code execution job.
      # koverVerify stays the enforcement mechanism (ratchet-only, rules.yaml).
      #
      # Consume the enforcing build's coverage, never produce a second test run here.
      # Different invocation properties can invalidate `test` and overwrite the verified
      # test.ic before this advisory report, even when both Gradle invocations succeed.
      - name: Generate Kover XML report
        id: coverage_report
        continue-on-error: true
        # This is advisory evidence, never a second mandatory build. Keep it daemonless
        # and bounded so a Gradle/Kover process cannot retain the raw coverage file or
        # hold a fleet runner after the enforcing build has already completed (#6734).
        # Account's real Testcontainers suite needs more than the old three-minute limit:
        # preserve its money-path coverage proof while retaining a firm ten-minute ceiling.
        # Test execution belongs to the enforcing build above; this step only renders it.
        env:
          SERVICE: ${{ inputs.service }}
        run: timeout --kill-after=10s 600s bash -e "$SERVICE_CI_HELPERS/render-coverage-report.sh"

      # The envelope is built even after a failing suite. A missing envelope is not a
      # passing zero: the projection renders it as absent evidence. The collector only
      # reads JUnit/Kover counts and the secret-free shared Testcontainers lifecycle log.
      - name: Retain coverage and Test Intelligence evidence
        if: always()
        continue-on-error: true
        uses: ./.github/actions/service-ci-coverage-evidence
        env:
          SERVICE: ${{ inputs.service }}
          SERVICE_CI_JOB_STATUS: ${{ job.status }}
          SERVICE_CI_REPORT_OUTCOME: ${{ steps.coverage_report.outcome }}

      # Consumer pacts this service just (re)generated (pact.rootDir -> repo /pacts, ADR-0063)
      # are handed to the `contract` job as an artifact rather than regenerated there — the
      # `contract` job runs on a DIFFERENT runner pool and re-running `test` there is exactly
      # the redundant work ADR-0250 Phase 2 removes. Always upload something (even zero pact
      # files, the common case for a pure provider or a service with no consumer contracts) so
      # a MISSING artifact on the `contract` side unambiguously means this job never ran or
      # never reached this step — never "this service has no consumer pacts", which is instead
      # expressed by an empty `pact-count` in the manifest (see the download step).
      - name: Collect consumer pacts for hand-off to the contract job
        run: |
          set -euo pipefail
          mkdir -p pact-handoff
          shopt -s nullglob
          files=(pacts/${{ inputs.service }}-*.json)
          for f in "${files[@]}"; do cp "$f" pact-handoff/; done
          echo "pact-count=${#files[@]}" > pact-handoff/manifest.txt
          echo "Collected ${#files[@]} consumer pact file(s) for hand-off."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-pacts-${{ inputs.service }}
          path: pact-handoff/
          # `manifest.txt` is always written above, so an empty consumer-pact set still
          # produces a non-empty artifact — "if-no-files-found" only fires if the whole
          # collection step never ran, which should already have failed the job outright.
          # NOT named `.manifest`: actions/upload-artifact defaults to
          # include-hidden-files: false, so a dotfile-only directory silently uploads as
          # empty and if-no-files-found fires anyway, even though the step above ran fine.
          if-no-files-found: error
          retention-days: 3

      # Only on failure: a passing build's test reports are never looked at, but uploading
      # them on EVERY service build was a dominant driver of GitHub Actions artifact-storage
      # churn — bursts during a full-fleet rebuild hit the quota and failed unrelated uploads.
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # `-a${{ github.run_attempt }}` is not cosmetic — an artifact name must be unique
          # WITHIN A RUN, and re-running a failed job is a new attempt of the SAME run.
          name: test-reports-${{ inputs.service }}-a${{ github.run_attempt }}
          path: ${{ inputs.service }}/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      # A flake cannot be counted from run CONCLUSIONS alone (a re-run flips it away from
      # `failure`), so retain the JUnit XML per ATTEMPT — a flake becomes a diffable artifact
      # pair instead of something that has to be noticed and reported at re-run time (#4878).
      - name: Upload quality evidence (every run)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence-${{ inputs.service }}-a${{ github.run_attempt }}
          path: |
            ${{ inputs.service }}/build/test-results/**/*.xml
            ${{ steps.coverage_report.outcome == 'success' && format('{0}/build/reports/kover/report.xml', inputs.service) || '' }}
          if-no-files-found: ignore
          retention-days: 7

      # Compatibility projection for the image build: the latest envelope remains
      # separate from immutable attempts above, so a re-run cannot erase history.
      # A failed advisory collector may still leave JUnit/Kover files. Uploading those
      # under the compatibility name makes the deploy select an incomplete newest
      # artifact and fail even when an older complete main artifact exists (#11850).
      - name: Check Test Intelligence compatibility evidence
        id: test-intelligence-compatibility
        if: always()
        env:
          SERVICE: ${{ inputs.service }}
          EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if python3 .github/scripts/check-test-intelligence-compatibility.py \
            "${SERVICE}/build/test-intelligence/run.json" \
            --component "${SERVICE}" \
            --commit "${GITHUB_SHA}" \
            --branch "${EXPECTED_BRANCH}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}"; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Skipping incomplete Test Intelligence compatibility artifact"
          fi

      - name: Upload Test Intelligence evidence
        if: always() && steps.test-intelligence-compatibility.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-intelligence-${{ inputs.service }}
          path: |
            ${{ inputs.service }}/build/test-intelligence/run.json
            ${{ inputs.service }}/build/test-results/**/*.xml
            ${{ steps.coverage_report.outcome == 'success' && format('{0}/build/reports/kover/report.xml', inputs.service) || '' }}
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # ── publish-evidence: commit-addressed Test Intelligence store (#13201) ─────────────────
  # admin-ui reads each component's evidence for the commit it is RUNNING from
  # `<store>/<component>/<sha8>/test-intelligence.json`. This job publishes that object from
  # the run envelope `build` just retained. Main pushes only — a dispatch may build a
  # historical ref whose envelope is not about GITHUB_SHA, and a PR's commit is never
  # deployed. It observes the build and must never gate it (#6614): job-level
  # continue-on-error, and nothing `needs` it. Write-once: the bucket refuses any PUT that
  # is not `If-None-Match: *`, so a re-run answers 412 and the first publication stands.
  publish-evidence:
    name: ${{ inputs.service }} (publish test evidence)
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ref == ''
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            openbank-admin-ui/scripts/publish-test-evidence.mjs
            openbank-admin-ui/src/lib/test-intelligence-run-projection.mjs
            .github/scripts/publish-test-evidence.sh
            openbank-libs/governance/rules.yaml
            ${{ inputs.service }}/version.txt
          sparse-checkout-cone-mode: false

      - name: Download this run's Test Intelligence envelope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-intelligence-run-${{ inputs.service }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence

      - name: Assume the evidence-writer role (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-sandbox-test-evidence-writer
          aws-region: eu-north-1

      # Same upload path as test-evidence-reconcile.yml: the tests ran on GITHUB_SHA itself.
      - name: Publish write-once
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          bash .github/scripts/publish-test-evidence.sh "${SERVICE}" "${GITHUB_SHA}" "${GITHUB_SHA}" \
            identical "${RUNNER_TEMP}/evidence/run.json"

  # ── contract: Pact provider verification + consumer-pact publishing ─────────────────────
  # In-cluster ARC pool only (the Pact Broker has no public ingress, ADR-0056) and only on the
  # events that must publish a verification result: a push to main (the SHA auto-deploy gates
  # on) or an on-main workflow_dispatch (verify-provider.yml / the reconciler, #2039) —
  # deliberately the SAME combined condition the pre-split single job used for its
  # runs-on/PACT_BROKER_URL gating (see its "KEEP THIS EXPRESSION IN LOCKSTEP" comments),
  # carried over verbatim so verify-provider.yml's single-provider re-verify dispatch keeps
  # working exactly as before.
  contract:
    name: ${{ inputs.service }} (contract)
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: openbank-build
    timeout-minutes: 45
    # Only this post-merge, trusted runner receives an OIDC token for its ECR cache access.
    permissions:
      contents: read
      id-token: write
    env:
      # Pact Broker (ADR-0092). The broker has no public ingress (ADR-0056); the
      # in-cluster ARC runner reaches it over cluster DNS.
      PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
      PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Shared remote Gradle build cache (ADR-0043): injected by arc-runners.tf via the pod
      # env. Deliberately NOT re-declared from `${{ vars.* }}` here — see the original
      # single-job file's long-form comment (git history) for why that would blank it.
    steps:
      # P predates the proof runner. Before replacing the workspace with P, save the runner
      # from this workflow's trusted checkout outside the workspace; F is never checked out
      # for code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.provider_version != ''
        with:
          ref: ${{ github.sha }}
          path: provider-proof-source
          fetch-depth: 1

      - name: Save trusted provider proof runner outside the P workspace
        if: inputs.provider_version != ''
        run: |
          set -euo pipefail
          cp provider-proof-source/.github/scripts/prove-pact-provider-version.sh \
            "$RUNNER_TEMP/prove-pact-provider-version.sh"
          # The equivalence proof the runner calls must be the trusted one too: P's own copy may
          # predate --own-test-overlay, and P must never get to judge its own equivalence.
          cp provider-proof-source/.github/scripts/pact-version-tree-equivalent.sh \
            "$RUNNER_TEMP/pact-version-tree-equivalent.sh"
          chmod 700 "$RUNNER_TEMP/prove-pact-provider-version.sh" "$RUNNER_TEMP/pact-version-tree-equivalent.sh"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Start from the workflow's trusted main checkout.  `actions/checkout` resolves a
          # workflow-dispatch input as a branch/tag lookup before it resolves an arbitrary
          # historical SHA, which makes the documented `verify-provider --ref <deployed-sha>`
          # recovery path fail before our on-main ancestry gate can run.  A subsequent explicit
          # `git checkout --detach` resolves that already-fetched commit after proving it is on
          # main; blank inputs retain the triggering SHA exactly as before.
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.ref == '' && inputs.provider_version == '' && 1 || 0 }}

      - name: Stage trusted service CI step helpers
        run: |
          set -euo pipefail
          helper_dir="$(mktemp -d "${RUNNER_TEMP}/service-ci-helpers.XXXXXX")"
          cp .github/scripts/service-ci-steps/*.sh "$helper_dir/"
          cp .github/scripts/heal-gradle-verification-failure.sh "$helper_dir/"
          chmod 600 "$helper_dir/"*.sh
          echo "SERVICE_CI_HELPERS=$helper_dir" >> "$GITHUB_ENV"

      - name: Stage trusted Pact Broker retry helper
        run: |
          set -euo pipefail
          cp .github/scripts/pact-broker-post.sh "$RUNNER_TEMP/pact-broker-post.sh"
          cp .github/scripts/service-ci-provider-task-list.sh "$RUNNER_TEMP/service-ci-provider-task-list.sh"
          cp .github/scripts/service-ci-discover-provider-pact-task.sh "$RUNNER_TEMP/service-ci-discover-provider-pact-task.sh"
          chmod 700 "$RUNNER_TEMP/pact-broker-post.sh" \
            "$RUNNER_TEMP/service-ci-provider-task-list.sh" \
            "$RUNNER_TEMP/service-ci-discover-provider-pact-task.sh"
          bash "$RUNNER_TEMP/pact-broker-post.sh" --self-test
          cp .github/scripts/resolve-historical-service-ref.sh \
            "$RUNNER_TEMP/resolve-historical-service-ref.sh"
          chmod 700 "$RUNNER_TEMP/resolve-historical-service-ref.sh"
          bash .github/scripts/tests/test-resolve-historical-service-ref.sh

      - name: Check out a requested provider version only after proving it is on main
        if: inputs.ref != '' || inputs.provider_version != ''
        env:
          REF: ${{ inputs.provider_version != '' && inputs.provider_version || inputs.ref }}
        run: bash -e "$SERVICE_CI_HELPERS/checkout-provider-ref.sh"

      - name: Check out P and overlay the provider test tree from F (equivalence-proven)
        env:
          SERVICE: ${{ inputs.service }}
          REQUESTED_FIXTURE_REF: ${{ inputs.ref }}
          REQUESTED_PROVIDER_VERSION: ${{ inputs.provider_version }}
        run: bash -e "$SERVICE_CI_HELPERS/prepare-provider-overlay.sh"

      # Resolve GRADLE_USER_HOME. This job is ALWAYS self-hosted now, so it always takes the
      # per-service isolated-home branch — one job's `gradle --stop` post-action can't kill a
      # sibling job's daemon on the shared persistent registry (the documented "1-of-28-fails
      # / daemon disappeared" incident).
      - name: Resolve GRADLE_USER_HOME
        run: |
          if [ -n "${GRADLE_USER_HOME_NODE_CACHE:-}" ]; then
            echo "GRADLE_USER_HOME=${GRADLE_USER_HOME_NODE_CACHE}/${{ inputs.service }}" >> "$GITHUB_ENV"
          else
            echo "GRADLE_USER_HOME=${{ github.workspace }}/../../.gradle-svc/${{ inputs.service }}" >> "$GITHUB_ENV"
          fi

      - name: Normalize DOCKER_HOST for Testcontainers (#873)
        run: |
          if [ -z "${DOCKER_HOST:-}" ] || [ "${DOCKER_HOST:-}" = "tcp://localhost:2375" ]; then
            echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
            echo "normalized DOCKER_HOST -> unix:///var/run/docker.sock"
          else
            echo "DOCKER_HOST left as: ${DOCKER_HOST}"
          fi

      - name: Raise fs.aio-max-nr for Testcontainers (best-effort, Linux)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          cur=$(cat /proc/sys/fs/aio-max-nr 2>/dev/null || echo 0)
          if [ "${cur:-0}" -lt 1048576 ]; then
            if sudo -n sysctl -w fs.aio-max-nr=1048576 >/dev/null 2>&1; then
              echo "raised fs.aio-max-nr: ${cur} -> 1048576"
            else
              echo "::warning::could not raise fs.aio-max-nr (currently ${cur}); parallel Testcontainers may exhaust the AIO pool on this runner (no passwordless sudo?)"
            fi
          else
            echo "fs.aio-max-nr already ${cur} (>= 1048576)"
          fi

      # FinOps: pre-warm Testcontainers images from ECR pull-through cache (PR #1393).
      - name: Authenticate to ECR via OIDC
        id: ecr_auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1
      - name: Login to Amazon ECR
        id: ecr_login
        if: ${{ steps.ecr_auth.outcome == 'success' }}
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Pre-warm Testcontainers image cache via ECR
        continue-on-error: true
        env:
          ECR: "265175468565.dkr.ecr.eu-north-1.amazonaws.com"
          ECR_LOGIN_OUTCOME: ${{ steps.ecr_login.outcome }}
        run: bash -e "$SERVICE_CI_HELPERS/prewarm-images.sh"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Probe Reposilite in-cluster Maven mirror
        run: |
          if curl -sf --connect-timeout 2 \
              http://reposilite.reposilite.svc.cluster.local:8080/api/status \
              > /dev/null 2>&1; then
            echo "REPOSILITE_MIRROR_URL=http://reposilite.reposilite.svc.cluster.local:8080" \
              >> "$GITHUB_ENV"
            echo "::notice title=Reposilite active::in-cluster Maven mirror responding — deps resolved from cluster (zero NAT)"
          else
            echo "::notice title=Reposilite unavailable::falling back to GCS mirror + CodeArtifact"
          fi

      - name: Configure CodeArtifact Maven mirror
        continue-on-error: true
        run: bash -e "$SERVICE_CI_HELPERS/configure-maven-mirror.sh"

        env:
          AWS_DEFAULT_REGION: eu-north-1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Self-hosted: disable the GitHub Actions cache for Gradle home (FinOps — see the
          # original single-job file's history for the NAT-cost analysis) and rely on the
          # in-cluster remote build cache (GRADLE_REMOTE_CACHE_URL, arc-runners.tf) instead.
          cache-disabled: true
          gradle-home-cache-strict-match: false

      # ORDER IS LOAD-BEARING: this runs AFTER setup-gradle, never before it.
      #
      # setup-gradle refuses to touch a Gradle User Home that already exists ("Gradle User
      # Home already exists: will not restore from cache" / "Caching was skipped"). This step
      # invokes ./gradlew, which CREATES that home -- so while it ran first it silently
      # disabled the very restore the default-home choice above exists to enable, and then
      # did the same work by hand, slower. Measured 2026-08-22 on 3 of 3 sampled PR builds:
      # the warm step took 120s and setup-gradle took 2s doing nothing, against 9s for the
      # identical restore in fleet-lint on the same runner class (nine entries, including an
      # 832 MB gradle-dependencies-v2 written from main). Build-cache hit rate in those
      # builds was ~2%: "52 actionable tasks: 45 executed, 1 from cache, 6 up-to-date".
      #
      # Nothing about the heal contract changes by moving it. The corrupted entry it guards
      # against can arrive in the RESTORED cache just as easily as in a persistent home, and
      # healing it here still keeps the retry out of "Build + test" -- which must run exactly
      # once, because it re-runs `test` differently depending on PUBLISH_RESULTS (the #1009
      # Pact-publish hazard). It is now healing a warm cache instead of populating a cold one.
      - name: Warm Gradle dependency cache (self-heal corrupted entries)
        continue-on-error: true
        env:
          SERVICE: ${{ inputs.service }}
        run: bash -e "$SERVICE_CI_HELPERS/warm-gradle-cache.sh"

      # Artifact hand-off from `build` MUST fail loud (issue #4414 acceptance criterion): a
      # missing or failed download means either `build` failed before uploading (in which case
      # this job would not even be scheduled — `needs: build` implies success) or the artifact
      # expired/was misnamed, and either way publishing a verification without knowing this
      # service's actual consumer-pact set would be silently wrong. No continue-on-error, no
      # if: always() — a failure here fails the job.
      - name: Download build's consumer-pact artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consumer-pacts-${{ inputs.service }}
          path: pact-handoff

      - name: Stage handed-off consumer pacts into pacts/
        run: |
          set -euo pipefail
          if [ ! -f pact-handoff/manifest.txt ]; then
            echo "::error::pact hand-off artifact from the build job has no manifest.txt — treating this as a failed hand-off, not an empty consumer-pact set (the build job always writes one)."
            exit 1
          fi
          cat pact-handoff/manifest.txt
          mkdir -p pacts
          shopt -s nullglob
          files=(pact-handoff/*.json)
          # bash 3.2 (macOS runners) treats an EMPTY array as unbound under `set -u`; the
          # ${files[@]+...} form expands to nothing instead of aborting (consumer-less services).
          for f in ${files[@]+"${files[@]}"}; do cp "$f" pacts/; done
          echo "Staged ${#files[@]} consumer pact file(s) from the build job's hand-off."

      # Publish this service's CONSUMER pacts to the broker (ADR-0092). Reads the files staged
      # from the build job's hand-off above (regenerated there, not here — re-running `test`
      # on this pool is exactly the redundant work this split removes), keyed by git SHA +
      # branch via the /contracts/publish API. curl (not the pact-cli docker image): the
      # runner pod resolves the broker's cluster DNS, a dind container would not.
      - name: Publish consumer pacts to broker
        if: ${{ env.PACT_BROKER_URL != '' }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SERVICE: ${{ inputs.service }}
        run: bash -e "$SERVICE_CI_HELPERS/publish-consumer-pacts.sh"

      # A full-fleet run discovers every Gradle module, including consumer-only modules such as
      # analytics-sink that intentionally do not apply openbank.quarkus-service and therefore
      # do not own providerPactTest. Discover the task after a successful Gradle configuration:
      # this keeps publishing their consumer Pact, while an actual provider test without the
      # task remains a loud configuration failure rather than a silent verification skip.
      - name: Discover provider Pact task
        id: provider_pact_task
        env:
          SERVICE: ${{ inputs.service }}
          REQUIRE_PROVIDER_PACT_TEST: ${{ inputs.require_provider_pact_test }}
        run: bash -e "$SERVICE_CI_HELPERS/discover-provider-task.sh"

      # Preflight the broker's selector/HAL response BEFORE pact-jvm touches it (#7376). The
      # broker-backed provider test resolves consumer selectors via
      # PactBrokerClient.fetchConsumersWithSelectorsV2 -> HalClient.handleResponseBody, and an
      # invalid/malformed response there throws a bare NullPointerException deep inside pact-jvm
      # with no HTTP status, no body, and no indication it was even the network's fault — it
      # reads exactly like a code regression in the provider under test, and the committed
      # @PactFolder replay (which never talks to the broker) is unaffected, so this diagnostic
      # exists to tell the two apart at a glance. Secret-free by construction: only structural
      # facts (HTTP status, Content-Type, whether the body parses as JSON, whether the expected
      # HAL keys are present) are ever echoed — never the response body or the pact content.
      - name: "Preflight Pact Broker selector/HAL response"
        if: ${{ steps.provider_pact_task.outputs.available == 'true' && env.PACT_BROKER_URL != '' }}
        env:
          SERVICE: ${{ inputs.service }}
        run: bash -e "$SERVICE_CI_HELPERS/preflight-pact-broker.sh"

      # ADR-0250 Phase 2: provider verification runs as its OWN Test task (providerPactTest,
      # build-logic/src/main/kotlin/openbank.quarkus-service.gradle.kts), not `test`. The task
      # itself is never up-to-date or cacheable: publishing a verification result is a network
      # side effect that Gradle cannot observe. Its compile/model prerequisites remain cacheable.
      - name: Provider verification (:${{ inputs.service }}:providerPactTest)
        if: ${{ steps.provider_pact_task.outputs.available == 'true' }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ./gradlew :${{ inputs.service }}:providerPactTest --build-cache \
            --console=plain --stacktrace \
            -Dpactbroker.url="${PACT_BROKER_URL:-}" \
            -Dpactbroker.auth.username="${PACT_BROKER_USERNAME:-}" \
            -Dpactbroker.auth.password="${PACT_BROKER_PASSWORD:-}" \
            -Dpactbroker.enablePending=true \
            -Dpactbroker.providerBranch="${BRANCH}" \
            -Dpact.verifier.publishResults=true \
            -Dpact.provider.version="${PACT_PROVIDER_VERSION}" \
            -Dpact.provider.branch="${BRANCH}" \
            -Dpact.provider.tag="${BRANCH}"

      - name: "Explain a Docker registry pull failure (diagnostic)"
        if: failure()
        run: |
          python3 .github/scripts/check-testcontainers-registry-failure.py \
            --service "${{ inputs.service }}"

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-test-reports-${{ inputs.service }}-a${{ github.run_attempt }}
          path: ${{ inputs.service }}/build/reports/tests/providerPactTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit XML (every run — flake accounting)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-junit-xml-${{ inputs.service }}-a${{ github.run_attempt }}
          path: ${{ inputs.service }}/build/test-results/providerPactTest/**/*.xml
          if-no-files-found: ignore
          retention-days: 3
