name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JVM / Kotlin / Gradle builds moved to services-ci.yml, which builds every
  # Gradle module as its own path-scoped matrix job (per-service status checks +
  # fewer billed minutes). This workflow keeps the non-JVM checks below.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Admin UI — path-scoped: only runs when openbank-admin-ui/** changes.
  # On push to main (post-merge) always rebuilds to keep the sandbox image current.
  # A separate gate job ("Admin UI") always runs and fails only when the build
  # itself failed — so branch-protection never blocks a backend-only PR.
  # ---------------------------------------------------------------------------
  changes-ui:
    name: Detect UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Post-merge main build always includes admin-ui.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            BASE="origin/${{ github.base_ref }}"
            # Force the remote-tracking ref to the true tip (persistent self-hosted
            # runners reuse the workdir, so the cached ref can be stale).
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --no-tags
            N=$(git diff --name-only "${BASE}...HEAD" -- openbank-admin-ui/ | wc -l | tr -d ' ')
            echo "changed=$( [ "$N" -gt 0 ] && echo 'true' || echo 'false' )" >> "$GITHUB_OUTPUT"
            echo "Admin UI files changed: $N"
          fi

  ui-build:
    name: Admin UI build
    needs: changes-ui
    if: needs.changes-ui.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: openbank-admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: openbank-admin-ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # ADR-0071 Phase 4: manifest.ts must stay types-only — no hand-edited versions
      # or inline data. Enforced (hard failure). Runs from repo root so the script
      # can resolve the relative path to manifest.ts.
      - name: manifest.ts types-only gate (ADR-0071 Phase 4, enforced)
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-manifest-types-only.sh

      # ADR-0071: the governance manifest is code-derived from per-service
      # governance.yaml. Regenerate and fail on any module missing/with an invalid
      # governance.yaml. Phase 4: flipped from advisory (::warning::) to enforce
      # (exit 1) — the fleet completed the governance.yaml sweep in phases 1-3.
      - name: Governance manifest gate (ADR-0071, enforced)
        working-directory: openbank-admin-ui
        run: |
          # The generator compiles openbank-libs/governance/governance.schema.json with ajv
          # and validates every governance.yaml against it, so a schema violation (wrong type,
          # unknown key, malformed lineage node) is just another entry in `gaps` and needs no
          # separate step here. The schema was advisory — cited in a comment, hand-mirrored in
          # the generator — until the two drifted and 4 services shipped a null `lineage:` key.
          node scripts/generate-governance.mjs
          GAPS=$(node -e "console.log(require('./governance.json').totals.withGaps)")
          if [ "$GAPS" -gt 0 ]; then
            echo "::error::Governance drift — $GAPS module(s) missing or with an invalid governance.yaml (ADR-0071 Phase 4). Add a governance.yaml to each flagged service."
            # Reads governance.json's real shape: a top-level `gaps` string array
            # (issue #2165 — this used to read a `.modules` field that never existed,
            # so it threw a TypeError on every failure and never named a module).
            # No `?? []` fallback on purpose: a missing array is a generator bug and
            # must be loud, not silently reported as "no gaps".
            node -e "const g=require('./governance.json'); if(!Array.isArray(g.gaps)){console.error('::error::governance.json has no gaps array — generate-governance.mjs is broken');process.exit(2)} for(const x of g.gaps) console.log('  gap: '+x)"
            exit 1
          else
            echo "Governance manifest clean: $(node -e "console.log(require('./governance.json').totals.modules)") modules, 0 gaps."
          fi

      - name: Test (unit + integration)
        run: npm run test
        # ADR-0076 Phase 0+1: guard tests, BFF route integration tests, docs-route,
        # health-route integration tests all run here via Vitest.

      - name: Install Playwright browsers
        # Download the Chromium binary (always works, no root required).
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # On Linux, Chromium needs OS-level libs (libnspr4, libnss3, etc.).
        # This requires sudo / root; self-hosted runners may not have it yet.
        # Linux-only: install-deps is a no-op on macOS, and on a self-hosted Mac
        # runner `sudo` without NOPASSWD hangs on the password prompt until the
        # JOB timeout kills the run (continue-on-error can't catch a job timeout).
        # The step timeout is the belt-and-braces for an unprepared Linux runner —
        # the E2E step still skips gracefully if deps are absent (see below).
        # When the runner is eventually set up with NOPASSWD sudo, remove the flag.
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium
        timeout-minutes: 5
        continue-on-error: true

      - name: E2E tests (Playwright)
        run: npm run test:e2e
        # ADR-0076 Phase 2: Playwright E2E for /services docs-coverage page.
        # Mocks all BFF endpoints via page.route() — no live services required.
        # Enforced (issue #653): this job runs solely on hosted ubuntu-latest (a single,
        # uniform pool member — no ARC/self-hosted split for Admin UI build), the deps
        # step above installs cleanly every run, and #646 fixed the suite from silently
        # testing /auth/login (every route redirected there, no Keycloak in CI) to
        # actually exercising /services via a minted session cookie. Verified stable:
        # 5/5 passing across 3 consecutive main-branch runs, locally with --repeat-each=3.
        env:
          CI: "true"
          NEXTAUTH_URL: "http://localhost:3001"
          NEXTAUTH_SECRET: "ci-e2e-secret"
          OPENBANK_REPO_ROOT: "${{ github.workspace }}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: openbank-admin-ui/playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Gate job — always runs, maps to the "Admin UI" required check name.
  # Passes when ui-build succeeded or was skipped (no UI changes); fails only
  # when ui-build itself failed. Backend-only PRs therefore never get blocked.
  ui:
    name: Admin UI
    needs: [changes-ui, ui-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check build result
        run: |
          result="${{ needs.ui-build.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Admin UI build failed (result: $result)." && exit 1
          fi
          echo "Admin UI: $result (skipped = no UI changes in this PR)."

  # ---------------------------------------------------------------------------
  # Static config validation
  # ---------------------------------------------------------------------------
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # yamllint/shellcheck run as direct CLI invocations rather than Docker
      # container actions (ADR-0040). shellcheck is pre-installed on the hosted
      # ubuntu image; yamllint is not.
      - name: Install lint tools
        run: |
          command -v yamllint >/dev/null 2>&1 || {
            sudo apt-get update -q
            sudo apt-get install -y -q yamllint
          }

      - name: yamllint
        run: |
          # Lint the infra/CI manifests this job is named for. Quarkus service
          # application.yaml files are validated by Quarkus itself during the
          # per-service build (services-ci.yml), so we don't double-lint them.
          cat > "${RUNNER_TEMP:-/tmp}/yamllint-ci.yml" <<'YML'
          extends: default
          rules:
            line-length: disable
            document-start: disable
            # Allow ONE space inside flow collections (`{ a: b }`, `[ x, y ]`) as well
            # as zero. The fleet manifests use that style pervasively (ArgoCD
            # Applications, component resources, the single-owner service manifests);
            # both styles are equivalent YAML and harmless. Defaulting to 0-only kept
            # re-breaking this required check every time a new service was onboarded
            # (#648, #657, ...).
            braces:
              max-spaces-inside: 1
            brackets:
              max-spaces-inside: 1
            # SHA-pinned actions use the `@<sha> # vX` convention (1 space) that
            # Dependabot/GitHub generate and rewrite; don't fight it with 2.
            comments:
              min-spaces-from-content: 1
            truthy:
              check-keys: false
            # Allow either sequence-indentation style (block sequences indented
            # under their key, or flush with it). The Kyverno mutation policies
            # (ecr-pull-through-rewrite.yaml) and several ArgoCD/gitops manifests
            # author `- item` flush with the parent key, which the `default`
            # (indent-sequences: true) flags as wrong-indentation — the same
            # file-by-file fight as braces/brackets above. `whatever` accepts both
            # equivalent styles instead of re-reddening the required check (#926).
            indentation:
              indent-sequences: whatever
          YML
          # strict:false equivalent — yamllint exits non-zero only on errors,
          # warnings don't fail the job (no --strict).
          yamllint -f github -c "${RUNNER_TEMP:-/tmp}/yamllint-ci.yml" openbank-infra .github

      - name: shellcheck
        run: |
          files=$(find openbank-infra/scripts -type f -name '*.sh' 2>/dev/null || true)
          if [ -n "$files" ]; then
            shellcheck -S warning $files
          else
            echo "No shell scripts under openbank-infra/scripts — skipping."
          fi

      # ADR-0081 / issue #854 step 4: NetworkPolicies are DERIVED data (DO NOT
      # EDIT — generated by gen-network-policies.py from the declared GitOps
      # edges). Re-run the generator and fail on any uncommitted diff so that a
      # new cross-namespace call or a new service added to gitops/components/
      # automatically surfaces a required regeneration.
      # PyYAML is not stdlib: try multiple install paths for portability across
      # macOS (system python3 without pip, Homebrew pip3) and Linux ARC runners
      # (pip/pip3 not in PATH). Fall back to checking if pyyaml is already present.
      - name: gen-network-policies drift gate (ADR-0081, issue #854)
        run: |
          # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies: pipCommand). pyyaml has no
          # runtime deps, so a full wheel+sdist hash set is tractable and covers every
          # platform in the mixed macOS/Linux openbank-build pool.
          cat > /tmp/pyyaml-requirements.txt <<'REQEOF'
          pyyaml==6.0.2 \
              --hash=sha256:0a9a2848a5b7feac301353437eb7d5957887edbf81d56e903999a75a3d743086 \
              --hash=sha256:29717114e51c84ddfba879543fb232a6ed60086602313ca38cce623c1d62cfbf \
              --hash=sha256:8824b5a04a04a047e72eea5cec3bc266db09e35de6bdfe34c9436ac5ee27d237 \
              --hash=sha256:7c36280e6fb8385e520936c3cb3b8042851904eba0e58d277dca80a5cfed590b \
              --hash=sha256:ec031d5d2feb36d1d1a24380e4db6d43695f3748343d99434e6f5f9156aaa2ed \
              --hash=sha256:936d68689298c36b53b29f23c6dbb74de12b4ac12ca6cfe0e047bedceea56180 \
              --hash=sha256:23502f431948090f597378482b4812b0caae32c22213aecf3b55325e049a6c68 \
              --hash=sha256:2e99c6826ffa974fe6e27cdb5ed0021786b03fc98e5ee3c5bfe1fd5015f42b99 \
              --hash=sha256:a4d3091415f010369ae4ed1fc6b79def9416358877534caf6a0fdd2146c87a3e \
              --hash=sha256:cc1c1159b3d456576af7a3e4d1ba7e6924cb39de8f67111c735f6fc832082774 \
              --hash=sha256:1e2120ef853f59c7419231f3bf4e7021f1b936f6ebd222406c3b60212205d2ee \
              --hash=sha256:5d225db5a45f21e78dd9358e58a98702a0302f2659a3c6cd320564b75b86f47c \
              --hash=sha256:5ac9328ec4831237bec75defaf839f7d4564be1e6b25ac710bd1a96321cc8317 \
              --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85 \
              --hash=sha256:ff3824dc5261f50c9b0dfb3be22b4567a6f938ccce4587b38952d85fd9e9afe4 \
              --hash=sha256:797b4f722ffa07cc8d62053e4cff1486fa6dc094105d13fea7b1de7d8bf71c9e \
              --hash=sha256:11d8f3dd2b9c1207dcaf2ee0bbbfd5991f571186ec9cc78427ba5bd32afae4b5 \
              --hash=sha256:e10ce637b18caea04431ce14fabcf5c64a1c61ec9c56b071a4b7ca131ca52d44 \
              --hash=sha256:c70c95198c015b85feafc136515252a261a84561b7b1d51e3384e0655ddf25ab \
              --hash=sha256:ce826d6ef20b1bc864f0a68340c8b3287705cae2f8b4b1d932177dcc76721725 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5 \
