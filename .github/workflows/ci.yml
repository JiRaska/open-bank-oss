name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # ---------------------------------------------------------------------------
  # JVM / Kotlin / Gradle builds moved to services-ci.yml, which builds every
  # Gradle module as its own path-scoped matrix job (per-service status checks +
  # fewer billed minutes). This workflow keeps the non-JVM checks below.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Admin UI — path-scoped: runs when openbank-admin-ui/** changes, OR when a file
  # the ADR-0071 governance gate READS changes. That gate lives in this job but
  # validates every openbank-*/governance.yaml in the fleet, so scoping the job to
  # admin-ui files alone let a backend PR add a service and never reach it: the job
  # skipped, the always-run "Admin UI" gate job reads a skip as a pass, and the
  # breakage landed on main where it blocked the next admin-ui PR (#2124 and #2104
  # each shipped a governance.yaml with 0 admin-ui files touched — issue #2236).
  # On push to main (post-merge) always rebuilds to keep the sandbox image current.
  # A separate gate job ("Admin UI") always runs and fails only when the build
  # itself failed — so branch-protection never blocks a backend-only PR.
  # ---------------------------------------------------------------------------
  changes-ui:
    name: Detect UI or governance changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Post-merge main build always includes admin-ui.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            BASE="origin/${{ github.base_ref }}"
            # Force the remote-tracking ref to the true tip (persistent self-hosted
            # runners reuse the workdir, so the cached ref can be stale).
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --no-tags
            # The extra pathspecs are the governance gate's INPUTS, not UI code:
            # every per-service governance.yaml, plus the schema it validates them
            # against. The generator itself lives under openbank-admin-ui/.
            N=$(git diff --name-only "${BASE}...HEAD" -- \
                  openbank-admin-ui/ \
                  '*/governance.yaml' \
                  openbank-libs/governance/governance.schema.json | wc -l | tr -d ' ')
            echo "changed=$( [ "$N" -gt 0 ] && echo 'true' || echo 'false' )" >> "$GITHUB_OUTPUT"
            echo "Admin UI or governance files changed: $N"
          fi

  ui-build:
    name: Admin UI build
    needs: changes-ui
    if: needs.changes-ui.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: openbank-admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the runtime image (openbank-admin-ui/Dockerfile: node:26-alpine). Pinned at 20
          # it was three majors behind what ships, and #3569's jsdom bump made that fatal:
          # jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26 and pulls undici 8, whose
          # cachestorage calls webidl.util.markAsUncloneable. On 20 every vitest worker died
          # with "Failed to start forks worker", the run collected ZERO tests, and the job
          # still reported a plain red — engine-strict is off, so npm ci installed it happily.
          node-version: "26"
          cache: "npm"
          cache-dependency-path: openbank-admin-ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # Both ADR-0071 Phase 4 gates used to sit here — the manifest.ts types-only check
      # (#4339) and the fleet governance-manifest check (#4083). Both are now declared in
      # .github/gates/gates.yaml (`manifest-types-only`, `governance-manifest`), because this
      # job is conditional and a gate must not inherit a scope nobody declared (#3629). The
      # second one is why that matters: its subject is every module with a version.txt, and
      # a PR adding a service without a governance.yaml matched none of `changes-ui`'s paths,
      # so the job was ABSENT rather than skipped and the aggregate check read green.
      # `pretest` still regenerates governance.json for the suite below.

      - name: Test (unit + integration)
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=build/test-results/test/vitest.xml
        # ADR-0076 Phase 0+1: guard tests, BFF route integration tests, docs-route,
        # health-route integration tests all run here via Vitest.

      - name: Install Playwright browsers
        # Download the Chromium binary (always works, no root required).
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # On Linux, Chromium needs OS-level libs (libnspr4, libnss3, etc.).
        # This requires sudo / root; self-hosted runners may not have it yet.
        # Linux-only: install-deps is a no-op on macOS, and on a self-hosted Mac
        # runner `sudo` without NOPASSWD hangs on the password prompt until the
        # JOB timeout kills the run (continue-on-error can't catch a job timeout).
        # The step timeout is the belt-and-braces for an unprepared Linux runner —
        # the E2E step still skips gracefully if deps are absent (see below).
        # When the runner is eventually set up with NOPASSWD sudo, remove the flag.
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium
        timeout-minutes: 5
        continue-on-error: true

      - name: E2E tests (Playwright)
        id: browser_e2e
        run: npm run test:e2e
        # ADR-0076 Phase 2: Playwright E2E for /services docs-coverage page.
        # Mocks all BFF endpoints via page.route() — no live services required.
        # Enforced (issue #653): this job runs solely on hosted ubuntu-latest (a single,
        # uniform pool member — no ARC/self-hosted split for Admin UI build), the deps
        # step above installs cleanly every run, and #646 fixed the suite from silently
        # testing /auth/login (every route redirected there, no Keycloak in CI) to
        # actually exercising /services via a minted session cookie. Verified stable:
        # 5/5 passing across 3 consecutive main-branch runs, locally with --repeat-each=3.
        env:
          CI: "true"
          NEXTAUTH_URL: "http://localhost:3001"
          NEXTAUTH_SECRET: "ci-e2e-secret"
          OPENBANK_REPO_ROOT: "${{ github.workspace }}"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: "build/test-results/e2e/playwright.xml"

      - name: Build Admin UI Test Intelligence envelope
        if: always()
        continue-on-error: true
        run: |
          DIAGNOSTIC_ARGS=()
          if [[ "${{ steps.browser_e2e.outcome }}" == "failure" ]]; then
            DIAGNOSTIC_ARGS+=(--browser-report-dir playwright-report)
          fi
          python3 ../.github/scripts/collect-test-run-evidence.py \
            --service . --component openbank-admin-ui --out build/test-intelligence/run.json \
            "${DIAGNOSTIC_ARGS[@]}"

      - name: Retain Admin UI test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-intelligence-run-openbank-admin-ui-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/build/test-intelligence/run.json
          retention-days: 30

      - name: Publish latest Admin UI test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-intelligence-openbank-admin-ui
          path: |
            openbank-admin-ui/build/test-intelligence/run.json
            openbank-admin-ui/build/test-results/**/*.xml
          retention-days: 14
          overwrite: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.browser_e2e.outcome == 'failure'
        with:
          name: playwright-report-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Gate job — always runs, maps to the "Admin UI" required check name.
  # Passes when ui-build succeeded or was skipped (no UI changes); fails when
  # ui-build itself failed. Backend-only PRs therefore never get blocked.
  #
  # `cancelled` is deliberately NOT the same bucket as `failure` (issue #2185).
  # The concurrency group above is `ci-${{ github.ref }}` with cancel-in-progress,
  # so on main every push cancels the run before it — three consecutive
  # release-please merges each killed the previous `Admin UI build` mid-flight and
  # left main showing a red that described nothing. That is corrosive rather than
  # merely noisy: the fleet had a GENUINE Admin UI build failure at the same time
  # (#2165) and a reader could not tell the real red from the concurrency artifact.
  # Same shape as #2177, where an OOM'd fleet-lint reported a red indistinguishable
  # from a lint violation — the check reported a bucket, not a cause.
  #
  # Split by event, because what a cancellation MEANS differs:
  #   push (main)      — the run was superseded by a newer push of the same ref,
  #                      whose own gate is the one that counts. Nothing is being
  #                      gated here, so pass with an explicit ::warning naming the
  #                      supersession.
  #   pull_request     — still a hard failure. A cancelled PR run has not built
  #                      anything, and letting it read green would be exactly the
  #                      vacuous green this repo works to avoid.
  ui:
    name: Admin UI
    needs: [changes-ui, ui-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check build result
        env:
          RESULT: ${{ needs.ui-build.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "failure" ]; then
            echo "Admin UI build FAILED — this is a real build failure, not a superseded run."
            exit 1
          fi
          if [ "$RESULT" = "cancelled" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::warning::Admin UI build was CANCELLED, not failed: a newer push to this ref" \
                   "superseded it (concurrency group ci-$REF). Read that newer run's" \
                   "gate — this one built nothing and is not evidence of a broken build (#2185)."
              exit 0
            fi
            echo "Admin UI build was cancelled before it finished, so nothing was built."
            echo "Re-run it (or push again) — a cancelled run must not read as a passing gate."
            exit 1
          fi
          echo "Admin UI: $RESULT (skipped = no UI changes in this PR)."

  # ---------------------------------------------------------------------------
  # Static config validation — the governance gates.
  #
  # These 67 gates used to be 79 SEQUENTIAL steps in a single `validate` job. That shape
  # cost linearly: between 2026-07-04 and 2026-08-01 the job went 35 -> 97 steps and its
  # median wall time 0.7 -> 2.4 min, on a REQUIRED check that every PR pays — including the
  # ~40% of merged PRs that are release-please / auto-deploy bot PRs. Every gate added
  # taxed every PR in the repo, permanently, and nothing bounded that.
  #
  # The gates now live in .github/gates/gates.yaml and run via .github/scripts/run-gates.py,
  # which executes them CONCURRENTLY. This job shards that manifest, so the wall time is
  # max(shard) rather than sum(gates) — measured locally on the full set: 500s of gate CPU,
  # 187s for the slowest single gate.
  #
  # `Validate manifests` (below) stays a separate job with that exact name because it is a
  # REQUIRED status check in the main-protection ruleset. Renaming or sharding it directly
  # would have needed a GitHub-side ruleset edit, which cannot ship in the same PR as the
  # change it protects; aggregating instead keeps the contexts stable and the fix in-repo.
  # Same shape as services-ci.yml's `all-green`, for the same reason.
  #
  # Shards are WALL-TIME buckets, not a taxonomy — rebalance `group:` in the manifest when
  # one gets slow. Adding a group here without one in the manifest fails loudly: run-gates.py
  # refuses a selection that matches no gates rather than reporting a green about no work.
  # ---------------------------------------------------------------------------
  gates:
    name: gates (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Never fail-fast: one red shard must not hide the state of the other seven, or a PR
      # gets a one-gate-at-a-time debugging loop instead of the whole picture in one run.
      fail-fast: false
      matrix:
        group: [lint, gitops, supplychain, registry, kotlin, api, data, security]
    env:
      # ${{ }} expressions cannot be expanded outside the workflow, so the two gate inputs
      # that need them are set here rather than in the manifest.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE_REF: ${{ github.base_ref || github.ref_name }}
      # `gh` needs GH_TOKEN; the job-level `permissions: contents: read` above is what
      # scopes it. check-msg-channel-image-parity.py reads a file at an arbitrary historical
      # commit (the sha an image tag names) through the contents API, because CI checks out
      # at fetch-depth: 1 and GitHub will not serve an arbitrary sha to `git fetch`.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26, for the same reason ui-build pins it: it is what openbank-admin-ui's
      # dependency tree is resolved against (Dockerfile: node:26-alpine). The gates shard
      # had no setup-node at all, so it ran on whatever the runner image ships, and the
      # mermaid-parses gate — which imports admin-ui's own mermaid — died there while
      # passing everywhere else:
      #
      #   ERR_UNSUPPORTED_DIR_IMPORT: Directory import '.../node_modules/es-toolkit/compat'
      #   is not supported resolving ES modules imported from .../mermaid/dist/mermaid.core.mjs
      #
      # es-toolkit declares a correct "./compat" exports entry, so this is the older Node
      # failing to apply it, not a broken package. The gate reported UNFALSIFIED rather than
      # passing — its own self-test could not run — which is how a runtime mismatch that
      # reproduces nowhere else got caught at all.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      # PyYAML is a prerequisite of run-gates.py itself, and of most checkers. It used to
      # be installed inside the gen-network-policies gate, which happened to be the first
      # step that needed it; now that gates run concurrently there is no "first step", so
      # the install belongs to the shard.
      - name: Install PyYAML
        run: |
          # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies: pipCommand). pyyaml has no
          # runtime deps, so a full wheel+sdist hash set is tractable and covers every
          # platform in the mixed macOS/Linux openbank-build pool.
          cat > /tmp/pyyaml-requirements.txt <<'REQEOF'
          pyyaml==6.0.2 \
              --hash=sha256:0a9a2848a5b7feac301353437eb7d5957887edbf81d56e903999a75a3d743086 \
              --hash=sha256:29717114e51c84ddfba879543fb232a6ed60086602313ca38cce623c1d62cfbf \
              --hash=sha256:8824b5a04a04a047e72eea5cec3bc266db09e35de6bdfe34c9436ac5ee27d237 \
              --hash=sha256:7c36280e6fb8385e520936c3cb3b8042851904eba0e58d277dca80a5cfed590b \
              --hash=sha256:ec031d5d2feb36d1d1a24380e4db6d43695f3748343d99434e6f5f9156aaa2ed \
              --hash=sha256:936d68689298c36b53b29f23c6dbb74de12b4ac12ca6cfe0e047bedceea56180 \
              --hash=sha256:23502f431948090f597378482b4812b0caae32c22213aecf3b55325e049a6c68 \
              --hash=sha256:2e99c6826ffa974fe6e27cdb5ed0021786b03fc98e5ee3c5bfe1fd5015f42b99 \
              --hash=sha256:a4d3091415f010369ae4ed1fc6b79def9416358877534caf6a0fdd2146c87a3e \
              --hash=sha256:cc1c1159b3d456576af7a3e4d1ba7e6924cb39de8f67111c735f6fc832082774 \
              --hash=sha256:1e2120ef853f59c7419231f3bf4e7021f1b936f6ebd222406c3b60212205d2ee \
              --hash=sha256:5d225db5a45f21e78dd9358e58a98702a0302f2659a3c6cd320564b75b86f47c \
              --hash=sha256:5ac9328ec4831237bec75defaf839f7d4564be1e6b25ac710bd1a96321cc8317 \
              --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85 \
              --hash=sha256:ff3824dc5261f50c9b0dfb3be22b4567a6f938ccce4587b38952d85fd9e9afe4 \
              --hash=sha256:797b4f722ffa07cc8d62053e4cff1486fa6dc094105d13fea7b1de7d8bf71c9e \
              --hash=sha256:11d8f3dd2b9c1207dcaf2ee0bbbfd5991f571186ec9cc78427ba5bd32afae4b5 \
              --hash=sha256:e10ce637b18caea04431ce14fabcf5c64a1c61ec9c56b071a4b7ca131ca52d44 \
              --hash=sha256:c70c95198c015b85feafc136515252a261a84561b7b1d51e3384e0655ddf25ab \
              --hash=sha256:ce826d6ef20b1bc864f0a68340c8b3287705cae2f8b4b1d932177dcc76721725 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5 \
              --hash=sha256:9b22676e8097e9e22e36d6b7bda33190d0d400f345f23d4065d48f4ca7ae0425 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:0833f8694549e586547b576dcfaba4a6b55b9e96098b36cdc7ebefe667dfed48 \
              --hash=sha256:8b9c7197f7cb2738065c481a0461e50ad02f18c78cd75775628afb4d7137fb3b \
              --hash=sha256:ef6107725bd54b262d6dedcc2af448a266975032bc85ef0172c5f059da6325b4 \
              --hash=sha256:7e7401d0de89a9a855c839bc697c079a4af81cf878373abd7dc625847d25cbd8 \
              --hash=sha256:efdca5630322a10774e8e98e1af481aad470dd62c3170801852d752aa7a783ba \
              --hash=sha256:50187695423ffe49e2deacb8cd10510bc361faac997de9efef88badc3bb9e2d1 \
              --hash=sha256:0ffe8360bab4910ef1b9e87fb812d8bc0a308b0d0eef8c8f44e0254ab3b07133 \
              --hash=sha256:17e311b6c678207928d649faa7cb0d7b4c26a0ba73d41e99c4fff6b6c3276484 \
