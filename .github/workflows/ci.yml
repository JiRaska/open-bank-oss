name: CI

on:
  push:
    branches: [main]
  pull_request:
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # Review events have their own lane: a review must not cancel the PR push run that
  # provides required checks (including service builds from a separate workflow).
  # The key stays O(1) — a sha or event name, never a list (#3082).
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.event_name }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  agent-admission:
    name: Agent PR admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.admit.outputs.proceed }}
    steps:
      - if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # base.sha is frozen on older PRs; admission reads policy and pinned requirements
          # from the current trusted base branch, never from the untrusted PR head.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'push' ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/agent-admission-venv"
          "$RUNNER_TEMP/agent-admission-venv/bin/python" -m pip install --quiet --require-hashes -r .github/workflows/requirements/public-readiness.txt
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "$RUNNER_TEMP/agent-prs.json"
          "$RUNNER_TEMP/agent-admission-venv/bin/python" .github/scripts/agent-admission.py "$RUNNER_TEMP/agent-prs.json" --current-pr "$PR_NUMBER" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # JVM / Kotlin / Gradle builds moved to services-ci.yml, which builds every
  # Gradle module as its own path-scoped matrix job (per-service status checks +
  # fewer billed minutes). This workflow keeps the non-JVM checks below.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Admin UI — path-scoped: runs when openbank-admin-ui/** changes, OR when a file
  # the ADR-0071 governance gate READS changes. That gate lives in this job but
  # validates every openbank-*/governance.yaml in the fleet, so scoping the job to
  # admin-ui files alone let a backend PR add a service and never reach it: the job
  # skipped, the always-run "Admin UI" gate job reads a skip as a pass, and the
  # breakage landed on main where it blocked the next admin-ui PR (#2124 and #2104
  # each shipped a governance.yaml with 0 admin-ui files touched — issue #2236).
  # On push to main (post-merge) always rebuilds to keep the sandbox image current.
  # A separate gate job ("Admin UI") always runs and fails only when the build
  # itself failed — so branch-protection never blocks a backend-only PR.
  # ---------------------------------------------------------------------------
  changes-ui:
    name: Detect UI or governance changes
    needs: agent-admission
    if: needs.agent-admission.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      rbac_tests: ${{ steps.check.outputs.rbac_tests }}
      registry_test: ${{ steps.check.outputs.registry_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test_select_admin_ui_rbac_tests.py
          if [ "${{ github.event_name }}" = "push" ]; then
            # Post-merge main build always includes admin-ui.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            : "${BASE_REF:?pull request base ref missing}"
            BASE="origin/${BASE_REF}"
            # Force the remote-tracking ref to the true tip (persistent self-hosted
            # runners reuse the workdir, so the cached ref can be stale).
            git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" --no-tags
            # The extra pathspecs are the governance gate's INPUTS, not UI code:
            # every per-service governance.yaml, plus the schema it validates them
            # against. The generator itself lives under openbank-admin-ui/.
            N=$(git diff --name-only "${BASE}...HEAD" -- \
                  openbank-admin-ui/ \
                  '*/governance.yaml' \
                  openbank-libs/governance/governance.schema.json | wc -l | tr -d ' ')
            echo "changed=$( [ "$N" -gt 0 ] && echo 'true' || echo 'false' )" >> "$GITHUB_OUTPUT"
            echo "Admin UI or governance files changed: $N"
            # Derive cross-package guard inputs from literal backend paths.
            # Backend-only RBAC changes get a focused test lane; UI changes run
            # the full UI suite above. A missing/dynamic input fails detection.
            python3 .github/scripts/select-admin-ui-rbac-tests.py --base "$BASE" >> "$GITHUB_OUTPUT"
          fi

  ui-rbac-contract:
    name: Admin UI cross-package guards
    needs: changes-ui
    if: needs.changes-ui.outputs.changed == 'false' && (needs.changes-ui.outputs.rbac_tests != '' || needs.changes-ui.outputs.registry_test == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: openbank-admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: openbank-admin-ui/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify affected cross-package guards
        env:
          RBAC_TESTS: ${{ needs.changes-ui.outputs.rbac_tests }}
          REGISTRY_TEST: ${{ needs.changes-ui.outputs.registry_test }}
        run: |
          set -euo pipefail
          read -r -a selected <<< "$RBAC_TESTS"
          tests=()
          for test in "${selected[@]}"; do
            [[ "$test" =~ ^[a-z0-9.-]+-rbac\.guard\.test\.ts$ ]] || { echo "Invalid RBAC test name" >&2; exit 1; }
            tests+=("src/test/$test")
          done
          if [ "$REGISTRY_TEST" = 'true' ]; then
            tests+=("src/test/service-registry.guard.test.ts")
          elif [ "$REGISTRY_TEST" != 'false' ]; then
            echo "Invalid registry guard selection" >&2
            exit 1
          fi
          (( ${#tests[@]} > 0 )) || { echo "No cross-package guards selected" >&2; exit 1; }
          npm run test -- "${tests[@]}"

  ui-build:
    name: Admin UI build
    needs: changes-ui
    if: needs.changes-ui.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: openbank-admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the runtime image (openbank-admin-ui/Dockerfile: node:26-alpine). Pinned at 20
          # it was three majors behind what ships, and #3569's jsdom bump made that fatal:
          # jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26 and pulls undici 8, whose
          # cachestorage calls webidl.util.markAsUncloneable. On 20 every vitest worker died
          # with "Failed to start forks worker", the run collected ZERO tests, and the job
          # still reported a plain red — engine-strict is off, so npm ci installed it happily.
          node-version: "26"
          cache: "npm"
          cache-dependency-path: openbank-admin-ui/package-lock.json

      # setup-node caches npm downloads, not Next's compiler cache. A hosted
      # runner starts each build with an empty .next/cache otherwise.
      - name: Cache Next build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openbank-admin-ui/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('openbank-admin-ui/package-lock.json', 'openbank-admin-ui/next.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('openbank-admin-ui/package-lock.json', 'openbank-admin-ui/next.config.mjs') }}-

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # Both ADR-0071 Phase 4 gates used to sit here — the manifest.ts types-only check
      # (#4339) and the fleet governance-manifest check (#4083). Both are now declared in
      # .github/gates/gates.yaml (`manifest-types-only`, `governance-manifest`), because this
      # job is conditional and a gate must not inherit a scope nobody declared (#3629). The
      # second one is why that matters: its subject is every module with a version.txt, and
      # a PR adding a service without a governance.yaml matched none of `changes-ui`'s paths,
      # so the job was ABSENT rather than skipped and the aggregate check read green.
      # `pretest` still regenerates governance.json for the suite below.

      - name: Test (unit + integration)
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=build/test-results/test/vitest.xml
        # ADR-0076 Phase 0+1: guard tests, BFF route integration tests, docs-route,
        # health-route integration tests all run here via Vitest.

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browsers
        # Download the Chromium binary (always works, no root required).
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # On Linux, Chromium needs OS-level libs (libnspr4, libnss3, etc.).
        # This requires sudo / root; self-hosted runners may not have it yet.
        # Linux-only: install-deps is a no-op on macOS, and on a self-hosted Mac
        # runner `sudo` without NOPASSWD hangs on the password prompt until the
        # JOB timeout kills the run (continue-on-error can't catch a job timeout).
        # The step timeout is the belt-and-braces for an unprepared Linux runner —
        # the E2E step still skips gracefully if deps are absent (see below).
        # When the runner is eventually set up with NOPASSWD sudo, remove the flag.
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium
        timeout-minutes: 5
        continue-on-error: true

      - name: E2E tests (Playwright)
        id: browser_e2e
        run: npm run test:e2e
        # ADR-0076 Phase 2: Playwright E2E for /services docs-coverage page.
        # Mocks all BFF endpoints via page.route() — no live services required.
        # Enforced (issue #653): this job runs solely on hosted ubuntu-latest (a single,
        # uniform pool member — no ARC/self-hosted split for Admin UI build), the deps
        # step above installs cleanly every run, and #646 fixed the suite from silently
        # testing /auth/login (every route redirected there, no Keycloak in CI) to
        # actually exercising /services via a minted session cookie. Verified stable:
        # 5/5 passing across 3 consecutive main-branch runs, locally with --repeat-each=3.
        env:
          CI: "true"
          NEXTAUTH_URL: "http://localhost:3001"
          NEXTAUTH_SECRET: "ci-e2e-secret"
          OPENBANK_REPO_ROOT: "${{ github.workspace }}"
          OPENBANK_E2E_SERVER: "production"
          OPENBANK_E2E_PREBUILT: "true"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: "build/test-results/e2e/playwright.xml"

      - name: Build Admin UI Test Intelligence envelope
        if: always()
        continue-on-error: true
        run: |
          DIAGNOSTIC_ARGS=()
          if [[ "${{ steps.browser_e2e.outcome }}" == "failure" ]]; then
            DIAGNOSTIC_ARGS+=(--browser-report-dir playwright-report)
          fi
          python3 ../.github/scripts/collect-test-run-evidence.py \
            --service . --component openbank-admin-ui --out build/test-intelligence/run.json \
            "${DIAGNOSTIC_ARGS[@]}"

      - name: Retain Admin UI test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-intelligence-run-openbank-admin-ui-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/build/test-intelligence/run.json
          retention-days: 30

      - name: Publish latest Admin UI test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-intelligence-openbank-admin-ui
          path: |
            openbank-admin-ui/build/test-intelligence/run.json
            openbank-admin-ui/build/test-results/**/*.xml
          retention-days: 14
          overwrite: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # `always() &&` is load-bearing. A step `if:` that names no status-check function is
        # implicitly ANDed with success(), so `browser_e2e.outcome == 'failure'` could never hold:
        # the E2E step has no continue-on-error, so its failure puts the job in a failed state and
        # every later plain-`if:` step is skipped. Measured on five main runs (21590f0e8, bebbfc4fd,
        # 8713dc4ba, 8db73dbbd, d57a02b6f): e2e=failure, the always() envelope step beside this one
        # ran, and this upload was skipped — so the report existed for exactly the runs that did not
        # need it. The three sibling `outcome == 'failure'` guards in dependency-review.yml and
        # security.yml are correct as written because those steps DO set continue-on-error.
        if: always() && steps.browser_e2e.outcome == 'failure'
        with:
          name: playwright-report-${{ github.run_id }}-a${{ github.run_attempt }}
          path: openbank-admin-ui/playwright-report/
          retention-days: 7

  # Gate job — always runs, maps to the "Admin UI" required check name.
  # Passes when ui-build succeeded or was skipped (no UI changes); fails when
  # ui-build itself failed. Backend-only PRs therefore never get blocked.
  #
  # `cancelled` is deliberately NOT the same bucket as `failure` (issue #2185).
  # The concurrency group above is `ci-${{ github.ref }}` with cancel-in-progress,
  # so on main every push cancels the run before it — three consecutive
  # release-please merges each killed the previous `Admin UI build` mid-flight and
  # left main showing a red that described nothing. That is corrosive rather than
  # merely noisy: the fleet had a GENUINE Admin UI build failure at the same time
  # (#2165) and a reader could not tell the real red from the concurrency artifact.
  # Same shape as #2177, where an OOM'd fleet-lint reported a red indistinguishable
  # from a lint violation — the check reported a bucket, not a cause.
  #
  # Split by event, because what a cancellation MEANS differs:
  #   push (main)      — the run was superseded by a newer push of the same ref,
  #                      whose own gate is the one that counts. Nothing is being
  #                      gated here, so pass with an explicit ::warning naming the
  #                      supersession.
  #   pull_request     — still a hard failure. A cancelled PR run has not built
  #                      anything, and letting it read green would be exactly the
  #                      vacuous green this repo works to avoid.
  ui:
    name: Admin UI
    needs: [changes-ui, ui-build, ui-rbac-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check build result
        env:
          RESULT: ${{ needs.ui-build.result }}
          DETECTION_RESULT: ${{ needs.changes-ui.result }}
          UI_CHANGED: ${{ needs.changes-ui.outputs.changed }}
          RBAC_TESTS: ${{ needs.changes-ui.outputs.rbac_tests }}
          REGISTRY_TEST: ${{ needs.changes-ui.outputs.registry_test }}
          RBAC_RESULT: ${{ needs.ui-rbac-contract.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DETECTION_RESULT" != "success" ]; then
            echo "Admin UI change detection did not succeed ($DETECTION_RESULT)."
            exit 1
          fi
          if [ "$UI_CHANGED" = "false" ] && { [ -n "$RBAC_TESTS" ] || [ "$REGISTRY_TEST" = 'true' ]; } && [ "$RBAC_RESULT" != "success" ]; then
            echo "Admin UI cross-package guards did not pass ($RBAC_RESULT)."
            exit 1
          fi
          if [ "$RESULT" = "failure" ]; then
            echo "Admin UI build FAILED — this is a real build failure, not a superseded run."
            exit 1
          fi
          if [ "$RESULT" = "cancelled" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::warning::Admin UI build was CANCELLED, not failed: a newer push to this ref" \
                   "superseded it (concurrency group ci-$REF). Read that newer run's" \
                   "gate — this one built nothing and is not evidence of a broken build (#2185)."
              exit 0
            fi
            echo "Admin UI build was cancelled before it finished, so nothing was built."
            echo "Re-run it (or push again) — a cancelled run must not read as a passing gate."
            exit 1
          fi
          echo "Admin UI: $RESULT (skipped = no UI changes in this PR)."

  # ---------------------------------------------------------------------------
  # Static config validation — the governance gates.
  #
  # These 67 gates used to be 79 SEQUENTIAL steps in a single `validate` job. That shape
  # cost linearly: between 2026-07-04 and 2026-08-01 the job went 35 -> 97 steps and its
  # median wall time 0.7 -> 2.4 min, on a REQUIRED check that every PR pays — including the
  # ~40% of merged PRs that are release-please / auto-deploy bot PRs. Every gate added
  # taxed every PR in the repo, permanently, and nothing bounded that.
  #
  # The gates now live in .github/gates/gates.yaml and run via .github/scripts/run-gates.py,
  # which executes them CONCURRENTLY. This job shards that manifest, so the wall time is
  # max(shard) rather than sum(gates) — measured locally on the full set: 500s of gate CPU,
  # 187s for the slowest single gate.
  #
  # `Validate manifests` (below) remains during phase 1 of the required-context migration.
  # main-protection first gains the three direct shard contexts while this old context
# overlaps those shards. `Admin UI` remains a separate follow-up because this updater cannot
# itself prove the PR-only skipped-build path. This non-UI governance PR supplies reviewable
# evidence (`Admin UI build` skipped while `Admin UI` succeeded), but does not require that
# context yet. A later follow-up may add it, and another may remove `Validate manifests`
# only after the three direct shard contexts are required and green on a real PR. This order keeps
  # shard coverage intact across the GitHub-side ruleset and workflow changes.
  #
  # Shards are WALL-TIME buckets, not a taxonomy — rebalance `group:` in the manifest when
  # one gets slow. Adding a group here without one in the manifest fails loudly: run-gates.py
  # refuses a selection that matches no gates rather than reporting a green about no work.
  # ---------------------------------------------------------------------------
  gates:
    name: gates (${{ matrix.slug }})
    needs: agent-admission
    if: needs.agent-admission.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Never fail-fast: one red shard must not hide the state of the other seven, or a PR
      # gets a one-gate-at-a-time debugging loop instead of the whole picture in one run.
      fail-fast: false
      matrix:
        # THREE buckets, not eight. Each entry is a SPACE-SEPARATED set of manifest groups;
        # `--group` is repeatable, so the taxonomy in gates.yaml is untouched and
        # `run-gates.py --group lint` still works locally exactly as before.
        #
        # WHY (#6252, measured over 6 PR runs): 93% of a CI job's elapsed time is runner
        # QUEUE, not work. The eight shards are created in the same instant and admitted
        # over a ~7 min stagger, so they spend 11.3 min wall-clock doing 5.6 min of work
        # while holding eight hosted-runner slots. Sharding was the right call when
        # #4340-#4346 measured it (62s -> 26s of CPU on the slowest shard); the binding
        # constraint has since moved from CPU to slots, and eight-way parallelism the pool
        # cannot supply now costs more than it buys — including 8x14s of duplicated
        # checkout/setup-node/PyYAML per run.
        #
        # Balanced on measured gate work, not gate count: gitops alone is ~1.4 min, more
        # than the other seven together in some runs, so it anchors its own bucket.
        # `include:` rather than a bare list because each bucket needs TWO values: the set of
        # manifest groups to pass to --group, and a filesystem/artifact-safe slug. There is no
        # string-replace function in GitHub expressions (actionlint rejects `replace(...)`), so
        # the slug is written out rather than derived.
        include:
          - slug: gitops-api
            groups: gitops api
          - slug: lint-supplychain-security
            groups: lint supplychain security
          - slug: registry-kotlin-data
            groups: registry kotlin data
    env:
      # ${{ }} expressions cannot be expanded outside the workflow, so the two gate inputs
      # that need them are set here rather than in the manifest.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
      # `gh` needs GH_TOKEN; the job-level `permissions: contents: read` above is what
      # scopes it. check-msg-channel-image-parity.py reads a file at an arbitrary historical
      # commit (the sha an image tag names) through the contents API, because CI checks out
      # at fetch-depth: 1 and GitHub will not serve an arbitrary sha to `git fetch`.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26, for the same reason ui-build pins it: it is what openbank-admin-ui's
      # dependency tree is resolved against (Dockerfile: node:26-alpine). The gates shard
      # had no setup-node at all, so it ran on whatever the runner image ships, and the
      # mermaid-parses gate — which imports admin-ui's own mermaid — died there while
      # passing everywhere else:
      #
      #   ERR_UNSUPPORTED_DIR_IMPORT: Directory import '.../node_modules/es-toolkit/compat'
      #   is not supported resolving ES modules imported from .../mermaid/dist/mermaid.core.mjs
      #
      # es-toolkit declares a correct "./compat" exports entry, so this is the older Node
      # failing to apply it, not a broken package. The gate reported UNFALSIFIED rather than
      # passing — its own self-test could not run — which is how a runtime mismatch that
      # reproduces nowhere else got caught at all.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      # PyYAML is a prerequisite of run-gates.py itself, and of most checkers. It used to
      # be installed inside the gen-network-policies gate, which happened to be the first
      # step that needed it; now that gates run concurrently there is no "first step", so
      # the install belongs to the shard.
      - name: Install PyYAML
        run: |
          # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies: pipCommand). pyyaml has no
          # runtime deps, so a full wheel+sdist hash set is tractable and covers every
          # platform in the mixed macOS/Linux openbank-build pool.
          python3 -m pip install --quiet --require-hashes -r .github/scripts/pyyaml-requirements.txt --break-system-packages 2>/dev/null \
            || python3 -m pip install --quiet --require-hashes -r .github/scripts/pyyaml-requirements.txt 2>/dev/null \
            || pip3 install --quiet --require-hashes -r .github/scripts/pyyaml-requirements.txt --break-system-packages 2>/dev/null \
            || pip3 install --quiet --require-hashes -r .github/scripts/pyyaml-requirements.txt 2>/dev/null \
            || python3 -c "import yaml" 2>/dev/null \
            || { echo "::error::pyyaml unavailable — add it to the runner base image"; exit 1; }

      # yamllint is not on the hosted image (shellcheck is), and only the bucket CONTAINING
      # the `lint` group needs it — installing it in every bucket would pay an apt-get three
      # times over. `contains(...)` on the space-separated set, since the bucket is no longer
      # a single group name. ADR-0040: direct CLI invocation, not a Docker container action.
      - name: Install lint tools
        if: contains(matrix.groups, 'lint')
        run: |
          command -v yamllint >/dev/null 2>&1 || {
            sudo apt-get update -q
            sudo apt-get install -y -q yamllint
          }

      # governance-script-unit-tests (supplychain) runs fixture builds through ./gradlew, and
      # the hosted image has no wrapper distribution. Left to the test, the wrapper downloaded
      # it mid-test and a services.gradle.org 504 failed an unrelated PR (#11549). Provision it
      # here instead: cached by the pinned wrapper properties, retried on a miss, and the test
      # FAILS (never skips, never downloads) if it is still absent.
      - name: Cache Gradle wrapper distribution
        if: contains(matrix.groups, 'supplychain')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-dist-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Provision Gradle wrapper distribution
        if: contains(matrix.groups, 'supplychain')
        run: bash .github/scripts/provision-gradle-distribution.sh

      # The merge-base as it is RIGHT NOW, not github.event.pull_request.base.sha, which is
      # frozen at PR-creation time. Two racing spec PRs both classified against their
      # creation-time base and both claimed the same openapi info.version (#481 x #524).
      # Exported per shard because every shard may hold a `needs_base: true` gate; a gate
      # that reads it while it is empty is failed by run-gates.py rather than run vacuously.
      #
      # Only `pull_request` reaches this step (the `if:` below) — `push` and `merge_group`
      # never do, so there is no non-merge-ref EVENT to special-case here. For a
      # `pull_request` run, GITHUB_SHA is a synthetic merge commit GitHub builds on the fly:
      # parent 1 (HEAD^1) is the base branch tip AS OF NOW, parent 2 (HEAD^2) is the PR head.
      # So HEAD^1 already IS the current merge-base — no search, no full `--unshallow` (which
      # cost ~151 MiB per shard on every PR run, #11085/#11086). `--depth=2` from GITHUB_SHA
      # is what makes it resolve: the default checkout is `fetch-depth: 1`, i.e. only the merge
      # commit itself, with both parents cut — the prior HEAD^2 attempt (#8933) never re-fetched
      # GITHUB_SHA at a deeper depth and so always failed `rev-parse --verify HEAD^2`, falling
      # back to the creation-time base.sha on every long-lived PR (measured 2026-09-06 on #8334:
      # a ~17-file notification PR reported 620 touched money-path files
      # (security-checklist-money-path) and 33 "changed" contract tests
      # (adversarial-contract-test), all of them main's own merged work). The guard below still
      # falls back to EVENT_BASE_SHA if HEAD^1 somehow fails to resolve, so an unexpected event
      # shape degrades to the old (stale but safe) behaviour rather than failing the job.
      - name: resolve PR diff base (current merge-base, not creation-time base.sha)
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Order matters: fetching the SHA before the branch ref. Doing it the other way
          # round — branch ref first, then a bare-sha fetch — hits a git quirk on a shallow
          # repo ("fatal: shallow file has changed since we read it"), measured reproducing
          # this step against a real PR merge ref. Fetching the sha first avoids it.
          git fetch -q --depth=2 origin "${GITHUB_SHA}"
          # Still needed independently of PR_DIFF_BASE: some gates (e.g.
          # check-openapi-version-not-taken.py --base-ref origin/main) read origin/${BASE_REF}
          # directly rather than through PR_DIFF_BASE.
          git fetch -q --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if base="$(git rev-parse -q --verify 'HEAD^1' 2>/dev/null)"; then
            :
          else
            echo "::warning::HEAD^1 did not resolve (not a merge-ref event?); falling back to the event base.sha, which is stale for a PR that has absorbed main since opening"
            base="${EVENT_BASE_SHA}"
          fi
          # Every gate runs `git diff "${PR_DIFF_BASE}...HEAD"`, and the THREE-DOT form needs the
          # merge-base of the two — not merely the base object. In a shallow checkout those are
          # different properties: measured 2026-09-07 against this remote, with the base fetched by
          # sha and `git cat-file -e` answering yes, `git diff A...HEAD` still exits 128 while
          # `A..HEAD` works, because the shared history is cut. Deepening is what fixes it: after
          # `--deepen`, merge-base resolves and the three-dot diff succeeds.
          #
          # So the invariant to guarantee here is `git merge-base <base> HEAD` resolving, and the
          # bug this replaces is that the fallback above sets a base without re-checking it. Three
          # gates then died with `exit status 128` and the runner rendered each as that gate's
          # FINDING rather than an error — credential-deadline-ratchet, adversarial-contract-test
          # and security-checklist-money-path all reported plausible, actionable defects on
          # #9077/#9086/#9098 having evaluated nothing (issue #9100).
          if ! git merge-base "${base}" HEAD >/dev/null 2>&1; then
            echo "merge-base ${base}..HEAD does not resolve yet — unshallowing so gates can diff."
            git fetch -q --unshallow origin 2>/dev/null || git fetch -q --deepen=2000 origin 2>/dev/null || true
          fi
          if ! git merge-base "${base}" HEAD >/dev/null 2>&1; then
            echo "::error::No merge-base between ${base} and HEAD in this checkout, so every gate that"
            echo "::error::diffs against PR_DIFF_BASE would exit 128 and be reported as a FINDING."
            echo "::error::This is a checkout/fetch failure, not a policy violation. Re-run the job, or"
            echo "::error::merge origin/${BASE_REF} into the branch so the base is in its own history."
            exit 1
          fi
          echo "PR diff base: ${base} (event base.sha: ${EVENT_BASE_SHA})"
          echo "PR_DIFF_BASE=${base}" >> "$GITHUB_ENV"

      - name: Run gates
        run: |
          # matrix.group is a space-separated SET of manifest groups; --group is repeatable.
          # Unquoted on purpose so the shell word-splits it — the one place in this file where
          # that is wanted rather than a bug.
          FLAGS=""
          for g in ${{ matrix.groups }}; do FLAGS="$FLAGS --group $g"; done
          # shellcheck disable=SC2086  # deliberate word-splitting of the flag list built above
          python3 .github/scripts/run-gates.py $FLAGS \
            --json "${RUNNER_TEMP}/gate-results-${{ matrix.slug }}.json"

      # ADR-0255. A structured record per gate, not another log for something to re-parse —
      # CLAUDE.md documents at length why scraping a job's own printed log is fragile (the log
      # contains the step's own `run:` script text; real false positives/negatives came from
      # exactly that). `if: always()` because a red shard is the run most worth capturing, not
      # the one to skip: this step must still upload after "Run gates" has already failed the
      # job. `--json` itself writes the file before run-gates.py returns its exit code (see
      # run-gates.py's own comment at the call site), so a failed shard still has one to upload.
      - name: Upload gate results (ADR-0255)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # matrix.slug, not matrix.groups: a space is not valid in an artifact name, and
          # this must match the --json path above exactly or the upload finds no file.
          name: gate-results-${{ matrix.slug }}
          path: ${{ runner.temp }}/gate-results-${{ matrix.slug }}.json
          if-no-files-found: warn
          retention-days: 90

  # Aggregates the shards into the single REQUIRED context named in the main-protection
  # ruleset. `cancelled` is treated as a failure on a PR for the same reason the Admin UI
  # gate does it (#2185): a cancelled shard built nothing and must not read as a pass.
  # needs also binds the `ui` aggregator (issue #3675): the Admin UI build carries the
  # enforced Playwright golden-path suite (#653), and depending on it here makes that
  # suite merge-blocking for admin-ui-touching PRs without a ruleset edit — the
  # in-repo fix the ruleset can't ship itself.
  validate:
    name: Validate manifests
    needs: [agent-admission, gates, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - name: Detect Admin UI image pin proposal
        id: admin_image
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only \
            > "$RUNNER_TEMP/admin-ui-pr-files"
          if grep -Fxq 'openbank-infra/gitops/components/admin-ui/admin-ui.yaml' \
              "$RUNNER_TEMP/admin-ui-pr-files"; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out trusted main for Admin UI image provenance
        if: steps.admin_image.outputs.check == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure read-only registry verification credentials
        if: steps.admin_image.outputs.check == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ADMIN_UI_IMAGE_VERIFY_ROLE_ARN }}
          aws-region: ${{ vars.ADMIN_UI_IMAGE_VERIFY_AWS_REGION }}
      - name: Verify signed Admin UI image inputs before merge
        if: steps.admin_image.outputs.check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin main
          fi
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            | python3 .github/scripts/deploy-window.py verify --root .
      - name: Verify agent PR admission
        env:
          RESULT: ${{ needs.agent-admission.result }}
          PROCEED: ${{ needs.agent-admission.outputs.proceed }}
        run: |
          if [ "$RESULT" != 'success' ] || [ "$PROCEED" != 'true' ]; then
            echo "::error::Agent PR admission refused or failed ($RESULT, proceed=$PROCEED)."
            exit 1
          fi
      - name: Verify no gate shard failed
        env:
          RESULT: ${{ needs.gates.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) echo "All gate shards green."; exit 0 ;;
            failure) echo "::error::One or more gate shards failed — see the 'gates (...)' jobs."; exit 1 ;;
            cancelled)
              if [ "$EVENT" = "push" ]; then
                echo "::warning::Gate shards were CANCELLED, not failed: a newer push to this ref" \
                     "superseded this run (concurrency group ci-${{ github.ref }}). Read that run's" \
                     "gate — this one validated nothing and is not evidence (#2185)."
                exit 0
              fi
              echo "::error::Gate shards were cancelled before finishing, so nothing was validated."
              exit 1 ;;
            *)
              # `skipped` lands here. A matrix job cannot skip on its own — it means an
              # upstream condition removed it — and a skipped validation must never read
              # as a passing required check.
              echo "::error::Gate shards did not run (result=$RESULT). Refusing to report success."
              exit 1 ;;
          esac

      # The ui aggregator already encodes the skip/cancel semantics (#2185): it passes
      # when the PR touches no admin-ui paths (ui-build skipped) and fails on a real
      # build/test failure — including the Playwright E2E step. So a plain success
      # check here is the whole binding; anything else fails closed.
      - name: Verify Admin UI gate (build + golden-path E2E)
        env:
          RESULT: ${{ needs.ui.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            echo "Admin UI gate green (or correctly skipped: no admin-ui changes)."
            exit 0
          fi
          echo "::error::Admin UI gate did not succeed (result=$RESULT) — the Playwright E2E / build must pass on admin-ui-touching PRs (issue #3675)."
          exit 1

  app-status:
    name: Customer-app dossier
    needs: agent-admission
    if: github.event_name == 'pull_request' && needs.agent-admission.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      APP_RO_TOKEN: ${{ secrets.OPENBANK_APP_RO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Does THIS PR touch the dossier or its generator?
      #
      # Drift between the committed app-status.json and openbank-app's source is caused by
      # openbank-app SHIPPING, never by a PR here. Comparing on every PR therefore reports a
      # real defect to whoever happened to open one next: measured 2026-08-07, openbank-app
      # released three times in twelve hours (0.16.1, 0.17.0, 0.18.0) against a daily refresh
      # tick, and 10 of 55 open PRs were red on a file none of them touched. It has recurred
      # five times in six days (#3212, #3552, #3818, #2101, #3053 — all closed by regenerating).
      #
      # Freshness is already owned, and already loud: app-status-refresh.yml regenerates daily
      # and opens its own PR (#3747, #3867, #3917, #3952 are those PRs). What that job CANNOT
      # see is a PR that hand-edits app-status.json or changes the generator — which is exactly
      # what stays checked below. So this narrows the scope to the only drift a PR can author,
      # and loses no coverage (#3988).
      #
      # The JOB stays unconditional on purpose. A gate behind a conditional job is absent
      # rather than skipped, the aggregate check goes green, and nothing says a gate was not
      # consulted (#3629). Only the comparison is scoped; the context always reports.
      - name: Could this PR have caused drift
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" --no-tags
          N=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
                openbank-admin-ui/app-status.json \
                openbank-admin-ui/scripts/generate-app-status.mjs | wc -l | tr -d ' ')
          echo "owns=$( [ "$N" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "files this PR changes in the dossier's own scope: $N"

      - name: Not this PR's drift
        if: steps.scope.outputs.owns == 'false'
        run: |
          echo "::notice title=app-status::This PR touches neither app-status.json nor its generator, so it cannot have caused dossier drift. Freshness against openbank-app is owned by app-status-refresh.yml, which opens its own regeneration PR (#3988)."

      # Read-only checkout of the customer-app source so the generator can derive
      # facts (AppConfig.kt + version.txt + app-status.yaml). openbank-app pins no
      # ref → its default branch, the published state the committed copy should match.
      - name: Checkout customer-app source
        if: env.APP_RO_TOKEN != '' && steps.scope.outputs.owns == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JiRaska/openbank-app
          token: ${{ env.APP_RO_TOKEN }}
          path: .app-src
          persist-credentials: false

      - name: Skip notice (no app-source token)
        if: env.APP_RO_TOKEN == ''
        run: echo "::notice title=app-status::OPENBANK_APP_RO_TOKEN not set — skipping customer-app dossier content check (ADR-0074)."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.APP_RO_TOKEN != '' && steps.scope.outputs.owns == 'true'
        with:
          # Matches the runtime image (openbank-admin-ui/Dockerfile: node:26-alpine). Pinned at 20
          # it was three majors behind what ships, and #3569's jsdom bump made that fatal:
          # jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26 and pulls undici 8, whose
          # cachestorage calls webidl.util.markAsUncloneable. On 20 every vitest worker died
          # with "Failed to start forks worker", the run collected ZERO tests, and the job
          # still reported a plain red — engine-strict is off, so npm ci installed it happily.
          node-version: "26"
          cache: "npm"
          cache-dependency-path: openbank-admin-ui/package-lock.json

      - name: Install (admin-ui, for the yaml parser)
        if: env.APP_RO_TOKEN != '' && steps.scope.outputs.owns == 'true'
        working-directory: openbank-admin-ui
        run: npm ci --no-audit --no-fund

      # Diff the derived block in enforce mode: --enforce makes node exit 1 on drift, and the
      # step must go red. Do NOT add `|| true`.
      #
      # `shell: bash` and the explicit `set -o pipefail` are load-bearing, not decoration. A `run:`
      # step with no `shell:` key runs under `bash -e {0}` — WITHOUT pipefail — so `node … | tee`
      # exits with tee's status and the step passed while printing the drift it had just detected.
      # Measured: `bash -e -c 'false | tee /dev/null'` exits 0; the same under `-o pipefail` aborts.
      # This step carried a comment claiming pipefail propagation for as long as it has existed, so
      # the check was documented as enforcing, believed to be enforcing, and was not (#3053).
      - name: Regenerate & diff derived block
        if: env.APP_RO_TOKEN != '' && steps.scope.outputs.owns == 'true'
        working-directory: openbank-admin-ui
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-app-status.mjs \
            --app-repo "${GITHUB_WORKSPACE}/.app-src" \
            --against app-status.json \
            --enforce \
            --check | tee "${RUNNER_TEMP:-/tmp}/app-status-check.txt"

      # Sticky PR comment ONLY when drift is detected, so a clean PR stays quiet.
      - name: Comment on drift
        if: env.APP_RO_TOKEN != '' && steps.scope.outputs.owns == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const f = `${process.env.RUNNER_TEMP || '/tmp'}/app-status-check.txt`
            let out = ''
            try { out = fs.readFileSync(f, 'utf8') } catch { return }
            if (!out.includes('derived drift')) return
            const body = [
              '### ❌ Customer-app dossier drift (ADR-0074)',
              '',
              'The committed `openbank-admin-ui/app-status.json` no longer matches the',
              '`derived` facts in `JiRaska/openbank-app` source. Regenerate & publish',
              '(openbank-app CI opens the publish PR), or run locally:',
              '',
              '```',
              'node openbank-admin-ui/scripts/generate-app-status.mjs --app-repo ../openbank-app',
              '```',
              '',
              '<details><summary>drift</summary>',
              '',
              '```',
              out.trim(),
              '```',
              '',
              '</details>',
            ].join('\n')
            const marker = '<!-- app-status-drift -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            const payload = `${marker}\n${body}`
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload })
            }

  # ---------------------------------------------------------------------------
  # Issue hygiene (ADR-0052) moved to issue-hygiene.yml so it also runs on the
  # `edited` pull_request event (PR-body fixes re-evaluate the check) without
  # re-running this whole workflow on every description edit.
  # ---------------------------------------------------------------------------
