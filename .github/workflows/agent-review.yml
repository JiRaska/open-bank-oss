# Explicit owner-anchored review. The legacy personal-subscription advisory lane is retired.
# Paid execution requires a dedicated API project with a provider-enforced spending limit.
name: agent-review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string
      admission:
        description: "Use the owner-anchored two-model admission path"
        required: false
        default: false
        type: boolean

permissions: {}

# Serialize provider dispatches; never cancel a running paid invocation for a newer PR.
concurrency:
  group: agent-provider-budget
  cancel-in-progress: false

jobs:
  budget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test-agent-review-budget.py

  solo-prepare:
    needs: budget-tests
    if: github.event_name == 'workflow_dispatch' && inputs.admission == true && vars.AGENT_REVIEW_API_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOLO_REVIEW_POLICY_SHA: ${{ vars.SOLO_REVIEW_POLICY_SHA }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      protected: ${{ steps.subject.outputs.protected }}
      head: ${{ steps.subject.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/install-pyyaml-hash-pinned.sh
      - name: Admit the complete two-model dispatch before provider work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agent-review-budget.py
      - id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: python3 .github/scripts/solo-review-runner.py prepare --pr "$PR_NUMBER" --output input.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solo-input-1
          path: input.json
          if-no-files-found: error
          retention-days: 7

  solo-review:
    name: solo-${{ matrix.slot }}
    needs: solo-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLO_REVIEW_POLICY_SHA: ${{ vars.SOLO_REVIEW_POLICY_SHA }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        slot: [correctness, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0
        with:
          node-version: '22'
      - run: bash .github/scripts/install-pyyaml-hash-pinned.sh
      # This pinned CLI's postinstall links its integrity-checked native package.
      # --ignore-scripts leaves a non-executable placeholder, not a working CLI.
      - run: npm ci --prefix .github/scripts/agent-review-claude-cli
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: solo-input-1
      - env:
          GH_TOKEN: ${{ github.token }}
          AGENT_REVIEW_API_ENABLED: ${{ vars.AGENT_REVIEW_API_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_REVIEW_ANTHROPIC_API_KEY }}
          REVIEW_SLOT: ${{ matrix.slot }}
        run: |
          python3 .github/scripts/solo-review-runner.py review --input input.json \
            --slot "$REVIEW_SLOT" --output "$REVIEW_SLOT.json" \
            --cli .github/scripts/agent-review-claude-cli/node_modules/.bin/claude
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-usage-${{ matrix.slot }}-1
          path: ${{ matrix.slot }}.json.usage.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solo-report-${{ matrix.slot }}-1
          path: ${{ matrix.slot }}.json
          if-no-files-found: error
          retention-days: 30

  solo-proof:
    needs: [solo-prepare, solo-review]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.admission == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOLO_REVIEW_POLICY_SHA: ${{ vars.SOLO_REVIEW_POLICY_SHA }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - env:
          PREPARE: ${{ needs.solo-prepare.result }}
          REVIEW: ${{ needs.solo-review.result }}
        run: test "$PREPARE" = success && test "$REVIEW" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/install-pyyaml-hash-pinned.sh
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: solo-*-1
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/solo-review-runner.py seal --preview --input input.json \
            --reports correctness.json security.json --output preview.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solo-preview-1
          path: preview.json
          if-no-files-found: error
          retention-days: 30

  solo-owner-acceptance:
    needs: [solo-prepare, solo-proof]
    if: needs.solo-prepare.outputs.protected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: solo-review-owner
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - env:
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ needs.solo-prepare.outputs.head }}
        run: printf 'Owner environment acceptance completed for PR %s at %s\n' "$PR_NUMBER" "$HEAD_SHA"

  solo-seal:
    needs: [solo-prepare, solo-proof, solo-owner-acceptance]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.admission == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOLO_REVIEW_POLICY_SHA: ${{ vars.SOLO_REVIEW_POLICY_SHA }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - env:
          PROOF: ${{ needs.solo-proof.result }}
          PROTECTED: ${{ needs.solo-prepare.outputs.protected }}
          ACCEPTANCE: ${{ needs.solo-owner-acceptance.result }}
        run: |
          test "$PROOF" = success
          case "$PROTECTED:$ACCEPTANCE" in true:success|false:skipped) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/install-pyyaml-hash-pinned.sh
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: solo-*-1
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE: ${{ needs.solo-owner-acceptance.result }}
        run: |
          args=()
          if [ "$ACCEPTANCE" = success ]; then args+=(--owner-accepted); fi
          python3 .github/scripts/solo-review-runner.py seal --input input.json \
            --reports correctness.json security.json --output admission.json "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solo-review-admission-1
          path: admission.json
          if-no-files-found: error
          retention-days: 30

  solo-evidence-locator:
    needs: [solo-prepare, solo-seal]
    if: github.event_name == 'workflow_dispatch' && inputs.admission == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Advertise evidence for independent guard verification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_POLICY: ${{ vars.SOLO_REVIEW_POLICY_SHA }}
          SUBJECT_HEAD: ${{ needs.solo-prepare.outputs.head }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_POLICY"
          [[ "$SUBJECT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SUBJECT_HEAD" \
            -f state=success -f context=solo-review/evidence \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Evidence available; agent guard independently verifies admission' >/dev/null
