# Independent agent review — an LLM reviewer that adds an independent signal on a
# PR: an approving review when a routine change is clearly correct, or a
# non-blocking comment listing concerns otherwise.
#
# `main-protection` now requires 0 approvals (the gate is the required status
# checks + review-thread resolution), so this job is PURELY ADVISORY — its job is
# to surface risk, never to gate merges. That is why a non-approve verdict is
# posted as a COMMENT review, not REQUEST_CHANGES: a change-requesting review
# blocks the merge until it is dismissed or the bot re-reviews, which — with a
# single human maintainer and a high PR volume — silently piles routine PRs up in
# the queue for "add more tests"-class nitpicks. That contradicts the NON-BLOCKING
# guarantee below ("can only ever *add* signal"). Concerns still appear inline on
# the PR for the author/human to weigh; they just no longer hold the merge hostage.
#
# Design / guardrails (read before changing):
#   * INDEPENDENCE. The primary reviewer runs on GitHub Models with a *different*
#     model family (OpenAI) than the Claude agents that usually author PRs here,
#     and the prompt is adversarial ("find a reason to REJECT"). A same-model
#     reviewer that rubber-stamps its own reasoning is not a review.
#   * SCOPE. This agent only auto-approves *boring* changes. Anything sensitive
#     (money-path service, governance rules, CI/automation, DB migration, release
#     wiring, threat model) is deliberately deferred to a human — the job posts a
#     note and exits WITHOUT approving. Money-path still needs 2 human approvals +
#     a threat model per rules.yaml (ADR-0030); this workflow must never weaken that.
#     One narrow carve-out (added to cut review backlog without weakening any of
#     the above): a changed file does NOT count toward "money-path service change"
#     if it's a test file (**/src/test/**), or a build.gradle.kts hunk that ONLY
#     raises a kover `minValue` coverage floor (ratchet-only, per rules.yaml's own
#     "coverage never lowers" invariant) — see is_test_or_coverage_only_file below.
#     A PR that touches src/main, config, or anything else in a money-path service
#     still defers to a human exactly as before.
#   * NON-BLOCKING. This job is NOT a required check. If the model is down, the PR
#     is from a fork (read-only token), or the change is sensitive, it simply adds
#     no approval and a human reviews as before. It can only ever *add* signal.
#   * FALLBACK. If GitHub Models errors or is rate-limited, fall back to Claude via
#     claude-code-action (auth = CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`,
#     which runs on a Pro/Max subscription — no paid API key required).
#     KNOWN BROKEN (#2161): the OAuth token is currently rejected at the gateway on
#     the first model call (`is_error:true` at `num_turns:1`, ~2s), so this standby
#     path does not actually review anything. Re-minting the token needs the owner's
#     Claude session, so it is tracked separately — do not assume a fallback exists.
#     What IS fixed: that state no longer reports as a successful review. The action
#     exits 0 on its own recorded failure, so a guard step reads the transcript and
#     fails the job instead (check-claude-fallback-result.sh). The token being dead is
#     now visible; before, a dead standby and a healthy one were indistinguishable.
#
# Prerequisites (one-time, outside this file):
#   1. Settings → Actions → General → "Allow GitHub Actions to approve pull
#      requests" = ON  (repo actions permission `can_approve_pull_request_reviews`).
#   2. Repo secret `CLAUDE_CODE_OAUTH_TOKEN` (generate locally: `claude setup-token`).
#      Without it the Claude fallback step is skipped; GitHub Models still works.
name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR head; supersede stale runs on force-push.
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # submit the review / post the deferral comment
  models: read           # GitHub Models inference

jobs:
  agent-review:
    # Skip drafts; skip the release-please bot (its PRs are machine-generated and
    # gated separately); skip the admin-ui-deploy GitOps PR (also machine-generated
    # — image-tag bump plus a regenerated derived catalog, ADR-0029 Layer B).
    #
    # The admin-ui-deploy skip is branch-pattern-based, not actor-based like the
    # release-please one: that pipeline opens its PR via the GitHub App token (the
    # GITOPS_PR_TOKEN user-PAT rung was retired in #1305), whose actor is the App bot
    # (`openbank-gitops-bot[bot]`, not `github-actions[bot]`) — so the actor check
    # here still can't tell "automated deploy" apart from "a human's PR", and the
    # branch pattern remains the reliable discriminator. Real-world cost of that
    # gap (2026-07-08): three deploy PRs (#596, #608, #609) piled up unmerged
    # because the reviewer kept flagging the SAME false positive on every one —
    # reviewing cluster-topology.json/infra-lifecycle.json (CI-regenerated
    # governance-as-code catalogs, not hand-authored) as if a namespace/role entry
    # appearing in the derived report were a new infra decision this PR made,
    # when the only substantive diff line is the image tag in admin-ui.yaml. That
    # silently broke the "auto-merged once CI is green, no human step" promise
    # documented in admin-ui-deploy.yml — required_status_checks (all-green,
    # Validate manifests, Gitleaks, issue-hygiene) already gate every merge, same
    # as a release-please PR; this workflow doesn't need to gate a second time on
    # a mechanical GitOps bump it has no code-judgment basis to review.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.head_ref, 'chore/admin-ui-deploy-')
    runs-on: ubuntu-latest
    timeout-minutes: 15  # measured max 14s, but the Claude fallback is an agentic gh loop that can hang
    # secrets context isn't available in a step-level `if:` — expose it as a
    # job-level boolean env so the Claude fallback can gate on its presence.
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need base..head for a real 3-dot diff

      # --- Scope gate --------------------------------------------------------
      # Decide whether this PR is "sensitive" (defer to human) or "routine"
      # (eligible for agent approval). Conservative: when in doubt, defer.
      - name: Classify change scope
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Changed files:"; echo "$CHANGED"

          # Money-path service directories, sourced dynamically from rules.yaml
          # (never hardcode — the list grows; rules.yaml wins).
          MP="$(yq -r '.money_path_services[]' openbank-libs/governance/rules.yaml)"
          MP_RE="$(echo "$MP" | paste -sd'|' -)"

          # A file is safe to skip entirely (doesn't count toward ANY sensitivity
          # bucket below, including money-path) if it's a test file, or a
          # build.gradle.kts hunk that ONLY raises a kover coverage floor. Both are
          # inherently no-behavior-change: a test file can't alter runtime
          # authorization/business logic, and a ratchet-only minValue increase can
          # only make CI stricter, never weaker (rules.yaml: coverage never lowers).
          # Anything else in the file (a dependency bump, a different DSL block)
          # falls through to the normal per-file rules below.
          is_test_or_coverage_only_file() {
            local f="$1"
            case "$f" in
              */src/test/*) return 0 ;;
              */build.gradle.kts|build.gradle.kts)
                local filediff other_changes old_val new_val
                filediff="$(git diff "origin/${BASE_REF}...HEAD" -- "$f")"
                other_changes="$(echo "$filediff" | grep -E '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*(//|minValue = [0-9]+[[:space:]]*$)')"
                old_val="$(echo "$filediff" | grep -oE '^-[[:space:]]*minValue = [0-9]+' | grep -oE '[0-9]+$' | tail -1)"
                new_val="$(echo "$filediff" | grep -oE '^\+[[:space:]]*minValue = [0-9]+' | grep -oE '[0-9]+$' | tail -1)"
                [ -z "$other_changes" ] && [ -n "$old_val" ] && [ -n "$new_val" ] && [ "$new_val" -ge "$old_val" ]
                ;;
              *) return 1 ;;
            esac
          }

          sensitive=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            is_test_or_coverage_only_file "$f" && continue
            case "$f" in
              .github/*) sensitive="CI / automation change ($f)";;
              openbank-libs/governance/*) sensitive="governance rules change ($f)";;
              release-please-config.json|.release-please-manifest.json) sensitive="release wiring change ($f)";;
              docs/threat-models/*) sensitive="threat-model change ($f)";;
              docs/adr/*) sensitive="architecture decision change ($f)";;
              *db/migration/*|*.sql) sensitive="DB migration ($f)";;
            esac
            # Money-path service directory?
            if echo "$f" | grep -qE "^(${MP_RE})/"; then
              sensitive="money-path service change ($f)"
            fi
            [ -n "$sensitive" ] && break
          done <<< "$CHANGED"

          # Money-path gitops deploy — content-based, not directory-name-based.
          # openbank-infra/gitops/ does NOT mirror service names 1:1: several
          # money-path services (transaction, sepa-payment, sepa-instant,
          # domestic-payment, clearing, swift) are bundled into one shared
          # component (components/payments/payments-services.yaml), so no
          # per-service directory exists to pattern-match on (surfaced while
          # reviewing PR #347, tracked as a gap in ADR-0154). Instead, scan the
          # diff of any changed openbank-infra/gitops/** file for an `image:`
          # line referencing a money-path service's ECR repo name.
          if [ -z "$sensitive" ] && echo "$CHANGED" | grep -q '^openbank-infra/gitops/'; then
            GITOPS_DIFF="$(git diff "origin/${BASE_REF}...HEAD" -- openbank-infra/gitops/)"
            for svc in $MP; do
              if echo "$GITOPS_DIFF" | grep -qE "image:.*${svc}:"; then
                sensitive="money-path gitops deploy (image references ${svc})"
                break
              fi
            done
          fi

          if [ -n "$sensitive" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=$sensitive" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          # --- Reviewer payload: derived files out, hard token budget in -------
          #
          # Two independent defects fixed here (#2088), both observed on PR #2082:
          #
          #  1. GENERATED FILES DOMINATED THE PAYLOAD. Editing rules.yaml or any
          #     .rego restamps EVERY service's OPA bundle ConfigMap (each embeds
          #     rules.yaml + agents.yaml + rest.rego verbatim, ~2.8k lines), so a
          #     one-line governance edit ships ~44 changed generated YAMLs. On
          #     #2082 the raw 3-dot diff was 211,616 bytes, of which 196,973 were
          #     a single `standing-order-opa-bundle.yaml` — 93% of the payload was
          #     a file marked "GENERATED … do not hand-edit" that no reviewer
          #     should read. The same class of noise already produced three
          #     repeat false positives on the derived admin-ui catalogs (see the
          #     admin-ui-deploy note in the job `if:` above). EXCLUDES below are
          #     CI-generated artifacts only — never hand-written code.
          #
          #  2. THE BUDGET DID NOT MATCH THE MODEL'S CAP. `head -c 30000` is
          #     ~8-10k tokens of diff alone, on top of a 4000-char PR body and the
          #     instructions — well past GitHub Models' hard 8000-token REQUEST
          #     cap, so those PRs 413'd deterministically ("Request body too
          #     large for gpt-4o model. Max size: 8000 tokens"). Budget, measured
          #     with tiktoken's o200k_base on real diffs from this repo (3.7-4.2
          #     chars/token; 3.0 used as a pessimistic floor):
          #       diff  16000 chars / 3.0 = 5333 tok  (measured ~4300)
          #       body   4000 chars       ≈ 1100 tok  (prose, ~3.6 ch/tok)
          #       scaffold + instructions ≈  250 tok
          #       -------------------------------------------------
          #       worst case              ≈ 6700 tok → ~15% headroom under 8000.
          #     20000 (the value #2088 floated) leaves only ~5% and loses the
          #     margin to a denser-than-3.0 diff, so it is deliberately lower.
          #
          # SCOPE NOTE — the excludes apply to the REVIEWER PAYLOAD ONLY, never
          # to the sensitivity classification above. A generated bundle is still
          # a real change; it just isn't something an LLM reviews line by line.
          # Moving these excludes up into the classifier would silently narrow
          # the money-path / governance gate, which this workflow must never do.
          GENERATED_EXCLUDES=(
            ':!**/*-opa-bundle*.yaml'              # ADR-0034 OPA bundle ConfigMaps (gen-*-opa-bundle.sh)
            ':!openbank-admin-ui/app-status.json'  # derived catalogs, ADR-0071/0079/0081
            ':!openbank-admin-ui/cluster-topology.json'
            ':!openbank-admin-ui/infra-lifecycle.json'
            ':!openbank-admin-ui/infra-vulns.json'
            ':!openbank-admin-ui/package-lock.json' # npm-generated lockfile
            ':!gradle/verification-metadata.xml'    # Gradle-generated dependency checksums
            ':!**/CHANGELOG.md'                     # release-please-generated
          )
          # Write to a file first, THEN truncate — piping straight into `head -c`
          # lets `head` close stdin early on a large diff, sending `git diff` a
          # SIGPIPE that fails the step under `pipefail` even though the
          # truncated diff was written successfully (#359).
          git diff "origin/${BASE_REF}...HEAD" -- . "${GENERATED_EXCLUDES[@]}" > /tmp/pr.full.diff
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/pr.files.all
          git diff --name-only "origin/${BASE_REF}...HEAD" -- . "${GENERATED_EXCLUDES[@]}" > /tmp/pr.files.kept
          DIFF_BUDGET=16000
          head -c "$DIFF_BUDGET" /tmp/pr.full.diff > /tmp/pr.diff

          FULL_BYTES="$(wc -c < /tmp/pr.full.diff | tr -d ' ')"
          KEPT_BYTES="$(wc -c < /tmp/pr.diff | tr -d ' ')"
          EXCLUDED_FILES="$(( $(wc -l < /tmp/pr.files.all) - $(wc -l < /tmp/pr.files.kept) ))"
          echo "review payload: ${KEPT_BYTES}/${FULL_BYTES} bytes after dropping ${EXCLUDED_FILES} generated file(s)"
          {
            echo "diff_full_bytes=${FULL_BYTES}"
            echo "diff_kept_bytes=${KEPT_BYTES}"
            echo "generated_excluded=${EXCLUDED_FILES}"
          } >> "$GITHUB_OUTPUT"
          # Truncation must never be silent: an APPROVE derived from a fragment
          # of the diff is a vacuous green, which is worse than no review.
          if [ "$KEPT_BYTES" -lt "$FULL_BYTES" ]; then
            echo "diff_truncated=true" >> "$GITHUB_OUTPUT"
          else
            echo "diff_truncated=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Sensitive: defer to a human, do not approve ------------------------
      - name: Defer to human review
        if: steps.scope.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          gh pr comment "$PR" --body \
            "🧑‍⚖️ **Agent review skipped — human review required.** Reason: ${REASON}. This class of change (money-path, governance, CI, migrations, release wiring, ADRs) is deliberately outside the agent's auto-approval scope."

      # --- Routine: build the reviewer prompt --------------------------------
      - name: Build review prompt
        if: steps.scope.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          DIFF_TRUNCATED: ${{ steps.scope.outputs.diff_truncated }}
          DIFF_FULL_BYTES: ${{ steps.scope.outputs.diff_full_bytes }}
          DIFF_KEPT_BYTES: ${{ steps.scope.outputs.diff_kept_bytes }}
          GENERATED_EXCLUDED: ${{ steps.scope.outputs.generated_excluded }}
        run: |
          set -euo pipefail
          # Fetch the PR body FRESH via the API, not from the event payload — the
          # payload snapshot goes stale when the author edits the description (the
          # same stale-payload trap as issue-hygiene). Without the body the reviewer
          # can never see the template's risk assessment / mitigations, and a
          # REQUEST_CHANGES asking for them can never be satisfied by editing the
          # description (observed on PR #448). Write-then-truncate, same SIGPIPE
          # guard as the diff above.
          gh pr view "$PR" --json body --jq '.body // ""' > /tmp/pr.body.full
          head -c 4000 /tmp/pr.body.full > /tmp/pr.body
          DIFF_TRUNCATED_LABEL=""
          if [ "$DIFF_TRUNCATED" = "true" ]; then
            DIFF_TRUNCATED_LABEL=" (TRUNCATED — ${DIFF_KEPT_BYTES} of ${DIFF_FULL_BYTES} bytes)"
          fi
          {
            echo "You are an INDEPENDENT, adversarial code reviewer for a banking-grade"
            echo "Quarkus/Kotlin monorepo. Your default posture is skepticism: actively"
            echo "look for a reason to REQUEST_CHANGES. Approve only if the change is"
            echo "clearly correct, in-scope, and low-risk."
            echo
            echo "PR title: ${TITLE}"
            echo
            echo "PR description (author-provided context — treat as claims to verify"
            echo "against the diff, not as truth; may be truncated):"
            echo '```markdown'
            cat /tmp/pr.body
            echo '```'
            echo
            if [ "${GENERATED_EXCLUDED:-0}" -gt 0 ]; then
              echo "NOTE: ${GENERATED_EXCLUDED} CI-generated file(s) (OPA bundle ConfigMaps,"
              echo "derived catalogs, lockfiles, CHANGELOGs) were removed from the diff below."
              echo "They are regenerated by scripts and are never hand-edited — do not comment"
              echo "on their absence, and do not treat it as an incomplete change."
              echo
            fi
            if [ "$DIFF_TRUNCATED" = "true" ]; then
              echo "WARNING: THE DIFF BELOW IS TRUNCATED. Only ${DIFF_KEPT_BYTES} of"
              echo "${DIFF_FULL_BYTES} bytes are shown; the rest of the change is NOT visible"
              echo "to you. You have therefore not seen the whole change and MUST NOT answer"
              echo "APPROVE — answer REQUEST_CHANGES and say in the summary that the diff was"
              echo "too large to review in full."
              echo
            fi
            echo "Unified diff${DIFF_TRUNCATED_LABEL}:"
            echo '```diff'
            cat /tmp/pr.diff
            echo '```'
            echo
            echo "Respond with ONLY a single-line JSON object, no prose, no code fence:"
            echo '{"decision":"APPROVE"|"REQUEST_CHANGES","summary":"<=280 chars"}'
          } > /tmp/prompt.txt

      # --- Primary reviewer: GitHub Models (free, different model family) -----
      - name: GitHub Models review
        id: ghmodels
        if: steps.scope.outputs.skip == 'false'
        continue-on-error: true   # any failure → Claude fallback
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          model: openai/gpt-4o
          prompt-file: /tmp/prompt.txt
          max-tokens: 400

      # --- Submit the GitHub Models verdict ----------------------------------
      - name: Submit review (GitHub Models)
        if: steps.scope.outputs.skip == 'false' && steps.ghmodels.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RESPONSE: ${{ steps.ghmodels.outputs.response }}
          DIFF_TRUNCATED: ${{ steps.scope.outputs.diff_truncated }}
          DIFF_FULL_BYTES: ${{ steps.scope.outputs.diff_full_bytes }}
          DIFF_KEPT_BYTES: ${{ steps.scope.outputs.diff_kept_bytes }}
          GENERATED_EXCLUDED: ${{ steps.scope.outputs.generated_excluded }}
        run: |
          set -euo pipefail
          # Extract the first {...} JSON object; tolerate stray prose. Same fix as the
          # diff-truncation step (#359): write to a file first, THEN filter with
          # head/grep -m1 — piping straight into a command that can stop reading early
          # lets the writer get SIGPIPE (exit 141) under pipefail. max-tokens: 400 keeps
          # $RESPONSE small enough that this hasn't been observed failing in practice,
          # but the pattern is identical to the one that did fail on a real PR — fixed
          # here too rather than leaving a second instance of the same footgun.
          printf '%s' "$RESPONSE" > /tmp/response.txt
          JSON="$(grep -oE '\{.*\}' -m1 /tmp/response.txt || true)"
          DECISION="$(printf '%s' "$JSON" | jq -r '.decision // "REQUEST_CHANGES"')"
          SUMMARY="$(printf '%s' "$JSON" | jq -r '.summary // "no summary"')"

          # Coverage footer — the reader must be able to tell what the verdict
          # was actually based on. A green tick on a fragment of the diff reads
          # exactly like a green tick on the whole thing, which is the failure
          # class this repo works hardest to avoid (#2088).
          FOOTER=""
          if [ "${GENERATED_EXCLUDED:-0}" -gt 0 ]; then
            FOOTER="${FOOTER}
          _Excluded ${GENERATED_EXCLUDED} CI-generated file(s) (OPA bundles, derived catalogs, lockfiles, CHANGELOGs) from the reviewed diff — they are regenerated, not hand-written._"
          fi
          if [ "$DIFF_TRUNCATED" = "true" ]; then
            FOOTER="${FOOTER}
          ⚠️ **Partial review — the diff was truncated.** Only ${DIFF_KEPT_BYTES} of ${DIFF_FULL_BYTES} diff bytes fit the model's request budget, so this verdict covers PART of the change only. Do not read it as a clean pass; a human should review the rest."
            # Belt and braces: even if the model ignored the in-prompt
            # instruction and answered APPROVE, an approval based on a fragment
            # must not be posted as an approving review.
            if [ "$DECISION" = "APPROVE" ]; then
              echo "::warning::model returned APPROVE on a truncated diff — downgrading to a comment review"
              DECISION="REQUEST_CHANGES"
            fi
          fi
          BODY="🤖 **Agent review (GitHub Models · gpt-4o)**

          ${SUMMARY}
          ${FOOTER}

          _Automated independent review. Sensitive changes are always deferred to a human._"
          if [ "$DECISION" = "APPROVE" ]; then
            gh pr review "$PR" --approve --body "$BODY"
          else
            # Advisory only — a COMMENT review surfaces the concern inline without
            # blocking the merge (REQUEST_CHANGES would; see the NON-BLOCKING note
            # in the header). main-protection requires 0 approvals, so this never
            # weakens the gate.
            gh pr review "$PR" --comment --body "$BODY"
          fi

      # --- Fallback reviewer: Claude (subscription OAuth, no paid API) --------
      # Runs only if GitHub Models failed AND the secret is configured. The action
      # is agentic: it reads the PR and submits its own review via gh.
      - name: Claude review (fallback)
        id: claude
        if: >-
          steps.scope.outputs.skip == 'false' &&
          steps.ghmodels.outcome == 'failure' &&
          env.HAS_CLAUDE == 'true'
        # The action exits 0 even when its own transcript says the run failed, so its
        # step outcome carries no information either way. The verdict is the guard
        # step below, which reads the transcript. continue-on-error keeps a genuine
        # action-level crash from skipping that guard.
        continue-on-error: true
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # v1 passes tool restrictions through claude_args, not an allowed_tools input.
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr view:*)"'
          prompt: >-
            You are an independent, adversarial reviewer for PR
            #${{ github.event.pull_request.number }} in a banking-grade
            Quarkus/Kotlin monorepo. Read the diff with `gh pr diff`, and the PR
            description with `gh pr view` — the description is author-provided
            context (risk assessment, mitigations); treat it as claims to verify
            against the diff, not as truth. Default to
            skepticism. This review is ADVISORY (main-protection requires 0
            approvals) — surface concerns, do not block the merge. Then submit your
            verdict with EXACTLY ONE of:
            `gh pr review ${{ github.event.pull_request.number }} --approve --body "..."`
            (only if clearly correct, in-scope, low-risk) or, if you have concerns,
            `gh pr review ${{ github.event.pull_request.number }} --comment --body "..."`
            (a non-blocking comment — never --request-changes).
            Prefix the body with "🤖 Agent review (Claude · fallback)".

      # --- The fallback must not be able to report a review that never happened ----
      # claude-code-action exits 0 even when its transcript records the run as failed.
      # That is exactly how #2161 stayed invisible: the OAuth token was rejected at the
      # gateway on the first model call (`is_error: true`, `num_turns: 1`,
      # `total_cost_usd: 0`, ~2s) and GitHub recorded a successful step in a successful
      # job. The standby reviewer was dead and every available signal said it was fine.
      #
      # `always()` so a crashed action still reaches the guard; the `skipped` test keeps
      # it silent on the overwhelmingly common path where the primary reviewer worked.
      # Failing here is safe: this job is non-blocking and not a required check, so a red
      # means "no review happened", never "this PR is rejected".
      - name: Verify the Claude fallback actually reviewed
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/check-claude-fallback-result.sh "$EXECUTION_FILE"
