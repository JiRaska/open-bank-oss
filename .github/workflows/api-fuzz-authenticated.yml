# ─────────────────────────────────────────────────────────────────────────────
# Authenticated API fuzzing (schemathesis + Keycloak) — the #852 follow-up to
# api-fuzz.yml, which only fuzzes the UNAUTHENTICATED surface.
# ─────────────────────────────────────────────────────────────────────────────
# The unauthenticated lane can only reach endpoints that answer without a token;
# everything behind @Authorize answers 401 and is never actually exercised. This
# lane obtains a real bearer token from a throwaway Keycloak (client_credentials)
# and fuzzes the AUTHENTICATED surface with the same property: no input — however
# malformed — produces a 5xx. That is where the interesting money-path bugs live
# (authz-bypass, IDOR-shaped inputs, parameter coercion behind auth).
#
# Target selection: a service whose OIDC authN is the only gate — i.e.
# authz.enforce=false (no OPA sidecar needed). Measured 2026-08-01: 17 of the 20
# money-path services qualify; sdd, sanctions and vop default AUTHZ_ENFORCE=true and
# additionally need the OPA sidecar + rest.rego bundle (a later step, tracked with #266).
# The list is DERIVED from rules.yaml money_path_services and each service's own config,
# so a service that flips either way is picked up without editing this file.
#
# WHY THE REALM FILE IS NAMED openbank-realm.json (#2365): Keycloak's directory import
# derives the REALM NAME from the filename, `<realm>-realm.json`. It was called
# openbank-fuzz-realm.json, so Keycloak looked for a realm "openbank-fuzz" while the JSON
# declares "openbank" — it imported openbank, then died with "Session not bound to a
# realm". That is why this lane had 0 successful runs, ever. Renaming the file IS the fix;
# its contents were always correct. Do not rename it back to something descriptive.
#
# DISPATCH-ONLY on purpose: this lane boots Keycloak + Postgres + Redis + the
# service and depends on OIDC issuer/audience alignment that must be confirmed by
# its first manual run before it is trusted on a schedule. Promote to a weekly
# `schedule:` trigger once it has run green manually (keeps main free of unvetted
# weekly red). Batch-lane semantics otherwise identical to api-fuzz.yml (ADR-0053).
name: API fuzz (authenticated)

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated modules to fuzz (blank = derived money-path set with authz.enforce=false)"
        required: false
        default: ""
      max_examples:
        description: "Hypothesis examples per endpoint"
        required: false
        default: "50"

permissions:
  contents: read

concurrency:
  group: api-fuzz-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: derive fuzz scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.derive.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Eligibility is a PROPERTY of each service's config, not a list someone maintains:
      # authz.enforce must default false (OIDC is then the only gate), and the harness must be
      # able to derive a port and provision a database. Ineligible services are excluded OUT
      # LOUD with the reason — a silently shortened list reads as "covered".
      - name: Derive service list
        id: derive
        env:
          OVERRIDE: ${{ github.event.inputs.services }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, yaml

          override = (os.environ.get("OVERRIDE") or "").split()
          money = yaml.safe_load(open("openbank-libs/governance/rules.yaml"))["money_path_services"]
          candidates = override or money

          keep, skipped = [], []
          for svc in candidates:
              app = pathlib.Path(svc) / "src/main/resources/application.yaml"
              spec = pathlib.Path(svc) / "src/main/resources/openapi.yaml"
              if not app.is_file() or not spec.is_file():
                  skipped.append((svc, "no application.yaml or openapi.yaml")); continue
              raw = app.read_text()
              enforce = re.findall(r"AUTHZ_ENFORCE[^\n]*", raw)
              if any(re.search(r":\s*true", e) for e in enforce):
                  skipped.append((svc, "authz.enforce defaults true — needs the OPA sidecar (#266)")); continue
              if not re.search(r"^  http:\n(?:.*\n)?\s*port:\s*(\d+)", raw, re.M):
                  skipped.append((svc, "no derivable quarkus.http.port")); continue
              if not re.search(r"jdbc:postgresql://[^/]+/([A-Za-z0-9_]+)", raw):
                  skipped.append((svc, "no jdbc:postgresql URL — the harness cannot provision its DB")); continue
              keep.append(svc)

          for svc, why in skipped:
              print(f"::warning::api-fuzz-authenticated: {svc} EXCLUDED — {why}")
          print(f"fuzzing {len(keep)} service(s); {len(skipped)} excluded")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("services=" + json.dumps(keep) + "\n")
          PY

  fuzz-authenticated:
    name: "schemathesis auth (${{ matrix.service }})"
    needs: prepare
    runs-on: ubuntu-latest  # public repo => hosted runners free (FinOps: hosted-first)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      POSTGRES_PASSWORD: "fuzz-ci-throwaway"
      OIDC_CLIENT_SECRET: "fuzz-ci-throwaway-secret"   # matches the realm import client secret
      SERVICE: ${{ matrix.service }}
      MAX_EXAMPLES: ${{ github.event.inputs.max_examples || '50' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Warm Gradle wrapper
        run: ./gradlew --version

      - name: Install schemathesis
        run: |
          set -euo pipefail
          # Same pinned, hash-locked lockfile as api-fuzz.yml (v4 CLI flags below).
          python3 -m pip install --user --quiet --require-hashes \
            -r .github/workflows/requirements/schemathesis.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start Keycloak (throwaway realm)
        run: |
          set -euo pipefail
          docker run -d --name fuzz-keycloak -p 8543:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/.github/workflows/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm --http-enabled=true
          # Realm ready = the token endpoint answers.
          KC_UP=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:8543/realms/openbank/.well-known/openid-configuration || true)"
            if [ "$code" = "200" ]; then KC_UP=1; break; fi
            sleep 3
          done
          if [ "$KC_UP" != "1" ]; then
            echo "::error::Keycloak/realm never became ready"; docker logs fuzz-keycloak | tail -40; exit 1
          fi

      - name: Fuzz authenticated surface
        run: |
          set -uo pipefail
          svc="$SERVICE"
          mkdir -p fuzz-reports
          APP_YAML="${svc}/src/main/resources/application.yaml"
          SPEC="${svc}/src/main/resources/openapi.yaml"
          PORT="$(grep -m1 -A3 '^  http:' "$APP_YAML" | grep -m1 'port:' | grep -oE '[0-9]+')"
          DB="$(grep -m1 'jdbc:postgresql://\|postgresql://' "$APP_YAML" | sed -E 's|.*/([A-Za-z0-9_]+).*|\1|')"
          DBUSER="$(grep -m1 '^    username:' "$APP_YAML" | awk '{print $2}')"
          DBUSER="${DBUSER:-openbank}"
          echo "==> [${svc}] port=${PORT} db=${DB} user=${DBUSER}"

          docker run -d --name fuzz-pg -p 5432:5432 \
            -e POSTGRES_USER="${DBUSER}" -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            -e POSTGRES_DB="${DB}" postgres:16.3-alpine >/dev/null
          # consent-service uses Redis for idempotency — in the request path, so it
          # must be up (unlike Kafka, which is lazy behind the outbox).
          docker run -d --name fuzz-redis -p 6379:6379 redis:7.2-alpine >/dev/null
          for i in $(seq 1 30); do
            docker exec fuzz-pg pg_isready -U "${DBUSER}" >/dev/null 2>&1 && break; sleep 2
          done

          # Boot with OIDC ENABLED (override the %dev oidc.enabled=false) pointed at
          # the throwaway Keycloak. authz.enforce stays false for this target, so no
          # OPA sidecar is needed — OIDC authN is the only gate being exercised.
          echo "==> [${svc}] starting quarkusDev with OIDC on"
          ./gradlew ":${svc}:quarkusDev" \
            -Dquarkus.console.basic=true --console=plain --quiet \
            -Dquarkus.datasource.jdbc.url="jdbc:postgresql://localhost:5432/${DB}" \
            -Dquarkus.oidc.enabled=true \
            -Dquarkus.oidc.auth-server-url=http://localhost:8543/realms/openbank \
            -Dquarkus.oidc.client-id=openbank-services \
            -Dquarkus.oidc.credentials.secret="${OIDC_CLIENT_SECRET}" \
            > "fuzz-reports/${svc}-boot.log" 2>&1 &
          DEV_PID=$!
          UP=0
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/q/health" || true)"
            if [ "$code" != "000" ]; then UP=1; break; fi
            kill -0 "$DEV_PID" 2>/dev/null || break
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "::error::[${svc}] failed to boot"
            # A blind `tail` puts the root cause above the window — every ERROR and every
            # `Caused by:` is what actually identifies it (issue #3039: six of seven services
            # were "not determined" purely because of this).
            echo "--- boot failure: ERROR lines and cause chain ---"
            sed -E 's/\x1b\[[0-9;]*m//g' "fuzz-reports/${svc}-boot.log" \
              | grep -E ' ERROR |Caused by:|Failed to start|Port already bound' \
              | grep -v 'ht.wire' | tail -40
            echo "--- last 40 lines ---"
            tail -40 "fuzz-reports/${svc}-boot.log"
            echo "(full log in the api-fuzz-auth-reports-${svc} artifact)"
            exit 1
          fi

          # client_credentials token for the confidential service client.
          TOKEN="$(curl -s -X POST \
            http://localhost:8543/realms/openbank/protocol/openid-connect/token \
            -d grant_type=client_credentials \
            -d client_id=openbank-services \
            -d client_secret="${OIDC_CLIENT_SECRET}" | jq -r '.access_token')"
          if [ -z "${TOKEN:-}" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::could not obtain a bearer token from Keycloak"; exit 1
          fi
          echo "==> got bearer token (len ${#TOKEN})"

          echo "==> [${svc}] fuzzing authenticated surface on :${PORT}"
          schemathesis run "$SPEC" \
            --url "http://localhost:${PORT}" \
            --header "Authorization: Bearer ${TOKEN}" \
            --checks not_a_server_error \
            --max-examples "${MAX_EXAMPLES}" \
            --request-timeout 5 \
            --report junit --report-junit-path "fuzz-reports/${svc}-auth-junit.xml" \
            | tee "fuzz-reports/${svc}-auth-fuzz.log"
          RC=${PIPESTATUS[0]}

          kill "$DEV_PID" 2>/dev/null || true
          pkill -f "quarkusDev" 2>/dev/null || true
          docker rm -f fuzz-pg fuzz-redis fuzz-keycloak >/dev/null 2>&1 || true
          exit "$RC"

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-fuzz-auth-reports-${{ matrix.service }}
          path: fuzz-reports/
          retention-days: 30
