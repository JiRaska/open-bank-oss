# Native (Mandrel/GraalVM) build + cold-start smoke test for product-catalog.
#
# ADR-0083 Enabler 1 / risk analysis: native build cost (RAM-hungry, ~3-5 min) must NOT
# sit on the JVM PR gate. This workflow is therefore deliberately NOT triggered on
# `pull_request` and must never be added to branch-protection required status checks —
# it is a diagnostic/measurement lane, run on demand or after a merge that touches the
# native Dockerfile, not a merge gate.
#
# What this validates: that Dockerfile.native actually compiles to a native executable
# and that the resulting container serves traffic — i.e. Enabler 1 from ADR-0083. It
# does NOT validate the ADR-0083 promotion gate (measured p95 cold-start under the real
# KEDA HTTP add-on in the sandbox cluster) — that requires deploying to the cluster,
# which is out of scope for a GitHub Actions job with no cluster network access
# (rules.yaml: ci_runners — this lane needs no cluster network, so it runs GitHub-hosted).
# Promoting `openbank-product-catalog` to T1 in rules.yaml:finops_tiers.declared still
# requires that separate, cluster-side measurement (see ADR-0083 "Pilot plan" step 5).
#
# The "EXPECTED RED / issue #253: the image 500s on every request" note that stood here
# from 2026-07-05 was WRONG about this lane, and stating an expected failure is how it
# went unread for 39 runs (issue #4026). The image never got as far as serving a request:
# the smoke test started the container with no database, no OIDC opt-out, and polled the
# WRONG PORT. Flyway (`migrate-at-start: true`) hit `Connection refused` against
# localhost:5432 and the app aborted at boot, so every run failed at "never reported
# ready" — a defect in this workflow, not evidence about the native image. The three
# fixes are inline below. Do not re-add an "expected red" note: a lane that is allowed
# to be red tells you nothing on the day it goes red for a new reason.
name: Product Catalog Native Build (T1 enabler smoke test)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "openbank-product-catalog/**"
      - ".github/workflows/product-catalog-native-build.yml"

permissions:
  contents: read

concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  group: product-catalog-native-build-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  native-build-smoke-test:
    name: Build native image + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # FIX 1 of 3 (#4026): product-catalog runs `quarkus.flyway.migrate-at-start: true`, so
    # it needs a reachable Postgres to finish booting. There was none, and Flyway's
    # `Connection refused` aborted startup on all 39 runs. Credentials/db name match the
    # defaults in application.yaml so the container needs no datasource overrides.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openbank
          POSTGRES_PASSWORD: CHANGE_ME_LOCAL_DEV_ONLY
          POSTGRES_DB: openbank_products
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbank -d openbank_products"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build native image (Mandrel container build)
        run: |
          docker build \
            -f openbank-product-catalog/Dockerfile.native \
            -t product-catalog:native-ci \
            .

      # FIX 2 of 3 (#4026): `--network host` so the container reaches the `postgres`
      # service on localhost:5432; QUARKUS_OIDC_TENANT_ENABLED=false because there is no
      # Keycloak here and OIDC discovery against localhost:8080 aborts boot (the `%test`
      # profile that disables it does not apply to this prod-profile binary).
      # FIX 3 of 3 (#4026): readiness lives on the MANAGEMENT port 8085 (`quarkus.
      # management.port`, root-path /q), not on 8104. The old poll of 8104/q/health/ready
      # could never have returned 200 even with a healthy app.
      - name: Cold-start smoke test
        run: |
          set -euo pipefail
          START=$(date +%s%N)
          CID=$(docker run -d --network host \
            -e QUARKUS_OIDC_TENANT_ENABLED=false \
            product-catalog:native-ci)
          READY=0
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:8085/q/health/ready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 0.5
          done
          END=$(date +%s%N)
          docker logs "$CID" || true
          docker stop "$CID" >/dev/null || true

          if [ "$READY" -ne 1 ]; then
            echo "::error::native image never reported ready within the smoke-test budget"
            exit 1
          fi

          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "Cold start (container start -> /q/health/ready): ${ELAPSED_MS} ms"
          echo "NOTE: this measures container-runtime start on a GitHub-hosted runner, not"
          echo "the ADR-0083 promotion-gate metric (p95 cold start behind the KEDA HTTP"
          echo "add-on interceptor in the sandbox cluster). Treat this as a build-health"
          echo "signal only; the real promotion measurement happens in-cluster."
