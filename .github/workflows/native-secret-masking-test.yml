# Credential-free regression fixture for native reusable-workflow secret masking.
# Public markers deliberately reach worker headers/output; inspect that worker's
# downloaded raw log for redaction and the visible plain-env positive control.
name: Native secret masking fixture

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/record-agent-merge.py'
      - '.github/scripts/test-record-agent-merge.py'
      - '.github/workflows/record-agent-merge.yml'
      - '.github/workflows/_read-agent-merge.yml'
      - '.github/workflows/native-secret-masking-test.yml'
      - '.github/workflows/_native-secret-masking-fixture.yml'

permissions: {}

concurrency:
  group: native-secret-masking-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-secret-masking:
    uses: ./.github/workflows/_native-secret-masking-fixture.yml
    # Public deterministic fixtures, never repository variables or stored secrets.
    secrets:
      fixture_url: PUBLIC_NATIVE_URL_MARKER_84d1af0c9e7b
      fixture_issuer: PUBLIC_NATIVE_ISSUER_MARKER_62c8b5e0a4f9
