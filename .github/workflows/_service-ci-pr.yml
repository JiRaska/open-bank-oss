# Generated by generate-service-ci-jobs.py from the canonical _service-ci.yml build job.
# Edit the canonical source; this PR projection is never hand-edited.
name: _service-ci-pr
'on':
  workflow_call:
    inputs:
      service:
        description: Service directory, e.g. openbank-ledger-service
        required: true
        type: string
      ref:
        description: Commit to check out and publish the verification against. Blank = the triggering ref.
        required: false
        default: ''
        type: string
      provider_version:
        description: Provider version to publish. Blank = checked-out ref.
        required: false
        default: ''
        type: string
      consumer:
        description: Optional consumer name; blank verifies every consumer.
        required: false
        default: ''
        type: string
      historical_admin_ui_version:
        description: Validated one-off admin-ui version for product-catalog; blank keeps normal selection.
        required: false
        default: ''
        type: string
      require_provider_pact_test:
        description: Fail when this targeted verification has no providerPactTest.
        required: false
        default: false
        type: boolean
    outputs:
      platform_results:
        description: Typed platform job results; callers strictly validate the result-only schema.
        value: ${{ toJSON(jobs) }}
    secrets:
      PACT_BROKER_PASSWORD:
        description: "Pact Broker password (ADR-0092) \u2014 publishing pacts + verification results."
        required: false
permissions:
  contents: read
jobs:
  build:
    name: ${{ inputs.service }} (build)
    runs-on: ${{ inputs.service == 'openbank-context-service' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && inputs.ref == '' && 'ubuntu-24.04-arm' || (contains(fromJSON(vars.MINI_RUNNER_SERVICES || '[]'), inputs.service)
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'openbank-mini'
      || 'ubuntu-latest') }}
    timeout-minutes: 45
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ref == '' && 'gradle-cache-writer'
      || '' }}
    permissions:
      contents: read
      actions: read
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref != '' && github.sha || '' }}
        fetch-depth: ${{ inputs.ref == '' && 1 || 0 }}
    - name: Stage trusted service CI step helpers
      run: 'set -euo pipefail

        helper_dir="$(mktemp -d "${RUNNER_TEMP}/service-ci-helpers.XXXXXX")"

        cp .github/scripts/service-ci-steps/*.sh "$helper_dir/"

        cp .github/scripts/heal-gradle-verification-failure.sh "$helper_dir/"

        chmod 600 "$helper_dir/"*.sh

        bash "$helper_dir/diagnostic-actions.sh" stage "$helper_dir"

        echo "SERVICE_CI_HELPERS=$helper_dir" >> "$GITHUB_ENV"

        '
    - name: Stage trusted build retry helpers
      if: inputs.ref != ''
      run: "set -euo pipefail\nfor helper in retry-testcontainers-ebusy.sh retry-gradle-verification-cache.sh heal-gradle-verification-failure.sh;\
        \ do\n  cp \".github/scripts/${helper}\" \"${RUNNER_TEMP}/${helper}\"\ndone\n"
    - name: Check out historical service source with trusted helpers
      if: inputs.ref != ''
      env:
        REF: ${{ inputs.ref }}
      run: "set -euo pipefail\nbash .github/scripts/tests/test-resolve-historical-service-ref.sh\ngit fetch --quiet origin\
        \ main\nresolved_ref=\"$(bash .github/scripts/resolve-historical-service-ref.sh \"$REF\")\"\ngit merge-base --is-ancestor\
        \ \"$resolved_ref\" origin/main || {\n  echo '::error::Historical provider ref is not on main.'\n  exit 1\n}\ngit\
        \ checkout --detach --quiet \"$resolved_ref\"\nfor helper in retry-testcontainers-ebusy.sh retry-gradle-verification-cache.sh\
        \ heal-gradle-verification-failure.sh; do\n  cp \"${RUNNER_TEMP}/${helper}\" \".github/scripts/${helper}\"\ndone\n\
        bash \"$SERVICE_CI_HELPERS/diagnostic-actions.sh\" restore \"$SERVICE_CI_HELPERS\"\n"
    - name: Resolve GRADLE_USER_HOME
      run: echo "GRADLE_USER_HOME=${HOME}/.gradle" >> "$GITHUB_ENV"
    - name: Remote build cache
      env:
        W: ${{ secrets.GRADLE_CACHE_WRITE_PASSWORD }}
        R: ${{ vars.GRADLE_CACHE_READ_PASSWORD }}
        U: ${{ vars.GRADLE_CACHE_URL }}
        H: ${{ inputs.ref }}
      run: bash -e "$SERVICE_CI_HELPERS/remote-build-cache.sh"
    - name: Normalize DOCKER_HOST for Testcontainers (#873)
      run: bash -e "$SERVICE_CI_HELPERS/normalize-docker-host.sh"
    - name: Raise fs.aio-max-nr for Testcontainers (best-effort, Linux)
      continue-on-error: true
      timeout-minutes: 1
      run: bash -e "$SERVICE_CI_HELPERS/raise-aio-max-nr.sh"
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: '21

          25

          '
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      with:
        cache-disabled: false
        cache-read-only: true
        gradle-home-cache-strict-match: false
    - name: Prepare optional context test ordering
      if: inputs.service == 'openbank-context-service' && inputs.ref == ''
      timeout-minutes: 1
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash -e "$SERVICE_CI_HELPERS/prepare-context-test-ordering.sh"
    - name: Build + test (:${{ inputs.service }})
      env:
        SERVICE: ${{ inputs.service }}
        DEPLOY_ARTIFACT_PILOT: ${{ inputs.service == 'openbank-context-service' && github.event_name == 'push' && github.ref
          == 'refs/heads/main' && inputs.ref == '' }}
      run: bash -e "$SERVICE_CI_HELPERS/build-test.sh"
    - name: Retain Gradle task profile
      if: always() && (inputs.service == 'openbank-lending-service' || inputs.service == 'openbank-pension-service')
      continue-on-error: true
      uses: ./.github/actions/service-ci-gradle-profile
      env:
        SERVICE: ${{ inputs.service }}
    - name: Package verified context deployment build
      id: deploy_bundle
      continue-on-error: true
      if: inputs.service == 'openbank-context-service' && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        inputs.ref == ''
      env:
        ANALYTICS_SINK_TYPE: clickhouse
        AGENT_SVID_NONCE_STORE: redis
      run: bash -e "$SERVICE_CI_HELPERS/package-context-deployment.sh"
    - name: Retain verified context deployment build
      if: steps.deploy_bundle.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-build-openbank-context-service-${{ github.sha }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/deploy-build/deploy-build.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Explain a Docker registry pull failure (diagnostic)
      if: failure()
      run: "python3 .github/scripts/check-testcontainers-registry-failure.py \\\n  --service \"${{ inputs.service }}\"\n"
    - name: openapi request-schema conformance
      run: "SPEC=\"${{ inputs.service }}/src/main/resources/openapi.yaml\"\nif [ ! -f \"$SPEC\" ]; then\n  echo \"openapi-request-schema-conformance:\
        \ ${{ inputs.service }} has no openapi.yaml \u2014 skipping.\"\n  exit 0\nfi\npython3 .github/scripts/check-openapi-request-schema-conformance.py\
        \ \\\n  --service \"${{ inputs.service }}\" \\\n  --generated \"${{ inputs.service }}/build/openapi-generated/openapi.yaml\"\
        \ \\\n  --enforce\n"
    - name: Generate Kover XML report
      id: coverage_report
      continue-on-error: true
      env:
        SERVICE: ${{ inputs.service }}
      run: timeout --kill-after=10s 600s bash -e "$SERVICE_CI_HELPERS/render-coverage-report.sh"
    - name: Retain coverage and Test Intelligence evidence
      if: always()
      continue-on-error: true
      uses: ./.github/actions/service-ci-coverage-evidence
      env:
        SERVICE: ${{ inputs.service }}
        SERVICE_CI_JOB_STATUS: ${{ job.status }}
        SERVICE_CI_REPORT_OUTCOME: ${{ steps.coverage_report.outcome }}
    - name: Collect consumer pacts for hand-off to the contract job
      run: 'set -euo pipefail

        mkdir -p pact-handoff

        shopt -s nullglob

        files=(pacts/${{ inputs.service }}-*.json)

        for f in "${files[@]}"; do cp "$f" pact-handoff/; done

        echo "pact-count=${#files[@]}" > pact-handoff/manifest.txt

        echo "Collected ${#files[@]} consumer pact file(s) for hand-off."

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: consumer-pacts-${{ inputs.service }}
        path: pact-handoff/
        if-no-files-found: error
        retention-days: 3
    - name: Upload test reports
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-reports-${{ inputs.service }}-a${{ github.run_attempt }}
        path: ${{ inputs.service }}/build/reports/tests
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload quality evidence (every run)
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: quality-evidence-${{ inputs.service }}-a${{ github.run_attempt }}
        path: '${{ inputs.service }}/build/test-results/**/*.xml

          ${{ steps.coverage_report.outcome == ''success'' && format(''{0}/build/reports/kover/report.xml'', inputs.service)
          || '''' }}

          '
        if-no-files-found: ignore
        retention-days: 7
    - name: Check Test Intelligence compatibility evidence
      id: test-intelligence-compatibility
      if: always()
      env:
        SERVICE: ${{ inputs.service }}
        EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: bash -e "$SERVICE_CI_HELPERS/check-test-intelligence-compat.sh"
    - name: Upload Test Intelligence evidence
      if: always() && steps.test-intelligence-compatibility.outputs.ready == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-intelligence-${{ inputs.service }}
        path: '${{ inputs.service }}/build/test-intelligence/run.json

          ${{ inputs.service }}/build/test-results/**/*.xml

          ${{ steps.coverage_report.outcome == ''success'' && format(''{0}/build/reports/kover/report.xml'', inputs.service)
          || '''' }}

          '
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
