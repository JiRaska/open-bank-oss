# Dependency Review — blocks PRs that introduce vulnerable dependencies.
# Compares the dependency graph before/after and fails if new CVEs are added.
# Free for public repos; no GitHub Advanced Security required.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    # Sized from an end-to-end measurement on a real dependency-touching PR, not from the
    # submission's runtime alone: the resolve itself took 734 s, but the snapshot only
    # became queryable ~24 min after this job started (GitHub indexes the submitted graph
    # after the API call returns). At timeout-minutes: 25 that run cleared by 48 s — one
    # slow queue away from a spurious red on an honest PR. 35 leaves real headroom.
    # Only dependency-touching PRs wait at all; the rest finish in ~7 s (retry disarmed).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Whether to wait for a Gradle snapshot depends on whether one is coming: the retry
      # below must be armed ONLY when dependency-submission.yml is also running for this PR,
      # i.e. when the same paths it filters on changed. Measured the hard way — with the
      # retry armed unconditionally this job sat >11 min on a PR that touched no manifest
      # at all, because GitHub reports a snapshot warning for the head SHA regardless (the
      # Gradle graph is inherited from main, never submitted for this SHA). That would have
      # taxed the ~93% of PRs this feature has nothing to say about.
      #
      # Same merge-base resolution as ci.yml's shared diff-base step, and for the same
      # reason: pull_request.base.sha is frozen at PR creation and misclassifies once a
      # competing PR merges first.
      - name: Detect dependency-manifest changes
        id: deps
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA}"
          git fetch --depth=2 origin "${GITHUB_SHA}" 2>/dev/null || true
          if git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --depth=1 origin "${base}" 2>/dev/null || true
          fi
          # Keep this list in sync with dependency-submission.yml's path filters.
          # Here-string, not a pipe: `set -o pipefail` + `grep -q` exiting early SIGPIPEs
          # the producer and fails the step (a known footgun in this repo's workflows).
          files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          if grep -qE '(^|/)build\.gradle\.kts$|^openbank-libs/gradle/libs\.versions\.toml$|^settings\.gradle\.kts$|^gradle/wrapper/' <<< "${files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifests changed — will wait for the Gradle snapshot from dependency-submission.yml."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest touched — no Gradle submission runs for this PR, so nothing to wait for."
          fi

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # This action only ever diffs SUBMITTED dependency graphs. Gradle — the fleet's
          # primary language — is not natively parsed by GitHub, so until
          # dependency-submission.yml also ran on pull_request (#1419) the Gradle half of
          # every PR was invisible here and vulnerable deps landed unreviewed, to surface
          # later as Dependabot alerts on main.
          #
          # Armed only on dependency-touching PRs (see the detect step above): there the
          # submission job runs concurrently with this one, so the head-SHA snapshot does
          # not exist yet when this starts ("No snapshots were found for the head SHA")
          # and we must wait for it.
          #
          # gradle/actions documents 600 s. Measured end-to-end on a real dependency PR,
          # the snapshot only became queryable ~24 min in (734 s resolve + GitHub's own
          # indexing lag afterwards), so 600 — and even 1200 — undershoot reality. 1800.
          retry-on-snapshot-warnings: ${{ steps.deps.outputs.changed == 'true' }}
          retry-on-snapshot-warnings-timeout: 1800
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # allow-dependencies-licenses: none currently — the schemathesis 3.39.16 rfc3987
          # (GPL-3.0-or-later) suppression that used to live here was retired once the
          # 4.22.3 migration dropped rfc3987 from the resolved set entirely. Re-add only
          # with a fresh justification and a tracking issue.
          #
          # allow-ghsas: DELIBERATELY EMPTY (issue #2833).
          #
          # This carried seven suppressions — json-smart 2.5.0, netty-handler 4.2.1 and
          # netty-codec-http2 4.1.119 — every one of them added to silence a coordinate that
          # no service can load. #2874 removed the cause instead: those versions were resolved
          # only by `detachedConfiguration*` and the root buildscript `classpath`, which the
          # fleet-wide `force()` pins cannot reach, and they are no longer submitted at all.
          # Measured on the first filtered submission (f64ac653d): graph 1235 -> 1091
          # coordinates, vulnerability findings 30 -> 3, and all three survivors are `moderate`,
          # i.e. below fail-on-severity.
          #
          # WHY EMPTY MATTERS, not just tidier: an allow-ghsas entry is a permanent fleet-wide
          # suppression. It silences the pre-existing false positive it was added for AND a
          # future PR that genuinely introduces that same GHSA on a real classpath. Every entry
          # here was therefore buying noise reduction with a hole in the gate.
          #
          # Before adding an entry, establish that the coordinate is not resolved on a real
          # classpath — the extractor answers this directly:
          #   ./gradlew -I init.gradle --dependency-verification=off --no-configuration-cache \
          #     --no-configure-on-demand :ForceDependencyResolutionPlugin_resolveAllDependencies
          # then read `resolvedBy` in build/reports/dependency-graph-snapshots/
          # dependency-resolution.json. A coordinate with one resolvedBy entry naming a detached
          # or buildscript configuration is a graph artifact — fix the submission filter in
          # dependency-submission.yml, do not allowlist it. One naming a real *Classpath is a
          # genuine finding: bump the pin.

      # The gate above PROCEEDS on an invalid basis instead of failing (issue #2833, item 4).
      #
      # dependency-review compares two SUBMITTED graphs. When one side has no snapshot it
      # logs a warning, exhausts retry-on-snapshot-warnings, prints
      # `Retry timeout exceeded. Proceeding...`, and then reports a normal pass/fail computed
      # from a diff that treated the ENTIRE head graph as additions. Both outcomes are wrong
      # and neither is distinguishable from a real verdict: a green means "not evaluated",
      # a red means "every pre-existing dependency, re-flagged".
      #
      # #2837 made every main commit submit, so the systemic cause is gone — but a branch
      # whose merge-base predates that fix, or a submission that failed outright, still lands
      # here. This step makes that state RED and says why, instead of letting the gate claim
      # a verdict it did not earn.
      #
      # Only armed on dependency-touching PRs: with no Gradle submission in flight there is no
      # Gradle graph on either side and nothing to assert.
      #
      # Deliberately checks the submission RUN, not snapshot queryability. GitHub indexes a
      # submitted graph some seconds after the API call returns, so asserting the snapshot
      # itself would flake; asserting the run catches the case that actually caused #2833
      # (no submission was ever scheduled for that SHA) and accepts the narrow window where a
      # run has succeeded but is not yet indexed.
      #
      # Last step in the job on purpose — nothing runs after it, so failing here costs no
      # downstream work.
      - name: Assert the dependency diff had a valid basis
        if: ${{ success() && steps.deps.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/dependency-submission.yml/runs"

          mb="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
                  --jq '.merge_base_commit.sha' 2>/dev/null || true)"
          if [ -z "${mb}" ]; then
            echo "::warning title=basis unverified::Could not resolve the merge-base; skipping the basis assertion rather than failing on an API hiccup."
            exit 0
          fi

          # `status=success` is NOT a usable filter on this endpoint: measured on the real API,
          # `?head_sha=<sha>&status=success` answers total_count 0 for a run whose own JSON reads
          # status=completed, conclusion=success, while the identical query WITHOUT the filter
          # answers 1. So this step failed PRs for a condition that was satisfied — #4397 had a
          # successful submission 22 minutes before the assertion ran and was still told there
          # was none. Filter on `conclusion` client-side instead, which is the field that
          # actually carries the verdict.
          count() {
            gh api "${runs_api}?head_sha=$1&per_page=100" \
              --jq '[.workflow_runs[]|select(.conclusion=="success")]|length' 2>/dev/null || echo ""
          }
          base_runs="$(count "${mb}")"
          head_runs="$(count "${HEAD_SHA}")"
          if [ -z "${base_runs}" ] || [ -z "${head_runs}" ]; then
            echo "::warning title=basis unverified::Could not query dependency-submission runs; skipping the assertion."
            exit 0
          fi

          echo "merge-base ${mb}: ${base_runs} successful submission run(s)"
          echo "head ${HEAD_SHA}: ${head_runs} successful submission run(s)"

          fail=0
          if [ "${base_runs}" -eq 0 ]; then
            echo "::error title=Dependency review had no base graph::No successful dependency-submission run exists for the merge-base ${mb}, so the Gradle half of this review compared against nothing and reported the whole head graph as additions. Rebase onto current main — every main commit has carried a snapshot since #2837, so a current merge-base resolves. See issue #2833."
            fail=1
          fi
          if [ "${head_runs}" -eq 0 ]; then
            echo "::error title=Dependency review had no head graph::No successful dependency-submission run exists for the head ${HEAD_SHA}. Check the Dependency submission workflow for this PR — if it failed, the Gradle half of this review is vacuous. See issue #2833."
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1

          echo "Both sides of the dependency diff had a submitted graph — the verdict above is about this PR's delta."
