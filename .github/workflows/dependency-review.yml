# Dependency Review — blocks PRs that introduce vulnerable dependencies.
# Compares the dependency graph before/after and fails if new CVEs are added.
# Free for public repos; no GitHub Advanced Security required.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # Read-only, for the "Assert the dependency diff had a valid basis" step: it queries the
  # Checks API (`commits/{sha}/check-runs`, issue #5066) instead of the Actions "list workflow
  # runs" endpoint, and that call needs `checks: read` explicitly once any `permissions:` key
  # is declared here (an unlisted scope defaults to none, not "whatever GITHUB_TOKEN would
  # otherwise get").
  checks: read

concurrency:
  group: dependency-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    # Sized from an end-to-end measurement on a real dependency-touching PR, not from the
    # submission's runtime alone: the resolve itself took 734 s, but the snapshot only
    # became queryable ~24 min after this job started (GitHub indexes the submitted graph
    # after the API call returns). At timeout-minutes: 25 that run cleared by 48 s — one
    # slow queue away from a spurious red on an honest PR. 50 also contains the bounded
    # installation-quota recovery below plus the final basis retry: a 15.5 min API wait,
    # a measured 24 min snapshot/indexing path and ~5 min basis retry fit without turning
    # a transient GitHub 403 into a timeout.
    # Only dependency-touching PRs wait at all; the rest finish in ~7 s (retry disarmed).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Whether to wait for a Gradle snapshot depends on whether one is coming: the retry
      # below must be armed ONLY when dependency-submission.yml is also running for this PR,
      # i.e. when the same paths it filters on changed. Measured the hard way — with the
      # retry armed unconditionally this job sat >11 min on a PR that touched no manifest
      # at all, because GitHub reports a snapshot warning for the head SHA regardless (the
      # Gradle graph is inherited from main, never submitted for this SHA). That would have
      # taxed the ~93% of PRs this feature has nothing to say about.
      #
      # Same merge-base resolution as ci.yml's shared diff-base step, and for the same
      # reason: pull_request.base.sha is frozen at PR creation and misclassifies once a
      # competing PR merges first.
      - name: Detect dependency-manifest changes
        id: deps
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA}"
          git fetch --depth=2 origin "${GITHUB_SHA}" 2>/dev/null || true
          if git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --depth=1 origin "${base}" 2>/dev/null || true
          fi
          # Keep this list in sync with dependency-submission.yml's path filters.
          # Here-string, not a pipe: `set -o pipefail` + `grep -q` exiting early SIGPIPEs
          # the producer and fails the step (a known footgun in this repo's workflows).
          files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          if grep -qE '(^|/)build\.gradle\.kts$|^openbank-libs/gradle/libs\.versions\.toml$|^settings\.gradle\.kts$|^gradle/wrapper/' <<< "${files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifests changed — will wait for the Gradle snapshot from dependency-submission.yml."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest touched — no Gradle submission runs for this PR, so nothing to wait for."
          fi

      - name: Dependency Review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # This action only ever diffs SUBMITTED dependency graphs. Gradle — the fleet's
          # primary language — is not natively parsed by GitHub, so until
          # dependency-submission.yml also ran on pull_request (#1419) the Gradle half of
          # every PR was invisible here and vulnerable deps landed unreviewed, to surface
          # later as Dependabot alerts on main.
          #
          # Armed only on dependency-touching PRs (see the detect step above): there the
          # submission job runs concurrently with this one, so the head-SHA snapshot does
          # not exist yet when this starts ("No snapshots were found for the head SHA")
          # and we must wait for it.
          #
          # gradle/actions documents 600 s. Measured end-to-end on a real dependency PR,
          # the snapshot only became queryable ~24 min in (734 s resolve + GitHub's own
          # indexing lag afterwards), so 600 — and even 1200 — undershoot reality. 1800.
          retry-on-snapshot-warnings: ${{ steps.deps.outputs.changed == 'true' }}
          retry-on-snapshot-warnings-timeout: 1800
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # allow-dependencies-licenses: none currently — the schemathesis 3.39.16 rfc3987
          # (GPL-3.0-or-later) suppression that used to live here was retired once the
          # 4.22.3 migration dropped rfc3987 from the resolved set entirely. Re-add only
          # with a fresh justification and a tracking issue.
          #
          # allow-ghsas: DELIBERATELY EMPTY (issue #2833).
          #
          # This carried seven suppressions — json-smart 2.5.0, netty-handler 4.2.1 and
          # netty-codec-http2 4.1.119 — every one of them added to silence a coordinate that
          # no service can load. #2874 removed the cause instead: those versions were resolved
          # only by `detachedConfiguration*` and the root buildscript `classpath`, which the
          # fleet-wide `force()` pins cannot reach, and they are no longer submitted at all.
          # Measured on the first filtered submission (f64ac653d): graph 1235 -> 1091
          # coordinates, vulnerability findings 30 -> 3, and all three survivors are `moderate`,
          # i.e. below fail-on-severity.
          #
          # WHY EMPTY MATTERS, not just tidier: an allow-ghsas entry is a permanent fleet-wide
          # suppression. It silences the pre-existing false positive it was added for AND a
          # future PR that genuinely introduces that same GHSA on a real classpath. Every entry
          # here was therefore buying noise reduction with a hole in the gate.
          #
          # Before adding an entry, establish that the coordinate is not resolved on a real
          # classpath — the extractor answers this directly:
          #   ./gradlew -I init.gradle --dependency-verification=off --no-configuration-cache \
          #     --no-configure-on-demand :ForceDependencyResolutionPlugin_resolveAllDependencies
          # then read `resolvedBy` in build/reports/dependency-graph-snapshots/
          # dependency-resolution.json. A coordinate with one resolvedBy entry naming a detached
          # or buildscript configuration is a graph artifact — fix the submission filter in
          # dependency-submission.yml, do not allowlist it. One naming a real *Classpath is a
          # genuine finding: bump the pin.

      # GitHub's dependency-diff endpoint intermittently answers 403 when the
      # installation API quota is exhausted. dependency-review-action maps every
      # 403 to the misleading permanent "not supported" error (upstream #555),
      # even for this public repository with a working dependency graph. A plain
      # workflow rerun later succeeds, but leaves every PR blocked in the meantime.
      #
      # Retry only after the first complete review attempt failed, and wait on the
      # same compare endpoint that backs the action. A real vulnerability also
      # reaches the retry, then fails the second full review identically. API errors
      # remain red after the bounded wait; no result is converted to a pass.
      - name: Wait for dependency-diff API after a failed review
        if: ${{ steps.review.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          delays=(0 30 60 120 240 480)
          for delay in "${delays[@]}"; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" \
              >/tmp/dependency-diff.json 2>/tmp/dependency-diff.error; then
              echo "Dependency-diff API is readable; repeating the full policy review."
              exit 0
            fi
            echo "Dependency-diff API unavailable; retrying after bounded backoff."
          done
          cat /tmp/dependency-diff.error >&2
          # Say WHICH failure this is. The step stays red either way — that is a deliberate
          # decision recorded above, and this does not reverse it — but "could not run" and
          # "found something" must not render identically, which is the distinction #4162 cost
          # this repo to learn. An installation-quota 403 is an environmental answer about the
          # API, not a statement about this PR's dependencies, and on 2026-09-13 it was red on
          # 11 open PRs at once: a red that is never about the diff is how a real finding gets
          # scrolled past.
          if grep -qi "rate limit exceeded for installation" /tmp/dependency-diff.error; then
            echo "::error title=dependency-review: could not run::The dependency-diff API answered" \
                 "HTTP 403 rate-limit for the whole bounded wait (${#delays[@]} attempts). This is" \
                 "the INSTALLATION API quota, exhausted fleet-wide — NOT a dependency finding and" \
                 "not a fault in this PR. Re-run once the quota window resets; if it is red again," \
                 "the quota is the thing to fix (#8690 measures the per-build API cost), not this" \
                 "PR's dependencies."
          else
            echo "::error title=dependency-review: could not run::The dependency-diff API was" \
                 "unreadable for the whole bounded wait and the error is NOT a rate limit — see the" \
                 "text above. This is still not a dependency finding; it is a failure to measure."
          fi
          exit 1

      - name: Dependency Review retry
        if: ${{ steps.review.outcome == 'failure' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: ${{ steps.deps.outputs.changed == 'true' }}
          retry-on-snapshot-warnings-timeout: 1800
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

      # A successful review attempt above can still PROCEED on an invalid basis instead of
      # failing (issue #2833, item 4).
      #
      # dependency-review compares two SUBMITTED graphs. When one side has no snapshot it
      # logs a warning, exhausts retry-on-snapshot-warnings, prints
      # `Retry timeout exceeded. Proceeding...`, and then reports a normal pass/fail computed
      # from a diff that treated the ENTIRE head graph as additions. Both outcomes are wrong
      # and neither is distinguishable from a real verdict: a green means "not evaluated",
      # a red means "every pre-existing dependency, re-flagged".
      #
      # #2837 made every main commit submit, so the systemic cause is gone — but a branch
      # whose merge-base predates that fix, or a submission that failed outright, still lands
      # here. This step makes that state RED and says why, instead of letting the gate claim
      # a verdict it did not earn.
      #
      # Only armed on dependency-touching PRs: with no Gradle submission in flight there is no
      # Gradle graph on either side and nothing to assert.
      #
      # Last step in the job on purpose — nothing runs after it, so failing here costs no
      # downstream work.
      #
      # ── QUERY MECHANISM (issue #5066, second fix — read this before touching `count()`) ──
      #
      # #4397 already replaced a `status=success` query param (proven unusable: it answered
      # total_count 0 for a run whose own JSON read conclusion=success) with a client-side
      # `conclusion=="success"` filter over `GET .../workflows/dependency-submission.yml/runs
      # ?head_sha=<sha>`. That fix was necessary but not sufficient: #5066 measured a
      # dependency-submission run that succeeded at 15:08:22Z still answering ZERO runs from
      # THAT SAME endpoint at 15:26:34Z (18+ minutes later), with a plain re-run of this job
      # finding it at ~15:35Z. Nothing was wrong with the filter this time — the endpoint
      # itself ("List workflow runs for a workflow", filtered by `head_sha`) is backed by a
      # search index GitHub documents as eventually consistent, and under load that lag is
      # not the "a few seconds" the design assumed; it can run into double-digit minutes.
      #
      # The fix is to stop asking that endpoint. `GET /repos/{owner}/{repo}/commits/{sha}
      # /check-runs` is a DIFFERENT backend — the Checks API, which is what actually paints
      # the green/red dots on a PR's own "Checks" tab in something close to real time — and it
      # answers the identical question (did the job that submits the graph succeed for this
      # exact SHA) without going through the laggy search index at all. Query it by SHA and
      # match the CHECK RUN name, which for a workflow_run's job is the job's own `name:`
      # field with no workflow-name prefix — confirmed against a live run of
      # dependency-submission.yml's `submit` job, whose check run is literally named
      # "Submit fleet dependency graph" (see that job's `name:` in dependency-submission.yml).
      #
      # This is defense in depth, not a proof the Checks API can never itself lag — kept as a
      # short bounded retry (5 attempts, linear backoff, ~5 min worst case) so a much smaller
      # residual delay still resolves before this step gives up. It fits inside the 50-minute
      # job budget together with the measured snapshot and quota-recovery paths. If the Checks
      # API turns out to share that failure mode, the fix is a workflow_run trigger on
      # dependency-submission.yml completing (auto-retry-cancelled.yml already listens to that
      # workflow's completion event, so the pattern is proven in this repo) rather than a
      # longer poll here.
      - name: Assert the dependency diff had a valid basis
        if: ${{ success() && steps.deps.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Must equal dependency-submission.yml's `submit` job `name:` exactly (see that
          # file). Not the workflow's top-level `name:` — a check run's `.name` is the JOB
          # name only, GitHub never prefixes it with the workflow name in this field.
          SUBMIT_JOB_NAME: "Submit fleet dependency graph"
        run: |
          set -euo pipefail

          mb="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
                  --jq '.merge_base_commit.sha' 2>/dev/null || true)"
          if [ -z "${mb}" ]; then
            echo "::warning title=basis unverified::Could not resolve the merge-base; skipping the basis assertion rather than failing on an API hiccup."
            exit 0
          fi

          # Checks API, not the Actions "list workflow runs" endpoint — see the header note
          # above for why (issue #5066). `per_page=100` is generous headroom: this only ever
          # returns check runs for ONE commit, and a SHA is re-checked at most a handful of
          # times (submission itself, plus any manual re-runs).
          count() {
            # shellcheck disable=SC2016  # $name is jq's own --arg binding, not a shell var
            gh api "repos/${GITHUB_REPOSITORY}/commits/$1/check-runs?per_page=100" \
              --jq --arg name "${SUBMIT_JOB_NAME}" \
              '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' \
              2>/dev/null || echo ""
          }

          # Bounded retry, defense in depth against residual Checks-API propagation lag —
          # see the header note for why this is expected to be minutes, not the 18-27+ min
          # observed against the old endpoint. Only retries a genuine zero; an API read
          # failure (empty string from count()) still exits via the warning path below on
          # the last attempt, unchanged from before #5066.
          delays=(0 15 30 60 90)
          for delay in "${delays[@]}"; do
            if [ "${delay}" -gt 0 ]; then
              echo "Basis not yet visible via the Checks API — retrying in ${delay}s (issue #5066)."
              sleep "${delay}"
            fi
            base_runs="$(count "${mb}")"
            head_runs="$(count "${HEAD_SHA}")"
            if [ -n "${base_runs}" ] && [ -n "${head_runs}" ] \
               && [ "${base_runs}" -gt 0 ] && [ "${head_runs}" -gt 0 ]; then
              break
            fi
          done

          if [ -z "${base_runs}" ] || [ -z "${head_runs}" ]; then
            echo "::warning title=basis unverified::Could not query dependency-submission check runs; skipping the assertion."
            exit 0
          fi

          echo "merge-base ${mb}: ${base_runs} successful submission check-run(s)"
          echo "head ${HEAD_SHA}: ${head_runs} successful submission check-run(s)"

          fail=0
          if [ "${base_runs}" -eq 0 ]; then
            echo "::error title=Dependency review had no base graph::No successful dependency-submission run exists for the merge-base ${mb}, so the Gradle half of this review compared against nothing and reported the whole head graph as additions. Rebase onto current main — every main commit has carried a snapshot since #2837, so a current merge-base resolves. See issue #2833."
            fail=1
          fi
          if [ "${head_runs}" -eq 0 ]; then
            echo "::error title=Dependency review had no head graph::No successful dependency-submission run exists for the head ${HEAD_SHA} after retrying for up to ~5 minutes. Check the Dependency submission workflow for this PR — if it failed, the Gradle half of this review is vacuous. See issues #2833 and #5066."
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1

          echo "Both sides of the dependency diff had a submitted graph — the verdict above is about this PR's delta."
