# Dependency Review — blocks PRs that introduce vulnerable dependencies.
# Compares the dependency graph before/after and fails if new CVEs are added.
# Free for public repos; no GitHub Advanced Security required.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    # Sized from an end-to-end measurement on a real dependency-touching PR, not from the
    # submission's runtime alone: the resolve itself took 734 s, but the snapshot only
    # became queryable ~24 min after this job started (GitHub indexes the submitted graph
    # after the API call returns). At timeout-minutes: 25 that run cleared by 48 s — one
    # slow queue away from a spurious red on an honest PR. 35 leaves real headroom.
    # Only dependency-touching PRs wait at all; the rest finish in ~7 s (retry disarmed).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Whether to wait for a Gradle snapshot depends on whether one is coming: the retry
      # below must be armed ONLY when dependency-submission.yml is also running for this PR,
      # i.e. when the same paths it filters on changed. Measured the hard way — with the
      # retry armed unconditionally this job sat >11 min on a PR that touched no manifest
      # at all, because GitHub reports a snapshot warning for the head SHA regardless (the
      # Gradle graph is inherited from main, never submitted for this SHA). That would have
      # taxed the ~93% of PRs this feature has nothing to say about.
      #
      # Same merge-base resolution as ci.yml's shared diff-base step, and for the same
      # reason: pull_request.base.sha is frozen at PR creation and misclassifies once a
      # competing PR merges first.
      - name: Detect dependency-manifest changes
        id: deps
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA}"
          git fetch --depth=2 origin "${GITHUB_SHA}" 2>/dev/null || true
          if git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --depth=1 origin "${base}" 2>/dev/null || true
          fi
          # Keep this list in sync with dependency-submission.yml's path filters.
          # Here-string, not a pipe: `set -o pipefail` + `grep -q` exiting early SIGPIPEs
          # the producer and fails the step (a known footgun in this repo's workflows).
          files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          if grep -qE '(^|/)build\.gradle\.kts$|^openbank-libs/gradle/libs\.versions\.toml$|^settings\.gradle\.kts$|^gradle/wrapper/' <<< "${files}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifests changed — will wait for the Gradle snapshot from dependency-submission.yml."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest touched — no Gradle submission runs for this PR, so nothing to wait for."
          fi

      # Diff against the MERGE-BASE, not `pull_request.base.sha` (issue #2833).
      #
      # A correct delta needs the base to satisfy BOTH conditions: carry a submitted
      # snapshot, and be an ancestor of the head. `base.sha` is the tip of the base
      # branch, so for any PR that is not freshly rebased it is neither — and when the
      # basis is invalid the action silently falls back to reporting the ENTIRE head
      # graph as additions, re-flagging every pre-existing transitive as if this PR
      # introduced it.
      #
      # Measured 2026-07-31 against head 33334a2db (PR #2751), same head throughout:
      #   base 98fc64c9c  snapshot=yes  ancestor=yes  ->    29 entries (the true delta)
      #   base 27e83b42c  snapshot=yes  ancestor=NO   ->  1235 entries (whole graph)
      #   base add0b5e83  snapshot=NO   ancestor=NO   ->  1235 entries  <- the real base.sha
      # Ancestry alone is enough to break it: row 2 has a perfectly good snapshot.
      #
      # #2837 fixed the snapshot half by submitting a graph for every main commit, which
      # is what makes the merge-base reliably snapshot-bearing from now on. This step is
      # the other half. NOTE this is NOT the `base-ref: main` that was tried and rejected
      # in #2833 — `main` resolves to a tip (not an ancestor); a merge-base is an ancestor
      # by construction.
      #
      # Resolved via the compare API rather than `git merge-base`: actions/checkout is
      # shallow here, and deepening until the merge-base appears is unbounded. Verified
      # the API agrees with git on a real pair — `.merge_base_commit.sha` for
      # add0b5e83...33334a2db returns 51364286f, identical to `git merge-base`.
      - name: Resolve the merge-base to diff against
        id: mb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fall back to base.sha rather than failing the gate: a resolution hiccup should
          # degrade to today's (noisier) behaviour, not block every PR. The warning is the
          # signal that the diff is untrustworthy — silence here would be the #2833 bug
          # reintroduced one level up.
          if mb="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
                    --jq '.merge_base_commit.sha' 2>/dev/null)" && [ -n "${mb}" ]; then
            echo "Merge-base of ${BASE_SHA} and ${HEAD_SHA}: ${mb}"
          else
            mb="${BASE_SHA}"
            echo "::warning title=merge-base unresolved::Could not resolve the merge-base; falling back to pull_request.base.sha (${BASE_SHA}). The dependency diff may report pre-existing packages as additions."
          fi
          echo "sha=${mb}" >> "$GITHUB_OUTPUT"

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Both refs pinned explicitly so they are a coherent pair. head-ref is set to the
          # value the action already defaults to on `pull_request` — the PR head SHA, which
          # is what the Gradle snapshot is keyed on (the failing run's log named exactly
          # this SHA: "No snapshots were found for the head SHA 33334a2db..."), so this is
          # a no-op made visible rather than a behaviour change.
          base-ref: ${{ steps.mb.outputs.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          # This action only ever diffs SUBMITTED dependency graphs. Gradle — the fleet's
          # primary language — is not natively parsed by GitHub, so until
          # dependency-submission.yml also ran on pull_request (#1419) the Gradle half of
          # every PR was invisible here and vulnerable deps landed unreviewed, to surface
          # later as Dependabot alerts on main.
          #
          # Armed only on dependency-touching PRs (see the detect step above): there the
          # submission job runs concurrently with this one, so the head-SHA snapshot does
          # not exist yet when this starts ("No snapshots were found for the head SHA")
          # and we must wait for it.
          #
          # gradle/actions documents 600 s. Measured end-to-end on a real dependency PR,
          # the snapshot only became queryable ~24 min in (734 s resolve + GitHub's own
          # indexing lag afterwards), so 600 — and even 1200 — undershoot reality. 1800.
          retry-on-snapshot-warnings: ${{ steps.deps.outputs.changed == 'true' }}
          retry-on-snapshot-warnings-timeout: 1800
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # allow-dependencies-licenses: none currently — the schemathesis 3.39.16 rfc3987
          # (GPL-3.0-or-later) suppression that used to live here was retired once the
          # 4.22.3 migration dropped rfc3987 from the resolved set entirely. Re-add only
          # with a fresh justification and a tracking issue.
          #
          # allow-ghsas: GHSA-pq2g-wx69-c263 (net.minidev:json-smart Uncontrolled Recursion,
          # issue #461). json-smart:2.5.0 is a POM-only BOM constraint stub that never
          # resolves onto any real classpath — confirmed independently via
          # gradle/verification-metadata.xml, which records only a `.pom` artifact for
          # 2.5.0 (no `.jar` ever downloaded) while 2.5.2 (the fleet's real, force()-pinned
          # floor in openbank.dependency-vulnerability-pins.gradle.kts) has both. The
          # osv-scanner.toml PackageOverrides ignore entry for the same coordinate/version
          # documents the identical reasoning for that separate scanner; this suppression
          # is that same, already-established conclusion applied to dependency-review,
          # which otherwise flags a BOM-management-only entry as if it were an in-use
          # dependency. Re-verify against verification-metadata.xml before ever removing —
          # if a future dependency starts resolving 2.5.0 for real, this must be dropped.
          #
          # GHSA-3qp7-7mw8-wx86 / GHSA-x4gw-5cx5-pgmh / GHSA-c653-97m9-rcg9 (io.netty:
          # netty-handler 4.2.1, issue #1446): the 4.2.x netty line resolves ONLY on the
          # Gradle dependency-graph-extraction tooling classpath
          # (org.gradle:github-dependency-graph-gradle-plugin, per #1385), never on any
          # shipped service classpath — no project-level graph pulls netty-handler at 4.2.x,
          # and the runtime line is force()-pinned to 4.1.136.Final in
          # openbank.dependency-vulnerability-pins.gradle.kts. A force() cannot reach the
          # plugin classpath, and forcing 4.2.x would override the 4.1.136 the runtime needs
          #
          # GHSA-f6hv-jmp6-3vwv / GHSA-prj3-ccx8-p6x4 / GHSA-w9fj-cfpg-grvv (io.netty:
          # netty-codec-http2 4.1.110 — MadeYouReset, CONTINUATION flood, decompression
          # bomb): the same class as the #1446 entries above, one classpath over — 4.1.110
          # resolves only on the settings/tooling classpath the graph-extraction plugin
          # itself pulls (it surfaced the first time a PR added a brand-new module to the
          # settings auto-include, #2751). Verified: every service runtime graph resolves
          # netty-codec-http2 at the 4.1.136.Final force() floor
          # (:openbank-campaign-service:dependencies --configuration testRuntimeClasspath
          # shows 4.1.135 -> 4.1.136), so the flagged version never ships in a service artefact.
          # GHSA-pwqr-wmgm-9rr8 / GHSA-jppx-w49h-x2qq / GHSA-57rv-r2g8-2cj3 /
          # GHSA-6jqx-86gh-f27w / GHSA-mvh2-crg5-v77c (io.netty: netty-codec-http 4.1.119):
          # identical class on the identical classpath — the graph-extraction plugin's own
          # netty stack, flagged under `settings.gradle.kts »` in the same #2751 review.
          # Same verification: service runtime graphs pin 4.1.136.Final via force().
          # — trading a real regression for an alert on a classpath that never ships. If a
          # service ever resolves netty 4.2.x for real, these three must be dropped.
          allow-ghsas: GHSA-pq2g-wx69-c263, GHSA-3qp7-7mw8-wx86, GHSA-x4gw-5cx5-pgmh, GHSA-c653-97m9-rcg9, GHSA-f6hv-jmp6-3vwv, GHSA-prj3-ccx8-p6x4, GHSA-w9fj-cfpg-grvv, GHSA-pwqr-wmgm-9rr8, GHSA-jppx-w49h-x2qq, GHSA-57rv-r2g8-2cj3, GHSA-6jqx-86gh-f27w, GHSA-mvh2-crg5-v77c
