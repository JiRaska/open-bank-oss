# Platform OpenTofu (ADR-0060). Applies sandbox-platform from CI so a merged infra change
# is no longer left for a laptop `tofu apply`.
#
#   pull_request / push -> read-only plan; only a fixed result reaches the public summary
#       (PLAN role, batch lane). On a PR this is the pre-merge preview.
#   workflow_dispatch   -> `apply` job: manual "Run workflow" on main (deploy
#       lane, admin APPLY role). It re-plans with `-out=tfplan` and applies THAT
#       file in the same job, so the executed change is exactly the freshly
#       computed plan against current (locked) state; a stale plan is rejected.
#
# Why manual dispatch, not auto-on-merge: a reviewer-gated GitHub Environment is
# the stronger design, but environment protection rules need GitHub Pro/Team on a
# private repo (Free returns 422 — ADR-0060). So the gate is: a human dispatches
# the apply (write access required) after privately reviewing the proposed plan, and the
# admin APPLY role's trust is pinned to THIS workflow file on main
# (job_workflow_ref) so nothing else can assume it. Upgrade to an Environment
# gate if the plan allows.
#
# Auth is GitHub OIDC -> IAM (no static AWS keys). Roles + trust live in
# envs/sandbox-platform/ci-tofu-apply.tf. State is S3 with use_lockfile=true.
name: Platform OpenTofu

on:
  pull_request:
    paths:
      - "openbank-infra/aws/envs/sandbox-platform/**"
      - ".github/workflows/platform-tofu.yml"
      - ".github/scripts/private-platform-command.py"
      - ".github/scripts/test-private-platform-output.py"
      - ".github/scripts/private-credential-action-output.cjs"
      - ".github/scripts/test-private-credential-action-output.py"
      - ".github/scripts/check-admin-ui-evidence-plan.py"
      - ".github/scripts/test-admin-ui-evidence-plan.py"
  push:
    branches: [main]
    paths:
      - "openbank-infra/aws/envs/sandbox-platform/**"
      - ".github/workflows/platform-tofu.yml"
      - ".github/scripts/private-platform-command.py"
      - ".github/scripts/test-private-platform-output.py"
      - ".github/scripts/private-credential-action-output.cjs"
      - ".github/scripts/test-private-credential-action-output.py"
      - ".github/scripts/check-admin-ui-evidence-plan.py"
      - ".github/scripts/test-admin-ui-evidence-plan.py"
  workflow_dispatch:
    inputs:
      scope:
        description: Apply scope
        type: choice
        options:
          - platform
          - admin-ui-evidence
        default: platform
        required: true

permissions:
  contents: read

concurrency:
  group: platform-tofu-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.PLATFORM_TOFU_AWS_REGION }}
  TOFU_VERSION: "1.12.1"
  ENV_DIR: openbank-infra/aws/envs/sandbox-platform

jobs:
  plan:
    permissions:
      contents: read
      id-token: write  # OIDC -> tofu plan role
    name: tofu plan (preview)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest # hosted-first (public repo, free); OIDC plan role unchanged (ADR-0060)
    timeout-minutes: 20
    env:
      PLATFORM_ROLE: ${{ secrets.PLATFORM_TOFU_PLAN_ROLE }}
      TF_VAR_governance_gh_pat: ${{ secrets.GOVERNANCE_GH_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test private platform output
        run: |
          python3 .github/scripts/test-private-platform-output.py
          python3 .github/scripts/test-private-credential-action-output.py

      # These masked settings mirror the existing roles and region; no fallback
      # to an ambient identity. Configure them before enabling this workflow.
      - name: Require masked platform configuration
        run: |
          if [ -z "$PLATFORM_ROLE" ] || [ -z "$AWS_REGION" ]; then
            echo "::error::Masked platform configuration is required."
            exit 1
          fi
          # Register the account before STS can emit an error containing it.
          if [[ ! "$PLATFORM_ROLE" =~ ^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9_+=,.@/-]+$ ]]; then
            echo "::error::Masked platform role configuration is invalid."
            exit 1
          fi
          printf '::add-mask::%s\n' "${BASH_REMATCH[1]}"

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        # Preserve the pinned authentication action and runner control files.
        # Only masking commands reach stdout; action diagnostics stay private.
        env:
          NODE_OPTIONS: '${{ env.NODE_OPTIONS }} --require="${{ github.workspace }}/.github/scripts/private-credential-action-output.cjs"'
        with:
          role-to-assume: ${{ env.PLATFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # The custom ARC runner image ships docker/jq/yq/trivy but NOT the AWS CLI,
      # and the kubernetes/helm/kubectl providers authenticate via
      # `exec: aws eks get-token` (providers.tf) — so tofu needs `aws` on PATH.
      # Install v2 without root/unzip (python3 is present via the image's yamllint).
      # Durable follow-up: bake awscli into the runner image (runner-image/Dockerfile).
      - name: Ensure AWS CLI
        run: |
          if command -v aws >/dev/null; then aws --version; exit 0; fi
          # Arch-aware: the openbank-batch pool mixes ARC Graviton (aarch64) and Hetzner
          # (x86_64) hosts, so a hardcoded aarch64 bundle gives "Exec format error" (exit
          # 126) when the job lands on an x86_64 host. Map uname -m to the AWS CLI suffix.
          case "$(uname -m)" in
            aarch64 | arm64) aws_arch=aarch64 ;;
            x86_64 | amd64) aws_arch=x86_64 ;;
            *) aws_arch=aarch64 ;;
          esac
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/
          # python zipfile extraction drops ALL execute bits; restore them (lowercase
          # x, unconditional). Run the self-contained v2 bundle in place from dist/
          # (no installer needed) and put it on PATH for the tofu steps.
          chmod -R +x /tmp/aws/dist
          echo "/tmp/aws/dist" >> "$GITHUB_PATH"
          /tmp/aws/dist/aws --version

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        working-directory: ${{ env.ENV_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/private-platform-command.py" --stage initialization -- tofu init -input=false

      - name: tofu plan (read-only, no lock)
        working-directory: ${{ env.ENV_DIR }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/private-platform-command.py" --stage preview -- \
            tofu plan -input=false -lock=false -no-color -detailed-exitcode

  # ── Infracost cost delta ───────────────────────────────────────────────────
  # Posts a PR comment with the AWS cost delta introduced by this change.
  # Runs without AWS credentials — Infracost parses HCL and fetches pricing
  # from its own cloud API (free tier). A PR changing only this workflow needs
  # no pricing call; a cost-bearing PR still reports missing pricing credentials.
  infracost:
    permissions:
      contents: read
      pull-requests: write  # infracost PR comment
    name: infracost cost delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 10
    continue-on-error: true   # advisory check; a failed estimate remains visible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect cost-bearing changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/infracost-scope.py platform

      - name: Checkout base branch (for baseline)
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: infracost-base

      - name: Setup Infracost
        if: steps.scope.outputs.run == 'true'
        uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate baseline cost estimate
        if: steps.scope.outputs.run == 'true'
        run: |
          infracost breakdown \
            --path infracost-base/${{ env.ENV_DIR }} \
            --format json \
            --out-file /tmp/infracost-base.json

      - name: Generate cost delta
        if: steps.scope.outputs.run == 'true'
        run: |
          infracost diff \
            --path ${{ env.ENV_DIR }} \
            --format json \
            --compare-to /tmp/infracost-base.json \
            --out-file /tmp/infracost-diff.json

      - name: Post PR comment
        if: steps.scope.outputs.run == 'true'
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo "$GITHUB_REPOSITORY" \
            --github-token "${{ github.token }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --behavior update

  apply:
    permissions:
      contents: read
      id-token: write  # OIDC -> tofu apply role
    name: tofu apply (manual dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # hosted-first; security boundary is the OIDC job_workflow_ref pin + manual dispatch (ADR-0060), not the runner
    timeout-minutes: 30
    # Audit trail + future reviewer gate (issue #282). The openbank-ci-tofu-apply
    # trust policy now accepts the environment-form OIDC sub
    # ("repo:OWNER/REPO:environment:platform-apply") alongside the ref form (#2299),
    # so declaring this environment no longer breaks AssumeRole. Security boundary
    # remains the job_workflow_ref pin + manual dispatch on main (ADR-0060).
    environment: platform-apply
    env:
      PLATFORM_ROLE: ${{ secrets.PLATFORM_TOFU_APPLY_ROLE }}
      TF_VAR_governance_gh_pat: ${{ secrets.GOVERNANCE_GH_PAT }}
      PLAN_SCOPE: ${{ inputs.scope || 'platform' }}
    steps:
      - name: Verify apply dispatch is from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Platform apply must be dispatched from main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test evidence plan guard
        run: python3 .github/scripts/test-admin-ui-evidence-plan.py

      - name: Test private platform output
        run: |
          python3 .github/scripts/test-private-platform-output.py
          python3 .github/scripts/test-private-credential-action-output.py

      # These masked settings mirror the existing roles and region; no fallback
      # to an ambient identity. Configure them before enabling this workflow.
      - name: Require masked platform configuration
        run: |
          if [ -z "$PLATFORM_ROLE" ] || [ -z "$AWS_REGION" ]; then
            echo "::error::Masked platform configuration is required."
            exit 1
          fi
          # Register the account before STS can emit an error containing it.
          if [[ ! "$PLATFORM_ROLE" =~ ^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9_+=,.@/-]+$ ]]; then
            echo "::error::Masked platform role configuration is invalid."
            exit 1
          fi
          printf '::add-mask::%s\n' "${BASH_REMATCH[1]}"

      - name: Configure AWS credentials (OIDC, admin apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        # Preserve the pinned authentication action and runner control files.
        # Only masking commands reach stdout; action diagnostics stay private.
        env:
          NODE_OPTIONS: '${{ env.NODE_OPTIONS }} --require="${{ github.workspace }}/.github/scripts/private-credential-action-output.cjs"'
        with:
          role-to-assume: ${{ env.PLATFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # The custom ARC runner image ships docker/jq/yq/trivy but NOT the AWS CLI,
      # and the kubernetes/helm/kubectl providers authenticate via
      # `exec: aws eks get-token` (providers.tf) — so tofu needs `aws` on PATH.
      # Install v2 without root/unzip (python3 is present via the image's yamllint).
      # Durable follow-up: bake awscli into the runner image (runner-image/Dockerfile).
      - name: Ensure AWS CLI
        run: |
          if command -v aws >/dev/null; then aws --version; exit 0; fi
          # Arch-aware: the openbank-batch pool mixes ARC Graviton (aarch64) and Hetzner
          # (x86_64) hosts, so a hardcoded aarch64 bundle gives "Exec format error" (exit
          # 126) when the job lands on an x86_64 host. Map uname -m to the AWS CLI suffix.
          case "$(uname -m)" in
            aarch64 | arm64) aws_arch=aarch64 ;;
            x86_64 | amd64) aws_arch=x86_64 ;;
            *) aws_arch=aarch64 ;;
          esac
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/
          # python zipfile extraction drops ALL execute bits; restore them (lowercase
          # x, unconditional). Run the self-contained v2 bundle in place from dist/
          # (no installer needed) and put it on PATH for the tofu steps.
          chmod -R +x /tmp/aws/dist
          echo "/tmp/aws/dist" >> "$GITHUB_PATH"
          /tmp/aws/dist/aws --version

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        working-directory: ${{ env.ENV_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/private-platform-command.py" --stage initialization -- tofu init -input=false

      # Re-plan to a file and apply THAT file in the same job: the executed change
      # is exactly this plan, computed against current locked state. If state moved
      # since planning, `tofu apply tfplan` rejects it as stale (no wrong apply).
      - name: tofu plan -out
        working-directory: ${{ env.ENV_DIR }}
        run: |
          set -o pipefail
          umask 077
          targets=()
          if [ "$PLAN_SCOPE" = "admin-ui-evidence" ]; then
            targets=(
              "-target=aws_iam_role.admin_ui_evidence"
              "-target=aws_iam_role_policy.admin_ui_evidence"
              "-target=aws_s3_bucket_policy.test_evidence"
            )
          elif [ "$PLAN_SCOPE" != "platform" ]; then
            echo "::error::Unsupported apply scope."
            exit 1
          fi
          if [ "$PLAN_SCOPE" = "admin-ui-evidence" ]; then
            # The official plan UI stream includes each planned action and its final
            # summary without decoding unrelated legacy provider state (tofu show
            # -json can fail on such state after a targeted plan succeeds).
            plan_json="$(mktemp "$RUNNER_TEMP/admin-ui-evidence-plan.XXXXXX.jsonl")"
            trap 'rm -f "$plan_json"' EXIT
            # stdout is typed input to the existing strict guard, not public output.
            plan_error="$(mktemp "$RUNNER_TEMP/private-platform-plan-error.XXXXXX")"
            tofu plan -input=false -lock-timeout=300s -json -out=tfplan "${targets[@]}" > "$plan_json" 2> "$plan_error"
            sha256sum tfplan > tfplan.sha256
            python3 "$GITHUB_WORKSPACE/.github/scripts/private-platform-command.py" --stage evidence-guard -- \
              python3 "$GITHUB_WORKSPACE/.github/scripts/check-admin-ui-evidence-plan.py" --ui-stream "$plan_json"
          else
            python3 "$GITHUB_WORKSPACE/.github/scripts/private-platform-command.py" --stage plan -- \
              tofu plan -input=false -lock-timeout=300s -no-color -out=tfplan "${targets[@]}"
          fi

      - name: tofu apply (saved plan)
        working-directory: ${{ env.ENV_DIR }}
        run: |
          if [ "$PLAN_SCOPE" = "admin-ui-evidence" ]; then
            sha256sum --check tfplan.sha256
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/private-platform-command.py" --stage apply -- \
            tofu apply -input=false -no-color -lock-timeout=300s tfplan
