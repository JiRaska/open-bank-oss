# SPDX-License-Identifier: Apache-2.0
# Mutation testing — pitest on money-path domain layers (ADR-0063, ADR-0030 D3).
# Run: weekly on Sunday 03:00 UTC (low-traffic window) + manual dispatch.
# NOT part of the per-PR gate (cost); advisory alert on score < 70%.

name: Mutation testing (pitest)

on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC — info.solidsoft.pitest 1.19.0 is Gradle 9 compatible
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated list of service modules to run pitest on (the matrix below is the source of truth)"
        required: false
        default: "openbank-ledger-service openbank-balance-service openbank-account-service openbank-transaction-service openbank-fx-service openbank-sepa-payment openbank-sepa-instant openbank-domestic-payment openbank-fraud-service openbank-sanctions-service"

# Restrictive top-level default (Scorecard Token-Permissions wants an explicit top-level
# block); the pitest job below already declares contents: read too, belt-and-suspenders.
permissions:
  contents: read

jobs:
  pitest:
    name: pitest / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # measured max 414s (ledger); mutation runs are the likeliest to hang
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - openbank-ledger-service
          - openbank-balance-service
          # Fleet rollout (#1266): money-path services with substantive domain math.
          # Thin-domain services (clearing / swift / lending — 1 domain file each) are
          # skipped on purpose — mutation testing there is noise, not signal (ADR-0063).
          - openbank-account-service
          - openbank-transaction-service
          - openbank-fx-service
          # SSDLC-audit rollout (2026-07-06): the payment trio + fraud carry money-movement
          # decision logic (3 domain files each — routing, screening, validation); a surviving
          # mutant there is a real miss. Remaining money-path services stay excluded by the
          # same ADR-0063 thin-domain criterion (sca/consent/billing/clearing 1-2 files,
          # swift/lending 1 file).
          - openbank-sepa-payment
          - openbank-sepa-instant
          - openbank-domestic-payment
          - openbank-fraud-service
          # ADR-0030 issue #265 sweep (2026-07-11): sanctions-service has 3 domain files
          # (SanctionsCheck/SanctionsList/SanctionsEntry — screening/matching decision logic),
          # the same "substantive domain math" shape as the payment trio + fraud above, not
          # the 1-2-file "thin domain" shape that excludes sca/consent/billing/clearing/swift/
          # lending/settlement. Local baseline: 67% mutation kill rate.
          - openbank-sanctions-service

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run pitest on domain layer
        run: ./gradlew :${{ matrix.service }}:pitest
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      - name: Upload pitest XML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/pitest/
          retention-days: 30

      # Advisory, not blocking, ON PURPOSE: true baselines at rollout (2026-07-06 run,
      # after fixing the quote bug below) — account 49%, transaction 46%, balance 55%,
      # ledger 65%, fx 73%. Flip to blocking per service only after it sustains >=70%
      # (rules.yaml money_path_depth; raising kill scores is tracked with the coverage
      # ratchet roadmap).
      - name: Check mutation threshold (advisory)
        if: always()
        run: |
          XML="${{ matrix.service }}/build/reports/pitest/mutations.xml"
          if [ ! -f "$XML" ]; then
            echo "::warning file=$XML::pitest XML report not found — no mutations detected or pitest failed"
            exit 0
          fi
          TOTAL=$(grep -o '<mutation ' "$XML" | wc -l | tr -d ' ')
          # pitest writes SINGLE-quoted XML attributes (status='KILLED'); the original
          # double-quote-only grep silently reported 0% for every service on every run
          # (caught 2026-07-06 against run 28805099041: ledger really scored 65%, not 0%).
          # Accept both quote styles so a pitest quoting change can't zero the score again.
          KILLED=$(grep -oE "status=['\"]KILLED['\"]" "$XML" | wc -l | tr -d ' ')
          if [ "$TOTAL" -eq "0" ]; then
            echo "::warning::No mutations generated for ${{ matrix.service }} domain layer — check targetClasses config"
            exit 0
          fi
          SCORE=$(( KILLED * 100 / TOTAL ))
          echo "Mutation score: ${SCORE}% (${KILLED}/${TOTAL} killed)"
          if [ "$SCORE" -lt "70" ]; then
            echo "::warning::Mutation score ${SCORE}% is below the 70% advisory threshold for ${{ matrix.service }}"
          else
            echo "::notice::Mutation score ${SCORE}% — OK"
          fi
