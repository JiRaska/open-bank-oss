# -----------------------------------------------------------------------------
# Issue hygiene — the link-in-PR lint (ADR-0052, rules.yaml: issues).
#
# Every PR's "Linked issues" section must be consciously addressed: either a
# real reference (Closes/Fixes/Resolves/Refs #<n>) or an explicit N/A. Leaving
# the template placeholder untouched is the failure this gate prevents — it is
# the producer that lets rules.yaml flip `issues.enforced` advisory -> block.
#
# Lives in its own workflow (not ci.yml) so it can subscribe to the `edited`
# event: fixing the PR body must re-evaluate THIS check without re-running the
# whole CI on every description edit. The job name `issue-hygiene` is a
# required status check in the main-protection ruleset — do not rename it.
#
# Exempt (a check that can't sensibly apply has no verdict): release-please and
# other bot PRs, and any PR carrying the `skip-hygiene` escape-hatch label.
# -----------------------------------------------------------------------------
name: Issue hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A required check must also report in the merge queue's `merge_group` context or the
  # queue stalls forever waiting for a status that can never arrive.
  merge_group:

permissions:
  contents: read

concurrency:
  # `github.event.pull_request.number` is EMPTY on merge_group, which would collapse every
  # queue entry into one shared group and let them cancel each other — a wedged queue. Fall
  # back to github.ref, which on merge_group is the per-entry
  # refs/heads/gh-readonly-queue/main/pr-N-<sha> and is therefore unique.
  group: issue-hygiene-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a queue check: a cancelled run reports nothing and the entry hangs.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  issue-hygiene:
    name: issue-hygiene
    # actions/github-script only — no self-hosted-pool dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # measured max 6s
    steps:
      # Deliberate pass-through in the merge queue. This gate lints the PR *body*, which a
      # merge_group payload does not carry — and unlike a code check it cannot go stale
      # between PR and queue, because queueing does not alter the body it already passed on.
      # Branch on the STEP, not the job: a job skipped by an `if:` still reports its own
      # status, so two jobs sharing the name `issue-hygiene` would report two conflicting
      # statuses for one required check.
      - name: Merge queue — already enforced on the pull request
        if: github.event_name == 'merge_group'
        run: echo "merge_group carries no PR body to lint; this gate ran on the PR itself, which queueing does not alter."

      - name: Lint PR "Linked issues"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request
            const author = pr.user?.login ?? ''
            const labels = (pr.labels ?? []).map(l => l.name)
            const headRef = pr.head?.ref ?? ''

            // --- Exemptions -------------------------------------------------
            const botAuthor = author.endsWith('[bot]')
            const isRelease = /^chore(\(.+\))?:\s*release\b/i.test(pr.title ?? '')
              || /^release-please/.test(headRef)
            if (botAuthor || isRelease || labels.includes('skip-hygiene')) {
              core.notice(`issue-hygiene: exempt (author=${author}, release=${isRelease}, `
                + `skip-hygiene=${labels.includes('skip-hygiene')}) — no verdict`)
              return
            }

            const body = pr.body ?? ''
            // Strip HTML comments so the template placeholder doesn't count as content.
            const stripped = body.replace(/<!--[\s\S]*?-->/g, '')

            // Isolate the "Linked issues" section when the template is used; else
            // fall back to scanning the whole (comment-stripped) body. Line-walk
            // rather than one big regex — JS has no \Z, and headings are the clean
            // section boundary.
            const sectionText = (md, title) => {
              const headRe = /^#{1,6}\s+(.*\S)\s*$/
              let inSec = false
              const buf = []
              for (const line of md.split(/\r?\n/)) {
                const h = line.match(headRe)
                if (h) {
                  if (inSec) break
                  if (h[1].trim().toLowerCase() === title.toLowerCase()) inSec = true
                } else if (inSec) {
                  buf.push(line)
                }
              }
              return inSec ? buf.join('\n').trim() : null
            }
            const section = sectionText(stripped, 'Linked issues') ?? stripped.trim()

            // A real reference: "Closes #12", "Fixes #3", "Refs #9", or a bare "#12".
            const refRe = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)?\s*#\d+/i
            // A conscious "no issue" declaration.
            const naRe = /\b(n\/?a|none|no\s+(?:linked\s+)?issue)\b/i

            const hasRef = refRe.test(section)
            const hasNa = section.length > 0 && naRe.test(section)

            if (hasRef || hasNa) {
              core.notice(`issue-hygiene: OK (${hasRef ? 'issue reference' : 'explicit N/A'})`)
              return
            }
            core.setFailed(
              'issue-hygiene: the PR "Linked issues" section is empty or still the template '
              + 'placeholder. Add `Closes #<n>` / `Refs #<n>`, or an explicit `N/A — <reason>`. '
              + '(ADR-0052; bypass with the `skip-hygiene` label.)')
