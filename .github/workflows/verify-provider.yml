# Re-verify + re-publish ONE provider's pact verification on demand (ADR-0092, #2039).
#
# WHY: a main-push provider verification only republishes as part of the full-fleet run, which
# saturates the 6-runner ARC pool and can wedge for hours (#1208/#2039) — so a merged pact/contract
# fix (e.g. #2030's swift status vocab) may sit unverified behind the queue. This dispatches a SINGLE
# provider's build+verify on the ARC pool (broker access), turning a ~30-job wedge into one ~5-min
# job. Same reusable workflow, same publish path (github.ref==main ⇒ PUBLISH_RESULTS=true).
#
# Maintainer-triggered only (workflow_dispatch). Runs on main. No new runners, no full-fleet.
name: Verify one provider

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Provider service dir, e.g. openbank-swift-service"
        required: true
        type: string
      ref:
        # #3306: without this the verification is always published against the tip of main, while
        # can-i-deploy asks about the version the counterpart has DEPLOYED. On a repo merging this
        # often those are different shas nearly always, so a consumer can be blocked indefinitely
        # with no move available. Pass the deployed sha to publish where the gate actually looks.
        # Must be on main — _service-ci.yml refuses anything else.
        description: "Commit to verify and publish against, e.g. a counterpart's deployed sha. Blank = tip of main."
        required: false
        default: ""
        type: string
      provider_version:
        # Blank deliberately means the checked-out ref. A distinct value checks out deployed P,
        # then overlays the one approved Ledger provider-state fixture blob from ref F.
        description: "Provider version P to publish. Blank = ref; distinct P is Ledger-only and uses one approved fixture from ref F."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

# Collapse duplicate dispatches for the SAME provider. The reconciler
# (.github/workflows/pact-verification-reconcile.yml) dispatches once per provider that
# owes a verification, so a fleet-wide libs change that makes many consumers republish
# would otherwise queue one run per tick per provider onto a six-runner ARC pool that
# already wedges for hours (#2039).
#
# cancel-in-progress is FALSE, and the reasoning behind the original `true` is worth
# keeping because it was wrong in an instructive way. The argument was: a provider
# verification is not incremental — it verifies every consumer pact currently required of
# that provider — so the newest run is a strict superset of any run it cancels, and
# cancelling the older one loses nothing. That is true about the WORK. It silently assumed
# the runs get to RUN.
#
# They did not. With the pool saturated, a dispatched verification sits queued for longer
# than the reconciler's 30-minute interval, so every tick cancelled the still-queued
# predecessor and dispatched a fresh one that queued behind the same wall. Observed on
# openbank-kyc-service: runs at 12:25 and 12:31 both cancelled, a third queued at 12:49 —
# the verification never executed, the strand never cleared, and the reconciler kept
# reporting a successful dispatch every time. A livelock that looks like it is working.
#
# With `false`, GitHub holds the newer run as pending and cancels older PENDING runs
# instead, so duplicates are still collapsed to one — but a run that is already underway
# is never killed, which is the only property that actually mattered. The exact wrong
# assumption to avoid re-making: "superseding is free" is only true when the thing being
# superseded was making progress.
concurrency:
  group: verify-provider-${{ inputs.service }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: ${{ inputs.service }}
      ref: ${{ inputs.ref }}
      provider_version: ${{ inputs.provider_version }}
      # A maintainer explicitly requested a provider proof. A no-op consumer-only outcome
      # would otherwise make this workflow green without publishing the promised evidence.
      require_provider_pact_test: true
    secrets:
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
