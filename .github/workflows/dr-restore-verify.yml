# Automated DR restore-and-verify (design: docs/bcp/automated-dr-restore.md).
#
# Proves the ledger-db CNPG backup actually RESTORES and that the restored ledger is
# internally consistent (double-entry invariant holds) — not just that the S3 archive is
# reachable, which is all the table-top exercises confirm today.
#
# It restores ledger-db into a THROWAWAY namespace, boots ledger-service against it (no
# Kafka, no OIDC), asserts GET /api/v1/ledger/close/trial-balance returns balanced:true,
# records measured RTO/RPO, and tears the namespace down.
#
# DISPATCH-ONLY and CLUSTER-GATED: needs a self-hosted runner in the deploy pool with
# kubectl + read-only IRSA for the backup bucket. On a hosted runner it FAILS LOUDLY
# rather than skipping to a green — see the gate step for why that changed (#4026).
# Steps that require live infra are marked `# WIRING:` — the deliberate remaining work
# (see the design doc's "Remaining wiring"). Promote to a quarterly schedule after the
# first green manual run (bcp-policy.md cadence).
name: DR restore verify

on:
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Fiscal year to assert the trial balance for (defaults to current)"
        required: false

permissions:
  contents: read

jobs:
  restore-verify:
    name: Restore ledger-db and verify integrity
    # WIRING: change to the deploy-pool self-hosted label once it exists (kubectl + IRSA).
    # Until then this runs on a hosted runner and self-skips at the gate below.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This gate used to `::notice::` and set run=false, which SKIPPED the restore step
      # and left the job GREEN. Measured on run 31278708228 (2026-08-08, the workflow's
      # first ever dispatch, #4026): conclusion `success`, "Restore, verify, teardown"
      # `skipped` — a DR drill that reports PASS having restored nothing. That is worse
      # than red and worse than never running, because a green is what a compliance
      # registry counts as evidence the control was exercised. It now FAILS instead: the
      # workflow is dispatch-only and is not a required check, so a red costs nothing and
      # says the true thing — this control cannot run here yet.
      - name: Gate on cluster access
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1 && kubectl auth can-i create namespace >/dev/null 2>&1; then
            echo "::notice::Cluster access confirmed — proceeding with the restore."
            exit 0
          fi
          echo "::error::NOT A DR DRILL: no cluster access (kubectl/IRSA) on this runner, so nothing was restored and nothing was verified. This workflow needs a deploy-pool self-hosted runner that does not exist yet, and its restore step is still a WIRING-INCOMPLETE stub. See docs/bcp/automated-dr-restore.md; do not record this run as DR evidence."
          exit 1

      # No `if:` guard — the gate above now fails the job outright rather than setting an
      # output, so reaching this step already means cluster access was proven. A guard
      # here would silently re-introduce the skipped-but-green shape it just removed.
      - name: Restore, verify, teardown
        env:
          FISCAL_YEAR: ${{ inputs.fiscal_year }}
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID:-local}"
          NS="dr-verify-${RUN_ID}"
          FY="${FISCAL_YEAR:-$(date -u +%Y)}"
          cleanup() { kubectl delete namespace "$NS" --ignore-not-found --wait=false || true; }
          trap cleanup EXIT

          kubectl create namespace "$NS"
          RESTORE_START=$(date -u +%s)

          # WIRING: apply the CNPG recovery Cluster (bootstrap.recovery from the ledger-db
          # barman S3 store) + an ephemeral ledger-service Deployment (OUTBOX_DISPATCH_ENABLED
          # =false, OIDC off) into $NS. Templates tracked in the design doc's remaining wiring.
          echo "::error::WIRING INCOMPLETE: CNPG recovery Cluster + ledger-service manifests for \$NS are not yet in-repo (docs/bcp/automated-dr-restore.md). Failing rather than reporting a hollow PASS."
          exit 1

          # --- The verification below is the intended shape once the manifests land: ---
          # kubectl -n "$NS" wait --for=condition=Ready cluster/ledger-db-restored --timeout=30m
          # kubectl -n "$NS" rollout status deploy/ledger-service --timeout=10m
          # kubectl -n "$NS" port-forward svc/ledger-service 18101:8101 &
          # PF=$!; sleep 5
          # BODY="$(curl -sf "http://localhost:18101/api/v1/ledger/close/trial-balance?fiscalYear=${FY}")"
          # kill "$PF" || true
          # RESTORE_END=$(date -u +%s); RTO=$(( RESTORE_END - RESTORE_START ))
          # BALANCED="$(printf '%s' "$BODY" | python3 -c 'import sys,json;print(json.load(sys.stdin)["balanced"])')"
          # if [ "$BALANCED" != "True" ]; then
          #   echo "::error::restored ledger is UNBALANCED — backup integrity FAILED"; exit 1
          # fi
          # echo "::notice::DR restore verified: balanced=true, RTO=${RTO}s (append to docs/bcp/dr-test-log.md)"
