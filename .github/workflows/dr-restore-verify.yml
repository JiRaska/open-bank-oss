# Automated DR restore-and-verify (design: docs/bcp/automated-dr-restore.md).
#
# Proves the ledger-db CNPG backup actually RESTORES and that the restored ledger is
# internally consistent (double-entry invariant holds) — not just that the S3 archive is
# reachable, which is all the table-top exercises confirm today.
#
# It restores ledger-db into a THROWAWAY namespace, boots ledger-service against it (no
# Kafka, no OIDC), asserts GET /api/v1/ledger/close/trial-balance returns balanced:true,
# records elapsed restore/check time and tears the namespace down. This does not yet
# measure RPO or prove cross-service recovery consistency.
#
# Scheduled quarterly and manually dispatchable; requires the cluster-attached DR
# runner. Missing cluster access fails the job instead of reporting a skipped restore
# as successful evidence.
name: DR restore verify

on:
  schedule:
    # Quarterly: 14th of Jan/Apr/Jul/Oct, 03:23 UTC (bcp-policy.md cadence, #8347).
    - cron: "23 3 14 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Fiscal year to assert the trial balance for (defaults to current)"
        required: false

permissions:
  contents: read

jobs:
  restore-verify:
    name: Restore ledger-db and verify integrity
    # openbank-dr (ADR-0277, #8388): scheduled-only lane, no IRSA, ClusterRole
    # openbank-dr (gitops components/platform/dr-runner-rbac.yaml) covers exactly
    # the verbs below. The gate step stays: it now verifies the RBAC live.
    runs-on: openbank-dr
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This gate used to `::notice::` and set run=false, which SKIPPED the restore step
      # and left the job GREEN. Measured on run 31278708228 (2026-08-08, the workflow's
      # first ever dispatch, #4026): conclusion `success`, "Restore, verify, teardown"
      # `skipped` — a DR drill that reports PASS having restored nothing. That is worse
      # than red and worse than never running, because a green is what a compliance
      # registry counts as evidence the control was exercised. It now FAILS instead: the
      # workflow must fail when its prerequisites are unavailable; a skipped restore
      # cannot establish recovery evidence.
      - name: Gate on cluster access
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1 && kubectl auth can-i create namespace >/dev/null 2>&1 \
             && kubectl auth can-i get rollouts.argoproj.io -n ledger >/dev/null 2>&1; then
            echo "::notice::Cluster access confirmed (namespaces + ledger rollouts) — proceeding with the restore."
            exit 0
          fi
          echo "::error::NOT A DR DRILL: no cluster access (kubectl/IRSA) on this runner, so nothing was restored and nothing was verified. This workflow requires the cluster-attached DR runner and its restore RBAC. See docs/bcp/automated-dr-restore.md; do not record this run as DR evidence."
          exit 1

      # No `if:` guard — the gate above now fails the job outright rather than setting an
      # output, so reaching this step already means cluster access was proven. A guard
      # here would silently re-introduce the skipped-but-green shape it just removed.
      - name: Restore, verify, teardown
        env:
          FISCAL_YEAR: ${{ inputs.fiscal_year }}
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          NS="dr-verify-${RUN_ID}"
          FY="${FISCAL_YEAR:-$(date -u +%Y)}"
          NS_CREATED=false
          PF=""
          cleanup() {
            if [ -n "$PF" ]; then
              kill "$PF" 2>/dev/null || true
              wait "$PF" 2>/dev/null || true
            fi
            if [ "$NS_CREATED" = true ]; then
              kubectl delete namespace "$NS" --ignore-not-found --wait=true --timeout=2m
            fi
          }
          trap cleanup EXIT

          kubectl create namespace "$NS"
          NS_CREATED=true
          RESTORE_START=$(date -u +%s)

          # Manifest templates: openbank-infra/gitops/dr-restore-templates/ (#4757).
          # The runner wiring that this comment used to name as the remaining item
          # landed in #8388 (ADR-0277): this job runs on openbank-dr, and the gate
          # step above proves the RBAC live on every run.
          TEMPLATES="openbank-infra/gitops/dr-restore-templates"
          IMAGE="$(kubectl get rollout ledger-service -n ledger \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          [ -n "$IMAGE" ] || { echo "::error::could not read the live ledger-service image — refusing to restore an unspecified build."; exit 1; }

          sed "s#\${NS}#${NS}#g" "$TEMPLATES/cnpg-recovery-cluster.yaml.tmpl" | kubectl apply -f -
          sed "s#\${NS}#${NS}#g; s#\${IMAGE}#${IMAGE}#g" "$TEMPLATES/ledger-service-dr-check.yaml.tmpl" | kubectl apply -f -

          kubectl -n "$NS" wait --for=condition=Ready cluster/ledger-db-restored --timeout=30m
          kubectl -n "$NS" rollout status deploy/ledger-service-dr-check --timeout=10m
          # The template creates a Deployment, not a Service. Forward directly to its pod.
          kubectl -n "$NS" port-forward deployment/ledger-service-dr-check 18101:8101 &
          PF=$!
          BODY="$(curl -sf --retry 20 --retry-connrefused --retry-delay 1 --max-time 10 \
            "http://localhost:18101/api/v1/ledger/close/trial-balance?fiscalYear=${FY}")"
          RESTORE_END=$(date -u +%s); RTO=$(( RESTORE_END - RESTORE_START ))
          BALANCED="$(printf '%s' "$BODY" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("balanced") is True)')"
          if [ "$BALANCED" != "True" ]; then
            echo "::error::restored ledger is UNBALANCED — backup integrity FAILED"; exit 1
          fi

          echo "RTO_SECONDS=${RTO}" >> "$GITHUB_STEP_SUMMARY"
          echo "RPO_NOT_MEASURED: this check does not establish a recovery-point objective." >> "$GITHUB_STEP_SUMMARY"
          echo "restore verified: balanced=true, RTO=${RTO}s"
