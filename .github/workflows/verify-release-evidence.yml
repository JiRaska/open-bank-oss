name: Verify release evidence

# Consumer/auditor side of the release evidence bundle (ADR-0029 D2 / ADR-0030 D4).
# Given a release tag, download its evidence bundle and cryptographically verify every
# document against the AWS KMS cosign key, then check the manifest's digests match the
# files. This is the regulator-facing "how anyone verifies our provenance" tool AND the
# precursor to the enforced provenance.gate — prove the bundle on real releases here
# before flipping enforcement at deploy.
#
# Manual (a specific tag) by default; non-destructive, read-only on the repo.
#
# WEEKLY SCHEDULE (#4026). This workflow was `workflow_dispatch`-only for its whole life
# and had therefore been run exactly ZERO times — so the tool built to verify release
# provenance had never verified a release, and every bundle was unverified by it. Nothing
# was wrong with the workflow: the first dispatch (run 31278713964, tag
# notification-service-v0.18.1) verified 4 cosign/KMS signatures and 3 manifest digests
# and passed. A control whose only trigger is a human remembering is a control that does
# not run; the cron makes it run against the newest release each week. The tag input still
# takes precedence, so auditing a specific tag by hand is unchanged.

on:
  schedule:
    - cron: "0 8 * * 1"   # weekly Monday 08:00 UTC — after vex-triage (07:00)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (default on a schedule: the newest release)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write   # OIDC → assume the build-runner role to read the KMS public key

jobs:
  verify:
    # Not `Verify ${{ inputs.tag }}` any more: on a schedule there is no input and the job
    # rendered as a bare "Verify ".
    name: Verify release evidence bundle
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # TAG is resolved here, not in job-level `env:`, so the scheduled run has one at all.
      # An empty tag must FAIL rather than fall through to a URL ending in `/tags/`, which
      # 404s into a "no signed evidence found" error that reads like a provenance defect
      # instead of an unresolved input.
      - name: Resolve tag
        env:
          REQUESTED: ${{ inputs.tag }}
          # Grace window (issue #6729): a scheduled run must not verify a JUST-CUT
          # release. Evidence assets (SBOM/SLSA/cosign signatures) attach
          # asynchronously after the release object exists — measured 2026-08-24:
          # admin-ui-v0.189.3 had ZERO assets at +4m35s and nine minutes later. The
          # Monday 08:00 cron racing a release-please cut then red-gates a
          # regulator-facing control on a release whose evidence simply has not
          # landed yet. A release older than the window that STILL has no assets is
          # a real finding and still fails below.
          GRACE_MINUTES: 120
        run: |
          set -euo pipefail
          tag="${REQUESTED:-}"
          if [ -n "$tag" ]; then
            # An explicitly requested tag is verified exactly as asked — the operator
            # owns the timing then.
            echo "::notice::explicit tag requested; grace window does not apply"
          else
            tag="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
              | jq -r --argjson grace "${GRACE_MINUTES}" '
                  (now - ($grace * 60)) as $cutoff
                  | [ .[] | select(.draft | not)
                      | select((.created_at | fromdateiso8601) < $cutoff) ]
                  | (sort_by(.created_at) | reverse | .[0].tag_name) // empty')"
            if [ -z "$tag" ]; then
              # Every recent release is inside the grace window. That is a scheduling
              # coincidence, not an evidence failure — say so and pass; next week's
              # cron verifies them once they are outside it.
              echo "::notice::all recent releases are younger than the ${GRACE_MINUTES}m grace window (#6729); nothing verified this run, nothing claimed either"
              exit 0
            fi
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "::notice::verifying evidence bundle for ${tag}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1   # KMS cosign key + ECR live in eu-north-1 (matches auto-deploy)

      - name: Download release assets
        run: |
          set -euo pipefail
          # Use the REST API (gh CLI is absent on part of the openbank-batch runner pool).
          mkdir -p ev && cd ev
          api() { curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          rel="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          echo "$rel" | python3 -c "import json,sys; [print(a['id'], a['name']) for a in json.load(sys.stdin).get('assets',[])]" \
            | while read -r aid aname; do
                curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
                  -o "$aname" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${aid}"
              done
          echo "Downloaded:"; ls -la
          ls *.sig >/dev/null 2>&1 || { echo "::error::no assets found on release ${TAG}"; exit 1; }

      - name: Verify signatures (cosign + KMS) and manifest digests
        run: |
          set -euo pipefail
          COSIGN_KEY="awskms:///alias/openbank-cosign-signing"
          COSIGN_VERSION="v2.4.3"
          arch="$(uname -m)"; case "$arch" in aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"; case "$os" in darwin) os=darwin ;; *) os=linux ;; esac
          bin="$(command -v cosign || true)"
          if ! { [ -n "$bin" ] && cosign version 2>/dev/null | grep -Eq 'GitVersion:[[:space:]]*v2\.'; }; then
            bin="${RUNNER_TEMP}/cosign2"
            # sha256 pins from the release's cosign_checksums.txt — bump together with
            # COSIGN_VERSION (same block as release-please.yml).
            case "${os}-${arch}" in
              linux-amd64)  COSIGN_SHA256="caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708" ;;
              linux-arm64)  COSIGN_SHA256="bd0f9763bca54de88699c3656ade2f39c9a1c7a2916ff35601caf23a79be0629" ;;
              darwin-amd64) COSIGN_SHA256="98a3bfd691f42c6a5b721880116f89210d8fdff61cc0224cd3ef2f8e55a466fb" ;;
              darwin-arm64) COSIGN_SHA256="edfc761b27ced77f0f9ca288ff4fac7caa898e1e9db38f4dfdf72160cdf8e638" ;;
              *) echo "::error::no pinned cosign checksum for ${os}-${arch}"; exit 1 ;;
            esac
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -o "$bin" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${os}-${arch}"
            SHATOOL="sha256sum"; command -v sha256sum >/dev/null 2>&1 || SHATOOL="shasum -a 256"
            echo "${COSIGN_SHA256}  ${bin}" | ${SHATOOL} -c - \
              || { echo "::error::cosign ${COSIGN_VERSION} download failed checksum verification"; exit 1; }
            chmod +x "$bin"
          fi
          cd ev
          rc=0
          shopt -s nullglob
          sigs=( *.sig )
          [ ${#sigs[@]} -gt 0 ] || { echo "::error::no signed evidence found for $TAG"; exit 1; }
          for sig in "${sigs[@]}"; do
            doc="${sig%.sig}"
            if [ ! -f "$doc" ]; then echo "::error::signature $sig without document $doc"; rc=1; continue; fi
            if "$bin" verify-blob --key "$COSIGN_KEY" --signature "$sig" "$doc"; then
              echo "OK signature: $doc"
            else
              echo "::error::cosign verify-blob FAILED for $doc"; rc=1
            fi
          done

          # Cross-check the manifest's recorded digests against the actual files.
          for ev in *.evidence.json; do
            [ -f "$ev" ] || continue
            python3 - "$ev" <<'PY' || rc=1
          import json, sys, hashlib, os
          m = json.load(open(sys.argv[1]))
          def sha(p): return hashlib.sha256(open(p, "rb").read()).hexdigest()
          ok = True
          for key in ("sbom", "slsa_provenance", "vex"):
              ref = m.get(key) or {}
              f, want = ref.get("file"), ref.get("sha256")
              if not f or not want:
                  continue
              if not os.path.exists(f):
                  print(f"::error::{key} file {f} referenced by manifest is missing"); ok = False; continue
              got = sha(f)
              if got != want:
                  print(f"::error::{key} digest mismatch for {f}: manifest {want} != actual {got}"); ok = False
              else:
                  print(f"OK digest: {f}")
          sys.exit(0 if ok else 1)
          PY
          done
          [ "$rc" -eq 0 ] && echo "✅ evidence bundle for $TAG verified" || { echo "❌ verification failed"; exit 1; }
