name: Verify release evidence

# Consumer/auditor side of the release evidence bundle (ADR-0029 D2 / ADR-0030 D4).
# Given a release tag, download its evidence bundle and cryptographically verify every
# document against the AWS KMS cosign key, then check the manifest's digests match the
# files. This is the regulator-facing "how anyone verifies our provenance" tool AND the
# precursor to the enforced provenance.gate — prove the bundle on real releases here
# before flipping enforcement at deploy.
#
# Manual (a specific tag) by default; non-destructive, read-only on the repo.
#
# WEEKLY SCHEDULE (#4026). This workflow was `workflow_dispatch`-only for its whole life
# and had therefore been run exactly ZERO times — so the tool built to verify release
# provenance had never verified a release, and every bundle was unverified by it. Nothing
# was wrong with the workflow: the first dispatch (run 31278713964, tag
# notification-service-v0.18.1) verified 4 cosign/KMS signatures and 3 manifest digests
# and passed. A control whose only trigger is a human remembering is a control that does
# not run. Since #11685 the cron checks the latest release of EVERY versioned component;
# the tag input still takes precedence for a one-release audit by hand.

on:
  schedule:
    - cron: "0 8 * * 1"   # weekly Monday 08:00 UTC — after vex-triage (07:00)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (default on a schedule: every component's latest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      id-token: write  # OIDC -> build-runner role to read the KMS public key
    # Not `Verify ${{ inputs.tag }}` any more: on a schedule there is no input and the job
    # rendered as a bare "Verify ".
    name: Verify release evidence bundle
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 60  # full fleet: release downloads and KMS verification per component
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # The inventory and verifier use the trusted workflow revision together.
      # Pending or unresolved latest releases cannot count as clean observations.
      - name: Resolve release tags
        env:
          REQUESTED: ${{ inputs.tag }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-}"
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "::error::invalid tag"; exit 1; }
            echo "$tag" > tags.txt
            echo "INVENTORY_RC=0" >> "$GITHUB_ENV"
            RELEASE_TAG="$tag" python3 -c 'import json,os; json.dump({"mode":"single_release","tag":os.environ["RELEASE_TAG"],"fleetCoverage":"not_checked"},open("release-inventory.json","w"))'
            echo "::notice::explicit tag requested; grace window does not apply"
          else
            # Keep verifying resolved tags even when another component lacks a release
            # or asset. The inventory verdict is carried into the final result.
            inventory_rc=0
            python3 .github/scripts/check-fleet-release-evidence.py --tags-output tags.txt --report-output release-inventory.json || inventory_rc=$?
            echo "INVENTORY_RC=$inventory_rc" >> "$GITHUB_ENV"
          fi
          [ -s tags.txt ] || { echo "::error::no release tags resolved"; exit 1; }
          echo "::notice::verifying $(wc -l < tags.txt) evidence bundles"

      - name: Resolve release identities
        run: |
          set -euo pipefail
          : > release-identities.tsv
          identity_rc=0
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::release tag has no component and stable version identity"
              identity_rc=1
              continue
            fi
            component="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            if ! commit="$(curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/tags/${tag}" \
              | python3 -c 'import json,re,sys; s=json.load(sys.stdin).get("sha"); assert isinstance(s,str) and re.fullmatch("[0-9a-f]{40}",s), "invalid resolved commit"; print(s)')"; then
              echo "::error::could not resolve release tag to a commit"
              identity_rc=1
              continue
            fi
            printf '%s\t%s\t%s\t%s\n' "$tag" "$component" "$version" "$commit" >> release-identities.tsv
          done < tags.txt
          [ -s release-identities.tsv ] || identity_rc=1
          echo "IDENTITY_RC=$identity_rc" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1   # KMS cosign key + ECR live in eu-north-1 (matches auto-deploy)

      - name: Download release assets
        run: |
          set -euo pipefail
          # Use the REST API (gh CLI is absent on part of the openbank-batch runner pool).
          mkdir -p ev
          api() { curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
          download_rc=0
          while IFS=$'\t' read -r tag _component _version _commit; do
            mkdir -p "ev/$tag"
            if ! rel="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"; then
              echo "::error::release API lookup failed for ${tag}"
              download_rc=1
              continue
            fi
            printf '%s\n' "$rel" > "$RUNNER_TEMP/release-evidence-assets.json"
            # Download only the canonical evidence set, not unrelated release binaries.
            if ! PYTHONPATH=.github/scripts RELEASE_TAG="$tag" \
              RELEASE_JSON_PATH="$RUNNER_TEMP/release-evidence-assets.json" \
              python3 -c 'import json,os; from release_evidence_assets import expected_release_assets; d=json.load(open(os.environ["RELEASE_JSON_PATH"])); assert isinstance(d,dict); assets=d.get("assets"); assert isinstance(assets,list); assert all(isinstance(a,dict) and isinstance(a.get("name"),str) for a in assets); wanted=expected_release_assets(os.environ["RELEASE_TAG"]); selected=[a for a in assets if a["name"] in wanted]; assert len(selected)==len(wanted) and {a["name"] for a in selected}==wanted; assert all(type(a.get("id")) is int and a["id"]>0 and type(a.get("size")) is int and a["size"]>0 for a in selected); [print(str(a["id"])+"\t"+a["name"]) for a in selected]' > "$RUNNER_TEMP/release-evidence-assets.tsv"; then
              echo "::error::required release evidence asset metadata is incomplete or malformed"
              download_rc=1
              continue
            fi
            if ! while IFS=$'\t' read -r aid aname; do
                  curl -fsSL --connect-timeout 10 --max-time 60 \
                    -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
                    -o "ev/$tag/$aname" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" || exit 1
                done < "$RUNNER_TEMP/release-evidence-assets.tsv"; then
              echo "::error::asset download failed for ${tag}"
              download_rc=1
            fi
            if ! compgen -G "ev/$tag/*.sig" >/dev/null; then
              echo "::error::no signed evidence found on release ${tag}"
              download_rc=1
            fi
          done < release-identities.tsv
          echo "DOWNLOAD_RC=$download_rc" >> "$GITHUB_ENV"

      # The official .intoto file receives presence/nonempty checking only.
      # This step verifies the four KMS-signed documents, their manifest and tag identity.
      - name: Verify signatures (cosign + KMS) and manifest digests
        run: |
          set -euo pipefail
          COSIGN_KEY="awskms:///alias/openbank-cosign-signing"
          COSIGN_VERSION="v2.4.3"
          arch="$(uname -m)"; case "$arch" in aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"; case "$os" in darwin) os=darwin ;; *) os=linux ;; esac
          bin="$(command -v cosign || true)"
          if ! { [ -n "$bin" ] && cosign version 2>/dev/null | grep -Eq 'GitVersion:[[:space:]]*v2\.'; }; then
            bin="${RUNNER_TEMP}/cosign2"
            # sha256 pins from the release's cosign_checksums.txt — bump together with
            # COSIGN_VERSION (same block as release-please.yml).
            case "${os}-${arch}" in
              linux-amd64)  COSIGN_SHA256="caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708" ;;
              linux-arm64)  COSIGN_SHA256="bd0f9763bca54de88699c3656ade2f39c9a1c7a2916ff35601caf23a79be0629" ;;
              darwin-amd64) COSIGN_SHA256="98a3bfd691f42c6a5b721880116f89210d8fdff61cc0224cd3ef2f8e55a466fb" ;;
              darwin-arm64) COSIGN_SHA256="edfc761b27ced77f0f9ca288ff4fac7caa898e1e9db38f4dfdf72160cdf8e638" ;;
              *) echo "::error::no pinned cosign checksum for ${os}-${arch}"; exit 1 ;;
            esac
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -o "$bin" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${os}-${arch}"
            SHATOOL="sha256sum"; command -v sha256sum >/dev/null 2>&1 || SHATOOL="shasum -a 256"
            echo "${COSIGN_SHA256}  ${bin}" | ${SHATOOL} -c - \
              || { echo "::error::cosign ${COSIGN_VERSION} download failed checksum verification"; exit 1; }
            chmod +x "$bin"
          fi
          rc=0
          : > release-verification-results.tsv
          while IFS=$'\t' read -r tag component version commit; do
            pushd "ev/$tag" >/dev/null
            shopt -s nullglob
            tag_rc=0
            verified_signatures=0
            sigs=( *.sig )
            [ ${#sigs[@]} -gt 0 ] || { echo "::error::no signed evidence found for $tag"; tag_rc=1; }
            for sig in "${sigs[@]}"; do
              doc="${sig%.sig}"
              if [ ! -f "$doc" ]; then echo "::error::signature $sig without document $doc"; tag_rc=1; continue; fi
              if "$bin" verify-blob --key "$COSIGN_KEY" --signature "$sig" "$doc"; then
                echo "OK signature: $doc"
                verified_signatures=$((verified_signatures + 1))
              else
                echo "::error::cosign verify-blob FAILED for $doc"; tag_rc=1
              fi
            done
            # A missing manifest or omitted digest is a failed audit, not a clean no-op.
            python3 ../../.github/scripts/verify-release-evidence-manifest.py "$tag" \
              --expected-component "$component" --expected-version "$version" --expected-commit "$commit" || tag_rc=1
            popd >/dev/null
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$tag" "$component" "$version" "$commit" "$verified_signatures" "$tag_rc" >> release-verification-results.tsv
            [ "$tag_rc" -eq 0 ] || rc=1
          done < release-identities.tsv
          if [ "$rc" -eq 0 ] && [ "${INVENTORY_RC:-2}" -eq 0 ] && [ "${DOWNLOAD_RC:-2}" -eq 0 ] && [ "${IDENTITY_RC:-2}" -eq 0 ]; then
            echo "✅ every latest evidence bundle verified"
          else
            echo "❌ verification failed"
            exit 1
          fi

      - name: Retain release verification observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-audit-${{ github.run_id }}
          path: |
            release-inventory.json
            release-identities.tsv
            release-verification-results.tsv
          if-no-files-found: warn
