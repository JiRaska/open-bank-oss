# SPDX-License-Identifier: Apache-2.0
#
# Deploy window flusher (see .github/scripts/deploy-window.py).
#
# auto-deploy.yml and admin-ui-deploy.yml open their deploy PR exactly as before. This workflow
# alone arms auto-merge when the window allows it: at most one bot deploy commit reaches main per
# window, because each one makes every open PR `behind` under the strict up-to-date rule and
# restarts its required checks. A deploy they DEFER stays open and unarmed — this workflow is
# what lands it. A workflow_run trigger handles new PRs and the schedule recovers missed runs.
# Each run offers the newest PR of each deploy kind, longest-waiting kind first, once the window
# has elapsed and nothing else is armed, re-runs supersede-deploy-prs.sh on it (ancestry + coverage
# — a rollback PR is refused, never armed; a kind refused for an owner hold falls through), and arms auto-merge with the same App token the deploy
# workflows use. A successful manual dispatch of either producer expedites only its matching PR.
# An open PR labelled merge-priority:repair defers new arming, including manual expedition.
# Draft/blocked repairs retain priority until an owner removes the label or closes the PR.
# This does not revoke already-armed auto-merge; owners must disarm those before repair CI.
# GitHub offers no atomic label-check-and-arm operation; re-reading narrows that race only.

name: Deploy window flush

on:
  workflow_run:
    workflows: ["Auto deploy", "Admin-UI deploy"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-window-flush
  cancel-in-progress: false

jobs:
  flush:
    name: Arm the oldest deferred deploy PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only GITHUB_TOKEN: every write (arming auto-merge, closing a superseded PR) goes through
    # the App token. A GITHUB_TOKEN fallback would arm a merge whose commit triggers no workflows.
    permissions:
      contents: read
    env:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same App token as the deploy workflows: arming with GITHUB_TOKEN would merge a commit
      # that triggers no workflows (anti-recursion), so ArgoCD's downstream checks never run.
      - name: Mint a GitHub App installation token
        id: app_token
        if: env.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Fail closed without the App token
        if: steps.app_token.outputs.token == ''
        run: |
          echo "::error::GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY unavailable - refusing to arm deploy PRs with GITHUB_TOKEN (its merge would trigger no workflows)."
          exit 1

      - name: Pick the deferred deploy PR to arm
        id: pick
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/deploy-window"
          bash .github/scripts/deploy-window-inputs.sh "$d"
          python3 .github/scripts/deploy-window.py flush --prs-json "$d/prs.json" \
            --commits-json "$d/commits.json" --event-json "$GITHUB_EVENT_PATH" \
            --now "$(date -u +%s)" | tee -a "$GITHUB_OUTPUT"

      - name: Install deploy-hold parser
        if: steps.pick.outputs.candidates != ''
        run: |
          python3 -m venv "${RUNNER_TEMP}/deploy-hold-venv"
          "${RUNNER_TEMP}/deploy-hold-venv/bin/python" -m pip install --quiet --require-hashes \
            -r .github/scripts/pyyaml-requirements.txt

      # One candidate per deploy kind, longest-waiting kind first. For each: GitOps image freshness,
      # then supersede-deploy-prs.sh (refuses a rollback). supersede rc 3 = an owner hold overlaps
      # this candidate, so fall through to the next kind: 2026-10-24..29 a held gitops PR failed
      # 160 of 300 runs and admin-ui never armed. Any other refusal still fails the run, unarmed.
      - name: Verify, close superseded PRs, fall through a held kind
        id: select
        if: steps.pick.outputs.candidates != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          CANDIDATES: ${{ steps.pick.outputs.candidates }}
          DEPLOY_HOLD_PYTHON: ${{ runner.temp }}/deploy-hold-venv/bin/python
        run: |
          set -euo pipefail
          fetched=""
          for c in $CANDIDATES; do
            arm="${c%%:*}"
            head="${c#*:}"
            case "$head" in
              chore/gitops-auto-deploy-*) prefix=chore/gitops-auto-deploy- ;;
              chore/admin-ui-deploy-*)    prefix=chore/admin-ui-deploy- ;;
              *) echo "::error::unexpected deploy head ${head}"; exit 1 ;;
            esac
            if [ "$prefix" = chore/gitops-auto-deploy- ]; then
              if [ -z "$fetched" ]; then
                git fetch --depth=100 origin main
                git reset --hard origin/main
                fetched=1
              fi
              gh pr diff "$arm" --repo "$GITHUB_REPOSITORY" \
                | python3 .github/scripts/deploy-window.py verify --root .
            fi
            rc=0
            bash .github/scripts/supersede-deploy-prs.sh "$prefix" "$arm" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "arm=$arm" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$rc" -eq 3 ] || exit "$rc"
            echo "::warning::deploy PR #${arm} is refused for an owner hold - trying the next deploy kind."
          done
          echo "::error::every deploy kind is refused for an owner hold - nothing armed."
          exit 1

      - name: Enable auto-merge
        if: steps.select.outputs.arm != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ARM: ${{ steps.select.outputs.arm }}
        run: |
          set -euo pipefail
          # Re-read the hold state AT arm time (issue #11503): the pick and the supersede step
          # above run minutes earlier, and an owner draft or `blocked` label applied since then —
          # or a hold the supersede step just transferred onto this PR — must still win.
          state="$(gh pr view "$ARM" --repo "$GITHUB_REPOSITORY" --json isDraft,labels \
            --jq 'if .isDraft or ([.labels[].name] | index("blocked")) then "held" else "free" end')"
          if [ "$state" != "free" ]; then
            echo "::error::deploy PR #${ARM} is draft or labelled blocked (deployment hold) - refusing to arm auto-merge."
            exit 1
          fi
          # Re-read complete priority inventory immediately before arming, including manual runs.
          # API/shape failures abort; an explicit repair label has no automatic expiry.
          d="$RUNNER_TEMP/deploy-window-arm"
          bash .github/scripts/deploy-window-inputs.sh "$d"
          if jq -e 'any(.[]; .repair_priority)' "$d/prs.json" >/dev/null; then
            echo "::notice::Open repair-priority PR defers deploy auto-merge."
            exit 0
          fi
          id="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ARM}" --jq .node_id)"
          # shellcheck disable=SC2016  # $id is a GraphQL variable, not a shell one
          gh api graphql -f query='mutation($id: ID!) {
            enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
              pullRequest { number }
            }
          }' -f id="$id" >/dev/null
          echo "auto-merge armed on deferred deploy PR #${ARM}"
