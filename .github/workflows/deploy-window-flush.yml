# SPDX-License-Identifier: Apache-2.0
#
# Deploy window flusher (see .github/scripts/deploy-window.py).
#
# auto-deploy.yml and admin-ui-deploy.yml open their deploy PR exactly as before. This workflow
# alone arms auto-merge when the window allows it: at most one bot deploy commit reaches main per
# window. The App-pinned merge train owns checks, reservations and merging. A deploy they
# DEFER stays open and unarmed until this workflow queues it; this workflow never merges it. A workflow_run trigger handles new PRs and the schedule recovers missed runs.
# Each run picks the OLDEST deferred deploy PR once the window has elapsed
# and nothing else is armed, re-runs supersede-deploy-prs.sh on it (ancestry + coverage — a
# rollback PR is refused, never armed), and arms auto-merge with the same App token the deploy
# workflows use. A successful manual dispatch of either producer expedites only its matching PR.
# An open PR labelled merge-priority:repair defers new arming, including manual expedition.
# Draft/blocked repairs retain priority until an owner removes the label or closes the PR.
# This does not revoke already-armed auto-merge; owners must disarm those before repair CI.
# GitHub offers no atomic label-check-and-arm operation; re-reading narrows that race only.

name: Deploy window flush

on:
  workflow_run:
    workflows: ["Auto deploy", "Admin-UI deploy"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-window-flush
  cancel-in-progress: false

jobs:
  flush:
    name: Arm the oldest deferred deploy PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only GITHUB_TOKEN: every write (arming auto-merge, closing a superseded PR) goes through
    # the App token. A GITHUB_TOKEN fallback would arm a merge whose commit triggers no workflows.
    permissions:
      contents: read
    env:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same App token as the deploy workflows: arming with GITHUB_TOKEN would merge a commit
      # that triggers no workflows (anti-recursion), so ArgoCD's downstream checks never run.
      - name: Mint a GitHub App installation token
        id: app_token
        if: env.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Fail closed without the App token
        if: steps.app_token.outputs.token == ''
        run: |
          echo "::error::GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY unavailable - refusing to arm deploy PRs with GITHUB_TOKEN (its merge would trigger no workflows)."
          exit 1

      - name: Install deploy-hold parser
        run: |
          python3 -m venv "${RUNNER_TEMP}/deploy-hold-venv"
          "${RUNNER_TEMP}/deploy-hold-venv/bin/python" -m pip install --quiet --require-hashes \
            -r .github/scripts/pyyaml-requirements.txt

      # Pick, verify and supersede per deploy kind. supersede-deploy-prs.sh exits 3 when an owner
      # hold blocks the picked PR: that refuses only its KIND, so the next pass excludes it and
      # tries the other kind, instead of failing the run and starving both (#14237). Any other
      # refusal (rollback, unreadable evidence, stale pin) still fails the run.
      - name: Pick, verify and supersede the deferred deploy PR to arm
        id: pick
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          DEPLOY_HOLD_PYTHON: ${{ runner.temp }}/deploy-hold-venv/bin/python
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/deploy-window"
          bash .github/scripts/deploy-window-inputs.sh "$d"
          excludes=()
          excluded_kinds=""
          fetched=false
          arm=""
          arm_head=""
          for _pass in 1 2; do
            python3 .github/scripts/deploy-window.py flush --prs-json "$d/prs.json" \
              --commits-json "$d/commits.json" --event-json "$GITHUB_EVENT_PATH" \
              --now "$(date -u +%s)" ${excludes[@]+"${excludes[@]}"} | tee "$d/selection"
            arm=$(sed -n 's/^arm=//p' "$d/selection")
            arm_head=$(sed -n 's/^arm_head=//p' "$d/selection")
            [ -n "$arm" ] || break
            case "$arm_head" in
              chore/gitops-auto-deploy-*) prefix=chore/gitops-auto-deploy- ;;
              chore/admin-ui-deploy-*)    prefix=chore/admin-ui-deploy- ;;
              *) echo "::error::unexpected deploy head ${arm_head}"; exit 1 ;;
            esac
            if [ "$prefix" = chore/gitops-auto-deploy- ]; then
              if [ "$fetched" = false ]; then
                git fetch --depth=100 origin main
                git reset --hard origin/main
                fetched=true
              fi
              gh pr diff "$arm" --repo "$GITHUB_REPOSITORY" \
                | python3 .github/scripts/deploy-window.py verify --root .
            fi
            rc=0
            bash .github/scripts/supersede-deploy-prs.sh "$prefix" "$arm" || rc=$?
            [ "$rc" -eq 0 ] && break
            if [ "$rc" -ne 3 ]; then exit "$rc"; fi
            echo "::warning::deploy window: #$arm is held by an owner; trying the other deploy kind (#14237)."
            excludes+=(--exclude-kind "$prefix")
            excluded_kinds="$excluded_kinds $prefix"
            arm=""
            arm_head=""
          done
          {
            echo "arm=$arm"
            echo "arm_head=$arm_head"
            echo "selected_main=$(cat "$d/main.sha")"
            echo "exclude_kinds=$excluded_kinds"
            if [ -n "$arm" ]; then
              echo "selected_head=$(jq -er --argjson number "$arm" '.[] | select(.number == $number) | .head_sha' "$d/prs.json")"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Arm the verified deployment for the merge train
        if: steps.pick.outputs.arm != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ARM: ${{ steps.pick.outputs.arm }}
          SELECTED_MAIN: ${{ steps.pick.outputs.selected_main }}
          SELECTED_HEAD: ${{ steps.pick.outputs.selected_head }}
          EXCLUDE_KINDS: ${{ steps.pick.outputs.exclude_kinds }}
        run: |
          set -euo pipefail
          # The helper repeats the live selection/hold checks, verifies train ownership,
          # then requests auto-merge only. It never writes a train verdict or merges.
          python3 .github/scripts/deploy-window-mutate.py --number "$ARM" \
            --selected-main "$SELECTED_MAIN" --selected-head "$SELECTED_HEAD"
