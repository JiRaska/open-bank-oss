# SPDX-License-Identifier: Apache-2.0
#
# Deploy window flusher (see .github/scripts/deploy-window.py).
#
# auto-deploy.yml and admin-ui-deploy.yml open their deploy PR exactly as before. This workflow
# alone arms auto-merge when the window allows it: at most one bot deploy commit reaches main per
# window, because each one makes every open PR `behind` under the strict up-to-date rule and
# restarts its required checks. A deploy they DEFER stays open and unarmed — this workflow is
# what lands it. A workflow_run trigger handles new PRs and the schedule recovers missed runs.
# Each run holds Admin UI deploy PRs until #12211 proves image provenance, and selects the
# newest eligible service PR after the window while nothing else is armed. It retires fully
# main-covered deferred service PRs with the App token after a second live proof, then re-runs
# supersede-deploy-prs.sh (ancestry + coverage — a rollback PR is refused) and verifies
# current policy, checks, signatures and exact SHAs.
# A CLEAN PR merges normally; pending checks or reviews arm auto-merge with the GitOps App token.
# A successful manual dispatch of either producer expedites only its matching PR.

name: Deploy window flush

on:
  workflow_run:
    workflows: ["Auto deploy", "Admin-UI deploy"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-window-flush
  cancel-in-progress: false

jobs:
  flush:
    name: Flush an eligible deferred deploy PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only GITHUB_TOKEN: every write (arming auto-merge, closing a superseded PR) goes through
    # the App token. A GITHUB_TOKEN fallback would arm a merge whose commit triggers no workflows.
    permissions:
      contents: read
    env:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same App token as the deploy workflows: arming with GITHUB_TOKEN would merge a commit
      # that triggers no workflows (anti-recursion), so ArgoCD's downstream checks never run.
      - name: Mint a GitHub App installation token
        id: app_token
        if: env.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Fail closed without the App token
        if: steps.app_token.outputs.token == ''
        run: |
          echo "::error::GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY unavailable - refusing to arm deploy PRs with GITHUB_TOKEN (its merge would trigger no workflows)."
          exit 1

      - name: Pick an eligible deferred deploy PR
        id: pick
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          # Capture main before the decision reads commit history. A later main update
          # invalidates this selection even if the selected PR itself did not move.
          selected_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          echo "selected_main=$selected_main" >> "$GITHUB_OUTPUT"
          git fetch --depth=100 origin main
          if [ "$(git rev-parse origin/main)" != "$selected_main" ]; then
            echo "::error::main moved during deploy selection; retry on the next tick"
            exit 1
          fi
          git reset --hard origin/main
          d="$RUNNER_TEMP/deploy-window"
          bash .github/scripts/deploy-window-inputs.sh "$d"
          python3 .github/scripts/deploy-window.py flush-reviewed --prs-json "$d/prs.json" \
            --commits-json "$d/commits.json" --event-json "$GITHUB_EVENT_PATH" \
            --root . --repo "$GITHUB_REPOSITORY" --selected-main "$selected_main" \
            --now "$(date -u +%s)" | tee -a "$GITHUB_OUTPUT"
          arm="$(sed -n 's/^arm=//p' "$GITHUB_OUTPUT" | tail -1)"
          if [ -n "$arm" ]; then
            echo "selected_head=$(gh pr view "$arm" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Retire deferred service PRs fully covered by main
        if: steps.pick.outputs.retire != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          RETIRE: ${{ steps.pick.outputs.retire }}
          SELECTED_MAIN: ${{ steps.pick.outputs.selected_main }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deploy-window.py retire-covered --numbers "$RETIRE" \
            --selected-main "$SELECTED_MAIN" --root . --repo "$GITHUB_REPOSITORY"

      - name: Verify deferred GitOps image source freshness
        if: steps.pick.outputs.arm != '' && startsWith(steps.pick.outputs.arm_head, 'chore/gitops-auto-deploy-')
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ARM: ${{ steps.pick.outputs.arm }}
        run: |
          set -euo pipefail
          git fetch --depth=100 origin main
          git reset --hard origin/main
          gh pr diff "$ARM" --repo "$GITHUB_REPOSITORY" \
            | python3 .github/scripts/deploy-window.py verify --root .

      - name: Close superseded deploy PRs (refuses a rollback)
        if: steps.pick.outputs.arm != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ARM: ${{ steps.pick.outputs.arm }}
          ARM_HEAD: ${{ steps.pick.outputs.arm_head }}
        run: |
          set -euo pipefail
          case "$ARM_HEAD" in
            chore/gitops-auto-deploy-*) prefix=chore/gitops-auto-deploy- ;;
            chore/admin-ui-deploy-*)    prefix=chore/admin-ui-deploy- ;;
            *) echo "::error::unexpected deploy head ${ARM_HEAD}"; exit 1 ;;
          esac
          bash .github/scripts/supersede-deploy-prs.sh "$prefix" "$ARM"

      - name: Arm or merge the verified deploy PR
        if: steps.pick.outputs.arm != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ARM: ${{ steps.pick.outputs.arm }}
          SELECTED_MAIN: ${{ steps.pick.outputs.selected_main }}
          SELECTED_HEAD: ${{ steps.pick.outputs.selected_head }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deploy-window-mutate.py --number "$ARM" \
            --selected-main "$SELECTED_MAIN" --selected-head "$SELECTED_HEAD"
