# Auto-deploy pipeline (ADR-0029 Layer B — continuous delivery axis).
#
# After every merge to main that changes service source, this workflow:
#   1. Detects which Gradle modules changed (same logic as services-ci.yml).
#   2. Builds a fast-jar for each changed service (Gradle build cache makes this
#      near-instant when services-ci.yml already ran on the same commit).
#   3. Bakes a linux/arm64 Docker image and pushes it to ECR with the tag
#      `sandbox-<short-SHA>` — matching the convention used by build-push-service.sh.
#   4. Rewrites the image: line in each service's gitops manifest.
#   5. Opens a PR (`chore/gitops-auto-deploy-<sha>`) and enables auto-merge, so the
#      manifest update lands on main as soon as CI is green.
#
# The PR is opened by a bot identity, which satisfies the issue-hygiene exemption (bot PR →
# no Linked issues required). It must be a GitHub *App* token (GITOPS_APP_ID +
# GITOPS_APP_PRIVATE_KEY): GitHub signs API-created commits only for Apps and the web UI, so
# an App token is what satisfies the "require signed commits" ruleset. A user PAT does NOT
# get signed — that assumption was wrong for five days and stranded seven deploy PRs with
# green checks and auto-merge armed (issue #1269). The "Verify the deploy commit is signed"
# step below fails the run rather than letting that recur silently.
#
# Security notes:
#  - contents:write + pull-requests:write scoped to this workflow only.
#  - ECR push uses IRSA (the ARC runner pod's IAM role) — no long-lived credentials.
#  - The gitops change is a PR, not a direct push to main, so the normal review/CI
#    gate (Validate manifests, Gitleaks, Trivy) still runs before the deploy lands.

name: Auto deploy

on:
  push:
    branches: [main]
    paths:
      - "openbank-*/src/main/**"
      # The canonical runtime image reads the service Dockerfile's EXPOSE declaration.
      # A port-only change therefore requires a rebuild just as source does.
      - "openbank-*/Dockerfile"
      # openbank-libs/src/main no longer holds compiled code (ADR-0122 moved it to
      # openbank-libs-domain / openbank-libs-runtime, both already covered by the
      # openbank-*/src/main/** glob above) — only its build file and Gradle wrapper
      # still affect the build. A bare "openbank-libs/**" glob also matches
      # openbank-libs/docs/** and openbank-libs/governance/**, neither a compile
      # input, so it silently triggered a 37-service rebuild on docs-only changes.
      - "openbank-libs/build.gradle.kts"
      - "openbank-libs/gradle/**"
      - "openbank-libs-domain/build.gradle.kts"
      - "openbank-libs-runtime/build.gradle.kts"
      - "build-logic/**"
      # Release-please bumps version.txt, yet a release-only commit touches nothing
      # under src/main/**. That left the new version with no image built, causing
      # immediate deploy drift (issue #3597 et al.). Treat a version bump as a
      # release marker that must deploy like a source change.
      - "openbank-*/version.txt"
  # Self-heal reconcile (issue #2020). The per-push run is ONE-SHOT: a service that built
  # and pushed its image but was then blocked at the can-i-deploy contract gate by a
  # TRANSIENT verification lag (its build wave republished its consumer pact; the provider
  # version in sandbox verified it minutes later, on its own deploy) is never re-driven —
  # it stays pinned to the stale image until a human hand-bumps gitops (as PR #2017 did for
  # notification-service after #1990). This tick re-offers every stranded service to the
  # SAME build -> can-i-deploy -> gitops-pr path, so it deploys the moment the gate clears
  # and stays blocked (with the #1420 left-behind escalation) while it does not. The gate is
  # not weakened. Detection is .github/scripts/auto-deploy-reconcile-lag.sh (unit-tested).
  schedule:
    - cron: "23 */3 * * *" # every 3h, offset off the hour to dodge cron congestion
  # Manual re-trigger: rebuild + push + gitops-PR on demand. Useful to recover
  # after a failed auto-deploy run left the gitops image tags stale, without
  # waiting for the next service-source merge.
  workflow_dispatch:
    inputs:
      services:
        description: >-
          Space-separated module(s) to rebuild, e.g. 'openbank-party-service'. Must be services
          that changed in the current HEAD (or are dependents of a changed shared library).
          Leave blank only when reconcile=true; a blank manual dispatch of the full fleet is
          not allowed because it creates NOT_ASKED / missing-pact failures (#3318).
        required: false
        default: ""
      codeploy:
        description: >-
          Treat `services` as ONE co-deploy set (issue #1985). The contract gate then asks the
          broker a single question about all of them together — are these versions mutually
          compatible — instead of asking per service whether each is compatible with the
          currently-deployed counterpart. Use ONLY with the exact set the gate named as a
          CO-DEPLOY SET; on any other input it is a strictly weaker check, because it stops
          asking about the services deployed alongside them.
        type: boolean
        required: false
        default: false
      codeploy_pact_versions:
        description: >-
          Optional JSON object mapping every co-deployed service to the exact 40-character Pact
          version to evaluate, for example {"openbank-product-catalog":"<sha>"}. Each supplied
          version must be proven byte-identical to the deploy ref in that service's build inputs;
          otherwise the co-deploy gate refuses the run. Use this only to replay a previously
          verified product set after main has moved on.
        required: false
        default: ""
      reconcile:
        description: >-
          Run the scheduled reconcile logic immediately (issue #2020). Instead of building the
          listed services at the current HEAD, re-drive every stranded service to the correct
          per-service commit, using the same logic as the every-3h schedule tick. This is the
          safe way to recover stale gitops tags when the current HEAD did not change those
          services. When reconcile is true, `services` is ignored and `codeploy` is not used.
        type: boolean
        required: false
        default: false
      bootstrap_image_only:
        description: >-
          Build, sign and attest exactly one service image that has no GitOps manifest yet.
          This is an artifact-only bootstrap: it never runs the contract deploy gate, rewrites
          GitOps, opens a PR or deploys a workload. Use the resulting immutable image only in a
          separately reviewed first-manifest PR.
        type: boolean
        required: false
        default: false

# Restrictive top-level default (Scorecard Token-Permissions wants an explicit top-level
# block); each job below declares its own override for the access it needs.
permissions:
  contents: read

# NOTE: there is deliberately NO workflow-level `concurrency` here. The serialisation this
# pipeline needs is scoped to `gitops-pr` alone (see that job); applying it workflow-wide
# cancelled `build-push` MID-FLIGHT, which is how the fleet ended up with unattested images
# (#1226). `Docker push` and `Attest image SBOMs` are ~180 lines apart in that job, and a
# cancel between them leaves the image in ECR with no attestation, forever — the superseding
# run builds its OWN commit's tag and never comes back for the dead run's images. Since
# verify-openbank-image-sbom-attestation is Enforce, such an image is admitted never, and the
# deny surfaces whenever the workload next reschedules — days later, far from the cause.
# Concurrent `build-push` runs are safe: image tags are immutable and per-SHA, so two builds
# cannot collide. Do not re-add a workflow-level cancel.

jobs:
  # ── 1. Detect which service modules actually changed ─────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest  # pure git; hosted-first (public repo, free)
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # GitHub OIDC → assume the build runner role (webhook-independent AWS auth)
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
      # A BOUNDED stand-in for `services`, for use in a concurrency group. See the step that
      # computes it, and gitops-pr's `concurrency:` block, for why interpolating the list itself
      # silently discarded three whole-fleet builds (#3082).
      services_key: ${{ steps.key.outputs.services_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: detect
        env:
          INPUT_CODEPLOY: ${{ github.event.inputs.codeploy }}
          INPUT_CODEPLOY_PACT_VERSIONS: ${{ github.event.inputs.codeploy_pact_versions }}
          INPUT_SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -euo pipefail
          # Full fleet — unlike services-ci.yml (which discovers every openbank-*/
          # with a build.gradle.kts dynamically), this list is static and can drift:
          # a service added to the fleet gets full CI for free but silently gets ZERO
          # auto-deploy coverage until someone adds it here (openbank-libs excluded on
          # purpose: it has no Dockerfile, only its consumers need rebuilding).
          # billing-service shipped a CodeQL log-injection fix (#597/#601) that merged
          # and released cleanly but never deployed — "Detect changed services" always
          # printed "No deployable services changed" because the service was simply
          # never a candidate, regardless of what changed. Re-added here.
          # anacredit-service had the same gap PLUS no Dockerfile ever committed — the
          # running sandbox pod traces back to an image built from a Dockerfile that only
          # ever existed on someone's laptop. Neither build-push-service.sh nor this
          # workflow's own Docker-push step read a per-service Dockerfile for the build
          # itself (both generate their own from a canonical template); the per-service
          # Dockerfile is only grepped for its EXPOSE line to set the container port
          # (falls back to 8080 if absent). Added openbank-anacredit-service/Dockerfile
          # (EXPOSE 8137, matching the gitops manifest) alongside this entry so the port
          # extraction is correct, not just defaulted.
          # The 6 ADR-0163/ADR-0164-0168 control/governance agents (control-liveness-
          # sentinel, governance-auditor, release-steward, docs-truth-agent,
          # authz-policy-auditor, flaky-test-hunter) shipped with the exact same gap:
          # merged, released, gitops manifest present — but never in ALL_SERVICES, so
          # every one of their Deployments sat perpetually blocked at the placeholder
          # `sandbox-pending` tag (Kyverno's SBOM-attestation/cosign-signature policies
          # reject a tag that was never pushed) with zero auto-deploy coverage, and none
          # had a per-service Dockerfile either. Added both here.
          # document-service had the exact same gap: real Dockerfile (EXPOSE 8143), real
          # gitops manifest, ADR-0162 onboarding-agreement + ADR-0169 SCA-document-binding
          # PRs (#1137, #1142) merged and released — but never in ALL_SERVICES, so every
          # push since it shipped silently deployed nothing. Added here.
            # clearing-simulator: the same gap again, and live. Released (0.4.4), real
            # Dockerfile (EXPOSE 8139), real gitops manifest — but never in ALL_SERVICES,
            # so its manifest still pinned the image built on 2026-06-22 and every push
            # since deployed nothing. It also went unattested for the whole of that window
            # (its .att dates from the 2026-07-16 hand-fix, its .sig from June), because
            # the SBOM-attestation policy graduated to Enforce while nothing rebuilt it —
            # one reschedule in that window and it would have died like keycloak did.
            # Audit at the time: 50 released components, 47 here; the only legitimate
            # absentee is admin-ui (own admin-ui-deploy.yml). finrep-service is the third
            # and needs a Dockerfile first — see #1205, which also tracks a guard so this
            # list stops drifting out of sync with release-please by hand.
            # vop-service is the fourth, and it shipped straight into the gap: #1195 merged
            # it with a version.txt, a release-please entry and a Rollout, but no entry here,
            # so its auto-deploy run had nothing to build. Its manifest still pinned the
            # literal `sandbox-placeholder` tag, the ECR repo was never created, and Kyverno
            # therefore denied every pod (NAME_UNKNOWN on the SBOM-attestation and
            # cosign-signature policies) — the Rollout sat Degraded with zero pods from the
            # moment it landed. Added here with a Dockerfile carrying EXPOSE 8149.
                      # finrep-service: the last of the six. Released 0.5.0 since June with a gitops
            # manifest pinned to the ADR-0097 `sandbox-init` placeholder and no ECR repo at
            # all, so it sat at 0/1 ErrImagePull and no push could ever fix it. Repo created
            # 2026-07-16; first real image (sandbox-cef5fdcd) built, signed, attested and
            # running. Added here so it stays built. With this, ALL_SERVICES and
            # release-please's package list finally agree — and check-deploy-coverage.sh
            # keeps them agreeing (#1205).
            # analytics-sink: never listed here since the service was created, so NO push has ever
            # built it. Its deployed image was built 2026-07-26 (#2654) and nine commits touched
            # its src/main afterwards, none of which reached the cluster — including the
            # aggregate_type normalisation of #4576. Nothing was red: the run reports
            # "No deployable services changed" and succeeds. check-deploy-coverage.sh could not
            # see it either, because its subject set was release-please's released components and
            # analytics-sink has no version.txt (it owns no OLTP database and cuts no release —
            # ADR-0022). That blindness is fixed in the same PR; this line is the gap it found.
            ALL_SERVICES='openbank-account-service openbank-ledger-service openbank-transaction-service openbank-pid-service openbank-balance-service openbank-consent-service openbank-psd2-service openbank-tpp-registry-service openbank-agent-service openbank-copilot-service openbank-sca-service openbank-party-service openbank-notification-service openbank-audit-service openbank-kyc-service openbank-document-service openbank-sepa-payment openbank-domestic-payment openbank-aml-service openbank-card-issuance-service openbank-fx-service openbank-standing-order-service openbank-swift-service openbank-sanctions-service openbank-fraud-service openbank-security-scanner openbank-product-catalog openbank-clearing-service openbank-interest-service openbank-dispute-service openbank-engagement-service openbank-sepa-instant openbank-lending-service openbank-statement-service openbank-sdd-service openbank-customer-edge openbank-onboarding-service openbank-settlement-service openbank-finops-agent openbank-devops-agent openbank-billing-service openbank-anacredit-service openbank-control-liveness-sentinel openbank-governance-auditor openbank-release-steward openbank-docs-truth-agent openbank-authz-policy-auditor openbank-flaky-test-hunter openbank-clearing-simulator openbank-vop-service openbank-finrep-service openbank-mcp-service openbank-ap2-service openbank-campaign-service openbank-referral-service openbank-delegation-service openbank-case-coordinator-agent openbank-analytics-sink openbank-incentive-service'

          # Which files changed in this push (compare to the parent commit). We compute this
          # early because the workflow_dispatch guard below also needs to know which services
          # changed in the current HEAD, so an operator cannot accidentally request services
          # from an unrelated commit that has no pact versions in the broker (#3318, #3454).
          CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null)"

          # Shared paths that affect every service. Governance catalogs
          # (openbank-libs/governance/) are excluded — they are data for CI
          # checks + admin-ui, not a compile input, so a mixed push touching a
          # control catalog and one service must rebuild ONE service, not 33.
          # NB: here-string, not `echo | grep -q` — under pipefail a -q early
          # exit SIGPIPEs the echo and the match is racily mis-read as false
          # (same footgun documented in services-ci.yml).
          CODE_FILES="$(grep -vE '^openbank-libs/governance/' <<< "$CHANGED_FILES" || true)"

          # Services to rebuild because a SHARED library changed, derived from the
          # `project(":openbank-libs-*")` declarations in each consumer's build.gradle.kts
          # (issue #2983). The old shape was a hardcoded path regex naming only openbank-libs,
          # -domain and -runtime, so the ADR-0122 siblings matched NOTHING: #2949 fixed the
          # Temporal payload converter and rebuilt zero consumers, leaving fx-service and
          # statement-service running pre-fix images while their pods read green.
          #
          # Deriving it also narrows the blast radius rather than widening it: a libs-temporal
          # change rebuilds its 16 consumers, not the whole fleet, and libs-testing
          # (testImplementation everywhere) rebuilds nobody.
          LIBS_DEPENDENTS="$(printf '%s\n' "$CODE_FILES" \
            | bash .github/scripts/libs-change-dependents.sh "$ALL_SERVICES")"

          # Services changed directly in this push.
          DIRECT_SERVICES=()
          for svc in $ALL_SERVICES; do
            # Keep this aligned with the push trigger: release-please changes only
            # version.txt, and that release marker must rebuild/deploy the component.
            if grep -qE "^${svc}/(src/main|build\.gradle\.kts|version\.txt|Dockerfile)" <<< "$CHANGED_FILES"; then
              DIRECT_SERVICES+=("$svc")
            fi
          done

          # Manual dispatch: rebuild the requested module(s), or run the scheduled reconcile
          # logic immediately. Without reconcile=true, a manual dispatch must target services
          # that changed in the current HEAD; dispatching arbitrary services from an unrelated
          # commit leaves the contract gate with no pact version for this SHA and produces the
          # wasted runs / NOT_ASKED failures behind #3318 / #3454.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.bootstrap_image_only }}" = "true" ]; then
              if [ "${{ github.event.inputs.reconcile }}" = "true" ]; then
                echo "::error::bootstrap_image_only and reconcile are mutually exclusive"
                exit 1
              fi
              REQUESTED="$INPUT_SERVICES"
              if [ "$(wc -w <<< "$REQUESTED" | tr -d ' ')" -ne 1 ]; then
                echo "::error::bootstrap_image_only requires exactly one service"
                exit 1
              fi
              svc="$REQUESTED"
              if ! grep -qxF "$svc" <<< "${ALL_SERVICES// /$'\n'}" || [ ! -f "$svc/Dockerfile" ]; then
                echo "::error::bootstrap target must be a known service with a committed Dockerfile"
                exit 1
              fi
              if grep -rlq "${svc}:sandbox-" openbank-infra/gitops/components 2>/dev/null; then
                echo "::error::bootstrap_image_only is only for a service with no GitOps manifest"
                exit 1
              fi
              SERVICES_JSON="$(printf '%s\n' "$svc" | jq -R . | jq -sc .)"
              echo "artifact-only bootstrap → building: $SERVICES_JSON"
              echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
              echo "any=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Reconcile on demand: use the same logic as the schedule tick, which picks the
            # correct per-service commit instead of forcing everything onto the current HEAD.
            if [ "${{ github.event.inputs.reconcile }}" = "true" ]; then
              SERVICES_JSON="$(RECONCILE_SERVICES="$ALL_SERVICES" \
                bash .github/scripts/auto-deploy-reconcile-lag.sh)"
              if [ "$SERVICES_JSON" = "[]" ] || [ -z "$SERVICES_JSON" ]; then
                echo "Reconcile: every deployable service is up to date."
                echo "services=[]" >> "$GITHUB_OUTPUT"
                echo "any=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "workflow_dispatch (reconcile) → re-driving stranded services: $SERVICES_JSON"
              echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
              echo "any=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            REQUESTED="$INPUT_SERVICES"
            if [ -z "$REQUESTED" ]; then
              echo "::error::workflow_dispatch with empty services is only allowed when reconcile=true. A blank manual dispatch of the full fleet at an unrelated commit creates the NOT_ASKED / missing-pact failures seen in runs 31149468822 and 31150052893. Use reconcile=true to re-drive stranded services, or list explicit services that changed in the current HEAD."
              exit 1
            fi

            CANDIDATES="$REQUESTED"
            DEPLOYABLE=()
            for svc in $CANDIDATES; do
              if grep -rlq "${svc}:sandbox-" openbank-infra/gitops/components 2>/dev/null; then
                DEPLOYABLE+=("$svc")
              else
                echo "  skip ${svc} — no gitops manifest found"
              fi
            done
            if [ "${#DEPLOYABLE[@]}" -eq 0 ]; then
              echo "No deployable services to build."
              echo "services=[]" >> "$GITHUB_OUTPUT"
              echo "any=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # A normal manual dispatch is intentionally limited to service code changed by
            # this ref: otherwise the broker cannot be asked about the image being built.
            # The one safe exception is a co-deploy replay with a complete explicit Pact map.
            # `can-i-deploy` subsequently proves every supplied version byte-identical to this
            # ref's build inputs before it can open a GitOps PR. Validate the map shape here as
            # well so a malformed input cannot turn the exception into a broad build bypass.
            DEPLOYABLE_JSON="$(printf '%s\n' "${DEPLOYABLE[@]}" | jq -R . | jq -sc .)"
            EXACT_CODEPLOY_REPLAY=false
            if [ "${INPUT_CODEPLOY:-}" = "true" ] \
              && [ -n "${INPUT_CODEPLOY_PACT_VERSIONS:-}" ] \
              && [ "${INPUT_CODEPLOY_PACT_VERSIONS}" != "{}" ]; then
              if ! jq -e --argjson services "$DEPLOYABLE_JSON" \
                'type == "object" and (keys | sort) == ($services | sort) and
                 all(.[]; type == "string" and test("^[0-9a-f]{40}$"))' \
                >/dev/null <<< "$INPUT_CODEPLOY_PACT_VERSIONS"; then
                echo "::error::codeploy_pact_versions must map exactly the requested services to 40-hex versions"
                exit 1
              fi
              EXACT_CODEPLOY_REPLAY=true
            fi

            # Guard: every manually requested service must have changed in the current HEAD,
            # or be a consumer of a changed shared library. Dispatching a service that did not
            # change in this commit means the broker has no pact version for this SHA, which the
            # contract gate rightfully refuses (#3318), and the build is wasted work. The exact
            # co-deploy replay above is different: it cannot deploy unless the later gate proves
            # its supplied Pact versions are byte-identical to these build inputs.
            # `grep -v` returns 1 when no line remains. That is a valid state for an
            # explicit replay (the wrapper changes only deployment metadata), not a failed
            # command; `awk` preserves the filtering semantics while returning success.
            CHANGED_SET="$( { printf '%s\n' "${DIRECT_SERVICES[@]+"${DIRECT_SERVICES[@]}"}"; printf '%s\n' "$LIBS_DEPENDENTS"; } | awk 'NF' | sort -u )"
            GUARD_FAILED=0
            for svc in "${DEPLOYABLE[@]}"; do
              if [ "$EXACT_CODEPLOY_REPLAY" != "true" ] && ! grep -qxF "$svc" <<< "$CHANGED_SET"; then
                echo "::error::workflow_dispatch requested service ${svc} which did not change in HEAD ($(git rev-parse --short HEAD)) and is not a dependent of a changed shared library. The broker has no pact version for this SHA, so the contract gate will REFUSE. Dispatch from the commit that changed ${svc}, or use reconcile=true to recover the correct per-service commit."
                GUARD_FAILED=1
              fi
            done
            if [ "$GUARD_FAILED" -ne 0 ]; then
              exit 1
            fi

            SERVICES_JSON="$DEPLOYABLE_JSON"
            echo "workflow_dispatch → building: $SERVICES_JSON"
            echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled reconcile (issue #2020): re-drive every service whose deployed gitops
          # image tag is behind main — the strand a one-shot per-push run leaves when the
          # contract gate blocks it on a transient verification lag and nothing retries. The
          # probe intersects the manifest pins with ALL_SERVICES (so it never tries to build
          # a service this pipeline can't) and caps the batch oldest-first. The selected set
          # then flows through the identical build-push -> can-i-deploy -> gitops-pr path, so
          # a still-blocked service simply stays blocked this tick — the gate is unchanged.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SERVICES_JSON="$(RECONCILE_SERVICES="$ALL_SERVICES" \
              bash .github/scripts/auto-deploy-reconcile-lag.sh)"
            if [ "$SERVICES_JSON" = "[]" ] || [ -z "$SERVICES_JSON" ]; then
              echo "Reconcile: every deployable service is up to date."
              echo "services=[]" >> "$GITHUB_OUTPUT"
              echo "any=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Reconcile → re-driving stranded services: $SERVICES_JSON"
            echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push path: union the services that changed directly in this push with the services
          # that consume a changed shared library, then filter ONCE on the gitops manifest so a
          # library fan-out cannot try to deploy a service this pipeline has no manifest for.
          DEPLOYABLE=()
          for svc in $( { printf '%s\n' "${DIRECT_SERVICES[@]+"${DIRECT_SERVICES[@]}"}"; printf '%s\n' "$LIBS_DEPENDENTS"; } | grep -v '^$' | sort -u ); do
            if grep -rlq "${svc}:sandbox-" openbank-infra/gitops/components 2>/dev/null; then
              DEPLOYABLE+=("$svc")
            else
              echo "  skip ${svc} — no gitops manifest found"
            fi
          done

          if [ "${#DEPLOYABLE[@]}" -eq 0 ]; then
            echo "No deployable services changed."
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVICES_JSON="$(printf '%s\n' "${DEPLOYABLE[@]}" | jq -R . | jq -sc .)"

          echo "Services to deploy: $SERVICES_JSON"
          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "any=true" >> "$GITHUB_OUTPUT"

      # Why a digest and not the service list itself (issue #3082).
      #
      # gitops-pr's concurrency group used to interpolate `needs.changes.outputs.services`
      # verbatim. For a change under openbank-libs-* that is every service in the fleet, and the
      # group name reached ~1436 characters — at which point the job is NEVER INSTANTIATED. Not
      # skipped: absent. No job, no check-run on the commit, and `needs.gitops-pr.result` reads as
      # a failure to the Deploy signal job downstream.
      #
      # That is the worst possible place to lose it. gitops-pr carries
      # `if: always() && ... != 'cancelled'` precisely so a partial can-i-deploy failure still
      # deploys the subset that passed (#846) — and a job that never exists cannot honour its own
      # `if`. So the whole fleet build was built, pushed, signed, attested and then thrown away,
      # in exactly the highest-stakes case: a shared-library change.
      #
      # Measured over the last 20 auto-deploy runs, the correlation is exact:
      #   53 services (~1436 chars) -> Gitops PR job never created  (000ba2a5, f994c492, fa61b32c)
      #   12 services (~322  chars) -> created                      (342cf7d7)
      #    1 service  (~30   chars) -> created                      (ec841cf5, 91e9b2c5)
      #
      # The digest keeps the semantics #1332/#1336 established, which is the whole reason the
      # service set is in the group at all: the same set maps to the same group (two pushes
      # touching the same services still serialise, newer wins), disjoint sets map to different
      # groups (billing and lending no longer cancel each other), and workflow_dispatch still uses
      # run_id so an ops recovery run is never cancelled by a routine push. `jq -S 'sort'` makes it
      # order-insensitive, so the same set detected in a different order yields the same key.
      - id: key
        name: Derive a bounded concurrency key for the changed-service set
        env:
          # Via env, not a `${{ }}` splice into the script body: the value is JSON built from repo
          # paths, and splicing it directly is the shape script injection takes.
          SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          set -euo pipefail
          KEY="$(printf '%s' "${SERVICES:-[]}" | jq -S -c 'sort' | sha256sum | cut -c1-12)"
          echo "services_key=$KEY" >> "$GITHUB_OUTPUT"
          N="$(printf '%s' "${SERVICES:-[]}" | jq -r 'length')"
          echo "concurrency key for ${N} service(s): ${KEY}"

  # ── 2. Build fast-jars, bake images, push to ECR ─────────────────────────────
  build-push:
    name: Build + push
    needs: changes
    if: needs.changes.outputs.any == 'true'
    # Native arm64 GitHub-hosted runner (free on public repos) — the runtime images
    # are linux/arm64, so buildx builds natively with no QEMU. ECR push + KMS cosign
    # authenticate via the same GitHub-OIDC role as before (it trusts repo:*, not a
    # runner identity). The in-cluster Gradle remote cache / Reposilite mirror are
    # simply absent here (their probes fall through to Maven Central — free egress
    # on hosted runners, unlike the NAT-metered VPC).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # GitHub OIDC → assume the build runner role (webhook-independent AWS auth)
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ECR_REGISTRY: "265175468565.dkr.ecr.eu-north-1.amazonaws.com"
      # amazon-ecr-login (+ trivy's ECR pull) resolve the region from the
      # environment. The ARC runner now authenticates via EKS Pod Identity, which
      # — unlike the old IRSA webhook — does NOT inject AWS_REGION/AWS_DEFAULT_REGION
      # into the pod. Without these the ECR login step fails "Region is missing",
      # which is why every post-2026-06-12 main merge built no image and the gitops
      # tags went stale (party/account-service stuck pre-#894). Mirrors _service-ci.yml.
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
    outputs:
      # JSON map { "svc": "tag", … } written to $GITHUB_OUTPUT
      image_tags: ${{ steps.collect.outputs.image_tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false   # deploy jobs update the cache too

      # AWS auth via GitHub OIDC — webhook-independent. The EKS Pod Identity webhook
      # (failurePolicy: Ignore, 10s timeout) intermittently fails to inject the credential env
      # into a freshly-scheduled ARC runner pod, leaving it with NO AWS creds, so ECR login fails
      # "Could not load credentials from any providers". GitHub OIDC mints a token this job
      # exchanges for the build runner role directly via STS (the role trusts
      # token.actions.githubusercontent.com for repo:JiRaska/open-bank-oss:*) — no per-pod webhook
      # dependency, deterministic. configure-aws-credentials exports the creds to the job env.
      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1

      - name: Clear stale ECR credentials (macOS keychain)
        if: runner.os == 'macOS'
        run: |
          docker logout "$ECR_REGISTRY" 2>/dev/null || true
          # docker logout clears ~/.docker/config.json but leaves the osxkeychain entry;
          # the subsequent docker login then fails with "already exists in the keychain".
          security delete-internet-password -s "$ECR_REGISTRY" 2>/dev/null || true
          # Remove credsStore=osxkeychain from Docker config so amazon-ecr-login stores
          # credentials in the config file rather than the macOS Keychain. The Keychain
          # requires interactive unlocking (-25308: errSecInteractionNotAllowed) which
          # fails in non-interactive CI sessions. File-based credentials are safe here:
          # the runner is ephemeral per-job and ECR tokens expire in 12 h anyway.
          python3 -c "import json,pathlib; p=pathlib.Path.home()/'.docker'/'config.json'; d=json.loads(p.read_text()) if p.exists() else {}; d.pop('credsStore',None); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(d))"

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build fast-jars (parallel)
        id: build
        # analytics-sink selects its AnalyticsSink binding with @IfBuildProperty, which Quarkus
        # resolves at AUGMENTATION time — the runtime env var the gitops manifest sets cannot
        # reach it. Without this the image ships the @Default LoggingAnalyticsSink, which logs
        # every event and writes none, so ClickHouse silently stays empty while the consumer
        # looks perfectly healthy. Harmless for the other services: only this module reads it.
        env:
          ANALYTICS_SINK_TYPE: clickhouse
          # agent-service selects its NonceStore binding with @IfBuildProperty (same trap as
          # analytics-sink above — resolved at AUGMENTATION time, so a runtime env var cannot
          # reach it). Without this the image ships the @Default InMemoryNonceStore, and the PoP
          # replay guard silently weakens to per-pod once replicas > 1 (issue #4728).
          AGENT_SVID_NONCE_STORE: redis
        run: |
          set -euo pipefail
          SERVICES='${{ needs.changes.outputs.services }}'
          SHA="${GITHUB_SHA::8}"
          TAG="sandbox-${SHA}"
          FAILED=0

          # Build all services in a SINGLE Gradle invocation with --parallel.
          # Gradle manages its internal dependency graph: shared tasks
          # (openbank-libs:compileKotlin, :jandex, :jar) execute exactly ONCE
          # before any service-specific tasks, completely eliminating the race
          # conditions that caused jandex/ZipException/Kotlin-daemon failures
          # when multiple concurrent `./gradlew` processes wrote to the same
          # openbank-libs/build/ directory or Gradle build-cache entries.
          # --max-workers=4 limits JVM workers to fit the 16 GB Docker budget.
          # --continue reports all failures before exiting non-zero.
          TASKS=()
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            # cyclonedxBom alongside quarkusBuild so every service's image gets its
            # CycloneDX SBOM baked in (served live at /q/openbank/sbom by libs
            # SbomResource). Fleet-wide via this central loop — no per-service
            # Dockerfile edits, no separate sweep.
            TASKS+=(":${svc}:quarkusBuild" ":${svc}:cyclonedxBom")
          done

          echo "==> Building ${#TASKS[@]} service(s) via single Gradle invocation (--parallel --max-workers=4)"
          if ! ./gradlew "${TASKS[@]}" \
                -Dquarkus.package.jar.type=fast-jar \
                --parallel --max-workers=4 \
                --build-cache --console=plain \
                --continue 2>&1; then
            FAILED=1
          fi

          [ "$FAILED" -eq 0 ] || { echo "One or more builds failed"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker push (parallel)
        id: push
        run: |
          set -euo pipefail
          SERVICES='${{ needs.changes.outputs.services }}'
          TAG="${{ steps.build.outputs.tag }}"
          FAILED=0

          docker buildx create --use --name ob-deploy-builder \
            --driver docker-container >/dev/null 2>&1 || \
            docker buildx use ob-deploy-builder

          push_one() {
            local svc="$1"
            local qa="${svc}/build/quarkus-app"
            [ -f "${qa}/quarkus-run.jar" ] || \
              { echo "[${svc}] quarkus-run.jar not found — skip push"; return 0; }

            local port
            port="$(grep -oE 'EXPOSE[[:space:]]+[0-9]+' "${svc}/Dockerfile" 2>/dev/null \
              | grep -oE '[0-9]+' | head -1 || echo "8080")"

            local image="${ECR_REGISTRY}/${svc}:${TAG}"
            local ctx; ctx="$(mktemp -d)"
            trap 'rm -rf "$ctx"' RETURN
            cp -r "$qa" "${ctx}/quarkus-app"
            # Gradle sets quarkus-app/lib/ files to 600 (owner-read-only). The
            # container runs as non-root user `openbank` → ClassNotFoundException
            # (QuarkusEntryPoint not loadable). Fix: PR #2141 pattern.
            chmod -R a+r "${ctx}/quarkus-app"

            # Dockerfile template lives in .github/workflows/Dockerfile.deploy to
            # keep the heredoc out of the YAML (yamllint syntax-checks block scalars
            # and treats zero-indented heredoc lines as invalid YAML nodes).
            cp "${GITHUB_WORKSPACE}/.github/workflows/Dockerfile.deploy" \
              "${ctx}/Dockerfile"
            # Bake the CycloneDX SBOM (if cyclonedxBom produced one) so the running
            # service serves it live at /q/openbank/sbom (libs SbomResource). Best-
            # effort: a service without the report just ships without it and the
            # endpoint returns not_generated (admin-ui falls back to the bundle).
            if [ -f "${svc}/build/reports/bom.json" ]; then
              mkdir -p "${ctx}/sbom"
              cp "${svc}/build/reports/bom.json" "${ctx}/sbom/bom.json"
              chmod a+r "${ctx}/sbom/bom.json"
              echo "COPY sbom/bom.json /app/sbom/bom.json" >> "${ctx}/Dockerfile"
              echo "ENV OPENBANK_SBOM_PATH=/app/sbom/bom.json" >> "${ctx}/Dockerfile"
            fi
            # EXPOSE is written dynamically after the static COPY/ENTRYPOINT lines.
            echo "EXPOSE ${port}" >> "${ctx}/Dockerfile"

            # A new service's ECR repository is declared nowhere, so its first build
            # compiles and then dies here (#3423). Fails OPEN when it cannot observe the
            # registry, so it is inert until the IAM grant applies. Reasoning lives in the
            # script header, not in this run: block — prose here costs the whole workflow
            # (#3135).
            bash "${GITHUB_WORKSPACE}/.github/scripts/ensure-ecr-repository.sh" "${svc}" \
              2>&1 | sed "s/^/[${svc}] /" || return 1

            # ldd every bundled linux .so inside the real runtime base before pushing (#3354).
            # No-op for a service shipping none. Reasoning is in the script header, not here
            # — prose in a run: block costs the whole workflow (#3135).
            python3 "${GITHUB_WORKSPACE}/.github/scripts/verify-image-native-libs.py" \
              "${ctx}/quarkus-app/lib" --arch arm64 2>&1 | sed "s/^/[${svc}] /" || return 1

            echo "==> [${svc}] docker push → ${image}"
            docker buildx build \
              --platform linux/arm64 \
              --provenance=false \
              -t "${image}" \
              --push \
              "${ctx}" 2>&1 | sed "s/^/[${svc}] /" || return 1
          }

          MAX_PARALLEL=3   # limit concurrent buildx to avoid OOM on 16GB Docker host
          RUNNING=0; PIDS=(); SVCS=()

          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            push_one "$svc" &
            PIDS+=($!); SVCS+=("$svc"); RUNNING=$(( RUNNING + 1 ))
            if [ "$RUNNING" -ge "$MAX_PARALLEL" ]; then
              wait "${PIDS[0]}" || { echo "FAIL: ${SVCS[0]}"; FAILED=1; }
              PIDS=("${PIDS[@]:1}"); SVCS=("${SVCS[@]:1}"); RUNNING=$(( RUNNING - 1 ))
            fi
          done
          for pid in "${PIDS[@]}"; do wait "$pid" || FAILED=1; done

          [ "$FAILED" -eq 0 ] || { echo "One or more docker pushes failed"; exit 1; }

      # Sign every pushed image with the AWS KMS cosign key (ADR-0029/0030). kyverno's
      # verify-openbank-image-signatures runs Enforce, so an UNSIGNED image is rejected
      # at admission ("no signatures found") and ArgoCD stays OutOfSync — the build job
      # used to push without signing, which is the other half of why deploys never landed.
      # cosign v2 is pinned on purpose: kyverno 3.2.6 finds only the legacy sha256-<digest>.sig
      # tag scheme; cosign v3 writes OCI-referrer sigs it cannot read (see #770).
      - name: Sign images (cosign v2 + KMS)
        run: |
          set -uo pipefail
          SERVICES='${{ needs.changes.outputs.services }}'
          TAG="${{ steps.build.outputs.tag }}"
          # `resolve_cosign_v2` and the v2 pin live in the shared helper — this step used to
          # carry its own copy of both. Sign and attest stay two steps because the trivy CVE
          # gate runs between them, so this uses the resolver directly rather than
          # `cosign_sign_and_attest`.
          . openbank-infra/scripts/lib/cosign-attest.sh
          bin="$(resolve_cosign_v2 || true)"
          if [ -z "$bin" ]; then
            echo "::error::cosign v2 unavailable — images would be pushed UNSIGNED and kyverno would reject them"
            exit 1
          fi
          rc=0
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            img="${ECR_REGISTRY}/${svc}:${TAG}"
            echo "==> cosign sign ${img}"
            COSIGN_YES=true "$bin" sign --key "$COSIGN_KEY" "$img" || { echo "::error::cosign sign failed for ${svc}"; rc=1; }
          done
          [ "$rc" -eq 0 ] || { echo "One or more image signatures failed — kyverno would reject these"; exit 1; }

      # Scan the images that were actually pushed — the trivy fs scan in
      # security.yml covers lockfiles in the repo, NOT the packaged jars + OS
      # layer of the runtime image (base-image CVEs slip through it). Gate on
      # fixable CRITICALs: vuln_management SLA is 7 days for critical, so
      # deploying a known-fixable CRITICAL is pointless churn. HIGH is reported
      # advisory. A failed gate fails this job → the gitops PR never opens →
      # the vulnerable tag is never referenced by a manifest.
      # This job runs on a GitHub-hosted runner (ubuntu-24.04-arm, not ARC), which
      # never has trivy pre-baked — the old "ARC bakes it" fast path always missed
      # here and fell through to an unauthenticated raw.githubusercontent.com curl,
      # which is rate-limited on the shared hosted-runner IP pool and started
      # failing every build-push run. Use the same maintained, commit-pinned setup
      # action the `trivy` job in security.yml already relies on for this exact
      # hosted-runner scenario.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Prune Docker build cache before scan
        run: |
          # Remove buildx builder, stopped containers, dangling images, and build cache
          # accumulated during the push phase. Without this, the node accumulates multiple
          # ARM64 image layers + buildx volumes and hits DiskPressure or OOM during the
          # Trivy scan when it pulls the ECR images again for analysis. The pushed images
          # are already in ECR; we only need disk space for Trivy to re-pull and scan them.
          docker buildx rm ob-deploy-builder 2>/dev/null || true
          docker system prune -f --volumes 2>/dev/null || true
          df -h /

      - name: Trivy image scan (gate fixable CRITICAL, report HIGH)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SERVICES='${{ needs.changes.outputs.services }}'
          TAG="${{ steps.build.outputs.tag }}"
          FAILED=0

          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            # Mirror push_one's skip: no fast-jar → nothing was pushed.
            [ -f "${svc}/build/quarkus-app/quarkus-run.jar" ] || continue
            image="${ECR_REGISTRY}/${svc}:${TAG}"

            echo "==> [${svc}] trivy image ${image}"
            # Advisory report — full HIGH+CRITICAL table in the job log.
            # `|| true`: --exit-code 0 covers vuln-found, but trivy still exits
            # non-zero on infra errors; blocking is the gate run's job below,
            # which reports them cleanly instead of an opaque set -e abort.
            trivy image --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --format table --exit-code 0 "${image}" \
              2>&1 | sed "s/^/[${svc}] /" || true

            # Gate — fixable CRITICALs (or a scan error) block the deploy.
            if ! trivy image --scanners vuln --severity CRITICAL \
                 --ignore-unfixed --quiet --exit-code 1 "${image}" \
                 2>&1 | sed "s/^/[${svc}] /"; then
              echo "[${svc}] fixable CRITICAL CVEs (or scan error) — blocking deploy"
              FAILED=1
            fi
          done

          [ "$FAILED" -eq 0 ] || { echo "Image scan gate failed"; exit 1; }

      # Deploy-time provenance: attach a signed CycloneDX SBOM ATTESTATION to each pushed
      # image (ADR-0030 D4), complementing the release-time bundle (release-please.yml) and
      # the image SIGNATURE above. trivy generates the image SBOM (OS layer + jars, which a
      # source scan misses); cosign attest binds it to the image digest with the same KMS key.
      #
      # FATAL as of 2026-07-16. The two comments this step used to carry — "kyverno enforces
      # the signature, not (yet) the attestation" and "an attest hiccup must never block a
      # deploy" — were both false once verify-openbank-image-sbom-attestation graduated to
      # Enforce on 2026-07-12. They were the entire bug: `trivy image` was missing --platform
      # (it defaults to linux/amd64 on REMOTE scans; these images are arm64-only), so the scan
      # failed with "no child with platform linux/amd64 in index" on EVERY image, the failure
      # became a ::warning, continue-on-error swallowed it, and the deploy proceeded green with
      # an unattested image. Nothing noticed until a pod rescheduled days later and could not
      # be re-admitted.
      #
      # An unattested image cannot be admitted, so a deploy that "succeeds" while producing one
      # is not a successful deploy — it is a time bomb with a green check. Fail here instead.
      - name: Attest image SBOMs + SLSA provenance (cosign + KMS)
        timeout-minutes: 15
        run: |
          set -uo pipefail
          SERVICES='${{ needs.changes.outputs.services }}'
          TAG="${{ steps.build.outputs.tag }}"
          # The trivy invocation, the cosign-v2 pin, the mandatory --platform and the
          # post-attest proof all live in the shared helper, which every build-push-*.sh
          # already uses. This step carried its own copy and so missed the hardening added
          # in #1197: `cosign attest` APPENDS to the .att tag, and a bare
          # `verify-attestation` passes if ANY envelope verifies — so it could not tell that
          # THIS run's SBOM landed, only that some envelope on the image was good. The helper
          # sanity-checks the SBOM (parses, bomFormat, non-zero components) and binds the
          # verify to the CycloneDX serialNumber trivy mints per run.
          . openbank-infra/scripts/lib/cosign-attest.sh
          rc=0
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            [ -f "${svc}/build/quarkus-app/quarkus-run.jar" ] || continue
            image="${ECR_REGISTRY}/${svc}:${TAG}"
            # Per-service rc rather than an early exit: report EVERY broken image in one run,
            # so a second failure is not hidden behind the first.
            if ! cosign_attest_sbom "$image" "linux/arm64"; then
              echo "::error::[${svc}] SBOM attestation failed — image UNATTESTED and undeployable"
              rc=1; continue
            fi
            # SLSA build provenance (ADR-0030 D4, #8590 #14): binds the image to the repo/commit/
            # workflow/run that built it — the claim neither the signature nor the SBOM attestation
            # carries. Fatal in CI: kyverno's verify-openbank-image-slsa-provenance is Audit today
            # and graduates like the SBOM policy did, so an image that ships without provenance
            # becomes tomorrow's redeploy worklist.
            if ! cosign_attest_slsa_provenance "$image"; then
              echo "::error::[${svc}] SLSA provenance attestation failed"
              rc=1; continue
            fi
            echo "    [${svc}] attested + verified (SBOM + SLSA provenance)"
          done
          [ "$rc" -eq 0 ] || {
            echo "::error::One or more images are UNATTESTED. kyverno (verify-openbank-image-sbom-attestation, Enforce) will DENY their pods on the next reschedule."
            exit 1
          }

      # Fleet SBOM attestation — the gate that binds the deploy (issue #2947).
      #
      # `fleet-attestation.yml` runs exactly this check on gitops PRs, and it is not one of the
      # five required contexts — it cannot be, being `paths:`-filtered, since GitHub holds a
      # path-filtered required context as permanently "Expected". So the auto-deploy snapshot PR
      # auto-merged without waiting for it: measured, 8 of the last 10 merged 24-65 s BEFORE the
      # gate finished. All eight passed, which is luck about timing rather than a property of the
      # process.
      #
      # What that risks is not a red deploy. Kyverno verifies at ADMISSION, not continuously, so
      # an unattested image whose pods are already running keeps running, and is denied the next
      # time anything reschedules it — a deploy that looks fine for days and then cannot come
      # back. That is the admin-ui outage of 2026-07-09.
      #
      # HERE rather than in `Validate manifests`: this is the earliest point at which the answer
      # can be known, and the PR then cannot exist for an unattested fleet at all. It also needs
      # no new permission — this job already holds `id-token: write` and an ECR login for the
      # push and the attestation above — whereas the required-check placement would have put
      # `id-token: write` on a job that runs on every PR in the repo.
      #
      # AFTER the attestation step, never racing it: #1226 is exactly what a cancellation between
      # `Docker push` and `Attest image SBOMs` costs. The images built by THIS run are already
      # proven by that step (it binds the verify to the serialNumber trivy minted per image); what
      # this adds is every OTHER image the fleet still declares, which is where a latent gap
      # actually hides. A failure here fails `build-push`, and `gitops-pr` needs it — so no
      # manifest PR is opened.
      #
      # The daily schedule on `fleet-attestation.yml` stays, and is not made redundant: a latent
      # gap can appear with no deploy at all (a registry lifecycle rule, a hand-pushed image).
      #
      # Exit 2 ("the probe could not run", #1915) also fails this step, deliberately: on the
      # deploy path an unchecked fleet must not open a gitops PR. The distinction still
      # matters for the OPERATOR — a 2 is a registry/credential problem to re-run, never an
      # image to rebuild — and the script says which one it is in its own last two lines.
      - name: Fleet SBOM attestation gate (issue #2947)
        timeout-minutes: 20  # measured max 198s on the same check in fleet-attestation.yml
        run: bash .github/scripts/check-fleet-attestations.sh

      - name: Collect image tags
        id: collect
        run: |
          set -euo pipefail
          SERVICES='${{ needs.changes.outputs.services }}'
          TAG="${{ steps.build.outputs.tag }}"

          # Emit { "openbank-account-service": "sandbox-abc1234", … }
          # -c (compact) is required: a pretty-printed (multi-line) jq value breaks the
          # `key=value` $GITHUB_OUTPUT format ("Invalid format") — this step never ran
          # before the credentials fix let the pipeline reach it.
          MAP="{}"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            MAP="$(echo "$MAP" | jq -c --arg k "$svc" --arg v "$TAG" '. + {($k): $v}')"
          done
          echo "image_tags=${MAP}" >> "$GITHUB_OUTPUT"

  # ── 2b. Contract gate: can-i-deploy (ADR-0092) ───────────────────────────────
  # For each changed service, ask the Pact Broker whether the version about to ship
  # has verified contracts before the gitops image-tag PR opens — the same
  # fail-closed shape as the Trivy image-scan gate, once flipped to enforce.
  #
  # ENFORCE (ADR-0092): non-zero exit from can-i-deploy fails this job's own status (visible
  # in the run), but gitops-pr no longer treats it as an all-or-nothing gate — see the
  # `deployable` output below. A batch where 14/17 services fail must not silently prevent
  # record-deployment from ever running for the 3 that passed (issue #846 postmortem,
  # 2026-07-11): record-deployment was previously gated on this job's own success, so ONE
  # blocked service in a fleet-wide batch permanently starved the broker's deployed-version
  # matrix for every service in that batch, including the healthy ones — a circular deadlock
  # no amount of retrying could resolve on its own.
  # Broker has been stable since ADR-0092; consumer pacts + provider verification
  # results land via _service-ci on the same main SHA (--retry-while-unknown covers
  # the race). Services with no contracts are trivially deployable (404 probe below).
  can-i-deploy:
    name: can-i-deploy
    needs: [changes, build-push]
    if: needs.changes.outputs.any == 'true' && github.event.inputs.bootstrap_image_only != 'true'
    # Stays on the self-hosted pool: the Pact Broker has no public ingress
    # (ADR-0056) and is only resolvable over cluster DNS. ARC scale-to-zero
    # serves this label at ~$0 idle.
    runs-on: openbank-build
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # GitHub OIDC → assume the build runner role (webhook-independent AWS auth)
    timeout-minutes: 10
    outputs:
      # JSON array of services that passed their own can-i-deploy check, set even when the
      # step (and therefore this job) ultimately exits non-zero — step outputs written via
      # $GITHUB_OUTPUT persist regardless of the step's own exit code. Empty/unset when the
      # step didn't run at all (no PACT_BROKER_URL) — gitops-pr treats that as "no filter".
      deployable: ${{ steps.check.outputs.deployable }}
      # 'true' iff the gate step actually started (written before any fallible command).
      # Lets gitops-pr distinguish "gate absent (no broker) → no filter" from "gate ran but
      # crashed before a verdict → fail closed", which `deployable` alone cannot: both empty
      # (issue #1348).
      gate_ran: ${{ steps.check.outputs.gate_ran }}
    env:
      PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
      PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
      PACT_STANDALONE_VERSION: "2.6.2"
    steps:
      # This job had no checkout, so the #1420 money-path escalation below
      # (`awk ... openbank-libs/governance/rules.yaml`) crashed with "cannot open" —
      # latent until the scheduled reconcile started re-driving stranded (=often
      # blocked) services every tick, which is the only path that reliably enters that
      # block. Check out so rules.yaml is present and the money-path naming works.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The pact CLI runs natively on the ARC runner pod (which resolves the broker's
      # cluster DNS); the pact-cli docker image would run in dind and could not. The
      # standalone ships a linux arm64 build for the Graviton runner.
      #
      # Cache the extracted CLI keyed on its pinned version + runner arch. The flaky
      # github.com release download is the single point of failure that fail-closes the whole
      # contract gate (issue #1348/#1009) — after the first successful run it is restored from
      # cache and never re-downloaded. If the cache backend is unavailable on the ARC runner the
      # step no-ops (cache-hit=false) and the download+retry below runs as before — strictly no
      # worse than today.
      - name: Cache pact standalone CLI
        id: pact-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/pact
          key: pact-standalone-${{ env.PACT_STANDALONE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: can-i-deploy (per changed service)
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A ${{ }} expression is substituted by the runner before the shell sees it, so it
          # cannot survive extraction into a script — these three move to the environment.
          # SERVICES stays out of any concurrency.group: interpolating a fleet-sized list into
          # a group name silently stops the job being created (#3082/#3084); an env var has no
          # such ceiling.
          SERVICES: ${{ needs.changes.outputs.services }}
          INPUT_CODEPLOY: ${{ github.event.inputs.codeploy }}
          INPUT_CODEPLOY_PACT_VERSIONS: ${{ github.event.inputs.codeploy_pact_versions }}
        id: check
        if: ${{ vars.PACT_BROKER_URL != '' }}
        run: |
          # Extracted to .github/scripts/can-i-deploy-gate.sh (#4086). It sat at 18955 chars
          # against a 19000 ceiling whose breach makes the WHOLE workflow unparseable, so the
          # next comment anyone added here would have taken every contributor's deploy down.
          bash .github/scripts/can-i-deploy-gate.sh

  # ── 3. Update gitops manifests + open auto-merge PR ──────────────────────────
  gitops-pr:
    name: Gitops PR
    needs: [changes, build-push, can-i-deploy]
    # The pipeline's ONLY genuine serialisation point, and the sole thing the old
    # workflow-level concurrency was ever justified by: a second push while a deploy PR is
    # open would rewrite the same gitops lines and conflict. Cancelling HERE is safe and
    # keeps the original intent (newer commit wins the PR) — cancelling the whole workflow
    # was not, because by then build-push had already pushed images it would never attest
    # (#1226). Anything with side effects outside this job must stay outside this group.
    #
    # Keyed on `github.ref` alone this over-cancels two different ways (issues #1332, #1336):
    #   - A `workflow_dispatch` recovery run shares `refs/heads/main` with every routine push.
    #     The ops-recovery full-fleet rebuild takes ~40 minutes; any push landing inside that
    #     window shares the group and cancels the dispatch's PR step after 34 images were
    #     already built, pushed, signed and attested — for nothing (#1336).
    #   - Two routine pushes touching *disjoint* services (e.g. billing vs. lending) also
    #     share the group today and cancel each other, even though they'd rewrite different
    #     lines of different gitops manifests and can't conflict (#1332 path 1).
    # Folding in the event type + the changed-service set fixes both while preserving the
    # one case that genuinely needs serialising: two pushes that changed the *same* service
    # set still share a group and the newer one still wins, exactly as designed.
    concurrency:
      group: >-
        auto-deploy-gitops-pr-${{ github.ref }}-${{
          github.event_name == 'workflow_dispatch' && github.run_id || needs.changes.outputs.services_key
        }}
      cancel-in-progress: true
    # `always()` + explicit build-push check, NOT the default "can-i-deploy must succeed":
    # can-i-deploy's own job status can be red while still emitting a `deployable` output for
    # the services that individually passed (issue #846) — this job must still run to record
    # THOSE, or a single blocked service in a fleet-wide batch permanently starves
    # record-deployment for every other service in it, deadlocking the broker's view of
    # reality against itself with no self-healing path. Never runs if build-push itself
    # failed (nothing built to deploy) or was cancelled/skipped.
    if: |
      always() &&
      needs.changes.outputs.any == 'true' &&
      github.event.inputs.bootstrap_image_only != 'true' &&
      needs.build-push.result == 'success' &&
      needs.can-i-deploy.result != 'cancelled'
    runs-on: ubuntu-latest  # manifest rewrite + PR only; hosted-first (public repo, free)
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # GitHub OIDC → assume the build runner role (webhook-independent AWS auth)
    timeout-minutes: 10
    env:
      ECR_REGISTRY: "265175468565.dkr.ecr.eu-north-1.amazonaws.com"
      # Services can-i-deploy confirmed deployable, as a JSON array. Empty/unset (can-i-deploy
      # skipped entirely — no PACT_BROKER_URL) means "no filter, process everything", matching
      # the pre-fix behavior for that case; an explicit `[]` means "checked, none passed".
      DEPLOYABLE_SERVICES: ${{ needs.can-i-deploy.outputs.deployable || '' }}
      # 'true' when the contract gate ran (whatever its verdict); '' when it was absent
      # (no PACT_BROKER_URL). GATE_RAN=true together with an empty DEPLOYABLE_SERVICES means
      # the gate crashed before deciding — the fail-closed guard in the rewrite/record steps
      # keys on exactly that (issue #1348).
      GATE_RAN: ${{ needs.can-i-deploy.outputs.gate_ran || '' }}
      # Mirrored into env because the `secrets` context is NOT available in a step-level `if:`
      # — only job-level env can read it. Used solely to decide whether to mint an App token.
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
    steps:
      # persist-credentials: false — otherwise actions/checkout leaves its own
      # Authorization extraheader in the git config AND peter-evans/create-pull-request
      # adds the token header too, so the branch push sends two Authorization headers
      # ("Duplicate header: Authorization" → git 400) and the gitops PR never opens.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub signs API-created commits for GitHub *App* tokens (and the web UI's web-flow
      # key) — never for a user PAT. The old GITOPS_PR_TOKEN was a user PAT, so `sign-commits:
      # true` below faithfully routed the commit through the API and GitHub declined to sign it:
      # every bot deploy commit that fell to the PAT came out `verified=false; reason=unsigned`,
      # and required_signatures stranded the PR until a human re-signed it by hand (issue #1269).
      # That is exactly why the PAT was retired (#1305): an App installation token is the only
      # option that satisfies both constraints at once — it triggers the required checks
      # (GITHUB_TOKEN does not) AND its commits get signed (a PAT's do not).
      - name: Mint a GitHub App installation token
        id: app_token
        if: env.GITOPS_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Rewrite image tags in gitops manifests
        id: rewrite
        run: |
          set -euo pipefail
          # Recompute against LIVE main (#3194). Same exposure admin-ui-deploy.yml has: the
          # checkout holds github.sha, the build takes minutes, and create-pull-request branches
          # from that HEAD. If another deploy merges in the window, both sides have rewritten the
          # same image: line and the PR is born CONFLICTED — which means no refs/pull/<n>/merge
          # and therefore NO workflow run at all. Not skipped, absent. It renders as "waiting",
          # never as broken, and the image is never deployed.
          #
          # Safe because the rewrite is deterministic — pin each image: to the tag just built —
          # so recomputing against a newer main is always correct.
          git fetch origin main
          git reset --hard origin/main
          IMAGE_TAGS='${{ needs.build-push.outputs.image_tags }}'
          UPDATED=()

          # FAIL CLOSED when the contract gate ran but crashed before emitting a verdict
          # (GATE_RAN=true, DEPLOYABLE_SERVICES empty). Without this the empty verdict was read
          # as "no filter" and EVERY changed service got deployed AND recorded to the broker as
          # a version that was never contract-checked — the money-path fail-open behind #1348.
          # Deploy nothing this run: the run is already red from can-i-deploy, so it is loud and
          # re-dispatchable. GATE_RAN empty = no broker at all = the legitimate no-filter case,
          # left to the per-service logic below.
          if [ "${GATE_RAN}" = "true" ] && [ -z "${DEPLOYABLE_SERVICES}" ]; then
            echo "::error::can-i-deploy ran but produced no verdict (crashed before deciding) — failing closed: deploying nothing this run rather than deploying every service unchecked (#1348). Re-dispatch once the gate can run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for svc in $(echo "$IMAGE_TAGS" | jq -r 'keys[]'); do
            # DEPLOYABLE_SERVICES empty/unset = can-i-deploy didn't run at all (no filter,
            # process everything, matching pre-fix behavior). Otherwise it's an explicit JSON
            # array (possibly []) — only services can-i-deploy actually confirmed get their
            # manifest rewritten (issue #846: a batch-mate's failure must not block this one).
            if [ -n "${DEPLOYABLE_SERVICES}" ] && \
               ! echo "${DEPLOYABLE_SERVICES}" | jq -e --arg s "$svc" 'index($s) != null' >/dev/null; then
              echo "  [${svc}] blocked by can-i-deploy this run — skipping manifest update"
              continue
            fi
            tag="$(echo "$IMAGE_TAGS" | jq -r --arg k "$svc" '.[$k]')"
            image="${ECR_REGISTRY}/${svc}"

            # Find the gitops manifest that references this service's ECR image.
            manifests="$(grep -rl "${image}:sandbox-" openbank-infra/gitops/components 2>/dev/null || true)"
            if [ -z "$manifests" ]; then
              echo "WARN: no gitops manifest references ${image}:sandbox-* — skip"
              continue
            fi

            for f in $manifests; do
              old_tag="$(grep -oE "${image}:sandbox-[A-Za-z0-9._-]+" "$f" | head -1 | cut -d: -f2 || true)"
              if [ "$old_tag" = "$tag" ]; then
                echo "  [${svc}] already at ${tag} in ${f}"
                continue
              fi
              sed -i.bak "s|${image}:sandbox-[A-Za-z0-9._-]*|${image}:${tag}|g" "$f"
              rm -f "${f}.bak"
              echo "  [${svc}] ${old_tag:-?} → ${tag} in ${f}"
              UPDATED+=("$f")
            done
          done

          if [ "${#UPDATED[@]}" -eq 0 ]; then
            echo "No manifests changed — all images already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "${GATE_RAN}" = "true" ] && [ "${DEPLOYABLE_SERVICES}" = "[]" ]; then
              echo "::error::contract gate ran but no service was deployable — failing gitops-pr closed so the run is not silently green (issue #3432)"
              exit 1
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${UPDATED[@]}"
          fi

      - name: Open gitops PR
        id: gitops_pr
        if: steps.rewrite.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Preference order, and why each rung exists:
          #   1. App installation token — triggers required checks AND gets its commit signed.
          #      The only rung that actually works end-to-end (issue #1269). Proven on both
          #      axes, so it is now the sole real path (the GITOPS_PR_TOKEN user PAT was retired
          #      here, issue #1305 — its commits were unsigned and stranded the PR anyway).
          #   2. GITHUB_TOKEN — last-resort only; a PR opened with it does NOT trigger workflows
          #      (anti-recursion), so the required checks never run and there is nothing to
          #      auto-merge against (an admin merges it by hand). This is a degraded fallback,
          #      not a working path — it exists so a broken App-token mint still opens a
          #      rescuable PR rather than dropping the deploy silently.
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          # Route the commit through the GitHub API so GitHub can sign it. Necessary but NOT
          # sufficient on its own — the token above decides whether the signing actually
          # happens. The "Verify the deploy commit is signed" step below is what proves it did.
          sign-commits: true
          # A deploy PR is about gitops manifests and nothing else. Scoping the commit makes that
          # a property rather than a hope: create-pull-request otherwise commits whatever is dirty,
          # so any generator or tool that writes into the tree earlier in the job silently becomes
          # part of the deploy. See admin-ui-deploy.yml for the three defects that caused there.
          add-paths: openbank-infra/gitops/**
          # workflow_dispatch may run from a recovery ref. Without an explicit base,
          # create-pull-request targets that stale ref and includes every intervening main
          # commit in the deploy PR instead of only the rewritten GitOps manifests.
          base: main
          branch: chore/gitops-auto-deploy-${{ github.sha }}
          delete-branch: true
          commit-message: "chore(gitops): auto-deploy sandbox-${{ github.sha && github.sha || '' }}"
          title: "chore(gitops): auto-deploy services @ ${{ github.sha }}"
          body: |
            Automated gitops image-tag update triggered by commit ${{ github.sha }}.

            **Changed services:** ${{ needs.changes.outputs.services }}

            Each image tag was updated to `sandbox-${{ github.sha }}` (the short SHA of the
            triggering commit). ArgoCD syncs automatically after merge.

            ## Linked issues

            N/A — automated gitops update, no user-visible change.
          labels: |
            chore
            gitops

      # Close every OLDER open deploy PR now that this one exists. A deploy PR rewrites an image tag
      # to the newest build, so two are never additive and both edit the same manifest line — left
      # open, whichever merges first leaves the rest conflicting while still reading as healthy
      # (green checks, auto-merge armed). branch-cleanup.yml already assumed this close happened
      # ("a superseded deploy PR is CLOSED-unmerged"); nothing ever performed it, and the backlog
      # reached 7 of the repo's 23 open PRs. Runs BEFORE the signature guard so a run that later
      # fails the guard still leaves exactly one current deploy PR behind, not a growing pile.
      - name: Close superseded deploy PRs
        if: steps.gitops_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .github/scripts/supersede-deploy-prs.sh \
            'chore/gitops-auto-deploy-' '${{ steps.gitops_pr.outputs.pull-request-number }}'
      # peter-evans/create-pull-request has no auto-merge input (the old `auto-merge: squash`
      # was silently ignored). Enable it explicitly. Only effective when the App token is
      # minted — otherwise the GITHUB_TOKEN PR's required checks never run and there is nothing
      # to merge against (an admin merges it by hand, as today).
      # github-script (octokit), NOT gh — the openbank-build runner image has no gh CLI.
      # enablePullRequestAutoMerge is rejected ("Pull request is in clean status") until the
      # PR's required check runs register, which lags PR creation, so retry until it sticks.
      # Runs BEFORE the signature guard on purpose: arming auto-merge is what lets a manual
      # re-sign land by itself, so it must happen even on the run where the guard then fails.
      - name: Enable auto-merge
        if: steps.gitops_pr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = Number('${{ steps.gitops_pr.outputs.pull-request-number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number,
            });
            const mutation = `mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                pullRequest { number }
              }
            }`;
            for (let i = 1; i <= 8; i++) {
              try {
                await github.graphql(mutation, { id: pr.node_id });
                core.info(`auto-merge enabled (attempt ${i})`);
                return;
              } catch (e) {
                core.info(`attempt ${i}/8 not ready: ${e.message}`);
                await new Promise(r => setTimeout(r, 12000));
              }
            }
            // setFailed, NOT notice (issue #6231): a deploy PR with auto-merge unarmed never
            // merges, so the deploy silently does not happen — and a notice leaves the job, the
            // workflow and `Deploy signal` all green, with the only evidence one line in a job
            // nobody opens. That is the repo's "green run that deployed nothing" shape. The PR
            // itself is left open and rescuable; what changes is that the run now says so.
            core.setFailed(
              `auto-merge could not be enabled on PR #${pull_number} after 8 attempts, so this deploy ` +
              `will NOT land on its own — the PR stays open until someone merges it. Check the App ` +
              `token (GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY) and branch protection.`
            );

      # The failure this guards against is silent by construction: create-pull-request logs
      # "Commit verified: false; reason: unsigned" and exits 0, the PR opens with every check
      # green and auto-merge armed, and it simply never merges. That reads as healthy from
      # every angle except the one nobody checks — which is how #806 shipped a fix that
      # no-opped for five days and stranded seven deploy PRs at once (issue #1269).
      # Fail loudly instead: an unsigned commit means required_signatures WILL strand this PR.
      #
      # `always()`, deliberate: this must report an unsigned deploy commit even if an earlier
      # step failed. (record-deployment used to live in this job as the last step and is why
      # ordering mattered here; it now runs on gitops-PR MERGE — record-deployment-on-merge.yml,
      # issue #1420 — so this is simply the last check and can fail without starving anything.)
      - name: Verify the deploy commit is signed
        if: ${{ always() && steps.gitops_pr.outputs.pull-request-number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = Number('${{ steps.gitops_pr.outputs.pull-request-number }}');
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner, repo: context.repo.repo, pull_number,
            });
            const unsigned = commits.filter(c => !c.commit.verification?.verified);
            if (unsigned.length === 0) {
              core.info(`all ${commits.length} commit(s) on PR #${pull_number} are signed and verified`);
              return;
            }
            for (const c of unsigned) {
              core.error(`${c.sha}: verified=false reason=${c.commit.verification?.reason ?? 'unknown'} committer=${c.commit.committer?.name}`);
            }
            core.setFailed(
              `PR #${pull_number} carries ${unsigned.length} unsigned commit(s); the main ruleset's ` +
              `required_signatures will block it and this deploy will never land. ` +
              `Most likely cause: no GitHub App token — GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY unset, so the ` +
              `run fell back to GITHUB_TOKEN, whose PR does not trigger the required checks (anti-recursion), ` +
              `so auto-merge can never fire (the GITOPS_PR_TOKEN user-PAT fallback was retired in #1305). ` +
              `To rescue this PR by hand: amend the commit locally with a GPG signature and force-push, then ` +
              `re-run the required checks — auto-merge fires on its own once they pass and the signature is valid. ` +
              `The durable fix is to restore the App token (GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY).`
            );

  # ── 4. Make a stranded deploy visible (issue #1332) ───────────────────────────
  # "Merged + green CI" is silently NOT the same as "deployed". A service whose build-push
  # succeeded but whose gitops-pr step then got cancelled (concurrency group collision) or
  # failed (e.g. the App token / signing guard above) produces no error at the workflow level
  # that names the service — the run just ends `cancelled` or is buried in a job most people
  # never open. This job is the "at minimum a job summary" half of #1332's ask: it does not
  # fix either underlying cause (that's the concurrency-group change above, plus whatever
  # fixes a signing/can-i-deploy failure) — it only guarantees the outcome is visible without
  # reading run logs.
  deploy-signal:
    name: Deploy signal
    needs: [changes, build-push, gitops-pr]
    if: always() && needs.changes.outputs.any == 'true' && needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report undelivered deploy
        env:
          CHANGED_SERVICES: ${{ needs.changes.outputs.services }}
          GITOPS_PR_RESULT: ${{ needs.gitops-pr.result }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$GITOPS_PR_RESULT" = "success" ]; then
            echo "gitops-pr succeeded for ${RUN_SHA::8} — nothing to report."
            exit 0
          fi
          {
            echo "## :rotating_light: Deploy did not land for \`${RUN_SHA:0:8}\`"
            echo
            echo "\`build-push\` succeeded, building images for these changed services:"
            echo
            echo '```json'
            echo "$CHANGED_SERVICES"
            echo '```'
            echo
            echo "but \`gitops-pr\` ended **${GITOPS_PR_RESULT}** — no manifest PR (or none of the" \
                 "services above got recorded/merged). This means the build was thrown away:" \
                 "re-dispatch to recover (\`gh workflow run auto-deploy.yml -f services=<svc>\`), or" \
                 "inspect the \`gitops-pr\` job for the concurrency-group / signing / can-i-deploy" \
                 "failure that stopped it."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::deploy for ${RUN_SHA::8} did not land — gitops-pr ended ${GITOPS_PR_RESULT} after build-push succeeded (services: ${CHANGED_SERVICES})"
          # Fail the job (only this new, non-blocking job — nothing downstream needs it) so the
          # run's overall status flags red and is findable without opening every job's log.
          exit 1
