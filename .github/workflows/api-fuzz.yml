# ─────────────────────────────────────────────────────────────────────────────
# API fuzzing (schemathesis) — weekly DAST pass over service OpenAPI contracts
# ─────────────────────────────────────────────────────────────────────────────
# Property-based fuzzing of the real HTTP surface, driven by each service's own
# openapi.yaml (the contract is already the source of truth, ADR-0005 — DAST is
# nearly free). The service boots in Quarkus dev mode (%dev profile: OIDC off,
# see each service's application.yaml) against a throwaway postgres, and
# schemathesis asserts ONE property: no input — however malformed — produces a
# 5xx. That is the public-surface hardening guarantee a pentest probes first
# (ADR-0080), and it exercises routing, parameter conversion and exception
# mappers that unit tests skip.
#
# v1 scope is the UNAUTHENTICATED surface: endpoints behind @RolesAllowed
# answer 401/403 (which also regression-tests that auth is uniformly enforced
# — an endpoint that loses its annotation starts answering 2xx to anonymous
# fuzz traffic and shows up here). Authenticated fuzzing (Keycloak dev-service
# + token) is the tracked follow-up.
#
# SCOPE (2026-08-01, #2365): the money-path services are now in. Before this, the default list
# was five services of which only consent-service was money-path — so eighteen of the twenty
# money-path services had never been adversarially tested by anything in this repo, and the
# `pentest` attestation was blocked on an event that could not happen. This is the cheapest way
# to unblock it: the harness already worked, it was just pointed elsewhere.
#
# Sequential-loop -> MATRIX, because the scope change forces it: 23 services through one 45-minute
# job (postgres + gradle + quarkusDev boot + fuzz, each) does not fit. One runner per service is
# also strictly better than the loop was — `fail-fast: false` means a service that cannot boot
# reports itself instead of consuming the budget of everything after it in the list, which the
# shared `OVERALL=1` used to hide.
#
# Batch lane (openbank-batch): weekly + manual, never a PR gate (ADR-0053).
name: API fuzz

on:
  schedule:
    - cron: "30 5 * * 2"   # weekly Tue 05:30 UTC — after the Monday dep bumps
    - cron: "30 5 * * 4"   # weekly Thu 05:30 UTC
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated service modules to fuzz (blank = derived money-path + legacy set)"
        required: false
        default: ""
      max_examples:
        description: "Hypothesis examples per endpoint"
        required: false
        default: "75"

permissions:
  contents: read

concurrency:
  group: api-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: derive fuzz scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.derive.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scope is DERIVED from rules.yaml money_path_services plus the legacy set, never hand-kept:
      # a service that becomes money-path is fuzzed the day rules.yaml says so. A service that
      # cannot be fuzzed is EXCLUDED OUT LOUD with its reason — a silently shortened list reads as
      # "covered" when it is not, which is the failure this whole issue is about.
      # The harness's boot-failure CLASSIFIER, exercised against a known crash and a known
      # timeout before the matrix runs. #6492 was eighteen days of a timeout reported as a
      # failure; a diagnostic that has only ever printed one message cannot be trusted to tell
      # the two apart, so prove it here rather than assume it. ~0.1s.
      - name: Self-test the fuzz harness diagnostics
        run: .github/scripts/fuzz-services.sh --self-test

      - name: Derive service list
        id: derive
        env:
          OVERRIDE: ${{ github.event.inputs.services }}
        run: |
          # The scope is DERIVED, in one place, and openbank-libs/governance/fuzz-coverage.yaml
          # is reconciled against the same function by check-readiness-attestations.py. It used
          # to be computed inline here and restated by hand there -- a gate whose scope is a
          # hand-kept list of the thing it checks reads as PASSING when the list is short,
          # never as UNCHECKED (#5849).
          python3 .github/scripts/derive-fuzz-scope.py --github-output ${OVERRIDE:+--override $OVERRIDE}

  fuzz:
    name: "schemathesis (${{ matrix.service }})"
    needs: prepare
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 30
    strategy:
      # One service must not mask another. The old sequential loop shared a single OVERALL=1, so a
      # boot failure early in the list hid every result after it.
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      # Throwaway credentials for the job-local postgres container only.
      POSTGRES_PASSWORD: "fuzz-ci-throwaway"
      SERVICES: ${{ matrix.service }}
      MAX_EXAMPLES: ${{ github.event.inputs.max_examples || '75' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # A cold Gradle wrapper distribution download (services.gradle.org) can itself take
      # 2-3 minutes on a cache miss — long enough to burn through the FIRST service's whole
      # 90x2s readiness wait below before its JVM even starts, reporting a false "failed to
      # boot". Pay that cost here, once, outside any per-service timing budget.
      - name: Warm Gradle wrapper
        run: ./gradlew --version

      - name: Install schemathesis
        run: |
          set -euo pipefail
          # Pinned: v3 CLI flags are load-bearing below (v4 renamed them).
          # Hash-locked (OpenSSF Scorecard Pinned-Dependencies: pipCommand) via a full
          # transitive lockfile (schemathesis's ~20 direct + further transitive deps),
          # generated with pip-compile --generate-hashes — see
          # .github/workflows/requirements/schemathesis.in for the regeneration command.
          python3 -m pip install --user --quiet --require-hashes \
            -r .github/workflows/requirements/schemathesis.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fuzz services
        run: .github/scripts/fuzz-services.sh

      # ─────────────────────────────────────────────────────────────────────────
      # WHAT the run exercised, not merely that it ran (#5769).
      #
      # A green job is not interchangeable across services: consent reached 3 operations
      # past the auth layer and found two genuine 5xx, while settlement's whole API is one
      # operation behind @RolesAllowed — same shade of green, and until this step nothing
      # recorded the difference. The `pentest` attestation is minted off these runs, so a
      # bare green was buying a bank-grade cell for a job that proved boot + auth and
      # nothing else.
      #
      # Both numbers are schemathesis's OWN output, parsed rather than recomputed:
      #   `Operations:  N selected / M total`
      #   `Authentication failed: K operations returned authentication errors`  (absent = 0)
      #
      # An UNPARSEABLE log is an error, never a zero. A zero-filled record would read as
      # "measured, empty surface" — indistinguishable from the real thing, and exactly the
      # successful-no-op shape this step exists to end. If schemathesis changes its wording,
      # this goes red and the floor keeps meaning what it says.
      - name: Record exercised surface
        if: always()
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os, pathlib, re, sys

          ANSI = re.compile(r"\x1b\[[0-9;]*m")
          OPS = re.compile(r"Operations:\s+(\d+)\s+selected\s*/\s*(\d+)\s+total")
          AUTH = re.compile(r"Authentication failed:\s+(\d+)\s+operations?\s+returned")
          FLOOR = 3   # keep in sync with MIN_EXERCISED_OPS in check-readiness-attestations.py

          reports = pathlib.Path("fuzz-reports")
          logs = sorted(reports.glob("*-fuzz.log"))
          if not logs:
              # The service never got as far as being fuzzed (boot failure, no postgres).
              # That is already an ::error:: above; say so here too so the absence of a
              # coverage record is explained rather than silent.
              print("::warning::no *-fuzz.log — nothing was fuzzed, so no coverage is recorded")
              sys.exit(0)

          status = 0
          summary = []
          for log in logs:
              svc = log.name[: -len("-fuzz.log")]
              text = ANSI.sub("", log.read_text(encoding="utf-8", errors="replace"))
              ops = OPS.search(text)
              if not ops:
                  print(f"::error::[{svc}] schemathesis printed no `Operations: N selected / M "
                        f"total` line — coverage cannot be recorded and no pentest attestation "
                        f"may be minted from this run")
                  status = 1
                  continue
              selected, total = int(ops.group(1)), int(ops.group(2))
              auth = int(AUTH.search(text).group(1)) if AUTH.search(text) else 0
              exercised = selected - auth
              state = "fuzzed" if exercised >= FLOOR else "auth-only-surface"
              short = re.sub(r"^openbank-", "", re.sub(r"-service$", "", svc))
              run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                         f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
              block = (
                  f"{short}:\n"
                  f"  coverage: {{ date: {dt.date.today().isoformat()}, run: {run_url}, "
                  f"selected: {selected}, total: {total}, auth_errors: {auth}, "
                  f"state: {state} }}\n"
              )
              (reports / f"{svc}-coverage.yaml").write_text(block, encoding="utf-8")
              print(f"==> [{svc}] {selected}/{total} selected, {auth} auth-only, "
                    f"{exercised} exercised -> {state}")
              if state != "fuzzed":
                  print(f"::warning::[{svc}] {exercised} operation(s) exercised past the auth "
                        f"layer (floor {FLOOR}) — this green proves boot + uniform auth "
                        f"enforcement, and is NOT a pentest for attestation purposes")
              summary.append(block)

          if (path := os.environ.get("GITHUB_STEP_SUMMARY")) and summary:
              with open(path, "a", encoding="utf-8") as fh:
                  fh.write("### api-fuzz coverage — paste into "
                           "`openbank-libs/governance/fuzz-coverage.yaml`\n\n```yaml\n")
                  fh.writelines(summary)
                  fh.write("```\n")
          sys.exit(status)
          PY

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-fuzz-reports-${{ matrix.service }}
          path: fuzz-reports/
          retention-days: 30
