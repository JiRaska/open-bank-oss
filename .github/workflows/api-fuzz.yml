# ─────────────────────────────────────────────────────────────────────────────
# API fuzzing (schemathesis) — weekly DAST pass over service OpenAPI contracts
# ─────────────────────────────────────────────────────────────────────────────
# Property-based fuzzing of the real HTTP surface, driven by each service's own
# openapi.yaml (the contract is already the source of truth, ADR-0005 — DAST is
# nearly free). The service boots in Quarkus dev mode (%dev profile: OIDC off,
# see each service's application.yaml) against a throwaway postgres, and
# schemathesis asserts ONE property: no input — however malformed — produces a
# 5xx. That is the public-surface hardening guarantee a pentest probes first
# (ADR-0080), and it exercises routing, parameter conversion and exception
# mappers that unit tests skip.
#
# v1 scope is the UNAUTHENTICATED surface: endpoints behind @RolesAllowed
# answer 401/403 (which also regression-tests that auth is uniformly enforced
# — an endpoint that loses its annotation starts answering 2xx to anonymous
# fuzz traffic and shows up here). Authenticated fuzzing (Keycloak dev-service
# + token) is the tracked follow-up.
#
# SCOPE (2026-08-01, #2365): the money-path services are now in. Before this, the default list
# was five services of which only consent-service was money-path — so eighteen of the twenty
# money-path services had never been adversarially tested by anything in this repo, and the
# `pentest` attestation was blocked on an event that could not happen. This is the cheapest way
# to unblock it: the harness already worked, it was just pointed elsewhere.
#
# Sequential-loop -> MATRIX, because the scope change forces it: 23 services through one 45-minute
# job (postgres + gradle + quarkusDev boot + fuzz, each) does not fit. One runner per service is
# also strictly better than the loop was — `fail-fast: false` means a service that cannot boot
# reports itself instead of consuming the budget of everything after it in the list, which the
# shared `OVERALL=1` used to hide.
#
# Batch lane (openbank-batch): weekly + manual, never a PR gate (ADR-0053).
name: API fuzz

on:
  schedule:
    - cron: "30 5 * * 2"   # weekly Tue 05:30 UTC — after the Monday dep bumps
    - cron: "30 5 * * 4"   # weekly Thu 05:30 UTC
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated service modules to fuzz (blank = derived money-path + legacy set)"
        required: false
        default: ""
      max_examples:
        description: "Hypothesis examples per endpoint"
        required: false
        default: "75"

permissions:
  contents: read

concurrency:
  group: api-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: derive fuzz scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.derive.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scope is DERIVED from rules.yaml money_path_services plus the legacy set, never hand-kept:
      # a service that becomes money-path is fuzzed the day rules.yaml says so. A service that
      # cannot be fuzzed is EXCLUDED OUT LOUD with its reason — a silently shortened list reads as
      # "covered" when it is not, which is the failure this whole issue is about.
      - name: Derive service list
        id: derive
        env:
          OVERRIDE: ${{ github.event.inputs.services }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, yaml

          override = (os.environ.get("OVERRIDE") or "").split()
          legacy = [
              "openbank-dispute-service", "openbank-party-service", "openbank-kyc-service",
              "openbank-notification-service", "openbank-consent-service",
          ]
          money = yaml.safe_load(open("openbank-libs/governance/rules.yaml"))["money_path_services"]
          candidates = override or list(dict.fromkeys(money + legacy))

          keep, skipped = [], []
          for svc in candidates:
              app = pathlib.Path(svc) / "src/main/resources/application.yaml"
              spec = pathlib.Path(svc) / "src/main/resources/openapi.yaml"
              if not app.is_file() or not spec.is_file():
                  skipped.append((svc, "no application.yaml or openapi.yaml")); continue
              raw = app.read_text()
              port = re.search(r"^  http:\n(?:.*\n)?\s*port:\s*(\d+)", raw, re.M)
              # Reactive-only services carry no jdbc: URL (their Agroal datasource is
              # supplied at boot below). The DB name is in the reactive URL all the same.
              db = re.search(r"(?:jdbc:)?(?:vertx-reactive:)?postgresql://[^/]+/([A-Za-z0-9_]+)", raw)
              if not port:
                  skipped.append((svc, "no derivable quarkus.http.port")); continue
              if not db:
                  skipped.append((svc, "no postgresql:// URL — the harness cannot provision its DB")); continue
              keep.append(svc)

          for svc, why in skipped:
              print(f"::warning::api-fuzz: {svc} EXCLUDED — {why}")
          print(f"fuzzing {len(keep)} service(s); {len(skipped)} excluded")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("services=" + json.dumps(keep) + "\n")
          PY

  fuzz:
    name: "schemathesis (${{ matrix.service }})"
    needs: prepare
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 30
    strategy:
      # One service must not mask another. The old sequential loop shared a single OVERALL=1, so a
      # boot failure early in the list hid every result after it.
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      # Throwaway credentials for the job-local postgres container only.
      POSTGRES_PASSWORD: "fuzz-ci-throwaway"
      SERVICES: ${{ matrix.service }}
      MAX_EXAMPLES: ${{ github.event.inputs.max_examples || '75' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # A cold Gradle wrapper distribution download (services.gradle.org) can itself take
      # 2-3 minutes on a cache miss — long enough to burn through the FIRST service's whole
      # 90x2s readiness wait below before its JVM even starts, reporting a false "failed to
      # boot". Pay that cost here, once, outside any per-service timing budget.
      - name: Warm Gradle wrapper
        run: ./gradlew --version

      - name: Install schemathesis
        run: |
          set -euo pipefail
          # Pinned: v3 CLI flags are load-bearing below (v4 renamed them).
          # Hash-locked (OpenSSF Scorecard Pinned-Dependencies: pipCommand) via a full
          # transitive lockfile (schemathesis's ~20 direct + further transitive deps),
          # generated with pip-compile --generate-hashes — see
          # .github/workflows/requirements/schemathesis.in for the regeneration command.
          python3 -m pip install --user --quiet --require-hashes \
            -r .github/workflows/requirements/schemathesis.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fuzz services
        run: |
          set -uo pipefail
          mkdir -p fuzz-reports
          OVERALL=0

          for svc in $SERVICES; do
            APP_YAML="${svc}/src/main/resources/application.yaml"
            SPEC="${svc}/src/main/resources/openapi.yaml"
            if [ ! -f "$APP_YAML" ] || [ ! -f "$SPEC" ]; then
              echo "::error::[${svc}] missing application.yaml or openapi.yaml — skip"
              OVERALL=1; continue
            fi

            # Derive the HTTP port and database name from the service's own
            # config — no per-service table to rot.
            PORT="$(grep -m1 -A3 '^  http:' "$APP_YAML" | grep -m1 'port:' | grep -oE '[0-9]+')"
            DB="$(grep -m1 -E 'postgresql://' "$APP_YAML" | sed -E 's|.*/([A-Za-z0-9_]+).*|\1|')"
            DBUSER="$(grep -m1 '^    username:' "$APP_YAML" | awk '{print $2}')"
            echo "==> [${svc}] port=${PORT} db=${DB} user=${DBUSER}"

            # Job-local postgres on the localhost:5432 the %dev profile
            # expects. NB: the batch pool's chart-managed dind has no
            # registry-mirror (unlike the build pool) — this pull hits Docker
            # Hub directly; weekly cadence keeps it under the anon rate limit.
            docker rm -f fuzz-pg >/dev/null 2>&1 || true
            docker run -d --name fuzz-pg -p 5432:5432 \
              -e POSTGRES_USER="${DBUSER}" \
              -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
              -e POSTGRES_DB="${DB}" \
              postgres:16.3-alpine >/dev/null
            PG_UP=0
            for i in $(seq 1 30); do
              docker exec fuzz-pg pg_isready -U "${DBUSER}" >/dev/null 2>&1 && { PG_UP=1; break; }
              sleep 2
            done
            if [ "$PG_UP" != "1" ]; then
              echo "::error::[${svc}] postgres never became ready — skip"
              OVERALL=1
              docker rm -f fuzz-pg >/dev/null 2>&1 || true
              continue
            fi

            # Quarkus dev mode: %dev disables OIDC; Flyway migrates at start.
            # Kafka producers are lazy — no broker needed for the HTTP surface
            # (the transactional outbox keeps brokers out of the request path).
            echo "==> [${svc}] starting quarkusDev"
            ./gradlew ":${svc}:quarkusDev" \
              -Dquarkus.datasource.jdbc.url="jdbc:postgresql://localhost:5432/${DB}" \
              -Dquarkus.console.basic=true \
              --console=plain --quiet \
              > "fuzz-reports/${svc}-boot.log" 2>&1 &
            DEV_PID=$!

            # Readiness = the main HTTP socket answers anything (000 = conn
            # refused). /q/* may live on the management port in prod profiles;
            # here only socket-open matters before pointing schemathesis at it.
            UP=0
            for i in $(seq 1 90); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/q/health" || true)"
              if [ "$code" != "000" ]; then UP=1; break; fi
              kill -0 "$DEV_PID" 2>/dev/null || break
              sleep 2
            done
            if [ "$UP" != "1" ]; then
              echo "::error::[${svc}] failed to boot — see ${svc}-boot.log artifact"
              tail -50 "fuzz-reports/${svc}-boot.log" || true
              OVERALL=1
            else
              echo "==> [${svc}] fuzzing http://localhost:${PORT}"
              # schemathesis 4.x CLI (bumped from 3.39.16 to close 6 Dependabot alerts on
              # transitive starlette/pytest — schemathesis 3.x hard-caps pytest<9 and
              # starlette<1, so the vulnerable pins couldn't be bumped without this jump):
              #   --base-url        -> --url (same semantics)
              #   --hypothesis-max-examples -> --max-examples (dropped hypothesis- prefix)
              #   --hypothesis-deadline     -> removed; no CLI equivalent in 4.x (deadline
              #                                is no longer user-configurable this way)
              #   --request-timeout unit changed ms -> seconds (5000ms was the old value)
              #   --experimental=openapi-3.1 -> removed; OpenAPI 3.1 support is now default
              #   --junit-xml       -> --report junit --report-junit-path
              schemathesis run "$SPEC" \
                --url "http://localhost:${PORT}" \
                --checks not_a_server_error \
                --max-examples "${MAX_EXAMPLES}" \
                --request-timeout 5 \
                --report junit --report-junit-path "fuzz-reports/${svc}-junit.xml" \
                | tee "fuzz-reports/${svc}-fuzz.log" || OVERALL=1
            fi

            # Teardown before the next service re-binds 5432/dev port.
            kill "$DEV_PID" 2>/dev/null || true
            pkill -f "quarkusDev" 2>/dev/null || true
            sleep 3
            docker rm -f fuzz-pg >/dev/null 2>&1 || true
          done

          exit "$OVERALL"

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-fuzz-reports-${{ matrix.service }}
          path: fuzz-reports/
          retention-days: 30
