# Dependabot auto-merge (OSS-readiness D4, ADR-0119 §D4).
#
# Policy: auto-merge PATCH Dependabot PRs (gradle, npm) once CI is green.
# Everything else stays open for human review:
#   - Minor + major bumps (any ecosystem) — minors regularly carry new transitive
#     dependencies and deserve semantic review even though dependency-submission
#     plus dependency-review scan the submitted Gradle graph for known CVEs.
#   - github-actions bumps (any size) — a version bump swaps the pinned commit SHA
#     for NEW action code that then runs in CI with contents:write/id-token:write.
#     A human must eyeball the diff of what will execute with those permissions.
#   - docker bumps (any size) — base-image changes alter the runtime attack surface
#     of every service built on them; same eyeball rule.
#   - PRs that are not authored by dependabot[bot]
#
# Note: dependabot-verification-metadata.yml auto-recomputes gradle checksums from
# whatever Maven Central serves at PR time, so verification-metadata.xml is NOT a
# defense against a poisoned upstream release riding an auto-merge — human review
# of minors is.
#
# Dependabot PR runs cannot read Actions secrets. This workflow classifies the
# patch and passes only its identity to a separate workflow_run job, which mints
# an App token to arm native auto-merge after validating the PR again. A merge
# armed with GITHUB_TOKEN suppresses main push workflows and strands Pact proof.
#
# Ref: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enabling-auto-merge-on-a-pull-request

name: Dependabot auto-merge

on:
  pull_request:
    # The privileged follow-up validates the exact classified head SHA. A Dependabot
    # rebase between opened and that follow-up must be reclassified or auto-merge
    # remains unarmed. Synchronize adds skipped runs for non-Dependabot PRs, but the
    # job-level actor check prevents API calls and runner allocation for them.
    # Labeled remains excluded: labels are applied repeatedly by GitOps bots and
    # do not change dependency metadata.
    types: [opened, reopened, synchronize]

# Restrictive token permissions in the PR phase; the separate workflow_run phase
# mints an App token only after validating the Dependabot PR identity.
permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Classify patch Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10  # API calls only
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # A trusted follow-up arms auto-merge with a GitHub App token. Keep this
      # Dependabot-triggered run read-only and pass only the exact PR identity.
      - name: Record patch eligibility
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          (steps.metadata.outputs.package-ecosystem == 'gradle' ||
           steps.metadata.outputs.package-ecosystem == 'npm_and_yarn')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          jq -n --argjson number "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            --arg ref "$HEAD_REF" --arg update_type "$UPDATE_TYPE" \
            --arg ecosystem "$ECOSYSTEM" \
            '{number: $number, sha: $sha, ref: $ref, update_type: $update_type, ecosystem: $ecosystem}' \
            > "$RUNNER_TEMP/dependabot-eligibility.json"

      - name: Pass patch eligibility to privileged follow-up
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          (steps.metadata.outputs.package-ecosystem == 'gradle' ||
           steps.metadata.outputs.package-ecosystem == 'npm_and_yarn')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-auto-merge-eligibility
          path: ${{ runner.temp }}/dependabot-eligibility.json
          retention-days: 1

      - name: Skip — requires human review
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-patch' ||
          (steps.metadata.outputs.package-ecosystem != 'gradle' &&
           steps.metadata.outputs.package-ecosystem != 'npm_and_yarn')
        # PR_TITLE via env, not `${{ }}` interpolated straight into the script: the title is
        # attacker-influenceable and direct interpolation is a script-injection vector
        # (Scorecard Dangerous-Workflow). Env-var passing is not subject to shell expansion.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          echo "::notice title=Human review required::${PR_TITLE} (${ECOSYSTEM}, ${UPDATE_TYPE}) is outside the auto-merge policy (patch-only, gradle/npm) — skipping auto-merge."
