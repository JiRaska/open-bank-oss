# Dependabot auto-merge (OSS-readiness D4, ADR-0119 §D4).
#
# Policy: auto-merge PATCH Dependabot PRs (gradle, npm) once CI is green.
# Everything else stays open for human review:
#   - Minor + major bumps (any ecosystem) — minors regularly carry new transitive
#     dependencies and deserve semantic review even though dependency-submission
#     plus dependency-review scan the submitted Gradle graph for known CVEs.
#   - github-actions bumps (any size) — a version bump swaps the pinned commit SHA
#     for NEW action code that then runs in CI with contents:write/id-token:write.
#     A human must eyeball the diff of what will execute with those permissions.
#   - docker bumps (any size) — base-image changes alter the runtime attack surface
#     of every service built on them; same eyeball rule.
#   - PRs that are not authored by dependabot[bot]
#
# Note: dependabot-verification-metadata.yml auto-recomputes gradle checksums from
# whatever Maven Central serves at PR time, so verification-metadata.xml is NOT a
# defense against a poisoned upstream release riding an auto-merge — human review
# of minors is.
#
# Token: GITHUB_TOKEN with `contents: write` is enough for auto-merge on a repo
# without environment protection (GitHub Free / public repos). The workflow
# enables native GitHub auto-merge — merges only after the required status checks
# pass (all-green gate).
#
# Ref: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enabling-auto-merge-on-a-pull-request

name: Dependabot auto-merge

on:
  pull_request:
    # NOT `synchronize` (#9031). GitHub's native auto-merge is a property of the PR, not of a
    # commit: the `--auto` merge enabled once at `opened` survives every later push, including
    # Dependabot's own rebases. So `synchronize` could only ever re-assert a setting already in
    # place — while firing this workflow on every push to every open PR in the repository.
    #
    # Measured 2026-09-12 over a 0.32 h window of 300 workflow runs: this workflow ran 18 times
    # and SKIPPED 18 of 18, every one of them triggered by a push to one of five non-Dependabot
    # feature branches. A skipped job still costs a queued Actions run and its API calls, and the
    # installation quota was exhausted that same morning — hard-failing `dependency-review` and
    # the `CodeQL` SARIF upload across the open PRs with
    # `API rate limit exceeded for installation`.
    #
    # NOT `labeled` either, and the reason it was kept did not survive measurement. The comment
    # here used to read "a label is how a human re-opens the question for a PR this job already
    # declined, and it fires rarely enough not to be part of the cost." Both halves were wrong.
    #
    # Measured 2026-09-12 over 600 completed `pull_request` runs (07:25:42Z..10:10:22Z, 2.74 h):
    # this workflow ran 38 times on 20 branches, 34 skipped and the other 4 cancelled — zero
    # useful executions, and not one of those branches was a Dependabot branch. Eight branches
    # fired it more than once; the worst fired FIVE times.
    #
    # Those repeats are not rare human labelling. `openbank-gitops-bot` applies the PR's labels
    # when it opens a deploy PR, and applies each one twice:
    #
    #     08:15:10  labeled  chore   by openbank-gitops-bot[bot]
    #     08:15:11  labeled  gitops  by openbank-gitops-bot[bot]
    #     08:15:11  labeled  chore   by openbank-gitops-bot[bot]
    #     08:15:11  labeled  gitops  by openbank-gitops-bot[bot]
    #
    # One `opened` plus four `labeled` is exactly the five runs measured — so `labeled` costs four
    # queued runs per bot deploy PR and buys nothing. Dependabot's own labels (`dependencies`,
    # plus the ecosystem) are applied at creation too, so `labeled` there is redundant with
    # `opened` rather than additional to it.
    #
    # What the removal costs: re-labelling a PR this job declined no longer re-asks it. `reopened`
    # still does, and a maintainer can re-run the workflow. That is a smaller affordance than four
    # wasted runs per deploy PR, and unlike the claim it replaces it is not asserted — nothing in
    # the window shows `labeled` ever doing work.
    types: [opened, reopened]

# Restrictive top-level default (Scorecard Token-Permissions wants an explicit top-level
# block); the auto-merge job below declares its own override for the write access it needs.
permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge patch/minor Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10  # API calls only
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    # This job has no actions/checkout, so `gh` has nothing to infer the target repo from
    # and every subcommand dies with `failed to determine base repo: fatal: not a git
    # repository`. Set it explicitly (same fix, same reason as record-deployment-on-merge.yml).
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-merge patch updates only, and never for github-actions / docker
      # (see the policy header). Ecosystem ids are fetch-metadata's: github_actions
      # uses an underscore.
      - name: Enable auto-merge (patch only, gradle/npm)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          steps.metadata.outputs.package-ecosystem != 'docker'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip — requires human review
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-patch' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.package-ecosystem == 'docker'
        # PR_TITLE via env, not `${{ }}` interpolated straight into the script: the title is
        # attacker-influenceable and direct interpolation is a script-injection vector
        # (Scorecard Dangerous-Workflow). Env-var passing is not subject to shell expansion.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          echo "::notice title=Human review required::${PR_TITLE} (${ECOSYSTEM}, ${UPDATE_TYPE}) is outside the auto-merge policy (patch-only, gradle/npm) — skipping auto-merge."
