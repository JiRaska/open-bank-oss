name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"  # weekly Monday 05:00 UTC
  workflow_dispatch:      # manual SBOM/scan refresh (e.g. before a deploy)

permissions:
  contents: read

# Cancel superseded runs on the same ref so Dependabot/PR pushes don't stack up
# expensive CodeQL/Trivy/SBOM runs and drain the Free-tier minute budget.
# event_name is part of the key: schedule and push:[main] both resolve to
# refs/heads/main, so without it a routine Monday-morning push CANCELS the
# weekly scheduled audit — the audit posture silently never runs that week.
concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  group: security-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether the (heavy) SBOM jobs need to run this push.
  # ---------------------------------------------------------------------------
  # An SBOM only changes when the dependency graph changes. Regenerating it on
  # EVERY main-line commit meant a 30-min `sbomAll` build fired on every gitops
  # auto-deploy commit (dozens/day, deps unchanged) — pure waste of runner
  # minutes and artifact storage. So on push we run the SBOM jobs only when a
  # dependency-affecting file changed; schedule/manual always run (audit posture).
  detect-deps:
    name: Detect dependency changes
    # Pure checkout + git diff, no self-hosted-specific tooling. The repo is public, so
    # GitHub-hosted minutes are free/unlimited — offload this off the Hetzner/ARC pool.
    runs-on: ubuntu-latest
    outputs:
      run_sbom: ${{ steps.f.outputs.run_sbom }}
      run_codeql: ${{ steps.f.outputs.run_codeql }}
      codeql_matrix: ${{ steps.f.outputs.codeql_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need history to diff event.before..sha on push
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Code paths that warrant CodeQL semantic analysis. A gitops/docs/*.md-only PR
          # (e.g. an auto-generated deploy image-bump) changes none of these, so the
          # ~14 min java-kotlin autobuild is pure waste there. CodeQL is NOT a required
          # check, so skipping it on such PRs is safe — the weekly + main-push full scan
          # (and Trivy on every PR) still cover them.
          # Per LANGUAGE, because the analysis is per language: a PR that changes only
          # .ts has nothing for the java-kotlin leg to look at, and vice versa.
          # No Dockerfile here: the java-kotlin extractor cannot read one, so a
          # Dockerfile-only PR could only ever start a leg with nothing to trace. That is
          # no longer RED — #3103's fallback forces a real recompile rather than
          # finalising an empty database — but it is now the expensive shape instead: a
          # ~30-module `--rerun-tasks` rebuild, 25-30 min, to analyse a diff containing no
          # Java. Dockerfile stays in the SBOM regex below, which is a separate question
          # (a base-image bump genuinely does change the dependency graph).
          JAVA_RE='(\.(java|kt|kts)$|(^|/)(build|settings)\.gradle|gradle/)'
          JS_RE='(\.(js|jsx|ts|tsx|mjs|cjs)$|(^|/)package(-lock)?\.json$)'
          # NOTE: .github/workflows/ is deliberately NOT in either pattern. A workflow-only
          # PR changes no analysable source, so every compile resolves from cache, CodeQL
          # traces nothing, and `analyze` dies with "could not process any code written in
          # Java/Kotlin" (issue seen on PR #3079). Including workflows bought no coverage —
          # it bought a guaranteed red on exactly the PRs that change no code.

          # Emits codeql_matrix as a JSON array of matrix entries; '[]' means skip the job.
          emit_matrix() {
            local java="$1" js="$2" out="["
            if [ "$java" = "true" ]; then
              out="$out{\"language\":\"java-kotlin\",\"build-mode\":\"manual\"}"
              if [ "$js" = "true" ]; then out="$out,"; fi
            fi
            if [ "$js" = "true" ]; then
              out="$out{\"language\":\"javascript-typescript\",\"build-mode\":\"none\"}"
            fi
            out="$out]"
            echo "codeql_matrix=$out" >> "$GITHUB_OUTPUT"
            echo "codeql matrix: $out"
          }
          # Same reason: a bare `grep -q ... && VAR=true` is fatal under errexit when it
          # does not match, which is the common case. classify() never fails.
          classify() {
            J=false; S=false
            if printf '%s\n' "$1" | grep -qE "$JAVA_RE"; then J=true; fi
            if printf '%s\n' "$1" | grep -qE "$JS_RE"; then S=true; fi
          }
          # schedule / manual: always run the full audit.
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run_sbom=true" >> "$GITHUB_OUTPUT"; echo "run_codeql=true" >> "$GITHUB_OUTPUT"
            emit_matrix true true; exit 0
          fi
          # PRs never run the SBOM jobs (too heavy for the PR gate). CodeQL runs only
          # when code actually changed — diff against the merge-base with the target
          # branch (not the frozen base.sha, which drifts once a competing PR merges).
          if [ "$EVENT" = "pull_request" ]; then
            # NOT --depth=1: a shallow base ref has no ancestry, so `git merge-base` finds
            # nothing and BASE comes back empty — which silently falls through to "run
            # everything". Measured on PR #3079 (both languages) vs #3103 ([]) with identical
            # code: the only difference was how far the branch had drifted from main. An
            # explicit refspec also guarantees refs/remotes/origin/<base> exists at all.
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" >/dev/null 2>&1 || true
            BASE="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
            if [ -z "$BASE" ]; then
              # Cannot diff — run everything rather than skip silently. Say so out loud: a
              # quiet fallback to "run everything" is indistinguishable from "scoping decided
              # to run everything", so the scoping can stop working and nothing reports it.
              echo "::warning::merge-base against $BASE_REF could not be resolved — running CodeQL for ALL languages (scoping did not engage)"
              echo "run_codeql=true" >> "$GITHUB_OUTPUT"; emit_matrix true true
            else
              CHANGED="$(git diff --name-only "$BASE" HEAD)"
              classify "$CHANGED"
              if [ "$J" = "false" ] && [ "$S" = "false" ]; then
                echo "run_codeql=false" >> "$GITHUB_OUTPUT"
              else
                echo "run_codeql=true" >> "$GITHUB_OUTPUT"
              fi
              emit_matrix "$J" "$S"
            fi
            echo "run_sbom=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # First push of a branch has an all-zero "before" → cannot diff, run to be safe.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run_sbom=true" >> "$GITHUB_OUTPUT"; echo "run_codeql=true" >> "$GITHUB_OUTPUT"
            emit_matrix true true; exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
          # Dependency-affecting paths: Gradle build/version files, lockfiles, Dockerfiles.
          if echo "$CHANGED" | grep -qE '(\.gradle\.kts$|gradle/libs\.versions\.toml$|gradle\.lockfile$|gradle/wrapper/|Dockerfile|package-lock\.json$|pnpm-lock\.yaml$|yarn\.lock$)'; then
            echo "run_sbom=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_sbom=false" >> "$GITHUB_OUTPUT"
          fi
          classify "$CHANGED"
          if [ "$J" = "true" ] || [ "$S" = "true" ]; then
            echo "run_codeql=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_codeql=false" >> "$GITHUB_OUTPUT"
          fi
          emit_matrix "$J" "$S"

  # ---------------------------------------------------------------------------
  # CodeQL (semantic analysis)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    needs: detect-deps
    # CodeQL uploads results to GitHub code scanning, which on a PRIVATE repo is a
    # paid GHAS add-on (not bundled with Free/Pro) — the init step errors with
    # "Code scanning is not enabled for this repository". So this job auto-skips
    # while the repo is private and activates the moment it goes public (free GHAS),
    # mirroring the dependency-review job in ci.yml. Until then Trivy fs + Dependabot
    # cover vulnerable-dependency detection. (Aside: the CodeQL CLI also does not
    # support linux/arm64, so it could not run on the arm64 sandbox runner anyway.)
    # Skip on gitops/docs-only PRs (run_codeql=false) — CodeQL isn't a required check
    # there, and the java-kotlin autobuild is the ~14 min tax that strands deploy PRs.
    if: github.event.repository.private == false && needs.detect-deps.outputs.codeql_matrix != '[]'
    # Standard github/codeql-action usage targets ubuntu-latest; no self-hosted-specific
    # dependency here (setup-java/setup-node are already used to work around the Hetzner
    # pool lacking those toolchains). Public repo = free GitHub-hosted minutes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    timeout-minutes: 40
    # The java-kotlin leg's build step shells out to its own `./gradlew classes`
    # (whole-fleet dependency resolution, ~30 modules + quarkus-bom) without picking up
    # any GRADLE_OPTS we'd set in a step — it needs the env var at the job level. Without
    # this, Gradle's auto-detected 3 GiB default heap OOMs on that resolution (first seen
    # moving this job off the 16 GB Hetzner host to ubuntu-latest). Same fix pattern as
    # fleet-lint.yml's GRADLE_OPTS. Timeout raised 30->40min: --no-build-cache (below)
    # means every run now genuinely compiles instead of sometimes restoring from cache.
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-deps.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"

      # The build step below shells out to `./gradlew classes` for the java-kotlin
      # leg — validate the wrapper jar before it runs, same as every other job
      # that invokes gradlew.
      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The javascript-typescript extractor needs Node.js on PATH even in
      # build-mode: none — it shells out to autobuild.sh internally to verify a
      # Node install before parsing .ts files for type info. Our self-hosted
      # Hetzner runners have no system Node, so this step was missing and every
      # javascript-typescript run failed with "TypeScriptParser.verifyNodeInstallation
      # ... Exit status 1" regardless of build-mode.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "20"

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # java-kotlin uses an explicit build step (build-mode: manual), not autobuild.
      # This repo has `org.gradle.caching=true` + a remote HTTP build cache
      # (settings.gradle.kts) fleet-wide; autobuild's Gradle compilation was
      # intermittently satisfied entirely from the build cache, so javac/kotlinc
      # Cache the Gradle build between runs (same setup-gradle as the service CI). The
      # cold --no-build-cache leg took ~25-30 min of wall time and was the single most
      # preemption-exposed job in the fleet (killed mid-analysis twice in a row,
      # run 30666238087, attempt 2 also cancelled). A warm cache cuts the leg to a few
      # minutes; the two-phase step below keeps the empty-analysis guard that the cold
      # flag was protecting (a run where every compile resolves FROM-CACHE would trace
      # zero compilations and record an empty CodeQL analysis).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.language == 'java-kotlin'

      # Two-phase: try the cached production build; if NO compile task actually executed (all
      # FROM-CACHE/UP-TO-DATE — grep anchors on the line end so FROM-CACHE rows don't
      # count), fall back to the cold compile so the CodeQL trace stays non-empty.
      - name: Build production classes (java-kotlin) for CodeQL tracing
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          # CodeQL evaluates deployable Kotlin/Java. `testClasses` also compiles every
          # fleet test source, but that is not shipped code and repeatedly received SIGTERM
          # before analysis could start. `classes` retains generated and
          # production compilation for every module while keeping the trace bounded.
          .github/scripts/gradle-heap-headroom.sh codeql-java-kotlin -- ./gradlew classes --no-daemon 2>&1 | tee "${RUNNER_TEMP:-/tmp}/codeql-build.log"
          executed=$( { grep -c '> Task :.*:compileKotlin$' "${RUNNER_TEMP:-/tmp}/codeql-build.log" || true; } )
          if [ "$executed" -eq 0 ]; then
            echo "::warning::every compile resolved from cache — cold re-run so the CodeQL trace is non-empty"
            # --rerun-tasks, not just --no-build-cache: the latter bypasses the build CACHE but
            # not Gradle's UP-TO-DATE checks, and after the first run every compileKotlin output
            # is already in build/. Measured on run 30692843630, where the fallback still produced
            # `60 UP-TO-DATE, 60 FROM-CACHE, 0 executed` and CodeQL then failed with
            # "could not process any code written in Java/Kotlin".
            .github/scripts/gradle-heap-headroom.sh codeql-java-kotlin -- \
              ./gradlew classes --no-build-cache --rerun-tasks --no-daemon \
              2>&1 | tee "${RUNNER_TEMP:-/tmp}/codeql-build-cold.log"
            cold=$( { grep -c '> Task :.*:compileKotlin$' "${RUNNER_TEMP:-/tmp}/codeql-build-cold.log" || true; } )
            if [ "$cold" -eq 0 ]; then
              echo "::error::cold re-run still compiled nothing — CodeQL would report no source code"
              exit 1
            fi
            echo "cold re-run compiled: $cold"
          else
            echo "compile tasks executed: $executed"
          fi

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------------
  # Trivy filesystem + IaC scan
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    permissions:
      contents: read
      security-events: write # upload-sarif
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hosted runners don't pre-install trivy; the pinned setup action fetches it.
      #
      # `version` is pinned to match the fleet's other four setup-trivy call sites
      # (admin-ui-deploy, auto-deploy, image-rescan, backfill-release-evidence). This job was the
      # only one resolving "latest", which meant an extra releases-API lookup on every run and a
      # scanner version that could move under us — in a repo that pins every action by SHA for
      # exactly that reason. `cache: true` mirrors image-rescan.yml and removes the download
      # entirely on a cache hit.
      #
      # `continue-on-error` + the retry below because this fetch is the job's single point of
      # network failure: on 2026-07-25 it exited 35 (curl SSL connect error) on PR #2297, and the
      # blast radius was four red steps that all said something other than what had happened —
      # the fs scan SKIPPED, the config scan `trivy: command not found` (127), and two
      # `Path does not exist: trivy-*.sarif` uploads. No vulnerability scan ran at all, and
      # nothing said so.
      - name: Install Trivy
        id: install-trivy
        continue-on-error: true
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      # Retry the fetch directly (the repo's `for attempt in 1 2 3` convention, as in
      # auto-deploy.yml and record-deployment-on-merge.yml) rather than re-running the action,
      # so a transient TLS failure costs seconds instead of a red required-adjacent check and a
      # manual re-run. Same pinned version, checksum-verified against the release manifest.
      - name: Retry Trivy install (transient network failure)
        if: steps.install-trivy.outcome == 'failure'
        env:
          TRIVY_VERSION: 0.72.0
        run: |
          set -euo pipefail
          echo "::warning::setup-trivy failed (network); retrying the release download directly."
          cd "$RUNNER_TEMP"
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                 -o "$asset" "$base/$asset" \
               && curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                 -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"; then
              # Verify before extracting: an unauthenticated binary is not a security scanner.
              grep " ${asset}\$" checksums.txt | sha256sum -c -
              tar -xzf "$asset" trivy
              install -m 0755 trivy /usr/local/bin/trivy
              echo "Trivy installed on attempt ${attempt}."
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::Trivy could not be installed after 3 retries — the vulnerability and IaC scans did NOT run. This is an install/network failure, NOT a clean scan and NOT a finding."
          exit 1

      # A missing scanner must produce ONE unambiguous error, not four misleading ones. Without
      # this, a reader triaging "Trivy: FAILURE" looks for a CVE, finds none in the log (the scan
      # was skipped), and has to recover the truth from the code-scanning API — the same wasted
      # trip PR #2154 documented.
      - name: Verify Trivy is installed
        id: verify-trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            echo "::error::trivy is not on PATH — the scans below did NOT run. Treat this job as UNKNOWN, not clean."
            exit 1
          fi
          trivy --version

      # Trivy runs as the host binary rather than the Docker container
      # action — container actions don't execute on the macOS pool member, so a
      # direct CLI invocation keeps this OS-portable across the mixed
      # [self-hosted, openbank-sandbox] pool (ADR-0040).
      - name: Trivy fs scan
        run: |
          # Print findings to the log FIRST (|| true) so a failure below is self-explaining.
          # Without this the gate's only output is "Process completed with exit code 1" and the
          # package/CVE has to be recovered from the code-scanning API. Mirrors the config scan.
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --skip-version-check \
            --skip-dirs node_modules,.next,build,.gradle \
            --format table . || true
          # Gate: fail on any fixed HIGH/CRITICAL in the dependency tree.
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --skip-version-check \
            --skip-dirs node_modules,.next,build,.gradle \
            --format sarif --output trivy-fs.sarif --exit-code 1 .

      # `always()` so a CVE found by the fs scan above does not hide the IaC findings — both are
      # reported in one run. But NOT when the scanner is missing: that used to add a
      # `trivy: command not found` on top of an install failure, so one root cause printed as two
      # unrelated errors.
      - name: Trivy config (IaC) scan
        if: always() && steps.verify-trivy.outcome == 'success'
        run: |
          # Print findings to log for visibility (includes baseline-suppressed ones via || true).
          trivy config --severity CRITICAL,HIGH --ignorefile .trivyignore --skip-version-check --format table openbank-infra || true
          # Gate: fail on new HIGH/CRITICAL findings not in .trivyignore baseline.
          trivy config --severity CRITICAL,HIGH --ignorefile .trivyignore --skip-version-check \
            --format sarif --output trivy-config.sarif --exit-code 1 openbank-infra

      # SARIF upload targets GitHub code scanning (paid GHAS on a private repo), so
      # it can only run once the repo is public — same gate as the CodeQL job. The
      # fs/config scans above already gate the job; this step is purely for the
      # code-scanning UI, so skipping it while private loses no enforcement.
      #
      # Two separate uploads, one per file: `sarif_file: .` picked up BOTH
      # trivy-fs.sarif and trivy-config.sarif under the single category "trivy",
      # which GitHub's SARIF ingestion now rejects outright ("does not support
      # uploading multiple SARIF runs with the same category" — every run since
      # this repo went public failed here). Distinct categories per file fixes it.
      - name: Upload Trivy fs SARIF
        if: always() && steps.verify-trivy.outcome == 'success' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy config SARIF
        if: always() && steps.verify-trivy.outcome == 'success' && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---------------------------------------------------------------------------
  # SBOM (CycloneDX) — repo-wide via Syft (filesystem scan)
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (repo-wide)
    # anchore/sbom-action is a container action with no self-hosted-pool dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs on schedule/manual, and on main pushes only when dependencies changed
    # (see detect-deps). Never on PRs. The authoritative, signed, release-attached
    # SBOM is produced separately at release time (release-please.yml).
    needs: detect-deps
    if: needs.detect-deps.outputs.run_sbom == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: openbank-sbom.cdx.json
          output-file: openbank-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: openbank-sbom.cdx.json
          # CI debugging artifact only; long-term SBOMs live on release assets, not here.
          # 90d on every main-line run blew past the Actions artifact-storage quota (broke
          # the build job fleet-wide on the upload step). 14d keeps it bounded.
          retention-days: 14

  # ---------------------------------------------------------------------------
  # SBOM (CycloneDX) — per-service via the cyclonedx Gradle plugin (SBOM-1)
  # ---------------------------------------------------------------------------
  # The Gradle plugin sees the *actual* runtime classpath each service pulls
  # from quarkus-bom, which Syft cannot reconstruct from a filesystem scan.
  # This complements (does not replace) the repo-wide job above.
  sbom-per-service:
    name: SBOM (per service)
    runs-on: ubuntu-latest  # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    timeout-minutes: 45  # cold Maven-Central resolution on a hosted runner (no in-cluster mirror)
    # Builds the full runtime classpath of all modules — far too heavy to run on
    # every PR or on dependency-neutral commits (e.g. gitops auto-deploy). Runs on
    # schedule/manual and on main pushes only when dependencies changed (detect-deps).
    needs: detect-deps
    if: needs.detect-deps.outputs.run_sbom == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sbom-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-sbom-
      - name: Generate per-service SBOMs
        run: ./gradlew sbomAll --console=plain --no-daemon
      - name: Collect per-service SBOMs
        run: |
          mkdir -p sboms
          # bom.json is emitted at openbank-<name>/build/reports/bom.json by
          # the cyclonedx Gradle plugin (per-service config in build.gradle.kts).
          for d in openbank-*/; do
            svc="${d%/}"
            [ -f "$d/build/reports/bom.json" ] && cp "$d/build/reports/bom.json" "sboms/${svc}-sbom.cdx.json"
          done
          ls -la sboms/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: per-service-sboms
          path: sboms/*.cdx.json
          # See note on the repo-wide SBOM above: 14d, not 90d. This artifact was the
          # dominant storage consumer (~6 GB across ~660 main-line runs).
          retention-days: 14
