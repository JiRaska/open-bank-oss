# Money-path performance baseline (k6) — SSDLC-audit follow-up 2026-07-06.
#
# The platform advertises SLOs (Pyrra) but had no load evidence behind them. This lane
# runs the read-only k6 baseline (perf/k6/money-path-smoke.js) weekly and on demand,
# recording latency percentiles so a regression shows as a trend.
#
# ADVISORY: k6 runs with --no-thresholds-fail — a breached tripwire is reported and
# uploaded, never fails the run or blocks a deploy (issue #334). Money-path perf gating
# is a deliberate later step, not a surprise red build.
#
# Target: the services must already be reachable AND the runner must carry a dedicated,
# least-privilege read identity. Set the repo/environment variables PERF_LEDGER_URL and
# PERF_TXN_URL (e.g. a sandbox internal URL reached via a self-hosted runner, or a
# port-forward), and the PERF_READ_TOKEN environment secret. If any are absent, the job
# SKIPS with a notice rather than pretending to have measured something — no silent green.
# An authenticated 200 is required; a 401 is retained as failed evidence because it did not
# execute the handler.
name: Perf baseline

on:
  schedule:
    - cron: "0 4 * * 2"   # weekly Tuesday 04:00 UTC (low-traffic window)
  workflow_dispatch:
    inputs:
      ledger_url:
        description: "Ledger base URL (overrides the PERF_LEDGER_URL variable)"
        required: false
      txn_url:
        description: "Transaction base URL (overrides the PERF_TXN_URL variable)"
        required: false

permissions:
  contents: read

jobs:
  k6:
    name: k6 money-path read baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep both performance lanes on one immutable, independently verified executor.
      K6_IMAGE: ghcr.io/grafana/k6:0.54.0@sha256:32000aaa40b848add83425ed7cc77535c343ca473498b0bd29464d00fdca6c79
      # A dedicated, read-only client credential. GitHub masks the value and the workflow
      # never prints it; URL variables alone cannot make an authenticated handler measurable.
      PERF_READ_TOKEN: ${{ secrets.PERF_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target URLs
        id: target
        env:
          IN_LEDGER: ${{ inputs.ledger_url }}
          IN_TXN: ${{ inputs.txn_url }}
          VAR_LEDGER: ${{ vars.PERF_LEDGER_URL }}
          VAR_TXN: ${{ vars.PERF_TXN_URL }}
        run: |
          set -euo pipefail
          ledger="${IN_LEDGER:-$VAR_LEDGER}"
          txn="${IN_TXN:-$VAR_TXN}"
          if [ -z "$ledger" ] || [ -z "$txn" ] || [ -z "${PERF_READ_TOKEN:-}" ]; then
            echo "::notice::PERF_LEDGER_URL, PERF_TXN_URL, or PERF_READ_TOKEN is not configured — skipping the perf baseline (no authenticated target to measure)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=No safe authenticated money-path target is configured for this GitHub-hosted runner." >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
            echo "txn=$txn" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve pinned k6 runtime
        if: steps.target.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker pull "${K6_IMAGE}"
          docker run --rm "${K6_IMAGE}" version

      - name: Run k6 baseline
        if: steps.target.outputs.run == 'true'
        env:
          LEDGER_URL: ${{ steps.target.outputs.ledger }}
          TXN_URL: ${{ steps.target.outputs.txn }}
          PERF_READ_TOKEN: ${{ env.PERF_READ_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env LEDGER_URL \
            --env TXN_URL \
            --env PERF_READ_TOKEN \
            --volume "$PWD:/work" \
            --workdir /work \
            "${K6_IMAGE}" run \
            --no-thresholds-fail \
            --summary-export=perf-summary.json \
            perf/k6/money-path-smoke.js

      - name: Build money-path performance Test Intelligence envelope
        if: always()
        continue-on-error: true
        run: |
          python3 .github/scripts/collect-test-run-evidence.py \
            --service perf --component openbank-money-path \
            --performance-summary perf-summary.json \
            --performance-not-run-detail "${{ steps.target.outputs.reason }}" \
            --out perf-run.json

      - name: Upload k6 summary and versioned envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-money-path-summary
          path: |
            perf-summary.json
            perf-run.json
          retention-days: 90

      - name: Upload immutable money-path performance envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-intelligence-run-openbank-money-path-${{ github.run_id }}-a${{ github.run_attempt }}
          path: perf-run.json
          retention-days: 30

  # Per-module read baselines (the <module>/src/test/k6/*-read-baseline.js fleet added for
  # the evidence matrix). Every leg is GET-only and independent: a module without a
  # configured target SKIPs with a notice instead of pretending to measure — the same
  # no-silent-green contract as the money-path job above. Set PERF_<MODULE>__URL vars plus
  # the shared PERF_READ_TOKEN environment secret to light a leg up.
  module-read-baselines:
    name: k6 module read baseline (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: account
            component: openbank-account-service
            definition: openbank-account-service/src/test/k6/account-read-baseline.js
            url: "${{ vars.PERF_ACCOUNT_URL }}"
          - id: balance
            component: openbank-balance-service
            definition: openbank-balance-service/src/test/k6/balance-read-baseline.js
            url: "${{ vars.PERF_BALANCE_URL }}"
          - id: consent
            component: openbank-consent-service
            definition: openbank-consent-service/src/test/k6/consent-read-baseline.js
            url: "${{ vars.PERF_CONSENT_URL }}"
          - id: domestic-payment
            component: openbank-domestic-payment
            definition: openbank-domestic-payment/src/test/k6/domestic-payment-read-baseline.js
            url: "${{ vars.PERF_DOMESTIC_PAYMENT_URL }}"
          - id: fx
            component: openbank-fx-service
            definition: openbank-fx-service/src/test/k6/fx-read-baseline.js
            url: "${{ vars.PERF_FX_URL }}"
          - id: ledger
            component: openbank-ledger-service
            definition: openbank-ledger-service/src/test/k6/ledger-read-baseline.js
            url: "${{ vars.PERF_LEDGER_URL }}"
          - id: sca
            component: openbank-sca-service
            definition: openbank-sca-service/src/test/k6/sca-read-baseline.js
            url: "${{ vars.PERF_SCA_URL }}"
          - id: sepa-instant
            component: openbank-sepa-instant
            definition: openbank-sepa-instant/src/test/k6/sepa-instant-read-baseline.js
            url: "${{ vars.PERF_SEPA_INSTANT_URL }}"
          - id: sepa-payment
            component: openbank-sepa-payment
            definition: openbank-sepa-payment/src/test/k6/sepa-payment-read-baseline.js
            url: "${{ vars.PERF_SEPA_PAYMENT_URL }}"
          - id: transaction
            component: openbank-transaction-service
            definition: openbank-transaction-service/src/test/k6/transaction-read-baseline.js
            url: "${{ vars.PERF_TRANSACTION_URL }}"
    env:
      K6_IMAGE: ghcr.io/grafana/k6:0.54.0@sha256:32000aaa40b848add83425ed7cc77535c343ca473498b0bd29464d00fdca6c79
      PERF_READ_TOKEN: ${{ secrets.PERF_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target URL
        id: target
        env:
          MODULE_URL: "${{ matrix.url }}"
        run: |
          set -euo pipefail
          if [ -z "${MODULE_URL}" ] || [ -z "${PERF_READ_TOKEN:-}" ]; then
            echo "::notice::PERF_${{ matrix.id }}_URL (uppercase, '-'→'_') or PERF_READ_TOKEN is not configured — skipping the ${{ matrix.id }} read baseline (no authenticated target to measure)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=No safe authenticated target or read identity is configured for the ${{ matrix.id }} read baseline." >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "url=$MODULE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve pinned k6 runtime
        if: steps.target.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker pull "${K6_IMAGE}"
          docker run --rm "${K6_IMAGE}" version

      - name: Run k6 module read baseline
        if: steps.target.outputs.run == 'true'
        env:
          BASE_URL: "${{ steps.target.outputs.url }}"
          MODULE_DEF: "${{ matrix.definition }}"
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env BASE_URL \
            --env PERF_READ_TOKEN \
            --volume "$PWD:/work" \
            --workdir /work \
            "${K6_IMAGE}" run \
            --no-thresholds-fail \
            --summary-export="${{ matrix.id }}-summary.json" \
            "${MODULE_DEF}"

      - name: Build module performance Test Intelligence envelope
        if: always()
        continue-on-error: true
        run: |
          python3 .github/scripts/collect-test-run-evidence.py \
            --service perf --component "${{ matrix.component }}" \
            --performance-summary "${{ matrix.id }}-summary.json" \
            --performance-not-run-detail "${{ steps.target.outputs.reason }}" \
            --out "${{ matrix.id }}-perf-run.json"

      - name: Upload k6 module summary and envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "k6-${{ matrix.id }}-read-baseline-summary"
          path: |
            ${{ matrix.id }}-summary.json
            ${{ matrix.id }}-perf-run.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload immutable module performance envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "test-intelligence-run-${{ matrix.component }}-${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ matrix.id }}-perf-run.json"
          if-no-files-found: ignore
          retention-days: 30
