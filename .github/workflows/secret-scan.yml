name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly Monday 04:00 UTC

permissions:
  contents: read

# event_name is part of the key: schedule and push:[main] both resolve to
# refs/heads/main, so without it a routine main push cancels the weekly
# scheduled history scan (same fix as security.yml).
concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  gitleaks:
    name: Gitleaks
    # Public repo ⇒ GitHub-hosted runners are free and unlimited; no reason to
    # spend self-hosted capacity on a credential-free scan (FinOps: hosted-first).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for scan

      # gitleaks runs as a directly-invoked CLI rather than the gitleaks-action:
      # the action's SARIF upload and $TMPDIR handling have bitten us before
      # (ADR-0040), and a pinned binary download keeps the invocation identical
      # to what contributors run locally. exit-code 1 on a leak gates the job.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      #
      # Scope the history scan to the commits the event actually introduces
      # (gitleaks passes --log-opts straight to `git log`). With fetch-depth:0
      # the full clone fetches every remote branch, so an unscoped `detect`
      # scans commits belonging to OTHER open PRs and fails this run on their
      # findings (cross-branch history poisoning). Limiting to the event's own
      # range keeps the custom rules + allowlist intact while ensuring a false
      # positive on a different branch can't fail this PR.
      #   - pull_request: scan BASE..HEAD (this PR's commits only)
      #   - push:         scan before..sha (the pushed range)
      #   - schedule/manual: full-history scan (no range)
      # An empty range (no new commits) scans nothing and passes.
      - name: Run gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG_OPTS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="--log-opts=--no-merges ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # github.event.before is all-zeroes for the first push of a branch.
            if [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="--log-opts=--no-merges ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            fi
          fi
          gitleaks detect --source . --config .gitleaks.toml \
            --redact --no-banner --verbose --exit-code 1 ${LOG_OPTS:+"$LOG_OPTS"}
