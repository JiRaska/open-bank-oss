name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly Monday 04:00 UTC

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    # openbank-build pool covers Hetzner + Mac Mini (always online). The original
    # openbank-batch ARC runners (dedicated isolated VPC) are currently offline;
    # migrated to openbank-build so scans are not blocked while ARC is down.
    # The egress control is now provided at the VPC / SG level for Hetzner nodes.
    runs-on: openbank-build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # full history for scan

      # gitleaks runs as the host binary (brew / package) rather than the
      # gitleaks-action: the action downloads its binary to a fixed $TMPDIR path
      # and breaks on a reused self-hosted runner ("gitleaks.tmp already exists"),
      # and its SARIF upload assumes a hosted-runner HOME layout. A direct CLI
      # invocation is OS-portable across the mixed pool and has no such state
      # (ADR-0040). exit-code 1 on a leak gates the job.
      #
      # Scope the history scan to the commits the event actually introduces
      # (gitleaks passes --log-opts straight to `git log`). With fetch-depth:0
      # the full clone fetches every remote branch, so an unscoped `detect`
      # scans commits belonging to OTHER open PRs and fails this run on their
      # findings (cross-branch history poisoning). Limiting to the event's own
      # range keeps the custom rules + allowlist intact while ensuring a false
      # positive on a different branch can't fail this PR.
      #   - pull_request: scan BASE..HEAD (this PR's commits only)
      #   - push:         scan before..sha (the pushed range)
      #   - schedule/manual: full-history scan (no range)
      # An empty range (no new commits) scans nothing and passes.
      - name: Run gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG_OPTS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="--log-opts=--no-merges ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # github.event.before is all-zeroes for the first push of a branch.
            if [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="--log-opts=--no-merges ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            fi
          fi
          gitleaks detect --source . --config .gitleaks.toml \
            --redact --no-banner --verbose --exit-code 1 ${LOG_OPTS:+"$LOG_OPTS"}
