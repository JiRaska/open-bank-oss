# Security KPI snapshot publisher (ADR-0279 #15/#17/#18 → admin-ui excellence console).
#
# Recomputes the three security KPIs FROM THE SAME SCRIPTS the gates run and, when the
# snapshot changed, opens a refresh PR for openbank-admin-ui/security-kpis.json — the
# file the admin-ui image bakes at build time (COPY openbank-admin-ui/ ./) and the
# /api/security/kpis BFF route serves read-only. A refresh PR goes through normal CI
# like any change; the file is CI-generated, never hand-edited (AGENTS.md rule 6).
#
# Weekly Friday 09:23 UTC — after the week's deps-freshness (Wed) and credential
# inventory (Thu) lanes, so the snapshot reflects them. Never pushes to main directly
# (the PR is the change), so main-red-watch does not watch this workflow.
name: Security KPI snapshot

on:
  schedule:
    - cron: "23 9 * * 5"   # weekly Friday 09:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: refresh security-kpis.json
    # Public repo ⇒ hosted runners are free; no cluster access needed (FinOps: hosted-first).
    runs-on: ubuntu-latest
    timeout-minutes: 25   # freshness collector does one Maven Central call per pinned module
    permissions:
      contents: write        # push the refresh branch
      pull-requests: write   # open the refresh PR
      actions: read          # fuzz collector reads the latest api-fuzz run's artifact
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collector self-test (offline)
        run: python3 .github/scripts/security-kpis.py --self-test

      - name: Recompute the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dependabot-alerts API has no GITHUB_TOKEN permission class (flat 403); when the
          # elevated PAT secret exists it unlocks the MTTR collector, otherwise that one
          # collector reports unavailable-with-reason and the rest still publish.
          MTTR_GH_TOKEN: ${{ secrets.METADATA_REFRESH_PAT }}
        run: python3 .github/scripts/security-kpis.py

      - name: Open a refresh PR when the snapshot moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet openbank-admin-ui/security-kpis.json && \
             ! git ls-files --others --exclude-standard openbank-admin-ui/security-kpis.json | grep -q .; then
            echo "snapshot unchanged — nothing to publish"
            exit 0
          fi
          BRANCH="chore/security-kpis-refresh"
          git checkout -b "$BRANCH"
          git add openbank-admin-ui/security-kpis.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -s -m "chore(security): refresh security KPIs snapshot

          Regenerated by security-kpis.yml from the gate scripts (ADR-0279).
          CI-generated — do not hand-edit."
          git push -f origin "$BRANCH"
          BODY=$(mktemp)
          printf '## What\n\nWeekly refresh of `openbank-admin-ui/security-kpis.json` — the baked snapshot behind `/api/security/kpis` and the three KPI domains on the security excellence console.\n\nCI-generated by `security-kpis.yml` from `security-kpis.py` (ADR-0279 #15/#17/#18). Do not hand-edit.\n' > "$BODY"
          gh pr create --title "chore(security): refresh security KPIs snapshot" \
            --body-file "$BODY" --base main --label security || \
            echo "refresh PR already open — branch updated in place"
