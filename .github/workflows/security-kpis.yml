# Security KPI snapshot publisher (ADR-0279 #15/#17/#18 → admin-ui excellence console).
#
# Recomputes the security KPIs FROM THE SAME SCRIPTS the gates run, uploads the exact
# generated JSON for independent runtime publication, and retains the refresh PR for
# the image-baked fallback at /api/security/kpis. A refresh PR goes through normal CI;
# the file is CI-generated, never hand-edited (AGENTS.md rule 6).
#
# Weekly Friday 09:23 UTC — after the week's deps-freshness (Wed) and credential
# inventory (Thu) lanes, so the snapshot reflects them. Never pushes to main directly
# (the PR is the change), so main-red-watch does not watch this workflow.
name: Security KPI snapshot

on:
  schedule:
    - cron: "23 9 * * 5"   # weekly Friday 09:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: refresh security-kpis.json
    # Public repo ⇒ hosted runners are free; no cluster access needed (FinOps: hosted-first).
    runs-on: ubuntu-latest
    timeout-minutes: 25   # freshness collector does one Maven Central call per pinned module
    permissions:
      contents: read
      actions: read          # fuzz collector reads the latest api-fuzz run's artifact
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collector self-test (offline)
        run: python3 .github/scripts/security-kpis.py --self-test

      - name: Recompute the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dependabot-alerts API has no GITHUB_TOKEN permission class (flat 403); when the
          # elevated PAT secret exists it unlocks the MTTR collector, otherwise that one
          # collector reports unavailable-with-reason and the rest still publish.
          MTTR_GH_TOKEN: ${{ secrets.METADATA_REFRESH_PAT }}
        run: python3 .github/scripts/security-kpis.py

      - name: Retain the generated KPI snapshot for the independent publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-kpis-${{ github.run_id }}-${{ github.run_attempt }}
          path: openbank-admin-ui/security-kpis.json
          if-no-files-found: error
          retention-days: 30

      - name: Detect a changed snapshot
        id: snapshot
        run: |
          set -euo pipefail
          if git diff --quiet openbank-admin-ui/security-kpis.json && \
             ! git ls-files --others --exclude-standard openbank-admin-ui/security-kpis.json | grep -q .; then
            echo "snapshot unchanged — nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a narrowly scoped GitHub App token
        id: app_token
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

      - name: Open a signed refresh PR
        if: steps.snapshot.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          sign-commits: true
          add-paths: openbank-admin-ui/security-kpis.json
          branch: chore/security-kpis-refresh
          delete-branch: true
          commit-message: |-
            chore(security): refresh security KPIs snapshot

            Regenerated by security-kpis.yml from the gate scripts (ADR-0279).
            CI-generated — do not hand-edit.
          title: "chore(security): refresh security KPIs snapshot"
          body: |-
            ## What

            Weekly refresh of `openbank-admin-ui/security-kpis.json` — the baked snapshot behind `/api/security/kpis` and the three KPI domains on the security excellence console.

            CI-generated by `security-kpis.yml` from `security-kpis.py` (ADR-0279 #15/#17/#18). Do not hand-edit.
          labels: security
