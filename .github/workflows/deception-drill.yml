# -----------------------------------------------------------------------------
# Scheduled deception drill (ADR-0361 slice 2, #14163).
#
# WHY. A tripwire nobody fires is indistinguishable from a broken one: "no alert" is also what
# a quiet week looks like. This fires the watched AWS key on purpose every week and FAILS when
# EventBridge did not match it or the alert SNS topic did not deliver it within the window.
# A red scheduled run is addressed to nobody, so a failure also posts on #14163.
#
# IDENTITY. Role openbank-deception-drill (aws/envs/sandbox-substrate/deception-delivery.tf),
# assumable only from this file on main (sub + job_workflow_ref, both StringEquals) and only on
# a GitHub-hosted runner, which always carries job_workflow_ref. It reads one SSM parameter and
# two CloudWatch namespaces, nothing else. Its ARN and the decoy identifiers are repository
# variables (DECEPTION_DRILL_ROLE_ARN, DRILL_DECOY_URL, DRILL_SSM_PARAM), so neither an account
# id nor where the tripwires sit enters git.
#
# SCOPE. --scope aws: decoy (its 401), watched key, SNS delivery. The watched ServiceAccount and
# the Loki half of the decoy need cluster access this identity deliberately lacks; they print
# SKIPPED and stay in the monthly manual drill. Stratus Red Team is NOT run: every technique
# that would add coverage needs rights to create or change AWS resources, which this identity
# must not hold.
#
# TRIGGERS. schedule and workflow_dispatch only, never pull_request: a PR must not be able to
# reach a role that can read a decoy credential.
# -----------------------------------------------------------------------------
name: Deception drill

on:
  schedule:
    # Mondays 07:20 UTC: inside working hours, so the email it produces is seen and matched to
    # this run (the run list, never the user agent, is what says it was the drill).
    - cron: "20 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deception-drill
  cancel-in-progress: false

jobs:
  drill:
    name: deception-drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The drill exists to fail when an alert does not arrive. This proves that branch runs on
      # this runner's bash and userland before its verdict below is believed.
      - name: Self-test the drill
        run: bash openbank-infra/scripts/deception-drill-selftest.sh

      - name: Require the drill role
        env:
          ROLE: ${{ vars.DECEPTION_DRILL_ROLE_ARN }}
          DECOY: ${{ vars.DRILL_DECOY_URL }}
          PARAM: ${{ vars.DRILL_SSM_PARAM }}
        run: |
          missing=""
          [ -n "$ROLE" ] || missing="$missing DECEPTION_DRILL_ROLE_ARN"
          [ -n "$DECOY" ] || missing="$missing DRILL_DECOY_URL"
          [ -n "$PARAM" ] || missing="$missing DRILL_SSM_PARAM"
          if [ -n "$missing" ]; then
            echo "::error::repository variable(s) not set:$missing. The drill cannot run, so the tripwires are UNVERIFIED (not passing). Apply deception-delivery.tf and set them (ADR-0361 slice 2)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DECEPTION_DRILL_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: deception-drill-${{ github.run_id }}

      - name: Fire the tripwires and wait for the signals
        env:
          DRILL_DECOY_URL: ${{ vars.DRILL_DECOY_URL }}
          DRILL_SSM_PARAM: ${{ vars.DRILL_SSM_PARAM }}
        run: bash openbank-infra/scripts/deception-drill.sh --scope aws | tee "$RUNNER_TEMP/drill.txt"

      - name: Escalate a failed drill on #14163
        if: ${{ failure() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const p = `${process.env.RUNNER_TEMP}/drill.txt`
            const report = fs.existsSync(p) ? fs.readFileSync(p, 'utf8').trim() : '(the drill did not get far enough to report)'
            const MARKER = '<!-- deception-drill -->'
            const issue_number = 14163
            const body = [
              MARKER,
              '## Scheduled deception drill FAILED',
              '',
              'The weekly drill fired the watched key and an expected signal did not arrive in its',
              'window (or the drill could not run at all). Until a run passes, treat the key',
              'tripwire as broken, not quiet.',
              '',
              '```',
              report,
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            })
            const prior = comments.find(c => c.body && c.body.includes(MARKER))
            if (prior) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prior.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body })
            }
