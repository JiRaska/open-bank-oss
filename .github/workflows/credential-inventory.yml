# Credential inventory (ADR-0279 WS4 #18) — the list of every long-lived credential.
#
# The OpenBao migration (ADR-0099) made DB passwords dynamic; every ExternalSecret
# pointing at a static `secret/data/…` kv path is a long-lived credential whose expiry
# exists nowhere. This lane keeps the inventory honest: weekly full scan, standing
# issue `Credential inventory` (label credential-inventory) always carries the latest
# table, and a run that finds an OVERDUE rotation deadline goes red — the same
# forcing-function pattern as vex-triage's SLA run. The PR-side ratchet (new static
# ExternalSecrets must declare `openbank.io/rotation-deadline`) is the
# `credential-deadline-ratchet` gate in gates.yaml.
#
# Weekly Thursday 09:07 UTC. Advisory w.r.t. PRs (never a gate input), never pushes
# to main — main-red-watch does not watch it.
name: Credential inventory

on:
  schedule:
    - cron: "7 9 * * 4"   # weekly Thursday 09:07 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventory:
    name: long-lived credential inventory
    # Public repo ⇒ hosted runners are free; no cluster access needed (FinOps: hosted-first).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write   # create/update the standing inventory issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Script self-test (offline — proves the classifier can still fail)
        run: python3 .github/scripts/credential-inventory.py --self-test

      - name: Build the inventory (red run = an overdue rotation deadline exists)
        run: |
          set -euo pipefail
          python3 .github/scripts/credential-inventory.py --inventory \
            --md credential-inventory.md --today "$(date -u +%F)"

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-inventory
          path: credential-inventory.md
          retention-days: 90

      - name: Update the standing inventory issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f credential-inventory.md || { echo "no report produced — skipping issue update"; exit 0; }
          ISSUE=$(gh issue list --label credential-inventory --state open --limit 1 --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --body-file credential-inventory.md
            echo "updated standing issue #$ISSUE"
          else
            gh issue create --title "Credential inventory" \
              --label credential-inventory --body-file credential-inventory.md
            echo "opened the standing issue"
          fi
