# -----------------------------------------------------------------------------
# Record sandbox deployment in the Pact broker — at gitops-PR MERGE, not open.
#
# WHY (issue #1420). record-deployment used to run inside auto-deploy.yml's `gitops-pr` job,
# in the same run that OPENS the `chore/gitops-auto-deploy-<sha>` PR — i.e. before the PR
# merges and before ArgoCD syncs the image onto the pods. A fleet-wide change (a shared-libs
# or dependency bump) opens one deploy PR covering the whole fleet and records every service
# as deployed at once. If that PR never merges (conflict, abandoned) or simply hasn't synced
# yet, the broker's deployed-version matrix diverges from reality — and can-i-deploy then
# PHANTOM-BLOCKS healthy services against those never-deployed versions. On 2026-07-18 that had
# stranded 35 of 50 services (11 money-path) on 3–5-day-old images. See #1420 for the audit.
#
# Recording at MERGE fixes it at the source: an abandoned deploy PR records nothing, and a
# merged one records only after the change has actually landed on `main`'s gitops (ArgoCD sync
# after merge is minutes, not the open→maybe-never gap). The old in-`gitops-pr` step is removed
# in the same change.
#
# Pure bash + the pact standalone CLI — no Gradle, no Docker.
# -----------------------------------------------------------------------------
name: Record deployment (gitops-PR merge)

on:
  pull_request:
    types: [closed]
    paths:
      - "openbank-infra/gitops/components/**"

permissions:
  contents: read

concurrency:
  # Serialise per source-sha so two overlapping gitops merges can't interleave their records.
  group: record-deployment-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  record:
    name: record-deployment
    # Any MERGED PR that touched gitops components (paths filter above). Not just the bot's
    # `chore/gitops-auto-deploy-*` branches: manually cut deploy PRs (e.g. #1729 billing) change
    # the same `:sandbox-<sha>` image pins but were never recorded, so the broker's deployed-
    # version matrix lagged reality for every hand-deployed service (#1727). The step below
    # derives (service, sha) pairs from the PR's own diff, so a PR that touches gitops without
    # changing an image pin records nothing. `pull_request` (not `_target`) keeps same-repo
    # secrets; a fork PR gets no secrets and would fail loudly rather than record garbage.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
      PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
      PACT_STANDALONE_VERSION: "2.6.2"
      # Untrusted-ish inputs pulled into env (never interpolated into a run: script directly):
      # the ref is bot-generated but we validate it to a 40-hex sha before use anyway.
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh pr diff` shells out to git and needs either a checkout or an explicit repo. Everything
      # here is API-only, so without --repo it dies "not a git repository", returns nothing, and
      # every run silently records zero services ("nothing to record") — the deploy tracking then
      # goes stale with no error. Pass the repo explicitly so it works API-only.
      GH_REPO: ${{ github.repository }}
    steps:
      # SHALLOW on purpose. The only things needed from the repo are two files —
      # .github/scripts/resolve-record-deployment-version.sh and release-please-config.json —
      # and the equivalence proof is made through the compare API, not through git history
      # (#3223). A full-history checkout on every gitops merge would buy nothing here.
      - name: Check out the resolver and the exclude-paths it reads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record deployed services in the broker
        if: ${{ vars.PACT_BROKER_URL != '' }}
        run: |
          set -uo pipefail
          # The services this PR actually deployed = the manifests it changed to :sandbox-<short>.
          # Read them from the PR's own diff (added lines only), so an abandoned/other PR can
          # never cause a record here. Pacticipant name == the image name (openbank-<svc>).
          #
          # The deployed VERSION is per-service now: bot auto-deploy PRs pin every service to the
          # one sha in the branch name, but a manually cut deploy PR can pin any service to any
          # built image (#1727). So take the short sha from each image tag and resolve it to the
          # full 40-hex sha via the commits API, validating the result — a hand-crafted tag can
          # never inject a shell token or a bogus pacticipant version.
          mapfile -t PAIRS < <(
            gh pr diff "$PR_NUMBER" --repo "$GH_REPO" \
              | grep -E "^\+.*openbank-[a-z0-9-]+:sandbox-[0-9a-f]{7,40}" \
              | grep -oE "openbank-[a-z0-9-]+:sandbox-[0-9a-f]{7,40}" \
              | sort -u
          )
          if [ "${#PAIRS[@]}" -eq 0 ]; then
            echo "No openbank-*:sandbox-<sha> image changes in PR #${PR_NUMBER} — nothing to record."
            exit 0
          fi

          # Resolve each distinct short sha once. On the bot branch this is one API call; the
          # branch-name sha (chore/gitops-auto-deploy-<sha>) is used as a consistency check when
          # present, not as the source of truth.
          declare -A FULL
          resolve_failed=0
          for pair in "${PAIRS[@]}"; do
            short="${pair##*:sandbox-}"
            [ -n "${FULL[$short]:-}" ] && continue
            full="$(gh api "repos/${GH_REPO}/commits/${short}" --jq .sha 2>/dev/null || true)"
            if ! printf '%s' "$full" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::image tag sandbox-${short} does not resolve to a commit in ${GH_REPO} — refusing to record it"
              resolve_failed=1
              continue
            fi
            FULL[$short]="$full"
          done
          if [ "${HEAD_REF#chore/gitops-auto-deploy-}" != "$HEAD_REF" ]; then
            BRANCH_SHA="${HEAD_REF#chore/gitops-auto-deploy-}"
            for short in "${!FULL[@]}"; do
              case "$BRANCH_SHA" in
                "${short}"*) ;;
                *) echo "::warning::auto-deploy branch sha ${BRANCH_SHA:0:8} != image tag sha ${short} — recording the image tag (gitops truth)";;
              esac
            done
          fi
          echo "Recording ${#PAIRS[@]} service pin(s) → sandbox: ${PAIRS[*]}"

          # Download the pact standalone CLI (retry the flaky github.com release download, then
          # fail loud — a silent skip would leave the broker behind reality, the very drift this
          # workflow exists to prevent; ADR-0092).
          arch="$(uname -m)"; case "$arch" in aarch64|arm64) a=arm64 ;; *) a=x86_64 ;; esac
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"; case "$os" in darwin) o=osx ;; *) o=linux ;; esac
          url="https://github.com/pact-foundation/pact-ruby-standalone/releases/download/v${PACT_STANDALONE_VERSION}/pact-${PACT_STANDALONE_VERSION}-${o}-${a}.tar.gz"
          dl_ok=0
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 3 -o /tmp/pact.tgz "$url"; then dl_ok=1; break; fi
            echo "::warning::pact standalone download attempt ${attempt}/3 failed; retrying in 5s"; sleep 5
          done
          [ "$dl_ok" -eq 1 ] || { echo "::error::could not download pact standalone after 3 attempts (ADR-0092)"; exit 1; }
          mkdir -p /tmp/pact && tar -xzf /tmp/pact.tgz -C /tmp/pact
          CLI="/tmp/pact/pact/bin/pact-broker"

          rec_failed="$resolve_failed"
          for pair in "${PAIRS[@]}"; do
            svc="${pair%%:sandbox-*}"
            short="${pair##*:sandbox-}"
            SHA="${FULL[$short]:-}"
            [ -n "$SHA" ] || continue  # unresolvable tag already counted via resolve_failed
            echo "==> record-deployment ${svc} @ ${short} → sandbox"
            # WHICH version to record is decided by resolve-record-deployment-version.sh (#3223).
            # It never fabricates: `exact` when the broker has this sha, `equivalent:<sha>` when a
            # published version is byte-identical in every build input of this service, `none`
            # otherwise. The old code PUT an empty version on 404, which made 45 of 56 deployed
            # versions unverifiable and left 13 of 19 providers permanently blocking consumers.
            sel="$(bash .github/scripts/resolve-record-deployment-version.sh "$svc" "$SHA")"
            case "$sel" in
              exact:*)      REC_VER="${sel#exact:}" ;;
              equivalent:*) REC_VER="${sel#equivalent:}"
                            echo "  no version for ${SHA:0:8}; ${REC_VER:0:8} is byte-identical in every build input — recording that (#3223, #3432)" ;;
              *)            echo "::warning::${svc}: no published version for ${SHA:0:8} and none provably equivalent — recording NOTHING rather than a version nothing can verify (#3223). can-i-deploy for its consumers will report no deployed version, which is the honest state."
                            continue ;;
            esac
            ok=0
            for attempt in 1 2 3; do
              if "$CLI" record-deployment \
                   --pacticipant "$svc" --version "$REC_VER" --environment sandbox \
                   --broker-base-url "$PACT_BROKER_URL" \
                   --broker-username "$PACT_BROKER_USERNAME" \
                   --broker-password "$PACT_BROKER_PASSWORD"; then
                ok=1; echo "  ✓ recorded"; break
              fi
              echo "::warning::record-deployment ${svc} attempt ${attempt}/3 failed; retrying in 5s"; sleep 5
            done
            [ "$ok" -eq 1 ] || { echo "::error::record-deployment failed for ${svc} after 3 attempts"; rec_failed=1; }
          done
          if [ "$rec_failed" -ne 0 ]; then
            echo "::error::one or more record-deployments failed — broker matrix diverges from reality (ADR-0092)"
            exit 1
          fi
