# -----------------------------------------------------------------------------
# Deploy PR branch updater (2026-10-15 MGM deploy postmortem).
#
# WHY THIS EXISTS
#   Bot deploy PRs (`chore(admin-ui): deploy …`, `chore(gitops): auto-deploy …`) are
#   created with auto-merge armed — and then left to GitHub. The main-protection ruleset
#   requires its 8 status-check contexts with `strict_required_status_checks_policy: true`,
#   so the head must contain current main. Plain pull-request auto-merge does NOT update
#   the branch to achieve that: every push to main flips the PR to BEHIND, auto-merge
#   waits, and on a busy main the deployment never lands without a human. Measured on
#   2026-10-15: admin-ui deploy PR #12928 — green checks, armed auto-merge, BEHIND for
#   4+ hours while the /r/[token] landing page it carried kept answering 307.
#
# WHAT THIS DOES
#   On every push to main and on an hourly schedule, it merges current main into every
#   open bot deploy PR that is BEHIND/UNKNOWN and whose head is older than a 45-minute
#   throttle (each update re-triggers the PR's checks; the throttle bounds that churn in
#   the congested queue). The armed auto-merge then completes the moment checks pass on
#   an up-to-date head. Scope is head-ref prefix match (`chore/admin-ui-deploy-`,
#   `chore/gitops-auto-deploy-`) — never title search — so feature PRs can never be
#   touched. See update-deploy-pr-branches.sh for the full rationale.
#
# WHY ESCALATION IS NOT NEEDED HERE
#   A missed run self-heals: the next push/schedule tick re-evaluates. A run that fails
#   is surfaced by auto-deploy-red-watch / main-red-watch like any other workflow.
# -----------------------------------------------------------------------------

name: Deploy PR branch updater

on:
  push:
    branches: [main]
  schedule:
    # 11 minutes past the hour — off the congested :00/:30 marks.
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One updater at a time; in-progress must finish (cancel-in-progress would interrupt a
  # batch of update-branch calls mid-way and leave some deploy PRs stale until next tick).
  group: deploy-pr-updater
  cancel-in-progress: false

jobs:
  update:
    name: Update stale deploy PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update stale bot deploy PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/update-deploy-pr-branches.sh
