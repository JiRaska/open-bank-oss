# SPDX-License-Identifier: Apache-2.0
# Contract-drift gate (ADR-0063 Phase 2, issue #468). Committed pacts are derived data — regenerated
# from the consumer tests, never hand-edited (same principle as the catalog/NetworkPolicy generators).
# This re-runs every consumer pact test and fails if the regenerated JSON differs from what's
# committed in pacts/, catching exactly the class of bug #370 found as a "bonus" (a stale committed
# pact missing an interaction the consumer test had already moved past).
#
# Consumer pact tests are pure JVM or PactJS (embedded mock servers, no live infrastructure), so
# this is cheap enough to run on every PR that touches a contract test or the pacts/ dir itself.

name: Pact drift check

on:
  pull_request:
    paths:
      - "pacts/**"
      - "**/src/test/kotlin/**/contract/*PactConsumerTest.kt"
      # Ledger regeneration loads this profile and its manifest before filtering tests.
      - "openbank-ledger-service/src/test/kotlin/com/openbank/ledger/integration/PensionCoInstanceSwitchesIT.kt"
      - "openbank-infra/gitops/components/ledger-pension-co/ledger-service.yaml"
      - "openbank-infra/gitops/components/ledger-pension-co/chart-of-accounts.yaml"
      - "openbank-admin-ui/**"
      - "openbank-case-coordinator-agent/**"
      - "openbank-flaky-test-hunter/**"
      - "openbank-product-catalog/**"
      - "openbank-libs*/**"
      # Governance declarations cannot change generated consumer contracts.
      - "!openbank-libs/governance/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/scripts/derive-pact-drift-scope.sh"
      - ".github/scripts/classify-pact-drift-scope.py"
      - ".github/scripts/test-classify-pact-drift-scope.py"
      - ".github/scripts/test-admin-ui-pact-scope.py"
      - ".github/scripts/shard-pact-gradle-args.py"
      - ".github/scripts/test-shard-pact-gradle-args.py"
      - ".github/scripts/pact-js-contracts.py"
      - ".github/scripts/publish-admin-ui-pacts.py"
      - ".github/scripts/test-publish-admin-ui-pacts.py"
      - ".github/scripts/await-admin-ui-pact-publication.py"
      - ".github/scripts/test-await-admin-ui-pact-publication.py"
      - ".github/scripts/test-pact-archive-freshness.py"
      - ".github/workflows/pact-drift-check.yml"
      - ".github/workflows/verify-provider.yml"
  push:
    branches: [main]
    paths:
      - "pacts/**"
      - "**/src/test/kotlin/**/contract/*PactConsumerTest.kt"
      # Ledger regeneration loads this profile and its manifest before filtering tests.
      - "openbank-ledger-service/src/test/kotlin/com/openbank/ledger/integration/PensionCoInstanceSwitchesIT.kt"
      - "openbank-infra/gitops/components/ledger-pension-co/ledger-service.yaml"
      - "openbank-infra/gitops/components/ledger-pension-co/chart-of-accounts.yaml"
      - "openbank-admin-ui/**"
      - "openbank-case-coordinator-agent/**"
      - "openbank-flaky-test-hunter/**"
      - "openbank-product-catalog/**"
      - "openbank-libs*/**"
      - "!openbank-libs/governance/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/scripts/derive-pact-drift-scope.sh"
      - ".github/scripts/classify-pact-drift-scope.py"
      - ".github/scripts/test-classify-pact-drift-scope.py"
      - ".github/scripts/test-admin-ui-pact-scope.py"
      - ".github/scripts/shard-pact-gradle-args.py"
      - ".github/scripts/test-shard-pact-gradle-args.py"
      - ".github/scripts/pact-js-contracts.py"
      - ".github/scripts/publish-admin-ui-pacts.py"
      - ".github/scripts/test-publish-admin-ui-pacts.py"
      - ".github/scripts/await-admin-ui-pact-publication.py"
      - ".github/scripts/test-await-admin-ui-pact-publication.py"
      - ".github/scripts/test-pact-archive-freshness.py"
      - ".github/workflows/pact-drift-check.yml"
      - ".github/workflows/verify-provider.yml"

permissions:
  contents: read

concurrency:
  # Never collapse two main commits: committed pact evidence belongs to an exact SHA.
  group: pact-drift-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pact-scope:
    name: Classify Pact regeneration scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select scoped mode only for a complete Admin UI-only diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA=""
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = push ]; then
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if [ -n "$BASE_SHA" ]; then
            # The classifier itself must come from the event base, so a change to the policy file
            # cannot authorize its own JVM-test skip. Missing base source selects the full run.
            if git show "$BASE_SHA:.github/scripts/classify-pact-drift-scope.py" \
                > "${RUNNER_TEMP}/classify-pact-drift-scope.py"; then
              python3 "${RUNNER_TEMP}/classify-pact-drift-scope.py" \
                --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
                --output "$GITHUB_OUTPUT"
            else
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo 'shards=["0", "1", "2", "3"]' >> "$GITHUB_OUTPUT"
              echo "Pact regeneration scope: full (base classifier unavailable)"
            fi
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo 'shards=["0", "1", "2", "3"]' >> "$GITHUB_OUTPUT"
            echo "Pact regeneration scope: full (non-PR event)"
          fi

  gradle-pacts:
    name: Regenerate JVM pacts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: pact-scope
    if: ${{ !cancelled() }}
    # Successful UI-only classification creates one dynamically derived shard; missing or
    # failed classification falls back to all four shards. The aggregator proves exact ownership.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pact-scope.result == 'success' && needs.pact-scope.outputs.mode == 'ui-only' && needs.pact-scope.outputs.shards == '["ui"]' && '["ui"]' || '["0", "1", "2", "3"]') }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Derive and partition the JVM scope
        env:
          SHARD: ${{ matrix.shard }}
          SCOPE_MODE: ${{ needs.pact-scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.pact-scope.result }}
        run: |
          set -euo pipefail
          python3 .github/scripts/test-shard-pact-gradle-args.py
          if [ "$SCOPE_RESULT" = success ] && [ "$SCOPE_MODE" = ui-only ]; then
            [ "$SHARD" = ui ] || { echo "::error::Unexpected UI Pact shard: $SHARD"; exit 1; }
            python3 .github/scripts/pact-js-contracts.py --self-test
            .github/scripts/derive-pact-drift-scope.sh --self-test
            .github/scripts/derive-pact-drift-scope.sh --admin-ui-selected-scope \
              > "${RUNNER_TEMP}/admin-ui-jvm-scope.json"
            python3 - "${RUNNER_TEMP}/admin-ui-jvm-scope.json" "${RUNNER_TEMP}/shard-args.txt" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          scope = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tests = scope["tests"]
          if not tests or any(len(item) != 2 or not all(item) for item in tests):
              raise SystemExit("invalid or empty derived Admin UI JVM test scope")
          lines = []
          for module in sorted({item[0] for item in tests}):
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", module):
                  raise SystemExit("invalid derived Gradle module")
              lines.extend([f":{module}:test", "--rerun"])
              for test_class in sorted({item[1] for item in tests if item[0] == module}):
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_$]*(?:\.[A-Za-z_][A-Za-z0-9_$]*)*", test_class):
                      raise SystemExit("invalid derived Pact test class")
                  lines.extend(["--tests", test_class])
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
            python3 - "${RUNNER_TEMP}/admin-ui-jvm-scope.json" "${RUNNER_TEMP}/expected-jvm-pacts.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          scope = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          selected = sorted(set(scope["selectedPacts"]))
          consumer = set(scope["consumerPacts"])
          if not selected or not consumer or not consumer <= set(selected):
              raise SystemExit("selected JVM archive scope omits an Admin UI consumer pact")
          if any(not path.startswith("pacts/") or ".." in Path(path).parts for path in selected):
              raise SystemExit("invalid path in derived JVM pact scope")
          Path(sys.argv[2]).write_text("".join(path + "\n" for path in selected), encoding="utf-8")
          PY
          else
            .github/scripts/derive-pact-drift-scope.sh > "${RUNNER_TEMP}/all-args.txt"
            python3 .github/scripts/shard-pact-gradle-args.py \
              "${RUNNER_TEMP}/all-args.txt" "$SHARD" 4 > "${RUNNER_TEMP}/shard-args.txt"
          fi

      - name: Regenerate this shard and archive only rewritten pacts
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t GRADLE_ARGS < "${RUNNER_TEMP}/shard-args.txt"
          touch "${RUNNER_TEMP}/pact-regen-marker"
          ./gradlew --continue "${GRADLE_ARGS[@]}"
          find pacts -maxdepth 1 -name '*.json' -newer "${RUNNER_TEMP}/pact-regen-marker" \
            -print | sort > "${RUNNER_TEMP}/regenerated.txt"
          tar -cf "${RUNNER_TEMP}/jvm-pacts-${SHARD}.tar" -T "${RUNNER_TEMP}/regenerated.txt"

      - name: Hand off this shard's regenerated contracts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-pacts-${{ matrix.shard }}
          path: ${{ runner.temp }}/jvm-pacts-${{ matrix.shard }}.tar
          if-no-files-found: error
          retention-days: 7

  drift-check:
    name: Regenerate consumer pacts and diff against committed
    needs: [pact-scope, gradle-pacts]
    # Validate failed shards, but let a cancelled run stop before this downstream job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the selected JVM Pact scope to succeed
        env:
          SCOPE_MODE: ${{ needs.pact-scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.pact-scope.result }}
          FULL_RESULT: ${{ needs.gradle-pacts.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" = success ] && [ "$SCOPE_MODE" = ui-only ]; then
            [ "$FULL_RESULT" = success ] || {
              echo "::error::Admin UI JVM Pact producers did not complete: $FULL_RESULT"
              exit 1
            }
          else
            [ "$FULL_RESULT" = success ] || {
              echo "::error::Full JVM pact regeneration did not complete in every shard: $FULL_RESULT"
              exit 1
            }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: openbank-admin-ui/package-lock.json
      - name: Install Admin UI dependencies for PactJS
        working-directory: openbank-admin-ui
        run: npm ci --no-audit --no-fund

      # The gate's scope is DERIVED, not listed here. It used to be a hand-written list of Gradle
      # module paths, and that list is the one thing this workflow cannot check: its only assertion
      # is `git diff -- pacts/`, which can only see files the regeneration step actually rewrote.
      # So a consumer module missing from the list did not read as *unchecked* — it read as
      # *passing*, forever, silently. `:openbank-fx-service` had to be added by hand in #2284, and
      # `:openbank-interest-service` had been missing since the day its pact was committed. Then, in
      # the two days it took to write this, three more consumers landed unlisted — vop→party
      # (#2324), mcp→consent/balance/transaction (#2336), psd2→tpp-registry (#2346) — five pacts the
      # gate was green about having regenerated none of. #2357 added those three by hand; this
      # removes the need to. Three hand-maintenance commits in one week is the argument.
      #
      # derive-pact-drift-scope.sh discovers every `*PactConsumerTest.kt`; its PactJS companion
      # discovers every `*-pact.contract.test.ts`. Together they map tests to pacts/ outputs and
      # fail on an orphan pact, an uncommitted pact, or a consumer dropped silently from scope.
      # It is bash-3.2 clean, so it runs (and can be fed a failing case) on a dev machine too.
      - name: Verify publication boundaries
        run: |
          python3 .github/scripts/test-classify-pact-drift-scope.py
          python3 .github/scripts/test-admin-ui-pact-scope.py
          python3 .github/scripts/test-pact-archive-freshness.py
          python3 .github/scripts/test-publish-admin-ui-pacts.py
          python3 .github/scripts/test-await-admin-ui-pact-publication.py

      - name: Derive the set of modules to regenerate
        env:
          SCOPE_MODE: ${{ needs.pact-scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.pact-scope.result }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pact-js-contracts.py --self-test
          .github/scripts/derive-pact-drift-scope.sh --self-test
          if [ "$SCOPE_RESULT" = success ] && [ "$SCOPE_MODE" = ui-only ]; then
            .github/scripts/derive-pact-drift-scope.sh --admin-ui-selected-scope \
              > "${RUNNER_TEMP}/admin-ui-jvm-scope.json"
            python3 - "${RUNNER_TEMP}/admin-ui-jvm-scope.json" \
              "${RUNNER_TEMP}/all-jvm-pacts.txt" "${RUNNER_TEMP}/expected-jvm-pacts.txt" \
              "${RUNNER_TEMP}/pact-uncovered.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          scope_path, all_path, selected_path, uncovered_path = map(Path, sys.argv[1:])
          scope = json.loads(scope_path.read_text(encoding="utf-8"))
          all_pacts = sorted(set(scope["allJvmPacts"]))
          selected = sorted(set(scope["selectedPacts"]))
          consumer = set(scope["consumerPacts"])
          uncovered = sorted(set(scope["uncoveredPacts"]))
          if not all_pacts or not selected or not consumer or not consumer <= set(selected) or not set(selected) <= set(all_pacts):
              raise SystemExit("Admin UI JVM scope is empty or not a subset of the complete derived JVM scope")
          if any(not path.startswith("pacts/") or ".." in Path(path).parts
                 for path in [*all_pacts, *selected, *consumer]):
              raise SystemExit("invalid path in derived Admin UI JVM scope")
          all_path.write_text("".join(path + "\n" for path in all_pacts), encoding="utf-8")
          selected_path.write_text("".join(path + "\n" for path in selected), encoding="utf-8")
          uncovered_path.write_text("".join(path + "\n" for path in uncovered), encoding="utf-8")
          PY
          else
            .github/scripts/derive-pact-drift-scope.sh --gated-pacts > "${RUNNER_TEMP}/all-jvm-pacts.txt"
            .github/scripts/derive-pact-drift-scope.sh --uncovered > "${RUNNER_TEMP}/pact-uncovered.txt"
            cp -- "${RUNNER_TEMP}/all-jvm-pacts.txt" "${RUNNER_TEMP}/expected-jvm-pacts.txt"
          fi
          python3 .github/scripts/pact-js-contracts.py --tests > "${RUNNER_TEMP}/pact-js-tests.txt"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jvm-pacts-*
          merge-multiple: true
          path: ${{ runner.temp }}/jvm-pacts

      - name: Verify shard coverage and restore regenerated JVM contracts
        env:
          SCOPE_MODE: ${{ needs.pact-scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.pact-scope.result }}
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/observed-jvm-pacts.txt"
          if [ "$SCOPE_RESULT" = success ] && [ "$SCOPE_MODE" = ui-only ]; then
            archives=("${RUNNER_TEMP}/jvm-pacts/jvm-pacts-ui.tar")
          else
            archives=()
            for shard in 0 1 2 3; do
              archives+=("${RUNNER_TEMP}/jvm-pacts/jvm-pacts-${shard}.tar")
            done
          fi
          for archive in "${archives[@]}"; do
            [ -f "$archive" ] || {
              echo "::error::Missing regenerated JVM Pact archive: $archive"
              exit 1
            }
            tar -tf "$archive" >> "${RUNNER_TEMP}/observed-jvm-pacts.txt"
          done
          if [ -n "$(sort "${RUNNER_TEMP}/observed-jvm-pacts.txt" | uniq -d)" ]; then
            echo "::error::Two JVM archives generated the same pact; ownership is ambiguous"
            exit 1
          fi
          if ! diff -u "${RUNNER_TEMP}/expected-jvm-pacts.txt" \
              <(sort "${RUNNER_TEMP}/observed-jvm-pacts.txt"); then
            echo "::error::JVM archives did not regenerate exactly the selected derived committed pact set"
            exit 1
          fi
          # Provenance is the exact validated archive set, not wall-clock ordering:
          # extraction and marker creation can receive identical filesystem timestamps.
          # Remove old destinations first so an unchanged checkout cannot masquerade as a restore.
          while IFS= read -r pact; do
            rm -f -- "$pact"
          done < "${RUNNER_TEMP}/expected-jvm-pacts.txt"
          touch "${RUNNER_TEMP}/pact-regen-marker"
          for archive in "${archives[@]}"; do
            tar -xf "$archive"
          done
          while IFS= read -r pact; do
            [ -f "$pact" ] && [ ! -L "$pact" ] || {
              echo "::error::Validated JVM archive did not restore regular file: $pact"
              exit 1
            }
          done < "${RUNNER_TEMP}/expected-jvm-pacts.txt"

      # Run the exact files the discovery step derived — not a second glob in package.json that can
      # drift independently. Running them after the marker makes the mtime proof below catch
      # an accidentally skipped PactJS test; JVM artifacts have their own restore proof above.
      - name: Regenerate every PactJS consumer pact
        run: |
          set -euo pipefail
          mapfile -t PACT_JS_TESTS < "${RUNNER_TEMP}/pact-js-tests.txt"
          [ "${#PACT_JS_TESTS[@]}" -gt 0 ] || {
            echo "::error::PactJS derivation returned an empty test set"
            exit 1
          }
          PACT_JS_TEST_ARGS=()
          for test in "${PACT_JS_TESTS[@]}"; do
            case "$test" in
              openbank-admin-ui/*) PACT_JS_TEST_ARGS+=("${test#openbank-admin-ui/}") ;;
              *)
                echo "::error::Derived PactJS test is outside openbank-admin-ui: $test"
                exit 1
                ;;
            esac
          done
          printf '  %s\n' "${PACT_JS_TESTS[@]}"
          (
            cd openbank-admin-ui
            npm exec -- vitest run "${PACT_JS_TEST_ARGS[@]}"
          )

      # Belt to --rerun's braces. The diff step cannot tell "regenerated and identical" from
      # "never regenerated" — both look clean. This proves each JVM output selected for this run
      # came from its validated archive, and every PactJS output was rewritten after the marker.
      # Full runs select all JVM outputs; Admin UI-only runs select the complete discovered JVM
      # producer closure for that consumer while leaving other, unchanged JVM outputs untouched.
      - name: Verify every committed pact was actually regenerated
        env:
          SCOPE_MODE: ${{ needs.pact-scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.pact-scope.result }}
        run: |
          set -euo pipefail
          uncovered="$(cat "${RUNNER_TEMP}/pact-uncovered.txt")"
          stale=""
          for f in pacts/*.json; do
            if [ -n "$uncovered" ] && printf '%s\n' "$uncovered" | grep -qxF -- "$f"; then
              continue
            fi
            # JVM freshness was proved by exact archive coverage and restoring absent
            # destinations above. PactJS still requires an actual post-marker rewrite.
            if grep -qxF -- "$f" "${RUNNER_TEMP}/expected-jvm-pacts.txt"; then
              [ -f "$f" ] && [ ! -L "$f" ] || stale="$stale $f"
              continue
            fi
            if [ "$SCOPE_RESULT" = success ] && [ "$SCOPE_MODE" = ui-only ] && \
                grep -qxF -- "$f" "${RUNNER_TEMP}/all-jvm-pacts.txt"; then
              # The complete owner derivation proved this is a JVM pact outside the selected
              # Admin UI-consumer producer closure; its inputs were unchanged by this UI-only PR.
              continue
            fi
            if [ ! "$f" -nt "${RUNNER_TEMP}/pact-regen-marker" ]; then
              stale="$stale $f"
            fi
          done
          if [ -n "$stale" ]; then
            echo "::error::These committed pacts were NOT rewritten by the regeneration step, so the drift check below would pass without having read them:"
            for f in $stale; do echo "::error::  $f"; done
            echo "::error::The JVM/PactJS derivation did not put this consumer in scope, or its test task was skipped. Run derive-pact-drift-scope.sh and pact-js-contracts.py locally to inspect the scope."
            exit 1
          fi
          echo "Coverage OK — every pact in the selected JVM scope and every PactJS scope was regenerated."
          cp -- "${RUNNER_TEMP}/expected-jvm-pacts.txt" \
            "${RUNNER_TEMP}/verified-jvm-pacts.txt"

      - name: Fail on drift between regenerated and committed pacts
        run: |
          if ! git diff --exit-code -- pacts/; then
            echo "::error::Committed pacts/*.json differ from what the consumer tests generate right now."
            echo "::error::Regenerate and commit: run the affected JVM PactConsumerTest or npm --prefix openbank-admin-ui run test:contract, then commit pacts/<consumer>-<provider>.json in the same PR."
            git status --porcelain -- pacts/
            exit 1
          fi
          echo "No drift — every committed pact matches its consumer test."

      - name: Upload regenerated pacts on drift (for local diffing)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-pacts
          path: pacts/
          retention-days: 7

      - name: Prepare verified admin UI contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          python3 .github/scripts/publish-admin-ui-pacts.py prepare
          --marker "${RUNNER_TEMP}/pact-regen-marker"
          --jvm-pacts-manifest "${RUNNER_TEMP}/verified-jvm-pacts.txt"
          --bundle "${RUNNER_TEMP}/admin-ui-pacts.json"

      - name: Hand off verified admin UI contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-pacts-${{ github.sha }}
          path: ${{ runner.temp }}/admin-ui-pacts.json
          if-no-files-found: error
          retention-days: 7

  publish-admin-ui:
    name: Publish verified admin UI contracts
    # Services CI waits for this exact-SHA job before its single provider verification.
    # Do not also verify here: that duplicates the ARC build for changed contracts.
    needs: drift-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: openbank-build
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-ui-pacts-${{ github.sha }}
          path: ${{ runner.temp }}/admin-ui-pact-handoff
      - name: Publish exact revision
        env:
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish-admin-ui-pacts.py publish \
            --bundle "${RUNNER_TEMP}/admin-ui-pact-handoff/admin-ui-pacts.json"
