# SPDX-License-Identifier: Apache-2.0
# Contract-drift gate (ADR-0063 Phase 2, issue #468). Committed pacts are derived data — regenerated
# from the consumer tests, never hand-edited (same principle as the catalog/NetworkPolicy generators).
# This re-runs every consumer pact test and fails if the regenerated JSON differs from what's
# committed in pacts/, catching exactly the class of bug #370 found as a "bonus" (a stale committed
# pact missing an interaction the consumer test had already moved past).
#
# Consumer pact tests are pure JVM (an embedded mock server, no Testcontainers/Quarkus boot), so
# this is cheap enough to run on every PR that touches a contract test or the pacts/ dir itself.

name: Pact drift check

on:
  pull_request:
    paths:
      - "pacts/**"
      - "**/src/test/kotlin/**/contract/*PactConsumerTest.kt"
      - ".github/workflows/pact-drift-check.yml"
  push:
    branches: [main]
    paths:
      - "pacts/**"
      - "**/src/test/kotlin/**/contract/*PactConsumerTest.kt"

permissions:
  contents: read

jobs:
  drift-check:
    name: Regenerate consumer pacts and diff against committed
    runs-on: ubuntu-latest
    # The fleet-wide regeneration reached 18m10s while successful and twice hit the old 20m
    # ceiling on #7001 before Gradle could finish. Keep the full derived scope and drift proof;
    # the extra headroom covers cold-cache variance without weakening either assertion below.
    timeout-minutes: 30
    # This job regenerates EVERY consumer pact in one Gradle invocation, and the scope is derived
    # from the @Pact annotations — so it grows by one module each time anyone adds a pact, while
    # the heap did not grow at all. It set no GRADLE_OPTS, so the daemon ran on Gradle's default,
    # and at 31 modules it tipped over:
    #
    #   * What went wrong:
    #   Execution failed for task ':openbank-onboarding-service:quarkusGenerateTestAppModel'
    #   > Java heap space
    #
    # onboarding-service is not the problem and is not even a subject of the change that hit this
    # (`:openbank-onboarding-service:quarkusGenerateTestAppModel` builds in 6s on its own) — it was
    # simply the module the daemon happened to be on when memory ran out. That is what makes the
    # failure so misleading: it names an innocent module, on a PR that touched a different one.
    #
    # The number to watch is the derived scope, not this heap. `derive-pact-drift-scope.sh` will
    # keep adding modules; if this OOMs again, split the regeneration into batches rather than
    # raising the ceiling a second time. 6g matches the fleet's heaviest lanes rather than the
    # 3g eight other workflows use, because this one invocation configures every module those
    # lanes handle one at a time.
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # READ-ONLY. setup-java's own `cache: gradle` SAVES a whole Gradle-home entry
          # (~1.1 GB) on this job's key, into a pool already over the 10 GB ceiling — so
          # every write here evicts some other job's cache, continuously and silently
          # (#3299). This job only consumes dependencies; it has no reason to be one of
          # the lanes that maintains the cache. Reading the shared entry the writing
          # lanes keep warm (_service-ci.yml's self-hosted lane, auto-deploy.yml) gives
          # it the same artifacts and costs the pool nothing.
          cache-read-only: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The gate's scope is DERIVED, not listed here. It used to be a hand-written list of Gradle
      # module paths, and that list is the one thing this workflow cannot check: its only assertion
      # is `git diff -- pacts/`, which can only see files the regeneration step actually rewrote.
      # So a consumer module missing from the list did not read as *unchecked* — it read as
      # *passing*, forever, silently. `:openbank-fx-service` had to be added by hand in #2284, and
      # `:openbank-interest-service` had been missing since the day its pact was committed. Then, in
      # the two days it took to write this, three more consumers landed unlisted — vop→party
      # (#2324), mcp→consent/balance/transaction (#2336), psd2→tpp-registry (#2346) — five pacts the
      # gate was green about having regenerated none of. #2357 added those three by hand; this
      # removes the need to. Three hand-maintenance commits in one week is the argument.
      #
      # derive-pact-drift-scope.sh discovers every `*PactConsumerTest.kt`, maps it to the pacts/
      # file its `@Pact(consumer = .., provider = ..)` names, and fails on an orphan pact, an
      # uncommitted pact, or a module dropped out of scope without declaring what that strands.
      # It is bash-3.2 clean, so it runs (and can be fed a failing case) on a dev machine too.
      - name: Derive the set of modules to regenerate
        run: |
          set -euo pipefail
          .github/scripts/derive-pact-drift-scope.sh > "${RUNNER_TEMP}/pact-gradle-args.txt"
          .github/scripts/derive-pact-drift-scope.sh --uncovered > "${RUNNER_TEMP}/pact-uncovered.txt"

      # One Gradle invocation, every gated consumer pact test module — each writes to the shared
      # pacts/ dir (systemProperty("pact.rootDir", ...) in the consuming service's
      # build.gradle.kts). --continue so one module's failure doesn't hide drift elsewhere.
      #
      # --rerun is load-bearing, not a belt-and-braces flag (#2291). The generated pact JSON is
      # not a declared output of the `test` task, so nothing invalidates `test` when pacts/
      # changes: Gradle reports UP-TO-DATE (or FROM-CACHE — this job runs with `cache: gradle`,
      # so a warm cache is the expected state), the pact files are never rewritten, the diff
      # below is empty and the gate prints "No drift" having checked nothing. That is worst
      # exactly where the gate matters most — a PR whose only change is under pacts/, i.e. the
      # hand-edited-derived-file case this whole workflow exists to catch. --rerun is scoped to
      # the tasks named on the command line, so compileKotlin/compileTestKotlin still come from
      # the cache and only the (pure-JVM, mock-server) pact tests re-execute.
      #
      # openbank-swift-service is out of scope: its own build.gradle.kts statically excludes both
      # SwiftEventPactConsumerTest and ClearingSimulatorPactConsumerTest whenever CI=true
      # (PactConsumerTestExt auto-publishes to pactbroker.url in CI and hangs/401s — #2319), so
      # they can never run in a CI job regardless of --tests filtering; a run there fails outright
      # with "No tests found for given includes". That exclusion, and the two pacts it strands, are
      # declared in the derivation script — the SAME source the coverage check below reads, so the
      # scope and its documented exceptions cannot drift apart into two hand-kept lists.
      - name: Regenerate every consumer pact
        run: |
          set -euo pipefail
          mapfile -t GRADLE_ARGS < "${RUNNER_TEMP}/pact-gradle-args.txt"
          printf 'Regenerating with: %s\n' "${GRADLE_ARGS[*]}"
          # Marker for the coverage check below: anything under pacts/ older than this was not
          # rewritten by the run that follows.
          touch "${RUNNER_TEMP}/pact-regen-marker"
          ./gradlew --continue "${GRADLE_ARGS[@]}"

      # Belt to --rerun's braces. The diff step cannot tell "regenerated and identical" from
      # "never regenerated" — both look clean. This can: every file under pacts/ must have been
      # rewritten by the step above. It catches the UP-TO-DATE/FROM-CACHE skip if --rerun ever
      # regresses, and it is the runtime proof that the derived scope actually covered what it
      # claimed — a derivation bug would otherwise be as silent as the hand-written list was.
      - name: Verify every committed pact was actually regenerated
        run: |
          set -euo pipefail
          uncovered="$(cat "${RUNNER_TEMP}/pact-uncovered.txt")"
          stale=""
          for f in pacts/*.json; do
            if [ -n "$uncovered" ] && printf '%s\n' "$uncovered" | grep -qxF -- "$f"; then
              continue
            fi
            if [ ! "$f" -nt "${RUNNER_TEMP}/pact-regen-marker" ]; then
              stale="$stale $f"
            fi
          done
          if [ -n "$stale" ]; then
            echo "::error::These committed pacts were NOT rewritten by the regeneration step, so the drift check below would pass without having read them:"
            for f in $stale; do echo "::error::  $f"; done
            echo "::error::The derivation in .github/scripts/derive-pact-drift-scope.sh did not put this consumer's module in scope, or its test task was skipped. Run that script locally to see what it derives."
            exit 1
          fi
          echo "Coverage OK — every committed pact except the declared exclusions was regenerated by this run."

      - name: Fail on drift between regenerated and committed pacts
        run: |
          if ! git diff --exit-code -- pacts/; then
            echo "::error::Committed pacts/*.json differ from what the consumer tests generate right now."
            echo "::error::Regenerate and commit: run the *PactConsumerTest* class for the affected service and commit the updated pacts/<consumer>-<provider>.json in the same PR."
            git status --porcelain -- pacts/
            exit 1
          fi
          echo "No drift — every committed pact matches its consumer test."

      - name: Upload regenerated pacts on drift (for local diffing)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-pacts
          path: pacts/
          retention-days: 7
