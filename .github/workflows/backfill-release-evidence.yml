name: Backfill release evidence

# The released source is build input. It must not run with release-write or signing credentials.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to backfill, e.g. kyc-service-v0.4.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Build evidence for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      tag_commit: ${{ steps.map.outputs.tag_commit }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out released source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted evidence tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Resolve release component
        id: map
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9-]*-v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]] || exit 1
          comp="${TAG%-v*}"; ver="${TAG##*-v}"
          path="$(python3 -c "import json,sys; cfg=json.load(open('trusted/release-please-config.json'))['packages']; print(next((p for p,c in cfg.items() if c.get('component')==sys.argv[1]), ''))" "$comp")"
          [ -n "$path" ] && [ -d "$path" ] || { echo "::error::unknown released component"; exit 1; }
          tag_commit="$(git rev-parse HEAD)"
          [ "$(git rev-list -n 1 "$TAG")" = "$tag_commit" ] || exit 1
          printf 'comp=%s\nver=%s\npath=%s\ntag_commit=%s\n' "$comp" "$ver" "$path" "$tag_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build SBOM
        env:
          MOD: ${{ steps.map.outputs.path }}
        run: ./gradlew ":${MOD}:cyclonedxBom" --console=plain --no-daemon || true
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
      - name: Assemble unsigned evidence
        env:
          COMP: ${{ steps.map.outputs.comp }}
          VER: ${{ steps.map.outputs.ver }}
          MOD: ${{ steps.map.outputs.path }}
          TAG_COMMIT: ${{ steps.map.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          sbom_out="${TAG}.cdx.json"
          bom="${MOD}/build/reports/bom.json"
          if [ -s "$bom" ]; then
            cp "$bom" "evidence/$sbom_out"
          elif trivy fs --format cyclonedx --output "evidence/$sbom_out" "$MOD" && [ -s "evidence/$sbom_out" ]; then
            echo "::notice::generated SBOM with Trivy"
          else
            echo "::error::cannot generate SBOM"; exit 1
          fi
          GITHUB_SHA="$TAG_COMMIT" \
          WORKFLOW_REF="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/backfill-release-evidence.yml" \
          BUILD_TYPE="https://openbank.tech/backfill-release-evidence/v1" \
            bash trusted/.github/scripts/build-release-evidence.sh "$COMP" "$VER" "$TAG" "$MOD" "evidence/$sbom_out"
          mv "${TAG}.slsa.json" "${TAG}.vex.json" "${TAG}.evidence.json" evidence/
          printf '%s\n' "$TAG_COMMIT" > evidence/tag-commit.txt
          (cd evidence && sha256sum "${TAG}.cdx.json" "${TAG}.slsa.json" "${TAG}.vex.json" "${TAG}.evidence.json" tag-commit.txt > SHA256SUMS)
      - name: Upload unsigned evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-unsigned
          path: evidence/
          if-no-files-found: error
          retention-days: 1

  backfill:
    name: Sign and attach ${{ inputs.tag }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      TAG_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
    steps:
      - name: Download unsigned evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-unsigned
          path: evidence
      - name: Verify artifact and current release target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-z0-9][a-z0-9-]*-v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]] || exit 1
          cd evidence
          sha256sum -c SHA256SUMS
          [ "$(cat tag-commit.txt)" = "$TAG_COMMIT" ] || exit 1
          jq -e --arg tag "$TAG" --arg sha "$TAG_COMMIT" \
            '.tag == $tag and .git_commit == $sha and .sbom.file == ($tag + ".cdx.json")' \
            "${TAG}.evidence.json" > /dev/null
          jq -e --arg sha "$TAG_COMMIT" \
            '.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit == $sha' \
            "${TAG}.slsa.json" > /dev/null
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          [ "$actual" = "$TAG_COMMIT" ] || { echo "::error::release tag moved after evidence build"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .upload_url | sed 's/{.*//' > upload-url.txt
          [ -s upload-url.txt ] || exit 1
      - name: Configure signing identity
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::265175468565:role/openbank-arc-build-runner
          aws-region: eu-north-1
      - name: Sign and attach evidence
        shell: bash
        run: |
          set -euo pipefail
          cd evidence
          COSIGN_VERSION=v2.4.3
          COSIGN_SHA256=caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
          upload_url="$(cat upload-url.txt)"
          existing_dir="$(mktemp -d)"
          upload_or_verify() {
            local asset="$1" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Content-Type: application/octet-stream' --data-binary "@${asset}" \
              "${upload_url}?name=${asset}")"
            case "$code" in
              201) return 0 ;;
              422)
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset" --dir "$existing_dir" --clobber
                if [[ "$asset" == *.sig ]]; then
                  COSIGN_YES=true ./cosign verify-blob --key awskms:///alias/openbank-cosign-signing \
                    --signature "$existing_dir/$asset" "${asset%.sig}" > /dev/null
                else
                  cmp -s "$asset" "$existing_dir/$asset"
                fi
                ;;
              *) echo "::error::upload of $asset failed (HTTP $code)"; return 1 ;;
            esac
          }
          for suffix in cdx.json slsa.json vex.json evidence.json; do
            file="${TAG}.${suffix}"
            COSIGN_YES=true ./cosign sign-blob --key awskms:///alias/openbank-cosign-signing --output-signature "${file}.sig" "$file"
            for asset in "$file" "${file}.sig"; do
              upload_or_verify "$asset"
            done
          done
