name: Backfill release evidence

# Plan by default. Generate verifies without publication; apply consumes only a
# different successful generation and its exact immutable artifact, never rebuilds.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, generate without publication, or apply a prior verified immutable bundle
        type: choice
        default: plan
        options: [plan, generate, apply]
      tag:
        description: Exact existing canonical release tag
        required: true
        type: string
      expected_commit:
        description: Exact peeled release commit (40 lowercase hex)
        required: true
        type: string
      release_id:
        description: Exact existing GitHub release ID
        required: true
        type: string
      workflow_revision:
        description: Approved exact main workflow commit (40 lowercase hex)
        required: true
        type: string

      prior_run_id:
        description: Different successful no-apply generation run ID (apply only)
        type: string
        default: ""
      prior_attempt:
        description: Exact successful generation attempt (apply only)
        type: string
        default: ""
      verified_artifact_id:
        description: Exact prior verified bundle artifact ID (apply only)
        type: string
        default: ""
      verified_artifact_sha256:
        description: Exact approved verified archive SHA256 (apply only)
        type: string
        default: ""
      producer_revision:
        description: Exact prior generation workflow revision (apply only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-evidence-repair-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REPAIR_SIGNING_ROLE: arn:aws:iam::265175468565:role/openbank-arc-build-runner
  REPAIR_TAG: ${{ inputs.tag }}
  REPAIR_COMMIT: ${{ inputs.expected_commit }}
  REPAIR_RELEASE_ID: ${{ inputs.release_id }}
  REPAIR_WORKFLOW_REVISION: ${{ inputs.workflow_revision }}

jobs:
  plan:
    if: inputs.operation != 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - name: Validate explicit immutable plan (no build or asset upload)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/prepare-release-repair.py plan
      - name: Retain reviewable read-only plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repair-plan
          path: .repair-bundle/repair-plan.json
          if-no-files-found: error

  generate:
    needs: plan
    if: inputs.operation == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Existing KMS signing policy; no release-write permission here.
    outputs:
      subjects: ${{ steps.generate.outputs.subjects }}
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      sizes: ${{ steps.generate.outputs.sizes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.REPAIR_SIGNING_ROLE }}
          aws-region: eu-north-1   # KMS cosign key lives in eu-north-1

      - name: Generate and sign exact-source bundle (no release upload)
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/prepare-release-repair.py generate
      - name: Retain immutable generated bytes
        id: retain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repair-source
          path: .repair-bundle/*
          if-no-files-found: error

  provenance:
    name: Release repair provenance
    needs: generate
    permissions:
      actions: read
      id-token: write
      contents: write # Upstream reusable workflow declares this even with upload disabled.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.generate.outputs.subjects }}
      provenance-name: ${{ inputs.tag }}.cdx.json.intoto.jsonl
      upload-assets: false
      continue-on-error: false

  verify:
    needs: [generate, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write # Read the existing trusted KMS public key for verification.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.REPAIR_SIGNING_ROLE }}
          aws-region: eu-north-1   # KMS cosign key lives in eu-north-1

      - name: Verify exact immutable artifacts and all signatures (no release upload)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_BUNDLE_ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
          REPAIR_BUNDLE_SIZES: ${{ needs.generate.outputs.sizes }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: python3 .github/scripts/verify-release-repair.py
      - name: Retain verified bundle for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repair-verified
          path: .repair-verified/*
          if-no-files-found: error

  apply:
    if: inputs.operation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Append only after independent prior-generation verification.
      actions: read
      id-token: write # Read the existing trusted signing key for verification.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.REPAIR_SIGNING_ROLE }}
          aws-region: eu-north-1
      - name: Reverify prior immutable bundle and append missing exact assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          REPAIR_PRIOR_ATTEMPT: ${{ inputs.prior_attempt }}
          REPAIR_VERIFIED_ARTIFACT_ID: ${{ inputs.verified_artifact_id }}
          REPAIR_VERIFIED_ARTIFACT_SHA256: ${{ inputs.verified_artifact_sha256 }}
          REPAIR_PRODUCER_REVISION: ${{ inputs.producer_revision }}
        run: python3 .github/scripts/apply-release-repair.py
      - name: Retain independently read-back publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repair-published
          path: repair-published.json
          if-no-files-found: error
