# Dependency-verification metadata refresh for Dependabot PRs: the UNPRIVILEGED half.
#
# gradle/verification-metadata.xml pins a SHA-256 checksum for every resolved
# artifact, and CI enforces it, so a Dependabot bump that resolves anything new is
# red until the metadata is regenerated. Dependabot cannot do that itself.
#
# Why two workflows. This used to regenerate AND push in one pull_request job, keyed
# on a METADATA_REFRESH_PAT secret. A Dependabot-triggered run only receives
# Dependabot secrets, and that PAT existed only as an Actions secret, so every run
# took the "secret absent" branch, printed a notice and exited green. The refresh
# never ran, while the comment justifying the skip ("stale metadata only warns")
# stopped being true when verification became enforced. Moving a write credential
# into the Dependabot store would hand it to a job that runs the bump's own Gradle
# plugins. So:
#
#   this workflow  pull_request, no secrets, contents: read. Resolves the bumped graph,
#                  writes the metadata, uploads the file as an artifact. Nothing here
#                  can push.
#   dependabot-verification-metadata-push.yml
#                  workflow_run, runs from main with the GitHub App. Treats the
#                  artifact as untrusted data: accepts it only if it is purely additive
#                  against the PR head (check-verification-metadata-additive.py) and
#                  commits it through the Git Data API onto exactly the head that was
#                  resolved. It never checks out or runs PR code.
#
# Trust model is unchanged: checksums are what Maven Central / the Plugin Portal serve
# at PR time, i.e. "what Dependabot proposed". That is not a defence against a poisoned
# upstream release; human review of minors is (dependabot-auto-merge.yml).
name: Dependabot verification metadata

on:
  pull_request:
    paths:
      - "**/build.gradle.kts"
      - "**/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradle.properties"
      - "settings.gradle.kts"

permissions:
  contents: read

concurrency:
  group: dependabot-verification-metadata-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate verification metadata
    # Both the triggering actor AND the PR author must be Dependabot: a human pushing to a
    # dependabot/* branch changes github.actor, and a same-repo PR authored by anyone else
    # is excluded by the author check.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # No `cache: gradle`: this step regenerates checksums from what it resolves, so a
      # warmed cache is exactly what it must not take for granted, and the entry was 12%
      # of the repo's Actions-cache ceiling (#3299).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin

      - name: Regenerate verification metadata
        run: |
          set -euo pipefail
          # testClasses resolves the test graph, quarkusDependenciesBuild the prod runtime
          # graph and its platform BOMs (#3028), cyclonedxBom each component's .pom.
          # The default heap dies with `Java heap space` on this (#4907).
          ./gradlew --write-verification-metadata sha256 \
            testClasses quarkusDependenciesBuild cyclonedxBom \
            --no-daemon -q -Dorg.gradle.jvmargs=-Xmx8g

      - name: Stage the regenerated file
        id: stage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification metadata unchanged; nothing to hand over"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/metadata/verification-metadata.xml"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload for the privileged push
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/metadata/verification-metadata.xml
          retention-days: 3
          if-no-files-found: error
