# OPA agent-policy bundle CI (ADR-0031 D2). Runs on any change to the policy source
# or the generated artifacts: builds + validates the bundle (opa check + the decision
# assertions in build-bundle.sh) and verifies the committed OPA-bundle ConfigMaps
# (agent + the per-service sidecar bundles) are in sync with the policy source — no
# drift; the ConfigMaps AND the pod-roll checksum annotations in the service manifests
# are generated, never hand-edited. subPath mounts do not hot-reload, so a stale
# pod-roll annotation means pods silently keep serving the old policy. A broken policy
# or a stale artifact fails the gate before it can ship.
name: OPA policy

on:
  push:
    branches: [main]
    paths:
      - openbank-infra/opa/**
      - openbank-libs/governance/agents.yaml
      - openbank-libs/governance/rules.yaml
      - openbank-libs/governance/policies/**
      - openbank-infra/gitops/components/agent/gen-opa-bundle-configmap.sh
      - openbank-infra/gitops/components/agent/agent-opa-bundle.yaml
      - openbank-infra/gitops/components/pid/**
      - openbank-infra/gitops/components/copilot/**
      - openbank-infra/gitops/components/customer-edge/**
      - openbank-infra/gitops/components/notifications/**
      - .github/workflows/opa-policy.yml
  pull_request:
    paths:
      - openbank-infra/opa/**
      - openbank-libs/governance/agents.yaml
      - openbank-libs/governance/rules.yaml
      - openbank-libs/governance/policies/**
      - openbank-infra/gitops/components/agent/gen-opa-bundle-configmap.sh
      - openbank-infra/gitops/components/agent/agent-opa-bundle.yaml
      - openbank-infra/gitops/components/pid/**
      - openbank-infra/gitops/components/copilot/**
      - openbank-infra/gitops/components/customer-edge/**
      - openbank-infra/gitops/components/notifications/**
      - .github/workflows/opa-policy.yml

permissions:
  contents: read

concurrency:
  group: opa-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + verify bundle, check ConfigMap sync
    # Installs OPA to $HOME/bin itself (no sudo needed) — no self-hosted-pool dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install OPA
        run: |
          # Self-hosted runner lacks sudo — install to $HOME/bin (always writable).
          # Detect OS + arch: the runner may be macOS (darwin) or Linux.
          mkdir -p "$HOME/bin"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')   # darwin | linux
          ARCH=$(uname -m)                               # x86_64 | arm64 | aarch64
          case "${OS}_${ARCH}" in
            darwin_arm64)   SUFFIX="darwin_arm64_static" ;;
            darwin_x86_64)  SUFFIX="darwin_amd64" ;;
            linux_aarch64)  SUFFIX="linux_arm64_static" ;;
            linux_arm64)    SUFFIX="linux_arm64_static" ;;
            *)              SUFFIX="linux_amd64" ;;
          esac
          curl -fsSL -o "$HOME/bin/opa" \
            "https://openpolicyagent.org/downloads/v1.17.0/opa_${SUFFIX}"
          chmod +x "$HOME/bin/opa"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/opa" version

      - name: Build + validate the policy bundle (opa check + decision assertions)
        run: ./openbank-infra/opa/build-bundle.sh

      - name: Verify agent-opa-bundle ConfigMap is in sync with the policy source
        run: |
          cd openbank-infra/gitops/components/agent
          cp agent-opa-bundle.yaml /tmp/committed.yaml
          ./gen-opa-bundle-configmap.sh
          if ! diff -u /tmp/committed.yaml agent-opa-bundle.yaml; then
            echo "::error::agent-opa-bundle.yaml is stale — re-run gen-opa-bundle-configmap.sh and commit."
            exit 1
          fi
          echo "ConfigMap is in sync with agents.rego + agents.yaml + bundle.manifest."

      - name: Verify service OPA bundles + pod-roll annotations are in sync with the policy source
        run: |
          # Each generator writes its ConfigMap AND stamps the matching Deployment/Rollout
          # pod-template annotation (openbank.tech/policy-checksum) — the annotation is what
          # actually rolls the pods, since subPath mounts do not hot-reload. Regenerate all
          # four and fail on any diff: a stale bundle OR a stale annotation blocks the merge.
          ./openbank-infra/gitops/components/pid/gen-pid-opa-bundle.sh
          ./openbank-infra/gitops/components/copilot/gen-copilot-opa-bundle.sh
          ./openbank-infra/gitops/components/customer-edge/gen-customer-edge-opa-bundle.sh
          ./openbank-infra/gitops/components/notifications/gen-notification-opa-bundle.sh
          if ! git diff --exit-code -- \
              openbank-infra/gitops/components/pid \
              openbank-infra/gitops/components/copilot \
              openbank-infra/gitops/components/customer-edge \
              openbank-infra/gitops/components/notifications; then
            echo "::error::A service OPA bundle ConfigMap or its pod-roll checksum annotation is stale — re-run the gen-*-opa-bundle.sh generators and commit the result."
            exit 1
          fi
          echo "All service OPA bundles + pod-roll annotations are in sync with the policy source."
