# OPA agent-policy bundle CI (ADR-0031 D2). Runs on any change to the policy source
# or the generated artifacts: builds + validates the bundle (opa check + the decision
# assertions in build-bundle.sh) and verifies the committed OPA-bundle ConfigMaps
# (agent + the per-service sidecar bundles) are in sync with the policy source — no
# drift; the ConfigMaps AND the pod-roll checksum annotations in the service manifests
# are generated, never hand-edited. subPath mounts do not hot-reload, so a stale
# pod-roll annotation means pods silently keep serving the old policy. A broken policy
# or a stale artifact fails the gate before it can ship.
#
# Required-status-check shape (issue #799): the workflow itself is deliberately NOT
# path-scoped at the `on:` level anymore — a required status check that never gets
# reported (because the workflow didn't trigger) leaves the PR stuck on "Expected",
# blocking merge for every PR that doesn't touch a policy path. Instead, the `changes`
# job (always runs) computes path-relevance and the heavy `verify` job stays
# job-level path-scoped via `if:`. The always-run `gate` job aggregates the result —
# same pattern as `ui` in ci.yml and `all-green` in services-ci.yml — and is the one
# context branch protection should require.
name: OPA policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # On a push to main, github.ref is always refs/heads/main regardless of commit, so a
  # ref-keyed group made every new commit cancel the previous commit's run. Bot commits
  # (auto-deploy pin bumps, release-please) land every few minutes, so a main run rarely
  # survived to completion — 9 of 11 CI runs and 9 of 11 Security runs were cancelled on
  # 2026-08-02 (issue #3390). Give each main commit its own lane and never cancel it;
  # PR pushes keep the superseding behaviour, which is what that setting is for.
  # The key stays O(1) — a sha, never a list: interpolating a fleet-sized value here
  # stops the job being created at all (#3082).
  group: opa-policy-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    name: Detect policy changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          # Mirrors the `paths:` list the workflow used to be gated on at the trigger
          # level (kept as one source of truth here, in the job that now owns it).
          PATTERN='^openbank-infra/opa/'
          PATTERN="${PATTERN}|^openbank-libs/governance/agents\.yaml$"
          PATTERN="${PATTERN}|^openbank-libs/governance/rules\.yaml$"
          PATTERN="${PATTERN}|^openbank-libs/governance/rules-opa-data\.yaml$"
          PATTERN="${PATTERN}|^openbank-libs/governance/policies/"
          PATTERN="${PATTERN}|^openbank-libs/governance/agents-opa-data\.yaml$"
          PATTERN="${PATTERN}|^openbank-libs/governance/case-collaboration-opa-data\.yaml$"
          PATTERN="${PATTERN}|^\.github/scripts/gen-rules-opa-data\.py$"
          PATTERN="${PATTERN}|^\.github/scripts/gen-agents-opa-data\.py$"
          PATTERN="${PATTERN}|^\.github/scripts/gen-case-collaboration-opa-data\.py$"
          PATTERN="${PATTERN}|^\.github/workflows/opa-policy\.yml$"

          # Every component directory that owns a bundle generator — discovered, never
          # hard-coded (issue #1184). The old list named only agent/pid/copilot/
          # customer-edge/notifications, so a hand-edit to any other service's committed
          # bundle or pod-roll annotation did not even mark the PR policy-relevant, and
          # `verify` never ran to catch it.
          while IFS= read -r dir; do
            PATTERN="${PATTERN}|^${dir//./\\.}/"
          done < <(find openbank-infra/gitops/components -name 'gen-*opa-bundle*.sh' -exec dirname {} \; | sort -u)

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Event push -> always verify (post-merge; keeps the deployed-bundle check current)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            BASE="origin/${{ github.base_ref }}"
            # Persistent self-hosted runners reuse the workdir, so the remote-tracking
            # ref can be stale -- force it to the true tip, then diff from the
            # merge-base rather than the PR's creation-time base.sha (which goes stale
            # the moment a competing PR merges first -- see ci.yml's "resolve PR diff
            # base" comment for the incident this same fix guards against there).
            git fetch --no-tags --force origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
              >/dev/null 2>&1 || true
            MB=$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")
            FILES=$(git diff --name-only "$MB" HEAD)
            printf 'Changed files:\n  %s\n' "${FILES//$'\n'/$'\n  '}"
            # Here-string, not `echo "$FILES" | grep -q`: under `set -o pipefail` a
            # short-circuiting `grep -q` SIGPIPEs the upstream `echo`, and the
            # pipeline's exit code becomes racy (documented in services-ci.yml).
            if grep -qE "$PATTERN" <<< "$FILES"; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
            else
              echo "relevant=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  verify:
    name: build + verify bundle, check ConfigMap sync
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Installs OPA to $HOME/bin itself (no sudo needed) — no self-hosted-pool dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OPA
        run: |
          # Self-hosted runner lacks sudo — install to $HOME/bin (always writable).
          # Detect OS + arch: the runner may be macOS (darwin) or Linux.
          mkdir -p "$HOME/bin"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')   # darwin | linux
          ARCH=$(uname -m)                               # x86_64 | arm64 | aarch64
          # Verify the download against the per-platform sha256 published alongside the
          # release (opa_<suffix>.sha256): this binary is CI's policy authority — an
          # unverified download could rubber-stamp any bundle. Bump the checksums together
          # with the version (same standard as the oasdiff + pyyaml pins in ci.yml).
          case "${OS}_${ARCH}" in
            darwin_arm64)   SUFFIX="darwin_arm64_static"; OPA_SHA256="7d7debaf10bba97d32b7e67b7f8ce128c92e911b82e3c6cec24b95c34f8a5003" ;;
            darwin_x86_64)  SUFFIX="darwin_amd64";        OPA_SHA256="088f6c9d8c7b0e2ee0bee450cba7599953e3167649f3623019bada67a26229a4" ;;
            linux_aarch64)  SUFFIX="linux_arm64_static";  OPA_SHA256="9d8d4d18e4240e61d6259381066080420441a498f559bcb3a24f7561f76e25eb" ;;
            linux_arm64)    SUFFIX="linux_arm64_static";  OPA_SHA256="9d8d4d18e4240e61d6259381066080420441a498f559bcb3a24f7561f76e25eb" ;;
            *)              SUFFIX="linux_amd64";         OPA_SHA256="5485f9c32548af84bc0bfa06a7f40a98ecc742477a7f9f24ea3556d221dc295f" ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$HOME/bin/opa" \
            "https://openpolicyagent.org/downloads/v1.17.0/opa_${SUFFIX}"
          # sha256sum on Linux; macOS (self-hosted) ships shasum instead.
          SHATOOL="sha256sum"; command -v sha256sum >/dev/null 2>&1 || SHATOOL="shasum -a 256"
          echo "${OPA_SHA256}  $HOME/bin/opa" | ${SHATOOL} -c - \
            || { echo "::error::OPA v1.17.0 download failed checksum verification"; exit 1; }
          chmod +x "$HOME/bin/opa"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/opa" version

      - name: Build + validate the policy bundle (opa check + decision assertions)
        run: ./openbank-infra/opa/build-bundle.sh

      - name: Run per-service rest_ext unit tests
        run: |
          # Every *_rest_ext_test.rego runs as its own trio (shared rest.rego + its ext + the
          # test): all exts extend package openbank.rest, so one invocation would
          # cross-contaminate allowed_reasons (issue #1797 follow-up 2). These tests previously
          # ran only by hand — a suite that never runs in CI is vacuous. Discovered, never
          # hard-coded, and zero discoveries fails closed.
          TESTS=()
          while IFS= read -r t; do
            TESTS+=("$t")
          done < <(find openbank-infra/gitops/components -name '*_rest_ext_test.rego' | sort)
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "::error::No rest_ext test files discovered — the find pattern is wrong, not the repo. Refusing to pass a check that verifies nothing."
            exit 1
          fi
          FAILED=0
          for t in "${TESTS[@]}"; do
            ext="${t%_test.rego}.rego"
            echo "--- $t"
            opa test openbank-libs/governance/policies/rest.rego "$ext" "$t" || FAILED=1
          done
          [ "$FAILED" -eq 0 ] || { echo "::error::One or more rest_ext suites failed."; exit 1; }
          echo "All ${#TESTS[@]} rest_ext suites green."

      - name: Verify agent-opa-bundle ConfigMap is in sync with the policy source
        run: |
          cd openbank-infra/gitops/components/agent
          cp agent-opa-bundle.yaml /tmp/committed.yaml
          ./gen-opa-bundle-configmap.sh
          if ! diff -u /tmp/committed.yaml agent-opa-bundle.yaml; then
            echo "::error::agent-opa-bundle.yaml is stale — re-run gen-opa-bundle-configmap.sh and commit."
            exit 1
          fi
          echo "ConfigMap is in sync with agents.rego + agents.yaml + bundle.manifest."

      - name: Verify the derived OPA policy-input subset of agents.yaml is in sync
        run: |
          # openbank-libs/governance/agents-opa-data.yaml is what the bundles embed — the
          # paths of agents.yaml a .rego actually reads under data.agents.*, with each
          # charter projected to the fields an iteration variable dereferences (#3927).
          # Same ordering rule as rules-opa-data.yaml below: it must be regenerated BEFORE
          # the bundle generators, or they hash a stale input and the diff check passes
          # about the wrong thing.
          #
          # --self-test first, and it is not decoration: it feeds the generator a
          # projection that drops `skills` and `tools.allow` and requires the differential
          # proof to REJECT it. A gate that has only ever passed is unfalsified, and this
          # one's failure mode (a silently narrower charter document) is invisible from
          # every other angle — `data.agents.<missing>` is undefined in Rego, not an error.
          bash .github/scripts/install-pyyaml-hash-pinned.sh
          python3 .github/scripts/gen-agents-opa-data.py --self-test
          python3 .github/scripts/gen-agents-opa-data.py --check

      - name: Verify the derived OPA policy-input subset of rules.yaml is in sync
        run: |
          # openbank-libs/governance/rules-opa-data.yaml is what the bundles embed — the
          # top-level keys of rules.yaml that a .rego actually reads as data.rules.<key>,
          # extracted verbatim. It must be regenerated BEFORE the bundle generators run
          # below, or they would hash a stale input and the diff check would pass about
          # the wrong thing. The key set is derived from the .rego sources, so adding
          # data.rules.<new> to a policy fails here until the subset is regenerated.
          bash .github/scripts/install-pyyaml-hash-pinned.sh
          python3 .github/scripts/gen-rules-opa-data.py --check

      - name: Verify case-coordinator collaboration policy data is isolated and in sync
        run: |
          # This projection is intentionally separate from agents-opa-data/rules-opa-data:
          # changing case collaboration must roll only case-coordinator, not every service
          # that embeds the shared MCP/REST policy bundle (ADR-0271 D8).
          python3 .github/scripts/gen-case-collaboration-opa-data.py --self-test
          python3 .github/scripts/gen-case-collaboration-opa-data.py --check

      - name: Verify service OPA bundles + pod-roll annotations are in sync with the policy source
        run: |
          # Each generator writes its ConfigMap AND stamps the matching Deployment/Rollout
          # pod-template annotation (openbank.tech/policy-checksum) — the annotation is what
          # actually rolls the pods, since subPath mounts do not hot-reload. Regenerate every
          # generator and fail on any diff: a stale bundle OR a stale annotation blocks the merge.
          #
          # Discovered, never hard-coded (issue #1184). This step used to name four generators
          # while 25 of the 26 hash rules.yaml as a checksum input, so any shared-policy edit
          # left ~21 services' committed bundles and pod-roll annotations stale with no CI
          # signal. A hard-coded list opts every new service out of this gate by default.
          # while-read, not `mapfile`: this job's Install OPA step still supports a darwin
          # runner, and macOS ships bash 3.2 where mapfile does not exist (it would fail
          # "command not found" and leave GENERATORS empty).
          GENERATORS=()
          while IFS= read -r g; do
            GENERATORS+=("$g")
          done < <(find openbank-infra/gitops/components -name 'gen-*opa-bundle*.sh' | sort)

          if [ "${#GENERATORS[@]}" -eq 0 ]; then
            echo "::error::No OPA bundle generators discovered — the find pattern is wrong, not the repo. Refusing to pass a check that verifies nothing."
            exit 1
          fi

          echo "Discovered ${#GENERATORS[@]} bundle generators:"
          printf '  %s\n' "${GENERATORS[@]}"

          # A non-executable generator silently no-ops a `./…` loop, which would look
          # identical to "in sync". gen-ledger-opa-bundle.sh shipped 100644 for exactly this
          # reason and had never run. Fail loudly instead.
          NON_EXEC=0
          for g in "${GENERATORS[@]}"; do
            if [ ! -x "$g" ]; then
              echo "::error file=${g}::${g} is not executable — commit it mode 100755 (git update-index --chmod=+x)."
              NON_EXEC=1
            fi
          done
          [ "$NON_EXEC" -eq 0 ] || exit 1

          for g in "${GENERATORS[@]}"; do
            echo "--- $g"
            "$g" >/dev/null
          done

          if ! git diff --exit-code -- openbank-infra/gitops/components; then
            echo "::error::A service OPA bundle ConfigMap or its pod-roll checksum annotation is stale — re-run the gen-*opa-bundle*.sh generators shown above and commit the result."
            exit 1
          fi
          echo "All ${#GENERATORS[@]} service OPA bundles + pod-roll annotations are in sync with the policy source."

  # Gate job — always runs, maps to the required check name (issue #799). Passes
  # when verify succeeded OR was skipped (no policy-relevant changes in this PR);
  # fails only when verify itself failed. Same pattern as `ui` (ci.yml) / `all-green`
  # (services-ci.yml), so a PR that never touches OPA policy is never blocked on an
  # "Expected" status that will never report.
  gate:
    name: OPA policy gate
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check verify result
        run: |
          result="${{ needs.verify.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "OPA policy verify failed (result: $result)." && exit 1
          fi
          echo "OPA policy gate: $result (skipped = no policy-relevant changes in this PR)."
