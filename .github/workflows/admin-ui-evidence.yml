# SPDX-License-Identifier: Apache-2.0
name: Admin UI evidence

on:
  # Rebuild evidence after the source's CI producers complete. This avoids holding a
  # runner while the main CI producers are still running.
  workflow_run:
    branches: [main]
    workflows: ["CI", "Services CI", "Security KPI snapshot"]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to refresh (all runs each independent publisher)"
        type: choice
        options: [all, gate-health, readiness, test-intelligence, security-kpis, content]
        required: true
        default: all
      rollback_snapshot:
        description: "Optional snapshots/<run>-<attempt>-<sha256>.json key for the selected dataset"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  authorize-source:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.name != 'Security KPI snapshot' || github.event.workflow_run.path == '.github/workflows/security-kpis.yml')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      datasets: ${{ steps.source.outputs.datasets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the trusted source commit
        id: source
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_PATH: ${{ github.event.workflow_run.path }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK_SNAPSHOT: ${{ inputs.rollback_snapshot }}
          SELECTED_DATASET: ${{ inputs.dataset }}
        run: |
          set -euo pipefail
          source_sha="$EVENT_SHA"
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$WORKFLOW_RUN_NAME" = 'Security KPI snapshot' ]; then
              if [ "$WORKFLOW_RUN_PATH" != '.github/workflows/security-kpis.yml' ]; then
                echo '::error::Unexpected Security KPI workflow path.'
                exit 1
              fi
            else
              source_sha="$WORKFLOW_RUN_SHA"
            fi
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Evidence source must be a full commit SHA.'
            exit 1
          fi
          if [ -n "$ROLLBACK_SNAPSHOT" ] && [ "$SELECTED_DATASET" = all ]; then
            echo '::error::A rollback must select exactly one dataset.'
            exit 1
          fi
          datasets="$(python3 .github/scripts/select_admin_ui_evidence_datasets.py \
            --event "$EVENT_NAME" \
            --workflow-name "$WORKFLOW_RUN_NAME" \
            --dataset "$SELECTED_DATASET")"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "datasets=$datasets" >> "$GITHUB_OUTPUT"

  publish:
    needs: authorize-source
    if: needs.authorize-source.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.authorize-source.outputs.datasets) }}
    # Each dataset has an independent current pointer. Serialize only writers for
    # the same pointer; never cancel an in-flight immutable snapshot/pointer update.
    concurrency:
      group: admin-ui-evidence-${{ matrix.dataset }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EVIDENCE_BUCKET: ${{ vars.ADMIN_UI_EVIDENCE_BUCKET }}
      EVIDENCE_ROLE: ${{ vars.ADMIN_UI_EVIDENCE_WRITER_ROLE_ARN }}
      EVIDENCE_REGION: ${{ vars.ADMIN_UI_EVIDENCE_REGION }}
      EVIDENCE_SOURCE_SHA: ${{ needs.authorize-source.outputs.sha }}
      EVIDENCE_CODE_SHA: ${{ needs.authorize-source.outputs.sha }}
      DATASET: ${{ matrix.dataset }}
      ROLLBACK_SNAPSHOT: ${{ inputs.rollback_snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Require provisioned evidence destination
        run: |
          test -n "$EVIDENCE_BUCKET" && test -n "$EVIDENCE_ROLE" && test -n "$EVIDENCE_REGION" || {
            echo '::error::Configure ADMIN_UI_EVIDENCE_BUCKET, ADMIN_UI_EVIDENCE_WRITER_ROLE_ARN and ADMIN_UI_EVIDENCE_REGION after reviewed infrastructure provisioning.'
            exit 1
          }
      - name: Install locked source collector dependencies
        if: matrix.dataset == 'test-intelligence' || matrix.dataset == 'content'
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: openbank-admin-ui
      - name: Test the closed evidence dataset registry
        if: matrix.dataset == 'content'
        run: node --test .github/scripts/test-publish-admin-ui-evidence.mjs openbank-admin-ui/scripts/collect-admin-ui-content.test.mjs
      - name: Collect selected dataset
        if: env.ROLLBACK_SNAPSHOT == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$DATASET" in
            gate-health)
              node openbank-admin-ui/scripts/collect-gate-health.mjs --runs 20 --gate-detail-runs 1 --out "$RUNNER_TEMP/gate-health.json"
              echo "EVIDENCE_FILE=$RUNNER_TEMP/gate-health.json" >> "$GITHUB_ENV"
              ;;
            readiness)
              python3 openbank-infra/scripts/prod-readiness-collector.py --all --json "$RUNNER_TEMP/readiness.json" --source-sha "$EVIDENCE_SOURCE_SHA"
              echo "EVIDENCE_FILE=$RUNNER_TEMP/readiness.json" >> "$GITHUB_ENV"
              ;;
            test-intelligence)
              python3 .github/scripts/collect-admin-ui-test-evidence.py --repo-root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/test-intelligence.json"
              echo "EVIDENCE_FILE=$RUNNER_TEMP/test-intelligence.json" >> "$GITHUB_ENV"
              ;;
            security-kpis)
              python3 .github/scripts/collect-admin-ui-security-kpis.py \
                --out "$RUNNER_TEMP/security-kpis.json" \
                --metadata-out "$RUNNER_TEMP/security-kpis-provenance.json"
              jq -r '"EVIDENCE_SOURCE_SHA=" + .sourceSha' "$RUNNER_TEMP/security-kpis-provenance.json" >> "$GITHUB_ENV"
              echo "EVIDENCE_FILE=$RUNNER_TEMP/security-kpis.json" >> "$GITHUB_ENV"
              ;;
            content)
              node openbank-admin-ui/scripts/collect-admin-ui-content.mjs \
                --source-sha "$EVIDENCE_SOURCE_SHA" \
                --out "$RUNNER_TEMP/admin-ui-content.json"
              echo "EVIDENCE_FILE=$RUNNER_TEMP/admin-ui-content.json" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported evidence dataset: $DATASET"
              exit 1
              ;;
          esac
      - name: Recheck source is still current main before obtaining publisher credentials
        id: source
        run: |
          set -euo pipefail
          latest_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest_main" = "$EVIDENCE_CODE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Evidence source was superseded while collectors ran; skipping publication.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Assume evidence-only publisher role
        if: steps.source.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.EVIDENCE_ROLE }}
          aws-region: ${{ env.EVIDENCE_REGION }}
      - name: Publish selected validated snapshot and atomic selector
        if: steps.source.outputs.current == 'true'
        run: |
          set -euo pipefail
          if [ -n "$ROLLBACK_SNAPSHOT" ]; then
            node .github/scripts/publish-admin-ui-evidence.mjs --dataset "$DATASET" --bucket "$EVIDENCE_BUCKET" --rollback "$ROLLBACK_SNAPSHOT"
          else
            node .github/scripts/publish-admin-ui-evidence.mjs --dataset "$DATASET" --bucket "$EVIDENCE_BUCKET" --file "$EVIDENCE_FILE"
          fi
