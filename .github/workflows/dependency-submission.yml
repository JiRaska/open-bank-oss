#
# Submits the fleet's resolved Gradle/Maven dependency graph to GitHub.
#
# THE GAP THIS CLOSES: `gh api repos/.../dependency-graph/sbom` shows ~1100 packages, but
# only ~2 are Maven/Gradle coordinates — every openbank-*-service's Kotlin/Java dependency
# tree is effectively invisible to GitHub's dependency graph, because nothing in this repo
# ever submits it (npm/pip manifests are parsed natively by GitHub; Gradle needs an explicit
# submission step). Consequence: Dependabot security alerts report 0 open findings while
# Scorecard's own OSV-scanner (which reads build.gradle.kts / libs.versions.toml directly,
# independent of GitHub's graph) reports dozens of GHSA IDs with no per-package, per-fix-version
# context — the worst of both worlds (silent Dependabot, noisy unopinionated Scorecard).
#
# This wires `gradle/actions/setup-gradle`'s built-in dependency-graph extractor so the graph
# gets submitted from a real build on every main push. Once populated, Dependabot
# alerts become the authoritative, actionable, per-service view (exact vulnerable version +
# suggested fix), and Scorecard's Vulnerabilities check should stop flying blind.
name: Dependency submission

on:
  # DELIBERATELY UNFILTERED (issue #2833). This trigger used to carry the same
  # manifest `paths:` filter as the pull_request one below. That filter is correct for
  # a PR head and wrong for a main commit, because dependency-review looks snapshots up
  # by EXACT SHA and the two sides are selected by different rules: a PR only reaches
  # the gate with a manifest change (so its head is always snapshot-bearing), but its
  # `pull_request.base.sha` is an arbitrary main commit. Measured 2026-07-31: 1 of the
  # last 50 main commits touched any filtered path, so ~98% of base SHAs could never
  # have a snapshot, and dependency-review silently fell back to diffing the ENTIRE head
  # graph as additions — 1235 packages, 30 of them carrying advisories, none of which
  # the PR introduced. That is how the netty/protobuf entries in dependency-review.yml's
  # allow-ghsas were accreted: pre-existing findings surfaced as if new, each silenced by
  # a permanent fleet-wide suppression.
  #
  # The cost of dropping the filter is a ~11 min run on every main push, which is $0 —
  # public repo, hosted runners, free and unlimited. Do not "optimize" it back: a
  # docs-only main commit produces a graph identical to its parent's, but exact-SHA
  # lookup means an identical graph and a MISSING graph are not the same thing.
  push:
    branches: [main]
  # PRs too, so dependency-review.yml has a head-SHA graph to diff against main's
  # (issue #1419): without a per-PR submission the Gradle graph is main-only, and
  # dependency-review — which only ever compares submitted graphs — silently had
  # nothing to say about the fleet's primary language. This is the integration
  # documented by gradle/actions in its own docs/dependency-submission.md — a file in
  # THAT repository, not this one.
  # stale-ref-ok: the path above is gradle/actions', not a path in this tree.
  # The path filter is
  # kept HERE and only here: a PR that changes no manifest cannot change resolution, so
  # its head needs no snapshot of its own — the gate has nothing to diff either way.
  pull_request:
    branches: [main]
    paths:
      - "**/build.gradle.kts"
      - "openbank-libs/gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "gradle/wrapper/**"
  schedule:
    # Weekly belt-and-braces resubmission — dependency resolution can drift even without a
    # manifest change (a transitive version moving inside a declared range).
    - cron: "30 4 * * 1" # 04:30 UTC Monday
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed per-SHA on push, per-ref everywhere else — and push runs are never cancelled.
#
# This is load-bearing for the unfiltered push trigger above, not a style preference.
# The old rule grouped every main push under `refs/heads/main` with
# `cancel-in-progress: true`, so a second merge killed the first merge's submission.
# Measured 2026-07-31: 70 of the last 80 main commits landed within 11 minutes of the
# previous one (tightest gaps: 2 seconds), i.e. under the old rule dropping the paths
# filter would still have produced a snapshot for roughly 9 commits in 80 — the fix
# would have looked applied while leaving the gap almost entirely open.
#
# Cancelling is still right for a PR: only the head SHA is ever compared, so a
# superseded push has nothing to contribute. On main every commit is a potential
# `pull_request.base.sha` for some future PR, so every one has to finish.
#
# Cost: a merge burst (a release-please batch drain) starts one ~11 min job per commit
# in parallel. $0 on hosted runners for a public repo; the exposure is queue depth, and
# a queued snapshot arriving late still beats a cancelled one never arriving.
concurrency:
  group: dependency-submission-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  submit:
    name: Submit fleet dependency graph
    runs-on: ubuntu-latest # public repo => hosted runners free+unlimited (FinOps: hosted-first)
    # Skip on fork PRs: GitHub hands them a read-only token no matter what the block
    # below asks for, so the submission API call would fail — a guaranteed red check
    # on every external contribution. Consequence: a fork PR gets dependency review
    # for the natively-parsed ecosystems (npm/pip/actions/docker) but NOT for Gradle.
    # Accepted deliberately: closing it needs the generate-and-upload + workflow_run
    # download-and-submit split, and a `workflow_run` job holding `contents: write`
    # while consuming a fork-authored artifact is the first such pattern in this repo —
    # not worth introducing for a repo whose changes all land from same-repo branches.
    # Revisit if external contributions become routine (tracked in #1419).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
    permissions:
      contents: write # required by the dependency-submission API
    env:
      # Same OOM guard as fleet-lint.yml / security.yml CodeQL job: a full-fleet dependency
      # resolution (~30 modules + the quarkus-bom) needs more than Gradle's 3 GiB default heap.
      # 4g stopped being enough as the fleet grew: every run since 2026-07-14 failed with
      # "Java heap space" (`assemble testClasses` OOMs before the graph is written), so the
      # dependency graph GitHub uses for Dependabot alerts/SBOM has been silently stale since
      # then — no graph file to submit, but the job still exits without visibly failing that
      # step (issue #909's residual-alert investigation traced back here). security.yml's
      # CodeQL java-kotlin leg resolves the same whole-fleet graph on the same ubuntu-latest
      # runner at -Xmx6g without OOMing — match that proven headroom here.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # NEVER write the Actions cache from this job — restore only, on every ref
          # including main (#3299).
          #
          # The repo's Actions cache runs permanently over its 10 GB ceiling (measured
          # 2026-08-02: 11.7 GB / 92 entries), so GitHub evicts LRU continuously. Measured
          # over 16 cache-writing job-runs, exactly two jobs write on main — `fleet-lint`
          # and this one, 8 runs each — and each writing run pushes a fresh
          # `gradle-build-cache-v1` entry (~200 MB) plus, whenever the fleet's dependency
          # set shifts by even one artifact, a whole new ~700-850 MB
          # `gradle-dependencies-v1` entry. That is why 9 near-identical dependency entries
          # (6.1 GB, 60% of the pool) coexist: the entry is content-addressed over the
          # entire `modules-2` tree, so two jobs resolving almost-the-same set still store
          # it twice.
          #
          # This is the fix `setup-gradle`'s own docs prescribe for exactly this shape
          # ("Select which jobs should write to the cache"): elect ONE writer per
          # OS+architecture and make every other job a consumer. `fleet-lint` is that writer
          # on Linux-X64 — it runs `testClasses detekt ktlintCheck` fleet-wide on every main
          # push, so its Gradle home is a near-superset of what this job needs, and
          # `gradle-home-cache-strict-match` defaults to false, so this job still RESTORES
          # from it across job boundaries.
          #
          # Why THIS job is the right one to demote rather than fleet-lint or CodeQL:
          # it is the only fleet-wide Gradle job nobody waits on. It is not a required
          # check, it is push/schedule-triggered, and it currently runs 4.8-8.5 min against
          # a 30 min timeout. The cost of a colder cache here is re-downloading the
          # runtime-only artifacts `assemble` pulls beyond fleet-lint's `testClasses` set —
          # minutes, inside that headroom. fleet-lint is a required check, and CodeQL's
          # java-kotlin leg documents a 25-30 min cold penalty and is the most
          # preemption-exposed job in the fleet; demoting either would trade a real, felt
          # regression for the same headroom.
          #
          # Read-only does NOT affect the submitted graph: `generate-and-submit` resolves
          # the fleet regardless of cache state, so the #1449 stale-graph alarm below is
          # unaffected.
          cache-read-only: true
          dependency-graph: generate-and-submit
          # COUPLING: setup-gradle injects its own
          # org.gradle:github-dependency-graph-gradle-plugin:<version> onto the buildscript
          # classpath, and Gradle dependency verification checks it against
          # gradle/verification-metadata.xml. A setup-gradle bump that raises the plugin
          # version (v6 line moved 1.4.1 -> 1.4.2) fails this job with "Dependency
          # verification failed for configuration 'classpath'" until the matching
          # <component> entry is added to verification-metadata.xml — the version is not
          # declared anywhere in this repo, so the metadata entry IS the pin record.
          # Keep detached and buildscript configurations OUT of the submitted graph (#2833).
          #
          # `configurations.all { resolutionStrategy { force(...) } }` — how
          # openbank.dependency-vulnerability-pins applies the fleet-wide patch floors — does
          # NOT reach configurations created via `detachedConfiguration(...)`. Those therefore
          # resolve their own, older versions of the same modules, and every one of them lands
          # in the submitted graph as a distinct coordinate that no service can ever load.
          #
          # Measured 2026-07-31 with the extractor's own `resolvedBy` report
          # (`:ForceDependencyResolutionPlugin_resolveAllDependencies` + SimpleDependencyGraphPlugin):
          #
          #   io.netty:netty-codec-http:4.1.110  resolvedBy=1     path=:  detachedConfiguration11
          #   io.netty:netty-codec-http:4.1.119  resolvedBy=1     path=:  detachedConfiguration11
          #   io.netty:netty-codec-http:4.1.133  resolvedBy=1     path=:  detachedConfiguration11
          #   io.netty:netty-codec-http:4.1.136  resolvedBy=1147  compile/runtimeClasspath × 56 projects
          #
          # 105 of 1389 resolved coordinates came exclusively from a detached configuration
          # (104 from `detachedConfiguration11` alone), and they carried 24 of the 30
          # vulnerability findings. `classpath` — the root project's BUILDSCRIPT classpath —
          # accounted for 3 more. Filtering both takes the gate from 30 findings to 3, all
          # `moderate`, i.e. below `fail-on-severity: high`.
          #
          # This does NOT narrow test coverage: testCompileClasspath, testRuntimeClasspath and
          # integrationTest* are all still submitted. The surviving
          # hibernate-reactive-core:3.4.2 finding is reported partly BECAUSE of its
          # integration-test classpaths — that is the check that this filter is not too broad.
          #
          # Excluding `classpath` IS a deliberate scope reduction, unlike the detached case: a
          # vulnerable build plugin never ships but does run on CI runners. Accepted because
          # the buildscript graph is not what `block_on_cve_severity` is about; revisit if
          # build-time supply-chain becomes an explicit goal.
          #
          # The regex is name-shaped, not identity-shaped, on purpose: Gradle renumbers
          # `detachedConfiguration<N>` freely between builds and versions, so pinning to
          # `detachedConfiguration11` would silently stop matching.
          dependency-graph-exclude-configurations: '^(detachedConfiguration.*|classpath)$'

      # assemble resolves runtimeClasspath (what actually ships); testClasses additionally
      # resolves testCompileClasspath/testRuntimeClasspath — together the full graph the
      # fleet depends on. No tests executed, so no Docker/Testcontainers needed.
      # --continue: one module failing to resolve shouldn't blank out the graph for the rest.
      - name: Resolve fleet dependency graph
        run: .github/scripts/gradle-heap-headroom.sh dependency-submission -- ./gradlew assemble testClasses --continue --no-daemon

  # ── The alarm (issue #1449) ───────────────────────────────────────────────────
  # Why this exists: from 2026-07-14 to 2026-07-17 EVERY run of the job above died
  # with `Java heap space` and the fleet's dependency graph silently stopped updating
  # for three days. Nothing was broken about the signal — each run went red — but a
  # push-triggered workflow's red status on main is addressed to nobody, so no one
  # looked. Dependabot alerts and (since #1421) the PR-time Gradle dependency gate both
  # read that graph, and a stale graph makes the gate green without checking anything.
  #
  # The heap is a RATCHET with nothing measuring it: 4g was fine until the fleet grew
  # past it, and 6g will go the same way. This job cannot prevent that — it makes the
  # next occurrence arrive as an addressed issue instead of three quiet days.
  #
  # Not gated on `schedule` (unlike fleet-attestation's equivalent): the OOM ran red on
  # main PUSHES, and the schedule is only weekly, so a schedule-only alarm would have
  # waited up to 7 days to say anything. pull_request IS excluded — a PR-run failure is
  # already visible on the PR, and filing a repo issue for it would be noise.
  raise-issue:
    name: Raise issue on submission failure
    needs: submit
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5  # API calls only
    permissions:
      contents: read
      issues: write
    # This job has no actions/checkout, so `gh` has nothing to infer the target repo from
    # and every subcommand dies with `failed to determine base repo: fatal: not a git
    # repository`. Set it explicitly (same fix, same reason as record-deployment-on-merge.yml).
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TITLE="Dependency graph submission is failing — the Gradle vulnerability gate is running blind"
          # Heredoc body is deliberately flush-left: `run: |` strips only the common YAML
          # indent, so an indented body would carry leading spaces into the issue markdown.
          # Body via a plain redirect + --body-file, NOT `BODY=$(cat <<EOF ...)`. A heredoc
          # nested inside $( ) mis-parses an apostrophe as an opening quote on bash 3.2
          # (still the default /bin/bash on macOS), so this step could not be dry-run
          # locally in that form. CI runs bash 5 where it would have parsed, but a step
          # that only its own CI can syntax-check is a step nobody tests before pushing.
          # fleet-attestation.yml's equivalent survives that shape only because its body
          # happens to contain no apostrophe.
          cat > "${RUNNER_TEMP:-/tmp}/issue-body.md" <<EOF
          \`dependency-submission.yml\` FAILED (trigger: \`${EVENT}\`), so the fleet's Gradle
          dependency graph did not update.

          **This is latent, not cosmetic.** Two things read that graph and neither goes red
          when it is stale:

          - **Dependabot security alerts** stop reflecting reality — no new alerts for the
            Kotlin/Java fleet, which reads exactly like "no vulnerabilities".
          - **The PR-time Gradle dependency gate** (\`dependency-review\`, #1419) diffs the PR
            against this graph. A stale base makes the gate **pass without checking anything**.

          Run: ${RUN_URL}

          **Check the heap first.** The 2026-07-14..07-17 outage was \`Java heap space\` in
          \`Resolve fleet dependency graph\`: \`-Xmx4g\` stopped fitting as the fleet grew, every
          run died for three days, and nobody noticed because a red push-triggered workflow on
          main is addressed to nobody. It is now \`-Xmx6g\`; that is a ratchet, not a fix. If the
          log says \`Java heap space\`, raise \`GRADLE_OPTS\` in this workflow and match the
          headroom \`security.yml\`'s CodeQL java-kotlin leg already proves on the same runner.

          Note \`dependency-graph-continue-on-failure: true\` (setup-gradle's default): graph
          submission is NOT gated on the resolve succeeding, so a partial graph may have been
          submitted rather than none. Do not assume the previous good graph is still intact.

          This issue is refreshed on each further failure; close it once a run is green.
          EOF
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "${RUNNER_TEMP:-/tmp}/issue-body.md"
          else
            gh issue create --title "$TITLE" --body-file "${RUNNER_TEMP:-/tmp}/issue-body.md" \
              --label tech-debt --label "severity:high"
          fi
