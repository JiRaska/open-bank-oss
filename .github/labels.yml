#
# OpenBank issue/PR labels — the single source of truth (governance-as-code, ADR-0029).
# Edited here, applied by .github/workflows/labels.yml. Do NOT create labels in the GitHub
# UI: a hand-made label rots the same way a hand-edited catalog does (CLAUDE.md rule #7).
#
# Sync is ADDITIVE and idempotent: the workflow creates-or-updates every label below and
# NEVER deletes. Removing a label from an issue's history is destructive, so pruning is a
# deliberate manual act, not an automated side effect. Labels applied by dependabot
# (java, javascript, docker, github-actions) are intentionally NOT listed here — they are
# owned by .github/dependabot.yml and left untouched by this sync.
#
# Runner labels (self-hosted / openbank-build / openbank-deploy) live in a different
# namespace (`runs-on`, rules.yaml: ci_runners) and are NOT issue labels — keep them out.

labels:
  # --- VEX / vulnerability triage (ADR-0030 D1, vex-triage.yml) -------------------------
  - name: vex-triage
    color: "b60205"
    description: "CVE awaiting a human VEX verdict; the issue's age is the vuln_management SLA clock."
  - name: kev-listed
    color: "b60205"
    description: "CVE on CISA KEV (actively exploited) — critical SLA regardless of CVSS (ADR-0279)."
  - name: "severity:critical"
    color: "b60205"
    description: "vuln_management SLA: 7 days."
  - name: "severity:high"
    color: "d93f0b"
    description: "vuln_management SLA: 30 days."
  - name: "severity:medium"
    color: "fbca04"
    description: "vuln_management SLA: 90 days."
  - name: "severity:low"
    color: "c2e0c6"
    description: "vuln_management SLA: 180 days."

  # --- Type: what kind of work this is -------------------------------------------------
  - name: security
    color: "b60205"
    description: "Security defect/hardening. Closing by PR requires a regression test (security-regression-test.yml)."
  - name: bug
    color: "d73a4a"
    description: "A defect in shipped behavior."
  - name: enhancement
    color: "a2eeef"
    description: "New capability or improvement to an existing one."
  - name: governance
    color: "5319e7"
    description: "Process / policy / rules.yaml / ADR follow-up. Often the actionable tail of an ADR."
  - name: sweep
    color: "0e8a16"
    description: "Cross-service fleet sweep tracker — one issue, one PR per service (see fleet_sweep template)."
  - name: tech-debt
    color: "fbca04"
    description: "Refactor / cleanup with no user-facing behavior change."
  - name: docs
    color: "0075ca"
    description: "Documentation, ADRs, runbooks, process specs."
  - name: fleet-health
    color: "b60205"
    description: "Umbrella: fleet-wide health alert (build or lint). Dedupe by source-specific label."
  - name: fleet-health-build
    color: "b60205"
    description: "Dedup marker for the nightly full-fleet BUILD alert (services-ci). One open issue at a time."
  - name: fleet-health-lint
    color: "b60205"
    description: "Dedup marker for the full-fleet LINT gate alert (fleet-lint). One open issue at a time."
  - name: deploy-drift
    color: "b60205"
    description: "Dedup marker for the deployed==main drift watch. One open issue per drifted service."
  - name: main-red
    color: "b60205"
    description: "main-red watch (#4019): one open issue per watched workflow, closed when main goes green."
  - name: flaky-test
    color: "fbca04"
    description: "Recorded by auto-retry-cancelled.yml (#4878): a re-run turned a real failure green."

  # --- Triage / workflow state ---------------------------------------------------------
  - name: triage
    color: "ededed"
    description: "Not yet assessed. Default on every new issue until a maintainer sizes it."
  - name: blocked
    color: "b60205"
    description: "Cannot proceed — waiting on a dependency, a decision, or another issue."
  - name: good-first-issue
    color: "7057ff"
    description: "Small, well-scoped, good entry point for a new contributor."
  - name: help-wanted
    color: "008672"
    description: "Maintainers welcome outside contribution here."
  - name: duplicate
    color: "cfd3d7"
    description: "Already tracked by another issue."
  - name: wontfix
    color: "ffffff"
    description: "Acknowledged but will not be actioned. State why before closing."
  - name: skip-hygiene
    color: "fef2c0"
    description: "Bypass the issue-hygiene link-in-PR gate (ADR-0052) — PR has no sensible issue to link."

  # --- Risk tier: drives review rigor (rules.yaml) -------------------------------------
  - name: money-path
    color: "b60205"
    description: "Touches a money_path service — needs 2 approvals + a threat model (rules.yaml)."

  # --- Compliance touchpoints: mirror the PR template & feature_request template --------
  - name: "compliance:pci"
    color: "1d76db"
    description: "PCI DSS surface affected."
  - name: "compliance:dora"
    color: "1d76db"
    description: "DORA (operational resilience) surface affected."
  - name: "compliance:gdpr"
    color: "1d76db"
    description: "GDPR / personal-data surface affected."
  - name: "compliance:psd2-sca"
    color: "1d76db"
    description: "PSD2 / SCA / RTS surface affected."
  - name: "compliance:aml"
    color: "1d76db"
    description: "AML / 5AMLD / sanctions surface affected."
  - name: "compliance:cnb"
    color: "1d76db"
    description: "CNB regulatory-reporting surface affected."

  # --- Review gates: applied to PRs by the PR template's security checklist -------------
  - name: security-review-required
    color: "d93f0b"
    description: "Auth / crypto / payment code changed — security review must sign off (PR template)."
  - name: gdpr-review-required
    color: "d93f0b"
    description: "PII path changed — GDPR review must sign off (PR template)."
  - name: pci-review-required
    color: "d93f0b"
    description: "Cardholder-data path changed — PCI review must sign off (PR template)."

  # --- Dependencies: owned by dependabot, declared here only to fix its color/description
  - name: dependencies
    color: "0366d6"
    description: "Dependency update. Applied automatically by dependabot."
  - name: deps-freshness
    color: "0e8a16"
    description: "Standing dependency-freshness report issue (ADR-0279 #15), bot-maintained."
