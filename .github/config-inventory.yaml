#
# CONFIG INVENTORY — every secret, variable and OpenBao key this repository CONSUMES, by NAME.
# Never a value. Checked by .github/scripts/check-config-inventory.py (gate `config-inventory`):
#   * a `secrets.X` / `vars.X` in a workflow, or an ExternalSecret remote key served by one of
#     `openbao.stores`, that is not listed here fails the PR;
#   * a name listed here that nothing reads fails too, so the file cannot outlive its consumers;
#   * `unprovisioned` is the ONLY way to merge a consumer whose input does not exist yet, and it
#     needs a reason, an issue and a `review_by` date — after which the gate fails again.
# This file is a claim. `python3 .github/scripts/check-config-inventory.py --live` checks it
# against GitHub (admin gh token) and the cluster's ExternalSecret readiness; run it after
# provisioning anything, before moving a name out of `unprovisioned`.
# Generated 2026-11-14 from the live repository/environment lists and ExternalSecret status.
schema: 1
github:
  repository:
    secrets:
      - ADMIN_UI_E2E_PASSWORD
      - AGENT_APP_ID
      - AGENT_APP_PRIVATE_KEY
      - AGENT_MERGE_RECORDER_CLIENT_ID
      - AGENT_MERGE_RECORDER_CLIENT_SECRET
      - GITOPS_APP_ID
      - GITOPS_APP_PRIVATE_KEY
      - GOVERNANCE_GH_PAT
      - INFRACOST_API_KEY
      - OPENBANK_APP_RO_TOKEN
      - PACT_BROKER_PASSWORD
      - PLATFORM_TOFU_APPLY_ROLE
      - PLATFORM_TOFU_AWS_REGION
      - PLATFORM_TOFU_PLAN_ROLE
      - RULESET_AUDIT_TOKEN
      - SYNTHETIC_OPERATOR_PASSWORD
      - SYNTHETIC_OPERATOR_USERNAME
    variables:
      - ADMIN_UI_E2E_USERNAME
      - ADMIN_UI_EVIDENCE_BUCKET
      - ADMIN_UI_EVIDENCE_REGION
      - ADMIN_UI_EVIDENCE_WRITER_ROLE_ARN
      - AGENT_MERGE_RECORDER_ISSUER
      - AGENT_MUTATING_WORKERS_ENABLED
      - AGENT_REVIEW_API_ENABLED
      - AGENT_SERVICE_URL
      - CI_ARTIFACT_MIRROR_ALIAS
      - CI_ARTIFACT_MIRROR_ROLE_ARN
      - DECEPTION_DRILL_ROLE_ARN
      - DEPLOY_AFTER_SERVICES_CI_ENABLED
      - DRILL_DECOY_URL
      - DRILL_SSM_PARAM
      - GITOPS_APP_ID
      - GRADLE_CACHE_READ_PASSWORD
      - GRADLE_CACHE_URL
      - MERGE_TRAIN_RUNNER
      - MINI_RUNNER_SERVICES
      - PACT_BROKER_URL
      - PACT_BROKER_USERNAME
  environments:
    gradle-cache-writer:
      secrets:
        - GRADLE_CACHE_WRITE_PASSWORD
      variables:
        []
    merge-train-branch-update:
      secrets:
        - BRANCH_UPDATER_APP_ID
        - BRANCH_UPDATER_PRIVATE_KEY
      variables:
        []
    ruleset-evidence:
      secrets:
        - RULESET_EVIDENCE_APP_ID
        - RULESET_EVIDENCE_APP_PRIVATE_KEY
      variables:
        []
  unprovisioned:
    - kind: secret
      names: [SECURITY_KPI_DEPENDABOT_READ_TOKEN]
      reason: "repository-scoped Dependabot alerts read access awaits owner provisioning; only CVE Remediation degrades until then"
      issue: 16492
      review_by: 2026-12-16
    - kind: secret
      names:
        - GLITCHTIP_AUTH_TOKEN
        - AGENT_REVIEW_ANTHROPIC_API_KEY
      reason: "optional; each consumer degrades by design without it (see the issue, one line per name)"
      issue: 16206
      review_by: 2027-02-15
    - kind: secret
      names:
        - ALERTMANAGER_URL
        - ALERTMANAGER_DIGEST_TOKEN
        - ALERTMANAGER_DIGEST_SLACK_WEBHOOK
      reason: "standing-critical digest schedule disabled; no read-only Alertmanager path reachable from Actions exists yet"
      issue: 6432
      review_by: 2027-01-15
    - kind: variable
      names:
        - CODEQL_JAVA_ON_PR
        - ADMIN_UI_CONTENT_INCLUDE_CLUSTER_TOPOLOGY
      reason: "kill switch / opt-in flag; unset is the intended default"
      issue: 16206
      review_by: 2027-02-15
    - kind: variable
      names:
        - PERF_ACCOUNT_ID
        - PERF_ACCOUNT_URL
        - PERF_BALANCE_URL
        - PERF_CONSENT_URL
        - PERF_CURRENCY
        - PERF_DOMESTIC_PAYMENT_URL
        - PERF_FX_BASE
        - PERF_FX_QUOTE
        - PERF_FX_URL
        - PERF_GRANTEE_ID
        - PERF_LEDGER_URL
        - PERF_PARTY_ID
        - PERF_SCA_CHALLENGE_ID
        - PERF_SCA_URL
        - PERF_SEPA_INSTANT_URL
        - PERF_SEPA_PAYMENT_URL
        - PERF_TRANSACTION_URL
        - PERF_TXN_URL
      reason: "perf baseline target URLs and fixture ids; the job refuses to run without them"
      issue: 7311
      review_by: 2027-01-31
    - kind: secret
      names:
        - PERF_READ_TOKEN
      reason: "least-privilege read identity for the perf baseline; created with the perf targets"
      issue: 7311
      review_by: 2027-01-31
    - kind: variable
      names:
        - APICURIO_REGISTRY_URL
      reason: "schema registry apply waits on the registry rollout"
      issue: 1916
      review_by: 2027-01-31
