# whoever else must hold the same value is named, so a rotation cannot forget them.
generated:
  - secret: observability/ci-metrics-ingest
    generator: Password ci-metrics-ingest-token (refreshPolicy CreatedOnce)
    holders:
      - "GitHub secret CI_METRICS_TOKEN in JiRaska/openbank-app (copied by the owner, #16205)"
