      issue: 16754
      review_by: 2027-02-18
# ExternalSecrets whose value an ESO generator draws in-cluster: no store key to provision, but
# whoever else must hold the same value is named, so a rotation cannot forget them.
generated:
  - secret: platform/mcp-customer-store-valkey
    generator: Password mcp-customer-store-valkey-password (refreshPolicy CreatedOnce)
    holders:
      - "mcp-valkey requirepass and mcp-service QUARKUS_REDIS_PASSWORD, both read from this Secret; no copy outside the cluster"
  - secret: platform/mcp-customer-store-metrics
    generator: Password mcp-customer-store-metrics-password (refreshPolicy CreatedOnce)
    holders:
      - "mcp-valkey `metrics` ACL user and its redis_exporter sidecar, both read from this Secret; no copy outside the cluster"
  - secret: platform/mcp-customer-store-hmac
    generator: Password mcp-customer-store-key-hmac (refreshPolicy CreatedOnce)
    holders:
      - "mcp-service MCP_CUSTOMER_KEY_HMAC_SECRET only; no copy outside the cluster"
  - secret: observability/ci-metrics-ingest
    generator: Password ci-metrics-ingest-token (refreshPolicy CreatedOnce)
    holders:
      - "GitHub secret CI_METRICS_TOKEN in JiRaska/openbank-app (copied by the owner, #16205)"
  - secret: platform/mcp-service-account-ref
    generator: Password mcp-service-account-ref-key (refreshPolicy CreatedOnce)
    holders:
      - "none outside the cluster: only mcp-service pods read it (accountRef HMAC key, #16678); rotation = delete the Secret and restart the pods"
  - secret: platform/copilot-redis-exporter
    generator: Password copilot-redis-exporter-password (refreshPolicy CreatedOnce)
    holders:
      - "in-cluster only: the copilot-redis Deployment (platform), `metrics` ACL user + redis_exporter sidecar"
  - secret: ai-platform/langfuse-valkey-exporter
    generator: Password langfuse-valkey-exporter-password (refreshPolicy CreatedOnce)
    holders:
      - "in-cluster only: the langfuse-valkey Deployment (ai-platform), `metrics` ACL user + redis_exporter sidecar"
