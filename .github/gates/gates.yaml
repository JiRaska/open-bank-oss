      # INVERTS the signal (a well-tested unreachable guard scores higher than a lightly-tested
      # reachable one). The registry in rules.yaml records what was measured; this gate fails in
      # both directions, so an entry can neither rot into permanent furniture nor be silently
      # closed. Falsified against the real tree before wiring in: injecting one production
      # caller and, separately, flipping the declared status each produce exactly one finding.
      python3 .github/scripts/check-enforcement-reachability.py --enforce
  - id: readiness-attestation-format
    name: "prod-readiness attestations: format + freshness (#2365, enforced)"
    group: registry
    mode: enforced
    selftest: python3 .github/scripts/check-readiness-attestations.py --self-test
    selftest_expect: pass
    run: |
      # attestations.yaml is the ONLY hand-entered input to the prod-readiness matrix, and
      # nothing read it before this gate. It shipped with `consent-service:` as a service
      # heading; the collector looks attestations up by the SHORT name (`consent`), so that
      # entry matched nothing and scored nothing — measured, renaming the one key flips
      # consent C7 from 2 to 3. A wrong key is invisible from both ends: the file reads as
      # attested and the matrix reads as underscored, and neither points at the other.
      #
      # ENFORCED covers AUTHORING defects only — missing field, non-date, future date,
      # unknown service, unknown attestation key, unresolvable ref. Each is introduced and
      # fixable by the PR that writes it. DECAY deliberately only warns (the script prints
      # ::warning and still exits 0): the collector's TTL already stops counting an expired
      # entry, so a lapse cannot buy a green cell, and failing the whole fleet the morning a
      # pentest TTL rolls over is the alert-fatigue trade this repo has already paid for.
      # Expired for more than 30 days IS an error — that is stale bookkeeping, not a lapse.
      #
      # The attestation count prints on every run: a green reading "0 attestations" would be
      # a gate that never opened the file.
      python3 .github/scripts/check-readiness-attestations.py
  - id: label-description-length
    name: "a labels.yml description fits GitHub's 100-character cap (#4192)"
    group: lint
    mode: enforced
    selftest: python3 .github/scripts/check-label-descriptions.py --self-test
    selftest_expect: pass
    run: |
      # GitHub caps a label description at 100 characters and Label sync fails the whole apply on
      # the first over-long entry, so ONE wordy label turns main red on a push-triggered workflow
      # addressed to nobody. This has happened THREE times, each fixed by shortening the string —
      # which leaves the next occurrence exactly as reachable. The limit is invisible from every
      # angle a contributor uses: the YAML is valid, yamllint is clean, and the failure surfaces
      # only after the merge. Falsified on the real file: the #4192 entry at 110 chars exits 1 and
      # is named; at 100 it exits 0.
      python3 .github/scripts/check-label-descriptions.py .

  # rules.yaml pr_file_overlap. Every other check in this repo is scoped to ONE pull request
  # against ONE base, so two PRs editing the same file are structurally invisible to CI — and
  # the failures that produces are precisely the ones git calls CLEAN. Three shapes, all
  # measured here: a duplicate guard merged twice (#2984 vs #3009, the second fully GREEN on
  # all five required contexts), two neighbouring list entries merging to one
  # (.release-please-manifest.json, 56 -> 55, caught only by an unrelated registration gate),
  # and two spec PRs claiming the same openapi info.version because each is classified against
  # its own creation-time base (#481 x #524, and again from an already-MERGED PR in #3055).
  #
  # ADVISORY on purpose, and not on a graduation path: enforcing would red BOTH PRs the moment
  # two of them touched rules.yaml, clearable only by the other merging first — a queue
  # deadlock. The gate reports and classifies; a human decides which of the three real
  # outcomes it is (identical content / true duplicate / genuine divergence).
  #
  # The one thing it decides rather than reports: `identical content`. The blob sha at each
  # PR's head says whether the bytes already agree, which matters because the file list comes
  # from the MERGE-BASE — after a competing PR squash-merges, the survivor still lists the
  # overlap as a diff (#3103's security.yml matched main byte for byte). Without that
  # comparison the gate would warn loudest exactly when the work was already done.
  #
  # PR-only: there is no "other open PR" to compare against on a push to main. Needs GH_TOKEN,
  # which the shard job already exports. Exit 2 = the enumeration FAILED and the verdict is
  # not clean — on GitHub a permission-shaped absence is byte-identical to a real one.
  - id: pr-file-overlap
    name: "PR file overlap (other open PRs editing the same files, advisory)"
    group: lint
    mode: advisory
    verified: "2026-08-09 — advisory by design (informational cross-PR heads-up, not a correctness gate)"
    when: pull_request
    selftest: python3 .github/scripts/check-pr-file-overlap.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-pr-file-overlap.py

  # ADR-0251. The script this falsifies is the PROOF that an independent review happened, and
  # its predecessor is the reason the control was retired: ADR-0154's "Verify the Claude
  # fallback actually reviewed" step carried the SAME `if:` as the review it verified, so
  # across 10 consecutive runs both were `skipped` while every run concluded `success`
  # (#4281). A verifier that can be switched off by the thing it verifies is not one.
  #
  # So the script itself must stay falsifiable, which is what this gate is for. Its self-test
  # drives 9 cases: the two shapes that ARE a review must pass, and seven that are not — a
  # missing file, no argument, an empty file, a whitespace-only file, plausible prose with no
  # verdict line, a real `401 OAuth access token is invalid`, and a dead-driver marker sitting
  # next to a verdict line (the marker must win).
  #
  # Three of those assert on the MESSAGE, not just the exit code. That is not thoroughness for
  # its own sake: deleting the empty-file check left this self-test GREEN, because an empty
  # file also fails one branch later for want of a verdict line. Two branches agreeing on the
  # verdict made the earlier one unfalsifiable — inside the very script whose job is to make
  # a non-review impossible to mistake for a clean one.
  - id: agent-review-proof-falsifiable
    name: "proof-of-review script is falsifiable (ADR-0251, enforced)"
    group: lint
    mode: enforced
    run: |
      bash .github/scripts/check-agent-review-happened.sh --self-test

  # ADR-0251's other half: WHICH PRs get reviewed. Both of this rule's clauses were wrong in
  # the first draft, and both failed silently toward reviewing LESS than the ADR claimed —
  # `governance` written as a commit TYPE (no such type exists in rules.yaml `commits.types`,
  # so the branch was unreachable dead code, 0 hits in 7 days), and the money-path list
  # matched literally (`money_path_services` says `openbank-ledger-service`, real scopes say
  # both `fraud` and `fraud-service`, so `fix(ledger)` — the most obviously in-scope shape
  # here — was not covered; 48 PRs instead of 114).
  #
  # Neither was visible by reading the rule. The self-test drives 18 titles whose answer is
  # known, plus an unreadable rules.yaml which must RAISE rather than classify everything out
  # of scope. It reads its fixture through the real money_path_scopes() — an earlier version
  # built the normalised set inline and stayed green when that function was gutted, the
  # counter-example never reaching the code under test.
  - id: agent-review-scope-falsifiable
    name: "ADR-0251 review scope rule is falsifiable (enforced)"
    group: lint
    mode: enforced
    run: |
      python3 .github/scripts/agent-review-scope.py --self-test

  # Falsifiability has to be DECLARED, not merely present. `selftest:` is a field run-gates.py
  # ACTS on — it runs the harness before the gate and skips the gate when the verdict is wrong.
  # A `--self-test` invoked inside a gate's own `run:` block reads identically to a human and
  # is invisible to every tool: no ordering, no selftest_expect check, and a harness that
  # starts failing cannot be told from the gate failing.
  #
  # Measured 2026-08-09 over 128 gates: 63 declared one, TWELVE more ran a self-test inline,
  # and two others (check-slo-registry.py, check-asvs-l3.py) shipped a harness nothing called
  # at all. Wiring those 13 took no new logic and moved declared falsifiability 63 -> 76.
  #
  # Same defect as `mode:` — the repo already learned advisory-vs-enforced must be stated
  # outright rather than inferred from a step name (#2450, #2392). This is that lesson applied
  # to the property the whole gate system rests on.
  #
  # Rule 1 (an existing harness must be declared) has NO baseline: the harness demonstrably
  # exists, so nothing is being weighed. Rule 2 is a ratchet — today's 44 undeclared checkers
  # are baselined as debt rather than fixed, because a gate that fails on its own backlog is
  # one nobody can merge past. Rule 3 fails on a stale baseline entry in either direction, so
  # the list cannot rot: it shrinks freely, and growing it needs a reviewer.
  # A gate that examined nothing passes everything. Measured 2026-08-09: delete every .kt in
  # the tree and nine kotlin gates stay green, several printing `0 ... checked` on the way out;
  # delete all 647 gitops manifests and ten gitops gates do the same (#4339). `min_subjects:`
  # plus a `SUBJECTS=<n>` line is the layer that can tell a clean tree from a lost corpus, and
  # this gate is the ratchet that spreads it: a new gate declares a floor or is listed with a
  # reason. The floors catch COLLAPSE, not drift — see the script header for why that is the
  # right target.
  # ADR-0071 Phase 4: manifest.ts is types-only, no hard-coded versions or inline data.
  # It used to be an inline step in ci.yml's `ui-build` job, which carries
  # `if: needs.changes-ui.outputs.changed == 'true'`. That is the #3629 shape exactly — a
  # gate whose scope is silently narrowed by its host job, with nothing anywhere saying a
  # gate was not consulted. It happens to be near-harmless here (the file it guards lives
  # under openbank-admin-ui/, so the filter fires when the subject changes), but "reachable
  # by coincidence" is not a property anyone can check, and the fix is the same either way:
  # gates belong in this manifest. 0.02s.
  - id: manifest-types-only
    name: "manifest.ts is types-only (ADR-0071 Phase 4, enforced)"
    group: lint
    mode: enforced
    selftest: bash .github/scripts/check-manifest-types-only.sh --self-test
    selftest_expect: pass
    min_subjects: 1   # the one file it guards
    run: |
      bash .github/scripts/check-manifest-types-only.sh

  # ADR-0071: the fleet-wide governance manifest is code-derived from per-service
  # governance.yaml. This is the OTHER half of the pair above, and the one where living in
  # `ui-build` was not near-harmless: its subject is every module with a version.txt, while
  # `changes-ui` fires only for openbank-admin-ui/, */governance.yaml or the governance
  # schema. A PR adding a whole new service and OMITTING governance.yaml touches none of
  # those, so the job was absent — not skipped — and openbank-engagement-service shipped with
  # no manifest for days while the aggregate check read green (#4083, third sighting after
  # #2236 and #3629). Reasoning for the checks themselves lives in the script header.
  # Costs an `npm ci --omit=dev` (~47s) when node_modules is cold, which is every CI run;
  # if that makes `lint` the tail shard, move this `group:` — shards are wall-time buckets.
  - id: governance-manifest
    name: "Governance manifest gate (ADR-0071, enforced)"
    group: lint
    mode: enforced
    selftest: bash .github/scripts/check-governance-manifest.sh --self-test
    selftest_expect: pass
    min_subjects: 30   # 58 modules with a version.txt today (2026-08-09)
    run: |
      bash .github/scripts/check-governance-manifest.sh

  # The other half of check-gate-script-registration.py, which says in its own header that it
  # answers "is anything wired to this script" and deliberately not "can that invocation run".
  # A gate written as an inline step in ci.yml inherits its host job's conditions instead of
  # the manifest's — #3629's check-dockerfile-no-build-stage.py could not run on a
  # Dockerfile-only PR because it sat in `ui-build`. Green with no baseline: the one remaining
  # instance (check-manifest-types-only.sh) is registered above as a gate in this PR.
  - id: gate-invocation-reachability
    name: "no gate hides behind a conditional job in ci.yml (#3629/#4339, enforced)"
    group: lint
    mode: enforced
    min_subjects: 10   # 21 run: steps in ci.yml today (2026-08-09)
    selftest: python3 .github/scripts/check-gate-invocation-reachability.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-gate-invocation-reachability.py --enforce

  # Nothing lints Python here. Kotlin has ktlint + detekt, YAML has yamllint, shell has
  # shellcheck (all 63 scripts since #4340) — and the 112 python files the entire governance
  # layer is built from had no linter at all, which made them the least checked code in a repo
  # whose whole thesis is checking things. See the config comment for what is selected and why
  # the style rules are not.
  - id: python-lint
    name: "ruff over the governance scripts (#4339, enforced)"
    group: lint
    mode: enforced
    min_subjects: 100   # 112 check-* plus helpers and generators today (2026-08-09)
    run: |
      cat > "${RUNNER_TEMP:-/tmp}/ruff-requirements.txt" <<'REQEOF'
      ruff==0.16.2 \
          --hash=sha256:9a48cc05c6fbc811ca81b5d7ba95375affea6582d1b8024e455e41afbbf55344 \
          --hash=sha256:a2c0d14fcbb26c91f0f867a6dc9bd71bbc30b1b6151829c884f23faeab2e5700 \
          --hash=sha256:335c621622c4650330be50842561c6586ac6971bb8ab5407fe34dcc9efb16bbe \
          --hash=sha256:20e66910f2c37cc753f9ef6580c914a621b80c4fa3549d3e3521e29d0f5bfc3f \
          --hash=sha256:c7e36fbfba65510548156902bcf1350a979a958ce0347ce0f90d73894036b39f \
          --hash=sha256:f0eab35f80df8f134aae5d1630e751901321d317cc8e50dc39e36fa3ed34cd12 \
          --hash=sha256:40ea8c0594feb894e89c8c61ab9c103d38b0ea72dfde6c594107147ca31b1140 \
          --hash=sha256:ab3d62dde0b19facdd632008cc4827fc28ada7736c6bd35ab6f1050f0bfed53f \
          --hash=sha256:e43e1f5b8388da9eca1b9e88328d47a5cec794633ccf6f7484ac2dd15eee92c0 \
          --hash=sha256:c24788a980581e1d7ea3a0cbe4344c4fbeb0a6a9b1f4713aa46bb104f8294690 \
          --hash=sha256:81806b08329130005dd4a8a8394a0c9da8c6f4cafb16ba438d2a2ee6a18bedf1 \
          --hash=sha256:4ce4e02bad779bef557f541a1b31f20d6abeae1cc05ed1b1ac019d4ffd1044c8 \
          --hash=sha256:e0422abdf70070255fc4073ce9dfc814cc03db577013761ddd09bc1e4a9a4fbd \
          --hash=sha256:c3d7828d12e8927a6fc65fe38e2c2541b9e762d360a1786d752cb1b8883b3c9c
      REQEOF
      # Hash-pinned, same shape and same reason as the PyYAML install in ci.yml (OpenSSF
      # Scorecard Pinned-Dependencies: pipCommand). ruff ships as a self-contained binary
      # wheel per platform, so the whole wheel+sdist set is small enough to carry.
      #
      # Invoked as `python3 -m ruff`, never the `ruff` console script: pip may put that in a
      # directory that is not on PATH (~/.local/bin on a hosted runner), and "installed but
      # not callable" is indistinguishable from "install failed" at the call site.
      #
      # The install output is CAPTURED AND PRINTED ON FAILURE. The first version of this gate
      # sent it to /dev/null and reported only "ruff unavailable — add it to the runner base
      # image", which is a guess dressed as a diagnosis: it took a CI round-trip to learn
      # nothing at all. A gate that cannot say why it could not run is a gate nobody can fix.
      if ! python3 -m ruff --version >/dev/null 2>&1; then
        log="${RUNNER_TEMP:-/tmp}/ruff-install.log"
        python3 -m pip install --quiet --require-hashes \
          -r "${RUNNER_TEMP:-/tmp}/ruff-requirements.txt" --break-system-packages >"$log" 2>&1 \
          || python3 -m pip install --quiet --require-hashes \
          -r "${RUNNER_TEMP:-/tmp}/ruff-requirements.txt" >>"$log" 2>&1 \
          || { echo "::error::ruff install failed — pip said:"; cat "$log"; exit 1; }
      fi
      python3 -m ruff --version

      files=()
      while IFS= read -r f; do files+=("$f"); done < <(
        find .github/scripts openbank-infra/scripts docs -name '*.py' -type f | sort
      )
      echo "SUBJECTS=${#files[@]}"
      python3 -m ruff check --no-cache --isolated --target-version py311 \
        --select E9,F,B --output-format concise "${files[@]}"

  # ADR-0254. A required-status-check context whose workflow was renamed or deleted strands
  # every PR forever with no error anywhere naming why — the gap that made deleting #4339's
  # four duplicate workflows an by-hand `gh api` check before this gate existed. Read live,
  # never from a checked-in copy of the ruleset (the hand-kept-list trap this repo's CI
  # section names as its most-repeated defect class).
  #
  # Needs NO permission grant — GET .../rulesets is world-readable on a public repo (verified
  # with a bare unauthenticated curl). The first version of this gate declared `permissions:
  # administration: read` on the job from a private-repo assumption; `administration` is not a
  # valid workflow-permissions key at all, and GitHub cannot parse a workflow declaring one —
  # it broke ci.yml outright (zero jobs, every push) before this was caught. See this script's
  # own header for the full story.
  - id: ruleset-context-parity
    name: "every required status-check context matches a job some workflow emits (ADR-0254, enforced)"
    group: lint
    mode: enforced
    selftest: python3 .github/scripts/check-ruleset-context-parity.py --self-test
    selftest_expect: pass
    min_subjects: 3   # 5 required contexts today (2026-08-09)
    run: |
      python3 .github/scripts/check-ruleset-context-parity.py --enforce --repo "${GITHUB_REPOSITORY:-JiRaska/open-bank-oss}"

  # ADR-0254. incluster-hostname-resolution shipped advisory with a "these six findings are
  # all benign" note; three were live (settlement-service and onboarding-service dialling
  # hostnames that resolve in no namespace). The note was never re-checked. Every mode:
  # advisory gate must carry a dated `verified:` claim, re-justified every 180 days — this
  # does not re-verify the CLAIM, only forces it to keep being re-dated by a human.
  - id: advisory-finding-staleness
    name: "an advisory gate's 'not enforced yet' reasoning is dated and re-justified (ADR-0254, enforced)"
    group: lint
    mode: enforced
    selftest: python3 .github/scripts/check-advisory-finding-staleness.py --self-test
    selftest_expect: pass
    min_subjects: 3   # 5 advisory-mode gates today (2026-08-09)
    run: |
      python3 .github/scripts/check-advisory-finding-staleness.py --today "$(date -u +%F)" --enforce

  - id: gate-subject-floor
    name: "every gate declares how much it expects to find (#4339, enforced)"
    group: lint
    mode: enforced
    selftest: python3 .github/scripts/check-gate-subject-floor.py --self-test
    selftest_expect: pass
    min_subjects: 100   # 130 gates today (2026-08-09)
    run: |
      python3 .github/scripts/check-gate-subject-floor.py --enforce

  - id: gate-selftest-declaration
    name: "every gate's falsifiability is declared, not inline (enforced)"
    group: lint
    mode: enforced
    selftest: python3 .github/scripts/check-gate-selftest-declaration.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-gate-selftest-declaration.py --enforce
