  # emitted by nothing — Business KPIs, Executive Overview, Compliance & AML, the panels a
  # stakeholder or auditor is most likely to open. It was fixed by hand and closed, and until this
  # gate no check in the repo looked at a dashboard at all, so nothing stopped it recurring.
  #
