    group: data
    mode: enforced
    rationale: "A migration whose PR merges after a higher-numbered sibling has already been applied live crashes the service on every boot ('Detected resolved migration not applied to database: N') — each PR's own CI ran green against its own base and could not see the other, per this repo's own 'PR green is about the base, not main' trap (#5628, security-scanner's 4h+ outage)."
    review_after: "2027-02-19"
    min_subjects: 250   # 350 migrations across 53 services checked today (2026-08-19)
    selftest: |
