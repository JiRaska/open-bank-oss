  # ADR-0030 D2, diff-aware half (issue #265): when a PR moves a money-path
  # service's TRUST BOUNDARIES — inbound REST surface, a new outbound
  # HTTP/gRPC edge, authn/listener/transport keys in application.yaml, or
  # its NetworkPolicy / Deployment/Rollout in gitops — the same diff must
  # update docs/threat-models/<service>.md. ADVISORY until rules.yaml
  # trust_boundary_diff_change flips to enforced (target 2026-09-15,
  # ADR-0144) — findings are ::warning annotations; add --enforce to flip.
  # PR-only: the gate diffs against the resolved PR diff base (see above).
  - id: threat-model-updated-on-trust-boundary-change
    name: "threat-model updated on trust-boundary change (ADR-0030 D2, enforced)"
    group: security
    mode: enforced
    when: pull_request
    needs_base: required
    selftest: python3 openbank-infra/scripts/check-threat-model-diff.py --self-test
    selftest_expect: pass
    run: |
      # BOTH the mode above and --enforce below are required, and neither alone does
      # anything (#2392): the script prints ::warning and exits 0 unless passed
      # --enforce, so `mode: enforced` on its own leaves the runner seeing rc=0 and
      # reporting a permanently green gate that blocks nothing. Measured on #3431:
      # `--base d949ce9ef^ --head d949ce9ef` exits 0 without the flag and 1 with it.
      #
      # Graduated from advisory in #3431 after the scope fix in #3438 took the
      # false-positive rate from 7-of-60 to 2-of-60 (both survivors real). What this
      # now blocks: a PR that moves a money-path service's trust boundary — an
      # inbound REST surface, an outbound client edge, authn/listener keys in
      # application.yaml, a NetworkPolicy, or a Deployment hunk touching ports,
      # identity or privilege — without updating that service's threat model in the
      # same diff. Generated churn (policy-checksum restamps, image tags) does not
      # count; see hunk_moves_boundary and the gate's --self-test.
      python3 openbank-infra/scripts/check-threat-model-diff.py --base "${PR_DIFF_BASE}" --enforce

  # ADR-0030 D2, third half (#6037, PR #6048): the coverage gate proves a threat model EXISTS
  # and the diff gate proves it is TOUCHED when a trust boundary moves. Neither reads a single
  # CLAIM, so a model can be present, current, freshly edited — and false. Settlement's R2
  # listed a money-moving stub as its own mitigation and T1 named an idempotency key built from
  # identifiers that appear in no source file here; three unit tests asserted the defect
  # verbatim, so the suite agreed with the document and both were wrong together.
  #
  # Scope is DERIVED (money_path_services x docs/threat-models/<service>.md) and the claims
  # inside are enumerated by TWO independent parsers whose union is checked — the fleet's models
  # are not one format, and a single parser here would be a probe rather than a census.
  # Exclusions live in the script's ALLOWED_UNRESOLVED with a reason and fail STALE in either
  # direction; that already fired once during development, on its own entry.
  #
  # Both `mode:` and `--enforce` are required and neither alone does anything (#2392): without
  # the flag the script prints ::warning and exits 0, which is a permanently green gate that
  # blocks nothing. Negative control, read from $? with output redirected to a file (a pipe
  # returns the pipeline's status, not the script's): restoring one pre-fix claim gives rc=1
  # naming it PHANTOM; restoring the corrected text gives rc=0.
  - id: threat-model-claims-resolve
    name: "threat-model mitigation claims resolve to real code (ADR-0030 D2, enforced)"
    group: security
    mode: enforced
    min_subjects: 15   # 23 money-path threat models today (2026-08-20)
    budget_seconds: 90   # 41s over the 23 models on a warm checkout
    rationale: "A threat model is a set of claims about running code and nothing checked whether any was true, so a mitigation could name a class that does not exist, a stub, or the very state transition whose truthfulness was the risk — and the document read as coverage in all three cases."
    review_after: "2027-02-20"
    selftest: python3 .github/scripts/check-threat-model-claims.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-threat-model-claims.py --enforce

