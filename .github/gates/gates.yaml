  # for durable/indexed keys) or Ids.randomId() (UUIDv4, for idempotency keys,
  # correlation/trace ids, nonces/tokens that must not leak a creation timestamp).
  # DIFF-SCOPED: fails only if THIS PR adds a bare UUID.randomUUID() in src/main, so
  # it never trips on the ~100 pre-existing sites (those migrate to Ids as-touched)
  # nor on unrelated fleet churn. No-ops on non-PR runs. stdlib-only Python.
  # Kotlin COMMENTS ARE STRIPPED before matching (nesting-aware, shared with
  # check-roles-allowed-realm.py): the gate matches source text, so before #4308 it read a
  # KDoc quoting another service's id-minting call as this file committing the defect and
  # was worked around by rewording the prose (b0e6c02ac) — the wrong direction.
  - id: identifier-intent-guard
    name: "identifier intent guard (ADR-0106, #1699)"
    group: kotlin
    mode: enforced
    # optional, not required: the command reads ${PR_DIFF_BASE:-} and this gate is
    # `when: always`, so it also runs on push to main where there is no PR and no base.
    needs_base: optional
    # Each case is a real base/HEAD pair in a throwaway git repo driven through the gate's own
    # matcher — a hand-fed string cannot exercise the diff scoping, which is half the gate.
    # Falsified in both directions: with no stripping 4 cases go red, with a NON-nesting
    # stripper the nested-KDoc case alone goes red.
    selftest: |
      python3 .github/scripts/check-new-random-uuid.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-new-random-uuid.py "${PR_DIFF_BASE:-}"

  # DomainEvent.occurredAt constructor guard (PR #2662 / #2709).
  # Path-scoped CI only rebuilds changed services — a new DomainEvent subclass
  # that calls DomainEvent() without occurredAt compiles fine locally but
  # fails on the next full release build of that service. This grep runs on the
  # entire source tree on every PR, independent of which services changed.
  # ENFORCED: three simultaneous release failures (ledger+transaction+consent)
  # prompted this gate. Fleet is clean (0 occurrences before this guard landed).
  - id: domainevent-occurredat-constructor-guard
    name: "DomainEvent.occurredAt constructor guard (#2662)"
    group: kotlin
    mode: enforced
    min_subjects: 1500   # 3121 .kt files today (2026-08-09)
    selftest: bash .github/scripts/check-domain-event-occuredat.sh --self-test
    selftest_expect: pass
    run: |
      bash .github/scripts/check-domain-event-occuredat.sh

  # ADR-0100 DST harness — Layer 1 clock-injection gate (#1612).
  # Domain and application layers of money-path services must never call
  # Instant.now() / LocalDateTime.now() / LocalDate.now() /
  # System.currentTimeMillis() directly; all time reads must go through an
  # injected Clock / ClockProvider so the DST/leap-second test harness can
  # control time deterministically.
  #
  # ENFORCED for the seven money-path services; other services are advisory
  # until their domain layer has been ported (follow-up Issue #1612).
  - id: clock-injection-gate
    name: "clock-injection gate — domain/application layers (ADR-0100, #1612)"
    group: kotlin
    mode: enforced
    min_subjects: 70   # 142 money-path domain/application files today (2026-08-09)
    selftest: bash .github/scripts/check-clock-injection.sh --self-test
    selftest_expect: pass
    run: |
      bash .github/scripts/check-clock-injection.sh

  # ADR-0207 D1 — accounting-date authority. The gate above could NOT have caught the defect
  # this one exists for: `Clock.system(ZoneId.of("Europe/Prague"))` is injected-clock-shaped,
  # so ledger-service ran a UTC ClockProducer bean AND a Prague clock built inside
  # LedgerService/YearCloseService, disagreeing about the date for two hours a day half the
  # year, green the whole time. This step bans binding a clock to a locally-chosen zone in the
  # domain/application layer of any money-path service; the accounting date comes from
  # com.openbank.libs.domain.calendar.AccountingClock.
  #
  # ENFORCED from day one. The three pre-existing sites it surfaced (transaction
  # SettlementDateResolver, fx CnbRateIngestionService, sanctions SanctionsListService) are
  # named individually in the script's ALLOWLIST with a reason each, and tracked in #2963 —
  # rather than shipping the whole gate advisory, which registers as "someone should look"
  # forever (the failure mode check-advisory-gate-registration.py exists to prevent). The
  # script FAILS on a stale ALLOWLIST entry, so an exemption and its fix move together.
  #
  # Scope is DERIVED from rules.yaml money_path_services, not hand-kept: check-clock-injection
  # lists 8 of the 20 and reads as passing about the 12 it never looks at.
  - id: accounting-clock-gate
    name: "accounting-clock gate — one business-date authority (ADR-0207 D1, enforced)"
    group: kotlin
    mode: enforced
    selftest: python3 .github/scripts/check-accounting-clock.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-accounting-clock.py --enforce

  # ADR-0002 / rules.yaml architecture.domain_zero_framework_imports: the
  # hexagonal invariant was documented in every PR template but never enforced,
  # and the fleet quietly accumulated violations (Quarkus @RegisterForReflection
  # on a domain type, Jackson JsonNode in domain models). Baseline-ratcheted
  # (detekt pattern): pre-existing violations are grandfathered in
  # domain-purity-baseline.txt and burn down as touched; any NEW framework
  # reference in a domain layer fails outright. openbank-libs-runtime is module-
  # exempt (it IS the framework side of the ADR-0122 split; only its package
  # string says "domain"). ENFORCED from introduction (0 new on main).
  #
  # #3670 rewrote the bash version, which had two blind spots that intersected on
  # @Authorize/@FeatureFlag — the fleet's most-used annotations, declared in
  # openbank-libs-domain as jakarta.interceptor.InterceptorBinding, green every run:
  #   (a) SCOPE was the `*/domain/*` package path, so 80 of libs-domain's 107 main
  #       sources (com/openbank/libs/authz, .../flags, ...) were never opened. The
  #       whole module is now in scope — it IS the domain side of ADR-0122.
  #   (b) DETECTION was `^import <prefix>`; a fully-qualified reference has no import
  #       line. Both forms are matched now, on comment- and string-stripped source.
  # It also gained a --self-test the bash version never had.
  - id: domain-purity-gate
    name: "domain-purity gate — hexagonal invariant (ADR-0002, enforced)"
    group: kotlin
    mode: enforced
    selftest: |
      python3 .github/scripts/check-domain-purity.py --self-test
    run: |
      python3 .github/scripts/check-domain-purity.py .

  # openbank-libs published three annotations — @Idempotent, @Audited, @MaskSensitive —
  # that were plain RUNTIME markers: no @InterceptorBinding, no interceptor, zero usages.
  # Applying one compiled, reviewed as correct, and did nothing; @Idempotent on a payment
  # endpoint would have let a duplicate POST through while the source read as protected.
  # Two were recorded as SHIPPED CONTROLS — ADR-0014 Phase 3 "✅ Shipped: PiiMask/
  # @MaskSensitive", and the STRIDE Repudiation mitigation in the onboarding threat model —
  # which is the half that actively misleads: an unimplemented idea had become evidence.
  #
  # Two rules, each falsified separately (#4011). RULE A: an annotation declared in an
  # openbank-libs-* module must be @InterceptorBinding WITH an interceptor, or be applied at
  # least once in some src/main — red on the pre-fix tree with exactly the three above.
  # RULE B: a document in docs/adr, docs/threat-models or openbank-libs/docs may not name an
  # @Annotation that no Kotlin source declares or imports — red on the intermediate state
  # (annotations deleted, documents not yet corrected: 25 findings), which is precisely the
  # shape that made this dangerous rather than untidy. The "real annotation" set is DERIVED
  # from the sources, never hand-kept.
  #
  # Code-about-code precedence was decided BEFORE the first run, since a text guard always
  # flags the prose explaining the defect it catches: naming an absent annotation is allowed
  # when the surrounding paragraph cites an issue. Prose about deliberately-unadopted
  # third-party annotations (ADR-0016's @RunOnVirtualThread, a residual-risk column's
  # @RateLimited) sits in PROSE_ALLOWLIST with a reason each, and a STALE entry fails in
  # either direction — an exemption and its removal move together.
  - id: libs-annotations-implemented
    name: "openbank-libs annotations are implemented, and no doc names a phantom one (#4011, enforced)"
    group: kotlin
    mode: enforced
    selftest: |
      python3 .github/scripts/check-libs-annotations-implemented.py --self-test
    run: |
      python3 .github/scripts/check-libs-annotations-implemented.py .

  # ==== api ===================================================================

  # The verification reconciler (.github/scripts/pact-reconcile-verifications.py)
  # dispatches verify-provider.yml with the PACTICIPANT NAME as its `service` input,
  # which only works because every pacticipant name is exactly a module directory —
  # true for all 55 today, and previously held together by nothing. A drifted name
  # would keep dispatching, just at a service that does not exist: the run fails
  # inside the build and the pact stays unverified, which looks identical to the
  # strand the reconciler was built to remove. Reads the committed pacts, so no
  # broker and no credentials.
  - id: pacticipant-matches-module
    name: "pacticipant name is a module directory (Pact webhook contract)"
    group: api
    mode: enforced
    selftest: |
      python3 .github/scripts/check-pacticipant-matches-module.py --self-test
    run: |
      python3 .github/scripts/check-pacticipant-matches-module.py

  # The resolver decides what record-deployment writes into the broker's environment record
  # (#3223). Its core is a pure path classifier, so the self-test drives every branch — including
  # the prefix-sibling near-miss (openbank-ledger vs openbank-ledger-service) and the
  # "no exclude-paths declared" case, where src/test must COUNT rather than be assumed excluded.
  # Falsified both ways before wiring in: breaking the exclusion makes it exit 1 with 4 failures.
  - id: record-deployment-version-resolver
    selftest_exempt: "is-a-test-suite"
    name: "record-deployment version resolver (issue #3223, enforced)"
    group: api
    mode: enforced
    run: |
      bash .github/scripts/resolve-record-deployment-version.sh --self-test

  # The other half of every other gate in this file. Every other gate here reads committed text,
  # because that is what CI can see; this one compares that text to what the cluster actually
  # does. Only the COMPARISON runs in CI — it is a pure function of (snapshot, repo) and is what
  # the self-test drives. Collection needs cluster credentials no workflow has yet, so it is
  # dispatch-only for now (runtime-conformance.yml), the same split check-external-feeds.py uses.
  #
  # Falsified before wiring in: the 22-case self-test fails when any comparator is broken, and the
  # first run against the LIVE estate exposed two defects in the tool itself — libs-runtime's
  # abstract dispatcher counted as a service, and outbox facts keyed by table name never matched
  # claims keyed by directory name, so nine real findings were silently skipped. Both are now
  # self-test cases.
  - id: runtime-conformance-comparators
    selftest_exempt: "is-a-test-suite"
    name: "runtime conformance: claim-vs-cluster comparators (enforced)"
    group: gitops
    mode: enforced
    run: |
      python3 .github/scripts/runtime-conformance.py --self-test
  # A service that ships an outbox must write to it (#4007). Eight do not: dispatcher, backlog
  # gauge, migration and `dispatch-enabled: true`, with no OutboxMessage construction anywhere in
  # src/main — so the dispatcher polls a table nothing writes to and the gauge reads 0, which is
  # indistinguishable from a drained queue. Those events still reach consumers, through a second
  # direct non-transactional emitter, so nothing downstream notices either.
  #
  # RATCHET: today's eight are baselined against #4007 (each needs a per-service wire-or-delete
  # decision this gate does not make), so a NINTH cannot be added quietly. A baseline entry that
  # becomes covered is also reported, so the list cannot quietly become permanent.
  #
  # Falsified both ways on the real tree before wiring in, reading the exit code directly rather
  # than through a pipe: removing fx-service's writer -> rc=1 with the service named; adding a
  # bogus baseline entry -> rc=1 as a stale entry; clean tree -> rc=0. The self-test additionally
  # covers the code-about-code cases — a KDoc, a commented-out call, a NESTED block comment and a
  # string literal naming the constructor must none of them count as a writer.
  - id: outbox-has-writer
    name: "a service shipping an outbox dispatcher must construct an OutboxMessage (#4007, enforced)"
    group: kotlin
    mode: enforced
    selftest: |
      python3 .github/scripts/check-outbox-has-writer.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-outbox-has-writer.py .

  - id: pact-provider-replay-coverage
    name: "Pact provider replay + broker publication (issues #2338, #7621, enforced)"
    group: api
    mode: enforced
    selftest: |
      python3 .github/scripts/check-pact-provider-replay.py --selftest
    run: |
      python3 .github/scripts/check-pact-provider-replay.py

  # Issue #7597. release-please.yml's "Map released components -> tags" step builds released.tsv
  # from release-please-config.json's per-package `component` field; a package with a version.txt
  # but no `component` produces no row, silently — no SBOM, no cosign provenance, no VEX for that
  # package's release, while the release itself (tag, GitHub Release) looks completely normal.
  # Measured today: openbank-campaign-service and openbank-tax-reporting-service both have a
  # version.txt and a `packages` entry with no `component` key.
  #
  # This gate deliberately does NOT add the missing `component` keys — that changes the release
  # tag name (`include-component-in-tag: true`), and version.txt / release-please-config.json /
  # .release-please-manifest.json are a three-way lockstep for an ALREADY-RELEASED package
  # (ADR-0029 rule 2), so retagging existing release history is a repo-owner decision, not CI-gate
  # material. What this enforces is the durable half: a package with a version.txt must resolve to
  # a component that reaches released.tsv, derived from release-please-config.json every run —
  # never a hand-kept list — so a THIRD package cannot join the two above silently.
  #
  # RATCHET: today's two are baselined in the script with a reason citing #7597; the check fails on
  # a stale baseline entry in either direction (fixed but still listed, or listed but no longer
  # released), same contract as check-pact-provider-replay.py above.
  - id: release-evidence-coverage
    name: "released package resolves to a component that reaches released.tsv (issue #7597, enforced)"
    group: supplychain
    mode: enforced
    rationale: "A released package with no component key never enters released.tsv, so its release produces no SBOM, no provenance attestation and no VEX document — silently, since the release itself still succeeds. This gate makes that gap a finding instead of an absence nothing else can see."
    review_after: "2027-08-31"
    min_subjects: 60
    selftest: |
      python3 .github/scripts/check-release-evidence-coverage.py --self-test
    run: |
      python3 .github/scripts/check-release-evidence-coverage.py --enforce

  # openapi enum vs the Kotlin enum behind it (issue #5895 / #5962, enforced).
  #
  # The axis the api-contract gate below structurally CANNOT see: oasdiff compares a spec to its
  # own previous version, never to the implementation. So a spec enum hand-written once and never
  # re-checked drifts forever and every gate stays green. openbank-kyc-service published
  # `[IDENTITY, SANCTIONS, PEP, ADVERSE_MEDIA, SOURCE_OF_FUNDS]` against a domain
  # `CheckType { IDENTITY, ADDRESS, PEP_SCREENING, SANCTIONS_SCREENING, ADVERSE_MEDIA }` from the
  # day the file was written — three names misspelled, one real check unpublished, and one value
  # that has never existed in the code. Its own PUT body was fiction in the same way.
  #
  # Pairing is by VALUE OVERLAP, not by name: nothing declares which Kotlin enum a spec enum
  # serves, and matching on names would find almost none of them. An unpaired spec enum is not a
  # finding (many are free-form vocabularies with no Kotlin type).
  #
  # RATCHET: the 27 drifts across 16 services that exist today are a BASELINE constant in the
  # script (owned by #5962), so this is enforced from day one and number 28 is red at PR time. A
  # baseline entry that no longer drifts also FAILS, so the list cannot rot into furniture — same
  # contract as check-pact-provider-replay.py and check-adr-partial-followup.py above.
  - id: openapi-enum-domain-drift
    name: "openapi enum matches the domain enum it serves (issue #5962, enforced)"
    group: api
    mode: enforced
    rationale: >
      oasdiff compares a spec to its own previous version and never to the implementation, so a
      spec enum hand-written once and never re-checked drifts forever with every gate green.
      openbank-kyc-service published three misspelled check names, omitted a real check, and
      advertised a value (SOURCE_OF_FUNDS) that has never existed in the code — from the day the
      file was written until #5895, and 27 more pairings across 16 services still do (#5962).
    review_after: '2027-02-20'
    min_subjects: 100
    selftest: |
      python3 .github/scripts/check-openapi-enum-vs-domain.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-openapi-enum-vs-domain.py --enforce

  # ADR-0048 D5: api-contract gate — classify the API-contract bump from the
  # OpenAPI diff (oasdiff), independently of the release axis (version.txt):
  #   breaking  => info.version MAJOR (new URL major /api/v{N+1})
  #   additive  => info.version MINOR within the same /v{N}
  #   editorial => info.version PATCH
  # Also asserts the D2 API invariant on HEAD:
  #   major(info.version) == openbank.api.version == newest URL major.
  # ENFORCED (ADR-0144 graduation, ahead of the 2026-08-15 target). The gate is
  # diff-scoped: it only classifies the spec change in THIS PR, so the fleet's
  # historical under-bumping is not retroactively a failure — but from here a PR
  # that changes a spec must move info.version to match what it did. Bumping is
  # the one-line fix the error message spells out.
  # oasdiff is a pinned, checksum-verified binary (OpenSSF Pinned-Dependencies),
  # same direct-CLI pattern as gitleaks (ADR-0040). The gate diffs against the
  # resolved PR diff base — the CURRENT merge-base, not the creation-time event
  # base.sha (the #524 × #481 ledger merge race, fixed in #534).
  #
  # This step used to end "pushes to main have already been classified". That was
  # the false premise behind the residual gap described above: a push to main was
  # classified by the PR that produced it, but only against that PR's base AT ITS
  # LAST RUN. If a competing spec merged after that run, the classification is
  # stale and this gate never sees the collision — main takes the second PR's
  # endpoints under a version the first already claimed, green all the way.
  # api-contract-post-merge.yml now re-classifies every spec that lands on main
  # against what main actually was, and raises an issue when one is mis-versioned
  # (#1465). Detection, not prevention: it cannot block a merge that already
  # happened — see that workflow's header for why neither prevention was viable.
  - id: api-contract-gate
    name: "api-contract gate — OpenAPI diff classification (ADR-0048 D5, enforced)"
    group: api
    mode: enforced
    when: pull_request
    needs_base: required
    env:
      OASDIFF_VERSION: "1.22.0"
      OASDIFF_SHA256: "8b972accaf49f984cf40702af8b29360126ac9436594ccf6ac1ae662209a5fe6"
    # Falsifies the URL-major scan, which had no self-test and shipped a false positive for months:
    # it read /api/v{N} out of RAW file text, so a comment explaining the URL-major rule read as an
    # endpoint implementing it and failed a service whose every @Path says /api/v1 (#3119) — it
    # exercises url_majors / own_api_majors directly, including against the two real services
    # (psd2, customer-edge) whose distinction a naive fix breaks.
    #
    # It now ALSO falsifies the classifier, the half that decides whether a PR is red and which
    # nothing exercised. That gap is how #6380 survived: `editorial` demands a PATCH bump, the bump
    # was itself a non-excluded diff, so adding it reclassified the change as `additive` and no
    # version satisfied it. Those cases need oasdiff, so the selftest installs it too — and the
    # script FAILS rather than skips when the binary is absent, since a self-test that cannot run
    # is not a self-test. The install is shared and idempotent; both steps run in the same job.
    selftest: |
      set -euo pipefail
      bash .github/scripts/install-oasdiff.sh
      python3 .github/scripts/check-api-contract.py --self-test
    run: |
      set -euo pipefail
      bash .github/scripts/install-oasdiff.sh
      python3 .github/scripts/check-api-contract.py --base "${PR_DIFF_BASE}" --enforce

  # The gate above classifies the bump against the MERGE-BASE, which is the right question for
  # "is this bump big enough" and structurally blind to a number that someone else already took.
  # Measured 2026-08-30: four PRs were green while claiming a version main had already released
  # (account 1.11.0, consent 1.7.0, card-issuance 1.8.0, campaign 1.43.0). Each forked one minor
  # lower and bumped by one; a competing PR then landed the same number first. The merge-base still
  # holds the OLD value, so the contract gate sees a clean minor bump — and git sees nothing either,
  # because identical text is not a conflict, so the merge is exit 0 and prints nothing. Two checks
  # each answering a question that is individually right and jointly insufficient.
  #
  # This one asks whether the number is still free on the base branch AS IT IS NOW.
  #
  # DETECTION, NOT PREVENTION, and the distinction matters: a run is only as fresh as the moment it
  # executes, so a PR whose last CI run predates a competing merge and then merges with no later run
  # is invisible here as to any run-time check. Closing that needs a merge queue or up-to-date-branch
  # enforcement; ADR-0048 deliberately chose detection. What this buys is that a stale claim goes RED
  # ON THE NEXT RUN instead of merging silently — today all four collisions are green.
  #
  # The self-test drives the pure comparison directly and carries must-VIOLATE cases, not only
  # passing ones, so it can detect its own vacuity. Falsified before merge against the four real
  # colliding branches (exit 1 each, each naming the taken number) and against two non-colliding
  # ones (#6486 1.16.0->1.17.0, #6481 1.5.0->1.6.0, exit 0) — it discriminates in both directions
  # rather than failing everything.
  - id: openapi-version-not-taken
    name: "openapi-version-not-taken — info.version still free on the base tip (ADR-0048, enforced)"
    group: api
    mode: enforced
    when: pull_request
    needs_base: required
    # No min_subjects: this gate is DIFF-SCOPED, so most PRs legitimately have zero subjects
    # (they touch no openapi.yaml). A floor here is the "declares a floor and never prints a
    # count" failure the subject-floor gate exists to catch -- which is exactly how it caught
    # this entry on its own first CI run. api-contract-gate, diff-scoped for the same reason,
    # declares none either. The gate still prints SUBJECTS=, including zero, so that "no
    # subjects" and "did not look" never render identically.
    rationale: >-
      api-contract-gate classifies a bump against the merge-base, so it cannot see a version a
      competing PR already released; four PRs were green on 2026-08-30 claiming taken numbers.
    review_after: 2027-03-01   # Re-examine if a merge queue or up-to-date-branch enforcement
                               # lands: either would PREVENT this collision rather than detect
                               # it late, making this gate redundant. ADR-0048 chose detection,
                               # so until that changes it stays.
    selftest: |
      set -euo pipefail
      python3 .github/scripts/check-openapi-version-not-taken.py --self-test
    run: |
      set -euo pipefail
      git fetch -q origin main
      python3 .github/scripts/check-openapi-version-not-taken.py --base "${PR_DIFF_BASE}" --base-ref origin/main --enforce

  # ENFORCED against a declared baseline (#2314). It landed advisory because 104 findings
  # cannot be a merge blocker on day one — but an advisory check over a GENERATED comparison
  # is a contradiction (#2216): there is no judgement left to exercise, advisory just makes
  # the drift mergeable. So it now runs with --enforce against a file that declares those 104
  # findings verbatim. A finding absent from the baseline fails the build; a baseline line
  # with no matching finding ALSO fails, so the declaration cannot outlive the debt. The
  # baseline does not narrow what is compared — every service is compared every run.
  # Falsified before merge on all three paths (new finding / stale line / debt paid).
  #
  # The gate above classifies a spec's version bump against the previous revision of the
  # same document. Nothing asked whether the document is TRUE, which is how aml-service
  # published schemas whose fields exist nowhere in the code (#2312) and copilot-service
  # served an unpublished money-path confirm endpoint (#2323). NOT diff-scoped: the defect
  # is a missing pair between two trees, so a PR that changes only Kotlin never touches the
  # spec and a diff-scoped gate would see nothing.
  #
  # Route SET only — it does not read schemas or status codes. Do not read a green here as
  # "this spec is true"; see the script header for the precise limits.
  - id: openapi-route-conformance
    name: "openapi-route-conformance — published contract vs served routes (enforced)"
    group: api
    mode: enforced
    selftest: python3 .github/scripts/check-openapi-route-conformance.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-openapi-route-conformance.py --enforce \
        --baseline .github/openapi-route-conformance-baseline.txt

  # OWASP ASVS L3 mechanical subset (security baseline Layer 4): V2.1/V8.1/V10.1 are
  # zero-tolerance (clean today), V9.1/V13.1 ratchet against the declared baseline —
  # a NEW plaintext edge or a NEW unspecified resource fails; a paid-off baseline line
  # fails until deleted (same KNOWN_UNCOVERED shape as the route-conformance gate).
  - id: asvs-l3-mechanical-subset
    name: "ASVS L3 mechanical subset (enforced, baseline-ratcheted)"
    group: api
    mode: enforced
    selftest: python3 .github/scripts/check-asvs-l3.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-asvs-l3.py --enforce --baseline .github/asvs-l3-baseline.txt

