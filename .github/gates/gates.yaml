  # PR (#4939) had already deployed and applied V5 live. Flyway refuses to boot once a
  # lower-numbered migration than the highest already applied shows up on the classpath, and
  # neither PR's own CI could see it — each ran green against its own base, per this repo's
  # documented "PR green is about the base, not main" trap. This is a detect-fast gate (runs on
  # push to main too, per ci.yml), not a prevention — see the script's own header for why a race
  # between two PRs cannot be fully prevented pre-merge, only caught within minutes instead of
