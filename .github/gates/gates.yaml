#
# THE GATE MANIFEST — every static governance gate CI runs, declared in one place.
#
# WHY THIS FILE EXISTS
#   These gates used to be 79 sequential steps in ci.yml's `validate` job. That shape had
#   two costs, both of which compounded with every gate added:
#
#     1. SERIAL. One runner, one checkout, 79 steps end to end. Between 2026-07-04 and
#        2026-08-01 the job went 35 -> 97 steps and its median wall time 0.7 -> 2.4 min,
#        growing linearly with the gate count. `Validate manifests` is a REQUIRED check on
#        every PR — including the ~40% that are release-please / auto-deploy bot PRs — so
#        each new gate taxed every PR in the repo, permanently. Sharding turns that into
#        max(shard) instead of sum(all).
#
#     2. UNADDRESSABLE. A gate WAS a workflow step, so nothing could enumerate the set:
#        not a human, not a developer wanting to run one locally, and not
#        check-advisory-gate-registration.py — which had to regex workflow YAML and infer
#        "is this a gate?" from a step name (and, per its own header, flagged itself once
#        for having the word `advisory` in a step name, issue #2450).
#
#   Declaring them here makes the set enumerable, runnable outside CI, and parallelisable:
#
#       python3 .github/scripts/run-gates.py --list
#       python3 .github/scripts/run-gates.py --group kotlin
#       python3 .github/scripts/run-gates.py --only domain-purity-gate-hexagonal-invariant
#       python3 .github/scripts/run-gates.py --all                  # every gate + its self-test
#       python3 .github/scripts/run-gates.py --self-test            # falsify the RUNNER itself
#   (there is no --selftest-only: a gate's self-test always runs immediately before that gate,
#    so `--all` is what falsifies every gate.)
#
# THE CONTRACT — read this before adding an entry
#   id          stable slug, unique across the file. Used by --only and in the run log.
#   name        display name, carried verbatim from the step it replaces.
#   group       which matrix shard runs it. Shards are WALL-TIME buckets, not a taxonomy —
#               rebalance them freely when one gets slow. A gate and its self-test always
#               run together, so that pairing is not a constraint on grouping.
#   mode        `enforced` (a failure fails CI) or `advisory` (a failure is a ::warning and
#               the run continues). An `advisory` entry MUST be registered in rules.yaml
#               with a `target_enforce_date`: check-advisory-gate-registration.py reads
#               THIS FILE, so an advisory gate cannot hide here either (issue #2392).
#               Note that most gates here are ALSO advisory internally — they print
#               ::warning and exit 0 unless passed --enforce. `mode:` is about what the
#               RUNNER does with a non-zero exit; it does not override the script's own
#               flag, and the two must agree. See rules.yaml: gate_modes.
#   when        `always` (default) or `pull_request`. A `pull_request` gate is skipped on
#               push-to-main, exactly as its `if:` did before.
#   needs_base  true when the command reads $PR_DIFF_BASE — the merge-base resolved by the
#               shard's setup step. NOT github.event.pull_request.base.sha, which is frozen
#               at PR-creation time and is why two racing spec PRs could both claim the same
#               openapi info.version (#481 x #524).
#   selftest    proof that this gate's RED is reachable — the repo's hardest-won CI rule,
#               "a gate that has only ever passed is unfalsified" (#2165, #2154, #2177).
#               The runner executes it BEFORE the gate and skips the gate entirely if the
#               verdict is wrong. Omit it only when the checker has no --self-test mode;
#               never fake one that cannot fail.
#   selftest_expect
#               `pass` (default) or `fail` — and you must declare it, because the two
#               shapes have OPPOSITE exit conventions and nothing in the command text says
#               which is which:
#                 pass — the command is the checker's own `--self-test` HARNESS: it builds
#                        a fixture the gate must flag, runs the gate on it, and asserts the
#                        gate went red. The harness exits 0 when the gate is falsifiable.
#                        Every self-test in this repo today is this shape.
#                 fail — the command IS the known-positive, invoking the gate directly on
#                        input it must reject, so exit 0 means the gate failed to reject it.
#               Getting this backwards is silent in the safe-looking direction: it turns a
#               healthy gate into a reported failure, or a broken one into a green.
#   env         extra environment for this gate only.
#   run         the command, verbatim. Executed with `bash -euo pipefail` from the repo root.
#
#   Every entry below was extracted MECHANICALLY from the ci.yml step it replaces — the
#   `run` bodies and the rationale comments above them are the originals, not retyped
#   (repo lore: a transcription is a different program).
#
gates:

  - id: test-intelligence-ecosystem
    name: "Test Intelligence producer/runtime/projection contract (ADR-0273, enforced)"
    group: kotlin
    mode: enforced
    rationale: "A dashboard can look green while service CI, Testcontainers runtime proof and the shared schema drift independently; this gate keeps the complete evidence chain present."
    review_after: "2027-08-23"
    min_subjects: 50
    selftest: python3 .github/scripts/collect-test-run-evidence.py --self-test && python3 .github/scripts/check-test-intelligence-ecosystem.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-test-intelligence-ecosystem.py

  - id: synthetic-taint-rest-client-boundaries
    name: "Synthetic taint reaches every internal REST edge (ADR-0252, enforced)"
    group: kotlin
    mode: enforced
    rationale: "A synthetic journey that loses its marker at an unregistered REST client reaches downstream persistence as real activity; forwarding the marker to an external endpoint is a separate trust-boundary failure. Every client declaration must make exactly one of those decisions explicit."
    review_after: "2027-08-24"
    min_subjects: 110
    selftest: python3 .github/scripts/check-synthetic-taint-rest-clients.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-synthetic-taint-rest-clients.py --enforce

  - id: synthetic-outbox-taint-persistence
    name: "Synthetic taint survives shared transactional outbox persistence (ADR-0252, enforced)"
    group: kotlin
    mode: enforced
    rationale: "A synthetic marker forwarded over REST but replaced by a false default at the asynchronous event boundary makes test activity indistinguishable from real banking activity; both schema and writer mapping must survive together."
    review_after: "2027-08-25"
    min_subjects: 20
    selftest: python3 .github/scripts/check-synthetic-outbox-taint.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-synthetic-outbox-taint.py --enforce

  # ==== lint ===========================================================
  # The runner's own falsification, riding the cheapest shard. run-gates.py decides for
  # every other gate in this file whether a non-zero exit fails the build, whether an
  # advisory warning is emitted, and — the part with no second opinion anywhere — whether a
  # self-test that PASSED means the gate it guards is unfalsified. A runner that quietly
  # classified everything as `ok` would turn all 66 gates green and nothing else in CI
  # would notice, which is precisely the shape this repo keeps getting burnt by. So the
  # runner is held to the standard it enforces: `--self-test` drives a synthetic manifest
  # rigged to fail in each distinct way (and to pass in the ways that must still pass, so a
  # fail-everything runner does not satisfy it either) and asserts the classification.
  # The regeneration entrypoint's inventory must name every generator that exists, or a generator
  # added later is silently never invoked — which is the exact failure #3771 shipped, one level up.
  # The run: IS the self-test, so there is nothing separate to falsify; the negative control (add a
  # gen-*.py the inventory does not name, watch it go red) is recorded in the PR.
  - id: regen-derived-inventory
    name: "regen-derived names every generator (issues #3771/#3983/#4002, enforced)"
    group: lint
    mode: enforced
    rationale: >-
      agents.yaml has three independent derived tails and rules.yaml has two, generated by six
      programs in four directories with a required ordering (data before bundles; regenerate before
      commit before check, because two checkers restore their subject to HEAD on failure). #3771
      regenerated none of the three and red-gated main. This gate holds the single entrypoint's
      inventory to the generators that actually exist, in both directions.
    review_after: '2027-02-22'
    min_subjects: 40
    selftest_exempt: "is-a-test-suite - the run: IS the entrypoint's own --selftest"
    run: |
      bash .github/scripts/regen-derived.sh --selftest

  # The shell probes this repo keeps getting wrong, each held to a known-positive AND a
  # known-negative. The run: IS the self-test; the whole file is the falsification harness.
  - id: probe-lib-known-positive
    name: "shell probes are falsified against a known-positive (enforced)"
    group: lint
    mode: enforced
    rationale: >-
      A probe fails by reporting CLEAN, so a broken one is indistinguishable from a clean subject.
      Seven measured instances here printed a green answer: a BSD-only find predicate that is always
      empty, a date parsed in the local zone (53 false positives), a local tracking ref read as
      remote state, an awk column that is a word of a job name, a post-filtered linter that hid a
      syntax error, a newline-joined file list arriving as one argument, and an in_progress run
      count inflated by 189 wedged records. This gate keeps each probe's red reachable.
    review_after: '2027-02-22'
    min_subjects: 10
    selftest_exempt: "is-a-test-suite - the run: IS the probe library's own --selftest"
    run: |
      bash .github/scripts/lib/probe.sh --selftest

  - id: gate-runner-self-test
    selftest_exempt: "is-a-test-suite — the run: IS run-gates.py --self-test"
    name: "gate runner self-test (the runner must be falsifiable too)"
    group: lint
    mode: enforced
    run: |
      python3 .github/scripts/run-gates.py --self-test

  - id: yamllint
    selftest_exempt: "third-party — yamllint's own test suite is not ours to run"
    name: "yamllint"
    group: lint
    mode: enforced
    min_subjects: 400   # 900+ yaml/yml files today (2026-08-09)
    budget_seconds: 40   # 5.8s through the runner at -P4
    run: |
      # Lint the infra/CI manifests this job is named for. Quarkus service
      # application.yaml files are validated by Quarkus itself during the
      # per-service build (services-ci.yml), so we don't double-lint them.
      cat > "${RUNNER_TEMP:-/tmp}/yamllint-ci.yml" <<'YML'
      extends: default
      rules:
        line-length: disable
        document-start: disable
        # Allow ONE space inside flow collections (`{ a: b }`, `[ x, y ]`) as well
        # as zero. The fleet manifests use that style pervasively (ArgoCD
        # Applications, component resources, the single-owner service manifests);
        # both styles are equivalent YAML and harmless. Defaulting to 0-only kept
        # re-breaking this required check every time a new service was onboarded
        # (#648, #657, ...).
        braces:
          max-spaces-inside: 1
        brackets:
          max-spaces-inside: 1
        # SHA-pinned actions use the `@<sha> # vX` convention (1 space) that
        # Dependabot/GitHub generate and rewrite; don't fight it with 2.
        comments:
          min-spaces-from-content: 1
        truthy:
          check-keys: false
        # Allow either sequence-indentation style (block sequences indented
        # under their key, or flush with it). The Kyverno mutation policies
        # (ecr-pull-through-rewrite.yaml) and several ArgoCD/gitops manifests
        # author `- item` flush with the parent key, which the `default`
        # (indent-sequences: true) flags as wrong-indentation — the same
        # file-by-file fight as braces/brackets above. `whatever` accepts both
        # equivalent styles instead of re-reddening the required check (#926).
        indentation:
          indent-sequences: whatever
      YML
      # strict:false equivalent — yamllint exits non-zero only on errors,
      # warnings don't fail the job (no --strict).
      # -P4 over an explicit file list, not `yamllint <dir>`: the linter is single-threaded and
      # the CI runner has four cores, so the directory form leaves three of them idle for the
      # whole gate. Measured locally: 15.7s serial, 6.6s at -P4, same findings.
      #
      # The list is also what lets the gate say how much it linted. `yamllint` with no file
      # arguments exits 0, so the directory form could not tell a clean tree from a directory
      # that had been renamed out from under it (#4339).
      files=()
      while IFS= read -r f; do files+=("$f"); done < <(
        find openbank-infra .github \( -name '*.yaml' -o -name '*.yml' \) -type f | sort
      )
      echo "SUBJECTS=${#files[@]}"
      printf '%s\0' "${files[@]}" \
        | xargs -0 -P 4 -n 40 yamllint -f github -c "${RUNNER_TEMP:-/tmp}/yamllint-ci.yml"

  - id: shellcheck
    selftest_exempt: "third-party — shellcheck's own test suite is not ours to run"
    name: "shellcheck"
    group: lint
    mode: enforced
    min_subjects: 30   # 63 shell scripts today (2026-08-09)
    budget_seconds: 30   # 5.7s over 63 scripts
    run: |
      # BOTH script trees. `.github/scripts` was out of scope until #4337, so the 42 shell
      # files implementing the gates themselves — the code every other gate's verdict rests
      # on — were the least linted in the repo. Adding them cost 5 warning-level findings.
      #
      # Each root must contribute at least one file. A `find` that matches nothing yields an
      # empty list, and `shellcheck` with no arguments exits 0: the gate would report a pass
      # over a directory it never opened, which is exactly the shape this manifest exists to
      # make impossible (a renamed directory is the realistic way it happens).
      status=0
      total=0
      for root in .github/scripts openbank-infra/scripts; do
        files=()
        while IFS= read -r f; do files+=("$f"); done < <(find "$root" -type f -name '*.sh' | sort)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::shellcheck: no *.sh found under $root — the scope moved, the gate did not"
          status=1
          continue
        fi
        echo "shellcheck: ${#files[@]} script(s) under $root"
        total=$((total + ${#files[@]}))
        shellcheck -S warning "${files[@]}" || status=1
      done
      echo "SUBJECTS=$total"
      exit $status


  # ADR-0253 applied to the ADR registry itself. `delivery-status` is a control:
  # DIGEST.md is what a reviewer, an auditor or an agent reads instead of the 1.6 MB
  # fleet, and until now nothing compared its claim against the estate. It drifted
  # silently twice — 0179/0181 said `planned` over live, versioned code (#5602), and
  # ADR-0237 said `planned` while its own adoption gate below had been ENFORCED for
  # weeks. check-adr-registry.sh validates the SCHEMA; `planned` is a well-formed lie.
  #
  # The evidence read here is deliberately narrow and runs artifact -> ADR: an
  # ENFORCED gate blocks every PR, so an ADR it cites is not "planned" under any
  # reading. Advisory citations are NOT evidence (ADR-0144 lets a gate land ahead of
  # the decision it will enforce). The rejected alternative — "does a path this ADR
  # mentions exist" — was measured first: 15 of 51 planned ADRs cite an existing path,
  # almost always as prior art, and the two drifted ADRs cite none of their own
  # artifacts, so that probe would not have caught the defect it was written for.
  # EXCEPTIONS are checked both ways; a stale one is reported.
  - id: adr-delivery-evidence
    name: "ADR delivery-status is not contradicted by an enforced gate (ADR-0253)"
    group: gitops
    mode: enforced
    rationale: >-
      DIGEST.md is what a reviewer, an auditor or an agent reads instead of the 1.6 MB ADR
      fleet, and check-adr-registry.sh validates its schema, not the truth of the value —
      `planned` over shipped code is a well-formed lie. It happened twice unseen (#5602;
      ADR-0237 sat `planned` while its own adoption gate was enforced).
    review_after: "2027-02-19"
    min_subjects: 100   # 147 enforced gates in the manifest today (2026-08-19)
    selftest: |
      python3 .github/scripts/check-adr-delivery-evidence.py --self-test
    run: |
      python3 .github/scripts/check-adr-delivery-evidence.py --root .

  # ==== gitops =========================================================
  # Issue #3345 / ADR-0237: every domain @Scheduled job registers the ADR-0160
  # mechanism-3 liveness gauge. ENFORCED as of #3931, ahead of the 2026-09-30
  # target — a baseline ratchet, not a sweep gate: the 16 files still without a
  # heartbeat are grandfathered in the producer's BASELINE, and only two things
  # are red — a NEW domain @Scheduled job with no registerWorkflowLiveness, and a
  # baseline entry that HEALED without being removed. Both directions, so the list
  # cannot rot either way. rules.yaml: scheduled_methods.liveness_adoption.
  #
  # Why the mode had to move: the script already returned 1 on both of those
  # branches, and `mode: advisory` converted it to a warning at the runner
  # (run-gates.py:333-338). So the ratchet's forward half never blocked — #3875
  # merged a heartbeat-less ConversationRetentionScheduler on the day the gate
  # reported it, and account-service's SavingsProposalExpiryScheduler followed it
  # in the same way. A ratchet whose forward half does not block is not a ratchet.
  - id: scheduler-liveness-adoption
    name: "scheduler liveness adoption (ADR-0237)"
    group: gitops
    mode: enforced
    selftest: |
      python3 .github/scripts/check-scheduler-liveness.py --self-test
    run: |
      python3 .github/scripts/check-scheduler-liveness.py --root .

  # Issue #3344: every deployed image pin must be a `sandbox-<sha>` tag on a module
  # that has a release axis (version.txt). This is the DECLARATION half of the
  # deployed==main drift watch — deterministic, offline, blocking; the daily drift
  # comparison itself escalates via deploy-drift-watch.yml and never gates a merge.
  # Without this half, a hand-set tag (`latest`, `sandbox-sec1`) would make the
  # scheduled watch blind for that service while the repo reports green.
  # issue #6231: the supersede script decides which deploy PRs to CLOSE, and it used to decide by
  # PR creation time. A slower build opens a later PR for an OLDER commit, so on 2026-08-21 it closed
  # #6222 (`579dda8e`) in favour of #6225 (`a9e9d082`, an ancestor of it) and stranded the newer code
  # with every job green. It now decides by ancestry and FAILS the step when the surviving PR is the
  # ancestor. Nothing in CI executes that script — it only runs inside auto-deploy against live PRs —
  # so its own self-test is the only place its RED is reachable before it acts on real PRs. Case 1 is
  # the #6231 interleaving and must exit non-zero; case 2 is the ordinary supersede and must still
  # close the older PR, so a fail-everything script does not satisfy it either.
  - id: supersede-deploy-prs-ancestry
    selftest_exempt: "is-a-test-suite — the run: IS supersede-deploy-prs.sh --self-test"
    name: "supersede-deploy-prs decides by ancestry, not recency (issue #6231)"
    group: gitops
    mode: enforced
    rationale: >-
      A slower build opens a later deploy PR for an OLDER commit. Deciding which PR to close by
      creation time instead of ancestry closed #6222 in favour of an ancestor PR on 2026-08-21 and
      stranded newer code with every job green (issue #6231). This gate is the only place that
      defect's fix can go red before it acts on a real PR — the script itself only runs inside
      auto-deploy against live PRs, never in ordinary CI.
    review_after: "2027-02-19"
    run: |
      bash .github/scripts/supersede-deploy-prs.sh --self-test

  - id: deploy-drift-declaration
    name: "deployed image pins name a commit (issue #3344, enforced)"
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-deploy-drift.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-deploy-drift.py --root . --offline

  # ADR-0081 / issue #854 step 4: NetworkPolicies are DERIVED data (DO NOT
  # EDIT — generated by gen-network-policies.py from the declared GitOps
  # edges). Re-run the generator and fail on any uncommitted diff so that a
  # new cross-namespace call or a new service added to gitops/components/
  # automatically surfaces a required regeneration.
  # PyYAML is not stdlib: try multiple install paths for portability across
  # macOS (system python3 without pip, Homebrew pip3) and Linux ARC runners
  # (pip/pip3 not in PATH). Fall back to checking if pyyaml is already present.
  - id: litellm-model-costs
    name: every gateway model declares a per-token price (an unpriced model costs $0 and voids every budget)
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-litellm-model-costs.py --self-test
    selftest_expect: pass
    run: |
      # Falsified both ways before wiring in: 4 findings against the unpriced tree, 0 after,
      # 9 self-test cases including an explicit zero (which must NOT be treated as a price).
      python3 .github/scripts/check-litellm-model-costs.py --enforce

  - id: untrusted-pg-extension
    name: "an untrusted CREATE EXTENSION needs a CNPG Database resource (works local, crashloops deployed)"
    group: data
    mode: enforced
    min_subjects: 1   # 1 untrusted CREATE EXTENSION site today (copilot V3, pgvector)
    rationale: "A migration creating an untrusted extension passes every local path (all of which connect as superuser) and crashloops only in the cluster, where CNPG hands the app a non-superuser role — the diff gives no hint that the difference is the connecting role."
    review_after: "2027-02-19"
    selftest: python3 .github/scripts/check-untrusted-pg-extension.py --self-test
    selftest_expect: pass
    run: |
      # Measured, not assumed (ADR-0265): against ghcr.io/cloudnative-pg/postgresql:18.1 the
      # database OWNER gets 'permission denied to create extension "vector"' and the superuser
      # gets CREATE EXTENSION. Every local path (Dev Services, PostgreSQLContainer, compose)
      # connects as superuser, so this class of defect is green everywhere except the cluster.
      # 8 self-test cases, both directions, including prose-in-a-comment near-misses.
      python3 .github/scripts/check-untrusted-pg-extension.py --enforce

  - id: litellm-config-revision
    name: "a litellm-config change bumps the pod-roll annotation (an unrolled pod keeps its old model list)"
    group: gitops
    mode: enforced
    when: pull_request
    needs_base: required
    min_subjects: 1
    rationale: "LiteLLM parses its config once at startup, so a route added without a pod roll answers 'model not found' while ArgoCD reports Synced and Healthy; the manifest asked for the bump in prose since #1919 and three routes in one week relied on someone remembering."
    review_after: "2027-02-19"
    selftest: python3 .github/scripts/check-litellm-config-revision.py --self-test
    selftest_expect: pass
    run: |
      # LiteLLM parses --config once at startup, so a ConfigMap edit alone changes nothing while
      # ArgoCD reports Synced and Healthy — the manifest has warned about this in prose since
      # #1919, and prose is not a control. The self-test also asserts the annotation regex matches
      # the REAL manifest, so the gate cannot pass by never reaching its subject.
      python3 .github/scripts/check-litellm-config-revision.py --base "${PR_DIFF_BASE}" --enforce

  - id: agent-virtual-keys
    name: every agent authenticates with its OWN LiteLLM virtual key, not the shared master key
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-agent-virtual-keys.py --self-test
    selftest_expect: pass
    budget_seconds: 30   # 7.8s in CI
    run: |
      # Falsified in both directions before it was wired in: 4 findings against the
      # pre-fix tree, 0 after, plus 7 self-test cases covering the exemption and the
      # near-misses. A gate that has only ever passed is unfalsified.
      python3 .github/scripts/check-agent-virtual-keys.py --enforce

  - id: model-residency-claims
    name: "a `sensitivity: self-hosted` model entry points in-cluster (ADR-0175 D3, issue #3599)"
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-model-residency-claims.py --self-test
    selftest_expect: pass
    run: |
      # Falsified BOTH ways before wiring in — the distinction this gate exists for is
      # routed-to-EU vs routed-ANYWHERE, and a check that cannot tell those apart is
      # worthless as a residency control.
      #   Detection: 24 self-test cases, the first being the exact defect — a `self-hosted`
      #   LABEL on `https://api.groq.com/openai/v1`. Also the underscore/mixed-case spellings
      #   ModelGateway.parseSensitivity accepts, an env placeholder with an off-cluster
      #   default, one with NO default, a userinfo smuggling attempt, and the near-misses it
      #   must NOT flag (a `hosted` entry on the same US endpoint; a typo'd sensitivity,
      #   which the Kotlin also reads as hosted).
      #   Scope: both real service shapes were fed the violation and both went red with the
      #   real path — agent-service's top-level `model-gateway` and copilot-service's nested
      #   `copilot.model-gateway`. In that state the Kotlin fail-closed test stays GREEN
      #   (a self-hosted model IS registered), which is precisely why the gate is needed.
      # LIMIT, stated so nobody reads this as more than it is: CONFIG-LEVEL only. It proves
      # the committed config cannot express an off-cluster self-hosted tier. It observes no
      # request and cannot prove the host behind an in-cluster address is EU-resident — the
      # egress NetworkPolicy is what constrains that, not this.
      python3 .github/scripts/check-model-residency-claims.py --enforce

  - id: oidc-secret-convention
    name: "the OIDC client secret is read from ONE KV entry (issue #3485, enforced, baseline-ratcheted)"
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-oidc-secret-convention.py --self-test
    selftest_expect: pass
    budget_seconds: 30   # 14.5s in CI before #4344, ~5s after
    run: |
      # Falsified BOTH ways before wiring in. Detection: 13 cases including the exact #3471
      # defect (a per-service key nobody wrote), a baselined path that migrated (reported
      # stale), and a baselined path pointing at a THIRD key (still a violation). Scope: the
      # gate prints how many manifests it walked and how many projections it found — 531 and
      # 39 today — because a gate is green two independent ways and "it never opened the
      # file" is the one a passing exit code hides.
      python3 .github/scripts/check-oidc-secret-convention.py --enforce

  - id: single-replica-rollout-strategy
    name: "one-replica workloads declare their rollout strategy AND their canary is realisable (issues #3545/#3806, enforced, baseline-ratcheted)"
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-single-replica-rollout-strategy.py --self-test
    selftest_expect: pass
    budget_seconds: 30   # 15.2s in CI before #4344, ~5s after
    run: |
      # Two independent questions over the same manifests. The first is #3545: did the workload
      # SAY what it wants, or inherit maxSurge 1 / maxUnavailable 0 by accident. The second is
      # #3806: a canary block counted as "declared" and stopped there, which is how 21 of 21
      # canary Rollouts (17 money-path) declaring `setWeight: 10` on ONE replica were never
      # findings — without trafficRouting a weight is pods-out-of-pods, so one pod expresses 0 or
      # 100 and nothing else, while status.phase reads Healthy throughout. Separate baselines:
      # #3545's is empty on purpose and must stay that way.
      python3 .github/scripts/check-single-replica-rollout-strategy.py --enforce \
        --baseline .github/single-replica-rollout-strategy-baseline.txt \
        --canary-baseline .github/canary-rollout-realisable-baseline.txt

  - id: gen-network-policies-drift-gate
    name: "gen-network-policies drift gate (ADR-0081, issue #854)"
    group: gitops
    mode: enforced
    budget_seconds: 30   # 7.6s in CI
    selftest: python3 openbank-infra/scripts/gen-network-policies.py --self-test
    selftest_expect: pass
    run: |
      # PyYAML is a SHARD prerequisite, not this gate's: run-gates.py imports it, so the
      # hash-pinned install that used to sit here now runs once per shard in ci.yml before
      # any gate does. Installing it 8 times — once per shard — is the cost of sharding;
      # installing it once per GATE, as this step did, was never the intent.
      python3 openbank-infra/scripts/gen-network-policies.py
      # `git diff` only inspects TRACKED files, so a policy the generator emits for a
      # brand-new component that has never had one committed is UNTRACKED and therefore
      # structurally invisible to the gate — it could only ever fail on a *modification*
      # to an already-committed policy. That blind spot is how the `analytics` namespace
      # shipped with no NetworkPolicy at all (issue #2064). `--intent-to-add` registers
      # the untracked output in the index so `git diff` reports it as an addition, which
      # makes "the generated file was never created" a first-class drift failure.
      git add -A --intent-to-add openbank-infra/gitops/components/
      if ! git diff --exit-code openbank-infra/gitops/components/; then
        echo "::error::NetworkPolicy drift detected — run openbank-infra/scripts/gen-network-policies.py and commit the result (a new file listed above means a namespace has no committed policy)."
        exit 1
      fi

  # The drift gate above proves the committed policies match what the generator
  # DERIVES. It cannot say anything about what the generator cannot SEE: a
  # cross-namespace URL that lives only in a Kotlin @ConfigProperty default or a
  # service's own application.yaml yields no edge, so the caller's namespace is
  # silently absent from the callee's allow-list. That hole is why #2691 is a staged
  # rollout rather than one default-deny PR — a blanket baseline would drop flows
  # nobody has enumerated. This gate IS the enumeration, and it ratchets: today's
  # four entries are baselined in the checker with the reason each is there, a new
  # one fails at PR time, and a fixed one must leave the baseline.
  # Procedure and the cluster-side half: docs/runbooks/0010-networkpolicy-default-deny-measurement.md
  - id: network-policy-code-edges
    name: "code-only cross-namespace edges (issue #2691 stage 1, enforced)"
    group: gitops
    mode: enforced
    selftest: |
      python3 .github/scripts/check-network-policy-code-edges.py --self-test
    run: |
      python3 .github/scripts/check-network-policy-code-edges.py

  # Two implementations of the production-readiness scorecard both ship — the Python one via
  # build-push-admin-ui.sh, the Node one via `prebuild`/admin-ui-deploy.yml, because the admin-ui
  # build image has no python3. They drifted to 20-of-44 services scored differently (17 GO vs
  # 11 GO for the same repo on the same day), each side carrying corrections the other lacked,
  # and nothing compared them. The equivalence is what gets enforced, since the duplicate cannot
  # be deleted and hand-auditing it is exactly what failed. ENFORCED.
  - id: readiness-collectors-agree
    name: "prod-readiness collectors agree (Python vs Node, enforced)"
    group: gitops
    mode: enforced
    rationale: >-
      Two implementations of the readiness scorecard both ship and cannot be merged into one
      (no python3 in the admin-ui build image); they had already drifted to 20 of 44 services
      scored differently, so their equivalence is enforced rather than hand-audited.
    review_after: 2027-02-19
    selftest: |
      python3 .github/scripts/check-readiness-collectors-agree.py --self-test
    min_subjects: 40   # 44 services scored today (2026-08-19)
    run: |
      python3 .github/scripts/check-readiness-collectors-agree.py
  # A JPA property in a service with no physical-naming-strategy maps to a column that is the
  # property name folded to lower case — `createdAt` -> `createdat` — while every migration in this
  # repo writes `created_at`. The mapping is then wrong for every multi-word property and right for
  # every single-word one, so the class looks internally consistent and reviews clean.
  #
  # consent-service's SuppressionEntity shipped that way: six of ten columns wrong, and
  # GET /api/v1/suppressions/party/{partyId} answered 500 on EVERY call from the day it shipped.
  # Nothing could see it — unit tests mock the repository so no SQL is issued, health probes do not
  # touch the table, and the two sibling entities in the same package do name their columns. It was
  # found by schemathesis fuzzing the running service, which is not a control that runs on a PR.
  #
  # Scope note: this enforces the CONVENTION (a multi-word property names its column), not a diff
  # against the DDL. Deriving "does this column exist" needs real DDL parsing — partitioned tables,
  # custom enum types, ALTER/RENAME chains — and two attempts at it produced 12 and then ~40 false
  # findings against correct code. A gate that cries wolf gets ignored. ENFORCED.
  - id: entity-column-names
    name: "JPA entity columns are named explicitly where nothing converts them (enforced)"
    group: gitops
    mode: enforced
    rationale: >-
      In a service with no physical-naming-strategy an implicit column name is the property name
      folded to lower case, which no migration in this repo ever creates; the resulting 500 is
      invisible to unit tests, health probes and review.
    review_after: 2027-02-19
    min_subjects: 100   # 147 entity classes in strategy-less services today (2026-08-19)
    selftest: |
      python3 .github/scripts/check-entity-column-names.py --self-test
    run: |
      python3 .github/scripts/check-entity-column-names.py

  # A @Provider in openbank-libs-* is registered in EVERY consumer, and ArC loads its type
  # closure at init — so naming a type from a `compileOnly` dependency is a boot failure for
  # every service that lacks it, not a compile error for anyone. #6240 did exactly that with
  # Hibernate types and took down agent-service, analytics-sink and ap2-service before
  # d24c84374 stripped the annotations.
  #
  # The rule was already written down, five lines above where the defect was added, and the
  # author read it and added the defect anyway. That is the specific case for a gate rather
  # than a comment. ENFORCED, and clean at 10 subjects today, so it is a ratchet and not a
  # backlog.
  - id: provider-type-classpath
    name: "shared-library @Provider names only types every consumer has (enforced)"
    group: lint
    mode: enforced
    rationale: >-
      A @Provider in a shared library is registered in every consumer and ArC loads its type
      closure at init, so a type from a compileOnly dependency crashes every service without
      that dependency — measured on three services in #6240.
    review_after: 2027-02-22
    min_subjects: 8   # 10 typed JAX-RS providers in openbank-libs-* today (2026-08-22)
    selftest: |
      python3 .github/scripts/check-provider-type-classpath.py --self-test
    run: |
      python3 .github/scripts/check-provider-type-classpath.py

  - id: podmonitor-namespace-coverage
    name: "PodMonitor namespace coverage (issue #2255, enforced)"
    group: gitops
    mode: enforced
    selftest: |
      python3 .github/scripts/check-podmonitor-namespace-coverage.py --self-test
    min_subjects: 18   # 38 namespaces running workloads today (2026-08-09)
    run: |
      python3 .github/scripts/check-podmonitor-namespace-coverage.py

  # The Temporal registration Job's NAMESPACES list is hand-written, and it has now been the
  # thing that drifted THREE times (settlement, campaign, lending). A missing namespace is
  # invisible to every signal that is normally checked: the worker connects fine and only the
  # POLL is refused, so the pod stays Ready, ArgoCD stays Synced/Healthy, and the service simply
  # never runs a workflow — lending burned ~2,000 ERROR lines/hour into Loki for the whole time,
  # with no origination possible. The checker derives the required set from the gitops
  # OPENBANK_TEMPORAL_NAMESPACE env (which wins) falling back to the application.yaml default,
  # so the list can no longer be shorter than reality without going red. ENFORCED.
  - id: temporal-namespace-registration
    name: "Temporal namespaces a worker polls are registered (enforced)"
    group: gitops
    mode: enforced
    selftest: |
      python3 .github/scripts/check-temporal-namespace-registration.py --self-test
    run: |
      python3 .github/scripts/check-temporal-namespace-registration.py

  # --since scopes the EXPENSIVE half (pull ~100 MB + boot Loki, ~90 s) to PRs that can
  # actually invalidate it. This job is unconditional and required, so an unscoped run charged
  # every PR in the fleet 90 s for a check about files it did not touch. Direct cost is $0
  # (public repo, GitHub-hosted runners), but 90 s on a required check is 90 s every
  # contributor waits on every PR. The STEP still runs unconditionally and prints whether it
  # loaded or skipped and why — a step that silently no-ops reads exactly like one that passed.
  # #5736 / PR #6041. `AiCallErrorRateHigh` was loaded, `health=ok` and evaluating correctly
  # throughout an 8h40m total outage, and never fired: Prometheus's own ALERTS series has 44
  # points at `pending` and zero at `firing`. Its `rate(...[15m])` window is shorter than its
  # subject's 30-minute invocation period, so the counter increments once per window and the
  # ratio decays before `for: 15m` matures — a property of the CALLER, not of the rule, which
  # is why no threshold tuning could ever have fixed it and why promtool, rule health and a
  # green ArgoCD all agreed nothing was wrong. The same file also catches a ratio that is
  # blind in the total-failure case, because a route that never succeeded has no
  # `outcome="success"` series and the arithmetic then yields nothing rather than 0%.
  # Scope is every windowed alert rule; the subject cadences are DERIVED from @Scheduled
  # methods, CronJob manifests and agent charters, never a hand-kept list. ENFORCED.
  - id: alert-window-vs-subject-period
    name: "alert window accommodates its subject's period (#5736, enforced)"
    group: gitops
    mode: enforced
    rationale: >-
      An alert whose rate window is no wider than its subject's invocation period cannot ever
      mature its `for:`, and every signal a human would check says the rule is fine — loaded,
      `health=ok`, promtool-clean, ArgoCD green. `AiCallErrorRateHigh` sat `pending` for the
      whole 8h40m of #5736 and never once reached `firing`; the fix is a property of the
      caller, not a threshold, so nothing tuned it back into existence.
    review_after: "2027-02-19"
    min_subjects: 90   # 121 alert rules in the gitops PrometheusRules today (2026-08-20)
    selftest: |
      python3 .github/scripts/check-alert-window-vs-subject-period.py --self-test
    run: |
      python3 .github/scripts/check-alert-window-vs-subject-period.py --enforce

  # A route prefix moves Alertmanager's WHOLE HTTP surface, /api/v2/alerts included, so a
  # hand-configured client pointed at the bare service URL posts every notification into a 404
  # and drops it. ENFORCED.
  - id: alertmanager-url-route-prefix
    name: "Alertmanager URL carries the route prefix it serves under (enforced)"
    group: gitops
    mode: enforced
    rationale: >-
      Measured live 2026-08-21, the first time a Loki rule ever fired in this estate: the ruler
      reported `state: firing` while Alertmanager held zero such alerts, and
      loki_prometheus_notifications_errors_total equalled sent_total exactly — 10 of 10 dropped.
      A firing rule that 404s at delivery is indistinguishable from a rule that never fired on
      every dashboard here. A comment was not enough: apps/kube-prometheus-stack.yaml already
      said "routePrefix moves the whole HTTP surface, INCLUDING /api/v2/alerts" eleven lines
      above the value, and the change adding the ruler's URL still wrote the bare one.
    review_after: "2027-02-21"
    min_subjects: 1   # only the Loki ruler is hand-configured today; operator-managed
                      # Prometheus gets its pathPrefix from alertingEndpoints and is not a subject
    selftest: |
      python3 .github/scripts/check-alertmanager-url-route-prefix.py --selftest
    run: |
      python3 .github/scripts/check-alertmanager-url-route-prefix.py
  # Loki logs every query it serves, query text included, so a rule that greps for a literal
  # over an unpinned namespace matches its own evaluation and fires forever. ENFORCED.
  - id: loki-rule-self-match
    name: "no Loki rule matches Loki's own query log (enforced)"
    group: gitops
    mode: enforced
    rationale: >-
      Measured 2026-08-21, minutes after the ruler evaluated a rule for the first time in this
      estate: all three unscoped rules in loki-rules-silent-failures.yaml were firing and all
      three were false positives, every matching line coming from pod=loki-0. Those are the
      alerts for a dead scheduler, a service that failed to boot, and the Panache assigned-@Id
      defect — the sharpest detectors here, all guaranteed to cry wolf the moment delivery
      worked. Excluding the ruler component is not enough: the query frontend logs the same text
      for any Grafana panel mentioning the literal, so 66 of 78 lines survived that filter.
    review_after: "2027-02-21"
    min_subjects: 4   # 5 line-filtered selectors today (2026-08-21); the Falco pair is safe by
                      # namespace pinning and must stay counted, not skipped
    selftest: |
      python3 .github/scripts/check-loki-rule-self-match.py --selftest
    run: |
      python3 .github/scripts/check-loki-rule-self-match.py

  - id: loki-rule-load-test
    name: "Loki rule load test (enforced)"
    group: gitops
    mode: enforced
    selftest: |
      # Scoped by --since exactly as the gate is (#3074): the self-test boots the same real
      # ruler, so leaving it unscoped would have kept charging every PR the ~90 s the gate
      # itself no longer costs them.
      git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" --no-tags || true
      python3 .github/scripts/check-loki-rules.py --self-test --since "origin/${BASE_REF}"
    run: |
      # $BASE_REF is exported by the shard in ci.yml. A ${{ }} expression cannot appear in
      # this file: nothing expands it outside the workflow, so bash sees the literal text
      # and dies with "bad substitution" (run-gates.py now refuses to load one at all).
      git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" --no-tags || true
      python3 .github/scripts/check-loki-rules.py --since "origin/${BASE_REF}"

  # issue #2255. docs/runbooks/svc-*.md are GENERATED from governance.yaml + the gitops
  # manifests, and nothing checked them, so 25 of 30 had silently gone stale: they told
  # an on-call engineer "DR is not achievable today — no backup configured" for services
  # whose CNPG backups had since been enabled. A generated artifact with no drift gate is
  # not documentation, it is a claim nobody is accountable for. Same shape as the
  # NetworkPolicy gate above, including --intent-to-add so a NEW service with no
  # committed runbook fails as an addition rather than being invisible to `git diff`.
  - id: service-runbook-drift
    name: "service runbook drift (issue #2255, enforced)"
    group: gitops
    mode: enforced
    selftest: python3 openbank-infra/scripts/generate-service-runbooks.py --self-test
    selftest_expect: pass
    run: |
      python3 openbank-infra/scripts/generate-service-runbooks.py --force
      git add -A --intent-to-add docs/runbooks/
      if ! git diff --exit-code docs/runbooks/; then
        echo "::error::Service runbook drift — run 'python3 openbank-infra/scripts/generate-service-runbooks.py --force' and commit the result (a new file listed above means a service has no committed runbook). Never hand-edit a generated runbook."
        exit 1
      fi

  # gitops ref-integrity guard (rules.yaml: gitops_ref_integrity). The layer below
  # deploy-coverage: that one proves a service gets BUILT, this one proves the manifest
  # it deploys can actually START. A secretKeyRef to a Secret nobody declares passes
  # YAML validation, ArgoCD sync and Kyverno admission alike — the pod then sits in
  # CreateContainerConfigError forever with no signal but `kubectl describe`. vop-service
  # burned an hour on exactly this (#1232) right after #1229 fixed its ALL_SERVICES gap.
  # issue #2929 — four services mint an OIDC client_credentials token at startup, and the client
  # secret they read was never provisioned. The three halves of the wiring live in three separate
  # artifacts (the service's config names a secret, an ExternalSecret must create it, and the
  # Keycloak realm must define the client), so nothing compared them and each looked fine alone.
  # All three are committed, so this needs no cluster access.
  #
  # --selftest runs first on purpose: a gate whose failure path has never executed is unfalsified,
  # and this one's red is the only thing standing between a missing secret and a service that
  # authenticates as nobody.
  - id: oidc-client-secret-wiring
    name: "OIDC client secret wiring (issue #2929, enforced)"
    group: gitops
    mode: enforced
    # In the `selftest:` field, not folded into `run:`. Chaining them inside `run:` still executes
    # the harness, but it gives up the two things the field buys: the runner no longer SKIPS the
    # gate when the self-test verdict is wrong (a gate whose falsification is broken would still
    # report a verdict), and `selftest_expect` has nothing to attach to. It also stops this
    # manifest being able to answer "which gates are falsifiable". Default
    # `selftest_expect: pass`: the command is the checker's own harness, which exits 0 when it has
    # proved the gate's red is reachable.
    selftest: |
      python3 .github/scripts/check-oidc-client-secret-wiring.py --selftest
    run: |
      python3 .github/scripts/check-oidc-client-secret-wiring.py --enforce

  # A GitOps config that DECLARES a messaging channel must not deploy ahead of an image
  # that can SERVE it. openbank-card-issuance-service died at boot for an hour on
  # 2026-08-02 — money-path — with SRMSG00071, because the msg-override ConfigMap carried
  # `mp.messaging.incoming.delegation-events-in.*` while the pinned image was eight days
  # older and had no `connector:` for that channel. Both halves were correct on main and
  # every gate was green; they simply reached the cluster at different times, because the
  # deploy gate was blocked while GitOps flowed unimpeded. SmallRye treats a declared
  # channel with no connector as a HARD BOOT FAILURE, so this does not degrade a service,
  # it stops it starting. Checkable offline because the image tag IS a git sha.
  - id: msg-channel-image-parity
    name: "messaging channel is servable by the image actually deployed (SRMSG00071)"
    group: gitops
    mode: enforced
    selftest: |
      python3 .github/scripts/check-msg-channel-image-parity.py --self-test
    budget_seconds: 40   # 9.2s in CI — network-bound, GitHub contents API
    run: |
      python3 .github/scripts/check-msg-channel-image-parity.py

  - id: gitops-ref-integrity-guard
    name: "gitops ref-integrity guard (referenced Secret/ConfigMap => declared)"
    group: gitops
    mode: enforced
    budget_seconds: 30   # 7.3s in CI
    selftest: python3 .github/scripts/check-gitops-secret-refs.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-gitops-secret-refs.py

  # The in-cluster twin of external-feed-declaration-drift: a hostname naming another Service in
  # this cluster is stubbed by the unit test, overridden to localhost by the IT and never sent by
  # a consumer pact, so it is wrong only once a pod dials it. openbank-analytics-sink pointed at
  # "schema-registry:8081" for the life of the service; the Service is apicurio-registry:8080 in
  # `messaging` (issue #1916). Needs no network: the resolvable set is fully declared in gitops.
  #
  # ENFORCED since #3931, which drained the 6 pre-existing findings. The advisory note that stood
  # here claimed all six were dead defaults "on services whose pods override them by env" — that
  # was true of only THREE (account-service ×2, card-issuance ×1). The other three were live:
  # settlement-service's Rollout and onboarding-service's Deployment carried no *_SERVICE_URL at
  # all, so `openbank-balance-service:8080` / `openbank-ledger-service:8080` /
  # `openbank-party-service:8090` were the EFFECTIVE values in the cluster — names that resolve
  # nowhere, on wrong ports (8103 / 8101 / 8111). The triage note was written from the shape of
  # the findings rather than from the deployed manifests, and being advisory is what let it sit.
  # Generalize: an advisory gate's "these are all benign" note is itself an unverified claim, and
  # advisory mode removes the pressure that would have checked it.
  - id: incluster-hostname-resolution
    name: "in-cluster hostnames resolve to a declared Service (issue #1916, enforced)"
    group: gitops
    mode: enforced
    selftest: |
      python3 .github/scripts/check-incluster-hostnames.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-incluster-hostnames.py --enforce

  # rules.yaml event_change / ADR-0006: schema-compat gate. The fleet's event
  # A CNPG cluster gets its S3 backup credentials from an EKS Pod Identity association in
  # db-backups.tf, granted per (namespace, serviceAccount). That list is maintained by hand
  # and nothing linked it to the gitops manifests, so a new database could declare
  # `barmanObjectStore` + `inheritFromIAMRole: true`, report Ready and Healthy, and silently
  # never back up — there is no failure until someone needs a restore. Three clusters were
  # in exactly that state (issue #1444); sdd-db had been failing every WAL archive for three
  # days. NOT diff-scoped: it runs against whole repo state, because the gap is a MISSING
  # pair, and a PR that adds only the gitops half would not touch the .tf side at all.
  #
  # ENFORCED since 2026-08-02, and the reason is that advisory demonstrably did not work: on
  # that day delegation-db shipped in exactly this state, the gate printed the warning naming
  # the cluster and the one-line fix, and the change merged anyway. That is the fourth
  # occurrence of a defect this gate was built to end.
  #
  # An advisory verdict is right where a human still has judgement to exercise. Here there is
  # none left: "this database declares a backup and cannot possibly authenticate to perform
  # it" is not a style opinion, it is a database with no recovery point, and the failure is
  # invisible until someone needs a restore. Advisory only made it mergeable.
  #
  # Scope note — `mode: enforced` ALONE is vacuous for this checker (the repo has paid for
  # that once already): it prints ::warning and exits 0 unless passed --enforce, so both
  # halves are needed and both are set below. Verified falsifiable against the real defect,
  # not a fixture: --enforce exits 1 on the unfixed tree and 0 with delegation added. The
  # goalert-db finding stays a ::warning under --enforce by design — a cluster backing up to
  # a bucket outside Terraform is a governance question with a real choice in it, which is
  # exactly where advisory belongs.
  - id: db-backup-association-gate
    name: "db-backup association gate — every backed-up CNPG cluster has pod identity (enforced)"
    group: gitops
    mode: enforced
    selftest: python3 openbank-infra/scripts/check-db-backup-associations.py --self-test
    selftest_expect: pass
    run: |
      python3 openbank-infra/scripts/check-db-backup-associations.py --enforce

  # The sibling of the gate above, for the case that gate CANNOT see.
  #
  # `check-db-backup-associations` scans for clusters that declare a `barmanObjectStore` and
  # skips the rest — `if not dest: continue`. So its subject set is "databases that asked to be
  # backed up", and a database that never asked is not a mismatched pair, so it is skipped. The
  # gate built to make an unrecoverable database visible is structurally blind to the most
  # unrecoverable kind.
  #
  # Measured against the sandbox on 2026-08-16, both directions agreeing: 59 live CNPG clusters,
  # 57 with a recovery point, 0 declared-but-unrecoverable, and 2 with no backup declared at all.
  # The enforced sibling reported clean across all of it, correctly and uselessly. The two are
  # `engagement-db` and `glitchtip-pg`; a gitops scan finds only the first, because the second is
  # deployed by a third-party chart and is outside this tree entirely — which is a real limit of
  # any gitops-scoped check and is written into the script header rather than left to be
  # discovered.
  #
  # ENFORCED since 2026-08-19. It was advisory for one specific reason, written above: enforcing
  # it would have failed every PR on a single open question — whether engagement-db should be
  # backed up or is genuinely disposable — which is an owner's decision, not a contributor's to
  # unblock. That question is now answered (backed up, same #863 pattern as the rest of the
  # fleet), the gitops-visible count is 0, and an advisory gate that has correctly named the same
  # cluster since 2026-08-16 with nothing happening is a finding nobody is required to read. The
  # exemption remains an ANNOTATION ON THE CLUSTER (`openbank.io/backup-exempt-reason`),
  # deliberately not a list kept beside the manifests: a separate list drifts from what it
  # describes and nothing notices, which is the defect this repo keeps re-finding. So a future
  # genuinely-disposable database is still one annotation away from green, and that annotation
  # sits on the thing it describes.
  - id: cnpg-backup-declared-gate
    name: "CNPG backup-declared gate — every cluster declares a backup or says why not (enforced)"
    group: gitops
    mode: enforced
    rationale: >-
      db-backup-association-gate only inspects clusters that already declare a
      barmanObjectStore, so a database that never asked to be backed up is invisible to it.
      This covers that case: no recovery point at all, which is the worse one.
    review_after: "2026-09-15"
    verified: >-
      2026-08-16 — measured against the sandbox with two independent probes that agree:
      59 live CNPG clusters, 57 with a recovery point, 0 declared-but-unrecoverable, and 2
      with no backup declared at all, while the enforced sibling reported clean across all
      of it. A gitops scan of this tree finds 58 subjects and exactly 1 of those 2
      (engagement-db); glitchtip-pg is deployed by a third-party chart and is out of reach
      of any gitops-scoped check. Self-test falsified in both directions — it fires on a
      cluster with no backup and on an empty exemption reason, and stays silent on a
      declared backup, a reasoned exemption and a non-CNPG kind: Cluster.
    min_subjects: 50
    selftest: python3 openbank-infra/scripts/check-cnpg-backup-declared.py --self-test
    selftest_expect: pass
    run: |
      python3 openbank-infra/scripts/check-cnpg-backup-declared.py

  # A probed or scraped port must be a port the service opens (issue #2872, item 1).
  #
  # Rolling campaign-service into the sandbox hit five defects that each kill the pod or its
  # readiness in the first seconds, all of them on main with every required check green. This
  # is the cheapest of them (#2870): the Deployment's probes named port 8085 and the service
  # config had no `quarkus.management` block, so nothing ever listened there.
  #
  # No existing gate could see it. `Validate manifests` lints the YAML, the service build
  # compiles and tests the code — neither reads a Deployment and a service config TOGETHER.
  # Unit tests cannot either: the management interface is disabled under `%test`, so the port
  # a test could bind is not the port production probes.
  #
  # Self-test first, and it matters here: the fleet is clean today, so the flagging branch
  # would otherwise never execute again.
  - id: probe-scrape-port-has-a-listener
    name: "probe/scrape port has a listener (issue #2872, enforced)"
    group: gitops
    mode: enforced
    selftest: python3 .github/scripts/check-probe-port-listener.py --selftest
    selftest_expect: pass
    min_subjects: 50   # 116 probed/scraped ports today (2026-08-09)
    budget_seconds: 30   # ~6s after #4340
    run: |
      python3 .github/scripts/check-probe-port-listener.py --enforce

  # ==== supplychain ====================================================
  # The fleet SBOM-attestation gate lives in the path-filtered fleet-attestation.yml, which
  # can never be a required check — so its own falsification must run somewhere
  # unconditional, and this is it. The selftest needs no registry and no credentials: it
  # drives the whole loop against a stub cosign and asserts the three exit codes, including
  # the exit-2 ("the probe could not run") branch that no PR can produce on demand by
  # summoning an ECR throttle. Without this entry the branch that #1915 added is exercised
  # only when someone edits one of five paths.
  - id: fleet-attestation-classifier
    name: "fleet-attestation gate classifies a probe failure as UNKNOWN, not as a fleet gap (issue #1915, enforced)"
    group: supplychain
    mode: enforced
    # The gate IS the harness: its `run:` is the checker's own falsification suite, so a
    # separate `selftest:` would be the same command executed twice for one signal.
    selftest_exempt: >-
      is-a-test-suite — the run: below IS the self-test. It drives the gate's whole loop
      against a stub cosign and asserts exit 0, 1 and 2, so its red is reachable by
      construction; falsified in both directions (see the run: comment).
    budget_seconds: 30   # 0.3s locally — no network, no registry
    rationale: "Without it the gate's exit-2 branch is unreachable on any PR that does not touch fleet-attestation.yml, and a probe failure silently reads as a fleet-wide supply-chain gap (#1915: one ECR throttle published as UNATTESTED against an image that verifies by hand)."
    review_after: "2027-02-14"
    # The corpus is the checker's own fixture set — its subjects are assertions, not files, so
    # the floor is the number of cases that must run. It drops the day someone deletes one.
    min_subjects: 14   # 15 today: 9 classifier + 5 end-to-end + 1 retry-count (2026-08-14)
    run: |
      # The gate IS the selftest here: the artifact under test is the classifier + exit-code
      # contract, not the fleet (verifying 62 real images needs ECR credentials this job does
      # not have, and fleet-attestation.yml + auto-deploy.yml both do that with them).
      # Falsified in both directions before wiring in: reverting the classifier's fallback to
      # the pre-#1915 shape reddens 7 cases, and changing the final `exit 2` to `exit 1`
      # reddens exactly the one case that asserts the distinction.
      .github/scripts/check-fleet-attestations.sh --self-test

  - id: license-header-consistency
    name: "License header consistency (issue #2280, enforced)"
    group: supplychain
    mode: enforced
    selftest: |
      python3 .github/scripts/check-license-headers.py --selftest
    run: |
      python3 .github/scripts/check-license-headers.py

  # Comments are stripped by every OTHER guard here on purpose, so that code-about-code does
  # not trip them (#2450). Nothing therefore checks the prose — and the prose is what a human
  # acts on. Measured cost of that in two days: a Kafka ACL header claiming the broker ran
  # `allow.everyone.if.no.acl.found=true` (it runs false; 13 outbox rows died), an
  # application.yaml naming the wrong schema-registry host AND port, and a workflow comment
  # scoping tokens to an archived repo. This gate checks only what the repo can FALSIFY: a
  # repo-root-relative path that resolves nowhere, and a JiRaska/<slug> that is archived or
  # 404. Two other candidate rules were measured and rejected — see the script header, which
  # records why, because "we did not build it" is what a later reader cannot recover.
  # Enforced from the start: origin/main was left at zero findings by this PR.
  - id: stale-comment-references
    name: "stale comment references — prose naming a missing file or dead repo (enforced)"
    group: supplychain
    mode: enforced
    selftest: |
      python3 .github/scripts/check-stale-comment-references.py --self-test
    run: |
      python3 .github/scripts/check-stale-comment-references.py --enforce

  - id: gh-repo-context-in-checkoutless-jobs
    name: "gh repo context in checkoutless jobs (issue #2841, enforced)"
    group: supplychain
    mode: enforced
    selftest: |
      python3 .github/scripts/check-gh-repo-context.py --self-test
    run: |
      python3 .github/scripts/check-gh-repo-context.py

  - id: gradle-home-isolation-on-self-hosted-runners
    name: "Gradle home isolation on self-hosted runners (enforced)"
    group: supplychain
    mode: enforced
    selftest: |
      python3 .github/scripts/check-gradle-user-home-isolation.py --self-test
    run: |
