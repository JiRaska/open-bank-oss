  # duplicate mapping key at ANY level fails the build (no silent config drop).
  - id: duplicate-yaml-key-guard
    min_subjects: 40   # 74 files today: 59 service application.yaml + 15 governance (2026-08-09)
    name: "duplicate YAML key guard (application.yaml, #1170/#1193, enforced)"
    group: data
    mode: enforced
    selftest: bash .github/scripts/check-duplicate-yaml-keys.sh --self-test
    selftest_expect: pass
    run: |
      bash .github/scripts/check-duplicate-yaml-keys.sh . --enforce

  # Guard a different silent config footgun in the same files: quarkus-config-yaml
  # unconditionally quotes any mp.messaging.(incoming|outgoing).<channel> leaf key
  # that contains a literal dot (group.id, auto.offset.reset, dead-letter-queue.topic,
  # ...) when registering it as a MicroProfile Config property name — Quarkus's Kafka
  # connector getters read the plain unquoted key, so the value silently falls back to
  # a default. For group.id this becomes a silent Kafka GroupAuthorizationException if
  # the fallback (quarkus.application.name) isn't ACL-granted; for auto.offset.reset it
  # silently skips backlogged messages on first boot. Root-caused via the
  # openbank-fraud-service boot-crash; a fleet audit (#686) found it live (not just
  # latent) in audit/notification/kyc/onboarding/card-issuance/agent-service, and this
  # script additionally finds it in several services never audited by hand. Fix: move
  # the value to an MP_MESSAGING_INCOMING_<CHANNEL>_<KEY> env var in gitops instead.
  #
  # ADVISORY. Unlike the duplicate-key guard above, the fleet is NOT yet clean here —
  # this pattern predates the guard across most of the fleet. Flip to --enforce once
  # #686's sweep + any follow-on services are confirmed clean.
  - id: dotted-mp-messaging-key-guard
    name: "dotted mp.messaging key guard (application.yaml, #686, advisory)"
    group: data
    mode: advisory
    verified: "2026-08-09 — fleet still not clean per #686; no target date set for --enforce yet"
    selftest: bash .github/scripts/check-dotted-mp-messaging-keys.sh --self-test
    selftest_expect: pass
    run: |
      bash .github/scripts/check-dotted-mp-messaging-keys.sh .

  # ENFORCED after the 2026-08-15 ADR-0144 graduation target: a migration must
  # carry a rollback note and never edit an applied checksum.
  # Covers BOTH halves of db_change.require: an added migration carries a
  # `-- Rollback:` note, and an already-committed migration is not edited
  # (Flyway checksums the whole file — an edit to an applied migration fails
  # startup with `checksum mismatch`). PR-only and diff-scoped against the
  # resolved PR diff base, same as api-contract above.
  - id: db-migration-gate
    name: "db-migration gate — rollback note + forward-only (rules.yaml db_change, enforced)"
    group: data
    mode: enforced
    verified: "2026-08-16 — producer self-test and enforced PR-diff mode pass"
    when: pull_request
    needs_base: required
    selftest: python3 openbank-infra/scripts/check-db-migration.py --self-test
    selftest_expect: pass
    run: |
      python3 openbank-infra/scripts/check-db-migration.py --base "${PR_DIFF_BASE}" --enforce

  # contract is the set of Kotlin data classes extending DomainEvent (JSON on
  # Kafka via the outbox; no .avsc files exist yet — the script covers those
  # too for the ADR-0006 Apicurio target state). DIFF-SCOPED: compares each
  # changed event class's ctor properties against the PR base and flags
  # removed/renamed props, type changes, non-nullable-no-default additions
  # (replay break) and eventType renames. A breaking change ships as a NEW
  # versioned event (-vN topic, ADR-0006), never an in-place edit.
  # ADR-0260 (2026-08-16) adds a third input: */schema/*.schema.json files, JSON Schema being
  # the format ADR-0260 picked over Avro. This is the ONLY path that can evaluate a producer
  # whose event class does not extend DomainEvent — openbank-document-service's
  # DocumentGenerated/SignatureCeremonyCompleted, the ADR-0260 pilot, are exactly that case.
  # ADVISORY until the rules.yaml schema-compat gate graduates
  # (target 2026-09-15, ADR-0144) — flip = --enforce. stdlib-only.
  # ADR-0006 ratchet (#1916). Measured at introduction: 36 producer topics, 71 eventType literals,
  # ZERO .avsc, zero asyncapi.yaml, no openbank-contracts/ directory. Since then two contracts have
  # been written (delegation, notification) and the tree now measures 38 producer pairs across 32
  # services / 36 distinct topics, 2 contracted and 36 grandfathered. The .avsc count is still ZERO
  # and no topic has a registered schema: the Apicurio registry the ADR calls for is deployed and
  # running, so the runtime half exists and the contract half does not, and every Kafka event on
  # this platform is still raw unversioned JSON.
  #
  # Distinct from `schema-compat-gate` above, which checks that an event class does not change
  # incompatibly. Nothing checked whether an event has a declared contract at all.
  #
  # Closing that is a multi-PR programme (#1916 sets the order). This does not attempt it. It
  # freezes the debt: what exists is grandfathered in .github/event-contract-baseline.txt and
  # nothing NEW joins it — the same baseline-ratchet used for domain purity and detekt. The gap was
  # growing; two new services added unversioned topics in one week.
  #
  # The baseline is checked in BOTH directions, so a line cannot outlive the debt it records.
  - id: event-contract-coverage-ratchet
    name: "event-contract coverage ratchet (ADR-0006, enforced)"
    group: data
    mode: enforced
    selftest: python3 .github/scripts/check-event-contract-coverage.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-event-contract-coverage.py

  # ADR-0006, the layer the ratchet above cannot reach (#1916). The ratchet asserts a contract FILE
  # exists for a producing service; nothing asserted the file describes the code. Measured when this
  # was added: 38 producer pairs across 32 services, 36 distinct topics, 2 with an AsyncAPI contract
  # and 36 grandfathered — and ZERO topics with a schema registered in the Apicurio registry, so a
  # producer that violates its own contract fails in no environment at runtime either. Until
  # registry enforcement lands, the contract is the ONLY description of the wire format a consumer
  # author can read, which is why an undetectably wrong one is worse than an absent one.
  #
  # Checks three agreements, each in BOTH directions: channel addresses vs the topics the service
  # actually produces, message names vs the event-type literals declared in its src/main, and
  # payload properties vs the producer's field names — the primary constructor where there is a
  # data class, and the `mapOf`/`buildMap`/JSON-template construction site where there is not
  # (that half was previously skipped, so a hand-built producer got no payload check at all).
  # Names only —
  # types are deliberately out of scope (a Kotlin type maps to a JSON Schema type through Jackson,
  # and modelling that badly is worse than not modelling it); schema-compat-gate below owns types,
  # where it compares like against like across the PR base.
  #
  # ENFORCED with no baseline, because it has no debt to record: both contracts in the tree agree
  # with their code today. An advisory over a claim that is checkable against reality is the
  # ADR-0071 contradiction — there is no judgement left to exercise.
  - id: event-contract-code-agreement
    name: "event contract vs code agreement (ADR-0006, enforced)"
    group: data
    mode: enforced
    rationale: "A published event schema that drifts from its producer data class gives consumers a contract the running service cannot emit."
    review_after: "2027-02-13"
    min_subjects: 2
    selftest: |
      python3 .github/scripts/check-event-contract-code-agreement.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-event-contract-code-agreement.py

  # The PUBLISHED fleet-wide event document (#4761). `docs/asyncapi/openbank-events.yaml` is linked
  # from the admin-ui developer-docs page, and until this gate NOTHING under `.github/` read it —
  # the two ADR-0006 gates above scope to `openbank-contracts/`, so this file had never been
  # validated against a producer in its life. It had drifted accordingly: 18 of 21 payload schemas
  # asserted `eventType` as a BODY field, which is false for the 27-of-29 outbox-relayed producers
  # (the dispatcher moves it to the `ce-type` Kafka header), and 15 of its 23 channel addresses
  # named topics no service produces or consumes at all.
  #
  # That is not a cosmetic drift. A consumer author who follows the published schema writes
  # `node.path("eventType")`, gets "", takes a quiet `?: return`, and discards 100% of messages with
  # no error and no log — the failure state is indistinguishable from success at every layer. It
  # blocked #1035 for four weeks on the sanctions channel.
  #
  # Checks: (A) every channel address is a topic some service actually speaks, derived from
  # `mp.messaging.outgoing|incoming.*.topic` (and the `topics:` fan-in idiom audit-service uses);
  # (B) every channel says where its discriminator lives — `ce-type` or `direct emitter`; (C) a
  # channel claiming the header must not also declare a body `eventType`, resolved through
  # `allOf`/`$ref` so inheriting EventEnvelope counts.
  #
  # It deliberately does NOT check the payload field set, and that is a limitation of the source,
  # not of the effort: an outbox-relayed producer serialises the AGGREGATE, so there is no
  # constructor at the call site and no literal JSON key anywhere in the tree — the same blind spot
  # that makes event-contract-code-agreement structurally unable to cover these producers. The true
  # field set needs a captured message or a registered wire schema (#1916; Apicurio is deployed,
  # healthy, and holds zero artifacts). Retire this gate together with the document when #1916
  # supersedes it with `openbank-contracts/`.
  - id: asyncapi-doc-discriminator
    name: "published AsyncAPI doc — discriminator + address reality (#4761, enforced)"
    group: data
    mode: enforced
    rationale: "The published event document told consumers to read eventType from the body; it is a Kafka header for 27 of 29 producers, so a correct-looking consumer silently discards every message."
    review_after: "2027-02-15"
    min_subjects: 20
    selftest: |
      python3 .github/scripts/check-asyncapi-doc-discriminator.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-asyncapi-doc-discriminator.py

  - id: schema-compat-gate
    name: "schema-compat gate — event backward-compatibility (event_change, advisory)"
    group: data
    mode: advisory
    verified: "2026-08-09 — on track for ADR-0144's 2026-09-15 enforce target"
    when: pull_request
    needs_base: required
    selftest: python3 .github/scripts/check-event-schema-compat.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-event-schema-compat.py --base "${PR_DIFF_BASE}"

  # External public-feed declaration drift (issue #2204).
  #
  # `--offline` on purpose: this is the DRIFT half only — every third-party URL in an
  # `openbank-*/src/main/resources/application.yaml` is either declared in the watch's FEEDS
  # (so it gets probed daily) or in NOT_PROBED with a reason. No network, deterministic, ~1 s.
  # The liveness half lives in the `external-feed-watch` workflow and never gates a merge: a
  # third party having a bad day must not wedge the repo.
  #
  # The binding copy is HERE for the reason spelled out above: `external-feed-watch` is
  # path-filtered and therefore un-requireable, so its verdict is advisory in practice. What
  # this step actually buys is that adding a new external dependency to a service's config
  # cannot silently create a feed nothing ever fetches — which is exactly how the ČNB fixing
  # URL stayed a 404 for the whole life of openbank-fx-service.
  #
  # Self-test first: the matchers are what separate "a server answered 200" from "the answer
  # is the feed", and one that has only ever passed is unfalsified.
  # Kafka dotted-key ratchet (issues #686, #2945).
  #
  # A `group.id` / `auto.offset.reset` written as a YAML leaf key never reaches the connector —
  # SmallRye Config quotes any leaf key containing a dot — so the file says one thing and the
  # consumer does another, silently. Six services survive this on `group.id` only because the
  # value they wanted happens to equal `quarkus.application.name`; that coincidence dies the day
  # a service is renamed or a channel wants its own group.
  #
  # Ratchet, not a flat fail, and deliberately so: making a baselined `auto.offset.reset:
  # earliest` actually take effect re-reads the topic from the beginning, which on a money-path
  # channel is a mass replay, not a config tidy-up. Today's set is baselined with its issue; a
  # NEW occurrence fails, and a baseline entry that becomes covered is reported too, so the list
  # cannot rot in either direction.
  #
  # Self-test first: the classifier has to allow the harmless cases as well as flag the real
  # ones, and a guard that flags everything is noise nobody keeps.
  # ADR-0252 phase 0: an off-by-default adapter reporting `success = true` is indistinguishable
  # from a working one, and the disabled path is the quiet one — no error, no metric, no series
  # that disagrees. Ships with an EMPTY baseline (fleet measured clean), so its only job is that
  # the next occurrence is red at PR time rather than reported by a customer.
  - id: noop-not-success-ratchet
    name: "no-op is not success (ADR-0252 phase 0, issue #4348, enforced)"
    group: kotlin
    mode: enforced
    rationale: >-
      An off-by-default adapter that reports `success = true` is indistinguishable from a working
      one, and the disabled path is the quiet one — no error, no metric, no series that disagrees.
      notification-service counted every push as delivered in every environment without APNs
      credentials, committed the row SENT, and emitted a delivery event; it shipped that way and a
      customer reported it (#4348). Baseline is empty by measurement, so this gate is prevention
      only — recheck whether the fleet still has no occurrences, not whether debt was paid down.
    review_after: '2027-02-22'
    min_subjects: 1500
    selftest: python3 .github/scripts/check-noop-not-success.py --self-test
    selftest_expect: pass
    run: |
      python3 .github/scripts/check-noop-not-success.py --root .

