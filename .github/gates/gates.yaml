  # and the fuzz harness (#3039) got the failure. Three carried a `quarkus.flyway.datasource:`
  # MAPPING that reads as the fix and is not — that key names which datasource to use, it does
  # not define one. Decidable from one committed file, so no boot and no cluster.
  - id: flyway-default-datasource
    name: "Flyway default datasource, and migrations something actually runs (issue #3080, enforced)"
    group: data
    mode: enforced
    selftest: |
      python3 .github/scripts/check-flyway-default-datasource.py --selftest
    run: |
      python3 .github/scripts/check-flyway-default-datasource.py --enforce
  # A service that INJECTS ObjectStorePort and resolves to the Postgres backend must create the
  # table it reads (#3081). Not the 36-way "entity visible but unused" gap — that is by design and
  # inert under `database.generation: none`; this is the pairing that fails at first use, with a
  # runtime 500 and nothing before it to say so.
  - id: object-store-blobs-migration
    name: "object store blobs migration (issue #3081, enforced)"
    group: data
