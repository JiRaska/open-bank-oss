  # The governance gates in this job (threat-model coverage + diff, network-policy
  # generation, authz-coverage) are stdlib Python with committed *_test.py suites that,
  # until now, no workflow ran — a gate whose own logic is untested silently rots. Run
  # them here so a regression in a gate's parser fails the PR that introduced it.
  # BOTH script directories, not just openbank-infra/scripts: gates live in .github/scripts
  # too, and a discovery root that covers only one of them is a coverage set maintained
  # separately from the artifacts it covers — the exact shape that let 16 pacts go
  # unreplayed (#2327). Adding a *_test.py beside a gate must be enough to have it run.
  - id: governance-script-unit-tests
    selftest_exempt: "is-a-test-suite — pytest over the governance scripts"
    name: "governance-script unit tests"
    group: supplychain
    mode: enforced
    budget_seconds: 120   # a real test suite
    run: |
      python3 -m unittest discover -s openbank-infra/scripts -p '*_test.py' -v
      python3 -m unittest discover -s .github/scripts -p '*_test.py' -v

  # CLAUDE.md rule 3 / ADR-0029: a module is a released component iff it has
  # a version.txt, and must be registered in release-please-config.json AND
  # .release-please-manifest.json. stdlib-only gate; catches a new service
  # that ships a version.txt but is never wired into release-please (so it
  # silently never gets a Release PR / changelog / tag).
  - id: release-registration-consistency
    name: "release-registration consistency (rule 3, ADR-0029)"
    group: supplychain
    mode: enforced
    selftest: python3 openbank-infra/scripts/check-release-registration.py --self-test
    selftest_expect: pass
    run: |
      python3 openbank-infra/scripts/check-release-registration.py

  # rules.yaml change_requirements.release_scope_mismatch / CLAUDE.md rule 2: release-please
  # attributes a commit to a component by the FILES IT TOUCHES under that component's
  # directory, regardless of the typed scope (RELEASE.md) — so a feat/fix/perf/security PR
  # that touches a service directory only outside <service>/src/main/** (a src/test-only
  # boot smoke test, an openapi.yaml-only edit, gitops-only files) still makes release-please
  # propose a version bump for an artifact that didn't actually change. Observed live: PR #547
  # (feat(finrep): register ArgoCD Application, src/test + gitops/docs only) -> PR #551
  # (finrep-service 0.4.0). Harmless but noisy; classifies from the PR title since the squash
  # commit doesn't exist yet at PR-CI time. PR-only: no PR title to classify on a push to main.
  - id: release-scope-mismatch-gate
    name: "release-scope-mismatch gate (rules.yaml release_scope_mismatch, advisory)"
    group: supplychain
    mode: advisory
    verified: "2026-08-09 — heuristic by design (classifies from PR title before the squash commit exists); PR-only, still noisy-not-wrong, no graduation planned"
    when: pull_request
    needs_base: required
    selftest: python3 openbank-infra/scripts/check-release-scope-mismatch.py --self-test
    selftest_expect: pass
    run: |
      set -euo pipefail
      python3 openbank-infra/scripts/check-release-scope-mismatch.py \
        --title "${PR_TITLE}" --body "${PR_BODY}" --base "${PR_DIFF_BASE}"

  # admin-ui version sync guard (ADR-0029 release_invariant). release-please bumps version.txt
  # but its package.json extra-file updater is replace-based and silently desyncs after a one-off
  # drift — which otherwise only surfaces at deploy (build-push-admin-ui.sh fails post-merge).
  # This catches it at PR time instead. ENFORCED.
  - id: admin-ui-version-sync-guard
    name: "admin-ui version sync guard (version.txt == package.json, enforced)"
    group: supplychain
    mode: enforced
    selftest: bash .github/scripts/check-admin-ui-version-sync.sh --self-test
    selftest_expect: pass
    run: |
      bash .github/scripts/check-admin-ui-version-sync.sh .

  # Deploy-coverage guard (rules.yaml: deploy_coverage). auto-deploy's ALL_SERVICES is a
  # hand-maintained list that must stay in sync with release-please's package list, and
  # nothing checked that it did — so a service could be merged, released and given an
  # ArgoCD manifest while nothing ever built it. Every push then "succeeds" and deploys
  # nothing; there is no build failure because there is no build. Six instances by
  # 2026-07-16 (the 6 control agents, document-service, clearing-simulator, finrep,
  # vop), each fixed by hand and documented in an auto-deploy.yml comment. The comments
  # did not stop the seventh: analytics-sink was undeployed from 2026-07-26 to 2026-08-13
  # (#4553 / #4576) and this gate reported PASS every run, because its subject set was
  # release-please's RELEASED components — analytics-sink owns no OLTP database and cuts
  # no release (ADR-0022), so it has no version.txt and was structurally invisible to a
  # gate whose whole job is catching exactly this. Widened 2026-08-13: the subject is now
  # released components PLUS anything wearing a `sandbox-<sha>` tag, since that tag shape
  # IS auto-deploy's own output and needs no second registry to define it. The widening
  # immediately found two more (developer-portal, document-renderer) — non-Quarkus builds
  # that need real build-path work, so they are baselined rather than force-fit into the
  # Gradle fast-jar step. ENFORCED, with a shrink-only baseline for the known debt.
  - id: deploy-coverage-guard
    min_subjects: 45   # 60 deployable workloads today (2026-08-13)
    name: "deploy-coverage guard (released + sandbox-tagged => in ALL_SERVICES, enforced)"
    group: supplychain
    mode: enforced
    selftest: bash .github/scripts/check-deploy-coverage.sh --self-test
    selftest_expect: pass
    run: |
      bash .github/scripts/check-deploy-coverage.sh

  # Reconcile probe unit test (rules.yaml: deploy_reconcile, issue #2020). Guards the
  # self-heal detection that re-drives a service stranded when the one-shot per-push
  # auto-deploy run is blocked by a transient can-i-deploy verification lag. Pure git +
  # jq against a throwaway fixture repo — no Gradle, no network.
  - id: auto-deploy-reconcile-probe-unit-test
    selftest_exempt: "is-a-test-suite"
    name: "auto-deploy reconcile probe unit test"
    group: supplychain
    mode: enforced
    run: |
      bash .github/scripts/test-auto-deploy-reconcile-lag.sh

  # Offline audit-anchor verifier self-test (ADR-0031 D5, issue #5838). The gate this
  # falsifies is not a CI check on the repo — it is the tool a THIRD PARTY runs, on their own
  # machine, to decide whether OpenBank's audit log was tampered with. Nothing in CI can
  # exercise it against production data, and that is exactly why its rejection paths need a
  # home here: a verifier whose only observed behaviour is "VERIFIED" is decoration, and the
  # party it would mislead is an auditor or a regulator rather than a developer.
  #
  # The suite constructs, from a throwaway EC key and no infrastructure, the four tamperings
  # the anchors exist to catch (altered entry, deleted entry, re-ordered pair, chain gap),
  # three the anchor row itself must catch (edited row, foreign-key signature, backwards
  # re-anchor), and — the case this repo has paid for before (PushResult.skipped(), #4348) —
  # the four cases that must land on their own outcome rather than sharing one with
  # success: no anchors at all, and an unsigned anchor. One clean range is accepted, because
  # ten rejections prove nothing if the tool rejects everything.
  - id: audit-anchor-offline-verifier-unit-test
    selftest_exempt: "is-a-test-suite — the run: IS the verifier's own --self-test"
    name: "offline audit-anchor verifier self-test (ADR-0031 D5)"
    group: security
    mode: enforced
    min_subjects: 13   # 2 acceptances + 7 rejections + 4 distinct UNVERIFIABLE outcomes
    rationale: "The offline anchor verifier is the only D5 control an auditor can run without trusting the bank, and nothing in CI can exercise it against production data; its rejection paths would otherwise be code that has never run, so a tool whose only observed behaviour is VERIFIED would read as tamper-evidence while being decoration — and the party it misleads is a regulator rather than a developer."
    review_after: "2027-02-21"
    run: |
      python3 .github/scripts/verify-audit-anchors.py --self-test

  # can-i-deploy block classifier unit test (issue #2549). The reconcile probe above
  # decides WHICH stranded services to re-drive; this one decides whether a block that
  # survives the re-drive is a build-queue lag (self-clearing) or a contract regression
  # (never self-clearing, and therefore something the scheduled tick must NOT silence).
  # Its ordering case is the load-bearing one — see the file's header.
  - id: can-i-deploy-block-classifier-unit-test
    selftest_exempt: "is-a-test-suite"
    name: "can-i-deploy block classifier unit test"
    group: supplychain
    mode: enforced
    run: |
      bash .github/scripts/test-classify-can-i-deploy-block.sh

  # can-i-deploy version-selector unit test (#3082). The classifier above labels WHY a block
  # happened; this decides WHICH VERSION the gate asks about at all, and getting that wrong is
  # quieter than any block: `--latest main` on a push routinely answers about the PREVIOUS
  # build, so a green can be inherited from a commit that is not the one being deployed.
  - id: can-i-deploy-version-selector-unit-test
    selftest_exempt: "is-a-test-suite"
    name: "can-i-deploy version selector unit test"
    group: supplychain
    mode: enforced
    run: |
      bash .github/scripts/test-resolve-can-i-deploy-selector.sh

  # The CO-DEPLOY narrowing of the selector above (#5993). The shared selector's
  # `--latest main` fallback is correct per service (ADR-0092) and wrong in the atomic
  # co-deploy matrix, which asks ONE question about a whole set: a moving tag there is a
  # verdict about a later, unrelated build. The `unknown` branch — broker probe
  # inconclusive — is the fail-OPEN one: it can answer GREEN about a pair nobody is
  # deploying, with nothing red anywhere to notice. The self-test's load-bearing cases are
  # the negative controls: every probe answer that is not an exact version must REFUSE, and
  # no branch may emit a moving tag. Delegate straight to the shared selector again and
  # they go red.
  - id: can-i-deploy-codeploy-selector-unit-test
    selftest_exempt: "is-a-test-suite — the run: IS the checker's own --self-test"
    name: "can-i-deploy co-deploy version selector unit test (issue #5993, enforced)"
    group: supplychain
    mode: enforced
    rationale: "The atomic co-deploy matrix asks ONE broker question about a whole service set, so it is only meaningful when every pacticipant is pinned to the version being deployed; the shared per-service selector's documented `--latest main` fallback silently made it a verdict about whatever build currently carries the moving main tag, which can answer GREEN for a pair nobody is deploying and leaves nothing red anywhere to notice."
    review_after: "2027-02-21"
    min_subjects: 21   # 21 assertions across every probe answer the resolver can be handed
    run: |
      bash .github/scripts/resolve-codeploy-selector.sh --self-test

  # The equivalence proof that lets a reconcile deploy at all (#3432). The selector above decides
  # WHICH version to ask about; on a manual dispatch the honest answer used to be "none, refuse"
  # for every service, because no pact version can exist for a sha services-ci never built. This
  # decides whether the commit that DOES have one is byte-identical, from git alone — so it is the
  # one thing standing between a justified verdict and a borrowed one, and it is a pure function
  # with no network, which is exactly why its failure path can be exercised here.
  - id: pact-version-tree-equivalence-unit-test
    selftest_exempt: "is-a-test-suite"
    name: "pact version tree-equivalence unit test (issue #3432, enforced)"
    group: supplychain
    mode: enforced
    budget_seconds: 90   # builds 17 git trees
    run: |
      bash .github/scripts/pact-version-tree-equivalent.sh --self-test

  # The only exception to publishing a provider verification for the exact checked-out ref.
  # This tests the proof's negative paths too: a runtime/build/resources/root/libs change, a
  # sibling service change, or either revision off main cannot become a broker verification.
  - id: pact-provider-version-proof-unit-test
    selftest_exempt: "is-a-test-suite"
    name: "pact provider-version proof fails closed (enforced)"
    group: supplychain
    mode: enforced
    rationale: "An older provider version can satisfy can-i-deploy only when the verification ran against equivalent provider code; without this proof a raw dispatch input could publish a broker result for runtime that never ran."
    review_after: "2027-02-15"
    run: |
      bash .github/scripts/prove-pact-provider-version.sh --self-test

  # The broker half of #3432. It cannot be run against the real broker from a PR — no public
  # ingress (ADR-0056), PACT_BROKER_URL blanked off main-push — so what this asserts is only the
  # failure modes, against a stubbed curl: unreachable, non-2xx, unparseable, no version number,
  # a version number that is not a sha, and a well-formed sha whose trees differ. Every one must
  # degrade to `no`, which on a dispatch is #3318's REFUSE. A reconcile that cannot verify must
  # not deploy.
  - id: pact-version-probe-fail-closed-unit-test
    selftest_exempt: "is-a-test-suite"
    name: "pact version probe fails closed (issue #3432, enforced)"
    group: supplychain
    mode: enforced
    run: |
      bash .github/scripts/probe-pact-version.sh --self-test

  # The counterpart-verifiability probe (#3223). The classifier above says WHY a block
  # happened; two of its classes end in a promise ("clears within one reconcile tick",
  # "the reconcile re-drives it automatically") that was a hardcoded constant, not an
  # observation — and on run 31080511057 all six blocked money-path services carried it
