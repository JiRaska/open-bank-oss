import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest

// Bound transient allocations while hashing every resolved artifact independently.
def artifactSha256(File file) {
    def hasher = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            hasher.update(buffer, 0, count)
        }
    }
    return hasher.digest().encodeHex().toString()
}

gradle.projectsEvaluated {
    def outputDir = System.getenv('OB_PLUGIN_MODEL_DIR')
    if (!outputDir) throw new GradleException('Plugin receipt output directory required')
    def owner = rootProject
    owner.tasks.register('exportPluginMetadataModel') {
        doLast {
            def receipts = [:]
            [project:owner.configurations, buildscript:owner.buildscript.configurations].each { scope, configurations ->
                configurations.findAll { it.canBeResolved }.sort { it.name }.each { cfg ->
                    def view = cfg.incoming.artifactView { componentFilter { it instanceof ModuleComponentIdentifier } }
                    receipts[scope + ':' + cfg.name] = view.artifacts.artifacts.collect { artifact ->
                        [component:artifact.id.componentIdentifier.displayName,
                         artifact:artifact.file.name,
                         sha256:artifactSha256(artifact.file)]
                    }.sort { a,b -> (a.component + ':' + a.artifact) <=> (b.component + ':' + b.artifact) }
                }
            }
            def directory = new File(outputDir); directory.mkdirs()
            new File(directory, owner.name + '.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([build:owner.name, configurations:[project:owner.configurations, buildscript:owner.buildscript.configurations].collectMany { scope, configurations ->
                configurations.findAll { it.canBeResolved }.collect { scope + ':' + it.name }
            }.sort(), receipts:receipts]))
            println 'PLUGIN_MODEL_BUILD=' + owner.name
            println 'PLUGIN_MODEL_COUNTS=' + receipts.collectEntries { key,value -> [key,value.size()] }
        }
    }
}
