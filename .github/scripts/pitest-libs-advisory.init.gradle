// SPDX-License-Identifier: Apache-2.0
// Advisory mutation testing for the shared libs modules (ADR-0063 gap, issue tracked in the PR
// that introduces this file). Money, idempotency, audit and outbox logic lives in
// openbank-libs-domain / openbank-libs-runtime and carried NO pitest coverage at all, unlike the
// 12 money-path services already wired in pitest.yml — this closes that gap advisory-only.
//
// Init-script application, mirroring .github/scripts/pitest-authz.init.gradle: the plugins DSL
// cannot add ANY external versioned plugin to openbank-libs-domain or openbank-libs-runtime — both
// apply the jandex convention plugin, and stacking info.solidsoft.pitest on top of it in the same
// plugins{} block splits the plugin classloaders and jandex loads twice (Banner$Inject_
// ClassCastException, measured on openbank-libs-runtime 2026-09-05). An init script carries its
// own classpath, so pitest loads without touching either module's plugin resolution.
//
// Domain remains advisory. Runtime enforces 70% after behavior-level regression additions.
// The PR library quality lane runs the same runtime task; pitest.yml's own
// "Check mutation threshold (advisory)" step reports the score and warns below 70%, same as the
// service lanes. The pitest-authz job's ENFORCED lane over com.openbank.libs.authz.* is untouched
// by this file — authz already has its own dedicated init script and blocking threshold, so it is
// deliberately excluded from targetClasses below to avoid running the same package under two
// different pitest configurations.
initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
    }
}

// module -> [targetClasses, targetTests, excludedClasses]
def libsPitestConfig = [
    'openbank-libs-domain': [
        target: [
            'com.openbank.libs.domain.money.*',
            'com.openbank.libs.audit.*',
            'com.openbank.libs.persistence.outbox.*',
        ],
        tests: [
            'com.openbank.libs.domain.money.*',
            'com.openbank.libs.audit.*',
            'com.openbank.libs.persistence.outbox.*',
        ],
        excluded: [
            'com.openbank.libs.domain.money.*Kt',
            'com.openbank.libs.audit.*Kt',
            'com.openbank.libs.persistence.outbox.*Kt',
        ],
    ],
    'openbank-libs-runtime': [
        threshold: 70,
        target: [
            'com.openbank.libs.idempotency.impl.*',
            'com.openbank.libs.persistence.outbox.*',
            'com.openbank.libs.audit.*',
        ],
        tests: [
            'com.openbank.libs.idempotency.impl.*',
            'com.openbank.libs.persistence.outbox.*',
            'com.openbank.libs.audit.*',
        ],
        excluded: [
            'com.openbank.libs.idempotency.impl.*Kt',
            'com.openbank.libs.persistence.outbox.*Kt',
            'com.openbank.libs.audit.*Kt',
            // Deprecated mapped superclass with zero usages fleet-wide (ADR-0049 audit; its own
            // KDoc says "remove once it is clear none will appear"). No production call site and
            // no test can reach it without resurrecting the dead repository pattern.
            'com.openbank.libs.persistence.outbox.AbstractOutboxEntity',
            // Session-bound Panache base: every method runs inside Panache.getSession()/withTransaction,
            // which only exists under a booted Quarkus + database. Its behaviour is covered by the
            // per-service @QuarkusTest ITs (OutboxClaimPlanIT and friends); the PIT JUnit runner
            // cannot execute those, so the class scores as NO_COVERAGE no matter how many unit
            // tests exist. Excluded rather than left to dilute the lane's measurable signal.
            'com.openbank.libs.persistence.outbox.AbstractPanacheOutboxRepository',
            // The companion's purgeSent runs a native UPDATE inside Panache.withTransaction — same
            // session-bound shape as AbstractPanacheOutboxRepository; only the per-service
            // @QuarkusTest ITs can reach it, and the PIT runner cannot execute those.
            'com.openbank.libs.persistence.outbox.PanacheOutboxRetention$Companion',
        ],
    ],
]

gradle.projectsLoaded { g ->
    g.rootProject { root ->
        libsPitestConfig.each { moduleName, cfg ->
            def target = root.findProject(":${moduleName}")
            if (target == null) {
                return  // included builds (e.g. build-logic) don't have the module
            }
            target.with { p ->
                p.afterEvaluate { proj ->
                    proj.apply(plugin: info.solidsoft.gradle.pitest.PitestPlugin)
                    def ext = proj.extensions.getByName('pitest')
                    ext.junit5PluginVersion = '1.2.3'
                    ext.targetClasses = cfg.target as Set
                    ext.targetTests = cfg.tests as Set
                    // Runtime has a measured 70% floor. Domain remains advisory (0).
                    // Preserve target/exclusion sets: tests, not scope reduction, earn the floor.
                    ext.mutationThreshold = cfg.get('threshold', 0)
                    ext.outputFormats = ['XML', 'HTML'] as Set
                    ext.timestampedReports = false
                    ext.threads = 4
                    ext.excludedClasses = cfg.excluded as Set
                }
            }
        }
    }
}
