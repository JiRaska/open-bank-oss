// Resolve each model inside its owning project task; cross-project resolution can
// violate Gradle project-state locks. Unknown composite edges must use the full build.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest

// Bound transient allocations while hashing every resolved artifact independently.
def artifactSha256(File file) {
    def hasher = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            hasher.update(buffer, 0, count)
        }
    }
    return hasher.digest().encodeHex().toString()
}

gradle.projectsEvaluated {
    if (rootProject.name != 'openbank') return
    def requested = System.getenv('OB_METADATA_PROJECTS')
    if (!requested) throw new GradleException('No metadata projects supplied')
    def selected = requested.split(',').toList()
    if (selected.any { !(it ==~ /:openbank-[a-z0-9-]+/) || rootProject.findProject(it) == null }) throw new GradleException('Unknown metadata project')
    selected.each { projectPath ->
    def account = rootProject.project(projectPath)
    account.tasks.register('exportMetadataProjectModel') {
        doLast {
            def closure = [account.path] as Set
            def receipts = [:]
            [project:account.configurations, buildscript:account.buildscript.configurations].each { scope, configurations ->
            configurations.findAll { it.canBeResolved }.sort { it.name }.each { cfg ->
                // Module closure applies only to project dependencies. Plugin composite
                // dependencies are resolved and verified by the separate build-logic phase.
                cfg.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ProjectComponentIdentifier) {
                        def buildPath = id.build.buildPath
                        if (buildPath != ':' && !(scope == 'buildscript' && buildPath == ':build-logic' && id.projectPath == ':')) throw new GradleException('Opaque composite dependency ' + id + ' in ' + buildPath)
                        if (scope == 'project') closure.add(id.projectPath)
                    }
                }
                def view = cfg.incoming.artifactView { componentFilter { it instanceof ModuleComponentIdentifier } }
                receipts[scope + ':' + cfg.name] = view.artifacts.artifacts.collect { a ->
                    def digest = artifactSha256(a.file)
                    [component:a.id.componentIdentifier.displayName, artifact:a.file.name, sha256:digest]
                }.sort { a,b -> (a.component + ':' + a.artifact) <=> (b.component + ':' + b.artifact) }
            }
            }
            def dir = new File(System.getenv('OB_METADATA_MODEL_DIR')); dir.mkdirs()
            def output = new File(dir, account.name + '.json')
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([closure:closure.sort(), configurations:[project:account.configurations, buildscript:account.buildscript.configurations].collectMany { scope, configurations -> configurations.findAll { it.canBeResolved }.collect { scope + ':' + it.name } }.sort(), receipts:receipts]))
            println 'SCOPED_MODEL_PROJECTS=' + closure.sort().join(',')
            println 'SCOPED_MODEL_ARTIFACTS=' + receipts.collectEntries { k,v -> [k,v.size()] }
        }
    }
    }
    rootProject.tasks.register('exportMetadataScopeModel') { dependsOn(selected.collect { rootProject.project(it).tasks.named('exportMetadataProjectModel') }) }
}

// Resolve declared inputs of the exact gate tasks separately from model discovery.
gradle.taskGraph.whenReady { graph ->
    def outputDir = System.getenv('OB_METADATA_TASK_INPUTS_DIR')
    if (!outputDir) return
    def base = rootProject.projectDir.toPath().toAbsolutePath().normalize()
    def rows = graph.allTasks.collect { task ->
        def local = task.inputs.files.files.collect { it.toPath().toAbsolutePath().normalize() }
            .findAll { it.startsWith(base) }.collect { base.relativize(it).toString() }.sort()
        [task:task.path, localInputs:local]
    }
    def dir = new File(outputDir)
    dir.mkdirs()
    new File(dir, rootProject.name + '.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(rows))
}
