import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// The pinned graph plugin resolves metadata leniently. A missing dependency must
// fail the job rather than produce a successful, incomplete security inventory.
gradle.beforeProject { project ->
    project.configurations.configureEach { configuration ->
        configuration.incoming.afterResolve { incoming ->
            if (configuration.name ==~ /^(detachedConfiguration.*|classpath)$/) return
            def missing = incoming.resolutionResult.allDependencies.findAll {
                it instanceof UnresolvedDependencyResult
            }
            if (!missing.isEmpty()) {
                throw new GradleException("Incomplete dependency graph: ${project.path}:${configuration.name} contains ${missing.size()} unresolved dependencies")
            }
        }
    }
}

// Use the same safe-resolution predicate as the pinned graph plugin (1.4.2).
def safeMethod = null
try {
    safeMethod = Class.forName('org.gradle.internal.deprecation.DeprecatableConfiguration')
        .getMethod('canSafelyBeResolved')
} catch (ReflectiveOperationException ignored) {
    // Older Gradle versions expose only canBeResolved.
}

gradle.beforeProject { project ->
    project.tasks.matching {
        it.name == 'ForceDependencyResolutionPlugin_resolveProjectDependencies'
    }.configureEach { resolver ->
        resolver.doLast {
            def checked = 0
            project.configurations.each { configuration ->
                def safe = safeMethod == null ? configuration.canBeResolved : safeMethod.invoke(configuration)
                if (safe && resolver.configurationFilter.include(project.path, configuration.name)) {
                    // Fetch and verify external binaries, including test dependencies.
                    // Project outputs belong to Services CI; resolving them here would
                    // reintroduce fleet compilation and its unbounded retained heap.
                    def artifacts = configuration.incoming.artifactView {
                        componentFilter { identifier -> identifier instanceof ModuleComponentIdentifier }
                        lenient = false
                    }.files.files
                    artifacts.each { artifact ->
                        if (!artifact.isFile()) throw new GradleException('Missing external dependency artifact')
                    }
                    checked += 1
                }
            }
            logger.lifecycle("Verified external artifacts in ${checked} selected configurations for ${project.path}")
        }
    }
}
