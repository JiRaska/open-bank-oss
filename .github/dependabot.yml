version: 2
updates:
  # Gradle / Kotlin / JVM
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      quarkus:
        patterns:
          - "io.quarkus:*"
          - "io.quarkiverse.*:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      testing:
        patterns:
          - "org.junit*"
          - "io.mockk*"
          - "org.assertj*"
          - "io.rest-assured*"
      # Catch-all so misc minor/patch JVM bumps consolidate into one PR.
      jvm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Admin UI
  - package-ecosystem: "npm"
    directory: "/openbank-admin-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps-ui)"
      include: "scope"
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      # Catch-all so minor/patch bumps (radix-ui, recharts, ...) land in ONE PR
      # instead of flooding the runner budget with a dozen separate runs.
      ui-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Majors the ecosystem cannot satisfy yet. Each PR can never go green, so
    # dependabot would just re-open a red PR every Monday. Drop the entry once
    # the unblock criterion in #1314 is met.
    #
    # Every entry below MUST also be declared in `WATCHES` in
    # .github/scripts/check-upstream-unblock.py — the Upstream unblock watch
    # re-derives each criterion monthly and comments on the issue the day a
    # block goes stale, and fails this PR if the two lists drift. An entry
    # whose blocker lives in THIS repo is declared there with `upstream: None`;
    # it is never simply omitted, because an omitted entry is a block nothing
    # watches. (#1314)
    ignore:
      # eslint 10 removed context.getFilename(); the eslint-plugin-react that
      # eslint-config-next@16 bundles still calls it and peers on eslint <=9.
      - dependency-name: "eslint"
        versions: ["10.x"]
      # The typescript-eslint parser does not support the TypeScript 7
      # compiler API (crashes reading ModuleKind 'Cjs').
      - dependency-name: "typescript"
        versions: ["7.x"]
      # Tailwind v4 replaces tailwind.config.ts with a CSS-first @theme block,
      # changes the PostCSS plugin package, and changes the darkMode strategy
      # syntax. This app's design tokens are deeply wired through
      # tailwind.config.ts + globals.css, so the bump needs a deliberate,
      # visually-verified migration PR, not a mechanical Dependabot bump
      # (#1329 fails typecheck: tailwind.config.ts(8,3) TS2322 on darkMode).
      # Drop this entry once the migration in #1653 lands.
      - dependency-name: "tailwindcss"
        versions: ["4.x"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Consolidate action minor/patch bumps into one PR (mirrors the gradle/npm
      # ecosystems). Majors stay separate — they can change action inputs/behaviour.
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker — infra tooling images (nested, not directly under /openbank-infra)
  - package-ecosystem: "docker"
    directories:
      - "/openbank-infra/docker/pyroscope-agent"
      - "/openbank-infra/docker/kong"
      - "/openbank-infra/docker/keycloak"
      - "/openbank-infra/aws/envs/sandbox-platform/runner-image"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      # One PR for base-image minor/patch bumps; majors stay separate.
      docker-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker — per-service runtime images (eclipse-temurin, node, alpine base bumps)
  - package-ecosystem: "docker"
    directories:
      - "/openbank-*"
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker-svc)"
    groups:
      # One PR per week for base-image minor/patch bumps across the whole
      # fleet; majors (e.g. JDK 25 -> 26) stay separate — they need a
      # coordinated bump per CLAUDE.md's JDK toolchain pin.
      docker-svc-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Terraform / OpenTofu — provider and module version constraints
  - package-ecosystem: "terraform"
    directories:
      - "/openbank-infra/aws/bootstrap"
      - "/openbank-infra/aws/envs/sandbox"
      - "/openbank-infra/aws/envs/sandbox-platform"
      - "/openbank-infra/aws/envs/sandbox-substrate"
      - "/openbank-infra/aws/envs/web-prod"
      - "/openbank-infra/aws/modules/audit-baseline"
      - "/openbank-infra/aws/modules/dns"
      - "/openbank-infra/aws/modules/eks"
      - "/openbank-infra/aws/modules/karpenter-iam"
      - "/openbank-infra/aws/modules/network"
      - "/openbank-infra/aws/modules/runner"
      - "/openbank-infra/aws/modules/static-site"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(tofu)"
    groups:
      tofu-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
