openapi: 3.1.0
info:
  title: SEPA Instant (SCT Inst) Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.5 -> 1.6): additive
  # only — GET /sepa-instant/approvals (the checker's queue, issue #5679) plus two additive
  # fields on ApprovalResponse (makerId, createdAt). No breaking change.
  version: 1.6.0
  description: >-
    SEPA Instant Credit Transfer — sub-10s settlement, recall support. On submit, debtor and creditor
    names are synchronously screened against the sanctions lists (ADR-0032): a clean payment proceeds
    to PROCESSING, a sanctions hit is REJECTED (SANCTIONS_HIT) with a CRITICAL AML case opened, and a
    sub-threshold potential hit or a screening-service outage holds the payment in PENDING for review
    (fail-closed — never settled un-screened).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8127
    description: Local development
tags:
  - name: SCT Inst

paths:
  /api/v1/sepa-instant:
    get:
      tags: [SCT Inst]
      summary: List every SCT Inst payment
      description: >-
        The unfiltered collection. Requires ROLE_VIEWER, ROLE_OPERATOR, ROLE_ADMIN, ROLE_PAYMENTS
        or ROLE_API (authorize action `sctInstPayment.list`).
      operationId: listSctInstPayments
      responses:
        '200':
          description: All SCT Inst payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SctInstPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SCT Inst]
      summary: Submit a SEPA Instant payment
      operationId: submitSctInst
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSctInstRequest'
      responses:
        '201':
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SctInstPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/{paymentId}:
    get:
      tags: [SCT Inst]
      summary: Get SCT Inst payment by ID
      operationId: getSctInstPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SctInstPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sepa-instant/debtor/{debtorAccountId}:
    get:
      tags: [SCT Inst]
      summary: List SCT Inst payments for a debtor account
      operationId: listSctInstByDebtor
      parameters:
        - name: debtorAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of payments
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/{paymentId}/recall:
    post:
      tags: [SCT Inst]
      summary: Recall a SEPA Instant payment
      operationId: recallSctInstPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Recall initiated
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/approvals:
    get:
      tags: [SCT Inst]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id.
      description: >-
        PENDING maker-checker approvals on `sctInstPayment.recall`, oldest first. The read side of
        the unified approval inbox — deciding stays on
        PATCH /api/v1/sepa-instant/approvals/{id}. Requires ROLE_OPERATOR, ROLE_ADMIN or
        ROLE_PAYMENTS.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/approvals/{id}:
    patch:
      tags: [SCT Inst]
      summary: Approve or reject a pending four-eyes approval for a SCT Inst payment (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: >-
            The caller is the maker of this approval. Segregation of duties is enforced in
            RedisApprovalStore.decide, not per-service.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    SubmitSctInstRequest:
      # Field-for-field with SubmitSctInstRequest in SctInstDtos.kt. `idempotencyKey`,
      # `debtorIban` and `debtorName` are non-nullable there, so a body omitting any of them
      # fails to deserialise; the `Idempotency-Key` header, when present, overrides the body
      # field but does not make it optional (SctInstResource.submit reads `body.idempotencyKey`).
      type: object
      required: [idempotencyKey, debtorAccountId, debtorIban, debtorName, creditorIban, creditorName, amount, endToEndId]
      properties:
        idempotencyKey:
          type: string
        debtorAccountId:
          type: string
          format: uuid
        debtorIban:
          type: string
        debtorName:
          type: string
        creditorIban:
          type: string
        creditorName:
          type: string
        creditorBic:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
          default: EUR
        remittanceInfo:
          type: string
          nullable: true
        endToEndId:
          type: string

    RecallRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [FRAUD, DUPLICATE, WRONG_AMOUNT, WRONG_BENEFICIARY]

    SctInstPaymentResponse:
      # Field-for-field with SctInstPaymentResponse in SctInstDtos.kt, which SctInstResource
      # .toResponse() populates directly from the SctInstPayment aggregate.
      type: object
      required: [paymentId, status, debtorIban, creditorIban, amount, currency, endToEndId, createdAt]
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROCESSING, SETTLED, REJECTED, TIMEOUT, RECALLED]
        debtorIban:
          type: string
        creditorIban:
          type: string
        amount:
          type: number
        currency:
          type: string
        endToEndId:
          type: string
        executionTimeoutAt:
          type: string
          format: date-time
          nullable: true
        settledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the
        gated action; a DIFFERENT principal must decide it — enforced in
        RedisApprovalStore.decide, so the queue is readable by anyone who may decide, including
        the maker (seeing a request is not authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: sctInstPayment.recall
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
