openapi: 3.1.0
info:
  title: SEPA Instant (SCT Inst) Service API
  version: 1.3.0
  description: >-
    SEPA Instant Credit Transfer — sub-10s settlement, recall support. On submit, debtor and creditor
    names are synchronously screened against the sanctions lists (ADR-0032): a clean payment proceeds
    to PROCESSING, a sanctions hit is REJECTED (SANCTIONS_HIT) with a CRITICAL AML case opened, and a
    sub-threshold potential hit or a screening-service outage holds the payment in PENDING for review
    (fail-closed — never settled un-screened).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8127
    description: Local development
tags:
  - name: SCT Inst

paths:
  /api/v1/sepa-instant:
    get:
      tags: [SCT Inst]
      summary: List every SCT Inst payment
      description: >-
        The unfiltered collection. Requires ROLE_VIEWER, ROLE_OPERATOR, ROLE_ADMIN, ROLE_PAYMENTS
        or ROLE_API (authorize action `sctInstPayment.list`).
      operationId: listSctInstPayments
      responses:
        '200':
          description: All SCT Inst payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SctInstPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SCT Inst]
      summary: Submit a SEPA Instant payment
      operationId: submitSctInst
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSctInstRequest'
      responses:
        '201':
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SctInstPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/{paymentId}:
    get:
      tags: [SCT Inst]
      summary: Get SCT Inst payment by ID
      operationId: getSctInstPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      responses:
        '200':
          description: Payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SctInstPaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sepa-instant/debtor/{debtorAccountId}:
    get:
      tags: [SCT Inst]
      summary: List SCT Inst payments for a debtor account
      operationId: listSctInstByDebtor
      parameters:
        - name: debtorAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of payments
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/{paymentId}/recall:
    post:
      tags: [SCT Inst]
      summary: Recall a SEPA Instant payment
      operationId: recallSctInstPayment
      parameters:
        - $ref: '#/components/parameters/paymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Recall initiated
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sepa-instant/approvals/{id}:
    patch:
      tags: [SCT Inst]
      summary: Approve or reject a pending four-eyes approval for a SCT Inst payment (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                type: object
                required: [id, action, status]
                properties:
                  id:
                    type: string
                  action:
                    type: string
                    description: The gated action this approval was raised for.
                  resourceId:
                    type: string
                    nullable: true
                  status:
                    type: string
                  decidedBy:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    SubmitSctInstRequest:
      type: object
      required: [debtorAccountId, creditorIban, creditorName, amount, endToEndId]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        creditorIban:
          type: string
        creditorName:
          type: string
        creditorBic:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
          default: EUR
        endToEndId:
          type: string
        remittanceInfo:
          type: string

    RecallRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [FRAUD, DUPLICATE, WRONG_AMOUNT, WRONG_BENEFICIARY]

    SctInstPaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endToEndId:
          type: string
        debtorAccountId:
          type: string
          format: uuid
        creditorIban:
          type: string
        creditorName:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
          enum: [SUBMITTED, ACCEPTED, SETTLED, REJECTED, RECALLED]
        submittedAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          nullable: true

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
