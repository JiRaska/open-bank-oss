quarkus:
  application:
    name: openbank-customer-edge

  # Redis: pending-onboarding store for four-eyes auto-resume (ADR-0072).
  redis:
    hosts: ${QUARKUS_REDIS_HOSTS:redis://localhost:6379}

  http:
    port: 8128
    # Lazy authentication: only issue an auth challenge when an endpoint actually
    # requires an identity. With the default proactive auth, the class-level
    # @RolesAllowed("ROLE_CUSTOMER") pre-empts method-level @PermitAll and returns
    # 401 (www-authenticate: Bearer) even for the public onboarding routes, so the
    # retail app cannot register. Lazy auth lets @PermitAll (/onboarding/start) be
    # truly anonymous while @RolesAllowed routes (/accounts, /balances, …) stay
    # enforced — they still 401 without a valid customer token.
    auth:
      proactive: false

  management:
    port: 8085

  # Inbound auth: validate customer JWT from openbank-customers realm (ADR-0065).
  oidc:
    enabled: true
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak.iam.svc:8080/realms/openbank-customers}
    client-id: ${OIDC_CLIENT_ID:openbank-edge}
    token:
      # Pin the issuer to the customers-realm PUBLIC issuer. JWKS is fetched via the
      # in-cluster auth-server-url (keycloak.iam.svc), but customer tokens carry
      # iss=<public kc host>, so the discovered (internal) issuer != token iss — which is
      # why this was previously disabled with `any`. The correct fix validates iss against
      # the public URL explicitly (independent of the JWKS-fetch URL), not turning issuer
      # validation off. Env-overridable so a host change needs no rebuild.
      issuer: ${QUARKUS_OIDC_TOKEN_ISSUER:https://kc.open-bank.tech/realms/openbank-customers}
    roles:
      role-claim-path: realm_access/roles

  # Outbound auth config (used by UpstreamClient directly, not Quarkus OIDC client ext).
  # UpstreamClient fetches a service-account token via HTTP client_credentials to this endpoint
  # and caches it until TOKEN_REFRESH_BUFFER_SECONDS before expiry.

  smallrye-openapi:
    path: /q/openapi

mp:
  messaging:
    outgoing:
      # Structured customer audit trail -> audit-service tap (best-effort; see EdgeAuditPublisher).
      customer-audit-out:
        connector: smallrye-kafka
        topic: openbank.customer.audit
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
      # Onboarding-funnel telemetry -> analytics-sink -> ClickHouse (best-effort; see
      # OnboardingFunnelPublisher). Feeds the admin cockpit's conversion board.
      onboarding-funnel-out:
        connector: smallrye-kafka
        topic: openbank.onboarding.funnel.events
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
      # In-app screen feedback (ADR-0192) -> analytics-sink -> ClickHouse. Metadata + the
      # screenshot's object-store key only; the PNG itself never enters Kafka (FeedbackPublisher).
      feedback-out:
        connector: smallrye-kafka
        topic: openbank.feedback.events
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # pid party events — the onboarding auto-resume consumer (OnboardingResumeService) filters
      # for IdentityVerificationCaseDecided to replay a paused onboarding (ADR-0072). Latest offset
      # so a fresh deploy doesn't reprocess history; gated by openbank.edge.identity-resume-enabled.
      #
      # group.id / auto.offset.reset are deliberately NOT set as YAML keys here — see
      # openbank-infra/gitops/components/customer-edge/customer-edge-msg-override.yaml
      # (a properties-file ConfigMap loaded via QUARKUS_CONFIG_LOCATIONS) for why and where
      # they're set instead. Summary: SmallRye Config's YAML source unconditionally quotes any
      # leaf map key containing a literal dot (`group.id` becomes the registered property name
      # `"group.id"`, quotes included), so KafkaConnectorIncomingConfiguration's plain
      # config.getOptionalValue("group.id", ...) never finds it. group.id then silently falls
      # back to Quarkus's default (quarkus.application.name = "openbank-customer-edge"), which
      # does NOT match the intended "customer-edge-onboarding-resume" group id. NOT env vars:
      # SmallRye's env-var reverse-mapping is ambiguous for hyphenated channel names like
      # party-events-in and can crash at boot (quarkusio/quarkus#30106,
      # smallrye/smallrye-reactive-messaging#2028). Refs #686.
      #
      # NOTE: customer-edge has no KafkaUser ACL / mTLS setup yet and is still on anonymous
      # plaintext :9092, which the cluster now denies — this config fix alone does not make
      # this channel consumable in the live cluster (separate, out-of-scope follow-up; see
      # the gitops manifest comment).
      party-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.customer-edge.party-events-in
        connector: smallrye-kafka
        topic: party.events
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Upstream service base URLs (in-cluster DNS).
  # The edge strips the /customer prefix and forwards to the matching service.
# Customer edge upstream service endpoints + UpstreamClient singleton timeouts.
openbank:
  edge:
    account-service-url: ${ACCOUNT_SERVICE_URL:http://account-service.accounts.svc:8100}
    balance-service-url: ${BALANCE_SERVICE_URL:http://balance-service.balances.svc:8103}
    audit-service-url: ${AUDIT_SERVICE_URL:http://audit-service.audit.svc:8113}
    interest-service-url: ${INTEREST_SERVICE_URL:http://interest-service.interest.svc:8125}
    kyc-service-url: ${KYC_SERVICE_URL:http://kyc-service.kyc.svc:8114}
    lending-service-url: ${LENDING_SERVICE_URL:http://lending-service.lending.svc:8126}
    transaction-service-url: ${TRANSACTION_SERVICE_URL:http://transaction-service.payments.svc:8102}
    domestic-payment-service-url: ${DOMESTIC_PAYMENT_SERVICE_URL:http://domestic-payment.payments.svc:8116}
    sepa-payment-service-url: ${SEPA_PAYMENT_SERVICE_URL:http://sepa-payment.payments.svc:8115}
    sepa-instant-service-url: ${SEPA_INSTANT_SERVICE_URL:http://sepa-instant.payments.svc:8127}
    swift-service-url: ${SWIFT_SERVICE_URL:http://swift-service.payments.svc:8122}
    vop-service-url: ${VOP_SERVICE_URL:http://vop-service.payments.svc:8149}
    sdd-service-url: ${SDD_SERVICE_URL:http://sdd-service.sdd.svc:8129}
    consent-service-url: ${CONSENT_SERVICE_URL:http://consent-service.consent.svc:8106}
    delegation-service-url: ${DELEGATION_SERVICE_URL:http://delegation-service.delegation.svc:8126}
    bank-bic: ${OPENBANK_BANK_BIC:OPENCZPPXXX}
    sca-service-url:     ${SCA_SERVICE_URL:http://sca-service.sca.svc:8110}
    party-service-url:   ${PARTY_SERVICE_URL:http://party-service.party.svc:8111}
    pid-service-url:     ${PID_SERVICE_URL:http://pid-service.pid.svc:8105}
    # Identity-resolution dedup gate (ADR-0072 §6 / ADR-0094). Off until the id==sub re-linking
    # decision is settled; flip via IDENTITY_RESOLUTION_ENABLED once pid is the dedup authority.
    identity-resolution-enabled: ${IDENTITY_RESOLUTION_ENABLED:false}
    # Onboarding auto-resume (ADR-0072): when on, a four-eyes case decision replays the paused
    # onboarding (OnboardingResumeService consumes party.events). Off until verified end-to-end.
    identity-resume-enabled: ${IDENTITY_RESUME_ENABLED:false}
    # Keycloak Admin API for setting the party_id user attribute after MATCH_EXISTING re-link
    # (issue #1270 PR3). client-secret supplied via OPENBANK_EDGE_KEYCLOAK_ADMIN_CLIENT_SECRET.
    keycloak-admin-url: ${KEYCLOAK_ADMIN_URL:http://keycloak.iam.svc:8080}
    keycloak-admin-realm: ${KEYCLOAK_ADMIN_REALM:openbank-customers}
    keycloak-admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:customer-edge-admin}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service.notifications.svc:8112}
    engagement-service-url: ${ENGAGEMENT_SERVICE_URL:http://engagement-service.engagement.svc:8153}
    campaign-service-url: ${CAMPAIGN_SERVICE_URL:https://campaign-service.campaign.svc:8443}
    incentive-service-url: ${INCENTIVE_SERVICE_URL:http://localhost:8156}
    statement-service-url: ${STATEMENT_SERVICE_URL:http://statement-service.statements.svc:8136}
    standing-order-service-url: ${STANDING_ORDER_SERVICE_URL:http://standing-order-service.payments.svc:8121}
    fx-service-url:      ${FX_SERVICE_URL:http://fx-service.fx.svc:8119}
    card-issuance-service-url: ${CARD_ISSUANCE_SERVICE_URL:http://card-issuance-service.payments.svc:8118}
    dispute-service-url: ${DISPUTE_SERVICE_URL:http://dispute-service.dispute.svc:8135}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://document-service.documents.svc:8143}
    # CNB JERR registry XML — bank code list, refreshed every 24 h (CnbBanksClient).
    # Override with CNB_BANKS_URL env var if the CNB endpoint changes.
  upstream:
    connect-timeout-ms: 5000
    request-timeout-ms: 10000
    # The campaign interaction validator uses the private platform CA. Blank keeps local HTTP
    # fixtures on the normal JVM trust store while the remaining east-west fleet migrates.
    tls-trust-certificate-file: ${OPENBANK_UPSTREAM_TLS_TRUST_CERTIFICATE_FILE:}
    # M2M (client_credentials) creds for the operator realm. token-url and client-id
    # have sensible defaults in UpstreamClient; the SECRET is supplied at runtime via the
    # env var OPENBANK_UPSTREAM_CLIENT_SECRET, which Quarkus maps to the dotted property
    # `openbank.upstream.client-secret` (standard ENV→property mapping, like
    # QUARKUS_DATASOURCE_PASSWORD). Do NOT declare client-secret here with a
    # ${UPSTREAM_OIDC_CLIENT_SECRET:} expansion: a property name in ENV_VAR form is not
    # resolved reliably and silently yields "", which makes every token fetch 401.

  # ADR-0192 in-app screen feedback. The screenshot goes to object storage through the shared
  # ObjectStorePort (ADR-0161); `backend` is a BUILD-TIME selector (@IfBuildProperty), so it is
  # pinned to s3 here rather than made env-overridable — the edge is stateless and has no
  # database, so the Postgres blob adapter is not an alternative for it.
  #
  # Bucket lifecycle (90-day expiry) and SSE-KMS/Object-Lock settings are properties of the
  # BUCKET, provisioned by Terraform (ADR-0161 D3) — never hardcoded here. Until that bucket and
  # the Pod Identity association exist, a put simply fails and the submission is still recorded
  # with screenshotStatus=STORE_FAILED (FeedbackScreenshotStore).
  objectstore:
    backend: s3
    s3:
      bucket: ${OBJECTSTORE_S3_BUCKET:openbank-feedback-dev}
      region: ${OBJECTSTORE_S3_REGION:eu-central-1}
      # endpoint-override deliberately NOT declared: it is an Optional<String> on S3ObjectStore
      # and a "${VAR:}" default would resolve to Optional.of("") -> URI.create("") -> boot failure.
      # Set OBJECTSTORE_S3_ENDPOINT_OVERRIDE only when an override (e.g. localstack) is wanted.
  feedback:
    # Per-party feedback submissions per hour, on top of the global per-minute request budget
    # below. Rate limiting is part of this endpoint's contract from day one (ADR-0192) because
    # each accepted submission can park up to 2 MB in object storage.
    submissions-per-hour: ${FEEDBACK_SUBMISSIONS_PER_HOUR:10}

  rate-limit:
    per-party:
      # Maximum requests per party per minute enforced at the edge (ADR-0132).
      # Unauthenticated traffic (e.g. POST /onboarding/start) is exempt — per-IP
      # throttling at ingress-nginx is the first line of defence for those paths.
      requests-per-minute: ${RATE_LIMIT_PER_PARTY_RPM:100}

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
