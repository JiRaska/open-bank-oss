openapi: 3.1.0
info:
  title: Admin UI Test Intelligence read views
  version: 1.1.0
  description: >-
    Internal authenticated BFF. The optional views project the existing immutable
    evidence archive; they do not change test verdicts or the published format.
paths:
  /api/test-intelligence:
    get:
      operationId: readTestIntelligence
      security: [{ adminSession: [] }]
      description: >-
        Omitted view retains the full legacy response. Component and case views
        may bind collectedAt to the overview; a different collection returns 409.
        All successful responses use private, no-cache and ETag revalidation.
        Component names identify retained evidence, never a destination to fetch.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [full, overview, component, case], default: full } }
        - { name: component, in: query, description: Required for component and case., schema: { type: string, pattern: '^openbank-[a-z0-9-]{2,90}$' } }
        - { name: kind, in: query, schema: { type: string, enum: [unit, integration, contract, e2e, trace, mutation, simulation, performance, synthetic, visual] } }
        - { name: collectedAt, in: query, schema: { type: string, format: date-time, maxLength: 64 } }
        - { name: fingerprint, in: query, description: Required for case., schema: { type: string, pattern: '^[a-zA-Z0-9:_-]{1,160}$' } }
        - { name: q, in: query, description: Case-insensitive testcase name or class search in a component., schema: { type: string, maxLength: 160 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
      responses:
        '200':
          description: Requested read projection; exact evidence fields retain the archive contract.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Archive' }
                  - { $ref: '#/components/schemas/Overview' }
                  - { $ref: '#/components/schemas/ComponentPage' }
                  - { $ref: '#/components/schemas/CaseDetail' }
        '304': { description: Unchanged representation; no response body. }
        '400': { description: Invalid or out-of-bounds view parameters. }
        '401': { description: Admin session required. }
        '403': { description: Existing role boundary denies access. }
        '404': { description: Component or unique testcase absent from the retained slice; not a test verdict. }
        '409': { description: Collection changed; refresh the overview before requesting details. }
        '503': { description: Evidence unavailable; never interpreted as a passing outcome. }
components:
  securitySchemes:
    adminSession: { type: apiKey, in: cookie, name: next-auth.session-token }
  schemas:
    Archive:
      type: object
      required: [schemaVersion, collectedAt, components, testCases]
      not: { required: [view] }
      description: Unchanged TestIntelligenceReport archive contract.
    Overview:
      type: object
      required: [schemaVersion, view, collectedAt, components, scope, totals, warnings]
      properties:
        schemaVersion: { const: 1 }
        view: { const: overview }
        collectedAt: { type: string, format: date-time }
        components: { type: array, items: { type: object, required: [component, cells, moneyPath] } }
        scope: { type: object, required: [failed, stale, missing] }
        totals: { type: object }
        warnings: { type: array, items: { type: string } }
      not: { required: [testCases] }
    ComponentPage:
      type: object
      required: [schemaVersion, view, collectedAt, component, tests, total, offset, limit]
      properties:
        schemaVersion: { const: 1 }
        view: { const: component }
        collectedAt: { type: string, format: date-time }
        component: { type: object, description: Original component-level posture and evidence. }
        tests:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [fingerprint, component, kind, name, state, lastState, lastObservedAt]
            properties:
              fingerprint: { type: string }
              component: { type: string }
              kind: { type: string }
              name: { type: string }
              state: { type: string }
              lastState: { type: string }
              lastObservedAt: { type: string }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0, description: Clamped to the last existing page. }
        limit: { type: integer, minimum: 1, maximum: 25 }
    CaseDetail:
      type: object
      required: [schemaVersion, view, collectedAt, testCase]
      properties:
        schemaVersion: { const: 1 }
        view: { const: case }
        collectedAt: { type: string, format: date-time }
        testCase: { type: object, description: One unchanged TestCaseHistory including its exact source, run and retained history. }
