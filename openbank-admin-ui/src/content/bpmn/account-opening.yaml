# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: Retail Account Onboarding
desc: Event-driven retail onboarding. KYC, AML, party activation, and account creation are owned by their services.
regulation: ADR-0069 + ADR-0267
services:
  - customer-edge
  - party-service
  - kyc-service
  - aml-service
  - account-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Customer registers
  - id: register
    type: task
    x: 200
    y: 100
    label: Register party
    lane: identity
    apis:
      - POST /customer/v1/onboarding/register
    relatedServices:
      - customer-edge
      - party-service
    emits:
      - openbank.party.events
  - id: kyc
    type: task
    x: 410
    y: 35
    label: Open KYC case
    lane: kyc
    relatedServices:
      - kyc-service
    consumes:
      - openbank.party.events
    emits:
      - openbank.kyc.events
  - id: aml
    type: task
    x: 410
    y: 165
    label: Open AML case
    lane: aml
    relatedServices:
      - aml-service
    consumes:
      - openbank.party.events
    emits:
      - openbank.aml.events
  - id: pending-account
    type: task
    x: 410
    y: 265
    label: Create pending accounts
    lane: core
    relatedServices:
      - account-service
    consumes:
      - openbank.party.events
    emits:
      - openbank.accounts.account.created
  - id: activation-gate
    type: gateway
    x: 660
    y: 100
    label: KYC + AML approved?
  - id: party-activation
    type: task
    x: 820
    y: 100
    label: Party activation gate
    lane: identity
    relatedServices:
      - party-service
    consumes:
      - openbank.kyc.events
      - openbank.aml.events
    emits:
      - openbank.party.events
  - id: activate-account
    type: task
    x: 980
    y: 100
    label: Activate pending accounts
    lane: core
    relatedServices:
      - account-service
    consumes:
      - openbank.party.events
  - id: end
    type: end
    x: 1080
    y: 100
    label: Accounts active
flows:
  - from: start
    to: register
  - from: register
    to: kyc
    kind: async
    topic: openbank.party.events
  - from: register
    to: aml
    kind: async
    topic: openbank.party.events
  - from: register
    to: pending-account
    kind: async
    topic: openbank.party.events
  - from: kyc
    to: activation-gate
    kind: async
    topic: openbank.kyc.events
  - from: aml
    to: activation-gate
    kind: async
    topic: openbank.aml.events
  - from: activation-gate
    to: party-activation
  - from: party-activation
    to: activate-account
    kind: async
    topic: openbank.party.events
  - from: pending-account
    to: activate-account
    kind: async
    topic: openbank.party.events
  - from: activate-account
    to: end
