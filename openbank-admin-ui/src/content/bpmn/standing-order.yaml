# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: Standing Order Execution
desc: Denní plánování splatných příkazů a odeslání platby podle skutečně podporované trasy
regulation: PSD2
services:
  - standing-order-service
  - account-service
  - sepa-payment
  - transaction-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Denní scheduler
  - id: schedule
    type: task
    x: 200
    y: 100
    label: Splatné příkazy a outbox
    lane: payment
    relatedServices:
      - standing-order-service
    emits:
      - standing-order.due.v1
  - id: consume
    type: task
    x: 370
    y: 100
    label: Převzetí due události
    lane: payment
    relatedServices:
      - standing-order-service
    consumes:
      - standing-order.due.v1
  - id: rail
    type: gateway
    x: 530
    y: 100
    label: Podporovaná trasa?
  - id: sepa
    type: task
    x: 700
    y: 20
    label: SEPA CREDIT (EUR)
    lane: payment
    apis:
      - POST /api/v1/sepa-payments
    relatedServices:
      - sepa-payment
  - id: own-account
    type: task
    x: 700
    y: 150
    label: IBAN účtu téže strany
    lane: core
    apis:
      - GET /api/v1/accounts/iban/{iban}
    relatedServices:
      - account-service
  - id: transfer
    type: task
    x: 870
    y: 150
    label: Převod mezi vlastními účty
    lane: core
    apis:
      - POST /api/v1/transactions
    relatedServices:
      - transaction-service
  - id: result
    type: gateway
    x: 1040
    y: 100
    label: Platba přijata?
  - id: success
    type: end
    x: 1200
    y: 30
    label: Potvrzení příkazu
  - id: failure
    type: end-err
    x: 1200
    y: 200
    label: Záznam selhání
flows:
  - from: start
    to: schedule
  - from: schedule
    to: consume
    kind: async
    topic: openbank.standing-orders.order.event
  - from: consume
    to: rail
  - from: rail
    to: sepa
    label: SEPA_CREDIT
  - from: rail
    to: own-account
    label: DOMESTIC / INTERNAL
  - from: rail
    to: failure
    label: Jiná trasa
  - from: own-account
    to: transfer
    label: Stejná strana
  - from: own-account
    to: failure
    label: Cizí či nenalezený účet
  - from: sepa
    to: result
  - from: transfer
    to: result
  - from: result
    to: success
    label: Ano
  - from: result
    to: failure
    label: Ne
