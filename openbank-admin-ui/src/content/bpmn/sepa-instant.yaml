# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: SEPA Instant Payment
desc: Zpracování okamžité SEPA platby (SCT Inst) do 10 sekund
regulation: EPC SCT Inst Rulebook
services:
  - sca-service
  - aml-service
  - account-service
  - sepa-instant
  - clearing-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Iniciace
  - id: sca
    type: task
    x: 180
    y: 100
    label: SCA (PSD2)
    lane: psd2
    apis:
      - POST /api/v1/sca/challenge
    relatedServices:
      - sca-service
  - id: aml
    type: task
    x: 320
    y: 100
    label: AML Screening
    lane: compliance
    apis:
      - POST /api/v1/aml/transaction-screen
    relatedServices:
      - aml-service
  - id: gw1
    type: gateway
    x: 440
    y: 100
    label: Prošlo?
  - id: reject
    type: end-err
    x: 440
    y: 220
    label: Odmítnuto
  - id: debit
    type: task
    x: 560
    y: 100
    label: Debit účtu
    lane: core
    apis:
      - POST /api/v1/accounts/{id}/debit
    relatedServices:
      - account-service
  - id: submit
    type: task
    x: 700
    y: 100
    label: SCT Inst Odeslání
    lane: payment
    apis:
      - POST /api/v1/sepa/instant
    relatedServices:
      - sepa-instant
  - id: settle
    type: task
    x: 840
    y: 100
    label: Settlement (10s)
    lane: payment
    apis:
      - POST /api/v1/clearing/instant
    relatedServices:
      - clearing-service
  - id: end
    type: end
    x: 960
    y: 100
    label: Settled
flows:
  - from: start
    to: sca
  - from: sca
    to: aml
  - from: aml
    to: gw1
  - from: gw1
    to: reject
    label: Ne
  - from: gw1
    to: debit
    label: Ano
  - from: debit
    to: submit
  - from: submit
    to: settle
  - from: settle
    to: end
