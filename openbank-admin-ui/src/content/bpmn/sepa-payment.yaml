# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: SEPA Credit Transfer
desc: SEPA payment creation screens synchronously; the transactional outbox publishes lifecycle events for downstream processing.
regulation: PSD2 RTS + SEPA CT Rulebook + EBA Guidelines
services:
  - sepa-payment
  - sanctions-service
  - aml-service
  - clearing-service
  - ledger-service
  - audit-service
  - notification-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Payment request
  - id: create
    type: task
    x: 220
    y: 100
    label: Create SEPA payment
    lane: payment
    apis:
      - POST /api/v1/sepa-payments
    relatedServices:
      - sepa-payment
    emits:
      - openbank.sepa.payment.events
  - id: screening
    type: task
    x: 450
    y: 100
    label: Synchronous sanctions screening
    lane: compliance
    apis:
      - POST /api/v1/sanctions/screen
    relatedServices:
      - sanctions-service
  - id: aml-case
    type: task
    x: 680
    y: 210
    label: Open AML case on screening hit
    lane: compliance
    apis:
      - POST /api/v1/aml/cases
    relatedServices:
      - aml-service
  - id: decision
    type: gateway
    x: 680
    y: 100
    label: Screening outcome
  - id: clearing
    type: task
    x: 900
    y: 100
    label: Clearing processes payment events
    lane: payment
    relatedServices:
      - clearing-service
      - ledger-service
      - audit-service
      - notification-service
    consumes:
      - openbank.sepa.payment.events
  - id: end
    type: end
    x: 1080
    y: 100
    label: Downstream event processing
  - id: held
    type: end-err
    x: 680
    y: 270
    label: Rejected or held for review
flows:
  - from: start
    to: create
  - from: create
    to: screening
  - from: screening
    to: decision
  - from: decision
    to: aml-case
    label: Hit / review
  - from: aml-case
    to: end
    kind: async
    topic: openbank.aml.events
  - from: decision
    to: clearing
    label: Clear
    kind: async
    topic: openbank.sepa.payment.events
  - from: decision
    to: held
    label: Reject / hold
  - from: clearing
    to: end
    kind: async
    topic: openbank.sepa.payment.events
