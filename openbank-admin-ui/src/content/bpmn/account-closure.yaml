# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: Account Closure
desc: Pokus o uzavření účtu; nenulový zůstatek vyžaduje převod mimo tuto operaci
regulation: General Banking Terms
services:
  - account-service
  - balance-service
  - notification-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Žádost
  - id: close
    type: task
    x: 300
    y: 100
    label: Uzavření účtu
    lane: core
    apis:
      - POST /api/v1/accounts/{accountId}/close
    # AccountService.closeAccount checks booked/reserved balance through BalanceQueryPort,
    # rejects a nonzero balance, then updates status, publishes a status event
    # and sends a best-effort notification request.
    relatedServices:
      - account-service
      - balance-service
    emits:
      - openbank.accounts.account.status-changed
      - openbank.notification.requests
  - id: gw1
    type: gateway
    x: 500
    y: 100
    label: Uzavřeno?
  - id: reject
    type: end-err
    x: 500
    y: 220
    label: Uzavření odmítnuto
  - id: notify
    type: task
    x: 750
    y: 100
    label: Notifikace
    lane: platform
    relatedServices:
      - notification-service
    consumes:
      - openbank.notification.requests
  - id: end
    type: end
    x: 980
    y: 100
    label: Uzavřeno
flows:
  - from: start
    to: close
  - from: close
    to: gw1
  - from: gw1
    to: reject
    label: Ne
  - from: gw1
    to: notify
    label: Ano
    kind: async
    topic: openbank.notification.requests
  - from: notify
    to: end
