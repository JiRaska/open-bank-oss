# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: Account Closure
desc: Account service closes only an empty account, emits a status-change event, and requests a customer notification.
regulation: General Banking Terms
services:
  - account-service
  - balance-service
  - notification-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Close request
  - id: close
    type: task
    x: 340
    y: 100
    label: Check balances and close empty account
    lane: core
    apis:
      - POST /api/v1/accounts/{accountId}/close
    relatedServices:
      - account-service
  - id: notify
    type: task
    x: 740
    y: 100
    label: Send customer notification request
    lane: platform
    relatedServices:
      - account-service
      - notification-service
    consumes:
      - openbank.notification.requests
  - id: end
    type: end
    x: 980
    y: 100
    label: Account closed
  - id: account-event
    type: event
    x: 540
    y: 220
    label: Account status changed
    relatedServices:
      - account-service
    emits:
      - openbank.accounts.account.status-changed
flows:
  - from: start
    to: close
  - from: close
    to: account-event
    kind: async
    topic: openbank.accounts.account.status-changed
  - from: close
    to: notify
    kind: async
    topic: openbank.notification.requests
  - from: notify
    to: end
