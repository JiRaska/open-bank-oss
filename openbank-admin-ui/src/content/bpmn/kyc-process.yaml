# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: KYC Case Lifecycle
desc: PARTY_CREATED opens a KYC case. Checks accumulate before an authorised four-eyes reviewer approves or rejects it.
regulation: EBA AML Guidelines + 5AMLD Art. 13 + FATF R.10
services:
  - kyc-service
  - party-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: PARTY_CREATED
  - id: open-case
    type: task
    x: 180
    y: 100
    label: Open KYC case
    lane: kyc
    apis:
      - POST /api/v1/kyc/cases
    relatedServices:
      - kyc-service
    consumes:
      - openbank.party.events
    emits:
      - openbank.kyc.events
  - id: checks
    type: task
    x: 410
    y: 100
    label: Record KYC check results
    lane: kyc
    apis:
      - PUT /api/v1/kyc/cases/{caseId}/checks/{checkType}
    relatedServices:
      - kyc-service
  - id: review
    type: gateway
    x: 650
    y: 100
    label: Four-eyes decision
  - id: approve
    type: task
    x: 830
    y: 50
    label: Approve case
    lane: kyc
    apis:
      - POST /api/v1/kyc/cases/{caseId}/approve
    relatedServices:
      - kyc-service
    emits:
      - openbank.kyc.events
  - id: reject
    type: task
    x: 830
    y: 180
    label: Reject case
    lane: kyc
    apis:
      - POST /api/v1/kyc/cases/{caseId}/reject
    relatedServices:
      - kyc-service
    emits:
      - openbank.kyc.events
  - id: party-update
    type: task
    x: 1040
    y: 100
    label: Party service applies KYC decision
    lane: identity
    relatedServices:
      - party-service
    consumes:
      - openbank.kyc.events
  - id: end
    type: end
    x: 1140
    y: 100
    label: Party KYC status updated
flows:
  - from: start
    to: open-case
    kind: async
    topic: openbank.party.events
  - from: open-case
    to: checks
  - from: checks
    to: review
  - from: review
    to: approve
    label: Approve
  - from: review
    to: reject
    label: Reject
  - from: approve
    to: party-update
    kind: async
    topic: openbank.kyc.events
  - from: reject
    to: party-update
    kind: async
    topic: openbank.kyc.events
  - from: party-update
    to: end
