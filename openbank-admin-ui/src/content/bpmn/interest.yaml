# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: Interest Accrual
desc: Denní nabíhání úroku; připsání netto částky probíhá až při samostatné kapitalizaci
regulation: Accounting Standards
services:
  - interest-service
  - account-service
  - balance-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: Batch Trigger
  - id: load
    type: task
    x: 180
    y: 100
    label: Načtení účtů
    lane: core
    apis:
      - GET /api/v1/accounts/active
    relatedServices:
      - account-service
  - id: calc
    type: task
    x: 320
    y: 100
    label: Výpočet a uložení accrualu
    lane: core
    apis:
      - POST /api/v1/interest/accrue/all
    # Scheduler calls the same accrueAll use case directly; the route is the manual trigger.
    # The use case reads booked balances and saves accrual rows, but does not post to the ledger.
    relatedServices:
      - interest-service
  - id: end
    type: end
    x: 460
    y: 100
    label: Accrual uložen
flows:
  - from: start
    to: load
  - from: load
    to: calc
  - from: calc
    to: end
