# BPMN process diagram (ADR-0019/0029). Authored as data; validated by
# src/lib/docs/bpmn/schema.ts at build time. `slug` is the filename.

name: AML Case Lifecycle
desc: Onboarding cases are opened from PARTY_CREATED; payment services open transaction cases, then analysts record decisions.
regulation: 5AMLD Art. 18 + 6AMLD + FATF R.10-12 + EBA AML Guidelines
services:
  - aml-service
  - party-service
steps:
  - id: start
    type: start
    x: 60
    y: 100
    label: New party or payment screening request
  - id: open-case
    type: task
    x: 180
    y: 100
    label: Open AML case
    lane: aml
    apis:
      - POST /api/v1/aml/cases
    relatedServices:
      - aml-service
    consumes:
      - openbank.party.events
    emits:
      - openbank.aml.events
  - id: review
    type: task
    x: 400
    y: 100
    label: Analyst reviews case
    lane: aml
    apis:
      - GET /api/v1/aml/cases
      - GET /api/v1/aml/cases/{caseId}
    relatedServices:
      - aml-service
  - id: record-decision
    type: task
    x: 600
    y: 100
    label: Analyst records case decision
    lane: aml
    apis:
      - PUT /api/v1/aml/cases/{caseId}/decision
    relatedServices:
      - aml-service
    emits:
      - openbank.aml.events
  - id: party-gate
    type: task
    x: 830
    y: 100
    label: Party service consumes terminal AML decision
    lane: identity
    relatedServices:
      - party-service
    consumes:
      - openbank.aml.events
  - id: end
    type: end
    x: 1030
    y: 100
    label: Party status updated when decision is terminal
flows:
  - from: start
    to: open-case
  - from: open-case
    to: review
  - from: review
    to: record-decision
  - from: record-decision
    to: party-gate
    kind: async
    topic: openbank.aml.events
  - from: party-gate
    to: end
