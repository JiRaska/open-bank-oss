openapi: "3.1.0"

info:
  title: OpenBank Copilot Service API
  version: "1.3.0"
  description: |
    Customer-facing AI assistant (mobile copilot), per ADR-0089.

    The conversation runs **server-side** behind a provider-agnostic model gateway (ADR-0031) —
    the model is never called from the device. The reasoning loop runs each tool through the OPA
    policy gate (ADR-0034, deny-by-default), operates strictly within the authenticated customer's
    scope (on-behalf-of token, ADR-0089 D5), and emits an AI-attributed audit event per turn
    (ADR-0031 D5).

    Core principle: **the model proposes, the bank disposes.** Every figure shown comes from a tool
    result, never model generation; money never moves on the model's word — action tools emit a
    proposal gated by human-in-the-loop confirmation and SCA with dynamic linking (ADR-0021/0073).

    **Phase-1 skeleton:** the chat surface exists; tools and the real model are not yet wired, and
    the capability is gated by the `copilot-assistant` feature flag (off by default, ADR-0067).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1

paths:
  /copilot/chat:
    post:
      operationId: chat
      summary: Send a turn to the customer assistant (full response, buffered)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "401":
          description: Authenticated token carries no usable subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Capability not yet enabled (feature flag off)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /copilot/chat/stream:
    post:
      operationId: chatStream
      summary: Send a turn and receive the reply as Server-Sent Events
      description: |
        Same governed reasoning loop as `/copilot/chat` — identical prompt-injection guard,
        OPA policy gate, and tool whitelist — but text tokens are forwarded as SSE events as
        they arrive from the model backend instead of being buffered until the full reply is
        ready. Tool-call rounds are handled server-side and transparent to the client; only
        the final text response is streamed. First token arrives within ~500 ms.

        Unlike `/copilot/chat`, this endpoint reports nothing through the status code once the
        stream has opened. A disabled capability is delivered as an ordinary text chunk on the
        `200` stream (`CopilotChatService.handleStream` emits its disabled message and returns —
        there is no `501` path here), a refused prompt-injection attempt arrives the same way, and
        a token with no usable subject yields an empty `200` stream rather than a `401`. Clients
        must therefore read the body, not the status, to tell these apart.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Stream of text token events (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Newline-delimited SSE events. Each `data:` line contains a raw text chunk.
                  No JSON wrapper — clients concatenate chunks to build the full reply.
                  A disabled capability, a refused prompt injection and a missing subject all
                  arrive on this same 200 stream — see the operation description.

  /copilot/actions/{tokenId}/confirm:
    post:
      operationId: confirmAction
      summary: Confirm a copilot action proposal (human-in-the-loop)
      description: |
        Exchanges a one-time proposal token for a confirmed action. This is the
        human-in-the-loop half of "the model proposes, the bank disposes" (ADR-0089 D2): the
        assistant never executes a money-path action, it only emits a proposal the customer
        confirms here from a non-AI-controlled card.

        The token is bound to the customer that owns it — a token confirmed by a different
        subject is refused, and the response deliberately does not distinguish that case from
        an unknown token. The confirm is re-checked against the OPA policy gate (ADR-0034,
        fail-closed: an unreachable PDP denies), and the token is single-use — it is deleted on
        confirm, on expiry, and on an ownership mismatch is left untouched.

        NOT YET WIRED (issue #5900): no production code issues a proposal token, so on a
        deployed pod this operation can only answer 404. The live human-in-the-loop route is
        the `[PROPOSAL_END:{...}]` sentinel on the chat SSE stream, which the app takes into
        the existing customer-edge payment + SCA flow without a second round-trip. This
        operation also performs no SCA itself — it validates ownership, TTL and the OPA gate
        and returns an action id; nothing downstream executes. Do not build a client against
        it until both ends land.
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          description: The proposal token id handed out with the `ActionProposal` (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Action confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionConfirmation"
        "401":
          description: Authenticated token carries no usable subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OPA policy denied the action, or the token belongs to another customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found (also returned for a malformed token id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Token expired (the proposal must be re-issued by a new turn)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        conversationId:
          type: string
          description: Opaque id correlating turns of one conversation.
        message:
          type: string
          description: The customer's message (treated as untrusted input — ADR-0089 D3).
        themeSpec:
          type: string
          nullable: true
          description: |
            The client's active ThemeSpec JSON (ADR-0190), so the theme-designer tool edits relative
            to what the customer currently sees. Data context only — carries the same trust level as
            `message` and is never treated as instructions.
    ChatReply:
      type: object
      required: [conversationId, reply]
      properties:
        conversationId:
          type: string
        reply:
          type: string
          description: Narrated reply; any figures are rendered from tool results, not generated.
        proposal:
          $ref: "#/components/schemas/ActionProposal"
          description: |
            Present when the turn produced a money-path action. A structured, validated proposal the
            app renders as a non-AI-controlled card and routes into the existing edge payment + SCA
            (dynamic-linking) flow. The assistant NEVER executes it (ADR-0089 D2).
        themeSpec:
          type: string
          nullable: true
          description: |
            Normalized ThemeSpec JSON produced by the theme-designer tool on this turn (ADR-0190),
            absent otherwise.
    ActionProposal:
      type: object
      required: [kind, summary, fields]
      properties:
        kind:
          type: string
          enum: [PAYMENT, CARD_FREEZE, DISPUTE]
        summary:
          type: string
          description: Human-readable one-liner of the proposed action.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Validated parameters (fromAccountId, payeeIban, amount, currency, …) — authoritative.
    ActionConfirmation:
      type: object
      required: [status, actionId]
      properties:
        status:
          type: string
          enum: [CONFIRMED]
        actionId:
          type: string
          format: uuid
          description: Id of the confirmed action, for correlating the downstream execution.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Stable machine-readable code where one exists (`PROPOSAL_NOT_FOUND`,
            `PROPOSAL_EXPIRED`, `ACTION_DENIED`); otherwise a short human-readable reason.
