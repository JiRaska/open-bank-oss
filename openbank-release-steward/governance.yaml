# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: platform
primaryDatastore: PostgreSQL
databaseName: openbank_releasesteward
dataLineageRole: internal
dataClassification: internal
retentionPolicy: "7 years"
evidenceExported: false
lineage:
  upstream:
    - serviceName: github
      relationType: api
      description: reads release-please-config.json/.release-please-manifest.json/application.yaml
        via a repo checkout, and open-PR openapi.yaml diffs via the GitHub API
databaseLineage:
  ownedDatabases: [openbank_releasesteward]
  dependentDatabases: []
