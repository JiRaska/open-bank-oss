# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: core
primaryDatastore: PostgreSQL
databaseName: openbank_transactions
dataLineageRole: both
dataClassification: confidential
retentionPolicy: 7 years
evidenceExported: true
lineage:
  upstream:
    # Removed (issue #3982): `standing-order-service (api, "creates")` — the founding example of
    # this gate (ADR-0160 mechanism 2): standing-order-service's only outbound client is
    # sepa-payment-service, and its Deployment env carries SEPA_PAYMENT_SERVICE_URL, never a
    # transaction-service URL. Also removed `clearing-service (api, "settles")` — clearing-service
    # has no @RegisterRestClient at all and its Deployment env lists only keycloak and tempo.
    - serviceName: sepa-payment
      relationType: api
      description: creates
    - serviceName: sepa-instant
      relationType: api
      description: creates
    - serviceName: domestic-payment
      relationType: api
      description: creates
    - serviceName: swift-service
      relationType: api
      description: creates
    - serviceName: agent-service
      relationType: api
      description: MCP tool
  downstream:
    # Direction corrected (issue #3982): declared as `upstream: fx-service ("rates")`, i.e.
    # fx-service calling transaction-service. FxRateClient(configKey = "fx-service") lives in
    # transaction-service; fx-service's own clients are aml-service and sanctions-service only.
    - serviceName: fx-service
      relationType: api
      description: rates via FxRateClient
    - serviceName: account-service
      relationType: api
      description: validates
    - serviceName: ledger-service
      relationType: api
      description: posts GL
    - serviceName: balance-service
      relationType: api
      description: updates
    - serviceName: audit-service
      relationType: topic
      description: events
databaseLineage:
  ownedDatabases:
    - openbank_transactions
  dependentDatabases:
    - openbank_accounts
    - openbank_ledger
