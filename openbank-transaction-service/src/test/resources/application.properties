quarkus.oidc.enabled=false
quarkus.devservices.enabled=false
quarkus.management.enabled=false

# PostgreSQL - dedicated IT database in running container
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=openbank
quarkus.datasource.password=openbank_secret
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/openbank_transactions_it
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openbank_transactions_it

# Flyway - must point to the same IT database
quarkus.flyway.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openbank_transactions_it
quarkus.flyway.datasource.username=openbank
quarkus.flyway.datasource.password=openbank_secret
# Dedicated IT database: wipe and re-migrate from scratch on every boot so tests always
# run against a pristine, fully-migrated schema regardless of leftover state from prior runs.
quarkus.flyway.clean-at-start=true
quarkus.flyway.clean-disabled=false

# Kafka - use real Kafka broker (running at localhost:29092)
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:29092
kafka.bootstrap.servers=localhost:29092

# Telemetry off
quarkus.otel.sdk.disabled=true
quarkus.log.level=WARN
quarkus.log.category."com.openbank".level=INFO
