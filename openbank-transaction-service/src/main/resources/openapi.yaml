openapi: 3.1.0
info:
  title: Transaction Service API
  # The API-contract version (ADR-0048), an axis INDEPENDENT of the release version in
  # version.txt — classified from the OpenAPI diff, never forced equal to it. The two have not
  # been in lockstep for a long time (version.txt is 1.14.2); the note that used to claim they
  # were invited exactly the wrong "fix".
  # Minor bump (1.11.0 -> 1.12.0): additive only — GET /approvals (the checker's queue, issue
  # #5679, mirroring sanctions' #3472) plus two additive fields on the PATCH .../approvals/{id}
  # response (makerId, createdAt). No breaking change.
  version: 1.13.0
  description: BIAN-aligned transaction history, search and retrieval.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8102
    description: Local development
tags:
  - name: Transactions

paths:
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions for an account (cursor-paginated)
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Transactions]
      summary: Initiate a new transaction
      operationId: initiateTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/search:
    get:
      tags: [Transactions]
      summary: Search transactions (IBAN/BBAN/reference/amount/date/counterparty)
      operationId: searchTransactions
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: iban
          in: query
          schema:
            type: string
        - name: bban
          in: query
          schema:
            type: string
        - name: referenceNumber
          in: query
          schema:
            type: string
        - name: endToEndId
          in: query
          schema:
            type: string
        - name: counterparty
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, REVERSED]
        - name: type
          in: query
          schema:
            type: string
            enum: [DEBIT, CREDIT, TRANSFER, FEE, INTEREST, REVERSAL, ADJUSTMENT]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: amountMin
          in: query
          schema:
            type: number
        - name: amountMax
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSearchResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction by ID
      operationId: getTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/transactions/merge-sweep:
    post:
      tags: [Transactions]
      summary: Sweep a duplicate party's balance to the surviving party during an identity merge (ADR-0179)
      description: >-
        Operator-only bookkeeping correction, posted through the ordinary saga as an ADJUSTMENT.
        Deliberately its own action (`transaction.sweep`) rather than a flavour of
        `transaction.create`: `create` is on the M2M payment rails, so a four-eyes verb matching it
        could never be enabled without pausing automated payments. The server mints a structured
        `MERGE-SWEEP <ref>: party <a> -> <b>` description — the ledger has no entry-type or
        reason-code column, so that string is what makes the correction distinguishable from a
        customer transfer. `initiatedByPartyId` is forced null (bank-initiated, so no SCA challenge
        exists); the request carries no SCA fields.
      operationId: mergeSweep
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeSweepRequest'
      responses:
        '201':
          description: The adjustment transaction
        '403':
          description: Caller is not an operator or admin, or four-eyes approval is required
        '422':
          description: Insufficient available balance on the source pocket, or an unknown account

  /api/v1/transactions/{transactionId}/reverse:
    post:
      tags: [Transactions]
      summary: Reverse a completed transaction — R-transaction return path (ADR-0109)
      operationId: reverseTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseTransactionRequest'
      responses:
        '200':
          description: Reversal transaction created (or existing reversal returned — idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Transaction is not in COMPLETED status and cannot be reversed

  /api/v1/transactions/approvals:
    get:
      tags: [Transactions]
      summary: List pending four-eyes approvals, oldest first (ADR-0227 D2)
      description: >-
        The checker's queue (issue #5679, mirroring sanctions' #3472 and lending's shape).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id, and
        the Redis TTL (24h) then expires the request silently. Requires ROLE_OPERATOR or
        ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'

  /api/v1/transactions/approvals/{id}:
    patch:
      tags: [Transactions]
      summary: Approve or reject a pending four-eyes approval for a transaction (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the
        gated action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide,
        so the queue is readable by anyone who may decide, including the maker (seeing a request
        is not authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: transaction.reverse
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
    MergeSweepRequest:
      type: object
      required:
        [idempotencyKey, sourceAccountId, targetAccountId, sourcePartyId, survivingPartyId,
         amount, currencyCode, valueDate, mergeReference]
      properties:
        idempotencyKey:
          type: string
          description: Idempotency key — re-submitting the same key returns the existing adjustment
        sourceAccountId:
          type: string
          format: uuid
          description: The duplicate party's account, debited
        targetAccountId:
          type: string
          format: uuid
          description: The surviving party's account, credited. Its pocket for this currency must already exist
        sourcePartyId:
          type: string
          format: uuid
          description: The duplicate identity being retired — recorded in the journal description
        survivingPartyId:
          type: string
          format: uuid
          description: The surviving identity — recorded in the journal description
        amount:
          type: number
          description: Amount to sweep, in the pocket's currency
        currencyCode:
          type: string
          description: ISO-4217. Source and target pockets must both be this currency; no FX is performed
        valueDate:
          type: string
          format: date
        mergeReference:
          type: string
          description: >-
            Ties the posting to the approved merge case. The same value appears in party-service's
            `party.merge` audit event as `approval_reference`, so either end resolves the other.

    ReverseTransactionRequest:
      type: object
      required: [idempotencyKey, reason]
      properties:
        idempotencyKey:
          type: string
          description: Idempotency key — re-submitting the same key returns the existing reversal
        reason:
          type: string
          description: Human-readable reason for the reversal (e.g. pacs.004 return code)

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
        type:
          type: string
        sourceAccountId:
          type: string
          format: uuid
          nullable: true
        targetAccountId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
        description:
          type: string
          nullable: true
        valueDate:
          type: string
          format: date
        bookingDate:
          type: string
          format: date
        initiatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        rail:
          type: string
          nullable: true
          description: >
            Which scheme carried the money (ADR-0103). One of the PaymentRail enum values
            (SEPA_CT, SEPA_INST, SWIFT, DOMESTIC, CARD, INTERNAL, CASH, FEE, INTEREST, UNKNOWN).
            Null on legacy rows not yet stamped.
        instructionType:
          type: string
          nullable: true
          description: >
            How the movement was instructed (ADR-0103) — orthogonal to rail. One of the
            InstructionType enum values (ONE_OFF, STANDING_ORDER, DIRECT_DEBIT,
            FUTURE_DATED, SYSTEM, UNKNOWN). Null on legacy rows not yet stamped.
        merchantCategory:
          type: string
          nullable: true
          description: MCC-derived merchant category for card spend (ADR-0103).
        merchant:
          $ref: "#/components/schemas/Merchant"
          nullable: true
          description: >
            Resolved public identity of the merchant behind a card transaction (D5). ABSENT when
            the acquirer descriptor is not in the catalogue — which is the normal case — and never
            populated with a guess: absence is what tells a client to render `description` raw.
            `description` itself is passed through byte-identical whether or not this is present,
            because disputes and SPAYD are built from the raw acquirer text.

    Merchant:
      type: object
      description: >
        Public identity of a merchant. Holds PUBLIC BUSINESS data — where a shop is — and never
        cardholder location: nothing in the catalogue behind it is keyed by customer, card or
        transaction.
      properties:
        cleanName:
          type: string
          description: Trading name, e.g. "Alza.cz" for the descriptor "ALZA.CZ A.S. PRAGUE CZ".
        logoUrl:
          type: string
          nullable: true
          description: Bank-controlled CDN URL. Never a third-party hotlink (privacy + availability).
        category:
          type: string
          nullable: true
          description: Catalogue category, e.g. GROCERIES, DINING, TRANSPORT.
        geo:
          $ref: "#/components/schemas/MerchantGeo"
          nullable: true
        source:
          type: string
          enum: [ENRICHED]
          description: >
            Always ENRICHED when this object is present. The field exists so a client never has to
            infer whether a name came from the bank or from the acquirer.
      required: [cleanName, source]
    MerchantGeo:
      type: object
      description: >
        Location of the SHOP, for card-present spend. Absent for card-not-present merchants: an
        e-shop has no place where the money was spent, and a head-office pin on a "where you spent"
        map would be fiction.
      properties:
        lat:
          type: number
          format: double
          description: WGS84 latitude.
        lon:
          type: number
          format: double
          description: WGS84 longitude.
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO-3166 alpha-2.
      required: [lat, lon]

    InitiateTransactionRequest:
      type: object
      required: [idempotencyKey, type, amount, currencyCode, valueDate]
      properties:
        idempotencyKey:
          type: string
        type:
          type: string
        sourceAccountId:
          type: string
          format: uuid
          nullable: true
        targetAccountId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        currencyCode:
          type: string
        baseCurrencyCode:
          type: string
          nullable: true
        baseAmount:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
        valueDate:
          type: string
          format: date
        initiatedByPartyId:
          type: string
          format: uuid
          nullable: true
        scaChallengeId:
          type: string
          format: uuid
          nullable: true
        scaExemption:
          type: string
          nullable: true
        rail:
          type: string
          nullable: true
          description: PaymentRail name (ADR-0103 D2) — which scheme is carrying this payment.
        instructionType:
          type: string
          nullable: true
          description: InstructionType name (ADR-0103 D2) — how the movement was instructed.

    TransactionPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        pagination:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean

    TransactionSearchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
