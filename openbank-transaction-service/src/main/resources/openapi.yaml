openapi: 3.1.0
info:
  title: Transaction Service API
  # The API-contract version (ADR-0048), an axis INDEPENDENT of the release version in
  # version.txt — classified from the OpenAPI diff, never forced equal to it. The two have not
  # been in lockstep for a long time (version.txt is 1.14.2); the note that used to claim they
  # were invited exactly the wrong "fix".
  # Minor bump (1.11.0 -> 1.12.0): additive only — GET /approvals (the checker's queue, issue
  # #5679, mirroring sanctions' #3472) plus two additive fields on the PATCH .../approvals/{id}
  # response (makerId, createdAt). No breaking change.
  # 1.16.0 -> 1.17.0 (#9115): additive — MerchantGeo.precision, the per-town location routes, and
  # the logo-ingest routes. 1.16.0 was claimed on main by #8838 while this branch was open, so this
  # takes the next free minor; whoever lands second renumbers (the matching version line merging
  # "cleanly" is the trap — git sees identical text, not a taken version).
  # 1.17.0 -> 1.18.0 (#9145): additive — the shared spend-category vocabulary, plus
  # `category`/`categorySource` on TransactionResponse. This branch still carried 1.16.0, which
  # #8838 and then #9115 have both since passed.
  version: 1.18.0
  description: BIAN-aligned transaction history, search and retrieval.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8102
    description: Local development
tags:
  - name: Transactions

paths:
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions for an account (cursor-paginated)
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Transactions]
      summary: Initiate a new transaction
      operationId: initiateTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/search:
    get:
      tags: [Transactions]
      summary: Search transactions (IBAN/BBAN/reference/amount/date/counterparty)
      operationId: searchTransactions
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: iban
          in: query
          schema:
            type: string
        - name: bban
          in: query
          schema:
            type: string
        - name: referenceNumber
          in: query
          schema:
            type: string
        - name: endToEndId
          in: query
          schema:
            type: string
        - name: counterparty
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, COMPLETED, FAILED, REVERSED]
        - name: type
          in: query
          schema:
            type: string
            enum: [DEBIT, CREDIT, TRANSFER, FEE, INTEREST, REVERSAL, ADJUSTMENT]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: amountMin
          in: query
          schema:
            type: number
        - name: amountMax
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSearchResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction by ID
      operationId: getTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/transactions/category-overrides:
    get:
      tags: [Transactions]
      summary: Every spend category the customer has set on this account
      operationId: listCategoryOverrides
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The account's category overrides
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryOverride'
        '400':
          description: accountId was not supplied
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/transactions/{transactionId}/category:
    put:
      tags: [Transactions]
      summary: Set the customer's own category for this transaction's counterparty
      description: >-
        Categorises the COUNTERPARTY, not the single transaction: naming a landlord once has to
        hold for next month's rent too. The server derives the counterparty key from the
        transaction, using the ISO 20022 counterparty name where there is one and the card
        acquirer descriptor otherwise — which is why this reaches spending no card was involved
        in, unlike the merchant catalogue. The key is never accepted from the caller: a composed
        key is a forgeable one, and its normalisation has to stay identical to the catalogue's.
        `accountId` is required and checked against the transaction rather than inferred, because
        an internal transfer touches two accounts and only the caller knows which statement it is
        looking at.
      operationId: setTransactionCategory
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  type: string
                  description: A shared spend-category id, upper-cased by the server before validation.
      responses:
        '200':
          description: The override that is now in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOverride'
        '400':
          description: Unknown category, missing accountId, or the transaction is not on that account
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The transaction names no counterparty a category could attach to
    delete:
      tags: [Transactions]
      summary: Remove the customer's category for this transaction's counterparty
      description: >-
        Idempotent. Removing a category that was never set is the state the caller asked for, so
        it answers 204 rather than 404.
      operationId: clearTransactionCategory
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No override remains for that counterparty
        '400':
          description: Missing accountId, or the transaction is not on that account
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/transactions/merge-sweep:
    post:
      tags: [Transactions]
      summary: Sweep a duplicate party's balance to the surviving party during an identity merge (ADR-0179)
      description: >-
        Operator-only bookkeeping correction, posted through the ordinary saga as an ADJUSTMENT.
        Deliberately its own action (`transaction.sweep`) rather than a flavour of
        `transaction.create`: `create` is on the M2M payment rails, so a four-eyes verb matching it
        could never be enabled without pausing automated payments. The server mints a structured
        `MERGE-SWEEP <ref>: party <a> -> <b>` description — the ledger has no entry-type or
        reason-code column, so that string is what makes the correction distinguishable from a
        customer transfer. `initiatedByPartyId` is forced null (bank-initiated, so no SCA challenge
        exists); the request carries no SCA fields.
      operationId: mergeSweep
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeSweepRequest'
      responses:
        '201':
          description: The adjustment transaction
        '403':
          description: Caller is not an operator or admin, or four-eyes approval is required
        '422':
          description: Insufficient available balance on the source pocket, or an unknown account

  /api/v1/transactions/{transactionId}/reverse:
    post:
      tags: [Transactions]
      summary: Reverse a completed transaction — R-transaction return path (ADR-0109)
      operationId: reverseTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseTransactionRequest'
      responses:
        '200':
          description: Reversal transaction created (or existing reversal returned — idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Transaction is not in COMPLETED status and cannot be reversed

  # #8573: operator maintenance of the merchant enrichment catalogue. Additive and
  # operator-only — nothing here is proxied by customer-edge.
  /api/v1/merchants:
    get:
      tags: [Merchant catalogue]
      summary: List catalogue entries, most recently updated first
      operationId: listMerchants
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 0}
        - name: size
          in: query
          schema: {type: integer, default: 50, maximum: 200}
      responses:
        '200':
          description: One page of catalogue entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/MerchantAdmin'}
                  total: {type: integer, format: int64}
  /api/v1/merchants/unmatched:
    get:
      tags: [Merchant catalogue]
      summary: Most frequent acquirer descriptors with no catalogue entry
      description: >-
        The operator worklist. Reads a bounded window of recent transaction descriptions,
        normalises them the way the lookup does, drops the ones already in the catalogue and ranks
        what is left by how many transactions carried it. Bounded rather than exhaustive on
        purpose: normalisation is not expressible in SQL, and the value is in the top of the list.
      operationId: listUnmatchedDescriptors
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 25, maximum: 200}
        - name: scan
          in: query
          description: How many recent descriptions to consider.
          schema: {type: integer, default: 2000, maximum: 20000}
      responses:
        '200':
          description: Unmatched descriptors, most frequent first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    descriptorKey: {type: string}
                    occurrences: {type: integer}
  /api/v1/merchants/{descriptorKey}:
    put:
      tags: [Merchant catalogue]
      summary: Create or replace a catalogue entry
      description: >-
        Idempotent by key. The path value is normalised on the way in, so pasting a raw acquirer
        descriptor writes the row the lookup will actually hit.
      operationId: upsertMerchant
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MerchantUpsert'}
      responses:
        '200': {description: Entry replaced}
        '201': {description: Entry created}
        '400': {description: Key normalises to nothing, cleanName missing, or only one coordinate}
    delete:
      tags: [Merchant catalogue]
      summary: Remove a catalogue entry
      operationId: deleteMerchant
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Entry removed}
        '404': {description: No entry under that key}
  /api/v1/merchants/logo-sources:
    get:
      tags: [Merchant catalogue]
      summary: Whether logo fetching is enabled, and the hosts it may fetch from
      description: >-
        The operator screen needs this to decide whether to offer the fetch action at all: a feature
        that is off by design and one that is broken look identical from a 400, and an allowlist an
        operator cannot see is one they will guess at.
      operationId: getMerchantLogoSources
      responses:
        '200':
          description: Ingest configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  allowedHosts:
                    type: array
                    items: {type: string}
  /api/v1/merchants/{descriptorKey}/logo/fetch:
    put:
      tags: [Merchant catalogue]
      summary: Ingest a merchant logo from an allowlisted source URL
      description: >-
        Downloads a logo instead of having an operator upload the file. This is a server-side request
        forgery primitive by construction — the service fetches an operator-named URL from inside the
        cluster — so it is fenced four ways, each load-bearing on its own: a host allowlist that is
        EMPTY BY DEFAULT (with no configuration the endpoint refuses everything), https only, every
        resolved address checked to be publicly routable (an allowlisted name that resolves to
        127.0.0.1 or 169.254.169.254 is refused), and redirects refused rather than followed. What
        comes back is then decoded, dimension-checked and re-encoded exactly like an upload: fetching
        it ourselves makes the bytes no more trustworthy.
      operationId: fetchMerchantLogo
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceUrl]
              properties:
                sourceUrl: {type: string}
                licence:
                  type: string
                  nullable: true
                  description: The operator's assertion about the source; an image file carries no licence of its own.
                attribution: {type: string, nullable: true}
      responses:
        '200':
          description: Logo replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MerchantLogoWritten'}
        '201':
          description: Logo stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MerchantLogoWritten'}
        '400':
          description: >-
            Fetching disabled, missing sourceUrl, non-https scheme, host not allowlisted, host
            resolving to a non-public address, a redirect, a non-200 source, an oversized body, or
            content that is not a decodable raster image.
        '404': {description: No catalogue entry under that key to attach a logo to}
  /api/v1/merchants/{descriptorKey}/logo:
    get:
      tags: [Merchant catalogue]
      summary: The merchant's logo as a square PNG
      description: >-
        Served from this bank's own origin, which is the point of the endpoint existing at all: the
        alternative — a logo CDN's URL in the statement response — tells that CDN the customer's IP
        address and the merchant they paid, every time a transaction list renders. Cached for a
        year and immutable, which is safe only because the URL clients follow carries the content
        hash; new bytes are a new URL. Supports If-None-Match.
      operationId: getMerchantLogo
      parameters:
        - name: descriptorKey
          in: path
          required: true
          description: Raw or normalised acquirer descriptor; it is normalised the same way the lookup does.
          schema: {type: string}
        - name: size
          in: query
          description: Pixel size of the square variant. An enumeration, not a free number - the variants are pre-rendered.
          schema: {type: integer, enum: [64, 128], default: 64}
        - name: v
          in: query
          description: Cache-busting token echoed from the logoUrl the service issued. Ignored by the server.
          schema: {type: string}
      responses:
        '200':
          description: The logo bitmap
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            image/png:
              schema: {type: string, format: binary}
        '304': {description: The client's cached copy is current}
        '400': {description: Key normalises to nothing, or an unsupported size}
        '404': {description: No logo stored for this merchant}
    put:
      tags: [Merchant catalogue]
      summary: Store or replace a merchant logo from raw image bytes
      description: >-
        The upload is decoded and re-encoded as PNG rather than stored as sent. That is a security
        boundary, not a resize: it drops anything that was not part of the image — an appended
        payload, embedded metadata — and refuses formats that can carry script (SVG) or that
        declare implausible dimensions (a decompression bomb). Provenance query parameters record
        where a trademark came from and on what terms it may be shown.
      operationId: putMerchantLogo
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
        - name: sourceUrl
          in: query
          description: Where the bytes were obtained. Recorded, never served to a customer client.
          schema: {type: string}
        - name: licence
          in: query
          description: Terms the logo may be shown under, e.g. "trademark", "CC-BY-4.0".
          schema: {type: string}
        - name: attribution
          in: query
          description: Credit line a licence requires, where it requires one.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Logo replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MerchantLogoWritten'}
        '201':
          description: Logo stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MerchantLogoWritten'}
        '400': {description: Missing body, unsupported format, oversized upload, or implausible dimensions}
        '404': {description: No catalogue entry under that key to attach a logo to}
    delete:
      tags: [Merchant catalogue]
      summary: Remove a merchant logo
      operationId: deleteMerchantLogo
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Logo removed}
        '404': {description: No logo stored for this merchant}
  /api/v1/merchants/{descriptorKey}/locations:
    get:
      tags: [Merchant catalogue]
      summary: Per-town locations for one merchant
      operationId: listMerchantLocations
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Locations, by town
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MerchantLocation'}
        '400': {description: Key normalises to nothing}
  /api/v1/merchants/{descriptorKey}/locations/{cityToken}:
    put:
      tags: [Merchant catalogue]
      summary: Create or replace one town's location for a merchant
      description: >-
        `cityToken` is the town as the ACQUIRER DESCRIPTOR spells it — folded and upper-cased
        (`PLZEN`, not `Plzeň`) — because that is the token the read path derives from a transaction
        and matches on. It is folded the same way here, so an operator may type either form.
      operationId: upsertMerchantLocation
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
        - name: cityToken
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MerchantLocationUpsert'}
      responses:
        '200': {description: Location replaced}
        '201': {description: Location created}
        '400': {description: Key or town normalises to nothing, unknown precision, or EXACT without a terminalId}
    delete:
      tags: [Merchant catalogue]
      summary: Remove one town's location for a merchant
      operationId: deleteMerchantLocation
      parameters:
        - name: descriptorKey
          in: path
          required: true
          schema: {type: string}
        - name: cityToken
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Location removed}
        '400': {description: Key or town normalises to nothing}
        '404': {description: No location under that merchant and town}
  /api/v1/transactions/approvals:
    get:
      tags: [Transactions]
      summary: List pending four-eyes approvals, oldest first (ADR-0227 D2)
      description: >-
        The checker's queue (issue #5679, mirroring sanctions' #3472 and lending's shape).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id, and
        the Redis TTL (24h) then expires the request silently. Requires ROLE_OPERATOR or
        ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'

  /api/v1/transactions/approvals/{id}:
    patch:
      tags: [Transactions]
      summary: Approve or reject a pending four-eyes approval for a transaction (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    MerchantAdmin:
      type: object
      description: A catalogue entry as an operator sees it. Public business data only.
      properties:
        descriptorKey: {type: string}
        cleanName: {type: string}
        logoUrl:
          type: string
          nullable: true
          description: >-
            PROVENANCE — where the stored logo bitmap was obtained, for licence evidence. Operator
            facing; this is not the URL a customer client receives.
        logoContentHash:
          type: string
          nullable: true
          description: >-
            SHA-256 of the stored logo, or null when none has been ingested. Null is how the
            operator screen knows to offer "upload" rather than "replace".
        category: {type: string, nullable: true}
        lat: {type: number, format: double, nullable: true}
        lon: {type: number, format: double, nullable: true}
        city: {type: string, nullable: true}
        country: {type: string, nullable: true}
        geoPrecision:
          type: string
          enum: [EXACT, CITY]
          description: What the coordinates on this catalogue row can answer. CITY for every chain.
        updatedAt: {type: string, format: date-time}
    MerchantLogoWritten:
      type: object
      description: The key the logo landed under and the hash that now identifies its bytes.
      properties:
        descriptorKey: {type: string}
        contentHash: {type: string}
    MerchantUpsert:
      type: object
      required: [cleanName]
      description: >-
        Public business data only — a trading name, a logo, a shop location. Coordinates are both
        or neither; a half-populated pair is refused rather than becoming a pin at latitude 0.
      properties:
        cleanName: {type: string}
        logoUrl: {type: string, nullable: true}
        category: {type: string, nullable: true}
        lat: {type: number, format: double, nullable: true}
        lon: {type: number, format: double, nullable: true}
        city: {type: string, nullable: true}
        country: {type: string, nullable: true}
        geoPrecision:
          type: string
          enum: [EXACT, CITY]
          default: CITY
          description: >-
            Anything but EXACT is stored as CITY. A chain's single coordinate cannot be where a
            purchase happened in any of forty towns, so CITY is the honest default and EXACT on a
            catalogue row is reserved for a genuinely single-site merchant.
    MerchantLocation:
      type: object
      description: Where one merchant trades in one town, keyed by the town token its descriptors carry.
      properties:
        descriptorKey: {type: string}
        cityToken: {type: string}
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        city: {type: string, nullable: true}
        country: {type: string, nullable: true}
        precision: {type: string, enum: [EXACT, CITY]}
        terminalId: {type: string, nullable: true}
        source: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time}
    MerchantLocationUpsert:
      type: object
      required: [lat, lon]
      description: >-
        `precision` defaults to CITY and may only be EXACT together with a `terminalId`: a coordinate
        not tied to the device that took the payment cannot be about where the money was spent.
      properties:
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        city: {type: string, nullable: true}
        country: {type: string, nullable: true}
        precision: {type: string, enum: [EXACT, CITY], default: CITY}
        terminalId: {type: string, nullable: true}
        source: {type: string, nullable: true}
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the
        gated action; a DIFFERENT principal must decide it — enforced in RedisApprovalStore.decide,
        so the queue is readable by anyone who may decide, including the maker (seeing a request
        is not authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: transaction.reverse
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
    MergeSweepRequest:
      type: object
      required:
        [idempotencyKey, sourceAccountId, targetAccountId, sourcePartyId, survivingPartyId,
         amount, currencyCode, valueDate, mergeReference]
      properties:
        idempotencyKey:
          type: string
          description: Idempotency key — re-submitting the same key returns the existing adjustment
        sourceAccountId:
          type: string
          format: uuid
          description: The duplicate party's account, debited
        targetAccountId:
          type: string
          format: uuid
          description: The surviving party's account, credited. Its pocket for this currency must already exist
        sourcePartyId:
          type: string
          format: uuid
          description: The duplicate identity being retired — recorded in the journal description
        survivingPartyId:
          type: string
          format: uuid
          description: The surviving identity — recorded in the journal description
        amount:
          type: number
          description: Amount to sweep, in the pocket's currency
        currencyCode:
          type: string
          description: ISO-4217. Source and target pockets must both be this currency; no FX is performed
        valueDate:
          type: string
          format: date
        mergeReference:
          type: string
          description: >-
            Ties the posting to the approved merge case. The same value appears in party-service's
            `party.merge` audit event as `approval_reference`, so either end resolves the other.

    ReverseTransactionRequest:
      type: object
      required: [idempotencyKey, reason]
      properties:
        idempotencyKey:
          type: string
          description: Idempotency key — re-submitting the same key returns the existing reversal
        reason:
          type: string
          description: Human-readable reason for the reversal (e.g. pacs.004 return code)

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
        type:
          type: string
        sourceAccountId:
          type: string
          format: uuid
          nullable: true
        targetAccountId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        currencyCode:
          type: string
        status:
          type: string
        description:
          type: string
          nullable: true
        valueDate:
          type: string
          format: date
        bookingDate:
          type: string
          format: date
        initiatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        rail:
          type: string
          nullable: true
          description: >
            Which scheme carried the money (ADR-0103). One of the PaymentRail enum values
            (SEPA_CT, SEPA_INST, SWIFT, DOMESTIC, CARD, INTERNAL, CASH, FEE, INTEREST, UNKNOWN).
            Null on legacy rows not yet stamped.
        instructionType:
          type: string
          nullable: true
          description: >
            How the movement was instructed (ADR-0103) — orthogonal to rail. One of the
            InstructionType enum values (ONE_OFF, STANDING_ORDER, DIRECT_DEBIT,
            FUTURE_DATED, SYSTEM, UNKNOWN). Null on legacy rows not yet stamped.
        merchantCategory:
          type: string
          nullable: true
          description: MCC-derived merchant category for card spend (ADR-0103).
        category:
          type: string
          nullable: true
          description: >-
            The category to display. Resolved as: the customer's own category for this
            counterparty, else `merchantCategory`, else the merchant catalogue's category.
            `merchantCategory` keeps its MCC meaning and is never overwritten by a customer's
            choice, so a consumer that needs the card-network fact still reads that field.
            Absent when nothing categorises the transaction.
        categorySource:
          type: string
          nullable: true
          enum: [CUSTOMER, MCC, CATALOGUE]
          description: >-
            Whose category `category` is. CUSTOMER means the customer set it and can undo it;
            a client showing an undo affordance keys off this rather than guessing. Absent
            exactly when `category` is absent.
        merchant:
          $ref: "#/components/schemas/Merchant"
          nullable: true
          description: >
            Resolved public identity of the merchant behind a card transaction (D5). ABSENT when
            the acquirer descriptor is not in the catalogue — which is the normal case — and never
            populated with a guess: absence is what tells a client to render `description` raw.
            `description` itself is passed through byte-identical whether or not this is present,
            because disputes and SPAYD are built from the raw acquirer text.

    CategoryOverride:
      type: object
      required: [counterpartyKey, category]
      description: >
        One counterparty on one account, and the category the customer put on it. `counterpartyKey`
        is the server's normalised form of the counterparty name or acquirer descriptor — it is
        returned so a client can show and manage the overrides, and is not accepted as input on the
        write paths.
      properties:
        counterpartyKey:
          type: string
        category:
          type: string
    Merchant:
      type: object
      description: >
        Public identity of a merchant. Holds PUBLIC BUSINESS data — where a shop is — and never
        cardholder location: nothing in the catalogue behind it is keyed by customer, card or
        transaction.
      properties:
        cleanName:
          type: string
          description: Trading name, e.g. "Alza.cz" for the descriptor "ALZA.CZ A.S. PRAGUE CZ".
        logoUrl:
          type: string
          nullable: true
          description: >
            ORIGIN-RELATIVE path to the logo this bank serves itself, e.g.
            "/api/v1/merchants/ALZACZ/logo?size=64&v=<hash>". Never a third-party URL: an external
            logo host would learn the customer's IP address and the merchant they paid every time a
            statement renders, which is a spending profile leaving the bank through an img tag. The
            v token is a prefix of the image content hash, so replacing a logo changes the URL and
            the response may be cached immutably. Absent when no logo has been ingested — render
            what you render today, never a placeholder.
        category:
          type: string
          nullable: true
          description: Catalogue category, e.g. GROCERIES, DINING, TRANSPORT.
        geo:
          $ref: "#/components/schemas/MerchantGeo"
          nullable: true
        source:
          type: string
          enum: [ENRICHED]
          description: >
            Always ENRICHED when this object is present. The field exists so a client never has to
            infer whether a name came from the bank or from the acquirer.
      required: [cleanName, source]
    MerchantGeo:
      type: object
      description: >
        Location of the SHOP, for card-present spend. Absent for card-not-present merchants: an
        e-shop has no place where the money was spent, and a head-office pin on a "where you spent"
        map would be fiction.

        `precision` says how much the coordinates are worth, and a client MUST honour it. `EXACT`
        means the pin is about the place this money was spent — a single-site merchant, or a
        location resolved from the device that took the payment. `CITY` means the merchant trades in
        this town and the pin is representative: caption the town, do not draw a marker claiming a
        street. The distinction exists because the catalogue's seeded rows pinned each chain at one
        Prague address, so a purchase in Brno resolved 185 km from where it happened.
      properties:
        lat:
          type: number
          format: double
          description: WGS84 latitude.
        lon:
          type: number
          format: double
          description: WGS84 longitude.
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO-3166 alpha-2.
        precision:
          type: string
          enum: [EXACT, CITY]
          description: >
            EXACT = where the money was spent. CITY = the merchant trades in this town and the pin
            is representative.
      required: [lat, lon, precision]

    InitiateTransactionRequest:
      type: object
      required: [idempotencyKey, type, amount, currencyCode, valueDate]
      properties:
        idempotencyKey:
          type: string
        type:
          type: string
        sourceAccountId:
          type: string
          format: uuid
          nullable: true
        targetAccountId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        currencyCode:
          type: string
        baseAmount:
          type: number
          nullable: true
        baseCurrencyCode:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        valueDate:
          type: string
          format: date
        bookingDate:
          type: string
          nullable: true
        initiatedByPartyId:
          type: string
          format: uuid
          nullable: true
        scaChallengeId:
          type: string
          format: uuid
          nullable: true
        scaExemption:
          type: string
          nullable: true
        rail:
          type: string
          nullable: true
          description: PaymentRail name (ADR-0103 D2) — which scheme is carrying this payment.
        instructionType:
          type: string
          nullable: true
          description: InstructionType name (ADR-0103 D2) — how the movement was instructed.

    TransactionPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        pagination:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean

    TransactionSearchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
