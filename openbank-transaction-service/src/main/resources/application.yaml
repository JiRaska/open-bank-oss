quarkus:
  application:
    name: openbank-transaction-service

  http:
    port: 8102

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_transactions
    # The DEFAULT (Agroal/JDBC) datasource Flyway migrates. Declaring only the reactive URL leaves
    # it unconfigured, and `migrate-at-start` then kills the boot with "Unable to find datasource
    # '<default>' … Bean is not active: SYNTHETIC bean [class=AgroalDataSource]" — so the service
    # could start only where the gitops env supplied QUARKUS_DATASOURCE_JDBC_URL, never from this
    # file alone, including for `quarkusDev` (#3080). The env var still wins in the cluster.
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/openbank_transactions}

  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none

  # Four-eyes ApprovalStore backing store (ADR-0155). This service had no Redis client
  # before; in gitops it points at the payments namespace's existing shared Redis instance
  # (already used by sepa-payment/domestic-payment/sepa-instant idempotency).
  redis:
    hosts: redis://localhost:6379

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-transaction-service

  rest-client:
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
      connect-timeout: 2000
      read-timeout: 3000
    fx-service:
      url: ${FX_SERVICE_URL:http://localhost:8119}
      connect-timeout: 2000
      read-timeout: 3000
    balance-service:
      url: ${BALANCE_SERVICE_URL:http://localhost:8103}
      connect-timeout: 2000
      read-timeout: 3000

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137). These connector-wide Kafka client props
    # apply to every smallrye-kafka channel. Defaults keep local dev/test on
    # PLAINTEXT (empty keystore paths are ignored when protocol=PLAINTEXT);
    # the payments Rollout sets the KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      payment-scheme-accepted:
        connector: smallrye-kafka
        topic: payment.scheme-accepted
        group.id: transaction-scheme-accepted-cg
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # NOTE: this dotted key never actually resolves via YAML flattening (SmallRye
        # quotes any leaf map key containing a literal dot, so this only registers as
        # "auto.offset.reset" verbatim, not the plain property KafkaConnectorIncomingConfiguration
        # reads) — same bug as group.id/dead-letter-queue.topic below. Kept here (rather than
        # removed) so local dev/test still gets `earliest`; the deployed value actually comes
        # from the transaction-service-msg-override ConfigMap in gitops (issue #686).
        auto.offset.reset: earliest
        # DLQ ensures processing failures on this money-path consumer are retried out-of-band
        # rather than silently dropped (ignore) or stalling the partition (fail).
        failure-strategy: dead-letter-queue
        # #5745: NESTED, not `dead-letter-queue.topic:`. The dotted spelling this replaces
        # registered as ..."dead-letter-queue.topic" (quotes included) and the connector never
        # read it — so on a workstation and in every test this money-path channel silently fell
        # back to SmallRye's implicit `dead-letter-topic-payment-scheme-accepted`. Only the
        # deployed pod got the right name, from the transaction-service-msg-override ConfigMap
        # (which stays, unchanged: same value, and it is what production actually reads). Same
        # value here, now resolving everywhere. Proven both directions by
        # openbank-aml-service's DeadLetterQueueConfigResolutionTest.
        dead-letter-queue:
          topic: payment.scheme-accepted.dlq
    outgoing:
      transaction-events-out:
        connector: smallrye-kafka
        client.id: transaction-service-${quarkus.uuid}
        topic: openbank.transactions.transaction.initiated
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false

openbank:
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true
  rate-limit:
    enabled: true
    max-concurrent-requests: 150
  # ADR-0120 Phase 5: Temporal is the sole payment orchestrator (saga retired).
  #
  # ADR-0209 D1 (#2572): these keys used to sit under `openbank.transaction.orchestration.temporal`,
  # a prefix NOTHING read — TemporalConfig has always been @ConfigMapping(prefix="openbank.temporal"),
  # so every value here was inert and the service ran on the Kotlin @WithDefault values instead
  # (prod is unaffected either way: the GitOps manifests set OPENBANK_TEMPORAL_* env vars, which win
  # over both). Moved to the prefix that is actually bound, with the values the defaults supplied.
  temporal:
    server-url: ${TEMPORAL_SERVER_URL:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:openbank-payments}
    task-queue: ${TEMPORAL_TASK_QUEUE:openbank-payment-execution}
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_transactions_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_transactions_it
    flyway:
      datasource:
        jdbc:
          url: jdbc:postgresql://localhost:5432/openbank_transactions_it
    management:
      enabled: false
    oidc:
      enabled: false
    devservices:
      enabled: false
  openbank:
    transaction:
      worker:
        # The in-process TestWorkflowEnvironment registers its own deterministic no-op worker;
        # a second (real) worker on the same queue makes dispatch a lottery (#465).
        enabled: false
    temporal:
      server-url: localhost:7233

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second
  # approver), independent of the base allow/deny enforce toggle above. Stays false
  # here — this PR only wires the ApprovalStore/endpoint (mirrors the account-service
  # rollout); flipping this is a deliberate, separate follow-up once the maker/checker
  # runbook is reviewed, not bundled with the wiring itself.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
