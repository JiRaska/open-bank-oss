# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: payments
primaryDatastore: PostgreSQL
databaseName: openbank_cards
dataLineageRole: producer
dataClassification: restricted
retentionPolicy: 7 years
evidenceExported: true
lineage:
  upstream: []
    # Removed (issue #3982): `dispute-service (api, "blocks")` — dispute-service has no
    # @RegisterRestClient at all and its Deployment env lists only keycloak and tempo. The one
    # service that does hold a card-issuance client is delegation-service
    # (ResourceOwnershipClient), and that edge is declared on delegation-service's own side.
databaseLineage:
  ownedDatabases:
    - openbank_cards
  dependentDatabases:
    - openbank_accounts
