quarkus:
  application:
    name: openbank-card-issuance-service
  http:
    port: 8118
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_cards
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_cards
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # M2M client for the outbound product-catalog lookup — product-catalog authenticates its
  # readers (#743), so an unauthenticated call would 401 and silently degrade every card
  # entitlement rule to the permissive fallback.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none
  rest-client:
    # Short timeouts on purpose: product-catalog is KEDA scale-to-zero, and this lookup is
    # fail-open (see CardProductCatalogPort) — waiting on a cold start would delay every issue
    # for a rule that is allowed to be skipped.
    "product-catalog-api":
      # `openbank-product-catalog:8080` resolved to nothing and named the wrong port — the
      # Service is `product-catalog` on 8104 in namespace `accounts`. Overridden in the cluster
      # (PRODUCT_CATALOG_SERVICE_URL points at the KEDA interceptor); localhost:8104 matches
      # billing/document-service (issue #3931).
      url: ${PRODUCT_CATALOG_SERVICE_URL:http://localhost:8104}
      connect-timeout: 3000
      read-timeout: 5000
  redis:
    hosts: redis://localhost:6379
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-card-issuance-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      party-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.card-issuance.party-events-in
        connector: smallrye-kafka
        topic: openbank.party.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Delegation-grant enforcement projection for cards (ADR-0232 D3): CARD-scoped
      # lifecycle events feed card_delegation_projection; the guard answers holder OR
      # grant locally, never calling delegation-service on the request path. group.id
      # comes from the msg-override ConfigMap (same dotted-key trap as party-events-in).
      delegation-events-in:
        connector: smallrye-kafka
        topic: openbank.delegation.events
        failure-strategy: dead-letter-queue
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # client.id / group.id / auto.offset.reset are deliberately NOT set as YAML keys here.
        # SmallRye Config's YAML source unconditionally quotes any leaf map key containing a
        # literal dot (`group.id` registers only as the literal property name `"group.id"`,
        # quotes included), so KafkaConnectorIncomingConfiguration's plain
        # config.getOptionalValue("group.id", ...) never finds it — group.id then silently falls
        # back to Quarkus's default (quarkus.application.name = openbank-card-issuance-service),
        # which this service's KafkaUser ACL does not grant Read/Describe on
        # (openbank-infra/gitops/components/payments/kafka-scheme-accepted-acl.yaml, group
        # cardissuance-party), so every consumer poll would hit a silent
        # GroupAuthorizationException. auto.offset.reset would likewise silently fall back to
        # Kafka's `latest` default instead of `earliest`. Set instead via the
        # card-issuance-service-msg-override ConfigMap (QUARKUS_CONFIG_LOCATIONS,
        # config_ordinal=500) — a properties FILE, matching the pattern already established for
        # transaction-service's payment-scheme-accepted channel (see
        # openbank-infra/gitops/components/payments/transaction-service-msg-override.yaml); it
        # carries the exact hyphenated property key unambiguously, avoiding any reliance on
        # MicroProfile Config's env-var-name reverse-mapping for channel discovery.
        #
        # Correction (round 2): an earlier version of this comment first cited nonexistent issues
        # #2649/#2659, then over-corrected to claim env vars are "independently verified to work"
        # here — that overstated it too. The genuine concern is real: quarkusio/quarkus#30106 and
        # smallrye/smallrye-reactive-messaging#2028 document a live, unresolved upstream bug where
        # an env-var override of a single leaf property (e.g. `retries`, here `group.id`/
        # `auto.offset.reset`) on a HYPHENATED channel name crashes Quarkus at startup
        # (`SRMSG00071`, "connector attribute must be set for channel <wrong split>") — regardless
        # of whether the channel is already registered via YAML/annotations. Boot tests added
        # during this sweep inject the override via a QuarkusTestResourceLifecycleManager config
        # map, not a real OS env var, so they don't exercise this failure mode. This properties-file
        # mechanism is the CORRECT choice for a hyphenated channel like `party-events-in`, not
        # merely a stylistic alternative.
    outgoing:
      # ADR-0050 transactional-outbox egress. The dispatcher sets the Kafka key (= aggregate id, N2)
      # and ce-id/idempotency-key/ce-type headers (N3) via OutgoingKafkaRecordMetadata, so both a key
      # and a value serializer are required here.
      card-events-out:
        connector: smallrye-kafka
        client.id: cardissuance-${quarkus.uuid}
        topic: openbank.cards.events
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
"%dev":
  openbank:
    card:
      # No key here on purpose: this repo is public and a committed base64 blob is exactly what
      # the Gitleaks gate exists to stop. With no key configured the cipher mints an ephemeral one
      # per boot; export OPENBANK_CARD_PAN_ENCRYPTION_KEY to pin a stable key locally.
      allow-ephemeral-pan-key: true
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  openbank:
    card:
      # Same as dev: an ephemeral per-boot key, nothing committed (see the dev profile above).
      allow-ephemeral-pan-key: true
  quarkus:
    # Dedicated IT Postgres on the warm CI stack (ADR-0043); CI auto-creates any openbank_*_it
    # database referenced here. Dev Services stay OFF — tests hit localhost:5432 exactly as on a
    # workstation.
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: postgresql://localhost:5432/openbank_cards_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_cards_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    # ADR-0050: disable the @Scheduled outbox tick under test so the integration test drives
    # dispatchScheduledBatch() explicitly and never races the assertions.
    scheduler:
      enabled: false
openbank:
  card:
    # Base64 of 32 random bytes (AES-256). Deliberately absent from this file: card-issuance
    # refuses to boot rather than store synthetic PANs unencrypted (AesGcmCardSecretCipher).
    # In-cluster the value is an OpenBao/ESO-projected secret supplied as the environment variable
    # OPENBANK_CARD_PAN_ENCRYPTION_KEY, which Quarkus maps onto this property natively — an
    # explicit `${...}` indirection here would expand to an empty string when unset, and SmallRye
    # rejects that as "failed to load config value" instead of falling back to the default.
    #
    # key-source: "flat-key" (default, unset) keeps the above. "openbao-transit" (ADR-0262) switches
    # to AesGcmCardSecretCipher/OpenBaoEnvelopeCardSecretCipher, envelope encryption — the local DEK
    # is unwrapped once at boot from openbank.card.envelope.wrapped-dek via an OpenBao Transit key.
    # Deliberately not set here for the same reason pan-encryption-key is absent: this is a
    # per-environment opt-in, not a repo default.
    #
    # envelope.previous-wrapped-dek: set ONLY while migrating off a rotated-out DEK
    # (CardPanKeyReencrypt). Absent (the default) means the re-encrypt starter does nothing on
    # boot — no config read beyond the Optional check, no OpenBao call. An operator sets this to
    # the OLD wrapped-dek value right after rotating envelope.wrapped-dek to a freshly-wrapped one,
    # leaves it set until a boot's log line reports 0 remaining, then unsets it.
  outbox:
    dispatch-enabled: true
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  retention:
    card-pii:
      enabled: "${RETENTION_CARD_PII_ENABLED:true}"
      retention-years: "${RETENTION_CARD_PII_YEARS:5}"
      cron: "${RETENTION_CARD_PII_CRON:0 0 3 * * ?}"
      dry-run: "${RETENTION_CARD_PII_DRY_RUN:false}"

# OPA sidecar (ADR-0034). Advisory mode by default — without this block the
# AuthorizeInterceptor's enforce=true default turns an unreachable sidecar into
# 503s on every @Authorize endpoint (surfaced by the first REST IT in this service).
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
