openapi: 3.1.0
info:
  title: Card Issuance Service API
  version: 1.8.0
  description: Debit/credit card lifecycle — issue, activate, block, suspend, resume, cancel;
    synthetic PAN vault, product-catalog entitlements, and additional-cardholder cards issued
    under a delegation grant (ADR-0249 D1/D2).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8118
    description: Local development
tags:
  - name: Cards

paths:
  /api/v1/cards:
    get:
      tags: [Cards]
      summary: List every card
      description: >-
        The unfiltered collection. Requires ROLE_VIEWER, ROLE_OPERATOR or ROLE_ADMIN (authorize
        action `card.list`). Never carries PAN/CVV — those are only ever served by
        `/api/v1/cards/{id}/secure-details`.
      operationId: listCards
      responses:
        '200':
          description: All cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
    post:
      tags: [Cards]
      summary: Issue a new card
      operationId: issueCard
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCardRequest'
      responses:
        '201':
          description: Card issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '409':
          description: >
            A product-catalog entitlement rule rejected the issue — CARD_QUOTA_EXCEEDED,
            CARD_PRODUCT_DISABLED, CARD_VIRTUAL_NOT_ALLOWED or CARD_NETWORK_NOT_ALLOWED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/cards/{id}:
    get:
      tags: [Cards]
      summary: Get card by ID
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cards/{id}/delegation/check:
    get:
      tags: [Cards]
      summary: Whether a party may act on a card via delegation
      description: >-
        Machine-readable answer to "may this party VIEW or MANAGE_LIMITS on this card?"
        (ADR-0232 D3): true when the party is the card holder or holds an ACTIVE,
        in-window delegation grant from the local event-fed projection. Never reveals
        the grant itself. Authorize action `card.read`.
      operationId: checkCardDelegation
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum: [VIEW, MANAGE_LIMITS]
      responses:
        '200':
          description: The authorization decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized:
                    type: boolean

  /api/v1/cards/account/{accountId}:
    get:
      tags: [Cards]
      summary: List cards for an account
      operationId: listCardsByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cards

  /api/v1/cards/party/{partyId}:
    get:
      tags: [Cards]
      summary: List cards for a party
      operationId: listCardsByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cards

  /api/v1/cards/{id}/activate:
    post:
      tags: [Cards]
      summary: Activate a card
      operationId: activateCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card activated

  /api/v1/cards/{id}/block:
    post:
      tags: [Cards]
      summary: Block a card (permanent)
      operationId: blockCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusRequest'
      responses:
        '200':
          description: Card blocked

  /api/v1/cards/{id}/cancel:
    post:
      tags: [Cards]
      summary: Cancel a card permanently (terminal)
      operationId: cancelCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusRequest'
      responses:
        '200':
          description: Card cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '422':
          description: Card is already terminal (CANCELLED / EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/cards/{id}/secure-details:
    get:
      tags: [Cards]
      summary: Read a virtual card's synthetic PAN/CVV (VIRTUAL and SINGLE_USE only)
      description: >
        Returns the synthetic, Luhn-valid test PAN generated at issue time. Never a real
        cardholder PAN. Served with Cache-Control:no-store; the access is audited.
      operationId: getCardSecureDetails
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Synthetic card credential
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["no-store"]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSecureDetailsResponse'
        '403':
          description: >
            CARD_SECURE_DETAILS_NOT_SUPPORTED (card has plastic) or
            CARD_SECURE_DETAILS_CARD_NOT_LIVE (BLOCKED / CANCELLED / EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Card not found, or CARD_SECURE_DETAILS_NOT_STORED (issued before the vault)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/cards/party/{partyId}/entitlements:
    get:
      tags: [Cards]
      summary: Card entitlements of a party on a product
      description: >
        Resolved from product-catalog's cardConfig. When source is FALLBACK the catalog did not
        answer and maxCards/remaining are -1 ("no known cap"), not 0.
      operationId: getCardEntitlements
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEntitlementsResponse'

  /api/v1/cards/{id}/limits:
    put:
      tags: [Cards]
      summary: Set a card's daily and monthly spending limits
      operationId: updateCardLimits
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyLimitMinorUnits, monthlyLimitMinorUnits]
              properties:
                dailyLimitMinorUnits:
                  type: integer
                  format: int64
                monthlyLimitMinorUnits:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Limits updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/v1/cards/category-taxonomy:
    get:
      tags: [Cards]
      summary: Merchant category taxonomy — ids, labels, MCC ranges, what may be blocked
      description: >
        Served rather than hardcoded in clients. A client that hardcoded "gambling is MCC 7995"
        would keep letting spend through after the bank added a code, on every build already
        installed; publishing the taxonomy makes the enforcement point and the screen agree by
        construction.
      operationId: getCardCategoryTaxonomy
      responses:
        '200':
          description: Taxonomy
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        mccRanges:
                          type: array
                          items: { type: string }
                          description: 'Inclusive ranges ("7800-7802") or single codes ("7995").'
                        blockable:
                          type: boolean
                          description: >
                            False for OTHER — blocking everything unclassified would decline
                            arbitrary legitimate spend as the acquirer estate changes, and the
                            customer could never see what they had turned off.
                        limitable: { type: boolean }
                  unmappedMccCategory:
                    type: string
                    description: Category an unrecognised or absent MCC falls into.
  /api/v1/cards/{id}/category-limits:
    get:
      tags: [Cards]
      summary: A card's per-category blocks and monthly caps
      operationId: getCardCategoryLimits
      parameters:
        - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Category rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryLimits'
    put:
      tags: [Cards]
      summary: Replace a card's per-category blocks and monthly caps
      description: >
        Whole-state replacement, not a patch: the payload is what the caller wants to be true, so a
        client is never in a read-modify-write race with itself, and a rule removed from the screen
        genuinely stops being enforced. SCA for raising a cap or unblocking a category is enforced
        at the customer edge, where the challenge lives.
      operationId: replaceCardCategoryLimits
      parameters:
        - $ref: '#/components/parameters/cardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limits:
                  type: array
                  items:
                    type: object
                    required: [category]
                    properties:
                      category: { type: string }
                      monthlyLimitMinorUnits:
                        type: integer
                        format: int64
                        nullable: true
                        description: 'Null = uncapped. Zero is a real cap of nothing, which is different.'
                      blocked: { type: boolean }
      responses:
        '200':
          description: Rules replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryLimits'
        '400':
          description: 'CATEGORY_UNKNOWN or CATEGORY_NOT_BLOCKABLE'
  /api/v1/cards/{id}/authorizations:
    post:
      tags: [Cards]
      summary: Decide a card authorization against status, channel controls and category rules
      description: >
        The card authorization decision point. Until it existed the channel controls
        (contactless / online / ATM / abroad) were stored, returned by the API and read by nothing —
        a customer who switched off payments abroad changed a boolean and nothing else. An unknown
        card is DECLINED rather than 404: an acquirer needs an answer, and the safe answer to "may
        this unknown card spend" is no.
      operationId: decideCardAuthorization
      parameters:
        - $ref: '#/components/parameters/cardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinorUnits, channel]
              properties:
                amountMinorUnits: { type: integer, format: int64 }
                channel:
                  type: string
                  enum: [CONTACTLESS, ONLINE, ATM, CHIP_AND_PIN]
                  description: >
                    CHIP_AND_PIN has no customer toggle by design — a customer able to disable every
                    rail could lock themselves out of every terminal with no way back.
                mcc: { type: string, nullable: true }
                countryCode:
                  type: string
                  nullable: true
                  description: >
                    ISO-3166 alpha-2 of the acquirer. Absent counts as domestic: declining on
                    missing data would break ordinary spend at terminals with sparse messages.
                spentTodayMinorUnits: { type: integer, format: int64 }
                spentThisMonthMinorUnits: { type: integer, format: int64 }
                spentThisMonthInCategoryMinorUnits: { type: integer, format: int64 }
      responses:
        '200':
          description: Decision (an approved and a declined authorization both answer 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: boolean }
                  declineReason:
                    type: string
                    nullable: true
                    enum: [CARD_NOT_ACTIVE, CHANNEL_DISABLED, ABROAD_DISABLED, CATEGORY_BLOCKED, CATEGORY_LIMIT_EXCEEDED, DAILY_LIMIT_EXCEEDED, MONTHLY_LIMIT_EXCEEDED]
                  category:
                    type: string
                    description: Category the request was judged as — present on approval too.
        '400':
          description: CHANNEL_UNKNOWN
  /api/v1/cards/{id}/controls:
    put:
      tags: [Cards]
      summary: Set a card's channel controls (contactless / online / ATM / abroad)
      operationId: updateCardControls
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactlessEnabled, onlineEnabled, atmEnabled, abroadEnabled]
              properties:
                contactlessEnabled:
                  type: boolean
                onlineEnabled:
                  type: boolean
                atmEnabled:
                  type: boolean
                abroadEnabled:
                  type: boolean
      responses:
        '200':
          description: Controls updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/v1/cards/{id}/suspend:
    post:
      tags: [Cards]
      summary: Temporarily suspend a card
      operationId: suspendCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card suspended

  /api/v1/cards/{id}/resume:
    post:
      tags: [Cards]
      summary: Resume a suspended card
      operationId: resumeCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card resumed

  # Operator recovery for the transactional outbox (#4005). Not part of the card API a client
  # consumes — it exists because DEAD is terminal by design (ADR-0050 N5) and a service whose
  # rows all went DEAD has no self-healing path. Replay is manual because openbank-audit-service
  # is not idempotent: see CardOutboxAdminResource's KDoc for the evidence.
  /api/v1/cards/outbox/requeue:
    post:
      tags: [Card outbox operations]
      summary: Requeue dead-lettered card outbox rows (DEAD -> PENDING)
      operationId: requeueDeadCardOutbox
      parameters:
        - name: eventId
          in: query
          required: false
          description: Requeue exactly this outbox row. Omit to requeue every DEAD row.
          schema:
            type: string
            format: uuid
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rows requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxRequeueResponse'
        '400':
          description: X-Operator-Id missing/blank, or eventId is not a UUID
        '403':
          description: Caller does not hold ROLE_ADMIN

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    cardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    OutboxRequeueResponse:
      type: object
      properties:
        requeued:
          type: integer
          description: Rows moved DEAD -> PENDING by this call.
        deadRemaining:
          type: integer
          format: int64
          description: DEAD rows still parked after this call (0 after a full requeue).
      required: [requeued, deadRemaining]
    CategoryLimits:
      type: object
      properties:
        limits:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              monthlyLimitMinorUnits: { type: integer, format: int64, nullable: true }
              blocked: { type: boolean }
        spendTracking:
          type: boolean
          description: >
            False while per-category spend is not tracked. Present so a client renders "no data"
            rather than a progress ring against a zero that looks measured.

    IssueCardRequest:
      type: object
      required: [partyId, accountId, cardType, cardNetwork]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        cardType:
          type: string
          enum: [DEBIT, CREDIT, PREPAID, VIRTUAL, SINGLE_USE]
        cardNetwork:
          type: string
          enum: [VISA, MASTERCARD]
        embossedName:
          type: string
        deliveryAddress:
          type: object
        delegationGrantId:
          type: string
          format: uuid
          description: >-
            ADR-0249 D1 — the delegation grant authorising this card for a holder who is NOT the
            account owner ("dodatková karta"). Omit for an ordinary card. This service records the
            link but does not verify the grant: the caller (customer-edge) proves the grant and the
            grantor's SCA. The link is what makes revocation reach the card — when the grant ends,
            every card carrying its id is blocked (ADR-0249 D2).

    CardStatusRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    CardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        maskedPan:
          type: string
          example: "****-****-****-1234"
        cardType:
          type: string
        cardNetwork:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, BLOCKED, EXPIRED, CANCELLED, CONSUMED]
          description: >
            CONSUMED is terminal and applies only to SINGLE_USE cards: the card authorised once and
            closed itself. Kept distinct from CANCELLED because it is the promise being kept, not a
            failure — telling a customer their disposable card was "cancelled" reads as something
            going wrong.
        closedReason:
          type: string
          nullable: true
          enum: [SINGLE_USE_CONSUMED, VALIDITY_EXPIRED, LOST_OR_STOLEN, CUSTOMER_CANCEL]
          description: >
            Why the card reached a terminal status; absent while it is alive. Without it, "cancelled"
            covered a customer closing a card, a lost card, and a disposable card doing exactly what
            it promised — three things a customer is owed three different sentences about.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            SINGLE_USE only: when the card stops being usable even if never presented. A disposable
            card that is never spent must still stop being a live PAN.
        expiryDate:
          type: string
          example: "12/27"
        issuedAt:
          type: string
          format: date-time
        delegationGrantId:
          type: string
          format: uuid
          nullable: true
          description: ADR-0249 D1 — present only on an additional-cardholder card.
        delegated:
          type: boolean
          description: >-
            True when this card was issued to a delegate rather than the account owner. Branch on
            this rather than on delegationGrantId being non-null.

    CardSecureDetailsResponse:
      type: object
      required: [pan, cvv, expiryDate, cardholderName, network]
      properties:
        pan:
          type: string
          # No `example:` on purpose. Any 16-digit Luhn-valid string here trips the repo's
          # pan-card-number secret-scan rule, and that rule is right to fire on a public repo:
          # a reader cannot tell a documentation sample from a leak, and neither can a scanner.
          description: >-
            Synthetic, Luhn-valid test PAN, 16 digits (15 for AMEX), no separators.
            Never a real cardholder PAN — generated from a test BIN at issue time.
          minLength: 15
          maxLength: 19
        cvv:
          type: string
          description: 3 digits (4 for AMEX).
          minLength: 3
          maxLength: 4
        expiryDate:
          type: string
          format: date
        cardholderName:
          type: string
        network:
          type: string
          enum: [VISA, MASTERCARD, AMEX, UNIONPAY]

    CardEntitlementsResponse:
      type: object
      required: [productCode, maxCards, issued, remaining, enabled, source]
      properties:
        productCode:
          type: string
        maxCards:
          type: integer
          description: -1 when source is FALLBACK (no known cap)
        issued:
          type: integer
          description: Cards in a live status (PENDING / ACTIVE / SUSPENDED)
        remaining:
          type: integer
          description: -1 when source is FALLBACK
        virtualCardAllowed:
          type: boolean
        singleUseAllowed:
          type: boolean
        networks:
          type: array
          items:
            type: string
            enum: [VISA, MASTERCARD, AMEX, UNIONPAY]
        tiers:
          type: array
          items:
            type: string
        monthlyFeePerCard:
          type: number
        enabled:
          type: boolean
        source:
          type: string
          enum: [CATALOG, FALLBACK]

    ApiError:
      type: object
      properties:
        code:
          type: string
          description: >
            Machine-readable failure code. Card-specific values: CARD_QUOTA_EXCEEDED,
            CARD_PRODUCT_DISABLED, CARD_NETWORK_NOT_ALLOWED, CARD_VIRTUAL_NOT_ALLOWED,
            CARD_SECURE_DETAILS_NOT_SUPPORTED, CARD_SECURE_DETAILS_CARD_NOT_LIVE,
            CARD_SECURE_DETAILS_NOT_STORED.
        message:
          type: string
