openapi: 3.1.0
info:
  title: Card Issuance Service API
  version: 1.3.0
  description: Debit/credit card lifecycle — issue, activate, block, suspend, resume, cancel;
    synthetic PAN vault and product-catalog entitlements.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8118
    description: Local development
tags:
  - name: Cards

paths:
  /api/v1/cards:
    get:
      tags: [Cards]
      summary: List every card
      description: >-
        The unfiltered collection. Requires ROLE_VIEWER, ROLE_OPERATOR or ROLE_ADMIN (authorize
        action `card.list`). Never carries PAN/CVV — those are only ever served by
        `/api/v1/cards/{id}/secure-details`.
      operationId: listCards
      responses:
        '200':
          description: All cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
    post:
      tags: [Cards]
      summary: Issue a new card
      operationId: issueCard
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCardRequest'
      responses:
        '201':
          description: Card issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '409':
          description: >
            A product-catalog entitlement rule rejected the issue — CARD_QUOTA_EXCEEDED,
            CARD_PRODUCT_DISABLED, CARD_VIRTUAL_NOT_ALLOWED or CARD_NETWORK_NOT_ALLOWED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/cards/{id}:
    get:
      tags: [Cards]
      summary: Get card by ID
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cards/account/{accountId}:
    get:
      tags: [Cards]
      summary: List cards for an account
      operationId: listCardsByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cards

  /api/v1/cards/party/{partyId}:
    get:
      tags: [Cards]
      summary: List cards for a party
      operationId: listCardsByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cards

  /api/v1/cards/{id}/activate:
    post:
      tags: [Cards]
      summary: Activate a card
      operationId: activateCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card activated

  /api/v1/cards/{id}/block:
    post:
      tags: [Cards]
      summary: Block a card (permanent)
      operationId: blockCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusRequest'
      responses:
        '200':
          description: Card blocked

  /api/v1/cards/{id}/cancel:
    post:
      tags: [Cards]
      summary: Cancel a card permanently (terminal)
      operationId: cancelCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusRequest'
      responses:
        '200':
          description: Card cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '422':
          description: Card is already terminal (CANCELLED / EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/cards/{id}/secure-details:
    get:
      tags: [Cards]
      summary: Read a virtual card's synthetic PAN/CVV (VIRTUAL and SINGLE_USE only)
      description: >
        Returns the synthetic, Luhn-valid test PAN generated at issue time. Never a real
        cardholder PAN. Served with Cache-Control:no-store; the access is audited.
      operationId: getCardSecureDetails
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Synthetic card credential
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["no-store"]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSecureDetailsResponse'
        '403':
          description: >
            CARD_SECURE_DETAILS_NOT_SUPPORTED (card has plastic) or
            CARD_SECURE_DETAILS_CARD_NOT_LIVE (BLOCKED / CANCELLED / EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Card not found, or CARD_SECURE_DETAILS_NOT_STORED (issued before the vault)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/cards/party/{partyId}/entitlements:
    get:
      tags: [Cards]
      summary: Card entitlements of a party on a product
      description: >
        Resolved from product-catalog's cardConfig. When source is FALLBACK the catalog did not
        answer and maxCards/remaining are -1 ("no known cap"), not 0.
      operationId: getCardEntitlements
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEntitlementsResponse'

  /api/v1/cards/{id}/limits:
    put:
      tags: [Cards]
      summary: Set a card's daily and monthly spending limits
      operationId: updateCardLimits
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyLimitMinorUnits, monthlyLimitMinorUnits]
              properties:
                dailyLimitMinorUnits:
                  type: integer
                  format: int64
                monthlyLimitMinorUnits:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Limits updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/v1/cards/{id}/controls:
    put:
      tags: [Cards]
      summary: Set a card's channel controls (contactless / online / ATM / abroad)
      operationId: updateCardControls
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactlessEnabled, onlineEnabled, atmEnabled, abroadEnabled]
              properties:
                contactlessEnabled:
                  type: boolean
                onlineEnabled:
                  type: boolean
                atmEnabled:
                  type: boolean
                abroadEnabled:
                  type: boolean
      responses:
        '200':
          description: Controls updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/v1/cards/{id}/suspend:
    post:
      tags: [Cards]
      summary: Temporarily suspend a card
      operationId: suspendCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card suspended

  /api/v1/cards/{id}/resume:
    post:
      tags: [Cards]
      summary: Resume a suspended card
      operationId: resumeCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card resumed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    cardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    IssueCardRequest:
      type: object
      required: [partyId, accountId, cardType, cardNetwork]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        cardType:
          type: string
          enum: [DEBIT, CREDIT, PREPAID, VIRTUAL, SINGLE_USE]
        cardNetwork:
          type: string
          enum: [VISA, MASTERCARD]
        embossedName:
          type: string
        deliveryAddress:
          type: object

    CardStatusRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    CardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        maskedPan:
          type: string
          example: "****-****-****-1234"
        cardType:
          type: string
        cardNetwork:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, BLOCKED, EXPIRED, CANCELLED]
        expiryDate:
          type: string
          example: "12/27"
        issuedAt:
          type: string
          format: date-time

    CardSecureDetailsResponse:
      type: object
      required: [pan, cvv, expiryDate, cardholderName, network]
      properties:
        pan:
          type: string
          # No `example:` on purpose. Any 16-digit Luhn-valid string here trips the repo's
          # pan-card-number secret-scan rule, and that rule is right to fire on a public repo:
          # a reader cannot tell a documentation sample from a leak, and neither can a scanner.
          description: >-
            Synthetic, Luhn-valid test PAN, 16 digits (15 for AMEX), no separators.
            Never a real cardholder PAN — generated from a test BIN at issue time.
          minLength: 15
          maxLength: 19
        cvv:
          type: string
          description: 3 digits (4 for AMEX).
          minLength: 3
          maxLength: 4
        expiryDate:
          type: string
          format: date
        cardholderName:
          type: string
        network:
          type: string
          enum: [VISA, MASTERCARD, AMEX, UNIONPAY]

    CardEntitlementsResponse:
      type: object
      required: [productCode, maxCards, issued, remaining, enabled, source]
      properties:
        productCode:
          type: string
        maxCards:
          type: integer
          description: -1 when source is FALLBACK (no known cap)
        issued:
          type: integer
          description: Cards in a live status (PENDING / ACTIVE / SUSPENDED)
        remaining:
          type: integer
          description: -1 when source is FALLBACK
        virtualCardAllowed:
          type: boolean
        singleUseAllowed:
          type: boolean
        networks:
          type: array
          items:
            type: string
            enum: [VISA, MASTERCARD, AMEX, UNIONPAY]
        tiers:
          type: array
          items:
            type: string
        monthlyFeePerCard:
          type: number
        enabled:
          type: boolean
        source:
          type: string
          enum: [CATALOG, FALLBACK]

    ApiError:
      type: object
      properties:
        code:
          type: string
          description: >
            Machine-readable failure code. Card-specific values: CARD_QUOTA_EXCEEDED,
            CARD_PRODUCT_DISABLED, CARD_NETWORK_NOT_ALLOWED, CARD_VIRTUAL_NOT_ALLOWED,
            CARD_SECURE_DETAILS_NOT_SUPPORTED, CARD_SECURE_DETAILS_CARD_NOT_LIVE,
            CARD_SECURE_DETAILS_NOT_STORED.
        message:
          type: string
