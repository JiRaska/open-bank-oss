openapi: 3.1.0
info:
  title: Card Issuance Service API
  version: 1.0.0
  description: Debit/credit card lifecycle — issue, activate, block, suspend, resume.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8115
    description: Local development
tags:
  - name: Cards

paths:
  /api/v1/cards:
    post:
      tags: [Cards]
      summary: Issue a new card
      operationId: issueCard
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCardRequest'
      responses:
        '201':
          description: Card issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/v1/cards/{id}:
    get:
      tags: [Cards]
      summary: Get card by ID
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/cardId'
      responses:
        '200':
          description: Card detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cards/account/{accountId}:
    get:
      tags: [Cards]
      summary: List cards for an account
      operationId: listCardsByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cards

  /api/v1/cards/party/{partyId}:
    get:
      tags: [Cards]
      summary: List cards for a party
      operationId: listCardsByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cards

  /api/v1/cards/{id}/activate:
    post:
      tags: [Cards]
      summary: Activate a card
      operationId: activateCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card activated

  /api/v1/cards/{id}/block:
    post:
      tags: [Cards]
      summary: Block a card (permanent)
      operationId: blockCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusRequest'
      responses:
        '200':
          description: Card blocked

  /api/v1/cards/{id}/suspend:
    post:
      tags: [Cards]
      summary: Temporarily suspend a card
      operationId: suspendCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card suspended

  /api/v1/cards/{id}/resume:
    post:
      tags: [Cards]
      summary: Resume a suspended card
      operationId: resumeCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - name: X-Operator-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card resumed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    cardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    IssueCardRequest:
      type: object
      required: [partyId, accountId, cardType, cardNetwork]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        cardType:
          type: string
          enum: [DEBIT, CREDIT, PREPAID]
        cardNetwork:
          type: string
          enum: [VISA, MASTERCARD]
        embossedName:
          type: string
        deliveryAddress:
          type: object

    CardStatusRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    CardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        maskedPan:
          type: string
          example: "****-****-****-1234"
        cardType:
          type: string
        cardNetwork:
          type: string
        status:
          type: string
          enum: [ISSUED, ACTIVE, SUSPENDED, BLOCKED, EXPIRED]
        expiryDate:
          type: string
          example: "12/27"
        issuedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
