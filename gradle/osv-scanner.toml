#
# osv-scanner config for gradle/verification-metadata.xml (issue #461).
#
# Gradle's dependency verification file is a supply-chain INTEGRITY manifest, not a
# resolved-dependency lockfile: it records a checksum for every artifact Gradle ever
# downloads while resolving a BOM's <dependencyManagement> constraints, even versions
# that resolutionStrategy.force() later overrides and that never land on any classpath.
# Those entries carry only a `.pom` checksum (no `.jar`) — verifiable directly in
# verification-metadata.xml. osv-scanner reads the file as a flat lockfile and cannot
# tell "constraint bookkeeping" from "actually resolved", so it flags both. The
# PackageOverrides below suppress that structural false-positive class for every
# pom-only entry confirmed via the fleet-wide regeneration on 2026-07-07 (after the
# resolutionStrategy.force() pins in build-logic/src/main/kotlin/
# openbank.dependency-vulnerability-pins.gradle.kts took effect). Re-verify the
# .jar-vs-.pom-only split before extending this list — see the PR for issue #461.
#
# A second, smaller group below is genuinely resolved (has a .jar entry) but has no
# available fix compatible with Quarkus 3.33.2 today; each has its own reason.

