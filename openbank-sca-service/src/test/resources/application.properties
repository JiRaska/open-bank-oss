# Random HTTP port prevents port-8081 conflicts when multiple @QuarkusTest Pact provider
# tests run in parallel on the same Mac mini CI runner. Quarkus replaces the configured
# value with the actual bound port after startup so @ConfigProperty still reads correctly.
quarkus.http.test-port=0
# Disable the management interface in tests — other Pact provider services (balance,
# fx, ledger, transaction) disable management in their %test YAML profile; sca's %test
# profile does not, so concurrent test JVMs compete for port 8085 and raise BindException.
quarkus.management.enabled=false
