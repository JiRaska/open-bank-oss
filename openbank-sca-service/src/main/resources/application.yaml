quarkus:
  application:
    name: openbank-sca-service

  http:
    port: 8110
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key,X-Request-ID

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
    limits:
      max-body-size: 10M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_sca
    # The DEFAULT (Agroal/JDBC) datasource Flyway migrates. Declaring only the reactive URL leaves
    # it unconfigured, and `migrate-at-start` then kills the boot with "Unable to find datasource
    # '<default>' … Bean is not active: SYNTHETIC bean [class=AgroalDataSource]" — so the service
    # could start only where the gitops env supplied QUARKUS_DATASOURCE_JDBC_URL, never from this
    # file alone, including for `quarkusDev` (#3080). The env var still wins in the cluster.
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/openbank_sca}

  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration
  hibernate-orm:
    database:
      generation: none

  redis:
    hosts: redis://localhost:6379

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # OUTBOUND M2M for the party-register read that gates device enrolment (#10281 item 1). Without
  # it the call carries no bearer, party-service answers 401, and every enrolment fails closed 503.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client

  rest-client:
    party-service:
      url: ${PARTY_SERVICE_URL:http://localhost:8111}
      connect-timeout: 2000
      read-timeout: 2000

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    level: INFO
    console:
      format: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","logger":"%c{3.}","message":"%s","traceId":"%X{traceId}","spanId":"%X{spanId}"}%n'
      json: true

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-sca-service
        service.version: 0.1.0

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%prod":
  quarkus:
    # The party-register read is an enrolment gate (#10281 item 1). Production uses a named TLS
    # bucket over party-service's mTLS listener, as delegation-service does: trust, client identity
    # and TLS version are one fail-closed unit. Local/test fixtures speak plain HTTP.
    tls:
      party-authority:
        key-store:
          pem:
            client:
              cert: /mnt/party-tls/tls.crt
              key: /mnt/party-tls/tls.key
        trust-store:
          pem:
            certs: /mnt/party-tls/ca.crt
        protocols: TLSv1.3
    rest-client:
      party-service:
        tls-configuration-name: party-authority

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
        format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"
    oidc:
      enabled: false
    oidc-client:
      enabled: false

"%test":
  quarkus:
    datasource:
      reactive:
        url: vertx-reactive:postgresql://localhost:5433/openbank_sca_test
    oidc:
      enabled: false
    # Tests replace the party-register lookup with a stub bean, so nothing needs an outbound token.
    oidc-client:
      enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  sca:
    idempotency-ttl-seconds: 300
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  outbox:
    poll-interval: 5s
    initial-delay: 5s
    dispatch-enabled: true

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      # Bug fix (ADR-0160 #996 triage): this channel only ever publishes DEVICE_ENROLLED — the
      # long-lived SCA enrollment lifecycle event, per ADR-0068's design and the KafkaTopic
      # already provisioned for exactly this purpose (openbank-infra/gitops/components/onboarding/
      # kafka-topics.yaml: "onboarding is the only consumer of the SCA enrollment lifecycle
      # topic"). It was wired to openbank.sca.challenge.event instead — the OTP CHALLENGE
      # lifecycle topic (a distinct, not-yet-built feature; see kafka-sca-mtls.yaml) — so
      # onboarding-service's already-correct sca-events-in listener (subscribed to
      # openbank.sca.events since its own introduction) never received a single message.
      sca-events-out:
        connector: smallrye-kafka
        client.id: sca-service-${quarkus.uuid}
        topic: openbank.sca.events
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
      # Decoupled/push SCA (#4): a "you have a payment to approve" push request drained by
      # notification-service off openbank.notification.requests (same envelope as account-service).
      notification-requests-out:
        connector: smallrye-kafka
        client.id: sca-service-notif-${quarkus.uuid}
        topic: openbank.notification.requests
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
