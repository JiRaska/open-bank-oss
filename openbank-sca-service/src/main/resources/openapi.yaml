openapi: 3.1.0
info:
  title: SCA Service API
  version: 1.6.0
  description: >-
    Strong Customer Authentication — initiate and verify SCA challenges (OTP, TOTP, push,
    biometric). Decoupled device approval per ADR-0021: enrol a device credential and record a
    signature-verified, dynamic-linked approval/denial.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8110
    description: Local development
tags:
  - name: SCA

paths:
  /api/v1/sca/challenges:
    post:
      tags: [SCA]
      summary: Initiate an SCA challenge
      operationId: initiateScaChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateScaRequest'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sca/challenges/{id}:
    get:
      tags: [SCA]
      summary: Get SCA challenge status
      operationId: getScaChallenge
      parameters:
        - $ref: '#/components/parameters/challengeId'
      responses:
        '200':
          description: Challenge detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sca/challenges/{id}/verify:
    post:
      tags: [SCA]
      summary: Verify an SCA challenge
      operationId: verifyScaChallenge
      parameters:
        - $ref: '#/components/parameters/challengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyScaRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '400':
          description: Invalid or expired code
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Max attempts exceeded

  /api/v1/sca/parties/{partyId}/devices:
    get:
      tags: [SCA]
      summary: List device credentials enrolled to a party
      operationId: listScaDevices
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enrolled devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrolledDeviceResponse'
        '403':
          description: Caller is not the party owner or an operator
    post:
      tags: [SCA]
      summary: Enrol a device credential for decoupled approval (ADR-0021)
      operationId: enrollScaDevice
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollDeviceRequest'
      responses:
        '201':
          description: Device enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolledDeviceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sca/challenges/{id}/decision:
    post:
      tags: [SCA]
      summary: Record an out-of-band device approval/denial (ADR-0021)
      description: >-
        Authenticated as the enrolled device/party (a different principal from the verify caller).
        The signed assertion is verified against the challenge's dynamic-linking data (amount, payee)
        before it is recorded. No valid decision leaves the challenge PENDING — push/biometric is
        never auto-approved.
      operationId: recordScaDecision
      parameters:
        - $ref: '#/components/parameters/challengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '401':
          description: Invalid device assertion
        '403':
          description: Device does not belong to the challenge party
        '404':
          description: Challenge or device not found
        '409':
          description: Challenge is not awaiting a decision

components:
  parameters:
    challengeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    InitiateScaRequest:
      type: object
      required: [partyId, challengeType, purpose]
      properties:
        partyId:
          type: string
          format: uuid
        challengeType:
          type: string
          enum: [OTP_SMS, OTP_EMAIL, TOTP, PUSH]
        purpose:
          type: string
          # The ScaPurpose enum as the service accepts it. PAYMENT_AUTHORIZATION / CONSENT /
          # ACCOUNT_CHANGE were published here for the life of the file and have never been
          # valid values; the drift this comment used to describe is corrected as of #5962.
          enum: [PAYMENT_INITIATION, CONSENT_GRANT, LOGIN, AGENT_ACTION, SENSITIVE_DATA_ACCESS,
                 DOCUMENT_SIGNING, CARD_MANAGEMENT, DELEGATION_GRANT, DELEGATION_ACCEPT,
                 SAVINGS_WITHDRAW_APPROVAL]
        contextData:
          type: object

    VerifyScaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    ScaChallengeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        challengeType:
          type: string
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, EXPIRED, CANCELLED]
        attemptsRemaining:
          type: integer
        expiresAt:
          type: string
          format: date-time

    EnrollDeviceRequest:
      type: object
      required: [credentialId, publicKey, algorithm]
      properties:
        credentialId:
          type: string
          description: Stable per-credential id the device presents when deciding.
        publicKey:
          type: string
          description: Base64-encoded X.509 SubjectPublicKeyInfo of the device public key.
        algorithm:
          type: string
          enum: [ES256, ED25519]

    EnrolledDeviceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        credentialId:
          type: string
        algorithm:
          type: string
          enum: [ES256, ED25519]
        enrolledAt:
          type: string
          format: date-time
          description: When the device credential was enrolled.

    RecordDecisionRequest:
      type: object
      required: [credentialId, decision, signature]
      properties:
        credentialId:
          type: string
        decision:
          type: string
          enum: [APPROVED, DENIED]
        signature:
          type: string
          description: Base64 signature over the challenge's dynamic-linking payload.

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
