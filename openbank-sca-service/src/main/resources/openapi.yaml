openapi: 3.1.0
info:
  title: SCA Service API
  # 1.11 -> 1.12 (#9430): additive — DELEGATION_APPROVAL_GROUP purpose and an optional
  # ConsumeScaRequest.reference compared exactly when supplied.
  # 1.12 -> 1.13 (#10041 slice 9a): additive — DELETE device revocation,
  # EnrolledDeviceResponse.revokedAt; documents the consume 400/422 responses and the
  # ScaChallengeResponse fields the service already serves.
  # 1.13 -> 1.14 (#10041 slice 9b): additive — the operator approval queue
  # (/api/v1/sca/approvals), the optional X-Approval-Id header and the 202 PENDING_APPROVAL
  # response on the four-eyes-gated enroll, revoke and consume operations.
  # 1.14 -> 1.15: additive — ApprovalResponse.summary (what the approval binds, rendered once
  # at creation: device handle, key fingerprint, masked creditor) and decidedAt on the GET views.
  # 1.15 -> 1.16 (#11588): additive verified makerActorKind on approval responses.
  version: 1.16.1
  description: >-
    Strong Customer Authentication — initiate and verify SCA challenges (OTP, TOTP, push,
    biometric). Decoupled device approval per ADR-0021: enrol a device credential and record a
    signature-verified, dynamic-linked approval/denial.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8110
    description: Local development
tags:
  - name: SCA

paths:
  /api/v1/sca/approvals:
    get:
      tags: [SCA]
      summary: List pending operator approvals, oldest first (ADR-0227 D2)
      operationId: listScaApprovals
      parameters:
        - name: limit
          in: query
          required: false
          description: Clamped to 1 through 200.
          schema: {type: integer, default: 50}
      responses:
        '200':
          description: Pending, unexpired approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sca/approvals/{id}:
    get:
      tags: [SCA]
      summary: Read an SCA operator approval by id
      operationId: getScaApproval
      description: >-
        Includes decided and consumed approvals until their authorization expires. EXECUTED
        records an authorization claim, not business completion. Operator or administrator only.
      parameters:
        - $ref: '#/components/parameters/approvalPathId'
      responses:
        '200':
          description: Approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Approval is missing or expired
    patch:
      tags: [SCA]
      summary: Approve or reject a pending SCA operator action
      operationId: decideScaApproval
      description: >-
        The checker is the authenticated caller and must differ from the maker; an approval
        can be decided once. The maker then retries the identical request with X-Approval-Id.
        The decision and its audit event commit together.
      parameters:
        - $ref: '#/components/parameters/approvalPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: {type: boolean}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          description: Request body is required and must contain a decision
        '403':
          description: Self-approval, or the caller is not an authorised checker
        '404':
          description: Approval is missing or expired
        '409':
          description: Approval has already been decided or consumed

  /api/v1/sca/challenges:
    post:
      tags: [SCA]
      summary: Initiate an SCA challenge
      description: >-
        Idempotent (ADR-0296): a retry carrying the same Idempotency-Key (or X-Request-ID)
        replays the cached 201 with X-Idempotency-Replayed: true — no second challenge is minted.
        The key is bound to a fingerprint of the request (method, path, canonical body); reusing it
        with a different body is refused with 409 IDEMPOTENCY_KEY_REUSED, and a retry arriving while
        the first request is still executing is refused with 409 IDEMPOTENCY_REQUEST_IN_PROGRESS.
      operationId: initiateScaChallenge
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Caller-supplied replay key; X-Request-ID is accepted as a fallback. Scoped per party,
            cached for 300 s.
          schema:
            type: string
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateScaRequest'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            IDEMPOTENCY_KEY_REUSED — the Idempotency-Key (or X-Request-ID) was already used for a
            different request body; or IDEMPOTENCY_REQUEST_IN_PROGRESS — the same request is still
            being processed under this key. Nothing is minted in either case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/sca/challenges/{id}:
    get:
      tags: [SCA]
      summary: Get SCA challenge status
      operationId: getScaChallenge
      parameters:
        - $ref: '#/components/parameters/challengeId'
      responses:
        '200':
          description: Challenge detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sca/challenges/{id}/verify:
    post:
      tags: [SCA]
      summary: Verify an SCA challenge
      operationId: verifyScaChallenge
      parameters:
        - $ref: '#/components/parameters/challengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyScaRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '400':
          description: Invalid or expired code
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Max attempts exceeded

  /api/v1/sca/parties/{partyId}/devices/{deviceId}:
    delete:
      tags: [SCA]
      summary: Revoke an enrolled device credential
      description: |
        Revokes the owned credential and cancels its pending or completed, unconsumed
        approvals in the same transaction as the audit event. Repeated revocation is a
        successful no-op. Public keys and prior signatures remain as evidence. Customers
        must own the party; the money-path four-eyes policy also applies in enforced mode.
      operationId: revokeScaDevice
      parameters:
        - $ref: '#/components/parameters/approvalId'
        - name: partyId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: deviceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '202':
          $ref: '#/components/responses/PendingApproval'
        '204':
          description: Credential revoked or already revoked
        '401':
          description: Authentication required
        '403':
          description: Ownership or authorization policy rejected the request
        '404':
          description: No such device belongs to the party
        '409':
          description: Revocation transaction conflicted; reconcile before retrying

  /api/v1/sca/parties/{partyId}/devices:
    get:
      tags: [SCA]
      summary: List device credentials enrolled to a party
      description: Customer callers must have a UUID party identity matching partyId.
      operationId: listScaDevices
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enrolled devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrolledDeviceResponse'
        '403':
          description: Caller is not the party owner or an operator
    post:
      tags: [SCA]
      summary: Enrol a device credential for decoupled approval (ADR-0021)
      description: >-
        Customer callers must have a UUID party identity matching partyId.
        Idempotent on the credentialId natural key (ADR-0296): re-enrolling the same credential
        for the same party replays the original enrollment (201, no duplicate row;
        `credential_id UNIQUE`, V4, is the race backstop). The same credentialId presented for a
        DIFFERENT party is refused (409) — a credential belongs to exactly one party.
      operationId: enrollScaDevice
      parameters:
        - $ref: '#/components/parameters/approvalId'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollDeviceRequest'
      responses:
        '202':
          $ref: '#/components/responses/PendingApproval'
        '201':
          description: Device enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolledDeviceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: >-
            The party is not a natural person (register type other than INDIVIDUAL or
            SOLE_TRADER, or unknown to the register). A device key is a person's credential
            (#10281 item 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The party register could not be asked; enrolment fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/sca/parties/{partyId}/challenges/pending:
    get:
      tags: [SCA]
      summary: Live challenges awaiting a decision for a party
      description: Customer callers must have a UUID party identity matching partyId.
      operationId: listPendingScaChallenges
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pending challenges, newest first, with what is being approved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingScaResponse'

  /api/v1/sca/challenges/{id}/consume:
    post:
      tags: [SCA]
      summary: Spend an approved challenge on exactly the operation it authorised (single use)
      description: >-
        Every dynamic-linking field is compared: amount/currency/creditor (payment),
        documentSha256/ceremonyId (document), cardId/cardAction (card) and, for an APPROVAL
        challenge, approvalRequestId/payloadSha256. A challenge raised for one shape can never
        be spent on another; a mismatch answers 409 and does not burn the challenge.
      operationId: consumeScaChallenge
      parameters:
        - $ref: '#/components/parameters/approvalId'
        - $ref: '#/components/parameters/challengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeScaRequest'
      responses:
        '202':
          $ref: '#/components/responses/PendingApproval'
        '200':
          description: Consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '400':
          description: Invalid request or challenge not approved
        '403':
          description: >-
            The challenge belongs to another party, or lies outside the caller's consumer scope
            (ADR-0335 D1): an APPROVAL challenge whose device-signed approvalRequestId begins
            `pension-` is spendable only by pension-service, which may spend nothing else. A
            refusal never burns the challenge.
        '404':
          description: Challenge not found
        '409':
          description: Already consumed, or the operation does not match what the device signed
        '422':
          description: >-
            Challenge expired, or concurrently modified by another lifecycle write; re-read the
            challenge before retrying.

  /api/v1/sca/challenges/{id}/decision:
    post:
      tags: [SCA]
      summary: Record an out-of-band device approval/denial (ADR-0021)
      description: >-
        A successful response acknowledges a durable first decision and its atomic audit event.
        Expiry limits authorization; it does not delete signature evidence.
        A successful response acknowledges a durable first decision and its atomic audit event.
        Expiry limits authorization; it does not delete signature evidence.
        Authenticated as the enrolled device/party (a different principal from the verify caller).
        The signed assertion is verified against the challenge's dynamic-linking data (amount, payee)
        before it is recorded. No valid decision leaves the challenge PENDING — push/biometric is
        never auto-approved.
      operationId: recordScaDecision
      parameters:
        - $ref: '#/components/parameters/challengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaChallengeResponse'
        '401':
          description: Invalid device assertion
        '403':
          description: Device is revoked or does not belong to the challenge party
        '404':
          description: Challenge or device not found
        '409':
          description: Challenge is not awaiting a decision

components:
  parameters:
    approvalId:
      name: X-Approval-Id
      in: header
      required: false
      description: >-
        A one-use approval for this action and maker, bound to the exact request it was issued
        for (endpoint and arguments, including the request body). Missing or mismatched, the
        call answers 202 with a fresh approval when OPA requires four-eyes and
        authz.four-eyes.enforce is on. Identity-specific service-account exemptions still apply.
      schema: {type: string}
    approvalPathId:
      name: id
      in: path
      required: true
      schema: {type: string}
    challengeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    PendingApproval:
      description: Parked until a distinct checker approves it; no business write occurred
      content:
        application/json:
          schema:
            type: object
            required: [status, approvalId]
            properties:
              status: {type: string, enum: [PENDING_APPROVAL]}
              approvalId: {type: string}
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApprovalResponse:
      type: object
      required: [id, action, status]
      properties:
        id: {type: string}
        action: {type: string}
        resourceId: {type: [string, 'null']}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, EXECUTED]}
        makerId: {type: [string, 'null']}
        makerActorKind: {type: string, enum: [HUMAN, AI_AGENT, SERVICE_ACCOUNT, CUSTOMER_PARTY, UNKNOWN]}
        createdAt: {type: [string, 'null'], format: date-time}
        decidedBy: {type: [string, 'null']}
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: When the checker decided. Present on the list and read views.
        summary:
          type: [string, 'null']
          maxLength: 1024
          description: >-
            What the approval binds, rendered once when it was issued and stored with it — never
            re-derived. device.enroll: party, a short credential handle, algorithm and the first 8
            hex of the SHA-256 of the public key (never the key). device.revoke: party, the device
            as a short handle, credential handle, algorithm and enrolment date. scaChallenge.consume:
            purpose, amount, currency and the creditor masked to its last 4 characters. Informational
            only; the request fingerprint decides whether a retry matches. Present on the list and
            read views; null for an action without a rendering.
    InitiateScaRequest:
      type: object
      required: [partyId, purpose]
      properties:
        partyId:
          type: string
          format: uuid
        purpose:
          type: string
          # The ScaPurpose enum as the service accepts it. PAYMENT_AUTHORIZATION / CONSENT /
          # ACCOUNT_CHANGE were published here for the life of the file and have never been
          # valid values; the drift this comment used to describe is corrected as of #5962.
          enum: [PAYMENT_INITIATION, CONSENT_GRANT, LOGIN, AGENT_ACTION, SENSITIVE_DATA_ACCESS,
                 DOCUMENT_SIGNING, CARD_MANAGEMENT, DELEGATION_GRANT, DELEGATION_ACCEPT,
                 DELEGATION_APPROVAL_GROUP, SAVINGS_WITHDRAW_APPROVAL, APPROVAL]
        preferredMethod:
          type: string
        dynamicLinkingData:
          type: string
          description: >-
            Served as an object with the fields of the DynamicLinkingData schema below; the
            published type predates that schema and is left unchanged here.
        redirectUrl:
          type: string
          nullable: true
        onBehalfOfPartyId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The entity the human acts for (X-Acting-For at the edge). Context only — the
            challenge still belongs to partyId (#10281 item 3).
    DynamicLinkingData:
      type: object
      description: >-
        What the device signs (RTS Art. 5). APPROVAL requires approvalRequestId and
        payloadSha256; a payment approval also carries amount, currency and creditorIban.
      properties:
        amount: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        creditorIban: { type: string, nullable: true }
        creditorName: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        documentSha256: { type: string, nullable: true }
        ceremonyId: { type: string, nullable: true }
        cardId: { type: string, nullable: true }
        cardAction: { type: string, nullable: true }
        approvalRequestId:
          type: string
          nullable: true
          description: The business approval request this challenge co-signs.
        payloadSha256:
          type: string
          nullable: true
          pattern: '^[0-9a-fA-F]{64}$'
          description: SHA-256 (hex) of the approval request's frozen payload.
    ConsumeScaRequest:
      type: object
      required: [partyId]
      properties:
        partyId: { type: string, format: uuid }
        amount: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        creditor: { type: string, nullable: true }
        reference:
          type: string
          nullable: true
          description: Opaque operation fingerprint; when supplied it must equal the challenge's reference.
        documentSha256: { type: string, nullable: true }
        ceremonyId: { type: string, nullable: true }
        cardId: { type: string, nullable: true }
        cardAction: { type: string, nullable: true }
        approvalRequestId: { type: string, nullable: true }
        payloadSha256: { type: string, nullable: true }
    PendingScaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string }
        method: { type: string }
        amount: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        creditorIban: { type: string, nullable: true }
        creditorName: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        approvalRequestId: { type: string, nullable: true }
        payloadSha256: { type: string, nullable: true }
        onBehalfOfPartyId: { type: string, format: uuid, nullable: true }
    VerifyScaRequest:
      type: object
      properties:
        partyId:
          type: string
          format: uuid
        otp:
          type: string
          nullable: true
    ScaChallengeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        challengeType:
          type: string
          deprecated: true
          description: Legacy documentation field; the current response uses purpose and method.
        purpose:
          type: string
        method:
          type: string
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, EXPIRED, CANCELLED]
        attemptsRemaining:
          type: integer
          deprecated: true
          description: Legacy documentation field; the current response uses attemptCount and maxAttempts.
        attemptCount:
          type: integer
        maxAttempts:
          type: integer
        completedAt:
          type: string
          format: date-time
          nullable: true
        consumedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
        onBehalfOfPartyId:
          type: string
          format: uuid
          nullable: true
        decidedByPartyId:
          type: string
          format: uuid
          nullable: true
          description: Whose enrolled device decided the challenge (#10281 item 3); null while undecided.

    EnrollDeviceRequest:
      type: object
      required: [credentialId, publicKey, algorithm]
      properties:
        credentialId:
          type: string
          description: Stable per-credential id the device presents when deciding.
        publicKey:
          type: string
          description: Base64-encoded X.509 SubjectPublicKeyInfo of the device public key.
        algorithm:
          type: string
          enum: [ES256, ED25519]

    EnrolledDeviceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        credentialId:
          type: string
        algorithm:
          type: string
          enum: [ES256, ED25519]
        enrolledAt:
          type: string
          format: date-time
          description: When the device credential was enrolled.
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: Revocation time; a revoked credential cannot be reactivated by enrollment.

    RecordDecisionRequest:
      type: object
      required: [credentialId, decision, signature]
      properties:
        credentialId:
          type: string
        decision:
          type: string
          enum: [APPROVED, DENIED]
        signature:
          type: string
          description: Base64 signature over the challenge's dynamic-linking payload.

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
