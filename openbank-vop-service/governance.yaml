# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: payments
primaryDatastore: PostgreSQL
databaseName: openbank_vop
dataLineageRole: both
dataClassification: confidential
# NOT the 7-year accounting default (ADR-0171): a VoP record is evidence a control ran, not an
# accounting record. 13 months aligns with the fraud-claim window; inputs are stored hashed only.
retentionPolicy: 13 months
evidenceExported: false
databaseLineage:
  ownedDatabases:
    - openbank_vop
