# API-contract version (ADR-0048), independent of version.txt. major == the URL /api/v{N}.
openapi: 3.0.3
info:
  title: OpenBank Card Processing API
  version: 1.2.0
  description: |
    Card authorisation, holds, clearing and release (ADR-0283 phase 1).

    This service decides nothing about whether a card may be used — that is card-issuance's
    `POST /api/v1/cards/{id}/authorizations` (ADR-0194). What it owns is the money path around that
    decision: the authoritative spend counters the decision is evaluated against, the hold an
    approval creates, the clearing presentments against it, and the posting of cleared spend to the
    books on the `CARD` rail (ADR-0103).

    No PAN or card credential is stored or accepted here. The card is referenced by its
    card-issuance id, which is what keeps this service outside the cardholder-data environment.
servers:
  - url: http://localhost:8157
    description: Local
tags:
  - name: Authorizations
    description: Authorise, clear, reverse and read card authorisations
  - name: Tokens
    description: Network tokens for a card — provision, list, change state
  - name: Disputes
    description: Chargeback cases against cleared card spend
  - name: Sandbox
    description: The sandbox acquirer — off unless explicitly enabled

paths:
  /api/v1/card-authorizations:
    post:
      tags: [Authorizations]
      summary: Authorise a card transaction
      description: |
        Decides, records and holds. A DECLINE is also a 201: it is a created record of a decision,
        not a failed request, and answering 4xx would make "the card was refused" indistinguishable
        from "the request was malformed" for every acquirer and every dashboard.
      operationId: authorizeCard
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Retry safety. The same key never takes a second hold.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '201':
          description: The authorisation, approved or declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The card is not known to card-issuance

  /api/v1/card-authorizations/{id}:
    get:
      tags: [Authorizations]
      summary: One authorisation, with its hold and cleared amounts
      operationId: getCardAuthorization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationId'
      responses:
        '200':
          description: The authorisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such authorisation

  /api/v1/card-authorizations/{id}/clearing:
    post:
      tags: [Authorizations]
      summary: Apply a clearing presentment
      description: |
        Applies the presented amount and posts it to the books. Partial presentments are supported;
        cumulative clearing may never exceed the authorised amount.
      operationId: clearCardAuthorization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentmentRequest'
      responses:
        '200':
          description: The authorisation after the presentment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-authorizations/{id}/reversal:
    post:
      tags: [Authorizations]
      summary: Release the remaining hold
      description: |
        A partially cleared authorisation may still be reversed — what already cleared stays
        cleared, and only the unpresented remainder is released.
      operationId: reverseCardAuthorization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationId'
      responses:
        '200':
          description: The authorisation after the release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-authorizations/card/{cardId}:
    get:
      tags: [Authorizations]
      summary: Authorisations for one card, newest first
      operationId: listCardAuthorizations
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The authorisations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/card-tokens:
    post:
      tags: [Tokens]
      summary: Provision a network token for a card
      description: |
        The token is minted by the NETWORK. What this service stores is the record that it exists —
        no token credential, no cryptogram and no PAN. Provisioning is not naturally idempotent, so
        `Idempotency-Key` is required and is held by a unique index: a retried request returns the
        first token rather than minting a second credential the customer can see.
      operationId: provisionCardToken
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Retry safety. The same key never mints a second token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTokenRequest'
      responses:
        '201':
          description: The token as the network minted it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-tokens/{tokenReference}/status:
    post:
      tags: [Tokens]
      summary: Suspend, resume or delete a network token
      description: |
        `DELETED` is terminal in every scheme's token lifecycle, and this service refuses a change
        to an already-deleted token without calling the network — the rule belongs to the record,
        not to whichever binding happens to be wired.
      operationId: changeCardTokenStatus
      security:
        - bearerAuth: []
      parameters:
        - name: tokenReference
          in: path
          required: true
          description: The network's opaque token handle. Never a card number.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTokenStatusRequest'
      responses:
        '200':
          description: The token after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: The status is not one of ACTIVE, SUSPENDED, DELETED
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-tokens/card/{cardId}:
    get:
      tags: [Tokens]
      summary: Tokens for one card, with the provenance of the answer
      description: |
        `source` is `NETWORK` when the scheme answered on this request and `LOCAL_MIRROR` when it
        did not and these are the rows this bank last recorded. A client that renders the list
        without reading `source` presents possibly-stale token states as current, which is why the
        field is required rather than optional.
      operationId: listCardTokens
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The tokens, and where the answer came from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/card-disputes:
    post:
      tags: [Disputes]
      summary: Open a chargeback case with the network
      description: |
        Only money that actually moved may be disputed: an authorisation still holding funds is
        released with a reversal, and the disputed amount may not exceed what cleared. Opening fails
        CLOSED — if the network cannot be reached no case is recorded, because a local case carries
        a respond-by date nobody is counting down while it renders as active.
      operationId: openCardDispute
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDisputeRequest'
      responses:
        '201':
          description: The case the network opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-disputes/{id}/evidence:
    post:
      tags: [Disputes]
      summary: File evidence against an open case
      operationId: submitCardDisputeEvidence
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEvidenceRequest'
      responses:
        '200':
          description: The case after the submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-disputes/{id}/refresh:
    post:
      tags: [Disputes]
      summary: Re-read the network's status and record any move
      description: |
        Publishes nothing when nothing moved. An event per poll would make "the case changed"
        indistinguishable from "somebody looked at it".
      operationId: refreshCardDispute
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: The case as the network now describes it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/Refused'

  /api/v1/card-disputes/{id}:
    get:
      tags: [Disputes]
      summary: One dispute case, in both vocabularies
      operationId: getCardDispute
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: The case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such case

  /api/v1/card-disputes/card/{cardId}:
    get:
      tags: [Disputes]
      summary: Dispute cases for one card, newest first
      operationId: listCardDisputes
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/sandbox/acquirer/purchase:
    post:
      tags: [Sandbox]
      summary: Present a purchase through the sandbox acquirer
      description: |
        Off unless `openbank.card-processing.sandbox-acquirer-enabled` is true, and answers 404 when
        off — a disabled simulator is indistinguishable from one that was never deployed.
      operationId: sandboxPurchase
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxPurchaseRequest'
      responses:
        '200':
          description: The outcome of the simulated purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxPurchaseResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The sandbox acquirer is not enabled

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AuthorizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DisputeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request is malformed
    Forbidden:
      description: The caller may not perform this action
    Refused:
      description: |
        The request was well formed and the state was not what it needed to be — a presentment
        against a released hold, a token that is already deleted, a dispute against a hold that
        cleared nothing. The reason travels as a machine-readable value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'

  schemas:
    PresentmentChannel:
      type: string
      enum: [CONTACTLESS, ONLINE, ATM, CHIP_AND_PIN]

    AuthorizationStatus:
      type: string
      enum: [APPROVED, DECLINED, PARTIALLY_CLEARED, CLEARED, REVERSED, EXPIRED]

    AuthorizationRequest:
      type: object
      required: [cardId, amountMinorUnits, currencyCode, channel]
      properties:
        cardId:
          type: string
          format: uuid
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 1
          description: Minor units, as the scheme message carries it. Never a decimal.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        channel:
          $ref: '#/components/schemas/PresentmentChannel'
        mcc:
          type: string
          nullable: true
        merchantName:
          type: string
          nullable: true
        merchantCountry:
          type: string
          nullable: true
          description: ISO-3166 alpha-2. Absent is treated as domestic by the issuer policy.
        networkReference:
        agentMandate:
          allOf:
            - $ref: '#/components/schemas/AgentMandate'
          nullable: true
          description: >-
            Present when an AI agent initiated this purchase. The mandate is verified against THIS
            payment before card-issuance is asked to decide, and anything but a verified mandate
            DECLINES: `AGENT_MANDATE_REJECTED` when the agent exceeded its authority and
            `AGENT_MANDATE_UNVERIFIABLE` when the bank could not establish authority at all. The two
            are separate reasons on purpose — one is a conversation with the customer about a
            wallet's limits, the other is an incident about a service being down.
          type: string
          nullable: true
          description: The acquirer's own reference, so a reversal can be matched without our id.

    PresentmentRequest:
      type: object
      required: [amountMinorUnits, currencyCode]
      properties:
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 1
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3

    Authorization:
      type: object
      required:
        [id, cardId, accountId, amountMinorUnits, currencyCode, channel, status, category,
         clearedAmountMinorUnits, heldAmountMinorUnits, authorizedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amountMinorUnits:
          type: integer
          format: int64
        currencyCode:
          type: string
        channel:
          $ref: '#/components/schemas/PresentmentChannel'
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        category:
          type: string
          description: The merchant category card-issuance judged the MCC as.
        declineReason:
          type: string
          nullable: true
          description: |
            Present exactly when status is DECLINED. Carries card-issuance's own reason name
            verbatim, or ISSUER_UNAVAILABLE when the issuer could not be reached — the two must
            never look alike in a dispute.
        clearedAmountMinorUnits:
          type: integer
          format: int64
        heldAmountMinorUnits:
          type: integer
          format: int64
          description: Derived (authorised less cleared, zero once released), never stored.
        merchantName:
          type: string
          nullable: true
        merchantCountry:
          type: string
          nullable: true
        networkReference:
          type: string
        initiatedByAgentId:
          type: string
          nullable: true
          description: >-
            The agent that initiated this purchase under an AP2 mandate, or null for a human one.
            Recorded on the authorisation rather than derived later: which agent acted is a fact
            about the moment of authorisation that no lookup can reconstruct once the mandate has
            expired, and a dispute about agentic spend turns on it.
          nullable: true
        authorizedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AuthorizationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Authorization'
        count:
          type: integer

    Refusal:
      type: object
      properties:
        reason:
          type: string
          enum:
            [NOT_HOLDING_FUNDS, AMOUNT_NOT_POSITIVE, EXCEEDS_AUTHORIZED_AMOUNT, CURRENCY_MISMATCH,
             NOT_YET_EXPIRED]
        message:
          type: string

    SandboxPurchaseRequest:
      type: object
      required: [idempotencyKey, cardId, amountMinorUnits, currencyCode, channel]
      properties:
        idempotencyKey:
          type: string
          description: |
            The acquirer's own message reference, and the key a replay is deduplicated on. Required
            in the body rather than as a header because that is the shape of a scheme message; the
            two idioms are equivalent to the money-path idempotency gate.
        cardId:
          type: string
          format: uuid
        amountMinorUnits:
          type: integer
          format: int64
        currencyCode:
          type: string
        channel:
          $ref: '#/components/schemas/PresentmentChannel'
        mcc:
          type: string
          nullable: true
        merchantName:
          type: string
          nullable: true
        merchantCountry:
          type: string
          nullable: true
        clearImmediately:
          type: boolean
          default: true
        clearingAmountMinorUnits:
          type: integer
          format: int64
          nullable: true
          description: A partial presentment, as a fuel or hospitality merchant would send.

    SandboxPurchaseResponse:
      type: object
      properties:
        authorizationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        declineReason:
          type: string
          nullable: true
        clearedAmountMinorUnits:
          type: integer
          format: int64
        networkReference:
          type: string

    AgentMandate:
      type: object
      description: >-
        An AP2 mandate presented with an agent-initiated purchase (ADR-0283 D6, ADR-0193). Carried
        opaquely: this service does not parse the JOSE encoding, does not check the signature and
        holds no trust list — it forwards these fields to ap2-service and acts on the verdict. A
        second verifier here would be a second opinion about whether an agent may spend.
      required: [kind, issuer, subject, signingInput, signatureB64, algorithm, payee, amountCapMinorUnits, currency, expiresAt]
      properties:
        kind:
          type: string
          enum: [INTENT, CART, PAYMENT]
        issuer: { type: string }
        subject:
          type: string
          description: The delegated agent, in AP2's model.
        signingInput:
          type: string
          description: The exact string that was signed. For a JWS VC, base64url `header.payload`.
        signatureB64: { type: string }
        algorithm:
          type: string
          enum: [ES256, ED25519]
        payee:
          type: string
          description: The merchant the mandate is bound to. A purchase elsewhere is outside it.
        amountCapMinorUnits:
          type: integer
          format: int64
        currency: { type: string, minLength: 3, maxLength: 3 }
        expiresAt: { type: string, format: date-time }
        singleUse: { type: boolean, default: false }
        agentId:
          type: string
          nullable: true
          description: >-
            The acting agent, forwarded so ap2-service authorises the verification as that agent
            rather than as this service. Absent falls back to the anonymous stand-in principal until
            per-agent OAuth binding lands (ADR-0181 phase 2).
    ProvisionTokenRequest:
      type: object
      required: [cardId, requestorId, requestorLabel]
      properties:
        cardId:
          type: string
          format: uuid
        requestorId:
          type: string
          description: The wallet or merchant asking, in the network's own requestor vocabulary.
        requestorLabel:
          type: string
          description: What an operator should see. This bank's label, not the network's.
    ChangeTokenStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/NetworkTokenStatus'
    NetworkTokenStatus:
      type: string
      description: DELETED is terminal — a deleted token cannot be resumed by any scheme.
      enum: [ACTIVE, SUSPENDED, DELETED]
    CardScheme:
      type: string
      description: |
        Which adapter answered, not which brand the card carries. SIMULATOR is a first-class value:
        it is the binding this repository ships for tokenisation and disputes, and naming it keeps
        "we simulate this" distinguishable from "we integrated this" at every call site.
      enum: [VISA, MASTERCARD, SIMULATOR]
    Token:
      type: object
      required: [id, cardId, tokenReference, requestorId, requestorLabel, last4, status, scheme, provisionedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        tokenReference:
          type: string
          description: The network's opaque handle. Not a card number and not derived from one.
        requestorId:
          type: string
        requestorLabel:
          type: string
        last4:
          type: string
          description: The TOKEN's display digits, as the network supplies them. Not the card's.
        status:
          $ref: '#/components/schemas/NetworkTokenStatus'
        scheme:
          $ref: '#/components/schemas/CardScheme'
        expiry:
          type: string
          format: date
          nullable: true
        provisionedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TokenList:
      type: object
      required: [tokens, source, count]
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        source:
          type: string
          description: |
            NETWORK means the scheme answered on this request. LOCAL_MIRROR means it did not and
            these are the rows this bank last recorded — possibly stale, never current.
          enum: [NETWORK, LOCAL_MIRROR]
        degradedReason:
          type: string
          nullable: true
          description: Why the network could not answer. Null on a live read.
        count:
          type: integer
    OpenDisputeRequest:
      type: object
      required: [authorizationId, reasonCode, amountMinorUnits, currencyCode]
      properties:
        authorizationId:
          type: string
          format: uuid
        reasonCode:
          type: string
          description: The scheme's own code, passed through untranslated.
        amountMinorUnits:
          type: integer
          format: int64
          description: At most what cleared on the authorisation.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
    SubmitEvidenceRequest:
      type: object
      required: [documentReference]
      properties:
        documentReference:
          type: string
          description: A handle for the document. The document itself never travels here.
        note:
          type: string
          nullable: true
    DisputeStatus:
      type: string
      description: |
        This BANK's lifecycle. The network's own status travels beside it on `schemeStatus` and is
        never mapped into this enum — the two vocabularies must not be able to disagree where a
        chargeback deadline is computed.
      enum: [OPEN, EVIDENCE_SUBMITTED, WON, LOST, WITHDRAWN]
    Dispute:
      type: object
      required: [id, authorizationId, cardId, networkCaseId, reasonCode, amountMinorUnits, currencyCode, status, scheme, schemeStatus, openedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        authorizationId:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        networkCaseId:
          type: string
          description: Assigned by the network. There is no case here without one.
        reasonCode:
          type: string
        amountMinorUnits:
          type: integer
          format: int64
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        status:
          $ref: '#/components/schemas/DisputeStatus'
        scheme:
          $ref: '#/components/schemas/CardScheme'
        schemeStatus:
          type: string
          description: The network's own status string, verbatim.
        respondByDate:
          type: string
          format: date
          nullable: true
          description: The network's deadline, carried so a client need not re-derive it.
        evidenceReference:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DisputeList:
      type: object
      required: [disputes, count]
      properties:
        disputes:
          type: array
          items:
            $ref: '#/components/schemas/Dispute'
        count:
          type: integer
