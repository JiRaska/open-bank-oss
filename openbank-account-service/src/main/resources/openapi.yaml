openapi: 3.1.0
info:
  title: Account Service API
  # API-contract axis (ADR-0048) — bumps are classified from the OpenAPI diff,
  # independently of the release version in version.txt.
  version: 1.6.0
  description: BIAN-aligned account lifecycle management — open, query, freeze, close accounts.
  contact:
    name: OpenBank Platform
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8100
    description: Local development
tags:
  - name: Accounts
    description: Account management

paths:
  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Open a new account
      operationId: openAccount
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency-Key already used (replayed)
          headers:
            X-Idempotency-Replayed:
              schema:
                type: string
                enum: ['true']
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Accounts]
      summary: List accounts for a party
      operationId: listAccounts
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/search:
    get:
      tags: [Accounts]
      summary: Search accounts by IBAN fragment (trigram), cursor-paginated
      description: >
        Fuzzy substring match over the account IBAN. The fragment is normalized
        (spaces stripped, upper-cased); fragments shorter than 2 characters return
        an empty page. Page size is capped at 50 to bound the enumeration surface.
      operationId: searchAccounts
      parameters:
        - name: q
          in: query
          required: true
          description: IBAN fragment (>= 2 chars after normalization)
          schema:
            type: string
            minLength: 2
            maxLength: 64
            example: '0800000019'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of matching accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          description: q query parameter is required
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/active:
    get:
      tags: [Accounts]
      summary: List all ACTIVE accounts fleet-wide, cursor-paginated
      description: >
        Fleet-wide sweep over ACTIVE accounts (ADR-0143: the "list every billable account"
        read billing-service's cycle scheduler discovers its batch from). Staff/service roles
        only — not customer-facing. Page size is capped at 200.
      operationId: listActiveAccounts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of ACTIVE accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get account by ID
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/iban/{iban}:
    get:
      tags: [Accounts]
      summary: Get account by IBAN
      operationId: getAccountByIban
      parameters:
        - name: iban
          in: path
          required: true
          schema:
            type: string
            example: CZ6550510000001234567890
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      summary: Get account balance
      operationId: getAccountBalance
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Balance detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{accountId}/close:
    post:
      tags: [Accounts]
      summary: Close an account
      operationId: closeAccount
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseAccountRequest'
      responses:
        '200':
          description: Account closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{accountId}/freeze:
    post:
      tags: [Accounts]
      summary: Freeze an account
      operationId: freezeAccount
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeAccountRequest'
      responses:
        '200':
          description: Account frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{accountId}/unfreeze:
    post:
      tags: [Accounts]
      summary: Unfreeze an account
      operationId: unfreezeAccount
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeAccountRequest'
      responses:
        '200':
          description: Account unfrozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/{accountId}/savings-goal/delegation/check:
    get:
      tags: [Accounts]
      summary: Whether a party may act on the account's savings goal via delegation
      description: >-
        Machine-readable answer to "may this party DEPOSIT / WITHDRAW /
        PROPOSE_WITHDRAW on this account's savings goal?" (ADR-0232 D3): true when
        the party owns the account or holds an ACTIVE, in-window SAVINGS_GOAL
        delegation grant from the local event-fed projection. Savings goals are
        account metadata (ADR-0153), so the grant keys on the account id. Authorize
        action `account.read`.
      operationId: checkSavingsGoalDelegation
      parameters:
        - $ref: '#/components/parameters/accountId'
        - name: partyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAW, PROPOSE_WITHDRAW]
      responses:
        '200':
          description: The authorization decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized:
                    type: boolean

  /api/v1/accounts/{accountId}/goal:
    put:
      tags: [Accounts]
      summary: Set or replace the account's savings goal (ADR-0153)
      operationId: updateSavingsGoal
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsGoalRequest'
      responses:
        '200':
          description: Goal set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Accounts]
      summary: Clear the account's savings goal (ADR-0153)
      operationId: clearSavingsGoal
      security:
        - bearerAuth: [ROLE_OPERATOR, ROLE_ADMIN]
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Goal cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/approvals/{id}:
    patch:
      tags: [Accounts]
      summary: Approve or reject a pending four-eyes approval for a account lifecycle (ADR-0155)
      description: >-
        Decides an approval the platform's maker-checker gate paused. The checker is taken from the
        authenticated principal, never from the body, and the store rejects a checker equal to the
        maker. Requires ROLE_OPERATOR or ROLE_ADMIN.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                  description: true approves the pending action, false rejects it.
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                type: object
                required: [id, action, status]
                properties:
                  id:
                    type: string
                  action:
                    type: string
                    description: The gated action this approval was raised for.
                  resourceId:
                    type: string
                    nullable: true
                  status:
                    type: string
                  decidedBy:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: >
        Denied by OPA policy (ADR-0034 Phase 5, issue #266). Enforced once
        AUTHZ_ENFORCE=true — the request was authenticated (RBAC passed) but the
        fine-grained account.* policy decision denied it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    OpenAccountRequest:
      type: object
      required: [partyId, productId, accountType, currencyCode, legalName]
      properties:
        partyId:
          type: string
          format: uuid
        productId:
          type: string
        accountType:
          type: string
          enum: [CURRENT, SAVINGS, LOAN, ESCROW]
        currencyCode:
          type: string
          example: CZK
        legalName:
          type: string
          description: Legal name of the account holder for sanctions screening (ADR-0032 §C).

    CloseAccountRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    FreezeAccountRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
        accountType:
          type: string
        partyId:
          type: string
          format: uuid
        productId:
          type: string
        currencyCode:
          type: string
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED, PENDING]
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        goalName:
          type: string
          nullable: true
        goalTargetMinorUnits:
          type: integer
          format: int64
          nullable: true
        goalTargetDate:
          type: string
          format: date
          nullable: true

    SavingsGoalRequest:
      type: object
      required: [name, targetMinorUnits]
      properties:
        name:
          type: string
          maxLength: 120
        targetMinorUnits:
          type: integer
          format: int64
        targetDate:
          type: string
          format: date
          nullable: true

    AccountBalanceResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        availableBalance:
          type: number
        currentBalance:
          type: number
        reservedBalance:
          type: number
        pendingBalance:
          type: number
        currencyCode:
          type: string
        lastUpdatedAt:
          type: string
          format: date-time

    AccountPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    CursorPagination:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
