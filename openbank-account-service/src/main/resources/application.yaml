quarkus:
  application:
    name: openbank-account-service
    # version is intentionally not set here: it is inherited from the Gradle
    # build version (sourced from version.txt — ADR-0029 D2 single source of truth).

  http:
    port: 8100
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_accounts
    # The DEFAULT (Agroal/JDBC) datasource Flyway migrates. Declaring only the reactive URL leaves
    # it unconfigured, and `migrate-at-start` then kills the boot with "Unable to find datasource
    # '<default>' … Bean is not active: SYNTHETIC bean [class=AgroalDataSource]" — so the service
    # could start only where the gitops env supplied QUARKUS_DATASOURCE_JDBC_URL, never from this
    # file alone, including for `quarkusDev` (#3080). The env var still wins in the cluster.
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/openbank_accounts}

  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration
  hibernate-orm:
    database:
      generation: none

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # M2M client for outbound service-to-service calls made WITHOUT an inbound user token
  # (the welcome-bonus grant is fired from a Kafka consumer). client_credentials grant on
  # openbank-services, which carries ROLE_OPERATOR — required by transaction-service.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: none

  redis:
    hosts: redis://localhost:6379

  rest-client:
    sca-service:
      url: ${SCA_SERVICE_URL:http://localhost:8110}
      connect-timeout: 2000
      read-timeout: 2000
    balance-service:
      url: ${BALANCE_SERVICE_URL:http://localhost:8103}
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
    "sanctions-service":
      # Was :8110 — that's sca-service's port, not sanctions-service's (QUARKUS_HTTP_PORT
      # 8123 in docker-compose.yml). Never caught because no local docker-compose run had
      # ever exercised account-service + sanctions-service together (issue #669 load-benchmark
      # setup() was the first) — sanctions screening fails closed, so every local account
      # creation was silently blocked, not just slow.
      # `openbank-sanctions-service` was never a resolvable name — the Service is
      # `sanctions-service` in namespace `sanctions`. Harmless in the cluster (the Deployment
      # sets SANCTIONS_SERVICE_URL) but wrong for local dev and unresolvable if the env is ever
      # dropped; localhost:8123 is what fx/kyc/sepa-payment already default to (issue #3931).
      url: ${SANCTIONS_SERVICE_URL:http://localhost:8123}
      connect-timeout: 3000
      read-timeout: 5000
    # Issue #668: unauthenticated read of product-catalog reference data at account-open time.
    "product-catalog-api":
      # `openbank-product-catalog:8080` resolved to nothing and named the wrong port — the
      # Service is `product-catalog` on 8104 in namespace `accounts`. Overridden in the cluster
      # (PRODUCT_CATALOG_SERVICE_URL points at the KEDA interceptor); localhost:8104 matches
      # billing/document-service (issue #3931).
      url: ${PRODUCT_CATALOG_SERVICE_URL:http://localhost:8104}
      connect-timeout: 3000
      read-timeout: 5000

  shutdown:
    timeout: 30S

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  smallrye-health:
    ui:
      enable: true
    root-path: /q/health

  log:
    level: INFO
    console:
      format: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","logger":"%c{3.}","message":"%s","traceId":"%X{traceId}","spanId":"%X{spanId}"}%n'
      json: true

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-account-service
        service.version: ${quarkus.application.version}

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    # mTLS to Strimzi (ADR-0137, #2665 Tier 1). Defaults keep local dev/test on
    # PLAINTEXT; the accounts Rollout sets KAFKA_* env in prod to switch to mTLS.
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      account-events-out:
        connector: smallrye-kafka
        client.id: account-service-${quarkus.uuid}
        topic: openbank.accounts.account.created
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      account-outbox-out:
        connector: smallrye-kafka
        client.id: account-outbox-service-${quarkus.uuid}
        topic: openbank.accounts.account.created
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
      # Customer-facing notification requests (ADR-0070) drained by notification-service.
      notification-requests-out:
        connector: smallrye-kafka
        client.id: account-service-notif-${quarkus.uuid}
        topic: openbank.notification.requests
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # Onboarding account lifecycle (ADR-0267): open a PENDING_ACTIVATION account on
      # PARTY_CREATED and activate it when the party clears KYC + AML.
      party-events-in:
        connector: smallrye-kafka
        topic: openbank.party.events
        group.id: openbank-account-service
        auto.offset.reset: earliest
        # A projection failure that survives PartyEventConsumer's bounded retry is nacked here
        # rather than swallowed. dead-letter-queue routes that record to the DLQ topic and lets
        # the consumer keep moving — so a transient dependency outage parks the event for replay
        # instead of destroying it (which a prior catch-all did, dropping a whole cohort's
        # PARTY_CREATED, 2026-06-24..2026-07-17).
        #
        # The topic is EXPLICIT. SmallRye's implicit default is `dead-letter-topic-<channel>`,
        # derived from the channel name ALONE, and `party-events-in` is declared by eight services
        # here — left implicit they all dead-letter into one topic and the
        # AccountPartyEventDeadLettered alert misattributes every record in it.
        #
        # NESTED under `dead-letter-queue:`, never the dotted leaf `dead-letter-queue.topic:`.
        # SmallRye Config's YAML source quotes a leaf key containing a literal dot, registering it
        # as ..."dead-letter-queue.topic" which the connector's plain getOptionalValue never reads
        # (#686). An earlier comment here read that trap as making an explicit topic IMPOSSIBLE in
        # this file — true premise, wrong conclusion: only the DOTTED spelling is inert, and the
        # nested one resolves. card-issuance-service has carried the nested form since #5745, and
        # aml-service's DeadLetterQueueConfigResolutionTest proves both directions against the real
        # SmallRye YAML source. #5752.
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.account.party-events-in
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Delegation-grant enforcement projection (ADR-0232 D3): ACCOUNT-scoped grant
      # lifecycle events feed account_delegation_projection; the guard then answers
      # owner OR grant locally, never calling delegation-service on the request path.
      delegation-events-in:
        connector: smallrye-kafka
        topic: openbank.delegation.events
        group.id: openbank-account-service
        auto.offset.reset: earliest
        # Explicit + nested for the reasons spelled out on party-events-in above. This channel is
        # the one where the collision was not hypothetical: card-issuance-service also consumes
        # `delegation-events-in`, so both services were writing their dead letters into the single
        # implicit `dead-letter-topic-delegation-events-in` (#5752).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.account.delegation-events-in
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
        format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"
    oidc:
      enabled: false

"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_accounts_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_accounts_it
    redis:
      hosts: redis://:openbank_cache_secret@localhost:6379
    oidc:
      enabled: false
    devservices:
      enabled: false
    management:
      enabled: false

openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  outbox:
    dispatch-enabled: true

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second
  # approver), independent of the base allow/deny enforce toggle above. Stays false
  # here — this PR only wires the ApprovalStore/endpoint (mirrors the sepa-payment
  # pilot); flipping this is a deliberate, separate follow-up once the maker/checker
  # runbook is reviewed, not bundled with the wiring itself.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
