quarkus:
  application:
    name: openbank-interest-service
  http:
    port: 8125
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_interest
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_interest
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-interest-service
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    # Dedicated IT Postgres on the warm CI stack (ADR-0043); CI auto-creates any openbank_*_it
    # database referenced here. Dev Services stay OFF — tests hit localhost:5432 exactly as on a
    # workstation.
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: postgresql://localhost:5432/openbank_interest_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_interest_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    # ADR-0050: disable the @Scheduled outbox tick under test so the integration test drives
    # dispatchScheduledBatch() explicitly and never races the assertions.
    scheduler:
      enabled: false
openbank:
  interest:
    accrual-cron: "0 0 1 * * ?"
    capitalization-cron: "0 0 2 1 * ?"
    day-count-convention: ACT_365
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      interest-events-out:
        connector: smallrye-kafka
        client.id: interest-service-${quarkus.uuid}
        topic: openbank.interest.accrual.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
