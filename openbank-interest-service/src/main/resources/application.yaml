quarkus:
  application:
    name: openbank-interest-service
  http:
    port: 8125
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_interest
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_interest
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token (#999): the transaction-service and ledger-service
  # rest-clients mint an openbank-services M2M token via this oidc-client. Disabled under %test
  # (units call the consumer directly; the boot IT never books a remittance payment).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
      scope: jakarta.inject.Singleton
    # ADR-0033 §D: the capitalization credit leg (DEBIT interest expense / CREDIT the customer's
    # deposit-control pocket / CREDIT withholding-tax payable). The default resolves only on
    # localhost — a deployment MUST set LEDGER_SERVICE_URL or every capitalization fails at the
    # ledger post and leaves its accruals ACCRUING (loud, not silent: nothing is credited and
    # nothing is withheld, so the period simply retries).
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}
      scope: jakarta.inject.Singleton
    # Fleet-directory read for the daily accrual run: discovers ACTIVE accounts
    # (GET /accounts/active, ADR-0143) and their booked balance (GET /accounts/{id}/balance).
    # Same openbank-services M2M principal as the ledger/transaction clients above.
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8100}
      scope: jakarta.inject.Singleton
    # Immutable catalog revision and durable event cursor used only by the reference-data
    # snapshotter. Accrual reads its own PostgreSQL snapshot/config rows and never resolves the
    # mutable "latest" catalog representation on the money path.
    product-catalog:
      url: ${PRODUCT_CATALOG_URL:http://localhost:8104}
      scope: jakarta.inject.Singleton
  redis:
    hosts: redis://localhost:6379
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-interest-service
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

# OPA sidecar (ADR-0034 Phase 5, issue #938 bootstrap). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    # Dedicated IT Postgres on the warm CI stack (ADR-0043); CI auto-creates any openbank_*_it
    # database referenced here. Dev Services stay OFF — tests hit localhost:5432 exactly as on a
    # workstation.
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: postgresql://localhost:5432/openbank_interest_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_interest_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    # ADR-0050: disable the @Scheduled outbox tick under test so the integration test drives
    # dispatchScheduledBatch() explicitly and never races the assertions.
    scheduler:
      enabled: false
# ADR-0033 §D — the GL accounts the capitalization split posts against (InterestLedgerConfig).
# Defaults are the stable `a0000000-…` rows seeded by the ledger's
# V17__interest_capitalization_accounts.sql; operators repoint them at the real chart per
# environment. Interest expense is per currency because the ledger rejects a line whose currency
# differs from its GL account's (the V14 cash-clearing bug); withholding-tax payable is CZK-only
# because ADR-0033 §E withholds only CZK interest.
interest:
  catalog-sync:
    # Expand safely: disabled until an environment gives the openbank-services principal catalog
    # read access and opts into the migration. Enabling later is idempotent because receipts and the
    # cursor commit with each snapshot.
    enabled: ${INTEREST_CATALOG_SYNC_ENABLED:false}
    interval: ${INTEREST_CATALOG_SYNC_INTERVAL:30s}
    initial-delay: ${INTEREST_CATALOG_SYNC_INITIAL_DELAY:15s}
  ledger:
    system-actor-id: ${INTEREST_LEDGER_SYSTEM_ACTOR_ID:00000000-0000-0000-0000-0000000000cc}
    gl:
      # NOT V1's '4000 Interest Expense': that row was seeded with gen_random_uuid(), so no fixed
      # UUID can reference it (issue #468's defect, cf. V15/'4003 Fee Income'), and it is CZK-only.
      interest-expense-czk: ${INTEREST_GL_INTEREST_EXPENSE_CZK:a0000000-0000-0000-0000-000000004010}
      interest-expense-eur: ${INTEREST_GL_INTEREST_EXPENSE_EUR:a0000000-0000-0000-0000-000000004011}
      interest-expense-usd: ${INTEREST_GL_INTEREST_EXPENSE_USD:a0000000-0000-0000-0000-000000004012}
      interest-expense-gbp: ${INTEREST_GL_INTEREST_EXPENSE_GBP:a0000000-0000-0000-0000-000000004013}
      withholding-tax-payable: ${INTEREST_GL_WITHHOLDING_TAX_PAYABLE:a0000000-0000-0000-0000-000000002200}
openbank:
  interest:
    accrual-cron: "0 0 1 * * ?"
    capitalization-cron: "0 0 2 1 * ?"
    # Account types the daily accrual run posts interest for (comma-separated, matched against
    # account-service's accountType). BOTH the everyday CURRENT account and SAVINGS earn interest —
    # the onboarding balance lands on CURRENT, so interest must apply there or nearly every customer
    # earns nothing. Each type accrues at its own product's rate (CURRENT 2.5% V10, SAVINGS 4% V9);
    # an account whose product has no active rate config is simply skipped.
    accruable-account-types: "CURRENT,SAVINGS"
    day-count-convention: ACT_365
    withholding:
      # #999: the bank's own operating/settlement account debited for the §38d odvod to the
      # finanční úřad — this is the bank's OWN money (already withheld from customers' credited
      # interest at capitalization time, ADR-0033), not a customer account. MUST be set to a real
      # account UUID before this runs against anything but a sandbox; the placeholder below is
      # deliberately an all-zero UUID (matches the CHANGE_ME_LOCAL_DEV_ONLY convention used for
      # secrets elsewhere in this repo) so an unconfigured deployment fails loudly at the
      # transaction-service call, not silently.
      remittance-source-account-id: "${INTEREST_WITHHOLDING_SOURCE_ACCOUNT_ID:00000000-0000-0000-0000-000000000000}"
  rate-limit:
    enabled: true
    max-concurrent-requests: 200
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      interest-events-out:
        connector: smallrye-kafka
        client.id: interest-service-${quarkus.uuid}
        topic: openbank.interest.accrual.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # #999: self-consume the withholding-remittance events this service itself publishes (the
      # topic also carries other interest event types; the consumer filters by eventType), and book
      # the cash leg to the finanční úřad. group.id / auto.offset.reset deliberately NOT set as YAML
      # keys (SmallRye's dotted-key footgun, #686/#703) — defaults are what we want: group.id falls
      # back to quarkus.application.name, auto.offset.reset stays `latest` so a fresh deploy does
      # not replay historical remittances and re-pay them.
      interest-withholding-remitted-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.interest.interest-withholding-remitted-in
        connector: smallrye-kafka
        topic: openbank.interest.accrual.event
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
