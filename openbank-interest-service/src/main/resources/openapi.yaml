openapi: 3.1.0
info:
  title: Interest Service API
  version: 1.6.0
  description: >-
    Interest accrual, capitalization, and rate configuration. Capitalization withholds Czech
    final tax on credit interest (§36/§38d ZDP, ADR-0033): CZK interest credited to a resident
    individual is taxed at source (15 %) and the customer is credited net; the gross/tax/net split
    is returned on the capitalization result. Withheld tax is remitted monthly to the finanční úřad
    (ADR-0038): the remittance endpoints assemble the per-period *Vyúčtování daně vybírané srážkou*
    and advance the paired records RECORDED → REMITTED.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8125
    description: Local development
tags:
  - name: Interest
  - name: Withholding remittance

paths:
  /api/v1/interest/accrue:
    post:
      tags: [Interest]
      summary: Accrue interest for a single account
      operationId: accrueInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccrualRequest'
      responses:
        '200':
          description: Accrual result
        '422':
          description: >-
            No active rate config for the (account/product, currency) — the account has no rate in
            the requested currency, so nothing is accrued (issue #1265).

  /api/v1/interest/accrue/all:
    post:
      tags: [Interest]
      summary: Accrue interest for all accounts
      operationId: accrueAllInterest
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Accrual summary

  /api/v1/interest/capitalize/{accountId}:
    post:
      tags: [Interest]
      summary: Capitalize accrued interest
      operationId: capitalizeInterest
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Capitalization result (net credited, with the withholding-tax split)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capitalization'

  /api/v1/interest/accruals:
    get:
      tags: [Interest]
      summary: List every interest accrual
      description: >-
        The unfiltered collection across all accounts (authorize action `interest.list`). Each
        entry carries the day-count convention of its rate configuration, defaulting to ACT_365
        when that configuration is no longer present.
      operationId: listAllAccruals
      responses:
        '200':
          description: All accruals

  /api/v1/interest/accounts/{accountId}/effective-rate:
    get:
      tags: [Interest]
      summary: The interest rate effective for an account (override, else product default)
      operationId: getEffectiveRate
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: ISO date to resolve the rate on. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The effective rate configuration
        '204':
          description: No rate configuration applies to this account and product on that date

  /api/v1/interest/accruals/{accountId}:
    get:
      tags: [Interest]
      summary: Get interest accruals for account
      operationId: getAccruals
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Accruals

  /api/v1/interest/accruals/{accountId}/summary:
    get:
      tags: [Interest]
      summary: Accrual summary for account
      operationId: getAccrualSummary
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary

  /api/v1/interest/capitalizations/{accountId}:
    get:
      tags: [Interest]
      summary: Get capitalization history
      operationId: getCapitalizations
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Capitalizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capitalization'

  /api/v1/interest/withholding/remittances:
    post:
      tags: [Withholding remittance]
      summary: Assemble (or return) the monthly withholding remittance for a tax period
      description: >-
        Assembles the per-period *Vyúčtování daně vybírané srážkou* (§38d ZDP, ADR-0038), folding all
        tax actually withheld in the month into one batch, advancing the paired records
        RECORDED → REMITTED, and emitting `interest.withholding.remitted.v1`. Idempotent: one batch
        per `(year, month)` — re-running returns the assembled batch.
      operationId: assembleWithholdingRemittance
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '201':
          description: Remittance batch (assembled or pre-existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingRemittance'
    get:
      tags: [Withholding remittance]
      summary: List assembled withholding remittance batches
      operationId: listWithholdingRemittances
      responses:
        '200':
          description: Remittance batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WithholdingRemittance'

  /api/v1/interest/withholding/remittances/{year}/{month}:
    get:
      tags: [Withholding remittance]
      summary: Get the withholding remittance batch for a tax period
      operationId: getWithholdingRemittance
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Remittance batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithholdingRemittance'
        '404':
          description: No remittance assembled for this period

  /api/v1/interest/rates:
    post:
      tags: [Interest]
      summary: Create interest rate config
      operationId: createRateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestRateConfig'
      responses:
        '201':
          description: Rate config created
    get:
      tags: [Interest]
      summary: List interest rate configs
      operationId: listRateConfigs
      parameters:
        - name: productId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Rate configs

  /api/v1/interest/rates/{id}:
    get:
      tags: [Interest]
      summary: Get rate config by ID
      operationId: getRateConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rate config
    delete:
      tags: [Interest]
      summary: Deactivate rate config
      operationId: deactivateRateConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deactivated

components:
  schemas:
    AccrualRequest:
      type: object
      required: [accountId, accrualDate]
      properties:
        accountId:
          type: string
          format: uuid
        productId:
          type: string
        balance:
          type: number
        currency:
          type: string
        accrualDate:
          type: string
          format: date

    Capitalization:
      type: object
      description: >-
        A credited interest capitalization. Per ADR-0033 the customer is credited the net amount;
        grossAmount/taxAmount/netAmount expose the withholding split. For non-CZK interest no tax is
        withheld in v1 (deferred), so net = gross and taxAmount = 0.
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        productId:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        totalAccrued:
          type: number
          description: Sum of the period's gross daily accruals.
        grossAmount:
          type: number
          description: Gross interest before withholding.
        taxAmount:
          type: number
          description: Withholding tax retained at source (whole CZK; 0 when not withheld).
        netAmount:
          type: number
          description: Net interest credited to the customer (= capitalizedAmount).
        capitalizedAmount:
          type: number
          description: The amount actually credited (the net amount).
        currency:
          type: string
          minLength: 3
          maxLength: 3
        ledgerEntryId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    WithholdingRemittance:
      type: object
      description: >-
        A monthly withholding-tax remittance batch (ADR-0038) — the *Vyúčtování daně vybírané srážkou*
        for one tax month. Aggregates all tax actually withheld (treatment WITHHELD, currency CZK) in
        the period, owed to the finanční úřad by dueDate (§38d odst. 3 ZDP).
      properties:
        id:
          type: string
          format: uuid
        periodYear:
          type: integer
        periodMonth:
          type: integer
          minimum: 1
          maximum: 12
        authority:
          type: string
          description: The Czech tax authority (CZ-FU) in v1.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        totalTaxAmount:
          type: number
          description: Sum of whole-CZK tax withheld in the period.
        itemCount:
          type: integer
          description: Number of withholding records folded into the batch.
        dueDate:
          type: string
          format: date
          description: End of the month following the withholding month (§38d odst. 3).
        status:
          type: string
          enum: [PENDING, SETTLED]
          description: PENDING until the delegated cash leg to the tax authority is confirmed.
        createdAt:
          type: string
          format: date-time

    InterestRateConfig:
      type: object
      required: [productId]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
        accountId:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            ISO-4217 currency this rate applies to. Rates are currency-specific; accrual resolves a
            rate only in the accrual's own currency, so an account cannot accrue in a currency it has
            no rate for (issue #1265). Accrual against a currency with no config yields HTTP 422.
        rateType:
          type: string
          enum: [FIXED, VARIABLE, TIERED]
        annualRate:
          type: number
        minBalance:
          type: number
        maxBalance:
          type: number
          nullable: true
        dayCount:
          type: string
          enum: [ACT_365, ACT_360, ACT_ACT, THIRTY_360]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
