quarkus:
  application:
    name: docs-truth-agent
  http:
    port: 8146
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # Reactive client for the app (Panache); JDBC URL is for Flyway migrations only.
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_docstruth}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_docstruth}
  hibernate-orm:
    # Flyway owns the schema; Hibernate validates against it, never generates.
    database:
      generation: none
  flyway:
    migrate-at-start: true
  shutdown:
    timeout: 30S
  log:
    level: INFO
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      enabled: false

"%test":
  quarkus:
    oidc:
      enabled: false
    management:
      enabled: false
    http:
      # Ephemeral: this module now has more than one @QuarkusTest profile, so there is more than
      # one application boot per run, and on the fixed default the second dies with
      # QuarkusBindException whenever anything else on the machine holds the port.
      test-port: 0

  openbank:
    docs-truth-agent:
      # A cron that never fires (the 31st of February), NOT `quarkus.scheduler.enabled: false`.
      # Disabling the scheduler makes the class structurally invisible to every test — which is how
      # five schedulers in this fleet reached production having never run (#2148, #2187). With a
      # real-but-unreachable expression the wiring is still built and validated at boot, and a test
      # profile can override this key with a fast cron to drive the REAL schedule.
      check-cron: "0 0 5 31 2 ?"

openbank:
  temporal:
    enabled: ${TEMPORAL_ENABLED:false}
    server-url: ${TEMPORAL_HOST:temporal-frontend.temporal:7233}
    namespace: ${TEMPORAL_NAMESPACE:openbank}
    task-queue: docs-truth-agent
  docs-truth-agent:
    # Periodic sweep (ADR-0166) — weekly on Sunday at 05:30 UTC. The control-plane AI agents are offset from one
    # another because they share ONE LiteLLM gateway and one Prometheus, and each carries its own
    # daily token budget: finops 03:00, control-liveness-sentinel 03:15, devops 03:30,
    # governance-auditor 04:30, release-steward 05:00, then the three weekly sweeps on Sunday at
    # 05:30 / 06:00 / 06:30 — placed AFTER the last daily agent so that on Sunday, the one day all
    # eight can coincide, no sweep starts while another is still in its opening minutes.
    # Collisions with unrelated per-service batch jobs are explicitly not a consideration:
    # different pods, different databases.
    # Quarkus cron is SIX fields (second minute hour day month weekday).
    check-cron: ${DOCS_TRUTH_AGENT_CHECK_CRON:0 30 5 ? * SUN}
    github-api-url: ${GITHUB_API_URL:https://api.github.com}
    github-repo: ${GITHUB_REPO:JiRaska/open-bank-oss}
    llm-gateway-url: ${LLM_GATEWAY_URL:http://litellm.ai-platform:4000}
    # Filesystem path to the monorepo checkout this agent reads docs/adr/*.md Delivery-Status
    # lines, openbank-libs/governance/rules.yaml enforced flags, and every named artifact's
    # existence from (RepoScanPort, ADR-0166 checks 1-3).
    repo-root: ${DOCS_TRUTH_AGENT_REPO_ROOT:.}
