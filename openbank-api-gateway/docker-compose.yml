services:
  kong:
    image: kong:3.7.1
    container_name: openbank-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-info}
      KONG_PROXY_LISTEN: 0.0.0.0:8000 reuseport backlog=16384
      KONG_ADMIN_LISTEN: 0.0.0.0:8001 reuseport backlog=16384
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
