quarkus:
  application:
    name: control-liveness-sentinel
  http:
    port: 8144
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # Reactive client for the app (Panache); JDBC URL is for Flyway migrations only.
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_liveness}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_liveness}
  hibernate-orm:
    # Flyway owns the schema; Hibernate validates against it, never generates.
    database:
      generation: none
  flyway:
    migrate-at-start: true
  shutdown:
    timeout: 30S
  log:
    level: INFO
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
    oidc:
      enabled: false

"%test":
  quarkus:
    oidc:
      enabled: false
    management:
      enabled: false
    http:
      # An ephemeral port, because this module now has TWO @QuarkusTest classes with different
      # profiles and therefore two application boots per run. On the fixed default test port the
      # second boot dies with `QuarkusBindException` whenever anything else on the machine holds
      # it — observed here on a workstation that also hosts self-hosted CI runners. RestAssured
      # reads the actual port from the test context, so nothing needs to know the number.
      test-port: 0

  openbank:
    liveness-sentinel:
      # A cron that never fires (the 31st of February), NOT `quarkus.scheduler.enabled: false`.
      # Disabling the scheduler makes the class structurally invisible to every test -- which is
      # how five schedulers in this fleet reached production having never run (#2148, #2187). With
      # a real-but-unreachable expression the wiring is still constructed and validated at boot,
      # and a test profile can override this key with a fast cron to drive the REAL schedule
      # (LivenessSchedulerCronIT does exactly that).
      check-cron: "0 0 5 31 2 ?"

openbank:
  temporal:
    enabled: ${TEMPORAL_ENABLED:false}
    server-url: ${TEMPORAL_HOST:temporal-frontend.temporal:7233}
    namespace: ${TEMPORAL_NAMESPACE:openbank}
    task-queue: control-liveness-sentinel
  liveness-sentinel:
    # ADR-0163: "runs daily (03:00 UTC, offset from finops-agent/devops-agent) plus reactively".
    # 03:15 implements that offset: finops-agent runs 03:00 (ADR-0112) and devops-agent 03:30.
    # The offset is between the three AI AGENTS specifically, because they share one LiteLLM
    # gateway and one Prometheus, and each now carries its own daily token budget — firing them
    # together contends on all three. Collisions with unrelated per-service batch jobs are NOT a
    # consideration and are not avoided here: sdd-service's expiry sweep also runs at 03:15, on a
    # different pod against a different database, and that costs nothing.
    # Quarkus cron is SIX fields (second minute hour day month weekday).
    check-cron: ${LIVENESS_CHECK_CRON:0 15 3 * * ?}
    prometheus-url: ${PROMETHEUS_URL:http://prometheus-operated.observability:9090}
    alertmanager-url: ${ALERTMANAGER_URL:http://alertmanager-operated.observability:9093}
    # OpenAI-compatible model backend — DeepInfra, the same provider devops-agent (ADR-0119) and
    # the customer copilot (ADR-0089) already run against; "litellm.ai-platform" is not deployed
    # anywhere in this repo's gitops (ADR-0163 E2E-wiring note).
    model-endpoint: ${LIVENESS_MODEL_ENDPOINT:https://api.deepinfra.com/v1/openai}
    model-id: ${LIVENESS_MODEL_ID:deepseek-ai/DeepSeek-V3.2}
    github-api-url: ${LIVENESS_GITHUB_API_URL:https://api.github.com}
    github-owner: ${LIVENESS_GITHUB_OWNER:JiRaska}
    github-repo: ${LIVENESS_GITHUB_REPO:open-bank-oss}
    github-proposal-dir: ${LIVENESS_GITHUB_PROPOSAL_DIR:docs/liveness-sentinel-proposals}
    # 2x expected interval == the same paging threshold ADR-0160 mechanism 3 defines, so this
    # agent's CRITICAL finding can never silently disagree with the Alertmanager rule.
    stale-heartbeat-multiplier: ${STALE_HEARTBEAT_MULTIPLIER:2.0}
    # Fires WARNING earlier, before the control reaches the paging threshold above.
    warn-heartbeat-multiplier: ${WARN_HEARTBEAT_MULTIPLIER:1.5}
    consecutive-drift-threshold: ${CONSECUTIVE_DRIFT_THRESHOLD:3}
