quarkus:
  application:
    name: openbank-product-catalog
  http:
    port: 8104
    limits:
      max-body-size: 2M
    cors:
      ~: true
      origins: "http://localhost:3000,http://openbank-admin-ui:3000"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,If-Match
      exposed-headers: ETag
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  # Health/metrics on a separate management port, matching the fleet convention and the
  # Deployment's `management` containerPort that startup/liveness/readiness probes target.
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q

  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # Reactive client for the app (Panache); JDBC URL is for Flyway migrations only.
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_products}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_products}
  hibernate-orm:
    # Flyway owns the schema; Hibernate validates against it, never generates.
    database:
      generation: none
  flyway:
    migrate-at-start: true
  log:
    level: INFO
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs
  # Resource-server: product-catalog now authenticates its callers (issue #401). Reads require a
  # valid token (@Authenticated); writes require ROLE_OPERATOR/ROLE_ADMIN. Every in-cluster caller
  # presents (or now presents) an openbank-services / openbank-edge service token; the admin-ui
  # relays the operator's token via its BFF. This is a PURE resource server (application-type
  # `service`, the default): it validates bearer tokens against the realm's JWKS and does not mint
  # tokens, so it needs NO client secret — only the issuer URL.
  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    tls:
      verification: ${OIDC_TLS_VERIFICATION:none}

# OPA sidecar (ADR-0034) for the AI-agent read bridge (query.catalog.readonly). Advisory by
# default — a denied/unreachable decision is logged at WARN and the request proceeds; product
# catalog has no sidecar yet, so this stays advisory until one is deployed and AUTHZ_ENFORCE=true.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"

openbank:
  catalog:
    # Current OpenBank deployment enables both reference packs. Standalone charts override this to
    # an empty value and let the operator opt in explicitly.
    packs: ${OPENBANK_CATALOG_PACKS:banking,insurance}
    bank-v1-compatibility-enabled: ${OPENBANK_CATALOG_BANK_V1_COMPATIBILITY_ENABLED:true}
    security:
      scope-claim: ${CATALOG_SCOPE_CLAIM:scope}
      read-scope: ${CATALOG_READ_SCOPE:catalog:read}
      author-scope: ${CATALOG_AUTHOR_SCOPE:catalog:author}
      publish-scope: ${CATALOG_PUBLISH_SCOPE:catalog:publish}
  api:
    # API-contract major, independent of version.txt (ADR-0048); newest served contract is /api/v2.
    version: "2"
    deprecated-paths:
      - /api/v1/products
      - /api/v1/fees
    successor-links:
      - /api/v1/products=>/api/v2/offerings
      - /api/v1/fees=>/api/v2/offerings
    sunset-date: "Wed, 10 Feb 2027 00:00:00 GMT"

"%test":
  quarkus:
    scheduler:
      enabled: false
    management:
      enabled: false
    # No Keycloak on the test stack — disable the resource server so @QuarkusTest boots, and let
    # @TestSecurity mock the identity for the security-annotated endpoints (quarkus-test-security).
    oidc:
      enabled: false
  # OPA sidecar is absent in CI — keep @Authorize advisory so the reads proceed under test.
  authz:
    enforce: "false"

# Portable distribution: fail closed unless its operator supplies PostgreSQL and a standards-based
# OIDC issuer. No industry pack is installed implicitly; a bank, insurer, or other regulated firm
# selects only the trusted packs it needs. Core maker/checker enforcement never depends on OPA.
"%standalone":
  quarkus:
    datasource:
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      reactive:
        url: ${REACTIVE_URL}
      jdbc:
        url: ${JDBC_URL}
    oidc:
      auth-server-url: ${OIDC_ISSUER}
      tls:
        verification: required
  openbank:
    catalog:
      packs: ${OPENBANK_CATALOG_PACKS:}
      bank-v1-compatibility-enabled: ${OPENBANK_BANK_V1_COMPATIBILITY_ENABLED:false}
      require-https-issuer: true
  authz:
    enforce: "false"
