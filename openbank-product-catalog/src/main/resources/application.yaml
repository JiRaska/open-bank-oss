quarkus:
  application:
    name: openbank-product-catalog
  http:
    port: 8104
    cors:
      ~: true
      origins: "http://localhost:3000,http://openbank-admin-ui:3000"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    # Reactive client for the app (Panache); JDBC URL is for Flyway migrations only.
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_products}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_products}
  hibernate-orm:
    # Flyway owns the schema; Hibernate validates against it, never generates.
    database:
      generation: none
  flyway:
    migrate-at-start: true
  log:
    level: INFO
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs
  # Guards create/update/activate/deactivate (mutating the live product/fee catalog). The
  # read endpoints (list/getById/getByCode/getFees) stay open by design — public reference
  # data the admin UI's pricing screens read without auth.
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

"%test":
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
