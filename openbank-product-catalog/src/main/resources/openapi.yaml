openapi: 3.1.0
info:
  title: Product Catalog API
  # Kept in lockstep with version.txt / quarkus.application.version
  # (ADR-0029 D2 single-source invariant). The major == openbank.api.version == /api/v1.
  version: 0.1.0
  description: >-
    System of record for bank products and pricing. Owns the product master and the
    bank-wide fee schedule; the admin UI reads pricing from here instead of hardcoding
    a price list in the web tier.
  contact:
    name: OpenBank Platform
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8104
    description: Local development
  - url: http://openbank-product-catalog:8104
    description: In-cluster
tags:
  - name: Products
    description: Product master lifecycle
  - name: Fees
    description: Bank-wide fee schedule (flattened from per-product fees)
paths:
  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: currency, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Product' } }
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '409':
          description: Duplicate product code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get a product by id
      operationId: getProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Products]
      summary: Update a product
      operationId: updateProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/products/by-code/{code}:
    get:
      tags: [Products]
      summary: Get a product by its semantic code or prod-NNN legacy alias (ADR-0105)
      operationId: getProductByCode
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/products/{id}/activate:
    post:
      tags: [Products]
      summary: Activate a product
      operationId: activateProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/products/{id}/deactivate:
    post:
      tags: [Products]
      summary: Deactivate a product
      operationId: deactivateProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/products/{id}/fees:
    get:
      tags: [Products]
      summary: Fees for a single product
      operationId: getProductFees
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Fees attached to the product
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Fee' } }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/fees:
    get:
      tags: [Fees]
      summary: Bank-wide fee schedule
      description: >-
        Flattens every product's fees into one filterable schedule. Each item carries
        its owning product identity and a derived stable code so the UI never hardcodes
        pricing.
      operationId: listFees
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: currency, in: query, required: false, schema: { type: string } }
        - { name: productCode, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Flattened fee schedule
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FeeScheduleItem' } }
components:
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Fee:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        amount: { type: number }
        currency: { type: string }
        frequency: { type: string }
        description: { type: string, nullable: true }
        waivable: { type: boolean }
        waiveCondition: { type: string, nullable: true }
      required: [id, name, type, amount, currency, frequency, waivable]
    FeeScheduleItem:
      type: object
      description: A fee flattened out of its owning product into the bank-wide schedule.
      properties:
        id: { type: string, description: "Stable composite id: <productId>:<feeId>" }
        code: { type: string, description: "Derived stable code: <PRODUCT_CODE>_<FEE_SLUG>" }
        name: { type: string }
        type: { type: string }
        amount: { type: number }
        currency: { type: string }
        frequency: { type: string }
        description: { type: string, nullable: true }
        waivable: { type: boolean }
        waiveCondition: { type: string, nullable: true }
        productId: { type: string }
        productCode: { type: string }
        productName: { type: string }
        status: { type: string, description: "Owning product status (ACTIVE/INACTIVE/DRAFT/…)" }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - code
        - name
        - type
        - amount
        - currency
        - frequency
        - waivable
        - productId
        - productCode
        - productName
        - status
        - updatedAt
    ProductRequest:
      type: object
      description: >-
        Product create/update payload. Only the core identity fields are required; the
        rich configuration objects (card, multi-currency, overdraft, term-deposit,
        savings) are optional and modelled loosely here.
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        status: { type: string, nullable: true }
        isPublic: { type: boolean, nullable: true }
        version: { type: string, nullable: true }
        validFrom: { type: string, nullable: true }
        validTo: { type: string, nullable: true }
        baseRate: { type: number, nullable: true }
        fee: { type: number, nullable: true }
        fees:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Fee' }
        description: { type: string, nullable: true }
        shortDescription: { type: string, nullable: true }
        minBalance: { type: number, nullable: true }
        maxBalance: { type: number, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }
      required: [code, name, type, currency]
    Product:
      type: object
      description: >-
        Product master record. Identity and pricing fields are modelled here; the
        sprawling per-type configuration blocks are returned as-is and left open.
      additionalProperties: true
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        status: { type: string }
        defaultCurrency: { type: string, nullable: true }
        description: { type: string, nullable: true }
        fees:
          type: array
          items: { $ref: '#/components/schemas/Fee' }
        updatedAt: { type: string, format: date-time }
      required: [id, code, name, type, currency, status]
