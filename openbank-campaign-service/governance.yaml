# SPDX-License-Identifier: Apache-2.0
# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only.
dataDomain: platform
primaryDatastore: PostgreSQL
databaseName: openbank_campaigns
dataLineageRole: both
dataClassification: confidential
retentionPolicy: 5 years
evidenceExported: true
lineage:
  downstream:
    - serviceName: notification-service
      relationType: topic
      description: delivery via openbank.notification.requests (ADR-0200 D3)
    - serviceName: consent-service
      relationType: api
      description: per-send marketing consent check (ADR-0198)
  upstream:
    - serviceName: consent-service
      relationType: topic
      description: openbank.consent.events — revocation signals journeys (ADR-0200 D2)
    # Removed (issue #3982): `analytics-sink (api, "silver-layer segment evaluation (ADR-0210)")`.
    # analytics-sink has no @RegisterRestClient at all and its Deployment env reaches only
    # apicurio-registry, clickhouse and keycloak; campaign-service reaches clickhouse and
    # consent-service. The two meet in ClickHouse, which is a shared datastore, not an api edge
    # between the services — and `databaseLineage` is where that belongs, not `lineage`.
