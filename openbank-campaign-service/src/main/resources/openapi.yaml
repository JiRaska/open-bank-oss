openapi: 3.1.0
info:
  title: Campaign Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048).
  version: 1.42.0
  description: >-
    Campaign management first slice (ADR-0200 / ADR-0209 D3): deterministic, versioned segments;
    per-enrolment Temporal journeys; consent-gated delivery through notification-service.
    Activation is four-eyes (`campaign.activate`, rules.yaml four_eyes.actions) with a domain
    maker/checker invariant.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8128
    description: Local development
tags:
  - name: Campaigns

paths:
  /api/v1/campaigns/interactions/{interactionRef}:
    get:
      tags: [Campaigns]
      summary: Validate an opaque PUSH or BANNER interaction reference
      description: >-
        Internal customer-edge capability only. The request carries the authoritative caller party
        in `X-Customer-Party-Id`. A 404 has one meaning for every unsafe state: unknown reference,
        wrong party, non-app placement, or no accepted handoff.
      parameters:
        - name: interactionRef
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Customer-Party-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The reference belongs to this party and a handed-off app placement
        "400":
          description: Missing or malformed caller party header
        "404":
          description: Reference is not valid for this caller; deliberately non-specific
        "401":
          description: Missing service token
        "403":
          description: Caller is not customer-edge
  /api/v1/campaigns/interactions/{interactionRef}/attribution:
    get:
      tags: [Campaigns]
      summary: Resolve server-owned attribution for an opaque app interaction reference
      description: >-
        Additive internal customer-edge capability. Only after ownership, app channel and handoff
        are established does the trusted response return campaign/step/channel context and the
        campaign's immutable incentive reference for the edge to attach to a downstream claim.
        The app never receives or supplies campaign or offer identity.
      parameters:
        - name: interactionRef
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Customer-Party-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Server-owned attribution context for the validated reference
          content:
            application/json:
              schema:
                type: object
                required: [campaignId, stepOrder, channel]
                properties:
                  campaignId: { type: string, format: uuid }
                  stepOrder: { type: integer, minimum: 0 }
                  channel: { type: string, enum: [PUSH, BANNER] }
                  incentiveOfferRef:
                    oneOf:
                      - $ref: '#/components/schemas/IncentiveOfferRef'
                      - type: 'null'
        "400":
          description: Missing or malformed caller party header
        "404":
          description: Reference is not valid for this caller; deliberately non-specific
        "401":
          description: Missing service token
        "403":
          description: Caller is not customer-edge
  /api/v1/campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      operationId: listCampaigns
      responses:
        '200':
          description: All campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
    post:
      tags: [Campaigns]
      summary: Create a campaign draft
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '409':
          description: A reviewed segment reference is no longer available
  /api/v1/campaigns/summary:
    get:
      tags: [Campaigns]
      operationId: campaignSummary
      summary: Reach and delivery for every campaign
      description: >-
        The campaign list returns records only, so a console had no way to show whether anything
        reached anyone without one request per campaign — an N+1 against a scale-to-zero service
        (issue #3296). Answered here in three grouped queries. Suppression counts are carried
        through rather than folded away: "2 sent" and "2 sent, 40 suppressed for consent" are
        different campaigns, and only the second explains why reach was low.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: One entry per campaign
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignSummary' }
  /api/v1/campaigns/planning:
    get:
      tags: [Campaigns]
      operationId: campaignPlanning
      summary: Declared campaign entry plan
      description: >-
        Portfolio planning projection for scheduled, event-driven and manual campaigns. A scheduled
        entry's nextScheduledWindowAt is calculated from the reviewed cadence in Europe/Prague; it
        is not a delivery promise, audience-overlap estimate, or proof that Temporal started it.
        Inactive schedules intentionally return no next window. NOTE the literal segment must keep
        matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: Planned campaign entries without party-level data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignPlan' }
  /api/v1/campaigns/cadences:
    get:
      tags: [Campaigns]
      summary: Cadences a recurring campaign may be scheduled on
      operationId: listCadences
      description: >-
        The closed set of cadences, served so an authoring screen cannot offer one the service would
        reject. Adding an entry is a pull request against ScheduleCatalog.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: Every cadence, with its human form and the zone it is evaluated in
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cadence: { type: string, example: DAILY_MORNING }
                    humanForm: { type: string, example: every day at 09:00 }
                    zone:
                      type: string
                      example: Europe/Prague
                      description: >-
                        Never UTC. A cron evaluated in UTC reaches Czech customers an hour or two
                        off their morning, and the offset moves twice a year.
  /api/v1/campaigns/triggers:
    get:
      tags: [Campaigns]
      summary: Product events that may start a campaign journey
      operationId: listCampaignTriggers
      description: >-
        The closed trigger catalogue, served so the authoring surface cannot offer a product event
        nobody consumes. The event determines when a journey is considered; the campaign's
        versioned segment still determines who may enter it.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: Every supported product-event trigger with an operator-facing description
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [trigger, humanForm]
                  properties:
                    trigger: { type: string, example: ACCOUNT_OPENED }
                    humanForm: { type: string, example: when an account is opened }
  /api/v1/campaigns/templates:
    get:
      tags: [Campaigns]
      summary: Reviewed cross-channel templates available to Campaign Studio
      operationId: listCampaignTemplates
      description: >-
        The exact closed content catalogue the aggregate accepts. It is served so Studio never
        duplicates a stale e-mail, push, banner, carousel, product-feed, or rewards-hub option.
        Templates remain reviewed code; this endpoint does not accept marketer-authored markup.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: Every marketing template with its channel, named variables, and app surface where applicable
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [template, channel, variables]
                  properties:
                    template: { type: string, example: MARKETING_PRODUCT_OFFER_BANNER }
                    channel: { type: string, enum: [EMAIL, PUSH, BANNER] }
                    variables:
                      type: array
                      items: { type: string }
                      example: [offerTitle, offerText, ctaText]
                    inAppSurface:
                      type: string
                      nullable: true
                      enum: [HOME_BANNER, HOME_CAROUSEL, STORIES, PRODUCT_FEED, REWARDS_HUB]
  /api/v1/campaigns/guardrails:
    get:
      tags: [Campaigns]
      summary: Current outbound-contact guardrails for Campaign Studio
      operationId: campaignContactGuardrails
      description: >-
        The active platform limit and quiet period for outbound campaign contacts. This is not a
        forecast of the audience that will be allowed: consent, suppression and rolling counts are
        evaluated live for each person immediately before delivery. In-app placements have their
        own rendering-time impression policy and are not counted as outbound sends here.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: Current platform contact policy, safe to explain but not override from Studio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignContactGuardrails'
  /api/v1/campaigns/{id}:
    get:
      tags: [Campaigns]
      summary: Get a campaign
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          description: Not found
    put:
      tags: [Campaigns]
      summary: Revise the authenticated maker's unsubmitted campaign draft
      description: >-
        A DRAFT may be revised only by its recorded maker. Once submitted, the approved definition
        is immutable through this endpoint so the checker always approves the journey that runs.
      operationId: reviseCampaignDraft
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '200':
          description: Draft revised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '409':
          description: Campaign is not a draft, caller is not its maker, or the definition is invalid
  /api/v1/campaigns/{id}/duplicate:
    post:
      tags: [Campaigns]
      summary: Reuse a campaign definition as a fresh draft
      description: >-
        Creates a new maker-owned DRAFT from the source definition. It does not copy lifecycle
        state, approval, enrolments, sends, outcomes or other runtime history; the new campaign
        must pass its own four-eyes approval before it can run. Current catalogues are validated
        again so an obsolete segment, trigger or conversion rule cannot be copied into a draft.
      operationId: duplicateCampaignAsDraft
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '201':
          description: New reusable campaign draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          description: Source campaign not found
        '409':
          description: Source definition cannot be used with the current reviewed catalogues
  /api/v1/campaigns/{id}/submit:
    post:
      tags: [Campaigns]
      summary: Submit a draft for four-eyes approval
      operationId: submitCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Submitted (PENDING_APPROVAL)
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/activate:
    post:
      tags: [Campaigns]
      summary: Activate after four-eyes approval (approver != creator)
      description: >-
        The approver is the authenticated caller, not a request field. It used to arrive in the
        body, which made the maker/checker check compare a stored value against a string the same
        caller supplied — one operator could create a campaign and activate it by sending any other
        name (#3051). Taking it from the token makes `approver != createdBy` a comparison the caller
        does not control both sides of.
      operationId: activateCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: false
        description: >-
          Accepted and ignored, kept only so existing callers do not break. `approver` is no longer
          read from here.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Activated
        '409':
          description: Invalid state transition or maker/checker violation
  /api/v1/campaigns/{id}/pause:
    post:
      tags: [Campaigns]
      summary: Pause an active campaign
      operationId: pauseCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Paused
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/resume:
    post:
      tags: [Campaigns]
      summary: Resume a paused campaign
      operationId: resumeCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Resumed
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/close:
    post:
      tags: [Campaigns]
      summary: Close a campaign (terminal)
      operationId: closeCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Closed
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/enrol:
    post:
      tags: [Campaigns]
      summary: Enrol the segment membership (starts one journey per party)
      operationId: enrolCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: >-
            What the call actually did. A party whose journey could not be started is counted in
            `failed` rather than aborting the remaining parties, so `enrolled` alone can no longer
            be mistaken for the size of the segment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled:
                    type: integer
                    description: Journeys started, each with its enrolment row committed.
                  failed:
                    type: integer
                    description: >-
                      Parties whose journey start or enrolment write threw. Nothing is persisted
                      for them, so a later `enrol` retries them.
        '409':
          description: Campaign not ACTIVE
  /api/v1/campaigns/{id}/enrolments:
    get:
      tags: [Campaigns]
      summary: List enrolments of a campaign
      operationId: listEnrolments
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrolment'

  /api/v1/campaigns/{id}/experiment:
    get:
      tags: [Campaigns]
      summary: Compare treatment and no-contact holdout outcomes
      description: >-
        A descriptive cohort comparison for a campaign explicitly configured with a holdout. The
        observed lift is a percentage-point difference. The response also supplies a conservative
        readiness signal built from 95% Wilson intervals; it never changes a campaign and is not a
        claim of causality.
      operationId: campaignExperiment
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Cohort assignment and observed conversion outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignExperimentSummary'
        '404':
          description: Campaign not found
        '409':
          description: Campaign has no holdout experiment configured

  /api/v1/campaigns/{id}/content-experiment:
    get:
      tags: [Campaigns]
      summary: Compare two assigned message-content variants
      description: >-
        A durable 50/50 A/B assignment for campaigns that declare alternate B values on every
        step. Outcomes are conversion-rule events, not inferred opens or clicks. The response is
        a conservative measurement aid; it never selects a winner or changes a live campaign.
      operationId: campaignContentExperiment
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Variant assignment and observed conversion outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignContentExperimentSummary'
        '404':
          description: Campaign not found
        '409':
          description: Campaign has no measured A/B content experiment configured

  /api/v1/campaigns/{id}/journey:
    get:
      tags: [Campaigns]
      summary: Per-step funnel — who each step reached, and where the rest went
      description: >-
        Every number is a SQL aggregate over the send log, grouped by (step, outcome). A funnel is
        read as the whole picture by definition, so one folded from a page of records would
        understate every campaign larger than that page while looking exactly as authoritative.
      operationId: campaignJourney
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: One entry per journey step, ordered by step
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepFunnel'

  /api/v1/campaigns/{id}/engagement:
    get:
      tags: [Campaigns]
      summary: Attributable in-app attention by campaign step and surface
      description: >-
        Aggregate event observations from an opaque, server-validated campaign interaction
        reference. These are not people and are never product conversion: one person can create
        several impressions, clicks or dismissals. Organic and unknown app content is excluded
        rather than guessed into this funnel; an empty response therefore means no attributable
        event has arrived, not that exposure was proven to be zero.
      operationId: campaignEngagement
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Aggregate attributable app engagement, ordered by step and surface
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignEngagementMetric'

  /api/v1/campaigns/{id}/sends/summary:
    get:
      tags: [Campaigns]
      summary: Counts per outcome for the whole campaign
      description: >-
        Counted in SQL, not derived from a page. A "suppressed" headline computed from the rows
        currently on screen says "2 suppressed" while a campaign is suppressing thousands — and
        that is the number an operator acts on. Paging a list is safe; paging a total is not.
      operationId: sendSummary
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Count per outcome, keyed by outcome name
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int64 }

  /api/v1/campaigns/{id}/sends:
    get:
      tags: [Campaigns]
      summary: Send log of a campaign — what happened per party per step, newest first
      description: >-
        Includes suppressed attempts. `outcome` is the only place a suppression is visible: an
        enrolment looks identical whether the party was contacted or deliberately skipped
        (consent withdrawn, frequency cap, quiet hours — ADR-0200 D6).
        Party identifiers only; no contact details.
      operationId: listSends
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: outcome
          in: query
          required: false
          description: >-
            Filter to one outcome. An unrecognised value is a 400, never an unfiltered page —
            answering a filter the caller did not ask for with every row reads as
            "no suppressions here".
          schema:
            type: string
            enum:
              [SENT, DRY_RUN, FAILED, SUPPRESSED_CONSENT, SUPPRESSED_CAP, SUPPRESSED_QUIET_HOURS,
               SUPPRESSED_LIST, SKIPPED_CONDITION, CONVERTED]
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          description: Clamped to 1..200. A caller-supplied page size is a caller-supplied amount of work.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: >-
            One page of send records. The body stays an array; the page metadata travels in headers
            so that adding pagination is an additive change rather than a new response type.
          headers:
            X-Total-Count:
              description: >-
                Rows matching the same filter. Without it a client cannot tell "this is everything"
                from "this is the first page of many" — they render identically and mean opposite
                things to whoever is judging whether a campaign reached its audience.
              schema: { type: integer, format: int64 }
            X-Page:
              schema: { type: integer }
            X-Page-Size:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SendRecord'
        '400':
          description: Unrecognised `outcome`

  /api/v1/audiences:
    get:
      tags: [Audiences]
      summary: List governed audience versions, including drafts awaiting approval
      operationId: listAudiences
      responses:
        '200':
          description: Audience versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AudienceSummary' }
    post:
      tags: [Audiences]
      summary: Create a typed audience draft
      operationId: createAudience
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAudienceRequest' }
      responses:
        '201':
          description: Draft audience
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Audience' }
        '400': { description: Invalid or unsupported closed rule }

  /api/v1/audiences/{name}/{version}/submit:
    post:
      tags: [Audiences]
      summary: Submit the maker's draft for independent approval
      operationId: submitAudience
      parameters:
        - $ref: '#/components/parameters/AudienceName'
        - $ref: '#/components/parameters/AudienceVersion'
      responses:
        '200': { description: Audience submitted }
        '404': { description: Unknown audience version }
        '409': { description: Lifecycle or maker constraint rejected the submission }

  /api/v1/audiences/{name}/{version}/approve:
    post:
      tags: [Audiences]
      summary: Independently approve an immutable audience version
      operationId: approveAudience
      parameters:
        - $ref: '#/components/parameters/AudienceName'
        - $ref: '#/components/parameters/AudienceVersion'
      responses:
        '200': { description: Audience approved and targetable by campaigns }
        '404': { description: Unknown audience version }
        '409': { description: Lifecycle or maker/checker constraint rejected approval }

  /api/v1/audiences/{name}/{version}/preview:
    get:
      tags: [Audiences]
      summary: Preview a draft or approved audience with the production evaluator
      operationId: previewAudience
      parameters:
        - $ref: '#/components/parameters/AudienceName'
        - $ref: '#/components/parameters/AudienceVersion'
      responses:
        '200':
          description: Cohort size at a point in time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceReach' }
        '404': { description: Unknown audience version }

  /api/v1/segments:
    get:
      tags: [Segments]
      summary: The segment catalogue — every targetable segment and what it selects
      description: >-
        Read-only by design. ADR-0201 D1 makes a segment a versioned artifact defined in code;
        a new segment is a pull request, not a UI action ("no free-form SQL from a UI").
      operationId: listSegments
      responses:
        '200':
          description: Segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentSummary'

  /api/v1/segments/{name}/{version}/preview:
    get:
      tags: [Segments]
      summary: How many parties this segment currently matches
      description: >-
        Runs the same evaluation enrolment runs, so a preview can differ from the send only by time.
        `asOf` carries that: ADR-0201 D1 requires the previewed cohort and the sent-to cohort to be
        the same set or provably a different version.
      operationId: previewSegment
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cohort size at a point in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentPreview'
        '404':
          description: No such segment version

components:
  parameters:
    AudienceName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    AudienceVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OutcomeCount:
      type: object
      required: [outcome, count]
      properties:
        outcome: { type: string, description: A SendOutcome value. }
        count: { type: integer, format: int64 }
    CampaignSummary:
      type: object
      required: [campaignId, state, enrolled, outcomes, sent, suppressed, failed]
      properties:
        campaignId: { type: string, format: uuid }
        state: { type: string }
        enrolled:
          type: integer
          format: int64
          description: >-
            0 when nobody is enrolled yet — never null. "not enrolled" and "unknown" render the
            same in a table and mean different things to whoever is judging the campaign.
        outcomes:
          type: array
          description: Every outcome that actually occurred, suppressions included.
          items: { $ref: '#/components/schemas/OutcomeCount' }
        sent: { type: integer, format: int64 }
        suppressed:
          type: integer
          format: int64
          description: Sum of the ADR-0200 D6 suppression outcomes (cap, quiet hours, consent).
        failed: { type: integer, format: int64 }
    CampaignPlan:
      type: object
      required: [campaignId, name, state, entry]
      properties:
        campaignId: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, enum: [DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, CLOSED] }
        entry: { type: string, enum: [SCHEDULED, EVENT, MANUAL] }
        cadence: { type: string, nullable: true }
        cadenceHumanForm: { type: string, nullable: true }
        zone: { type: string, nullable: true, example: Europe/Prague }
        nextScheduledWindowAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Next declared schedule window only for an ACTIVE scheduled campaign. Null is explicit
            for inactive, expired, event-driven and manual entries; it is never a zero timestamp.
        endAt: { type: string, format: date-time, nullable: true }
        trigger: { type: string, nullable: true }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string }
        segmentRef:
          $ref: '#/components/schemas/SegmentRef'
        referralProgramRef:
          $ref: '#/components/schemas/ReferralProgramRef'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CampaignStep'
        decisions:
          type: array
          maxItems: 3
          description: >-
            Reviewed explicit delivery graph for this campaign. Empty or absent means the historic
            linear journey. Every reference is the persisted CampaignStep order; clients that
            renumber their editor cards must translate references with the actual stored order.
          items:
            $ref: '#/components/schemas/CampaignDecision'
        stopCondition:
          $ref: '#/components/schemas/StopCondition'
        schedule:
          $ref: '#/components/schemas/CampaignSchedule'
        trigger:
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
          nullable: true
          description: >-
            Optional product event that enrols a party the moment it happens (1.15.0), instead of
            waiting for the next manual enrol or scheduled sweep. A TriggerCatalog key, never a
            topic name or a filter expression — an uncatalogued value is rejected with 400, since a
            campaign waiting on a stream nobody publishes would look event-driven and wait forever.
            The trigger decides WHEN; the campaign's segment still decides WHO, so an event only
            enrols a party the segment currently contains. Absent means no event enrolment.
        conversionRule:
          description: >-
            Optional conversion rule (ADR-0245, added 1.13.0). A key from the service's own
            ConversionCatalog, never a query and never free text: the rule's topic, accepted event
            types and attribution window live in domain code, so a definition is reviewed and
            diffable. Absent means the campaign measures no conversion — which is different from,
            and must never be rendered as, a campaign that converted nobody. Deliberately NOT an
            open, click or impression: no such signal exists in the platform and none will be added
            (ADR-0245 D5).
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
        holdoutPercent:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
          description: >-
            Percentage of the audience assigned deterministically to the durable no-contact
            control cohort. A non-zero value requires conversionRule; zero retains the campaign's
            historical all-treatment behaviour.
        incentiveOfferRef:
          $ref: '#/components/schemas/IncentiveOfferRef'
        state:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, CLOSED]
        createdBy: { type: string }
        approvedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SegmentRef:
      type: object
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
    IncentiveOfferRef:
      type: object
      required: [id, name, version]
      description: >-
        Exact published incentive revision selected during authoring. Campaign-service stores this
        immutable reference only; incentive-service exclusively owns reservation, redemption and
        reward value mutation.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
    CampaignStep:
      type: object
      properties:
        order: { type: integer, minimum: 0 }
        template: { type: string, description: notification-service catalogue template id }
        channel:
          type: string
          # PUSH added in 1.8.0. SMS and IN_APP are deliberately absent: SMS has no outbound port
          # in the platform, and IN_APP was removed from notification-service's channel enum by
          # #2372 because its dispatch branch dropped every message silently.
          #
          # Selectable on create since 1.11.0. Until then the create body had no channel field at
          # all and the resource hardcoded EMAIL, so PUSH was documented here and unreachable.
          enum: [EMAIL, PUSH, BANNER]
          default: EMAIL
          description: >-
            Optional on create; absent means EMAIL. Must agree with the template's own channel —
            MARKETING_PRODUCT_OFFER renders on EMAIL, MARKETING_PRODUCT_OFFER_PUSH on PUSH and
            MARKETING_PRODUCT_OFFER_BANNER, MARKETING_PRODUCT_OFFER_CAROUSEL,
            MARKETING_PRODUCT_OFFER_STORY, MARKETING_PRODUCT_OFFER_PRODUCT_FEED and
            MARKETING_PRODUCT_OFFER_REWARDS_HUB on BANNER — and a
            mismatch is rejected with 400.
        variables:
          type: object
          additionalProperties: { type: string }
        variantBVariables:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >-
            Alternative declared template values for the B arm. Its presence turns the entire
            campaign into a two-arm experiment, so every step must provide it and conversionRule
            is required. `variables` remains the A arm. Assignment is persisted at enrolment and
            neither an activity retry nor a later code change can switch a person between arms.
        variantBTemplate:
          type: string
          nullable: true
          description: >-
            Optional B-arm template for a path experiment. When supplied, variantBChannel is also
            required and its catalogue channel must match. Absent preserves a copy-only experiment.
        variantBChannel:
          type: string
          nullable: true
          enum: [EMAIL, PUSH, BANNER]
          description: >-
            Optional B-arm delivery channel. A customer remains durably assigned to A or B before
            the journey starts; retries reuse that treatment rather than running a new random split.
        variantBDelaySeconds:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Optional B-arm wait before this step. Absent uses delaySeconds, making an existing
            content experiment backwards compatible while allowing timing-path experiments.
        fallbackToPush:
          type: boolean
          default: false
          description: >-
            Available only for an EMAIL offer with a catalogue-defined safe PUSH counterpart. When
            EMAIL marketing consent is absent, the service re-evaluates the entire contact-policy
            gate for PUSH consent and sends that reduced, lock-screen-safe title only if allowed.
            It never bypasses quiet hours, frequency caps, suppression lists or a gate outage, and
            it does not attempt a second send after an asynchronous delivery failure.
        mobileDestination:
          type: string
          nullable: true
          enum: [HOME, SAVINGS, CARDS, PAYMENTS, PRODUCT_HUB]
          description: >-
            Bank-owned destination opened after a PUSH or BANNER tap. This is a closed app-route contract,
            never an author-entered URL; absent preserves existing campaigns. It is valid on a
            PUSH or BANNER step, or on an EMAIL step only when its consent-missing fallback is PUSH.
        inAppSurface:
          type: string
          nullable: true
          enum: [HOME_BANNER, HOME_CAROUSEL, STORIES, PRODUCT_FEED, REWARDS_HUB]
          description: >-
            Closed authenticated-app inventory for a BANNER step. Absent retains HOME_BANNER for
            backwards-compatible placements. Each surface has its own reviewed template shape;
            the service rejects a BANNER template that does not match this value.
        delaySeconds: { type: integer, minimum: 0 }
        condition:
          description: >-
            Optional branch condition (ADR-0200 D1, added 1.10.0). The journey evaluates it after
            the step's delay and immediately before the send, against the delivery status of this
            party's most recent send at a lower step order. If it does not hold the step is
            SKIPPED and the journey continues to the next step — it does not end. Absent means the
            step always runs. `CONFIRMED` is delivery as reported by notification-service
            (ADR-0239 D3), never "opened" or "converted": no such signal exists in the platform,
            so no condition names one. A step with no earlier send has no observable predecessor,
            so IF_PREVIOUS_CONFIRMED does not hold and IF_PREVIOUS_NOT_CONFIRMED does.
          type: string
          enum: [IF_PREVIOUS_CONFIRMED, IF_PREVIOUS_NOT_CONFIRMED]
        conditionSourceOrder:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Optional explicit earlier step whose delivery status the condition reads. Both arms of
            a decision use the same source, so a skipped arm cannot become the other arm's input.
            Absent preserves the historical most-recent-earlier-step behaviour.
        nextStepOrder:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            The explicit forward edge from this delivery step when the campaign uses decision
            nodes. Null means this path ends. It is ignored by historic linear campaigns and may
            not be set on a decision source.
    CampaignDecision:
      type: object
      required: [sourceStepOrder, confirmedStepOrder, notConfirmedStepOrder]
      description: >-
        A bounded yes/no delivery decision. It reads only notification-service's durable delivery
        state after the optional evaluation wait: CONFIRMED selects confirmedStepOrder; every other
        observable state (including PENDING) selects notConfirmedStepOrder. It never claims an
        open, click or conversion signal.
      properties:
        sourceStepOrder: { type: integer, minimum: 0 }
        evaluationDelaySeconds: { type: integer, minimum: 0, default: 0 }
        confirmedStepOrder: { type: integer, minimum: 0 }
        notConfirmedStepOrder: { type: integer, minimum: 0 }
    CreateCampaignRequest:
      type: object
      required: [name, goal, segmentName, segmentVersion, steps]
      properties:
        name: { type: string }
        goal: { type: string }
        segmentName: { type: string }
        segmentVersion: { type: integer, minimum: 1 }
        referralProgramId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional published MGM programme identity. Campaign-service resolves the programme
            live and pins its server-owned id, name and version; callers cannot supply or override
            reward rules. Unknown and unpublished ids are rejected with 409.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CampaignStep'
        decisions:
          type: array
          maxItems: 3
          description: >-
            Optional explicit delivery graph. When present it cannot be mixed with legacy
            condition/conditionSourceOrder steps; all edges must be forward and every step must
            be reachable from the first ordered step.
          items:
            $ref: '#/components/schemas/CampaignDecision'
        stopCondition:
          $ref: '#/components/schemas/StopCondition'
        schedule:
          $ref: '#/components/schemas/CampaignSchedule'
        trigger:
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
          nullable: true
          description: >-
            Optional product event that enrols a party the moment it happens (1.15.0), instead of
            waiting for the next manual enrol or scheduled sweep. A TriggerCatalog key, never a
            topic name or a filter expression — an uncatalogued value is rejected with 400, since a
            campaign waiting on a stream nobody publishes would look event-driven and wait forever.
            The trigger decides WHEN; the campaign's segment still decides WHO, so an event only
            enrols a party the segment currently contains. Absent means no event enrolment.
        conversionRule:
          description: >-
            Optional conversion rule (ADR-0245, added 1.13.0). A key from the service's own
            ConversionCatalog, never a query and never free text: the rule's topic, accepted event
            types and attribution window live in domain code, so a definition is reviewed and
            diffable. Absent means the campaign measures no conversion — which is different from,
            and must never be rendered as, a campaign that converted nobody. Deliberately NOT an
            open, click or impression: no such signal exists in the platform and none will be added
            (ADR-0245 D5).
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
        holdoutPercent:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
          description: >-
            Percentage assigned to a no-contact control cohort. Requires conversionRule so an
            author cannot withhold a message from people without a measurable outcome.
        incentiveOfferRef:
          $ref: '#/components/schemas/IncentiveOfferRef'
    CampaignSchedule:
      type: object
      required: [cadence]
      description: >-
        Recurring enrolment (1.14.0). Each run re-evaluates the segment and enrols whoever newly
        qualifies; parties already enrolled are skipped, which is what makes re-running safe. The
        schedule is stored on the draft and only becomes a live Temporal schedule at activation, so
        a campaign cannot enrol anyone before four-eyes has passed. Pausing the campaign pauses it;
        closing deletes it. Absent means one-shot — enrolment happens only on POST /{id}/enrol.
      properties:
        cadence:
          type: string
          description: >-
            A key from the served catalogue, never a cron expression. GET /api/v1/campaigns/cadences
            lists the accepted values with the sentence an operator approves and the zone they are
            evaluated in. A cron string is rejected with 400 — a malformed one is a schedule that
            silently never fires, and the expression plus its zone belong in reviewed code rather
            than in a request body.
          example: WEEKLY_MONDAY_MORNING
        endAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the schedule stops firing, inclusive. Null runs until the campaign is paused or
            closed.
    ReferralProgramRef:
      type: object
      required: [id, name, version]
      description: >-
        Immutable server-resolved MGM programme version attached to this campaign. Its reward,
        attribution and anti-abuse rules remain owned by referral-service and are not copied here.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1 }
    StopCondition:
      type: object
      required: [maxSendsPerParty]
      description: >-
        Optional journey stop condition (ADR-0200 D1). The workflow evaluates it before every
        step against the party's lifetime SENT count in this campaign (send log); reaching the
        cap ends the journey as STOPPED_MAX_SENDS. Absent means the journey runs every step.
      properties:
        maxSendsPerParty: { type: integer, minimum: 1 }
    CampaignContactGuardrails:
      type: object
      required: [maxSendsPerParty, sendWindowHours, quietHoursStart, quietHoursEnd, timeZone]
      description: >-
        Platform-wide rules currently applied to every e-mail or push handoff. They are observable
        to explain a launch, never author-editable. Consent and party-specific counts remain live
        checks at delivery, so this object never claims how many people will receive a campaign.
      properties:
        maxSendsPerParty: { type: integer, minimum: 1, example: 2 }
        sendWindowHours: { type: integer, minimum: 1, example: 168 }
        quietHoursStart: { type: integer, minimum: 0, maximum: 23, example: 21 }
        quietHoursEnd: { type: integer, minimum: 0, maximum: 23, example: 8 }
        timeZone: { type: string, example: Europe/Prague }
    ApprovalRequest:
      type: object
      deprecated: true
      description: >-
        Ignored. The approver is taken from the authenticated caller; this schema remains only so a
        client that still sends it keeps working. Nothing in it is read.
      properties:
        approver:
          type: string
          deprecated: true

    CohortOutcome:
      type: object
      required: [assigned, converted, conversionRate]
      properties:
        assigned: { type: integer, format: int64 }
        converted: { type: integer, format: int64 }
        conversionRate:
          type: number
          format: double
          nullable: true
          description: Null until at least one party belongs to this cohort.

    CampaignExperimentSummary:
      type: object
      required: [campaignId, holdoutPercent, treatment, holdout, observedLiftPercentagePoints, decision]
      properties:
        campaignId: { type: string, format: uuid }
        holdoutPercent: { type: integer, minimum: 1, maximum: 50 }
        treatment: { $ref: '#/components/schemas/CohortOutcome' }
        holdout: { $ref: '#/components/schemas/CohortOutcome' }
        observedLiftPercentagePoints:
          type: number
          format: double
          nullable: true
          description: >-
            Treatment conversion rate minus holdout conversion rate, in percentage points. This
            is descriptive and is not a statistical-significance verdict.
        decision: { $ref: '#/components/schemas/ExperimentDecision' }

    CampaignContentExperimentSummary:
      type: object
      required: [campaignId, a, b, observedLiftPercentagePoints, decision]
      properties:
        campaignId: { type: string, format: uuid }
        a: { $ref: '#/components/schemas/CohortOutcome' }
        b: { $ref: '#/components/schemas/CohortOutcome' }
        observedLiftPercentagePoints:
          type: number
          format: double
          nullable: true
          description: B conversion rate minus A conversion rate, in percentage points.
        decision: { $ref: '#/components/schemas/ContentExperimentDecision' }

    RateConfidenceInterval:
      type: object
      required: [lower, upper]
      description: A 95% Wilson confidence interval for an observed conversion rate.
      properties:
        lower: { type: number, format: double, minimum: 0, maximum: 1 }
        upper: { type: number, format: double, minimum: 0, maximum: 1 }

    ExperimentDecision:
      type: object
      required: [state, minimumAssignedPerCohort, treatmentConfidenceInterval, holdoutConfidenceInterval]
      description: >-
        Conservative decision readiness only. It does not modify a campaign. A separating state
        needs at least the configured minimum in both cohorts and non-overlapping 95% Wilson
        intervals; it is not a causal-effect claim.
      properties:
        state:
          type: string
          enum: [COLLECTING_DATA, INCONCLUSIVE, TREATMENT_OUTPERFORMS_HOLDOUT, HOLDOUT_OUTPERFORMS_TREATMENT]
        minimumAssignedPerCohort: { type: integer, minimum: 1 }
        treatmentConfidenceInterval:
          allOf: [{ $ref: '#/components/schemas/RateConfidenceInterval' }]
          nullable: true
        holdoutConfidenceInterval:
          allOf: [{ $ref: '#/components/schemas/RateConfidenceInterval' }]
          nullable: true

    ContentExperimentDecision:
      type: object
      required: [state, minimumAssignedPerVariant, aConfidenceInterval, bConfidenceInterval]
      description: >-
        Conservative decision readiness only. Non-overlapping 95% Wilson intervals with the
        minimum sample in each arm are necessary before a result is shown; no automatic action is
        taken and the result is not a causal-effect claim.
      properties:
        state:
          type: string
          enum: [COLLECTING_DATA, INCONCLUSIVE, A_OUTPERFORMS_B, B_OUTPERFORMS_A]
        minimumAssignedPerVariant: { type: integer, minimum: 1 }
        aConfidenceInterval:
          allOf: [{ $ref: '#/components/schemas/RateConfidenceInterval' }]
          nullable: true
        bConfidenceInterval:
          allOf: [{ $ref: '#/components/schemas/RateConfidenceInterval' }]
          nullable: true

    StepFunnel:
      type: object
      properties:
        stepOrder: { type: integer }
        reached:
          type: integer
          format: int64
          description: Sends this step recorded at all — delivered plus every suppression.
        delivered: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        skipped:
          type: integer
          format: int64
          description: >-
            Parties for whom this conditional step did not run because its reviewed delivery
            predicate did not hold. They are not failures or suppressions; they continued through
            the complementary path.
        suppressed:
          type: array
          description: >-
            One entry per reason that produced at least one suppression, in the order ADR-0200 D6
            evaluates them (cap, quiet hours, consent). A reason with no occurrences is omitted
            rather than sent as zero, so a client cannot render an empty bar segment.
          items:
            $ref: '#/components/schemas/SuppressionCount'

    CampaignEngagementMetric:
      type: object
      required: [stepOrder, channel, surface, type, count]
      description: >-
        An aggregate count of app observations, never customer identities, unique people or
        product conversions. It is deduplicated by the source event id against Kafka redelivery.
      properties:
        stepOrder: { type: integer, minimum: 0 }
        channel:
          type: string
          enum: [PUSH, BANNER]
        surface:
          type: string
          enum: [HOME_BANNER, HOME_CAROUSEL, STORIES, PRODUCT_FEED, REWARDS_HUB]
        type:
          type: string
          enum: [IMPRESSION, CLICK, DISMISS]
        count: { type: integer, format: int64, minimum: 0 }

    SuppressionCount:
      type: object
      properties:
        reason:
          type: string
          enum: [SUPPRESSED_CAP, SUPPRESSED_QUIET_HOURS, SUPPRESSED_CONSENT]
        count: { type: integer, format: int64 }

    SegmentSummary:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        rules:
          type: array
          items: { type: string }
          description: What the segment selects, in words.

    AudienceSummary:
      type: object
      required: [name, version, rules, state, createdBy]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        rules:
          type: array
          items: { type: string }
        state: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED] }
        createdBy: { type: string }
        approvedBy: { type: [string, 'null'] }

    Audience:
      allOf:
        - $ref: '#/components/schemas/AudienceSummary'

    AudienceReach:
      type: object
      required: [name, version, size, asOf]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }

    CreateAudienceRequest:
      type: object
      required: [name, rules]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
        rules:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AudienceRule' }

    AudienceRule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [PARTY_STATUS_IS, TENURE_AT_LEAST_DAYS] }
        status: { type: string }
        minDays: { type: integer, minimum: 0 }

    SegmentPreview:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        size: { type: integer, description: Parties matched at asOf. }
        asOf: { type: string, format: date-time }


    SendRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        stepOrder: { type: integer }
        outcome:
          description: >-
            What THIS service decided and observed: the handoff. `SENT` means notification-service
            accepted the request onto its topic — never that the customer received anything. Use
            `deliveryStatus` for that (ADR-0239 D3, issue #3663).
          type: string
          enum:
            - SENT
            - DRY_RUN
            - SUPPRESSED_CAP
            - SUPPRESSED_QUIET_HOURS
            - SUPPRESSED_CONSENT
            # Present in SendOutcome since ADR-0219 and missing from this enum until now — the
            # spec understated the values a client could receive (corrected in 1.9.0).
            - SUPPRESSED_LIST
            # The step's branch condition did not hold, so nothing was attempted (1.10.0, #3585).
            # Not a suppression: no policy denied anything.
            - SKIPPED_CONDITION
            - FAILED
        occurredAt: { type: string, format: date-time }
        deliveryStatus:
          description: >-
            What notification-service reported back about the message (ADR-0239 D3). `PENDING` means
            no outcome has arrived — the honest resting state, and NOT on its own evidence of a
            problem: a send made moments ago has not had time to be reported, and a gate-denied send
            was never handed off at all, so it stays `PENDING` forever. Added in 1.9.0; absent on a
            response from an older deployment.
          type: string
          enum: [PENDING, CONFIRMED, SUPPRESSED, FAILED]
          default: PENDING
        deliveryReason:
          description: >-
            The reported cause, verbatim (e.g. `no_active_consent`, `no_deliverable_recipient`).
            Open-ended and additive by contract — do not switch exhaustively on it. Null while
            `deliveryStatus` is `PENDING` or when the outcome carried no reason.
          type: [string, 'null']
        deliveryUpdatedAt:
          description: When `deliveryStatus` last moved. Null while it has never moved off `PENDING`.
          type: [string, 'null']
          format: date-time
        channel:
          description: >-
            Actual request medium. It is PUSH only when a configured EMAIL step lacked email
            consent and the separate PUSH gate allowed its safe fallback; null for historical and
            non-send decision rows.
          type: [string, 'null']
          enum: [EMAIL, PUSH, BANNER, null]

    Enrolment:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        state:
          type: string
          enum:
            - ACTIVE
            - COMPLETED
            - TERMINATED_CONSENT_REVOKED
            - TERMINATED_CAMPAIGN_CLOSED
            - COMPLETED_GOAL_REACHED
            - TERMINATED_SUPPRESSED
            - STOPPED_MAX_SENDS
            - HOLDOUT
        currentStep: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        experimentCohort:
          type: string
          enum: [TREATMENT, HOLDOUT]
        contentVariant:
          type: string
          nullable: true
          enum: [A, B]
          description: >-
            Durable A/B content arm, null when the campaign has one message or this enrolment is
            a no-contact holdout.
