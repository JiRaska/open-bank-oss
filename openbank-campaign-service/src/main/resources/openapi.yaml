openapi: 3.1.0
info:
  title: Campaign Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048).
  version: 1.15.0
  description: >-
    Campaign management first slice (ADR-0200 / ADR-0209 D3): deterministic, versioned segments;
    per-enrolment Temporal journeys; consent-gated delivery through notification-service.
    Activation is four-eyes (`campaign.activate`, rules.yaml four_eyes.actions) with a domain
    maker/checker invariant.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8128
    description: Local development
tags:
  - name: Campaigns

paths:
  /api/v1/campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      operationId: listCampaigns
      responses:
        '200':
          description: All campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
    post:
      tags: [Campaigns]
      summary: Create a campaign draft
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
  /api/v1/campaigns/summary:
    get:
      tags: [Campaigns]
      operationId: campaignSummary
      summary: Reach and delivery for every campaign
      description: >-
        The campaign list returns records only, so a console had no way to show whether anything
        reached anyone without one request per campaign — an N+1 against a scale-to-zero service
        (issue #3296). Answered here in three grouped queries. Suppression counts are carried
        through rather than folded away: "2 sent" and "2 sent, 40 suppressed for consent" are
        different campaigns, and only the second explains why reach was low.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: One entry per campaign
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignSummary' }
  /api/v1/campaigns/cadences:
    get:
      tags: [Campaigns]
      summary: Cadences a recurring campaign may be scheduled on
      operationId: listCadences
      description: >-
        The closed set of cadences, served so an authoring screen cannot offer one the service would
        reject. Adding an entry is a pull request against ScheduleCatalog.
        NOTE the literal path segment: it must keep matching ahead of /api/v1/campaigns/{id}.
      responses:
        '200':
          description: Every cadence, with its human form and the zone it is evaluated in
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cadence: { type: string, example: DAILY_MORNING }
                    humanForm: { type: string, example: every day at 09:00 }
                    zone:
                      type: string
                      example: Europe/Prague
                      description: >-
                        Never UTC. A cron evaluated in UTC reaches Czech customers an hour or two
                        off their morning, and the offset moves twice a year.
  /api/v1/campaigns/{id}:
    get:
      tags: [Campaigns]
      summary: Get a campaign
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          description: Not found
  /api/v1/campaigns/{id}/submit:
    post:
      tags: [Campaigns]
      summary: Submit a draft for four-eyes approval
      operationId: submitCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Submitted (PENDING_APPROVAL)
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/activate:
    post:
      tags: [Campaigns]
      summary: Activate after four-eyes approval (approver != creator)
      description: >-
        The approver is the authenticated caller, not a request field. It used to arrive in the
        body, which made the maker/checker check compare a stored value against a string the same
        caller supplied — one operator could create a campaign and activate it by sending any other
        name (#3051). Taking it from the token makes `approver != createdBy` a comparison the caller
        does not control both sides of.
      operationId: activateCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: false
        description: >-
          Accepted and ignored, kept only so existing callers do not break. `approver` is no longer
          read from here.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Activated
        '409':
          description: Invalid state transition or maker/checker violation
  /api/v1/campaigns/{id}/pause:
    post:
      tags: [Campaigns]
      summary: Pause an active campaign
      operationId: pauseCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Paused
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/resume:
    post:
      tags: [Campaigns]
      summary: Resume a paused campaign
      operationId: resumeCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Resumed
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/close:
    post:
      tags: [Campaigns]
      summary: Close a campaign (terminal)
      operationId: closeCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Closed
        '409':
          description: Invalid state transition
  /api/v1/campaigns/{id}/enrol:
    post:
      tags: [Campaigns]
      summary: Enrol the segment membership (starts one journey per party)
      operationId: enrolCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: >-
            What the call actually did. A party whose journey could not be started is counted in
            `failed` rather than aborting the remaining parties, so `enrolled` alone can no longer
            be mistaken for the size of the segment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled:
                    type: integer
                    description: Journeys started, each with its enrolment row committed.
                  failed:
                    type: integer
                    description: >-
                      Parties whose journey start or enrolment write threw. Nothing is persisted
                      for them, so a later `enrol` retries them.
        '409':
          description: Campaign not ACTIVE
  /api/v1/campaigns/{id}/enrolments:
    get:
      tags: [Campaigns]
      summary: List enrolments of a campaign
      operationId: listEnrolments
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrolment'

  /api/v1/campaigns/{id}/journey:
    get:
      tags: [Campaigns]
      summary: Per-step funnel — who each step reached, and where the rest went
      description: >-
        Every number is a SQL aggregate over the send log, grouped by (step, outcome). A funnel is
        read as the whole picture by definition, so one folded from a page of records would
        understate every campaign larger than that page while looking exactly as authoritative.
      operationId: campaignJourney
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: One entry per journey step, ordered by step
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepFunnel'

  /api/v1/campaigns/{id}/sends/summary:
    get:
      tags: [Campaigns]
      summary: Counts per outcome for the whole campaign
      description: >-
        Counted in SQL, not derived from a page. A "suppressed" headline computed from the rows
        currently on screen says "2 suppressed" while a campaign is suppressing thousands — and
        that is the number an operator acts on. Paging a list is safe; paging a total is not.
      operationId: sendSummary
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Count per outcome, keyed by outcome name
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int64 }

  /api/v1/campaigns/{id}/sends:
    get:
      tags: [Campaigns]
      summary: Send log of a campaign — what happened per party per step, newest first
      description: >-
        Includes suppressed attempts. `outcome` is the only place a suppression is visible: an
        enrolment looks identical whether the party was contacted or deliberately skipped
        (consent withdrawn, frequency cap, quiet hours — ADR-0200 D6).
        Party identifiers only; no contact details.
      operationId: listSends
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: outcome
          in: query
          required: false
          description: >-
            Filter to one outcome. An unrecognised value is a 400, never an unfiltered page —
            answering a filter the caller did not ask for with every row reads as
            "no suppressions here".
          schema:
            type: string
            enum:
              [SENT, DRY_RUN, FAILED, SUPPRESSED_CONSENT, SUPPRESSED_CAP, SUPPRESSED_QUIET_HOURS,
               SUPPRESSED_LIST, SKIPPED_CONDITION, CONVERTED]
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          description: Clamped to 1..200. A caller-supplied page size is a caller-supplied amount of work.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: >-
            One page of send records. The body stays an array; the page metadata travels in headers
            so that adding pagination is an additive change rather than a new response type.
          headers:
            X-Total-Count:
              description: >-
                Rows matching the same filter. Without it a client cannot tell "this is everything"
                from "this is the first page of many" — they render identically and mean opposite
                things to whoever is judging whether a campaign reached its audience.
              schema: { type: integer, format: int64 }
            X-Page:
              schema: { type: integer }
            X-Page-Size:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SendRecord'
        '400':
          description: Unrecognised `outcome`

  /api/v1/segments:
    get:
      tags: [Segments]
      summary: The segment catalogue — every targetable segment and what it selects
      description: >-
        Read-only by design. ADR-0201 D1 makes a segment a versioned artifact defined in code;
        a new segment is a pull request, not a UI action ("no free-form SQL from a UI").
      operationId: listSegments
      responses:
        '200':
          description: Segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentSummary'

  /api/v1/segments/{name}/{version}/preview:
    get:
      tags: [Segments]
      summary: How many parties this segment currently matches
      description: >-
        Runs the same evaluation enrolment runs, so a preview can differ from the send only by time.
        `asOf` carries that: ADR-0201 D1 requires the previewed cohort and the sent-to cohort to be
        the same set or provably a different version.
      operationId: previewSegment
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cohort size at a point in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentPreview'
        '404':
          description: No such segment version

components:
  parameters:
    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OutcomeCount:
      type: object
      required: [outcome, count]
      properties:
        outcome: { type: string, description: A SendOutcome value. }
        count: { type: integer, format: int64 }
    CampaignSummary:
      type: object
      required: [campaignId, state, enrolled, outcomes, sent, suppressed, failed]
      properties:
        campaignId: { type: string, format: uuid }
        state: { type: string }
        enrolled:
          type: integer
          format: int64
          description: >-
            0 when nobody is enrolled yet — never null. "not enrolled" and "unknown" render the
            same in a table and mean different things to whoever is judging the campaign.
        outcomes:
          type: array
          description: Every outcome that actually occurred, suppressions included.
          items: { $ref: '#/components/schemas/OutcomeCount' }
        sent: { type: integer, format: int64 }
        suppressed:
          type: integer
          format: int64
          description: Sum of the ADR-0200 D6 suppression outcomes (cap, quiet hours, consent).
        failed: { type: integer, format: int64 }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string }
        segmentRef:
          $ref: '#/components/schemas/SegmentRef'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CampaignStep'
        stopCondition:
          $ref: '#/components/schemas/StopCondition'
        schedule:
          $ref: '#/components/schemas/CampaignSchedule'
        trigger:
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
          nullable: true
          description: >-
            Optional product event that enrols a party the moment it happens (1.15.0), instead of
            waiting for the next manual enrol or scheduled sweep. A TriggerCatalog key, never a
            topic name or a filter expression — an uncatalogued value is rejected with 400, since a
            campaign waiting on a stream nobody publishes would look event-driven and wait forever.
            The trigger decides WHEN; the campaign's segment still decides WHO, so an event only
            enrols a party the segment currently contains. Absent means no event enrolment.
        conversionRule:
          description: >-
            Optional conversion rule (ADR-0245, added 1.13.0). A key from the service's own
            ConversionCatalog, never a query and never free text: the rule's topic, accepted event
            types and attribution window live in domain code, so a definition is reviewed and
            diffable. Absent means the campaign measures no conversion — which is different from,
            and must never be rendered as, a campaign that converted nobody. Deliberately NOT an
            open, click or impression: no such signal exists in the platform and none will be added
            (ADR-0245 D5).
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
        state:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, CLOSED]
        createdBy: { type: string }
        approvedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SegmentRef:
      type: object
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
    CampaignStep:
      type: object
      properties:
        order: { type: integer, minimum: 0 }
        template: { type: string, description: notification-service catalogue template id }
        channel:
          type: string
          # PUSH added in 1.8.0. SMS and IN_APP are deliberately absent: SMS has no outbound port
          # in the platform, and IN_APP was removed from notification-service's channel enum by
          # #2372 because its dispatch branch dropped every message silently.
          #
          # Selectable on create since 1.11.0. Until then the create body had no channel field at
          # all and the resource hardcoded EMAIL, so PUSH was documented here and unreachable.
          enum: [EMAIL, PUSH]
          default: EMAIL
          description: >-
            Optional on create; absent means EMAIL. Must agree with the template's own channel —
            MARKETING_PRODUCT_OFFER renders on EMAIL, MARKETING_PRODUCT_OFFER_PUSH on PUSH — and a
            mismatch is rejected with 400.
        variables:
          type: object
          additionalProperties: { type: string }
        delaySeconds: { type: integer, minimum: 0 }
        condition:
          description: >-
            Optional branch condition (ADR-0200 D1, added 1.10.0). The journey evaluates it after
            the step's delay and immediately before the send, against the delivery status of this
            party's most recent send at a lower step order. If it does not hold the step is
            SKIPPED and the journey continues to the next step — it does not end. Absent means the
            step always runs. `CONFIRMED` is delivery as reported by notification-service
            (ADR-0239 D3), never "opened" or "converted": no such signal exists in the platform,
            so no condition names one. A step with no earlier send has no observable predecessor,
            so IF_PREVIOUS_CONFIRMED does not hold and IF_PREVIOUS_NOT_CONFIRMED does.
          type: string
          enum: [IF_PREVIOUS_CONFIRMED, IF_PREVIOUS_NOT_CONFIRMED]
    CreateCampaignRequest:
      type: object
      required: [name, goal, segmentName, segmentVersion, steps]
      properties:
        name: { type: string }
        goal: { type: string }
        segmentName: { type: string }
        segmentVersion: { type: integer, minimum: 1 }
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CampaignStep'
        stopCondition:
          $ref: '#/components/schemas/StopCondition'
        schedule:
          $ref: '#/components/schemas/CampaignSchedule'
        trigger:
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
          nullable: true
          description: >-
            Optional product event that enrols a party the moment it happens (1.15.0), instead of
            waiting for the next manual enrol or scheduled sweep. A TriggerCatalog key, never a
            topic name or a filter expression — an uncatalogued value is rejected with 400, since a
            campaign waiting on a stream nobody publishes would look event-driven and wait forever.
            The trigger decides WHEN; the campaign's segment still decides WHO, so an event only
            enrols a party the segment currently contains. Absent means no event enrolment.
        conversionRule:
          description: >-
            Optional conversion rule (ADR-0245, added 1.13.0). A key from the service's own
            ConversionCatalog, never a query and never free text: the rule's topic, accepted event
            types and attribution window live in domain code, so a definition is reviewed and
            diffable. Absent means the campaign measures no conversion — which is different from,
            and must never be rendered as, a campaign that converted nobody. Deliberately NOT an
            open, click or impression: no such signal exists in the platform and none will be added
            (ADR-0245 D5).
          type: string
          enum: [ACCOUNT_OPENED, CARD_ISSUED]
    CampaignSchedule:
      type: object
      required: [cadence]
      description: >-
        Recurring enrolment (1.14.0). Each run re-evaluates the segment and enrols whoever newly
        qualifies; parties already enrolled are skipped, which is what makes re-running safe. The
        schedule is stored on the draft and only becomes a live Temporal schedule at activation, so
        a campaign cannot enrol anyone before four-eyes has passed. Pausing the campaign pauses it;
        closing deletes it. Absent means one-shot — enrolment happens only on POST /{id}/enrol.
      properties:
        cadence:
          type: string
          description: >-
            A key from the served catalogue, never a cron expression. GET /api/v1/campaigns/cadences
            lists the accepted values with the sentence an operator approves and the zone they are
            evaluated in. A cron string is rejected with 400 — a malformed one is a schedule that
            silently never fires, and the expression plus its zone belong in reviewed code rather
            than in a request body.
          example: WEEKLY_MONDAY_MORNING
        endAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the schedule stops firing, inclusive. Null runs until the campaign is paused or
            closed.
    StopCondition:
      type: object
      required: [maxSendsPerParty]
      description: >-
        Optional journey stop condition (ADR-0200 D1). The workflow evaluates it before every
        step against the party's lifetime SENT count in this campaign (send log); reaching the
        cap ends the journey as STOPPED_MAX_SENDS. Absent means the journey runs every step.
      properties:
        maxSendsPerParty: { type: integer, minimum: 1 }
    ApprovalRequest:
      type: object
      deprecated: true
      description: >-
        Ignored. The approver is taken from the authenticated caller; this schema remains only so a
        client that still sends it keeps working. Nothing in it is read.
      properties:
        approver:
          type: string
          deprecated: true

    StepFunnel:
      type: object
      properties:
        stepOrder: { type: integer }
        reached:
          type: integer
          format: int64
          description: Sends this step recorded at all — delivered plus every suppression.
        delivered: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        suppressed:
          type: array
          description: >-
            One entry per reason that produced at least one suppression, in the order ADR-0200 D6
            evaluates them (cap, quiet hours, consent). A reason with no occurrences is omitted
            rather than sent as zero, so a client cannot render an empty bar segment.
          items:
            $ref: '#/components/schemas/SuppressionCount'

    SuppressionCount:
      type: object
      properties:
        reason:
          type: string
          enum: [SUPPRESSED_CAP, SUPPRESSED_QUIET_HOURS, SUPPRESSED_CONSENT]
        count: { type: integer, format: int64 }

    SegmentSummary:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        rules:
          type: array
          items: { type: string }
          description: What the segment selects, in words.

    SegmentPreview:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        size: { type: integer, description: Parties matched at asOf. }
        asOf: { type: string, format: date-time }


    SendRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        stepOrder: { type: integer }
        outcome:
          description: >-
            What THIS service decided and observed: the handoff. `SENT` means notification-service
            accepted the request onto its topic — never that the customer received anything. Use
            `deliveryStatus` for that (ADR-0239 D3, issue #3663).
          type: string
          enum:
            - SENT
            - DRY_RUN
            - SUPPRESSED_CAP
            - SUPPRESSED_QUIET_HOURS
            - SUPPRESSED_CONSENT
            # Present in SendOutcome since ADR-0219 and missing from this enum until now — the
            # spec understated the values a client could receive (corrected in 1.9.0).
            - SUPPRESSED_LIST
            # The step's branch condition did not hold, so nothing was attempted (1.10.0, #3585).
            # Not a suppression: no policy denied anything.
            - SKIPPED_CONDITION
            - FAILED
        occurredAt: { type: string, format: date-time }
        deliveryStatus:
          description: >-
            What notification-service reported back about the message (ADR-0239 D3). `PENDING` means
            no outcome has arrived — the honest resting state, and NOT on its own evidence of a
            problem: a send made moments ago has not had time to be reported, and a gate-denied send
            was never handed off at all, so it stays `PENDING` forever. Added in 1.9.0; absent on a
            response from an older deployment.
          type: string
          enum: [PENDING, CONFIRMED, SUPPRESSED, FAILED]
          default: PENDING
        deliveryReason:
          description: >-
            The reported cause, verbatim (e.g. `no_active_consent`, `no_deliverable_recipient`).
            Open-ended and additive by contract — do not switch exhaustively on it. Null while
            `deliveryStatus` is `PENDING` or when the outcome carried no reason.
          type: [string, 'null']
        deliveryUpdatedAt:
          description: When `deliveryStatus` last moved. Null while it has never moved off `PENDING`.
          type: [string, 'null']
          format: date-time

    Enrolment:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        state:
          type: string
          enum: [ACTIVE, COMPLETED, TERMINATED_CONSENT_REVOKED, TERMINATED_SUPPRESSED]
        currentStep: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
