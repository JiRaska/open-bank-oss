quarkus:
  application:
    name: openbank-campaign-service
  http:
    port: 8128
    test-port: 0
  datasource:
    db-kind: postgresql
    reactive:
      url: postgresql://localhost:5432/openbank_campaigns
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_campaigns
    username: ${DB_USER:campaign}
    password: ${DB_PASSWORD:campaign}
  flyway:
    migrate-at-start: true
  hibernate-orm:
    # Flyway schema is snake_case (segment_name, created_by, approved_by, …) but the JPA
    # entities use camelCase fields with no @Column(name). Without this strategy
    # Hibernate's default physical naming lowercases the field as-is → `approvedby`, so
    # every read threw "column ce1_0.approvedby does not exist (42703)" and
    # GET /api/v1/campaigns was 500. Same fix, same reason, as fx-service.
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  # Backs the four-eyes approval store (libs' RedisApprovalStore, produced by
  # ApprovalConfig). Without it the ReactiveRedisDataSource bean is inactive and the
  # app cannot start — the deployed pod died with InactiveBeanException. Overridden
  # per environment via QUARKUS_REDIS_HOSTS.
  redis:
    hosts: redis://localhost:6379
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
  # Health probes and the Prometheus scrape live on the management interface, not the
  # application port — the Deployment probes /q/health/{live,ready} on 8085 and the
  # PodMonitor scrapes the same port. Without this block nothing listens there, so the
  # pod never goes ready and the liveness probe restarts it forever.
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  log:
    level: INFO

"%test":
  quarkus:
    # Tests bind a random application port (http.test-port: 0); the management
    # interface has no such randomisation, so leaving it on makes two concurrent
    # test JVMs fight over 8085.
    management:
      enabled: false

openbank:
  temporal:
    enabled: ${OPENBANK_TEMPORAL_ENABLED:false}
    server-url: ${OPENBANK_TEMPORAL_SERVER_URL:localhost:7233}
    namespace: ${OPENBANK_TEMPORAL_NAMESPACE:openbank}
    task-queue: ${OPENBANK_TEMPORAL_TASK_QUEUE:openbank-campaign}
  campaign:
    worker:
      enabled: ${CAMPAIGN_WORKER_ENABLED:true}
    # ADR-0200 D6: suppression defaults. Evaluated before consent, per party per window.
    max-sends-per-party-per-week: ${CAMPAIGN_MAX_SENDS_PER_WEEK:2}
    quiet-hours-start: ${CAMPAIGN_QUIET_HOURS_START:21}
    quiet-hours-end: ${CAMPAIGN_QUIET_HOURS_END:8}
    consent-grantee: party-service:marketing-comms
    marketing-scope: MARKETING_COMMS_EMAIL

consent-service:
  url: http://localhost:8106

analytics:
  clickhouse-url: ${CLICKHOUSE_URL:http://localhost:8123}
  clickhouse-user: ${CLICKHOUSE_USER:}
  clickhouse-password: ${CLICKHOUSE_PASSWORD:}
  clickhouse-database: ${CLICKHOUSE_DB:openbank_analytics}

mp:
  messaging:
    connector:
      smallrye-kafka:
        bootstrap:
          servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    outgoing:
      notification-requests-out:
        connector: smallrye-kafka
        topic: openbank.notification.requests
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      consent-events-in:
        connector: smallrye-kafka
        topic: openbank.consent.events
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto:
          offset:
            reset: earliest
