quarkus:
  application:
    name: openbank-campaign-service
  http:
    port: 8128
    test-port: 0
  datasource:
    db-kind: postgresql
    reactive:
      url: postgresql://localhost:5432/openbank_campaigns
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_campaigns
    username: ${DB_USER:campaign}
    password: ${DB_PASSWORD:campaign}
  flyway:
    migrate-at-start: true
  hibernate-orm:
    # Flyway schema is snake_case (segment_name, created_by, approved_by, …) but the JPA
    # entities use camelCase fields with no @Column(name). Without this strategy
    # Hibernate's default physical naming lowercases the field as-is → `approvedby`, so
    # every read threw "column ce1_0.approvedby does not exist (42703)" and
    # GET /api/v1/campaigns was 500. Same fix, same reason, as fx-service.
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  # Backs the four-eyes approval store (libs' RedisApprovalStore, produced by
  # ApprovalConfig). Without it the ReactiveRedisDataSource bean is inactive and the
  # app cannot start — the deployed pod died with InactiveBeanException. Overridden
  # per environment via QUARKUS_REDIS_HOSTS.
  redis:
    hosts: redis://localhost:6379
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
  # Health probes and the Prometheus scrape live on the management interface, not the
  # application port — the Deployment probes /q/health/{live,ready} on 8085 and the
  # PodMonitor scrapes the same port. Without this block nothing listens there, so the
  # pod never goes ready and the liveness probe restarts it forever.
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  log:
    level: INFO

"%test":
  quarkus:
    # Tests bind a random application port (http.test-port: 0); the management
    # interface has no such randomisation, so leaving it on makes two concurrent
    # test JVMs fight over 8085.
    management:
      enabled: false
    # No Keycloak in a test JVM. `tenant-enabled: false` and NOT `enabled: false`: turning the
    # extension off removes the JsonWebToken bean, and CampaignResource injects it in its
    # constructor, so the build fails in ArC before a test ever runs
    # ("Unsatisfied dependency for type org.eclipse.microprofile.jwt.JsonWebToken"). Disabling only
    # the tenant keeps the bean and skips the discovery call that would otherwise fail the whole
    # deployment with "OIDC Server is not available". consent-service can use `enabled: false`
    # because none of its resources inject the token.
    oidc:
      tenant-enabled: false
  # `authz.enforce` has no key in this file, so the interceptor's safe default (true) applies — and
  # with no PolicyDecisionPoint bean in a test JVM every @Authorize call fails closed before the
  # handler ever runs. Advisory HERE ONLY (note the %test nesting): CampaignRestContractIT is about
  # the HTTP contract — media types, headers, serialisation — not about who may call what. The
  # policy is covered by the OPA gate and the rego tests, neither of which needs the app running.
  authz:
    enforce: false


openbank:
  temporal:
    enabled: ${OPENBANK_TEMPORAL_ENABLED:false}
    server-url: ${OPENBANK_TEMPORAL_SERVER_URL:localhost:7233}
    namespace: ${OPENBANK_TEMPORAL_NAMESPACE:openbank}
    task-queue: ${OPENBANK_TEMPORAL_TASK_QUEUE:openbank-campaign}
  campaign:
    worker:
      enabled: ${CAMPAIGN_WORKER_ENABLED:true}
    # ADR-0200 D6: suppression defaults. Evaluated before consent, per party per window.
    max-sends-per-party-per-week: ${CAMPAIGN_MAX_SENDS_PER_WEEK:2}
    quiet-hours-start: ${CAMPAIGN_QUIET_HOURS_START:21}
    quiet-hours-end: ${CAMPAIGN_QUIET_HOURS_END:8}
    consent-grantee: party-service:marketing-comms
    marketing-scope: MARKETING_COMMS_EMAIL

consent-service:
  url: http://localhost:8106

analytics:
  clickhouse-url: ${CLICKHOUSE_URL:http://localhost:8123}
  clickhouse-user: ${CLICKHOUSE_USER:}
  clickhouse-password: ${CLICKHOUSE_PASSWORD:}
  clickhouse-database: ${CLICKHOUSE_DB:openbank_analytics}

mp:
  messaging:
    connector:
      smallrye-kafka:
        bootstrap:
          servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    outgoing:
      notification-requests-out:
        connector: smallrye-kafka
        topic: openbank.notification.requests
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # ADR-0239 D3: delivery outcomes for this service's own send requests, correlated by the
      # send-log row id. Its own consumer group, not the service-wide default one shared with
      # consent-events-in: two channels in one group makes both subscriptions one member set, so a
      # rebalance on either topic churns the other, and the two offsets can never be reset apart.
      notification-outcomes-in:
        connector: smallrye-kafka
        topic: openbank.notification.outcomes.v1
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group:
          id: openbank-campaign-service-notification-outcomes
        auto:
          offset:
            reset: earliest
      # ADR-0245 conversion sources. `latest`, not `earliest`, and deliberately: replaying months of
      # historical account and card events on first boot would attribute conversions to campaigns
      # that had not sent anything at the time. The attribution window in ConversionCatalog would
      # reject most of them, which is exactly the kind of correctness nobody should have to rely on.
      account-conversions-in:
        connector: smallrye-kafka
        topic: openbank.accounts.account.created
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group:
          id: openbank-campaign-service-account-conversions
        auto:
          offset:
            reset: latest
      card-conversions-in:
        connector: smallrye-kafka
        topic: openbank.cards.events
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group:
          id: openbank-campaign-service-card-conversions
        auto:
          offset:
            reset: latest
      # Enrolment triggers. SAME two topics as the *-conversions-in channels above, deliberately
      # on their own consumer groups: a conversion only appends a row, a trigger starts a journey
      # and can reach a customer, so their offsets and their lag must not be tied together.
      #
      # `reset: latest` is a safety property here, not a default worth copying casually. On
      # `earliest` the first deploy would replay the entire history of account openings and card
      # issuances and enrol every party who ever qualified — a mass send, from a config line.
      account-triggers-in:
        connector: smallrye-kafka
        topic: openbank.accounts.account.created
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group:
          id: openbank-campaign-service-account-triggers
        auto:
          offset:
            reset: latest
      card-triggers-in:
        connector: smallrye-kafka
        topic: openbank.cards.events
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group:
          id: openbank-campaign-service-card-triggers
        auto:
          offset:
            reset: latest
      consent-events-in:
        connector: smallrye-kafka
        topic: openbank.consent.events
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto:
          offset:
            reset: earliest
