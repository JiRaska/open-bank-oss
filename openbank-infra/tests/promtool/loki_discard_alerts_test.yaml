evaluation_interval: 1m
rule_files:
- prometheus-rules-log-ingestion.yaml
tests:
- name: a sustained 10% discard ratio fires after for 30m
  interval: 1m
  input_series:
  - series: loki_discarded_samples_total{reason="too_far_behind",tenant="fake",pod="loki-0"}
    values: 0+100x120
  - series: loki_distributor_lines_received_total{tenant="fake",pod="loki-0"}
    values: 0+1000x120
  alert_rule_test:
  - eval_time: 20m
    alertname: LokiLinesDiscardedHigh
    exp_alerts: []
  - eval_time: 90m
    alertname: LokiLinesDiscardedHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        team: platform
      exp_annotations:
        subject_period: continuous
        summary: "Loki is discarding 10% of received log lines"
        description: >-
          Over the last hour Loki refused more than 5% of the lines Alloy pushed. Read the
          reason first — `sum by (reason) (increase(loki_discarded_samples_total[1h]))` —
          then, for too_far_behind, the stream: `kubectl -n observability logs loki-0 -c loki
          | grep 'too far behind'` names it, and `topk(5, sum by (pod)
          (increase(loki_write_sent_entries_total[1h])))` names the Alloy instance pushing
          far more than its peers. One instance replaying old lines means it is tailing more
          than its own node (check the spec.nodeName selector in gitops/apps/alloy.yaml). A
          steady ratio with no outlier is a real out-of-order source or a rate/line-size
          limit and IS loss.
- name: a 4% ratio, under the 5% threshold, stays quiet
  interval: 1m
  input_series:
  - series: loki_discarded_samples_total{reason="too_far_behind",tenant="fake",pod="loki-0"}
    values: 0+40x120
  - series: loki_distributor_lines_received_total{tenant="fake",pod="loki-0"}
    values: 0+1000x120
  alert_rule_test:
  - eval_time: 90m
    alertname: LokiLinesDiscardedHigh
    exp_alerts: []
- name: an idle Loki with no lines received does not fire on 0/0
  interval: 1m
  input_series:
  - series: loki_discarded_samples_total{reason="too_far_behind",tenant="fake",pod="loki-0"}
    values: 0x120
  - series: loki_distributor_lines_received_total{tenant="fake",pod="loki-0"}
    values: 0x120
  alert_rule_test:
  - eval_time: 90m
    alertname: LokiLinesDiscardedHigh
    exp_alerts: []
