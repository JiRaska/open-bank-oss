# SPDX-License-Identifier: Apache-2.0
# Tax-reporting DLQ alerts against the SHIPPED rules: fire for records on the tax-reporting DLQ,
# never for another topic's DLQ, never for an empty one, and NotEmpty clears once the replayed
# records are deleted (oldest offset catches up).
rule_files:
  - prometheus-rules-tax-reporting.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Tax DLQ: two records arrive at minute 10; deleted (oldest -> 2) at minute 60.
      - series: 'kafka_topic_partition_current_offset{topic="openbank.dlq.tax-reporting.withholding-remitted-in",partition="0"}'
        values: '0x10 2x170'
      - series: 'kafka_topic_partition_oldest_offset{topic="openbank.dlq.tax-reporting.withholding-remitted-in",partition="0"}'
        values: '0x60 2x120'
      # Another service's DLQ filling up: not this rule's business.
      - series: 'kafka_topic_partition_current_offset{topic="openbank.dlq.interest.interest-withholding-remitted-in",partition="0"}'
        values: '0+1x180'
      - series: 'kafka_topic_partition_oldest_offset{topic="openbank.dlq.interest.interest-withholding-remitted-in",partition="0"}'
        values: '0x180'
    alert_rule_test:
      # Before anything arrives: must not fire.
      - eval_time: 5m
        alertname: TaxWithholdingRemittanceDeadLettered
        exp_alerts: []
      - eval_time: 5m
        alertname: TaxWithholdingDeadLetterNotEmpty
        exp_alerts: []
      # Arrivals: critical fires at once.
      - eval_time: 12m
        alertname: TaxWithholdingRemittanceDeadLettered
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              topic: openbank.dlq.tax-reporting.withholding-remitted-in
            exp_annotations:
              summary: "§38d withholding remittance dead-lettered (tax-reporting)"
              description: "tax-reporting-service could not record a withholding remittance even after retries and parked it on openbank.dlq.tax-reporting.withholding-remitted-in. Until it is replayed, that month's §38d return understates the tax withheld. Do not assemble or file the affected period before replaying."
              runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0028-tax-reporting-withholding-dead-letter.md"
      # Records still held after 15m: warning fires.
      - eval_time: 30m
        alertname: TaxWithholdingDeadLetterNotEmpty
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              topic: openbank.dlq.tax-reporting.withholding-remitted-in
            exp_annotations:
              summary: "2 §38d withholding remittance(s) awaiting replay (tax-reporting)"
              description: "openbank.dlq.tax-reporting.withholding-remitted-in still holds 2 dead-lettered withholding remittance(s). Each one is missing from a §38d return until it is replayed. Follow the runbook, then delete the replayed records so this clears."
              runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0028-tax-reporting-withholding-dead-letter.md"
      # Replayed records deleted at minute 60: warning clears.
      - eval_time: 65m
        alertname: TaxWithholdingDeadLetterNotEmpty
        exp_alerts: []
      # Arrivals stopped more than an hour ago: critical clears.
      - eval_time: 75m
        alertname: TaxWithholdingRemittanceDeadLettered
        exp_alerts: []
