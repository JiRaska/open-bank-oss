# Behavioural tests for openbank-ceu-alerts (ADR-0367, #15292): a must-FIRE case and a
# must-NOT-fire control. Intervals stay at 1m so `for:` is reachable.
rule_files:
  - prometheus-rules-ceu.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: "an unfiled overview past the cutoff fires CeuDailyOverviewNotFiled"
    input_series:
      - series: 'openbank_ceu_overview_unfiled_past_cutoff{pod="t1"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: CeuDailyOverviewNotFiled
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              summary: "CEÚ overview is past the local cutoff without submission evidence"
              description: "The reporting workflow in this environment has no SUBMITTED or ACKNOWLEDGED CEUSIFE10 overview for today's working day. Check the reporting environment and reconcile any external receipt with the recorded status. Follow the environment's filing procedure if submission is due."
              runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/ceu-alerts.md#ceudailyoverviewnotfiled"

  - interval: 1m
    name: "a filed overview (0) does NOT fire CeuDailyOverviewNotFiled"
    input_series:
      - series: 'openbank_ceu_overview_unfiled_past_cutoff{pod="t1"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: CeuDailyOverviewNotFiled
        exp_alerts: []

  - interval: 1m
    name: "a brief blip shorter than for: does NOT fire"
    input_series:
      - series: 'openbank_ceu_overview_unfiled_past_cutoff{pod="t1"}'
        values: "1 1 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 6m
        alertname: CeuDailyOverviewNotFiled
        exp_alerts: []
