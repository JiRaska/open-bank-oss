# Issue #9073. These tests distinguish legacy mixed-topic behaviour from the
# steady state after BOTH status and savings-withdrawal approvals leave account.created.
# The steady-state cases apply only after the old-topic one-hour lookback expires.
evaluation_interval: 1m
rule_files:
- prometheus-rules-onboarding.yaml
tests:
- name: missing account creations are detected when the created topic is quiet
  interval: 1m
  input_series:
  - series: openbank_parties_created_total
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.created"}'
    values: 0+0x100
  alert_rule_test:
  - eval_time: 95m
    alertname: OnboardingAccountsNotFollowingParties
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Parties are being created but no accounts are opening
        description: openbank_parties_created_total rose over the last hour while openbank_accounts_created_total did not — new customers are registering but the PARTY_CREATED → account.created pipeline is not producing accounts. This is the onboarding outage signature (party-service → Kafka → account-service). Check the party-events consumer lag, the DLQ (PartyEventDeadLettered), and account-service's dependencies (sanctions-service, product-catalog).
- name: legacy status-only traffic on created topic masks missing account creations
  interval: 1m
  input_series:
  - series: openbank_parties_created_total
    values: 0+1x100
  # Historical negative proof: this is status-only traffic under the old producer.
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.created"}'
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.status-changed"}'
    values: 0+0x100
  alert_rule_test:
  - eval_time: 95m
    alertname: OnboardingAccountsNotFollowingParties
    exp_alerts: []
- name: status and withdrawal traffic cannot mask missing creations after the cutover
  interval: 1m
  input_series:
  - series: openbank_parties_created_total
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.created"}'
    values: 0+0x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.status-changed"}'
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.savings-withdrawal.approved"}'
    values: 0+1x100
  alert_rule_test:
  - eval_time: 95m
    alertname: OnboardingAccountsNotFollowingParties
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Parties are being created but no accounts are opening
        description: openbank_parties_created_total rose over the last hour while openbank_accounts_created_total did not — new customers are registering but the PARTY_CREATED → account.created pipeline is not producing accounts. This is the onboarding outage signature (party-service → Kafka → account-service). Check the party-events consumer lag, the DLQ (PartyEventDeadLettered), and account-service's dependencies (sanctions-service, product-catalog).
- name: actual account creation suppresses the onboarding alert after the cutover
  interval: 1m
  input_series:
  - series: openbank_parties_created_total
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.created"}'
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.account.status-changed"}'
    values: 0+1x100
  - series: 'kafka_topic_partition_current_offset{topic="openbank.accounts.savings-withdrawal.approved"}'
    values: 0+1x100
  alert_rule_test:
  - eval_time: 95m
    alertname: OnboardingAccountsNotFollowingParties
    exp_alerts: []
