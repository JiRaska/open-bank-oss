# Positive/negative fixtures shared by the v1 ClusterPolicies and their CEL ports.
# run.sh applies both engines to these and requires identical pass/fail per resource.
apiVersion: v1
kind: Pod
metadata: {name: dr-in-default, namespace: default}
spec: {serviceAccountName: openbank-dr, containers: [{name: c, image: docker.io/library/busybox:1.36}]}
---
apiVersion: v1
kind: Pod
metadata: {name: dr-in-arc, namespace: arc-runners}
spec: {serviceAccountName: openbank-dr, containers: [{name: c, image: docker.io/library/busybox:1.36}]}
---
apiVersion: v1
kind: Pod
metadata: {name: plain-sa, namespace: default}
spec: {serviceAccountName: default, containers: [{name: c, image: busybox:1.36}]}
---
apiVersion: v1
kind: Pod
metadata: {name: no-sa, namespace: default}
spec: {containers: [{name: c, image: busybox:1.36}]}
---
apiVersion: v1
kind: Pod
metadata: {name: multi-registry, namespace: default}
spec:
  initContainers:
    - {name: init-ghcr, image: ghcr.io/cloudnative-pg/postgresql:18.1}
    - {name: init-bare, image: busybox:1.36}
  containers:
    - {name: quay, image: quay.io/prometheus/prometheus:v3.0.0}
    - {name: k8s, image: registry.k8s.io/pause:3.10}
    - {name: ecrpub, image: public.ecr.aws/docker/library/redis:7}
    - {name: hub, image: docker.io/library/nginx:1.27-alpine}
    - {name: ecr, image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/quay/prometheus/prometheus:v3.0.0}
    - {name: lookalike, image: myquay.io/x:1}
---
apiVersion: v1
kind: Pod
metadata: {name: eks-addon, namespace: kube-system, labels: {eks.amazonaws.com/component: "true"}}
spec:
  containers:
    - {name: quay, image: quay.io/foo/bar:1}
    - {name: k8s, image: registry.k8s.io/pause:3.10}
---
apiVersion: v1
kind: Pod
metadata: {name: cnpg-1, namespace: default, labels: {cnpg.io/cluster: x}}
spec: {containers: [{name: postgres, image: ghcr.io/cloudnative-pg/postgresql:18.1}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: snippet, namespace: default, annotations: {nginx.ingress.kubernetes.io/server-snippet: "return 403;"}}
spec: {rules: [{host: a.example}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: empty-snippet, namespace: default, annotations: {nginx.ingress.kubernetes.io/modsecurity-snippet: ""}}
spec: {rules: [{host: a.example}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: clean, namespace: default, annotations: {nginx.ingress.kubernetes.io/custom-headers: "x/y"}}
spec: {rules: [{host: a.example}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tool-ungated, namespace: observability}
spec: {rules: [{host: a.example}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tool-gated, namespace: observability, annotations: {nginx.ingress.kubernetes.io/auth-url: "https://gate/auth"}}
spec: {rules: [{host: a.example}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tool-declared, namespace: observability, annotations: {openbank.io/ungated-machine-callers: "SDK ingest"}}
spec: {rules: [{host: a.example}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tool-ungated-elsewhere, namespace: default}
spec: {rules: [{host: a.example}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-service, namespace: ledger}
spec:
  selector: {matchLabels: {app: l}}
  template: {metadata: {labels: {app: l}}, spec: {containers: [{name: c, image: busybox:1.36}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: ledger}
spec:
  selector: {matchLabels: {app: r}}
  template: {metadata: {labels: {app: r}}, spec: {containers: [{name: c, image: busybox:1.36}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-service, namespace: default}
spec:
  selector: {matchLabels: {app: l}}
  template: {metadata: {labels: {app: l}}, spec: {containers: [{name: c, image: busybox:1.36}]}}
---
# Pod-controller autogen: v1 denies this via its autogen- rule; the CEL port must too.
apiVersion: apps/v1
kind: Deployment
metadata: {name: dr-deploy, namespace: default}
spec:
  selector: {matchLabels: {app: d}}
  template: {metadata: {labels: {app: d}}, spec: {serviceAccountName: openbank-dr, containers: [{name: c, image: busybox:1.36}]}}
