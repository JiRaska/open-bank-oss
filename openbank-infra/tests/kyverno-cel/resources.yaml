# Pod-controller autogen: v1 denies this via its autogen- rule; the CEL port must too.
apiVersion: apps/v1
kind: Deployment
metadata: {name: dr-deploy, namespace: default}
spec:
  selector: {matchLabels: {app: d}}
  template: {metadata: {labels: {app: d}}, spec: {serviceAccountName: openbank-dr, containers: [{name: c, image: busybox:1.36}]}}
---
# ecr-pull-through-rewrite on Pod controllers (autogen). Kyverno 1.19.1 autogen rewrites
# `object.spec`/`object.metadata.labels` in matchConditions and mutations but NOT in
# variables, so a variable reading `object.spec.containers` failed every controller
# with `no such key: containers` (PolicyReports, 2026-09-30).
apiVersion: batch/v1
kind: Job
metadata: {name: job-rewrite, namespace: default}
spec:
  template:
    metadata: {labels: {app: j}}
    spec:
      restartPolicy: Never
      initContainers: [{name: init-ghcr, image: ghcr.io/cloudnative-pg/postgresql:18.1}]
      containers:
        - {name: hub, image: docker.io/alpine/k8s:1.34.12}
        - {name: bare, image: busybox:1.36}
---
# A Job with no template metadata at all: absent labels must read as "no labels".
apiVersion: batch/v1
kind: Job
metadata: {name: job-no-template-metadata, namespace: default}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: k8s, image: registry.k8s.io/pause:3.10}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: cron-rewrite, namespace: default}
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - {name: quay, image: quay.io/prometheus/prometheus:v3.0.0}
            - {name: ecrpub, image: public.ecr.aws/docker/library/redis:7}
---
# EKS system pod template in kube-system: quay stays, the rest is rewritten (as for Pods).
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: eks-addon-ds, namespace: kube-system}
spec:
  selector: {matchLabels: {app: e}}
  template:
    metadata: {labels: {app: e, eks.amazonaws.com/component: "true"}}
    spec:
      containers:
        - {name: quay, image: quay.io/foo/bar:1}
        - {name: k8s, image: registry.k8s.io/pause:3.10}
---
# A Pod with no initContainers key at all, and one rewritable image.
apiVersion: v1
kind: Pod
metadata: {name: no-init, namespace: default}
spec: {containers: [{name: ecrpub, image: public.ecr.aws/docker/library/redis:7}]}
