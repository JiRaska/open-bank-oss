# Fixtures for stateful-on-demand-cel (gitops/components/kyverno/stateful-on-demand-cel.yaml),
# evaluated by .github/scripts/check-stateful-not-on-spot.py through the Kyverno CLI.
# Each pod's `openbank.io/expect` annotation says whether the policy must route it to
# on-demand ("on-demand") or leave it alone ("untouched"). In scope (2026-09-30): only CNPG
# clusters in the policy's generated `targets` list (money-path DBs + temporal-db).
apiVersion: v1
kind: Pod
metadata:
  name: transaction-db-1
  namespace: payments
  labels:
    cnpg.io/cluster: transaction-db
    cnpg.io/podRole: instance
  annotations:
    openbank.io/expect: on-demand
spec:
  containers:
    - name: postgres
      image: ghcr.io/cloudnative-pg/postgresql:18.1
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger-db-2
  namespace: ledger
  labels:
    cnpg.io/cluster: ledger-db
    cnpg.io/podRole: instance
  annotations:
    openbank.io/expect: on-demand
spec:
  # The real CNPG shape: affinity with podAntiAffinity only, plus the tolerations the
  # DefaultTolerationSeconds admission plugin adds before any webhook runs.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              cnpg.io/cluster: ledger-db
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
  containers:
    - name: postgres
      image: ghcr.io/cloudnative-pg/postgresql:18.1
