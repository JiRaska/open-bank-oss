# ReplicaSet, no trafficRouting). The strict canary analysis cannot measure them, so they run it
# in dryRun instead of pausing every deploy. check.py fails if an entry is missing, stale (the
# canary now gets traffic) or lacks dryRun. Shrink this list; never grow it without an issue.
