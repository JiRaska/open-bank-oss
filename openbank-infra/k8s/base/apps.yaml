apiVersion: v1
kind: ConfigMap
metadata:
  name: account-service-config
data:
  QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://openbank-cnpg-rw:5432/openbank_accounts
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://openbank-cnpg-rw:5432/openbank_accounts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-service
        app.kubernetes.io/component: service
    spec:
      containers:
        - name: account-service
          image: openbank-account-service:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openbank-shared-config
            - secretRef:
                name: openbank-shared-secrets
            - configMapRef:
                name: account-service-config
          ports:
            - name: http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
          startupProbe:
            httpGet:
              path: /q/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  selector:
    app.kubernetes.io/name: account-service
  ports:
    - name: http
      port: 8100
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: account-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
