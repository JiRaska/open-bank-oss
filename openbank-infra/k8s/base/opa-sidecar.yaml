#
# OPA authorization sidecar (ADR-0034 D4). One OPA instance per namespace serves BOTH
# the MCP agent-tool gate (data.openbank.agents.allow) and every Quarkus service's REST
# interceptor (data.openbank.rest.allow) — single engine, single policy bundle.
#
# Services reach OPA at http://openbank-opa:8181 (OPA_URL env var, default matches).
# The policy bundle is published from openbank-libs via the registry CDN (ADR-0034 D2);
# OPA polls it on the bundle.polling interval and hot-reloads without pod restarts.
#
# Memory cost: ~50 MB per namespace versus ~100 MB if each service ran its own sidecar.
# Advisory mode (authz.enforce: false) is the fleet default — no service is blocked until
# the enforced flip (D5) is applied per-action via rules.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbank-opa
  namespace: openbank
  labels:
    app.kubernetes.io/name: openbank-opa
    app.kubernetes.io/component: authz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbank-opa
  namespace: openbank
  labels:
    app.kubernetes.io/name: openbank-opa
    app.kubernetes.io/component: authz
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openbank-opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbank-opa
        app.kubernetes.io/component: authz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8182"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: openbank-opa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: opa
          image: openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--diagnostic-addr=0.0.0.0:8182"
            - "--log-level=info"
            - "--log-format=json"
            - "--set=decision_logs.console=true"
            - "--set=status.console=true"
            # Bundle pulled from the OCI registry (published by openbank-libs CI).
            # Pin the digest in the GitOps overlay; update with each libs release.
            - "--set=bundles.openbank.resource=oci://$(OPA_BUNDLE_REGISTRY)/openbank-policy-bundle:latest"
            - "--set=bundles.openbank.polling.min_delay_seconds=30"
            - "--set=bundles.openbank.polling.max_delay_seconds=120"
          env:
            - name: OPA_BUNDLE_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: openbank-shared-config
                  key: OPA_BUNDLE_REGISTRY
                  optional: true
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
            - name: diagnostics
              containerPort: 8182
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health?bundles
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: openbank-opa
  namespace: openbank
  labels:
    app.kubernetes.io/name: openbank-opa
    app.kubernetes.io/component: authz
spec:
  selector:
    app.kubernetes.io/name: openbank-opa
  ports:
    - name: http
      port: 8181
      targetPort: http
      protocol: TCP
  type: ClusterIP
