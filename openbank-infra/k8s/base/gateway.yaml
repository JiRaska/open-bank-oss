apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbank-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openbank-api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbank-api-gateway
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: kong
          image: kong:3.7.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_LOG_LEVEL
              value: info
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000 reuseport backlog=16384
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001 reuseport backlog=16384
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /status
              port: admin
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: kong-config
          configMap:
            name: openbank-api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: openbank-api-gateway
spec:
  selector:
    app.kubernetes.io/name: openbank-api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: proxy
    - name: admin
      port: 8001
      targetPort: admin
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openbank-api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openbank-api-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
