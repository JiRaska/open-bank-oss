# Edge response headers via ingress-nginx `custom-headers` (ConfigMap in the Ingress's own
# namespace) instead of a Critical-risk `configuration-snippet` (ADR-0324 interim hardening).
# The controller must list every key in `global-allowed-response-headers`; it sets HSTS and
# X-Content-Type-Options itself and strips X-Powered-By (`hide-headers`) — see
# gitops/apps/ingress-nginx.yaml for the values this base assumes. The controller re-reads a
# custom-headers ConfigMap only when the Ingress changes, hence immutable + versioned names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbank-api-edge-headers-v1
immutable: true
data:
  X-Frame-Options: "DENY"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "geolocation=(), microphone=(), camera=()"
  Cross-Origin-Opener-Policy: "same-origin"
  Cross-Origin-Embedder-Policy: "require-corp"
  Cross-Origin-Resource-Policy: "same-origin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbank-admin-ui-edge-headers-v1
immutable: true
data:
  X-Frame-Options: "DENY"
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "geolocation=(), microphone=(), camera=()"
  Cross-Origin-Opener-Policy: "same-origin"
  Cross-Origin-Resource-Policy: "same-origin"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbank-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/custom-headers: openbank/openbank-api-edge-headers-v1
spec:
  ingressClassName: nginx
  rules:
    - host: api.openbank.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbank-api-gateway
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbank-admin-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/custom-headers: openbank/openbank-admin-ui-edge-headers-v1
spec:
  ingressClassName: nginx
  rules:
    - host: admin.openbank.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbank-admin-ui
                port:
                  number: 3000
---
# Apex domain redirect → https://admin.<domain>
# external-dns will create an A record for the apex; nginx redirects to admin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbank-apex-redirect
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://admin.openbank.example.local"
spec:
  ingressClassName: nginx
  rules:
    - host: openbank.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbank-admin-ui
                port:
                  number: 3000
