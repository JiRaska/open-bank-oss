apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbank-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      more_clear_headers "X-Powered-By";
spec:
  ingressClassName: nginx
  rules:
    - host: api.openbank.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbank-api-gateway
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbank-admin-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      more_clear_headers "X-Powered-By";
spec:
  ingressClassName: nginx
  rules:
    - host: admin.openbank.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbank-admin-ui
                port:
                  number: 3000
---
# Apex domain redirect → https://admin.<domain>
# external-dns will create an A record for the apex; nginx redirects to admin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbank-apex-redirect
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://admin.openbank.example.local"
spec:
  ingressClassName: nginx
  rules:
    - host: openbank.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbank-admin-ui
                port:
                  number: 3000
