_format_version: "3.0"
_transform: true

services:
  - name: account-service
    protocol: http
    host: account-service
    port: 8100
    path: /
    retries: 2
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: account-route
        paths:
          - /api/v1/accounts
        strip_path: false
  - name: account-health-service
    protocol: http
    host: account-service
    port: 8100
    path: /q/health
    retries: 2
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: account-health-route
        paths:
          - /health/account
        strip_path: true

