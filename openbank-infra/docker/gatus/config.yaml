    alerts:
      - type: slack
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  - name: "Product Catalog"
    group: "Core Banking"
    url: "http://openbank-product-catalog:8104/q/health/ready"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
