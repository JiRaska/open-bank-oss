web:
  port: 8080
  read-buffer-size: 8192

storage:
  type: postgres
  path: "host=postgres user=openbank password=${POSTGRES_PASSWORD} dbname=openbank_gatus sslmode=disable"
  caching: true

ui:
  title: "OpenBank Status"
  header: "OpenBank Platform Status"
  description: "Real-time availability of OpenBank services. Published in compliance with PSD2 RTS Art. 32."
  logo: ""
  link: "https://openbank.example.com"
  buttons:
    - name: "API Documentation"
      link: "https://openbank.example.com/docs"

alerting:
  slack:
    webhook-url: "${SLACK_WEBHOOK_URL}"
    default-alert:
      enabled: false
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 60s

endpoints:
  # ── Core Banking ──────────────────────────────────────────────────────────

  - name: "Account Service"
    group: "Core Banking"
    url: "http://account-service:8100/q/health/ready"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: slack
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true

  - name: "Account Service — Liveness"
    group: "Core Banking"
    url: "http://account-service:8100/q/health/live"
    interval: 15s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
    ui:
      hide-conditions: true

  - name: "Ledger Service"
    group: "Core Banking"
    url: "http://ledger-service:8101/q/health/ready"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
      - "[RESPONSE_TIME] < 2000"
    alerts:
