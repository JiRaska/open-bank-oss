global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: openbank-local
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Core Banking ──────────────────────────────────────────────────────────
  - job_name: account-service
    static_configs:
      - targets: ['openbank-account-service:8100']
    metrics_path: /q/metrics

  - job_name: ledger-service
    static_configs:
      - targets: ['openbank-ledger-service:8101']
    metrics_path: /q/metrics

  - job_name: transaction-service
    static_configs:
      - targets: ['openbank-transaction-service:8102']
    metrics_path: /q/metrics


  # ── Identity & Compliance ─────────────────────────────────────────────────
  - job_name: pid-service
    static_configs:
      - targets: ['openbank-pid-service:8105']
    metrics_path: /q/metrics

  - job_name: consent-service
    static_configs:
      - targets: ['openbank-consent-service:8106']
    metrics_path: /q/metrics

  - job_name: psd2-service
