# Cluster edge. ingress-nginx (not the AWS ALB controller) keeps the edge
# cloud-agnostic per ADR-0027 — the only AWS coupling is the Service annotation
# that asks the in-tree cloud provider for an NLB. Two replicas + PDB (below).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      valuesObject:
        controller:
          config:
            # Larger header buffer for OIDC: next-auth's /api/auth/callback sets a
            # large Set-Cookie (session JWT), which overflows the default 4k/8k
            # proxy buffer and 502s the admin-ui login. Set globally — per-Ingress
            # annotation is not honoured by this controller.
            proxy-buffer-size: "32k"
            # ── Edge response headers WITHOUT snippets (ADR-0324 interim hardening) ──
            # HSTS is owned by the controller, not by any Ingress: its Lua header
            # filter sets Strict-Transport-Security on every TLS-served response.
            # These two values reproduce what every per-Ingress snippet sent
            # (2-year max-age + preload), so the header is identical on every host
            # and no Ingress needs to (or may) set it itself.
            hsts: "true"
            hsts-include-subdomains: "true"
            hsts-max-age: "63072000"
            hsts-preload: "true"
            # The ONLY response headers an Ingress may set through the
            # `custom-headers` annotation (risk Medium, per-location, ConfigMap in the
            # Ingress's own namespace). The controller denies the location if its
            # ConfigMap names a header outside this list, so the list is the
            # platform-owned boundary that replaces free-form `more_set_headers`
            # snippets. Deliberately absent: Strict-Transport-Security (controller
            # owned, above), Set-Cookie, Location, Access-Control-* (CORS), Server.
            global-allowed-response-headers: "X-Frame-Options,Referrer-Policy,X-Robots-Tag,Permissions-Policy,Content-Security-Policy,Cross-Origin-Opener-Policy,Cross-Origin-Embedder-Policy,Cross-Origin-Resource-Policy"
            # Strip the framework fingerprint (Next.js, Express) from every upstream
            # response — what k8s/base's `more_clear_headers` snippet did per host.
            hide-headers: "X-Powered-By"
            # ── Snippets OFF, annotation risk at the controller default (ADR-0324) ──
            # A snippet annotation is raw nginx (or ModSecurity) config injected by
            # whoever can write an Ingress, into a controller that can list every
            # Secret in the cluster — the CVE-2021-25742 / CVE-2023-5043 class. This
            # controller is also archived upstream and gets no more fixes. Every
            # former snippet now has a typed replacement: HSTS/nosniff/hide-headers
            # above, per-host headers via `custom-headers` (Medium), the Keycloak
            # admin block via `denylist-source-range` (Medium), the WAF policy via
            # the mounted modsecurity.conf. Every annotation still in the repo is at
            # most High (auth-url, auth-signin), so High admits all of them.
            # Both values are the controller defaults, spelled out so they cannot
            # drift back quietly.
            # FAILURE MODE TO KNOW: the admission webhook is off (below), so an
            # Ingress carrying a Critical annotation is not rejected at apply — the
            # controller silently DROPS the whole Ingress from nginx.conf and the
            # host falls back to the fake default certificate. The Kyverno policy
            # components/kyverno/deny-nginx-snippet-annotations.yaml turns that into a
            # loud admission denial (ArgoCD SyncFailed) instead.
            allow-snippet-annotations: "false"
            annotations-risk-level: "High"
          # Headers that are correct on EVERY response of every host, API or UI:
          # rendered once at http{} level (more_set_headers, inherited by every
          # location and appended to a location's own custom-headers).
          addHeaders:
            X-Content-Type-Options: nosniff
          # ModSecurity engine config for the Ingresses that opt in with
          # `enable-modsecurity` (today only developer-portal, ADR-0093). The WAF
          # policy was a `modsecurity-snippet` annotation — Critical risk, i.e.
          # anyone able to write an Ingress could rewrite the WAF. It now lives in
          # the controller's own pod spec: the file replaces the image's
          # /etc/nginx/modsecurity/modsecurity.conf, which the controller loads for
          # every modsecurity-enabled location that carries no snippet.
          # The ConfigMap is IMMUTABLE and versioned by name (components/ingress-nginx,
          # app ingress-nginx-config): changing the WAF policy means a new name here,
          # which changes the pod template and rolls the controller. A subPath mount
          # never sees an in-place edit, and nginx reads the file only on reload, so
          # an editable ConfigMap would be a policy change that silently never lands.
          # Until the ConfigMap exists a new controller pod waits in
          # ContainerCreating while the old one keeps serving (maxUnavailable 0).
          extraVolumes:
            - name: modsecurity-conf
              configMap:
                name: ingress-nginx-modsecurity-v1
          extraVolumeMounts:
            - name: modsecurity-conf
              mountPath: /etc/nginx/modsecurity/modsecurity.conf
              subPath: modsecurity.conf
              readOnly: true
          # One replica in EVERY AZ the NLB has an address in. With
          # externalTrafficPolicy: Local and cross-zone off, an NLB address whose AZ
          # has no controller has no healthy target: connections to it fail until the
          # NLB and the Route53 alias drop that AZ from DNS, which took minutes on
          # 2026-09-28 when two replicas sat in 1a/1b and the 1c address kept being
          # answered (about a third of new connections failed). Three replicas with
          # REQUIRED zone spread keep every address backed, so a single pod or node
          # loss only removes one AZ instead of opening a hole. Karpenter provisions
          # into the AZ the constraint asks for. The PDB keeps two serving through
          # voluntary disruption (drift, consolidation, drains).
          replicaCount: 3
          minAvailable: 2
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              # Count only pods of the CURRENT ReplicaSet. Without this, a
              # terminating old-RS pod still counts during a roll: on 2026-09-28 it
              # made 1a look occupied, the third replica landed in 1b, the old pod
              # then left and 1a stayed empty (NLB 1a address with no target). The
              # scheduler never rebalances afterwards.
              matchLabelKeys: [pod-template-hash]
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress-nginx
                  app.kubernetes.io/component: controller
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys: [pod-template-hash]
              # Treat all three NLB AZs as required domains even while one has no
              # eligible node yet, so Karpenter provisions there instead of the
              # scheduler doubling up elsewhere.
              minDomains: 3
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/instance: ingress-nginx
                  app.kubernetes.io/component: controller
          # Scrape the controller so edge-level 5xx are observable. ingress-nginx
          # records every request it proxies (nginx_ingress_controller_requests,
          # labelled by status) — including the failures that never reach a backend
          # pod and so never appear in any service's http_server_requests_seconds_count:
          # pod-down 503, upstream-refused 502, upstream-timeout 504. Without this the
          # platform error-rate is blind to exactly the customer-facing edge failures
          # it should surface (#2677). metrics.enabled adds the 10254 port + metrics
          # Service + --enable-metrics; serviceMonitor.enabled emits a ServiceMonitor
          # the kube-prometheus-stack Prometheus picks up (its
          # serviceMonitor{,Namespace}Selector are both {} = match-all, so the release
          # label is conventional, not required).
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
          # The admission webhook only validates Ingress objects; its Helm-hook
          # certgen Jobs deadlock ArgoCD sync (hook stuck "Pending deletion").
          # Disabled for the sandbox — re-enable in prod where Ingress is
          # multi-tenant and validation matters.
          admissionWebhooks:
            enabled: false
          # Chart-level switch for the same thing as allow-snippet-annotations
          # above. When true the chart renders its own `allow-snippet-annotations:
          # "true"` next to the one in `config`; false renders nothing, leaving the
          # explicit "false" above as the single source.
          allowSnippetAnnotations: false
          service:
            type: LoadBalancer
            # Local: the NLB delivers only to nodes running a controller replica
            # (health-checked on healthCheckNodePort) and there is no kube-proxy SNAT,
            # so nginx sees the real client IP (rate limits, access logs); with Cluster
            # every request arrived from a node IP. The sandbox edge is deliberately
            # public (owner decision 2026-09-29): no source allow-list is applied. Safe only with >=2 replicas on distinct nodes (above). Cross-zone
            # stays off (inter-AZ data cost): the NLB drops an AZ with no healthy
            # target from its DNS answers. Hostnames come from external-dns, so nothing
            # pins a single NLB IP any more (the old sslip.io reason for Cluster).
            externalTrafficPolicy: Local
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          ingressClassResource:
            default: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
