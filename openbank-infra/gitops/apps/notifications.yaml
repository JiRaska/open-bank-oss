# Notifications banking domain: notification-service (FinOps T2 scale-to-zero,
# ADR-0057) + its single-owner CNPG Postgres, plus the inbound Kafka topic and the
# KEDA ScaledObject that owns the replica count. The DB secret is CNPG-generated;
# no out-of-band secret is needed (OIDC is disabled for the pilot). ArgoCD
# converges as the CNPG operator and KEDA come up; the Deployment is scaled to
# zero by KEDA whenever the topic has no lag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notifications
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/notifications
  destination:
    server: https://kubernetes.default.svc
    namespace: notifications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      # ServerSideApply: the OPA bundle ConfigMap is ~260 KB, and client-side apply
      # stores the whole object in kubectl.kubernetes.io/last-applied-configuration,
      # which Kubernetes caps at 262144 bytes for all annotations combined. Past that
      # the ConfigMap is REJECTED and Argo retries forever ("Too long"), so the policy
      # in the cluster silently freezes at the last version that fitted while git moves
      # on. Server-side apply tracks ownership in metadata.managedFields instead and
      # writes no such annotation, so it has no size ceiling of this kind.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
