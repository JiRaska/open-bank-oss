# Secrets wiring — the ClusterSecretStore (handle onto Vault) plus the
# ExternalSecrets that project Vault KV entries into the per-namespace Secrets
# apps already consume. Sync-wave "1" so it reconciles after Vault and ESO
# (wave 0) are up. ignoreDifferences on Secret /data: ESO owns the values at
# runtime (creationPolicy: Owner), git must never see or fight them — without
# this ArgoCD would flag the Secrets as OutOfSync forever and selfHeal could wipe
# ESO's writes. A second entry ignores the fields the ExternalSecret CRD defaults
# server-side (deletionPolicy, template.engineVersion, remoteRef.*Strategy/
# metadataPolicy), which git doesn't set and which would otherwise show as
# permanent OutOfSync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  # ESO writes the actual secret material into these Secrets at runtime; git
  # holds only the ExternalSecret reference. Never reconcile the Secret bodies.
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.target.template.engineVersion
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
