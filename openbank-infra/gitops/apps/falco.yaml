# Falco — runtime threat detection (syscall layer), ADR-0081 baseline.
#
# Closes the runtime half of the security posture: admission is covered
# (kyverno verify-images Enforce, PSS restricted on app namespaces), but until
# now nothing watched a container AFTER it was admitted — a reverse shell, a
# package manager run in a production pod, /etc/shadow reads or a crypto-miner
# would have been invisible. Falco's stock ruleset detects exactly that class.
#
# Integration is deliberately zero-new-plumbing: json output to stdout → the
# Alloy DaemonSet already tails every pod and ships to Loki (structured
# metadata) → Grafana. Alerting on CRITICAL/EMERGENCY rules rides the existing
# Loki datasource; no falcosidekick, no new webhook surface.
#
# Driver: modern_ebpf (CO-RE) — no kernel-module build, works on the AL2023
# arm64 nodes. DaemonSet covers app + observability nodes; the CI runner pool
# keeps its own taint untolerated on purpose (dind syscall noise would drown
# the signal — revisit with a runner-scoped ruleset).
#
# The falco namespace is PSS-privileged: the eBPF probe needs CAP_BPF/
# CAP_PERFMON and /proc access (chart sets the minimal set). That privilege is
# the cost of watching everyone else — same trade Prometheus node-exporter
# class tooling makes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0   # Falco 0.44.1
    helm:
      releaseName: falco
      valuesObject:
        fullnameOverride: falco

        # Pull falco + falcoctl from our ECR Public mirror, not Docker Hub. Neither
        # falcosecurity/falco nor falcosecurity/falcoctl is a Docker Official Image,
        # so the anonymous docker-hub ECR pull-through rate-limited falcoctl to
        # NotFound on fresh nodes (2026-06-27, falco DaemonSet stuck on init).
        # Kyverno rewrite-ecr-public turns these refs into the ecr-public pull-
        # through. Keep tags in lockstep with the chart targetRevision above and the
        # mirror entries in scripts/mirror-ci-base-images.sh.
        image:
          registry: public.ecr.aws/d7v4f3x6
          repository: falco
          tag: "0.44.1"
        falcoctl:
          image:
            registry: public.ecr.aws/d7v4f3x6
            repository: falcoctl
            tag: "0.13.0"

        driver:
          kind: modern_ebpf

        # Logs are the delivery channel (Alloy → Loki) — keep them machine-y.
        tty: false
        falco:
          json_output: true
          json_include_output_property: true
          log_syslog: false
          # Stock rules (falco_rules.yaml from the falcoctl artifact), plus the
          # tuning exceptions in `customRules` below. `notice` stays the floor:
          # the two highest-volume stock rules here are NOTICE, and the SOC
          # dashboard + Loki retention are the consumers that want them.
          priority: notice

        # ==========================================================================
        # TUNING (issue #5734). The triage this file promised for "the first week of
        # sandbox noise" — 15 months late, and it had to happen BEFORE any alert was
        # added, because an alert over an untuned ruleset is muted within a day.
        #
        # BASELINE, measured over 24h of sandbox Loki on 2026-08-19, with each rule's
        # STOCK PRIORITY (falcosecurity/rules falco_rules.yaml, Falco 0.44.1) — the
        # priority is the load-bearing column, because it decides which of these an
        # alert can ever see:
        #
        #   29465  Contact K8S API Server From Container   NOTICE
        #    3150  Run shell untrusted                     NOTICE
        #     450  Drop and execute new binary in container CRITICAL
        #       5  Falco internal: syscall event drop      CRITICAL (Falco-internal)
        #
        # So the ~33k/day headline and the alertable volume are NOT the same number:
        # a `priority=~Critical|Emergency` alert sees 455/day, not 33k. Tuning the two
        # NOTICE rules buys log volume and dashboard signal; tuning `Drop and execute`
        # is what makes an alert survivable. Both are done here, for different reasons.
        #
        # HOW THESE ARE WRITTEN. Every stock rule above ships a purpose-built tuning
        # hook — a `user_known_*` macro defaulting to `never_true`, or an empty list.
        # Overriding the hook is the sanctioned mechanism and leaves the rule itself
        # untouched, so a chart bump cannot silently drop the exception (it would drop
        # the whole file, loudly). `/etc/falco/rules.d` loads AFTER falco_rules.yaml
        # (chart values `falco.rules_files`), so these overrides win.
        #
        # `Run shell untrusted` (was 3150/day, 1189/day at time of writing) is now
        # tuned. The previous note here said it needed "one Loki query against the
        # live events and then a tuning it can justify" — that query has been run,
        # and both spawners turned out to be exactly the `protected_shell_spawner`
        # ancestors the rule's condition names, which is why the repo's own manifests
        # could not identify them: neither shell is declared anywhere in this repo,
        # both are spawned at runtime by a third-party server binary.
        #
        #   350/388 sampled: parent_exepath=/usr/local/nginx/sbin/nginx,
        #     gparent=nginx-ingress-c, user=www-data, proc_exepath=/bin/busybox,
        #     command=sh -c eval "printf %s\0 x $1 $2" sh
        #     /etc/nginx/owasp-modsecurity-crs/rules/RESPONSE-*.conf
        #     -> nginx expanding OWASP CRS rule-file globs at config load. nginx is
        #        an http server, hence a protected_shell_spawner.
        #    38/388 sampled: parent_exepath=/usr/lib/postgresql/18/bin/postgres,
        #     ggparent=manager, proc_exepath=/bin/dash,
        #     command=sh -c /controller/manager wal-restore --log-destination ...
        #     -> CNPG's restore_command. postgres is a db_server_binary, hence also
        #        a protected_shell_spawner.
        # ==========================================================================
        customRules:
          openbank-tuning.yaml: |-
            # ---------------------------------------------------------------
            # Contact K8S API Server From Container  (29465/day, NOTICE)
            #
            # WHAT IT ACTUALLY DETECTS: any container connecting to
            # kubernetes.default.svc. Stock excludes only ns kube-system and a
            # fixed list of third-party operator images (`k8s_containers`) —
            # none of which this estate runs. So every controller we DO run
            # trips it continuously, which is the whole 29k.
            #
            # WHAT IS PRESERVED: the coverage that has value here is the ~60
            # openbank APP namespaces (accounts, payments, ledger, sanctions,
            # fraud, ...), where a connection to the API server is anomalous by
            # construction — no openbank service carries a Kubernetes client
            # dependency (no fabric8, no client-go) and no openbank
            # ServiceAccount except admin-ui has any Role or ClusterRole bound.
            # Not one of those namespaces is excepted below.
            #
            # (1) Pure platform/controller namespaces. Whole-namespace scope is
            # honest here: these hold no business data path, every pod in them
            # talks to the API server as its JOB, and the other ~90 stock rules
            # — shell spawn, sensitive mount, drop-and-execute — still cover
            # them. kube-system is already excluded upstream.
            - macro: openbank_controller_namespaces
              condition: >
                (k8s.ns.name in (argocd, argo-rollouts, arc-runners, arc-systems,
                                 cert-manager, cnpg-system, external-dns,
                                 external-secrets, falco, ingress-nginx, keda,
                                 kyverno, observability, vault, vpa))

            # (2) The kubectl CronJobs, by IMAGE rather than by namespace —
            # they run in `admin-ui`, `iam` and `finops-scaledown`, which are
            # NOT namespaces to hand a blanket exception to. Every one of them
            # is a `docker.io/alpine/k8s` pod whose entire purpose is to call
            # the API server: finops scale-down/up, cost-collector,
            # tier-classifier, sbom-drift-scanner, infra-vuln-scanner,
            # keycloak-realm-drift.
            - macro: openbank_kubectl_cronjob_image
              condition: (container.image.repository endswith "alpine/k8s")

            # (3) The admin-ui BFF, by IMAGE for the same reason — ns admin-ui
            # also hosts the CronJobs above and would be a bad blanket. It is
            # the one openbank service that genuinely calls the API server
            # (src/lib/discovery.ts), its ClusterRole is read-only
            # (get/list/watch on deployments/rollouts/services/endpoints) and
            # is bound per-namespace, never cluster-wide.
            # RESIDUAL, stated: code execution INSIDE the admin-ui container
            # would no longer trip THIS rule. It still trips the shell-spawn,
            # drop-and-execute and sensitive-file rules, and the RBAC above
            # caps what the token can do. Scoping by image keeps every other
            # container in ns admin-ui covered.
            - macro: openbank_admin_ui_bff
              condition: (container.image.repository endswith "openbank-admin-ui")

            # (4) Strimzi's cluster operator — ns `messaging` also holds the
            # Kafka brokers and Apicurio, which have no business calling the
            # API server, so this is pod-scoped rather than namespace-scoped.
            - macro: openbank_strimzi_operator
              condition: >
                (k8s.ns.name = "messaging"
                 and k8s.pod.name startswith "strimzi-cluster-operator")

            - macro: user_known_contact_k8s_api_server_activities
              condition: >
                (openbank_controller_namespaces
                 or openbank_kubectl_cronjob_image
                 or openbank_admin_ui_bff
                 or openbank_strimzi_operator)
              override:
                condition: replace

            # ---------------------------------------------------------------
            # Drop and execute new binary in container  (450/day, CRITICAL)
            #
            # This is the rule that gates the alert, and the ONLY one of the
            # four whose priority an alert on Critical can see. It fires on
            # `proc.is_exe_upper_layer=true` — an executable that was written
            # into the container's writable overlay layer AFTER image build and
            # then exec'd. That is real malware behaviour, so the exception has
            # to be tight enough that a genuine drop-and-execute anywhere else
            # still fires.
            #
            # WHERE THE 450 COMES FROM. Candidates were enumerated from the
            # repo and all but one are eliminated by the rule's own condition:
            #   - JNI/native extraction (ONNX in fraud-service, netty epoll
            #     fleet-wide, lz4) `dlopen`s a .so; the rule needs
            #     `spawned_process`, so it cannot match.
            #   - the pyroscope initContainer copies a JAR (run by the JVM from
            #     the image), and litellm's initContainer stages prisma into an
            #     emptyDir — an emptyDir is a separate mount, not the overlay
            #     UPPER layer, so `is_exe_upper_layer` is false.
            #   - ARC runners and their dind sidecar, the obvious suspects, are
            #     NOT OBSERVABLE: Falco tolerates only workload=observability,
            #     while the runner pool carries openbank.io/runner=true:NoSchedule
            #     (arc-runners.tf), so no Falco pod runs on a runner node. The
            #     header comment above says this and it checks out.
            # What survives is `arc-stuck-runner-reaper` — a CronJob in ns
            # arc-runners that is deliberately scheduled on the DEFAULT nodes
            # (arc-runner-reaper.tf: "so the guard never itself provokes a
            # runner-pool scale-up"), i.e. squarely in Falco's view. Its script
            # opens with `apk add --no-cache jq curl` and then runs them:
            # binaries installed into the writable layer of a running container
            # and executed. That is the textbook shape of this rule.
            # Arithmetic, which is why this is an identification and not a
            # hypothesis: schedule */10 = 144 runs/day, each exec'ing at least
            # curl (twice), jq and apk from the upper layer -> ~430/day against
            # a measured 450/day.
            #
            # SCOPE: namespace AND pod-name prefix AND the three process names.
            # Another pod in arc-runners still fires; a different binary
            # dropped into the reaper pod itself still fires.
            #
            # THE PROPER FIX IS NOT THIS. `apk add` at runtime is the defect;
            # baking jq+curl into the reaper image removes the detection at
            # source and makes this macro dead. That is a Terraform change to
            # local.arc_reaper_image and is out of scope for a gitops PR —
            # tracked in the #5734 PR body. Delete this macro when it lands.
            # ---------------------------------------------------------------
            # Run shell untrusted  (1189/day, NOTICE)
            #
            # Both exceptions are scoped to the COMMAND, not to the spawner alone.
            # "nginx may spawn shells" and "postgres may spawn shells" would each
            # silence a textbook RCE path on an internet-facing proxy and on a
            # money-path database respectively — the rule's whole purpose. Keyed on
            # the specific command instead, an attacker-spawned shell under either
            # parent still fires, because it will not be expanding CRS globs or
            # running CNPG's wal-restore.
            #
            # Both are load-bearing third-party behaviour, not something this repo
            # can remove at source (contrast the arc-reaper macro below, whose
            # proper fix IS to change the image): nginx expands its include globs
            # through a shell on every config load, and CNPG implements
            # restore_command as a shell-invoked call into /controller/manager.
            #
            # Upstream's `postgres_running_cnpg` misses this TWICE over:
            #   (proc.pname=postgres and proc.cmdline startswith
            #    "sh -c /controller/manager wal-archive")
            # It covers only wal-ARCHIVE, while most events measured here are
            # wal-RESTORE; and it is anchored with `startswith`, while this CNPG
            # version invokes `sh -c -- /controller/manager wal-archive` — note the
            # `--`, which defeats the prefix match even for the verb it does name.
            # Hence `contains` and both verbs here. Likewise `nginx_starting_nginx`
            # covers nginx re-exec'ing itself, not glob expansion. Both look like
            # upstream gaps worth reporting rather than local quirks; noted in the
            # PR body rather than filed, since that is a third-party tracker.
            # Keyed on the COMMAND SHAPE, not on the CRS path. The first draft used
            # `contains "owasp-modsecurity-crs"` and, measured against 600 live
            # events, silenced only 69% — nginx expands `.data` globs
            # (unix-shell.data, lfi-os-files.data, web-shells-php.data ...) with a
            # BARE filename and no directory prefix, so the path never appears in
            # the command. `sh -c eval "printf %s\0 x $1 $2" sh <file>` is nginx's
            # glob-expansion idiom and is the stable discriminator. Still tight:
            # scoped to nginx as the parent in the ingress namespace, so any other
            # shell nginx spawns — the RCE this rule exists for — still fires.
            - macro: openbank_nginx_glob_expansion
              condition: >
                (k8s.ns.name = "ingress-nginx"
                 and proc.pname = "nginx"
                 and proc.cmdline startswith "sh -c eval")

            # Not namespace-scoped on purpose: CNPG runs a cluster in every service
            # namespace that owns a database, so pinning namespaces here would be a
            # list that silently goes stale the next time a service gets its own
            # Postgres. The command is the discriminator.
            - macro: openbank_cnpg_wal_shipping
              condition: >
                (proc.pname = "postgres"
                 and (proc.cmdline contains "/controller/manager wal-restore"
                      or proc.cmdline contains "/controller/manager wal-archive"))

            # `user_shell_container_exclusions` is the hook the stock rule provides
            # for exactly this — upstream ships it as `(never_true)` and the rule
            # ends with `and not user_shell_container_exclusions`. Verified against
            # falcosecurity/rules `falco_rules.yaml`, not assumed: the first draft
            # of this block overrode a plausible-sounding `user_known_shell_spawn_
            # activities`, which appears NOWHERE in the ruleset and would have been
            # a silent no-op — the exact "configured-looking and inert" shape this
            # file's own header warns about. The rule's only `user_known_*` hook is
            # `user_known_shell_spawn_binaries`, and that is a LIST of process
            # names, which cannot express either condition above.
            - macro: user_shell_container_exclusions
              condition: >
                (openbank_nginx_glob_expansion or openbank_cnpg_wal_shipping)
              override:
                condition: replace

            - macro: openbank_arc_reaper_apk_bootstrap
              condition: >
                (k8s.ns.name = "arc-runners"
                 and k8s.pod.name startswith "arc-stuck-runner-reaper"
                 and proc.name in (apk, jq, curl))

            - macro: known_drop_and_execute_activities
              condition: (openbank_arc_reaper_apk_bootstrap)
              override:
                condition: replace

        falcosidekick:
          enabled: false

        # Node-agent priority (same class as CNI/kube-proxy): sandbox nodes
        # run at the max-pods (ENI IP) limit, where a default-priority DS pod
        # finds "Too many pods" and no preemption victim — the security agent
        # must win that slot; the evicted workload pod reschedules elsewhere
        # (Karpenter provisions for it, unlike for node-bound DS pods).
        podPriorityClassName: system-node-critical

        # Lean sandbox profile (FinOps): Falco idles ~150Mi / single-digit
        # mCPU; bursts on event storms are capped instead of evicting
        # neighbours. cpu request is deliberately tiny — at 50m the DaemonSet
        # pod did not FIT on 4 bin-packed sandbox nodes (Insufficient cpu,
        # Karpenter does not provision for node-bound DS pods).
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        tolerations:
          # Cover the stateful observability pool too — Prometheus/Loki nodes
          # are exactly where tampering would hurt most.
          - key: workload
            operator: Equal
            value: observability
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        openbank.io/plane: platform
        # The eBPF probe is privileged by design — restricted would block it.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
