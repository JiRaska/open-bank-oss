# sdd-service: SEPA Direct Debit mandate lifecycle + outbox (ADR-0050). Namespace: sdd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sdd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/sdd
  destination:
    server: https://kubernetes.default.svc
    namespace: sdd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
  # ADR-0057 T1 pilot (#251): the KEDA HTTP add-on owns replicas 0<->1 on
  # sdd-service, not ArgoCD. Without this, selfHeal fights KEDA every
  # reconcile — forces replicas back to the git-declared 1, KEDA promptly
  # scales it back to 0 on idle, permanent OutOfSync/flap loop (same pattern
  # as product-catalog's ADR-0083 pilot, gitops/apps/product-catalog.yaml).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: sdd-service
      namespace: sdd
      jqPathExpressions:
        - .spec.replicas
