# Metrics plane: Prometheus + Grafana + kube-state-metrics + node-exporter +
# alertmanager (enabled, with the routing tree configured below). Lean FinOps
# sizing per ADR-0027: single Prometheus replica, 12h retention, gp3 PVC.
# serviceMonitorSelectorNilUsesHelmValues=false so app ServiceMonitors are
# picked up regardless of release labels. Grafana still has no Ingress of its
# own: it is reached at https://admin.open-bank.tech/tools/grafana, a sub-path of
# the console served by the admin-ui `admin-ui-tools` Ingress behind an nginx
# auth_request gate (ADR-0234), so an unauthenticated request is rejected at the
# edge and never reaches this workload. `openbank-infra/scripts/grafana-local.sh`
# stays as break-glass (port-forward, local Grafana admin login — SSO does not
# complete over it, since root_url now carries the public sub-path).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.0.0
    helm:
      valuesObject:
        # Alerting plane (ADR-0082 / ADR-0077 Phase 4). Enabled with a lean
        # single replica. Unmatched alerts fall through to a no-op receiver and
        # stay visible in the Alertmanager UI + Grafana alert list; `warning`
        # and `critical` both egress to Slack (see the routing tree below).
        alertmanager:
          enabled: true
          # Single replica -> minAvailable:1 blocks ANY voluntary eviction (Karpenter
          # consolidation respects PDBs). Closes the same gap prometheus/loki/tempo
          # had: the observability NodePool's consolidationPolicy is only safe to
          # tighten from WhenEmpty because this now exists (see
          # nodepool-observability.yaml).
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          alertmanagerSpec:
            replicas: 1
            # Served as a sub-path of the console behind the identity-aware edge
            # gate (ADR-0234) — no Ingress of its own, so an unauthenticated
            # request is still rejected at the edge and never reaches this pod.
            # Silencing an alert is an operator action that today needs a
            # port-forward, which is why it effectively never happens.
            #
            # routePrefix moves the whole HTTP surface, INCLUDING /api/v2/alerts,
            # which is how Prometheus delivers alerts. The chart does NOT derive
            # the Prometheus side from this value — the live CR carries
            # pathPrefix:"/" hard-coded — so prometheusSpec.alertingEndpoints
            # below must be set in the same change or every alert silently 404s
            # on delivery. Same failure shape as the Grafana /metrics scrape in
            # #3145: nothing goes red, alerts simply stop arriving.
            routePrefix: /tools/alertmanager
            # Notification links ("view in Alertmanager") point at the gated URL.
            externalUrl: https://admin.open-bank.tech/tools/alertmanager
            # Mount the GoAlert integration URL (with its token) from a Secret so the
            # token stays out of git (ADR-0088 D1). Lands at /etc/alertmanager/secrets/
            # goalert-webhook-url/url and is referenced via webhook url_file below.
            # alertmanager-slack carries the Slack incoming-webhook URL (ESO ←
            # openbank/alertmanager SLACK_WEBHOOK); mounted at /etc/alertmanager/
            # secrets/alertmanager-slack/SLACK_WEBHOOK and read via api_url_file.
            secrets:
              - goalert-webhook-url
              - alertmanager-slack
            # On-demand observability pool (ADR-0082) — survive spot reclamation.
            nodeSelector:
              workload: observability
            tolerations:
              - key: workload
                operator: Equal
                value: observability
                effect: NoSchedule
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
          config:
            route:
              receiver: 'null'
              group_by: ['alertname', 'service']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # Davis-lite (ADR-0088): auto root-cause enrichment via HolmesGPT.
                # `continue: true` so the SAME critical alert ALSO falls through to the
                # delivery routes below — Holmes enriches, it never pages.
                - matchers:
                    - severity = "critical"
                  receiver: 'holmes-rca'
                  continue: true
                  group_interval: 10m
                  repeat_interval: 12h   # re-investigate a still-firing alert at most twice a day
                # WHY critical ALSO goes to Slack, not just GoAlert:
                # both GoAlert and the ntfy it fans out to are cluster-internal with no
                # Ingress (ADR-0056) — reaching either needs a kubectl port-forward. So a
                # `critical` alert had NO path to a human who was not already looking at
                # the cluster, while `warning` egressed to Slack: the more severe the
                # alert, the less likely anyone saw it. That inversion let a money-path
                # outage run for days unnoticed. Slack is the delivery leg that actually
                # works today; `continue: true` keeps the GoAlert leg below intact so the
                # ADR-0088 "paging inside the perimeter" design still runs (and remains
                # the eventual goal — this is delivery insurance, not a replacement).
                - matchers:
                    - severity = "critical"
                  receiver: 'slack-alerts'
                  continue: true
                  repeat_interval: 1h   # a still-unacked critical re-pings hourly (vs 4h default)
                - matchers:
                    - severity = "critical"
                  receiver: 'goalert'   # ADR-0088 §D1: page on-call via GoAlert — escalation,
                  # ack and dedup — which fans out to ntfy. In-perimeter paging.
                - matchers:
                    - severity = "warning"
                  receiver: 'slack-alerts'   # ADR-0077 Phase 4: non-paging visibility.
            receivers:
              - name: 'null'
              - name: 'holmes-rca'
                webhook_configs:
                  # In-cluster relay (components/observability/holmes-rca.yaml): turns the
                  # alert into a HolmesGPT investigation and posts the RCA to Slack + Loki.
                  # Not paging; failures here never affect the GoAlert path.
                  - url: http://holmes-rca.observability.svc:8080/alert
                    send_resolved: false
              - name: 'goalert'
                webhook_configs:
                  # GoAlert's Prometheus-Alertmanager integration parses this webhook and
                  # raises/clears alerts on the 'openbank-alerts' service (send_resolved auto-
                  # closes). The URL carries the integration token, so it is read from the
                  # mounted Secret (url_file) — never committed to git.
                  - url_file: /etc/alertmanager/secrets/goalert-webhook-url/url
                    send_resolved: true
              - name: 'slack-alerts'
                slack_configs:
                  # Delivery leg for BOTH warning and critical (see routing above) — the
                  # only receiver that reaches a human outside the cluster perimeter. The
                  # incoming-webhook URL is the secret and carries its own target channel,
                  # so it is read from the mounted Secret (api_url_file) — never committed
                  # to git. `channel` is required by the schema but the incoming webhook
                  # posts to its own bound channel. The title renders the severity, so a
                  # critical is distinguishable in the same channel.
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/SLACK_WEBHOOK
                    channel: '#openbank-alerts'
                    send_resolved: true
                    title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
                    text: >-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}
        prometheus:
          # Single replica -> minAvailable:1 blocks ANY voluntary eviction. Same
          # rationale as alertmanager above.
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          prometheusSpec:
            replicas: 1
            # Alert DELIVERY must follow alertmanagerSpec.routePrefix above. This
            # list REPLACES the chart's default endpoint rather than amending it,
            # so every field the default carried has to be repeated — it was
            # {name: kube-prometheus-stack-alertmanager, namespace: observability,
            # port: http-web, apiVersion: v2, pathPrefix: "/"} on the live CR, and
            # only pathPrefix changes here. Verify after deploy with
            # `curl .../api/v1/alertmanagers` on Prometheus: the discovered URL
            # must end in /tools/alertmanager/api/v2/alerts and the AM must be
            # listed as active, NOT merely that the pods are healthy.
            alertingEndpoints:
              - name: kube-prometheus-stack-alertmanager
                namespace: observability
                port: http-web
                apiVersion: v2
                pathPrefix: /tools/alertmanager
            # 12h retention (FinOps per ADR-0027; the 5Gi PVC below is sized for it).
            # GOTCHA (governance-as-code, ADR-0029): for Prometheus >= 3.11 the operator
            # renders this into the Prometheus *config file* (storage.tsdb.retention.time)
            # and NO LONGER passes the --storage.tsdb.retention.time CLI flag. So
            # /api/v1/status/flags reports the binary's built-in DEFAULT (15d) and is NOT
            # the effective value — that looks like GitOps drift but isn't. Verify the
            # live retention via /api/v1/status/runtimeinfo -> storageRetention (or the
            # rendered config Secret's storage.tsdb.retention.time). A retention change
            # only takes effect once the Prometheus pod reloads/restarts. Do NOT "fix"
            # the apparent 15d by bumping this value or forcing the CLI flag back.
            retention: 12h
            # Pin to the on-demand observability node pool (ADR-0082): spot
            # reclamation was killing Prometheus mid-WAL-replay every ~15-30 min.
            nodeSelector:
              workload: observability
            tolerations:
              - key: workload
                operator: Equal
                value: observability
                effect: NoSchedule
            # Accept Tempo metrics-generator remote-write (ADR-0082) and store
            # exemplars so a point on a latency histogram links straight to the
            # one slow trace that produced it.
            enableRemoteWriteReceiver: true
            enableFeatures:
              - exemplar-storage
            # Pick up ServiceMonitors/PodMonitors from any namespace without
            # requiring the chart's release label, so account-service (and the
            # rest of the fleet) can ship their own monitors.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                # 512Mi → 1Gi → 2560Mi (issue #809): measured steady-state is ~2.4Gi
                # with the current scrape fleet, so a 1Gi request under-declared
                # ~1.4Gi of real usage to the scheduler — the single biggest
                # request-vs-RSS gap in the cluster and a direct contributor to
                # node memory exhaustion. Reserve what it actually uses.
                memory: 2560Mi
              limits:
                cpu: "1"
                # 1536Mi → 3Gi: the server was OOMKilled (exit 137) during startup TSDB
                # WAL replay / head compaction, CrashLooping for days and starving the
                # money-path canary AnalysisRuns (error-rate query → connection refused),
                # which aborted every Rollout. 3Gi clears the replay peak with headroom;
                # nodes have the capacity at 12h retention.
                memory: 3Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      # FinOps 2026-06-05: 10Gi → 5Gi; with 12h retention
                      # the sandbox Prometheus never fills more than ~2Gi.
                      storage: 5Gi
        grafana:
          enabled: true
          # Security patch (ADR-0079 lifecycle): 13.0.1-security-01 -> 13.0.2.
          # Pull from our ECR Public mirror, not Docker Hub: grafana/grafana is not
          # a Docker Official Image, so the anonymous docker-hub ECR pull-through
          # rate-limited it to NotFound on fresh nodes (2026-06-27, stuck rollout).
          # Kyverno rewrite-ecr-public turns this into the ecr-public pull-through;
          # keep tag in lockstep with the mirror entry in mirror-ci-base-images.sh.
          image:
            registry: public.ecr.aws/d7v4f3x6
            repository: grafana
            tag: "13.0.2"
          defaultDashboardsTimezone: browser
          # STILL NO GRAFANA INGRESS. Grafana is reached at
          # https://admin.open-bank.tech/tools/grafana, and that path is served by
          # the admin-ui `admin-ui-tools` Ingress (ADR-0234), which puts an nginx
          # auth_request against the admin-UI session in front of it. So Grafana's
          # pre-auth surface remains off the internet exactly as ADR-0056 requires
          # — an unauthenticated request is rejected at the edge and never reaches
          # this workload. Do NOT set `ingress.enabled` here; a Kyverno policy
          # rejects an ungated Ingress in this namespace.
          #
          # Login is still Keycloak SSO (realm openbank, same users/roles as
          # admin-ui): public+PKCE client — the browser leg reaches
          # kc.open-bank.tech, the token/userinfo back-channel goes in-cluster
          # like admin-ui's KEYCLOAK_URL split. This is a SECOND, independent
          # layer: the gate decides whether the request reaches Grafana, Grafana
          # independently decides who the user is. auth.proxy is deliberately NOT
          # enabled and the gate forwards no identity headers — a header-trust
          # setup would make any pod that can reach this Service a Grafana admin.
          # Role mapping: ROLE_ADMIN -> Admin, ROLE_OPERATOR -> Editor,
          # everyone else -> Viewer.
          grafana.ini:
            server:
              # Grafana has exactly ONE root_url, and it must carry the sub-path or
              # every asset/redirect it renders points at the wrong place.
              # Consequence: openbank-infra/scripts/grafana-local.sh can no longer
              # complete an OIDC login (it redirects here); the port-forward stays
              # usable as break-glass with a local Grafana admin login.
              root_url: https://admin.open-bank.tech/tools/grafana
              # The edge does NOT strip /tools/grafana (no rewrite-target on the
              # Ingress), so Grafana must serve from the sub-path itself.
              serve_from_sub_path: true
            auth.generic_oauth:
              enabled: true
              name: OpenBank SSO
              allow_sign_up: true
              client_id: openbank-grafana
              scopes: openid profile email
              auth_url: https://kc.open-bank.tech/realms/openbank/protocol/openid-connect/auth
              token_url: http://keycloak.iam.svc:8080/realms/openbank/protocol/openid-connect/token
              api_url: http://keycloak.iam.svc:8080/realms/openbank/protocol/openid-connect/userinfo
              use_pkce: true
              use_refresh_token: true
              login_attribute_path: preferred_username
              name_attribute_path: name
              email_attribute_path: email
              role_attribute_path: contains(realm_access.roles[*], 'ROLE_ADMIN') && 'Admin' || (contains(realm_access.roles[*], 'ROLE_OPERATOR') && 'Editor' || 'Viewer')
          # serve_from_sub_path makes Grafana 301 every root path to the sub-path,
          # and it renders that redirect as an ABSOLUTE URL on root_url — so the
          # chart-default `/metrics` scrape was answered with a redirect out to
          # https://admin.open-bank.tech/tools/grafana/metrics, which Prometheus
          # followed to the public edge and got the gate's login redirect instead
          # of metrics. Grafana's own telemetry therefore stopped at the moment
          # the sub-path landed, with nothing red anywhere: the ServiceMonitor was
          # healthy, the target was "up", and it was scraping a login page.
          # Scrape the sub-path directly so no redirect is involved.
          serviceMonitor:
            enabled: true
            path: /tools/grafana/metrics
          # Sentry-protocol datasource plugin so GlitchTip mobile crashes
          # (ADR-0075) sit on the same pane as backend telemetry (ADR-0082).
          plugins:
            - grafana-sentry-datasource
            # Polystat hex-grid panel for the SOC "fleet error budget" view
            # (per-service health as colored hexagons). Latest compatible build
            # resolved by Grafana at startup, like the sentry datasource above.
            - grafana-polystat-panel
            # ClickHouse datasource for the business warehouse (ADR-0022). The
            # warehouse has been fed in production for months
            # (ANALYTICS_SINK_TYPE=clickhouse) and carries a gold layer — daily
            # event volume, the onboarding funnel, screen feedback — whose own DDL
            # comment says gold marts are "where Metabase/Superset dashboards
            # point". No BI tool was ever deployed and Grafana had no ClickHouse
            # datasource, so the only consumer of the whole warehouse was
            # admin-ui's customer-360 route. Business reporting ran on Prometheus
            # instead, which is a 7-day-retention TSDB and cannot answer a
            # question about last quarter.
            - grafana-clickhouse-datasource
          # GlitchTip API token, injected from the ESO-managed grafana-glitchtip
          # Secret (components/external-secrets/es-grafana-glitchtip.yaml).
          # optional:true → Grafana stays healthy before the token is in Vault;
          # the datasource simply can't query until it is wired.
          envValueFrom:
            GLITCHTIP_API_TOKEN:
              secretKeyRef:
                name: grafana-glitchtip
                key: token
                optional: true
            # ClickHouse `analytics` user password, from the ESO-managed
            # grafana-clickhouse Secret (components/external-secrets/es-grafana-clickhouse.yaml).
            # Same optional:true trade as above — Grafana boots before the secret
            # exists, and only the ClickHouse datasource is unable to query.
            CLICKHOUSE_PASSWORD:
              secretKeyRef:
                name: grafana-clickhouse
                key: password
                optional: true
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              # 128Mi → 384Mi (issue #809): measured steady-state ~340Mi sat just
              # under the old 384Mi limit while the request declared a third of it.
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # We define Prometheus + Tempo ourselves (below) to wire the full
          # correlation web, so disable the chart's auto-provisioned default.
          sidecar:
            datasources:
              defaultDatasourceEnabled: false
          # The correlation backbone (ADR-0082). Every datasource cross-links to
          # the others via trace_id, so one click pivots metrics<->traces<->logs.
          additionalDataSources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://kube-prometheus-stack-prometheus.observability.svc:9090
              isDefault: true
              jsonData:
                httpMethod: POST
                # Exemplar on any metric -> jump to the trace in Tempo.
                exemplarTraceIdDestinations:
                  - name: trace_id
                    datasourceUid: tempo
                    urlDisplayLabel: "View trace"
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.observability.svc:3200
              jsonData:
                # span -> its logs (Alloy populated trace_id in Loki).
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: '-1h'
                  spanEndTimeShift: '1h'
                # span -> RED metrics from the metrics-generator.
                tracesToMetrics:
                  datasourceUid: prometheus
                  spanStartTimeShift: '-1h'
                  spanEndTimeShift: '1h'
                  queries:
                    - name: 'Request rate'
                      query: 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))'
                    - name: 'Error rate'
                      query: 'sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR",$__tags}[5m]))'
                # Auto service map + node graph from service-graph metrics.
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                lokiSearch:
                  datasourceUid: loki
                # span -> CPU/alloc flame graph in Pyroscope (ADR-0082).
                tracesToProfiles:
                  datasourceUid: pyroscope
                  profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
                  tags:
                    - key: service.name
                      value: service_name
            - name: Pyroscope
              type: grafana-pyroscope-datasource
              uid: pyroscope
              access: proxy
              url: http://pyroscope.observability.svc:4040
            # Mobile crash & release health (ADR-0075) via the Sentry protocol.
            # Events carry X-Correlation-ID + party_id, so a crash pivots to its
            # backend Tempo trace/Loki logs by correlationId (ADR-0082).
            - name: GlitchTip
              type: grafana-sentry-datasource
              uid: glitchtip
              access: proxy
              # IN-CLUSTER service, NOT the public host. The glitchtip.open-bank.tech
              # ingress deliberately routes ONLY the ingest paths
              # (/api/<n>/(store|envelope|security|minidump|unreal)/) so the UI/API are
              # not exposed publicly — so the public host 404s the /api/0/... query API
              # the sentry datasource needs. Grafana runs in-cluster, so it queries the
              # full API straight on the web Service. (Verified: /api/0/organizations/ →
              # 200, org slug "openbank".)
              url: http://glitchtip-web.observability.svc
              jsonData:
                url: http://glitchtip-web.observability.svc
                orgSlug: openbank
              secureJsonData:
                authToken: $GLITCHTIP_API_TOKEN
            # Business warehouse (ADR-0022). NOT part of the trace correlation web
            # above — this is the analytical plane: months of history at daily
            # grain, answering "how many accounts did we open last quarter", which
            # Prometheus structurally cannot (7-day retention, ADR-0088 D3) and
            # which a counter reset by every pod restart cannot either.
            - name: ClickHouse
              type: grafana-clickhouse-datasource
              uid: clickhouse
              # HTTP protocol on 8123, matching the single port opened by
              # components/analytics/clickhouse-grafana-network-policy.yaml. The
              # native protocol on 9000 stays closed.
              jsonData:
                host: clickhouse.analytics.svc
                port: 8123
                protocol: http
                secure: false
                username: analytics
                defaultDatabase: openbank_analytics
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD
        nodeExporter:
          enabled: true
        # Pin node-exporter straight at the ECR pull-through cache rather than letting
        # Kyverno's rewrite-quay rule do it. That policy is a mutating webhook with
        # failurePolicy: Ignore — it FAILS OPEN, so a pod admitted while Kyverno is
        # momentarily unreachable keeps the quay.io ref and containerd pulls it over
        # NAT. Proven here on 2026-07-16: two node-exporter pods created that morning
        # carried the rewritten ECR ref, while the one created at 00:44 was still on
        # quay.io — same DaemonSet, same day, different outcome. A DaemonSet pays that
        # on EVERY new node, which is the leak the Karpenter overnight consolidation
        # freeze in main.tf works around (~100 GB/night, $4-5).
        # `image` here is the prometheus-node-exporter SUBCHART's key, not the parent's
        # (verified: helm show values prometheus-community/prometheus-node-exporter ->
        # registry: quay.io, repository: prometheus/node-exporter). distroless stays
        # true, so the chart keeps resolving the -distroless tag suffix; the
        # pull-through mirrors the tag verbatim.
        prometheus-node-exporter:
          image:
            registry: 265175468565.dkr.ecr.eu-north-1.amazonaws.com
            repository: quay/prometheus/node-exporter
        # EKS managed control plane: AWS runs (and hides) kube-controller-manager,
        # kube-scheduler, etcd and kube-proxy — none expose scrapeable metrics
        # endpoints to the cluster. Leaving these chart defaults enabled created
        # ServiceMonitors pointing at non-existent control-plane endpoints, whose
        # "target down" rules fire KubeControllerManagerDown / KubeSchedulerDown as
        # permanent false-positive criticals. Disabling each component drops both
        # its ServiceMonitor and the matching default alert rules (ADR-0088 D1 —
        # found while wiring ntfy last-mile, 2026-06-13).
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
