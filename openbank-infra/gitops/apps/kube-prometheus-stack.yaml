# Metrics plane: Prometheus + Grafana + kube-state-metrics + node-exporter +
# alertmanager (enabled, with the routing tree configured below). Lean FinOps
# sizing per ADR-0027: single Prometheus replica, 30d retention (ADR-0088 D3), gp3 PVC.
# serviceMonitorSelectorNilUsesHelmValues=false so app ServiceMonitors are
# picked up regardless of release labels. Grafana still has no Ingress of its
# own: it is reached at https://admin.open-bank.tech/tools/grafana, a sub-path of
# the console served by the admin-ui `admin-ui-tools` Ingress behind an nginx
# auth_request gate (ADR-0234), so an unauthenticated request is rejected at the
# edge and never reaches this workload. `openbank-infra/scripts/grafana-local.sh`
# stays as break-glass (port-forward, local Grafana admin login — SSO does not
# complete over it, since root_url now carries the public sub-path).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.9.0
    helm:
      valuesObject:
        # Alerting plane (ADR-0082 / ADR-0077 Phase 4). Enabled with a lean
        # single replica. Unmatched alerts fall through to a no-op receiver and
        # stay visible in the Alertmanager UI + Grafana alert list; `warning`
        # and `critical` both egress to Slack (see the routing tree below).
        # KubeJobFailed (kubernetes-mixin) fires on `kube_job_failed > 0`, i.e. on the
        # EXISTENCE of a failed Job object. A CronJob keeps its last failed Jobs
        # (failedJobsHistoryLimit) next to the successful runs that followed, so the
        # alert stays lit for days after the cron recovered. Measured 2026-09-30:
        # seven KubeJobFailed firing, six of them for crons whose next run had
        # succeeded (arc-stuck-runner-reaper, journey-*, argocd-sync-verifier,
        # keycloak-realm-drift, sbom-drift-scanner); the one real failure
        # (cloud-finops-collector) was indistinguishable from the six. Replaced by
        # CronJobLatestRunFailed + JobFailed in prometheus-rules-jobs.yaml, which
        # alert on the LATEST run of each CronJob and on Jobs no CronJob owns.
        defaultRules:
          disabled:
            KubeJobFailed: true
        alertmanager:
          enabled: true
          # Single replica -> minAvailable:1 blocks ANY voluntary eviction (Karpenter
          # consolidation respects PDBs). Closes the same gap prometheus/loki/tempo
          # had: the observability NodePool's consolidationPolicy is only safe to
          # tighten from WhenEmpty because this now exists (see
          # nodepool-observability.yaml).
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          alertmanagerSpec:
            replicas: 1
            # Served as a sub-path of the console behind the identity-aware edge
            # gate (ADR-0234) — no Ingress of its own, so an unauthenticated
            # request is still rejected at the edge and never reaches this pod.
            # Silencing an alert is an operator action that today needs a
            # port-forward, which is why it effectively never happens.
            #
            # routePrefix moves the whole HTTP surface, INCLUDING /api/v2/alerts,
            # which is how Prometheus delivers alerts. The chart does NOT derive
            # the Prometheus side from this value — the live CR carries
            # pathPrefix:"/" hard-coded — so prometheusSpec.alertingEndpoints
            # below must be set in the same change or every alert silently 404s
            # on delivery. Same failure shape as the Grafana /metrics scrape in
            # #3145: nothing goes red, alerts simply stop arriving.
            routePrefix: /tools/alertmanager
            # Notification links ("view in Alertmanager") point at the gated URL.
            externalUrl: https://admin.open-bank.tech/tools/alertmanager
            # Mount the GoAlert integration URL (with its token) from a Secret so the
            # token stays out of git (ADR-0088 D1). Lands at /etc/alertmanager/secrets/
            # goalert-webhook-url/url and is referenced via webhook url_file below.
            # alertmanager-slack carries the Slack incoming-webhook URL (ESO ←
            # openbank/alertmanager SLACK_WEBHOOK); mounted at /etc/alertmanager/
            # secrets/alertmanager-slack/SLACK_WEBHOOK and read via api_url_file.
            secrets:
              - goalert-webhook-url
              - alertmanager-slack
              # Dead-man heartbeat URL (route `deadman`). Created by the ops step that makes
              # the GoAlert heartbeat monitor (#11666) and owned by nobody else — see below.
              # It MUST exist before this list changes: the operator mounts these as
              # non-optional volumes, so a missing Secret holds Alertmanager in
              # ContainerCreating on its next restart.
              - alertmanager-deadman
            # On-demand observability pool (ADR-0082) — survive spot reclamation.
            nodeSelector:
              workload: observability
            tolerations:
              - key: workload
                operator: Equal
                value: observability
                effect: NoSchedule
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
          config:
            # inhibit_rules REPLACES the chart's default list, so the four chart defaults are
            # restated verbatim (read from the live generated config 2026-10-03) and the
            # volume-floor rule is added (prometheus-rules-slo-volume.yaml).
            inhibit_rules:
              - source_matchers: ['severity = critical']
                target_matchers: ['severity =~ warning|info']
                equal: ['namespace', 'alertname']
              - source_matchers: ['severity = warning']
                target_matchers: ['severity = info']
                equal: ['namespace', 'alertname']
              - source_matchers: ['alertname = InfoInhibitor']
                target_matchers: ['severity = info']
                equal: ['namespace']
              - target_matchers: ['alertname = InfoInhibitor']
              - source_matchers: ['alertname = SLOBelowVolumeFloor']
                target_matchers: ['alertname = ErrorBudgetBurn']
                equal: ['slo']
            route:
              receiver: 'null'
              group_by: ['alertname', 'service']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # DEAD-MAN SWITCH. `Watchdog` is the always-firing alert kube-prometheus-
                # stack ships precisely so that its ABSENCE can be noticed. Until
                # 2026-09-30 it carried severity=none, matched no route below and fell
                # into the root `null` receiver — so if Prometheus, Alertmanager or the
                # whole observability pool died, the one signal designed to say so went
                # nowhere. Route it, first and unconditionally, to a GoAlert heartbeat
                # monitor: GoAlert pages (via ntfy + the on-call policy) when the beat
                # stops. The heartbeat URL lives in its own Secret `alertmanager-deadman`
                # (key `url`). It was first put into `goalert-webhook-url` next to the paging
                # URL; ESO owns that Secret (creationPolicy Owner) and rewrites its whole
                # `data` on every sync, so the key vanished within the hour — mergePolicy
                # Merge governs the template, not keys written from outside (2026-10-01).
                # While the key is missing, this receiver's url_file does not exist,
                # every send fails and AlertmanagerFailedToSendAlerts reaches Slack via the
                # route just below — which is the correct, visible state for "the dead-man
                # is not wired yet", never a silent one.
                - matchers:
                    - alertname = "Watchdog"
                  receiver: 'deadman'
                  group_by: ['...']   # check-critical-alert-egress treats any GoAlert-bound route alike
                  group_wait: 0s
                  group_interval: 1m
                  repeat_interval: 1m
                # Notification-DELIVERY meta-alerts must never depend on the very
                # receiver they are reporting as broken (#11136): GoAlert's webhook
                # integration was rejecting ~98% of notifications with HTTP 400
                # "too many unacknowledged alerts for this service", and both
                # AlertmanagerFailedToSendAlerts (severity=warning, kube-prometheus-
                # stack's default alertmanager.rules mixin) and
                # AlertmanagerClusterFailedToSendAlerts (severity=critical for the
                # variant that actually fires — the mixin's "non-critical" copy has a
                # `integration!~".*"` expr that can never match anything) end up on
                # the same severity-keyed routes as every other alert below. Matching
                # by alertname here, ahead of everything else, means delivery to Slack
                # no longer depends on severity staying whatever it happens to be
                # today — a future relabel or mixin bump can't silently regress this.
                # continue: true so the alert still falls through into the ordinary
                # severity-based routes underneath: Slack is the guaranteed leg,
                # GoAlert stays a best-effort second attempt on top of it, matching the
                # same "Slack first, GoAlert always attempted too" asymmetry already
                # used for `severity = "critical"` below.
                - matchers:
                    - alertname =~ "^Alertmanager(Cluster)?FailedToSendAlerts$"
                  receiver: 'slack-alerts'
                  continue: true
                # Davis-lite (ADR-0088): auto root-cause enrichment via HolmesGPT.
                # `continue: true` so the SAME critical alert ALSO falls through to the
                # delivery routes below — Holmes enriches, it never pages.
                - matchers:
                    - severity = "critical"
                  receiver: 'holmes-rca'
                  continue: true
                  group_interval: 10m
                  repeat_interval: 12h   # re-investigate a still-firing alert at most twice a day
                # WHY critical ALSO goes to Slack, not just GoAlert:
                # both GoAlert and the ntfy it fans out to are cluster-internal with no
                # Ingress (ADR-0056) — reaching either needs a kubectl port-forward. So a
                # `critical` alert had NO path to a human who was not already looking at
                # the cluster, while `warning` egressed to Slack: the more severe the
                # alert, the less likely anyone saw it. That inversion let a money-path
                # outage run for days unnoticed. Slack is the delivery leg that actually
                # works today; `continue: true` keeps the GoAlert leg below intact so the
                # ADR-0088 "paging inside the perimeter" design still runs (and remains
                # the eventual goal — this is delivery insurance, not a replacement).
                - matchers:
                    - severity = "critical"
                  receiver: 'slack-alerts'
                  continue: true
                  repeat_interval: 1h   # a still-unacked critical re-pings hourly (vs 4h default)
                - matchers:
                    - severity = "critical"
                  receiver: 'goalert'   # ADR-0088 §D1: page on-call via GoAlert — escalation,
                  # ack and dedup — which fans out to ntfy. In-perimeter paging.
                  # ONE ALERT PER NOTIFICATION GROUP (#11136). GoAlert's Alertmanager
                  # integration dedups on the SUMMARY: CommonAnnotations.summary, else
                  # "alertname <instance>,<instance>,...". Under the inherited
                  # ['alertname','service'] grouping that string followed group membership,
                  # so each membership change opened a NEW GoAlert alert and the final
                  # `resolved` carried yet another summary and closed nothing. The orphans
                  # (send_resolved was never the problem) piled up to GoAlert's
                  # unacked_alerts_per_service limit of 200, after which it answered EVERY
                  # page with HTTP 400 and Alertmanager, treating 4xx as unrecoverable,
                  # dropped it. '...' makes the summary the alert's own, so the resolve
                  # matches it. Enforced by check-critical-alert-egress.py, together with
                  # "no $value in a critical summary" (the same drift, over time).
                  group_by: ['...']
                - matchers:
                    - severity = "warning"
                  receiver: 'slack-alerts'   # ADR-0077 Phase 4: non-paging visibility.
            receivers:
              - name: 'null'
              - name: 'holmes-rca'
                webhook_configs:
                  # In-cluster relay (components/observability/holmes-rca.yaml): turns the
                  # alert into a HolmesGPT investigation and posts the RCA to Slack + Loki.
                  # Not paging; failures here never affect the GoAlert path.
                  - url: http://holmes-rca.observability.svc:8080/alert
                    send_resolved: false
              - name: 'deadman'
                webhook_configs:
                  # GoAlert heartbeat endpoint (POST /api/v2/heartbeat/<key>); any body is
                  # accepted, so Alertmanager's webhook payload is fine. One beat a minute,
                  # heartbeat timeout set to 5m in GoAlert. send_resolved is meaningless
                  # for a signal whose value is that it never resolves.
                  - url_file: /etc/alertmanager/secrets/alertmanager-deadman/url
                    send_resolved: false
              - name: 'goalert'
                webhook_configs:
                  # GoAlert's Prometheus-Alertmanager integration parses this webhook and
                  # raises/clears alerts on the 'openbank-alerts' service (send_resolved auto-
                  # closes). The URL carries the integration token, so it is read from the
                  # mounted Secret (url_file) — never committed to git.
                  - url_file: /etc/alertmanager/secrets/goalert-webhook-url/url
                    send_resolved: true
              - name: 'slack-alerts'
                slack_configs:
                  # Delivery leg for BOTH warning and critical (see routing above) — the
                  # only receiver that reaches a human outside the cluster perimeter. The
                  # incoming-webhook URL is the secret and carries its own target channel,
                  # so it is read from the mounted Secret (api_url_file) — never committed
                  # to git. `channel` is required by the schema but the incoming webhook
                  # posts to its own bound channel. The title renders the severity, so a
                  # critical is distinguishable in the same channel.
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/SLACK_WEBHOOK
                    channel: '#openbank-alerts'
                    send_resolved: true
                    title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
                    text: >-
                      {{ range .Alerts }}{{ .Annotations.summary }}
                      {{ .Annotations.description }}
                      {{ end }}
        prometheus:
          # Single replica -> minAvailable:1 blocks ANY voluntary eviction. Same
          # rationale as alertmanager above.
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          prometheusSpec:
            replicas: 1
            # Alert DELIVERY must follow alertmanagerSpec.routePrefix above. This
            # list REPLACES the chart's default endpoint rather than amending it,
            # so every field the default carried has to be repeated — it was
            # {name: kube-prometheus-stack-alertmanager, namespace: observability,
            # port: http-web, apiVersion: v2, pathPrefix: "/"} on the live CR, and
            # only pathPrefix changes here. Verify after deploy with
            # `curl .../api/v1/alertmanagers` on Prometheus: the discovered URL
            # must end in /tools/alertmanager/api/v2/alerts and the AM must be
            # listed as active, NOT merely that the pods are healthy.
            alertingEndpoints:
              - name: kube-prometheus-stack-alertmanager
                namespace: observability
                port: http-web
                apiVersion: v2
                pathPrefix: /tools/alertmanager
            # 12h retention (FinOps per ADR-0027; the 5Gi PVC below is sized for it).
            # GOTCHA (governance-as-code, ADR-0029): for Prometheus >= 3.11 the operator
            # renders this into the Prometheus *config file* (storage.tsdb.retention.time)
            # and NO LONGER passes the --storage.tsdb.retention.time CLI flag. So
            # /api/v1/status/flags reports the binary's built-in DEFAULT (15d) and is NOT
            # the effective value — that looks like GitOps drift but isn't. Verify the
            # live retention via /api/v1/status/runtimeinfo -> storageRetention (or the
            # rendered config Secret's storage.tsdb.retention.time). A retention change
            # only takes effect once the Prometheus pod reloads/restarts. Do NOT "fix"
            # the apparent 15d by bumping this value or forcing the CLI flag back.
            #
            # 12h -> 30d (2026-09-30). 12h was FinOps-right for a sandbox and wrong for
            # everything built on top of it since: 20 Pyrra SLOs declare `window: 30d`,
            # prometheus-rules-forecast/-capacity extrapolate trends, and 418
            # `:increase30d` recording series existed — all evaluated over a store whose
            # oldest sample was 13 hours old (measured: prometheus_tsdb_lowest_timestamp
            # = 0.55d). An error budget over 30d computed from 12h of data is a number
            # with no meaning, and ADR-0088 D3 names >=30d as the audit window for
            # SLO evidence. Sizing, measured live: 2.29 GiB of blocks + 0.77 GiB WAL at
            # 12h, 789k head series, 22.3k samples/s -> ~4.6 GiB/day -> ~85 GiB at
            # 30d before compaction gains. gp3 at that size is ~$8/month.
            # `retentionSize` is the hard ceiling below the PVC so a cardinality
            # regression evicts old blocks instead of filling the disk.
            #
            # 85GB -> 150GB (2026-10-03). The sizing above multiplied wrong:
            # 4.6 per day x 30d is ~138, not 85, and size-based retention wins
            # over time-based, so at 85GB the store would have started evicting at
            # ~day 20 and every `window: 30d` SLO would again be computed over data
            # that does not exist -- just 20 days of it instead of 12 hours.
            # Measured on the 30d store itself (blocks are already compacted, so
            # this is net of compaction): prometheus_tsdb_storage_blocks_bytes
            # 5.0 GB -> 11.9 GB between 10-02T05Z and 10-03T17Z = 4.6 GB/day,
            # 1.73 bytes/sample at 27.2k samples/s, 870k head series. 30d = ~138e9
            # bytes = ~129 GiB. Prometheus reads this unit as base-2 (the old 85GB
            # reads back as prometheus_tsdb_retention_limit_bytes = 91.3e9), so
            # 150GB = 150 GiB leaves ~16% for series growth. If the history is ever cut short
            # by size anyway, PrometheusHistoryTruncatedBySize
            # (prometheus-rules-prometheus-retention.yaml) says so instead of the
            # SLO numbers quietly shrinking their window.
            retention: 30d
            retentionSize: 150GB
            # Pin to the on-demand observability node pool (ADR-0082): spot
            # reclamation was killing Prometheus mid-WAL-replay every ~15-30 min.
            nodeSelector:
              workload: observability
            tolerations:
              - key: workload
                operator: Equal
                value: observability
                effect: NoSchedule
            # Accept Tempo metrics-generator remote-write (ADR-0082) and store
            # exemplars so a point on a latency histogram links straight to the
            # one slow trace that produced it.
            enableRemoteWriteReceiver: true
            enableFeatures:
              - exemplar-storage
            # Pick up ServiceMonitors/PodMonitors from any namespace without
            # requiring the chart's release label, so account-service (and the
            # rest of the fleet) can ship their own monitors.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                # 512Mi → 1Gi → 2560Mi (issue #809): measured steady-state is ~2.4Gi
                # with the current scrape fleet, so a 1Gi request under-declared
                # ~1.4Gi of real usage to the scheduler — the single biggest
                # request-vs-RSS gap in the cluster and a direct contributor to
                # node memory exhaustion. Reserve what it actually uses.
                # 2560Mi -> 4Gi (2026-10-08): see the limit below; the request
                # now covers the measured steady state instead of sitting under it.
                memory: 4Gi
              limits:
                cpu: "1"
                # 1536Mi → 3Gi: the server was OOMKilled (exit 137) during startup TSDB
                # WAL replay / head compaction, CrashLooping for days and starving the
                # money-path canary AnalysisRuns (error-rate query → connection refused),
                # which aborted every Rollout. 3Gi clears the replay peak with headroom;
                # nodes have the capacity at 12h retention.
                #
                # 3Gi -> 5Gi (2026-10-08). 3Gi was sized at 12h retention; the 30d
                # store above (since 2026-09-30) made it wrong without changing a
                # single series. Measured live: head series 0.8-1.35M (stable over
                # 14d -- no cardinality jump), working set pinned at 2.87-3.05 GiB
                # every 6h window since 10-01, i.e. at the operator-derived
                # GOMEMLIMIT (90% of the limit, 2.70 GiB), so the GC ran flat out
                # and every 2h head compaction pushed it over: 12 OOMKills since
                # 10-04, the one on 10-08 during a head-block write. Each restart
                # costs ~2-3 min of WAL replay, during which canary AnalysisRuns
                # get connection refused and abort the Rollout. 1.35M peak series
                # x ~3 KiB (head + postings + compaction buffers) is ~4 GiB, so
                # 4Gi request / 5Gi limit leaves ~1 GiB above the observed peak
                # for compaction of the larger 30d blocks. Does not fit beside the
                # current neighbours on an 8 GiB observability node; Karpenter
                # provisions in the PVC's zone (pool allows m/r, >7.5 GiB).
                memory: 5Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      # FinOps 2026-06-05: 10Gi → 5Gi; with 12h retention
                      # the sandbox Prometheus never fills more than ~2Gi.
                      # 2026-09-30: 100Gi for the 30d retention above (85GB
                      # retentionSize + WAL + compaction headroom). The operator does
                      # not resize a live PVC: after merge, patch it once —
                      #   kubectl -n observability patch pvc prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0 -p '{"spec":{"resources":{"requests":{"storage":"100Gi"}}}}'
                      # gp3 allowVolumeExpansion is true; the filesystem grows online.
                      # 2026-10-03: 100Gi -> 180Gi for retentionSize 150GB (see above):
                      # 150 GB blocks + ~1 GB WAL + room for the largest compaction
                      # (a 10%-of-retention block, ~14 GB, is rewritten beside the
                      # old ones) = ~165 GB. Same one-time patch after merge, with
                      # "180Gi" in place of "100Gi".
                      storage: 180Gi
        grafana:
          enabled: true
          # ADR-0079 lifecycle: 13.0.2 -> 13.2.3 (latest 13.2.x; kps subchart default is 13.2.2).
          # Pull from our ECR Public mirror, not Docker Hub: grafana/grafana is not
          # a Docker Official Image, so the anonymous docker-hub ECR pull-through
          # rate-limited it to NotFound on fresh nodes (2026-06-27, stuck rollout).
          # Kyverno rewrite-ecr-public turns this into the ecr-public pull-through;
          # keep tag in lockstep with the mirror entry in mirror-ci-base-images.sh.
          image:
            registry: public.ecr.aws/d7v4f3x6
            repository: grafana
            tag: "13.2.3"
          defaultDashboardsTimezone: browser
          # STILL NO GRAFANA INGRESS. Grafana is reached at
          # https://admin.open-bank.tech/tools/grafana, and that path is served by
          # the admin-ui `admin-ui-tools` Ingress (ADR-0234), which puts an nginx
          # auth_request against the admin-UI session in front of it. So Grafana's
          # pre-auth surface remains off the internet exactly as ADR-0056 requires
          # — an unauthenticated request is rejected at the edge and never reaches
          # this workload. Do NOT set `ingress.enabled` here; a Kyverno policy
          # rejects an ungated Ingress in this namespace.
          #
          # Login is still Keycloak SSO (realm openbank, same users/roles as
          # admin-ui): public+PKCE client — the browser leg reaches
          # kc.open-bank.tech, the token/userinfo back-channel goes in-cluster
          # like admin-ui's KEYCLOAK_URL split. This is a SECOND, independent
          # layer: the gate decides whether the request reaches Grafana, Grafana
          # independently decides who the user is. auth.proxy is deliberately NOT
          # enabled and the gate forwards no identity headers — a header-trust
          # setup would make any pod that can reach this Service a Grafana admin.
          # Role mapping: ROLE_ADMIN -> Admin, ROLE_OPERATOR -> Editor,
          # everyone else -> Viewer.
          grafana.ini:
            server:
              # Grafana has exactly ONE root_url, and it must carry the sub-path or
              # every asset/redirect it renders points at the wrong place.
              # Consequence: openbank-infra/scripts/grafana-local.sh can no longer
              # complete an OIDC login (it redirects here); the port-forward stays
              # usable as break-glass with a local Grafana admin login.
              root_url: https://admin.open-bank.tech/tools/grafana
              # The edge does NOT strip /tools/grafana (no rewrite-target on the
              # Ingress), so Grafana must serve from the sub-path itself.
              serve_from_sub_path: true
            security:
              # ADR-0286: the Admin UI /reporting page embeds the business-warehouse
              # dashboard in a same-origin iframe (admin.open-bank.tech framing
              # admin.open-bank.tech/tools/grafana). The default allow_embedding=false
              # makes Grafana answer X-Frame-Options: deny, which the browser renders
              # as "refused to connect" — measured on the sandbox 2026-09-07. The
              # admin-ui-tools ingress deliberately sets no X-Frame-Options of its own,
              # so with this enabled the same-origin frame passes; cross-origin framing
              # remains blocked by the browser only as far as SSO redirects allow, and
              # the gate (auth-url /api/gate) still authenticates every request first.
              allow_embedding: true
            auth.generic_oauth:
              enabled: true
              name: OpenBank SSO
              allow_sign_up: true
              client_id: openbank-grafana
              scopes: openid profile email
              auth_url: https://kc.open-bank.tech/realms/openbank/protocol/openid-connect/auth
              token_url: http://keycloak.iam.svc:8080/realms/openbank/protocol/openid-connect/token
              api_url: http://keycloak.iam.svc:8080/realms/openbank/protocol/openid-connect/userinfo
              use_pkce: true
              use_refresh_token: true
              # ADR-0286 / #9216: without auto_login the /reporting iframe first
              # renders Grafana's login page and makes the operator click through
              # SSO by hand; with it, the embed bounces straight to Keycloak and
              # back (transparent with an existing portal SSO session, and the
              # realm CSP allowlists admin.open-bank.tech as a frame ancestor).
              auto_login: true
              login_attribute_path: preferred_username
              name_attribute_path: name
              email_attribute_path: email
              # ROLE_DEMO is checked FIRST and pins the public demo account to
              # Viewer. demo@openbank.local's credentials are handed out, and in
              # the sandbox realm it carries ROLE_ADMIN + ROLE_OPERATOR so that it
              # can show every console page — which would otherwise make it a
              # Grafana ADMIN the moment ADR-0234 gave Grafana a route, granting
              # Explore against Prometheus, Loki and Tempo, i.e. the raw log
              # stream. jmespath `||` short-circuits, so order is the whole
              # mechanism here: put ROLE_DEMO after the ADMIN test and it never
              # fires. The gate (`/api/gate`) already refuses ROLE_DEMO outright;
              # this is the second, independent layer, so widening the gate later
              # cannot silently promote the public account.
              role_attribute_path: contains(realm_access.roles[*], 'ROLE_DEMO') && 'Viewer' || (contains(realm_access.roles[*], 'ROLE_ADMIN') && 'Admin' || (contains(realm_access.roles[*], 'ROLE_OPERATOR') && 'Editor' || 'Viewer'))
          # serve_from_sub_path makes Grafana 301 every root path to the sub-path,
          # and it renders that redirect as an ABSOLUTE URL on root_url — so the
          # chart-default `/metrics` scrape was answered with a redirect out to
          # https://admin.open-bank.tech/tools/grafana/metrics, which Prometheus
          # followed to the public edge and got the gate's login redirect instead
          # of metrics. Grafana's own telemetry therefore stopped at the moment
          # the sub-path landed, with nothing red anywhere: the ServiceMonitor was
          # healthy, the target was "up", and it was scraping a login page.
          # Scrape the sub-path directly so no redirect is involved.
          serviceMonitor:
            enabled: true
            path: /tools/grafana/metrics
          # Sentry-protocol datasource plugin so GlitchTip mobile crashes
          # (ADR-0075) sit on the same pane as backend telemetry (ADR-0082).
          plugins:
            - grafana-sentry-datasource
            # Polystat hex-grid panel for the SOC "fleet error budget" view
            # (per-service health as colored hexagons). Latest compatible build
            # resolved by Grafana at startup, like the sentry datasource above.
            - grafana-polystat-panel
            # ClickHouse datasource for the business warehouse (ADR-0022). The
            # warehouse has been fed in production for months
            # (ANALYTICS_SINK_TYPE=clickhouse) and carries a gold layer — daily
            # event volume, the onboarding funnel, screen feedback — whose own DDL
            # comment says gold marts are "where Metabase/Superset dashboards
            # point". No BI tool was ever deployed and Grafana had no ClickHouse
            # datasource, so the only consumer of the whole warehouse was
            # admin-ui's customer-360 route. Business reporting ran on Prometheus
            # instead, which is a 7-day-retention TSDB and cannot answer a
            # question about last quarter.
            - grafana-clickhouse-datasource
          # GlitchTip API token, injected from the ESO-managed grafana-glitchtip
          # Secret (components/external-secrets/es-grafana-glitchtip.yaml).
          # optional:true → Grafana stays healthy before the token is in Vault;
          # the datasource simply can't query until it is wired.
          envValueFrom:
            GLITCHTIP_API_TOKEN:
              secretKeyRef:
                name: grafana-glitchtip
                key: token
                optional: true
            # ClickHouse `analytics` user password, from the ESO-managed
            # grafana-clickhouse Secret (components/external-secrets/es-grafana-clickhouse.yaml).
            # Same optional:true trade as above — Grafana boots before the secret
            # exists, and only the ClickHouse datasource is unable to query.
            CLICKHOUSE_PASSWORD:
              secretKeyRef:
                name: grafana-clickhouse
                key: password
                optional: true
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              # 128Mi → 384Mi (issue #809): measured steady-state ~340Mi sat just
              # under the old 384Mi limit while the request declared a third of it.
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # We define Prometheus + Tempo ourselves (below) to wire the full
          # correlation web, so disable the chart's auto-provisioned default.
          sidecar:
            datasources:
              defaultDatasourceEnabled: false
          # The correlation backbone (ADR-0082). Every datasource cross-links to
          # the others via trace_id, so one click pivots metrics<->traces<->logs.
          additionalDataSources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://kube-prometheus-stack-prometheus.observability.svc:9090
              isDefault: true
              jsonData:
                httpMethod: POST
                # Exemplar on any metric -> jump to the trace in Tempo.
                exemplarTraceIdDestinations:
                  - name: trace_id
                    datasourceUid: tempo
                    urlDisplayLabel: "View trace"
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.observability.svc:3200
              jsonData:
                # span -> its logs (Alloy populated trace_id in Loki).
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: '-1h'
                  spanEndTimeShift: '1h'
                # span -> RED metrics from the metrics-generator.
                tracesToMetrics:
                  datasourceUid: prometheus
                  spanStartTimeShift: '-1h'
                  spanEndTimeShift: '1h'
                  queries:
                    - name: 'Request rate'
                      query: 'sum(rate(traces_spanmetrics_calls_total{$__tags}[5m]))'
                    - name: 'Error rate'
                      query: 'sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR",$__tags}[5m]))'
                # Auto service map + node graph from service-graph metrics.
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                lokiSearch:
                  datasourceUid: loki
                # span -> CPU/alloc flame graph in Pyroscope (ADR-0082).
                tracesToProfiles:
                  datasourceUid: pyroscope
                  profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
                  tags:
                    - key: service.name
                      value: service_name
            - name: Pyroscope
              type: grafana-pyroscope-datasource
              uid: pyroscope
              access: proxy
              url: http://pyroscope.observability.svc:4040
            # Mobile crash & release health (ADR-0075) via the Sentry protocol.
            # Events carry X-Correlation-ID + party_id, so a crash pivots to its
            # backend Tempo trace/Loki logs by correlationId (ADR-0082).
            - name: GlitchTip
              type: grafana-sentry-datasource
              uid: glitchtip
              access: proxy
              # IN-CLUSTER service, NOT the public host. The glitchtip.open-bank.tech
              # ingress deliberately routes ONLY the ingest paths
              # (/api/<n>/(store|envelope|security|minidump|unreal)/) so the UI/API are
              # not exposed publicly — so the public host 404s the /api/0/... query API
              # the sentry datasource needs. Grafana runs in-cluster, so it queries the
              # full API straight on the web Service. (Verified: /api/0/organizations/ →
              # 200, org slug "openbank".)
              url: http://glitchtip-web.observability.svc
              jsonData:
                url: http://glitchtip-web.observability.svc
                orgSlug: openbank
              secureJsonData:
                authToken: $GLITCHTIP_API_TOKEN
            # Business warehouse (ADR-0022). NOT part of the trace correlation web
            # above — this is the analytical plane: months of history at daily
            # grain, answering "how many accounts did we open last quarter", which
            # Prometheus structurally cannot (7-day retention, ADR-0088 D3) and
            # which a counter reset by every pod restart cannot either.
            - name: ClickHouse
              type: grafana-clickhouse-datasource
              uid: clickhouse
              # HTTP protocol on 8123, matching the single port opened by
              # components/analytics/clickhouse-grafana-network-policy.yaml. The
              # native protocol on 9000 stays closed.
              jsonData:
                host: clickhouse.analytics.svc
                port: 8123
                protocol: http
                secure: false
                username: analytics
                defaultDatabase: openbank_analytics
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD
        nodeExporter:
          enabled: true
        # Pin node-exporter straight at the ECR pull-through cache rather than letting
        # Kyverno's rewrite-quay rule do it. That policy is a mutating webhook with
        # failurePolicy: Ignore — it FAILS OPEN, so a pod admitted while Kyverno is
        # momentarily unreachable keeps the quay.io ref and containerd pulls it over
        # NAT. Proven here on 2026-07-16: two node-exporter pods created that morning
        # carried the rewritten ECR ref, while the one created at 00:44 was still on
        # quay.io — same DaemonSet, same day, different outcome. A DaemonSet pays that
        # on EVERY new node, which is the leak the Karpenter overnight consolidation
        # freeze in main.tf works around (~100 GB/night, $4-5).
        # `image` here is the prometheus-node-exporter SUBCHART's key, not the parent's
        # (verified: helm show values prometheus-community/prometheus-node-exporter ->
        # registry: quay.io, repository: prometheus/node-exporter). distroless stays
        # true, so the chart keeps resolving the -distroless tag suffix; the
        # pull-through mirrors the tag verbatim.
        prometheus-node-exporter:
          image:
            registry: 265175468565.dkr.ecr.eu-north-1.amazonaws.com
            repository: quay/prometheus/node-exporter
        # EKS managed control plane: AWS runs (and hides) kube-controller-manager,
        # kube-scheduler, etcd and kube-proxy — none expose scrapeable metrics
        # endpoints to the cluster. Leaving these chart defaults enabled created
        # ServiceMonitors pointing at non-existent control-plane endpoints, whose
        # "target down" rules fire KubeControllerManagerDown / KubeSchedulerDown as
        # permanent false-positive criticals. Disabling each component drops both
        # its ServiceMonitor and the matching default alert rules (ADR-0088 D1 —
        # found while wiring ntfy last-mile, 2026-06-13).
        # kubelet /metrics/probes: prober_probe_duration_seconds_bucket is the
        # second-largest metric in the head (16.1k series from the kubelet job,
        # 18.9k total; measured 2026-10-08) -- a per-pod, per-probe histogram no
        # rule, alert or dashboard in this repo reads. prober_probe_total (the
        # probe result counter) is kept. The chart default for this list is []
        # (kps 91.9.0), so setting it removes nothing the chart ships.
        kubelet:
          serviceMonitor:
            probesMetricRelabelings:
              - sourceLabels: [__name__]
                regex: prober_probe_duration_seconds_(bucket|sum|count)
                action: drop
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kube-state-metrics:
          # Exports each CronJob's declared success budget as a label on
          # kube_cronjob_annotations, which CronJobSuccessStale reads
          # (components/observability/prometheus-rules-jobs.yaml). A plain allowlist
          # flag, NOT customResourceState: a CRS config error takes down every kube_*
          # series (see openbank-infra/CLAUDE.md). Verified 2026-10-03 against KSM
          # v2.20.0: the key renders as annotation_openbank_tech_max_success_age_seconds,
          # and a CronJob without it still emits the series with no such label.
          # Dropping this flag makes CronJobMaxSuccessAgeUndeclared fire for every CronJob.
          metricAnnotationsAllowList:
            - cronjobs=[openbank.tech/max-success-age-seconds]
          # admin-ui reads the RUNNING node shape live (src/lib/live-platform-versions.ts):
          # kube_node_labels only carries labels named here, and by default carries none.
          metricLabelsAllowlist:
            - nodes=[node.kubernetes.io/instance-type,karpenter.sh/capacity-type]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
