# OpenTelemetry Operator (Dynatrace-parity #3, PILOT). Enables zero-code deep
# instrumentation: annotate a pod and the operator injects the OTel Java agent
# as an init-container, no image rebuild — the OSS analogue of a Dynatrace
# OneAgent. The fleet is already OTel-native via Quarkus, so this is rolled out
# as a PILOT on a single non-money-path service (product-catalog) first, to
# confirm the injected agent does NOT double-instrument or clash with Quarkus's
# built-in OTel SDK before any fleet-wide annotation. Self-generated webhook
# cert (autoGenerateCert) so it has no cert-manager Issuer dependency.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.124.1
    helm:
      valuesObject:
        # This operator OWNS its CRDs: the Instrumentation in `accounts` (and any future
        # OpenTelemetryCollector) needs them, and the chart installed them. Pinned explicitly
        # (it matches the chart default) so nobody turns it off on the assumption that
        # the plain otel-collector Deployment makes them unnecessary. That Deployment is
        # the trace/metric pipeline, and this operator only injects agents into it. A
        # startup log saying "OpenTelemetryCollector CRDs are not present" together with
        # "failed to autodetect ... i/o timeout" does NOT mean the CRDs are missing. Autodetect
        # could not reach the API server (see operator.networkpolicy below) and reported
        # every CRD group as absent.
        crds:
          create: true
        manager:
          # The operator's self-managed NetworkPolicy pins egress to the API server's endpoint
          # IPs as it saw them at startup. EKS rotates its control-plane ENIs, and after a
          # rotation (2026-09-29) the operator could no longer reach 172.20.0.1:443, never became
          # Ready, so its webhook had no endpoints and every Argo app with an Instrumentation
          # (accounts, payments) failed to diff. It cannot heal itself: without the API it cannot
          # rewrite the policy. The namespace has no default-deny, so without this policy egress
          # is simply open, like every other observability workload. operand.networkpolicy (for
          # collectors) is unaffected. Operator 0.160.0 (chart 0.124.x) moved both
          # network-policy gates back to alpha, disabled by default; the gate is still
          # registered, so this explicit opt-out stays valid and keeps a future default flip
          # from silently re-arming the stale-IP policy.
          featureGatesMap:
            operator.networkpolicy: false
          # The default collector image the operator stamps into injected
          # workloads; pin to the contrib agent line used elsewhere in the stack.
          collectorImage:
            repository: docker.io/otel/opentelemetry-collector-contrib
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
        # Use cert-manager for the webhook cert. autoGenerateCert produced a CA
        # whose bundle the API server wouldn't trust ("certificate signed by
        # unknown authority opentelemetry-operator-operator-ca"), so the
        # Instrumentation mutating webhook rejected every admission — which broke
        # the accounts app sync. cert-manager (present, with cainjector running)
        # issues the cert and injects the correct caBundle into the webhook configs.
        admissionWebhooks:
          certManager:
            enabled: true
          autoGenerateCert:
            enabled: false
        nodeSelector:
          workload: observability
        tolerations:
          - key: workload
            operator: Equal
            value: observability
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
