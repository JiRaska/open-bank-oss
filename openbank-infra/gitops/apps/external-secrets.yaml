# External Secrets Operator (ESO) — reconciles Vault KV entries into native
# Kubernetes Secrets (ADR-0007). Workloads keep reading a plain Secret with the
# same name/key as before; ESO is the only component that talks to Vault, via a
# ClusterSecretStore using Vault's Kubernetes auth (components/external-secrets). No
# secret material ever lands in git — git holds only the *reference*
# (ExternalSecret → remoteRef), the value lives in Vault.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.4
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 1
        # NB: do NOT override securityContext/podSecurityContext here. The chart
        # gates those blocks behind an `enabled: true` flag and its defaults are
        # already PSS-`restricted` compliant (drop ALL, runAsNonRoot,
        # readOnlyRootFilesystem, seccompProfile RuntimeDefault) for controller,
        # webhook and certController. A partial override that omits `enabled`
        # would DELETE the whole block and break restricted enforcement.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        openbank.io/plane: platform
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
