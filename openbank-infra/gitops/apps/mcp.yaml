# ArgoCD app for openbank-mcp-service (first-party MCP server, ADR-0181). Deploys the
# platform-ns Deployment+Service from components/mcp. Tracks main (same as the other
# component apps). Phase 1: no OPA sidecar (tools/call fails closed), no DB, no Kafka.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp
  namespace: argocd
  annotations:
    # Server-Side Diff must run the Kyverno verify-images mutation in its dry-run, otherwise the
    # digest-pinning annotation it injects reads as a permanent OutOfSync diff (issue #856).
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
