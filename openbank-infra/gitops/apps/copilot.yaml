# ArgoCD app for copilot-service (customer-facing AI assistant, ADR-0089). Deploys the
# platform-ns Deployment+Service from components/copilot. Tracks main (same as the other
# component apps). The OIDC_CLIENT_SECRET Secret is delivered by ESO (es-copilot-service).
# The capability is OFF by default (COPILOT_ENABLED=false) — money-path, four-eyes to flip.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: copilot
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/copilot
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      # ServerSideApply: the OPA bundle ConfigMap is ~260 KB, and client-side apply
      # stores the whole object in kubectl.kubernetes.io/last-applied-configuration,
      # which Kubernetes caps at 262144 bytes for all annotations combined. Past that
      # the ConfigMap is REJECTED and Argo retries forever ("Too long"), so the policy
      # in the cluster silently freezes at the last version that fitted while git moves
      # on. Server-side apply tracks ownership in metadata.managedFields instead and
      # writes no such annotation, so it has no size ceiling of this kind.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
