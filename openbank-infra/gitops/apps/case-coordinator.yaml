# ArgoCD app for case-coordinator-agent (swarm case-coordinator runtime, ADR-0244).
# Deploys the platform-ns Deployment+Service+CNPG+ESO from components/case-coordinator.
# Tracks main (same as the other component apps). The KafkaUser lives in `messaging`
# (Strimzi user operator watches its own namespace) and its certs are projected back
# into `platform` by the ExternalSecrets in the component — sync waves order certs
# before the Deployment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: case-coordinator
  namespace: argocd
  annotations:
    # Server-Side Diff must run the Kyverno verify-images mutation in its dry-run, otherwise the
    # digest-pinning annotation it injects reads as a permanent OutOfSync diff (issue #856).
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/case-coordinator
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
