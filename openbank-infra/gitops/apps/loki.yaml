# Log-aggregation backend: Grafana Loki 3.x (ADR-0008 logs pillar, ADR-0082
# correlation layer).
#
# WHY THIS REPLACES loki-stack: the old `loki-stack` chart (2.10.2) bundled
# Loki 2.6.1 — long Past-EoL (the red card in the admin-UI Control Tower) and
# without TSDB, structured-metadata or native OTLP ingest. ADR-0082 needs all
# three: `trace_id` as queryable structured metadata (NOT a high-cardinality
# label) is what makes the logs<->traces jump bidirectional. So we move to the
# canonical `loki` chart pinning Loki 3.x.
#
# DEPLOYMENT SHAPE: SingleBinary (monolithic) on a gp3 PVC with filesystem
# storage — same lightweight FinOps profile as Tempo for the sandbox (ADR-0027
# flips object_store to S3 for prod). The scalable read/write/backend targets
# and the memcached caches are zeroed out — a single-tenant sandbox does not
# need them.
#
# LOG SHIPPER: the modern `loki` chart does NOT bundle Promtail (Promtail is EoL,
# superseded by Grafana Alloy). The shipper now lives in its own app — see
# gitops/apps/alloy.yaml — which tails every pod's stdout/stderr and pushes to
# this Loki with `trace_id`/`span_id`/`correlationId` lifted into structured
# metadata.
#
# Codified into GitOps (ADR-0027). The root app-of-apps (`root`, ArgoCD
# Application over openbank-infra/gitops/apps, prune+selfHeal) syncs this file,
# so a merge to main IS the deploy. A `kubectl apply` of an UNMERGED change here
# is reverted within seconds — verified 2026-08-01, three applies in a row
# reported `configured` and the live object never changed (#3156).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0   # Loki app v3.6.7 (latest 3.x; TSDB v13 unchanged)
    helm:
      releaseName: loki
      valuesObject:
        fullnameOverride: loki
        # SingleBinary monolithic mode — sandbox FinOps profile.
        deploymentMode: SingleBinary
        # IRSA (ADR-0088 D3): the `loki` SA assumes the openbank-observability-s3 role
        # for durable S3 object storage — no static keys. Trust policy binds this SA's
        # OIDC sub; the role grants s3:{Get,Put,Delete,List} on openbank-loki-<acct>.
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::265175468565:role/openbank-observability-s3
        loki:
          # Pin the image tag explicitly (chart default = appVersion) so the admin-UI
          # infra card reads a clean '3.3.2' from gitops instead of the binary's ugly
          # branch-build self-report ('release-3.3.x-...' from /status/buildinfo).
          image:
            tag: "3.6.7"
          auth_enabled: false
          # Cheap single-node ring.
          commonConfig:
            replication_factor: 1
          # TSDB v13 schema on filesystem — unlocks structured metadata
          # (trace_id) and is the only schema Loki 3.x will start with.
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          # Durable S3 object storage (ADR-0088 D3) — replaces the ephemeral gp3
          # filesystem. IRSA on the `loki` SA supplies credentials (no static keys);
          # region only, AWS-default endpoint. One bucket serves chunks/ruler/admin.
          storage:
            type: s3
            bucketNames:
              chunks: openbank-loki-265175468565
              ruler: openbank-loki-265175468565
              admin: openbank-loki-265175468565
            s3:
              region: eu-north-1
          # Accept structured metadata pushed by Alloy (trace_id/span_id/...).
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            # Global per-tenant push limits. Loki's defaults (4MiB/s rate, 6MiB
            # burst) are sized for a single small app; here one single-binary
            # ingests every namespace + ~38 services via Alloy. During a node
            # roll, Alloy replays hours of buffered logs at once and the default
            # limit drops them ("ingestion rate limit exceeded for user fake") —
            # exactly the diagnostics you want during a node incident. Raise the
            # ceiling; it is an in-memory buffer bound, no infra/$ cost.
            ingestion_rate_mb: 16
            ingestion_burst_size_mb: 32
            per_stream_rate_limit: 8MB
            per_stream_rate_limit_burst: 16MB
            # FinOps (ADR-0054): sandbox 7d retention (ADR-0088 D3). S3 lifecycle on the
            # bucket also expires objects at 7d (belt-and-suspenders).
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: s3
          # RULER (log-based alerting). enable_api alone was all this had, and it delivered
          # nothing: there was no alertmanager_url, so a firing rule had nowhere to go, and there
          # were no rules at all — the whole feature was configured-looking and inert. Meanwhile
          # several of this repo's most expensive incidents left their ONLY evidence in a log line
          # (HR000068 schedulers that had never run, SRCFG00040 at boot, the persist-vs-merge
          # duplicate-key 500s, fx-service's "skipping its revaluation leg"), and no metric existed
          # for any of them.
          #
          # THE KEY IS `rulerConfig`, NOT `ruler` (issue #5734). This block was written as
          # `loki.ruler:` from #3060 until 2026-08-20. That is not a chart key — the grafana/loki
          # chart calls it `loki.rulerConfig` — and Helm drops an unknown value key SILENTLY, with
          # no error, no warning, and a perfectly healthy pod. So for the whole life of the Loki
          # ruler, EVERY line below was inert and the ruler ran on defaults: rule storage stayed
          # `s3` (pointed at the ruler bucket, which nothing writes to) instead of `local:/rules`
          # where the sidecar puts the rules, and `alertmanager_url` stayed EMPTY. Measured live
          # against `/config` and `/prometheus/api/v1/rules` on 2026-08-20: three rule ConfigMaps
          # present on disk under /rules/fake, and the ruler reporting ZERO rule groups loaded.
          # Every log-based alert in this estate — silent-failures, endpoint-availability, and the
          # Falco runtime alerts added hours earlier by #5850 — had therefore never evaluated once,
          # and could not have delivered anything if it had.
          # Same family as the 21 Argo Rollouts with zero series (mis-nested Helm keys dropped
          # without a word); `check-loki-rules.py` now asserts this key renders, so it cannot
          # silently revert.
          rulerConfig:
            enable_api: true
            # Rules come from ConfigMaps in git via the chart's k8s-sidecar (see sidecar.rules
            # below), so the ruler reads them off local disk. This deliberately does NOT use the
            # S3 `ruler` bucket configured above: S3 ruler storage is written through the ruler
            # API, which would make the rules a mutable runtime object rather than a reviewed
            # artifact — the exact "derived data hand-edited in place" shape the house rules forbid.
            storage:
              type: local
              local:
                directory: /rules
            # Loki is single-tenant here (auth_enabled: false), so the sidecar's folder must be the
            # "fake" tenant directory the ruler looks in.
            rule_path: /tmp/loki-rules
            ring:
              kvstore:
                store: inmemory
            # The missing half. Without this a rule evaluates, fires, and is delivered nowhere.
            #
            # THE `/tools/alertmanager` SUFFIX IS LOAD-BEARING. This Alertmanager runs behind a
            # route prefix (`--web.route-prefix=/tools/alertmanager`, from
            # `alertmanagerSpec.routePrefix` so it can be served under admin.open-bank.tech/tools),
            # so the bare service URL answers 404 on every API path. The ruler appends
            # `/api/v2/alerts` to whatever it is given, posts it, gets a 404, and DROPS the
            # notification — with no error surfaced anywhere a human looks. Measured live
            # 2026-08-21, the first time a Loki rule ever fired in this estate:
            #   loki_prometheus_notifications_sent_total   = 10
            #   loki_prometheus_notifications_errors_total = 10   <- every single one
            #   loki_prometheus_notifications_dropped_total = 10
            # and the ruler reporting `state: firing` while Alertmanager held zero such alerts.
            # From inside the cluster:
            #   POST …:9093/api/v2/alerts                    -> 404
            #   POST …:9093/tools/alertmanager/api/v2/alerts -> 200
            # Prometheus itself is unaffected because prometheus-operator configures its
            # Alertmanager target with `pathPrefix`; this ruler is hand-configured and had no
            # such help. A firing rule that is dropped at delivery is indistinguishable, from
            # every dashboard in this estate, from a rule that never fired.
            alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc:9093/tools/alertmanager
            enable_alertmanager_v2: true
            # The SAME half again, for recording rules — and it is a separate switch. An alerting
            # rule needs alertmanager_url; a RECORDING rule needs remote_write, and without it the
            # rule evaluates on schedule and the result is dropped on the floor with no error
            # anywhere. That is the "configured-looking and inert" shape this block's own comment
            # above was written about, one rule type over.
            #
            # The receiver is the same Prometheus the k6 journeys already remote-write into
            # (enableRemoteWriteReceiver, proven working by openbank-infra/gitops/components/
            # observability/cronjob-journey-public-edge.yaml), so this adds a client to a path
            # that is already carrying traffic rather than a new one to prove.
            remote_write:
              enabled: true
              client:
                url: http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write
                queue_config:
                  # Small: the only producer is the endpoint-availability rule, one sample per
                  # affected Service per minute. Sized to be unmistakably not a bulk pipe.
                  capacity: 2500
                  max_shards: 10
          # Single-binary needs the embedded query scheduler off.
          querier:
            max_concurrent: 2
        singleBinary:
          replicas: 1
          # On-demand observability node pool (ADR-0082) — survive spot reclamation.
          nodeSelector:
            workload: observability
          tolerations:
            - key: workload
              operator: Equal
              value: observability
              effect: NoSchedule
          persistence:
            enabled: true
            # 10Gi → 30Gi (2026-08-02). The PVC hit 100% (9.73/9.75 GiB) and Loki
            # entered a self-sustaining crashloop: no space to replay the WAL → it
            # never started → nothing drained to S3 → the disk stayed full. 339
            # restarts, and the platform had NO logs for seven days (last S3 index
            # was index_20660 = 26 Jul; the whole bucket held 119 MB).
            #
            # This disk is not where chunks live — those go to S3 (storage.type
            # above). It holds the WAL and the TSDB index scratch, and 10Gi was too
            # little for that at 7d retention across ~120 pods.
            #
            # DEPLOY NOTE: volumeClaimTemplates is IMMUTABLE on a StatefulSet, so
            # this change alone cannot resize the existing PVC and a plain sync is
            # rejected. The live PVC was expanded in place first (gp3 has
            # allowVolumeExpansion: true, online, no data loss); this commit makes
            # it the declared state. To apply on a fresh cluster nothing special is
            # needed; to reconcile THIS cluster the StatefulSet must be recreated
            # with `kubectl delete sts loki --cascade=orphan` so pods and PVCs
            # survive and ArgoCD rebuilds it from the new template.
            #
            # FinOps: +20Gi gp3 ≈ +$1.60/month.
            size: 30Gi
            storageClass: gp3
          # 768Mi OOMKilled the SingleBinary loki (exit 137, crashloop) — TSDB +
          # ingester + querier + distributor in one process need real headroom, and
          # the OOM kills it before the ingester registers ("empty ring" 503 loop).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
        # Zero out everything the monolith doesn't use.
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        gateway:
          enabled: false
        # The canonical Loki Grafana datasource (uid: loki) is provisioned
        # separately — see gitops/components/observability/loki-grafana-datasource.yaml.
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
        sidecar:
          image:
            repository: kiwigrid/k8s-sidecar
          # Watch for ConfigMaps labelled loki_rule=1 and drop them into the ruler's local
          # directory, so a log-based alert is a reviewed file in git like every PrometheusRule.
          rules:
            enabled: true
            label: loki_rule
            labelValue: "1"
            searchNamespace: observability
            folder: /rules/fake
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
