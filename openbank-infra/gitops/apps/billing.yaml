# ArgoCD app for billing-service (ADR-0143 phase 2c: runtime fee assessment).
# Postgres-backed (billing-db.yaml, single-owner CNPG cluster) — no Kafka. Reads
# product, account, and balance state via REST to compute fee assessments; ledger
# posting (outbox) is the phase 2c-ii follow-up gated behind a four-eyes OPA decision.
# The OIDC_CLIENT_SECRET Secret is delivered by ESO (billing-service-oidc).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/billing
  destination:
    server: https://kubernetes.default.svc
    namespace: billing
  syncPolicy:
    # ServerSideApply: the OPA bundle ConfigMap is ~260 KB, and client-side apply
    # stores the whole object in kubectl.kubernetes.io/last-applied-configuration,
    # which Kubernetes caps at 262144 bytes for all annotations combined. Past that
    # the ConfigMap is REJECTED and Argo retries forever ("Too long"), so the policy
    # in the cluster silently freezes at the last version that fitted while git moves
    # on. Server-side apply tracks ownership in metadata.managedFields instead and
    # writes no such annotation, so it has no size ceiling of this kind.
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
