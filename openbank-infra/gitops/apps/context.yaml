apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: context
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/context
  destination: { server: https://kubernetes.default.svc, namespace: context }
  syncPolicy:
    syncOptions: [ServerSideApply=true]
    automated: { prune: true, selfHeal: true }
