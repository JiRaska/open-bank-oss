# Accounts banking domain: account-service + its single-owner CNPG Postgres and
# Redis idempotency cache. The account-service Deployment references an
# out-of-band secret (OIDC client secret) created by hand; CNPG generates the DB
# secret. Account-service stays in CrashLoop until Kafka, the DB and the realm
# client are all ready — ArgoCD converges as each dependency comes up.
#
# product-catalog.yaml and product-catalog-http-scaledobject.yaml are EXCLUDED
# here on purpose: both manifests physically live in this directory (co-located
# in the `accounts` namespace for admin-ui discovery) but are owned by the
# `product-catalog` Application (directory.include). Without this exclude both
# Applications claim Deployment/Service/HTTPScaledObject product-catalog →
# SharedResourceWarning + sync thrash.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accounts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/accounts
    directory:
      exclude: '{product-catalog.yaml,product-catalog-http-scaledobject.yaml,product-catalog-db.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: accounts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
  # Argo Rollouts (ADR-0098) sets spec.selector.rollouts-pod-template-hash on the
  # stable and canary Services at runtime; git holds only the base selector, so
  # without this every Rollout-backed Service reads as permanently OutOfSync.
  # Ignore exactly that one controller-managed selector key — git-owned selector
  # changes are still reconciled. NB: jqPathExpressions, NOT managedFieldsManagers:
  # the latter is silently bypassed on apps with compare-options
  # IncludeMutationWebhook (Kyverno digest-pin, #856), which left 6 apps OutOfSync
  # (verified in-cluster). Rollback = delete this block.
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector."rollouts-pod-template-hash"
