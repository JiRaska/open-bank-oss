# authz-policy-auditor: static OPA/Rego + agents.yaml authorization-policy drift auditor Temporal workflow service (ADR-0167). Namespace: authz-policy-auditor.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authz-policy-auditor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/authz-policy-auditor
  destination:
    server: https://kubernetes.default.svc
    namespace: authz-policy-auditor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
