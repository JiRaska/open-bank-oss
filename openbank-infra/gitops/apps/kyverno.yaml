# Kyverno — Kubernetes policy engine (ADR-0030 D4, admission control). Deployed
# first as the enforcement point for image-signature verification; the actual
# verify-images ClusterPolicy (gitops/components/kyverno/) starts in AUDIT mode
# so it surfaces unsigned images without blocking any deploy. It flips to Enforce
# only once a Cosign trust root is chosen (keyless/KMS) and images are signed.
#
# Codified into GitOps (ADR-0027). Applied via kubectl until the app-of-apps is
# wired (same as tempo/metrics-server/loki).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      valuesObject:
        # Sandbox FinOps: single replica for the background, reports and cleanup
        # controllers (raise + add PDBs for prod). The ADMISSION controller is the
        # exception: its webhooks run with failurePolicy Fail, so one pod is a single
        # point of failure for every Pod create in the cluster. 2026-09-29: one
        # replica at a 500m limit, doing SBOM verification twice (v1 Enforce + the
        # CEL IVP shadow), hit `context canceled` and denied every ARC runner Pod
        # (#11461, #11437). Cost of the second replica: one more pod at 250m/256Mi
        # requests (limits 1500m/512Mi), i.e. +0.25 vCPU / +256Mi reserved.
        admissionController:
          replicas: 2
          # The chart renders its PDB whenever replicas > 1; set it explicitly so
          # the intent does not hang on that implicit rule. minAvailable 1 keeps one
          # webhook endpoint through a node drain / Karpenter consolidation.
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          # Chart default antiAffinity (enabled) already prefers distinct nodes by
          # kubernetes.io/hostname. Also spread across zones; ScheduleAnyway so a
          # single-zone capacity shortfall degrades placement instead of leaving
          # the second replica Pending.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: admission-controller
                  app.kubernetes.io/instance: kyverno
          container:
            # Image-verify cache (cmd/internal/flag.go, Kyverno 1.19.1): on by
            # default, TTL 60m, --imageVerifyCacheMaxSize 1000. That "size" is a
            # ristretto MaxCost, and since 1.19 an entry carrying attestation
            # payloads costs its payload BYTES (pkg/image/verification/cache/
            # client.go payloadCost). The CEL ImageValidatingPolicy caches its
            # attestations that way (pkg/cel/libs/imageverify/impl.go
            # SetWithPayload), so at the default budget of 1000 B a ~4 MB runner
            # SBOM can never be admitted to the cache and every IVP admission
            # re-downloads and re-verifies it. v1 verifyImages entries cost 1 each
            # and are unaffected. 64Mi fits the runner SBOM plus every service SBOM
            # (largest ~0.72 MB) with headroom, inside the 512Mi limit (~190Mi in
            # use). Stated explicitly (enabled + TTL too) so the budget is reviewed
            # here, not inherited. Note v1's verify-openbank-image-sbom-attestation
            # sets useCache: false per rule, which bypasses this cache entirely.
            # Quoted: an unquoted integer this large renders through the chart's
            # range as 6.7108864e+07, which Go's Int64 flag parser rejects at boot.
            extraArgs:
              imageVerifyCacheEnabled: true
              imageVerifyCacheMaxSize: "67108864"
              imageVerifyCacheTTLDuration: 60m
            # Under container:, not beside replicas. The admission controller is the
            # one component whose chart reads resources from
            # admissionController.container.resources (3.2.6 and 3.9.1 alike); the
            # top-level key this block used to sit at was ignored, so the pod ran on
            # the chart default 128Mi/384Mi while this file said 256Mi/512Mi (#9805).
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 1500m
                memory: 512Mi
            # The amazon-ecr-credential-helper (registryCredentialHelpers=…,amazon)
            # caches its ECR auth token under $HOME/.ecr. HOME defaults to
            # /home/nonroot, which is on the readOnlyRootFilesystem, so the write
            # fails ("open /home/nonroot/.ecr/…: no such file or directory") and the
            # helper re-authenticates (ECR GetAuthorizationToken) on EVERY image
            # verification. Under load that intermittently times out, so cosign
            # signature/attestation fetches fail and validly-signed images get
            # rejected as "unverified" — which the image-verify cache then pins for
            # its whole TTL, silently wedging all NEW-image deploys fleet-wide
            # (admin-ui + agent-service seen; incident 2026-07-11). Point HOME at the
            # already-writable sigstore emptyDir (TUF_ROOT=/.sigstore) so the token
            # caches and ECR auth stays reliable. No new volume — the chart exposes
            # no extra-volume hook for the admission controller, only extraEnvVars.
            extraEnvVars:
              - name: HOME
                value: /.sigstore
        backgroundController:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        reportsController:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        cleanupController:
          replicas: 1
        # Chart 3.9.1 (Kyverno 1.19) has no cleanupJobs any more (report cleanup moved
        # into the controllers), and policyReportsCleanup/webhooksCleanup no longer
        # run kubectl: the 1.18 cleanup binary dropped it. The bitnamilegacy/kubectl
        # overrides that kept 3.2.6's cleanup jobs pulling (Bitnami catalogue
        # retirement, Aug 2025) are therefore gone — kept, they would render as
        # "ghcr.io/docker.io/bitnamilegacy/kubectl" because the chart now prefixes a
        # default registry, and break the pre-delete hooks.
        #
        # Webhook scope: config.webhooks is a single {namespaceSelector,objectSelector}
        # object since 1.19 (a list before). The old value here was a list carrying
        # `failurePolicy: Ignore`, a key Kyverno's WebhookConfig type has never had
        # (pkg/config/types.go: namespaceSelector + objectSelector only), so it was
        # inert: webhooks have always used each policy's failurePolicy (default Fail).
        # Under 3.9.1 the list cannot merge with the chart's map default and renders
        # "{}". Setting it to null drops the key, so the chart renders exactly what
        # runs today: exclude only the kyverno namespace. Failing OPEN, if wanted, is
        # features.forceFailurePolicyIgnore — a behaviour change, not part of this bump.
        config:
          webhooks: null
          # Context size cap (kyverno ConfigMap key `maxContextSize`). New in the
          # 1.19 line with a 2Mi default; 1.12.5 had no such cap. A verifyImages
          # attestation rule loads the DSSE statement into the policy context, and
          # the CycloneDX SBOM of the CI runner image (openbank-ci-runner, 2582
          # components: Go toolchain, actions runner, node) decodes to 2,092,372 B
          # and is counted twice, so the rule needs 4,184,190 B. Under the 2Mi
          # default every openbank-build runner pod was denied
          # ("context size limit exceeded") from the upgrade on. Measured
          # 2026-09-28: largest service SBOM envelope is keycloak at ~0.72 MB
          # (~1.1 MB of context), so 8Mi gives the runner ~2x headroom and
          # services ~7x. Verification is unchanged; this only bounds memory.
          # Do not set 0 (unbounded) — keep it a measured, finite number.
          maxContextSize: 8Mi
        features:
          # 1.13 flipped the chart default to disabled (CVE-2024-48921). The pricing
          # PolicyException (components/kyverno/pricing-image-exception-cel.yaml) is
          # load-bearing, so keep exceptions on, from any namespace, as on 1.12.
          # Narrowing `namespace` is a separate, reviewable tightening.
          policyExceptions:
            enabled: true
            namespace: ""
          # 1.15 turned on generating ValidatingAdmissionPolicies from eligible
          # ClusterPolicies. That would move our Enforce validate rules to the API
          # server, outside the webhook's namespace exclusions — keep 1.12 behaviour.
          generateValidatingAdmissionPolicy:
            enabled: false
          validatingAdmissionPolicyReports:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
