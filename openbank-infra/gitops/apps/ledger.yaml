# Ledger banking domain (money-path): ledger-service + its single-owner CNPG
# Postgres, an ESO-projected OIDC client secret, and the Strimzi KafkaTopic it
# produces to. ledger-service stays in CrashLoop until the DB and the realm
# client are ready — ArgoCD converges as each dependency comes up. No public
# Ingress: ledger is internal ClusterIP, reached over in-cluster REST/Kafka only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ledger
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/ledger
  destination:
    server: https://kubernetes.default.svc
    namespace: ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
  # Argo Rollouts (ADR-0098) sets spec.selector.rollouts-pod-template-hash on the
  # stable and canary Services at runtime; git holds only the base selector, so
  # without this every Rollout-backed Service reads as permanently OutOfSync.
  # Ignore exactly that one controller-managed selector key — git-owned selector
  # changes are still reconciled. NB: jqPathExpressions, NOT managedFieldsManagers:
  # the latter is silently bypassed on apps with compare-options
  # IncludeMutationWebhook (Kyverno digest-pin, #856), which left 6 apps OutOfSync
  # (verified in-cluster). Rollback = delete this block.
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector."rollouts-pod-template-hash"
