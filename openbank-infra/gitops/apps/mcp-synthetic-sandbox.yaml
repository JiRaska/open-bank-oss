---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-synthetic-sandbox
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/mcp-synthetic-sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-synthetic-sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
