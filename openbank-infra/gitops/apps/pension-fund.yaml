# Pension-fund domain: pension-fund-service + its single-owner CNPG Postgres + OIDC ExternalSecret
# + OPA bundle. Provider side of ADR-0334: segregated funds, strategies, NAV and the unit register.
# Fund assets belong to the participants and are never posted into treasury or the bank ledger.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pension-fund
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/pension-fund
  destination:
    server: https://kubernetes.default.svc
    namespace: pension-fund
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      # The OPA bundle ConfigMap approaches the ceiling client-side apply can carry: kubectl
      # stores the whole object in the `last-applied-configuration` annotation and the API server
      # rejects an annotation set over 256 KB. Argo then retries forever while the cluster keeps
      # serving the PREVIOUS policy — a silent failure, since the Application looks busy rather
      # than broken. Server-side apply does not write that annotation at all.
      # Gate: opa-bundle-apply-size (.github/scripts/check-opa-bundle-apply-size.py).
      - ServerSideApply=true
