# Communication Studio (ADR-0285). communication-service serves the business-editable
# style/playbook layer that sits on top of the immutable git prompt core, and admin-ui
# edits it under four-eyes with evals-on-publish.
#
# The component provisions its database, OIDC and TLS prerequisites. The reviewed
# workload activation is declared in communication-service.yaml; this Application
# reconciles that desired state from main.
#
# Why it is registered now rather than at activation: admin-ui already ships a
# RoleBinding for admin-ui-discovery into namespace `communication` (#9173) and lists
# `communication` in OPENBANK_NAMESPACES. With no Application, that namespace did not
# exist, and admin-ui's sync failed on every attempt —
#   error running kubectl auth reconcile: error getting namespace communication:
#   namespaces "communication" not found
# — so admin-ui itself had been OutOfSync since 2026-09-10T21:10Z, and communication-db
# fired PostgresClusterDeclaredNotDeployed. A component that nothing syncs is not a
# staged rollout, it is a manifest no one applies.
# Activation and verification
#
# This change proposes one replica; it is not evidence of a running workload. Keep the
# activation PR draft with auto-merge disabled until the final reviewed head has explicit
# operator approval and the standard deployment-window prerequisites pass.
#
# Before approval, retain evidence for the exact pinned image: vulnerability verdict,
# signature, SBOM and provenance, source freshness, real customer-edge consumer publication,
# provider verification and the strict deployment contract verdict. Manifest checks alone
# cannot qualify the workload. Preserve independent deployment holds.
#
# After the approved GitOps rollout, verify the actual running image digest and readiness
# on the management endpoint `:8086/q/health/ready`, then customer-edge app-copy and the
# authenticated admin editor flow. Do not publish customer content as a health probe.
# A Healthy Application with zero replicas is not workload health evidence.
#
# Rollback through a reviewed GitOps change restoring replicas to zero, retaining the
# database and published copy. Do not use manual scaling or restarts to bypass this process.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: communication
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/communication
  destination:
    server: https://kubernetes.default.svc
    namespace: communication
  syncPolicy:
    syncOptions:
      # The component carries an OPA bundle ConfigMap; client-side apply would store the
      # whole object in the last-applied-configuration annotation and the API server
      # rejects one over 256 KB, which ArgoCD retries forever while serving the previous
      # policy. Gate: opa-bundle-apply-size.
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
