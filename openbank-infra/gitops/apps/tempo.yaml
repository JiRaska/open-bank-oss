# Traces backend: Grafana Tempo in single-binary (monolithic) mode. Sandbox
# uses local filesystem storage on a gp3 PVC — prod should flip the backend to
# S3 chunks per ADR-0027 (Loki/Tempo → S3). OTLP gRPC (4317) + HTTP (4318)
# receivers are enabled so the OTel collector (and any direct OTLP client) can
# push spans; query/UI served on 3100.
#
# METRICS GENERATOR (ADR-0082): Tempo derives RED metrics + a service graph
# straight from span data and remote-writes them to Prometheus — zero service
# instrumentation. This gives `traces_spanmetrics_*` (rate/error/duration per
# service+route) and `traces_service_graph_*` (who-calls-whom edges) for the
# whole fleet, powering the auto service map in Grafana. Prometheus must accept
# the remote write — see kube-prometheus-stack.yaml enableRemoteWriteReceiver.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # grafana/helm-charts `tempo` was deprecated 2026-01-30 (last: 1.24.4 / Tempo
    # 2.9.0, affected by GHSA-ffqx-q65f-36jf). Its successor lives in the
    # grafana-community repo. Chart 3.1.0 ships Tempo 3.1.0 (monolithic, no Kafka).
    # Tempo 3 removed the ingester and compactor (live-store + backend-scheduler/
    # worker replace them) and the `local_blocks` processor; the chart renders
    # `tempo.retention` into backend_scheduler block_retention. Blocks already in
    # S3 (2.x vParquet4, RF3) stay readable in place; new blocks are vParquet5.
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 3.1.0
    helm:
      valuesObject:
        fullnameOverride: tempo
        # IRSA (ADR-0088 D3): the `tempo` SA assumes openbank-observability-s3 for
        # durable S3 trace storage — no static keys.
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::265175468565:role/openbank-observability-s3
        tempo:
          # ADR-0088 D3 names >=30d of traces as the audit window; 7d was the interim.
          # Measured 2026-09-30: 7 days of blocks = 2.84 GB in S3, so 30d is ~12 GB.
          # The bucket lifecycle rule (today `expire-7d`) has to be raised to 30d by hand — it must
          # never be shorter than this value (see loki.yaml for why).
          retention: 720h
          storage:
            trace:
              # Durable S3 object storage (ADR-0088 D3) — replaces the ephemeral gp3
              # local path. Credentials via IRSA on the `tempo` SA (no static keys).
              backend: s3
              s3:
                bucket: openbank-tempo-265175468565
                endpoint: s3.eu-north-1.amazonaws.com
                region: eu-north-1
              # WAL stays on the local PVC (fast path before flush to S3).
              wal:
                path: /var/tempo/wal
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          # Derive span-metrics + service-graph metrics from traces and
          # remote-write them to Prometheus (ADR-0082). Processors run per the
          # global override below.
          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write"
            # No `local_blocks` here: Tempo 3 dropped that processor. TraceQL metrics
            # (Grafana Drilldown → Traces, `{} | rate()`) are now answered by the
            # live-store for recent data and by the backend blocks for older data,
            # with no generator-side buffer — which also removes the local-blocks
            # in-memory span buffer that drove the 2Gi limit below.
            processor:
              # Explicit latency buckets (issue #669 SLO definitions): Tempo's default
              # span-metrics buckets (2ms..4.1s exponential) do NOT include a clean 1s
              # boundary, so a Pyrra `latency` indicator selecting `le="1"` would silently
              # match zero series — the exact "wrong label, empty result" class of bug this
              # repo has been burned by before (see podmonitor-openbank-services.yaml).
              # These boundaries give every money-path SLO's 1s p99 threshold (rules.yaml:
              # slo.latency_threshold_seconds) a real bucket to read.
              span_metrics:
                histogram_buckets: [0.1, 0.25, 0.5, 1, 2, 5]
          # Enable the processors for ALL tenants (span-metrics = RED,
          # service-graphs = dependency edges). The chart templates the main
          # config's `overrides:` block from `.Values.tempo.overrides`
          # (config: `{{ toYaml .Values.tempo.overrides }}`) — NOT global_overrides
          # and NOT a top-level key. Wrong key => overrides.defaults:{} => zero metrics.
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - service-graphs
                  - span-metrics
          resources:
            requests:
              cpu: 100m
              # 320Mi → 640Mi (issue #809): measured steady-state ~615Mi — the
              # request must cover it so bin-packing stays honest.
              memory: 640Mi
            limits:
              cpu: 500m
              # bumped 640Mi → 1Gi → 2Gi: local-blocks in-memory span buffer kept
              # OOMKilling at 1Gi (41 restarts); 2Gi matches observed ~1.6Gi peak.
              memory: 2Gi
        persistence:
          enabled: true
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          size: 5Gi
        # On-demand observability node pool (ADR-0082) — survive spot reclamation.
        nodeSelector:
          workload: observability
        tolerations:
          - key: workload
            operator: Equal
            value: observability
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
