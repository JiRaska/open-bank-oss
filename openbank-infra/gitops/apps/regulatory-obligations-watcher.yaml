# regulatory-obligations-watcher: ADR-0367 D6 / ADR-0387 S4 weekly register-source watcher. Namespace: regulatory-obligations-watcher.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regulatory-obligations-watcher
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/regulatory-obligations-watcher
  destination:
    server: https://kubernetes.default.svc
    namespace: regulatory-obligations-watcher
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
