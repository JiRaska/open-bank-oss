apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    path: openbank-infra/gitops/components/payments
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # ServerSideApply: the OPA bundle ConfigMap is ~260 KB, and client-side apply
      # stores the whole object in kubectl.kubernetes.io/last-applied-configuration,
      # which Kubernetes caps at 262144 bytes for all annotations combined. Past that
      # the ConfigMap is REJECTED and Argo retries forever ("Too long"), so the policy
      # in the cluster silently freezes at the last version that fitted while git moves
      # on. Server-side apply tracks ownership in metadata.managedFields instead and
      # writes no such annotation, so it has no size ceiling of this kind.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Argo Rollouts (ADR-0098) sets spec.selector.rollouts-pod-template-hash on the
  # stable and canary Services at runtime; git holds only the base selector, so
  # without this every Rollout-backed Service reads as permanently OutOfSync.
  # Ignore exactly that one controller-managed selector key — git-owned selector
  # changes are still reconciled. NB: jqPathExpressions, NOT managedFieldsManagers:
  # the latter is silently bypassed on resources with compare-options
  # IncludeMutationWebhook (Kyverno digest-pin, #856), which left 6 apps OutOfSync
  # (verified in-cluster). Rollback = delete this block.
  #
  # IncludeMutationWebhook itself moved from an app-wide annotation to a
  # per-resource `argocd.argoproj.io/compare-options` annotation on just the 14
  # Rollout-backed Service objects (stable+canary) that need it — see
  # gitops/components/payments/payments-services.yaml. App-wide it silently
  # defeated the ignoreDifferences.jqPathExpressions on card-issuance-service's
  # replicas below, keeping the whole app permanently OutOfSync even with
  # RespectIgnoreDifferences protecting the actual apply (#230 T1 follow-up).
  # Scoping it per-resource fixes both problems at once; confirmed live in
  # openbank-sandbox (all resources Synced, card-issuance-service replicas
  # stayed at 0, no regression on the Rollout Service selector diff).
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector."rollouts-pod-template-hash"
    # ADR-0057 T1 pilot (#249): the KEDA HTTP add-on owns replicas 0<->1 on
    # card-issuance-service, not ArgoCD. Without this, selfHeal fights KEDA
    # every reconcile — forces replicas back to the git-declared 1, KEDA
    # promptly scales it back to 0 on idle, permanent OutOfSync/flap loop
    # (same pattern as product-catalog's ADR-0083 pilot,
    # gitops/apps/product-catalog.yaml).
    - group: apps
      kind: Deployment
      name: card-issuance-service
      namespace: payments
      jqPathExpressions:
        - .spec.replicas
