# Log shipper: Grafana Alloy (DaemonSet) — ADR-0008 logs pillar, ADR-0082.
#
# WHY ALLOY (not Promtail): the modern `loki` chart no longer bundles Promtail,
# and Promtail itself is EoL (superseded by Alloy). Alloy is the single Grafana
# collector for logs+metrics+traces; here it runs as a per-node DaemonSet that
# tails every pod's stdout/stderr and pushes to Loki. Crucially it parses the
# JSON log line and lifts `trace_id` / `span_id` / `correlationId` into Loki
# *structured metadata* — so the trace<->logs jump in Grafana is bidirectional
# without those high-cardinality ids ever becoming stream labels (ADR-0082).
#
# This is the ingest half of the "single pane": a span in Tempo links to its
# logs (tracesToLogsV2 on trace_id) and a log line links back to its trace
# (derived field on trace_id) precisely because Alloy populates trace_id here.
#
# Applied with `kubectl apply` until the app-of-apps is wired (as tempo/loki).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.0
    helm:
      releaseName: alloy
      valuesObject:
        # Pull Alloy from our ECR Public mirror, not Docker Hub. grafana/alloy is
        # not a Docker Official Image, so the anonymous docker-hub ECR pull-through
        # rate-limited it to NotFound on fresh nodes (2026-06-27). Kyverno
        # rewrite-ecr-public turns this ref into the ecr-public pull-through. Keep
        # tag in lockstep with the chart targetRevision above and the mirror entry
        # in scripts/mirror-ci-base-images.sh.
        image:
          registry: public.ecr.aws/d7v4f3x6
          repository: alloy
          tag: v1.20.1
        # Pin the config-reloader sidecar straight at the ECR pull-through cache rather
        # than letting Kyverno's rewrite-ghcr rule do it. That policy is a mutating
        # webhook with failurePolicy: Ignore — it FAILS OPEN, so a pod admitted while
        # Kyverno is momentarily unreachable keeps the ghcr.io ref and containerd pulls
        # it over NAT. Measured 2026-07-16: 19 of 670 eligible containers were live on
        # un-rewritten refs, including a node-exporter pod from 00:44 that night.
        # That silent leak is what the Karpenter overnight consolidation freeze in
        # main.tf works around (~100 GB/night, $4-5) — a DaemonSet pays it on EVERY new
        # node, so the rewrite has to be deterministic, not best-effort. Since chart
        # 0.12.6 the reloader is quay.io/prometheus-operator/prometheus-config-reloader
        # (was ghcr.io/jimmidyson/configmap-reload; verified: helm show values
        # grafana/alloy --version 1.13.0), so the repository moves to the quay
        # pull-through prefix. Tag (digest-pinned) stays the chart default.
        configReloader:
          image:
            registry: 265175468565.dkr.ecr.eu-north-1.amazonaws.com
            repository: quay/prometheus-operator/prometheus-config-reloader
        controller:
          type: daemonset
          # Node-level log collector: run at system-node-critical so the DaemonSet
          # pod can preempt a lower-priority pod and always schedule, even onto a
          # bin-packed node. Without this, on small (t4g.small / c8gn.medium ~1.4Gi)
          # nodes that fill up with workload pods the default-scheduler leaves the
          # Alloy pod Pending forever (it won't preempt at priority 0) -> logs from
          # that node are silently dropped and KubeDaemonSetRolloutStuck /
          # KubePodNotReady fire. This matches the standard add-on DaemonSets
          # (node-exporter, kube-proxy) which run node-critical for the same reason.
          priorityClassName: system-node-critical
          # DaemonSet must also land on the on-demand observability nodes
          # (ADR-0082) to ship their logs — tolerate the workload taint.
          # ...and on the on-demand `stateful` nodes that host the money-path databases
          # (#11608): their logs must ship too. check-stateful-not-on-spot.py enforces it.
          tolerations:
            - key: workload
              operator: Equal
              value: observability
              effect: NoSchedule
            - key: openbank.io/stateful
              operator: Equal
              value: "true"
              effect: NoSchedule
        alloy:
          # Allow scheduling onto sandbox runner nodes (matches the old
          # promtail toleration from loki-stack).
          # 256Mi OOMKilled (exit 137, crashloop) the DaemonSet pod on the CI
          # runner nodes — arc-runners with dind emit a huge log volume Alloy must
          # buffer. 512Mi holds those nodes; service nodes stay well under it.
          # Request raised 128Mi → 320Mi (issue #809): measured steady-state is
          # 256-310Mi on EVERY node, so the 128Mi request understated real per-node
          # DaemonSet overhead by ~180Mi — a key ingredient of the 4Gi-node memory
          # exhaustion / reclaim-livelock hangs. The request must reflect reality
          # for Karpenter's bin-packing to be honest.
          # 512Mi → 768Mi (2026-08-02). Measured with Loki HEALTHY, so this is the
          # steady state and not a backlog artefact: across the 20 pods that were
          # still alive, median 415Mi / p90 452Mi / max 458Mi against a 512Mi cap —
          # 14 of 20 over 400Mi. Six more had already been OOMKilled, so the true
          # requirement is above 458Mi; those are survivors.
          #
          # The OOMs were NOT a consequence of Loki being full, which is what I
          # first assumed: all six died 3-4 minutes AFTER Loki was ready and
          # draining. 512Mi is simply undersized for the log volume on the busiest
          # nodes.
          #
          # FinOps: only the LIMIT moves; the 320Mi request is unchanged, so
          # Karpenter's bin-packing and node count are unaffected. The cost is
          # headroom the pods may use, not capacity reserved up front — and the
          # alternative is a DaemonSet that crashloops and drops the fleet's logs.
          #
          # Request 320Mi → 640Mi (2026-08-02). Leaving the request alone was the
          # right call for the limit-only change above, but it is what makes the
          # bin-packing dishonest: Karpenter reserves 320Mi per node for a
          # DaemonSet that actually holds ~2x that, so every node it sizes is
          # short by the difference before a single workload pod lands.
          # Prometheus, `container_memory_working_set_bytes`, 12h window over the
          # 21 nodes of the `default` pool: p95 630Mi, max 654Mi. 640Mi ≈ p95 and
          # still leaves 128Mi of burst under the 768Mi limit, so nothing about
          # the OOM headroom above changes.
          #
          # Working set, not RSS, is the quantity chosen deliberately: it is what
          # the kubelet compares against its eviction thresholds, so it is the
          # only number that predicts an eviction.
          #
          # This is the larger half of a pair — see the `default` NodePool in
          # openbank-infra/aws/envs/sandbox-platform/main.tf, which stops that
          # per-node tax landing on 4 GiB nodes at all. Raising this request
          # WITHOUT that change would push the pool into more small nodes and
          # make things worse; the two must ship together.
          resources:
            requests:
              cpu: 50m
              memory: 640Mi
            limits:
              cpu: 300m
              memory: 768Mi
          configMap:
            content: |-
              // ---- discover every pod on this node ----
              // NODE-SCOPED. Until 2026-10-02 this block had no selector, so every DaemonSet
              // pod discovered every pod in the CLUSTER: one Alloy instance (on a node with 28
              // pods) was tailing 1,503 containers, all 19 instances sent the same ~152 lines/s,
              // and each log line reached Loki up to 19 times. That was the real source of the
              // `too_far_behind` discards (the later copies of a line arrive behind the stream),
              // of the 640Mi-per-pod Alloy memory, and of 19x kubelet log-API reads. The comment
              // above said "on this node" the whole time. The field selector is evaluated by the
              // API server, so a pod on another node is never even listed. K8S_NODE_NAME is set
              // by the chart from spec.nodeName.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                }
              }

              // Keep useful target labels; drop the rest to keep streams cheap.
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                // Drop CI/build-infra noise at the source. The ephemeral GitHub
                // Actions runners (arc-runners, dind) and the Gradle build cache
                // emit ~96% of all Loki volume (~1000 lines/s) — dockerd/containerd
                // engine chatter and the runner agent streaming job-console lines
                // that already live in the GitHub Actions UI. None of it belongs in
                // the bank's log store, and it buries the actual service logs. This
                // is also the dind volume that forced the alloy 512Mi memory bump.
                //
                // Exception: arc-stuck-runner-reaper is a CONTROL that runs in
                // arc-runners (every 10 min, a few lines per run). With the whole
                // namespace dropped, its failed run on 2026-10-03 01:40 was
                // undiagnosable once the pod was GC'd. Mark it, then drop only
                // unmarked pods.
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  regex         = "arc-stuck-runner-reaper-.*"
                  target_label  = "__tmp_keep"
                  replacement   = "1"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__tmp_keep"]
                  separator     = ";"
                  regex         = "(arc-runners|gradle-build-cache);"
                  action        = "drop"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "service"
                }
              }

              // ---- tail container stdout/stderr ----
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.process.parse.receiver]
              }

              // ---- parse JSON, lift correlation ids into structured metadata ----
              loki.process "parse" {
                // Quarkus structured JSON formatter (ADR-0082 Phase 3): level,
                // traceId, spanId and correlationId are ALL top-level keys.
                //
                // This block read `mdc.traceId` from 2026-06 to 2026-09-30 and
                // populated NOTHING for the whole of that time: measured live on
                // 2026-09-30, 0 of 804 lines/h carrying a 32-hex traceId reached
                // Loki with structured metadata `trace_id` set, `correlationId`
                // was 0 too, and not one line in the fleet contained a nested
                // `"mdc":{` object. The formatter openbank-libs configures writes
                // the ids as top-level fields, so the whole log<->trace leg of
                // ADR-0087 (Grafana derived field `trace_id` -> Tempo, and
                // Tempo tracesToLogsV2 filtering by trace_id) was dead on
                // arrival, while every dashboard and datasource that depends on
                // it looked configured. Nothing could see it: an empty
                // structured-metadata value is not an error anywhere in the
                // pipeline. Verify after deploy with
                //   sum(count_over_time({namespace="ledger"} | trace_id != "" [1h]))
                // which must be > 0 while the service takes traffic.
                //
                // ...and then the shape moved under it. #11630 (2026-10-01) replaced the
                // JSON-shaped *format pattern* (which wrote the ids top-level) with the real
                // quarkus-logging-json encoder, which nests every MDC value under `"mdc":{}`
                // — and that PR's own comment in openbank-libs-runtime's
                // microprofile-config.properties names `mdc.traceId` as the contract. The two
                // PRs crossed within a day, so from the first rebuilt service on, trace_id was
                // empty again: measured 2026-10-03, every traceId-carrying line in the fleet
                // was `"mdc":{"traceId":...}` and `| trace_id != ""` matched 0 lines.
                // The encoder is the contract now; the top-level fallback keeps a pod still
                // running a pre-#11630 image linked until its next rollout. JMESPath `||`
                // takes the first non-null, so neither shape can shadow the other.
                stage.json {
                  expressions = {
                    level         = "level",
                    trace_id      = "mdc.traceId || traceId",
                    span_id       = "mdc.spanId || spanId",
                    correlationId = "mdc.correlationId || correlationId",
                  }
                }

                // ---- normalise level to one lower-case vocabulary ----
                // Quarkus emits `INFO`/`WARN`/`ERROR`, Go controllers `info`/
                // `warn`/`error`, and a few libraries `WARNING`. Measured
                // 2026-09-30 the `level` label carried nine spellings, so
                // `{level="error"}` silently missed every Quarkus ERROR line.
                // Loki's own detected_level does the same folding; doing it here
                // makes the STREAM label the thing every LogQL rule selects on.
                stage.template {
                  source   = "level"
                  // The chart renders this ConfigMap through Helm `tpl`, so the Alloy
                  // (Go text/template) expression is wrapped in a Helm raw-string action
                  // (double-brace, backtick) to reach Alloy verbatim.
                  template = "{{`{{ $l := ToLower .Value }}{{ if eq $l \"warning\" }}warn{{ else }}{{ $l }}{{ end }}`}}"
                }

                // ---- demote KNOWN-TRANSIENT CloudNativePG errors to warn ----
                // Measured over 48h (2026-09-27/29): 12,188 of the 13,691 level=error lines
                // from CNPG `postgres` containers -- a third of ALL level=error lines in the
                // fleet (36,650) -- were the built-in metrics exporter failing to reach a
                // Postgres that was not accepting connections yet (or any more): the local
                // socket not created, or `FATAL: the database system is starting up /
                // shutting down / not yet accepting connections`. That is every instance
                // start, stop and switchover, and it buried the errors that matter (a
                // `barman-cloud-wal-archive` failure, a Vault login failure, a webhook
                // outage) under hundreds of lines per database.
                //
                // Each match is deliberately narrow: the exporter/runOnServer message AND a
                // not-running-yet cause. Anything else from the same message -- an auth
                // failure, a missing role, a query error -- keeps level=error. The
                // `Reconciler error` rule only takes errors whose cause is exactly
                // `context canceled` (a reconcile interrupted by the pod or operator
                // stopping); the other ~90% of Reconciler errors in the same window were real
                // (webhook calls failing, Backup terminal errors, WAL-archive failures, secret
                // refresh failures) and stay errors. A Postgres that never comes up is not
                // hidden by this: its own FATAL/PANIC lines are untouched and
                // PostgresInstanceDown pages on the scrape.
                //
                // The replacement happens on the EXTRACTED level, before stage.labels turns it
                // into the stream label; the original value is kept as structured metadata.
                // Demoted lines stay in Loki, carry `demoted_from=error` as structured
                // metadata, and are found with {level="warn"} | demoted_from="error".
                stage.match {
                  selector = `{container="postgres"} |~ "\"level\":\"error\"" |~ "\"msg\":\"(Error collecting user query|while parsing runOnServer queries|while checking runOnServer version matches)\"" |~ "(server error: FATAL: the database system is (starting up|shutting down|not yet accepting connections)|dial unix /controller/run/\\.s\\.PGSQL\\.5432: connect: no such file or directory)"`
                  stage.structured_metadata {
                    values = { demoted_from = "level" }
                  }
                  stage.template {
                    source   = "level"
                    template = "warn"
                  }
                }
                stage.match {
                  selector = `{container="postgres"} |~ "\"level\":\"error\"" |= "\"msg\":\"Reconciler error\"" |~ "\"error\":\"[^\"]*: context canceled\""`
                  stage.structured_metadata {
                    values = { demoted_from = "level" }
                  }
                  stage.template {
                    source   = "level"
                    template = "warn"
                  }
                }
                stage.match {
                  selector = `{namespace="cnpg-system", container="manager"} |~ "\"level\":\"error\"" |= "\"msg\":\"Reconciler error\"" |~ "\"error\":\"[^\"]*: context canceled\""`
                  stage.structured_metadata {
                    values = { demoted_from = "level" }
                  }
                  stage.template {
                    source   = "level"
                    template = "warn"
                  }
                }

                // Low-cardinality -> label.
                stage.labels {
                  values = { level = "" }
                }
                // High-cardinality ids -> structured metadata (Loki 3.x).
                // Queryable + linkable, never a stream label.
                stage.structured_metadata {
                  values = {
                    trace_id      = "",
                    span_id       = "",
                    correlationId = "",
                  }
                }
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
