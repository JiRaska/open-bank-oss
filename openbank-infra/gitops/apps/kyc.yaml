# kyc-service: KYC case lifecycle + event publisher (ADR-0068). Namespace: kyc.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyc
  namespace: argocd
  annotations:
    # Server-Side Diff must run the Kyverno verify-images mutation in its dry-run, otherwise the
    # digest-pinning annotation it injects reads as a permanent OutOfSync diff (issue #856).
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/kyc
  destination:
    server: https://kubernetes.default.svc
    namespace: kyc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      # ServerSideApply: the OPA bundle ConfigMap is ~260 KB, and client-side apply
      # stores the whole object in kubectl.kubernetes.io/last-applied-configuration,
      # which Kubernetes caps at 262144 bytes for all annotations combined. Past that
      # the ConfigMap is REJECTED and Argo retries forever ("Too long"), so the policy
      # in the cluster silently freezes at the last version that fitted while git moves
      # on. Server-side apply tracks ownership in metadata.managedFields instead and
      # writes no such annotation, so it has no size ceiling of this kind.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  # Argo Rollouts (ADR-0098) sets spec.selector.rollouts-pod-template-hash on the
  # stable and canary Services at runtime; git holds only the base selector, so
  # without this every Rollout-backed Service reads as permanently OutOfSync.
  # Ignore exactly that one controller-managed selector key — git-owned selector
  # changes are still reconciled. NB: jqPathExpressions, NOT managedFieldsManagers:
  # the latter is silently bypassed on apps with compare-options
  # IncludeMutationWebhook (Kyverno digest-pin, #856), which left 6 apps OutOfSync
  # (verified in-cluster). Rollback = delete this block.
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector."rollouts-pod-template-hash"
