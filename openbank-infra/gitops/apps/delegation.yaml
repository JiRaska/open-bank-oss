# Delegated-access domain: delegation-service + its single-owner CNPG Postgres + Redis
# (idempotency) + OIDC ExternalSecret + Kafka mTLS projection + OPA bundle.
# delegation-service owns DelegationGrant — the SCA-bound, capability-scoped authority
# for one party to act on another's resource (ADR-0232) — and publishes the grant
# lifecycle onto openbank.delegation.events. Enforcement stays with the product services:
# account-service and card-issuance each build a local projection from that stream and
# decide for themselves, so a delegation outage cannot grant access it never had.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delegation
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/delegation
  destination:
    server: https://kubernetes.default.svc
    namespace: delegation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      # The OPA bundle ConfigMap is within ~2 KB of the ceiling that client-side apply can
      # carry: kubectl stores the whole object in the
      # `kubectl.kubernetes.io/last-applied-configuration` annotation, and the API server
      # rejects an annotation set over 256 KB with `metadata.annotations: Too long`. Argo
      # then retries forever while the cluster keeps serving the PREVIOUS policy — a silent
      # failure, since the Application looks busy rather than broken. Server-side apply does
      # not write that annotation at all. 66 of the 89 Applications already set this; this
      # one was created without it (#3414) and any further growth of the embedded
      # rules.yaml tips it over — which is exactly how it surfaced here.
      # Gate: opa-bundle-apply-size (.github/scripts/check-opa-bundle-apply-size.py).
      - ServerSideApply=true
