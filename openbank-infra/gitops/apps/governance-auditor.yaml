# governance-auditor: post-hoc merged-PR governance-compliance auditor Temporal workflow service (ADR-0164). Namespace: governance-auditor.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: governance-auditor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JiRaska/open-bank-oss.git
    targetRevision: main
    path: openbank-infra/gitops/components/governance-auditor
  destination:
    server: https://kubernetes.default.svc
    namespace: governance-auditor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
