apiVersion: v1
kind: ConfigMap
metadata:
  namespace: balances
  name: balance-mcp-read-tls
data:
  runtime.properties: 'quarkus.rest-client.mcp-balance-grant.tls-configuration-name=mcp-delegation

    quarkus.tls.mcp-delegation.trust-store.pem.certs=/mnt/mcp-delegation-trust/ca.crt

    quarkus.tls.mcp-delegation.protocols=TLSv1.3

    quarkus.tls.mcp-delegation.reload-period=1h

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: platform
  name: mcp-bound-read-tls
data:
  runtime.properties: 'quarkus.tls.mcp-bound-read.key-store.pem.read-client.cert=/mnt/mcp-bound-client/tls.crt

    quarkus.tls.mcp-bound-read.key-store.pem.read-client.key=/mnt/mcp-bound-client/tls.key

    quarkus.tls.mcp-bound-read.trust-store.pem.certs=/mnt/mcp-bound-server-trust/ca.crt

    quarkus.tls.mcp-bound-read.protocols=TLSv1.3

    quarkus.tls.mcp-bound-read.reload-period=1h

    '
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: balances
  name: allow-mcp-bound-balance-tls
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: balance-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform
      podSelector:
        matchLabels:
          app.kubernetes.io/name: mcp-service
    ports:
    - protocol: TCP
      port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: delegation
  name: allow-balance-mcp-grant-tls
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: delegation-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: balances
      podSelector:
        matchLabels:
          app.kubernetes.io/name: balance-service
    ports:
    - protocol: TCP
      port: 8443
