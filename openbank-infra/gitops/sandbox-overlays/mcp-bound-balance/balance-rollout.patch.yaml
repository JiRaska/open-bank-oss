- op: test
  path: /spec/template/spec/containers/0/name
  value: balance-service
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    name: https-native
    containerPort: 8443
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
    value: /mnt/mcp-balance-server/tls.crt
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
    value: /mnt/mcp-balance-server/tls.key
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_HTTP_SSL_CERTIFICATE_RELOAD_PERIOD
    value: 1h
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_HTTP_SSL_PORT
    value: '8443'
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_HTTP_SSL_PROTOCOLS
    value: TLSv1.3
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILES
    value: /mnt/mcp-balance-client-trust/ca.crt
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: BALANCE_MCP_ISSUER
    valueFrom:
      configMapKeyRef:
        name: balance-mcp-read-origins
        key: issuer-url
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: BALANCE_MCP_SERVICE_OIDC_URL
    valueFrom:
      configMapKeyRef:
        name: balance-mcp-read-origins
        key: staff-oidc-url
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: BALANCE_MCP_READER_SECRET
    valueFrom:
      secretKeyRef:
        name: balance-mcp-reader-oidc
        key: BALANCE_MCP_READER_SECRET
        optional: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-balance-server
    mountPath: /mnt/mcp-balance-server
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-balance-client-trust
    mountPath: /mnt/mcp-balance-client-trust
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-delegation-trust
    mountPath: /mnt/mcp-delegation-trust
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-read-tls-config
    mountPath: /mnt/mcp-read-tls-config
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-balance-server
    secret:
      secretName: balance-mcp-server-tls
      items:
      - key: tls.crt
        path: tls.crt
      - key: tls.key
        path: tls.key
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-balance-client-trust
    secret:
      secretName: balance-mcp-client-trust
      items:
      - key: ca.crt
        path: ca.crt
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-delegation-trust
    secret:
      secretName: balance-mcp-delegation-trust
      items:
      - key: ca.crt
        path: ca.crt
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-read-tls-config
    configMap:
      name: balance-mcp-read-tls
- op: test
  path: /spec/template/spec/containers/0/env/22/name
  value: QUARKUS_CONFIG_LOCATIONS
- op: replace
  path: /spec/template/spec/containers/0/env/22/value
  value: /mnt/msg-config/override.properties,/mnt/mcp-read-tls-config/runtime.properties
