- op: test
  path: /spec/template/spec/containers/0/name
  value: balance-service
- op: test
  path: /spec/template/spec/containers/0/env/22/name
  value: QUARKUS_CONFIG_LOCATIONS
- op: test
  path: /spec/template/spec/containers/0/env/22/value
  value: /mnt/msg-config/override.properties,/mnt/mcp-read-tls-config/runtime.properties
- op: replace
  path: /spec/template/spec/containers/0/env/22/value
  value: /mnt/msg-config/override.properties,/mnt/mcp-read-tls-config/runtime.properties,/mnt/mcp-read-tls-config/private-oidc.properties
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: BALANCE_MCP_OIDC_DISCOVERY_URL
    valueFrom:
      configMapKeyRef:
        name: balance-mcp-read-origins
        key: discovery-url
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-balance-oidc-trust
    mountPath: /mnt/mcp-balance-oidc-trust
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-balance-oidc-trust
    secret:
      secretName: balance-mcp-oidc-trust
      items:
        - key: ca.crt
          path: ca.crt
