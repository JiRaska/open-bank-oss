apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-bound-read-tls
  namespace: platform
data:
  private-oidc.properties: |
    quarkus.oidc.customers.tls.tls-configuration-name=mcp-customer-oidc
    quarkus.rest-client.customer-token-exchange.tls-configuration-name=mcp-customer-oidc
    quarkus.tls.mcp-customer-oidc.trust-store.pem.certs=/mnt/mcp-customer-oidc-trust/ca.crt
    quarkus.tls.mcp-customer-oidc.protocols=TLSv1.3
    quarkus.tls.mcp-customer-oidc.reload-period=1h
