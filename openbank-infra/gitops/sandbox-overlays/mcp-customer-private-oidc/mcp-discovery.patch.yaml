apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-service
  namespace: platform
spec:
  template:
    spec:
      containers:
        - name: mcp-service
          env:
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/mcp-read-tls-config/runtime.properties,/mnt/mcp-read-tls-config/private-oidc.properties
            - name: MCP_CUSTOMER_OIDC_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-customer-oidc-origins
                  key: discovery-url
          volumeMounts:
            - name: mcp-customer-oidc-trust
              mountPath: /mnt/mcp-customer-oidc-trust
              readOnly: true
      volumes:
        - name: mcp-customer-oidc-trust
          secret:
            secretName: mcp-customer-oidc-trust
            items:
              - key: ca.crt
                path: ca.crt
