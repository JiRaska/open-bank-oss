apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-keycloak-database-egress
  namespace: mcp-synthetic-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-keycloak-postgres
      ports:
        - protocol: TCP
          port: 5432
