apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-keycloak-database-egress
  namespace: mcp-synthetic-sandbox
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: mcp-synthetic-keycloak-db
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
  - Egress
