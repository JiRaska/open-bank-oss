apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-synthetic-read-issuer-client-trust
  namespace: mcp-synthetic-sandbox
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-22"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: mcp-synthetic-read-issuer-client-trust
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: truststore.p12
      remoteRef:
        key: mcp-synthetic-sandbox/read-issuer-client-trust
        property: truststore.p12
        decodingStrategy: Base64
    - secretKey: password
      remoteRef:
        key: mcp-synthetic-sandbox/read-issuer-client-trust
        property: password
