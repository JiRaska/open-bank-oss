---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-synthetic-keycloak
  namespace: mcp-synthetic-sandbox
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  podMetricsEndpoints:
    - port: management
      path: /metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-from-prometheus
  namespace: mcp-synthetic-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 9000
