# This file is mounted only in the isolated DR check workload, never the live ledger.
config_ordinal=500
# The trial-balance read uses PostgreSQL. Keep database readiness checks enabled.
# Redis backs approval writes, which the drill's viewer identity cannot perform.
quarkus.smallrye-health.check."io.quarkus.redis.runtime.client.health.RedisHealthCheck".enabled=false
# All scheduled jobs and outbox dispatch are disabled in the DR pod. Its read does
# not publish events; a missing live broker must not block this isolated check.
mp.messaging.outgoing.ledger-events-out.health-enabled=false
