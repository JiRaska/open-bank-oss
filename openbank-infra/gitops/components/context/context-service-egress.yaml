apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-service-egress-allow-list
  namespace: context
  labels:
    app.kubernetes.io/part-of: context
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: context-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: context
          podSelector:
            matchLabels:
              cnpg.io/cluster: context-db
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
          podSelector:
            matchLabels:
              strimzi.io/cluster: openbank-cluster
      ports:
        - { protocol: TCP, port: 9093 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iam
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lending
          podSelector:
            matchLabels:
              app.kubernetes.io/name: lending-service
      ports:
        - { protocol: TCP, port: 8443 }
