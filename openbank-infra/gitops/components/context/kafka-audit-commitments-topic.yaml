apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.context.audit.commitments
  namespace: messaging
  labels: { strimzi.io/cluster: openbank-cluster }
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
