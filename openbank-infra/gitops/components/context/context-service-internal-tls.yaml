apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: context-service-internal-tls
  namespace: context
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: context-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - context-service.context.svc
    - context-service.context.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
