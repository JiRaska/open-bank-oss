apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-service-ingress-allow-list
  namespace: context
  labels: { app.kubernetes.io/part-of: context }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: context-service } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: admin-ui } }
      ports: [{ protocol: TCP, port: 8149 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports: [{ protocol: TCP, port: 8085 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: security-scanner } }
      ports: [{ protocol: TCP, port: 8085 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-service-egress-allow-list
  namespace: context
  labels: { app.kubernetes.io/part-of: context }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: context-service } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: context } }
          podSelector: { matchLabels: { cnpg.io/cluster: context-db } }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: messaging } }
          podSelector: { matchLabels: { strimzi.io/cluster: openbank-cluster } }
      ports: [{ protocol: TCP, port: 9093 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: iam } }
          podSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
      ports: [{ protocol: TCP, port: 8080 }]
