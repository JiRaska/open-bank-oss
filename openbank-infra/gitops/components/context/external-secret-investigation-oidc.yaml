# Dedicated Context investigation client credential. The value lives only in the secret store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: context-investigation-oidc
  namespace: context
  annotations:
    openbank.io/rotation-deadline: "2027-09-18"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target: { name: context-investigation-oidc, creationPolicy: Owner }
  data:
    - secretKey: CONTEXT_INVESTIGATION_CLIENT_SECRET
      remoteRef: { key: context-investigation-service, property: OIDC_CLIENT_SECRET }
