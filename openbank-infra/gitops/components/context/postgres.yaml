apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    openbank.io/affinity-rollout-pending: "ADR-0325 fleet wave -- required anti-affinity lands in a staged wave PR, which removes this"
  name: context-db
  namespace: context
spec:
  monitoring:
    enablePodMonitor: true
  instances: 2
  # ADR-0325: an update (image bump, config change) promotes the already-updated
  # standby first and only then restarts the old primary. CNPG's default,
  # `restart`, restarts the primary IN PLACE; on a single-instance cluster the
  # operator has no standby and restarts either way, so this is free there.
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage: { storageClass: gp3, size: 5Gi }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }
  postgresql:
    parameters:
      max_connections: "100"
      statement_timeout: "750ms"
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/context-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb: { database: openbank_context, owner: openbank }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: context-db-daily
  namespace: context
spec:
  immediate: true
  schedule: "0 45 4 * * *"
  backupOwnerReference: self
  cluster:
    name: context-db
