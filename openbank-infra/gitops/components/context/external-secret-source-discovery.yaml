# SPDX-License-Identifier: Apache-2.0
# The endpoint value stays in the secret store; no in-cluster URL belongs in this public repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: context-service-source-discovery
  namespace: context
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target: { name: context-service-source-discovery, creationPolicy: Owner }
  data:
    - secretKey: AML_CASE_SOURCE_URL
      remoteRef: { key: context-service-source-discovery, property: AML_CASE_SOURCE_URL }
