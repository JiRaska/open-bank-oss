# SPDX-License-Identifier: Apache-2.0
# The workload mounts only ca.crt to verify Fraud's DNS-bound TLS certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: context-fraud-trust
  namespace: context
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: context-fraud-trust
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - fraud-service.fraud.svc
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
