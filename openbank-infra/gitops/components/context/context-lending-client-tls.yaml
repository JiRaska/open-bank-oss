# SPDX-License-Identifier: Apache-2.0
# Client identity and issuer CA for the disabled-by-default Context to Lending mTLS read.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: context-lending-client-tls
  namespace: context
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: context-lending-client-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  commonName: openbank-context-service
  usages: [digital signature, client auth]
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
