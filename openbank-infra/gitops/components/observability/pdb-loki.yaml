# Loki's chart (singleBinary deployment mode, loki.yaml) had no native
# podDisruptionBudget toggle for this mode when this was written (grafana/loki
# 6.55.0). The grafana-community chart 18.x does render one from
# `singleBinary.podDisruptionBudget`, but only when minAvailable/maxUnavailable is
# set, so it stays off and this hand-authored PDB remains the only one (moving it
# into the chart would hand the object between owners mid-sync). Hand-authored to close
# the same gap alertmanager/prometheus had: single replica -> minAvailable:1
# blocks ANY voluntary eviction, which is what makes it safe to tighten the
# observability NodePool's consolidationPolicy from WhenEmpty (see
# nodepool-observability.yaml).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loki
  namespace: observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: loki
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: single-binary
