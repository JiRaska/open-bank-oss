# ntfy — self-hosted notification sink (ADR-0088 §D1). Apache-2.0, single stateless
# binary, no database. Phase A wires Alertmanager's critical route straight here so the
# alerting last mile WORKS (it was routing to a 'null' receiver). In D1, GoAlert takes
# over schedules/escalation and ntfy becomes GoAlert's downstream — the Alertmanager URL
# just re-points; ntfy itself stays.
#
# Cluster-internal only (ADR-0056): no Ingress. Alertmanager publishes in-cluster to
# ntfy.observability.svc; the web UI is reachable via the admin-ui BFF proxy / port-forward.
# In-memory cache (no PVC) — a notification relay needs no durable message history.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-server-config
  namespace: observability
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: observability
data:
  server.yml: |
    base-url: "http://ntfy.observability.svc:8080"
    listen-http: ":8080"
    # In-memory cache (no cache-file) — relay delivers immediately; no durable history.
    cache-duration: "12h"
    # Cluster-internal, no ingress (ADR-0056) → publishing needs no token.
    auth-default-access: "read-write"
    behind-proxy: true
    attachment-cache-dir: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: observability
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        app.kubernetes.io/part-of: observability
    spec:
      # Sit on the on-demand observability pool next to Alertmanager (ADR-0082) so a spot
      # reclamation can't take the pager down with the rest of the stack.
      nodeSelector:
        workload: observability
      tolerations:
        - key: workload
          operator: Equal
          value: observability
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.24.0
          args: ["serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: cache
              mountPath: /var/cache/ntfy
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ntfy-server-config
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: observability
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: observability
spec:
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - name: http
      port: 8080
      targetPort: http
