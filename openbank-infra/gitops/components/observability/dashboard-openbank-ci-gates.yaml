#
# CI gate-estate trend dashboard (ADR-0255 Tier 2), over openbank_analytics.ci_gate_runs —
# same ClickHouse datasource pairing (uid `clickhouse`) as dashboard-openbank-business-warehouse.yaml,
# fed by cronjob-gate-health-puller.yaml every 30 minutes.
#
# Answers what the admin-ui panel (Tier 1, build-time snapshot) structurally cannot: a trend
# over more than the current build's rolling window. Prometheus retention here is 12h with no
# long-term store — ClickHouse is this fleet's established answer to that shape of gap.
#
# "Wall time per shard" is MAX(seconds) per shard per run, NOT the shard job's actual
# wall-clock: gates within one shard run concurrently (run-gates.py's ThreadPoolExecutor), so
# summing their `seconds` would overstate wall time, and no single per-gate row carries the
# job-level duration ci.yml's own step timestamps would give. MAX is a lower bound (the
# slowest gate cannot finish before the shard does) and a reasonable trend proxy, not a
# job-accurate number — stated here so a reader does not mistake one for the other.
#
# NOT CLUSTER-VERIFIED FROM THIS SESSION (no kubectl, no Grafana access): the panels are
# written against ci_gate_runs' actual column names (checked against
# ci-gate-runs-schema-configmap.yaml and gate-health-puller-script-configmap.yaml in the same
# PR) and modelled on dashboard-openbank-business-warehouse.yaml's proven ClickHouse panel
# shape, but whether ArgoCD syncs cleanly, the CronJob actually reaches ClickHouse under the
# new NetworkPolicy, and this JSON renders without a schema error in the live Grafana are
# unverified. See ADR-0255's own "what is honestly unverified" section.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-ci-gates
  namespace: observability
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
data:
  openbank-ci-gates.json: |
    {
      "id": null,
      "uid": "openbank-cig",
      "title": "OpenBank — CI Gate Estate",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "tags": ["ci", "openbank"],
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "clickhouse",
              "value": "clickhouse"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "ds_clickhouse",
            "options": [],
            "query": "grafana-clickhouse-datasource",
            "refresh": 1,
            "type": "datasource",
            "label": "ClickHouse"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 2 },
          "options": {
            "mode": "markdown",
            "content": "Trend view over `openbank_analytics.ci_gate_runs` (ADR-0255 Tier 2), refreshed every 30 min by `gate-health-puller`. For **current** gate-estate state (self-test/floor/budget coverage right now) see the admin-ui DevOps page's QG panel — this dashboard is history, that panel is now."
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Wall time per shard, p95 over time (lower-bound proxy — see file header)",
          "gridPos": { "x": 0, "y": 2, "w": 24, "h": 9 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 1,
              "rawSql": "SELECT toStartOfHour(run_created_at) AS time, shard, quantile(0.95)(per_run_max) AS p95_seconds FROM (SELECT run_id, shard, run_created_at, max(seconds) AS per_run_max FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 30 DAY GROUP BY run_id, shard, run_created_at) GROUP BY time, shard ORDER BY time"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 10, "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Pass rate per shard over time",
          "gridPos": { "x": 0, "y": 11, "w": 24, "h": 9 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 1,
              "rawSql": "SELECT toStartOfDay(run_created_at) AS time, shard, countIf(status = 'ok') / count() AS pass_rate FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 30 DAY GROUP BY time, shard ORDER BY time"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 10, "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "table",
          "title": "Gates currently red or unfalsified, most recent first",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 9 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 2,
              "rawSql": "SELECT gate_id, shard, mode, status, sha, run_created_at AS last_seen FROM openbank_analytics.ci_gate_runs WHERE (gate_id, run_id) IN (SELECT gate_id, argMax(run_id, run_created_at) FROM openbank_analytics.ci_gate_runs GROUP BY gate_id) AND status IN ('failed', 'unfalsified') ORDER BY run_created_at DESC"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Days since a gate last went red (fleet-wide)",
          "gridPos": { "x": 0, "y": 29, "w": 6, "h": 6 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 2,
              "rawSql": "SELECT dateDiff('day', max(run_created_at), now()) AS value FROM openbank_analytics.ci_gate_runs WHERE status IN ('failed', 'unfalsified')"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "d" }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Gate-runs observed (30d window)",
          "gridPos": { "x": 6, "y": 29, "w": 6, "h": 6 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 2,
              "rawSql": "SELECT count() AS value FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 30 DAY"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Shard p95 wall time vs its declared budget (ADR-0255 alert candidate)",
          "description": "One line per shard's slowest gate p95 against the SUM of that shard's own gates' budget_seconds (only gates that declare one). A shard whose p95 crosses its budget line is the shape run-gates.py's own budget_seconds field exists to catch — see gates.yaml's `budget_seconds:` comments for why it is enforced only under CI, not here: this panel is advisory trend, not a gate.",
          "gridPos": { "x": 12, "y": 29, "w": 12, "h": 9 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 1,
              "rawSql": "SELECT toStartOfDay(run_created_at) AS time, shard, quantile(0.95)(per_run_max) AS p95_seconds FROM (SELECT run_id, shard, run_created_at, max(seconds) AS per_run_max FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 30 DAY GROUP BY run_id, shard, run_created_at) GROUP BY time, shard ORDER BY time"
            },
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "B",
              "editorType": "sql",
              "format": 1,
              "rawSql": "SELECT now() AS time, shard, sum(gate_budget) AS budget_line FROM (SELECT DISTINCT shard, gate_id, argMax(budget_seconds, run_created_at) AS gate_budget FROM openbank_analytics.ci_gate_runs WHERE budget_seconds IS NOT NULL GROUP BY shard, gate_id) GROUP BY shard"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 5, "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Per-gate pass rate, worst first (30d, executed runs only)",
          "description": "Pass rate over EXECUTED runs — status != 'skipped' — not over every run. A pull_request-only gate (`when: pull_request`) correctly skips on every push event, and counting that as a failure would put every PR-only gate at the top of a 'worst' list for running exactly as designed. Verified against real data before shipping: the naive all-runs version put six perfectly healthy PR-only/advisory gates at ~52% pass rate purely from push-event skips, with the one REAL outlier (pr-file-overlap, an advisory gate that legitimately fires when another open PR touches the same files) buried among them. HAVING executed >= 5 keeps a brand-new gate with two data points from reading as 0% or 100% on noise.",
          "gridPos": { "x": 0, "y": 38, "w": 24, "h": 10 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 2,
              "rawSql": "SELECT gate_id, shard, mode, countIf(status NOT IN ('skipped')) AS executed, round(countIf(status='ok') / greatest(countIf(status NOT IN ('skipped')), 1), 3) AS pass_rate, argMax(status, run_created_at) AS latest_status FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 30 DAY GROUP BY gate_id, shard, mode HAVING executed >= 5 ORDER BY pass_rate ASC, executed DESC LIMIT 30"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "pass_rate" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "yellow", "value": 0.9 },
                        { "color": "green", "value": 0.99 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              }
            ]
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Per-gate wall time, slowest first (30d, p50/p95)",
          "description": "One row per gate, not per shard — this is the breakdown the shard-level 'wall time per shard' panel above cannot give you: WHICH gate inside a slow shard is actually the slow one.",
          "gridPos": { "x": 0, "y": 48, "w": 24, "h": 10 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 2,
              "rawSql": "SELECT gate_id, shard, mode, count() AS runs, round(quantile(0.5)(seconds), 3) AS p50_seconds, round(quantile(0.95)(seconds), 3) AS p95_seconds, max(budget_seconds) AS budget_seconds FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 30 DAY AND status != 'skipped' GROUP BY gate_id, shard, mode ORDER BY p95_seconds DESC LIMIT 30"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "p(50|95)_seconds|budget_seconds" },
                "properties": [{ "id": "unit", "value": "s" }]
              }
            ]
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Gate Tax — cost on the critical path, not summed across shards (14d)",
          "description": "A run's actual wall-clock floor is the SLOWEST shard, not the sum of every gate in every shard (shards run in parallel jobs) — the 'Per-gate wall time' panel above ranks gates by their own seconds, which over-counts every gate sitting in a fast shard. This panel instead finds, per run, which shard was the bottleneck (max total gate-seconds across shards), then ranks gates by how often they land in that bottleneck shard and what share of ITS time they cost. A gate that is slow but always lives in a shard other gates already make slow contributes nothing to Time-to-Trusted-Change; a gate here does. Verified against live ci_gate_runs 2026-08-10: loki-rule-load-test was ~49% of the critical path on the runs where its shard was the bottleneck.",
          "gridPos": { "x": 0, "y": 58, "w": 24, "h": 10 },
          "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
          "targets": [
            {
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse" },
              "refId": "A",
              "editorType": "sql",
              "format": 2,
              "rawSql": "WITH shard_totals AS (SELECT run_id, shard, sum(seconds) AS shard_seconds FROM openbank_analytics.ci_gate_runs WHERE run_created_at >= now() - INTERVAL 14 DAY GROUP BY run_id, shard), critical_shard AS (SELECT run_id, argMax(shard, shard_seconds) AS crit_shard, max(shard_seconds) AS crit_seconds FROM shard_totals GROUP BY run_id) SELECT g.gate_id, count() AS runs_on_critical_path, round(avg(g.seconds), 2) AS avg_seconds, round(avg(g.seconds / cs.crit_seconds) * 100, 1) AS avg_pct_of_critical_path FROM openbank_analytics.ci_gate_runs g INNER JOIN critical_shard cs ON g.run_id = cs.run_id AND g.shard = cs.crit_shard GROUP BY g.gate_id ORDER BY avg_seconds DESC LIMIT 20"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "avg_seconds" },
                "properties": [{ "id": "unit", "value": "s" }]
              },
              {
                "matcher": { "id": "byName", "options": "avg_pct_of_critical_path" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 15 },
                    { "color": "red", "value": 35 }
                  ] } }
                ]
              }
            ]
          }
        }
      ]
    }
