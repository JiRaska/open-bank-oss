#
# Ingress/egress lockdown for the CI metrics gateway (threat model E1/E2).
# Public-internet-facing pod in `observability`: explicit default-deny with a tight
# allow-list. Ingress only from the shared Envoy Gateway proxies (envoy-gateway-system, ADR-0324)
# plus the in-namespace Prometheus scrape of the collector's own metrics; egress only to DNS and
# the Prometheus remote-write receiver (the in-cluster sink, TB-3). Hand-authored: the generated
# network-policies.yaml targets Deployments declared in this directory, not chart pods. No other egress, so a
# compromised collector cannot reach other services or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-metrics-gateway
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ci-metrics-gateway
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the shared Gateway's Envoy proxy may reach the OTLP-HTTP receiver.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 4318
    # Collector self-metrics are private to the in-namespace Prometheus.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8888
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus remote-write receiver (kube-prometheus-stack-prometheus Service -> prometheus pod).
    # The podSelector MUST be exactly the Service's own selector
    # (app.kubernetes.io/name + operator.prometheus.io/name). The AWS VPC CNI network-policy
    # controller adds a Service ClusterIP to this pod's PolicyEndpoint only when the peer
    # podSelector matches the Service's selector labels; otherwise it adds the pod IP alone and
    # every remote write to the Service name times out ("context deadline exceeded", exporter
    # dropping data) while the OTLP receiver keeps answering 200 to CI.
    # Measured 2026-11-16: with {name, instance} (instance is NOT in the Service selector) the
    # PolicyEndpoint held only the pod IP and wget to the Service timed out, with or without a
    # namespaceSelector (#16348's theory, falsified live); with {name, operator.prometheus.io/name}
    # it held the ClusterIP too and wget answered "Prometheus Server is Ready". Removing the rule
    # again restored the timeout. rum-gateway's Tempo rule works for the same reason.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 9090
