# Onboarding / event-bus alert rules.
#
# WHY THIS EXISTS: new-customer onboarding was completely broken in sandbox for ~3 weeks
# (last account opened 2026-06-24) and NOTHING alerted. A chain of silent faults —
# party-service locked out of its own Kafka topics, sanctions-db out of disk,
# product-catalog scaled to zero on the onboarding path, and PartyEventConsumer
# acking-and-dropping the events it couldn't project — each broke the pipeline without
# turning anything red. It was found only by driving a real registration end to end.
# These rules make the two silent signals loud: events landing in the party-events DLQ,
# and parties being created without accounts following.
#
# Picked up automatically (ruleSelectorNilUsesHelmValues=false; observability app recurses
# this directory). Metric names verified live: openbank_parties_created_total /
# openbank_accounts_created_total come from libs DomainMetrics (Micrometer -> _total);
# kafka_* come from the Strimzi Kafka Exporter (topicRegex ".*", so every topic including
# the DLQ is scraped). CNPG disk / instance-down is already covered by openbank-db-alerts
# (PostgresInstanceDown / PostgresVolumeLow) — not duplicated here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-onboarding-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.onboarding.pipeline
      rules:
        - alert: PartyEventDeadLettered
          # A party event that survived PartyEventConsumer's bounded retry and was routed to the
          # DLQ (failure-strategy: dead-letter-queue). The DLQ has no consumer by design, so any
          # record on it is an unprocessed event — most likely a PARTY_CREATED whose customer got
          # no account. This is the exact silent data-loss that ran for 3 weeks, now made loud.
          # increase() over 1h: fires while records are still arriving and clears an hour after
          # they stop (the topic offset is monotonic, so a plain `> 0` would latch forever).
          #
          # TWO topic names, deliberately (#5752). account-service now dead-letters into the
          # explicit `openbank.dlq.account.party-events-in`; the implicit
          # `dead-letter-topic-party-events-in` it used before is still matched because (a) under an
          # Argo Rollout old and new pods run side by side, so the old name keeps receiving during
          # the cutover, and (b) whatever was parked there before it stays visible. A regex over
          # both is what keeps this alert from going quiet by construction on the day the topic is
          # renamed — the failure mode a rename introduces is an alert that can no longer fire, and
          # nothing about it looks broken. Drop the old alternative once the topic is confirmed
          # empty and the ACL is removed from kafka-account-mtls.yaml.
          #
          # The dots are NOT backslash-escaped on purpose. This is a YAML literal block scalar, so
          # a backslash reaches PromQL verbatim, and PromQL's own double-quoted string then applies
          # Go escape rules — `\.` is not a valid one there, and `\\.` would ask the regex for a
          # literal backslash. An unescaped `.` matches itself; `=~` is fully anchored, so the only
          # over-match would be a topic differing from these two in a separator character alone,
          # and no such topic exists in kafka-dlq-topics.yaml.
          expr: |
            increase(kafka_topic_partition_current_offset{topic=~"dead-letter-topic-party-events-in|openbank.dlq.account.party-events-in"}[1h]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Party events are being dead-lettered (account-service)"
            description: "account-service dead-lettered at least one party event in the last hour — a well-formed event it could not project even after retries. Almost always a downstream dependency is down (sanctions-service, product-catalog, the accounts DB). Inspect `openbank.dlq.account.party-events-in` (and, for anything parked before #5752, `dead-letter-topic-party-events-in`); every record there is a customer action (likely a PARTY_CREATED → no account opened) awaiting replay once the dependency recovers."
        - alert: OnboardingAccountsNotFollowingParties
          # The disparity that names this incident: parties ARE being created but accounts are NOT
          # following. Silent when nothing is happening — no parties created means the left side is
          # empty and this never fires, so it is safe in a sandbox with sporadic onboarding.
          #
          # Party side: openbank_parties_created_total — create-specific (the account.created
          # pipeline is driven by PARTY_CREATED only, so party.events' topic offset can't be used;
          # it also counts PARTY_UPDATED/KYC churn and would fire on pure-update bursts).
          # Account side: the account.created TOPIC OFFSET, not openbank_accounts_created_total.
          # That counter is registered lazily and resets per account-service pod, so it can read
          # zero for an hour after a deploy even though accounts opened on the prior pod — a false
          # positive. The Kafka Exporter's topic offset is external, monotonic and survives service
          # restarts, so `increase(...) == 0` means genuinely no account was opened.
          expr: |
            (sum(increase(openbank_parties_created_total[1h])) > 0)
            unless
            (sum(increase(kafka_topic_partition_current_offset{topic="openbank.accounts.account.created"}[1h])) > 0)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Parties are being created but no accounts are opening"
            description: "openbank_parties_created_total rose over the last hour while openbank_accounts_created_total did not — new customers are registering but the PARTY_CREATED → account.created pipeline is not producing accounts. This is the onboarding outage signature (party-service → Kafka → account-service). Check the party-events consumer lag, the DLQ (PartyEventDeadLettered), and account-service's dependencies (sanctions-service, product-catalog)."
        - alert: KycPartiesWithoutCase
          # Issue #5698. PartyEventConsumer caught every exception, logged it and returned — which
          # ACKS the Kafka message. A few seconds of kyc-db downtime therefore destroyed the only
          # copy of a PARTY_CREATED: no KYC case, party stuck in PENDING_KYC forever, and it was
          # found only because a human noticed an account did not work. (The "10 of 73" figure this
          # comment used to carry was WITHDRAWN on #5698 and must not be reinstated — a later
          # re-measure took it from the issue body rather than from the correction, and it has been
          # quoted as fact twice since. Whatever the count is, read it off the gauge.)
          #
          # #9726: what this gauge counts changed. Parties created BEFORE the oldest KYC case in the
          # store predate the auto-open consumer, so no case was ever possible for them; they are
          # excluded here and published separately as openbank_kyc_orphaned_parties_pre_consumer.
          # Without that split the sandbox floor was 6 and `> 0` was unsatisfiable, so the alert was
          # permanently lit and structurally silent about a genuine new orphan. A step change in the
          # pre_consumer series is worth a look in its own right — it means the derived cutoff moved.
          #
          # Why the two rules above could not catch it. PartyEventDeadLettered needs a DLQ record,
          # and the whole defect is that the event was acked and never dead-lettered.
          # OnboardingAccountsNotFollowingParties compares hourly RATES, so it is silent about a
          # party stranded weeks ago and silent whenever the pipeline is working now — a backlog of
          # already-stranded parties is invisible to a rate comparison. This is a STOCK, not a rate:
          # it stays lit until someone actually replays the missing cases.
          #
          # Grace period is enforced in the service, not here: openbank_kyc_orphaned_parties only
          # counts parties older than openbank.kyc.orphan-detection.grace-period (default 1h), so a
          # party whose PARTY_CREATED is legitimately still in flight is never counted and this does
          # not fire on every new signup. `for: 30m` on top absorbs a single failed pass.
          #
          # Boot-safe by construction: the gauge is seeded to 0 and only ever set by a COMPLETED
          # pass, so a freshly started pod reads 0 and cannot fire this — deliberately unlike the
          # Instant.EPOCH seeding that made WorkflowLivenessStale fire 15 minutes after every
          # deploy (#2239). The converse risk — the reconciliation silently not running, which also
          # reads 0 — is covered by WorkflowLivenessStale on the kyc-orphaned-party-detection
          # heartbeat, not by this rule.
          expr: openbank_kyc_orphaned_parties > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Eligible parties have no KYC case at all"
            description: "openbank_kyc_orphaned_parties is {{ $value }} — that many parties, all past the detection grace period and all created after the auto-open consumer demonstrably worked, have NO kyc_cases row. Each is a customer stuck in PENDING_KYC, and nothing retries because the PARTY_CREATED event was acked and dropped (#5698). Not self-healing — the event is gone, so it needs a replay per party. Before remediating, CHECK what these parties are: parties that predate the consumer are already excluded (openbank_kyc_orphaned_parties_pre_consumer), but an e2e fixture party is indistinguishable from a real customer here, and a triage pass has twice ranked ineligible rows as the estate's top finding (#9726). The ids are logged by kyc-service under `[orphan-detection]`; openbank_kyc_orphaned_parties_oldest_age_seconds says how long the worst one has been waiting. Do not quote the party count as a customer-impact figure without confirming each id has an account."
        - alert: KycSanctionsListChangeUnrecognised
          # Issue #15908. kyc-service consumes the sanctions list-change events from a topic whose
          # event type travels ONLY in the `ce-type` Kafka header. A consumer and a producer that
          # disagree about that shape produce no error anywhere: the record is acked, no screening
          # case is opened, lag reads zero and the pod is healthy. The one thing that moves is this
          # counter's `unrecognised` outcome, and until now no rule read it.
          #
          # Any occurrence is the signal — one is enough, because the consumer already counts the
          # sibling event types that legitimately share the topic as `ignored`. Hence no ratio
          # against `handled`, which is zero by design while the trigger loop is switched off.
          #
          # TWO branches, because the counter is registered lazily, on the first record with that
          # outcome. The series is therefore born already positive, and increase() cannot see a
          # counter whose first observed sample is its first increment — so an increase-only rule
          # would miss the first burst after every pod start, which for a wire-shape mismatch is
          # every record there is. The second branch catches the birth: positive now, absent an
          # hour ago.
          #
          # Cold-pod reading: on a fresh start the series does not exist, so neither branch has an
          # operand and the rule cannot fire. It stays quiet if the counter is ever pre-registered
          # at 0 as well — increase() is 0 and `> 0` rejects the birth. Both readings, and the two
          # firing ones, are held by tests/promtool/kyc_sanctions_list_change_alerts_test.yaml.
          expr: |
            sum by (namespace, pod) (
              (increase(openbank_kyc_sanctions_list_change_events_total{outcome="unrecognised"}[1h]) > 0)
              or
              (openbank_kyc_sanctions_list_change_events_total{outcome="unrecognised"} > 0
                unless openbank_kyc_sanctions_list_change_events_total{outcome="unrecognised"} offset 1h)
            ) > 0
          labels:
            severity: warning
          annotations:
            # Driven by Kafka consumption, not by a scheduler: there is no period to size the
            # window against.
            subject_period: continuous
            summary: "kyc-service acked a sanctions list-change record it could not recognise"
            description: "openbank_kyc_sanctions_list_change_events_total{outcome=\"unrecognised\"} moved on {{ $labels.pod }} within the last hour: a record on the sanctions screening topic carried a missing or unknown `ce-type` header and was acked without opening a screening case. Either sanctions-service changed how it types its events (header value, or type moved into the body) or a new event type joined the topic. Until it is resolved, list changes do not trigger re-screening and nothing else reports it — no lag, no dead-letter, no error. kyc-service logs the offending type under `[sanctions-list-changes-in]`; compare it with the `ce-type` values in the committed kyc-service/sanctions-service pact, then replay the affected publications."
        - alert: KycRescreenBacklogOverdue
          # Issue #15961. A sanctions list change queues re-screening triggers in
          # kyc_screening_triggers; a trigger leaves the backlog only when its case is opened.
          # A stalled loop and an idle one both showed nothing, so this reads the backlog's
          # OLDEST age, sampled from the database every minute by RescreenBacklogGauge.
          #
          # Deadline 24h. ADR-0256 promises a list change reaches the customer "within the
          # refresh cycle", and the sanctions lists refresh daily. The healthy worst case is far
          # inside it: five attempts at 5m * attempt backoff park a row within ~1h, so a row
          # older than a day is one the next list change will overtake.
          #
          # Cold pod: every gauge reads NaN until the first sample, and NaN > x is false, so a
          # fresh start cannot fire. A feature that is off with nothing pending reads age 0.
          # Off WITH a backlog is KycRescreenLoopDisabledWithPending's job, hence the unless.
          # Several kyc pods publish the same database value, so max by namespace, not by pod.
          expr: |
            max by (namespace) (openbank_kyc_rescreen_backlog_oldest_age_seconds) > 86400
            unless on (namespace)
            max by (namespace) (openbank_kyc_rescreen_loop_disabled_with_pending) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "A sanctions list change has not reached a customer as a re-screening case within 24h"
            description: "openbank_kyc_rescreen_backlog_oldest_age_seconds is over 86400: the oldest kyc_screening_triggers row still PENDING, OPEN_FAILED or DEFERRED was enqueued more than 24 hours ago, so a customer the list change could match has had no re-screening case opened. openbank_kyc_rescreen_backlog_pending says how many are waiting. Check the case coordinator (OPEN_FAILED rows carry failed_reason), the kyc.screening-trigger.retry heartbeat, and KYC_COORDINATOR_OPEN_FAILED outbox events for parked rows, which need an operator to open the case and reconcile the row. Runbook: kyc-service docs 05-operations, Re-screening backlog."
        - alert: KycRescreenLoopDisabledWithPending
          # Issue #15961. The trigger loop is switched off (openbank.kyc.screening-triggers.enabled
          # false, the ONE switch for every path that opens a case) while undrained triggers
          # remain. While off, the consumer still records every SANCTIONS_LIST_CHANGED as a
          # PENDING row (coalesced to one per party), so this series sees every change that has
          # not reached a customer; turning the switch on drains them. A distinct series from an
          # empty queue, so "off and empty" reads 0 and stays quiet, and the cold-pod NaN cannot
          # fire either.
          expr: max by (namespace) (openbank_kyc_rescreen_loop_disabled_with_pending) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "KYC re-screening loop is switched off with list changes still pending"
            description: "openbank_kyc_rescreen_loop_disabled_with_pending is 1: kyc-service's ADR-0256 trigger loop is disabled but kyc_screening_triggers still holds PENDING, OPEN_FAILED or DEFERRED rows (openbank_kyc_rescreen_backlog_pending), so those customers will not be re-screened. Enable the loop (KYC_SCREENING_TRIGGERS_ENABLED=true) and the retry job drains the queue in batches, or reconcile each row by hand. While the loop is off, list changes arriving now are still queued (one PENDING row per party) and counted as openbank_kyc_sanctions_list_change_events_total{outcome=\"recorded_while_disabled\"}, so nothing is lost. Runbook: kyc-service docs 05-operations, Re-screening backlog."
        - alert: OnboardingProjectionWireFormatMismatch
          # #4353/#4692/#6248. sca-service published DEVICE_ENROLLED without the discriminator in
          # the payload body; onboarding's parser fell through to `?: return`, and 15 enrolments
          # were consumed, acked and discarded with no lag, no error and no log. The alertable
          # state is therefore the SUCCESS state, not an error rate: a topic delivering messages
          # of which NONE are projected. `ProjectionOutcomeMetrics` was added for exactly this
          # and this rule was written only as prose in its KDoc — so when #6248 asked why the
          # alert had not fired, the answer was that it had never been created. A suggested rule
          # in a comment is documentation, not a control.
          expr: |
            sum by (topic) (rate(openbank_onboarding_projection_events_total{outcome="UNRECOGNISED"}[1h])) > 0
            and
            sum by (topic) (rate(openbank_onboarding_projection_events_total{outcome="PROJECTED"}[1h])) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            # continuous: the subject is inbound event traffic, not a periodic job, so the 1h
            # window is bounded by the `and PROJECTED == 0` clause rather than by a period.
            subject_period: continuous
            summary: "onboarding-service recognises nothing on {{ $labels.topic }}"
            description: "Every message onboarding-service consumed from `{{ $labels.topic }}` in the last hour parsed as JSON and matched no known event type, and none was projected. The producer and this consumer disagree about the wire format — typically a missing or renamed `eventType` discriminator in the payload body. The funnel is silently frozen for this topic: no lag, no errors, no log lines. Compare a real message on the topic against the parser in `OnboardingEventConsumer`."
        - alert: OnboardingProjectionSeedingBackwards
          # Events arriving for parties whose row does not exist yet. Since #6248 the row is
          # seeded from the event rather than dropped, so this is no longer data loss — but a
          # topic where seeding DOMINATES means party-events is chronically behind its siblings,
          # and every such row carries no legal name or email until PARTY_CREATED lands.
          # A steady trickle is normal across three independent consumer groups; the ratio is not.
          expr: |
            sum by (topic) (rate(openbank_onboarding_projection_events_total{outcome="SEEDED_UNKNOWN_PARTY"}[1h]))
            >
            sum by (topic) (rate(openbank_onboarding_projection_events_total{outcome="PROJECTED"}[1h]))
          for: 30m
          labels:
            severity: warning
          annotations:
            subject_period: continuous
            summary: "onboarding-service is assembling records backwards on {{ $labels.topic }}"
            description: "More events on `{{ $labels.topic }}` created a placeholder onboarding record than updated an existing one, for 30 minutes. party-events-in is running behind the KYC/SCA topics, so rows are being built from the wrong end and will show no legal name or email until PARTY_CREATED arrives. Check the `onboarding-service-party` consumer group's lag."
        - alert: KafkaConsumerGroupLagStuck
          # General event-bus safety net — the config comment on the Kafka Exporter calls
          # consumer-group lag "the single most useful event-bus health signal" and until now NO
          # alert used it. A consumer group whose lag stays high is stuck (wedged handler, a
          # dependency it needs is down, or it lost topic access). Threshold + 15m dwell keep it
          # quiet under normal catch-up bursts in a low-volume sandbox.
          expr: kafka_consumergroup_lag > 500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Kafka consumer group {{ $labels.consumergroup }} is falling behind"
            description: "Consumer group {{ $labels.consumergroup }} has lag >500 on topic {{ $labels.topic }} sustained for 15m — it is not keeping up. A wedged handler, a down dependency, or a missing topic ACL (the class that took party-service offline) all look like this. Check the consuming service's logs and its KafkaUser ACLs."
    # Ongoing sanctions / PEP monitoring of approved business cases (ADR-0376, kyb side).
    # kyb-service owes the monitored-subject registry of sanctions-service one registration per
    # screened party of every approved case, and owes an operator a decision on every finding the
    # registry sends back. Both debts are STOCKS read from stored timestamps, so both survive a
    # restart, and both are silent when unpaid: the pod is healthy, no request fails, no record is
    # dead-lettered. Held by tests/promtool/kyb_monitoring_alerts_test.yaml.
    - name: openbank.kyb.ongoing-monitoring
      rules:
        - alert: KybMonitoringRegistrationStuck
          # A registration or withdrawal has been owed to the registry for over half an hour. The
          # relay retries with backoff and never gives up, so this is not "one call failed" — it is
          # the registry refusing (503 while its own switch is off, 403 for a wrong client) or
          # unreachable, and for as long as it lasts an approved customer is not monitored.
          #
          # Only while the switch is on: with it off the rows are owed by design and are sent when
          # it is turned on, so the age grows without anything being wrong.
          #
          # Cold-pod reading: both gauges are NaN until the first scheduled run has looked at the
          # store, and a comparison with NaN is false, so a fresh pod cannot fire this. After that
          # the age comes from `pending_since` in the database, not from the process start, so a
          # restart neither resets a real backlog nor invents one.
          expr: |
            max by (namespace) (
              openbank_kyb_monitoring_registrations_oldest_pending_age_seconds
              and on (namespace, pod) (openbank_kyb_monitoring_enabled == 1)
            ) > 1800
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "kyb-service cannot register approved business customers for sanctions monitoring"
            description: "The oldest registration kyb-service owes the monitored-subject registry has been pending for {{ $value | humanizeDuration }} in {{ $labels.namespace }}. Until it is delivered, the entity, representatives or beneficial owners of at least one APPROVED business case are not under ongoing monitoring: a new sanctions or PEP listing of them raises nothing. `openbank_kyb_monitoring_registrations_total{outcome=\"failed\"}` carries the reason: `http_503` means sanctions-service has `openbank.sanctions.monitoring.enabled` off, `http_403` means kyb-service is not calling as its own client, `unavailable` means the route or the mTLS path. Nothing is lost while this fires — the rows stay owed and are sent once the registry accepts them — but nothing is monitored either."
        - alert: KybMonitoringReviewUnresolved
          # A monitoring finding on an approved case has waited a day for an operator's decision.
          # The case stays as it was for the customer on purpose, so nothing else in the system
          # pushes anyone to look: no customer is blocked, no timer abandons it.
          #
          # Read whatever the registration switch says: a finding about a subject registered
          # earlier is still a finding.
          #
          # Cold-pod reading: NaN until the first scheduled run, then the age of
          # `monitoring_review_since` in the database — 0 when no such case exists.
          expr: max by (namespace) (openbank_kyb_monitoring_reviews_oldest_open_age_seconds) > 86400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "a sanctions-monitoring finding on an approved business customer has waited a day for review"
            description: "The oldest undecided monitoring finding in {{ $labels.namespace }} has waited {{ $value | humanizeDuration }} (`openbank_kyb_monitoring_reviews_open` says how many cases have one). Ongoing monitoring matched the entity or a related party of an approved business case against a sanctions, terrorist or PEP list entry. The case keeps its status and appears in no status queue: list such cases with `GET /api/v1/kyb/monitoring/holds` and decide each finding with `POST /api/v1/kyb/cases/{id}/monitoring/findings/{findingId}/disposition`. The customer sees no change in the meantime, so nobody will chase it from that side."
        - alert: KybMonitoringFindingNotRouted
          # A record on the findings channel that this service could not turn into a review of one
          # of its cases: an unknown or missing `ce-type` header (`unrecognised` — the wire-shape
          # disagreement of #15900), a record typed as a finding whose body has no usable owner,
          # finding id or subject reference (`malformed` — the same disagreement one level down; it
          # is dead-lettered as well), a finding addressed to kyb-service about a reference it never
          # registered (`unknown_subject`), or one whose case has ended (`not_monitored`), or one
          # whose stored decision disagrees with the case being written (`decision_conflict`, nothing
          # of that write commits). All but `malformed` and `decision_conflict` are acked, so there is no lag and no dead-letter; this counter is the only
          # thing that moves.
          #
          # The counters are registered at ZERO when the service boots, so the first occurrence
          # after a restart is an increase like any other and `increase()` sees it. `foreign_owner`
          # and `ignored` are not here: other services' findings and the screening events that
          # share the topic are expected traffic.
          #
          # Cold-pod reading: every series exists at 0 from boot, increase() is 0, and the rule
          # cannot fire.
          expr: |
            sum by (namespace, outcome) (
              increase(openbank_kyb_monitoring_findings_total{outcome=~"unrecognised|malformed|decision_conflict|unknown_subject|not_monitored"}[1h])
            ) > 0
          labels:
            severity: warning
          annotations:
            # Driven by Kafka consumption, not by a scheduler: there is no period to size the
            # window against.
            subject_period: continuous
            summary: "kyb-service acked a monitoring finding it could not route to a case ({{ $labels.outcome }})"
            description: "`openbank_kyb_monitoring_findings_total{outcome=\"{{ $labels.outcome }}\"}` moved in {{ $labels.namespace }} within the last hour. `unrecognised`: a record on the sanctions screening topic carried a missing or unknown `ce-type` header — sanctions-service changed how it types its events, or a new type joined the topic; compare with the committed kyb-service/sanctions-service pact. `malformed`: a record typed as a finding had no usable `ownerService`, `findingId` or `subjectRef` — the producer changed the body; the record is in `openbank.dlq.kyb.sanctions-monitoring-in`. `decision_conflict`: a finding's stored decision disagrees with the case being written, so nothing of that write committed and the record is dead-lettered in `openbank.dlq.kyb.sanctions-monitoring-in`; compare `kyb_monitoring_findings` for the case with the decision log before replaying. `unknown_subject`: the registry holds a subject under kyb-service's client that kyb-service has no record of, so its finding reaches no case — look for a registration made outside the relay, or a store that was restored from an older backup. `not_monitored`: the finding's case has ended or no longer carries the subject, and its withdrawal had not reached the registry yet. In every one of them the match itself was NOT reviewed by anyone."
        - alert: KybMonitoringRegistryUnauthorised
          # The registry answered 401 or 403: it does not accept kyb-service as a caller. Not one
          # subject can be registered until that is fixed, whatever the backlog age says so far.
          # The two series exist at zero from boot, so the first refusal is an increase.
          expr: |
            sum by (namespace) (
              increase(openbank_kyb_monitoring_registrations_total{outcome="unauthorised"}[30m])
            ) > 0
          labels:
            severity: critical
          annotations:
            subject_period: continuous
            summary: "the monitored-subject registry does not accept kyb-service as a caller"
            description: "`openbank_kyb_monitoring_registrations_total{outcome=\"unauthorised\"}` moved in {{ $labels.namespace }}: sanctions-service answered 401 or 403 to a registration or withdrawal. `http_403` is the registry refusing the client (kyb-service must call as its OWN client, not the fleet's shared one); `http_401` is no valid token at all. No approved business customer is being registered for monitoring while this lasts. The rows stay owed and are sent once the caller is accepted."
        - alert: KybMonitoringSubjectRefused
          # The registry's validation rejects a subject as it is (400 or 422 — nothing else is
          # read as a refusal), so retrying cannot help and the row left the retry loop. Each one is an approved party
          # that is NOT monitored. Kept out of the backlog age on purpose: a permanent refusal
          # there would hold the critical alert lit and hide the next real outage behind it.
          #
          # Cold-pod reading: NaN until the first scheduled run, then a count from the database.
          expr: max by (namespace) (openbank_kyb_monitoring_registrations_refused) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "sanctions-service refuses to monitor {{ $value }} approved business subject(s)"
            description: "{{ $value }} subject(s) of approved business cases in {{ $labels.namespace }} were rejected by the monitored-subject registry's validation with 400 or 422 (`openbank_kyb_monitoring_registrations_total{outcome=\"refused\"}` carries the status). They are approved and NOT monitored. The operator view of a case (`GET /api/v1/kyb/cases/{id}`) shows `monitoringState: REFUSED` on the subject. The registry rejects a name with no searchable character or over its length limit: the name comes from the register extract, so the fix is in the registry's validation or in the extract. A refused row is sent again at every write of its case and at the next re-assertion."
        - alert: KybMonitoringApprovedCaseUnscreened
          # An approved case that carries no screening at all has nobody to register: it was
          # approved while related-party screening was switched off. Only while monitoring is on —
          # before that, nothing is registered for anyone.
          expr: |
            max by (namespace) (
              openbank_kyb_monitoring_cases_unscreened
              and on (namespace, pod) (openbank_kyb_monitoring_enabled == 1)
            ) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} approved business case(s) were never screened and are not monitored"
            description: "{{ $value }} business case(s) in {{ $labels.namespace }} are SIGNED or ACTIVE with no related-party screening, so ongoing monitoring has no subject to register for them. They were approved while `openbank.kyb.screening.enabled` was off. Nothing screens an approved case after the fact today; until something does, these customers are outside both the onboarding screen and ongoing monitoring."
        - alert: KybMonitoringExitOwed
          # An operator confirmed a sanctions match on an approved business customer, so the
          # relationship has to end, and nobody has recorded that it did. kyb-service keeps the
          # case monitored and publishes nothing about it (#16028: the shared lifecycle topic reaches
          # a customer-facing projection and the warehouse), so this alert is what makes somebody
          # carry the exit out. It clears when a second reviewer confirms the exit
          # (`monitoring/exit/complete`), which needs the case ended and the entity party CLOSED.
          #
          # Cold-pod reading: NaN until the first scheduled run, then a count from the database.
          expr: max by (namespace) (openbank_kyb_monitoring_exits_owed) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "an approved business relationship must be exited and the exit is not recorded"
            description: "{{ $value }} business case(s) in {{ $labels.namespace }} carry a CONFIRMED sanctions match found by ongoing monitoring and no record that the relationship was ended (`openbank_kyb_monitoring_exits_oldest_owed_age_seconds` says for how long). The customer is still active: the party, its mandates and its accounts are untouched, and the case stays monitored. Nothing is published about it and no service acts on it yet (#15992) — restrict and exit the relationship by hand (reject the case, close the entity party), then one KYC reviewer proposes the exit (`POST /api/v1/kyb/cases/{id}/monitoring/exit/propose`) and a different one confirms it (`.../monitoring/exit/complete`), which clears this alert. `GET /api/v1/kyb/monitoring/holds` lists the cases."
        - alert: KybMonitoringCaseUnreconciled
          # A case's registrations are written in the same transaction as the case — by this
          # release. A pod of the previous release (a rolling deploy, a rollback) writes the case
          # and not the registrations, and the relay brings such a case into step on its next run.
          # This is that repair not happening: a rejected case whose subjects stay registered, or
          # an approved one whose subjects are not owed.
          #
          # Only while the switch is on: the repair is part of the relay's run.
          # Cold-pod reading: NaN until the first scheduled run, then a count from the database.
          expr: |
            max by (namespace) (
              openbank_kyb_monitoring_cases_unreconciled
              and on (namespace, pod) (openbank_kyb_monitoring_enabled == 1)
            ) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} business case(s) are out of step with their monitoring registrations"
            description: "{{ $value }} approved or ended business case(s) in {{ $labels.namespace }} were last written without their monitoring registrations being brought into step, and the relay has not repaired them for half an hour. Until it does, a subject of such a case can be approved and not owed to the registry, or ended and still registered. Expected for a minute or two while pods of two releases run side by side; lasting, it means the relay's repair step fails — `openbank_kyb_monitoring_runs_total{outcome=\"failed\"}` and the log of `KybMonitoringScheduler` say why."
        - alert: KybMonitoringFindingDeadLettered
          # A finding that could not be applied after its retries, or that was malformed, is in the
          # channel's dead-letter topic: a sanctions or PEP match nobody has reviewed.
          expr: |
            increase(kafka_topic_partition_current_offset{topic="openbank.dlq.kyb.sanctions-monitoring-in"}[1h]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            # Driven by Kafka consumption, not by a scheduler: there is no period to size the
            # window against.
            subject_period: continuous
            summary: "monitoring findings for kyb-service are being dead-lettered"
            description: "Records are landing in `openbank.dlq.kyb.sanctions-monitoring-in`: kyb-service nacked a MONITORED_SUBJECT_MATCHED record, either because its body could not be read as a finding or because applying it kept failing. Each is a match on an approved business customer that reached no review. Read the topic, fix the cause (kyb-service logs it under `[sanctions-monitoring-in]`), and replay the records onto `openbank.sanctions.screening.event`."
