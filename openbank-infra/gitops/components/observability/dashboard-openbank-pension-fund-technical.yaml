# Pension-fund technical dashboard (#12424).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-pension-fund-technical
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-pension-fund-technical.json: |
    {
      "id": null,
      "uid": "openbank-pension-fund-technical",
      "title": "OpenBank — Pension fund technical",
      "description": "pension-fund-service: HTTP RED, spans, JVM, price feed, optimistic-lock conflicts, replays, scheduler liveness, logs (#12424).",
      "tags": [
        "openbank",
        "pension",
        "pension-fund",
        "technical"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "editable": false,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1,
            "options": [],
            "current": {}
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Runbook",
          "type": "link",
          "url": "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pension-fund",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "title": "RED (HTTP)",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "id": 1,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "title": "Requests by route",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (method, uri) (rate(http_server_requests_seconds_count{namespace=\"pension-fund\",uri!~\"/q/.*\"}[5m]))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "5xx ratio by route",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"pension-fund\",status=~\"5..\"}[5m])) / clamp_min(sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"pension-fund\"}[5m])), 1e-9)",
              "legendFormat": "{{uri}}"
            }
          ],
          "id": 3,
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "p95 latency by route",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{namespace=\"pension-fund\",uri!~\"/q/.*\"}[5m])))",
              "legendFormat": "{{uri}}"
            }
          ],
          "id": 4,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "4xx by status (403 on approve = four-eyes refusal)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status, uri) (rate(http_server_requests_seconds_count{namespace=\"pension-fund\",status=~\"4..\"}[5m]))",
              "legendFormat": "{{status}} {{uri}}"
            }
          ],
          "id": 5,
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Server spans",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "id": 6,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          }
        },
        {
          "title": "Availability (non-error server spans)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - (sum(rate(traces_spanmetrics_calls_total{service=\"openbank-pension-fund-service\",span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[1h])) / clamp_min(sum(rate(traces_spanmetrics_calls_total{service=\"openbank-pension-fund-service\",span_kind=\"SPAN_KIND_SERVER\"}[1h])), 1e-9))",
              "legendFormat": "availability"
            }
          ],
          "id": 7,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Server span p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"openbank-pension-fund-service\",span_kind=\"SPAN_KIND_SERVER\"}[5m])))",
              "legendFormat": "p95"
            }
          ],
          "id": 8,
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Runtime",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "id": 9,
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 1
          }
        },
        {
          "title": "JVM heap",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"pension-fund\",area=\"heap\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 10,
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 8,
            "h": 8
          }
        },
        {
          "title": "GC pause",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace=\"pension-fund\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 11,
          "gridPos": {
            "x": 8,
            "y": 27,
            "w": 8,
            "h": 8
          }
        },
        {
          "title": "Pod restarts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"pension-fund\"}[1h]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 12,
          "gridPos": {
            "x": 16,
            "y": 27,
            "w": 8,
            "h": 8
          }
        },
        {
          "title": "Integrity signals",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "id": 13,
          "gridPos": {
            "x": 0,
            "y": 35,
            "w": 24,
            "h": 1
          }
        },
        {
          "title": "Market-price lookups by outcome",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (increase(openbank_pension_fund_market_price_lookups_total[1h]))",
              "legendFormat": "{{outcome}}"
            }
          ],
          "description": "found = priced; missing = the feed answered with no price for the day; failed = the port threw.",
          "id": 14,
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 8,
            "h": 8
          }
        },
        {
          "title": "Optimistic-lock conflicts (409, nothing applied)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (aggregate) (increase(openbank_pension_fund_optimistic_lock_conflicts_total[1h]))",
              "legendFormat": "{{aggregate}}"
            }
          ],
          "id": 15,
          "gridPos": {
            "x": 8,
            "y": 36,
            "w": 8,
            "h": 8
          }
        },
        {
          "title": "Idempotent order replays",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (type) (increase(openbank_pension_fund_order_replays_total[1h]))",
              "legendFormat": "{{type}}"
            }
          ],
          "id": 16,
          "gridPos": {
            "x": 16,
            "y": 36,
            "w": 8,
            "h": 8
          }
        },
        {
          "title": "Scheduler liveness",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "id": 17,
          "gridPos": {
            "x": 0,
            "y": 44,
            "w": 24,
            "h": 1
          }
        },
        {
          "title": "Workflow heartbeat age vs expected interval",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (workflow) (openbank_workflow_last_success_age_seconds{workflow=\"pension-fund-state-gauges\"}) / max by (workflow) (openbank_workflow_expected_interval_seconds{workflow=\"pension-fund-state-gauges\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "description": "Ratio > 2 is WorkflowLivenessStale. The state gauges (NAV age, pending orders, approval queues) are only as fresh as this job.",
          "id": 18,
          "gridPos": {
            "x": 0,
            "y": 45,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Correction re-pricing volume",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (fund) (increase(openbank_pension_fund_nav_correction_repriced_total[1d]))",
              "legendFormat": "{{fund}}"
            }
          ],
          "id": 19,
          "gridPos": {
            "x": 12,
            "y": 45,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Logs",
          "type": "row",
          "collapsed": false,
          "panels": [],
          "id": 20,
          "gridPos": {
            "x": 0,
            "y": 53,
            "w": 24,
            "h": 1
          }
        },
        {
          "title": "Pension-fund errors",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"pension-fund\"} |~ \"(?i)error|exception\""
            }
          ],
          "id": 21,
          "gridPos": {
            "x": 0,
            "y": 54,
            "w": 24,
            "h": 8
          }
        }
      ]
    }
