#
# rum.open-bank.tech on the shared Gateway (ADR-0324 Phase 1), the Gateway API translation
# of the `ingress:` block in apps/rum-gateway.yaml (ADR-0088 D4b; threat model
# docs/threat-models/rum-ingest-gateway.md). The receiver's own OIDC auth is unchanged and
# is what gates every request; this file only carries the edge controls.
#
# IN DNS since the cutover (2026-10-03): external-dns publishes rum.open-bank.tech from this
# route, pointing at the Gateway's NLB. The chart-rendered nginx Ingress now carries the
# `external-dns.kubernetes.io/controller: gateway-api-cutover-pending` annotation and keeps
# serving on ingress-nginx as the rollback (swap the annotation back).
#
# TLS PINNING: the mobile app pins this host's SPKI, so the Gateway serves the SAME Secret
# (rum-gateway-tls, private-key-rotation-policy: Never) through the ReferenceGrant below.
# Never point the listener at a newly issued certificate.
#
# Annotation mapping from apps/rum-gateway.yaml:
#   ssl-redirect (default)      -> the Gateway's http listener redirects every host
#   path allow-list             -> the two PathPrefix matches below, nothing else routes
#   proxy-body-size 512k (D3)   -> requestBuffer.limit 512Ki: a larger body is a 413
#   limit-rps 20 x burst 3 (D1) -> local rate limit PER CLIENT IP (sourceCIDR Distinct):
#                                  20 requests per second per address. Envoy's local limit
#                                  is a token bucket whose size equals its refill, so the
#                                  burst is 20 where nginx allowed 60; the sustained rate is
#                                  the same. Possible only because the Gateway's Service
#                                  runs externalTrafficPolicy: Local (envoy-gateway/
#                                  gateway.yaml), so Envoy sees the device's address and not
#                                  a node's SNAT address. Like nginx's, the bucket is per
#                                  proxy replica; one connection lands on one replica.
#   controller HSTS / nosniff / hide-headers
#                               -> ResponseHeaderModifier below
#   openbank.io/ungated-machine-callers (ADR-0234) is an Ingress-policy declaration; it
#   moves to the HTTPRoute form when Phase 2 rewrites that Kyverno policy for routes.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-gateway-tls
  namespace: observability
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: rum-gateway-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rum-gateway
  namespace: observability
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https-rum
  hostnames:
    - rum.open-bank.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/traces
        - path:
            type: PathPrefix
            value: /v1/metrics
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: nosniff
            remove:
              - X-Powered-By
      backendRefs:
        - name: rum-gateway
          port: 4318
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rum-gateway
  namespace: observability
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rum-gateway
  requestBuffer:
    limit: 512Ki
  timeout:
    http:
      requestTimeout: 60s
  rateLimit:
    local:
      rules:
        # One bucket per distinct client address (D1). No rule without clientSelectors, so
        # there is no route-wide ceiling: a shared bucket would let one noisy device starve
        # every other one, which is the failure the per-client limit exists to prevent.
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 20
            unit: Second
