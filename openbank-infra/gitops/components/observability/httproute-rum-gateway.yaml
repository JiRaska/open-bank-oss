#
# rum.open-bank.tech on the shared Gateway (ADR-0324 Phase 1), the Gateway API translation
# of the `ingress:` block in apps/rum-gateway.yaml (ADR-0088 D4b; threat model
# docs/threat-models/rum-ingest-gateway.md). The receiver's own OIDC auth is unchanged and
# is what gates every request; this file only carries the edge controls.
#
# NOT YET IN DNS. external-dns skips this route while it carries the controller annotation
# below, so the name still resolves to ingress-nginx, whose Ingress (rendered by the
# rum-gateway chart) keeps serving it. Reachable only on the Gateway's own NLB address
# until the cutover (steps in components/envoy-gateway/httproute-redirect.yaml).
#
# TLS PINNING: the mobile app pins this host's SPKI, so the Gateway serves the SAME Secret
# (rum-gateway-tls, private-key-rotation-policy: Never) through the ReferenceGrant below.
# Never point the listener at a newly issued certificate.
#
# Annotation mapping from apps/rum-gateway.yaml:
#   ssl-redirect (default)      -> the Gateway's http listener redirects every host
#   path allow-list             -> the two PathPrefix matches below, nothing else routes
#   proxy-body-size 512k (D3)   -> requestBuffer.limit 512Ki: a larger body is a 413
#   limit-rps 20 x burst 3 (D1) -> local rate limit, 60 req/s for the ROUTE, not per
#                                  client. nginx limited per client IP; the Gateway's NLB
#                                  Service runs externalTrafficPolicy: Cluster, so the
#                                  proxy sees a node's SNAT address, never the device's,
#                                  and a per-IP bucket would be one bucket per NODE. The
#                                  route-wide ceiling equals nginx's per-client burst, which
#                                  holds the backend's D1 bound; per-device limiting needs
#                                  the client IP preserved first (a Phase-1 follow-up).
#   controller HSTS / nosniff / hide-headers
#                               -> ResponseHeaderModifier below
#   openbank.io/ungated-machine-callers (ADR-0234) is an Ingress-policy declaration; it
#   moves to the HTTPRoute form when Phase 2 rewrites that Kyverno policy for routes.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-gateway-tls
  namespace: observability
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: rum-gateway-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rum-gateway
  namespace: observability
  annotations:
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https-rum
  hostnames:
    - rum.open-bank.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/traces
        - path:
            type: PathPrefix
            value: /v1/metrics
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: nosniff
            remove:
              - X-Powered-By
      backendRefs:
        - name: rum-gateway
          port: 4318
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rum-gateway
  namespace: observability
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rum-gateway
  requestBuffer:
    limit: 512Ki
  timeout:
    http:
      requestTimeout: 60s
  rateLimit:
    local:
      rules:
        - limit:
            requests: 60
            unit: Second
