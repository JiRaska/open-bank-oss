# Pension platform alerts (ADR-0334, #12424; umbrella #12350).
#
# Every rule reads a series the pension service measured, never a sentinel:
#
#   * The state gauges (openbank_pension_queue_*, openbank_pension_aggregates,
#     openbank_pension_contracts) are registered only after the first snapshot was READ, so
#     a cold pod publishes no series at all rather than a 0 that reads as "empty queue". The
#     same holds for openbank_pension_state_contribution_deadline_breaches, which is registered
#     on the first completed daily check (it used to read 0 from boot, "no deadline missed",
#     for up to a day). Re-derived at t=0 on a cold pod: absent, so nothing below can fire
#     from boot; "it never ran" is the job of the liveness rules (the fleet-wide
#     WorkflowLivenessStale plus PensionStateGaugesAbsent here).
#   * An EMPTY queue reports oldest_age_seconds = 0 — a measurement, not a seed.
#
# Burn-rate alerts for the two money-path SLOs (openbank-pension-availability / -latency in
# pyrra-slo-money-path.yaml) are generated by Pyrra and deliberately not repeated here.
#
# What is NOT here, and why: "notifications skipped while enabled" cannot happen by
# construction — ParticipantNotificationPublisher returns SKIPPED only when
# openbank.pension.notifications.enabled is false, so skipped and enabled are mutually
# exclusive and such a rule would match an empty vector forever. The live failure modes of
# that channel are a broker that refuses the notice (PensionNotificationsFailing) and a
# payout-account change held because its notice could not be sent
# (PensionPayoutAccountChangeNoticeFailed).
#
# Runbook: docs/runbooks/pension-alerts.md (docs/runbooks/svc-pension.md is generated and
# drift-gated, so alert procedures live beside it rather than in it).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-pension-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.pension.queues
      interval: 1m
      rules:
        # A payment no contract claims stays parked until an operator assigns or returns it;
        # the participant's money is neither invested nor refunded meanwhile.
        - alert: PensionUnmatchedPaymentsAgeing
          expr: max(openbank_pension_queue_oldest_age_seconds{queue="unmatched_payments"}) > 3 * 86400
          for: 30m
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Pension unmatched payments older than 3 days"
            description: >-
              The oldest OPEN unmatched pension payment is {{ $value | humanizeDuration }} old.
              Work the operator queue (GET /api/v1/pension/funding/operations/unmatched?status=OPEN):
              assign each payment to its contract or return it to the payer.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionunmatchedpaymentsageing"

        # A payout instruction stays PENDING until it is handed to domestic-payment-service.
        - alert: PensionPaymentInstructionsStuck
          expr: max(openbank_pension_queue_oldest_age_seconds{queue="payment_instructions_pending"}) > 2 * 3600
          for: 15m
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Pension payout instructions pending for more than 2 hours"
            description: >-
              The oldest PENDING pension payment instruction is {{ $value | humanizeDuration }} old:
              payout money is not reaching the payment hub. Check the exit Temporal workers and
              domestic-payment-service availability.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionpaymentinstructionsstuck"

        # CZ state-contribution claims are filed per quarter (ZDPS §16(2)); a claim still
        # PENDING four months after it was created has missed its filing window.
        - alert: PensionIncentiveClaimsUnfiled
          expr: max(openbank_pension_queue_oldest_age_seconds{queue="incentive_claims_pending"}) > 120 * 86400
          for: 1h
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Pension incentive claims PENDING for more than 120 days"
            description: >-
              The oldest PENDING state-incentive claim is {{ $value | humanizeDuration }} old. A claim
              format with no channel adapter, or a filing job that is failing, leaves claims unfiled.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionincentiveclaimsunfiled"

    - name: openbank.pension.deadlines
      interval: 1m
      rules:
        # §18(4) ZDPS: returns DUE must be reported by the 10th of the month. Warn from the
        # 7th while anything is still DUE, so an operator has three days, not zero.
        - alert: PensionStateContributionReturnReportDue
          expr: |
            max(openbank_pension_queue_size{queue="state_contribution_returns_due"}) > 0
            and on() day_of_month() >= 7
            and on() day_of_month() <= 10
          for: 1h
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "State-contribution returns still DUE close to the 10th"
            description: >-
              {{ $value }} state-contribution return(s) are DUE and the monthly return report is due
              by the 10th (ZDPS §18(4)). The daily deadline job files it; check that it is running
              (workflow pension-state-contribution-deadlines) or file it from the operations API.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionstatecontributionreturnreportdue"

        # The daily check found a regulatory deadline already missed.
        - alert: PensionStateContributionDeadlineBreached
          expr: max by (kind) (openbank_pension_state_contribution_deadline_breaches) > 0
          for: 15m
          labels:
            severity: critical
            team: pension
          annotations:
            summary: "Pension state-contribution deadline missed"
            description: >-
              The daily state-contribution check counts {{ $value }} item(s) past their {{ $labels.kind }}
              deadline (claim_filing: claims not filed in their quarter; claim_payment: filed claims
              the agency has not paid when expected; return_due: returns not reported by the 10th).
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionstatecontributiondeadlinebreached"

    - name: openbank.pension.integrations
      interval: 1m
      rules:
        # failure-strategy: dead-letter-queue on domestic-payment-events-in. The DLQ has no
        # consumer, so retained records are unapplied settlements. Compare the end and start
        # offsets per partition: an increase over one hour would stop alerting on an old record.
        - alert: PensionPaymentEventDeadLettered
          expr: |
            sum(kafka_topic_partition_current_offset{topic="openbank.dlq.pension.domestic-payment-events-in"}
              - kafka_topic_partition_oldest_offset{topic="openbank.dlq.pension.domestic-payment-events-in"}) > 0
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Pension dead-lettered a domestic-payment status event"
            description: >-
              At least one domestic-payment status change could not be applied to a pension payout
              instruction after retries. The payout stays in its previous state until the record in
              openbank.dlq.pension.domestic-payment-events-in is replayed.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionpaymenteventdeadlettered"
            subject_period: continuous

        - alert: PensionNotificationsFailing
          expr: |
            sum(rate(openbank_pension_notification_requests_total{outcome="failed"}[30m]))
              / clamp_min(sum(rate(openbank_pension_notification_requests_total{outcome=~"enqueued|failed"}[30m])), 1e-9)
              > 0.2
          for: 15m
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Over 20% of pension participant notices are not enqueued"
            description: >-
              {{ $value | humanizePercentage }} of pension notices handed to the notification topic
              failed over 30m. Notices are statutory for payout-account changes: such a change stays
              held (inert) until its notice is sent.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionnotificationsfailing"
            subject_period: continuous

        - alert: PensionPayoutAccountChangeNoticeFailed
          expr: sum(increase(openbank_pension_payout_account_changes_total{outcome="notice_failed"}[1h])) > 0
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "A pension payout-account change is held because its notice failed"
            description: >-
              A participant's SCA-confirmed payout-account change was stored but could not be
              notified, so it cannot take effect. The participant will see the old account used.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionpayoutaccountchangenoticefailed"
            subject_period: continuous

        - alert: PensionScaUnavailable
          expr: sum(rate(openbank_pension_sca_consume_total{outcome="unavailable"}[15m])) > 0
          for: 10m
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "sca-service cannot answer pension challenge consumes"
            description: >-
              Pension signatures, transfers, payouts and annuity selections fail closed (503) while
              sca-service cannot be reached or answers 5xx.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionscaunavailable"
            subject_period: continuous

        # A partner that failed every quote it was asked for in the last hour. A partner that
        # answered with no valid offer is NOT failing (that is outcome="no_valid_offer").
        - alert: PensionAnnuityPartnerFailing
          expr: |
            sum by (partner) (increase(openbank_pension_annuity_quotes_total{outcome="failed"}[1h])) > 0
            unless
            sum by (partner) (increase(openbank_pension_annuity_quotes_total{outcome=~"offered|no_valid_offer"}[1h])) > 0
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Annuity partner {{ $labels.partner }} failed every quote in the last hour"
            description: >-
              Annuity partner {{ $labels.partner }} timed out or errored on every quote request in the
              last hour; participants see no offer from it. Check the partner adapter configuration in
              the registry and the partner endpoint.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionannuitypartnerfailing"
            subject_period: continuous

    - name: openbank.pension.liveness
      interval: 5m
      rules:
        # The state gauges every rule above reads are produced by one job. Its staleness is the
        # fleet WorkflowLivenessStale; this catches the job never having registered at all
        # (pension pods running a build without it, or the series dropped), in which case every
        # queue rule above is silent for want of data, not for want of a problem.
        - alert: PensionStateGaugesAbsent
          expr: |
            absent(openbank_workflow_last_success_age_seconds{workflow="pension-state-gauges"})
            and on() count(up{namespace="pension"} == 1) > 0
          for: 30m
          labels:
            severity: warning
            team: pension
          annotations:
            summary: "Pension is running but publishes no state-gauge heartbeat"
            description: >-
              Pension pods are up yet no pension-state-gauges liveness series exists, so the queue and
              deadline alerts of openbank-pension-alerts have no data to evaluate.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/pension-alerts.md#pensionstategaugesabsent"
