#
# Journey: account-overview (ADR-0252, ADR-0331, #4348, #14058). The bank-owned canary customer
# lists its accounts and reads an existing fixture account and balance through the PUBLIC customer
# edge and public token endpoint -- the first two calls the app makes after login.
#
# READ-ONLY. Before enabling the journey, the owner confirms one bank-approved synthetic fixture:
# exactly one ACTIVE, unshared account owned by the token party, denominated in CZK, with the
# configured 1000.00 CZK balance. Open the account through the standard account-opening process
# and establish its opening balance through the approved regulated booking process with synthetic
# taint. The approved posting carries x-openbank-synthetic: true; ledger persists it as
# journal_entries.synthetic = true, which LedgerScope excludes from FINREP/COREP by default.
# Provisioning this identity and running this read-only journey do not authorize account creation
# or funding; use the approved fixture setup process. This journey never creates a party/account,
# posts money or changes the balance. Before setting the expected balance below, the owner confirms
# fixture ownership, status, currency, taint and expected booking/ledger state. The probe checks
# the account projection; it does not reconcile that projection to the ledger or prove a regulatory
# outcome.
#
# What the checks pin, and what they deliberately do not:
#   * the balance EQUALS the fixture's seeded value. Authentication and the account listing can
#     both pass while the balance projection is stale or empty; only an exact expected figure
#     turns "the projection stopped consuming ledger events" into a red run (catalog falsification).
#   * the edge's ownership guard still answers 403 for an account the caller does not own, and
#     401 without a token -- an overview that served anybody's balance would also "pass" a
#     shape-only check.
#   * it does NOT prove the balance equals the ledger's own figure at this instant; it proves the
#     read model converged to the value the ledger was seeded with. The reconciliation of the two
#     is the ledger's job, not a canary's.
#
# The secret arrives through the OPTIONAL ExternalSecret journey-account-overview-oidc. Until the
# identity is provisioned the script logs "credential absent" and fails every check: red, never a
# crash loop and never green. Until the fixture is seeded the "balance equals the fixture" and the
# listing checks fail the same honest way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: journey-account-overview-script
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: journey
    openbank.tech/journey: account-overview
data:
  journey.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    import encoding from 'k6/encoding';

    export const options = {
      vus: 1,
      iterations: 1,
      thresholds: {
        checks: ['rate==1.0'],
        http_req_duration: ['p(95)<3000'],
      },
      tags: { journey: 'account-overview' },
    };

    // Override the bases only for the catalog's documented falsification.
    const CUSTOMER_BASE = __ENV.CUSTOMER_BASE || 'https://customer.open-bank.tech';
    const TOKEN_URL = __ENV.TOKEN_URL || 'https://kc.open-bank.tech/realms/openbank-customers/protocol/openid-connect/token';
    const CLIENT_ID = __ENV.SYNTHETIC_CLIENT_ID || 'openbank-synthetic-retail';
    const CLIENT_SECRET = __ENV.SYNTHETIC_CLIENT_SECRET || '';
    const FIXTURE_BALANCE = Number(__ENV.FIXTURE_BALANCE);
    const FIXTURE_CURRENCY = __ENV.FIXTURE_CURRENCY || '';

    const CHECKS = [
      'an unauthenticated account list is refused',
      'the canary lists exactly its own ACTIVE fixture account',
      'the account can be opened by id',
      'the balance is served for the account',
      'the balance is in the fixture currency and internally consistent',
      'the balance equals the seeded fixture balance',
      'an account the caller does not own is refused',
    ];

    function failAll() {
      const verdicts = {};
      for (const name of CHECKS) verdicts[name] = () => false;
      check(null, verdicts);
    }

    // Never log the secret, the token, headers or response bodies: retained Job logs must stay
    // secret-free and PII-free. Status codes only.
    function fetchToken() {
      if (!CLIENT_SECRET) {
        console.error('account-overview credential absent: SYNTHETIC_CLIENT_SECRET is not set (ExternalSecret journey-account-overview-oidc not provisioned); refusing to probe unauthenticated');
        return null;
      }
      const res = http.post(TOKEN_URL, {
        grant_type: 'client_credentials',
        client_id: CLIENT_ID,
        client_secret: CLIENT_SECRET,
      }, { tags: { endpoint: 'token', service: 'keycloak' } });
      if (res.status !== 200) {
        console.error(`account-overview token request failed: status=${res.status}`);
        return null;
      }
      let token = null;
      try { token = res.json('access_token'); } catch (_) { /* reported below */ }
      if (typeof token !== 'string' || token.length === 0) {
        console.error('account-overview token response carried no access_token');
        return null;
      }
      return token;
    }

    function json(res) {
      try { return res.json(); } catch (_) { return null; }
    }

    // Bind the ownership assertion to the party claim in the token used for this request.
    // The token comes directly from the configured TLS issuer; never log its payload or value.
    function partyIdFromToken(token) {
      if (typeof token !== 'string') return null;
      const parts = token.split('.');
      if (parts.length !== 3 || !parts[1]) return null;
      try {
        const claims = JSON.parse(encoding.b64decode(parts[1], 'rawurl', 's'));
        return claims && typeof claims.party_id === 'string' && claims.party_id.length > 0
          ? claims.party_id : null;
      } catch (_) { return null; }
    }

    // The current API returns CursorPage {data, pagination}. Only accept a complete first page:
    // the canary's fixture must not disappear behind an unexamined cursor. Accept the former
    // bare array only for backward compatibility.
    function accountRows(body) {
      if (Array.isArray(body)) return body;
      const pagination = body && body.pagination;
      const hasMoreField = pagination && Object.prototype.hasOwnProperty.call(pagination, 'hasMore');
      const hasNextPageField = pagination && Object.prototype.hasOwnProperty.call(pagination, 'hasNextPage');
      // PageInfo is @JsonInclude(NON_NULL), so a complete runtime page can omit nextCursor.
      // Missing is safe only with an explicit false completion flag; a present cursor must be null.
      const cursorIsNullish = pagination && (!Object.prototype.hasOwnProperty.call(pagination, 'nextCursor')
        || pagination.nextCursor === null);
      const explicitCompletePage = pagination && (
        (hasMoreField && !hasNextPageField && pagination.hasMore === false)
        || (hasNextPageField && !hasMoreField && pagination.hasNextPage === false)
        || (hasMoreField && hasNextPageField && pagination.hasMore === false && pagination.hasNextPage === false)
      );
      if (body && Array.isArray(body.data) && pagination && typeof pagination === 'object'
          && !Array.isArray(pagination) && explicitCompletePage && cursorIsNullish) {
        return body.data;
      }
      return null;
    }

    function ownedActiveFixture(body, expectedPartyId) {
      const rows = accountRows(body);
      if (!rows || !expectedPartyId || rows.length === 0) return null;
      // A share is not the canary's own account. Also reject any row outside the token party
      // instead of treating a single distinct owner as proof of which party owns the list.
      if (rows.some((account) => !account || account.partyId !== expectedPartyId
          || account.sharedWithMe === true)) return null;
      const active = rows.filter((account) => account.status === 'ACTIVE');
      return active.length === 1 ? active[0] : null;
    }

    // Customer-edge transparently proxies balance-service's {balances: Balance[]} response.
    // The endpoint returns one row per currency for this account; reject malformed, duplicate,
    // foreign-account, or absent rows instead of treating a partial body as a fixture balance.
    function ownedCurrencyBalance(body, accountId, currency) {
      if (!body || typeof body !== 'object' || Array.isArray(body) || !Array.isArray(body.balances)) return null;
      const rows = body.balances;
      if (rows.length === 0 || rows.some((row) => !row || typeof row !== 'object'
          || row.accountId !== accountId || typeof row.currency !== 'string')) return null;
      if (new Set(rows.map((row) => row.currency)).size !== rows.length) return null;
      const matches = rows.filter((row) => row.currency === currency);
      return matches.length === 1 ? matches[0] : null;
    }

    function report(step, res, expected) {
      if (res.status !== expected) console.error(`account-overview ${step}: status=${res.status} expected=${expected}`);
    }

    export default function () {
      if (!Number.isFinite(FIXTURE_BALANCE) || !FIXTURE_CURRENCY) {
        console.error('account-overview fixture contract absent: FIXTURE_BALANCE / FIXTURE_CURRENCY are not set on the CronJob');
        failAll();
        return;
      }
      const token = fetchToken();
      if (token === null) { failAll(); return; }
      const ownPartyId = partyIdFromToken(token);
      if (ownPartyId === null) {
        console.error('account-overview token has no usable party_id claim; refusing ownership probe');
        failAll();
        return;
      }
      const params = (endpoint) => ({
        headers: { Authorization: `Bearer ${token}`, 'x-openbank-synthetic': 'true' },
        tags: { endpoint, service: 'customer-edge' },
      });

      // 0. no token: the overview must not be readable anonymously
      const anon = http.get(`${CUSTOMER_BASE}/customer/v1/accounts`, { tags: { endpoint: 'accounts-anonymous', service: 'customer-edge' } });

      // 1. list
      const listed = http.get(`${CUSTOMER_BASE}/customer/v1/accounts`, params('accounts-list'));
      report('list', listed, 200);
      const accounts = listed.status === 200 ? json(listed) : null;
      const fixture = ownedActiveFixture(accounts, ownPartyId);
      const id = fixture && fixture.id;

      // 2. the account itself, 3. its balance
      const account = id ? http.get(`${CUSTOMER_BASE}/customer/v1/accounts/${id}`, params('account-get')) : null;
      if (account) report('account', account, 200);
      const accountBody = account && account.status === 200 ? json(account) : null;
      const balance = id ? http.get(`${CUSTOMER_BASE}/customer/v1/balances/${id}`, params('balance-get')) : null;
      if (balance) report('balance', balance, 200);
      // BalanceResource returns {balances: Balance[]}; customer-edge forwards that body unchanged.
      // bookedAmount is the ledger-projected balance. effectiveAvailableAmount is spendable money,
      // so it is checked for wire consistency but never compared to the seeded balance.
      const balanceBody = balance && balance.status === 200 ? json(balance) : null;
      const b = id ? ownedCurrencyBalance(balanceBody, id, FIXTURE_CURRENCY) : null;

      // 4. negative path: a well-formed id the caller does not own is refused (403, not 404:
      // the edge deliberately gives no existence oracle)
      const foreign = http.get(`${CUSTOMER_BASE}/customer/v1/accounts/00000000-0000-4000-8000-${`${Date.now()}`.slice(-12).padStart(12, '0')}`, params('account-foreign'));

      const isFiniteAmount = (value) => typeof value === 'number' && Number.isFinite(value);
      check(null, {
        'an unauthenticated account list is refused': () => anon.status === 401,
        // exactly one ACTIVE fixture for the authenticated party, with no delegated/shared row.
        'the canary lists exactly its own ACTIVE fixture account': () => !!fixture && fixture.partyId === ownPartyId,
        'the account can be opened by id': () => !!accountBody && accountBody.id === id,
        // Requires one wrapped row for this account and the configured currency.
        'the balance is served for the account': () => !!b && b.accountId === id,
        'the balance is in the fixture currency and internally consistent': () => !!b
          && b.currency === FIXTURE_CURRENCY
          && isFiniteAmount(b.bookedAmount) && isFiniteAmount(b.availableAmount)
          && isFiniteAmount(b.reservedAmount) && b.reservedAmount >= 0
          && isFiniteAmount(b.pendingAmount) && isFiniteAmount(b.notYetEffectiveCredit)
          && b.notYetEffectiveCredit >= 0 && isFiniteAmount(b.effectiveAvailableAmount)
          && Math.abs(b.effectiveAvailableAmount - (b.availableAmount - b.notYetEffectiveCredit)) < 0.005,
        'the balance equals the seeded fixture balance': () => !!b
          && isFiniteAmount(b.bookedAmount) && Math.abs(b.bookedAmount - FIXTURE_BALANCE) < 0.005,
        'an account the caller does not own is refused': () => foreign.status === 403,
      });
    }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: journey-account-overview
  namespace: observability
  annotations:
    # Four runs at */15: a single failed run is the journey's own alert, a silent CronJob is this.
    openbank.tech/max-success-age-seconds: "3600"
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: journey
    openbank.tech/journey: account-overview
spec:
  schedule: "5,20,35,50 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: journey
            openbank.tech/journey: account-overview
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12345
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k6
              image: docker.io/grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              args:
                - run
                - --quiet
                - /scripts/journey.js
              env:
                # Optional on purpose: an unprovisioned identity must yield a red run with an
                # explicit "credential absent" error, not CreateContainerConfigError.
                - name: SYNTHETIC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: journey-account-overview-oidc
                      key: SYNTHETIC_CLIENT_SECRET
                      optional: true
                # The fixture contract (see the header): the synthetic party's one fixture account
                # holds exactly this balance, seeded once through a tainted posting and never moved
                # by any journey. A value moved by a run would make the assertion nondeterministic.
                - name: FIXTURE_BALANCE
                  value: "1000"
                - name: FIXTURE_CURRENCY
                  value: "CZK"
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
          volumes:
            - name: script
              configMap:
                name: journey-account-overview-script
          nodeSelector:
            workload: observability
          tolerations:
            - key: workload
              operator: Equal
              value: observability
              effect: NoSchedule
