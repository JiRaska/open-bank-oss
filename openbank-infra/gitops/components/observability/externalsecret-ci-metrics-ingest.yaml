# ESO chart >= 0.17.0 serves external-secrets.io/v1 only (check-eso-crd-api-version).
# Bearer token for the CI metrics gateway (apps/ci-metrics-gateway.yaml), projected from Vault
# by the External Secrets Operator (ClusterSecretStore `vault-kv`).
# OPERATOR STEP: create Vault key `ci-metrics-ingest` with property `TOKEN` (a long random
# value) and set the SAME value as the GitHub secret CI_METRICS_TOKEN in JiRaska/openbank-app.
# Until the Vault entry exists this ExternalSecret reports SecretSyncedError and the gateway
# pod stays in ContainerCreating (the Secret volume is missing) - i.e. the ingest fails closed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: static CI ingest bearer token; rotate in Vault + GitHub secret together.
    openbank.io/rotation-deadline: "2027-11-11"
  name: ci-metrics-ingest
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: ci-metrics-ingest
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: TOKEN
      remoteRef:
        key: ci-metrics-ingest
        property: TOKEN
