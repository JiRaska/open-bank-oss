#
# ESO chart >= 0.17.0 serves external-secrets.io/v1 only (check-eso-crd-api-version).
# Bearer token for the CI metrics gateway (apps/ci-metrics-gateway.yaml).
#
# CLUSTER-GENERATED, not OpenBao (2026-11-15, #16205). The value used to be projected from the
# OpenBao key `ci-metrics-ingest`, which no non-root identity can write (the owner's SSO writer
# policy covers keycloak/* only), so the ExternalSecret sat in SecretSyncedError and the gateway
# had 0 replicas for ~70h. The token has exactly two holders — this Secret and the GitHub secret
# CI_METRICS_TOKEN in the app repository — so OpenBao added no consumer, only a write path nobody
# had. ESO's Password generator draws it in-cluster and `refreshPolicy: CreatedOnce` keeps it
# stable: it is generated once and never rotated by ESO, because a silent rotation would break
# the GitHub side without telling anyone.
# OPERATOR STEP: copy the generated value into CI_METRICS_TOKEN (provision-16205.sh does it
# without printing the value).
# ROTATION: delete Secret observability/ci-metrics-ingest (ESO regenerates it), then re-run the
# copy step. Both holders change together or the ingest fails closed.
# Fields per the generators.external-secrets.io/v1alpha1 CRDs of chart 2.11.0
# (apps/external-secrets.yaml): Password requires allowRepeat, length and noUpper.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ci-metrics-ingest-token
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: static CI ingest bearer token; rotate both holders together (see ROTATION).
    open-bank.tech/rotation-deadline: "2027-11-11"
  name: ci-metrics-ingest
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ci-metrics-ingest
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ci-metrics-ingest-token
