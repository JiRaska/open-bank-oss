# tax-reporting: §38d withholding-remittance dead-letter alerts (#5760).
#
# tax-reporting-service consumes interest.withholding.remitted.v1 and RETHROWS a failed write, so
# the record lands on openbank.dlq.tax-reporting.withholding-remitted-in. Nothing consumes that
# topic. Each record on it is a remittance missing from that month's §38d return. `assemble`
# totals only what was observed, so the return understates the tax withheld and nothing else
# errors. These two rules are the only signal.
#
# kafka_topic_partition_* come from the Strimzi Kafka Exporter (topicRegex ".*", so the DLQ is
# scraped like every other topic). Not openbank_* metrics, so alert-metric-emitted does not
# apply; the series names are the same ones PartyEventDeadLettered already fires on.
#
# Runbook: docs/runbooks/0028-tax-reporting-withholding-dead-letter.md
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-tax-reporting-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.tax-reporting.withholding
      rules:
        - alert: TaxWithholdingRemittanceDeadLettered
          # New records arrived in the last hour. The offset only grows, so a plain `> 0` would
          # latch forever; increase() clears an hour after arrivals stop. The NotEmpty rule below
          # keeps the unresolved state visible after that.
          expr: |
            sum by (topic) (increase(kafka_topic_partition_current_offset{topic="openbank.dlq.tax-reporting.withholding-remitted-in"}[1h])) > 0
          labels:
            severity: critical
            team: platform
          annotations:
            # Driven by real remittance traffic, not a schedule: no period to fit the window to.
            subject_period: continuous
            summary: "§38d withholding remittance dead-lettered (tax-reporting)"
            description: "tax-reporting-service could not record a withholding remittance even after retries and parked it on {{ $labels.topic }}. Until it is replayed, that month's §38d return understates the tax withheld. Do not assemble or file the affected period before replaying."
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0028-tax-reporting-withholding-dead-letter.md"
        - alert: TaxWithholdingDeadLetterNotEmpty
          # Records still retained on the DLQ: arrived and not yet replayed-and-deleted. It clears
          # when the operator deletes the replayed records (runbook step 5), or after the topic's
          # 30-day retention, which is NOT a resolution. `for: 15m` keeps it from firing during an
          # in-progress replay.
          expr: |
            sum by (topic) (
              kafka_topic_partition_current_offset{topic="openbank.dlq.tax-reporting.withholding-remitted-in"}
              - kafka_topic_partition_oldest_offset{topic="openbank.dlq.tax-reporting.withholding-remitted-in"}
            ) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $value }} §38d withholding remittance(s) awaiting replay (tax-reporting)"
            description: "{{ $labels.topic }} still holds {{ $value }} dead-lettered withholding remittance(s). Each one is missing from a §38d return until it is replayed. Follow the runbook, then delete the replayed records so this clears."
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0028-tax-reporting-withholding-dead-letter.md"
