apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-noc
  namespace: observability
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
data:
  openbank-noc.json: |
    {
      "id": null,
      "uid": "openbank-noc",
      "title": "OpenBank — NOC Alert Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "🔴 Firing Alerts",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Services Up",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "count(up{job=\"observability/openbank-services\"} == 1) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Services Down",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "count(up{job=\"observability/openbank-services\"} == 0) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Payments /min",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(openbank_payments_submitted_total{job=\"observability/openbank-services\"}[1m])) * 60 or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Sanctions Hits (1h)",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(increase(openbank_sanctions_hits_total{job=\"observability/openbank-services\"}[1h])) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Outbox Dead (1h)",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(increase(openbank_outbox_dead_total{job=\"observability/openbank-services\"}[1h])) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Active Firing Alerts",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 6
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "ALERTS{alertstate=\"firing\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Overall API P99 Latency",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 14,
            "h": 7
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"observability/openbank-services\",uri!~\"/q/.*\"}[5m])) by (le))",
              "legendFormat": "P99 (all services)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Overall Error Rate %",
          "gridPos": {
            "x": 14,
            "y": 10,
            "w": 10,
            "h": 7
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "100 * (sum(rate(http_server_requests_seconds_count{status=~\"5..\",job=\"observability/openbank-services\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\"observability/openbank-services\"}[5m])), 0.0001)",
              "legendFormat": "Error Rate %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Error Rate %"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Payment Volume + Compliance Activity",
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 7
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(openbank_payments_submitted_total{job=\"observability/openbank-services\"}[5m]))",
              "legendFormat": "Payments/s",
              "refId": "A"
            },
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(openbank_sanctions_hits_total{job=\"observability/openbank-services\"}[5m]))",
              "legendFormat": "Sanctions Hits/s",
              "refId": "B"
            },
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(openbank_outbox_dead_total{job=\"observability/openbank-services\"}[5m]))",
              "legendFormat": "Dead Letters/s",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ],
      "tags": [
        "openbank"
      ]
    }
