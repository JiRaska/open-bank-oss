# Example scripted synthetic journey (Dynatrace-parity #2). A k6 script that
# exercises the public API + edge from in-cluster and pushes k6 metrics to
# Prometheus remote-write. The TestRun below runs ONCE on sync to prove the
# pipeline end-to-end; turning it into a *periodic* synthetic monitor (delete +
# recreate on a schedule, via a CronJob or Argo Workflows CronWorkflow) is the
# documented follow-up — blackbox-exporter already covers periodic single-request
# uptime, so this is the scripted-multi-step layer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-synthetic-journey
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
data:
  journey.js: |
    import http from 'k6/http';
    import { check, group, sleep } from 'k6';

    export const options = {
      vus: 1,
      iterations: 1,
      thresholds: {
        // Journey fails (non-zero exit) if any check fails or p95 > 2s.
        checks: ['rate==1.0'],
        http_req_duration: ['p(95)<2000'],
      },
      tags: { journey: 'public-edge' },
    };

    export default function () {
      group('api info', () => {
        const r = http.get('https://api.open-bank.tech/api/v1/info');
        check(r, { 'info 2xx/3xx/401': (res) => res.status >= 200 && res.status < 500 });
      });
      group('customer edge', () => {
        // root path is empty — ingress only routes /customer/v1; 401 = service up, auth required
        const r = http.get('https://customer.open-bank.tech/customer/v1/accounts');
        check(r, { 'customer up 2xx/4xx': (res) => res.status >= 200 && res.status < 500 });
      });
      sleep(1);
    }
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: synthetic-public-edge
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  parallelism: 1
  # Push k6 metrics (k6_http_req_duration, k6_checks, ...) to the same
  # Prometheus that accepts Tempo's remote-write (enableRemoteWriteReceiver).
  arguments: -o experimental-prometheus-rw --tag testrun=synthetic-public-edge
  script:
    configMap:
      name: k6-synthetic-journey
      file: journey.js
  runner:
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(95),p(99),avg,max"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    nodeSelector:
      workload: observability
    tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule
