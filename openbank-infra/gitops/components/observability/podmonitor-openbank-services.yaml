# Fleet PodMonitor (ADR-0082): scrape /q/metrics (Quarkus Micrometer) on the management
# port of every openbank service pod, across all service namespaces. This was a hand-
# applied (kubectl) resource that drifted — and its namespace list was missing audit,
# dispute, interest, notifications, customer-edge, security-scanner, platform, so those
# services' metrics (incl. openbank_outbox_backlog) never reached Prometheus. Codified
# here under the observability-components Application with the COMPLETE service-namespace
# list so a new service is scraped just by carrying the app.kubernetes.io/name label.
#
# C8 sweep (prod-readiness collector): added fraud, pid, psd2 — previously absent from
# the list, so fraud-service, pid-service and psd2-service metrics never reached Prometheus.
# agent-service and copilot-service are covered via the existing `platform` entry;
# transaction-service, clearing-service, swift-service via `payments`;
# onboarding-service via `onboarding`; lending-service via `lending`.
#
# Second C8 sweep (#2255): added anacredit, billing, documents, finrep, sdd, tpp-registry.
# Those six services' metrics had never reached Prometheus, and billing, document-service
# and tpp-registry ship PrometheusRules that therefore could not fire. `sdd` is the reason
# this list must not be maintained by reading the comment above: that comment claimed
# sdd-service was covered "via `payments`", but sdd-service's Deployment is in namespace
# `sdd` and payments-services.yaml does not mention sdd at all. The prod-readiness
# collector's C8 scorer read this file as a plain substring, so the false claim scored
# sdd as scraped. Coverage is now asserted from the workload manifests by
# .github/scripts/check-podmonitor-namespace-coverage.py — do not hand-audit it.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: openbank-services
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: Exists
  namespaceSelector:
    matchNames:
      - accounts
      - aml
      - anacredit
      - analytics
      - audit
      - balances
      - billing
      - campaign
      - consent
      - customer-edge
      - dispute
      - documents
      - finrep
      - fraud
      - fx
      - interest
      - kyc
      - ledger
      - lending
      - notifications
      - onboarding
      - party
      - payments
      - pid
      - platform
      - psd2
      - sanctions
      - sca
      - sdd
      - security-scanner
      - statements
      - tpp-registry
  podMetricsEndpoints:
    - port: management
      path: /q/metrics
      interval: 30s
      honorLabels: true
      # Propagate the Argo Rollouts canary pod label onto scraped time series so
      # ClusterAnalysisTemplate openbank-money-path-canary can filter by canary
      # replica set in its Prometheus queries. Without this relabeling the label
      # is absent and every query returns len(result)==0 → auto-success (no-op).
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
          targetLabel: rollouts_pod_template_hash
          action: replace
