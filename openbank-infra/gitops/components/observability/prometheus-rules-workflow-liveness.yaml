# Workflow-liveness staleness alerts (ADR-0237, issue #3345).
#
# Every domain @Scheduled job and every external feed registers the ADR-0160
# mechanism-3 primitive (DomainMetrics.registerWorkflowLiveness), which emits three
# gauges per workflow: openbank_workflow_last_success_age_seconds (scrape-time age
# of the last recordSuccess, seeded at registration — a never-run job reads as old
# as its pod, never as decades), openbank_workflow_expected_interval_seconds, and
# openbank_workflow_success_recorded (0 until the first recordSuccess, 1 after).
#
# That seeding is load-bearing and was NOT true when these rules first shipped: the
# age gauge seeded from Instant.EPOCH, so every fresh pod read ~1.8e9 seconds and
# WorkflowLivenessStale below would have fired 15 minutes after every deploy, for
# every daily workflow, until its next success — with no `for:` able to help, since
# the condition genuinely persisted. These comments asserted the property; the code
# acquired it later. Do not restore an EPOCH-like seed without deleting the rule.
# The third gauge is what the boot-seed gives up, published rather than lost: the
# alert does not read it (a never-run job crosses the same threshold once its grace
# elapses), the control-liveness-sentinel does, to say which of the two it is.
#
# The two rules below are deliberately not one rule, and deliberately warnings.
# absent() catches a fleet-level registration/scrape collapse; the staleness rule
# catches a single job that stopped succeeding — including one that never started,
# once its own grace elapses. severity: warning even for money-path jobs (ADR-0237
# point 3): staleness at 2x grace is a liveness gap, not an active outage — the
# outage signals downstream (outbox stuck, SLO burn) already carry critical rules,
# and #3346 keeps critical reserved for page-now conditions. The
# control-liveness-sentinel (ADR-0163) correlates repeated staleness across
# controls into one triaged finding; these rules are the raw signal it reads.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-workflow-liveness-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.workflow.liveness
      interval: 5m
      rules:
        # 1. Nothing in the fleet reports a heartbeat at all. That is not "all jobs
        # healthy" — it is the metric pipeline or the adoption itself being gone
        # (the #2187 shape: the consumer queried a name nothing emitted, and the
        # sentinel could only ever report "no stale heartbeats"). Per-workflow
        # adoption gaps are CI's job (check-scheduler-liveness), not this rule's.
        - alert: WorkflowLivenessHeartbeatAbsent
          expr: absent(openbank_workflow_last_success_age_seconds)
          for: 2h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "No workflow-liveness heartbeats in the fleet for 2h"
            description: >-
              The openbank_workflow_last_success_age_seconds series is absent
              fleet-wide. Either every registering service stopped being scraped,
              or the metric pipeline dropped the family — in both cases every
              other liveness verdict derived from these gauges is void. Check the
              Prometheus targets for the app namespaces before trusting any
              "schedulers are fine" claim.

        # 2. A job missed its own cadence twice over. The comparison is 1:1 on the
        # full label set — both gauges are registered together by
        # registerWorkflowLiveness with identical tags, so no join modifier is
        # needed or wanted. Boot-safe by construction (ADR-0237): the age gauge is
        # seeded at registration time, so a fresh pod cannot read as stale until
        # its own grace period elapses — see the file header for what that seed
        # cost and why this rule cannot be run against an EPOCH-seeded gauge.
        # for: 15m absorbs one slow run overrunning its slot; it cannot absorb a
        # missed run — that is the point.
        #
        # The residual gap the seed leaves: a job whose pod restarts more often
        # than 2x its interval never accumulates enough age to alert here. That is
        # covered statically instead, by the registration gate
        # (check-scheduler-liveness.py) and the HR000068 guards, not by this rule.
        - alert: WorkflowLivenessStale
          expr: openbank_workflow_last_success_age_seconds > 2 * openbank_workflow_expected_interval_seconds
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "{{ $labels.workflow }} last succeeded {{ $value | humanizeDuration }} ago (2x interval exceeded)"
            description: >-
              The scheduled workflow {{ $labels.workflow }} in {{ $labels.namespace }}
              has not recorded a success for more than twice its expected interval.
              Either the job stopped running (HR000068 class — check the pod log
              for "should exclusively be invoked from a Vert.x EventLoop thread"),
              or it runs but fails every time (an external feed returning 404),
              or the pod is being restarted faster than the job's cadence (check
              availability alerts). A workflow tag prefixed feed- is the
              external-feed freshness signal: "job ran" and "feed delivered"
              alert independently (ADR-0237 point 2).

              For a feed- workflow the reason is a metric, not a log grep
              (#4743): openbank_feed_fetch_total{feed="<name>"} breaks the same
              period down by outcome — fetched / empty / http_error /
              parse_error / unreachable. empty is the one worth reading first:
              it means the feed answered, parsed cleanly, and carried none of
              the rows this consumer asked for, which raises no error anywhere
              and is why this gauge, not an error rate, is the alert. unreachable
              is not a verdict about the feed but the absence of one — check this
              cluster's egress before reporting an upstream as dead. All five
              series exist from pod start at 0, so an absent one means the feed
              is not instrumented rather than never having failed.

              That counter is deliberately not itself an alert expression:
              Prometheus retention here is 12h with no long-term store, so an
              increase() lookback wide enough to cover a daily feed truncates
              silently. The gauge carries its state forward with no lookback at
              all; the counter is read at triage time.

        # 3. A job still runs, and takes too long doing it (issue #6169). Liveness above cannot see
        # this: a sweep that degrades from 6s to 300s records a success every time, so the age
        # gauge stays green while the job walks toward overrunning its own slot — at which point
        # `ConcurrentExecution.SKIP` starts dropping runs with nothing logged.
        #
        # WHY NOT THE SPAN HISTOGRAM. `traces_spanmetrics_latency_bucket` is the obvious source and
        # is unusable here: its `le` set is 0.1/0.25/0.5/1/2/5/+Inf and every agent-oversight sweep
        # lands in (5s, +Inf], so histogram_quantile returns exactly 5.00 on every run — the metric
        # is SATURATED and no threshold above 5s is expressible from it at all (measured live in
        # #6168). Widening the window converts a never-firing rule into a never-clearing one; the
        # signal needed a different instrument, not a retuned rule, so the job now records its own
        # timer (DomainMetrics.registerWorkflowRun).
        #
        # WHAT THE NUMBER IS. Mean wall-clock per run over 2h, measured IN THE JOB'S PROCESS —
        # `_sum / _count`, not a percentile. A quantile is not available at this sample size and
        # never was: a 30-minute job contributes ~4 observations to a 2h window, and
        # histogram_quantile over four samples returns the maximum, which is the same defect one
        # layer down. `_max` is likewise not used: Micrometer's timer max decays over a few minutes,
        # so between two sweeps it reads 0. The mean over ≥4 runs detects SUSTAINED degradation and
        # deliberately not one slow outlier — the outlier case is a dashboard question.
        #
        # WHY THIS ONE CAN FIRE, against both measured failure modes:
        #  * window vs subject period — [2h] against a 30m cron is W > P, so the condition does not
        #    decay between invocations and `for: 30m` matures. The #6041 shape (rate[15m], for: 15m,
        #    30m subject: 44 points pending, zero firing) needs W <= P and is structurally excluded.
        #  * ratio blindness at total failure — the denominator here is ALL runs, not the successful
        #    ones, so it does not vanish when everything is failing; the timer records a
        #    `outcome="failure"` sample too, and the rule sums over outcome. The only way the
        #    denominator disappears is no runs at all, which is WorkflowLivenessStale's question,
        #    not this one — and the `> 0` filter makes that hand-off explicit rather than leaving a
        #    0/0 NaN to be reasoned about.
        #
        # VALUE AT t=0 ON A COLD POD: the budget gauge is registered at startup and reads its
        # declared value; the timer is registered at startup too and reads count = 0, sum = 0. So
        # `increase(count[2h])` is 0, the `> 0` filter drops the series, the division yields
        # nothing, and the rule is SILENT — no boot-time breach, and none hidden behind `for:`.
        # That re-derivation is the thing WorkflowLivenessStale did not do (#2239): it shipped
        # asserting a seed it did not have and fired 15 minutes after every deploy until #4208.
        #
        # The threshold is a SERIES, not a literal, exactly as WorkflowLivenessStale compares
        # against openbank_workflow_expected_interval_seconds. So this rule carries no service list
        # and no per-job constant: a workflow opts in by calling registerWorkflowRun with its own
        # budget, and a workflow that has not opted in has no budget series and is matched by
        # nothing.
        - alert: WorkflowRunDurationHigh
          expr: |
            (
              sum by (workflow) (increase(openbank_workflow_run_duration_seconds_sum[2h]))
              /
              (sum by (workflow) (increase(openbank_workflow_run_duration_seconds_count[2h])) > 0)
            )
            > on (workflow) group_left()
            max by (workflow) (openbank_workflow_run_budget_seconds)
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            # 30m: agent-oversight-sweep's `agent.oversight.cron` (0 0/30 * * * ?), the only
            # subscriber today. Declared so check-alert-window-vs-subject-period.py can do the
            # arithmetic rather than trust this comment.
            subject_period: 30m
            summary: "{{ $labels.workflow }} averages {{ $value | humanizeDuration }} per run, over its declared budget"
            description: >-
              The scheduled workflow {{ $labels.workflow }} still runs and still succeeds — this is
              not a liveness gap and WorkflowLivenessStale is correctly quiet. Its mean run over the
              last two hours exceeds openbank_workflow_run_budget_seconds, the budget its own code
              declares. That matters before it looks like an outage: a run approaching its cron
              period gets the next run SKIPPED by the scheduler, silently, and the heartbeat keeps
              reading healthy because the in-flight run does eventually finish.

              Split by outcome first — openbank_workflow_run_duration_seconds_count{workflow="..."}
              carries outcome="success" and outcome="failure". A rising failure count with a small
              duration is a different fault (fail-fast, look at the error path) from a rising
              success duration (the work itself got slower: an upstream dependency, an LLM
              gateway, a query that lost its index).

              Do NOT reach for traces_spanmetrics_latency_bucket to confirm this. Its top finite
              bucket is 5 seconds, so for any job in this class it reports 5.00 whatever the truth
              is (#6169).
