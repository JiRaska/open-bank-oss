        - alert: ExpectedWorkloadAbsent
          expr: |
            openbank:expected_service:info
              unless on (namespace, workload)
            label_replace(max by (namespace, deployment) (kube_deployment_spec_replicas), "workload", "$1", "deployment", "(.*)")
              unless on (namespace, workload)
            label_replace(max by (namespace, name) (rollout_info_replicas_desired), "workload", "$1", "name", "(.*)")
              unless on (namespace, workload)
            label_replace(max by (namespace, statefulset) (kube_statefulset_replicas), "workload", "$1", "statefulset", "(.*)")
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Expected workload {{ $labels.workload }} ({{ $labels.namespace }}) does not exist
            description: The deployed-service inventory lists {{ $labels.workload }} in {{ $labels.namespace }}, but no Deployment, Rollout or StatefulSet series exists for it. It was deleted, never synced, or renamed. Scale-to-zero does NOT trigger this (the object keeps its series). Check the Argo CD Application for the component.
        - alert: ServiceHttp5xxRatioHigh
          expr: |
            (
              sum by (namespace, workload) (label_replace(rate(http_server_requests_seconds_count{status=~"5.."}[10m]), "workload", "$1", "pod", "(.+)-[a-z0-9]{6,10}-[a-z0-9]{5}"))
                / clamp_min(sum by (namespace, workload) (label_replace(rate(http_server_requests_seconds_count[10m]), "workload", "$1", "pod", "(.+)-[a-z0-9]{6,10}-[a-z0-9]{5}")), 0.001) > 0.05
            )
            and
            (
              sum by (namespace, workload) (label_replace(increase(http_server_requests_seconds_count{status=~"5.."}[10m]), "workload", "$1", "pod", "(.+)-[a-z0-9]{6,10}-[a-z0-9]{5}")) >= 20
            )
            and on (namespace, workload) openbank:expected_service:info
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.workload }} ({{ $labels.namespace }}) is answering >5% 5xx'
            description: More than 5% of HTTP responses from {{ $labels.workload }} were 5xx over 10m, with at least 20 of them. Floor is absolute so a quiet service cannot trip it on two errors.
            subject_period: continuous
        - alert: ServiceRestartBurst
          expr: |
            sum by (namespace, workload) (label_replace(increase(kube_pod_container_status_restarts_total[30m]), "workload", "$1", "pod", "(.+)-[a-z0-9]{6,10}-[a-z0-9]{5}")) >= 3
            and on (namespace, workload) openbank:expected_service:info
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.workload }} ({{ $labels.namespace }}) restarted 3+ times in 30m'
            description: 'Container restarts summed across the pods of {{ $labels.workload }} reached 3 in 30m: crash loop, OOMKill or failing liveness probe. kubectl -n {{ $labels.namespace }} describe pods | grep -A5 ''Last State''.'
            subject_period: continuous
