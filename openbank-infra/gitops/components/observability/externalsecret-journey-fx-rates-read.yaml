#
# Client secret of the canary customer openbank-synthetic-retail (ADR-0331) for the
# fx-rates-read journey. It reads the SAME OpenBao KV entry the
# journey-wealth-declared-holding-oidc and journey-vop-verify-payee-oidc ExternalSecrets
# read — one synthetic identity, three journeys, no second credential to provision or
# rotate. Written to OpenBao by openbank-infra/scripts/provision-synthetic-customer.sh;
# until then the target Secret does not exist, the CronJob's env ref is optional, and the
# journey fails red with "credential absent".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: journey-fx-rates-read-oidc
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: journey
    openbank.tech/journey: fx-rates-read
  annotations:
    openbank.io/rotation-deadline: "2027-10-04"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: journey-fx-rates-read-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SYNTHETIC_CLIENT_SECRET
      remoteRef:
        key: keycloak/synthetic-retail
        property: client_secret
