# Contextual Admin UI panels use Tempo server-span metrics here because they exist continuously
# while a payment-lifecycle counter is registered only after that pod processes its first payment.
# This keeps a quiet or freshly restarted sandbox observable without presenting probes as business
# settlement. Panel titles and descriptions therefore say "observed request", not "payment success".
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-payment-sla
  namespace: observability
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
data:
  openbank-payment-sla.json: |
    {
      "id": null,
      "uid": "openbank-sla",
      "title": "OpenBank — Payment Rails Operational Health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Observed Request Latency P50 / P95 / P99",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 14,
            "h": 8
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[1h])))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[1h])))",
              "legendFormat": "P95",
              "refId": "B"
            },
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[1h])))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "description": "Server-side latency across the payment rails seen by tracing; includes synthetic probes."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "SEPA Instant Observed P95",
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"openbank-sepa-instant\",span_kind=\"SPAN_KIND_SERVER\"}[1h])))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Observed server-span latency over one hour; includes synthetic probes."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Domestic Payment Observed P95",
          "gridPos": {
            "x": 19,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=\"openbank-domestic-payment\",span_kind=\"SPAN_KIND_SERVER\"}[1h])))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Observed server-span latency over one hour; includes synthetic probes."
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Observed Request Rate by Rail",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 14,
            "h": 7
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[1h]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "description": "Server requests observed by tracing, grouped by payment rail."
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "Observed Requests (24h)",
          "gridPos": {
            "x": 14,
            "y": 4,
            "w": 10,
            "h": 11
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (service) (increase(traces_spanmetrics_calls_total{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[24h]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "displayMode": "lcd"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "description": "Server requests seen during the last 24 hours, including synthetic probes."
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Observed Request Success Rate %",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 6
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "100 * (1 - ((sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[1h])) or (sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[1h])) * 0)) / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[1h])), 0.0001)))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "description": "Share of observed server spans without an error status, by payment rail."
        },
        {
          "id": 7,
          "type": "piechart",
          "title": "Observed Request Share (24h)",
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 6
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (service) (increase(traces_spanmetrics_calls_total{service=~\"openbank-(transaction-service|sepa-payment|sepa-instant|domestic-payment|swift-service|clearing-service)\",span_kind=\"SPAN_KIND_SERVER\"}[24h]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "pieType": "pie",
            "displayLabels": [
              "name",
              "percent"
            ],
            "legend": {
              "displayMode": "list",
              "placement": "right"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "description": "Relative request volume by payment rail over the last 24 hours."
        }
      ],
      "tags": [
        "openbank"
      ]
    }
