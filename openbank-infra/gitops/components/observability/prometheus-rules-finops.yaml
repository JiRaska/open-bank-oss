# FinOps cost anomaly detection rules (ADR-0112). Five detectors correspond to the
# recurring AWS cost incidents documented in the ADR: NAT drain, cross-AZ traffic,
# Karpenter node churn, EBS attachment failures, and CI runner pool pressure.
# All alerts route to GoAlert (which triggers the finops-agent Temporal workflow).
# The openbank.finops.ai-costs group used to live here, holding one alert:
# FinOpsAgentTokenBudgetExceeded, written against langfuse_agent_tokens_total,
# langfuse_model_cost_per_token and langfuse_agent_daily_budget_usd. Langfuse has never been
# deployed — it appears in no manifest anywhere in gitops — so none of those three series has
# ever existed and the alert could not fire. Its own description said as much ("will be absent
# until the bridge is deployed"), which is the trap: it read as pending rather than as inert,
# and the D6 detector looked covered on every dashboard that counts rules.
#
# Replaced by prometheus-rules-ai.yaml, which alerts on openbank_llm_* — counted client-side by
# DomainMetrics on the three code paths that make real /chat/completions calls, because
# LiteLLM's own Prometheus exporter is an Enterprise feature. AI spend alerting now depends on
# nothing that is not deployed.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-finops-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    openbank.io/finops-detector: "true"
spec:
  groups:
    - name: openbank.finops.nat-egress
      interval: 5m
      rules:
        # D1a: Absolute daily NAT egress threshold (50 GB). Uses a 24h rate window
        # normalised to bytes/day. Fires if any namespace exceeds the threshold.
        - alert: FinOpsNatEgressSpikeAbsolute
          expr: |
            sum by (namespace) (
              rate(container_network_transmit_bytes_total{
                namespace!~"kube-system|monitoring|observability|cert-manager"
              }[24h])
            ) * 86400 > 53687091200
          for: 30m
          labels:
            severity: warning
            detector: D1
            team: platform
            route: finops-agent
          annotations:
            summary: "NAT egress spike — {{ $labels.namespace }} > 50 GB/day"
            description: "Namespace {{ $labels.namespace }} transmitted {{ $value | humanize1024 }}B in the last 24 h. Threshold: 50 GB. Possible cross-AZ routing or data exfiltration."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0006-nat-egress-drain.md"

        # D1b: Relative threshold — 200 % of the 7-day rolling average.
        # Catches fast-rising namespaces even below the absolute threshold.
        # Uses a subquery for the baseline so we avoid the rate([7d]) long-window
        # anti-pattern (Prometheus rate() is designed for short windows).
        - alert: FinOpsNatEgressSpikeRelative
          expr: |
            (
              sum by (namespace) (rate(container_network_transmit_bytes_total[5m]))
            ) /
            (
              avg_over_time(
                sum by (namespace) (rate(container_network_transmit_bytes_total[5m]))[7d:5m]
              ) + 1
            ) > 2
          for: 20m
          labels:
            severity: warning
            detector: D1
            team: platform
            route: finops-agent
          annotations:
            summary: "NAT egress 2× rolling avg — {{ $labels.namespace }}"
            description: "{{ $labels.namespace }} current egress rate is {{ $value | humanizePercentage }} of its 7-day average. Possible overnight batch runaway. Note: subquery requires 7d of retention — alert may be absent on fresh clusters."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0006-nat-egress-drain.md"

    - name: openbank.finops.karpenter-churn
      interval: 5m
      rules:
        # D3: Node churn rate. High termination rate outside the maintenance window
        # indicates misconfigured consolidation.
        #
        # These two rules were dead from the day they were written: they queried
        # `karpenter_nodes_total{lifecycle="terminating"}`, and Karpenter 1.x exports
        # neither that metric nor that label. `karpenter_nodes_total` exists only as a
        # PREFIX of unrelated capacity gauges (`karpenter_nodes_total_pod_requests`,
        # `..._daemon_limits`) — which is what made a grep for it look like a match.
        # Nothing scraped Karpenter either (#1445), so the rules never evaluated and the
        # wrong name never surfaced. Both now fixed; queries below were run against this
        # cluster's Prometheus and return data.
        - alert: FinOpsKarpenterNodeChurnHigh
          expr: |
            increase(karpenter_nodes_terminated_total[1h]) > 3
          for: 10m
          labels:
            severity: warning
            detector: D3
            team: platform
            route: finops-agent
          annotations:
            summary: "Karpenter node churn high — {{ $value }} terminations/h"
            description: "{{ $value }} nodes terminated in the last hour. If outside 20:00–07:00 UTC maintenance window, check disruption budget and consolidation policy."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0002-karpenter-node-drain.md"

        # D3b: Node churn specifically OUTSIDE the maintenance window.
        - alert: FinOpsKarpenterChurnOutsideMaintenance
          expr: |
            (hour() >= 7 and hour() < 20) and
            increase(karpenter_nodes_terminated_total[30m]) > 2
          for: 5m
          labels:
            severity: critical
            detector: D3
            team: platform
            route: finops-agent
          annotations:
            summary: "Node churn during business hours — {{ $value }} nodes"
            description: "Karpenter terminated {{ $value }} nodes during business hours (07:00–20:00 UTC). This causes unnecessary EBS detach races and cross-AZ traffic spikes. Prometheus server UTC assumed."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0002-karpenter-node-drain.md"

        # A NodePool at its `limits` cap is invisible until it bites: Karpenter simply
        # refuses to provision ("all available instance types exceed limits for nodepool"),
        # pods sit Pending, and a Rollout eventually aborts on its progress deadline. That
        # is how #1272 was found — and how #809 was found before it, at the previous cap.
        # Twice discovered by a failure rather than a signal; this is the signal.
        #
        # The cap is a deliberate cost guardrail (without it Karpenter once provisioned
        # 14x c6g.12xlarge, ~$235/day), so this must not read as "raise it" — it reads as
        # "the pool has no room left; decide whether demand or the cap is wrong."
        - alert: FinOpsKarpenterNodePoolNearCap
          expr: |
            100 * karpenter_nodepools_usage{resource_type="cpu"}
              / on(nodepool) karpenter_nodepools_limit{resource_type="cpu"} >= 90
          for: 15m
          labels:
            severity: warning
            detector: D3
            team: platform
            route: finops-agent
          annotations:
            summary: "NodePool {{ $labels.nodepool }} at {{ $value | printf \"%.0f\" }}% of its CPU cap"
            description: "Karpenter cannot add nodes to {{ $labels.nodepool }} once usage reaches the cap: pods stay Pending and Rollouts abort on progressDeadlineSeconds (#1272, #809). Decide whether declared requests grew honestly (raise the cap) or overstate demand (right-size them) — do not reflex-raise; the cap is the runaway-cost guardrail."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0002-karpenter-node-drain.md"

    - name: openbank.finops.ebs-health
      interval: 2m
      rules:
        # D4: EBS volume attachment failures. FailedAttachVolume events precede
        # crashlooping pods by 2–5 minutes. Early detection allows manual force-detach.
        - alert: FinOpsEbsAttachmentFailing
          expr: |
            increase(kube_event_count{
              reason="FailedAttachVolume",
              type="Warning"
            }[10m]) > 0
          for: 2m
          labels:
            severity: warning
            detector: D4
            team: platform
            route: finops-agent
          annotations:
            summary: "EBS attachment failure — {{ $labels.namespace }}/{{ $labels.name }}"
            description: "PVC attachment failure detected. Node drain race or stuck finalizer. Check: kubectl describe pvc -n {{ $labels.namespace }} and force-detach runbook."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0004-ebs-stuck-finalizer.md"

        # D4b: PVC stuck in Pending/Lost phase for >5 minutes.
        - alert: FinOpsPvcStuck
          expr: |
            kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1
          for: 5m
          labels:
            severity: warning
            detector: D4
            team: platform
            route: finops-agent
          annotations:
            summary: "PVC stuck in {{ $labels.phase }} — {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has been {{ $labels.phase }} for >5 minutes. Likely requires force-detach or node drain."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0004-ebs-stuck-finalizer.md"

    - name: openbank.finops.ci-runner-pressure
      interval: 1m
      rules:
        # D5: ARC runner queue depth. High queue depth means jobs are waiting for runners —
        # this precedes the aio-max-nr exhaustion that caused CI fleet outages.
        # Requires ARC to expose ephemeralrunnerset_running_runners metric.
        # Note: the +1 guard is applied AFTER aggregation to avoid adding 1 per time-series.
        - alert: FinOpsCiRunnerQueueHigh
          expr: |
            sum(actions_runner_controller_ephemeral_runner_sets_assigned_runners) /
            (sum(actions_runner_controller_ephemeral_runner_sets_running_runners) + 1) > 0.8
          for: 5m
          labels:
            severity: warning
            detector: D5
            team: platform
            route: finops-agent
          annotations:
            summary: "CI runner pool > 80% utilisation"
            description: "ARC runner pool is at {{ $value | humanizePercentage }} capacity. Scale-up recommended to prevent aio-max-nr exhaustion and job queuing."
            runbook: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0007-arc-runner-scale.md"
