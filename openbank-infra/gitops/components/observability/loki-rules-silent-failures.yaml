# Log-based alerting (Loki ruler) — the failures that only ever appear in a log line.
#
# Delivered as a ConfigMap labelled loki_rule=1; the Loki chart's k8s-sidecar drops it into the
# ruler's local rules directory (see sidecar.rules in apps/loki.yaml). A rule here is a reviewed
# file in git, exactly like a PrometheusRule — never pushed through the ruler API.
#
# WHY THESE FOUR. Each one is a failure this repo has already paid for, whose ONLY evidence anywhere
# was a log line, and for which no metric exists or could easily exist:
#
#   HR000068                        five @Scheduled methods, three money-path, had NEVER run. A
#                                   plain @Scheduled method carries no Vert.x context, so
#                                   runBlocking around reactive Panache throws before the per-item
#                                   try/catch. The job aborts having done nothing — no failed
#                                   counter increments, because nothing got far enough to count.
#   SRCFG00040                       a missing @ConfigProperty value throws at boot. The pod
#                                   crashloops, which IS visible — but the reason is not, and
#                                   "which config key" is the entire diagnosis.
#   duplicate key ... _pkey          Panache persist() on an application-assigned @Id is INSERT-only,
#                                   so every lifecycle transition 500s (ADR-0126 D3, #1521).
#                                   Invisible to unit tests that mock the repository.
#   skipping its revaluation leg     fx-service's FxRevaluationService found no valid rate, logged
#                                   this, and returned posted=false — a successful-looking run of a
#                                   job that revalued nothing, for the entire life of the service.
#                                   The only other evidence was a table that stopped growing, and
#                                   nothing alerts on a table not growing.
#
# All four are `warning`, none pages. They mean "a thing you believe is running is not", which is
# urgent to know and not urgent at 03:00 — and alert fatigue is already this estate's documented
# root cause, so a new rule that pages is a regression even when it is correct.
#
# Retention is 7d (ADR-0088 D3), so these windows must stay well inside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules-silent-failures
  namespace: observability
  labels:
    loki_rule: "1"
    app.kubernetes.io/part-of: observability
data:
  silent-failures.yaml: |
    groups:
      - name: openbank.logs.silent-failures
        interval: 5m
        rules:
          # `pod!~"loki-.*"` ON EVERY UNSCOPED RULE IN THIS GROUP IS LOAD-BEARING, NOT TIDINESS.
          #
          # Loki logs every query it serves, and the log line contains the query text — so a rule
          # of the shape `{namespace=~".+"} |= "LITERAL"` matches Loki's own record of itself
          # running. It is a feedback loop that can never clear: the rule fires, the firing causes
          # another evaluation, the evaluation is logged, the log satisfies the rule.
          #
          # Measured 2026-08-21, within minutes of the ruler evaluating a rule for the first time
          # in this estate (#6032): all three unscoped rules here were `firing`, and all three were
          # false positives. Over 6h, `{namespace=~".+"}`:
          #     HR000068                       102 lines -> 0 with pod!~"loki-.*"
          #     SRCFG00040                      94 lines -> 0
          #     duplicate key value violates   289 lines -> 1 (and that one benign, see below)
          # Every single one came from `pod=loki-0`. Excluding only the ruler's own component
          # (`!= "component=ruler"`) is NOT enough and was tried: the query FRONTEND logs the same
          # text for any Grafana panel or ad-hoc query containing the literal, so 66 of 78 survived.
          # The pod is the boundary that holds.
          #
          # The tell that this is the mechanism, rather than a coincidence: the Falco rules in
          # loki-rules-falco-runtime.yaml grep for literals the same way and were `inactive`
          # throughout — their selector is `{namespace="falco"}`, which cannot match loki-0.
          #
          # A rule in this file that greps for a literal and does not pin `namespace` to one that
          # excludes Loki MUST carry this exclusion. `check-loki-rule-self-match.py` enforces it.

          # A scheduler that aborts on the missing Vert.x context. `HR000068` is Hibernate
          # Reactive's own code, so this matches the exception rather than our prose about it —
          # prose gets reworded, an exception code does not.
          - alert: SchedulerMissingVertxContext
            expr: |
              sum by (namespace, app) (
                count_over_time({namespace=~".+", pod!~"loki-.*"} |= "HR000068" [15m])
              ) > 0
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "{{ $labels.app }} in {{ $labels.namespace }} logged HR000068 — a scheduled job aborted"
              description: >-
                A @Scheduled method reached reactive Panache with no Vert.x context and threw before
                doing any work. The job did NOT run, and no failure counter incremented because
                nothing got far enough to count. Make the method a `suspend fun` — never
                runBlocking, never VertxContextSupport (rules.yaml: scheduled_methods).

          # A missing config value at boot. The crashloop is visible in kube-state-metrics; WHICH
          # key is missing is only ever in this line, and it is the whole diagnosis.
          - alert: ConfigPropertyMissingAtBoot
            expr: |
              sum by (namespace, app) (
                count_over_time({namespace=~".+", pod!~"loki-.*"} |= "SRCFG00040" [15m])
              ) > 0
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "{{ $labels.app }} in {{ $labels.namespace }} failed config load (SRCFG00040)"
              description: >-
                A @ConfigProperty has no value and no default, so the pod cannot start. Optional
                fields must be Optional<String> with a defaultValue. The failing key is named in
                the log line this alert matched.

          # persist() on an application-assigned @Id. Every lifecycle transition 500s, and a
          # repository-mocking unit test cannot see it.
          - alert: PanacheAssignedIdInsertOnly
            expr: |
              sum by (namespace, app) (
                count_over_time(
                  {namespace=~".+", pod!~"loki-.*"}
                    |= "duplicate key value violates"
                    # Temporal re-registers its default namespace on every startup and takes the
                    # unique-constraint rejection as the "already exists" answer — 3 lines a day,
                    # forever, always the same key. It is Temporal's own table and cannot be the
                    # Panache assigned-@Id defect this alert is named for, so it is excluded by
                    # CONSTRAINT NAME rather than by namespace: a genuine clash in the temporal
                    # namespace still fires. Leaving it in would have made this detector
                    # permanently firing, which is how a real detection gets ignored.
                    != "namespaces_pkey"
                  [15m]
                )
              ) > 0
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "{{ $labels.app }} in {{ $labels.namespace }} hit a duplicate-key violation on flush"
              description: >-
                Usually Panache persist() on an aggregate whose @Id is set by the application:
                Hibernate schedules an INSERT and never an UPDATE, so every update fails at flush
                (ADR-0126 D3, #1521). Use Panache.getSession().flatMap { it.merge(entity) }. Not
                always this cause — a genuine unique-constraint clash looks the same — so read the
                constraint name in the line.

          # A job that completed successfully having done nothing. The hardest class to alert on,
          # because every metric it touches reports a healthy run.
          # The selector is `ledger`, not `fx`, and that one word was the whole rule (#3921).
          # "skipping its revaluation leg" is emitted from exactly one place in service code —
          # openbank-ledger-service .../usecase/FxRevaluationService.kt — and the ledger workload
          # deploys to namespace `ledger` (gitops/apps/ledger.yaml). Selecting `fx` matched the
          # namespace holding fx-service, fx-db and redis, where that string is never logged, so
          # the only rule claiming to cover the skipped-leg path could not fire at all. The label
          # vocabulary was never in doubt: this same file selects namespace=~"ledger|accounts|…"
          # elsewhere. Companion signal, and the one that catches the quieter failure: the
          # openbank_fx_fixing_age_seconds gauge in prometheus-rules-fx-fixing.yaml, which sees a
          # rate that is stale-but-valid — a case that logs nothing at all.
          - alert: FxRevaluationSkippedAllLegs
            expr: |
              sum by (namespace) (
                count_over_time({namespace="ledger"} |= "skipping its revaluation leg" [1h])
              ) > 0
            for: 15m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "ledger-service revalued nothing — no valid ČNB rate available"
              description: >-
                FxRevaluationService (openbank-ledger-service) found no usable rate and returned
                posted=false. The run looks successful from every angle: no exception, no failed
                counter, a green job, and a workflow-liveness heartbeat that records the run as a
                success. The only other evidence is a table that stops growing, and nothing alerts
                on that. Check the ČNB feed first — it is ingested by fx-service, one namespace
                over (check-external-feeds.py probes the URL's payload SHAPE, not its status code
                — a 404 HTML page is a perfectly valid HTTP response).
