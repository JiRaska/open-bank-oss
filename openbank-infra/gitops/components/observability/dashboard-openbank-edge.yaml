# GENERATED banking dashboard (ADR-0082 single-pane). Loaded by the Grafana
# sidecar (label grafana_dashboard=1); synced by the observability-components
# ArgoCD app (recurse). Queries use live Tempo span-metrics + openbank_* /
# kyverno_* contracts.
# `or vector(0)` (added 2026-08-16): sum(rate(x{status_code=~"ERROR|5.."}[5m])) over an
# EMPTY match set is NOT a zero-valued sample in PromQL — it is no series at all, and Grafana
# renders that as "No data", indistinguishable from the metric never existing. During any window
# with genuinely zero errors this panel went blank, reading as broken when the real state was
# healthy. Verified live against Prometheus before and after: all patched panels went from an
# empty result set to a real 0-valued series over the same 14d window with confirmed non-zero
# service traffic (i.e. the fix restores correctness, it does not paper over a real data gap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-edge
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-edge.json: |
    {
      "id": null,
      "uid": "openbank-edge",
      "title": "OpenBank \u2014 Customer API Health (Edge)",
      "tags": [
        "openbank",
        "edge",
        "api",
        "red",
        "customer"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1,
            "options": [],
            "current": {},
            "query": "prometheus"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Customer-facing API \u2014 aggregate health (live span-metrics)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Customer API req/s",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Customer API error %",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (sum(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\",status_code=~\"STATUS_CODE_ERROR|5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m])),0.001)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Worst service p95",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(histogram_quantile(0.95, sum by (service, le)(rate(traces_spanmetrics_latency_bucket{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m]))))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Customer-facing services live",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(count by (service)(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Request rate by service",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (service)(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Error rate by service",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (service)(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\",status_code=~\"STATUS_CODE_ERROR|5..\"}[5m])) or vector(0)",
              "legendFormat": "{{service}}",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "p95 latency by service",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (service, le)(rate(traces_spanmetrics_latency_bucket{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m])))",
              "legendFormat": "{{service}}",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "table",
          "title": "Top endpoints by traffic (req/s)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(15, sum by (service, span_name)(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "Top error endpoints (err/s)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(15, sum by (service, span_name)(rate(traces_spanmetrics_calls_total{service=~\"openbank-account-service|openbank-balance-service|openbank-party-service|openbank-card-issuance-service|openbank-standing-order-service|openbank-statement-service|openbank-onboarding-service\",status_code=~\"STATUS_CODE_ERROR|5..\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ]
        },
        {
          "type": "text",
          "title": "Edge-process metrics \u2014 enablement note",
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "options": {
            "mode": "markdown",
            "content": "Panels above measure the **customer-facing backend services** the edge fronts (live span-metrics).\n\nThe **`customer-edge` process itself** currently exposes only infra metrics (CPU/mem/pod) and emits **no app-level request spans or `http_server_requests`** \u2014 so edge-local RED (per-route rate/latency at the edge, rate-limiting, PSD2/TPP, consent) isn't sourced yet.\n\n**Follow-up to add it:** instrument the edge with Micrometer/OTel HTTP server metrics (or enable the OTel agent) so `customer-edge` shows up in `traces_spanmetrics_*` / `http_server_requests_*`, then a dedicated edge-RED row can be added here."
          },
          "datasource": null
        }
      ]
    }
