# DB-layer alert rules (Dynatrace-parity #0). The fleet's 26 CNPG Postgres
# clusters now run the built-in exporter (spec.monitoring.enablePodMonitor on
# every Cluster), so `cnpg_*` series exist for connections, replication lag,
# deadlocks, transaction-id age and WAL archiving. This was the biggest blind
# spot vs an APM like Dynatrace, which auto-discovers every DB instance: before
# this, a saturated pool / replication stall / approaching xid wraparound was
# only visible indirectly once the *application* latency moved.
#
# Picked up automatically (ruleSelectorNilUsesHelmValues=false). Single-instance
# sandbox clusters have no replica, so the replication/streaming alerts simply
# have no series and never fire — they become meaningful once prod runs 3 nodes.
#
# NOTE: cnpg_* metric names follow CloudNativePG's default monitoring queries.
# Once the PodMonitors are scraping, verify panel/alert series in Grafana
# Explore (`{__name__=~"cnpg_.+"}`) and tune any name that shifted across CNPG
# versions before relying on these for paging.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-db-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.db.postgres
      rules:
        - alert: PostgresInstanceDown
          # Uses `up` (the SCRAPE result), NOT cnpg_collector_up (a metric the
          # instance exports about itself). That distinction is the whole alert:
          # a Postgres instance that is down stops exporting cnpg_* ENTIRELY, so
          # the series VANISHES rather than going to 0, and `cnpg_collector_up == 0`
          # — the previous expression here — can never match a down instance. It
          # was asking a dead exporter to report its own death.
          #
          # Proven live on sanctions-db-1 (2026-07-17, issue #1432), over a 12h
          # window while the instance was crashlooping:
          #   cnpg_collector_up{pod="sanctions-db-1"}  127 samples, ZERO of them 0
          #   up{pod="sanctions-db-1"}                 145 samples, 18 of them 0
          # and fleet-wide at the same moment:
          #   count(up{container="postgres"})  = 66   <- scrape targets
          #   count(cnpg_collector_up)         = 65   <- the missing one IS the dead one
          #
          # Consequence: sanctions-service (money-path AML screening) sat at zero
          # endpoints for hours and this alert never fired — not because it was
          # missing, but because it was structurally incapable of firing.
          #
          # `up` survives because Prometheus itself writes it per target: a target
          # that fails to scrape is recorded as 0, not dropped. Scoped by
          # container="postgres" so it covers only CNPG instance pods.
          expr: up{container="postgres"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Postgres {{ $labels.namespace }}/{{ $labels.pod }} is down"
            description: "Prometheus cannot scrape Postgres on {{ $labels.pod }} for >5m — the instance is down, crashlooping, or unreachable. Check `kubectl get cluster -n {{ $labels.namespace }}`: a CNPG cluster parked in phase `Not enough disk space` will NOT self-heal or fail over, by design — it waits for the PVC to be enlarged."
        - alert: PostgresVolumeLow
          # Preventive: catch a filling volume BEFORE it kills the instance, because
          # once the pod is gone this series disappears too (kubelet only reports
          # volume stats for a RUNNING pod) — so a low-disk threshold can never fire
          # on the pod that already died. It has to fire while the patient is alive.
          #
          # Why this matters here: CNPG parks a cluster in phase `Not enough disk
          # space` and deliberately does not fail over (promoting a replica with an
          # identically sized PVC would hit the same wall). The parked state has no
          # exit that does not involve a human — so a human has to be told.
          #
          # Threshold calibration (2026-07-17, 69 PVCs fleet-wide): every DB volume
          # sits at 67%+ free except sanctions-db-2 at 28.8%. 30% is comfortably
          # below the healthy population and fires only on a genuine outlier.
          expr: |
            100 * (
              kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-db-[0-9]+"}
              / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-db-[0-9]+"}
            ) < 30
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Postgres volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.1f\" }}% free"
            description: "PVC {{ $labels.persistentvolumeclaim }} has under 30% free for >15m. A CNPG cluster that actually runs out parks in phase `Not enough disk space` and stops until a human enlarges the PVC — this alert exists to arrive before that. Check peak WAL generation, not just current size: a bulk job can write more WAL in one run than the volume holds (issue #1432)."
        - alert: PostgresConnectionsSaturated
          # Open backends approaching max_connections — the classic 'too many
          # clients already' precursor. Ratio joins the pool count to the
          # instance's configured ceiling.
          expr: |
            sum by (namespace, pod) (cnpg_backends_total)
              / on (namespace, pod) group_left
              max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"})
              > 0.80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Postgres connections >80% on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Backends are above 80% of max_connections for >10m — raise the pool ceiling or fix a connection leak before clients are refused."
        - alert: PostgresReplicationLagHigh
          expr: cnpg_pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Postgres replication lag >30s on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Streaming replica is >30s behind the primary for >5m — failover would lose recent transactions."
        - alert: PostgresDeadlocksGrowing
          expr: rate(cnpg_pg_stat_database_deadlocks[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Postgres deadlocks on {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.datname }})"
            description: "Deadlocks are being detected continuously for >10m — contended write ordering, money-path correctness risk."
        - alert: PostgresTransactionWraparoundRisk
          # xid age climbing toward the 2^31 wraparound horizon. autovacuum
          # freezes at 200M by default; 300M means freezing is falling behind.
          expr: cnpg_pg_database_xid_age > 300000000
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Postgres xid age high on {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.datname }})"
            description: "Transaction-id age >300M and rising — autovacuum freezing is behind; left unchecked this ends in a forced read-only shutdown."
        - alert: PostgresWALArchiveFailing
          # Directly relevant to the PG 16→18 upgrade blocker: no point planning
          # pg_upgrade if WAL archiving (the basis of backup/PITR) is failing.
          expr: rate(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Postgres WAL archiving failing on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "archive_command has been failing for >15m — backups/PITR are not durable. Blocks safe pg_upgrade (runbook 0003)."
        - alert: PostgresLowCacheHitRatio
          expr: |
            sum by (namespace, pod) (rate(cnpg_pg_stat_database_blks_hit[10m]))
              / clamp_min(
                  sum by (namespace, pod) (rate(cnpg_pg_stat_database_blks_hit[10m]))
                    + sum by (namespace, pod) (rate(cnpg_pg_stat_database_blks_read[10m])),
                  1)
              < 0.90
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Postgres cache hit ratio <90% on {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Buffer cache hit ratio below 90% for >30m — under-sized shared_buffers or a missing index causing heavy disk reads."
