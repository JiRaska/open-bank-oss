apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-business
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-business.json: |
    {
      "id": null,
      "uid": "openbank-biz",
      "title": "OpenBank — Business KPIs",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1,
            "options": [],
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Accounts Created (selected range)",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(increase(openbank_accounts_created_total[$__range]))",
              "legendFormat": "Accounts",
              "refId": "A",
              "instant": true
            }
          ],
          "description": "Accounts opened within the dashboard's selected time range. NOT a lifetime total — Prometheus keeps 7 days and counters reset on pod restart. For real historical totals use the Business Reporting (warehouse) board, which reads ClickHouse."
        },
        {
          "id": 2,
          "title": "Parties Created",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(increase(openbank_parties_created_total[$__range]))",
              "legendFormat": "Parties Created",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Parties Verified",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area"
          },
          "targets": [
            {
              "expr": "sum(increase(openbank_parties_verified_total[$__range]))",
              "legendFormat": "Parties Verified",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "title": "Party Creation vs Verification Trend",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum(increase(openbank_parties_created_total[$__range]))",
              "legendFormat": "created",
              "refId": "A"
            },
            {
              "expr": "sum(increase(openbank_parties_verified_total[$__range]))",
              "legendFormat": "verified",
              "refId": "B"
            }
          ],
          "description": "Rate of party creation vs verification. Plotted as increase() over the dashboard range, not the raw counter: a Micrometer counter resets on pod restart and is per-replica, so the raw form drew a staircase that fell to zero on every deploy."
        },
        {
          "id": 5,
          "title": "KYC Funnel: Submitted vs Verdicts",
          "type": "bargauge",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "text": {}
          },
          "targets": [
            {
              "expr": "sum(increase(openbank_kyc_submissions_total[$__range]))",
              "legendFormat": "submitted",
              "refId": "A",
              "instant": true
            },
            {
              "expr": "sum by (outcome) (increase(openbank_kyc_verdicts_total[$__range]))",
              "legendFormat": "verdict={{outcome}}",
              "refId": "B",
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "title": "SCA Challenges: Issued vs Resolved by Outcome",
          "type": "bargauge",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "text": {}
          },
          "targets": [
            {
              "expr": "sum(increase(openbank_sca_challenges_total[$__range]))",
              "legendFormat": "issued",
              "refId": "A",
              "instant": true
            },
            {
              "expr": "sum by (outcome) (increase(openbank_sca_completions_total[$__range]))",
              "legendFormat": "resolved outcome={{outcome}}",
              "refId": "B",
              "instant": true
            }
          ]
        },
        {
          "id": 7,
          "title": "Ledger Postings Rate by Type",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum by (type) (rate(openbank_ledger_postings_total[5m]))",
              "legendFormat": "{{type}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Sanctions Screening Activity",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "hits"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "screenings"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(openbank_sanctions_screenings_total[5m]))",
              "legendFormat": "screenings",
              "refId": "A"
            },
            {
              "expr": "sum(rate(openbank_sanctions_hits_total[5m]))",
              "legendFormat": "hits",
              "refId": "B"
            }
          ]
        }
      ]
    }
