# Pension-fund administration dashboard (#12424). Generated layout, hand-reviewed; money panels are
# counters of what the service ESTABLISHED (settled at a published NAV), and AUM is the net assets of
# the last PUBLISHED NAV, never a live mark.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-pension-fund-business
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-pension-fund-business.json: |
