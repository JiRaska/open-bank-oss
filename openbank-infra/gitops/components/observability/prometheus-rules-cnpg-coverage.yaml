          # watching it. `unless` is the core of the alert: it yields the expected series
          # that has no counterpart, which is a real vector -- where the sibling threshold
          # alerts yield an empty one and stay silent forever.
          #
          # The `and on (namespace)` join is what keeps the REMEDY true. Without it this
          # alert also caught clusters whose namespace had never been created, and told
          # the operator to set enablePodMonitor on a Cluster that does not exist. Those
          # are PostgresClusterDeclaredNotDeployed's, below.
          #
          # 15m absorbs a rollout: a Cluster being recreated loses its target briefly.
          expr: |
            (
              openbank:cnpg_cluster_expected
                unless on (namespace, cluster) openbank:cnpg_cluster_scraped
            )
            and on (namespace) (max by (namespace) (kube_namespace_created))
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} is deployed but NOT scraped"
            description: "This cluster is DEPLOYED (its namespace exists) and Prometheus has no scrape target for it, so every Postgres alert -- PostgresNoRecoveryPoint, PostgresBackupStale, PostgresWALArchiveFailing and even PostgresInstanceDown -- is structurally incapable of firing for it. Its backup state is unknown, not healthy. Set spec.monitoring.enablePodMonitor: true on the Cluster, or declare it in NOT_SCRAPED in .github/scripts/check-cnpg-scrape-coverage.py with a reason."

        - alert: PostgresClusterDeclaredNotDeployed
          # The complement of the alert above, over the same unscraped set: the namespace
          # itself is absent, so there is no database, no PodMonitor to enable and no
          # backup to be worried about -- only a gitops declaration describing a fleet
          # that was never delivered. Warning, not critical: nothing is at risk; the
          # expected set is simply wrong, which is what erodes every alert built on it.
          #
          # 30m (longer than the sibling's 15m) absorbs a first-time Argo sync creating
          # the namespace and the Cluster in sequence.
          expr: |
            (
              openbank:cnpg_cluster_expected
                unless on (namespace, cluster) openbank:cnpg_cluster_scraped
            )
            unless on (namespace) (max by (namespace) (kube_namespace_created))
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} is declared in gitops but its namespace does not exist"
            description: "This cluster is declared in gitops and its NAMESPACE does not exist in the cluster, so nothing was ever deployed for it to scrape. Do NOT enable a PodMonitor -- there is no Cluster object to set it on. The subject is the Argo Application that should have created the namespace: check `kubectl get application -A` for one OutOfSync/Missing, or with no Application at all. Either deploy it, or delete the declaration so the expected set describes the fleet that exists rather than one that was planned."

        # Instances actually serving: a target that answers. A pod that cannot attach its
        # volume never gets an IP, so it is not a target at all and simply is not counted.
        - record: openbank:cnpg_cluster_instances_up
          expr: |
            count by (namespace, cluster) (
              label_replace(up{container="postgres"} == 1, "cluster", "$1", "pod", "(.+)-[0-9]+")
            )

        - alert: PostgresClusterDegraded
          # ADR-0325. On 2026-09-28 ~22 clusters sat with instances unable to attach their
          # EBS volumes and nothing named it: a Pending/ContainerCreating pod has no scrape
          # target, so PostgresInstanceDown (up == 0) cannot see it, and an HA cluster that
          # lost its standby still answers on the primary. Compare what the manifest DECLARES
          # with what answers. The `or ... * 0` arm makes a cluster with NO answering
          # instance read as 0 rather than vanish -- absent is not healthy.
          expr: |
            openbank:cnpg_cluster_instances_declared
              > on (namespace, cluster)
            (
              openbank:cnpg_cluster_instances_up
                or on (namespace, cluster) (openbank:cnpg_cluster_instances_declared * 0)
            )
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} has fewer instances serving than it declares"
            description: "For 15 minutes fewer Postgres instances have answered a scrape than the Cluster declares. An HA cluster in this state has no failover target; a single-instance one is down. Check `kubectl get cluster,pods -n <namespace>` for a Pending or ContainerCreating instance, then the pod events for a volume that cannot attach (FailedAttachVolume / VolumeInUse) -- that is a node that has not released its EBS volume, see NodeClaimAwaitingVolumeDetachment (ADR-0325)."
