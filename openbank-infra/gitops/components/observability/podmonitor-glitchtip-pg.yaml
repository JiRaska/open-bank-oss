# Keep the existing PodMonitor under observability-components while the
# glitchtip Application takes over the CNPG Cluster. Moving this resource
# between Applications during the database image rollout could trigger prune
# or ownership conflicts. The scrape gate verifies its selector and endpoint.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: glitchtip-pg
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    cnpg.io/cluster: glitchtip-pg
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: glitchtip-pg
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
