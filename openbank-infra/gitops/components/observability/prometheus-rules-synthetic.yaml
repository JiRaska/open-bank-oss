# Synthetic-probe alert rules (Dynatrace-parity #2). Fed by the blackbox Probe
# CRs. probe_success/probe_ssl_earliest_cert_expiry are emitted per target URL
# (label `instance`). Picked up automatically (ruleSelectorNilUsesHelmValues=false).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-synthetic-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.synthetic
      rules:
        # Generic edge-probe failure. The OIDC-discovery job is excluded here and handled
        # by OIDCDiscoveryDown below — same condition, but that alert can name the actual
        # blast radius (login is broken) and the right remediation, and excluding it keeps
        # one outage from paging twice under two alertnames.
        - alert: SyntheticProbeDown
          expr: probe_success{job!~"synthetic-oidc-discovery|synthetic-public-site|synthetic-public-dns"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Synthetic probe failing: {{ $labels.instance }}"
            description: "Blackbox probe to {{ $labels.instance }} has failed for >3m — the public endpoint is down or unreachable from in-cluster."
        - alert: PublicSiteUnavailable
          expr: probe_success{job="synthetic-public-site"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Public website unavailable: {{ $labels.instance }}"
            description: "The public landing page has failed its strict HTTP and content check for >3m. Check DNS, TLS, CloudFront and the S3 origin."
        - alert: PublicSiteDNSFailure
          expr: probe_success{job="synthetic-public-dns"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Public website DNS lookup failed via {{ $labels.instance }}"
            description: "The resolver cannot return an A record for open-bank.tech. Check the domain delegation, Route 53 records and resolver response."
        - alert: PublicSiteProbeMissing
          expr: absent(probe_success{job="synthetic-public-site"}) or absent(probe_success{job="synthetic-public-dns"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Public website monitoring is missing"
            description: "At least one public website probe job is not producing metrics. Check the Probe resources, Prometheus scrape targets and blackbox exporter."
        # The login alert (probes-synthetic.yaml: synthetic-oidc-discovery). Fires when a
        # Keycloak realm stops serving its OIDC discovery document — i.e. nobody can log
        # in. This is deliberately its own alert because no other signal sees it: the
        # admin-ui probe returns 200 from the landing page without Keycloak, and the
        # lenient http_app edge probe accepts the 404 a dead Keycloak still returns.
        - alert: OIDCDiscoveryDown
          expr: probe_success{job="synthetic-oidc-discovery"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Keycloak OIDC discovery failing: {{ $labels.instance }}"
            description: >-
              The OIDC discovery document at {{ $labels.instance }} has not served a valid 200 for
              >3m — the realm is not serving OIDC, so LOGIN IS BROKEN for everything that depends on
              it (realm `openbank` = admin-ui staff login; realm `openbank-customers` = customer /
              mobile login). Note the admin-ui and edge probes can stay GREEN through this.
              Check: kubectl -n iam get pods -l app=keycloak — and if the pod is absent rather than
              unhealthy, check whether admission was denied (KyvernoAdmissionDenied).
        - alert: SyntheticProbeSlow
          expr: probe_duration_seconds > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Synthetic probe slow: {{ $labels.instance }}"
            description: "{{ $labels.instance }} took >5s to respond for >10m."
        - alert: TLSCertExpiringSoon
          expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS cert expiring <14d: {{ $labels.instance }}"
            description: "Certificate for {{ $labels.instance }} expires in {{ $value | printf \"%.1f\" }} days — check cert-manager/letsencrypt-prod renewal."
        - alert: TLSCertExpiringCritical
          expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "TLS cert expiring <3d: {{ $labels.instance }}"
            description: "Certificate for {{ $labels.instance }} expires in {{ $value | printf \"%.1f\" }} days — renewal is failing, act now."
