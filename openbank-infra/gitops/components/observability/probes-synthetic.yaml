# Synthetic Probe targets (Dynatrace-parity #2). Prometheus-operator Probe CRs
# that drive the blackbox-exporter against the public ingress hosts. Picked up
# cluster-wide (probeSelectorNilUsesHelmValues=false). Each produces
# probe_success / probe_http_status_code / probe_ssl_earliest_cert_expiry /
# probe_duration_seconds labelled by instance (the target URL). Alerts in
# prometheus-rules-synthetic.yaml.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: synthetic-public-pages
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  jobName: synthetic-public-pages
  interval: 60s
  scrapeTimeout: 12s
  # Strict 2xx — admin-ui serves a real 200 at "/", so a non-2xx here is a
  # genuine regression worth paging on.
  # SCOPE (do not over-trust this probe): "/" is the unauthenticated landing page and
  # returns 200 whether or not Keycloak is alive, so this stays GREEN through a total
  # login outage. It proves the admin-ui pod + ingress + cert only. The OIDC path is
  # covered by the synthetic-oidc-discovery probe below — that is the login signal.
  module: http_2xx
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://admin.open-bank.tech
      labels:
        tier: edge
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: synthetic-edge-reachability
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  jobName: synthetic-edge-reachability
  interval: 60s
  scrapeTimeout: 12s
  # These hosts answer 401/403/404 at "/" by design (Keycloak has no welcome
  # page; customer/glitchtip serve their app under a sub-path). The lenient
  # http_app module treats "got an HTTP response" as up — proving ingress + TLS.
  module: http_app
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://customer.open-bank.tech
        - https://glitchtip.open-bank.tech
        - https://kc.open-bank.tech
      labels:
        tier: edge
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: synthetic-api
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  jobName: synthetic-api
  interval: 60s
  scrapeTimeout: 12s
  # Probe the API gateway apex for reachability + TLS. (The gateway returns 404
  # at "/api/v1/info" — that path isn't routed at the edge — so the previous
  # target produced a false down; the apex 404 still proves ingress + cert.)
  module: http_app
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://api.open-bank.tech
      labels:
        tier: api
---
# The login signal. Every other edge probe is blind to a dead IdP: admin.open-bank.tech
# serves its landing page 200 without Keycloak, and kc.open-bank.tech is probed with the
# lenient http_app module, which accepts the 404 a dead Keycloak behind a live ingress
# returns. Result: a Keycloak outage that broke ALL admin-ui login left every synthetic
# probe green. This probe exercises the OIDC discovery document itself with the strict
# http_oidc_discovery module (hard 200 + the discovery claims must be in the body), so
# the realm must genuinely be serving OIDC for it to pass.
#
# Both realms are covered because they fail independently and have different blast radii:
#   openbank            -> admin-ui staff login (KEYCLOAK_REALM in components/admin-ui)
#   openbank-customers  -> customer-facing / mobile login
# Discovery is a public, unauthenticated endpoint — no credential is involved in probing it.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: synthetic-oidc-discovery
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  jobName: synthetic-oidc-discovery
  interval: 60s
  scrapeTimeout: 12s
  module: http_oidc_discovery
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://kc.open-bank.tech/realms/openbank/.well-known/openid-configuration
        - https://kc.open-bank.tech/realms/openbank-customers/.well-known/openid-configuration
      labels:
        tier: iam
---
# Money-path SLO heartbeat (issue #669, rules.yaml: money_path_services).
#
# WHY THIS EXISTS
# The per-money-path availability/latency SLOs (pyrra-slo-money-path.yaml) use
# `traces_spanmetrics_calls_total{service=...}` as their indicator. That series
# is produced by the Tempo metrics-generator span_metrics processor, whose
# registry drops any service's series after `stale_duration` (default 15m) of
# no spans. On this cluster there is no continuous money-path load yet (#669's
# load benchmark is still open), so a money-path service that goes quiet for
# >15m loses its series and Pyrra's built-in `SLOMetricAbsent` alert fires at
# `severity: critical` — a pager page for a service that is perfectly healthy,
# just idle. On 2026-07-18 that was 12 of the 17 firing criticals (fraud / vop /
# billing / settlement), and the set rotates to whichever service is quietest.
#
# WHAT THIS DOES
# Blackbox GETs each money-path service's in-cluster root every 60s. The service
# handles the request (returns 404 at "/", an application URI that is NOT the
# span-suppressed /q/* management path), so it emits ONE server span per probe.
# That span keeps `traces_spanmetrics_calls_total{service=...}` warm, so the SLI
# never goes absent while the service is up. Validated 2026-07-18: a single
# in-cluster GET to fraud-service made `openbank-fraud-service` reappear in
# spanmetrics within ~5s of being absent.
#
# WHY IT DOES NOT MASK A REAL OUTAGE
# A genuinely-down service refuses the connection -> no span -> the series still
# drops and `SLOMetricAbsent` still fires. It also shows here as
# `probe_success{job="synthetic-money-path"}==0` (http_app treats a 404/401/403
# as up, only a connection/transport failure as down), which is a cleaner direct
# up/down signal than trace-absence. The 404 heartbeats are client errors
# (span status UNSET, not STATUS_CODE_ERROR) and complete in <1s, so they do not
# inflate the availability error-ratio or the latency SLO. Once #669 drives real
# traffic, that traffic dominates and these heartbeats become negligible.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: synthetic-money-path
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  jobName: synthetic-money-path
  interval: 60s
  scrapeTimeout: 10s
  # Lenient: a 404/401/403 at "/" is expected and proves the service is up and
  # emitting spans; only a connection failure (service down) yields probe_success=0.
  module: http_app
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      labels:
        tier: money-path
      static:
        - http://ledger-service.ledger.svc.cluster.local:8101/
        - http://transaction-service.payments.svc.cluster.local:8102/
        - http://account-service.accounts.svc.cluster.local:8100/
        - http://balance-service.balances.svc.cluster.local:8103/
        - http://sepa-payment.payments.svc.cluster.local:8115/
        - http://sepa-instant.payments.svc.cluster.local:8127/
        - http://domestic-payment.payments.svc.cluster.local:8116/
        - http://clearing-service.payments.svc.cluster.local:8124/
        - http://swift-service.payments.svc.cluster.local:8122/
        - http://fx-service.fx.svc.cluster.local:8119/
        - http://lending-service.lending.svc.cluster.local:8126/
        - http://sca-service.sca.svc.cluster.local:8110/
        - http://consent-service.consent.svc.cluster.local:8106/
        - http://fraud-service.fraud.svc.cluster.local:8133/
        - http://billing-service.billing.svc.cluster.local:8132/
        - http://settlement-service.payments.svc.cluster.local:8138/
        - http://sanctions-service.sanctions.svc.cluster.local:8123/
        - http://vop-service.payments.svc.cluster.local:8149/
