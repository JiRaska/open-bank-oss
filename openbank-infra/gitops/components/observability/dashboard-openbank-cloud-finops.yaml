              "refId": "A",
              "editorType": "sql",
              "format": 1,
              "rawSql": "SELECT category, round(e.estimate, 2) AS iac_estimate, round(a.actual, 2) AS actual_30d, round(a.actual - e.estimate, 2) AS diff FROM (SELECT category, sum(monthly_cost) AS estimate FROM openbank_analytics.finops_iac_resources WHERE run_id = (SELECT argMax(run_id, run_ts) FROM openbank_analytics.finops_ingest_runs) GROUP BY category) AS e FULL OUTER JOIN (SELECT category, sum(amount) AS actual FROM openbank_analytics.finops_aws_daily_cost FINAL WHERE usage_date >= today() - 30 AND usage_date < today() GROUP BY category) AS a USING category ORDER BY abs(diff) DESC"
