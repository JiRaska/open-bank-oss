# GENERATED banking dashboard (ADR-0082 single-pane). Loaded by the Grafana
# sidecar (label grafana_dashboard=1); synced by the observability-components
# ArgoCD app (recurse). Queries use live Tempo span-metrics + openbank_* /
# kyverno_* contracts.
# `or vector(0)` (added 2026-08-16): sum(rate(x{status_code=~"ERROR|5.."}[5m])) over an
# EMPTY match set is NOT a zero-valued sample in PromQL — it is no series at all, and Grafana
# renders that as "No data", indistinguishable from the metric never existing. During any window
# with genuinely zero errors this panel went blank, reading as broken when the real state was
# healthy. Verified live against Prometheus before and after: all patched panels went from an
# empty result set to a real 0-valued series over the same 14d window with confirmed non-zero
# service traffic (i.e. the fix restores correctness, it does not paper over a real data gap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-ledger-integrity
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-ledger-integrity.json: |
    {
      "id": null,
      "uid": "openbank-ledger-int",
      "title": "OpenBank \u2014 Ledger & Money-Movement Integrity",
      "tags": [
        "openbank",
        "ledger",
        "payments",
        "integrity"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1,
            "options": [],
            "current": {},
            "query": "prometheus"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Money-movement integrity",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Outbox backlog (total)",
          "description": "LIVE metric",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
