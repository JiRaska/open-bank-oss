          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Payment event dead-letter arrivals",
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(increase(kafka_topic_partition_current_offset{topic=\"openbank.dlq.pension.domestic-payment-events-in\"}[1h]))",
              "legendFormat": "new records",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
