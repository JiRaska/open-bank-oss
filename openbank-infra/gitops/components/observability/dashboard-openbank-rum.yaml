# Mobile RUM dashboard (ADR-0088 D4). Visualises the Real-User-Monitoring spans
# the KMP app emits via the hardened ingest gateway (ADR-0089) -> Tempo. RED panels
# are driven by the Tempo metrics-generator span-metrics (traces_spanmetrics_*,
# service="openbank-app") -- same zero-extra-instrumentation source as the backend
# RED board (ADR-0082). The raw traces panel uses TraceQL on Tempo so you can open a
# device span and follow it straight into the backend trace (one trace id,
# tap -> ledger). Crash-free health lives on the companion "Mobile Crashes" board
# (GlitchTip).
#
# Current customer-app source implements consent-gated OTLP export on Android and iOS.
# That is capability evidence, not runtime proof: the span-metrics below establish sampled
# mobile arrival but do not reliably identify the emitting OS. Delivery for both halves is
# in JiRaska/openbank-app, a separate repo (ADR-0147).
#
# READING AN EMPTY BOARD -- see docs/runbooks/0013-rum-cardinality.md.
# Empty is the normal state and does not mean the app has no traffic. RUM is off by
# default, OIDC/consent-gated, debug builds only, and the gateway samples at 25%, so
# the measured arrival rate is a burst of one or two spans every few hours. Verified
# 2026-08-20: exactly one openbank-app trace in a 6h window, and it correctly joined
# the backend trace (screen.HOME + POST /api/v1/copilot/chat/stream in one trace id),
# so ingest and context propagation both work -- it is volume that is absent.
#
# The per-screen panels below key on span_name (the app names screen spans
# "screen.<NAME>", e.g. screen.HOME), NOT on the screen.name ATTRIBUTE. Current Android
# and iOS source also sets bounded screen.name/app.version/os/device attributes, but older
# deployed clients may not; no panel here depends on those optional dimensions.
#
# openbank-admin-ui is deliberately NOT on this board: ADR-0088 D4 rejected browser
# RUM as the wrong surface (internal operator console). The gateway also emits no
# CORS headers and accepts only customer-realm tokens, so admin-ui could not export
# here without an ADR-level reversal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-rum
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-rum.json: |
    {
      "id": null,
      "uid": "openbank-rum",
      "title": "OpenBank — Mobile RUM (Real-User Monitoring)",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "pluginId": "prometheus", "label": "Metrics", "current": {} },
          { "name": "app", "type": "constant", "label": "RUM service", "query": "openbank-app", "hide": 2 }
        ]
      },
      "panels": [
        {
          "title": "How to read this board",
          "type": "text",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "options": { "mode": "markdown", "content": "**Mobile RUM** \u2014 device-side spans from the KMP app through the hardened ingest gateway \u2192 Tempo. Android and iOS exporters exist in current app source; this board proves sampled arrival, not per-OS deployment.\n\n- **Empty is normal.** RUM is off by default, OIDC/consent-gated, debug builds only, and the gateway samples at 25%. Measured 2026-08-20: ~1 trace per 6h. An empty board is **not** evidence the app has no traffic \u2014 see `docs/runbooks/0013-rum-cardinality.md` before escalating.\n- **R/E/D** come from Tempo span-metrics (`service=openbank-app`), no extra instrumentation.\n- **Screen panels key on `span_name`** (`screen.<NAME>`). Current Android/iOS source also emits bounded `screen.name`, `app.version`, `os.*` and `device.model`; live values appear only after a newly built, consented client is sampled.\n- Tap \u2192 ledger works: a device span and the backend span share one trace id. Open one in the *RUM traces* panel.\n- **admin-ui is not here on purpose**: ADR-0088 D4 rejected browser RUM as the wrong surface.\n- Only the pseudonymous `party_id` identifies a session. Crash-free health \u2192 *Mobile Crashes* board." }
        },
        {
          "title": "Screen-view rate (per screen)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "legendFormat": "{{span_name}}", "expr": "sum by (span_name) (rate(traces_spanmetrics_calls_total{service=~\"$app.*\"}[5m]))" } ]
        },
        {
          "title": "App span p95 / p99 latency (D)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "refId": "A", "legendFormat": "p95", "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"$app.*\"}[5m])))" },
            { "refId": "B", "legendFormat": "p99", "expr": "histogram_quantile(0.99, sum by (le) (rate(traces_spanmetrics_latency_bucket{service=~\"$app.*\"}[5m])))" }
          ]
        },
        {
          "title": "RUM span error rate (E)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "legendFormat": "error ratio", "expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"$app.*\",status_code=\"STATUS_CODE_ERROR\"}[5m])) / clamp_min(sum(rate(traces_spanmetrics_calls_total{service=~\"$app.*\"}[5m])), 0.001)" } ]
        },
        {
          "title": "Top screens (5m)",
          "type": "table",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 12 },
          "targets": [ { "refId": "A", "format": "table", "instant": true, "expr": "topk(15, sum by (span_name) (rate(traces_spanmetrics_calls_total{service=~\"$app.*\"}[5m])))" } ]
        },
        {
          "title": "RUM traces (open one → follow tap → ledger)",
          "type": "table",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 19 },
          "targets": [ { "refId": "A", "datasource": { "type": "tempo", "uid": "tempo" }, "queryType": "traceql", "query": "{ resource.service.name=\"openbank-app\" }", "limit": 50, "tableType": "traces" } ]
        }
      ]
    }
