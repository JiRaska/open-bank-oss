# PUSH-channel alert rules (ADR-0252 phase 0). Fed by PushMetricsAdapter in
# openbank-notification-service, which emits openbank_notification_push_sends_total
# and openbank_notification_push_fanouts_total. Picked up automatically
# (ruleSelectorNilUsesHelmValues=false), same as the other rule files here.
#
# WHAT THESE CAN AND CANNOT SAY. `outcome="ACCEPTED"` counts provider ACCEPTANCES:
# APNs answers HTTP 200 to mean accepted for delivery and issues no receipt, so
# nothing in the service can observe whether a device received anything. These
# rules therefore detect "we stopped handing pushes to the provider" and "the
# provider is rejecting us" — not "customers stopped getting notifications".
# Closing that gap needs a device-side acknowledgement (ADR-0252 phase 3, #4348);
# until it exists, do not read a green board here as proof of delivery.
#
# The outage these exist for produced NO errors: every adapter was disabled, every
# send returned a successful no-op, and the notification rows read SENT. That is
# why PushChannelSkippedOnly below alerts on a *success* state.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-push-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.push
      rules:
        # The disabled-adapter case, stated positively. A skipped send means the adapter is
        # switched off, which in an environment that is supposed to push is a silent outage:
        # nothing errors, nothing retries, and before ADR-0252 phase 0 the notification was
        # even recorded SENT. Fires on any sustained skip, because there is no legitimate
        # steady-state reason for one here.
        - alert: PushChannelSkippedOnly
          expr: |
            sum(rate(openbank_notification_push_sends_total{outcome="SKIPPED"}[15m])) > 0
            and
            sum(rate(openbank_notification_push_sends_total{outcome="ACCEPTED"}[15m])) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Push adapters are disabled — every send is a no-op"
            description: >-
              notification-service has accepted no push into a provider for 15m while skipping
              sends, i.e. the APNs/FCM adapters are switched off or unconfigured. Customers are
              receiving nothing. Check APNS_ENABLED / the notification-service-apns ExternalSecret.
        # Fan-outs are happening but nothing reaches a provider. Distinct from the alert above:
        # there the adapter is off, here it is on and failing.
        - alert: PushDeliveryRejected
          expr: |
            sum(rate(openbank_notification_push_sends_total{outcome="FAILED"}[15m]))
              / clamp_min(sum(rate(openbank_notification_push_sends_total[15m])), 0.001) > 0.5
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Over half of push sends are rejected by the provider"
            description: >-
              More than 50% of push sends have failed for 15m. Check the error_code label —
              CONFIG points at credentials, HTTP_403/BadTopic at the signing key or apns-topic
              bundle id, HTTP_410 at token retirement (which is normal in small numbers).
        # Absence, not failure. A counter that has never incremented does not exist, so no
        # ratio or rate rule above can fire when the channel stops being exercised at all —
        # which is precisely how a dead push path stays invisible. This is the rule that
        # covers the silence. 6h is deliberately long: a quiet night is not an outage.
        - alert: PushChannelSilent
          expr: absent_over_time(openbank_notification_push_sends_total[6h])
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No push send recorded anywhere for 6h"
            description: >-
              notification-service has emitted no push send series for 6h. Either nothing is
              requesting PUSH notifications, or the fan-out is not running. Neither is visible
              from any error signal — check openbank_notification_push_fanouts_total and the
              consumer lag on openbank.notification.requests.
        # Every fan-out ends with no registered device. Not a delivery failure — a registration
        # one, and it would otherwise present as "push is broken" to everyone looking.
        - alert: PushNoDevicesRegistered
          expr: |
            sum(rate(openbank_notification_push_fanouts_total{devices_bucket="0"}[30m]))
              / clamp_min(sum(rate(openbank_notification_push_fanouts_total[30m])), 0.001) > 0.9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Over 90% of push fan-outs find no registered device"
            description: >-
              Almost every PUSH request targets a party with no ACTIVE device token. Suspect the
              device-registration path (POST /api/v1/devices) or a mass token invalidation, not
              the push provider.

        # #4363: only evaluated after the explicit, default-off fallback flag is enabled. This
        # watches the *routed* handoff, not a target-channel delivery; SMTP acceptance/bounce is a
        # distinct outcome on the separate EMAIL row. A supported template with no device must
        # create a fallback request, otherwise the policy is configured but inert.
        - alert: PushFallbackConfiguredButInert
          expr: |
            (
              (
                sum by (template) (increase(openbank_notification_push_fanouts_total{
                  devices_bucket="0", template=~"ACCOUNT_FROZEN|KYC_REJECTED|KYC_DOCUMENT_REQUIRED|TRANSACTION_FAILED"
                }[15m]))
                or on (template) (
                  sum by (template) (openbank_notification_push_fanouts_total{
                    devices_bucket="0", template=~"ACCOUNT_FROZEN|KYC_REJECTED|KYC_DOCUMENT_REQUIRED|TRANSACTION_FAILED"
                  }) unless on (template) sum by (template) (openbank_notification_push_fanouts_total{
                    devices_bucket="0", template=~"ACCOUNT_FROZEN|KYC_REJECTED|KYC_DOCUMENT_REQUIRED|TRANSACTION_FAILED"
                  } offset 15m)
                )
              )
              >
              (
                (
                  sum by (template) (increase(openbank_notification_fallback_routed_total{outcome="REROUTED"}[15m]))
                  or on (template) (
                    sum by (template) (openbank_notification_fallback_routed_total{outcome="REROUTED"})
                    unless on (template) sum by (template) (openbank_notification_fallback_routed_total{outcome="REROUTED"} offset 15m)
                  )
                ) or on (template) (
                  sum by (template) (openbank_notification_push_fanouts_total{
                    devices_bucket="0", template=~"ACCOUNT_FROZEN|KYC_REJECTED|KYC_DOCUMENT_REQUIRED|TRANSACTION_FAILED"
                  }) * 0
                )
              )
            )
            and on () (max(openbank_notification_push_fallback_enabled) == 1)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Enabled no-device push fallback did not create a routed request"
            description: >-
              A policy-approved PUSH template found no active device while fallback was enabled, but
              that template has no separate EMAIL fallback record. Check notification-service logs and the
              openbank_notification_fallback_routed_total counter; this says nothing about e-mail
              delivery, only that the handoff was not created.

        # A terminal transition that found no row to write itself onto (issue #4512). The service
        # then publishes a NotificationOutcome event for a notification the table cannot show:
        # the producer's funnel is told about a message that has no durable record, which is an
        # evidence gap under DORA Art. 17-19, not a counting quirk.
        #
        # Measured 2026-08-09: four SCA_APPROVAL PUSH fan-outs, four NotificationOutcome rows in
        # notification_outbox, zero notifications rows, and zero error lines in the pod. Every
        # conventional signal was green — the consumer acked, the offsets advanced, the outbox
        # dispatched. There is NOTHING failing to alert on, which is why this reads a counter that
        # only increments on a path the code treats as successful.
        #
        # Same `or vector(0)` self-delta as ScaApprovalPushUndeliverable below, and for the same
        # measured reason: Micrometer registers a counter lazily on its first increment, so the
        # series is born at 1 after every pod restart and increase() would read 0 on the very
        # first occurrence — the one that matters most. Threshold is one: a single orphaned
        # transition is already a lost record.
        - alert: NotificationStatusRowMissing
          expr: |
            (sum(openbank_notification_status_row_missing_total) or vector(0))
            -
            (sum(openbank_notification_status_row_missing_total offset 15m) or vector(0)) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "A notification outcome was published for a row that does not exist"
            description: >-
              notification-service completed a terminal transition against a missing notifications
              row and published the outcome event anyway, so a delivery attempt happened with no
              durable record of it. Check the notification.status.row_missing ERROR line for the
              notificationId and party, then compare notification_outbox against notifications for
              that window — an outbox row with no matching notifications row is the fingerprint.

        # The ratio rules above are about the channel; this one is about a single message, because
        # not every push is worth the same alert. SCA_APPROVAL is the prompt telling a customer a
        # payment waits on their approval — a PSD2 Art. 97 control — so ONE undelivered instance
        # is worth waking someone, where one lost marketing push is not.
        #
        # It is NOT true that the customer cannot then authorise: openbank-app also lists live
        # challenges at GET /customer/v1/sca/pending, so someone who opens the app can still
        # approve. What they lose is any notice that they need to. The wording says that, because
        # an alert that overstates its own severity is one people learn to discount.
        #
        # Reads the `template` label added to the fan-out counter for exactly this rule — before
        # it existed an undeliverable SCA approval was indistinguishable at the metrics layer from
        # any other push. Measured 2026-08-08: 11 failed SCA_APPROVAL pushes across 6 parties over
        # two weeks, none of which raised anything.
        # NOT increase(). Micrometer registers a counter lazily, on its first increment, so after
        # every pod restart the series is BORN at 1: there is no earlier sample, every point in
        # the window equals 1, and increase() is 0. The rule would have stayed silent on the first
        # undelivered SCA approval after each restart — the exact event it exists for. Measured
        # against the live estate: raw counter 1, increase()[15m] 0, stable across six scrapes.
        #
        # Comparing the counter to its own value 15m ago, with `or vector(0)` on BOTH sides so an
        # absent series reads as zero, fires on the 0 -> 1 birth as well as on later increments.
        # A pod restart makes the delta negative for one window, which correctly does not alert.
        - alert: ScaApprovalPushUndeliverable
          expr: |
            (sum(openbank_notification_push_fanouts_total{
              template="SCA_APPROVAL", outcome="FAILED"
            }) or vector(0))
            -
            (sum(openbank_notification_push_fanouts_total{
              template="SCA_APPROVAL", outcome="FAILED"
            } offset 15m) or vector(0)) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "An SCA approval push could not be delivered"
            description: >-
              An SCA_APPROVAL fan-out ended FAILED in the last 15m, so the customer was never
              prompted that a payment is waiting on them. They can still approve by opening the
              app (pending-approvals list), but will not know to. devices_bucket="0" means the
              party has no registered device at all — that is a registration problem, not a
              provider one.
