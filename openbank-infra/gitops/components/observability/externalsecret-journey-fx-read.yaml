#
# Journey fx-rates-read (ADR-0252): the journey's OWN Keycloak client
# `openbank-synthetic-fx-read`. It holds NO realm role; its only grant is the `fx:read`
# client scope, which fx-service's FxScopeIdentityAugmentor maps to FX_SCOPE_READ and
# fx_rest_ext.rego admits on fx.list/fx.read only. KV layout is ADR-0099's
# `openbank/keycloak/synthetic-fx-read`, written once by the owner's provisioning step
# (runbook 0009, "Synthetic journey identity"); nothing in this repo holds the value.
#
# The CronJob references this Secret with `optional: true`. Until the KV entry is seeded
# the Secret does not exist, the pod still starts, and the k6 script fails its checks with
# an explicit "credential absent" error: red, never a crash loop and never a false green.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: journey-fx-read-oidc
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: journey
    openbank.tech/journey: fx-rates-read
  annotations:
    # This client's own secret; rotate it (kcadm regenerate + re-seed KV) by this date.
    openbank.io/rotation-deadline: "2027-10-14"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: journey-fx-read-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FX_READ_CLIENT_SECRET
      remoteRef:
        key: keycloak/synthetic-fx-read
        property: client_secret
