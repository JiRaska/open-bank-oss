apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-services
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  openbank-services.json: |
    {
      "id": null,
      "uid": "openbank-svc",
      "title": "OpenBank — Service Health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1,
            "options": [],
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate per Service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 1, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "sum by (service, uri, status) (rate(http_server_requests_seconds_count[5m]))",
              "legendFormat": "{{service}} {{uri}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "P99 Latency per Service",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 1, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_server_requests_seconds_bucket[5m])))",
              "legendFormat": "p99 {{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate % (5xx / total) per Service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "lineWidth": 1, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / sum by (service) (rate(http_server_requests_seconds_count[5m]))",
              "legendFormat": "error% {{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Active JVM Pods per Service",
          "type": "stat",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "targets": [
            {
              "expr": "count by (service) (jvm_memory_used_bytes{area=\"heap\"})",
              "legendFormat": "{{service}}",
              "refId": "A",
              "instant": true
            }
          ]
        }
      ]
    }
