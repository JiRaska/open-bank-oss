#
# Issue #7324: the product-catalog-read journey's OWN Keycloak client
# `openbank-synthetic-catalog-read`. It holds no realm role; its only grant is the
# `catalog:read` client scope, which product-catalog maps to CATALOG_SCOPE_READ. KV layout is
# ADR-0099's `openbank/keycloak/<identity>`, written once by the owner's provisioning step
# (runbook 0009, "Synthetic journey identity"); nothing in this repo holds the value.
#
# The CronJob references this Secret with `optional: true`. Until the KV entry is seeded the
# Secret does not exist, the pod still starts, and the k6 script fails its checks with an
# explicit "credential absent" error: red, never a crash loop and never a false green.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: journey-product-catalog-read-oidc
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: journey
    openbank.tech/journey: product-catalog-read
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-24"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: journey-product-catalog-read-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CATALOG_READ_CLIENT_SECRET
      remoteRef:
        key: keycloak/synthetic-catalog-read
        property: client_secret
