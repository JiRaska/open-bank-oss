# Forecast / anomaly alert rules (Dynatrace-parity #6). This is the "Davis-lite"
# layer: OSS has no ML anomaly engine that matches Dynatrace Davis, but most of
# its day-to-day value is predictive ("this disk fills in 4h", "traffic just
# fell off a cliff") which plain PromQL does well with predict_linear, Holt-
# Winters and stddev bands. These are heuristics — tune the windows/thresholds
# once you have a few weeks of baseline, and graduate the noisy ones to
# multi-window forms. Picked up automatically (ruleSelectorNilUsesHelmValues=false).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-forecast-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.forecast.capacity
      rules:
        # Node root/data disks projected to hit zero within 4h on the current
        # 6h slope. Gated on <50% free so a half-empty disk with a transient
        # slope doesn't page.
        - alert: NodeDiskWillFillIn4h
          expr: |
            predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 4 * 3600) < 0
            and on (instance, device, mountpoint)
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk on {{ $labels.instance }} ({{ $labels.mountpoint }}) fills within ~4h"
            description: "Projected to reach 0 bytes within 4h on the 6h trend — extend the volume or reclaim space."
        # PVC fill projection — covers the CNPG Postgres and Tempo/Loki data
        # volumes, the most likely things to silently fill (ties to #0).
        - alert: PersistentVolumeWillFillIn6h
          expr: |
            predict_linear(kubelet_volume_stats_available_bytes[6h], 6 * 3600) < 0
            and on (namespace, persistentvolumeclaim)
            kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes < 0.4
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} fills within ~6h"
            description: "Projected to fill within 6h on the 6h trend — a full Postgres/Tempo/Loki PVC wedges the workload."
    - name: openbank.forecast.anomaly
      rules:
        # Latency trend anomaly: p99 span latency >3σ above its own 3h mean = a
        # regime change the static 2s threshold would miss until it crossed the
        # line. NOTE: Prometheus 3.x removed holt_winters (→ the experimental
        # double_exponential_smoothing, gated behind a feature flag), so this
        # uses a plain moving-average + stddev band instead — no feature flag,
        # same "deviation from trend" intent, consistent with TrafficDropAnomaly.
        # Floored at 50ms so near-idle services don't alert on µs-scale noise.
        - alert: SpanLatencyTrendAnomaly
          expr: |
            (
              histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket[10m])))
              >
              avg_over_time(
                histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket[10m])))[3h:10m]
              )
              + 3 * stddev_over_time(
                histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket[10m])))[3h:10m]
              )
            )
            and
            histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket[10m]))) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency on {{ $labels.service }} deviating above its trend"
            description: "Span p99 is >3σ above its 3h mean for >15m — a deviation from normal, independent of the absolute SLO threshold."
        # Traffic-drop anomaly: request rate collapses far below the last hour's
        # mean (3-sigma below). Catches a silent upstream outage / wedged
        # consumer that error-rate alerts miss (no errors if no calls arrive).
        - alert: TrafficDropAnomaly
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total[10m]))
              <
              avg_over_time(sum by (service) (rate(traces_spanmetrics_calls_total[10m]))[1h:10m])
                - 3 * stddev_over_time(sum by (service) (rate(traces_spanmetrics_calls_total[10m]))[1h:10m])
            )
            and
            avg_over_time(sum by (service) (rate(traces_spanmetrics_calls_total[10m]))[1h:10m]) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Traffic on {{ $labels.service }} dropped far below trend"
            description: "Request rate is >3σ below the last hour's mean for >10m — possible silent upstream outage or wedged consumer."
    # ADR-0173 D1 — cluster capacity saturation. The gap this closes: the NodePool
    # `limits` (cpu: 48 / memory: 128Gi, aws/envs/sandbox-platform/main.tf) are both
    # the FinOps cost control AND the fleet capacity ceiling, and when they bind
    # Karpenter simply stops provisioning — pods go Pending, nothing alerts. That is
    # exactly issue #809's second-order failure ("raising requests pinned the pool at
    # its limits"), and until now the only rules here forecast disk and PVC fill.
    #
    # NOT alerting directly on the NodePool cap, deliberately: Karpenter's metrics are
    # not scraped (`karpenter_nodepools_limit` returns 0 series — verified against the
    # live Prometheus 2026-07-16), so a `karpenter_*` rule would be a rule that can
    # never fire. Scraping Karpenter is the better fix and is worth doing; these rules
    # work with what is actually collected today.
    - name: openbank.capacity.saturation
      rules:
        # THE #809 SIGNAL. When the NodePool cap binds, this is what the cluster looks
        # like — Karpenter refuses to provision and pods sit Pending indefinitely. A
        # short spike is normal during a rollout or a scale-from-zero, hence 15m.
        #
        # Uses kube_pod_status_phase{phase="Pending"} and NOT
        # kube_pod_status_unschedulable: the latter's metric NAME is in Prometheus's
        # label index but it has 0 series even unfiltered (verified live) — an alert on
        # it would look correct, pass review, and never fire.
        - alert: PodsPendingSustained
          expr: sum(kube_pod_status_phase{phase="Pending"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} pod(s) Pending for >15m — cluster may be at its capacity ceiling"
            description: >-
              Karpenter is not satisfying these pods. First check the NodePool limits
              (cpu/memory in aws/envs/sandbox-platform/main.tf): when they bind, provisioning
              stops silently and pods queue — the issue #809 failure mode. Other causes: a
              taint/affinity nothing satisfies, or the 20:00-07:00 UTC disruption freeze
              interacting with a rollout. Raising the cap is a FinOps decision (ADR-0173), not
              a reflex.
        # Leading indicator: requests committed against what the current nodes can offer.
        # Karpenter bin-packs by REQUESTS (ADR-0173 §2), so this is the number that decides
        # whether the next pod fits — not actual usage. High commitment with the cap near
        # means the next scale-up is the one that fails.
        - alert: ClusterCpuCommitmentHigh
          expr: |
            sum(kube_pod_container_resource_requests{resource="cpu"})
              / sum(kube_node_status_allocatable{resource="cpu"}) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Cluster CPU requests at {{ $value | humanizePercentage }} of allocatable"
            description: >-
              Committed CPU is close to what the running nodes can offer. If the NodePool cpu
              limit is also near, the next pod that needs a new node will go Pending instead
              (see PodsPendingSustained). Baseline when this rule was written: ~68%.
        - alert: ClusterMemoryCommitmentHigh
          expr: |
            sum(kube_pod_container_resource_requests{resource="memory"})
              / sum(kube_node_status_allocatable{resource="memory"}) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Cluster memory requests at {{ $value | humanizePercentage }} of allocatable"
            description: >-
              Memory is the axis that bit in #809 — and note allocatable already has the
              kubelet eviction headroom subtracted (evictionHard 300Mi / evictionSoft 500Mi in
              the EC2NodeClass), so this is honest bin-packing arithmetic, not a paper number.
              Baseline when this rule was written: ~42%.
