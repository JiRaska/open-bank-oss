# Tier-1 alert rules (ADR-0077 Phase 4 / ADR-0082). Picked up by the Prometheus
# operator (ruleSelectorNilUsesHelmValues=false → any PrometheusRule is loaded).
# Error/latency are derived from the Tempo metrics-generator span-metrics, so they
# cover the whole fleet without per-service instrumentation. The SLO burn-rate
# group is the multi-window/multi-burn pattern (Google SRE workbook) for the
# payment rails at a 99.9% target (error budget = 0.1%).
#
# Applied with `kubectl apply -f` like the other observability components.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-tier1-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: openbank.tier1.health
      rules:
        - alert: PaymentServiceDown
          # The payment microservices are scraped by the fleet PodMonitor under the
          # job `observability/openbank-services` (the service name is the `container`
          # label), NOT under a `*payment*` job. The old `up{job=~".*payment.*|.*fx.*"}`
          # therefore NEVER matched a real service — it only matched the auxiliary
          # `payments/*-db` Postgres exporters and `payments/redis-metrics`, so the
          # alert was doubly wrong: blind to an actual service outage, yet paging a
          # critical whenever a cache/db exporter scrape failed. Scope to the fleet
          # job in the payment namespaces: this covers every payment-rail service
          # (sepa/domestic/instant/fx/settlement/clearing/standing-order/transaction/
          # card-issuance) and auto-includes new ones, while the db/redis exporters
          # (different jobs) only ever raise TargetDown (warning), not a payment page.
          expr: up{job="observability/openbank-services", namespace=~"payments|fx"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Payment service {{ $labels.container }} is down"
            description: "{{ $labels.container }} ({{ $labels.namespace }}) has been unreachable for >2m."
        - alert: MoneyPathServiceDown
          # The half of #3333's SLOMetricAbsent that was worth keeping, expressed on a signal that
          # can actually carry it. The Pyrra absent rules were deleted because they watched Tempo
          # span-metrics, which vanish when a service is merely idle; `up` comes from the fleet
          # PodMonitor and is emitted whether or not anyone calls the service, so `up == 0` means
          # "the pod is there and not answering", which is a fault in every environment.
          #
          # Scoped to the money-path namespaces that no other Down rule already covers —
          # PaymentServiceDown owns payments+fx and LendingServiceDown owns lending, and a second
          # rule over the same targets would just page twice for one outage. The remaining eleven
          # are the money_path_services (rules.yaml) that live in a namespace of their own; ledger
          # is among them, so the core money service had no liveness alert at all until now.
          #
          # `for: 10m` is measured, not guessed: over the retained window every `up == 0` on this
          # job was a pod start or termination lasting at most 3 consecutive scrapes (~90s), so at
          # 10m this rule contributes nothing to the idle alert set — which is the whole point of
          # #3333. Pod-level churn is already covered by KubePodCrashLooping / KubePodNotReady.
          expr: up{job="observability/openbank-services", namespace=~"ledger|accounts|balances|sdd|interest|sca|consent|fraud|billing|sanctions|delegation"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Money-path service {{ $labels.container }} is down"
            description: "{{ $labels.container }} ({{ $labels.namespace }}) has failed scraping for >10m — the pod exists but is not answering."
        - alert: HighErrorRate
          # The ratio alone is meaningless at trivial throughput: a service doing
          # 0.2 req/s with a couple of expected error spans (e.g. the security
          # scanner probing endpoints) trips >10% and pages a critical → which
          # also fires a HolmesGPT LLM investigation, burning the Groq daily token
          # budget. Gate on an absolute floor (>0.5 erroring spans/s) so only a
          # real, sustained error volume — not a low-traffic blip — can fire.
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
                / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total[5m])), 0.001) > 0.10
            )
            and
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) > 0.5
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on {{ $labels.service }}"
            description: ">10% of spans on {{ $labels.service }} are erroring at >0.5 err/s (5m window)."
        # SAMPLE-DENSITY GUARD, ADDED BY #6054. Without the second clause this rule was
        # STRUCTURALLY UNABLE TO FIRE for sparse subjects, and could not be fixed by widening
        # the window. `histogram_quantile(0.99, ...)` over a window holding ~15 spans does not
        # return a 99th percentile — it returns the top populated bucket, i.e. the MAXIMUM. For
        # `openbank-agent-service`, whose slow traffic is a 30-minute LLM oversight sweep
        # (`agent.oversight.cron`), that maximum is the top finite bucket (5s) on EVERY run, so
        # the condition is true by construction for the ~4 minutes the [5m] window still holds
        # the run, and then has no samples left. Measured live over 12h on 2026-08-21
        # (20:32Z-08:32Z): 26 `pending` episodes, lengths [3,4,4,...,4,2] minutes, start-gaps
        # 30m — length capped at the rate window, gap equal to the cron period. `for: 10m` never
        # matured, 0 firing.
        #
        # Widening the window is NOT the fix and was measured, not assumed: at [45m] the same
        # expression is true for 311 consecutive minutes (#6054 replay, and the #6053 table),
        # because the sweep is ALWAYS slower than 2s. So the two available settings are
        # never-firing and never-clearing; there is no third. The histogram's top finite bucket
        # is 5s, so no threshold above 5s is even expressible here — latency of a multi-second
        # LLM batch job is not a question this metric can answer at any window.
        #
        # The guard is derived from the data rather than from a service list, so it needs no
        # maintenance as services come and go. Measured separation over the same 12h, calls per
        # 5m window: the 31 request-driven services have p50 >= 71.6 (lowest min 26.4, and each
        # spends <=1.1% of the window under 30 with a longest run of 4m); the 11 sparse subjects
        # peak at 21.7. Replaying old-vs-new over the window: every one of the 57 condition-true
        # points on request-driven services is preserved with identical run lengths, and 119
        # points on sparse subjects (101 of them agent-service) are dropped. At t=0 on a cold pod
        # `increase(...calls_total[5m])` is 0, the guard is false and the rule is silent, so this
        # adds no boot-time firing — it can only ever make the rule quieter, never louder.
        #
        # What this deliberately does NOT do: it does not give the 11 sparse subjects a latency
        # alert. For `agent-oversight-sweep` the deployed compensating control is
        # `WorkflowLivenessStale` over `openbank_workflow_last_success_age_seconds` (ADR-0237),
        # verified loaded and reporting for that workflow. Per-run DURATION remains uncovered and
        # is tracked separately — it needs a run timer, not a span-percentile rule.
        #
        # The `and`-guard shape is this file's own convention: `HighErrorRate` directly above
        # carries the same absolute-rate floor for the same reason.
        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99, sum by (service, le) (rate(traces_spanmetrics_latency_bucket[5m]))) > 2
            and
            sum by (service) (increase(traces_spanmetrics_calls_total[5m])) >= 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency >2s on {{ $labels.service }}"
            description: >-
              {{ $labels.service }} p99 span latency above 2s for >10m, over a 5m window holding
              at least 30 spans. Subjects below that density are excluded on purpose (#6054):
              a p99 of ~15 samples is the maximum, not a percentile.
        - alert: OutboxBacklogStuck
          expr: openbank_outbox_backlog > 100
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Outbox backlog stuck on {{ $labels.service }}"
            description: "{{ $labels.service }} has >100 unrelayed outbox rows for >15m — money/events may be stuck."
    - name: openbank.tier1.progressive_delivery
      rules:
        # BOTH ALERTS BELOW WERE STRUCTURALLY DEAD UNTIL #4584. They read `rollout_phase`,
        # which the argo-rollouts controller exports on :8090 — and nothing scraped that port,
        # because apps/argo-rollouts.yaml nested the chart's `controller.metrics` block one
        # level too high, so the ServiceMonitor it configures was never created. Prometheus
        # held zero `rollout_*` series, these rules matched nothing, and they reported
        # `health: ok` and `state: inactive` throughout: an expression over an absent metric
        # is an empty result, not an error. All 21 Rollouts — every money-path service —
        # therefore had no progressive-delivery alerting at all.
        #
        # The label note below is a good example of why that went unnoticed for so long: it
        # records a real bug found by READING the exporter's source, which is exactly the kind
        # of care that makes a rule look verified. It was never checked against Prometheus.
        # Before trusting any rule here, run `count(rollout_phase)` and read a non-zero answer.
        # Fires when a Rollout's canary analysis aborts (Prometheus analysis gate
        # failed: error-rate ≥5% or p95 latency ≥1s). Rollout auto-reverts to
        # stable, but operators need to know so they can investigate the root
        # cause before the next deploy attempt (ADR-0098).
        # NOTE: the argo-rollouts controller labels rollout_phase with `namespace` + `name`
        # (controller/metrics/prommetrics.go: namespaceNameLabels), NOT `rollout` — the
        # original `{{ $labels.rollout }}` here rendered EMPTY, so the page never said which
        # rollout aborted. Use $labels.name.
        - alert: RolloutAnalysisAborted
          expr: |
            rollout_phase{phase="Aborted"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Rollout {{ $labels.name }} aborted in {{ $labels.namespace }}"
            description: >-
              Canary analysis failed for {{ $labels.name }} (namespace {{ $labels.namespace }}).
              Traffic has been reverted to stable. Check AnalysisRun for failing metric
              (error-rate or p95-latency). Next deploy will restart the canary cycle.
        # Fires when a Rollout is stuck degraded — pod failed to become healthy
        # within progressDeadlineSeconds (600s) and progressDeadlineAbort rolled
        # it back. Separate from AnalysisAborted (deadline = infra issue, analysis
        # abort = code/regression issue).
        - alert: RolloutProgressDeadlineExceeded
          expr: |
            rollout_phase{phase="Degraded"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Rollout {{ $labels.name }} degraded in {{ $labels.namespace }}"
            description: >-
              Rollout {{ $labels.name }} (namespace {{ $labels.namespace }}) exceeded
              the 10-minute progress deadline — canary pods did not become healthy.
              Likely cause: OOMKilled, CrashLoopBackOff, missing secret/configmap, or
              image pull error. Traffic reverted to stable.
        # The complement the deadline alert cannot see (#3806): all 21 fleet Rollouts
        # are replicas: 1 with default canary maxSurge, so on a FULL cluster the canary
        # pod never schedules and the Rollout sits in Progressing indefinitely — never
        # Degraded (no deadline fires while nothing ever started), never failed, stable
        # pod serving happily. GitOps says Synced, the service says healthy, and the
        # new revision simply never rolls. "gitops pin != running image" is that state,
        # read through the one signal that exposes it.
        - alert: RolloutStuckProgressing
          expr: |
            rollout_phase{phase="Progressing"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Rollout {{ $labels.name }} stuck Progressing for 30m in {{ $labels.namespace }}"
            description: >-
              {{ $labels.name }} (namespace {{ $labels.namespace }}) has been Progressing
              for 30 minutes without completing. On this fleet's one-replica canaries the
              standing cause is capacity: the canary pod cannot schedule on a full
              nodepool, so the new revision never rolls and nothing else reports it
              (#3806). Check KarpenterNodePoolAtLimit and the pending canary pod first;
              the replica-floor decision is ADR material, tracked in #3806.
    - name: openbank.tier1.slo_burn
      rules:
        # Fast burn: budget exhausted in ~2 days → page.
        - alert: PaymentSLOFastBurn
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*",status_code="STATUS_CODE_ERROR"}[1h]))
                / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*"}[1h])), 0.001)
            ) / 0.001 > 14.4
            and
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*",status_code="STATUS_CODE_ERROR"}[5m]))
                / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*"}[5m])), 0.001)
            ) / 0.001 > 14.4
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Fast SLO burn on {{ $labels.service }}"
            description: "{{ $labels.service }} is burning its 99.9% error budget >14.4x (1h & 5m) — budget gone in ~2 days."
        # Slow burn: budget exhausted in ~5 days → ticket.
        - alert: PaymentSLOSlowBurn
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*",status_code="STATUS_CODE_ERROR"}[6h]))
                / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*"}[6h])), 0.001)
            ) / 0.001 > 6
            and
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*",status_code="STATUS_CODE_ERROR"}[30m]))
                / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{service=~"openbank-(sepa-payment|domestic-payment|sepa-instant|fx).*"}[30m])), 0.001)
            ) / 0.001 > 6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Slow SLO burn on {{ $labels.service }}"
            description: "{{ $labels.service }} is burning its 99.9% error budget >6x (6h & 30m)."
