apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openbank-fx
  namespace: observability
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: observability
data:
  openbank-fx.json: |
    {
      "id": null,
      "uid": "openbank-fx",
      "title": "OpenBank — FX Operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "FX Conversion Volume by Currency Pair",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 14,
            "h": 8
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (currency) (rate(openbank_payments_submitted_total{type=\"fx\",job=\"observability/openbank-services\"}[5m]))",
              "legendFormat": "{{currency}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "FX Completion by Outcome",
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 10,
            "h": 8
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (outcome) (rate(openbank_payments_completed_total{type=\"fx\",job=\"observability/openbank-services\"}[5m]))",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "FX Rejection Rate %",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 6,
            "h": 6
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "100 * (sum(rate(openbank_payments_completed_total{type=\"fx\",outcome=\"rejected\",job=\"observability/openbank-services\"}[5m])) or vector(0)) / clamp_min(sum(rate(openbank_payments_submitted_total{type=\"fx\",job=\"observability/openbank-services\"}[5m])), 0.0001)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "FX Sanctions Blocks (24h)",
          "gridPos": {
            "x": 6,
            "y": 8,
            "w": 5,
            "h": 3
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(increase(openbank_sanctions_hits_total{severity=\"block\",role=\"party\",job=\"observability/openbank-services\"}[24h])) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "FX Processing Duration P99",
          "gridPos": {
            "x": 11,
            "y": 8,
            "w": 13,
            "h": 6
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(openbank_payment_processing_duration_seconds_bucket{type=\"fx\",job=\"observability/openbank-services\"}[5m])))",
              "legendFormat": "P99",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Top Currency Pairs Today",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 14,
            "h": 7
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (currency) (increase(openbank_payments_submitted_total{type=\"fx\",job=\"observability/openbank-services\"}[24h]))",
              "legendFormat": "{{currency}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "displayMode": "lcd"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "piechart",
          "title": "Payment Mix by Type",
          "gridPos": {
            "x": 14,
            "y": 14,
            "w": 10,
            "h": 7
          },
          "datasource": "${datasource}",
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (type) (increase(openbank_payments_submitted_total{job=\"observability/openbank-services\"}[24h]))",
              "legendFormat": "{{type}}",
              "refId": "A"
            }
          ],
          "options": {
            "pieType": "pie",
            "displayLabels": [
              "name",
              "percent"
            ],
            "legend": {
              "displayMode": "list",
              "placement": "right"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        }
      ],
      "tags": [
        "openbank"
      ]
    }
