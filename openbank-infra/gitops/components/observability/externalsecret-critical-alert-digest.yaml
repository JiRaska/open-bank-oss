#
# Slack incoming-webhook URL for the in-cluster critical-alert digest (#6432,
# cronjob-critical-alert-digest.yaml). Read from the existing `openbank/alertmanager` KV
# entry under its own property, so the digest can target a different channel than the
# alert stream. The property is seeded by the owner; nothing in this repo holds the value.
#
# Until it is seeded this ExternalSecret reports SecretSyncedError, the Secret does not
# exist, the CronJob's optional secretKeyRef leaves SLACK_WEBHOOK_URL unset, and the
# digest run exits 2 ("--publish-slack needs SLACK_WEBHOOK_URL"). Red, and after 26h
# CronJobSuccessStale says so; never a quiet success.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critical-alert-digest-slack
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: critical-alert-digest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: critical-alert-digest-slack
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: alertmanager
        property: DIGEST_SLACK_WEBHOOK
