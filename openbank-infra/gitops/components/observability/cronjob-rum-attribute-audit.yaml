# RUM attribute content audit job (ADR-0088 O3).
# Runs weekly (Sunday 02:00 UTC) and queries Tempo for unique attribute values seen
# over the last 7 days. The job emits a structured log to stdout so the result is
# captured by Loki and can be reviewed manually (or queried with LogQL).
#
# The audit covers the ADR-0070/0075 allow-listed attributes that the rum-gateway
# redaction processor keeps. Values are queried via the Tempo HTTP API
# (GET /api/v2/search/tag/.<attr>/values); the output is a JSON line per attribute.
#
# This is a READ-ONLY audit — it writes nothing to Tempo and has no side effects.
# The job is NOT a replacement for the cardinality budget alert (O2); it provides
# the human-readable inventory that the on-call engineer uses to diagnose an alert.
#
# Resource limits are intentionally small: the job runs once a week and queries a
# single Tempo instance. If the query times out (large trace volume), increase the
# activeDeadlineSeconds and the --timeout flag below.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rum-attribute-audit
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: rum-audit
spec:
  # Sunday 02:00 UTC — low-traffic window, well before European business hours.
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  # A short controller outage must not silently erase an entire weekly audit, as
  # happened in sandbox on 2026-08-23. Keep the catch-up window bounded: an audit
  # started more than one hour late belongs to the wrong observation window and
  # must remain visibly stale rather than manufacturing fresh-looking evidence.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 4
  # failedJobsHistoryLimit: 1 — keep the LATEST failure for triage, not an archive.
  # kube-prometheus-stack's KubeJobFailed fires per surviving failed Job OBJECT, so a
  # limit of 3 turns one recurring failure into three permanent alerts. Worse, the pods
  # are garbage-collected long before the Job object is, so the extra tombstones carry
  # no diagnostic value at all — only the alert. Measured 2026-08-02: KubeJobFailed was
  # 11 of the 37 firing alerts, 8 of them with pods=0 and the oldest dating to 07-12.
  # One failure per CronJob still alerts (a job that keeps failing should), the
  # duplicates stop.
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # ttlSecondsAfterFinished — a finished Job object self-deletes after 48h.
      # failedJobsHistoryLimit alone does NOT clear a tombstone: it caps how many failed Jobs
      # are kept, so the LAST failure survives forever even after every later run succeeded,
      # and kube-prometheus-stack's KubeJobFailed keeps firing on that dead object. Measured
      # 2026-08-16: 9 of 25 firing alerts were KubeJobFailed and 7 were stale this way — the
      # oldest a rum-attribute-audit failure from 35 days earlier with 4 successes since.
      # 48h keeps a real failure visible for a working day plus slack, then it clears itself.
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: rum-attribute-audit
        spec:
          restartPolicy: OnFailure
          # Least privilege: no service account needed for read-only Tempo HTTP queries.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: docker.io/curlimages/curl:8.7.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # ADR-0088 O3 allow-list — matches the rum-gateway redaction allow-list.
              env:
                - name: TEMPO_URL
                  value: "http://tempo.observability.svc:3200"
                - name: LOOKBACK
                  value: "168h"  # 7 days
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  ATTRS="party_id x-correlation-id service.name app.version os.type os.version device.model http.route screen.name http.response.status_code"
                  # Compute the lookback window with portable POSIX arithmetic — the
                  # curlimages/curl image ships BusyBox `date`, which does NOT support
                  # GNU relative dates (`date -d "-7 days"` fails: "invalid date").
                  END="$(date +%s)"
                  START="$(( END - ${LOOKBACK%h} * 3600 ))"
                  echo "{\"event\":\"rum-attribute-audit-start\",\"lookback\":\"${LOOKBACK}\"}"
                  for attr in $ATTRS; do
                    # Tempo tag-values v2 lives at /api/v2/search/tag/<scope>.<tag>/values —
                    # the previous /api/v2/search/tag-values?tagName= path does not exist and
                    # returned 404, so `curl -sf` fell to the empty fallback for every attr.
                    # The leading "." is the unscoped selector, matching the tag in any scope
                    # (span or resource), which is what we want for a cardinality audit.
                    result=$(curl -sf --max-time 30 \
                      "${TEMPO_URL}/api/v2/search/tag/.${attr}/values?start=${START}&end=${END}" \
                      2>/dev/null || echo '{"tagValues":[]}')
                    # `grep` exits 1 when a tag has zero values; under `set -o pipefail` that
                    # non-zero status would kill the whole job (it did, every run). Swallow it
                    # so a legitimately-empty attribute counts as 0 instead of aborting.
                    count=$(echo "$result" | { grep -o '"value"' || true; } | wc -l | tr -d ' ')
                    echo "{\"event\":\"rum-attribute-audit\",\"attribute\":\"${attr}\",\"unique_value_count\":${count},\"sample\":$(echo "$result" | head -c 512)}"
                  done
                  # RUM-INGEST LIVENESS. The attribute audit above verifies the redaction
                  # allow-list, but app.version, device.model and screen.name are client-version
                  # dependent mobile SDK attributes. Current Android/iOS source sets them, but
                  # their absence in the lookback cannot prove that no trace arrived: deployed,
                  # consented clients may predate that source. service.name is
                  # the canonical OTel resource identity set by the app and retained through
                  # the gateway; query it separately to distinguish no signal from sparse
                  # attribute coverage without widening the collected data.
                  mobile_services=$(curl -sf --max-time 30 \
                    "${TEMPO_URL}/api/v2/search/tag/.service.name/values?start=${START}&end=${END}" \
                    2>/dev/null || echo '{"tagValues":[]}')
                  if ! echo "$mobile_services" | grep -Eq '"value"[[:space:]]*:[[:space:]]*"openbank-app[^" ]*"'; then
                    echo "{\"event\":\"rum-mobile-signal-absent\",\"lookback\":\"${LOOKBACK}\",\"detail\":\"Tempo reported no service.name matching openbank-app in the window. Check the rum-gateway ingress, the app SDK exporter endpoint, and whether any build shipping the SDK is live.\"}"
                    echo "{\"event\":\"rum-attribute-audit-done\",\"result\":\"fail\"}"
                    exit 1
                  fi
                  echo "{\"event\":\"rum-attribute-audit-done\",\"result\":\"ok\"}"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          nodeSelector:
            workload: observability
          tolerations:
            - key: workload
              operator: Equal
              value: observability
              effect: NoSchedule
