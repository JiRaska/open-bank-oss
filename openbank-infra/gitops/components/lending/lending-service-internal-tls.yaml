#
# Private-CA server certificate for lending-service's east-west mTLS listener (8443). The existing HTTP listener remains
# during the east-west TLS migration; new consumers use the parallel 8443 listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lending-service-internal-tls
  namespace: lending
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: lending-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - lending-service.lending.svc
    - lending-service.lending.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
