# SPDX-License-Identifier: Apache-2.0
# CNPG Postgres cluster for openbank-lending-service (money-path, ADR-0030).
# Namespace: lending — isolated from the payments namespace so credit-risk schema
# migrations run independently and cannot be blocked by payment-rail migrations.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lending
  labels:
    app.kubernetes.io/part-of: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lending-db
  namespace: lending
spec:
  # DB-layer observability: CNPG built-in Prometheus exporter on :9187 creates a
  # PodMonitor; kube-prometheus-stack selects PodMonitors cluster-wide, lighting
  # up cnpg_* metrics (connections, replication lag, deadlocks, xid age, WAL archiving).
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  # HA (ADR-0159): primary + hot standby with async streaming replication and
  # CNPG-managed automated failover. `enablePodAntiAffinity` + required
  # `kubernetes.io/hostname` keeps the two pods on DIFFERENT NODES — that is both
  # the HA guarantee and the fix for the single-instance un-drainable-PDB node-roll
  # block (issue #809): with a standby present the PDB permits one disruption, so
  # Karpenter drains/rolls a DB-hosting node without the manual delete-primary dance.
  # The topologySpreadConstraint softly spreads the pair across AZs when capacity
  # allows. Async replication (no minSyncReplicas) keeps the write path independent
  # of standby health; synchronous is deferred to a production decision (ADR-0159).
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: lending-db
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_lending
      owner: openbank
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern).
  # Credentials via EKS Pod Identity on the lending-db ServiceAccount
  # (aws/.../db-backups.tf) — barman reads the SDK chain, no explicit secret.
  # Sandbox S3 lifecycle expires after 35d; prod needs compliance retention (7y
  # for credit records under CRD IV Article 20).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/lending-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lending-db-daily
  namespace: lending
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 17 2 * * *"
  backupOwnerReference: self
  cluster:
    name: lending-db
