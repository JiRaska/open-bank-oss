# SPDX-License-Identifier: Apache-2.0
# OIDC client secret for lending-service, projected from Vault by the External
# Secrets Operator (ClusterSecretStore `vault-kv`) into the in-namespace Secret
# `lending-service-oidc`. All services share the single Keycloak confidential
# client `openbank-services`; reuse the secret value already stored under
# `account-service` in Vault rather than minting a second copy (no new Vault
# write needed). creationPolicy Owner + deletionPolicy Retain mirror the
# account-service ExternalSecret pattern.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lending-service-oidc
  namespace: lending
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: lending-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 1: lending-service's OWN Keycloak client `openbank-lending` (ROLE_API only), used ONLY by
# the money-path rest-clients that select the named oidc-client `m2m`. Deliberately NOT the
# shared `account-service` KV entry: that holds the shared `openbank-services` secret, and a
# per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lending-service-m2m-oidc
  namespace: lending
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: lending-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/lending-service
        property: client_secret
