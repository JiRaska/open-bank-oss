# SPDX-License-Identifier: Apache-2.0
# Per-service PrometheusRule for openbank-lending-service (money-path, ADR-0077/0079).
# Complements the fleet-wide tier-1 rules with lending-specific credit-risk alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-lending-alerts
  namespace: lending
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: lending-service
spec:
  groups:
    - name: openbank.lending.health
      rules:
        - alert: LendingServiceDown
          expr: up{job="observability/openbank-services", namespace="lending"} == 0
          for: 2m
          labels:
            severity: critical
            service: lending
          annotations:
            summary: "lending-service is unreachable"
            description: "lending-service has been unreachable for >2m — credit disbursements and repayment processing are blocked."
        - alert: LendingOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="lending"} > 50
          for: 15m
          labels:
            severity: critical
            service: lending
          annotations:
            summary: "lending outbox backlog stuck"
            description: "lending-service outbox has >50 unrelayed rows for >15m — credit events (disbursement/repayment) may be delayed."
        - alert: LendingHighErrorRate
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR", service="lending"}[5m]))
                / clamp_min(sum by (service) (rate(traces_spanmetrics_calls_total{service="lending"}[5m])), 0.001) > 0.10
            )
            and
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR", service="lending"}[5m])) > 0.5
            )
          for: 5m
          labels:
            severity: critical
            service: lending
          annotations:
            summary: "High error rate on lending-service"
            description: ">10% of spans on lending-service are erroring at >0.5 err/s."
        # LendingRepaymentProcessingStalled was REMOVED in #5733. It watched
        # `openbank_lending_repayments_processed_total`, which nothing emits, and its premise was
        # wrong in two further ways that instrumenting the metric would not have fixed. There are no
        # "repayment events": LendingService.recordRepayment is a REST operation and lending-service
        # has no `@Incoming` consumer at all, so the description's "check Kafka consumer lag" points
        # at a consumer that does not exist. And repayments are due per installment, i.e. monthly —
        # a 30-minute window with none is the overwhelmingly common case, so the rule would have
        # paged constantly rather than detecting anything.
        # The real risk it named — an account wrongly reported overdue to the credit bureau — is a
        # per-loan correctness property. It belongs on loan state (a count of loans past due whose
        # repayment was accepted but not applied), not on a service-wide throughput floor.
