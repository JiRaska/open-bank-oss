# SPDX-License-Identifier: Apache-2.0
# lending-service: credit-risk domain API. Hexagonal Quarkus/Kotlin service
# covering loan origination (four-eyes maker-checker), servicing (installment
# schedule, repayment recording), collateral registration, interest accrual
# (scheduled IAS-1 basis), write-off, and IFRS-9 ECL provisioning.
#
# Ledger posting is synchronous REST to ledger-service (double-entry on every
# cash event); outbox → Kafka carries downstream analytics events.
# Adapter selection (RestLedgerPostingAdapter; AccountServiceClient + BorrowerCreditClient
# for the disbursement's customer-facing leg, #3931) is BUILD-time — the `%prod` defaults in
# the service's application.yaml, not the LENDING_*_BACKEND env vars below. Those env vars
# read as activation switches and are not: until #6057 the image shipped the no-op ledger
# adapter, which returned success, while this Rollout set LENDING_LEDGER_BACKEND=rest.
# OPENBANK_TEMPORAL_ENABLED is the third instance of the same shape (#6085).
# See the per-var comments in the container spec.
#
# Money-path service (ADR-0030): 2 approvals + threat model required on every PR.
# Progressive delivery: Argo Rollout canary (ADR-0098).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: lending-service
  namespace: lending
  labels:
    app.kubernetes.io/name: lending-service
    app.kubernetes.io/part-of: lending
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lending-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lending-service
        app.kubernetes.io/part-of: lending
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-lending-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "a0984ce9fa42b36e"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lending-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-lending-service:sandbox-7659ff7c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8126
            - name: management
              containerPort: 8086
          env:
            # Datasource: JDBC leg (Hibernate ORM + Flyway) + reactive leg onto the
            # same CNPG primary. The lending namespace owns its own DB cluster,
            # isolated from the payments namespace (credit-risk migrations are
            # independent of payment-rail migrations).
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://lending-db-rw.lending.svc:5432/openbank_lending
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://lending-db-rw.lending.svc:5432/openbank_lending
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lending-db-app
                  key: password
            # Kafka outbox sink → Strimzi bootstrap. KAFKA_BOOTSTRAP_SERVERS is the
            # global key SmallRye reactive-messaging picks up for the connector.
            # mTLS listener (ADR-0137): port 9093 with client-cert authentication;
            # 'lending-service' KafkaUser cert projected by ExternalSecret below.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lending-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC resource-server: internal http leg avoids the self-signed edge cert.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lending-service-oidc
                  key: OIDC_CLIENT_SECRET
            # NOT an activation switch. lending.ledger.backend is an @IfBuildProperty gate,
            # resolved at image AUGMENTATION and frozen: this env var cannot bind the real
            # adapter, and until #6057 it did not — the image shipped NoOpLedgerPostingPort,
            # which returned success, and every lending general-ledger posting was discarded.
            # The shipped selection is now the `%prod` default in the service's
            # application.yaml. This var is kept only so it stays consistent with the image;
            # LendingAdapterBindingVerifier refuses to boot if the two ever disagree.
            - name: LENDING_LEDGER_BACKEND
              value: rest
            # Ledger service in-cluster URL (default resolves only localhost).
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # Same build-time caveat as LENDING_LEDGER_BACKEND above (#6057): this never
            # activated AccountServiceClient + BorrowerCreditClient (#3931), because
            # lending.borrower-credit.backend was absent from application.yaml entirely and the
            # gate saw a missing property. The shipped selection is now the `%prod` default.
            - name: LENDING_BORROWER_CREDIT_BACKEND
              value: rest
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            # Redis backing the four-eyes ApprovalStore (ADR-0155). The CDI bean
            # (ApprovalConfig @Produces RedisApprovalStore) resolves regardless, so
            # AuthorizeInterceptor's "no store, log + proceed" branch is never taken for
            # lending — it calls the store for real. Without this override the store points
            # at redis://localhost:6379 in-pod, and flipping AUTHZ_FOUR_EYES_ENFORCE=true
            # would fail every lending.disburse/collateralRegister call on a connection
            # refusal instead of pausing-and-resuming (issue #1354). Enforce stays off until
            # validated against this Redis in a lower env.
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.lending.svc:6379
            # ADR-0211 D2: Temporal durable origination timers (document SLA, offer
            # expiry, reflection wait). The temporal-platform-ingress NetworkPolicy
            # lists the lending namespace, otherwise the worker's onStart gRPC to
            # temporal-frontend:7233 is DROPPED and the service never boots.
            #
            # ⚠ Same build-time caveat as LENDING_LEDGER_BACKEND above (#6085). This var did
            # NOT activate TemporalOriginationWorkflowAdapter: @IfBuildProperty is resolved at
            # augmentation and the class was removed from the image, so the @Default
            # NoOpOriginationWorkflowPort was bound and returned the real adapter's success
            # value. No origination durable timer was ever armed — while the worker half, which
            # is NOT build-time gated, polled the task queue the whole time with nothing ever
            # starting a workflow on it. The shipped selection is now the `%prod` default in
            # the service's application.yaml; this var is kept only so it stays consistent with
            # the image, and LendingAdapterBindingVerifier refuses to boot if the two disagree.
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # ADR-0212 D2/D4: fail-closed origination guard. The runbook's precondition is
            # met — the CZ consumer-credit pack v1 was four-eyes-activated in sandbox on
            # 2026-08-02 (proposed by compliance@openbank.local, decided by
            # compliance2@openbank.local, state EXECUTED) and /compliance-packs/active
            # lists it.
            #
            # What this now refuses: any origination that does not name a (jurisdiction,
            # productType) pair with an active pack. Customer intake is unaffected — it
            # supplies CZ/CONSUMER_CREDIT from configuration rather than from the request,
            # precisely so an applicant cannot pick which pack judges them, and CZ/
            # CONSUMER_CREDIT is the pair that is active. Backoffice callers on
            # POST /applications DO pass their own pair and will be refused for anything
            # else, which is the point of the guard.
            - name: LENDING_ENFORCE_PACK
              value: "true"
            # ADR-0211 customer intake (#3197). The applicant's own channel into
            # origination: customer-edge posts here with the party id it derived from the
            # customer JWT. Three values, each a refusal boundary rather than a preference:
            #
            #   caller-principal  the ONLY identity permitted to submit on a customer's
            #                     behalf. Left blank the service refuses every call, which
            #                     is deliberate — edge's M2M token carries ROLE_OPERATOR and
            #                     nothing else, and AuthorizeInterceptor classifies a
            #                     client_credentials JWT as HUMAN, so neither @RolesAllowed
            #                     nor rego can tell the edge from a person at a desk. The
            #                     name match is the actual control.
            #   nominal-annual-rate  no default in the service: an unpriced product refuses
            #                     rather than guessing. The value below is a PLACEHOLDER for
            #                     the sandbox, in the same spirit as the uncalibrated PD/LGD
            #                     constants — it is not a rate anyone priced.
            #   enabled           the feature switch. Restart-required.
            #
            # This is the MAKER leg only: an application lands in the ordinary origination
            # graph and still needs a human four-eyes decision before any disbursement, so
            # turning it on cannot move money.
            - name: LENDING_INTAKE_ENABLED
              value: "true"
            - name: LENDING_INTAKE_CALLER_PRINCIPAL
              value: service-account-openbank-edge
            - name: LENDING_INTAKE_NOMINAL_ANNUAL_RATE
              value: "0.079"
            # OTel traces → Tempo.
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness on TCP http port (not /q/health/ready) — Kafka producer
          # readiness stays KO until the first event, which with a quiet outbox
          # would never flip. Flyway-at-start guarantees DB connectivity before the
          # socket opens.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in lending-service (lending.*).
        # Bundle mounted from lending-opa-bundle ConfigMap (gen-lending-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/lending_rest_ext.rego
              subPath: lending_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: lending-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: lending-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: lending-service
      canaryService: lending-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: lending-service
  namespace: lending
  labels:
    app.kubernetes.io/name: lending-service
spec:
  selector:
    app.kubernetes.io/name: lending-service
  ports:
    - name: http
      port: 8126
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lending-service-canary
  namespace: lending
  labels:
    app.kubernetes.io/name: lending-service
spec:
  selector:
    app.kubernetes.io/name: lending-service
  ports:
    - name: http
      port: 8126
      targetPort: http
