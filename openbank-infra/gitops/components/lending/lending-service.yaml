# SPDX-License-Identifier: Apache-2.0
# lending-service: credit-risk domain API. Hexagonal Quarkus/Kotlin service
# covering loan origination (four-eyes maker-checker), servicing (installment
# schedule, repayment recording), collateral registration, interest accrual
# (scheduled IAS-1 basis), write-off, and IFRS-9 ECL provisioning.
#
# Ledger posting is synchronous REST to ledger-service (double-entry on every
# cash event); outbox → Kafka carries downstream analytics events.
# LENDING_LEDGER_BACKEND=rest activates RestLedgerPostingAdapter; the default
# `none` keeps the no-op bound for offline builds.
#
# Money-path service (ADR-0030): 2 approvals + threat model required on every PR.
# Progressive delivery: Argo Rollout canary (ADR-0098).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: lending-service
  namespace: lending
  labels:
    app.kubernetes.io/name: lending-service
    app.kubernetes.io/part-of: lending
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lending-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lending-service
        app.kubernetes.io/part-of: lending
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lending-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-lending-service:sandbox-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8126
            - name: management
              containerPort: 8086
          env:
            # Datasource: JDBC leg (Hibernate ORM + Flyway) + reactive leg onto the
            # same CNPG primary. The lending namespace owns its own DB cluster,
            # isolated from the payments namespace (credit-risk migrations are
            # independent of payment-rail migrations).
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://lending-db-rw.lending.svc:5432/openbank_lending
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://lending-db-rw.lending.svc:5432/openbank_lending
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lending-db-app
                  key: password
            # Kafka outbox sink → Strimzi bootstrap. KAFKA_BOOTSTRAP_SERVERS is the
            # global key SmallRye reactive-messaging picks up for the connector.
            # mTLS listener (ADR-0137): port 9093 with client-cert authentication;
            # 'lending-service' KafkaUser cert projected by ExternalSecret below.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lending-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC resource-server: internal http leg avoids the self-signed edge cert.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lending-service-oidc
                  key: OIDC_CLIENT_SECRET
            # Activate the real RestLedgerPostingAdapter. Without this the no-op
            # default stays bound and all ledger posts are silently dropped.
            - name: LENDING_LEDGER_BACKEND
              value: rest
            # Ledger service in-cluster URL (default resolves only localhost).
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # OTel traces → Tempo.
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness on TCP http port (not /q/health/ready) — Kafka producer
          # readiness stays KO until the first event, which with a quiet outbox
          # would never flip. Flyway-at-start guarantees DB connectivity before the
          # socket opens.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: lending-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: lending-service
      canaryService: lending-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: lending-service
  namespace: lending
  labels:
    app.kubernetes.io/name: lending-service
spec:
  selector:
    app.kubernetes.io/name: lending-service
  ports:
    - name: http
      port: 8126
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lending-service-canary
  namespace: lending
  labels:
    app.kubernetes.io/name: lending-service
spec:
  selector:
    app.kubernetes.io/name: lending-service
  ports:
    - name: http
      port: 8126
      targetPort: http
