# Single-owner Postgres for campaign-service, reconciled by the cluster-wide CNPG
# operator. CNPG generates the `campaign-db-app` secret (username/password for the
# `openbank` owner) and a `campaign-db-rw` Service — both consumed by the
# campaign-service Deployment for the reactive datasource and Flyway migrations.
# Two instances even in sandbox: one is not a FinOps saving, it is a drain deadlock
# (see `instances` below, #9691). Prod should raise to 3 for HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: campaign-db
  namespace: campaign
spec:
  # DB-layer observability: CNPG runs its built-in Prometheus exporter on :9187 and
  # creates a PodMonitor the operator owns, lighting up cnpg_* metrics with zero
  # app changes (same as every other single-owner cluster).
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  # Two instances, not one (#9691). CNPG puts a `minAvailable: 1` PDB on the
  # primary; in a single-instance cluster the sole pod IS the primary, so
  # `disruptionsAllowed` is pinned at 0 permanently and no eviction can ever be
  # permitted. That is not a tuning choice, it is arithmetic — and it deadlocked
  # three node drains for 9-15 days while the cluster paid for both those nodes
  # and the idle replacements Karpenter had already provisioned. The replica is
  # also the switchover target a single-instance cluster never had.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_campaigns
      owner: openbank
  # WAL archiving + base backups to S3. The send_log is the ADR-0219 D2 frequency-cap
  # durable source and campaigns/enrolments are the marketing audit record — losing
  # this DB loses both. Credentials from EKS Pod Identity on the campaign-db
  # ServiceAccount (aws/envs/sandbox-platform/db-backups.tf).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/campaign-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
# Daily base backup at 04:20 (outside every sender's quiet-hours window).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: campaign-db-daily
  namespace: campaign
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 20 4 * * *"
  backupOwnerReference: self
  cluster:
    name: campaign-db
