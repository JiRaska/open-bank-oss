# campaign-service OIDC client secret from Vault → campaign-service-oidc Secret
# (key OIDC_CLIENT_SECRET), shared openbank-services realm client. creationPolicy
# Owner: ESO creates/owns and re-creates the Secret (mirrors every other service).
# Reads the SHARED KV entry `account-service`, which already holds the openbank-services client
# secret every other service reads — so there is NO per-service seed step to skip. It used to name
# `campaign-service`, whose prerequisite ("the KV must hold it") is the step that went missing for
# delegation-service (#3471) and is still missing for mcp-service (#3485,
# rules.yaml: oidc_secret_convention).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: campaign-service-oidc
  namespace: campaign
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: campaign-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 6: campaign-service's OWN Keycloak client `openbank-campaign` (ROLE_API only), used ONLY
# by IncentiveServiceClient (named oidc-client `m2m`). KV layout is ADR-0099's `openbank/keycloak/<service>`,
# written once by the owner's provisioning script (runbook 0009); nothing in this repo holds the value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: campaign-service-m2m-oidc
  namespace: campaign
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: campaign-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/campaign-service
        property: client_secret
