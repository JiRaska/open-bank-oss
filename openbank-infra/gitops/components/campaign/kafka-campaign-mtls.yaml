# Kafka mTLS identity + ACLs for openbank-campaign-service (ADR-0137 Tier 2).
#
# campaign-service PRODUCES send requests onto openbank.notification.requests
# (delivery stays with notification-service, ADR-0200 D3) and CONSUMES
# openbank.consent.events (group: openbank-campaign-service) to signal live journeys
# on ConsentRevoked/ConsentExpired (ADR-0200 D2 push mechanism).
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for
# all of this service's Kafka traffic. The Strimzi User Operator mints the per-user
# Secret of the same name in `messaging`; ESO projection into `campaign` is done by
# the platform-level reflector, as for every other service user.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # Certs (KafkaUsers→Strimzi secrets→ESO projection) must land before the
    # campaign-service Deployment rolls pods onto mTLS; lower waves sync first.
    argocd.argoproj.io/sync-wave: "-2"
  name: campaign-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Produce campaign send requests → notification-service consumes (ADR-0200 D3).
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
      - resource:
          type: topic
          name: openbank.campaign.banner.placements
          patternType: literal
        operations: [Write, Describe]
      # Consume consent lifecycle events → journey revocation signals (ADR-0200 D2).
      - resource:
          type: topic
          name: openbank.consent.events
          patternType: literal
        operations: [Read, Describe]
      # Consume delivery outcomes for this service's own sends (ADR-0239 D3, issue #3663).
      - resource:
          type: topic
          name: openbank.notification.outcomes.v1
          patternType: literal
        operations: [Read, Describe]
      # Aggregate-only campaign attention reporting.  The source payload carries an opaque
      # interaction reference and campaign tuple; campaign-service persists neither party id nor
      # contact data in its derived projection (#4480).
      - resource:
          type: topic
          name: openbank.engagement.events
          patternType: literal
        operations: [Read, Describe]
      # Authoritative, no-PII attributed incentive lifecycle outcomes. Campaign only projects
      # these after it validates the opaque interaction ref and immutable campaign offer; it never
      # reserves, commits or issues a reward.
      - resource:
          type: topic
          name: openbank.incentive.events
          patternType: literal
        operations: [Read, Describe]
      # Consume the product events that count as a conversion (ADR-0245 D2). Read-only, and the
      # service only ever appends an outcome row from them — it cannot cause, suppress or alter a
      # send, so the blast radius of this grant is a reporting number.
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: topic
          name: openbank.cards.events
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: group
          name: openbank-campaign-service
          patternType: literal
        operations: [Read, Describe]
      # One group per conversion topic, for the reason stated below: a shared group would make one
      # member set out of two disjoint subscriptions.
      - resource:
          type: group
          name: openbank-campaign-service-account-conversions
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: group
          name: openbank-campaign-service-card-conversions
          patternType: literal
        operations: [Read, Describe]
      # Event-trigger enrolment consumes the same product topics independently from conversion
      # attribution. Keep exact per-channel groups: they must match application.yaml and must not
      # share offsets with the conversion consumers (issue #4569).
      - resource:
          type: group
          name: openbank-campaign-service-account-triggers
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: group
          name: openbank-campaign-service-card-triggers
          patternType: literal
        operations: [Read, Describe]
      # A separate group from the one above on purpose: two channels sharing a group makes
      # one member set out of two disjoint subscriptions, so a rebalance on either topic
      # churns the other and the offsets can never be reset independently.
      - resource:
          type: group
          name: openbank-campaign-service-notification-outcomes
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: group
          name: openbank-campaign-service-engagement-events
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: group
          name: openbank-campaign-service-incentive-events
          patternType: literal
        operations: [Read, Describe]
      # #5745: SmallRye dead-letter topic for the `account-conversions-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.account-conversions-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `account-triggers-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.account-triggers-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `card-conversions-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.card-conversions-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `card-triggers-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.card-triggers-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `consent-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.consent-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `engagement-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.engagement-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # Dead-letter sink for malformed or persistently unprojectable Incentive events. It must be
      # writable independently of the source-topic read grant, otherwise the configured parking
      # strategy becomes a consumer retry loop.
      - resource:
          type: topic
          name: openbank.dlq.campaign.incentive-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `notification-outcomes-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.campaign.notification-outcomes-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
