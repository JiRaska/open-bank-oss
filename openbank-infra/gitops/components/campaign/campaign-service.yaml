# campaign-service: campaign definitions + per-enrolment Temporal journeys (ADR-0200,
# first slice ADR-0209 D3). Reactive Postgres datasource + Flyway JDBC migrations
# against the single-owner CNPG cluster. Produces send requests onto
# openbank.notification.requests (delivery stays with notification-service, D3) and
# consumes openbank.consent.events to signal journeys on revocation (D2). Live per-send
# consent check against consent-service (ADR-0198, fail-closed); segments evaluated
# read-only against the analytics ClickHouse silver layer (ADR-0210). Journeys run on
# the shared Temporal cluster. OIDC bearer validation points at Keycloak.
# Reachable only in-cluster via ClusterIP, no ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-service
  namespace: campaign
  labels:
    app.kubernetes.io/name: campaign-service
    app.kubernetes.io/part-of: campaign
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: campaign-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-campaign-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "3f42ce8642830152"
      labels:
        app.kubernetes.io/name: campaign-service
        app.kubernetes.io/part-of: campaign
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: campaign-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-campaign-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8128
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8085
          env:
            # Keep the existing HTTP port for the admin BFF. The interaction validator gets a
            # parallel TLS port, so customer-edge does not introduce another plaintext edge.
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/campaign-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/campaign-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary; username is
            # the `openbank` owner, password from the CNPG-generated app secret.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://campaign-db-rw.campaign.svc:5432/openbank_campaigns
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://campaign-db-rw.campaign.svc:5432/openbank_campaigns
            # V15 (Stories) was deployed before the additive graph migrations V13/V14.  Flyway
            # otherwise refuses to start rather than backfilling those safe, additive columns.
            # Keep this explicit until all environments have recorded V13/V14; then remove it in
            # a separately reviewed cleanup rather than making out-of-order migrations implicit.
            - name: QUARKUS_FLYWAY_OUT_OF_ORDER
              value: "true"
            - name: DB_USER
              value: openbank
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campaign-db-app
                  key: password
            # Kafka: send requests out (notification.requests) + consent events in →
            # Strimzi bootstrap over mTLS (ADR-0137). The connector reads only
            # KAFKA_BOOTSTRAP_SERVERS, never a quarkus.* key.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campaign-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # Temporal (ADR-0200 D1 per-enrolment journeys; shared cluster).
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # Fleet convention is openbank-<domain>; the application default is the bare
            # `openbank`, which is not a registered namespace. Leaving it unset does not
            # fail the boot — readiness is an HTTP probe, not a Temporal one — the worker
            # just spins on `NOT_FOUND: Namespace openbank is not found` while the pod
            # reports Healthy. Registered by the temporal-namespace-registration Job.
            - name: OPENBANK_TEMPORAL_NAMESPACE
              value: openbank-campaign
            - name: OPENBANK_TEMPORAL_TASK_QUEUE
              value: openbank-campaign
            # Graph runs are isolated from the replay-compatible legacy workflow queue. A rollback
            # cannot hand their new command sequence to a legacy worker; it only pauses the graph
            # queue until the compatible image is restored.
            - name: OPENBANK_CAMPAIGN_DECISION_TASK_QUEUE
              value: openbank-campaign-decision
            # The isolated graph worker is live and healthy. This separately reviewed step admits
            # graph-campaign activation without changing the replay-compatible legacy queue.
            - name: OPENBANK_CAMPAIGN_EXPLICIT_GRAPH_ACTIVATION_ENABLED
              value: "true"
            - name: CAMPAIGN_WORKER_ENABLED
              value: "true"
            # ADR-0198: live per-send consent check (fail-closed). Declared as an
            # explicit svc URL so gen-network-policies.py sees the edge.
            - name: CONSENT_SERVICE_URL
              value: http://consent-service.consent.svc:8106
            # ADR-0210: read-only segment evaluation against the silver layer.
            # ClickHouse requires auth: the `analytics` user, password from the
            # Vault-backed clickhouse-auth Secret projected into this namespace
            # (clickhouse-auth-externalsecret.yaml) — same pattern as admin-ui and
            # analytics-sink. Both vars are REQUIRED at boot: SilverSegmentEvaluator
            # declares them as non-Optional String with `defaultValue = ""`, and
            # SmallRye treats an empty default as no value, so the pod CrashLoops on
            # `Failed to load config value of type class java.lang.String` when they
            # are unset — as it did on the first sandbox rollout (#2749).
            - name: CLICKHOUSE_URL
              value: http://clickhouse.analytics.svc:8123
            - name: CLICKHOUSE_USER
              value: analytics
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
            # Keycloak runs in `iam`, not `platform` — the fleet's other 55 references all
            # say keycloak.iam.svc. The wrong host does not fail the boot (OIDC defers the
            # discovery to the first request), it just makes every authenticated call fail
            # later with `Name does not resolve`.
            - name: KEYCLOAK_URL
              value: http://keycloak.iam.svc:8080
            # Four-eyes approval store (campaign.activate) is Redis-backed via
            # libs' RedisApprovalStore. Without this the ReactiveRedisDataSource bean is
            # inactive and the app dies at boot with InactiveBeanException.
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.campaign.svc:6379
            # ADR-0200 D6 suppression defaults; override per environment here, not in code.
            - name: CAMPAIGN_MAX_SENDS_PER_WEEK
              value: "2"
            - name: CAMPAIGN_QUIET_HOURS_START
              value: "21"
            - name: CAMPAIGN_QUIET_HOURS_END
              value: "8"
            # Kept ADVISORY (false) for the first rollout: the interceptor evaluates +
            # records every decision but does NOT block while false, so the "would DENY"
            # population can be confirmed empty in the live decision log before the
            # enforce flip (a separate, deliberate follow-up per the rules.yaml guardrail).
            - name: AUTHZ_ENFORCE
              value: "false"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campaign-service-oidc
                  key: OIDC_CLIENT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: campaign-tls
              mountPath: /mnt/campaign-tls
              readOnly: true
        # OPA policy decision point (ADR-0034). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default). Bundle mounted read-only from
        # the campaign-opa-bundle ConfigMap generated by gen-campaign-opa-bundle.sh.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            # `--bundle` is REQUIRED, not decorative: without it OPA loads /bundle as a
            # plain data directory and merges every YAML into the root data document, so
            # rules-data.yaml and agents-data.yaml collide and the sidecar dies with
            # `/bundle/rules-data.yaml: merge error`. In bundle mode the roots declared in
            # .manifest keep them apart. Mount paths below must match those roots.
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/campaign_rest_ext.rego
              subPath: campaign_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Data files land under the bundle roots declared in .manifest
            # (`agents`, `rules`) — NOT flat in /bundle, which is what produced the
            # merge error above.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: campaign-service-kafka-keystore
            optional: false
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            optional: false
        - name: campaign-tls
          secret:
            secretName: campaign-service-internal-tls
            optional: false
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: campaign-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: campaign-service
  namespace: campaign
  labels:
    app.kubernetes.io/name: campaign-service
    app.kubernetes.io/part-of: campaign
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: campaign-service
  ports:
    - name: http
      port: 8128
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 8085
      targetPort: management
