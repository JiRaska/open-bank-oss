#
# NetworkPolicy baseline for the envoy-gateway-system namespace (ADR-0081, ADR-0324).
#
# NOT generated by gen-network-policies.py — that script targets SERVICE namespaces; this
# is platform plumbing, hand-authored with openbank.io/derived: gitops-manual like
# components/argo-rollouts/network-policies.yaml. Ingress only: egress is unrestricted,
# because the proxy must reach whichever backend namespace a future HTTPRoute names.
#
# Phase 0 leaves the backend side alone: generated allow-lists admit `ingress-nginx`,
# and a backend is added for this namespace in the same change that routes a host to it.
---
# Controller: xDS (18000), rate-limit (18001) and wasm (18002) are served only to the
# proxies in this namespace; metrics (19001) to Prometheus. With the topology-injector
# webhook disabled (apps/envoy-gateway.yaml), nothing outside the namespace needs it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway-controller-ingress-allow-list
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: envoy-gateway
    openbank.io/derived: gitops-manual
spec:
  podSelector:
    matchLabels:
      control-plane: envoy-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 19001
---
# Proxy: the listener ports are the internet edge. externalTrafficPolicy: Cluster means
# the NLB's traffic arrives SNATed from arbitrary nodes, so the source cannot be narrowed
# here; the allow-list is the Service's loadBalancerSourceRanges (Kyverno policy
# edge-nlb-source-ranges), enforced on the node security group. Envoy Gateway shifts privileged
# listener ports by +10000 (80 -> 10080, 443 -> 10443). Metrics to Prometheus only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway-proxy-ingress-allow-list
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: envoy-gateway
    openbank.io/derived: gitops-manual
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10080
        - protocol: TCP
          port: 10443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 19001
