# SPDX-License-Identifier: Apache-2.0
# Projects the OIDC client secret for sdd-service from OpenBao (Vault KV) into the
# sdd namespace so the Deployment can reference it via secretKeyRef.
#
# The KV entry is `account-service` — the shared one, not sdd's own. sdd-service authenticates as
# `openbank-services`, the realm's single confidential M2M client, so a per-service entry would be
# a hand-seeded copy of that one credential (#3485, rules.yaml: oidc_secret_convention).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sdd-service-oidc
  namespace: sdd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: sdd-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 1: sdd-service's OWN Keycloak client `openbank-sdd` (ROLE_API only), used ONLY by
# the money-path rest-clients that select the named oidc-client `m2m`. Deliberately NOT the
# shared `account-service` KV entry: that holds the shared `openbank-services` secret, and a
# per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sdd-service-m2m-oidc
  namespace: sdd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: sdd-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/sdd-service
        property: client_secret
