# SPDX-License-Identifier: Apache-2.0
# Strimzi mTLS identity + ACLs for sdd-service (ADR-0137 Tier 2c).
#
# sdd-service publishes openbank.sdd.event (outbox egress, ADR-0050).
# No incoming channels — no consumer-group ACL needed.
#
# Identity model (ADR-0137): one KafkaUser = one client cert = one mTLS principal
# for ALL Kafka traffic from this service. allow.everyone.if.no.acl.found=true
# (kafka.yaml) keeps all other topics open; ACLs here only lock down what
# sdd-service needs Write access on.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: KafkaUser (wave -2) must land before ExternalSecrets (wave -1)
    # so the source secret exists when ESO tries to extract it.
    argocd.argoproj.io/sync-wave: "-2"
  name: sdd-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # It CONSUMES this topic too and had no Read grant (#2598 → #3271). The effective consumer
      # group is `openbank-sdd-service`: application.yaml deliberately omits `group.id` as a YAML key
      # (SmallRye's dotted-key footgun, #686/#703), so the fallback — quarkus.application.name —
      # is what Kafka sees. Granting any other name here would deny just as silently.
      - resource:
          type: topic
          name: openbank.sdd.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-sdd-service
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: topic
          name: openbank.sdd.event
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `sdd-collection-authorised-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.sdd.sdd-collection-authorised-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ExternalSecret: sdd-service keystore projected from messaging → sdd.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: sdd-service-kafka-keystore
  namespace: sdd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: sdd-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: sdd-service
---
# ExternalSecret: shared cluster-CA truststore projected from messaging → sdd.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: sdd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
