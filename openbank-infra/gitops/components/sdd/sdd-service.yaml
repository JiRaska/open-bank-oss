# sdd-service: SEPA Direct Debit mandate lifecycle + Kafka outbox (openbank.sdd.event).
# Reactive Postgres + Flyway. mTLS to Strimzi (ADR-0137). Management port 8086.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdd-service
  namespace: sdd
  labels:
    app.kubernetes.io/name: sdd-service
    app.kubernetes.io/part-of: sdd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdd-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdd-service
        app.kubernetes.io/part-of: sdd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sdd-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-sdd-service:sandbox-55dfdb9e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8129
            - name: management
              containerPort: 8086
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://sdd-db-rw.sdd.svc:5432/openbank_sdd
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://sdd-db-rw.sdd.svc:5432/openbank_sdd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdd-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as KafkaUser 'sdd-service';
            # keystore/truststore PKCS#12 are projected from messaging by External Secrets
            # (kafka-sdd-mtls.yaml) and mounted below.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdd-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8129"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sdd-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            # #1000: book the debtor-side debit for an authorised collection.
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA advisory mode (ADR-0034): sdd-service has no OPA policy-decision sidecar
            # (unlike money-path services such as lending/payments/accounts), so @Authorize
            # would otherwise fail closed ("OPA call failed") on every endpoint. Same posture
            # as interest-service / anacredit — non-money-path services run authz advisory.
            # Access stays enforced by JAX-RS @RolesAllowed (operator/viewer roles) and, for
            # customer traffic, by the customer-edge ownership (IDOR) check before it ever
            # reaches this service. Refs #1730.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: sdd-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: sdd-service
  namespace: sdd
  labels:
    app.kubernetes.io/name: sdd-service
    app.kubernetes.io/part-of: sdd
spec:
  selector:
    app.kubernetes.io/name: sdd-service
  ports:
    - name: http
      port: 8129
      targetPort: http
    - name: management
      port: 8086
      targetPort: management
