# SPDX-License-Identifier: Apache-2.0
# sdd-service: SEPA Direct Debit mandate lifecycle + Kafka outbox (openbank.sdd.event).
# Reactive Postgres + Flyway. mTLS to Strimzi (ADR-0137). Management port 8086.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdd-service
  namespace: sdd
  labels:
    app.kubernetes.io/name: sdd-service
    app.kubernetes.io/part-of: sdd
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdd-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdd-service
        app.kubernetes.io/part-of: sdd
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-sdd-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "0d6ffeead298ace7"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sdd-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-sdd-service:sandbox-2f2eb227
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8129
            - name: management
              containerPort: 8086
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://sdd-db-rw.sdd.svc:5432/openbank_sdd
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://sdd-db-rw.sdd.svc:5432/openbank_sdd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdd-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as KafkaUser 'sdd-service';
            # keystore/truststore PKCS#12 are projected from messaging by External Secrets
            # (kafka-sdd-mtls.yaml) and mounted below.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdd-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8129"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sdd-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            # #1000: book the debtor-side debit for an authorised collection.
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA advisory mode (ADR-0034 Phase 5). STILL false — deliberately, and this is the
            # one remaining step of #3679, not an oversight.
            #
            # The comment that stood here was wrong on its own terms: it justified advisory mode
            # with "non-money-path services run authz advisory", and sdd-service IS in
            # rules.yaml: money_path_services — it posts a real debtor debit through
            # TransactionServiceClient for every authorised collection (#1478). It also asserted
            # that no sidecar existed, which was true and is what this change fixes: the `opa`
            # container below now serves data.openbank.rest.allow, so every @Authorize decision is
            # EVALUATED and LOGGED ("advisory: would DENY") instead of failing at the PDP call with
            # nothing to record.
            #
            # Flipping this to "true" is a separate, deliberate change and must not ride along with
            # the bootstrap: enforcement is only safe once the live decision log confirms the
            # would-DENY population is empty for real callers. Two callers exist today — admin-ui
            # operators (their own session token) and customer-edge (service-account-openbank-edge)
            # — and sdd_rest_ext.rego grants both; the log is what proves there is no third.
            # Access meanwhile stays enforced by JAX-RS @RolesAllowed and, for customer traffic, by
            # the customer-edge ownership (IDOR) check before it ever reaches this service.
            # Refs #1730, #3679.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy-decision sidecar (ADR-0034 Phase 5 bootstrap, issue #3679). Serves
        # data.openbank.rest.allow for all @Authorize-annotated endpoints in sdd-service (sdd.*).
        # Bundle mounted from the sdd-opa-bundle ConfigMap (gen-sdd-opa-bundle.sh).
        # Reached over loopback only (OpaSidecarPolicyDecisionPoint defaults to
        # http://localhost:8181) — 8181 needs no cross-namespace ingress.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet: {path: "/health?bundles=true", port: 8181}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/sdd_rest_ext.rego
              subPath: sdd_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: sdd-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: sdd-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: sdd-service
  namespace: sdd
  labels:
    app.kubernetes.io/name: sdd-service
    app.kubernetes.io/part-of: sdd
spec:
  selector:
    app.kubernetes.io/name: sdd-service
  ports:
    - name: http
      port: 8129
      targetPort: http
    - name: management
      port: 8086
      targetPort: management
