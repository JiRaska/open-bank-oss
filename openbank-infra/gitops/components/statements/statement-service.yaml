# statement-service: monthly per-pocket period-close record (ADR-0035). Reactive
# Postgres datasource + Flyway JDBC migrations against the single-owner CNPG cluster.
# Consumes the account-service `openbank.accounts.account.created` stream into a local
# account_registry (enumeration source for the scheduled close) and publishes
# `openbank.statement.event` via its outbox dispatcher to the Strimzi Kafka bus. Reads
# transaction-service (booked entries), balance-service (closing balance, fail-closed
# reconciliation) and account-service (pocket metadata) over their in-cluster http legs.
# OIDC bearer-token validation points at Keycloak; shares the openbank-services client.
# Reachable only in-cluster via ClusterIP, no ingress. The scheduled monthly close stays
# disabled (openbank.statement.scheduled-close.enabled=false) until the registry back-fills.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statement-service
  namespace: statements
  labels:
    app.kubernetes.io/name: statement-service
    app.kubernetes.io/part-of: statements
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statement-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-statement-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "b6377e06583b3e1c"
      labels:
        app.kubernetes.io/name: statement-service
        app.kubernetes.io/part-of: statements
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: statement-service
          # Re-pinned to an SBOM-attested image (open-bank-oss#759). The previous tag
          # sandbox-40e0c9d1c (a non-main build) had no valid SBOM attestation, so
          # Kyverno's verify-openbank-image-sbom-attestation policy blocked every pod
          # (Deployment stuck at 0/1) → the EoM close / Closings screen read "not
          # responding". sandbox-a407c3ae is the #706 main build with a valid attestation.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-statement-service:sandbox-f328ebdf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8136
            - name: management
              containerPort: 8085
          env:
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary; username is
            # the `openbank` owner, password from the CNPG-generated app secret.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://statements-db-rw.statements.svc:5432/openbank_statement
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://statements-db-rw.statements.svc:5432/openbank_statement
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: statements-db-app
                  key: password
            # Kafka in (account stream → registry) + out (statement outbox) → Strimzi
            # bootstrap. Must be env KAFKA_BOOTSTRAP_SERVERS: the SmallRye connector
            # ignores the quarkus.* key, so any other key leaves it on its localhost default.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: statement-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC resource-server: validate bearer tokens over the internal http leg;
            # shares the openbank-services client with the other services.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: statement-service-oidc
                  key: OIDC_CLIENT_SECRET
            # Cross-service reads over in-cluster http legs (ClusterIP DNS).
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            - name: BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: PARTY_SERVICE_URL
              value: http://party-service.party.svc:8111
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # ADR-0034 Phase 5 / issue #1797: the OPA sidecar (below) is now wired, so @Authorize
            # actually reaches a PDP. Before this, statement-service ran with the app default
            # AUTHZ_ENFORCE=true and NO sidecar — so every @Authorize endpoint's PDP call failed
            # and the interceptor failed closed (HTTP 422). Kept ADVISORY (false) for this rollout:
            # the interceptor evaluates + records every decision but does NOT block while false, so
            # the "would DENY" population can be confirmed empty in the live decision log before the
            # enforce flip (a separate, deliberate follow-up per the rules.yaml four_eyes /
            # AUTHZ_ENFORCE guardrail). The app default is `true`, so this explicit `false` is
            # load-bearing.
            - name: AUTHZ_ENFORCE
              value: "false"
            # #686 / #2945: load the account-events-in group.id override
            # (statement-service-msg-override ConfigMap, mounted below) as an external Quarkus
            # config source, so the dotted YAML key's declared value actually reaches the Kafka
            # connector instead of silently falling back to quarkus.application.name.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is TCP on http, not /q/health/ready: the Kafka producer's
          # readiness sits KO until the first event is sent (lazy connect), which with
          # an idle outbox would never flip. Flyway-at-start guarantees DB connectivity
          # before the port opens. Liveness uses http health.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy decision point (ADR-0034 Phase 5 / issue #1797). Co-located sidecar the app
        # reaches on localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed). Bundle
        # mounted read-only from the statement-opa-bundle ConfigMap generated by
        # gen-statement-opa-bundle.sh. Mirrors party-service's OPA sidecar (same image, probes,
        # security context, subPath mounts).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/statement_rest_ext.rego
              subPath: statement_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: statement-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: statement-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: statement-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: statement-service
  namespace: statements
  labels:
    app.kubernetes.io/name: statement-service
spec:
  selector:
    app.kubernetes.io/name: statement-service
  ports:
    - name: http
      port: 8136
      targetPort: http
    # Quarkus management interface (health + Prometheus /q/metrics). Exposed so the
    # ServiceMonitor (below) can scrape the close-cadence counters (ADR-0069 D3 / #470).
    - name: management
      port: 8085
      targetPort: management
---
# ADR-0069 D3 / issue #470 — scrape the close-cadence metrics. kube-prometheus-stack runs with
# serviceMonitorSelectorNilUsesHelmValues=false, so this ServiceMonitor is discovered regardless
# of labels. (This is the first ServiceMonitor in the fleet; others can follow the same shape.)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: statement-service
  namespace: statements
  labels:
    app.kubernetes.io/name: statement-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: statement-service
  endpoints:
    - port: management
      path: /q/metrics
      interval: 60s
---
# Close-cadence alerts (ADR-0069 D3 / issue #470). Loaded by Prometheus
# (ruleSelectorNilUsesHelmValues=false). NOTE: end-to-end NOTIFICATION is gated on sandbox
# Alertmanager routing being enabled; until then these evaluate and surface in the Prometheus/
# Alertmanager UI but do not page.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: statement-close
  namespace: statements
  labels:
    app.kubernetes.io/name: statement-service
spec:
  groups:
    - name: statement-close
      rules:
        - alert: StatementCloseFailures
          expr: increase(openbank_statement_close_failures_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
            service: statement-service
          annotations:
            summary: "Statement period-close failures in the last hour"
            description: "{{ $value }} pocket-month close(s) failed (reason label on the metric). Inspect /api/v1/statements/close-runs."
        - alert: StatementCloseCadenceStalled
          # The monthly cron should produce at least one run per ~31 days; no run in 35 days =
          # cadence stalled (cron disabled, scheduler crashed, or registry empty).
          #
          # Reads the GAUGE openbank_statement_close_last_run_timestamp_seconds (epoch s of the last
          # finished close), NOT a counter over a [35d] window. A counter window can only see as far
          # back as Prometheus retention (12h declared / ~15d live in the sandbox — both far under the
          # 35d window), so once a legitimate monthly run ages past retention the [35d] query reads 0
          # → permanent false positive. A gauge's current value is always scrapeable regardless of
          # retention; the service derives it from the persisted statement_close_run log
          # (CloseLastRunGauge re-reads the latest finished run each tick) so it is restart-safe.
          #
          # Fires when: the gauge is absent (service down / never scraped), has never been stamped
          # (== 0, cadence never ran), or its last run is older than 35d. max() collapses the brief
          # two-pod overlap during a rollout (a freshly started pod reads 0 until its first scheduled
          # refresh reads the DB; `for: 1h` absorbs that race).
          expr: |
            absent(openbank_statement_close_last_run_timestamp_seconds)
            or (max(openbank_statement_close_last_run_timestamp_seconds) == 0)
            or (time() - max(openbank_statement_close_last_run_timestamp_seconds) > 35 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
            service: statement-service
          annotations:
            summary: "Statement close cadence has not run in 35 days"
            description: "No statement close run completed in 35 days — the monthly cron may be disabled or failing."
