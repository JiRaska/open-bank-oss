# Kafka mTLS identity + ACLs for openbank-statement-service (ADR-0137 #2665 Tier 2c).
#
# statement-service consumes openbank.accounts.account.created (group:
# openbank-statement-service) to build a local account_registry used as the
# enumeration source for the scheduled monthly period-close (ADR-0035). It also
# publishes statement lifecycle events to openbank.statement.event via its
# outbox dispatcher.
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one
# principal for all of this service's Kafka traffic. ACLs are only needed for
# topics under locked-down ACL control; own domain-event topics need none.
#
# These resources live in `messaging` (where the Strimzi User Operator watches);
# the Strimzi User Operator mints a per-user Secret of the same name there
# (user.crt/key/p12 + user.password + ca.crt). Those secrets are projected into
# the `statements` namespace by External Secrets below.
---
# ── KafkaUser: statement-service ────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the statements Deployment rolls pods onto mTLS; lower waves sync
    # first and ArgoCD blocks on ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: statement-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.statement.event
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-statement-service
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `account-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.statement.account-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── ExternalSecret: statement-service keystore ──────────────────────────────
# Projects the Strimzi-minted statement-service Secret from `messaging` into
# `statements`. `dataFrom.extract` copies every key verbatim, preserving the
# binary PKCS#12 payload byte-for-byte. deletionPolicy: Retain so a transient
# store/RBAC blip never deletes a live keystore out from under a running pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: statement-service-kafka-keystore
  namespace: statements
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: statement-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: statement-service
---
# ── ExternalSecret: cluster CA truststore ───────────────────────────────────
# Shared cluster-CA truststore projected into `statements` — identical pattern
# to every other namespace (payments, kyc, etc.).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: statements
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
