# statement-service OIDC client secret from Vault → statement-service-oidc Secret
# (key OIDC_CLIENT_SECRET), shared openbank-services realm client. creationPolicy
# Owner: ESO creates/owns and re-creates the Secret (mirrors es-balance-service-oidc).
# Reads the SHARED KV entry `account-service`, so there is no per-service seed step. It used to
# name `statement-service` and its own comment gave the game away — "the same value the other
# services pull from their key". One realm client, one entry (#3485,
# rules.yaml: oidc_secret_convention).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: statement-service-oidc
  namespace: statements
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: statement-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 7: statement-service's OWN Keycloak client `openbank-statement` (ROLE_API only), used ONLY
# by TransactionRestClient (named oidc-client `m2m`). KV layout is ADR-0099's `openbank/keycloak/<service>`,
# written once by the owner's provisioning script (runbook 0009); nothing in this repo holds the value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: statement-service-m2m-oidc
  namespace: statements
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: statement-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/statement-service
        property: client_secret
