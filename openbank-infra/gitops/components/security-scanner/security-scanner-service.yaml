# security-scanner-service: periodic fleet health + CVE probe service.
# Scans all deployed banking services every 30 minutes via their /q/health
# endpoints and serves the latest report from GET /api/v1/security/report.
# ICT incidents (DORA-grade critical findings) go to openbank.security.ict.incident.
# Backed by a single-owner CNPG Postgres holding Flyway history only — scan results and
# incidents are in-memory. The outbox and openbank.security.scan.event went in #4709: both
# had existed since the service was written with nothing ever writing to them.
# OIDC is disabled — the scanner probes internal ClusterIPs only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-scanner-service
  namespace: security-scanner
  labels:
    app.kubernetes.io/name: security-scanner-service
    app.kubernetes.io/part-of: security-scanner
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-scanner-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-scanner-service
        app.kubernetes.io/part-of: security-scanner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-scanner-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-security-scanner:sandbox-c9a2f80b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8120
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://security-scanner-db-rw.security-scanner.svc:5432/openbank_security
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://security-scanner-db-rw.security-scanner.svc:5432/openbank_security
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: security-scanner-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: security-scanner-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-scanner-db-app
                  key: password
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-scanner-db-app
                  key: password
            # ADR-0137 / issue #3393: the mTLS listener :9093, NOT the anonymous
            # plaintext :9092 this used to name. On :9092 the producers authenticated as
            # `User:ANONYMOUS`, and the cluster runs allow.everyone.if.no.acl.found=false,
            # so every publish would be denied on every topic. Nothing ever surfaced it
            # because nothing has ever published: both topic log segments were 0 bytes on
            # 2026-08-03, nothing writes to `security_outbox`, and the one live produce
            # path (IctIncidentService, POST /api/v1/ict-incidents) is human-triggered.
            # Identity + ACLs: kafka-security-scanner-mtls.yaml (KafkaUser `security-scanner`).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-scanner-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # `QUARKUS_OIDC_ENABLED=false` used to sit here and did NOTHING: quarkus.oidc.enabled
            # is a BUILD-TIME property, so setting it through the environment cannot switch OIDC
            # off in an already-built image. It read as "auth is off for this service" while the
            # pod validated every bearer it was given — against the application.yaml default
            # `http://localhost:8080/realms/openbank`, i.e. inside its own pod, where nothing
            # listens. Result: anonymous requests answered 200/401 normally and every request
            # WITH a token answered 500 (`OIDCException: OIDC Server is not available`), which is
            # what the admin-ui Security screen was hitting. Point it at the real issuer instead,
            # exactly as fraud/sanctions/campaign do.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Scan target URLs — consumed by gen-network-policies.py (ADR-0081) to derive
            # cross-namespace ingress allow-lists on each callee. Values must match the
            # openbank.security-scanner.services[*].url entries in application.yaml exactly
            # so the generator sees every caller edge.  Not consumed by Quarkus config
            # (SmallRye list overrides require indexed names; these are marker-only).
            - name: OPENBANK_SECURITY_SCANNER_TARGET_ACCOUNT_SERVICE
              value: http://account-service.accounts.svc:8100
            - name: OPENBANK_SECURITY_SCANNER_TARGET_LEDGER_SERVICE
              value: http://ledger-service.ledger.svc:8101
            - name: OPENBANK_SECURITY_SCANNER_TARGET_TRANSACTION_SERVICE
              value: http://transaction-service.payments.svc:8102
            - name: OPENBANK_SECURITY_SCANNER_TARGET_BALANCE_SERVICE
              value: http://balance-service.balances.svc:8103
            - name: OPENBANK_SECURITY_SCANNER_TARGET_PRODUCT_CATALOG
              value: http://product-catalog.accounts.svc:8104
            - name: OPENBANK_SECURITY_SCANNER_TARGET_PID_SERVICE
              value: http://pid-service.pid.svc:8105
            - name: OPENBANK_SECURITY_SCANNER_TARGET_CONSENT_SERVICE
              value: http://consent-service.consent.svc:8106
            - name: OPENBANK_SECURITY_SCANNER_TARGET_PSD2_SERVICE
              value: http://psd2-service.psd2.svc:8107
            - name: OPENBANK_SECURITY_SCANNER_TARGET_TPP_REGISTRY_SERVICE
              value: http://tpp-registry-service.tpp-registry.svc:8108
            - name: OPENBANK_SECURITY_SCANNER_TARGET_AGENT_SERVICE
              value: http://agent-service.platform.svc:8109
            - name: OPENBANK_SECURITY_SCANNER_TARGET_SCA_SERVICE
              value: http://sca-service.sca.svc:8110
            - name: OPENBANK_SECURITY_SCANNER_TARGET_PARTY_SERVICE
              value: http://party-service.party.svc:8111
            - name: OPENBANK_SECURITY_SCANNER_TARGET_NOTIFICATION_SERVICE
              value: http://notification-service.notifications.svc:8112
            - name: OPENBANK_SECURITY_SCANNER_TARGET_AUDIT_SERVICE
              value: http://audit-service.audit.svc:8113
            - name: OPENBANK_SECURITY_SCANNER_TARGET_KYC_SERVICE
              value: http://kyc-service.kyc.svc:8114
            - name: OPENBANK_SECURITY_SCANNER_TARGET_SEPA_PAYMENT
              value: http://sepa-payment.payments.svc:8115
            - name: OPENBANK_SECURITY_SCANNER_TARGET_DOMESTIC_PAYMENT
              value: http://domestic-payment.payments.svc:8116
            - name: OPENBANK_SECURITY_SCANNER_TARGET_AML_SERVICE
              value: http://aml-service.aml.svc:8117
            - name: OPENBANK_SECURITY_SCANNER_TARGET_CARD_ISSUANCE_SERVICE
              value: http://card-issuance-service.payments.svc:8118
            - name: OPENBANK_SECURITY_SCANNER_TARGET_FX_SERVICE
              value: http://fx-service.fx.svc:8119
            - name: OPENBANK_SECURITY_SCANNER_TARGET_STANDING_ORDER_SERVICE
              value: http://standing-order-service.payments.svc:8121
            - name: OPENBANK_SECURITY_SCANNER_TARGET_SWIFT_SERVICE
              value: http://swift-service.payments.svc:8122
            - name: OPENBANK_SECURITY_SCANNER_TARGET_SANCTIONS_SERVICE
              value: http://sanctions-service.sanctions.svc:8123
            - name: OPENBANK_SECURITY_SCANNER_TARGET_CLEARING_SERVICE
              value: http://clearing-service.payments.svc:8124
            - name: OPENBANK_SECURITY_SCANNER_TARGET_INTEREST_SERVICE
              value: http://interest-service.interest.svc:8125
            - name: OPENBANK_SECURITY_SCANNER_TARGET_DISPUTE_SERVICE
              value: http://dispute-service.dispute.svc:8135
            - name: OPENBANK_SECURITY_SCANNER_TARGET_SEPA_INSTANT
              value: http://sepa-instant.payments.svc:8127
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Deliberately NOT `optional: true`: if the ESO projection has not landed, the
            # pod must stay at ContainerCreating rather than boot and fall back to a
            # plaintext-shaped client that silently publishes nothing (openbank-infra
            # CLAUDE.md, the #1284 trade). A stalled pod is the loud failure we want here.
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: security-scanner-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: security-scanner-service
  namespace: security-scanner
  labels:
    app.kubernetes.io/name: security-scanner-service
spec:
  selector:
    app.kubernetes.io/name: security-scanner-service
  ports:
    - name: http
      port: 8120
      targetPort: http
