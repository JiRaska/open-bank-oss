# Outbound Kafka topics for security-scanner. Declared explicitly (the broker
# does not auto-create topics) so the Strimzi topic operator manages them.
# Lives in the `messaging` namespace next to the Kafka cluster.
#
# security.ict.incident — DORA ICT incident events (critical findings only)
#
# openbank.security.scan.event was removed in #4709: it was provisioned here, ACL'd on both
# the producer and the audit side, and had no writer for the whole life of the service —
# end offset 0 on the broker and 0 rows in the service's outbox table. Deleting a topic that
# nothing produces to is safe; there are no records and no consumer group offsets to strand.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.security.ict.incident
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
