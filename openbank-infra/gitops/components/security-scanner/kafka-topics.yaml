# Outbound Kafka topics for security-scanner. Declared explicitly (the broker
# does not auto-create topics) so the Strimzi topic operator manages them.
# Lives in the `messaging` namespace next to the Kafka cluster.
#
# security.scan.event  — periodic scan result per service (SAST/health/CVE verdict)
# security.ict.incident — DORA ICT incident events (critical findings only)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.security.scan.event
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.security.ict.incident
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
