apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kyb-service-internal-tls
  namespace: kyb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: kyb-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - kyb-service.kyb.svc
    - kyb-service.kyb.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
