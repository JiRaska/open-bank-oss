# Business onboarding lifecycle events — published by kyb-service through its transactional
# outbox (ADR-0284): started / registry verified / review required / signer invited & identified /
# agreement signed / completed / rejected / abandoned. Consumers: onboarding-service (business
# funnel, follow-up) and audit-service.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.kyb.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Dead-letter topic for kyb-service's party-events consumer (failure-strategy: dead-letter-queue).
# Topics are not auto-created; without this the rethrow wedges on the DLQ send instead (#5745).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.dlq.kyb.party-events-in
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 1209600000
    cleanup.policy: delete
---
# Dead-letter topic for kyb-service's ongoing-monitoring findings consumer (channel
# `sanctions-monitoring-in`, failure-strategy: dead-letter-queue). A finding that cannot be applied
# after its retries lands here instead of halting the channel; without the topic the rethrow
# wedges on the DLQ send (#5745). 14 days, as for the party-events one: a dead-lettered finding is
# a sanctions or PEP match nobody has reviewed, and it has to outlive a long weekend.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.dlq.kyb.sanctions-monitoring-in
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 1209600000
    cleanup.policy: delete
