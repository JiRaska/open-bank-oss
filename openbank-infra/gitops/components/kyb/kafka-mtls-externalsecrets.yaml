# Kafka mTLS keystore/truststore projected from `messaging` into `kyb`
# (ADR-0137). Source secrets are minted by the Strimzi User Operator
# (the kyb-service KafkaUser keystore) and the Strimzi Cluster Operator
# (cluster-CA cert), read via the kafka-messaging-certs ClusterSecretStore
# (kubernetes provider).
#
# `dataFrom.extract` copies every key of the source secret verbatim, which
# preserves the BINARY PKCS#12 (`user.p12` / `ca.p12`) byte-for-byte — a
# per-key `data` mapping risks mangling binary values. The kyb-service
# Deployment mounts `user.p12` as the SSL keystore and `ca.p12` as the
# truststore, and reads `user.password` / `ca.password` as env.
#
# deletionPolicy: Retain so a transient store/RBAC blip never deletes a live
# keystore out from under a running pod.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: Strimzi-issued client keystore. The User Operator renews the cert; this is the date by which
    # the projection must be re-checked if it has not.
    openbank.io/rotation-deadline: "2027-09-05"
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the kyb-service Deployment rolls pods onto mTLS; lower waves
    # sync first and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-1"
  name: kyb-service-kafka-keystore
  namespace: kyb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kyb-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: kyb-service
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: Cluster CA truststore projection, same renewal path as the keystore above.
    openbank.io/rotation-deadline: "2027-09-05"
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: kyb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
