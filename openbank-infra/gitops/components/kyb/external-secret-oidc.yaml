# kyb-service OIDC client secret from Vault -> kyb-service-oidc Secret (key OIDC_CLIENT_SECRET),
# shared openbank-services realm client. The remoteRef key is the shared `account-service`
# entry, as for every service (rules.yaml: oidc_secret_convention).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: Shared openbank-services client secret. Rotated with the realm client; the date is the outer
    # bound, not a promise it lives that long.
    openbank.io/rotation-deadline: "2027-09-05"
  name: kyb-service-oidc
  namespace: kyb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: kyb-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 3: kyb-service's OWN Keycloak client `openbank-kyb` (ROLE_API only), used ONLY by
# the rest-client that selects the named oidc-client `m2m` (the entity-party create + mandate grant (party.create, party.mandate.grant)). Deliberately NOT the
# shared `account-service` KV entry: that holds the shared `openbank-services` secret, and a
# per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kyb-service-m2m-oidc
  namespace: kyb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: kyb-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/kyb-service
        property: client_secret
