#
# ADR-0234 — identity-aware edge gate for internal tool UIs.
#
# Internal tool UIs are served as SUB-PATHS of admin.open-bank.tech, behind an
# nginx `auth_request` that validates the admin-UI session before nginx proxies
# anything. An unauthenticated request is rejected at the edge, so the tool's
# pre-auth surface stays as unreachable as it was when the tool had no Ingress
# at all (ADR-0056) — this adds a routed path, not an unauthenticated one.
#
# WHY A SEPARATE INGRESS OBJECT and not a path on the `admin-ui` Ingress:
# ingress-nginx applies an object's annotations to EVERY location that object
# declares. Putting auth-url on the admin-ui Ingress would gate /auth/login
# against itself — the login page would require a session to render.
#
# WHY A SUB-PATH and not grafana.open-bank.tech: the session cookie
# (`__Secure-authjs.session-token`) is host-only, so the browser would not send
# it to another hostname and the gate would deny every request. Widening the
# cookie to `.open-bank.tech` would hand the operator session to every
# subdomain, including public ones — a worse trade than the problem. See the ADR.
#
# WHY AN ExternalName SERVICE: an Ingress can only name Services in its own
# namespace, and Grafana's Service lives in `observability`. Routing through an
# ExternalName keeps the whole edge definition — host, TLS secret, gate — in one
# object in one namespace, instead of relying on ingress-nginx merging two
# Ingress objects for the same host across namespaces.
apiVersion: v1
kind: Service
metadata:
  name: grafana-tools
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/component: tools-gate
spec:
  type: ExternalName
  externalName: kube-prometheus-stack-grafana.observability.svc.cluster.local
  ports:
    - name: http
      port: 80
      protocol: TCP
---
# Edge response headers for this host, served by ingress-nginx's `custom-headers` annotation
# (ADR-0324 interim hardening) instead of a Critical-risk `configuration-snippet`. Keys must be
# in the controller's `global-allowed-response-headers` (apps/ingress-nginx.yaml) or the
# controller denies the location (503). HSTS and X-Content-Type-Options are NOT listed here:
# the controller sets both on every response (hsts-*, add-headers).
# IMMUTABLE, VERSIONED BY NAME, SYNC-WAVE -1 — all three are load-bearing. The controller
# re-reads this ConfigMap only when the Ingress that names it changes (custom-headers is not
# in its configmap-watch set and it runs with no resync period), so an in-place edit would
# never reach nginx. Change a header by adding `-v2` and pointing the annotation at it. The
# wave makes ArgoCD create the ConfigMap before the Ingress that references it.
# Shared by the three tool Ingresses below (one ConfigMap, same namespace). No
# X-Frame-Options, as before: the tools set their own framing policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-ui-tools-edge-headers-v1
  namespace: admin-ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
immutable: true
data:
  Referrer-Policy: "strict-origin-when-cross-origin"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ui-tools
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/component: tools-gate
  annotations:
    # DNS moved to the Envoy Gateway routes (httproute.yaml + observability/httproute-tools-gate.yaml).
    # This makes external-dns ignore the Ingress; it stays as the rollback until a later change deletes it.
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
    # No cert-manager annotation: this host's certificate is issued by the
    # `admin-ui` Ingress. Referencing the same secret reuses that leaf rather
    # than asking for a second certificate for a host that already has one.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # THE GATE. nginx issues a sub-request here (forwarding the browser's
    # cookies) before proxy_pass. 204 → proxy; 401 → auth-signin redirect;
    # 403 → authenticated but not entitled. `auth_request` fails CLOSED: if the
    # admin-UI pod is unreachable nginx answers 500, it does not pass traffic
    # through. That is the correct direction, and it is why grafana-local.sh is
    # kept as break-glass.
    #
    # The `?tool=` is hard-coded here, never taken from the request — the gate's
    # allow-list is keyed by it, so a caller cannot select its own tool.
    nginx.ingress.kubernetes.io/auth-url: "http://admin-ui.admin-ui.svc.cluster.local:3000/api/gate?tool=grafana"
    nginx.ingress.kubernetes.io/auth-signin: "https://admin.open-bank.tech/auth/login?callbackUrl=$escaped_request_uri"
    # No auth-method / auth-response-headers annotations on purpose: the default
    # is a GET sub-request with `proxy_pass_request_body off`, and the gate
    # returns no headers to propagate. Adding auth-response-headers here would
    # start forwarding gate output into the upstream request — the identity-header
    # trust model this ADR explicitly rejects.
    #
    # Edge security headers. `custom-headers` is location-scoped, so it does NOT
    # inherit from the admin-ui Ingress for this host — each tool Ingress names the
    # ConfigMap itself. HSTS and nosniff come from the controller on every response.
    nginx.ingress.kubernetes.io/custom-headers: admin-ui/admin-ui-tools-edge-headers-v1
    # ExternalName upstreams are resolved by nginx, and Grafana renders absolute
    # URLs from its root_url — keep the browser's Host so those URLs stay on
    # admin.open-bank.tech rather than the .svc name.
    nginx.ingress.kubernetes.io/upstream-vhost: "admin.open-bank.tech"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.open-bank.tech
      secretName: admin-ui-tls
  rules:
    - host: admin.open-bank.tech
      http:
        paths:
          # NOT rewritten. Grafana is configured with
          # root_url=https://admin.open-bank.tech/tools/grafana and
          # serve_from_sub_path=true, so it expects to receive the prefix and
          # builds its own asset/API URLs from it. Stripping the prefix here
          # would break every asset on the page.
          - path: /tools/grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-tools
                port:
                  number: 80
---
# Alertmanager (ADR-0234). Silencing an alert is an operator action that needed a
# port-forward, so in practice it never happened. Alertmanager serves its whole
# HTTP surface under `routePrefix: /tools/alertmanager` (set in
# apps/kube-prometheus-stack.yaml), so the edge passes the prefix through
# unrewritten — and note that same prefix also moves /api/v2/alerts, which is why
# prometheusSpec.alertingEndpoints.pathPrefix had to move with it.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-tools
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/component: tools-gate
spec:
  type: ExternalName
  externalName: kube-prometheus-stack-alertmanager.observability.svc.cluster.local
  ports:
    - name: http
      port: 9093
      protocol: TCP
---
# Pyrra SLO console (ADR-0234). Read-only, and the natural companion to the SLO
# dashboard — served under `--route-prefix=/tools/pyrra`.
apiVersion: v1
kind: Service
metadata:
  name: pyrra-tools
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/component: tools-gate
spec:
  type: ExternalName
  externalName: pyrra-api.observability.svc.cluster.local
  ports:
    - name: http
      port: 9099
      protocol: TCP
---
# ONE INGRESS OBJECT PER TOOL, and that is not accidental: ingress-nginx applies
# an object's annotations to every location it declares, and the auth-url hard-codes
# the `?tool=` the gate's allow-list is keyed by. Two tools on one object would
# both be checked against whichever tool the annotation named — the narrower one
# would silently gain the wider one's audience. The cost of a tool is therefore
# one Ingress + one Service + one allow-list entry + one NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ui-tools-alertmanager
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/component: tools-gate
  annotations:
    # DNS moved to the Envoy Gateway routes (httproute.yaml + observability/httproute-tools-gate.yaml).
    # This makes external-dns ignore the Ingress; it stays as the rollback until a later change deletes it.
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: "http://admin-ui.admin-ui.svc.cluster.local:3000/api/gate?tool=alertmanager"
    nginx.ingress.kubernetes.io/auth-signin: "https://admin.open-bank.tech/auth/login?callbackUrl=$escaped_request_uri"
    nginx.ingress.kubernetes.io/custom-headers: admin-ui/admin-ui-tools-edge-headers-v1
    nginx.ingress.kubernetes.io/upstream-vhost: "admin.open-bank.tech"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.open-bank.tech
      secretName: admin-ui-tls
  rules:
    - host: admin.open-bank.tech
      http:
        paths:
          - path: /tools/alertmanager
            pathType: Prefix
            backend:
              service:
                name: alertmanager-tools
                port:
                  number: 9093
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ui-tools-pyrra
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/component: tools-gate
  annotations:
    # DNS moved to the Envoy Gateway routes (httproute.yaml + observability/httproute-tools-gate.yaml).
    # This makes external-dns ignore the Ingress; it stays as the rollback until a later change deletes it.
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: "http://admin-ui.admin-ui.svc.cluster.local:3000/api/gate?tool=pyrra"
    nginx.ingress.kubernetes.io/auth-signin: "https://admin.open-bank.tech/auth/login?callbackUrl=$escaped_request_uri"
    nginx.ingress.kubernetes.io/custom-headers: admin-ui/admin-ui-tools-edge-headers-v1
    nginx.ingress.kubernetes.io/upstream-vhost: "admin.open-bank.tech"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.open-bank.tech
      secretName: admin-ui-tls
  rules:
    - host: admin.open-bank.tech
      http:
        paths:
          - path: /tools/pyrra
            pathType: Prefix
            backend:
              service:
                name: pyrra-tools
                port:
                  number: 9099
