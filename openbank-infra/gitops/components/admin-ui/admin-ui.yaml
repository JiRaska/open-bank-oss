subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
spec:
  selector:
    app.kubernetes.io/name: admin-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ui
  namespace: admin-ui
  annotations:
    # Browser-trusted Let's Encrypt via DNS-01; external-dns publishes this
    # host's A/ALIAS record. On letsencrypt-prod: open-bank.tech resolves and the
    # staging cert proved the DNS-01 flow, so this serves a browser-trusted leaf.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Security headers applied at the nginx edge (belt-and-suspenders on top of
    # Next.js headers()). HSTS with preload readies the domain for the preload list.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.open-bank.tech
      secretName: admin-ui-tls
  rules:
    - host: admin.open-bank.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: 3000
---
# campaign (ADR-0200/#2749). Without BOTH this binding and the OPENBANK_NAMESPACES
# entry above, discovery cannot see campaign-service and the console renders
# "Campaign-service is not responding" against a healthy 2/2 pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-discovery
  namespace: campaign
  labels:
    app.kubernetes.io/name: admin-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-discovery
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
# engagement (ADR-0220). The service landed in #4025 and grew in #4054 without a
# governance.yaml, so it was invisible to the manifest and to this guard. Adding the
# manifest makes it a discovered module, which is what surfaced the missing pair here:
# without BOTH this binding and the OPENBANK_NAMESPACES entry above, the console renders
# "not responding" for a healthy engagement pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-discovery
  namespace: engagement
  labels:
    app.kubernetes.io/name: admin-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-discovery
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
