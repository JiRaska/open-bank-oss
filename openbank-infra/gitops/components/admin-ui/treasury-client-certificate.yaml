# SPDX-License-Identifier: Apache-2.0
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-ui-treasury-client
  namespace: admin-ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: admin-ui-treasury-client
  commonName: admin-ui-treasury-client
  duration: 2160h
  renewBefore: 360h
  usages:
    - client auth
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
