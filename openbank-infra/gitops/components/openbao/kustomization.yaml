#
# OpenBao post-install configuration (ADR-0099):
#   - Tier 1: database secrets engine setup + weekly DB rotation CronJob
#   - Tier 2: weekly OIDC client secret + JWT signing key rotation CronJob
#
# Deployed via openbao-config ArgoCD Application (apps/openbao-config.yaml).
# The openbao Helm release (apps/openbao.yaml) must be synced first so the
# `vault` namespace exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dynamic-db-credentials.yaml
  - db-rotation-job.yaml
  - secret-rotator-cronjob.yaml
  # ADR-0031 D3b: short-TTL agent-identity PKI issuer (inert until PR5b grants a consumer)
  - openbao-agent-identity.yaml
  # ADR-0162 D4 (continued): short-TTL document-signing PKI issuer for one-time client signatures
  - openbao-document-signing-pki.yaml
