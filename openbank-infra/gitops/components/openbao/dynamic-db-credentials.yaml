# ADR-0099 Tier 1 — OpenBao database secrets engine configuration
#
# This ConfigMap carries the idempotent setup script for the OpenBao database
# engine. It is executed by the db-rotation-sync CronJob (db-rotation-job.yaml)
# which runs weekly to keep the engine config aligned with the live fleet.
#
# OpenBao runs in the `vault` namespace; the CronJob runs there too so it can
# reach the in-cluster service directly (http://openbao.vault.svc:8200).
#
# Role name convention: <service>-db-vault-role (ADR-0099 §Phase 1 ¶2).
# TTL:  24h default / 72h max  (ADR-0099 §Tier 1).
# Auth: Kubernetes auth method, role `db-admin` — must be configured out-of-band
#       by runbook 0006 (mirrors how the ESO `eso` role is set up in runbook 0005).
#
# Dynamic credential path consumed by ESO:
#   database/creds/<service>-db-vault-role
# ESO ExternalSecrets that reference these paths live per-service under
# openbank-infra/gitops/components/<service>/ and should use:
#   refreshInterval: 1h   (ADR-0099 §Phase 1 ¶3)
#
# CNPG PasswordEnforcement reconciles the new password to the Postgres user
# without a cluster restart — no application downtime expected.
#
# Services covered (Phase 1 scope — lowest-risk-first ordering, ADR-0099 §Phase 1 ¶4):
#   notifications, push-notifications, audit, balance, fx, account, transaction, ledger
# Pilot service (validate first): notifications
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-db-rotation-config
  namespace: vault
  labels:
    app.kubernetes.io/part-of: openbao
    openbank.io/plane: platform
    openbank.io/adr: "0099"
data:
  configure.sh: |
    #!/bin/sh
    set -eu

    # ---------------------------------------------------------------------------
    # OpenBao database secrets engine — idempotent fleet-wide setup
    # ADR-0099 Tier 1 / Phase 1
    # ---------------------------------------------------------------------------

    BAO_ADDR="${BAO_ADDR:-http://openbao.vault.svc:8200}"
    export BAO_ADDR

    # Authenticate via Kubernetes auth method (role db-admin, runbook 0006).
    # If BAO_TOKEN is already injected by the CronJob secret ref, skip the login.
    if [ -z "${BAO_TOKEN:-}" ]; then
      SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      BAO_TOKEN="$(bao write -field=token auth/kubernetes/login \
        role=db-admin \
        jwt="${SA_TOKEN}")"
      export BAO_TOKEN
    fi

    # Enable database secrets engine once; `|| true` keeps the script idempotent.
    bao secrets enable -path=database database 2>/dev/null || true

    # ---------------------------------------------------------------------------
    # Per-service configuration.
    # CONNECTION URL uses the CNPG primary Service naming convention:
    #   <service>-service-rw.<namespace>.svc:5432/<dbname>
    # The vault_admin role is created with CREATEROLE only (no data access) as
    # required by ADR-0099 §Phase 1 ¶1. Creation SQL is maintained in
    # docs/runbooks/0006-openbao-dynamic-db.md.
    #
    # IMPORTANT: dynamic credentials generate a new username on every lease. Any
    # Flyway baseline user references or CNPG connection-pooler allow-lists that
    # hard-code the DB username MUST be updated before enabling a service here
    # (ADR-0099 Consequences §Negative ¶1). The pilot service (notifications) was
    # audited first; all others follow the same pre-flight checklist.
    # ---------------------------------------------------------------------------

    configure_service() {
      SERVICE="$1"
      NAMESPACE="${2:-${SERVICE}}"
      DBNAME="${3:-${SERVICE}db}"

      echo "[openbao-db] configuring ${SERVICE} ..."

      bao write "database/config/${SERVICE}-db" \
        plugin_name="postgresql-database-plugin" \
        allowed_roles="${SERVICE}-db-vault-role" \
        connection_url="postgresql://{{username}}:{{password}}@${SERVICE}-service-rw.${NAMESPACE}.svc:5432/${DBNAME}?sslmode=disable" \
        username="vault_admin" \
        password_authentication="scram-sha-256"

      bao write "database/roles/${SERVICE}-db-vault-role" \
        db_name="${SERVICE}-db" \
        creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
        revocation_statements="DROP ROLE IF EXISTS \"{{name}}\";" \
        default_ttl="24h" \
        max_ttl="72h"

      echo "[openbao-db] ${SERVICE} done."
    }

    # Phase 1 rollout order: lowest-risk first (ADR-0099 §Phase 1 ¶4).
    # Pilot first — validate manually before enabling the rest of the fleet.
    configure_service notifications   notifications   notificationsdb
    configure_service push-notifications push-notifications pushnotificationsdb
    configure_service audit           audit           auditdb
    configure_service balance         balances        balancedb
    configure_service fx              fx-service      fxdb
    configure_service account         accounts        accountdb
    configure_service transaction     transaction     transactiondb
    configure_service ledger          ledger          ledgerdb

    echo "[openbao-db] all services configured."
