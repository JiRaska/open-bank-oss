# ADR-0099 Tier 2 — weekly CronJob to rotate OIDC client secrets and JWT signing keys
#
# Runs every Sunday at 02:30 UTC — 30 minutes after Tier 1 DB rotation (02:00 UTC),
# outside banking hours, well within the 90-day PCI DSS Req. 8.2.4 window.
#
# The Job:
#   1. Authenticates to OpenBao via the Kubernetes auth method (role `db-admin`,
#      reusing the SA already created for Tier 1 — no new standing token).
#   2. Calls the Keycloak Admin API to regenerate each service's OIDC client secret.
#   3. Writes the new secret to the corresponding OpenBao KV path.
#   4. ESO's `refreshInterval` picks up the updated KV value automatically —
#      no explicit force-sync annotation required.
#   5. Rotates JWT signing keys in OpenBao KV with a 7-day overlap window so
#      in-flight tokens issued under the old key can expire naturally (ADR-0099 §Tier 2).
#
# RBAC: reuses ServiceAccount `openbao-db-admin` (created in db-rotation-job.yaml).
#       That SA is bound to an OpenBao policy that includes KV read/write — confirmed
#       as part of Tier 1 runbook 0006. No data-plane access, KV scope only.
#
# PSS restricted: non-root, no capabilities, seccompProfile RuntimeDefault.
# Image: same quay.io/openbao/openbao tag as the server (pinned, ADR-0027).
#
# Keycloak admin credentials are stored at (KV v2 mount openbank/):
#   openbank/keycloak/admin  →  keys: username, password
# OIDC client IDs (not secrets) are stored at:
#   openbank/keycloak/<service>  →  key: client_id  (UUID registered in KC realm)
# OIDC secrets are written back to:
#   openbank/keycloak/<service>  →  key: client_secret
# JWT signing keys are stored at:
#   openbank/jwt-signing/<service>  →  keys: current_key, previous_key, rotated_at
# All paths use the `openbank/` KV v2 mount (not `secret/`) — verified 2026-06-30
# against the ClusterSecretStore and runbook 0005.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-secret-rotator-config
  namespace: vault
  labels:
    app.kubernetes.io/part-of: openbao
    openbank.io/plane: platform
    openbank.io/adr: "0099"
data:
  rotate.sh: |
    #!/bin/sh
    set -eu

    # ---------------------------------------------------------------------------
    # OpenBao Tier 2 — OIDC client secret + JWT signing key rotation
    # ADR-0099 §Tier 2
    # ---------------------------------------------------------------------------

    BAO_ADDR="${BAO_ADDR:-http://openbao.vault.svc:8200}"
    KC_URL="${KC_URL:-http://keycloak.iam.svc:8080}"
    KC_REALM="${KC_REALM:-openbank}"
    export BAO_ADDR

    # ---------------------------------------------------------------------------
    # 1. Authenticate to OpenBao via Kubernetes auth (no standing token).
    # ---------------------------------------------------------------------------
    if [ -z "${BAO_TOKEN:-}" ]; then
      SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      BAO_TOKEN="$(bao write -field=token auth/kubernetes/login \
        role=db-admin \
        jwt="${SA_TOKEN}")"
      export BAO_TOKEN
    fi

    # ---------------------------------------------------------------------------
    # 2. Fetch Keycloak admin credentials from OpenBao KV.
    # KV v2 mount is `openbank/` — use `bao kv get openbank/<path>`.
    # ---------------------------------------------------------------------------
    KC_ADMIN_USER="$(bao kv get -field=username openbank/keycloak/admin)"
    KC_ADMIN_PASS="$(bao kv get -field=password openbank/keycloak/admin)"

    # Obtain a Keycloak admin access token.
    KC_TOKEN="$(wget -qO- \
      --post-data="client_id=admin-cli&username=${KC_ADMIN_USER}&password=${KC_ADMIN_PASS}&grant_type=password" \
      "${KC_URL}/realms/master/protocol/openid-connect/token" \
      | sed 's/.*"access_token":"\([^"]*\)".*/\1/')"

    if [ -z "${KC_TOKEN}" ]; then
      echo "[rotator] ERROR: failed to obtain Keycloak admin token" >&2
      exit 1
    fi

    # ---------------------------------------------------------------------------
    # 3. Rotate OIDC client secrets.
    #    Each service has its KC client UUID in OpenBao at openbank/keycloak/<svc>.
    #    We call KC Admin API POST /clients/<id>/client-secret, then write the
    #    new value back to OpenBao KV (KV v2 mount `openbank/`).
    # ---------------------------------------------------------------------------
    rotate_oidc_secret() {
      SERVICE="$1"
      echo "[rotator] rotating OIDC client secret for ${SERVICE} ..."

      CLIENT_UUID="$(bao kv get -field=client_id "openbank/keycloak/${SERVICE}" 2>/dev/null || true)"
      if [ -z "${CLIENT_UUID}" ]; then
        echo "[rotator] WARN: no client_id in openbank/keycloak/${SERVICE} — skipping" >&2
        return 0
      fi

      # POST to KC Admin API — regenerates the secret server-side.
      NEW_SECRET="$(wget -qO- \
        --method=POST \
        --header="Authorization: Bearer ${KC_TOKEN}" \
        --header="Content-Type: application/json" \
        "${KC_URL}/admin/realms/${KC_REALM}/clients/${CLIENT_UUID}/client-secret" \
        | sed 's/.*"value":"\([^"]*\)".*/\1/')"

      if [ -z "${NEW_SECRET}" ]; then
        echo "[rotator] ERROR: KC did not return a new secret for ${SERVICE}" >&2
        exit 1
      fi

      # Write the new secret back to OpenBao KV (preserves other fields via patch).
      bao kv patch "openbank/keycloak/${SERVICE}" client_secret="${NEW_SECRET}"
      echo "[rotator] OIDC secret rotated for ${SERVICE}"
    }

    for SVC in account-service transaction-service ledger-service fx-service \
               balance-service party-service notification-service audit-service \
               push-notifications-service payments-service sepa-payment-service \
               consent-service kyc-service; do
      rotate_oidc_secret "${SVC}"
    done

    # ---------------------------------------------------------------------------
    # 4. Rotate JWT signing keys with 7-day overlap window (ADR-0099 §Tier 2).
    #    Layout in OpenBao KV (v2 mount `openbank/`) at openbank/jwt-signing/<service>:
    #      current_key   — active signing key (PEM or base64 HMAC)
    #      previous_key  — still-valid key for in-flight tokens
    #      rotated_at    — ISO-8601 timestamp of last rotation
    #
    #    Algorithm:
    #      a) Read current_key → move it to previous_key.
    #      b) Generate a new 256-bit random key → write as current_key.
    #      c) Update rotated_at.
    #
    #    The 7-day overlap is enforced operationally: ESO syncs both keys into
    #    the service Secret; the service runtime accepts tokens signed by either
    #    key.  This CronJob only rotates; old previous_key expiry enforcement
    #    is handled by the verifying service (ADR-0099 §Tier 2 ¶JWT overlap).
    # ---------------------------------------------------------------------------
    rotate_jwt_key() {
      SERVICE="$1"
      echo "[rotator] rotating JWT signing key for ${SERVICE} ..."

      KV_PATH="openbank/jwt-signing/${SERVICE}"

      # Read existing current key; skip if path doesn't exist yet.
      CURRENT_KEY="$(bao kv get -field=current_key "${KV_PATH}" 2>/dev/null || true)"
      if [ -z "${CURRENT_KEY}" ]; then
        echo "[rotator] WARN: no current_key at ${KV_PATH} — skipping (bootstrap via runbook 0006)" >&2
        return 0
      fi

      # Generate a new 256-bit key (32 random bytes → hex).
      NEW_KEY="$(bao write -field=random_bytes sys/tools/random/32 format=hex)"

      NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      bao kv put "${KV_PATH}" \
        current_key="${NEW_KEY}" \
        previous_key="${CURRENT_KEY}" \
        rotated_at="${NOW}"

      echo "[rotator] JWT key rotated for ${SERVICE} (previous preserved for 7-day overlap)"
    }

    for SVC in account-service transaction-service ledger-service fx-service \
               balance-service payments-service sepa-payment-service; do
      rotate_jwt_key "${SVC}"
    done

    echo "[rotator] Tier 2 rotation complete — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotator
  namespace: vault
  labels:
    app.kubernetes.io/part-of: openbao
    openbank.io/plane: platform
    openbank.io/adr: "0099"
  annotations:
    openbank.io/description: "ADR-0099 Tier 2: weekly OIDC client secret + JWT key rotation"
    openbank.io/runbook: "docs/runbooks/0006-openbao-dynamic-db.md"
spec:
  # Sunday 02:30 UTC — 30 minutes after Tier 1 DB rotation (02:00 UTC).
  # Tier 2 rotates gracefully when the openbank/keycloak/* and openbank/jwt-signing/*
  # KV trees don't exist yet — rotate_oidc_secret and rotate_jwt_key both WARN+skip
  # on missing paths (no hard failure). Provision the KV tree per runbook 0006 §4
  # to activate full OIDC/JWT rotation.
  schedule: "30 2 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # Forbid concurrent runs — KC admin API calls are not idempotent mid-flight.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hard deadline: 15 minutes covers full fleet rotation with KC API latency.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: openbao
            openbank.io/plane: platform
        spec:
          # Reuse the SA created by Tier 1 (db-rotation-job.yaml).
          serviceAccountName: openbao-db-admin
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotator
              # Pin the same image tag as the server (openbao 2.5.4, ADR-0027).
              image: quay.io/openbao/openbao:2.5.4
              command: ["/bin/sh", "/config/rotate.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: BAO_ADDR
                  value: "http://openbao.vault.svc:8200"
                # Was `keycloak.keycloak.svc` until #3966 — Keycloak runs in `iam`, and no
                # namespace `keycloak` has ever existed, so every rotation run's Keycloak leg
                # failed to resolve. The shell default above carried the same wrong host, so
                # unsetting this env would not have saved it either.
                - name: KC_URL
                  value: "http://keycloak.iam.svc:8080"
                - name: KC_REALM
                  value: "openbank"
                # BAO_TOKEN intentionally unset; rotate.sh authenticates via
                # Kubernetes auth method using the pod's projected SA token.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: openbao-secret-rotator-config
                defaultMode: 0555
