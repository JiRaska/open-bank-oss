apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: consent-service-oidc
  namespace: consent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: consent-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# consent-service's OWN Keycloak client `openbank-consent` (ROLE_API only), used ONLY by
# AccountOwnershipClient (named oidc-client `m2m`) for account.verifyOwnership — the ownership check
# behind an unrestricted consent (#16590). Deliberately NOT the shared entry above.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id`, `client_secret`), written
# ONCE by the owner's provisioning when the client is created in the live realm (runbook 0009);
# nothing in this repo holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: consent-service-m2m-oidc
  namespace: consent
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    open-bank.tech/rotation-deadline: "2027-11-17"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: consent-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/consent-service
        property: client_secret
