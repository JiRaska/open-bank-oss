# RBAC for the openbank-dr runner lane (ADR-0277; #8347, #4757, #4755, #2365).
#
# The openbank-dr scale set (arc-runners.tf) runs scheduled resilience lanes:
# dr-restore-verify and the chaos drill. Its pod ServiceAccount carries NO cloud
# role (no IRSA) — everything it does is in-cluster: create a throwaway
# dr-verify-<run-id> namespace, restore a CNPG backup into it, run read-only
# checks, tear it down.
#
# Least-privilege notes, honestly stated: Kubernetes RBAC cannot scope a
# ClusterRole to a namespace NAME PREFIX, so namespace create/delete is
# cluster-wide. The existing Kyverno rule prohibits using the openbank-dr service
# account name outside arc-runners; it does not constrain API requests made by
# that identity to DR namespaces. The workflow owns naming and teardown.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbank-dr
  labels:
    app.kubernetes.io/part-of: openbank-ci
rules:
  # Throwaway verify namespaces: create, read, delete. The workflow chooses
  # dr-verify-$RUN_ID; this ClusterRole is not scoped to that prefix.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  # Everything the restore+verify flow manages INSIDE the throwaway namespace.
  # NOTE: no "secrets" and no service write — Trivy KSV-0041/KSV-0056. The
  # restore templates need neither (OIDC/Kafka off; CNPG creds via Pod Identity).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # dr-restore-verify.yml reads the live ledger-service Rollout to pin the DR
  # check to the SAME image, and port-forwards to the verify pod for the
  # trial-balance assertion.
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The bootstrap controller creates the policy. The runner can only observe
  # its exact name; it cannot create an additive allow rule or remove isolation.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["ledger-dr-check-isolation"]
    verbs: ["get"]
  # CNPG: read the source clusters/backups (to pick the restore point) and
  # manage the recovery cluster in the verify namespace.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbank-dr
  labels:
    app.kubernetes.io/part-of: openbank-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbank-dr
subjects:
  - kind: ServiceAccount
    name: openbank-dr
    namespace: arc-runners
---
# Keep the openbank-dr service-account name out of non-runner namespaces.
# This rule does not namespace-scope the other resource grants above.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: openbank-dr-sa-pin
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: deny-openbank-dr-sa-outside-arc
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces: ["arc-runners"]
      validate:
        message: "openbank-dr SA must not be used outside the arc-runners namespace (ADR-0277)."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || '' }}"
                operator: Equals
                value: openbank-dr

---
# Trusted namespace bootstrap owns network policy writes, never the DR runner.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ledger-dr-check-network-isolation
spec:
  background: false
  rules:
  - name: bootstrap-dr-check-isolation
    match:
      any:
      - resources:
          kinds:
          - Namespace
          names:
          - dr-verify-?*
    generate:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      name: ledger-dr-check-isolation
      namespace: '{{ request.object.metadata.name }}'
      synchronize: true
      data:
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ledger-service-dr-check
          policyTypes:
          - Ingress
          - Egress
          ingress: []
          egress:
          - to:
            - podSelector:
                matchLabels:
                  cnpg.io/cluster: ledger-db-restored
            ports:
            - protocol: TCP
              port: 5432
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
            ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
