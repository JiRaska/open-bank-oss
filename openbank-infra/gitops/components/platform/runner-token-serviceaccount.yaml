#
# Standing ServiceAccount token in the CI runner namespace (ADR-0361, phase 1).
#
# This ServiceAccount has NO Role or ClusterRole binding anywhere and does not automount, so
# its token authenticates and is then refused for every verb. Nothing in the estate is
# configured to use it. Any request authenticated as it is recorded in the EKS audit log and
# matched by a CloudWatch metric filter in aws/envs/sandbox-substrate/deception.tf.
#
# Only the Secret's shell is declared here; the token controller fills `data` in the cluster,
# so no credential ever exists in git. ArgoCD syncs with ServerSideApply, which does not claim
# fields another manager owns.
#
# Do not bind this ServiceAccount to anything, and do not rename it without changing the metric
# filter pattern in the same PR. check-honeytoken-wiring.py fails the build if they drift.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-prod
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: openbank-ci
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: deploy-prod-token
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: openbank-ci
  annotations:
    kubernetes.io/service-account.name: deploy-prod
type: kubernetes.io/service-account-token
