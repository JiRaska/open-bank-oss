#
# Honey ServiceAccount token in the CI runner namespace (ADR-0359, phase 1).
#
# WHY HERE. arc-runners executes code from pull requests in a PUBLIC repository, and it is
# the only namespace where GuardDuty raised runtime findings in the 30 days before
# 2026-10-29 (docker socket access, a new binary, a suspicious tool — all from runner pods).
# Someone who lands in a runner pod enumerates Secrets in the namespace next (ATT&CK T1552.007,
# T1613). This lure is the most attractive thing they find: a long-lived token for an SA named
# like a production deploy identity.
#
# WHY IT IS SAFE. The SA has NO Role or ClusterRole binding anywhere, so the token
# authenticates and is then refused for every verb. automountServiceAccountToken is false, so
# no pod receives it by accident. Nothing in the estate is configured to use it, which is what
# makes every use a true positive.
#
# HOW IT FIRES. Any request authenticated as system:serviceaccount:arc-runners:deploy-prod
# lands in the EKS audit log; the CloudWatch metric filter `openbank-honeytoken-sa-used`
# (aws/envs/sandbox-substrate/deception.tf) counts it on ingest and its alarm emails the owner
# outside the cluster. The tripwire keys on USE, not on the Secret being READ: the ARC
# controller reads Secrets in this namespace ~41k times a day (measured), so a read alarm
# would be noise.
#
# GITOPS AND THE TOKEN VALUE. Only the Secret's shell is declared here; the token controller
# fills `data` in the cluster, so no credential ever exists in git. ArgoCD syncs with
# ServerSideApply, which does not claim fields another manager owns.
#
# DO NOT bind this SA to anything, and do not rename it without changing the metric filter
# pattern in the same PR — check-honeytoken-wiring.py fails the build if they drift.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-prod
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: openbank-ci
    openbank.io/deception: honeytoken
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: deploy-prod-token
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: openbank-ci
    openbank.io/deception: honeytoken
  annotations:
    kubernetes.io/service-account.name: deploy-prod
type: kubernetes.io/service-account-token
