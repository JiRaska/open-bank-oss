# ledger-service, SECOND deployment: the pension company's (penzijní společnost) own books
# (ADR-0337 — one ledger-service deployment per legal entity). Same image as
# components/ledger/ledger-service.yaml; differs only in configuration:
#   - its own CNPG cluster ledger-pension-co-db and Redis;
#   - every bank-only scheduler and the outbox → Kafka edge switched OFF (see env);
#   - no Kafka credentials, no fx-service URL;
#   - its own OPA bundle (ledger-pension-co-opa-bundle) admitting tax-reporting's
#     service-account to frozen trial-balance reads and no other machine identity;
#   - the company chart of accounts seeded by a per-instance Flyway callback (ConfigMap).
# Progressive delivery as the bank instance (ADR-0098 canary + money-path analysis).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ledger-service
  namespace: ledger-pension-co
  labels:
    app.kubernetes.io/name: ledger-service
    app.kubernetes.io/part-of: ledger-pension-co
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
        app.kubernetes.io/part-of: ledger-pension-co
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-ledger-pension-co-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "c7fe95c93a26ae15"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-ledger-service:sandbox-4c86c6f7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8101
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8085
          env:
            # Private-CA TLS listener, identical to the bank instance (the image's build-time
            # quarkus.http.ssl.client-auth=required needs the files to boot).
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/internal-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/internal-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILES
              value: /mnt/internal-tls/ca.crt
            - name: QUARKUS_HTTP_SSL_CLIENT_AUTH
              value: required
            - name: QUARKUS_HTTP_SSL_PROTOCOLS
              value: TLSv1.3
            # The pension company's OWN database (ADR-0337) — never ledger-db.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://ledger-pension-co-db-rw.ledger-pension-co.svc:5432/openbank_ledger
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://ledger-pension-co-db-rw.ledger-pension-co.svc:5432/openbank_ledger
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-pension-co-db-app
                  key: password
            # Per-instance chart of accounts (penzijní společnost). The image's shared
            # classpath:db/migration still builds the schema; the filesystem location adds ONLY a
            # Flyway afterMigrate callback from the ledger-pension-co-chart-of-accounts ConfigMap,
            # which upserts the company's accounts and disables the bank's seeded ones. A callback
            # records no schema-history version, so it can never collide with a future shared
            # V<n> migration (a versioned per-instance file would). Nothing is added to the bank DB.
            - name: QUARKUS_FLYWAY_LOCATIONS
              value: db/migration,filesystem:/flyway/pension-co
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.ledger-pension-co.svc:6379
            # ── Bank-only schedulers and outbound events: ALL OFF on this instance ──────────
            # Asserted by .github/scripts/check-ledger-instance-switches.py, which derives the
            # switch list from openbank-ledger-service's @Scheduled / @Channel / @ConfigProperty
            # source, so a new scheduler without a switch fails it.
            #
            # Outbox → Kafka dispatcher: the bank's `openbank.ledger.journal.posted` consumers
            # (balances, finrep, …) must never see the company's postings.
            - name: OPENBANK_OUTBOX_DISPATCH_ENABLED
              value: "false"
            # …and its 5 s poll tick itself, so the dispatcher never even claims outbox rows.
            - name: OPENBANK_OUTBOX_POLL_INTERVAL
              value: "off"
            # Defence in depth for the same edge: a pension-only topic name (no KafkaTopic, no
            # KafkaUser, no Kafka credentials or bootstrap env exist for this namespace, so the
            # producer has nowhere to connect even if the dispatcher were switched on).
            - name: MP_MESSAGING_OUTGOING_LEDGER_EVENTS_OUT_TOPIC
              value: openbank.ledger-pension-co.journal.posted.disabled
            # Quarkus disables a @Scheduled method whose config-expression cron resolves to "off".
            # Sub-ledger tie-out of the bank's deposit-control accounts 2100–2103 (ADR-0039 B).
            - name: OPENBANK_LEDGER_TIEOUT_CRON
              value: "off"
            # Its freshness watchdog would page every hour for a tie-out that never runs here.
            - name: OPENBANK_LEDGER_TIEOUT_FRESHNESS_CRON
              value: "off"
            # Daily FX revaluation of the bank's FX positions against fx-service (bank fixing).
            - name: OPENBANK_LEDGER_FX_REVALUATION_CRON
              value: "off"
            # Accounting-day calendar (ADR-0207): ties days out on the bank tie-out's verdict.
            - name: OPENBANK_LEDGER_ACCOUNTING_DAY_CRON
              value: "off"
            # …so the day lock has no calendar to read: off, not shadow/enforce.
            - name: LEDGER_DAY_LOCK_MODE
              value: "off"
            # OIDC resource server: same realm and client as the bank instance.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar enforcing ledger-pension-co-opa-bundle (base rest.rego + ledger ext +
            # ledger_pension_co_rest_ext.rego: only tax-reporting's service-account, read-only).
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is TCP on the http port, not /q/health/ready: the Kafka
          # producer's readiness sits KO until the first event is sent (lazy
          # connect), which with an idle producer would never flip — a
          # serve-before-traffic deadlock. Flyway-at-start already guarantees DB
          # connectivity before the port opens, so an accepting socket means a
          # working datasource. Liveness uses http health (no producer dep).
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: internal-tls
              mountPath: /mnt/internal-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: chart-of-accounts
              mountPath: /flyway/pension-co
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in ledger-service (ledger.list/read/create/
        # reverse/approve/trigger). Bundle mounted from ledger-pension-co-opa-bundle ConfigMap
        # (gen-ledger-pension-co-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/ledger_rest_ext.rego
              subPath: ledger_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/ledger_pension_co_rest_ext.rego
              subPath: ledger_pension_co_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: internal-tls
          secret:
            secretName: ledger-service-internal-tls
            optional: false
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: ledger-pension-co-opa-bundle
        - name: chart-of-accounts
          configMap:
            name: ledger-pension-co-chart-of-accounts
  strategy:
    canary:
      stableService: ledger-service
      canaryService: ledger-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
# Stable service — original DNS name preserved; Rollouts controller adds
# rollouts-pod-template-hash selector to pin to stable replica set.
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: ledger-pension-co
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8101
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
---
# Canary service — Rollouts controller updates selector to canary replica set.
# Internal callers that need to target canary pods directly use this Service.
apiVersion: v1
kind: Service
metadata:
  name: ledger-service-canary
  namespace: ledger-pension-co
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8101
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
