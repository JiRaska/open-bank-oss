# OIDC client secret for the pension company's ledger instance, projected from Vault by the
# External Secrets Operator (ClusterSecretStore `vault-kv`) into the in-namespace Secret
# `ledger-service-oidc`.
#
# This instance has its OWN Keycloak client `openbank-ledger-pension-co`. It must not reuse the
# bank's `account-service` KV entry: that holds the shared `openbank-services` secret, and a copy
# here would let this namespace mint tokens as every backend service that shares that client.
#
# The ledger module registers OidcClientRequestReactiveFilter (FxServiceClient), so its
# Deployment must carry a provisioned OIDC_CLIENT_SECRET (check-oidc-client-secret-wiring.py).
# The client's service account holds NO realm role: FX revaluation, the only outbound call the
# module makes, is switched off for this instance, so a token from this client is granted nothing.
#
# KV layout is ADR-0099's `openbank/keycloak/<name>` (keys `client_id`, `client_secret`), written
# once by the owner when the client is created in the live realm (runbook 0009). The consuming
# env ref is required, so seed Vault BEFORE this manifest syncs, or the pod stays in
# CreateContainerConfigError. creationPolicy Owner + deletionPolicy Retain mirror the
# per-service m2m ExternalSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-service-oidc
  namespace: ledger-pension-co
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: ledger-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: keycloak/ledger-pension-co
        property: client_secret
