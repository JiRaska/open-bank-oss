# pension-fund-service: provider side of the pension platform (ADR-0334) — segregated funds,
# strategies, NAV and the unit register. Reactive Postgres datasource + Flyway JDBC migrations
# against the single-owner CNPG cluster. Produces no events and calls no other service yet.
# OIDC bearer validation points at Keycloak. Reachable only in-cluster via ClusterIP, no ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pension-fund-service
  namespace: pension-fund
  labels:
    app.kubernetes.io/name: pension-fund-service
    app.kubernetes.io/part-of: pension-fund
spec:
  replicas: 1
  # Terminate-first, deliberately. With the default RollingUpdate a ONE-replica Deployment must
  # schedule the new pod BEFORE it may stop the old one, so the rollout needs room for two pods —
  # and the old pod holds exactly the resources the new one needs. On a cluster with no spare room
  # that is a deadlock the rollout never escapes. The trade is a few seconds of unavailability per
  # deploy, which a single-replica service already has. A multi-replica money-path service must
  # NOT copy this.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pension-fund-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-pension-fund-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "866c7eed2b372401"
      labels:
        app.kubernetes.io/name: pension-fund-service
        app.kubernetes.io/part-of: pension-fund
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pension-fund-service
          # Placeholder pin (fleet-attestation-placeholders.txt): no image is built until the merge
          # that adds openbank-pension-fund-service to ALL_SERVICES; auto-deploy rewrites it.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-pension-fund-service:sandbox-85335a44
          imagePullPolicy: IfNotPresent
          ports:
            # HTTP 8162 and management 8090 — both read off the service's own application.yaml
            # (quarkus.http.port / quarkus.management.port). The management port is NOT the
            # fleet-common 8085 here; probes below target 8090 deliberately.
            - name: http
              containerPort: 8162
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8090
          env:
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/internal-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/internal-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            # Keep old callers working until the separately verified HTTPS cutover.
            - name: QUARKUS_HTTP_INSECURE_REQUESTS
              value: enabled
            - name: QUARKUS_HTTP_SSL_PROTOCOLS
              value: TLSv1.3
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_RELOAD_PERIOD
              value: 1h
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary. The service's
            # application.yaml hardcodes localhost for both; these env vars override it, since an
            # env source outranks application.yaml in SmallRye's ordinal.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://pension-fund-db-rw.pension-fund.svc:5432/openbank_pension_fund
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://pension-fund-db-rw.pension-fund.svc:5432/openbank_pension_fund
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pension-fund-db-app
                  key: password
            # Keycloak runs in `iam`, not `platform`. A wrong host does not fail the boot (OIDC
            # defers discovery to the first request) — it just makes every authenticated call
            # fail later with `Name does not resolve`.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pension-fund-service-oidc
                  key: OIDC_CLIENT_SECRET
            # OPA sidecar enforced from the first rollout: pension_fund_rest_ext.rego grants fund
            # administration to real staff only; no service-account reaches a write by any rule.
            - name: AUTHZ_ENFORCE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: internal-tls
              mountPath: /mnt/internal-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # OPA policy decision point (ADR-0034). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default). Bundle mounted read-only from the
        # pension-fund-opa-bundle ConfigMap generated by gen-pension-fund-opa-bundle.sh.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach /health.
            # The image is scratch (no shell), so an exec probe isn't possible. Reachability is
            # fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            # `--bundle` is REQUIRED, not decorative: without it OPA loads /bundle as a plain data
            # directory and merges every YAML into the root data document, so rules-data.yaml and
            # agents-data.yaml collide and the sidecar dies with `merge error`. In bundle mode the
            # roots declared in .manifest keep them apart. Mount paths below must match.
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/pension_fund_rest_ext.rego
              subPath: pension_fund_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Data files land under the bundle roots declared in .manifest (`agents`, `rules`) —
            # NOT flat in /bundle, which is what produced the merge error above.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        - name: internal-tls
          secret:
            secretName: pension-fund-service-internal-tls
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: pension-fund-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: pension-fund-service
  namespace: pension-fund
  labels:
    app.kubernetes.io/name: pension-fund-service
    app.kubernetes.io/part-of: pension-fund
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pension-fund-service
  ports:
    - name: http
      port: 8162
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 8090
      targetPort: management
