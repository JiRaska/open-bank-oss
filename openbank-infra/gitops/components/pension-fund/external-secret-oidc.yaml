# pension-fund-service OIDC client secret from Vault -> pension-fund-service-oidc Secret (key
# OIDC_CLIENT_SECRET), shared openbank-services realm client. The remoteRef key is the shared
# `account-service` entry, as for every service (rules.yaml: oidc_secret_convention).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: Shared openbank-services client secret. Rotated with the realm client; the
    # date is the outer bound, not a promise it lives that long.
    openbank.io/rotation-deadline: "2027-09-05"
  name: pension-fund-service-oidc
  namespace: pension-fund
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: pension-fund-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# ADR-0341: pension-fund-service's OWN Keycloak client `openbank-pension-fund` (catalog:read scope,
# no realm role), used ONLY to read the pinned catalog revision at fund creation. product-catalog's
# bundle admits catalog.read for service-account-openbank-pension-fund alone; never the shared
# `openbank-services` account.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id`, `client_secret`), written
# ONCE by the owner when the client is created in the live realm (runbook 0009, "Per-service M2M
# client"). The env ref in the Deployment is `optional: true` on purpose: an unseeded entry fails
# fund CREATION closed (no token), it must not take NAV, the register or reporting down with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    openbank.io/rotation-deadline: "2027-01-17"
  name: pension-fund-service-m2m-oidc
  namespace: pension-fund
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: pension-fund-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_PENSION_FUND_CLIENT_SECRET
      remoteRef:
        key: keycloak/pension-fund-service
        property: client_secret
