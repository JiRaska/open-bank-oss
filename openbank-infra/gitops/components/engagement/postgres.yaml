# Single-owner Postgres for engagement-service, reconciled by the cluster-wide CNPG operator.
# CNPG generates the `engagement-db-app` secret (username/password for the `openbank` owner) and
# an `engagement-db-rw` Service — both consumed by the engagement-service Deployment for the
# reactive datasource and Flyway migrations. One instance for sandbox FinOps; raise to 3 for HA
# before this carries real traffic.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engagement-db
  namespace: engagement
spec:
  monitoring:
    enablePodMonitor: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  bootstrap:
    initdb:
      database: openbank_engagement
      owner: openbank
