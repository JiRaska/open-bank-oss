# engagement-service: ADR-0220 in-app surfaces, first infrastructure slice.
#
# LIVE: registered in auto-deploy.yml's ALL_SERVICES (deploy-coverage-guard requires this the
# moment a released component has gitops manifests — "a component nobody builds has a gitops tag
# that rots in place", #3344 class). A real single-instance CNPG Postgres backs it
# (postgres.yaml).
#
# Kafka mTLS (kafka-engagement-mtls.yaml) landed as the fast-follow to issue #2749's
# adverse-state consumers (LendingArrearsEventConsumer, PartyErasureConsumer): SSL env +
# keystore/truststore volumes below, once the deployed image (sandbox-fb5c455b) was actually
# built from a commit whose application.yaml declares lending-events-in/party-events-in with a
# real `connector:` — check-msg-channel-image-parity.py (#3350 class incident, card-issuance)
# is exactly what blocked landing this alongside the consumer code itself. This also fixes a
# latent bug, not just adds a feature — openbank.outbox.dispatch-enabled is `true`, so the D2
# feedback-loop outbox had been attempting every publish over plaintext against the mTLS-only
# :9093 listener since #4048 merged: an immediate TLS-handshake failure per attempt, loud, never
# actually delivering.
# The OPA sidecar used to be on that deferred list, on the reasoning that a missing PDP left
# OPA-level policy merely "not consulted yet, not open". That was wrong, and the
# `authz-enforce ⇒ PDP sidecar parity` gate (#1797) caught it: `authz.enforce` carries
# `defaultValue = "true"` in AuthorizeInterceptor and this service overrides it nowhere, so the
# interceptor enforces with no PDP to ask — `AuthorizeInterceptorTest` names the outcome
# outright, `enforce=true, no PDP bean throws 503`. Not open, but not deferred either: both
# @Authorize endpoints on SurfaceResource answer 503 rather than serving. Wired below.
# Reachable only in-cluster via ClusterIP, no ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-service
  namespace: engagement
  labels:
    app.kubernetes.io/name: engagement-service
    app.kubernetes.io/part-of: engagement
spec:
  replicas: 1
  # Terminate-first (#3545): one replica, no HA to lose, and the default maxSurge 1 needs
  # headroom the pod's own resource requests would otherwise contest during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engagement-service
  template:
    metadata:
      annotations:
        # Rolls the Deployment when the OPA policy bundle changes (subPath mounts don't
        # hot-reload). Kept in sync by gen-engagement-opa-bundle.sh.
        openbank.tech/policy-checksum: "63f5769df67380c8"
      labels:
        app.kubernetes.io/name: engagement-service
        app.kubernetes.io/part-of: engagement
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engagement-service
          # Bootstrap placeholder — the deploy-drift gate requires a sandbox-<sha> tag. Now that
          # this service IS in ALL_SERVICES, the next push touching openbank-engagement-service/
          # src/main (this merge itself, first) triggers auto-deploy to build a real image and
          # open a gitops PR replacing this with the actual sha. Until then, Kyverno's
          # cosign-signature/SBOM-attestation admission policies reject a tag nothing ever pushed.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-engagement-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8153
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://engagement-db-rw.engagement.svc:5432/openbank_engagement
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://engagement-db-rw.engagement.svc:5432/openbank_engagement
            - name: DB_USER
              value: openbank
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engagement-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engagement-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # issue #686: group.id/auto.offset.reset for lending-events-in/party-events-in — see
            # engagement-service-msg-override.yaml's own header for why this can't be plain YAML.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            - name: CONSENT_SERVICE_URL
              value: http://consent-service.consent.svc:8106
            - name: KEYCLOAK_URL
              value: http://keycloak.iam.svc:8080
            # optional:true — see check-oidc-client-secret-wiring.py's OPTIONAL_TRUE_PENDING_LIVE_CHECK.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: engagement-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
        # The PDP every @Authorize endpoint on SurfaceResource queries. Without it the
        # interceptor has nothing to ask and fails closed (503/422) — issue #1797, and
        # exactly the state #4054 left this workload in.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: engagement-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: engagement-service-msg-override
        - name: opa-bundle
          configMap:
            name: engagement-service-opa-bundle
        - name: opa-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: engagement-service
  namespace: engagement
  labels:
    app.kubernetes.io/name: engagement-service
spec:
  selector:
    app.kubernetes.io/name: engagement-service
  ports:
    - name: http
      port: 8153
      targetPort: 8153
    - name: management
      port: 8085
      targetPort: 8085
