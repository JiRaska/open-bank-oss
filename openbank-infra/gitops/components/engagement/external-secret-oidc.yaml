# engagement-service OIDC client secret from Vault → engagement-service-oidc Secret
# (key OIDC_CLIENT_SECRET), shared openbank-services realm client. Same shape as
# campaign-service's. optional: true on the Deployment env ref below, same as the seven
# other services still pending a confirmed live Vault sync (agent, anacredit, billing,
# document, interest, mcp, sdd, tpp-registry) — this service is new and unconfirmed too.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: engagement-service-oidc
  namespace: engagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: engagement-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    # rules.yaml: oidc_secret_convention — every service authenticates as the same Keycloak
    # client `openbank-services`, so the shared KV entry is `account-service` regardless of
    # which service is reading it (#3471). A per-service key needs a KV write nobody prompts
    # for, and when it is missing the pod sits in CreateContainerConfigError.
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
