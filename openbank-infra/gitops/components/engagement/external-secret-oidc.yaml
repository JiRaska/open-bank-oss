# engagement-service OIDC client secret from Vault → engagement-service-oidc Secret
# (key OIDC_CLIENT_SECRET), shared openbank-services realm client. Same shape as
# campaign-service's. optional: true on the Deployment env ref below, same as the seven
# other services still pending a confirmed live Vault sync (agent, anacredit, billing,
# document, interest, mcp, sdd, tpp-registry) — this service is new and unconfirmed too.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: engagement-service-oidc
  namespace: engagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: engagement-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: engagement-service
        property: OIDC_CLIENT_SECRET
