# SPDX-License-Identifier: Apache-2.0
# Kafka topic for the engagement-service event stream (ADR-0220 D3, ADR-0006).
# Single partition + RF 1 for the sandbox; raise for production.
# Retention 30 days (needed for the ADR-0219 D2 counter rebuild window).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.engagement.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
