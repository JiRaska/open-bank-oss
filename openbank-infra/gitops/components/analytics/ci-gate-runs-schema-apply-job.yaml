#
# Applies the analytics schema ConfigMaps' DDL to the live ClickHouse.
#
# Hook choice — PostSync, same reasoning as temporal-namespace-registration.yaml: runs after
# the Application's own resources (the ClickHouse StatefulSet, the ConfigMap this Job mounts)
# are synced, so the DDL runs against a service that is actually there. `CREATE DATABASE/TABLE IF
# NOT EXISTS` and `CREATE OR REPLACE VIEW` are idempotent, so this is safe to re-run on every sync
# where either schema ConfigMap (or anything else in this directory) changes, which is what
# BeforeHookCreation causes to happen.
apiVersion: batch/v1
kind: Job
metadata:
  name: ci-gate-runs-schema-apply
  namespace: analytics
  labels:
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/component: ci-gate-observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: analytics
        app.kubernetes.io/component: ci-gate-observability
    spec:
      restartPolicy: Never
      # No Kubernetes API calls (only ClickHouse HTTP) — drop the token, same as the
      # temporal-namespace-registration hook.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-schema
          # curl is sufficient: ClickHouse's HTTP interface accepts a raw SQL script as the
          # POST body on /?database=... — no clickhouse-client binary needed, one fewer image
          # to pin and patch.
          image: docker.io/curlimages/curl:8.7.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_URL
              value: http://clickhouse.analytics.svc:8123
            - name: CLICKHOUSE_USER
              value: analytics
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # ClickHouse's HTTP interface REJECTS a multi-statement body by default:
              # `Code: 62. DB::Exception: Syntax error (Multi-statements are not allowed)`.
              # An earlier version of this script asserted the opposite ("this endpoint's
              # default parser handles a script with multiple CREATE ... ; statements as one
              # body") — untested, and wrong: it shipped to the live cluster, the PostSync
              # hook failed with exactly that error, and because a PostSync hook's failure
              # blocks the whole ArgoCD sync, the same failure silently starved every OTHER
              # resource in this directory of the retry it needed once the real blocker (an
              # unseeded ExternalSecret, unrelated) was fixed. Never assert a database's
              # protocol behaviour without running it — this file is the lesson memorialised.
              #
              # Split each mounted file into one statement per request instead. Whole-line
              # comments are stripped before AWK sees them: a prose comment in the CI schema
              # contains an ordinary English semicolon, which otherwise looks like a statement
              # terminator to RS=";\n". The remaining records match the repository convention:
              # every real statement ends with a semicolon followed by a newline.
              total=0
              for script in /sql/ci/ci-gate-runs.sql /sql/campaign/campaign-engagement.sql /sql/referral/referral-funnel.sql; do
                echo "Splitting and applying ${script} to ${CLICKHOUSE_URL}"
                rm -f /tmp/stmt*.sql
                grep -v '^[[:space:]]*--' "$script" \
                  | awk 'BEGIN{RS=";\n"} NF{fn="/tmp/stmt" NR ".sql"; print $0";" > fn}'
                n=0
                for f in /tmp/stmt*.sql; do
                  [ -e "$f" ] || continue
                  n=$((n + 1))
                  total=$((total + 1))
                  echo "--- statement $n ($f) ---"
                  code="$(curl -sS -o /tmp/ch-apply.out -w '%{http_code}' \
                    -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" \
                    --data-binary @"$f" \
                    "${CLICKHOUSE_URL}/")"
                  cat /tmp/ch-apply.out
                  [ "$code" -lt 300 ] || { echo "::error::statement $n failed (HTTP $code)"; exit 1; }
                done
                [ "$n" -gt 0 ] || { echo "::error::no statements found in ${script} — refusing to report success"; exit 1; }
              done
              echo "analytics schemas applied ($total statement(s))"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ci-sql
              mountPath: /sql/ci
              readOnly: true
            - name: campaign-sql
              mountPath: /sql/campaign
              readOnly: true
            - name: referral-sql
              mountPath: /sql/referral
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ci-sql
          configMap:
            name: ci-gate-runs-schema
        - name: campaign-sql
          configMap:
            name: campaign-engagement-schema
        - name: referral-sql
          configMap:
            name: referral-funnel-schema
