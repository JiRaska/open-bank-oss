#
# Applies the analytics schema ConfigMaps' DDL to the live ClickHouse.
#
# Hook choice — PostSync, same reasoning as temporal-namespace-registration.yaml: runs after
# the Application's own resources (the ClickHouse StatefulSet, the ConfigMap this Job mounts)
# are synced, so the DDL runs against a service that is actually there. `CREATE DATABASE/TABLE IF
# NOT EXISTS` and `CREATE OR REPLACE VIEW` are idempotent, so this is safe to re-run on every sync
# where either schema ConfigMap (or anything else in this directory) changes, which is what
# BeforeHookCreation causes to happen.
#
# The generated replay plan applies non-view prerequisites before each final authoritative view,
# dependency-ordered, one statement per mounted file. Historical migrations remain immutable;
# replaying their intermediate view definitions would temporarily downgrade a mature warehouse.
# The init ConfigMap remains the first-boot input. CI checks both its parity and replay freshness.
apiVersion: batch/v1
kind: Job
metadata:
  name: ci-gate-runs-schema-apply
  namespace: analytics
  labels:
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/component: ci-gate-observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: analytics
        app.kubernetes.io/component: ci-gate-observability
    spec:
      restartPolicy: Never
      # No Kubernetes API calls (only ClickHouse HTTP) — drop the token, same as the
      # temporal-namespace-registration hook.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-schema
          # curl is sufficient: ClickHouse's HTTP interface accepts a raw SQL script as the
          # POST body on /?database=... — no clickhouse-client binary needed, one fewer image
          # to pin and patch.
          image: docker.io/curlimages/curl:8.19.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_URL
              value: http://clickhouse.analytics.svc:8123
            - name: CLICKHOUSE_USER
              value: analytics
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # Build-time replay selection keeps only final authoritative views, after all
              # table/column/index prerequisites. Each generated key is exactly ONE statement;
              # runtime must not split quoted SQL differently from the generator.
              total=0
              for f in /sql/plan/*.sql; do
                [ -e "$f" ] || { echo "::error::missing generated replay plan"; exit 1; }
                total=$((total + 1))
                echo "--- statement $total ($f) ---"
                code="$(curl -sS -o /tmp/ch-apply.out -w '%{http_code}' \
                  -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" \
                  --data-binary @"$f" "${CLICKHOUSE_URL}/")"
                cat /tmp/ch-apply.out
                [ "$code" -lt 300 ] || { echo "::error::statement $total failed (HTTP $code)"; exit 1; }
              done
              [ "$total" -gt 0 ] || { echo "::error::empty replay plan"; exit 1; }
              echo "analytics schemas applied ($total statement(s))"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: replay-plan
              mountPath: /sql/plan
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: replay-plan
          configMap:
            name: clickhouse-replay-plan
