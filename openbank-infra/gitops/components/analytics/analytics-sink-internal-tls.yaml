#
# Private-CA certificate for the analytics-sink internal mTLS listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: analytics-sink-internal-tls
  namespace: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: analytics-sink-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - analytics-sink.analytics.svc
    - analytics-sink.analytics.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
