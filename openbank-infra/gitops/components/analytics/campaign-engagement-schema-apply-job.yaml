#
# Applies the idempotent campaign engagement view to an already-running ClickHouse. A PostSync
# hook is required because docker-entrypoint-initdb.d does not revisit a non-empty data volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: campaign-engagement-schema-apply
  namespace: analytics
  labels:
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/component: campaign-observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: analytics
        app.kubernetes.io/component: campaign-observability
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-schema
          image: docker.io/curlimages/curl:8.7.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_URL
              value: http://clickhouse.analytics.svc:8123
            - name: CLICKHOUSE_USER
              value: analytics
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              code="$(curl -sS -o /tmp/ch-apply.out -w '%{http_code}' \
                -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" \
                --data-binary @/sql/campaign-engagement.sql \
                "${CLICKHOUSE_URL}/")"
              cat /tmp/ch-apply.out
              [ "$code" -lt 300 ] || { echo "schema apply failed (HTTP $code)"; exit 1; }
              echo "campaign engagement schema applied"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: sql
          configMap:
            name: campaign-engagement-schema
