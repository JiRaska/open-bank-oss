data:
  0001.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nCREATE DATABASE IF NOT EXISTS openbank_analytics;\n"
  0002.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.bronze_events\n(\n    event_id          UUID,\n    aggregate_type    LowCardinality(String),\n    aggregate_id      String,\n    aggregate_version Int64,\n    event_type        LowCardinality(String),\n    occurred_at       DateTime64(3, 'UTC'),\n    source_service    LowCardinality(String),\n    schema_version    UInt16,\n    actor_id          Nullable(String),\n    actor_type        Nullable(String),\n    trace_id          Nullable(String),\n    \n\n    \n\n    \n\n    ingest_source     LowCardinality(String) DEFAULT 'STREAM',\n    batch_id          Nullable(String),\n    ingested_at       DateTime64(3, 'UTC') DEFAULT now64(3),\n    \n\n    \n\n    \n\n    \n\n    record_hash       String DEFAULT '',\n    \n\n    \n\n    payload           String\n)\nENGINE = ReplacingMergeTree(aggregate_version)\n\n\n\n\nORDER BY (aggregate_type, aggregate_id, event_id)\nPARTITION BY toYYYYMM(occurred_at)\n\n\n\n\n\n\nTTL toDateTime(occurred_at) + INTERVAL 10 YEAR\nSETTINGS index_granularity = 8192;\n"
  0003.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nALTER TABLE openbank_analytics.bronze_events\n    ADD INDEX IF NOT EXISTS idx_event_id (event_id) TYPE bloom_filter GRANULARITY 4;\n"
  0004.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.dead_letter_events\n(\n    content_hash  String,\n    raw_payload   String,\n    error         String,\n    failed_at     DateTime64(3, 'UTC') DEFAULT now64(3)\n)\nENGINE = ReplacingMergeTree(failed_at)\nORDER BY (content_hash)\nPARTITION BY toYYYYMM(failed_at)\nTTL toDateTime(failed_at) + INTERVAL 1 YEAR;\n"
  0005.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.backfill_audit\n(\n    batch_id       String,\n    ingest_source  LowCardinality(String),\n    range_from     DateTime64(3, 'UTC'),\n    range_to       DateTime64(3, 'UTC'),\n    aggregate_type Nullable(String),\n    aggregate_id   Nullable(String),\n    windows        UInt32,\n    ingested       UInt64,\n    deduped        UInt64,\n    requested_by   String,\n    reason         String,\n    started_at     DateTime64(3, 'UTC'),\n    finished_at    DateTime64(3, 'UTC'),\n    status         LowCardinality(String)\n)\nENGINE = MergeTree\nORDER BY (started_at, batch_id)\nPARTITION BY toYYYYMM(started_at)\nTTL toDateTime(started_at) + INTERVAL 10 YEAR;\n"
  0006.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.integrity_anchors\n(\n    anchor_id            String,\n    merkle_root          String,\n    previous_anchor_hash Nullable(String),\n    record_count         UInt32,\n    source               LowCardinality(String),\n    sealed_at            DateTime64(3, 'UTC')\n)\nENGINE = MergeTree\nORDER BY (sealed_at, anchor_id)\nPARTITION BY toYYYYMM(sealed_at);\n"
  0007.sql: "-- Source: V1__analytics_bronze_silver.sql; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.reload_proposals\n(\n    proposal_id     String,\n    state           LowCardinality(String),\n    ingest_source   LowCardinality(String),\n    range_from      DateTime64(3, 'UTC'),\n    range_to        DateTime64(3, 'UTC'),\n    aggregate_type  Nullable(String),\n    aggregate_id    Nullable(String),\n    requested_by    String,\n    proposed_by     String,\n    proposed_at     DateTime64(3, 'UTC'),\n    decided_by      Nullable(String),\n    decided_at      Nullable(DateTime64(3, 'UTC')),\n    decision_reason Nullable(String),\n    executed_at     Nullable(DateTime64(3, 'UTC')),\n    reason          String,\n    \n\n    updated_at      DateTime64(3, 'UTC') DEFAULT now64(3)\n)\nENGINE = ReplacingMergeTree(updated_at)\nORDER BY (proposal_id)\nPARTITION BY toYYYYMM(proposed_at)\nTTL toDateTime(proposed_at) + INTERVAL 10 YEAR;\n"
  0008.sql: "-- Source: V9__synthetic_provenance.sql; final authoritative definition, not historical replay.\nALTER TABLE openbank_analytics.bronze_events\n    ADD COLUMN IF NOT EXISTS synthetic UInt8 DEFAULT 0;\n"
  0009.sql: "-- Source: ci-gate-runs-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.ci_gate_runs\n(\n    \n\n    run_id       UInt64,\n    sha          FixedString(40),\n    event        LowCardinality(String),   \n\n    pr_number    Nullable(UInt32),\n    run_created_at DateTime64(3, 'UTC'),\n\n    \n\n    \n\n    shard        LowCardinality(String),    \n\n    gate_id      String,\n    mode         LowCardinality(String),    \n\n    status       LowCardinality(String),    \n\n    seconds      Float64,\n    \n\n    \n\n    \n\n    \n\n    \n\n    \n\n    \n\n    selftest_seconds Float64 DEFAULT 0,\n    subjects     Nullable(Int64),\n    selftest_declared Bool,\n    selftest_passed   Nullable(Bool),\n    budget_seconds    Nullable(Float64),\n    min_subjects      Nullable(Int64),\n\n    inserted_at  DateTime64(3, 'UTC') DEFAULT now64(3)\n)\nENGINE = ReplacingMergeTree(inserted_at)\nORDER BY (gate_id, run_id)\nPARTITION BY toYYYYMM(run_created_at)\n\n\n\n\n\n\nTTL toDateTime(run_created_at) + INTERVAL 13 MONTH\nSETTINGS index_granularity = 8192;\n"
  0010.sql: "-- Source: ci-gate-runs-schema-configmap.yaml; final authoritative definition, not historical replay.\nALTER TABLE openbank_analytics.ci_gate_runs\n    ADD COLUMN IF NOT EXISTS selftest_seconds Float64 DEFAULT 0 AFTER seconds;\n"
  0011.sql: "-- Source: ci-gate-runs-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.ci_workflow_runs\n(\n    run_id         UInt64,\n    run_attempt    UInt16,\n    workflow       LowCardinality(String),   \n\n    workflow_path  LowCardinality(String),   \n\n    event          LowCardinality(String),\n    head_branch    String,\n    head_sha       FixedString(40),\n    status         LowCardinality(String),\n    conclusion     LowCardinality(String),   \n\n    created_at     DateTime64(3, 'UTC'),\n    run_started_at Nullable(DateTime64(3, 'UTC')),\n    updated_at     DateTime64(3, 'UTC'),\n    inserted_at    DateTime64(3, 'UTC') DEFAULT now64(3)\n)\nENGINE = ReplacingMergeTree(inserted_at)\nORDER BY (run_id, run_attempt)\nPARTITION BY toYYYYMM(created_at)\nTTL toDateTime(created_at) + INTERVAL 13 MONTH\nSETTINGS index_granularity = 8192;\n"
  0012.sql: "-- Source: ci-gate-runs-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.ci_workflow_jobs\n(\n    job_id        UInt64,\n    run_id        UInt64,\n    run_attempt   UInt16,\n    workflow      LowCardinality(String),\n    job_name      String,\n    status        LowCardinality(String),\n    conclusion    LowCardinality(String),\n    created_at    DateTime64(3, 'UTC'),\n    started_at    Nullable(DateTime64(3, 'UTC')),\n    completed_at  Nullable(DateTime64(3, 'UTC')),\n    runner_labels Array(LowCardinality(String)),\n    runner_group  LowCardinality(String),\n    failed_step   String,\n    inserted_at   DateTime64(3, 'UTC') DEFAULT now64(3)\n)\nENGINE = ReplacingMergeTree(inserted_at)\nORDER BY (run_id, job_id)\nPARTITION BY toYYYYMM(created_at)\nTTL toDateTime(created_at) + INTERVAL 13 MONTH\nSETTINGS index_granularity = 8192;\n"
  0013.sql: "-- Source: ci-gate-runs-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.deploy_events\n(\n    app               LowCardinality(String),\n    history_id        UInt64,\n    revision          String,\n    source_path       String,\n    deploy_started_at Nullable(DateTime64(3, 'UTC')),\n    deployed_at       DateTime64(3, 'UTC'),\n    automated         Bool,\n    inserted_at       DateTime64(3, 'UTC') DEFAULT now64(3)\n)\nENGINE = ReplacingMergeTree(inserted_at)\nORDER BY (app, history_id)\nPARTITION BY toYYYYMM(deployed_at)\nTTL toDateTime(deployed_at) + INTERVAL 13 MONTH\nSETTINGS index_granularity = 8192;\n"
  0014.sql: "-- Source: cloud-finops-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.finops_iac_resources\n(\n    run_ts        DateTime64(3, 'UTC'),\n    run_id        String,\n    env           LowCardinality(String),\n    project       LowCardinality(String),\n    resource      String,\n    resource_type LowCardinality(String),\n    category      LowCardinality(String),\n    tags          Map(String, String),\n    monthly_cost  Float64\n)\nENGINE = MergeTree\nORDER BY (env, run_ts, resource)\nPARTITION BY toYYYYMM(run_ts)\nTTL toDateTime(run_ts) + INTERVAL 25 MONTH;\n"
  0015.sql: "-- Source: cloud-finops-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.finops_findings\n(\n    run_ts             DateTime64(3, 'UTC'),\n    run_id             String,\n    env                LowCardinality(String),\n    project            LowCardinality(String),\n    resource           String,\n    resource_type      LowCardinality(String),\n    rule_id            LowCardinality(String),\n    rules_version      LowCardinality(String),\n    severity           LowCardinality(String),\n    message            String,\n    est_monthly_saving Float64\n)\nENGINE = MergeTree\nORDER BY (env, run_ts, rule_id, resource)\nPARTITION BY toYYYYMM(run_ts)\nTTL toDateTime(run_ts) + INTERVAL 25 MONTH;\n"
  0016.sql: "-- Source: cloud-finops-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.finops_aws_daily_cost\n(\n    usage_date   Date,\n    service      LowCardinality(String),\n    category     LowCardinality(String),\n    amount       Float64,\n    currency     LowCardinality(String),\n    collected_at DateTime64(3, 'UTC')\n)\nENGINE = ReplacingMergeTree(collected_at)\nORDER BY (usage_date, service)\nPARTITION BY toYYYYMM(usage_date)\nTTL usage_date + INTERVAL 25 MONTH;\n"
  0017.sql: "-- Source: cloud-finops-schema-configmap.yaml; final authoritative definition, not historical replay.\nCREATE TABLE IF NOT EXISTS openbank_analytics.finops_ingest_runs\n(\n    run_ts                   DateTime64(3, 'UTC'),\n    run_id                   String,\n    rules_version            LowCardinality(String),\n    envs                     UInt16,\n    resources                UInt32,\n    findings                 UInt32,\n    compliance               Float64,\n    iac_monthly_cost         Float64,\n    potential_monthly_saving Float64,\n    ce_rows                  UInt32\n)\nENGINE = MergeTree\nORDER BY run_ts\nTTL toDateTime(run_ts) + INTERVAL 25 MONTH;\n"
  0018.sql: "-- Source: V9__synthetic_provenance.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_current_state AS\nSELECT\n    upper(b.aggregate_type) AS aggregate_type,\n    b.aggregate_id,\n    argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_id,\n    max(b.aggregate_version) AS aggregate_version,\n    argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_type,\n    argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS occurred_at,\n    argMax(b.source_service, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS source_service,\n    argMax(b.schema_version, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS schema_version,\n    argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS payload\nFROM openbank_analytics.bronze_events AS b\nWHERE b.synthetic = 0\nGROUP BY upper(b.aggregate_type), b.aggregate_id;\n"
  0019.sql: "-- Source: V9__synthetic_provenance.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_daily_event_volume AS\nSELECT\n    toDate(occurred_at) AS day,\n    source_service,\n    aggregate_type,\n    event_type,\n    count() AS events\nFROM openbank_analytics.bronze_events\nWHERE synthetic = 0\nGROUP BY day, source_service, aggregate_type, event_type;\n"
  0020.sql: "-- Source: V9__synthetic_provenance.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_history AS\nSELECT\n    upper(aggregate_type) AS aggregate_type,\n    aggregate_id,\n    aggregate_version,\n    event_type,\n    occurred_at AS valid_from,\n    leadInFrame(occurred_at) OVER (\n        PARTITION BY upper(aggregate_type), aggregate_id\n        ORDER BY aggregate_version, occurred_at, ingested_at\n        ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING\n    ) AS valid_to,\n    payload\nFROM openbank_analytics.bronze_events\nWHERE synthetic = 0;\n"
  0021.sql: "-- Source: V9__synthetic_provenance.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_as_of AS\nSELECT\n    upper(b.aggregate_type) AS aggregate_type,\n    b.aggregate_id,\n    argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_id,\n    max(b.aggregate_version) AS aggregate_version,\n    argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_type,\n    argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS occurred_at,\n    argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS payload\nFROM openbank_analytics.bronze_events AS b\nWHERE b.synthetic = 0\n  AND b.occurred_at <= {t:DateTime64(3, 'UTC')}\nGROUP BY upper(b.aggregate_type), b.aggregate_id;\n"
  0022.sql: "-- Source: V7__fold_aggregate_type_case.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_funnel_events AS\nSELECT\n    aggregate_id                                  AS session_id,\n    occurred_at,\n    toDate(occurred_at)                           AS day,\n    JSONExtractString(payload, 'step')            AS step,\n    JSONExtractString(payload, 'action')          AS action,\n    JSONExtractString(payload, 'kycMethod')       AS kyc_method,\n    JSONExtractString(payload, 'reason')          AS reason,\n    JSONExtractString(payload, 'platform')        AS platform,\n    JSONExtractString(payload, 'appVersion')      AS app_version\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'ONBOARDING_FUNNEL';\n"
  0023.sql: "-- Source: V2__onboarding_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_step_index AS\nSELECT\n    step,\n    multiIf(\n        step = 'WELCOME',   1,\n        step = 'IDENTITY',  2,\n        step = 'EMAIL',     3,\n        step = 'AGREEMENT', 4,\n        step = 'PASSKEY',   5,\n        step = 'SIGN',      6,\n        99) AS step_ordinal\nFROM (SELECT DISTINCT step FROM openbank_analytics.gold_onboarding_funnel_events);\n"
  0024.sql: "-- Source: V2__onboarding_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_funnel_daily AS\nSELECT\n    day,\n    step,\n    multiIf(\n        step = 'WELCOME',   1,\n        step = 'IDENTITY',  2,\n        step = 'EMAIL',     3,\n        step = 'AGREEMENT', 4,\n        step = 'PASSKEY',   5,\n        step = 'SIGN',      6,\n        99)                                                     AS step_ordinal,\n    uniqExactIf(session_id, action = 'STEP_VIEWED')             AS sessions_viewed,\n    \n\n    \n\n    \n\n    uniqExactIf(session_id, action = 'STEP_COMPLETED' OR (step = 'SIGN' AND action = 'SIGN_SUCCESS')) AS sessions_completed,\n    uniqExactIf(session_id, action = 'HOLD_ABANDONED')          AS hold_abandons\nFROM openbank_analytics.gold_onboarding_funnel_events\nGROUP BY day, step;\n"
  0025.sql: "-- Source: V2__onboarding_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_step_durations AS\nSELECT\n    session_id,\n    step,\n    toDate(minIf(occurred_at, action = 'STEP_VIEWED'))         AS day,\n    dateDiff(\n        'second',\n        minIf(occurred_at, action = 'STEP_VIEWED'),\n        minIf(occurred_at, action = 'STEP_COMPLETED'))         AS seconds_on_step\nFROM openbank_analytics.gold_onboarding_funnel_events\nWHERE action IN ('STEP_VIEWED', 'STEP_COMPLETED')\nGROUP BY session_id, step\nHAVING countIf(action = 'STEP_VIEWED') > 0\n   AND countIf(action = 'STEP_COMPLETED') > 0\n   AND seconds_on_step >= 0;\n"
  0026.sql: "-- Source: V2__onboarding_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_sign_outcomes AS\nSELECT\n    day,\n    countIf(action = 'SIGN_ATTEMPT')                           AS attempts,\n    countIf(action = 'SIGN_SUCCESS')                           AS successes,\n    countIf(action = 'SIGN_FAIL')                              AS failures\nFROM openbank_analytics.gold_onboarding_funnel_events\nWHERE step = 'SIGN'\nGROUP BY day;\n"
  0027.sql: "-- Source: V2__onboarding_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_sign_fail_reasons AS\nSELECT\n    day,\n    if(reason = '', 'unknown', reason)                         AS reason,\n    count()                                                    AS failures\nFROM openbank_analytics.gold_onboarding_funnel_events\nWHERE step = 'SIGN' AND action = 'SIGN_FAIL'\nGROUP BY day, reason;\n"
  0028.sql: "-- Source: V2__onboarding_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_kyc_method_daily AS\nSELECT\n    day,\n    if(kyc_method = '', 'unknown', kyc_method)                 AS kyc_method,\n    uniqExact(session_id)                                      AS sessions\nFROM openbank_analytics.gold_onboarding_funnel_events\nWHERE action = 'KYC_METHOD_CHOSEN'\nGROUP BY day, kyc_method;\n"
  0029.sql: "-- Source: V7__fold_aggregate_type_case.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback AS\nSELECT\n    aggregate_id                                        AS reference,\n    occurred_at,\n    toDate(occurred_at)                                 AS day,\n    JSONExtractString(payload, 'partyId')               AS party_id,\n    JSONExtractString(payload, 'screenId')              AS screen_id,\n    JSONExtractString(payload, 'category')              AS category,\n    JSONExtractString(payload, 'comment')               AS comment,\n    JSONExtractString(payload, 'platform')              AS platform,\n    JSONExtractString(payload, 'appVersion')            AS app_version,\n    JSONExtractString(payload, 'osVersion')             AS os_version,\n    JSONExtractString(payload, 'locale')                AS locale,\n    JSONExtractString(payload, 'theme')                 AS theme,\n    JSONExtractString(payload, 'sessionId')             AS session_id,\n    JSONExtractString(payload, 'screenshotKey')         AS screenshot_key,\n    JSONExtractString(payload, 'screenshotStatus')      AS screenshot_status,\n    JSONExtractUInt(payload, 'screenshotBytes')         AS screenshot_bytes\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'SCREEN_FEEDBACK';\n"
  0030.sql: "-- Source: V3__screen_feedback.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback_by_screen AS\nSELECT\n    screen_id,\n    category,\n    count()                     AS submissions,\n    countIf(screenshot_key != '') AS with_screenshot,\n    min(occurred_at)            AS first_seen,\n    max(occurred_at)            AS last_seen\nFROM openbank_analytics.gold_screen_feedback\nGROUP BY screen_id, category;\n"
  0031.sql: "-- Source: V3__screen_feedback.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback_daily AS\nSELECT\n    day,\n    category,\n    platform,\n    app_version,\n    count()                        AS submissions,\n    uniqExact(party_id)            AS parties,\n    uniqExact(screen_id)           AS screens\nFROM openbank_analytics.gold_screen_feedback\nGROUP BY day, category, platform, app_version;\n"
  0032.sql: "-- Source: V3__screen_feedback.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback_screenshot_health AS\nSELECT\n    day,\n    screenshot_status,\n    count()                     AS submissions,\n    sum(screenshot_bytes)       AS total_bytes\nFROM openbank_analytics.gold_screen_feedback\nGROUP BY day, screenshot_status;\n"
  0033.sql: "-- Source: V4__screen_feedback_context.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback_context AS\nSELECT\n    screen_id,\n    platform,\n    os_version,\n    theme,\n    locale,\n    countIf(category = 'BUG')   AS bugs,\n    count()                     AS submissions,\n    max(occurred_at)            AS last_seen\nFROM openbank_analytics.gold_screen_feedback\nGROUP BY screen_id, platform, os_version, theme, locale;\n"
  0034.sql: "-- Source: V5__party_accounts.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_party_accounts AS\nSELECT DISTINCT\n    JSONExtractString(payload, 'partyId') AS party_id,\n    aggregate_id                          AS account_id\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'ACCOUNT'\n  AND JSONExtractString(payload, 'partyId') != '';\n"
  0035.sql: "-- Source: V7__fold_aggregate_type_case.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_campaign_engagement AS\nSELECT\n    JSONExtractString(payload, 'campaignId') AS campaign_id,\n    JSONExtractUInt(payload, 'stepOrder')     AS step_order,\n    JSONExtractString(payload, 'channel')    AS channel,\n    uniqExactIf(event_id, event_type = 'EngagementEvent.IMPRESSION') AS impressions,\n    uniqExactIf(event_id, event_type = 'EngagementEvent.CLICK')      AS clicks,\n    uniqExactIf(event_id, event_type = 'EngagementEvent.DISMISS')    AS dismissals,\n    min(occurred_at) AS first_observed_at,\n    max(occurred_at) AS last_observed_at\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'ENGAGEMENT'\n  AND JSONExtractString(payload, 'campaignId') != ''\n  AND JSONHas(payload, 'stepOrder')\n  AND JSONExtractString(payload, 'channel') IN ('PUSH', 'BANNER')\nGROUP BY campaign_id, step_order, channel;\n"
  0036.sql: "-- Source: V10__party_credit_profile.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_party_monthly_flows AS\nSELECT\n    party_id,\n    month,\n    sum(inbound)  AS inbound_amount,\n    sum(outbound) AS outbound_amount,\n    count()       AS movement_count\nFROM\n(\n    SELECT\n        pa.party_id                                                        AS party_id,\n        toStartOfMonth(e.occurred_at)                                      AS month,\n        toDecimal64(JSONExtractString(e.payload, 'amount'), 2)             AS inbound,\n        toDecimal64('0', 2)                                                AS outbound\n    FROM openbank_analytics.bronze_events AS e\n    INNER JOIN openbank_analytics.silver_party_accounts AS pa\n        ON pa.account_id = JSONExtractString(e.payload, 'targetAccountId')\n    WHERE upper(e.aggregate_type) = 'TRANSACTION'\n      AND JSONExtractString(e.payload, 'targetAccountId') != ''\n      AND JSONExtractString(e.payload, 'amount') != ''\n\n    UNION ALL\n\n    SELECT\n        pa.party_id                                                        AS party_id,\n        toStartOfMonth(e.occurred_at)                                      AS month,\n        toDecimal64('0', 2)                                                AS inbound,\n        toDecimal64(JSONExtractString(e.payload, 'amount'), 2)             AS outbound\n    FROM openbank_analytics.bronze_events AS e\n    INNER JOIN openbank_analytics.silver_party_accounts AS pa\n        ON pa.account_id = JSONExtractString(e.payload, 'sourceAccountId')\n    WHERE upper(e.aggregate_type) = 'TRANSACTION'\n      AND JSONExtractString(e.payload, 'sourceAccountId') != ''\n      AND JSONExtractString(e.payload, 'amount') != ''\n)\nGROUP BY party_id, month;\n"
  0037.sql: "-- Source: V10__party_credit_profile.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_party_credit_profile AS\nSELECT\n    party_id,\n    count()                                                     AS months_observed,\n    quantileExact(0.5)(inbound_amount)                          AS income_monthly,\n    quantileExact(0.5)(outbound_amount)                         AS outflow_monthly,\n    quantileExact(0.5)(inbound_amount - outbound_amount)        AS net_monthly,\n    \n\n    \n\n    if(quantileExact(0.5)(inbound_amount) > 0,\n       stddevPop(inbound_amount - outbound_amount) / quantileExact(0.5)(inbound_amount),\n       NULL)                                                    AS volatility_ratio,\n    sum(movement_count)                                         AS movements_observed\nFROM openbank_analytics.silver_party_monthly_flows\nWHERE month >= toStartOfMonth(now()) - INTERVAL 6 MONTH\n  AND month <  toStartOfMonth(now())\nGROUP BY party_id;\n"
  0038.sql: "-- Source: V11__credit_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_credit_funnel_events AS\nSELECT\n    JSONExtractString(payload, 'partyId') AS party_id,\n    JSONExtractString(payload, 'step')    AS step,\n    JSONExtractString(payload, 'action')  AS action,\n    occurred_at\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'CREDIT_FUNNEL'\n  AND JSONExtractString(payload, 'partyId') != '';\n"
  0039.sql: "-- Source: V11__credit_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_credit_consent_activation AS\nSELECT\n    toStartOfDay(occurred_at)                                        AS day,\n    countIf(action = 'VIEWED' AND step = 'CONSENT')                  AS consent_screen_views,\n    countIf(action = 'CONSENT_GRANTED')                              AS granted,\n    countIf(action = 'CONSENT_WITHDRAWN')                            AS withdrawn,\n    uniqExactIf(party_id, action = 'CONSENT_GRANTED')                AS parties_granted,\n    uniqExactIf(party_id, action = 'CONSENT_WITHDRAWN')              AS parties_withdrawn\nFROM openbank_analytics.gold_credit_funnel_events\nGROUP BY day;\n"
  0040.sql: "-- Source: V11__credit_funnel.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_credit_quote_outcomes AS\nSELECT\n    toStartOfDay(occurred_at)                        AS day,\n    countIf(action = 'QUOTE_REQUESTED')              AS requested,\n    countIf(action = 'QUOTE_SUPPRESSED')             AS suppressed,\n    countIf(action = 'APPLICATION_STARTED')          AS applications_started,\n    countIf(action = 'APPLICATION_ABANDONED')        AS applications_abandoned\nFROM openbank_analytics.gold_credit_funnel_events\nGROUP BY day;\n"
  0041.sql: "-- Source: V17__party_attribution_coverage.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_party_events AS\n\n\nSELECT\n    if(\n        JSONExtractString(s.payload, 'partyId') != '',\n        JSONExtractString(s.payload, 'partyId'),\n        JSONExtractString(s.payload, 'initiatedByPartyId')\n    )                                       AS party_id,\n    upper(s.aggregate_type)                 AS aggregate_type,\n    s.aggregate_id,\n    s.event_id,\n    s.event_type,\n    s.occurred_at,\n    s.source_service,\n    s.payload\nFROM openbank_analytics.silver_current_state AS s\nWHERE JSONExtractString(s.payload, 'partyId') != ''\n   OR JSONExtractString(s.payload, 'initiatedByPartyId') != ''\n\nUNION ALL\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nSELECT\n    pa.party_id                             AS party_id,\n    upper(s.aggregate_type)                 AS aggregate_type,\n    s.aggregate_id,\n    s.event_id,\n    s.event_type,\n    s.occurred_at,\n    s.source_service,\n    s.payload\nFROM openbank_analytics.silver_current_state AS s\nINNER JOIN openbank_analytics.silver_party_accounts AS pa\n    ON pa.account_id = if(\n        upper(s.aggregate_type) = 'TRANSACTION',\n        JSONExtractString(s.payload, 'sourceAccountId'),\n        s.aggregate_id\n    )\nWHERE upper(s.aggregate_type) IN ('ACCOUNT', 'TRANSACTION')\n  AND JSONExtractString(s.payload, 'partyId') = ''\n  AND JSONExtractString(s.payload, 'initiatedByPartyId') = '';\n"
  0042.sql: "-- Source: V12__party_event_profile.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_party_event_profile AS\nSELECT\n    party_id,\n    count()                                    AS events_observed,\n    uniqExact(aggregate_id)                    AS aggregates_observed,\n    \n\n    \n\n    \n\n    uniqExactIf(aggregate_id, upper(aggregate_type) = 'ACCOUNT')      AS accounts_observed,\n    uniqExact(aggregate_type)                  AS domains_observed,\n    min(occurred_at)                           AS first_seen_at,\n    max(occurred_at)                           AS last_seen_at,\n    \n\n    \n\n    \n\n    dateDiff('day', max(occurred_at), now())   AS days_since_last_event,\n    arraySort(groupUniqArray(aggregate_type))  AS domains\nFROM openbank_analytics.silver_party_events\nGROUP BY party_id;\n"
  0043.sql: "-- Source: V12__party_event_profile.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_party_domain_activity AS\nSELECT\n    party_id,\n    aggregate_type,\n    count()                                                   AS events_observed,\n    argMax(event_type, occurred_at)                           AS last_event_type,\n    max(occurred_at)                                          AS last_occurred_at\nFROM openbank_analytics.silver_party_events\nGROUP BY party_id, aggregate_type;\n"
  0044.sql: "-- Source: V13__settled_transactions.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_settled_transactions AS\nSELECT\n    c.aggregate_id                                          AS transaction_id,\n    c.occurred_at                                           AS settled_at,\n    toStartOfMonth(c.occurred_at)                           AS settled_month,\n    toDecimal64OrNull(JSONExtractString(i.payload, 'amount'), 2) AS amount,\n    JSONExtractString(i.payload, 'currencyCode')            AS currency_code,\n    JSONExtractString(i.payload, 'type')                    AS transaction_type,\n    JSONExtractString(i.payload, 'instructionType')         AS instruction_type,\n    \n\n    \n\n    JSONExtractString(i.payload, 'rail')                    AS rail,\n    JSONExtractString(i.payload, 'sourceAccountId')         AS source_account_id,\n    JSONExtractString(i.payload, 'targetAccountId')         AS target_account_id,\n    JSONExtractString(i.payload, 'initiatedByPartyId')      AS initiated_by_party_id,\n    i.occurred_at                                           AS initiated_at\nFROM\n(\n    SELECT aggregate_id, occurred_at\n    FROM openbank_analytics.bronze_events\n    WHERE upper(aggregate_type) = 'TRANSACTION' AND event_type = 'TransactionCompleted'\n) AS c\nINNER JOIN\n(\n    SELECT aggregate_id, occurred_at, payload\n    FROM openbank_analytics.bronze_events\n    WHERE upper(aggregate_type) = 'TRANSACTION' AND event_type = 'TransactionInitiated'\n) AS i\n    ON i.aggregate_id = c.aggregate_id;\n"
  0045.sql: "-- Source: V13__settled_transactions.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_party_settled_spend AS\nSELECT\n    party_id,\n    settled_month,\n    countIf(direction = 'OUT')                 AS outbound_count,\n    sumIf(amount, direction = 'OUT')           AS outbound_amount,\n    countIf(direction = 'IN')                  AS inbound_count,\n    sumIf(amount, direction = 'IN')            AS inbound_amount,\n    uniqExact(transaction_id)                  AS settled_transactions\nFROM\n(\n    SELECT pa.party_id AS party_id, t.settled_month, t.amount, t.transaction_id, 'OUT' AS direction\n    FROM openbank_analytics.silver_settled_transactions AS t\n    INNER JOIN openbank_analytics.silver_party_accounts AS pa ON pa.account_id = t.source_account_id\n\n    UNION ALL\n\n    SELECT pa.party_id AS party_id, t.settled_month, t.amount, t.transaction_id, 'IN' AS direction\n    FROM openbank_analytics.silver_settled_transactions AS t\n    INNER JOIN openbank_analytics.silver_party_accounts AS pa ON pa.account_id = t.target_account_id\n)\nGROUP BY party_id, settled_month;\n"
  0046.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_credit_decisions AS\nSELECT\n    aggregate_id                                          AS loan_application_id,\n    JSONExtractString(payload, 'partyId')                 AS party_id,\n    occurred_at                                           AS decided_at,\n    toStartOfDay(occurred_at)                             AS decided_day,\n    toStartOfMonth(occurred_at)                           AS decided_month,\n    JSONExtractString(payload, 'outcome')                 AS outcome,\n    JSONExtractString(payload, 'priceBand')               AS price_band,\n    \n\n    JSONExtractString(payload, 'reasons')                 AS reasons,\n    JSONExtractString(payload, 'matchedRuleIds')          AS matched_rule_ids,\n    JSONExtractString(payload, 'policyVersions')          AS policy_versions,\n    JSONExtractString(payload, 'inputSnapshotHash')       AS input_snapshot_hash,\n    JSONExtractInt(payload, 'packVersion')                AS pack_version\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'LOAN_APPLICATION'\n  AND event_type = 'credit.decision.evaluated'\n  AND synthetic = 0;\n"
  0047.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_credit_decision_outcomes AS\nSELECT\n    decided_day                                    AS day,\n    countIf(outcome = 'APPROVE')                   AS approved,\n    countIf(outcome = 'REFER')                     AS referred,\n    countIf(outcome = 'DECLINE')                   AS declined,\n    count()                                        AS evaluated,\n    uniqExact(party_id)                            AS parties_evaluated,\n    countIf(outcome = 'APPROVE' AND price_band = 'PRIME')    AS approved_prime,\n    countIf(outcome = 'APPROVE' AND price_band = 'STANDARD') AS approved_standard\nFROM openbank_analytics.silver_credit_decisions\nGROUP BY day;\n"
  0048.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_credit_decision_reasons AS\nSELECT\n    decided_month                                                  AS month,\n    outcome,\n    splitByChar(':', reason)[1]                                    AS reason_code,\n    if(splitByChar(':', reason)[2] IN ('', '-'), '', splitByChar(':', reason)[2]) AS rule_id,\n    count()                                                        AS occurrences,\n    uniqExact(loan_application_id)                                 AS applications\nFROM openbank_analytics.silver_credit_decisions\nARRAY JOIN splitByChar(',', reasons) AS reason\nWHERE reason != ''\nGROUP BY month, outcome, reason_code, rule_id;\n"
  0049.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_credit_policy_versions AS\nSELECT\n    decided_month            AS month,\n    policy_versions,\n    pack_version,\n    countIf(outcome = 'APPROVE')  AS approved,\n    countIf(outcome = 'REFER')    AS referred,\n    countIf(outcome = 'DECLINE')  AS declined,\n    count()                       AS evaluated,\n    min(decided_at)               AS first_seen,\n    max(decided_at)               AS last_seen\nFROM openbank_analytics.silver_credit_decisions\nGROUP BY month, policy_versions, pack_version;\n"
  0050.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_loans AS\nSELECT\n    aggregate_id                                             AS loan_id,\n    JSONExtractString(payload, 'partyId')                    AS party_id,\n    occurred_at                                              AS disbursed_at,\n    toStartOfMonth(occurred_at)                              AS vintage_month,\n    JSONExtractString(payload, 'principal')                  AS principal_raw\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'LOAN'\n  AND event_type = 'loan.disbursed'\n  AND synthetic = 0;\n"
  0051.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_loan_stage_transitions AS\nSELECT\n    aggregate_id                                       AS loan_id,\n    JSONExtractString(payload, 'partyId')              AS party_id,\n    occurred_at                                        AS changed_at,\n    JSONExtractString(payload, 'period')               AS period,\n    JSONExtractString(payload, 'previousStage')        AS previous_stage,\n    JSONExtractString(payload, 'newStage')             AS new_stage,\n    JSONExtractInt(payload, 'daysPastDue')             AS days_past_due\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'LOAN'\n  AND event_type = 'loan.stage_changed'\n  AND synthetic = 0;\n"
  0052.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_loan_stage_migration AS\nSELECT\n    period,\n    previous_stage,\n    new_stage,\n    count()                    AS transitions,\n    uniqExact(loan_id)         AS loans,\n    uniqExact(party_id)        AS parties,\n    \n\n    \n\n    countIf(new_stage > previous_stage) AS deteriorations,\n    countIf(new_stage < previous_stage) AS cures\nFROM openbank_analytics.silver_loan_stage_transitions\nGROUP BY period, previous_stage, new_stage;\n"
  0053.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_loan_provisioning AS\nSELECT\n    aggregate_id                                                     AS loan_id,\n    JSONExtractString(payload, 'partyId')                            AS party_id,\n    JSONExtractString(payload, 'period')                             AS period,\n    occurred_at                                                      AS provisioned_at,\n    JSONExtractString(payload, 'stage')                              AS stage,\n    toDecimal64OrNull(JSONExtractString(payload, 'expectedCreditLoss'), 2) AS expected_credit_loss,\n    toDecimal64OrNull(JSONExtractString(payload, 'delta'), 2)        AS ecl_delta\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'LOAN'\n  AND event_type = 'loan.provisioned'\n  AND synthetic = 0;\n"
  0054.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_loan_provisioning_by_stage AS\nSELECT\n    period,\n    stage,\n    uniqExact(loan_id)          AS loans,\n    sum(expected_credit_loss)   AS expected_credit_loss,\n    sum(ecl_delta)              AS ecl_movement\nFROM openbank_analytics.silver_loan_provisioning\nGROUP BY period, stage;\n"
  0055.sql: "-- Source: V14__credit_lifecycle.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_loan_vintage AS\nSELECT\n    l.vintage_month                                        AS vintage_month,\n    count()                                                AS loans,\n    countIf(worst_stage = '')                              AS never_migrated,\n    countIf(worst_stage = 'STAGE_2')                       AS reached_stage_2,\n    countIf(worst_stage = 'STAGE_3')                       AS reached_stage_3,\n    countIf(max_dpd > 90)                                  AS ever_90_plus_dpd\nFROM\n(\n    SELECT loan_id, party_id, vintage_month\n    FROM openbank_analytics.silver_loans\n) AS l\nLEFT JOIN\n(\n    SELECT\n        loan_id,\n        max(new_stage)      AS worst_stage,\n        max(days_past_due)  AS max_dpd\n    FROM openbank_analytics.silver_loan_stage_transitions\n    GROUP BY loan_id\n) AS s\n    ON s.loan_id = l.loan_id\nGROUP BY vintage_month;\n"
  0056.sql: "-- Source: V15__reporting_gold.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_risk_settled_transactions AS\nSELECT\n    transaction_id,\n    settled_at,\n    toDate(settled_at) AS settled_day,\n    settled_month,\n    amount,\n    currency_code,\n    transaction_type,\n    instruction_type,\n    rail,\n    source_account_id,\n    target_account_id,\n    initiated_by_party_id,\n    initiated_at\nFROM openbank_analytics.silver_settled_transactions;\n"
  0057.sql: "-- Source: V15__reporting_gold.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_risk_settlement_daily AS\nSELECT\n    settled_day              AS day,\n    currency_code,\n    rail,\n    count()                  AS settled_count,\n    sum(amount)              AS settled_amount,\n    max(amount)              AS largest_amount,\n    uniqExact(transaction_id) AS distinct_transactions\nFROM openbank_analytics.gold_risk_settled_transactions\nGROUP BY day, currency_code, rail;\n"
  0058.sql: "-- Source: V15__reporting_gold.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_risk_failures_daily AS\nSELECT\n    toDate(occurred_at)      AS day,\n    count()                  AS failed_count,\n    uniqExact(aggregate_id)  AS distinct_transactions\nFROM openbank_analytics.bronze_events\nWHERE upper(aggregate_type) = 'TRANSACTION'\n  AND event_type = 'TransactionFailed'\nGROUP BY day;\n"
  0059.sql: "-- Source: V15__reporting_gold.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_risk_event_volume_daily AS\nSELECT\n    toDate(occurred_at)      AS day,\n    upper(aggregate_type)    AS aggregate_type,\n    count()                  AS events,\n    uniqExact(aggregate_id)  AS distinct_aggregates,\n    max(occurred_at)         AS last_event_at\nFROM openbank_analytics.bronze_events\nGROUP BY day, aggregate_type;\n"
  0060.sql: "-- Source: V17__party_attribution_coverage.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.silver_party_activity AS\nSELECT\n    if(\n        JSONExtractString(h.payload, 'partyId') != '',\n        JSONExtractString(h.payload, 'partyId'),\n        JSONExtractString(h.payload, 'initiatedByPartyId')\n    )                                       AS party_id,\n    upper(h.aggregate_type)                 AS aggregate_type,\n    h.aggregate_id,\n    h.aggregate_version,\n    h.event_type,\n    h.valid_from                            AS occurred_at,\n    h.payload\nFROM openbank_analytics.silver_history AS h\nWHERE JSONExtractString(h.payload, 'partyId') != ''\n   OR JSONExtractString(h.payload, 'initiatedByPartyId') != ''\n\nUNION ALL\n\nSELECT\n    pa.party_id                             AS party_id,\n    upper(h.aggregate_type)                 AS aggregate_type,\n    h.aggregate_id,\n    h.aggregate_version,\n    h.event_type,\n    h.valid_from                            AS occurred_at,\n    h.payload\nFROM openbank_analytics.silver_history AS h\nINNER JOIN openbank_analytics.silver_party_accounts AS pa\n    ON pa.account_id = if(\n        upper(h.aggregate_type) = 'TRANSACTION',\n        JSONExtractString(h.payload, 'sourceAccountId'),\n        h.aggregate_id\n    )\nWHERE upper(h.aggregate_type) IN ('ACCOUNT', 'TRANSACTION')\n  AND JSONExtractString(h.payload, 'partyId') = ''\n  AND JSONExtractString(h.payload, 'initiatedByPartyId') = '';\n"
  0061.sql: "-- Source: V17__party_attribution_coverage.sql; final authoritative definition, not historical replay.\nCREATE OR REPLACE VIEW openbank_analytics.gold_party_attribution_coverage AS\nSELECT\n    aggregate_type,\n    count()                                                          AS events,\n    uniqExact(aggregate_id)                                          AS aggregates,\n    countIf(owner_known)                                             AS events_attributed,\n    uniqExactIf(aggregate_id, owner_known)                           AS aggregates_attributed,\n    count() - countIf(owner_known)                                   AS events_unattributed,\n    uniqExact(aggregate_id) - uniqExactIf(aggregate_id, owner_known) AS aggregates_unattributed\nFROM (\n    SELECT\n        upper(b.aggregate_type) AS aggregate_type,\n        b.aggregate_id          AS aggregate_id,\n        (\n            JSONExtractString(b.payload, 'partyId') != ''\n            OR JSONExtractString(b.payload, 'initiatedByPartyId') != ''\n            OR if(\n                upper(b.aggregate_type) = 'TRANSACTION',\n                JSONExtractString(b.payload, 'sourceAccountId'),\n                b.aggregate_id\n            ) IN (SELECT account_id FROM openbank_analytics.silver_party_accounts)\n        )                       AS owner_known\n    FROM openbank_analytics.bronze_events AS b\n    WHERE upper(b.aggregate_type) IN ('ACCOUNT', 'TRANSACTION')\n)\nGROUP BY aggregate_type;\n"
