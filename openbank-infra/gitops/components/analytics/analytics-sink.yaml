# openbank-analytics-sink: Kafka → ClickHouse bronze/silver/gold projection (ADR-0022).
#
# Consumes the domain-event stream (analytics-events-in → 10 topics) and writes the PII-masked
# bronze layer into ClickHouse. The ClickHouse sink binding is baked at BUILD time
# (@IfBuildProperty openbank.analytics.sink.type=clickhouse — the image is built with
# ANALYTICS_SINK_TYPE=clickhouse); CLICKHOUSE_URL below points it at the in-namespace ClickHouse.
#
# Kafka mTLS (ADR-0137) + group.id/auto.offset.reset are supplied via the override.properties
# ConfigMap mounted through QUARKUS_CONFIG_LOCATIONS — NOT env vars, because SmallRye's env-var
# reverse-mapping is ambiguous for the hyphenated channel name `analytics-events-in` (issue #686).
# Keystore/truststore PKCS#12 are projected from `messaging` by External Secrets
# (kafka-analytics-sink-mtls.yaml) and mounted below; their passwords come via secretKeyRef.
#
# OIDC is disabled: the only REST surface (erasure/backfill admin endpoints) is not exercised by the
# ingest pipeline, so the sink does not need a Keycloak client to run as a consumer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-sink-msg-override
  namespace: analytics
data:
  override.properties: |
    kafka.bootstrap.servers=openbank-cluster-kafka-bootstrap.messaging.svc:9093
    kafka.security.protocol=SSL
    kafka.ssl.keystore.location=/mnt/kafka/keystore/user.p12
    kafka.ssl.keystore.type=PKCS12
    kafka.ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD}
    kafka.ssl.truststore.location=/mnt/kafka/truststore/ca.p12
    kafka.ssl.truststore.type=PKCS12
    kafka.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
    mp.messaging.incoming.analytics-events-in.group.id=analytics-sink
    mp.messaging.incoming.analytics-events-in.auto.offset.reset=earliest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-sink
  namespace: analytics
  labels:
    app.kubernetes.io/name: analytics-sink
    app.kubernetes.io/part-of: openbank
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-sink
        app.kubernetes.io/part-of: openbank
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-sink
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-analytics-sink:sandbox-ee41caf6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8134
            - name: management
              containerPort: 8086
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8134"
            - name: QUARKUS_OIDC_ENABLED
              value: "false"
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
            - name: ANALYTICS_SINK_TYPE
              value: clickhouse
            - name: CLICKHOUSE_URL
              value: http://clickhouse.analytics.svc:8123
            - name: CLICKHOUSE_DB
              value: openbank_analytics
            - name: CLICKHOUSE_USER
              value: analytics
            # The ClickHouse `analytics` user password. The clickhouse-auth Secret is provisioned
            # out-of-band (not committed — public repo); ClickHouse creates the matching user at first
            # boot from the same Secret (see clickhouse.yaml). Rotate by updating the Secret + user.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-sink-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: analytics-sink-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: analytics-sink-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-sink
  namespace: analytics
  labels:
    app.kubernetes.io/name: analytics-sink
    app.kubernetes.io/part-of: openbank
spec:
  selector:
    app.kubernetes.io/name: analytics-sink
  ports:
    - name: http
      port: 8134
      targetPort: http
    - name: management
      port: 8086
      targetPort: management
