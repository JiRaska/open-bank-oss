# analytics-sink OIDC client secret from Vault → analytics-sink-oidc Secret
# (key OIDC_CLIENT_SECRET), shared openbank-services realm client. creationPolicy
# Owner: ESO creates/owns and re-creates the Secret (mirrors es-balance-service-oidc).
#
# Reads the SHARED KV entry `account-service`, so there is no per-service seed step — one realm
# client, one entry (#3485, rules.yaml: oidc_secret_convention).
#
# Consumed by the INITIAL_LOAD backfill's registry sweep, which mints a client_credentials token to
# call account-service's staff/service fleet endpoint. The env ref is optional:false on purpose: a
# credential allowed to be missing does not degrade gracefully, it sends UNAUTHENTICATED requests
# and the 401 that follows is indistinguishable from having no client configured at all (#2929).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analytics-sink-oidc
  namespace: analytics
  annotations:
    # ADR-0279 WS4 #18: a long-lived credential without a rotate-by date is an immortal one.
    #
    # READ THIS AS A REVIEW-BY DATE FOR THE SHARED ENTRY, NOT A PRIVATE ROTATION. The remoteRef
    # below reads the SHARED `account-service` KV entry — one realm client, one entry (#3485) — so
    # rotating it rotates for every service that pulls it, and doing so unilaterally on this date
    # would break them all. What is due on this date is the review: confirm the shared client secret
    # has been rotated fleet-wide since, or schedule that rotation as one coordinated change.
    openbank.io/rotation-deadline: "2027-09-06"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: analytics-sink-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 5: analytics-sink's OWN Keycloak client `openbank-analytics-sink` (ROLE_API only), used ONLY
# by AccountRegistryClient (named oidc-client `m2m`). KV layout is ADR-0099's `openbank/keycloak/<service>`,
# written once by the owner's provisioning script (runbook 0009); nothing in this repo holds the value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analytics-sink-m2m-oidc
  namespace: analytics
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: analytics-sink-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/analytics-sink
        property: client_secret
