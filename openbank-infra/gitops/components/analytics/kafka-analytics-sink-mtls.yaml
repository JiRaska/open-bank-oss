# Kafka mTLS identity + ACLs for analytics-sink (ADR-0022 / ADR-0137 fleet gate).
#
# analytics-sink consumes the domain-event stream into the ClickHouse bronze layer. It has ONE
# incoming channel (analytics-events-in) subscribed to nine topics; it never produces. The broker
# runs allow.everyone.if.no.acl.found=false, so it needs a KafkaUser with Read on each topic + the
# consumer group (the channel's topic list is the source of truth; keep the ACLs below in step).
# consumer group. Identity model (ADR-0137): one KafkaUser = one mTLS cert = one principal; the
# Strimzi User Operator mints a per-user Secret in `messaging`, projected into `analytics` by the
# ExternalSecrets below (same pattern as kafka-onboarding-mtls.yaml / kafka-customer-edge-mtls.yaml).
# The eso-kafka-cert-reader Role in `messaging` is resourceNames-scoped — analytics-sink is added to
# its allow-list in components/payments/kafka-scheme-accepted-acl.yaml.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: analytics-sink
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Read-only consumer across the analytics ingest topics (analytics-sink application.yaml
      # `topics:` list). Describe is required alongside Read for metadata/offset fetch.
      #
      # These two carried the dead names `openbank.account.events` / `openbank.transaction.events`
      # (issue #2598). #2629 corrected the SUBSCRIPTION to the real topics but left this list
      # behind, so the sink asked for topics its own principal had no Read on — the second half of
      # the same drift, and just as quiet: an authorization failure here is a retry loop in the
      # consumer, never a red pod. `check-kafka-acl-coverage.py` now derives this list from the
      # service's own channel config so the two cannot disagree again.
      - resource: { type: topic, name: openbank.accounts.account.created, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.transactions.transaction.initiated, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.balance.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.party.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.kyc.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.consent.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.sca.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.documents.document.event, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: topic, name: openbank.onboarding.funnel.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      # ADR-0192 in-app screen feedback (metadata + screenshot object key; never image bytes).
      - resource: { type: topic, name: openbank.feedback.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      # Privacy-safe campaign attribution: server-resolved campaign/step/channel plus app action.
      - resource: { type: topic, name: openbank.engagement.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      # MGM qualification and reward lifecycle, projected idempotently by eventId.
      - resource: { type: topic, name: openbank.referral.events, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: group, name: analytics-sink, patternType: literal }
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `analytics-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.analytics-sink.analytics-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: analytics-sink-kafka-keystore
  namespace: analytics
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: analytics-sink-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: analytics-sink
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: analytics
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
