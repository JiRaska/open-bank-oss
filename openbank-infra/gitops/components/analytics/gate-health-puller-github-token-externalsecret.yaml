#
# Read-only GitHub token for the gate-health puller CronJob (ADR-0255 Tier 2). Same
# Vault-backed ExternalSecret pattern as clickhouse-auth-externalsecret.yaml.
#
# SCOPE: a fine-grained PAT limited to THIS repository only, "Actions" repository
# permission set to Read-only, nothing else. This is the ONLY credential in the fleet that
# calls the GitHub REST API from inside the cluster — every other GitHub-API caller in this
# repo (the CI gates, the `gh` CLI in workflows) runs as a GitHub Actions job with an
# ephemeral GITHUB_TOKEN that never leaves that job. A long-lived, cluster-resident PAT is a
# categorically different risk (it does not expire when a job ends), so its scope must not
# creep — if a future feature needs more than Actions:read, it needs a NEW, separately-scoped
# secret, not a widened grant on this one.
#
# Seed with: bao kv put openbank/ci-gate-health-puller GITHUB_TOKEN=<fine-grained PAT>
# Rotation: fine-grained PATs expire (GitHub caps them at 1 year); this repo has no automated
# rotation for it yet — track the expiry date wherever the fleet's other manual-rotation
# credentials are tracked, and treat a puller CronJob going `available:false` with a 401 as
# the first symptom of an expired token, not a GitHub outage.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gate-health-puller-github-token
  namespace: analytics
  labels:
    app.kubernetes.io/part-of: analytics
    app.kubernetes.io/component: ci-gate-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: gate-health-puller-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: ci-gate-health-puller
        property: GITHUB_TOKEN
