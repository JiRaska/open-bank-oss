# ClickHouse `analytics` user password, projected from Vault (KV mount openbank/, path
# analytics-sink, field CLICKHOUSE_PASSWORD) into the analytics namespace. Consumed by BOTH the
# ClickHouse StatefulSet (creates the user at first boot) and analytics-sink (authenticates with it).
# Never committed in plaintext — same Vault-backed ExternalSecret pattern as onboarding's
# oidc-externalsecret.yaml. Seed with: bao kv put openbank/analytics-sink CLICKHOUSE_PASSWORD=<pw>.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-auth
  namespace: analytics
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: clickhouse-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: analytics-sink
        property: CLICKHOUSE_PASSWORD
