  01-bronze-silver.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- OpenBank analytics warehouse schema (ADR-0022).
    --
    -- This is the ClickHouse target the openbank-analytics-sink writes into. It is applied by an
    -- operator (or the future ClickHouseAnalyticsSink bootstrap) — NOT by Flyway, because this service
    -- owns no OLTP database. The file is the source-controlled DDL of record for the warehouse.
    --
    -- Layering (medallion):
    --   bronze  = append-only, replayable log of EVERY domain event (the log of record, kept >=10y)
    --   silver  = current-state-per-aggregate, derived from bronze (last-writer-wins)
    --
    -- Consistency model: Kafka is at-least-once, so bronze MAY contain duplicates (same event_id) and
    -- multiple versions per aggregate. ReplacingMergeTree(aggregate_version) collapses them at merge /
    -- with FINAL, exactly mirroring AnalyticsProjections.latestPerAggregate in openbank-libs so the
    -- in-app reconciliation job and the warehouse compute the SAME current-state view.

    CREATE DATABASE IF NOT EXISTS openbank_analytics;

    -- ---------------------------------------------------------------------------------------------
    -- BRONZE: the log of record. Append-only, one row per ingested envelope (duplicates tolerated).
    -- ---------------------------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS openbank_analytics.bronze_events
    (
        event_id          UUID,
        aggregate_type    LowCardinality(String),
        aggregate_id      String,
        aggregate_version Int64,
        event_type        LowCardinality(String),
        occurred_at       DateTime64(3, 'UTC'),
        source_service    LowCardinality(String),
        schema_version    UInt16,
        actor_id          Nullable(String),
        actor_type        Nullable(String),
        trace_id          Nullable(String),
        -- Lineage: how this row entered bronze (STREAM | INITIAL_LOAD | BACKFILL | CORRECTION) and, for
        -- non-STREAM ingests, which reload batch produced it. Lets an auditor distinguish a live event
        -- from a row reloaded by a corrected batch, and lets a specific batch be traced/superseded.
        ingest_source     LowCardinality(String) DEFAULT 'STREAM',
        batch_id          Nullable(String),
        ingested_at       DateTime64(3, 'UTC') DEFAULT now64(3),
        -- Tamper-evidence (ADR-0023 F1+F2): deterministic SHA-256 over the row's identity + business
        -- content (AnalyticsIntegrity.recordHash). Bronze is operator-mutable, so this hash — committed
        -- into a Merkle root sealed in the WORM integrity_anchors table — is what proves a row was not
        -- altered or dropped after write. Recompute and compare to detect tampering.
        record_hash       String DEFAULT '',
        -- PII-masked event body (masked at the sink — NEVER raw PII). JSON for schema evolution over
        -- the 10y horizon; individual silver projections extract typed columns as needed.
        payload           String
    )
    ENGINE = ReplacingMergeTree(aggregate_version)
    -- Last-writer-wins key matches (aggregateType, aggregateId) in AnalyticsProjections; event_id keeps
    -- distinct events within an aggregate version distinguishable for exact dedupe.
    ORDER BY (aggregate_type, aggregate_id, event_id)
    PARTITION BY toYYYYMM(occurred_at)
    -- Retention floor: the bronze layer is the log of record and MUST be retained at least the
    -- regulatory minimum (AnalyticsRetention.BRONZE_MINIMUM = 10 years). This is the FLOOR, not the
    -- ceiling — raise it, never lower it. Deleting bronze is irreversible and forfeits recompute/reconcile.
    TTL toDateTime(occurred_at) + INTERVAL 10 YEAR
    SETTINGS index_granularity = 8192;

    -- Idempotency / dedupe helper: lets the sink and reconciliation cheaply ask "have I seen event_id?"
    ALTER TABLE openbank_analytics.bronze_events
        ADD INDEX IF NOT EXISTS idx_event_id (event_id) TYPE bloom_filter GRANULARITY 4;

    -- ---------------------------------------------------------------------------------------------
    -- SILVER: current state per aggregate. A VIEW over bronze using argMax = last-writer-wins by
    -- (aggregate_version, occurred_at, ingested_at), the SAME tie-break order as the LATEST comparator
    -- in AnalyticsProjections. A view (not a second table) keeps storage single-copy and always
    -- consistent with bronze; promote to a materialized/AggregatingMergeTree table only if read latency
    -- demands it.
    -- ---------------------------------------------------------------------------------------------
    -- NOTE: the source columns inside the aggregates are table-qualified (b.*). The output column
    -- `max(aggregate_version) AS aggregate_version` (and `... AS occurred_at`) would otherwise collide
    -- with the bare `aggregate_version` / `occurred_at` used in the argMax ordering tuples — ClickHouse
    -- resolves a bare identifier to the same-named SELECT alias, nesting max() inside argMax() and failing
    -- with ILLEGAL_AGGREGATION (code 184). Qualifying forces resolution to the physical bronze column.
    CREATE VIEW IF NOT EXISTS openbank_analytics.silver_current_state AS
    SELECT
        b.aggregate_type,
        b.aggregate_id,
        argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at))       AS event_id,
        max(b.aggregate_version)                                                      AS aggregate_version,
        argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at))     AS event_type,
        argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at))    AS occurred_at,
        argMax(b.source_service, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS source_service,
        argMax(b.schema_version, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS schema_version,
        argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at))        AS payload
    FROM openbank_analytics.bronze_events AS b
    GROUP BY b.aggregate_type, b.aggregate_id;

    -- ---------------------------------------------------------------------------------------------
    -- GOLD (example): a daily event-volume rollup per service/type. Gold marts are cheap to add as
    -- views/materialized views over silver|bronze and are where Metabase/Superset dashboards point,
    -- so BI never touches the operational databases.
    -- ---------------------------------------------------------------------------------------------
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_daily_event_volume AS
    SELECT
        toDate(occurred_at)  AS day,
        source_service,
        aggregate_type,
        event_type,
        count()              AS events
    FROM openbank_analytics.bronze_events
    GROUP BY day, source_service, aggregate_type, event_type;

    -- ---------------------------------------------------------------------------------------------
    -- SILVER HISTORY (SCD2): the full ordered version history per aggregate. Each row is one state in
    -- the aggregate's life; consecutive rows form the valid-from/valid-to intervals of a slowly-changing
    -- dimension. Mirrors AnalyticsProjections.history. lead() gives the next-version timestamp as the
    -- close of each interval (NULL = still current).
    -- ---------------------------------------------------------------------------------------------
    CREATE VIEW IF NOT EXISTS openbank_analytics.silver_history AS
    SELECT
        aggregate_type,
        aggregate_id,
        aggregate_version,
        event_type,
        occurred_at                                                           AS valid_from,
        leadInFrame(occurred_at) OVER (
            PARTITION BY aggregate_type, aggregate_id
            ORDER BY aggregate_version, occurred_at, ingested_at
            ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING
        )                                                                     AS valid_to,
        payload
    FROM openbank_analytics.bronze_events;

    -- AS-OF / point-in-time current state. ClickHouse parameterised view: query with
    --   SELECT * FROM openbank_analytics.silver_as_of(t = '2025-12-31 23:59:59');
    -- to get the current-state-per-aggregate as it stood at time {t} — the regulatory "report as of"
    -- cut-off. Same last-writer-wins resolution as silver, restricted to occurred_at <= {t}. Mirrors
    -- AnalyticsProjections.asOf. Because bronze is a full event log, any historical cut-off is exact.
    CREATE VIEW IF NOT EXISTS openbank_analytics.silver_as_of AS
    SELECT
        b.aggregate_type,
        b.aggregate_id,
        argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at))    AS event_id,
        max(b.aggregate_version)                                                   AS aggregate_version,
        argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at))  AS event_type,
        argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS occurred_at,
        argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at))     AS payload
    FROM openbank_analytics.bronze_events AS b
    WHERE b.occurred_at <= {t:DateTime64(3, 'UTC')}
    GROUP BY b.aggregate_type, b.aggregate_id;

    -- ---------------------------------------------------------------------------------------------
    -- DEAD-LETTER QUARANTINE: messages that could not be projected into an envelope (malformed JSON,
    -- missing field). They are NOT silently dropped — a dropped event is an invisible gap in the log of
    -- record. Idempotent on content_hash so re-delivery / replay does not duplicate rows. Once the
    -- producer is fixed, an operator replays raw_payload through the normal mapping path. Kept 1 year
    -- (operational, not the regulatory log of record).
    -- ---------------------------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS openbank_analytics.dead_letter_events
    (
        content_hash  String,
        raw_payload   String,
        error         String,
        failed_at     DateTime64(3, 'UTC') DEFAULT now64(3)
    )
    ENGINE = ReplacingMergeTree(failed_at)
    ORDER BY (content_hash)
    PARTITION BY toYYYYMM(failed_at)
    TTL toDateTime(failed_at) + INTERVAL 1 YEAR;

    -- ---------------------------------------------------------------------------------------------
    -- BACKFILL AUDIT: one row per recovery load (BACKFILL | INITIAL_LOAD | CORRECTION) — who reloaded
    -- what window and why, plus counts. Audit evidence that a gap was deliberately and traceably filled.
    -- Retained for the regulatory horizon alongside bronze.
    -- ---------------------------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS openbank_analytics.backfill_audit
    (
        batch_id       String,
        ingest_source  LowCardinality(String),
        range_from     DateTime64(3, 'UTC'),
        range_to       DateTime64(3, 'UTC'),
        aggregate_type Nullable(String),
        aggregate_id   Nullable(String),
        windows        UInt32,
        ingested       UInt64,
        deduped        UInt64,
        requested_by   String,
        reason         String,
        started_at     DateTime64(3, 'UTC'),
        finished_at    DateTime64(3, 'UTC'),
        status         LowCardinality(String)
    )
    ENGINE = MergeTree
    ORDER BY (started_at, batch_id)
    PARTITION BY toYYYYMM(started_at)
    TTL toDateTime(started_at) + INTERVAL 10 YEAR;

    -- ---------------------------------------------------------------------------------------------
    -- INTEGRITY ANCHORS (ADR-0023 F1+F2): one row per sealed batch — a Merkle root over that batch's
    -- record_hash leaves, chained to the previous anchor's hash. This table is the *minimal* structure
    -- that must live in genuinely immutable WORM storage (S3 Object Lock / append-only ledger); the
    -- bronze rows themselves stay in mutable ClickHouse. A challenge re-derives the leaf hashes from
    -- bronze and checks they still produce merkle_root. Reconciliation evidence is anchored here too
    -- (source = 'RECONCILIATION:*', merkle_root = the evidence fingerprint). Never deleted.
    --
    -- NOTE: when bound to a real WORM target this table is a *cache/queryable mirror*; the authoritative
    -- copy is the object-locked store the WormArchive adapter writes. ClickHouse cannot itself be WORM.
    -- ---------------------------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS openbank_analytics.integrity_anchors
    (
        anchor_id            String,
        merkle_root          String,
        previous_anchor_hash Nullable(String),
        record_count         UInt32,
        source               LowCardinality(String),
        sealed_at            DateTime64(3, 'UTC')
    )
    ENGINE = MergeTree
    ORDER BY (sealed_at, anchor_id)
    PARTITION BY toYYYYMM(sealed_at);
    -- No TTL: the tamper-evidence chain must outlive every record it anchors.

    -- ---------------------------------------------------------------------------------------------
    -- RELOAD PROPOSALS (ADR-0023 F3): the maker-checker decision trail for sensitive reloads. The full
    -- lifecycle (PROPOSED→APPROVED/REJECTED/WITHDRAWN→EXECUTED) is auditable: who proposed, who approved
    -- (must differ), who executed, and when. Retained alongside bronze.
    --
    -- The proposal is mutated in place as it transitions, so the engine version MUST be a per-write
    -- timestamp (updated_at), NOT proposed_at (which is constant across transitions and would make the
    -- ReplacingMergeTree collapse non-deterministic). Reads use FINAL / argMax(updated_at) to get the
    -- current state. range_*/aggregate_*/requested_by carry the wrapped BackfillRequest so it can be
    -- reconstructed faithfully.
    -- ---------------------------------------------------------------------------------------------
    CREATE TABLE IF NOT EXISTS openbank_analytics.reload_proposals
    (
        proposal_id     String,
        state           LowCardinality(String),
        ingest_source   LowCardinality(String),
        range_from      DateTime64(3, 'UTC'),
        range_to        DateTime64(3, 'UTC'),
        aggregate_type  Nullable(String),
        aggregate_id    Nullable(String),
        requested_by    String,
        proposed_by     String,
        proposed_at     DateTime64(3, 'UTC'),
        decided_by      Nullable(String),
        decided_at      Nullable(DateTime64(3, 'UTC')),
        decision_reason Nullable(String),
        executed_at     Nullable(DateTime64(3, 'UTC')),
        reason          String,
        -- Per-write timestamp; the ReplacingMergeTree version, so the latest transition always wins.
        updated_at      DateTime64(3, 'UTC') DEFAULT now64(3)
    )
    ENGINE = ReplacingMergeTree(updated_at)
    ORDER BY (proposal_id)
    PARTITION BY toYYYYMM(proposed_at)
    TTL toDateTime(proposed_at) + INTERVAL 10 YEAR;
  02-onboarding-funnel.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- Onboarding-funnel gold marts (ADR-0069 Phase 2).
    --
    -- These views sit over the generic bronze_events log and are what the admin cockpit's onboarding
    -- conversion board queries. No new table: the funnel events land in bronze like every other event
    -- (aggregate_type = 'ONBOARDING_FUNNEL', one row per app-emitted transition, keyed on the
    -- pseudonymous onboarding session id). Applied by the same operator step as V1, all IF NOT EXISTS.
    --
    -- Event grammar (payload JSON, produced by customer-edge OnboardingFunnelPublisher):
    --   step   ∈ WELCOME, IDENTITY, EMAIL, AGREEMENT, PASSKEY, SIGN   (ordered)
    --   action ∈ STEP_VIEWED, STEP_COMPLETED, HOLD_STARTED, HOLD_ABANDONED,
    --            KYC_METHOD_CHOSEN, SIGN_ATTEMPT, SIGN_SUCCESS, SIGN_FAIL

    -- Normalised, typed projection of the raw funnel events. Everything else builds on this.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_funnel_events AS
    SELECT
        aggregate_id                                  AS session_id,
        occurred_at,
        toDate(occurred_at)                           AS day,
        JSONExtractString(payload, 'step')            AS step,
        JSONExtractString(payload, 'action')          AS action,
        JSONExtractString(payload, 'kycMethod')       AS kyc_method,
        JSONExtractString(payload, 'reason')          AS reason,
        JSONExtractString(payload, 'platform')        AS platform,
        JSONExtractString(payload, 'appVersion')      AS app_version
    FROM openbank_analytics.bronze_events
    WHERE aggregate_type = 'ONBOARDING_FUNNEL';

    -- Stable step ordinal so the funnel can be walked in order (and drop-off computed between adjacent
    -- steps) regardless of the string values. A session is "cohorted" to the day it was first seen.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_step_index AS
    SELECT
        step,
        multiIf(
            step = 'WELCOME',   1,
            step = 'IDENTITY',  2,
            step = 'EMAIL',     3,
            step = 'AGREEMENT', 4,
            step = 'PASSKEY',   5,
            step = 'SIGN',      6,
            99) AS step_ordinal
    FROM (SELECT DISTINCT step FROM openbank_analytics.gold_onboarding_funnel_events);

    -- FUNNEL WIDTH per day: distinct sessions that VIEWED and that COMPLETED each step. The admin board
    -- reads this directly and computes step->step conversion and drop-off % from the viewed counts.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_funnel_daily AS
    SELECT
        day,
        step,
        multiIf(
            step = 'WELCOME',   1,
            step = 'IDENTITY',  2,
            step = 'EMAIL',     3,
            step = 'AGREEMENT', 4,
            step = 'PASSKEY',   5,
            step = 'SIGN',      6,
            99)                                                     AS step_ordinal,
        uniqExactIf(session_id, action = 'STEP_VIEWED')             AS sessions_viewed,
        -- The SIGN step never emits STEP_COMPLETED — its terminal success signal is SIGN_SUCCESS
        -- (a signature can fail, unlike the earlier steps' unconditional completion). Count that as the
        -- SIGN step's completion so a signed agreement shows as "completed" in the funnel / conversion.
        uniqExactIf(session_id, action = 'STEP_COMPLETED' OR (step = 'SIGN' AND action = 'SIGN_SUCCESS')) AS sessions_completed,
        uniqExactIf(session_id, action = 'HOLD_ABANDONED')          AS hold_abandons
    FROM openbank_analytics.gold_onboarding_funnel_events
    GROUP BY day, step;

    -- TIME ON STEP: per session+step, seconds between first view and first completion. The admin board
    -- runs quantile(0.5)(seconds_on_step) over this for the median dwell time, split by step. Only
    -- sessions that both viewed and completed the step contribute (a still-open step has no duration).
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_step_durations AS
    SELECT
        session_id,
        step,
        toDate(minIf(occurred_at, action = 'STEP_VIEWED'))         AS day,
        dateDiff(
            'second',
            minIf(occurred_at, action = 'STEP_VIEWED'),
            minIf(occurred_at, action = 'STEP_COMPLETED'))         AS seconds_on_step
    FROM openbank_analytics.gold_onboarding_funnel_events
    WHERE action IN ('STEP_VIEWED', 'STEP_COMPLETED')
    GROUP BY session_id, step
    HAVING countIf(action = 'STEP_VIEWED') > 0
       AND countIf(action = 'STEP_COMPLETED') > 0
       AND seconds_on_step >= 0;

    -- SIGN OUTCOMES: the tail everyone cares about — attempts vs successes vs failures at the final
    -- framework-agreement signature, plus the machine reason for each failure so the board can rank why.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_sign_outcomes AS
    SELECT
        day,
        countIf(action = 'SIGN_ATTEMPT')                           AS attempts,
        countIf(action = 'SIGN_SUCCESS')                           AS successes,
        countIf(action = 'SIGN_FAIL')                              AS failures
    FROM openbank_analytics.gold_onboarding_funnel_events
    WHERE step = 'SIGN'
    GROUP BY day;

    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_sign_fail_reasons AS
    SELECT
        day,
        if(reason = '', 'unknown', reason)                         AS reason,
        count()                                                    AS failures
    FROM openbank_analytics.gold_onboarding_funnel_events
    WHERE step = 'SIGN' AND action = 'SIGN_FAIL'
    GROUP BY day, reason;

    -- KYC METHOD SPLIT: which identity path prospects pick, and how it correlates with finishing.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_onboarding_kyc_method_daily AS
    SELECT
        day,
        if(kyc_method = '', 'unknown', kyc_method)                 AS kyc_method,
        uniqExact(session_id)                                      AS sessions
    FROM openbank_analytics.gold_onboarding_funnel_events
    WHERE action = 'KYC_METHOD_CHOSEN'
    GROUP BY day, kyc_method;
  03-screen-feedback.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- In-app screen-feedback gold marts (ADR-0192).
    --
    -- The qualitative counterpart to the onboarding funnel (V2): the funnel says WHERE users drop,
    -- these views say WHY. Same shape as V2 — no new table, the events land in the generic
    -- bronze_events log (aggregate_type = 'SCREEN_FEEDBACK', one row per submission, keyed on the
    -- support-quotable reference). Applied by the same operator step as V1/V2, all IF NOT EXISTS.
    --
    -- Event grammar (payload JSON, produced by customer-edge FeedbackPublisher):
    --   reference        FB-xxxxxxxxxxxx, the handle the customer can quote to support
    --   partyId          from the bearer token, never client-asserted
    --   screenId         nav route the feedback is about (e.g. 'payments/new')
    --   category         ∈ BUG, IDEA, CONFUSING
    --   comment          free-text (personal data — see the erasure note below)
    --   screenshotKey    object-store key of the PNG, or absent; the IMAGE ITSELF IS NEVER HERE
    --   screenshotStatus ∈ NONE (text-only), STORED, STORE_FAILED
    --
    -- GDPR (ADR-0192): comments and screenshots are personal data. party_id is projected below
    -- precisely so an erasure request can find both the rows and — via screenshot_key — the objects
    -- to delete. The S3 objects additionally expire on their own after 90 days (bucket lifecycle).

    -- Normalised, typed projection of the raw feedback events. Everything else builds on this.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_screen_feedback AS
    SELECT
        aggregate_id                                        AS reference,
        occurred_at,
        toDate(occurred_at)                                 AS day,
        JSONExtractString(payload, 'partyId')               AS party_id,
        JSONExtractString(payload, 'screenId')              AS screen_id,
        JSONExtractString(payload, 'category')              AS category,
        JSONExtractString(payload, 'comment')               AS comment,
        JSONExtractString(payload, 'platform')              AS platform,
        JSONExtractString(payload, 'appVersion')            AS app_version,
        JSONExtractString(payload, 'screenshotKey')         AS screenshot_key,
        JSONExtractString(payload, 'screenshotStatus')      AS screenshot_status,
        JSONExtractUInt(payload, 'screenshotBytes')         AS screenshot_bytes
    FROM openbank_analytics.bronze_events
    WHERE aggregate_type = 'SCREEN_FEEDBACK';

    -- WHICH SCREENS HURT: volume per screen and category, newest activity first. This is the view the
    -- product board reads to rank what to fix next.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_screen_feedback_by_screen AS
    SELECT
        screen_id,
        category,
        count()                     AS submissions,
        countIf(screenshot_key != '') AS with_screenshot,
        min(occurred_at)            AS first_seen,
        max(occurred_at)            AS last_seen
    FROM openbank_analytics.gold_screen_feedback
    GROUP BY screen_id, category;

    -- VOLUME OVER TIME per platform and app version, so a spike can be attributed to a release.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_screen_feedback_daily AS
    SELECT
        day,
        category,
        platform,
        app_version,
        count()                        AS submissions,
        uniqExact(party_id)            AS parties,
        uniqExact(screen_id)           AS screens
    FROM openbank_analytics.gold_screen_feedback
    GROUP BY day, category, platform, app_version;

    -- PIPELINE HEALTH: how often a screenshot was promised but not stored. A non-zero STORE_FAILED
    -- count means object storage is misconfigured or unreachable (in sandbox: the bucket / Pod Identity
    -- association is not provisioned yet) — the submission survived, the image did not.
    CREATE VIEW IF NOT EXISTS openbank_analytics.gold_screen_feedback_screenshot_health AS
    SELECT
        day,
        screenshot_status,
        count()                     AS submissions,
        sum(screenshot_bytes)       AS total_bytes
    FROM openbank_analytics.gold_screen_feedback
    GROUP BY day, screenshot_status;
  04-screen-feedback-context.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- Screen-feedback rendering context (ADR-0192 completion).
    --
    -- V3 shipped the feedback marts with platform + app_version only. The ADR's payload also names
    -- the OS version, locale, theme and the pseudonymous session id, and the app and edge now send
    -- them. This migration projects those four onto the gold layer.
    --
    -- CREATE OR REPLACE, not a V3 edit: V3's statements are all `CREATE VIEW IF NOT EXISTS`, so
    -- editing that file changes nothing on a database where the views already exist — it would look
    -- applied in git and silently do nothing in ClickHouse.
    --
    -- Backfill note: rows written before this ships have no such keys in `payload`, and
    -- JSONExtractString returns '' for a missing key. Historic rows therefore read as empty strings,
    -- not NULL — the same convention V3 already uses for an absent screenshot_key.
    --
    -- GDPR unchanged: session_id is client-generated and pseudonymous (never an account or device
    -- identifier), and party_id remains the key an erasure request uses to find rows and objects.

    CREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback AS
    SELECT
        aggregate_id                                        AS reference,
        occurred_at,
        toDate(occurred_at)                                 AS day,
        JSONExtractString(payload, 'partyId')               AS party_id,
        JSONExtractString(payload, 'screenId')              AS screen_id,
        JSONExtractString(payload, 'category')              AS category,
        JSONExtractString(payload, 'comment')               AS comment,
        JSONExtractString(payload, 'platform')              AS platform,
        JSONExtractString(payload, 'appVersion')            AS app_version,
        JSONExtractString(payload, 'osVersion')             AS os_version,
        JSONExtractString(payload, 'locale')                AS locale,
        JSONExtractString(payload, 'theme')                 AS theme,
        JSONExtractString(payload, 'sessionId')             AS session_id,
        JSONExtractString(payload, 'screenshotKey')         AS screenshot_key,
        JSONExtractString(payload, 'screenshotStatus')      AS screenshot_status,
        JSONExtractUInt(payload, 'screenshotBytes')         AS screenshot_bytes
    FROM openbank_analytics.bronze_events
    WHERE aggregate_type = 'SCREEN_FEEDBACK';

    -- WHERE IT BREAKS: the same screen can be fine on one OS/theme and broken on another, which is
    -- exactly what platform+app_version alone could not show. Ranks the combinations that generate
    -- bug reports, so a rendering fault gets attributed instead of being averaged away.
    CREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback_context AS
    SELECT
        screen_id,
        platform,
        os_version,
        theme,
        locale,
        countIf(category = 'BUG')   AS bugs,
        count()                     AS submissions,
        max(occurred_at)            AS last_seen
    FROM openbank_analytics.gold_screen_feedback
    GROUP BY screen_id, platform, os_version, theme, locale;
  05-party-accounts.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- The party key (ADR-0210 D2).
    --
    -- D2 calls account→party resolution "the real work" of the Customer 360 and "the only new
    -- persistence" the ADR adds, materialising "as a ClickHouse view alongside the existing silver
    -- views". It never landed: the resolution shipped as an inline CTE inside one caller
    -- (openbank-admin-ui's /api/customer-360/[partyId] route). This migration puts it where D2 says it
    -- belongs, and that route now selects from it (issue #4511).
    --
    -- WHY IT MUST HAVE ONE DEFINITION. The ADR rejects "query bronze_events directly instead of the
    -- silver views" because "every caller would re-derive the reduction, and the first one to write it
    -- slightly differently produces a different current state". That applies to the party key with a
    -- sharper failure mode: this resolution IS the isolation boundary of the Customer 360, so a caller
    -- that widens its own copy shows another customer's accounts and transactions.
    --
    -- WHY IT READS bronze_events, NOT silver_current_state. Silver keeps only the LATEST event per
    -- aggregate, and an account's latest event is typically BALANCE_UPDATED, whose payload carries
    -- accountId but no partyId. Ownership is carried by the event that established it (account opened),
    -- which only the full history has. Verified against the sandbox: silver holds no ACCOUNT row with a
    -- partyId at all.
    --
    -- WHY upper(). aggregate_type is stored uppercase in bronze (PARTY, ACCOUNT, ONBOARDING_FUNNEL).
    -- The route's first version compared against lowercase literals and matched nothing — and a filter
    -- that finds no rows is indistinguishable from a party that owns no accounts, so nothing failed, the
    -- page just showed less. The fold is load-bearing, not defensive style.
    --
    -- WHY party_id != ''. JSONExtractString returns '' for a missing key, so every ACCOUNT event whose
    -- payload has no partyId would otherwise become a row owned by the empty party — and a caller that
    -- forgets to validate its input would join to all of them at once. The Customer 360 route cannot
    -- reach that case (its UUID regex is the injection boundary), which makes this latent rather than
    -- live; a shared view must not hand the footgun to the next caller.
    --
    -- CREATE OR REPLACE, not an edit to V1: V1's statements are all `CREATE … IF NOT EXISTS`, so editing
    -- that file changes nothing on a database where the objects already exist — it would look applied in
    -- git and silently do nothing in ClickHouse. Same reasoning V4 documents.

    CREATE OR REPLACE VIEW openbank_analytics.silver_party_accounts AS
    SELECT DISTINCT
        JSONExtractString(payload, 'partyId') AS party_id,
        aggregate_id                          AS account_id
    FROM openbank_analytics.bronze_events
    WHERE upper(aggregate_type) = 'ACCOUNT'
      AND JSONExtractString(payload, 'partyId') != '';
  06-campaign-engagement.sql: |
    -- Privacy-safe campaign engagement mart (issue #4535). Server-resolved attribution only;
    -- never project partyId or the opaque interaction reference into this aggregate.
    CREATE OR REPLACE VIEW openbank_analytics.gold_campaign_engagement AS
    SELECT
        JSONExtractString(payload, 'campaignId') AS campaign_id,
        JSONExtractUInt(payload, 'stepOrder')     AS step_order,
        JSONExtractString(payload, 'channel')    AS channel,
        uniqExactIf(event_id, event_type = 'EngagementEvent.IMPRESSION') AS impressions,
        uniqExactIf(event_id, event_type = 'EngagementEvent.CLICK')      AS clicks,
        uniqExactIf(event_id, event_type = 'EngagementEvent.DISMISS')    AS dismissals,
        min(occurred_at) AS first_observed_at,
        max(occurred_at) AS last_observed_at
    FROM openbank_analytics.bronze_events
    WHERE aggregate_type = 'ENGAGEMENT'
      AND JSONExtractString(payload, 'campaignId') != ''
      AND JSONHas(payload, 'stepOrder')
      AND JSONExtractString(payload, 'channel') IN ('PUSH', 'BANNER')
    GROUP BY campaign_id, step_order, channel;
  07-fold-aggregate-type-case.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- Consumer sweep, issue #4604 (the #4553 follow-up).
    --
    -- Three views compared aggregate_type against an unfolded literal: gold_onboarding_funnel_events
    -- (V2), gold_screen_feedback (V4), gold_campaign_engagement (V6). None has ever seen a mixed-case
    -- row for its own type on the sandbox — each is written by exactly one producer, and the mixed-case
    -- split #4553 measured was ACCOUNT/Account and TRANSACTION/Transaction only. This is the same
    -- correction as #4576 applied at ingest and #4520 applied to the party key: fold, don't trust the
    -- producer's spelling, because a rename is one commit away from a literal silently matching nothing
    -- — which is exactly the failure #4553 measured on a Grafana tile that had read 0 for its whole life.
    --
    -- CREATE OR REPLACE for all three, regardless of how each was originally declared. V2's
    -- gold_onboarding_funnel_events is `CREATE VIEW IF NOT EXISTS` and has never been superseded —
    -- editing V2's own body in place would be a no-op on a warehouse that already has the view (V4's own
    -- header documents this trap). Views carry no data, so redefining the NAME here fully supersedes
    -- every prior definition of it, on both a fresh cluster and an existing one; V2/V4/V6's own text is
    -- left untouched as the historical record of how the schema arrived here.

    CREATE OR REPLACE VIEW openbank_analytics.gold_onboarding_funnel_events AS
    SELECT
        aggregate_id                                  AS session_id,
        occurred_at,
        toDate(occurred_at)                           AS day,
        JSONExtractString(payload, 'step')            AS step,
        JSONExtractString(payload, 'action')          AS action,
        JSONExtractString(payload, 'kycMethod')       AS kyc_method,
        JSONExtractString(payload, 'reason')          AS reason,
        JSONExtractString(payload, 'platform')        AS platform,
        JSONExtractString(payload, 'appVersion')      AS app_version
    FROM openbank_analytics.bronze_events
    WHERE upper(aggregate_type) = 'ONBOARDING_FUNNEL';

    CREATE OR REPLACE VIEW openbank_analytics.gold_screen_feedback AS
    SELECT
        aggregate_id                                        AS reference,
        occurred_at,
        toDate(occurred_at)                                 AS day,
        JSONExtractString(payload, 'partyId')               AS party_id,
        JSONExtractString(payload, 'screenId')              AS screen_id,
        JSONExtractString(payload, 'category')              AS category,
        JSONExtractString(payload, 'comment')                AS comment,
        JSONExtractString(payload, 'platform')              AS platform,
        JSONExtractString(payload, 'appVersion')            AS app_version,
        JSONExtractString(payload, 'osVersion')             AS os_version,
        JSONExtractString(payload, 'locale')                AS locale,
        JSONExtractString(payload, 'theme')                 AS theme,
        JSONExtractString(payload, 'sessionId')             AS session_id,
        JSONExtractString(payload, 'screenshotKey')         AS screenshot_key,
        JSONExtractString(payload, 'screenshotStatus')      AS screenshot_status,
        JSONExtractUInt(payload, 'screenshotBytes')         AS screenshot_bytes
    FROM openbank_analytics.bronze_events
    WHERE upper(aggregate_type) = 'SCREEN_FEEDBACK';

    CREATE OR REPLACE VIEW openbank_analytics.gold_campaign_engagement AS
    SELECT
        JSONExtractString(payload, 'campaignId') AS campaign_id,
        JSONExtractUInt(payload, 'stepOrder')     AS step_order,
        JSONExtractString(payload, 'channel')    AS channel,
        uniqExactIf(event_id, event_type = 'EngagementEvent.IMPRESSION') AS impressions,
        uniqExactIf(event_id, event_type = 'EngagementEvent.CLICK')      AS clicks,
        uniqExactIf(event_id, event_type = 'EngagementEvent.DISMISS')    AS dismissals,
        min(occurred_at) AS first_observed_at,
        max(occurred_at) AS last_observed_at
    FROM openbank_analytics.bronze_events
    WHERE upper(aggregate_type) = 'ENGAGEMENT'
      AND JSONExtractString(payload, 'campaignId') != ''
      AND JSONHas(payload, 'stepOrder')
      AND JSONExtractString(payload, 'channel') IN ('PUSH', 'BANNER')
    GROUP BY campaign_id, step_order, channel;
  08-fold-silver-layer-case.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- Fold the silver layer's own reduction, issue #4632 (the #4553 backfill follow-up).
    --
    -- #4553 measured bronze holding both `ACCOUNT`/`Account` and `Transaction`/`Consent`-only spellings
    -- for the same domains, and #4576 stopped it growing by normalising at ingest — but rows written
    -- before that fix keep their producer's original spelling forever. #4632 was opened to plan a bronze
    -- backfill for those historical rows and closes with a different answer: the actual symptom #4553
    -- named — "one account has two current-state rows" — is a property of the SILVER reduction's own
    -- GROUP BY, not of the bronze rows themselves. Folding it here resolves the symptom for every past
    -- and future row without ever touching bronze (ADR-0022: a 10-year, append-only log of record).
    --
    -- WHY NOT A BRONZE BACKFILL INSTEAD. Two paths were considered and rejected:
    --   1. An ALTER TABLE ... UPDATE mutation on bronze_events.aggregate_type. Rejected: it edits the
    --      log of record in place — exactly what the retention floor and the WORM tamper-evidence
    --      mechanism (ADR-0023 F1/F2) exist to make visible if it ever happens, not to enable it.
    --   2. A CORRECTION re-ingest through the existing BackfillService/BackfillRequest pipeline.
    --      Rejected on two independent grounds: that pipeline's only wired BackfillSource is
    --      NoOpBackfillSource today (no real OLTP replay source exists for any domain), and even with
    --      one, its own contract — "re-ingestion is safe... dedupe on eventId + last-writer-wins on
    --      aggregateVersion, so a backfill... converges to the same state" — assumes aggregate_type is
    --      UNCHANGED between the old and replayed row. Bronze's ORDER BY is
    --      (aggregate_type, aggregate_id, event_id): a replayed row under the corrected spelling is a
    --      DIFFERENT sort key, so ReplacingMergeTree would insert it ALONGSIDE the original rather than
    --      collapsing onto it — the split would not close, it would grow by one more row per event.
    --
    -- Verified read-only against the sandbox before writing this: folding the GROUP BY (not editing
    -- bronze) drops distinct (type, id) groups from 237 to 232 — exactly the 5 previously-split accounts
    -- collapsing to one row each, each keeping the true latest state (the highest aggregate_version
    -- across BOTH of its old spellings, via argMax — same resolution silver already does per group, now
    -- computed over one group instead of two).
    --
    -- All three: CREATE OR REPLACE, not edits to V1's `CREATE VIEW IF NOT EXISTS` bodies — those have
    -- never been superseded before now, and IF NOT EXISTS is a no-op on a warehouse that already has the
    -- view (the trap V4's own header documents). Downstream is unaffected: every reader added since
    -- #4553 already folds on its own read (silver_party_accounts #4520, the reconciliation reader
    -- #4604/#4618, the Customer 360 route's `.toLowerCase()`) — this view now simply agrees with them at
    -- the source instead of relying on every reader to repeat the fold.

    CREATE OR REPLACE VIEW openbank_analytics.silver_current_state AS
    SELECT
        upper(b.aggregate_type)                                                       AS aggregate_type,
        b.aggregate_id,
        argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at))       AS event_id,
        max(b.aggregate_version)                                                      AS aggregate_version,
        argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at))     AS event_type,
        argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at))    AS occurred_at,
        argMax(b.source_service, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS source_service,
        argMax(b.schema_version, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS schema_version,
        argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at))        AS payload
    FROM openbank_analytics.bronze_events AS b
    GROUP BY upper(b.aggregate_type), b.aggregate_id;

    -- SCD2 history: PARTITION BY (not GROUP BY), so folding needs the SAME upper() in both the output
    -- column and the window's PARTITION BY — folding only the output would leave a mixed-case account's
    -- version sequence split across two windows, each computing its own (wrong) valid_from/valid_to.
    CREATE OR REPLACE VIEW openbank_analytics.silver_history AS
    SELECT
        upper(aggregate_type)                                                 AS aggregate_type,
        aggregate_id,
        aggregate_version,
        event_type,
        occurred_at                                                           AS valid_from,
        leadInFrame(occurred_at) OVER (
            PARTITION BY upper(aggregate_type), aggregate_id
            ORDER BY aggregate_version, occurred_at, ingested_at
            ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING
        )                                                                     AS valid_to,
        payload
    FROM openbank_analytics.bronze_events;

    CREATE OR REPLACE VIEW openbank_analytics.silver_as_of AS
    SELECT
        upper(b.aggregate_type)                                                    AS aggregate_type,
        b.aggregate_id,
        argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at))    AS event_id,
        max(b.aggregate_version)                                                   AS aggregate_version,
        argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at))  AS event_type,
        argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS occurred_at,
        argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at))     AS payload
    FROM openbank_analytics.bronze_events AS b
    WHERE b.occurred_at <= {t:DateTime64(3, 'UTC')}
    GROUP BY upper(b.aggregate_type), b.aggregate_id;

  10-party-credit-profile.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- The credit profile behind ADR-0269 (issue #6215).
    --
    -- ONE definition, for the same reason V5 gives for the party key: three consumers need these
    -- numbers — the creditworthiness assessment (which must be reproducible for an audit), the
    -- customer's own financial-health view, and the AI advisor. Two implementations that disagree is
    -- worse than one that is wrong, because only the second is detectable.
    --
    -- WHY IT LIVES HERE. ADR-0210 put Customer 360 in the silver layer rather than in a new service:
    -- the topics are already ingested and the reduction already exists. A credit profile is the same
    -- shape of question asked of the same rows.
    --
    -- WHAT IT DELIBERATELY DOES NOT DO. It computes no score, no rating and no decision. It reports
    -- observable quantities — money in, money out, how steady, how long the cover lasts. The judgement
    -- is lending-service's (ADR-0213), and keeping the two apart is what lets the thresholds move
    -- without the measurements moving.

    -- ─────────────────────────────────────────────────────────────────────────────
    -- Per-party monthly cash flows.
    --
    -- A transaction is INBOUND for a party when the party owns the target account and OUTBOUND when it
    -- owns the source. Both legs are counted from the same event, which is why the two halves are
    -- unioned rather than joined: an internal transfer between two of the customer's OWN accounts is
    -- then correctly both — it is not income, and the netting in the profile below removes it.
    --
    -- occurred_at, never ingested_at: a backfilled month must land in the month it happened, or a
    -- reload silently rewrites someone's income history.
    -- ─────────────────────────────────────────────────────────────────────────────
    CREATE OR REPLACE VIEW openbank_analytics.silver_party_monthly_flows AS
    SELECT
        party_id,
        month,
        sum(inbound)  AS inbound_amount,
        sum(outbound) AS outbound_amount,
        count()       AS movement_count
    FROM
    (
        SELECT
            pa.party_id                                                        AS party_id,
            toStartOfMonth(e.occurred_at)                                      AS month,
            toDecimal64(JSONExtractString(e.payload, 'amount'), 2)             AS inbound,
            toDecimal64('0', 2)                                                AS outbound
        FROM openbank_analytics.bronze_events AS e
        INNER JOIN openbank_analytics.silver_party_accounts AS pa
            ON pa.account_id = JSONExtractString(e.payload, 'targetAccountId')
        WHERE upper(e.aggregate_type) = 'TRANSACTION'
          AND JSONExtractString(e.payload, 'targetAccountId') != ''
          AND JSONExtractString(e.payload, 'amount') != ''

        UNION ALL

        SELECT
            pa.party_id                                                        AS party_id,
            toStartOfMonth(e.occurred_at)                                      AS month,
            toDecimal64('0', 2)                                                AS inbound,
            toDecimal64(JSONExtractString(e.payload, 'amount'), 2)             AS outbound
        FROM openbank_analytics.bronze_events AS e
        INNER JOIN openbank_analytics.silver_party_accounts AS pa
            ON pa.account_id = JSONExtractString(e.payload, 'sourceAccountId')
        WHERE upper(e.aggregate_type) = 'TRANSACTION'
          AND JSONExtractString(e.payload, 'sourceAccountId') != ''
          AND JSONExtractString(e.payload, 'amount') != ''
    )
    GROUP BY party_id, month;

    -- ─────────────────────────────────────────────────────────────────────────────
    -- The profile itself: the last six whole months, excluding the current partial one.
    --
    -- WHY SIX. Long enough for a quarterly pattern to show and for one unusual month not to dominate;
    -- short enough that a job change is visible rather than averaged away.
    --
    -- WHY THE CURRENT MONTH IS EXCLUDED. A month in progress always looks like a collapse in income —
    -- on the 3rd, salary has not arrived. Including it would make every profile read worst on the day
    -- most customers open the app.
    --
    -- income_monthly is the MEDIAN inbound, not the mean: one bonus or one incoming transfer from
    -- savings should not raise what the bank believes a customer earns every month.
    --
    -- volatility_ratio is the standard deviation of monthly net over the median inbound. It is a ratio,
    -- not a currency amount, so it compares across income levels — 5,000 of swing means something very
    -- different on 20,000 a month than on 200,000.
    -- ─────────────────────────────────────────────────────────────────────────────
    CREATE OR REPLACE VIEW openbank_analytics.gold_party_credit_profile AS
    SELECT
        party_id,
        count()                                                     AS months_observed,
        quantileExact(0.5)(inbound_amount)                          AS income_monthly,
        quantileExact(0.5)(outbound_amount)                         AS outflow_monthly,
        quantileExact(0.5)(inbound_amount - outbound_amount)        AS net_monthly,
        -- Guard the divisor: a party with no observed inbound has an undefined ratio, and 0 would read
        -- as "perfectly stable" — the most flattering possible answer for the least-known customer.
        if(quantileExact(0.5)(inbound_amount) > 0,
           stddevPop(inbound_amount - outbound_amount) / quantileExact(0.5)(inbound_amount),
           NULL)                                                    AS volatility_ratio,
        sum(movement_count)                                         AS movements_observed
    FROM openbank_analytics.silver_party_monthly_flows
    WHERE month >= toStartOfMonth(now()) - INTERVAL 6 MONTH
      AND month <  toStartOfMonth(now())
    GROUP BY party_id;
  11-credit-funnel.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- The ADR-0269 credit-journey funnel (rule 8's metrics).
    --
    -- WHAT THIS DELIBERATELY CANNOT ANSWER: "how many customers converted". There is no conversion
    -- event upstream and there is no acceptance column here. The programme's metrics are
    -- self-activation, opt-out-within-30-days, affordability declines, delinquency, and offers shown
    -- without a prior customer action — a funnel built to optimise acceptance would quietly become the
    -- thing ADR-0269 exists to prevent.
    --
    -- WHY A SEPARATE STREAM from the onboarding funnel: that one is an anonymous public write. These
    -- events say "this person is looking at borrowing", so they ride an authenticated topic keyed by
    -- party. The two must not be unioned into one view, or the anonymous stream's trust level would
    -- silently become the credit stream's.

    CREATE OR REPLACE VIEW openbank_analytics.gold_credit_funnel_events AS
    SELECT
        JSONExtractString(payload, 'partyId') AS party_id,
        JSONExtractString(payload, 'step')    AS step,
        JSONExtractString(payload, 'action')  AS action,
        occurred_at
    FROM openbank_analytics.bronze_events
    WHERE upper(aggregate_type) = 'CREDIT_FUNNEL'
      AND JSONExtractString(payload, 'partyId') != '';

    -- Self-activation, the headline number: of the people who ever opened the consent screen, how many
    -- switched offers ON themselves. Deliberately NOT "how many were offered credit".
    CREATE OR REPLACE VIEW openbank_analytics.gold_credit_consent_activation AS
    SELECT
        toStartOfDay(occurred_at)                                        AS day,
        countIf(action = 'VIEWED' AND step = 'CONSENT')                  AS consent_screen_views,
        countIf(action = 'CONSENT_GRANTED')                              AS granted,
        countIf(action = 'CONSENT_WITHDRAWN')                            AS withdrawn,
        uniqExactIf(party_id, action = 'CONSENT_GRANTED')                AS parties_granted,
        uniqExactIf(party_id, action = 'CONSENT_WITHDRAWN')              AS parties_withdrawn
    FROM openbank_analytics.gold_credit_funnel_events
    GROUP BY day;

    -- Pricing outcomes. QUOTE_SUPPRESSED is tracked as prominently as QUOTE_REQUESTED on purpose: the
    -- distress floor refusing to price is a thing the bank must be able to SEE, not a silent branch.
    CREATE OR REPLACE VIEW openbank_analytics.gold_credit_quote_outcomes AS
    SELECT
        toStartOfDay(occurred_at)                        AS day,
        countIf(action = 'QUOTE_REQUESTED')              AS requested,
        countIf(action = 'QUOTE_SUPPRESSED')             AS suppressed,
        countIf(action = 'APPLICATION_STARTED')          AS applications_started,
        countIf(action = 'APPLICATION_ABANDONED')        AS applications_abandoned
    FROM openbank_analytics.gold_credit_funnel_events
    GROUP BY day;

  09-synthetic-provenance.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- Mirrors openbank-analytics-sink/src/main/resources/clickhouse/V9__synthetic_provenance.sql.
    --
    -- WHY THIS KEY EXISTS AT ALL. V9 creates no new object — it adds one column and re-cuts four
    -- views that V1/V07/V08 already created — so the #4511 object-set parity check could not see it,
    -- and it sat unmirrored (issue #7645). The sink names `synthetic` in its JSONEachRow insert and
    -- ClickHouse 24.8 defaults input_format_skip_unknown_fields to 1, so on a warehouse built
    -- without this key the flag is DROPPED on every write rather than rejected, and every silver and
    -- gold aggregate then counts synthetic activity as real. The gate now checks column parity and
    -- definition agreement for exactly that reason.
    --
    -- The ALTER runs against the table 01-bronze-silver.sql has just created; ADD COLUMN
    -- IF NOT EXISTS is a no-op if a future 01 ever declares the column inline.
    -- ADR-0252: retain synthetic activity as auditable bronze provenance, but never let it enter
    -- baseline state/history/as-of or daily-volume projections.
    ALTER TABLE openbank_analytics.bronze_events
        ADD COLUMN IF NOT EXISTS synthetic UInt8 DEFAULT 0;

    CREATE OR REPLACE VIEW openbank_analytics.silver_current_state AS
    SELECT
        upper(b.aggregate_type) AS aggregate_type,
        b.aggregate_id,
        argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_id,
        max(b.aggregate_version) AS aggregate_version,
        argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_type,
        argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS occurred_at,
        argMax(b.source_service, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS source_service,
        argMax(b.schema_version, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS schema_version,
        argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS payload
    FROM openbank_analytics.bronze_events AS b
    WHERE b.synthetic = 0
    GROUP BY upper(b.aggregate_type), b.aggregate_id;

    CREATE OR REPLACE VIEW openbank_analytics.gold_daily_event_volume AS
    SELECT
        toDate(occurred_at) AS day,
        source_service,
        aggregate_type,
        event_type,
        count() AS events
    FROM openbank_analytics.bronze_events
    WHERE synthetic = 0
    GROUP BY day, source_service, aggregate_type, event_type;

    CREATE OR REPLACE VIEW openbank_analytics.silver_history AS
    SELECT
        upper(aggregate_type) AS aggregate_type,
        aggregate_id,
        aggregate_version,
        event_type,
        occurred_at AS valid_from,
        leadInFrame(occurred_at) OVER (
            PARTITION BY upper(aggregate_type), aggregate_id
            ORDER BY aggregate_version, occurred_at, ingested_at
            ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING
        ) AS valid_to,
        payload
    FROM openbank_analytics.bronze_events
    WHERE synthetic = 0;

    CREATE OR REPLACE VIEW openbank_analytics.silver_as_of AS
    SELECT
        upper(b.aggregate_type) AS aggregate_type,
        b.aggregate_id,
        argMax(b.event_id, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_id,
        max(b.aggregate_version) AS aggregate_version,
        argMax(b.event_type, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS event_type,
        argMax(b.occurred_at, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS occurred_at,
        argMax(b.payload, (b.aggregate_version, b.occurred_at, b.ingested_at)) AS payload
    FROM openbank_analytics.bronze_events AS b
    WHERE b.synthetic = 0
      AND b.occurred_at <= {t:DateTime64(3, 'UTC')}
    GROUP BY upper(b.aggregate_type), b.aggregate_id;
  12-party-event-profile.sql: |
    -- SPDX-License-Identifier: Apache-2.0
    -- Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    -- See LICENSE in the repository root or https://www.apache.org/licenses/LICENSE-2.0 for details.
    --
    -- The per-party event profile ADR-0282 phase 1 asks for (issue #8792).
    --
    -- WHAT WAS ACTUALLY MISSING. ADR-0210 put Customer 360 in the silver layer, and V5 gave the
    -- account-to-party key one definition. What no object gave one definition to is the question one
    -- level up: WHICH ROWS BELONG TO A PARTY. The Customer 360 BFF answers it inline, in TypeScript,
    -- on every request — `payload.partyId = P` OR an ACCOUNT/TRANSACTION row whose aggregate_id is one
    -- of P's accounts — then pulls up to 5000 rows and folds them in the route handler.
    --
    -- That predicate IS the isolation boundary, in the same sense V5's header means it: a caller that
    -- widens its own copy shows another customer's events. V5 collapsed one such copy and the route's
    -- own comment records the lesson ("a resolution with two definitions has two answers"), but the
    -- scoping around the view stayed behind in the caller. `silver_party_events` is that scoping, named
    -- once, so a second consumer — the Lipa earn evaluation, the segment DSL, the AI advisor — inherits
    -- the boundary instead of re-deriving it.
    --
    -- WHY silver_current_state AND NOT bronze. Deliberately the same source the Customer 360 route
    -- reads today, so this view is a refactor of an existing answer rather than a new one with a
    -- different meaning. Silver is the latest event per (aggregate_type, aggregate_id): a profile built
    -- on it describes current state, which is what a 360 view is for. Anything needing the full history
    -- (cash-flow medians, cadence) must read bronze, and V10's monthly-flows view already does exactly
    -- that — the two are different questions, not two answers to one.
    --
    -- THE ACCOUNT LEG READS V5, WHICH READS BRONZE, AND THAT ASYMMETRY IS LOAD-BEARING. An account's
    -- latest silver row is typically a status or balance event carrying no partyId, so resolving the
    -- account key from silver would drop exactly the parties with the most account activity. V5 already
    -- makes that choice and states it; this view inherits it by delegating rather than repeating it.
    --
    -- WHAT IT DELIBERATELY DOES NOT DO. It computes no financial-health measure, no segment membership
    -- and no score. ADR-0220 D5's rule applies to this phase: a rewards programme rendered from
    -- fabricated profiles is worse than a missing feature. Every column below is a count or a timestamp
    -- that is directly observable in the rows; nothing is imputed for a party with thin data, and a
    -- party with no events has no row here rather than a row of zeros.
    -- ─────────────────────────────────────────────────────────────────────────────

    CREATE OR REPLACE VIEW openbank_analytics.silver_party_events AS
    SELECT
        JSONExtractString(s.payload, 'partyId') AS party_id,
        -- Folded once here so no downstream view repeats it. silver_current_state already upper()s its
        -- output; the fold is restated rather than assumed, because a caller that inherits case-folding
        -- by accident breaks the day the source view changes and nothing says why.
        upper(s.aggregate_type)                 AS aggregate_type,
        s.aggregate_id,
        s.event_id,
        s.event_type,
        s.occurred_at,
        s.source_service,
        s.payload
    FROM openbank_analytics.silver_current_state AS s
    WHERE JSONExtractString(s.payload, 'partyId') != ''

    UNION ALL

    -- The account leg: rows the party owns through an account rather than through a payload key. The
    -- `NOT IN` on the payload key is what keeps the union disjoint — without it a TRANSACTION row that
    -- carries BOTH a partyId and an owned account id appears twice, and every count below doubles for
    -- exactly the best-instrumented events.
    SELECT
        pa.party_id                             AS party_id,
        upper(s.aggregate_type)                 AS aggregate_type,
        s.aggregate_id,
        s.event_id,
        s.event_type,
        s.occurred_at,
        s.source_service,
        s.payload
    FROM openbank_analytics.silver_current_state AS s
    INNER JOIN openbank_analytics.silver_party_accounts AS pa
        ON pa.account_id = s.aggregate_id
    WHERE upper(s.aggregate_type) IN ('ACCOUNT', 'TRANSACTION')
      AND JSONExtractString(s.payload, 'partyId') = '';

    -- ─────────────────────────────────────────────────────────────────────────────
    -- The profile itself: the fold the Customer 360 route performs per request, computed once.
    --
    -- The per-domain breakdown is a SECOND view (one row per party per domain) rather than a column per
    -- domain, because the domain set is open: a newly ingested topic must widen the profile without a
    -- migration, and a fixed column list would report zero for a domain that merely had no column yet.
    -- That is the sentinel-default failure shape — indistinguishable from a real zero.
    -- ─────────────────────────────────────────────────────────────────────────────
    CREATE OR REPLACE VIEW openbank_analytics.gold_party_event_profile AS
    SELECT
        party_id,
        count()                                    AS events_observed,
        uniqExact(aggregate_id)                    AS aggregates_observed,
        -- upper() restated at the comparison even though silver_party_events folds it: inheriting a
        -- fold is an assumption that breaks silently the day the source view changes, which is what the
        -- aggregate-type-case-fold gate exists to prevent. upper() of an already-folded value is free.
        uniqExactIf(aggregate_id, upper(aggregate_type) = 'ACCOUNT')      AS accounts_observed,
        uniqExact(aggregate_type)                  AS domains_observed,
        min(occurred_at)                           AS first_seen_at,
        max(occurred_at)                           AS last_seen_at,
        -- Recency in days, computed here so every consumer agrees on the clock. NOT seeded from a
        -- sentinel: a party with no events has no row at all, so there is no boot-time value that could
        -- read as decades of staleness the way a registration-time gauge does.
        dateDiff('day', max(occurred_at), now())   AS days_since_last_event,
        arraySort(groupUniqArray(aggregate_type))  AS domains
    FROM openbank_analytics.silver_party_events
    GROUP BY party_id;

    -- One row per (party, domain): the `byDomain` map the Customer 360 route builds in the handler,
    -- including the latest event per domain that the route derives from row order. argMax rather than
    -- "the first row of a DESC scan", because the ordering guarantee is a property of the query the
    -- caller happens to write, and this must hold for every caller.
    CREATE OR REPLACE VIEW openbank_analytics.gold_party_domain_activity AS
    SELECT
        party_id,
        aggregate_type,
        count()                                                   AS events_observed,
        argMax(event_type, occurred_at)                           AS last_event_type,
        max(occurred_at)                                          AS last_occurred_at
    FROM openbank_analytics.silver_party_events
    GROUP BY party_id, aggregate_type;
