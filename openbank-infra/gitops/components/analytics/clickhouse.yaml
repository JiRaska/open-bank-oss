# Single-node ClickHouse for the sandbox analytics warehouse (ADR-0022).
#
# This is the bronze/silver/gold store openbank-analytics-sink writes into and the admin cockpit's
# onboarding-funnel board reads. Single node + one replica is deliberate for sandbox; production
# would run a replicated ClickHouse (Keeper + shards). The schema (V1 bronze/silver + V2 onboarding
# funnel gold views) is applied on first boot via the clickhouse-init ConfigMap mounted into
# /docker-entrypoint-initdb.d — ClickHouse runs those .sql files once, when the data dir is empty.
#
# Image is docker.io/... so the ecr-pull-through-rewrite Kyverno policy rewrites it to the ECR
# pull-through cache (docker-hub/) at admission — no NAT, and NOT an openbank-* image so the cosign
# signature policy does not apply.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: analytics
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: openbank
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: analytics
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: openbank
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: openbank
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: docker.io/clickhouse/clickhouse-server:26.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: openbank_analytics
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            # Create the `analytics` application user at first boot from the out-of-band
            # clickhouse-auth Secret (same Secret analytics-sink authenticates with). ClickHouse's
            # image creates this user on an empty data dir; on an already-initialised volume the user
            # must be created once via clickhouse-client (CREATE USER ... IDENTIFIED BY ...).
            - name: CLICKHOUSE_USER
              value: analytics
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: server-config
              mountPath: /etc/clickhouse-server/config.d/retention.xml
              subPath: retention.xml
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: init
          configMap:
            name: clickhouse-init
        - name: server-config
          configMap:
            name: clickhouse-server-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            # Left at 10Gi ON PURPOSE: volumeClaimTemplates is immutable on a live
            # StatefulSet, so editing it here would fail every ArgoCD sync of this app.
            # The live PVC was grown to 20Gi by `kubectl patch pvc data-clickhouse-0`
            # (gp3 allowVolumeExpansion) on 2026-09-30; the template only matters for a
            # freshly created PVC, where the TTLs below keep 10Gi sufficient.
            storage: 10Gi
---
# ClickHouse's own diagnostic tables had no retention and logged at TRACE.
#
# Measured 2026-09-30: data-clickhouse-0 at 100% (9.7G of 10Gi, 32 MB free) —
# KubePersistentVolumeFillingUp critical — and 9.11 GiB of that was the `system`
# database: text_log 6.22 GiB, trace_log 958 MiB, metric_log 929 MiB,
# asynchronous_metric_log 688 MiB. The warehouse itself (openbank_analytics) was
# 78 MiB. Stock ClickHouse writes every server log line at `logger.level=trace`
# into system.text_log and keeps it forever; on a 10Gi volume the diagnostics
# outgrow the data they diagnose within weeks, then every INSERT from
# analytics-sink and the cloud-finops-collector CronJob fails (that is why the
# collector's latest run was red).
#
# Cure at the cause: TTL on every system log table and WARN-level logging. Note
# ClickHouse applies a changed system-log definition by RENAMING the old table
# to <name>_N and creating a fresh one, so the tables already on disk (the
# `text_log_0` etc. measured above) keep their bytes until dropped — see the
# one-time cleanup in this PR's description.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-server-config
  namespace: analytics
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: openbank
data:
  retention.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console_log_level>warning</console_log_level>
      </logger>
      <text_log>
        <level>warning</level>
        <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
      </text_log>
      <trace_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></trace_log>
      <metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></metric_log>
      <asynchronous_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></asynchronous_metric_log>
      <query_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></query_log>
      <part_log><ttl>event_date + INTERVAL 14 DAY DELETE</ttl></part_log>
    </clickhouse>
