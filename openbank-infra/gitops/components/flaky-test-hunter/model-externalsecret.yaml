# Fine-grained GitHub credential for the bounded ADR-0031 D9 phase-3 test-only repair.
# It is intentionally a distinct OpenBao value and Kubernetes Secret from all other agents: the
# credential needs only contents:write + pull_requests:write on this repository, and its revocation
# disables only flaky-test-hunter's single non-money-path PR capability.
# Seed (external operator action): bao kv patch openbank/flaky-test-hunter GITHUB_TOKEN=<fine-grained-token>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flaky-test-hunter-secrets
  namespace: flaky-test-hunter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: flaky-test-hunter-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: FLAKY_TEST_HUNTER_GITHUB_TOKEN
      remoteRef:
        key: flaky-test-hunter
        property: GITHUB_TOKEN
---
# Separate projection: an absent model key must not prevent the GitHub credential syncing.
# The operator provisions this agent's budgeted LiteLLM virtual key; no provider/master key
# belongs in the development-agent namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flaky-test-hunter-model
  namespace: flaky-test-hunter
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-08"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: flaky-test-hunter-model
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FLAKY_TEST_HUNTER_MODEL_API_KEY
      remoteRef:
        key: litellm
        property: KEY_FLAKY_TEST_HUNTER
