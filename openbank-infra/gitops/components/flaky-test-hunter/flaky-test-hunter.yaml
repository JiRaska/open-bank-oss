apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky-test-hunter
  namespace: flaky-test-hunter
  labels:
    app.kubernetes.io/name: flaky-test-hunter
    app.kubernetes.io/part-of: flaky-test-hunter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flaky-test-hunter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaky-test-hunter
        app.kubernetes.io/part-of: flaky-test-hunter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaky-test-hunter
          # Pending first CI build (ADR-0168 initial PR) — build-push-service.sh publishes the
          # real sandbox-<sha> tag on merge; ArgoCD will not sync a healthy pod until then.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-flaky-test-hunter:sandbox-fafe1194
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8148
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Postgres (CNPG flakytest-db) — findings + their HITL lifecycle survive pod restarts.
            # Reactive URL for the app (Panache); JDBC URL for Flyway migrations.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://flakytest-db-rw.flaky-test-hunter.svc:5432/openbank_flakytest
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://flakytest-db-rw.flaky-test-hunter.svc:5432/openbank_flakytest
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: flakytest-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: flakytest-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: GITHUB_API_URL
              value: https://api.github.com
            - name: GITHUB_REPO
              value: JiRaska/open-bank-oss
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-flakytest
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: flaky-test-hunter
  namespace: flaky-test-hunter
  labels:
    app.kubernetes.io/name: flaky-test-hunter
    app.kubernetes.io/part-of: flaky-test-hunter
spec:
  selector:
    app.kubernetes.io/name: flaky-test-hunter
  ports:
    - name: http
      port: 8148
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
