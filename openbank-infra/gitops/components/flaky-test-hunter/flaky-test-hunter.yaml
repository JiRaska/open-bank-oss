apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky-test-hunter
  namespace: flaky-test-hunter
  labels:
    app.kubernetes.io/name: flaky-test-hunter
    app.kubernetes.io/part-of: flaky-test-hunter
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flaky-test-hunter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaky-test-hunter
        app.kubernetes.io/part-of: flaky-test-hunter
      annotations:
        # Generated with the bundle: subPath mounts require a pod rollout on policy changes.
        openbank.tech/policy-checksum: "f7f0f01ea6db0a93"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaky-test-hunter
          # Pending first CI build (ADR-0168 initial PR) — build-push-service.sh publishes the
          # real sandbox-<sha> tag on merge; ArgoCD will not sync a healthy pod until then.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-flaky-test-hunter:sandbox-c9e816ec
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8148
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Postgres (CNPG flakytest-db) — findings + their HITL lifecycle survive pod restarts.
            # Reactive URL for the app (Panache); JDBC URL for Flyway migrations.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://flakytest-db-rw.flaky-test-hunter.svc:5432/openbank_flakytest
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://flakytest-db-rw.flaky-test-hunter.svc:5432/openbank_flakytest
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: flakytest-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: flakytest-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            # The periodic sweep. Set EXPLICITLY here rather than left to the application.yaml
            # default, because this is the only place an operator looks to answer "when does this
            # agent run" — and until now the answer was "it doesn't". The agent was trigger-only,
            # so its findings table was empty, which renders as "nothing to act on" rather than
            # "nothing has ever looked".
            # weekly on Sunday at 06:30 UTC, offset from the other control-plane agents, which share one LiteLLM
            # gateway and one Prometheus and each carry their own daily token budget.
            # Six fields (second minute hour day month weekday) — Quarkus, not crontab.
            - name: FLAKY_TEST_HUNTER_CHECK_CRON
              value: "0 30 6 ? * SUN"
            - name: GITHUB_API_URL
              value: https://api.github.com
            - name: GITHUB_REPO
              value: JiRaska/open-bank-oss
            # Phase-2 mechanism delivery: stop PR writes. False returns DENY rather than
            # bypassing policy; controlled activation and runtime evidence are separate rollout work.
            - name: FLAKY_TEST_HUNTER_POLICY_GATE_ENABLED
              value: "false"
            # Optional fine-grained token: until OpenBao is seeded, the phase-3 writer fails closed
            # and no pull request is opened. It is deliberately separate from every other agent's
            # credential, so revoking this one stops only this bounded development capability.
            - name: FLAKY_TEST_HUNTER_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flaky-test-hunter-secrets
                  key: FLAKY_TEST_HUNTER_GITHUB_TOKEN
                  optional: true
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-flakytest
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
        # The PR-path gate queries this pod's agents-only policy bundle over localhost:8181.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Keep decision and management APIs inside this pod; probes use the diagnostic listener.
            - --addr=127.0.0.1:8181
            - --diagnostic-addr=0.0.0.0:8282
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
            - name: opa-diagnostics
              containerPort: 8282
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: opa-diagnostics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: opa-diagnostics
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: flaky-test-hunter-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: flaky-test-hunter
  namespace: flaky-test-hunter
  labels:
    app.kubernetes.io/name: flaky-test-hunter
    app.kubernetes.io/part-of: flaky-test-hunter
spec:
  selector:
    app.kubernetes.io/name: flaky-test-hunter
  ports:
    - name: http
      port: 8148
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
