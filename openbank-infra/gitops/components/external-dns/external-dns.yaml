# external-dns — turns Ingress hosts into Route53 records so adding a public
# service never needs a manual DNS edit. AWS credentials come from EKS Pod
# Identity: the ServiceAccount name (external-dns/external-dns) must match the
# aws_eks_pod_identity_association in modules/dns — no IRSA annotation, the Pod
# Identity agent injects creds. Scoped to open-bank.tech via --domain-filter;
# ownership is tracked with TXT records (--registry=txt) so external-dns only
# ever touches records it created.
#
# Sources: Ingress (every host today) and Gateway API HTTPRoute (ADR-0324), the
# latter limited to routes attached to the one shared Gateway
# envoy-gateway-system/edge, so no other Gateway can publish a public record.
# The gateway source needs the Gateway API CRDs to exist (installed by the
# envoy-gateway-crds Application): without them its informer cannot sync and
# the controller does not start.
#
# v0.15.0 -> v0.23.0 upgrade decisions (upstream release notes, every minor):
#   * Annotation prefix: v0.22.0 made `external-dns.kubernetes.io/` the default
#     with no fallback to `external-dns.alpha.kubernetes.io/`. Nothing in this
#     repo sets an annotation under either prefix (hosts come from Ingress
#     spec.rules, targets from Ingress status), so the default is kept and
#     neither --annotation-prefix nor --enable-legacy-annotation-prefix is set:
#     the record set is identical. Any NEW annotation must use the GA prefix.
#   * --policy: v0.22.0 made it mandatory. It was already explicit
#     (upsert-only: create and update, never delete) and stays so.
#   * TXT registry: same --txt-owner-id and --txt-prefix. v0.15.0 wrote both
#     the legacy and the new-format ownership records; v0.18.0 reads and writes
#     the new format only, and v0.22.0 renames the AWS ALIAS ownership record
#     from `cname-` to `a-`, migrating automatically with ownership preserved.
#     Under upsert-only nothing is deleted, so the legacy/`cname-` TXT records
#     are left behind as inert leftovers rather than removed.
#   * Metrics were renamed in v0.18.0; nothing here scrapes or alerts on
#     external_dns_* series.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
  labels:
    app.kubernetes.io/name: external-dns
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  # gateway-httproute source (ADR-0324): routes, the Gateways they attach to
  # (for the target addresses) and namespaces (for allowedRoutes selectors).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
  labels:
    app.kubernetes.io/name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.23.0
          args:
            - --source=ingress
            - --source=gateway-httproute
            - --gateway-namespace=envoy-gateway-system
            - --gateway-name=edge
            - --provider=aws
            - --aws-zone-type=public
            - --registry=txt
            - --txt-owner-id=openbank-sandbox
            - --txt-prefix=edns-
            - --domain-filter=open-bank.tech
            - --policy=upsert-only
            - --interval=1m
            - --log-format=json
          env:
            # Pod Identity needs a region for the AWS SDK; the Route53 API is
            # global but the SDK still wants one set.
            - name: AWS_REGION
              value: eu-north-1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
