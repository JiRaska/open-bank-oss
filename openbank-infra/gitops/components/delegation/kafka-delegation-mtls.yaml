# Kafka mTLS identity + ACLs for openbank-delegation-service (ADR-0137 Tier 2).
#
# delegation-service publishes the grant lifecycle
# (offered/accepted/declined/revoked/suspended/reinstated/renounced/expired) onto
# openbank.delegation.events via the transactional outbox (ADR-0232 D3). The consumers
# are the product services building local enforcement projections — account-service and
# card-issuance — and each holds its own KafkaUser with its own Read ACL, so nothing is
# granted here for them.
#
# It CONSUMES exactly one topic: openbank.domestic.payment.events, whose payment outcomes settle
# domestic-payment spend reservations (channel `domestic-payment-events-in`, group
# delegation-service-domestic-payment-outcomes, DLQ openbank.dlq.delegation.domestic-payment-events-in;
# ADR-0249 D3 amendment, #16000).
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for
# all of this service's Kafka traffic. The Strimzi User Operator mints the per-user
# Secret of the same name in `messaging`; ESO projection into `delegation` is done by
# kafka-mtls-externalsecrets.yaml, as for every other service user.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # Certs (KafkaUsers→Strimzi secrets→ESO projection) must land before the
    # delegation-service Deployment rolls pods onto mTLS; lower waves sync first.
    argocd.argoproj.io/sync-wave: "-2"
  name: delegation-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Produce the grant lifecycle → product-service enforcement projections (ADR-0232 D3).
      - resource:
          type: topic
          name: openbank.delegation.events
          patternType: literal
        operations: [Write, Describe]
      - resource:
          type: topic
          name: openbank.delegation.spend-reservation-state
          patternType: literal
        operations: [Write, Describe]
      # ADR-0312 business-signing lifecycle → notification-service (approval push + inbox) and
      # the audit trail. The KafkaTopic is declared with its consumer (#10313).
      - resource:
          type: topic
          name: openbank.delegation.approval-events
          patternType: literal
        operations: [Write, Describe]
      - resource:
          type: topic
          name: openbank.delegation.approval-group-revisions
          patternType: literal
        operations: [Write, Describe]
      # ADR-0249 D3 amendment (#16000): settle spend reservations from domestic payment outcomes.
      # Harmless while openbank.delegation.payment-outcome-consumer.enabled is false (no channel).
      - resource:
          type: topic
          name: openbank.domestic.payment.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: delegation-service-domestic-payment-outcomes
          patternType: literal
        operations: [Read]
        host: "*"
      # The consumer must be able to write its own dead-letter records (#5745).
      - resource:
          type: topic
          name: openbank.dlq.delegation.domestic-payment-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
