# OIDC client secret for billing-service (Keycloak client openbank-services).
# Same shared service-account secret used by the other app-plane services,
# stored in Vault under key `account-service`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: billing-service-oidc
  namespace: billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: billing-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 5: billing-service's OWN Keycloak client `openbank-billing` (ROLE_API only), used ONLY
# by AccountRestClient (named oidc-client `m2m`). KV layout is ADR-0099's `openbank/keycloak/<service>`,
# written once by the owner's provisioning script (runbook 0009); nothing in this repo holds the value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: billing-service-m2m-oidc
  namespace: billing
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: billing-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/billing-service
        property: client_secret
