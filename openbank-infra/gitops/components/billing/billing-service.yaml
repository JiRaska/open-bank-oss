# billing-service: runtime fee assessment and posting (ADR-0143 phase 2c).
# Postgres-backed (billing-db.yaml, single-owner CNPG cluster) — fee posting persistence
# landed across #549/#637/#672 (billing_cycle_assessment / assessed_fee / billing_outbox,
# Flyway-migrated). No Kafka. Reads account state from account-service, balance-service,
# and product-catalog to compute fee assessments. Phase 2c-ii (ledger posting + outbox) is
# deploy-gated behind the four-eyes OPA gate (data.openbank.billing.ledger.post.allow).
# OIDC bearer-token validation against the Keycloak openbank realm (service-to-service
# client credentials).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: billing
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: billing
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-billing-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "3deb0b360583661d"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-billing-service:sandbox-d37149bf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8132
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: QUARKUS_OIDC_CLIENT_ID
              value: openbank-services
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: billing-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: PRODUCT_CATALOG_SERVICE_URL
              value: http://keda-add-ons-http-interceptor-proxy.keda:8080
            # ADR-0083 T1 re-entry: the interceptor dispatches on Host; fee reads must wake
            # a scaled-to-zero catalog, not fail into a no-fees assessment (money path).
            - name: PRODUCT_CATALOG_HOST_OVERRIDE
              value: product-catalog.accounts.svc
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            # ADR-0143 step 2: BillingOutboxDispatcher posts fee charges to ledger-service over
            # HTTP (not Kafka — billing has no downstream event consumers for the charge itself).
            # Missing here, LEDGER_SERVICE_URL falls back to application.yaml's dev default
            # (http://localhost:8101) inside the pod, so every post-intent dead-letters after
            # exhausting retries with "circuit breaker is open" — found live during ADR-0143
            # real-environment e2e verification (issue #548 follow-up).
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # Datasource: single billing-db (billing-db.yaml). Reactive URL for the app
            # (Panache); JDBC URL for Flyway. Both username/password variants set, matching
            # the already-working fraud-service pattern (fraud-service.yaml).
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://billing-db-rw.billing.svc:5432/openbank_billing
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://billing-db-rw.billing.svc:5432/openbank_billing
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: billing-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: billing-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: billing-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: billing-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.billing.svc:6379
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Kafka producer -> Strimzi tls:9093 (mTLS, issue #4701). Wires the env vars
            # billing-service's own application.yaml has read since ADR-0248 shipped the
            # outbox producer -- this Deployment never supplied them, so every publish
            # attempt fell through SmallRye's connector default of localhost:9092.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in billing-service (billing.*).
        # Bundle mounted from billing-opa-bundle ConfigMap (gen-billing-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/billing_rest_ext.rego
              subPath: billing_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: billing-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: billing-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
spec:
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    - name: http
      port: 8132
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  podMetricsEndpoints:
    - port: management
      path: /q/metrics
