# billing-service: runtime fee assessment and posting (ADR-0143 phase 2c).
# Stateless — no database, no Kafka. Reads account state from account-service,
# balance-service, and product-catalog to compute fee assessments. Phase 2c-ii
# (ledger posting + outbox) is deploy-gated behind the four-eyes OPA gate
# (data.openbank.billing.ledger.post.allow). OIDC bearer-token validation
# against the Keycloak openbank realm (service-to-service client credentials).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: billing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-billing-service:sandbox-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8132
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: QUARKUS_OIDC_CLIENT_ID
              value: openbank-services
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: billing-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: PRODUCT_CATALOG_SERVICE_URL
              value: http://product-catalog.accounts.svc:8104
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
spec:
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    - name: http
      port: 8132
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: billing-service
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  podMetricsEndpoints:
    - port: management
      path: /q/metrics
