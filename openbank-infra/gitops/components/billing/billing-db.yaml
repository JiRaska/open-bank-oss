# SPDX-License-Identifier: Apache-2.0
# Single-owner Postgres for billing-service (cluster-wide CNPG operator, ADR-0009). Backs the
# fee-assessment persistence added across ADR-0143 phase 2c (#549 fee posting, #637/#672 fee
# reversal + DST scenario): billing_cycle_assessment / assessed_fee / billing_outbox
# (V1__init_billing.sql, V2__create_billing_outbox.sql, V3__hibernate_sequences.sql,
# V4__add_fee_reversal.sql). Generates the billing-db-app secret (username/password for the
# `openbank` owner) and a billing-db-rw Service the Deployment uses. Must reconcile BEFORE the
# billing-service image that carries the datasource config deploys, else Flyway-at-start fails on
# a missing DB (same pattern as product-catalog-db.yaml / anacredit-db.yaml).
# S3 WAL archiving + daily base backups are configured below (#1444).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: billing-db
  namespace: billing
spec:
  monitoring:
    enablePodMonitor: true
  # HA (ADR-0159): primary + hot standby with async streaming replication and
  # CNPG-managed automated failover. `enablePodAntiAffinity` + required
  # `kubernetes.io/hostname` keeps the two pods on DIFFERENT NODES — that is both
  # the HA guarantee and the fix for the single-instance un-drainable-PDB node-roll
  # block (issue #809): with a standby present the PDB permits one disruption, so
  # Karpenter drains/rolls a DB-hosting node without the manual delete-primary dance.
  # The topologySpreadConstraint softly spreads the pair across AZs when capacity
  # allows. Async replication (no minSyncReplicas) keeps the write path independent
  # of standby health; synchronous is deferred to a production decision (ADR-0159).
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: billing-db
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike or bulk load cannot fill the 2Gi volume (#1432).
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS
  # Pod Identity on the billing-db ServiceAccount (aws/.../db-backups.tf) — barman reads the
  # SDK chain, no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/billing-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openbank_billing
      owner: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: billing-db-daily
  namespace: billing
spec:
  schedule: "0 11 3 * * *"
  backupOwnerReference: self
  cluster:
    name: billing-db
