# SPDX-License-Identifier: Apache-2.0
# Per-service PrometheusRule for openbank-billing-service (money-path, ADR-0143). Refs #1682.
#
# WHY 5xx-rate and not the obvious signals:
#   * Readiness (`/q/health/ready`) is useless for a wedged DB pool. The default datasource
#     readiness check is a CONNECTIVITY probe (`SELECT 1` on a fresh connection); when the DB is
#     reachable but the pool holds poisoned connections, the probe grabs a fresh connection and
#     reports UP while every real request fails. Billing sat green for ~8h through exactly this.
#   * `openbank_outbox_backlog{service="billing"}` can't see it either — that gauge READS the
#     outbox table, so during a DB wedge its own query fails and it serves a STALE cached value
#     instead of rising.
#   * Billing has no OpenTelemetry (#1668), so trace-based SLOs (traces_spanmetrics_*) have no
#     series — the lending-style error-rate rule can't be reused here.
# So the one signal that both fires during a wedge AND does not itself depend on the DB is the
# micrometer HTTP server metric (quarkus-micrometer-registry-prometheus, scraped at /q/metrics):
# a request that hits the wedged pool returns 500, and recording that metric needs no DB.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-billing-alerts
  namespace: billing
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: billing-service
spec:
  groups:
    - name: openbank.billing.health
      rules:
        - alert: BillingServerErrorsWhileHealthy
          # Sustained 5xx on billing while the pod stays Ready = the silent-degradation signature
          # (a wedged datasource pool, a downstream 500 storm, etc.) that readiness cannot surface.
          # SERVER_ERROR is the stable micrometer outcome tag (covers 500/502/503/... in one series).
          # On an idle sandbox there is simply no series and the alert never fires — a false negative
          # with no caller is harmless; a real wedge always has failing callers.
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="billing", outcome="SERVER_ERROR"}[5m])) > 0.1
          for: 10m
          labels:
            severity: critical
            service: billing
          annotations:
            summary: "billing-service is returning 5xx while reporting Ready"
            description: "billing-service has sustained >0.1 server-error/s for >10m while its readiness probe is green. The DB pool may be wedged (a healthy DB is still reachable for the SELECT-1 readiness check while pooled connections are dead) — verify the reactive pg pool, not just billing-db. Refs #1682."

    - name: openbank.billing.outbox
      rules:
        # WHY a gauge over the table and not an error rate (#4701):
        #   DEAD is terminal by design (ADR-0050 N5) — once a row is parked, the failure has
        #   FINISHED failing. There is no rate left to watch, no log line emitted (listProcessable
        #   excludes DEAD, so the dispatcher never touches the row again), and
        #   `openbank_outbox_backlog{service="billing"}` counts PENDING+FAILED only, so it reads a
        #   fully-parked outbox as `0` — identical to a healthy idle one. This alert is therefore
        #   on a SUCCESS STATE ("no rows are parked"), which is the only observable left.
        #
        #   The `openbank_outbox_dead_total` COUNTER is not a substitute and cannot be: a Micrometer
        #   counter is not created until its first increment and resets on every pod restart, so it
        #   answers "did this process dead-letter anything", never "are there dead rows in the
        #   table". Measured 2026-08-09: zero series fleet-wide while two services held dead rows.
        #   `OutboxDeadLetterAlertNamingTest` pins the selector below to a real gauge registration.
        #
        # Two rules, split by what a human must do (#9690):
        #   - NEW dead rows PAGE. The count rose above its own 24h high-water mark, aggregated
        #     `max by (service)` so a pod restart (a fresh series booting at 0 and refreshing
        #     back to the same count) never reads as a rise. That is the "something just broke" signal.
        #   - STANDING dead rows are a TICKET (warning), not a page. The same two historic rows
        #     paged critically for weeks and re-fired on every fresh pod, which trained everyone to
        #     ignore the one control that says the GL is short. A row that has already been seen
        #     needs a disposition (runbook), not an on-call wake-up. Also aggregated, so a
        #     restart does not reset `for:` and re-announce the same rows.
        - alert: BillingOutboxDeadLetteredNew
          expr: max by (service) (openbank_outbox_dead_lettered{service="billing"}) > max by (service) (max_over_time(openbank_outbox_dead_lettered{service="billing"}[1d] offset 30m))
          for: 5m
          labels:
            severity: critical
            service: billing
          annotations:
            summary: "billing-service dead-lettered NEW outbox rows (fee postings that will never reach the ledger)"
            description: "openbank_outbox_dead_lettered{service=\"billing\"} rose above its 24h high-water mark: new billing_outbox rows went terminal DEAD. A transport fast-fail (breaker/bulkhead) does not consume the attempt budget, so a new DEAD row is a real per-row failure. Read last_error before anything else. Refs #4701, #9690."
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/svc-billing.md#dead-lettered-outbox-rows"
        - alert: BillingOutboxDeadLettered
          expr: max by (service) (openbank_outbox_dead_lettered{service="billing"}) > 0
          for: 1h
          labels:
            severity: warning
            service: billing
          annotations:
            summary: "billing-service has unresolved dead-lettered outbox rows (fees never posted to the ledger)"
            description: "{{ $value }} billing_outbox row(s) are in terminal DEAD and will never be retried. Each is a fee assessed but never posted, so the GL is short by exactly those rows. Needs an operator disposition (replay or write-off), not a page. Refs #4701, #4005, #9690."
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/svc-billing.md#dead-lettered-outbox-rows"
