# Three separate projections, so one unseeded value cannot stop the others syncing. Nothing in this
# repo mints or holds any of them; the owner seeds OpenBao (see docs/agents/regulatory-obligations-watcher.md).
#
# 1. The watcher's OWN Keycloak client secret (openbank-regulatory-obligations-watcher). KV layout
#    is ADR-0099's openbank/keycloak/<service> (property client_secret), the same entry the realm
#    import artifact reads (keycloak-realm-import-secret-sources.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulatory-obligations-watcher-oidc
  namespace: regulatory-obligations-watcher
  annotations:
    # ADR-0279: per-agent client secret, rotated with the realm client.
    open-bank.tech/rotation-deadline: "2027-11-19"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: regulatory-obligations-watcher-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_REGULATORY_WATCHER_CLIENT_SECRET
      remoteRef:
        key: keycloak/regulatory-obligations-watcher
        property: client_secret
---
# 2. This agent's budgeted LiteLLM virtual key (never a provider or master key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulatory-obligations-watcher-model
  namespace: regulatory-obligations-watcher
  annotations:
    open-bank.tech/rotation-deadline: "2027-11-19"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: regulatory-obligations-watcher-model
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REGULATORY_WATCHER_MODEL_API_KEY
      remoteRef:
        key: litellm
        property: KEY_REGULATORY_OBLIGATIONS_WATCHER
---
# 3. Fine-grained GitHub token, issues:write on this repository ONLY (no contents, no pull_requests):
#    draft.ticket is the charter's only write, and this credential cannot do anything else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regulatory-obligations-watcher-github
  namespace: regulatory-obligations-watcher
  annotations:
    open-bank.tech/rotation-deadline: "2027-11-19"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: regulatory-obligations-watcher-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REGULATORY_WATCHER_GITHUB_TOKEN
      remoteRef:
        key: regulatory-obligations-watcher
        property: GITHUB_TOKEN
