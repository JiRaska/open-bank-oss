# Dedicated Valkey for Langfuse v3/v4 (ADR-0328 decision 2, wave A) — the fleet redis.yaml pattern
# (components/agent/redis.yaml, components/copilot/redis.yaml).
#
# What Langfuse keeps here: the BullMQ ingestion/evaluation queues and short-lived caches. The
# event payloads themselves are in S3 before a queue job references them, so losing this keyspace
# loses queued WORK (jobs not yet processed into ClickHouse), not the events. Ephemeral on purpose:
# --save "" --appendonly no on an emptyDir, same trade as the fleet's other caches; the follow-up if
# queue loss on restart ever matters is AOF on a PVC, not a bigger pod.
#
# `--maxmemory-policy noeviction` is required by upstream: BullMQ silently loses jobs under any
# evicting policy, and a full keyspace must surface as a write ERROR in the worker, not as quietly
# missing traces. The maxmemory value stays below the container limit so Valkey refuses writes
# before the kernel OOM-kills it.
#
# No AUTH on the `default` user, like every fleet Valkey: the generated NetworkPolicy admits
# same-namespace callers only. The exporter sidecar logs in as its own least-privilege `metrics` user.
#
# Placement: `stateful` NodePool (see langfuse-clickhouse.yaml for why).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-valkey
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: langfuse-valkey
    app.kubernetes.io/part-of: ai-platform
  annotations:
    # The exporter port is reachable only by the Prometheus pods (not admin-ui, not all of
    # observability); read by gen-network-policies.py.
    open-bank.tech/metrics-ingress-prometheus-only: "true"
spec:
  replicas: 1
  # Terminate-first (#3545): single-writer queue store on an emptyDir behind one Service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-valkey
        app.kubernetes.io/part-of: ai-platform
    spec:
      nodeSelector:
        openbank.io/pool: stateful
      tolerations:
        - key: openbank.io/stateful
          operator: Equal
          value: "true"
          effect: NoSchedule
        # Node-key migration to open-bank.tech, stage 1: tolerate both taint keys.
        - key: open-bank.tech/stateful
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          # The metrics password never reaches argv or this container's environment (both end up in the
          # OCI runtime spec, i.e. `crictl inspect`): it is mounted as a FILE from the Secret (secret volumes
          # are tmpfs; mode 0440, group = fsGroup 1000), and a POSIX-sh wrapper renders the config into a
          # memory-medium emptyDir (/conf, never on disk) and execs valkey-server on it. It refuses to start
          # on an empty password or one that is not purely letters/digits (the generator emits exactly that;
          # anything else would break the quoted config line). The `default` user is left exactly as before
          # (existing clients connect unchanged); the config only ADDS a least-privilege `metrics` user.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mpw="$(cat /secrets/metrics/metrics_password)"
              case "$mpw" in
                ''|*[!A-Za-z0-9]*) echo "metrics password is empty or not [A-Za-z0-9]+: refusing to start" >&2; exit 1 ;;
              esac
              umask 077
              {
                echo 'save ""'
                echo 'appendonly no'
                echo 'dir /data'
                echo 'slowlog-log-slower-than -1'
                echo 'maxmemory 160mb'
                echo 'maxmemory-policy noeviction'
                # The exporter's OWN user: read-only server introspection, no key or channel access,
                # no data or admin commands, and no CONFIG GET. +command|info +commandlog|len: the exporter runs COMMAND INFO, then COMMANDLOG LEN
                # on Valkey 9 every scrape (measured: NOPERM in ACL LOG without them); metadata and a count only.
                # No +client|list: client addresses stay private, and redis_exporter only runs CLIENT LIST
                # with -export-client-list (default off). The slow log can echo command arguments, so it is
                # switched off (slowlog-log-slower-than -1); +slowlog|get stays granted because redis_exporter
                # v1.92.1 issues SLOWLOG GET on every scrape with no flag to skip it, and it now returns nothing.
                printf 'user metrics on >%s resetkeys resetchannels -@all +ping +info +client|setname +slowlog|get +slowlog|len +latency|latest +latency|histogram +command|info +commandlog|len\n' "$mpw"
              } > /conf/valkey.conf
              unset mpw
              exec valkey-server /conf/valkey.conf
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /conf
            - name: metrics-password
              mountPath: /secrets/metrics
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 15
          # ADR-0328 FinOps section: 50m / 64Mi.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
        # Same exporter sidecar as copilot-redis (multi-arch, non-alpine tag).
        - name: exporter
          image: docker.io/oliver006/redis_exporter:v1.92.1@sha256:7fbc93d30f0f91eed1b2fe6968a956259cc5d260a984dd9071f1d1e9c2692ecd
          # Logs in as the least-privilege `metrics` ACL user. Its password stays an env var (residual):
          # --redis.password-file only feeds the multi-target /scrape map (measured on #16791: a plain file
          # is rejected as non-JSON, a JSON map leaves the main target NOAUTH), and the URI form would put
          # it in argv. So this credential is in the exporter's container spec; it can read no data.
          # --disable-scrape-endpoint: no multi-target `/scrape?target=` endpoint.
          # --config-command=-: no CONFIG GET (the metrics user may not run it; maxmemory comes from INFO).
          args: ["--redis.addr=redis://localhost:6379", "--disable-scrape-endpoint", "--config-command=-"]
          env:
            - name: REDIS_USER
              value: metrics
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-valkey-exporter
                  key: metrics_password
          ports:
            - name: redis-metrics
              containerPort: 9121
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          emptyDir: {}
        # The rendered config holds the metrics password: tmpfs, never the node's disk.
        - name: conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # REQUIRED secret (no `optional`): without it the pod never starts.
        - name: metrics-password
          secret:
            secretName: langfuse-valkey-exporter
            defaultMode: 0440
            items:
              - key: metrics_password
                path: metrics_password
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-valkey
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: langfuse-valkey
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: langfuse-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: langfuse-valkey-metrics
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-valkey
  namespaceSelector:
    matchNames:
      - ai-platform
  podMetricsEndpoints:
    - port: redis-metrics
      path: /metrics
      interval: 30s
---
# Credential of the exporter's `metrics` ACL user. CLUSTER-GENERATED (ESO Password generator, no
# OpenBao copy: nothing outside the cluster holds it), `refreshPolicy: CreatedOnce` so it is stable
# across restarts. The Secret ref above is REQUIRED, so until ESO creates it the pod does not start.
# ROTATION: delete Secret ai-platform/langfuse-valkey-exporter, then restart the langfuse-valkey Deployment (both containers
# read it at start; the restart empties this ephemeral keyspace).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: langfuse-valkey-exporter-password
  annotations:
    # Before the Deployment that requires the Secret (wave 0).
    argocd.argoproj.io/sync-wave: "-1"
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # ADR-0279 #18: in-cluster exporter credential with no external holder; rotate per ROTATION above.
    open-bank.tech/rotation-deadline: "2027-11-19"
  name: langfuse-valkey-exporter
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: langfuse-valkey-exporter
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        metrics_password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: langfuse-valkey-exporter-password
