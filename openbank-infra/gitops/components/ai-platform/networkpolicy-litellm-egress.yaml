# Egress lockdown for the LiteLLM gateway (ADR-0175 §4). This is the ONE workload permitted to leave
# the cluster to a US LLM provider; every agent routes through it and (in a follow-up) is default-deny
# egress except to this Service, so the DeepInfra key and prompt egress have a single choke point.
#
# Hand-written and DELIBERATELY named networkpolicy-*.yaml (not network-policies.yaml) so
# gen-network-policies.py — which owns/overwrites network-policies.yaml and emits INGRESS only —
# never clobbers it (ADR-0081). LiteLLM's INGRESS allow-list (from the repointed agents' .svc URLs)
# is generator-owned; this file is egress-only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-egress
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Trace export to the in-cluster Langfuse (ADR-0265). MEASURED, not assumed: without this rule
    # every callback POST to langfuse.ai-platform.svc:3000 dies on a ConnectTimeout — same
    # namespace is NOT the same as allowed, because this pod carries an egress policy and an
    # egress policy is deny-by-default for everything it does not name. The failure is completely
    # silent from the outside: LiteLLM answers 200 to the caller, the pod stays 1/1 Running,
    # ArgoCD reports Synced and Healthy, and only `/api/public/traces` returning an empty list
    # says otherwise — which is exactly the blind spot runbook 0012 flags and #5671 tracks.
    #
    # The generator cannot derive this one. gen-network-policies.py emits INGRESS from declared
    # env URLs; the caller side of a new in-cluster edge is hand-written, and this file is where.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - protocol: TCP
          port: 3000
    # The deliberate internet hole: HTTPS to the LLM provider (DeepInfra). This is the only pod in
    # the fleet with 0.0.0.0/0:443 egress — the whole point of centralising the choke point here.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Its own Postgres (CNPG litellm-db, #3065). MISSING THIS CRASHLOOPED THE GATEWAY: #3065 gave
    # LiteLLM a DATABASE_URL — the prerequisite for virtual keys and for spend counters that survive
    # a restart — but this policy is Egress-DENY-by-default for the litellm pod, and 5432 was not on
    # it. Prisma could not reach the database, so startup failed with "Not connected to the query
    # engine" and the new ReplicaSet sat in CrashLoopBackOff for 12h / 180 restarts while the old one
    # kept serving. Nothing went red: the Deployment was simply stuck, the Service still answered
    # from the old pod, and ArgoCD reported Synced.
    #
    # Scoped to the CNPG pods of THIS cluster by label, not to the whole namespace — the choke point
    # ADR-0175 §4 establishes is about what may leave the cluster, and a same-namespace database
    # edge does not widen that, but there is no reason to grant more than the one peer it needs.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: litellm-db
      ports:
        - protocol: TCP
          port: 5432
