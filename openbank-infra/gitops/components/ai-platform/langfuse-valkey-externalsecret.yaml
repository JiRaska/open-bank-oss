# Valkey queue authentication for Langfuse web, worker, and metrics exporter.
# Seed the OpenBao property before syncing workloads. Rotate with a coordinated
# restart of Valkey, web, and worker; environment variables do not update in place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-valkey-auth
  namespace: ai-platform
  annotations:
    openbank.io/rotation-deadline: "2027-10-05"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: langfuse-valkey-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: langfuse
        property: VALKEY_PASSWORD
