#
# langfuse.open-bank.tech on the shared Gateway (ADR-0324 Phase 1), the Gateway API
# translation of langfuse-ingress.yaml. Same security posture as that file states
# (ADR-0031 D7): the UI only, synthetic data only; trace ingestion stays in-cluster.
#
# IN DNS since the cutover (2026-10-03): external-dns publishes langfuse.open-bank.tech from
# this route, pointing at the Gateway's NLB. The nginx Ingress now carries the
# `external-dns.kubernetes.io/controller: gateway-api-cutover-pending` annotation instead, so
# external-dns ignores it; it stays in place, still serving on ingress-nginx's NLB, as the
# rollback (swap the annotation back) until it is deleted in a later change.
#
# Annotation mapping from langfuse-ingress.yaml:
#   ssl-redirect            -> the Gateway's http listener redirects every host (envoy-gateway)
#   custom-headers + the controller's HSTS / nosniff / hide-headers
#                           -> ResponseHeaderModifier below, same values
#   (nginx default) client_max_body_size 1m, proxy_read_timeout 60s
#                           -> BackendTrafficPolicy below; Envoy otherwise has no body cap
#                              and a 15s route timeout
#   tls / cluster-issuer    -> the Gateway's https-langfuse listener serves its OWN
#                              Certificate `langfuse-edge-tls` (below), admitted by the
#                              ReferenceGrant below
#
# Why a separate Certificate instead of the Ingress's `langfuse-tls`: cert-manager runs with
# --enable-certificate-owner-ref, so `langfuse-tls` is owned (via its Certificate) by the
# Ingress. Deleting the Ingress after the cutover would garbage-collect the Secret the Gateway
# serves. A Certificate declared here has no such owner. No key pinning exists for this host,
# so a fresh key is harmless (rum, which IS pinned, is handled differently).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: langfuse-edge-tls
  namespace: ai-platform
spec:
  secretName: langfuse-edge-tls
  dnsNames:
    - langfuse.open-bank.tech
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-gateway-tls
  namespace: ai-platform
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: langfuse-edge-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: ai-platform
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https-langfuse
  hostnames:
    - langfuse.open-bank.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Robots-Tag
                value: "noindex, nofollow"
            remove:
              - X-Powered-By
      # Langfuse web (langfuse-v3.yaml) since ADR-0328 wave B; the v2 Service `langfuse` was
      # deleted in wave C1.
      backendRefs:
        - name: langfuse-web
          port: 3000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: langfuse
  namespace: ai-platform
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: langfuse
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      requestTimeout: 60s
