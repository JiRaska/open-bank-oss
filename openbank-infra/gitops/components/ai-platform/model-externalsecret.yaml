# LiteLLM secrets, projected from OpenBao by ESO (ADR-0174/0175).
# Seed (owner, break-glass):
#   bao kv patch openbank/litellm \
#     DEEPINFRA_API_KEY=<the existing DeepInfra key> \
#     LITELLM_MASTER_KEY=sk-<a fresh random virtual key>
# Until seeded both refs are `optional: true`, so LiteLLM starts and simply rejects calls (agents
# then degrade to their deterministic fallback) rather than CrashLooping.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: litellm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: DEEPINFRA_API_KEY
      remoteRef:
        key: litellm
        property: DEEPINFRA_API_KEY
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: LITELLM_MASTER_KEY
    # Groq key for the llama-3.3-70b-versatile route (#1919). Read from the EXISTING
    # `openbank/agent-service` KV path — no new seeding step — so the credential relocates into the
    # gateway pod instead of being copied to a second place. Once agent-service is confirmed routed,
    # `openbank/agent-service:GROQ_API_KEY` can be dropped from es-agent-service.yaml.
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: agent-service
        property: GROQ_API_KEY
