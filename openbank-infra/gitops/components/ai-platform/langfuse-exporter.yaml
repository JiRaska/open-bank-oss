#
# Langfuse -> Prometheus bridge (ADR-0112 P1).
#
# WHY: admin-ui's /api/finops/ai-costs gates on `langfuse_up == 1` and reads
# `langfuse_agent_tokens_total{agent_id,model}` joined `on(model)` with
# `langfuse_model_cost_per_token{model}`. Until this file nothing exported any `langfuse_*`
# series (measured 2026-10-30: zero in Prometheus), so the FinOps page could only say
# "unavailable".
#
# SOURCE: Langfuse's public metrics API v2 (`GET /api/public/v2/metrics`). The v1 endpoints
# (`/api/public/metrics`, `/api/public/metrics/daily`) answer 404 on this deployment because
# Langfuse 4.x runs in events_only mode (measured against langfuse-web 4.50.0, 2026-10-30).
#
# COUNTER SEMANTICS: the API returns per-day SUMS, which shrink as days age out of retention, so
# they cannot be exported as a counter directly (Prometheus would read every shrink as a reset
# and increase() would double-count). The exporter tracks the last value it saw per
# (agent, model, day) and adds only the growth. The first poll after start SEEDS that state
# without incrementing — a restart therefore loses at most one poll interval, instead of
# replaying the whole retention window as one giant increase.
#
# FAILURE: any failed poll sets `langfuse_up 0` and leaves the counters where they were. If the
# exporter pod itself is gone, `langfuse_up` is absent; the route treats both as unavailable.
#
# AGENT ATTRIBUTION: Langfuse has no first-class "agent" field. AGENT_DIMENSION selects the
# Langfuse dimension used as `agent_id` (default `userId`); rows without it are exported as
# agent_id="unattributed" rather than dropped, so totals stay complete.
#
# CREDENTIAL: the project key pair from `langfuse-secrets` (OpenBao `openbank/langfuse`, ESO).
# Langfuse OSS has no read-only key scope, so a second key would be no narrower; the exporter
# only ever issues GETs, and no key is a literal anywhere in this repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-exporter-script
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/name: langfuse-exporter
data:
  langfuse_exporter.py: |
    #!/usr/bin/env python3
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    """Langfuse -> Prometheus bridge (ADR-0112 P1). Stdlib only."""
    import base64
    import datetime as dt
    import json
    import os
    import threading
    import time
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UNATTRIBUTED = "unattributed"


    def build_query(agent_dimension, now):
        """Today and yesterday (UTC), per day, per model and agent dimension."""
        start = (now - dt.timedelta(days=1)).replace(hour=0, minute=0, second=0, microsecond=0)
        return {
            "view": "observations",
            "metrics": [
                {"measure": "totalTokens", "aggregation": "sum"},
                {"measure": "totalCost", "aggregation": "sum"},
            ],
            "dimensions": [{"field": "providedModelName"}, {"field": agent_dimension}],
            "filters": [],
            "timeDimension": {"granularity": "day"},
            "fromTimestamp": start.strftime("%Y-%m-%dT%H:%M:%SZ"),
            "toTimestamp": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
        }


    def _num(value):
        try:
            number = float(value)
        except (TypeError, ValueError):
            return 0.0
        return number if number == number and number >= 0 else 0.0


    def parse_rows(payload, agent_dimension):
        """-> {(agent, model, day): (tokens, cost)}. Rows without a model are skipped."""
        out = {}
        for row in payload.get("data", []):
            model = row.get("providedModelName")
            if not model:
                continue
            agent = row.get(agent_dimension) or UNATTRIBUTED
            day = str(row.get("time_dimension", ""))[:10]
            key = (str(agent), str(model), day)
            tokens, cost = out.get(key, (0.0, 0.0))
            out[key] = (tokens + _num(row.get("sum_totalTokens")), cost + _num(row.get("sum_totalCost")))
        return out


    class State:
        def __init__(self):
            self.lock = threading.Lock()
            self.up = 0
            self.seeded = False
            self.seen = {}          # (agent, model, day) -> (tokens, cost)
            self.tokens_total = {}  # (agent, model) -> float
            self.cost_total = {}    # (agent, model) -> float
            self.cost_per_token = {}  # model -> float
            self.last_success = None

        def apply(self, rows, now_epoch):
            with self.lock:
                for key, (tokens, cost) in rows.items():
                    prev_tokens, prev_cost = self.seen.get(key, (0.0, 0.0))
                    series = key[:2]
                    self.tokens_total.setdefault(series, 0.0)
                    self.cost_total.setdefault(series, 0.0)
                    if self.seeded:
                        self.tokens_total[series] += max(0.0, tokens - prev_tokens)
                        self.cost_total[series] += max(0.0, cost - prev_cost)
                    self.seen[key] = (max(tokens, prev_tokens), max(cost, prev_cost))
                # Effective USD/token per model over the polled window, measured, not a price list.
                by_model = {}
                for (_agent, model, _day), (tokens, cost) in rows.items():
                    t, c = by_model.get(model, (0.0, 0.0))
                    by_model[model] = (t + tokens, c + cost)
                for model, (tokens, cost) in by_model.items():
                    if tokens > 0:
                        self.cost_per_token[model] = cost / tokens
                # Forget days older than the query window so memory stays bounded.
                days = {key[2] for key in rows}
                if days:
                    oldest = min(days)
                    self.seen = {k: v for k, v in self.seen.items() if k[2] >= oldest}
                self.seeded = True
                self.up = 1
                self.last_success = now_epoch

        def fail(self):
            with self.lock:
                self.up = 0

        def render(self):
            def esc(value):
                return value.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")

            with self.lock:
                lines = [
                    "# HELP langfuse_up 1 if the last poll of the Langfuse metrics API succeeded.",
                    "# TYPE langfuse_up gauge",
                    f"langfuse_up {self.up}",
                    "# HELP langfuse_agent_tokens_total Tokens observed in Langfuse since exporter start.",
                    "# TYPE langfuse_agent_tokens_total counter",
                ]
                for (agent, model), value in sorted(self.tokens_total.items()):
                    lines.append(f'langfuse_agent_tokens_total{{agent_id="{esc(agent)}",model="{esc(model)}"}} {value}')
                lines += [
                    "# HELP langfuse_agent_cost_usd_total USD cost observed in Langfuse since exporter start.",
                    "# TYPE langfuse_agent_cost_usd_total counter",
                ]
                for (agent, model), value in sorted(self.cost_total.items()):
                    lines.append(f'langfuse_agent_cost_usd_total{{agent_id="{esc(agent)}",model="{esc(model)}"}} {value}')
                lines += [
                    "# HELP langfuse_model_cost_per_token Effective USD per token per model (Langfuse cost / tokens).",
                    "# TYPE langfuse_model_cost_per_token gauge",
                ]
                for model, value in sorted(self.cost_per_token.items()):
                    lines.append(f'langfuse_model_cost_per_token{{model="{esc(model)}"}} {value}')
                if self.last_success is not None:
                    lines += [
                        "# TYPE langfuse_exporter_last_success_timestamp_seconds gauge",
                        f"langfuse_exporter_last_success_timestamp_seconds {self.last_success}",
                    ]
                return "\n".join(lines) + "\n"


    def fetch(host, public_key, secret_key, query, timeout=20):
        url = f"{host.rstrip('/')}/api/public/v2/metrics?query={urllib.parse.quote(json.dumps(query))}"
        token = base64.b64encode(f"{public_key}:{secret_key}".encode()).decode()
        req = urllib.request.Request(url, headers={"Authorization": f"Basic {token}"})
        with urllib.request.urlopen(req, timeout=timeout) as res:
            return json.loads(res.read())


    def poll_once(state, fetcher, agent_dimension, now=None):
        now = now or dt.datetime.now(dt.timezone.utc)
        try:
            payload = fetcher(build_query(agent_dimension, now))
            if not isinstance(payload, dict) or not isinstance(payload.get("data"), list):
                raise ValueError("unexpected metrics payload shape")
            state.apply(parse_rows(payload, agent_dimension), now.timestamp())
        except Exception as exc:  # noqa: BLE001 - any failure is "Langfuse unavailable"
            print(f"langfuse-exporter: poll failed: {type(exc).__name__}: {exc}", flush=True)
            state.fail()


    def main():
        host = os.environ["LANGFUSE_HOST"]
        public_key = os.environ["LANGFUSE_PUBLIC_KEY"]
        secret_key = os.environ["LANGFUSE_SECRET_KEY"]
        agent_dimension = os.environ.get("AGENT_DIMENSION", "userId")
        interval = int(os.environ.get("POLL_SECONDS", "60"))
        port = int(os.environ.get("LISTEN_PORT", "8085"))
        state = State()

        def loop():
            while True:
                poll_once(state, lambda q: fetch(host, public_key, secret_key, q), agent_dimension)
                time.sleep(interval)

        threading.Thread(target=loop, daemon=True).start()

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path not in ("/metrics", "/healthz"):
                    self.send_error(404)
                    return
                body = (state.render() if self.path == "/metrics" else "ok\n").encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *_args):
                pass

        ThreadingHTTPServer(("", port), Handler).serve_forever()


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-exporter
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: langfuse-exporter
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  # Stateless poller: terminate-first costs seconds of scrape gap and can never deadlock on a full
  # cluster (issue #3545).
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-exporter
        app.kubernetes.io/part-of: ai-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          # Same pinned image holmes-rca and the gate-health puller run their ConfigMap scripts on.
          image: docker.io/library/python:3.14.8-slim
          command: ["python", "/app/langfuse_exporter.py"]
          ports:
            - name: metrics
              containerPort: 8085
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LANGFUSE_HOST
              value: http://langfuse-web.ai-platform.svc:3000
            - name: AGENT_DIMENSION
              value: userId
            - name: POLL_SECONDS
              value: "60"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: {name: langfuse-secrets, key: LANGFUSE_PUBLIC_KEY}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: langfuse-secrets, key: LANGFUSE_SECRET_KEY}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: langfuse-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-exporter
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: langfuse-exporter
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: langfuse-exporter
  ports:
    - name: metrics
      port: 8085
      targetPort: metrics
