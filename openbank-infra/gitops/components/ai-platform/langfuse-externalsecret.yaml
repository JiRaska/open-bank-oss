# Langfuse secrets, projected from OpenBao by ESO (ADR-0174/0175).
#
# Seed (owner, break-glass) — every value is generated locally, none is a third-party credential:
#   bao kv patch openbank/langfuse \
#     NEXTAUTH_SECRET=$(openssl rand -base64 32) \
#     SALT=$(openssl rand -base64 32) \
#     ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     LANGFUSE_PUBLIC_KEY=pk-lf-$(uuidgen | tr 'A-Z' 'a-z') \
#     LANGFUSE_SECRET_KEY=sk-lf-$(uuidgen | tr 'A-Z' 'a-z') \
#     INIT_USER_EMAIL=<operator email> \
#     INIT_USER_PASSWORD=$(openssl rand -base64 24)
#
# ENCRYPTION_KEY must be exactly 64 hex chars (256-bit) — `openssl rand -hex 32`, NOT -base64.
# Langfuse refuses to start otherwise, which on a fresh install reads as a crashloop with a single
# validation line buried in the first seconds of log.
#
# NOT optional, unlike litellm-secrets. There the degraded mode is meaningful: an unseeded provider
# key leaves the gateway serving and rejecting calls, and callers fall back deterministically. Here
# an absent NEXTAUTH_SECRET/SALT/ENCRYPTION_KEY means the pod cannot start at all, so marking the
# refs optional would only convert a clear "secret missing" into an obscure startup failure. The
# LANGFUSE_* project keys are equally non-optional because they are consumed on FIRST BOOT to
# create the project — a pod that starts without them creates a project with different, unknown
# keys, and LiteLLM's callback then authenticates against nothing while both pods look healthy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: langfuse-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: langfuse
        property: NEXTAUTH_SECRET
    - secretKey: SALT
      remoteRef:
        key: langfuse
        property: SALT
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: langfuse
        property: ENCRYPTION_KEY
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse
        property: LANGFUSE_SECRET_KEY
    - secretKey: INIT_USER_EMAIL
      remoteRef:
        key: langfuse
        property: INIT_USER_EMAIL
    - secretKey: INIT_USER_PASSWORD
      remoteRef:
        key: langfuse
        property: INIT_USER_PASSWORD
