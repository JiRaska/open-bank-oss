# Trace retention for the self-hosted Langfuse database (ADR-0265 follow-up, #5671).
#
# WHY THIS EXISTS AS A HAND-ROLLED CRONJOB. Langfuse's UI-configurable "Data Retention" feature
# requires the Self-Hosted Enterprise Edition — verified against upstream docs before building
# this: the OSS self-host this cluster runs (langfuse-v3.yaml, and v2's langfuse.yaml before it)
# stores data indefinitely with no retention control of its own. Buying a licence for one knob
# would break ADR-0027's in-cluster-OSS posture; the alternative upstream itself documents for
# self-hosters without EE is exactly this — periodic DELETE statements against its own tables.
#
# TWO STORES SINCE ADR-0328 WAVE B (decision 3). Langfuse v3 writes traces, observations and
# scores to its own ClickHouse (langfuse-clickhouse.yaml); the same three tables in Postgres are
# v2's. v2 itself is gone since wave C1, but its tables stay: they are what the v2->v3 background
# migrations copy from (and re-copy from, if a copy ever has to be repeated), they still hold
# prompts and completions, and nothing else deletes them. They no longer grow, so the Postgres
# sweep finds nothing once the last v2 row is older than the window (about 30 days after wave B,
# 2026-11-02); it stays until a PR drops those tables, because removing it first would leave
# whatever is still inside the window there indefinitely. So the job runs two sweeps, in order:
#   1. clickhouse-sweep (initContainer) — ALTER TABLE ... DELETE on events_core / events_full
#      (v4's store) and traces / observations / scores / blob_storage_file_log (v3's, still read
#      for history and still holding it). If it fails, the pod never reaches step 2 and the Job
#      fails.
#   2. sweep (container) — the Postgres sweep over v2's tables, unchanged.
# The S3 bucket's lifecycle rule (aws/envs/sandbox-platform/langfuse-s3.tf) expires the raw event
# objects on the same window; this job does not touch S3.
#
# WHY DIRECT DELETEs AND NOT THE LANGFUSE API. The public API's delete path is documented as
# asynchronous and rate-limited, the wrong shape for a nightly sweep that must report how much it
# actually freed. A direct DELETE against stores this component owns is synchronous and countable.
#
# CLICKHOUSE SCHEMA FACTS (Langfuse 4.50.0, read off the tables 4.50.0 creates on the pinned server
# image after 3.29.0 -> 3.225.11 -> 4.50.0, and the sweep run against them):
#   - age columns: events_full.start_time and events_core.start_time (v4; ReplacingMergeTree,
#     PARTITION BY toYYYYMM(start_time)), traces.timestamp, observations.start_time,
#     scores.timestamp, blob_storage_file_log.created_at (indexes the S3 event files);
#   - events_core is fed from events_full by the materialized view events_core_mv, which fires on
#     INSERT only, so a DELETE on events_full leaves events_core untouched: both are swept;
#   - event_log is DROPPED by v4 (ClickHouse migration 0044), so it is no longer swept — naming a
#     missing table would fail every run. observations_batch_staging carries its own 48 h TTL and
#     observations_pid_tid_sorting is dropped by background migration step 5 (see langfuse-v3.yaml);
#   - traces/observations/scores are ReplacingMergeTree(event_ts, is_deleted), so count() counts
#     row VERSIONS, which is what a DELETE frees on disk; the sweep reports that number;
#   - a plain ALTER ... DELETE is a mutation that returns before it runs. mutations_sync = 1 makes
#     it block on this single-node server, and the sweep RECOUNTS afterwards: "freed" is
#     before - after, both measured, and a non-zero remainder fails the Job instead of logging a
#     number the database does not agree with (proven by disabling the DELETE: exit 1).
#   - a row dated in the FUTURE can never age out, so the sweep refuses to report success while
#     one exists. Not hypothetical: ClickHouse 26.8 read Langfuse's epoch-ms datetimes as seconds
#     and stored 9999-12-31 for every row until the settings profile in langfuse-clickhouse.yaml
#     (#12033). A silent sweep over such rows deletes nothing, every night, and looks green.
#
# POSTGRES SCHEMA FACTS (langfuse v2 tables, verified against upstream before the original sweep):
#   - `traces.timestamp`, `observations.start_time`, `scores.timestamp` are the age columns.
#   - There are NO foreign-key CASCADE constraints between them, so each table is swept
#     independently; children before parent, so a job killed mid-run leaves a trace with no
#     observations (which the UI tolerates) rather than an observation with no trace.
#
# RETENTION WINDOW: 30 days. Matches this cluster's shortest existing data-retention precedent
# (Loki logs, prometheus-rules) rather than inventing a new number; traces are debugging evidence
# for a live incident, not a compliance record — the durable AI-attribution record is the
# hash-chained audit_entries table (ADR-0031 D5), which this job never touches.
#
# PSS restricted: non-root, no capabilities, seccompProfile RuntimeDefault — same posture as
# secret-rotator-cronjob.yaml, which this manifest's shape otherwise follows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-retention-sweep
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
data:
  sweep.sh: |
    #!/bin/sh
    set -eu

    # ---------------------------------------------------------------------------
    # Langfuse trace retention sweep — deletes rows older than RETENTION_DAYS.
    # ---------------------------------------------------------------------------
    RETENTION_DAYS="${RETENTION_DAYS:-30}"

    # `-v ON_ERROR_STOP=1`: a failed statement must fail the job, not print an error and continue
    # to the next table looking green. ONE statement, ONE connection — an earlier version of this
    # ran the DELETE twice (once discarded, once counted via RETURNING) and would have reported
    # "0 deleted" every single night while actually deleting the rows on the first, uncounted call.
    #
    # `-q` is not cosmetic: without it, `psql -tA` still prints psql's OWN "DELETE <n>" command-
    # status line interleaved with the `RETURNING 1` data rows, so `wc -l` counts BOTH and reports
    # exactly one more deletion than actually happened. Measured locally against a real Postgres
    # before trusting this: `psql -tA` on a single-row delete emitted `1\nDELETE 1\n` (two lines),
    # `psql -qtA` emitted `1\n` (one). Verified end to end with a seeded old/new row pair per table:
    # the sweep must report the same count the database shows afterward, not one more.
    delete_older_than() {
      table="$1"
      column="$2"
      deleted="$(psql -v ON_ERROR_STOP=1 -qtA -c \
        "DELETE FROM ${table} WHERE ${column} < now() - interval '${RETENTION_DAYS} days' RETURNING 1" \
        | wc -l | tr -d ' ')"
      echo "langfuse-retention: ${table} (${column}) -> deleted ${deleted} row(s) older than ${RETENTION_DAYS}d"
    }

    echo "langfuse-retention: sweep start, retention=${RETENTION_DAYS}d"
    # Children first (see the manifest header: no FK cascade, so ordering is the only thing
    # standing between "orphaned children" and "orphaned parent" on a mid-run failure).
    delete_older_than observations start_time
    delete_older_than scores timestamp
    delete_older_than traces timestamp
    echo "langfuse-retention: sweep complete"
  clickhouse-sweep.sh: |
    #!/bin/sh
    set -eu

    # ---------------------------------------------------------------------------
    # Langfuse v3 ClickHouse retention sweep — deletes row versions older than RETENTION_DAYS.
    # ---------------------------------------------------------------------------
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    case "$RETENTION_DAYS" in ''|*[!0-9]*) echo "langfuse-retention: RETENTION_DAYS must be an integer" >&2; exit 1 ;; esac

    # clickhouse-client reads CLICKHOUSE_HOST/USER/PASSWORD from the environment (native port 9000).
    ch() { clickhouse-client --host "$CH_HOST" --user "$CH_USER" --password "$CLICKHOUSE_PASSWORD" --query "$1"; }

    # ONE cutoff for the whole run, fixed as a literal. Evaluating now() inside each statement would
    # let the count and the DELETE disagree about which rows are "old" by however long the run takes.
    CUTOFF="$(ch "SELECT toString(now64(3, 'UTC') - INTERVAL ${RETENTION_DAYS} DAY)")"
    echo "langfuse-retention[clickhouse]: sweep start, retention=${RETENTION_DAYS}d, cutoff=${CUTOFF} UTC"

    # Count, delete, count again. "Freed" is before minus after, both MEASURED — never the number we
    # asked to delete. A non-zero remainder after a synchronous mutation fails the job: it means the
    # DELETE did not do what this line is about to report.
    delete_older_than() {
      table="$1"
      column="$2"
      pred="${column} < toDateTime64('${CUTOFF}', 3, 'UTC')"
      before="$(ch "SELECT count() FROM ${table} WHERE ${pred}")"
      if [ "$before" -gt 0 ]; then
        # ALTER ... DELETE is a mutation; mutations_sync=1 blocks until it has finished on this
        # (single-node) server, so the recount below sees the result rather than a queued intent.
        ch "ALTER TABLE ${table} DELETE WHERE ${pred} SETTINGS mutations_sync = 1"
      fi
      after="$(ch "SELECT count() FROM ${table} WHERE ${pred}")"
      echo "langfuse-retention[clickhouse]: ${table} (${column}) -> deleted $((before - after)) row(s) older than ${RETENTION_DAYS}d (before=${before} remaining=${after})"
      if [ "$after" -ne 0 ]; then
        echo "langfuse-retention[clickhouse]: ${table} still holds ${after} row(s) past the cutoff after a synchronous DELETE" >&2
        exit 1
      fi
    }

    # Rows dated more than a day ahead are outside every window this job can express. Count them
    # BEFORE deleting anything and fail at the end if any exist (see the header: the 9999 rows).
    future_total=0
    future_rows() {
      table="$1"
      column="$2"
      n="$(ch "SELECT count() FROM ${table} WHERE ${column} > now64(3, 'UTC') + INTERVAL 1 DAY")"
      if [ "$n" -ne 0 ]; then
        echo "langfuse-retention[clickhouse]: ${table} holds ${n} row(s) with ${column} more than a day in the future; retention cannot age them out" >&2
      fi
      future_total=$((future_total + n))
    }

    future_rows events_core start_time
    future_rows events_full start_time
    future_rows observations start_time
    future_rows scores timestamp
    future_rows traces timestamp

    # Children first, as in the Postgres sweep: a run killed midway leaves a trace with no
    # observations (which the UI shows) rather than observations with no trace.
    delete_older_than events_core start_time
    delete_older_than events_full start_time
    delete_older_than observations start_time
    delete_older_than scores timestamp
    delete_older_than traces timestamp
    # blob_storage_file_log indexes the raw event files in S3; the bucket's lifecycle rule expires
    # the objects themselves.
    delete_older_than blob_storage_file_log created_at
    if [ "$future_total" -ne 0 ]; then
      echo "langfuse-retention[clickhouse]: ${future_total} future-dated row(s) remain; failing so this is seen" >&2
      exit 1
    fi
    echo "langfuse-retention[clickhouse]: sweep complete"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-retention-sweep
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
  annotations:
    # Budget for CronJobSuccessStale (prometheus-rules-jobs.yaml): two missed runs of '15 3 * * *' plus slack.
    openbank.tech/max-success-age-seconds: "180000"
spec:
  # 03:15 UTC daily — outside the litellm-db-daily (04:49) and langfuse-db-daily (04:19) backup
  # windows in postgres.yaml/langfuse-postgres.yaml, so a large delete's WAL churn does not
  # overlap the nightly backup taking its own base-backup snapshot.
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # 1800, up from 600: the run now includes synchronous ClickHouse mutations, which rewrite
      # every affected part; the deadline is the backstop, not the expected duration.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: ai-platform
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            # Step 1 of 2 (header): the v3 ClickHouse sweep. An initContainer, so a failure here
            # stops the pod before the Postgres sweep and fails the Job visibly.
            - name: clickhouse-sweep
              # The exact image langfuse-clickhouse.yaml runs, for its clickhouse-client — so the
              # client and server versions can never drift apart.
              image: docker.io/clickhouse/clickhouse-server:26.8-alpine@sha256:e08c778ff91f382a15bd0ce9c0fa21e8edc9aa8acc30c4666160000d9a918454
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/clickhouse-sweep.sh"]
              env:
                - name: RETENTION_DAYS
                  value: "30"
                - name: HOME
                  value: /tmp
                # Native protocol (9000); the langfuse-clickhouse-ingress-allow-list admits every
                # pod in ai-platform. Same user and secret langfuse-web/worker use.
                - name: CH_HOST
                  value: langfuse-clickhouse.ai-platform.svc
                - name: CH_USER
                  value: langfuse
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: langfuse-clickhouse-auth, key: CLICKHOUSE_PASSWORD}
              securityContext:
                runAsUser: 101
                runAsGroup: 101
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: home
                  mountPath: /tmp
          containers:
            # Step 2 of 2: the Postgres sweep over v2's tables.
            - name: sweep
              # Same image family as the CNPG cluster it targets (postgres.yaml /
              # langfuse-postgres.yaml), pulled through the ECR cache (#1290) — psql client only,
              # no server role, so the small size difference from a dedicated psql-only image is
              # not worth a second pinned image to track.
              image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/ghcr/cloudnative-pg/postgresql:18.6
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/sweep.sh"]
              env:
                - name: RETENTION_DAYS
                  value: "30"
                # psql looks for $HOME/.psql_history and $HOME/.pgpass; runAsUser 1000 has no
                # /etc/passwd entry in this image, so $HOME is otherwise unset and psql falls back
                # to writing under `/`, which readOnlyRootFilesystem blocks with a warning (not a
                # failure — psql doesn't need the history file — but a needless stderr line on
                # every run). Point it at the writable emptyDir mounted below instead.
                - name: HOME
                  value: /tmp
                # langfuse-db-app is the CNPG-generated app-role secret (langfuse-postgres.yaml
                # bootstrap.initdb.owner: langfuse) — same credential the Langfuse pod itself uses,
                # so this job needs no new OpenBao seeding step and no elevated (superuser) access:
                # DELETE on your own rows only requires ownership, which the app role already has.
                - name: PGHOST
                  value: langfuse-db-rw.ai-platform.svc
                - name: PGDATABASE
                  value: langfuse
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: {name: langfuse-db-app, key: user}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: langfuse-db-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                # psql writes its history file under $HOME by default; readOnlyRootFilesystem
                # leaves no writable $HOME, so point it at a mounted emptyDir instead of disabling
                # the root-fs restriction for one non-essential feature.
                - name: home
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: langfuse-retention-sweep
                # 0555 and not 0o555: this is parsed by YAML 1.1 (Kubernetes, SnakeYAML, Trivy's
                # scanner), which has no `0o` prefix — it reads that as the STRING "0o555" against
                # an int32 field. The seven sibling manifests in this tree all spell it 0555.
                defaultMode: 0555
            - name: home
              emptyDir: {}
