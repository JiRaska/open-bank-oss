apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: presidio-anonymizer
  namespace: ai-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-anonymizer
