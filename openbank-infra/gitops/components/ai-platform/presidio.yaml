        app.kubernetes.io/name: presidio-anonymizer
        app.kubernetes.io/part-of: ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: presidio-anonymizer
      containers:
        - name: presidio-anonymizer
          image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Gunicorn 25.1 creates its control socket `gunicorn.ctl` in the working directory
            # (/app), which a read-only root filesystem refuses: "[ERROR] Control server error:
            # [Errno 30] Read-only file system", and the analyzer never reports healthy. Measured
            # locally; moving the socket to the /tmp emptyDir fixes it without giving up
            # readOnlyRootFilesystem. HOME points poetry's cache at the same volume.
            - name: GUNICORN_CMD_ARGS
              value: "--control-socket /tmp/gunicorn.ctl"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: presidio-analyzer
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: presidio-analyzer
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: presidio-anonymizer
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: presidio-anonymizer
  ports:
    - name: http
      port: 3000
      targetPort: http
