# Langfuse — LLM observability for the AI stack (ADR-0031 D6/D7, ADR-0174).
#
# WHAT IT ADDS THAT OTel DOES NOT. The fleet already traces LLM calls (Tempo) and counts them
# (`openbank.llm.*`, Prometheus). Neither stores the PROMPT and the COMPLETION, and neither groups
# calls into a run. So today a question like "what did the copilot actually answer that customer,
# with which retrieved context, and what did that run cost" is unanswerable after the fact — the
# only durable evidence is the audit envelope's `prompt_hash`, which by construction cannot be read
# back. Langfuse stores the payloads, keyed by trace id, next to the token/cost numbers.
#
# WHY v2 AND NOT v3. Langfuse v3 splits into web + worker and requires ClickHouse, Redis and S3.
# The v2 line is a single container over one Postgres — the difference between one new workload and
# five, on a sandbox cluster where a single-replica rollout has already deadlocked once for want of
# room to surge. v3 is the upgrade path when trace volume justifies it; the migration is documented
# by upstream and the data lives in Postgres either way.
#
# INGESTION IS SERVER-SIDE, NOT PER-SERVICE. LiteLLM posts the traces (litellm-config.yaml
# `success_callback: ["langfuse"]`), so every caller that already routes through the gateway is
# covered with no application change and no second SDK in ~34 services. The cost is that the trace
# is what the GATEWAY saw: a Kotlin service's own span context is not automatically the Langfuse
# trace id. Correlating those is the follow-up (`trace_id` in the metadata header), not something
# this manifest silently claims.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  # Terminate-first, for the reason litellm.yaml documents: with one replica the default
  # maxSurge 1 / maxUnavailable 0 needs room for two pods, and on a full cluster the rollout never
  # completes while reporting 1/1 READY.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse
        app.kubernetes.io/part-of: ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langfuse
          # docker.io is proxied transparently by the in-cluster registry-cache via containerd
          # hosts.toml — no prefix needed and no NAT cost (see kyverno/ecr-pull-through-rewrite.yaml).
          image: docker.io/langfuse/langfuse:2.95.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-db-app
                  key: uri
            # Public origin. Langfuse builds its auth callbacks from this, so a wrong value breaks
            # login with a redirect error rather than an obvious failure.
            - name: NEXTAUTH_URL
              value: https://langfuse.open-bank.tech
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: NEXTAUTH_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: SALT
            # Encrypts stored provider keys and other secrets at rest in Postgres.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: ENCRYPTION_KEY
            # No open sign-up on a public origin: without this anyone reaching the host can create
            # an account and read every trace. The one operator account is seeded headlessly below.
            - name: AUTH_DISABLE_SIGNUP
              value: "true"
            - name: TELEMETRY_ENABLED
              value: "false"
            # Langfuse phones home for a newer version banner; the pod has no egress for it and the
            # check would just log failures.
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            # Headless initialisation (LANGFUSE_INIT_*): the org, project, API keys and the operator
            # user are created on FIRST BOOT from these values, so the keys LiteLLM authenticates
            # with are declared in OpenBao rather than clicked into a UI and pasted into a secret.
            # This is what makes the whole component reproducible from git — and it is the reason
            # the same keys can be referenced by litellm-secrets without a manual hand-off.
            #
            # FIRST BOOT ONLY. Changing these later does nothing: the rows already exist. Rotating a
            # project key is a UI action plus a secret update, not an edit here — the same shape as
            # the ClickHouse init ConfigMap, which also runs once and silently ignores later edits.
            - name: LANGFUSE_INIT_ORG_ID
              value: openbank
            - name: LANGFUSE_INIT_ORG_NAME
              value: OpenBank
            - name: LANGFUSE_INIT_PROJECT_ID
              value: openbank-ai
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: OpenBank AI
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_INIT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: INIT_USER_EMAIL
            - name: LANGFUSE_INIT_USER_NAME
              value: OpenBank Operator
            - name: LANGFUSE_INIT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: INIT_USER_PASSWORD
            - name: HOSTNAME
              value: "0.0.0.0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              # Next.js server plus the Prisma migration run at start. 1Gi matches what litellm
              # needed once its own Prisma path was enabled; below that the start is an OOMKill
              # (exit 137) that looks like a crashloop with no message.
              memory: 1Gi
          # /api/public/health returns 200 only once the database migrations have completed, which
          # is exactly the readiness question — a pod serving before migration answers 500s.
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            # Generous: the first boot runs every Prisma migration on an empty database, and a
            # liveness kill mid-migration is how a fresh install ends up in a restart loop.
            initialDelaySeconds: 120
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: langfuse
  ports:
    - name: http
      port: 3000
      targetPort: http
