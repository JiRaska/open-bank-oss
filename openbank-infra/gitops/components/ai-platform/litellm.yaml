# LiteLLM gateway (ADR-0174/0175) — the in-cluster OpenAI-compatible proxy every agent/copilot LLM
# call routes through, replacing per-agent direct calls to api.deepinfra.com. This is the choke
# point the shared LlmGatewayClient (openbank-libs) and the egress NetworkPolicy sit around.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: ai-platform
      annotations:
        # LiteLLM parses --config ONCE at startup, and the ConfigMap is a plain volume mount, so a
        # config edit reaches the filesystem and changes nothing: the proxy keeps serving the model
        # list it booted with. Adding the llama-3.3-70b-versatile route without rolling the pod
        # would leave agent-service's repointed call failing "model not found" with a green,
        # in-sync ArgoCD — the same silent-degradation shape as an `optional: true` secret ref.
        # BUMP THIS whenever litellm-config.yaml changes; that is what rolls the pod.
        openbank.tech/litellm-config-revision: "13"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # LiteLLM runs `prisma generate` on every start, which COPIES schema.prisma into its own
      # site-packages directory. That directory is root-owned and this pod runs as uid 1000 under
      # PodSecurity `restricted`, so the generator dies with
      #   PermissionError: [Errno 13] Permission denied:
      #     '/usr/lib/python3.13/site-packages/prisma/schema.prisma'
      # and the query engine never comes up ("Not connected to the query engine") — which is what
      # crashlooped the gateway for 12h after #3065 and got the database backed out in #3185.
      #
      # Isolated to the uid, not guessed: the SAME image, memory and database starts in ~20s as
      # root and fails as uid 1000. Running as root is not the fix — this is the one pod in the
      # fleet with 0.0.0.0/0:443 egress (ADR-0175 §4), so it is the last place to relax the
      # security baseline. Instead the package directory gets a writable copy: this initContainer
      # copies it into an emptyDir (reading it as 1000 is fine; only writing was denied) and the
      # main container mounts that over the same path. Verified end to end locally at uid 1000:
      # proxy READY, /key/generate returns a budgeted key, and the key survives a restart.
      initContainers:
        - name: seed-prisma-writable
          image: ghcr.io/berriai/litellm:v1.74.3-stable
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /usr/lib/python3.13/site-packages/prisma/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: prisma-writable
              mountPath: /seed
      containers:
        - name: litellm
          # ghcr.io prefix kept so the Kyverno ecr-pull-through-rewrite mutates it to the ECR cache
          # (VPC endpoint, not NAT). Third-party image → not under the openbank-* signature Enforce
          # gate. Pin a stable tag; verify it resolves through the pull-through cache before merge.
          image: ghcr.io/berriai/litellm:v1.74.3-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            # Upstream provider key (DeepInfra) — lives ONLY in this pod (ADR-0175).
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            # Second upstream provider key (Groq) — backs the llama-3.3-70b-versatile route used by
            # agent-service (#1919). Same trade as above: it lives ONLY in this pod.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GROQ_API_KEY
                  optional: true
            # Virtual key callers present to LiteLLM.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
                  optional: true
            # Postgres (CNPG litellm-db). Required for virtual keys — the only mechanism that
            # bounds spend per CALLER rather than per model — and for spend counters that survive a
            # restart. Re-enabled after #3185 backed it out; see the initContainer above for the
            # three things that had to be true first. NOT optional: a missing DATABASE_URL leaves
            # the proxy serving and enforcing nothing, which is worse than not claiming a ceiling.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: uri
            # Encrypts virtual-key material at rest in that Postgres.
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_SALT_KEY
                  optional: true
            # Langfuse callback credentials (ADR-0031 D7). Same namespace, so the traces never
            # leave the cluster and no key is duplicated into an agent pod. `optional: true` here
            # and NOT on the langfuse pod itself, deliberately: without these the gateway must keep
            # serving LLM calls untraced — losing observability is not a reason to stop the fleet's
            # only egress path — whereas langfuse without them cannot start at all.
            #
            # The visible failure mode this leaves: callbacks configured, keys absent, so every
            # trace POST is rejected and LiteLLM logs it per request. That is why the
            # `openbank_langfuse_ingestion` absence check belongs in the observability component,
            # not a comment here — a callback that silently drops is indistinguishable from an idle
            # gateway from the outside.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_HOST
              value: http://langfuse.ai-platform.svc:3000
            # prisma-python caches its downloaded query engine under $HOME. Without this it
            # resolves to "/" and the pod dies on
            # FileNotFoundError: '/.cache/prisma-python/binaries/...'.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: prisma-writable
              mountPath: /usr/lib/python3.13/site-packages/prisma
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              # 512Mi OOMKilled (exit 137) once DATABASE_URL was set: the DB path installs the
              # Prisma CLI and a node runtime at start. 1Gi measured to start cleanly at uid 1000.
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: prisma-writable
          emptyDir: {}
        # $HOME for the prisma engine cache (~90 MB downloaded on first start).
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
