# LiteLLM gateway (ADR-0174/0175) — the in-cluster OpenAI-compatible proxy every agent/copilot LLM
# call routes through, replacing per-agent direct calls to api.deepinfra.com. This is the choke
# point the shared LlmGatewayClient (openbank-libs) and the egress NetworkPolicy sit around.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: ai-platform
      annotations:
        # LiteLLM parses --config ONCE at startup, and the ConfigMap is a plain volume mount, so a
        # config edit reaches the filesystem and changes nothing: the proxy keeps serving the model
        # list it booted with. Adding the llama-3.3-70b-versatile route without rolling the pod
        # would leave agent-service's repointed call failing "model not found" with a green,
        # in-sync ArgoCD — the same silent-degradation shape as an `optional: true` secret ref.
        # BUMP THIS whenever litellm-config.yaml changes; that is what rolls the pod.
        openbank.tech/litellm-config-revision: "17"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Trust bundle for the Presidio TLS edge (presidio.yaml). The image already points
        # SSL_CERT_FILE at the system bundle, and LiteLLM uses that one file for EVERYTHING —
        # its httpx provider client (custom_httpx/http_handler.py) and the presidio hook's bare
        # aiohttp.ClientSession() alike. Pointing it at openbank-ca alone would therefore break the
        # provider calls; this appends openbank-ca to the same system bundle instead, so the public
        # roots the gateway trusts today are unchanged and exactly one private CA is added.
        - name: ca-bundle
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-litellm:v1.99.4@sha256:64e5511f5cbeae28e63d829a1b80b6d63cb520bcc9ba022a8b9e9113921d7e13
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /mnt/openbank-ca/ca.crt > /ca-bundle/ca-certificates.crt"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: openbank-ca
              mountPath: /mnt/openbank-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-bundle
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: litellm
          # Our own build of upstream v1.99.4 (openbank-infra/docker/litellm), pinned by digest,
          # scanned and signed by platform-images.yml. v1.99 keeps the Prisma engines in
          # /opt/prisma, readable at uid 1000, so the writable site-packages copy that v1.74
          # needed is gone. Verified locally at uid 1000 against Postgres: /health/liveliness 200,
          # /key/generate persists a budgeted key.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-litellm:v1.99.4@sha256:64e5511f5cbeae28e63d829a1b80b6d63cb520bcc9ba022a8b9e9113921d7e13
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            # Upstream provider key (DeepInfra) — lives ONLY in this pod (ADR-0175).
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            # Second upstream provider key (Groq) — backs the llama-3.3-70b-versatile route used by
            # agent-service (#1919). Same trade as above: it lives ONLY in this pod.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GROQ_API_KEY
                  optional: true
            # Virtual key callers present to LiteLLM.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
                  optional: true
            # Postgres (CNPG litellm-db). Required for virtual keys — the only mechanism that
            # bounds spend per CALLER rather than per model — and for spend counters that survive a
            # restart. Re-enabled after #3185 backed it out; see the initContainer above for the
            # three things that had to be true first. NOT optional: a missing DATABASE_URL leaves
            # the proxy serving and enforcing nothing, which is worse than not claiming a ceiling.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: uri
            # Encrypts virtual-key material at rest in that Postgres.
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_SALT_KEY
                  optional: true
            # Langfuse callback credentials (ADR-0031 D7). Same namespace, so the traces never
            # leave the cluster and no key is duplicated into an agent pod. `optional: true` here
            # and NOT on the langfuse pod itself, deliberately: without these the gateway must keep
            # serving LLM calls untraced — losing observability is not a reason to stop the fleet's
            # only egress path — whereas langfuse without them cannot start at all.
            #
            # The visible failure mode this leaves: callbacks configured, keys absent, so every
            # trace POST is rejected and LiteLLM logs it per request. That is why the
            # `openbank_langfuse_ingestion` absence check belongs in the observability component,
            # not a comment here — a callback that silently drops is indistinguishable from an idle
            # gateway from the outside.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            # Presidio PII services (presidio.yaml) for the presidio guardrail in litellm-config.yaml.
            # HTTPS: this edge carries the unmasked prompt, so it is TLS from openbank-ca rather than
            # a new plaintext line in .github/asvs-l3-baseline.txt (ASVS V9.1).
            - name: PRESIDIO_ANALYZER_API_BASE
              value: https://presidio-analyzer.ai-platform.svc:3000
            - name: PRESIDIO_ANONYMIZER_API_BASE
              value: https://presidio-anonymizer.ai-platform.svc:3000
            # System roots + openbank-ca, assembled by the ca-bundle initContainer.
            - name: SSL_CERT_FILE
              value: /etc/ssl/openbank/ca-certificates.crt
            # Langfuse web (langfuse-v3.yaml) since ADR-0328 wave B; the v2 Service `langfuse`
            # was deleted in wave C1.
            - name: LANGFUSE_HOST
              value: http://langfuse-web.ai-platform.svc:3000
            # prisma-python caches its downloaded query engine under $HOME. Without this it
            # resolves to "/" and the pod dies on
            # FileNotFoundError: '/.cache/prisma-python/binaries/...'.
            - name: HOME
              value: /tmp
            # An existing database created before Prisma migrations (no _prisma_migrations table)
            # makes LiteLLM baseline it: `migrate deploy` answers P3005 and LiteLLM writes
            # migrations/0_init into its own package directory, which is root-owned, so at uid 1000
            # the pod crashloops with PermissionError. Upstream's supported switch points the
            # migrations at a writable copy instead (litellm_proxy_extras/utils.py _get_prisma_dir).
            - name: LITELLM_MIGRATION_DIR
              value: /tmp/litellm-migrations
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: ca-bundle
              mountPath: /etc/ssl/openbank
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              # 512Mi OOMKilled (exit 137) once DATABASE_URL was set: the DB path runs the
              # Prisma CLI and a node runtime at start. v1.99.4 measured ~790Mi idle after
              # migrations at uid 1000, so 1Gi left no headroom.
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config
        # $HOME for the prisma engine cache (~90 MB downloaded on first start).
        - name: tmp
          emptyDir: {}
        # Only ca.crt is projected: the gateway needs the issuing CA, never Presidio's private key.
        - name: openbank-ca
          secret:
            secretName: presidio-internal-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: ca-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
