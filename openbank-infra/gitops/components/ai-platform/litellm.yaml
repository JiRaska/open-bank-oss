# LiteLLM gateway (ADR-0174/0175) — the in-cluster OpenAI-compatible proxy every agent/copilot LLM
# call routes through, replacing per-agent direct calls to api.deepinfra.com. This is the choke
# point the shared LlmGatewayClient (openbank-libs) and the egress NetworkPolicy sit around.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: ai-platform
      annotations:
        # LiteLLM parses --config ONCE at startup, and the ConfigMap is a plain volume mount, so a
        # config edit reaches the filesystem and changes nothing: the proxy keeps serving the model
        # list it booted with. Adding the llama-3.3-70b-versatile route without rolling the pod
        # would leave agent-service's repointed call failing "model not found" with a green,
        # in-sync ArgoCD — the same silent-degradation shape as an `optional: true` secret ref.
        # BUMP THIS whenever litellm-config.yaml changes; that is what rolls the pod.
        openbank.tech/litellm-config-revision: "3"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          # ghcr.io prefix kept so the Kyverno ecr-pull-through-rewrite mutates it to the ECR cache
          # (VPC endpoint, not NAT). Third-party image → not under the openbank-* signature Enforce
          # gate. Pin a stable tag; verify it resolves through the pull-through cache before merge.
          image: ghcr.io/berriai/litellm:v1.74.3-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            # Upstream provider key (DeepInfra) — lives ONLY in this pod (ADR-0175).
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            # Second upstream provider key (Groq) — backs the llama-3.3-70b-versatile route used by
            # agent-service (#1919). Same trade as above: it lives ONLY in this pod.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GROQ_API_KEY
                  optional: true
            # Virtual key callers present to LiteLLM.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
                  optional: true
            # Postgres (CNPG litellm-db) — the prerequisite for virtual keys, which are the only
            # mechanism that enforces a spend ceiling per CALLER rather than per model. Also what
            # makes spend counters survive a restart: without a DB LiteLLM holds them in memory and
            # every pod restart silently resets the budget window to zero.
            #
            # `uri` is the ready-made connection string CNPG puts in the -app secret, so there is no
            # URL assembled from parts here to drift from the credential.
            #
            # NOT optional: unlike the provider keys above, a missing DATABASE_URL must not degrade
            # quietly. Without it the proxy starts, serves traffic and enforces NOTHING — a budget
            # that silently does not apply is worse than one that was never claimed, because the
            # dashboards and the ADR both say the ceiling exists.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: uri
            # Encrypts virtual-key material at rest in that Postgres. Seeded alongside the master
            # key; optional so the gateway still boots before the seed script has run, which is the
            # state a fresh environment starts in.
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_SALT_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
