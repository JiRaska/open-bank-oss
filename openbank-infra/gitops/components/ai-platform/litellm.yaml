# LiteLLM gateway (ADR-0174/0175) — the in-cluster OpenAI-compatible proxy every agent/copilot LLM
# call routes through, replacing per-agent direct calls to api.deepinfra.com. This is the choke
# point the shared LlmGatewayClient (openbank-libs) and the egress NetworkPolicy sit around.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: ai-platform
      annotations:
        # LiteLLM parses --config ONCE at startup, and the ConfigMap is a plain volume mount, so a
        # config edit reaches the filesystem and changes nothing: the proxy keeps serving the model
        # list it booted with. Adding the llama-3.3-70b-versatile route without rolling the pod
        # would leave agent-service's repointed call failing "model not found" with a green,
        # in-sync ArgoCD — the same silent-degradation shape as an `optional: true` secret ref.
        # BUMP THIS whenever litellm-config.yaml changes; that is what rolls the pod.
        openbank.tech/litellm-config-revision: "4"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          # ghcr.io prefix kept so the Kyverno ecr-pull-through-rewrite mutates it to the ECR cache
          # (VPC endpoint, not NAT). Third-party image → not under the openbank-* signature Enforce
          # gate. Pin a stable tag; verify it resolves through the pull-through cache before merge.
          image: ghcr.io/berriai/litellm:v1.74.3-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            # Upstream provider key (DeepInfra) — lives ONLY in this pod (ADR-0175).
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            # Second upstream provider key (Groq) — backs the llama-3.3-70b-versatile route used by
            # agent-service (#1919). Same trade as above: it lives ONLY in this pod.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GROQ_API_KEY
                  optional: true
            # Virtual key callers present to LiteLLM.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
                  optional: true
            # DATABASE_URL / LITELLM_SALT_KEY are DELIBERATELY NOT SET YET (#3065 -> this PR).
            # Wiring them made the new ReplicaSet CrashLoopBackOff for 12h / 180 restarts while the
            # old one kept serving — nothing went red, the Service still answered, ArgoCD said
            # Synced. Three separate causes, each only visible after the previous one was fixed:
            #   1. this pod is Egress-deny-by-default and 5432 was not on the allow-list
            #      (fixed in networkpolicy-litellm-egress.yaml, verified TCP_5432_OPEN);
            #   2. no writable HOME, so Prisma could not create /.cache/prisma-python/binaries
            #      under uid 1000 — the local docker check missed this because that container ran
            #      as root;
            #   3. even past that, the image DOWNLOADS the Prisma CLI and a node runtime at every
            #      start and is OOMKilled at the 512Mi limit.
            # (3) is the one that makes this more than a config tweak: it puts an internet download
            # on the boot path of the very pod that exists to BE the egress choke point (ADR-0175).
            # That trade needs its own reviewed change, so the DB stays provisioned and unused
            # rather than half-wired. postgres.yaml and seed-litellm-virtual-keys.sh are kept as-is.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
