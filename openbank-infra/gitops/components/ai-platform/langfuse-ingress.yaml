# Public edge for the Langfuse UI (ADR-0031 D7).
#
# Security posture: a deliberate, documented exception to ADR-0056's "no public pre-auth surface"
# default, on the same terms as the Pact Broker's (ADR-0092) — and it deserves a harder look than
# that one did, because the payload is different. The broker exposes API contracts; this exposes
# PROMPTS AND COMPLETIONS, which on any environment carrying real customer traffic would be
# customer data at rest behind an application login. It is acceptable here because the sandbox is
# synthetic-data-only by construction (ADR-0089 D6 pins the hosted model path to synthetic data),
# sign-up is disabled (`AUTH_DISABLE_SIGNUP=true`), and the single operator account is seeded from
# OpenBao. Before this pattern is copied to an environment with real data it needs SSO in front of
# it, not a stronger password.
#
# Traces are ingested in-cluster over the Service (litellm -> langfuse.ai-platform.svc:3000); this
# Ingress carries the human UI only, so removing it degrades visibility, never ingestion.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: ai-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/custom-headers: ai-platform/langfuse-edge-headers-v1
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - langfuse.open-bank.tech
      secretName: langfuse-tls
  rules:
    - host: langfuse.open-bank.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse
                port:
                  number: 3000
---
# Edge response headers for this host, served by ingress-nginx's `custom-headers` annotation
# (ADR-0324 interim hardening) instead of a Critical-risk `configuration-snippet`. Keys must be
# in the controller's `global-allowed-response-headers` (apps/ingress-nginx.yaml) or the
# controller denies the location (503). HSTS and X-Content-Type-Options are NOT listed here:
# the controller sets both on every response (hsts-*, add-headers).
# IMMUTABLE, VERSIONED BY NAME, SYNC-WAVE -1 — all three are load-bearing. The controller
# re-reads this ConfigMap only when the Ingress that names it changes (custom-headers is not
# in its configmap-watch set and it runs with no resync period), so an in-place edit would
# never reach nginx. Change a header by adding `-v2` and pointing the annotation at it. The
# wave makes ArgoCD create the ConfigMap before the Ingress that references it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-edge-headers-v1
  namespace: ai-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
immutable: true
data:
  X-Frame-Options: "SAMEORIGIN"
  Referrer-Policy: "strict-origin-when-cross-origin"
  X-Robots-Tag: "noindex, nofollow"
