# SPDX-License-Identifier: Apache-2.0
# tpp-registry-service: PSD2 Third-Party Provider registry. Reactive Postgres + Flyway,
# Redis idempotency, Kafka outbox (openbank.tpp.registry.event). Called by psd2-service
# for TPP certificate validation (ADR-0034). mTLS to Strimzi (ADR-0137).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpp-registry-service
  namespace: tpp-registry
  labels:
    app.kubernetes.io/name: tpp-registry-service
    app.kubernetes.io/part-of: tpp-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tpp-registry-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpp-registry-service
        app.kubernetes.io/part-of: tpp-registry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tpp-registry-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-tpp-registry-service:sandbox-7203a18d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8108
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://tpp-registry-db-rw.tpp-registry.svc:5432/openbank_tpp_registry
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://tpp-registry-db-rw.tpp-registry.svc:5432/openbank_tpp_registry
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tpp-registry-db-app
                  key: password
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.tpp-registry.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as KafkaUser 'tpp-registry-service';
            # keystore/truststore PKCS#12 are projected from messaging by External Secrets
            # (kafka-tpp-registry-mtls.yaml) and mounted below.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tpp-registry-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8108"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tpp-registry-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: tpp-registry-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: tpp-registry-service
  namespace: tpp-registry
  labels:
    app.kubernetes.io/name: tpp-registry-service
    app.kubernetes.io/part-of: tpp-registry
spec:
  selector:
    app.kubernetes.io/name: tpp-registry-service
  ports:
    - name: http
      port: 8108
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
