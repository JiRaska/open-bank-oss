# Single-owner Postgres for Apicurio, reconciled by the cluster-wide CNPG
# operator (installed via tofu in the platform root). Sandbox runs a single
# instance for FinOps; prod should raise instances to 3 for HA. CNPG generates
# the `apicurio-db-app` secret (keys: username, password) for the `apicurio`
# owner and a read-write Service `apicurio-db-rw` — both consumed by the
# registry Deployment.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: apicurio-db
  namespace: messaging
spec:
  # DB-layer observability (Dynatrace-parity #0): CNPG runs its built-in
  # Prometheus exporter on :9187 and creates a PodMonitor the operator owns.
  # kube-prometheus-stack selects PodMonitors cluster-wide (NilUsesHelmValues
  # =false), so this lights up cnpg_* metrics (connections, replication lag,
  # deadlocks, xid age, WAL archiving) with zero app changes.
  monitoring:
    enablePodMonitor: true
  instances: 1
  # ECR pull-through instead of ghcr.io (issue #1290, fleet rollout after the #1304 pilot on
  # pact-broker-db). CNPG instance pods are (correctly) excluded from the Kyverno
  # ecr-pull-through-rewrite policy: the operator reconciles the running pod's image against
  # spec.imageName, so a mutating webhook would make the pod permanently drift and get
  # recreated every ~10s. Setting the ref HERE avoids that — no mutation, nothing to drift
  # from. Same tag (18.1) as before, only the registry changes; verified this ref resolves
  # via the pull-through cache before this PR (previously only 16.14 had ever been pulled
  # through). Non-money-path, single-instance, low-traffic DB — safe rollout candidate.
  imageName: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/ghcr/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: registrydb
      owner: apicurio

  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the apicurio-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/apicurio-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: apicurio-db-daily
  namespace: messaging
spec:
  schedule: "0 19 2 * * *"
  backupOwnerReference: self
  cluster:
    name: apicurio-db
