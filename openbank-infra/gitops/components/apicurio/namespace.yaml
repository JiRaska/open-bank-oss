# `messaging` — infra plane for the event bus (Kafka) and its schema registry
# (Apicurio), per ADR-0037 Layer 1. Pod Security `restricted`: both CNPG
# Postgres and Apicurio run non-root with no elevated capabilities, so no
# baseline/privileged exception is needed here.
apiVersion: v1
kind: Namespace
metadata:
  name: messaging
  labels:
    openbank.io/plane: infra
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
