#
# Stateful workloads never run on spot (policies.kyverno.io/v1 MutatingPolicy).
#
# Why: on 2026-09-29/30 the Karpenter `default` pool (spot) took 41 interruptions in 24h,
# and 134 of the 140 CNPG instance pods ran on it. Every reclaim was ~13 Postgres failovers
# at once plus Temporal and Kafka restarts -- the common cause behind Temporal "no usable
# database connection", CNPG reconciler noise and SCA "Connection refused".
#
# What: on pod CREATE, a pod that is
#   - a CNPG pod (label cnpg.io/cluster -- instance pods and their initdb/join jobs),
#   - a Strimzi broker/controller pod (strimzi.io/controller=strimzipodset), or
#   - a Temporal server role (namespace temporal, app.kubernetes.io/name=temporal,
#     component frontend|history|matching|worker)
# gets REQUIRED node affinity karpenter.sh/capacity-type In [on-demand] (so no spot node can
# take it) and a toleration for the `stateful` NodePool's taint (so the on-demand pool built
# for it, aws/envs/sandbox-platform/main.tf `nodepool_stateful`, weight 100, can). The
# constraint is the CAPACITY TYPE, not the pool label, on purpose: if this policy syncs
# before that NodePool is applied, the `default` pool still provisions on-demand for these
# pods, so nothing strands Pending on the rollout order.
#
# Why a mutation and not 70 Cluster edits: Cluster.spec.affinity is part of the pod spec CNPG
# renders, so editing it ROLLS every cluster in one Argo sync -- the 2026-09-28 outage shape.
# This touches only pods being created. CNPG does not see it as drift: the operator compares
# its own rendered spec against the cnpg.io/podSpec annotation it stamped, never against the
# live pod (measured 2026-09-30: live CNPG pods already carry admission-added tolerations,
# pod-identity env and volumes absent from that annotation, and did not roll). Contrast the
# IMAGE, which CNPG does compare live -- why ecr-pull-through-rewrite-cel excludes CNPG pods.
# Strimzi (revision annotation) and ReplicaSets likewise never diff the live pod.
#
# failurePolicy: Ignore -- if Kyverno is down, a DB pod is created unmutated and may land
# on spot. That is the pre-2026-09-30 state (degraded), whereas Fail would block every DB
# pod from being recreated at all (outage). `check-stateful-not-on-spot.py` holds this file,
# the NodePool and the fixtures in openbank-infra/tests/kyverno-cel/stateful-* together.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: stateful-on-demand-cel
  labels:
    app.kubernetes.io/part-of: kyverno-policies
    openbank.io/plane: platform
  annotations:
    policies.kyverno.io/title: "Route stateful workloads (CNPG, Kafka, Temporal) to on-demand capacity"
    policies.kyverno.io/category: "Reliability"
    policies.kyverno.io/severity: "high"
spec:
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: labels
      expression: "object.metadata.?labels.orValue({})"
    - name: isStateful
      expression: >-
        'cnpg.io/cluster' in variables.labels ||
        variables.labels[?'strimzi.io/controller'].orValue('') == 'strimzipodset' ||
        (request.namespace == 'temporal' &&
         variables.labels[?'app.kubernetes.io/name'].orValue('') == 'temporal' &&
         variables.labels[?'app.kubernetes.io/component'].orValue('') in
           ['frontend', 'history', 'matching', 'worker'])
    - name: hasToleration
      expression: >-
        object.spec.?tolerations.orValue([]).exists(t,
          t.?key.orValue('') == 'openbank.io/stateful')
    - name: onDemand
      expression: >-
        Object.spec.affinity.nodeAffinity{
          requiredDuringSchedulingIgnoredDuringExecution:
            Object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution{
              nodeSelectorTerms: [
                Object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms{
                  matchExpressions: [
                    Object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.matchExpressions{
                      key: "karpenter.sh/capacity-type", operator: "In", values: ["on-demand"]
                    }
                  ]
                }
              ]
            }
        }
  matchConditions:
    - name: is-stateful-workload
      expression: variables.isStateful
  mutations:
    # REQUIRED node affinity capacity-type In [on-demand]. Not a nodeSelector: that is an
    # atomic map an ApplyConfiguration may not touch, and a JSON patch creating one needs
    # an untyped map value, which panics the Kyverno 1.19.1 CEL engine (measured
    # 2026-09-30). nodeAffinity is a typed struct. Three shapes: no affinity at all
    # (Strimzi/Temporal pods), affinity without nodeAffinity (CNPG: podAntiAffinity only),
    # nodeAffinity without a required block. A pod that ALREADY carries required node
    # affinity is left alone -- its terms are OR'ed, so appending one would widen rather
    # than narrow -- and check-stateful-not-on-spot.py fails if any stateful manifest in
    # gitops declares one, so that branch is unreachable from this repo.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.affinity)
            ? [JSONPatch{op: "add", path: "/spec/affinity",
                         value: Object.spec.affinity{nodeAffinity: variables.onDemand}}]
            : !has(object.spec.affinity.nodeAffinity)
              ? [JSONPatch{op: "add", path: "/spec/affinity/nodeAffinity", value: variables.onDemand}]
              : !has(object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution)
                ? [JSONPatch{op: "add",
                             path: "/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution",
                             value: variables.onDemand.requiredDuringSchedulingIgnoredDuringExecution}]
                : []
    # tolerations is an ATOMIC list: an ApplyConfiguration would replace the whole list
    # and drop the tolerations CNPG and the DefaultTolerationSeconds plugin put there. So
    # it is appended with a JSON patch, and only when not already present. An absent list
    # is created EMPTY and then appended to: a list-of-object literal as a patch value
    # panics the Kyverno 1.19.1 CEL engine, the same defect as the map above (measured).
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.hasToleration ? [] :
            (has(object.spec.tolerations) ? [] :
              [JSONPatch{op: "add", path: "/spec/tolerations", value: []}])
            + [JSONPatch{op: "add", path: "/spec/tolerations/-",
                         value: Object.spec.tolerations{key: "openbank.io/stateful", operator: "Equal",
                                                        value: "true", effect: "NoSchedule"}}]
