#
# CEL-type (policies.kyverno.io/v1) twin of pricing-image-exception.yaml, for the
# ImageValidatingPolicy shadow verify-openbank-image-sbom-attestation-cel. Same scope
# (namespace `pricing` only), same reason and same REMOVAL CRITERIA — read the v1
# file; delete both together. A kyverno.io/v2 PolicyException cannot reference a
# policies.kyverno.io policy, hence two objects during the migration. The v1 one is
# deleted with its ClusterPolicy in stage 2.
#
# policyRefs replaces exceptions[].policyName; there are no rule names in the CEL
# types, so the v1 pair (rule + its autogen- twin) collapses into one reference, and
# a namespaced PolicyException only ever applies in its own namespace.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: pricing-image-exception-cel
  namespace: pricing
spec:
  policyRefs:
    - name: verify-openbank-image-sbom-attestation-cel
      kind: ImageValidatingPolicy
  matchConditions:
    - name: pricing-namespace-only
      expression: "request.namespace == 'pricing'"
