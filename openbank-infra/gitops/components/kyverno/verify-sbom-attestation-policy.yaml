# SBOM-attestation verification policy (ADR-0030 D4 step 4, ADR-0121 Axis 2).
# Requires every openbank-* image pulled into the cluster to carry a cosign-signed
# CycloneDX SBOM attestation (predicateType https://cyclonedx.org/bom), produced by
# `cosign attest --type cyclonedx --key awskms:///alias/openbank-cosign-signing`
# on every image push (auto-deploy.yml).
#
# This is a SEPARATE ClusterPolicy from verify-openbank-image-signatures on purpose:
# the signature rule is Enforce (live since 2026-06-11) and must stay Enforce, while
# this attestation rule stages Audit -> Enforce independently. A single policy would
# couple both rules to one validationFailureAction (kyverno 3.2.6) — exactly how the
# first signature-Enforce attempt broke the fleet (#770 revert).
#
# Rollout (mirrors the signature policy's staging; rules.yaml provenance.enforce_criteria):
#   1. (this file) Audit — surface images without the SBOM attestation as
#      PolicyReport violations, break nothing. Expected to report violations for
#      every pod whose image predates auto-deploy attestation — that is the point:
#      the report is the redeploy worklist.
#   2. (pending) Redeploy the running fleet so every live image carries the
#      attestation (rules.yaml provenance.enforce_criteria #2). Verify:
#      `kubectl get polr -A` reports 0 fail for this policy.
#   3. (pending) Flip validationFailureAction to Enforce — only after criterion #2
#      holds and the Audit report has run clean for an observation window
#      (provenance.enforce_criteria #4). Same caveat as the signature policy:
#      a `kubectl rollout undo` to a pre-attestation revision would be rejected
#      under Enforce — rebuild or attest that digest first.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-openbank-image-sbom-attestation
  annotations:
    policies.kyverno.io/title: Verify OpenBank image SBOM attestations (ADR-0030 D4 step 4)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Audits that every openbank-* container image carries a cosign-signed
      CycloneDX SBOM attestation (predicateType https://cyclonedx.org/bom,
      KMS public key). Audit mode until the running fleet is fully redeployed
      with attested images; then staged to Enforce per rules.yaml
      provenance.enforce_criteria (ADR-0144 graduation).
spec:
  validationFailureAction: Audit
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Ignore
  rules:
    - name: verify-cyclonedx-sbom-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-*"
          # Audit-only: do not rewrite the image to its digest or fail the pod.
          mutateDigest: false
          verifyDigest: false
          required: true
          attestations:
            - predicateType: https://cyclonedx.org/bom
              attestors:
                - count: 1
                  entries:
                    # Same trust root as the signature policy: public key of the AWS KMS
                    # signing key alias/openbank-cosign-signing. Attestations are produced
                    # with `cosign attest --key awskms:///...`; kyverno verifies offline
                    # against this public key (no KMS/AWS access in-cluster).
                    # Rotate together with verify-images-policy.yaml (same key).
                    - keys:
                        publicKeys: |-
                          -----BEGIN PUBLIC KEY-----
                          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEASBZ76uZt2fJEJp0RiQx1hnJgbGV
                          M2Uw+35xUGfcZpBvpA+4nTW5zy2VVZ2JxT++6Gt0wPuUyL7aJpOAvqDvJw==
                          -----END PUBLIC KEY-----
                        # ECC_NIST_P256 → ECDSA-P256 over SHA-256 (Cosign default hash).
                        # Set explicitly so it matches the kyverno-defaulted live object
                        # and ArgoCD doesn't report perpetual drift on this field.
                        signatureAlgorithm: sha256
              conditions:
                - all:
                    # The attested predicate must actually be a CycloneDX BOM, not an empty
                    # envelope: bomFormat is a required CycloneDX root field. The predicate is
                    # exposed to the JMESPath condition as the lowercase `data` variable — the
                    # capitalized `{{ Data.bomFormat }}` this policy shipped with resolves to
                    # "Unknown key \"Data\" in path" on kyverno 3.2.6 (a JMESPath query failure,
                    # not a false/true condition result), which errors the whole verifyImages
                    # check for every correctly-attested image. Confirmed live 2026-07-09 against
                    # a cosign-verified admin-ui SBOM attestation. Currently Audit-only so this
                    # was silent; would have 100%-failed the fleet if flipped to Enforce as-is.
                    - key: "{{ data.bomFormat }}"
                      operator: Equals
                      value: "CycloneDX"
