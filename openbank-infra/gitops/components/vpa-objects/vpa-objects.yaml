# VerticalPodAutoscaler objects for all deployed OpenBank services.
#
# updateMode: Off — the VPA recommender fills status.recommendation but
# NEVER modifies or evicts pods. Operators read recommendations via the
# FinOps right-sizing panel in admin-ui (Prometheus scrape of VPA metrics).
#
# Container names must match the pod spec; they follow the convention
# "<service>-service" as defined in each component's Deployment yaml.
# The payments namespace hosts two deployments (transaction + sepa-payment).
#
# Add a VPA object per-service when the service is first deployed to a
# new namespace so that recommendations accumulate from day one.

# ── Core banking ─────────────────────────────────────────────────────────────

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: account-service-vpa
  namespace: accounts
spec:
  targetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: account-service
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: account-service
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
---
