apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-steward
  namespace: release-steward
  labels:
    app.kubernetes.io/name: release-steward
    app.kubernetes.io/part-of: release-steward
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-steward
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-steward
        app.kubernetes.io/part-of: release-steward
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: release-steward
          # Pending first CI build (ADR-0165 initial PR) — build-push-service.sh publishes the
          # real sandbox-<sha> tag on merge; ArgoCD will not sync a healthy pod until then.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-release-steward:sandbox-c941c558
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8145
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://releasesteward-db-rw.release-steward.svc:5432/openbank_releasesteward
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://releasesteward-db-rw.release-steward.svc:5432/openbank_releasesteward
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: releasesteward-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: releasesteward-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: GITHUB_API_URL
              value: https://api.github.com
            - name: GITHUB_REPO
              value: JiRaska/open-bank-oss
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-release
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: release-steward
  namespace: release-steward
  labels:
    app.kubernetes.io/name: release-steward
    app.kubernetes.io/part-of: release-steward
spec:
  selector:
    app.kubernetes.io/name: release-steward
  ports:
    - name: http
      port: 8145
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
