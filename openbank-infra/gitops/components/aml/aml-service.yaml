# aml-service: AML screening case lifecycle. Publishes openbank.aml.events via a
# transactional outbox (consumed by party-service for the KYC+AML activation gate,
# ADR-0267 §2) and consumes openbank.party.events to auto-open onboarding screenings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-service
  namespace: aml
  labels:
    app.kubernetes.io/name: aml-service
    app.kubernetes.io/part-of: aml
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aml-service
        app.kubernetes.io/part-of: aml
      annotations:
        # Rolls the pod when the OPA bundle changes (subPath mounts do not hot-reload).
        # Kept in sync by gen-aml-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "a01f1b07ec9de52f"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aml-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-aml-service:sandbox-c7676237
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8117
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://aml-db-rw.aml.svc:5432/openbank_aml
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://aml-db-rw.aml.svc:5432/openbank_aml
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aml-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as KafkaUser 'aml-service';
            # keystore/truststore PKCS#12 are projected from messaging by External Secrets
            # (kafka-aml-mtls.yaml) and mounted below. The app reads these via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aml-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8117"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aml-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Idempotency store (POST /aml/cases dedupes on Idempotency-Key) is Redis-backed.
            # Without this it defaults to localhost:6379 → connection refused → 500 on every
            # createCase. Point at the in-namespace redis (redis.yaml).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.aml.svc:6379
            # Sandbox straight-through AML: auto-clear onboarding screenings so onboarding
            # activates without an analyst. MUST be false in production. No ADR decides this
            # flag — ADR-0116 §4 decides only the KYC equivalent (openbank.kyc.auto-approve);
            # the AML side is recorded in aml-service's own docs/ only (#5785).
            - name: OPENBANK_AML_AUTO_CLEAR
              value: "true"
            # ADR-0034 Phase 5 / issue #1797: aml-service shipped @Authorize with the app default
            # AUTHZ_ENFORCE=true and NO sidecar — so the PDP call failed and amlCase read/list/
            # updateDecision failed closed (HTTP 422). The `opa` sidecar below now answers the PDP
            # call; this explicit `false` keeps enforcement ADVISORY (the interceptor logs "would
            # DENY" without blocking) until the live decision log confirms the deny population is
            # empty, then a separate deliberate flip sets it true (rules.yaml AUTHZ_ENFORCE guardrail).
            - name: AUTHZ_ENFORCE
              value: "false"
            # #686 / #2945: load the party-events-in group.id override (aml-service-msg-override
            # ConfigMap, mounted below) as an external Quarkus config source, so the dotted YAML
            # key's declared value actually reaches the Kafka connector instead of silently
            # falling back to quarkus.application.name.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy decision point (ADR-0034 Phase 5 / issue #1797). Co-located sidecar the app
        # reaches on localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed). Bundle
        # mounted read-only from the aml-opa-bundle ConfigMap generated by gen-aml-opa-bundle.sh.
        # Mirrors statement-service's OPA sidecar (same image, probes, security context, subPath mounts).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/aml_rest_ext.rego
              subPath: aml_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: aml-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: aml-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: aml-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: aml-service
  namespace: aml
  labels:
    app.kubernetes.io/name: aml-service
    app.kubernetes.io/part-of: aml
spec:
  selector:
    app.kubernetes.io/name: aml-service
  ports:
    - name: http
      port: 8117
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
