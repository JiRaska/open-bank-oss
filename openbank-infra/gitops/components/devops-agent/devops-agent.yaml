apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent
    app.kubernetes.io/part-of: devops-agent
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-agent
        app.kubernetes.io/part-of: devops-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-agent
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-devops-agent:sandbox-0be57cbc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8142
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Postgres (CNPG devops-db) — findings + their HITL lifecycle survive pod restarts.
            # Reactive URL for the app (Panache); JDBC URL for Flyway migrations.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://devops-db-rw.devops-agent.svc:5432/openbank_devops
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://devops-db-rw.devops-agent.svc:5432/openbank_devops
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: devops-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: devops-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            # The daily analysis sweep. Set EXPLICITLY here rather than left to the
            # application.yaml default, because this is the only place an operator looks to
            # answer "when does this agent run" — and until now the answer was "it doesn't".
            # The agent was trigger-only: measured 2026-08-02, the openbank-devops Temporal
            # namespace held 0 schedules and 0 workflow executions, and its result table was
            # empty — which renders as "nothing to act on" rather than "nothing has looked".
            # 03:30 UTC, offset 15 minutes from finops-agent (03:00) and the control-liveness sentinel (03:15):
            # the three share one LiteLLM gateway and one Prometheus.
            # Six fields (second minute hour day month weekday) — Quarkus, not crontab.
            - name: DEVOPS_ANALYSIS_CRON
              value: "0 30 3 * * ?"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.observability.svc:9093
            - name: TEMPORAL_NAMESPACE
              value: openbank-devops
            # LLM diagnosis backend — routed through the in-cluster LiteLLM gateway (ADR-0174/0175),
            # NOT api.deepinfra.com directly. The gateway holds the provider key and is the only pod
            # allowed to egress to the US provider; this agent presents the LiteLLM virtual key. Model
            # id is unchanged (the gateway maps it to deepinfra/deepseek). Swap backend at the gateway,
            # not here.
            - name: DEVOPS_MODEL_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: DEVOPS_MODEL_ID
              value: deepseek-ai/DeepSeek-V3.2
            # LiteLLM virtual key, projected from OpenBao by ESO (devops-agent-secrets → openbank/litellm).
            # Optional so an un-seeded key doesn't CrashLoop the pod — until set, diagnosis degrades.
            - name: DEVOPS_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-agent-secrets
                  key: DEVOPS_MODEL_API_KEY
                  optional: true
            # Fine-grained GitHub token for opening remediation-proposal PRs.
            # Seed: bao kv patch openbank/devops-agent GITHUB_TOKEN=<pat>
            # Optional — until set, the agent records the proposal text but opens no PR.
            - name: DEVOPS_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-agent-secrets
                  key: DEVOPS_GITHUB_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: devops-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent
    app.kubernetes.io/part-of: devops-agent
spec:
  selector:
    app.kubernetes.io/name: devops-agent
  ports:
    - name: http
      port: 8142
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
