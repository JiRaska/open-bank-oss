apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent
    app.kubernetes.io/part-of: devops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-agent
        app.kubernetes.io/part-of: devops-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-agent
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-devops-agent:sandbox-95b652dd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8142
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Postgres (CNPG devops-db) — findings + their HITL lifecycle survive pod restarts.
            # Reactive URL for the app (Panache); JDBC URL for Flyway migrations.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://devops-db-rw.devops-agent.svc:5432/openbank_devops
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://devops-db-rw.devops-agent.svc:5432/openbank_devops
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: devops-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: devops-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.observability.svc:9093
            - name: TEMPORAL_NAMESPACE
              value: openbank-devops
            # LLM diagnosis backend — routed through the in-cluster LiteLLM gateway (ADR-0174/0175),
            # NOT api.deepinfra.com directly. The gateway holds the provider key and is the only pod
            # allowed to egress to the US provider; this agent presents the LiteLLM virtual key. Model
            # id is unchanged (the gateway maps it to deepinfra/deepseek). Swap backend at the gateway,
            # not here.
            - name: DEVOPS_MODEL_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: DEVOPS_MODEL_ID
              value: deepseek-ai/DeepSeek-V3.2
            # LiteLLM virtual key, projected from OpenBao by ESO (devops-agent-secrets → openbank/litellm).
            # Optional so an un-seeded key doesn't CrashLoop the pod — until set, diagnosis degrades.
            - name: DEVOPS_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-agent-secrets
                  key: DEVOPS_MODEL_API_KEY
                  optional: true
            # Fine-grained GitHub token for opening remediation-proposal PRs.
            # Seed: bao kv patch openbank/devops-agent GITHUB_TOKEN=<pat>
            # Optional — until set, the agent records the proposal text but opens no PR.
            - name: DEVOPS_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-agent-secrets
                  key: DEVOPS_GITHUB_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: devops-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent
    app.kubernetes.io/part-of: devops-agent
spec:
  selector:
    app.kubernetes.io/name: devops-agent
  ports:
    - name: http
      port: 8142
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
