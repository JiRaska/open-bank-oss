# Single-owner Postgres for devops-agent (cluster-wide CNPG operator, ADR-0119). Generates the
# devops-db-app secret (username/password) + devops-db-rw Service the Deployment uses.
# NOTE: no S3 WAL/backup here yet — that needs an EKS Pod Identity role (aws/.../db-backups.tf,
# #863 pattern), tracked as a follow-up. Findings are operational telemetry, not regulated records,
# so the agent degrades to no-history on data loss rather than breaching a retention obligation.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: devops-db
  namespace: devops-agent
spec:
  # DB-layer observability: CNPG's built-in Prometheus exporter on :9187 + a PodMonitor the operator
  # owns (selected cluster-wide), lighting up cnpg_* metrics with zero app changes.
  monitoring:
    enablePodMonitor: true
  instances: 1
  # ECR pull-through instead of ghcr.io (issue #1290, fleet rollout after the #1304 pilot on
  # pact-broker-db). CNPG instance pods are (correctly) excluded from the Kyverno
  # ecr-pull-through-rewrite policy: the operator reconciles the running pod's image against
  # spec.imageName, so a mutating webhook would make the pod permanently drift and get
  # recreated every ~10s. Setting the ref HERE avoids that — no mutation, nothing to drift
  # from. Same tag (18.1) as before, only the registry changes; verified this ref resolves
  # via the pull-through cache before this PR (previously only 16.14 had ever been pulled
  # through). Non-money-path, single-instance, low-traffic DB — safe rollout candidate.
  imageName: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/ghcr/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike or bulk load cannot fill the 2Gi volume (#1432).
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS
  # Pod Identity on the devops-db ServiceAccount (aws/.../db-backups.tf) — barman reads the
  # SDK chain, no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/devops-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openbank_devops
      owner: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: devops-db-daily
  namespace: devops-agent
spec:
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  cluster:
    name: devops-db
