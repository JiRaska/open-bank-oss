# treasury-service OIDC client secret from Vault -> treasury-service-oidc Secret (key
# OIDC_CLIENT_SECRET), shared openbank-services realm client — the resource server's bearer
# validation only. The remoteRef key is the shared `account-service` entry, as for every service
# (rules.yaml: oidc_secret_convention). No `treasury-service-m2m-oidc` here: this instance posts
# nothing to any ledger, so treasury's own M2M client (openbank-treasury, ledger.create on the
# BANK ledger) is deliberately never projected into this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # Same Vault value as the bank treasury's (shared openbank-services client); the fleet's
    # current rotate-by date for that credential.
    openbank.io/rotation-deadline: "2027-09-05"
  name: treasury-service-oidc
  namespace: treasury-pension-co
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: treasury-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
