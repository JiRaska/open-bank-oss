# audit banking-domain namespace (ADR-0037: domain = namespace). App
# plane. Holds audit-service plus its single-owner CNPG Postgres.
# Consumes domain events from all major Kafka topics; exposes read API.
apiVersion: v1
kind: Namespace
metadata:
  name: audit
  labels:
    openbank.io/plane: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
