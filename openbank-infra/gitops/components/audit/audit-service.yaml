# audit-service: append-only audit log, GDPR-compliant 10-year retention.
# Consumes domain events from account, transaction, balance, party, kyc,
# consent topics and exposes a read API. Money-path adjacent; 1 replica sandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: audit
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/part-of: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service
        app.kubernetes.io/part-of: audit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-audit-service:sandbox-06d5f932
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8113
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://audit-db-rw.audit.svc:5432/openbank_audit
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://audit-db-rw.audit.svc:5432/openbank_audit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9092
            - name: QUARKUS_HTTP_PORT
              value: "8113"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: audit-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: audit
  labels:
    app.kubernetes.io/name: audit-service
spec:
  selector:
    app.kubernetes.io/name: audit-service
  ports:
    - name: http
      port: 8113
      targetPort: http
