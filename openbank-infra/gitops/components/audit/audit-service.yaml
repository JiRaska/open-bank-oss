# audit-service: append-only audit log, GDPR-compliant 10-year retention.
# Consumes domain events from account, transaction, balance, party, kyc,
# consent topics and exposes a read API. Money-path adjacent; 1 replica sandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: audit
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/part-of: audit
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service
        app.kubernetes.io/part-of: audit
      annotations:
        # Rolls the pod when the OPA bundle changes (subPath mounts do not hot-reload).
        # Kept in sync by gen-audit-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "310d785f39e1030b"
    spec:
      serviceAccountName: audit-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-audit-service:sandbox-cf05a32f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8113
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://audit-db-rw.audit.svc:5432/openbank_audit
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://audit-db-rw.audit.svc:5432/openbank_audit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8113"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: audit-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # issue #686: load the audit-events-in group.id / auto.offset.reset override
            # (audit-service-msg-override ConfigMap, mounted below) as an external Quarkus config
            # source, since these keys can't be set via the dotted YAML key in application.yaml
            # (SmallRye Config silently drops it) nor via env var (ambiguous reverse-mapping for
            # this hyphenated channel name). Optional location: if the file is absent Quarkus
            # warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            # ADR-0031 D5: the asymmetric signing key is held by KMS; the alias is only
            # the signing input. AuditAnchorService records KMS's immutable returned key id
            # with each anchor so verification remains correct across key rotation.
            # The audit-service Pod Identity receives only Sign/Verify/GetPublicKey on this key.
            # Pod Identity supplies credentials, while the AWS SDK resolves its region separately.
            - name: AWS_REGION
              value: eu-north-1
            - name: AUDIT_ANCHOR_SIGNER
              value: kms
            - name: AUDIT_ANCHOR_SIGNING_REQUIRED
              value: "true"
            - name: AUDIT_ANCHOR_KMS_KEY_ID
              value: alias/openbank-audit-anchor
            # ADR-0034 Phase 5 / issue #1797: audit-service shipped @Authorize with the app default
            # AUTHZ_ENFORCE=true and NO sidecar — so the PDP call failed and audit.read / audit.verify
            # failed closed (HTTP 422). The `opa` sidecar below now answers the PDP call; this explicit
            # `false` keeps enforcement ADVISORY (the interceptor logs "would DENY" without blocking)
            # until the live decision log confirms the deny population is empty, then a separate
            # deliberate flip sets it true (rules.yaml AUTHZ_ENFORCE guardrail).
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy decision point (ADR-0034 Phase 5 / issue #1797). Co-located sidecar the app
        # reaches on localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed). Bundle
        # mounted read-only from the audit-opa-bundle ConfigMap generated by
        # gen-audit-opa-bundle.sh. Mirrors statement-service's OPA sidecar (same image, probes,
        # security context, subPath mounts).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/audit_rest_ext.rego
              subPath: audit_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: audit-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: audit-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: audit-service-msg-override
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-service
  namespace: audit
  labels:
    app.kubernetes.io/name: audit-service
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: audit
  labels:
    app.kubernetes.io/name: audit-service
spec:
  selector:
    app.kubernetes.io/name: audit-service
  ports:
    - name: http
      port: 8113
      targetPort: http
