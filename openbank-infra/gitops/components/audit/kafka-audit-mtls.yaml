# Kafka mTLS identity for audit-service (ADR-0137, #2665 Tier 2b)
#
# Identity model (ADR-0137): mTLS gives each service exactly one client cert =
# one KafkaUser = one principal for ALL of its Kafka traffic. The audit-service
# is a pure consumer of domain events across 10 topics; it only needs Read+Describe
# ACLs on those topics and Read on its consumer group. NOTE: "topics not listed here
# stay open under allow.everyone.if.no.acl.found=true" stood here and has been false
# since #2794 — a topic with no ACL is denied, not open, which is exactly how the six
# subscriptions at the bottom of this list came to be receiving nothing (#3271).
#
# clearing.batch.event / security.ict.incident added (ADR-0160 #996 triage): each was
# published with zero consumers since introduction — audit-service is the sole intended
# consumer per the publishing services' own docs. security.scan.event was in this set too
# and its ACL was removed in #4709: that topic never had a producer at all (end offset 0),
# so the Read grant guarded a subscription that could not receive anything.
#
# dispute.events / statement.event / sanctions.screening.event added (#996 round 2) —
# each publisher has its own mTLS KafkaUser with a Write ACL on its topic, which makes
# that topic ACL-guarded, so audit-service needs an explicit Read+Describe grant to
# actually consume it. Verified each has a real producer (a genuine outbox-row write)
# before adding. (The original note here went on to say cards.events /
# domestic.payment.events / sepa.payment.events "stay open under allow-everyone, same as
# clearing/security-scanner above; no ACL change needed for those three" — wrong on the
# same stale premise, and all three were granted in #3271 once measured.)
#
# Strimzi User Operator mints a per-user Secret in `messaging` (user.crt/key/p12
# + user.password + ca.crt). Those secrets are projected into the `audit` namespace
# by External Secrets below.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: audit-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.agent.audit.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.transactions.transaction.initiated
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.balance.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.kyc.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.consent.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.customer.audit
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.clearing.batch.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.security.ict.incident
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.dispute.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.statement.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.sanctions.screening.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.fx.conversion.completed
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.documents.document.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Six topics audit-service subscribes to whose grants its KafkaUser predates (#2598 → #3271).
      # The cluster is deny-by-default (allow.everyone.if.no.acl.found=false,
      # components/kafka/kafka.yaml:118), so each of these subscriptions was silently receiving
      # nothing — and an audit trail missing payment, card and lending events reads exactly like a
      # quiet period.
      - resource:
          type: topic
          name: openbank.cards.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Card money path (ADR-0283 phase 1, #8809). Separate topic from the lifecycle one above;
      # without this grant the subscription is ACL-denied as a silent retry loop, not a red pod.
      - resource:
          type: topic
          name: openbank.card.processing.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.domestic.payment.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.lending.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.payments.swift.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.sepa.instant.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.sepa.payment.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Issue #5338: audit-service did not subscribe to this topic at all, so SCA device
      # enrollment (DEVICE_ENROLLED) was never recorded in the audit trail -- a real PSD2/SCA
      # compliance gap (sca-service is money-path, strong customer authentication). The
      # KafkaTopic resource already exists (owned by onboarding, its other consumer,
      # components/onboarding/kafka-topics.yaml) -- this is only the Read grant this
      # KafkaUser needs.
      - resource:
          type: topic
          name: openbank.sca.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Issue #5728 (ADR-0249 D4): audit-service did not subscribe to the delegation topic at
      # all, so no grant lifecycle event was audited and the new spend-reservation events would
      # have been ACL-denied on arrival. The KafkaTopic resource already exists (owned by its
      # producer, components/delegation/kafka-topic.yaml) -- this is only the Read grant.
      - resource:
          type: topic
          name: openbank.delegation.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.delegation.spend-reservation-state
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Issue #6035: four money-path produced topics had no Read grant here, so even after
      # being added to the subscription list they would have been ACL-denied at runtime with
      # no error surfaced anywhere (the #5338 shape) -- the poll fails silently and the audit
      # trail simply has no rows. Each KafkaTopic resource already exists and is owned by its
      # producer; these are Read grants only, no topic is created here.
      # components/ledger/kafka-topic.yaml -- the posting record itself.
      - resource:
          type: topic
          name: openbank.ledger.journal.posted
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # components/sdd/kafka-topic.yaml
      - resource:
          type: topic
          name: openbank.sdd.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # components/interest-service/kafka-topic.yaml
      - resource:
          type: topic
          name: openbank.interest.accrual.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # components/fraud-service/kafka-topics.yaml
      - resource:
          type: topic
          name: openbank.fraud.hold.changed
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: audit-service
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: audit-service-agent-provenance
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `agent-audit-events-in` channel (the D5
      # provenance stream — AgentAuditConsumer acks only after append-only persistence, so it
      # rethrows by design). Write, not Read: the connector PARKS a failed record by PRODUCING.
      - resource:
          type: topic
          name: openbank.dlq.audit.agent-audit-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `audit-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.audit.audit-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# Projects the Strimzi-minted keystore secret (messaging/audit-service) into
# the audit namespace so the pod volume mount can reference it directly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: audit-service-kafka-keystore
  namespace: audit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: audit-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: audit-service
---
# Projects the cluster CA truststore (messaging/openbank-cluster-cluster-ca-cert)
# into the audit namespace. Shared pattern with other Tier 2 consumers.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: audit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
