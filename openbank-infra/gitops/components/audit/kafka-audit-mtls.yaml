# Kafka mTLS identity for audit-service (ADR-0137, #2665 Tier 2b)
#
# Identity model (ADR-0137): mTLS gives each service exactly one client cert =
# one KafkaUser = one principal for ALL of its Kafka traffic. The audit-service
# is a pure consumer of domain events across 10 topics; it only needs Read+Describe
# ACLs on those topics and Read on its consumer group. Topics not listed here
# stay open under allow.everyone.if.no.acl.found=true (see kafka.yaml).
#
# clearing.batch.event / security.ict.incident / security.scan.event added (ADR-0160
# #996 triage): each was published with zero consumers since introduction — audit-service
# is the sole intended consumer per the publishing services' own docs.
#
# dispute.events / statement.event / sanctions.screening.event added (#996 round 2) —
# each publisher has its own mTLS KafkaUser with a Write ACL on its topic, which makes
# that topic ACL-guarded (no longer covered by allow.everyone.if.no.acl.found=true), so
# audit-service needs an explicit Read+Describe grant to actually consume it. Verified
# each has a real producer (a genuine outbox-row write) before adding — cards.events /
# domestic.payment.events / sepa.payment.events have no dedicated mTLS KafkaUser and stay
# open under allow-everyone, same as clearing/security-scanner above; no ACL change needed
# for those three.
#
# Strimzi User Operator mints a per-user Secret in `messaging` (user.crt/key/p12
# + user.password + ca.crt). Those secrets are projected into the `audit` namespace
# by External Secrets below.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: audit-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.transactions.transaction.initiated
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.balance.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.kyc.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.consent.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.customer.audit
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.clearing.batch.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.security.ict.incident
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.security.scan.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.dispute.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.statement.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.sanctions.screening.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.fx.conversion.completed
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.documents.document.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Six topics audit-service subscribes to whose grants its KafkaUser predates (#2598 → #3271).
      # The cluster is deny-by-default (allow.everyone.if.no.acl.found=false,
      # components/kafka/kafka.yaml:118), so each of these subscriptions was silently receiving
      # nothing — and an audit trail missing payment, card and lending events reads exactly like a
      # quiet period.
      - resource:
          type: topic
          name: openbank.cards.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.domestic.payment.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.lending.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.payments.swift.event
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.sepa.instant.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.sepa.payment.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: audit-service
          patternType: literal
        operations: [Read]
        host: "*"
---
# Projects the Strimzi-minted keystore secret (messaging/audit-service) into
# the audit namespace so the pod volume mount can reference it directly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: audit-service-kafka-keystore
  namespace: audit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: audit-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: audit-service
---
# Projects the cluster CA truststore (messaging/openbank-cluster-cluster-ca-cert)
# into the audit namespace. Shared pattern with other Tier 2 consumers.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: audit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
