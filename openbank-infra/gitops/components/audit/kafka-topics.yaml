# Kafka topics consumed by audit-service (ADR-0048 event contract).
# openbank.accounts.account.created and openbank.transactions.transaction.initiated
# are owned by their respective services (accounts/payments components) — not here.
# openbank.consent.events is owned by consent component — not here.
# These three are the remaining domain event buses that audit-service reads and that
# have no existing KafkaTopic manifest elsewhere in GitOps.
---
# Balance projection events — published by balance-service on every balance mutation.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.balance.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Party lifecycle events — published by party-service on profile create/update/KYC link.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.party.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# KYC status events — published by kyc-service on verification result.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.kyc.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
