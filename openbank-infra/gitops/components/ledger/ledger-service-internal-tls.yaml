#
# Private-CA server certificate for ledger-service's east-west mTLS listener (8443). The existing HTTP listener remains
# during the east-west TLS migration; new consumers use the parallel 8443 listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ledger-service-internal-tls
  namespace: ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: ledger-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - ledger-service.ledger.svc
    - ledger-service.ledger.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
