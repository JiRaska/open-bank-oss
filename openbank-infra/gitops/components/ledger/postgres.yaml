# Single-owner Postgres for ledger-service, reconciled by the cluster-wide CNPG
# operator. CNPG generates the `ledger-db-app` secret (username/password for the
# `openbank` owner) and a `ledger-db-rw` Service — both consumed by the
# ledger-service Deployment for the reactive datasource and Flyway migrations.
# One instance for sandbox FinOps; prod should raise to 3 for HA (money-path).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ledger-db
  namespace: ledger
spec:
  # DB-layer observability (Dynatrace-parity #0): CNPG runs its built-in
  # Prometheus exporter on :9187 and creates a PodMonitor the operator owns.
  # kube-prometheus-stack selects PodMonitors cluster-wide (NilUsesHelmValues
  # =false), so this lights up cnpg_* metrics (connections, replication lag,
  # deadlocks, xid age, WAL archiving) with zero app changes.
  monitoring:
    enablePodMonitor: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_ledger
      owner: openbank
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the ledger-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/ledger-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ledger-db-daily
  namespace: ledger
spec:
  schedule: "0 5 2 * * *"
  backupOwnerReference: self
  cluster:
    name: ledger-db
