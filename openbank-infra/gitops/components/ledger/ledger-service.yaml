# ledger-service: the double-entry sub-ledger API (money-path). Reactive Postgres
# datasource + Flyway JDBC migrations against the single-owner CNPG cluster, and a
# Kafka producer that publishes `openbank.ledger.journal.posted` to the Strimzi
# bus when journal entries are posted. OIDC bearer-token validation points at
# Keycloak over the in-cluster http leg (discovery returns the public issuer, so
# browser-minted user tokens validate without touching the self-signed edge
# cert). Redis backs the ADR-0155 four-eyes ApprovalStore (no Idempotency-Key
# surface). No Ingress — internal only. Stays in CrashLoop until the DB and the
# realm client are reachable; ArgoCD converges as each dependency comes up.
#
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 2). Canary strategy
# — 10% 5 min → 30% 5 min → 100%. ClusterAnalysisTemplate openbank-money-path-canary
# runs continuous background analysis from step 1 (error rate <1%, p95 <500ms).
# Dual Services: ledger-service (stable) + ledger-service-canary. DNS unchanged.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ledger-service
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-service
    app.kubernetes.io/part-of: ledger
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
        app.kubernetes.io/part-of: ledger
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-ledger-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "cd40dc718702c60d"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-ledger-service:sandbox-7b5d97ee
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8101
            - name: management
              containerPort: 8085
          env:
            # Default datasource exposes BOTH a JDBC leg (Flyway, blocking) and a
            # reactive leg onto the same CNPG primary; username is the `openbank`
            # owner (from application.yaml), password from the CNPG app secret.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://ledger-db-rw.ledger.svc:5432/openbank_ledger
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://ledger-db-rw.ledger.svc:5432/openbank_ledger
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-db-app
                  key: password
            # Redis for the four-eyes ApprovalStore (ADR-0155).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.ledger.svc:6379
            # Flyway checksum mismatch on V7/V9/V11 (2026-07-11 bootstrap redeploy, #880):
            # ledger-service hadn't been redeployed since 2026-07-06, so a repo-wide
            # migration-file touch-up landed while it sat un-deployed. Repair-at-start
            # re-baselines the recorded checksums to the current files — safe, matching the
            # onboarding-service precedent (#730): git history shows these migration files
            # have had no real content edit since their original authoring commit. Remove
            # once the live schema_history rows are confirmed repaired (one clean boot is
            # enough; safe to leave briefly, repair is a no-op once checksums already match).
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            # Kafka producer → Strimzi tls:9093 (mTLS, ADR-0137 #2665 Tier 1).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC resource-server: validate bearer tokens over the internal http
            # leg; discovery returns the public issuer so browser-minted user
            # tokens validate here without the edge cert.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: FX_SERVICE_URL
              value: http://fx-service.fx.svc:8119
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-service-oidc
                  key: OIDC_CLIENT_SECRET
            # isn't flooded with connection-refused retries.
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
            # Accounting-day lock (ADR-0207 D3, #1302) moves shadow -> enforce. The
            # evidence gate the ADR set was "would_refuse zero-or-explained after at
            # least one full day cycle"; six cycles have now run (2026-08-07..12 all
            # TIED_OUT) and the readout is zero from two independent sources. It was
            # NOT taken from the shadow counter alone -- that counter is pod-local and
            # Prometheus retains 12h, and posting volume here is far too low for a
            # soak to mean anything. It was taken by enumerating the whole population
            # in ledger-db: of all 168 journal entries ever written, 122 are
            # future-dated and 46 are same-day (Prague); ZERO are backdated, so there
            # is no posting shape in this environment that enforce would refuse.
            # Rollback is this value alone: set back to "shadow".
            - name: LEDGER_DAY_LOCK_MODE
              value: "enforce"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is TCP on the http port, not /q/health/ready: the Kafka
          # producer's readiness sits KO until the first event is sent (lazy
          # connect), which with an idle producer would never flip — a
          # serve-before-traffic deadlock. Flyway-at-start already guarantees DB
          # connectivity before the port opens, so an accepting socket means a
          # working datasource. Liveness uses http health (no producer dep).
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in ledger-service (ledger.list/read/create/
        # reverse/approve/trigger). Bundle mounted from ledger-opa-bundle ConfigMap
        # (gen-ledger-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/ledger_rest_ext.rego
              subPath: ledger_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: ledger-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: ledger-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: ledger-service
      canaryService: ledger-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
# Stable service — original DNS name preserved; Rollouts controller adds
# rollouts-pod-template-hash selector to pin to stable replica set.
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8101
      targetPort: http
---
# Canary service — Rollouts controller updates selector to canary replica set.
# Internal callers that need to target canary pods directly use this Service.
apiVersion: v1
kind: Service
metadata:
  name: ledger-service-canary
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8101
      targetPort: http
