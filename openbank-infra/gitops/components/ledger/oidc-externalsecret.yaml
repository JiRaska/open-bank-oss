# OIDC client secret for ledger-service, projected from Vault by the External
# Secrets Operator (ClusterSecretStore `vault-kv`) into the in-namespace Secret
# `ledger-service-oidc`. All services share the single Keycloak confidential
# client `openbank-services`, so the secret VALUE is the same one already stored
# in Vault under key `account-service` — reuse it rather than minting a second
# copy (no new Vault write needed). The secret value never enters Git or the
# Deployment manifest; only this reference does. creationPolicy Owner +
# deletionPolicy Retain mirror the account-service ExternalSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ledger-service-oidc
  namespace: ledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: ledger-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
