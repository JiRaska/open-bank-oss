# Single-owner Postgres for anacredit-service (cluster-wide CNPG operator, ADR-0037 v2).
# Generates the anacredit-db-app secret (username/password for the `openbank` owner) and an
# anacredit-db-rw Service the Deployment uses. Must reconcile BEFORE the anacredit-service image
# that carries the datasource config deploys, else Flyway-at-start fails on a missing DB.
# NOTE: no S3 WAL/backup here yet — that needs an EKS Pod Identity role (#863 pattern, same gap as
# product-catalog-db), tracked as a follow-up. Unlike product-catalog, credit exposures are NOT
# reconstructible from in-code seed data — a data-loss event here loses real regulatory-reporting
# state, so backups should be prioritised ahead of product-catalog's when that follow-up lands.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: anacredit-db
  namespace: anacredit
spec:
  monitoring:
    enablePodMonitor: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_anacredit
      owner: openbank
