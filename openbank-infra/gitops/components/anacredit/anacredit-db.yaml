# SPDX-License-Identifier: Apache-2.0
# Single-owner Postgres for anacredit-service (cluster-wide CNPG operator, ADR-0009). Serves two
# independent tables in the same database: the CreditExposure store (ADR-0037 v2) and the
# loan.stage_changed projection (ADR-0037 follow-up, issue #638). Generates the anacredit-db-app
# secret (username/password for the `openbank` owner) and an anacredit-db-rw Service the Deployment
# uses. Must reconcile BEFORE the anacredit-service image that carries the datasource config
# deploys, else Flyway-at-start fails on a missing DB (same pattern as product-catalog-db.yaml).
# S3 WAL archiving + daily base backups are configured below (#1444). Credit exposures are NOT
# reconstructible from in-code seed data — a data-loss event here loses real regulatory-reporting
# state, which is why this one is not left on the "restore from seed" footing product-catalog is.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: anacredit-db
  namespace: anacredit
spec:
  monitoring:
    enablePodMonitor: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike or bulk load cannot fill the 2Gi volume (#1432).
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS
  # Pod Identity on the anacredit-db ServiceAccount (aws/.../db-backups.tf) — barman reads the
  # SDK chain, no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/anacredit-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openbank_anacredit
      owner: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: anacredit-db-daily
  namespace: anacredit
spec:
  schedule: "0 3 3 * * *"
  backupOwnerReference: self
  cluster:
    name: anacredit-db
