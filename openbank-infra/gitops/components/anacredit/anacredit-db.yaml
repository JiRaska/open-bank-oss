# SPDX-License-Identifier: Apache-2.0
# Single-owner Postgres for anacredit-service (cluster-wide CNPG operator, ADR-0009). Serves two
# independent tables in the same database: the CreditExposure store (ADR-0037 v2) and the
# loan.stage_changed projection (ADR-0037 follow-up, issue #638). Generates the anacredit-db-app
# secret (username/password for the `openbank` owner) and an anacredit-db-rw Service the Deployment
# uses. Must reconcile BEFORE the anacredit-service image that carries the datasource config
# deploys, else Flyway-at-start fails on a missing DB (same pattern as product-catalog-db.yaml).
# S3 WAL archiving + daily base backups are configured below (#1444). Credit exposures are NOT
# reconstructible from in-code seed data — a data-loss event here loses real regulatory-reporting
# state, which is why this one is not left on the "restore from seed" footing product-catalog is.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: anacredit-db
  namespace: anacredit
spec:
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  # Two instances, not one (#9691). CNPG puts a `minAvailable: 1` PDB on the
  # primary; in a single-instance cluster the sole pod IS the primary, so
  # `disruptionsAllowed` is pinned at 0 permanently and no eviction can ever be
  # permitted. That is not a tuning choice, it is arithmetic — and it deadlocked
  # three node drains for 9-15 days while the cluster paid for both those nodes
  # and the idle replacements Karpenter had already provisioned. The replica is
  # also the switchover target a single-instance cluster never had.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike or bulk load cannot fill the 2Gi volume (#1432).
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS
  # Pod Identity on the anacredit-db ServiceAccount (aws/.../db-backups.tf) — barman reads the
  # SDK chain, no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/anacredit-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openbank_anacredit
      owner: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: anacredit-db-daily
  namespace: anacredit
spec:
  schedule: "0 3 3 * * *"
  backupOwnerReference: self
  cluster:
    name: anacredit-db
