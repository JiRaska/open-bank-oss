# Fix for the dotted-key YAML config bug (issue #686, fleet sweep).
#
# Quarkus's YAML config source (quarkus-config-yaml / SmallRye YamlConfigSource#flattenYaml)
# unconditionally quotes any mp.messaging.incoming.<channel> YAML leaf key containing a
# literal dot when registering it as a MicroProfile Config property. A YAML key written as
# `group.id: foo` under `mp.messaging.incoming.<channel>:` in application.yaml registers ONLY
# as `mp.messaging.incoming.<channel>."group.id"` (literal quotes in the property name) —
# never as the plain `mp.messaging.incoming.<channel>.group.id` that
# KafkaConnectorIncomingConfiguration.getGroupId() (and the auto.offset.reset equivalent)
# actually reads. group.id then silently falls back to Quarkus's default
# (quarkus.application.name = openbank-anacredit-service), which the anacredit-service
# KafkaUser ACL (kafka-anacredit-mtls.yaml) does NOT grant Read on — only
# "anacredit-service-lending" — so every consumer poll would hit a silent
# GroupAuthorizationException.
#
# Why a properties FILE and not env vars: SmallRye discovers messaging channels by scanning
# config property NAMES, and the env-var form (MP_MESSAGING_INCOMING_LENDING_EVENTS_IN_GROUP_ID
# etc.) reverse-maps ambiguously for hyphenated channel names -> a broken channel -> startup
# crash (quarkusio/quarkus#30106, smallrye/smallrye-reactive-messaging#2028 — this exact
# failure mode was hit for fraud-service's env-var attempt, PR #685, and corrected to the
# properties-file pattern in PR #698; see ADR-0137). A properties file carries the EXACT
# dotted/hyphenated property names unambiguously, so channel discovery is unambiguous.
#
# config_ordinal=500 forces this source to outrank the baked application.yaml (~254).
# Loaded via QUARKUS_CONFIG_LOCATIONS on the Rollout (anacredit-service.yaml). Same pattern
# as onboarding-service's msg-override ConfigMap
# (openbank-infra/gitops/components/onboarding/onboarding-service-msg-override.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: anacredit-service-msg-override
  namespace: anacredit
  labels:
    app.kubernetes.io/name: anacredit-service
    app.kubernetes.io/part-of: anacredit
data:
  override.properties: |
    config_ordinal=500
    mp.messaging.incoming.lending-events-in.group.id=anacredit-service-lending
    mp.messaging.incoming.lending-events-in.auto.offset.reset=earliest
