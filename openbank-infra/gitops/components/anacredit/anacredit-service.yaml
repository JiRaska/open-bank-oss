# SPDX-License-Identifier: Apache-2.0
# anacredit-service: AnaCredit regulatory reporting (ECB loan-level data, ADR-0037).
# OIDC bearer auth via in-cluster Keycloak.
#
# Postgres-backed: ADR-0037 v2 made the CreditExposure store durable, and the loan.stage_changed
# event-ingestion follow-up (issue #638) added the separate loan_stage_projection read-model — same
# anacredit-db CNPG cluster (anacredit-db.yaml), which must reconcile BEFORE this Deployment rolls
# the datasource-carrying image, else Flyway-at-start fails on a missing DB (same pattern as
# product-catalog-db.yaml).
# Kafka mTLS identity/ACLs: kafka-anacredit-mtls.yaml (ADR-0137 pattern) — the KafkaUser/ExternalSecrets
# there must also land first (lower sync-wave) so the keystore Secret exists when this pod starts.
# Probes are httpGet on /q/health/ready (not a bare tcpSocket) so Flyway-at-start failures actually
# fail the probe instead of a false-green TCP-only check (ADR-0105 P1 lesson, product-catalog-db.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anacredit-service
  namespace: anacredit
  labels:
    app.kubernetes.io/name: anacredit-service
    app.kubernetes.io/part-of: anacredit
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anacredit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anacredit-service
        app.kubernetes.io/part-of: anacredit
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-anacredit-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "0d2424b16a84fb70"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anacredit-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-anacredit-service:sandbox-3b62a4a5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8137
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anacredit-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Datasource: single anacredit-db, backs both the CreditExposure store (ADR-0037 v2)
            # and the loan_stage_projection read-model (issue #638). Reactive URL for the app
            # (Panache); JDBC URL for Flyway. Bare `postgresql://` scheme (not `vertx-reactive:`),
            # matching the already-working product-catalog pattern (product-catalog.yaml).
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://anacredit-db-rw.anacredit.svc:5432/openbank_anacredit
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://anacredit-db-rw.anacredit.svc:5432/openbank_anacredit
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: anacredit-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: anacredit-db-app, key: password}}
            # Kafka mTLS (ADR-0137, kafka-anacredit-mtls.yaml) — consumes loan.stage_changed only.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anacredit-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # issue #686: group.id / auto.offset.reset override (anacredit-service-msg-override
            # ConfigMap, mounted below) as an external Quarkus config source, since the dotted
            # YAML keys in application.yaml silently never register as the plain MicroProfile
            # Config property Quarkus reads (ADR-0137 pattern, see onboarding-service /
            # transaction-service). NOT env vars: SmallRye's env-var reverse-mapping is
            # ambiguous for hyphenated channel names like lending-events-in and can crash at
            # boot (quarkusio/quarkus#30106, smallrye/smallrye-reactive-messaging#2028).
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            # OPA sidecar bootstrap (ADR-0034 Phase 5, issue #938). Advisory mode first
            # (AUTHZ_ENFORCE=false, @Authorize logs "would DENY" without blocking) — matches
            # every other service's rollout convention. Flip to true only after an observation
            # window with a clean advisory report.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        # OPA policy-decision sidecar (ADR-0034, issue #938 bootstrap). Serves
        # data.openbank.rest.allow for all @Authorize-annotated endpoints in
        # anacredit-service (anacredit.*). Bundle mounted from anacredit-opa-bundle
        # ConfigMap (gen-anacredit-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/anacredit_rest_ext.rego
              subPath: anacredit_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: anacredit-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: anacredit-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: anacredit-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: anacredit-service
  namespace: anacredit
  labels:
    app.kubernetes.io/name: anacredit-service
    app.kubernetes.io/part-of: anacredit
spec:
  selector:
    app.kubernetes.io/name: anacredit-service
  ports:
    - name: http
      port: 8137
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
