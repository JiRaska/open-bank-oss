# SPDX-License-Identifier: Apache-2.0
# anacredit-service: AnaCredit regulatory reporting (ECB loan-level data, ADR-0037).
# No DB (reads ledger/credit APIs). OIDC bearer auth via in-cluster Keycloak.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anacredit-service
  namespace: anacredit
  labels:
    app.kubernetes.io/name: anacredit-service
    app.kubernetes.io/part-of: anacredit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anacredit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anacredit-service
        app.kubernetes.io/part-of: anacredit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anacredit-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-anacredit-service:sandbox-be701531
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8137
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anacredit-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: anacredit-service
  namespace: anacredit
  labels:
    app.kubernetes.io/name: anacredit-service
    app.kubernetes.io/part-of: anacredit
spec:
  selector:
    app.kubernetes.io/name: anacredit-service
  ports:
    - name: http
      port: 8137
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
