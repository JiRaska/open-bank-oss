# Dotted-key YAML config bug workaround (issue #686).
#
# Quarkus's YAML config source unconditionally quotes any `mp.messaging.incoming.<channel>`
# YAML leaf key containing a literal dot when registering it as a MicroProfile Config
# property. A YAML key written as `group.id: foo` under `mp.messaging.incoming.<channel>:`
# registers ONLY as `mp.messaging.incoming.<channel>."group.id"` (literal quotes in the
# property name) — never as the plain `mp.messaging.incoming.<channel>.group.id` that
# `KafkaConnectorIncomingConfiguration.getGroupId()` (and `auto.offset.reset`) actually
# read. `group.id` then silently falls back to `quarkus.application.name`
# (openbank-notification-service), which the Strimzi KafkaUser ACL
# (kafka-notification-mtls.yaml) does NOT grant Read on for either consumer group — every
# poll on both channels gets a silent GroupAuthorizationException.
#
# Why a properties FILE and not env vars: this mirrors the pre-existing pattern already used
# for transaction-service's payment-scheme-accepted channel
# (openbank-infra/gitops/components/payments/transaction-service-msg-override.yaml). A properties
# file carries the exact hyphenated/dotted keys unambiguously, avoiding any reliance on
# MicroProfile Config's env-var-name reverse-mapping for channel discovery.
#
# Correction (round 2): an earlier version of this comment first cited a nonexistent issue
# #2649, then over-corrected to claim env vars are "independently verified to work" here — that
# overstated it too. The genuine concern is real: quarkusio/quarkus#30106 and
# smallrye/smallrye-reactive-messaging#2028 document a live, unresolved upstream bug where an
# env-var override of a single leaf property (e.g. `retries`, here `group.id`/`auto.offset.reset`)
# on a HYPHENATED channel name crashes Quarkus at startup (`SRMSG00071`, "connector attribute must
# be set for channel <wrong split>") — regardless of whether the channel is already registered
# via YAML/annotations. Boot tests added during this sweep inject the override via a
# QuarkusTestResourceLifecycleManager config map, not a real OS env var, so they don't exercise
# this failure mode. This properties-file mechanism is the CORRECT choice for hyphenated channels
# like `notification-events-in`/`party-events-in`, not merely a stylistic alternative.
#
# client.id is included below too (cosmetic-only — broker-side log/JMX label, not
# authorization) rather than left as a broken YAML key: SmallRye's expression-expansion
# interceptor (which resolves ${quarkus.uuid}) runs after config sources merge, so it
# applies identically regardless of which source supplied the raw string — a properties
# file is no different from application.yaml here.
#
# config_ordinal=500 forces this source to outrank the baked application.yaml (~254).
# Loaded via QUARKUS_CONFIG_LOCATIONS on the Deployment (notification-service.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-msg-override
  namespace: notifications
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: notifications
data:
  override.properties: |
    config_ordinal=500
    mp.messaging.incoming.notification-events-in.client.id=notification-service-${quarkus.uuid}
    mp.messaging.incoming.notification-events-in.group.id=notification-service
    mp.messaging.incoming.notification-events-in.auto.offset.reset=earliest
    # #5745 (sweep of #5698): explicit DLQ topic for the notification-events-in channel
    # (failure-strategy: dead-letter-queue, set in application.yaml). Explicit rather than the
    # SmallRye default `dead-letter-topic-notification-events-in` for the same reason as
    # party-events-in below — a dotted leaf key, so it MUST live here (issue #686).
    mp.messaging.incoming.notification-events-in.dead-letter-queue.topic=openbank.notification.requests.dlq
    mp.messaging.incoming.party-events-in.client.id=notification-service-party-${quarkus.uuid}
    mp.messaging.incoming.party-events-in.group.id=notification-service-party
    mp.messaging.incoming.party-events-in.auto.offset.reset=earliest
    # #5698: explicit DLQ topic for the party-events-in channel (failure-strategy:
    # dead-letter-queue, set in application.yaml). Explicit rather than implicit because
    # SmallRye's default name is dead-letter-topic-<channel>, and account-service already owns
    # `dead-letter-topic-party-events-in` for ITS party-events-in channel — sharing it would put
    # two services' dead letters in one topic and misattribute them in the existing
    # AccountPartyEventDeadLettered alert. Dotted leaf key, so it MUST live here and not in
    # application.yaml (issue #686, same reason as group.id above).
    mp.messaging.incoming.party-events-in.dead-letter-queue.topic=openbank.party.events.notification.dlq
    mp.messaging.incoming.delegation-events-in.client.id=notification-service-delegation-${quarkus.uuid}
    mp.messaging.incoming.delegation-events-in.group.id=notification-service-delegation
    mp.messaging.incoming.delegation-events-in.auto.offset.reset=earliest
