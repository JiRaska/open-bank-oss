# Kafka mTLS identity for notification-service (ADR-0137 Tier 2c — #2665).
# KafkaUser minted by the Strimzi User Operator in `messaging`; its keystore
# secret is projected into `notifications` via ExternalSecret (kafka-messaging-certs
# ClusterSecretStore). The cluster-CA truststore is shared and also projected.
#
# ACLs: notification-service is a pure consumer — it reads from two topics using
# two separate consumer groups. No Write grants needed.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs must land before the notifications Deployment rolls pods
    # onto mTLS; lower waves sync first and ArgoCD blocks on ExternalSecrets
    # reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: notification-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: notification-service
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: notification-service-party
          patternType: literal
        operations: [Read]
        host: "*"
---
# Keystore projection: Strimzi User Operator writes the per-user keystore Secret
# in `messaging`; ESO projects it into `notifications` for pod volume mount.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the notifications Deployment replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: notification-service-kafka-keystore
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: notification-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: notification-service
---
# Shared cluster-CA truststore — same cert for every TLS client; projected from
# `messaging` into `notifications` so pods can verify the broker certificate.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the notifications Deployment replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
