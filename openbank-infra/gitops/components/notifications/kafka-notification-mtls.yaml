# Kafka mTLS identity for notification-service (ADR-0137 Tier 2c — #2665).
# KafkaUser minted by the Strimzi User Operator in `messaging`; its keystore
# secret is projected into `notifications` via ExternalSecret (kafka-messaging-certs
# ClusterSecretStore). The cluster-CA truststore is shared and also projected.
#
# ACLs: notification-service reads from four topics using four separate consumer
# groups, and — since ADR-0239 D2 — WRITES delivery outcomes onto one topic. That
# Write grant is the whole of its producer surface; it is not a general producer.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs must land before the notifications Deployment rolls pods
    # onto mTLS; lower waves sync first and ArgoCD blocks on ExternalSecrets
    # reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: notification-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # #5745 (sweep of #5698): SmallRye dead-letter topic for the notification-events-in channel.
      # Without Write here the DLQ send itself fails and the consumer wedges on the very failure it
      # was meant to park — the same lockout class the party-events-in DLQ grant below exists for.
      - resource:
          type: topic
          name: openbank.notification.requests.dlq
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # #8432: KYC outcome notifications (KycNotificationConsumer) — a further consumer of the
      # topic kyc-service already publishes via its transactional outbox.
      - resource:
          type: topic
          name: openbank.kyc.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # #8432: SmallRye dead-letter topic for the kyc-events-in channel (failure-strategy:
      # dead-letter-queue, set in application.yaml in nested form). Without Write here the DLQ
      # send itself fails and the consumer wedges on the very failure it was meant to park.
      - resource:
          type: topic
          name: openbank.kyc.events.notification.dlq
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # ADR-0232 delegated-access lifecycle notifications (DelegationNotificationConsumer) — a
      # second consumer of the topic account-service and audit-service already read.
      - resource:
          type: topic
          name: openbank.delegation.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # #5698: SmallRye dead-letter topic for the party-events-in channel. Without Write here
      # the DLQ send itself fails and the consumer wedges on the very failure it was meant to
      # park — the same ANONYMOUS-vs-ACL lockout class that took party-service down (#1476), and
      # the reason account-service's own ACL carries the identical grant. The name is set
      # explicitly in notification-service-msg-override.yaml rather than left to SmallRye's
      # `dead-letter-topic-<channel>` default, which account-service already owns.
      - resource:
          type: topic
          name: openbank.party.events.notification.dlq
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # ADR-0239 D2: emit delivery outcomes so a producer can tell an accepted handoff
      # from a delivered, suppressed or failed message (issue #3663).
      - resource:
          type: topic
          name: openbank.notification.outcomes.v1
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: notification-service
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: notification-service-party
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: notification-service-kyc
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: notification-service-delegation
          patternType: literal
        operations: [Read]
        host: "*"
---
# Keystore projection: Strimzi User Operator writes the per-user keystore Secret
# in `messaging`; ESO projects it into `notifications` for pod volume mount.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the notifications Deployment replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: notification-service-kafka-keystore
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: notification-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: notification-service
---
# Shared cluster-CA truststore — same cert for every TLS client; projected from
# `messaging` into `notifications` so pods can verify the broker certificate.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the notifications Deployment replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
