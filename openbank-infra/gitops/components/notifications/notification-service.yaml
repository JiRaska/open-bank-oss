# notification-service: async Kafka consumer that renders + dispatches
# notifications (email/SMS/push stubs), backed by a single-owner CNPG Postgres
# (notifications + outbox + dispatch-control tables, Flyway-migrated at start).
#
# FinOps tier T2 (ADR-0057): this Deployment declares NO static replica count —
# the KEDA ScaledObject (scaledobject.yaml) owns the replica count and scales it
# from 0 (idle) to N on measured Kafka consumer-group lag. So the steady state is
# zero resident pods; a record on openbank.notification.requests wakes it, it
# drains, and KEDA returns it to zero after the cooldown.
#
# OIDC is disabled for the pilot: the consumer/outbox path needs no bearer tokens
# and the REST surface is ClusterIP-only (not exposed via ingress), so we avoid an
# out-of-band client-secret. The mailer runs in mock mode (no SMTP in the sandbox).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: notifications
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: notifications
    # No openbank.io/finops-tier: the T2 declaration was removed with the KEDA
    # ScaledObject it named (ADR-0057 T2 == "KEDA ScaledObject on Kafka consumer-group
    # lag"). T2 stopped being true the moment the warm floor went to 1 for the
    # customer-edge synchronous read; the scaler that made it nominally true had never
    # worked. T1 (KEDA HTTP add-on, as product-catalog/interest/card-issuance/sdd use)
    # is the plausible home once this service has a native image — until then it is
    # unclassified, like the other 37 pending the ADR-0054 classifier.
spec:
  # Replicas are owned here again, explicitly: KEDA's ScaledObject used to own them and
  # is gone. Leaving the field absent would work only by Kubernetes' default-to-1, which
  # is an accident rather than a declaration.
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      annotations:
        # Rolls the Deployment when the OPA policy bundle changes (subPath mounts don't
        # hot-reload). Kept in sync by gen-notification-opa-bundle.sh.
        openbank.tech/policy-checksum: "ab4f3cd54678f52c"
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: notifications
        # Oversight webhook egress (ADR-0059). Permits (does not force) internet
        # egress on 443 for the Slack/Teams call. Harmless while the feature is
        # off (SLACK_WEBHOOK_ENABLED=false); required the moment it is enabled.
        openbank.io/allow-internet-egress: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-notification-service:sandbox-e227ea9a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8112
            - name: management
              containerPort: 8085
          env:
            # JDBC leg: Hibernate ORM + Flyway (blocking) onto the CNPG primary.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://notifications-db-rw.notifications.svc:5432/openbank_notifications
            # Reactive leg: reactive Panache repositories onto the same primary.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://notifications-db-rw.notifications.svc:5432/openbank_notifications
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifications-db-app
                  key: password
            # Kafka consumer → Strimzi bootstrap (ADR-0137: mTLS on :9093).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC on: the customer-edge now proxies authenticated reads to the REST
            # list endpoint (@RolesAllowed), so bearer tokens must be validated here.
            # Resource-server JWT validation uses the realm JWKS (auth-server-url) — the
            # client secret in application.yaml stays a placeholder and is unused for it.
            # Pointed at the in-cluster Keycloak http leg (default was localhost → the
            # endpoint 500'd with "OIDC server not available" once first called).
            - name: QUARKUS_OIDC_ENABLED
              value: "true"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # ADR-0198 D4 consent gate (#2660): MARKETING sends check consent-service per send.
            # The M2M client_credentials grant rides the shared openbank-services client.
            #
            # This comment used to claim OIDC_CLIENT_SECRET was "already projected for the OIDC
            # resource-server config". It was not projected at all — and it could not have been,
            # since resource-server JWT validation uses the realm JWKS, not a client secret. So
            # the consent gate's M2M call had no credential to mint a token from (#2929). The ref
            # below and oidc-externalsecret.yaml close that.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notification-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: false
            - name: CONSENT_SERVICE_URL
              value: http://consent-service.consent.svc:8106
            # No SMTP in the sandbox — mock the mailer so dispatch logs instead of
            # opening a dead localhost:1025 connection.
            - name: QUARKUS_MAILER_MOCK
              value: "true"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Oversight webhook (ADR-0059). ENABLED — the Slack incoming-webhook URL
            # is in OpenBao (openbank/notification-service SLACK_WEBHOOK_URL) and
            # projected via the ExternalSecret (webhook-externalsecret.yaml). Only
            # anonymized, allow-listed oversight signals ever egress — see
            # OversightWebhook.kt.
            - name: SLACK_WEBHOOK_ENABLED
              value: "true"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notification-webhook
                  key: SLACK_WEBHOOK_URL
                  optional: true
            # PUSH delivery via APNs (ApnsPushSender). Adapter ON for the TestFlight
            # pilot. sandbox=FALSE → api.push.apple.com: TestFlight and App Store builds
            # use the Release config, which signs aps-environment=production (see
            # openbank-app iosApp/project.yml), so their device tokens belong to the APNs
            # PRODUCTION gateway. Only a local Xcode Debug build (aps-environment=
            # development) would register on the sandbox host. The signing key (.p8), Key
            # ID and Team ID come from Vault via apns-externalsecret.yaml; the secretKeyRefs
            # are optional:true so a not-yet-seeded Vault leaves the pod healthy —
            # ApnsPushSender is @ApplicationScoped and returns a per-send CONFIG failure,
            # never a boot crash. bundle-id must equal the app's bundle identifier.
            - name: APNS_ENABLED
              value: "true"
            - name: APNS_SANDBOX
              value: "false"
            # Must equal the app's bundle identifier (openbank-app project.yml:
            # PRODUCT_BUNDLE_IDENTIFIER=tech.openbank.app) — it becomes the apns-topic
            # header. NOT the ApnsPushSender default cz.openbank.app, which is wrong for
            # this app and would be rejected BadTopic.
            - name: APNS_BUNDLE_ID
              value: tech.openbank.app
            - name: APNS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: notification-service-apns
                  key: APNS_KEY_ID
                  optional: true
            - name: APNS_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: notification-service-apns
                  key: APNS_TEAM_ID
                  optional: true
            - name: APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-service-apns
                  key: APNS_PRIVATE_KEY
                  optional: true
            # PUSH delivery via FCM (FcmPushSender) — wired but deliberately OFF: enabling
            # before the Vault key is seeded would record every Android push as a CONFIG
            # failure instead of a skip. Activation is operational, not a code change:
            # seed openbank/notification-service FCM_SERVICE_ACCOUNT_JSON (see
            # fcm-externalsecret.yaml), flip FCM_ENABLED to "true", restart the service.
            - name: FCM_ENABLED
              value: "false"
            - name: FCM_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: notification-service-fcm
                  key: FCM_SERVICE_ACCOUNT_JSON
                  optional: true
            # Dotted-key YAML config bug workaround (issue #686): load the
            # notification-events-in / party-events-in group.id and auto.offset.reset
            # override (notification-service-msg-override ConfigMap, mounted below) as
            # an external Quarkus config source. See that ConfigMap's header comment
            # for why this must be a properties file and not env vars.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is TCP on http (not /q/health/ready): the Kafka consumer's
          # health check can sit KO on an idle topic, which would deadlock readiness.
          # Flyway-at-start guarantees DB connectivity before the port opens.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034 D5) — same pattern as customer-edge.
        # Without it every @Authorize endpoint (notification.list/read/mark-read,
        # device.*) fails CLOSED: authz.enforce defaults true and the produced
        # OpaSidecarPolicyDecisionPoint gets connection-refused on localhost:8181 →
        # 503 for the whole customer notification center + push-device registry.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: notification-service-opa-bundle
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: notification-service-kafka-keystore
            items:
              - key: user.p12
                path: user.p12
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            items:
              - key: ca.p12
                path: ca.p12
        - name: msg-override
          configMap:
            name: notification-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: notifications
  labels:
    app.kubernetes.io/name: notification-service
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8112
      targetPort: http
