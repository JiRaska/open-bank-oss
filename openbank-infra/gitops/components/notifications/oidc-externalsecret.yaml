# OIDC client secret for notification-service, projected from Vault by the External Secrets Operator
# (ClusterSecretStore `vault-kv`) into the in-namespace Secret `notification-service-oidc`.
#
# Added by #2929. notification-service's ConsentServiceClient carries OidcClientRequestReactiveFilter for the ADR-0198 D4 marketing consent gate. The Deployment comment asserted the secret was 'already projected for the OIDC resource-server config' — it was not projected at all, and resource-server JWT validation uses the realm JWKS, not a client secret, so nothing else would have provisioned it either.
#
# All services share the single Keycloak confidential client `openbank-services`, so the secret
# VALUE is the one already stored in Vault under key `account-service` — reuse it rather than
# minting a second copy (no new Vault write). The value never enters Git; only this reference does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service-oidc
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: notification-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
