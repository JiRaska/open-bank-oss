# Inbound request topic for notification-service. Declared explicitly (the broker
# does not auto-create topics) so the Strimzi topic operator manages it and KEDA
# can read the consumer-group lag against it. Lives in the `messaging` namespace
# next to the Kafka cluster (the topic operator only watches its own namespace),
# labelled for the openbank-cluster. Single partition + RF 1 for the single-broker
# sandbox; prod should raise partitions for consumer parallelism and RF to 3.
#
# Producers: any service emitting a NotificationRequest (e.g. account-opened,
# kyc-approved, otp). None publishes here yet in the sandbox — the T2 pilot
# (ADR-0057) is exercised by injecting a test record to create lag and watch
# KEDA wake the consumer from zero, drain, and return to zero.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.notification.requests
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# ADR-0239 D2: the delivery-outcome topic. notification-service writes one event per TERMINAL
# status transition (SENT / SUPPRESSED / FAILED / BOUNCED) through its transactional outbox, so a
# published outcome always corresponds to a committed row.
#
# `.v1` is in the NAME rather than a header: the contract evolves additively within v1
# (openbank-contracts/openbank-notification-service/asyncapi.yaml), and a breaking change would
# be a new topic that consumers migrate onto deliberately rather than discover at runtime.
#
# Retention 7 days, `cleanup.policy: delete` — a change feed, not a source of truth. A consumer
# that needs the full delivery history reads it from the producing service's own store; this topic
# cannot be replayed beyond a week.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.notification.outcomes.v1
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# #5698: dead-letter topic for notification-service's party-events-in channel (SmallRye
# failure-strategy: dead-letter-queue, set in the service's application.yaml). A PARTY_ERASED
# event whose GDPR Art. 17 erasure survives PartyErasureConsumer's bounded retry is parked here
# for inspection/replay instead of being acked and lost.
#
# Explicitly named (openbank.party.events.notification.dlq) rather than left to SmallRye's default
# `dead-letter-topic-<channel>`, because account-service already owns that name for its OWN
# party-events-in channel — the two would otherwise share one topic and be misattributed by the
# existing AccountPartyEventDeadLettered alert. The name is supplied via the msg-override
# ConfigMap, since `dead-letter-queue.topic` is a dotted leaf key SmallRye's YAML source would
# silently mis-quote (issue #686).
#
# A CR is required, not optional: this cluster does not auto-create topics, so without it the
# DLQ send fails and the consumer wedges on the failure it was meant to park.
#
# Longer retention than the source topic: a dead-lettered erasure is a real compliance incident
# that may outlive a 7-day window before someone replays it. No consumer by design — it is a
# quarantine, invisible to the event-consumer-liveness gate (that gate reads `outgoing:` channels,
# and this producer is the connector's implicit DLQ, not a declared channel).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.party.events.notification.dlq
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
# #5745 (sweep of #5698): dead-letter topic for notification-service's own notification-events-in
# channel (SmallRye failure-strategy: dead-letter-queue, set in the service's application.yaml).
# A notification whose dispatch (persist, contact lookup, EMAIL/PUSH send) survives one attempt and
# fails is parked here instead of being acked and lost — the channel carries transactional and
# SECURITY-category sends (OTP, SCA approval), not only marketing.
#
# No collision risk from the implicit default (`dead-letter-topic-notification-events-in`) — no
# other service declares a channel of that name — but named explicitly anyway, matching the fleet
# convention and because the topic name is supplied via the msg-override ConfigMap regardless (the
# `dead-letter-queue.topic` key is dotted, issue #686).
#
# A CR is required, not optional: this cluster does not auto-create topics, so without it the DLQ
# send itself fails and the consumer wedges on the failure it was meant to park.
#
# Longer retention than the source topic, mirroring the party-events-in DLQ above: a dead-lettered
# send is worth triaging, not merely replaying within a week.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.notification.requests.dlq
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
# #8432: dead-letter topic for notification-service's kyc-events-in channel (SmallRye
# failure-strategy: dead-letter-queue, set in the service's application.yaml in nested form).
# A KYC outcome event that survives the consumer's own poison-pill handling and still fails
# (a delivery-pipeline failure further down) is parked here instead of stopping the channel.
#
# Explicitly named (openbank.kyc.events.notification.dlq) rather than left to SmallRye's
# implicit `dead-letter-topic-kyc-events-in`: channel names repeat across services, so the
# fleet convention is an explicit per-service name any alert can attribute unambiguously.
#
# A CR is required, not optional: this cluster does not auto-create topics, so without it the
# DLQ send itself fails and the consumer wedges on the failure it was meant to park.
#
# Longer retention than the source topic, mirroring the sibling DLQs above: a dead-lettered
# SECURITY-category notification is worth triaging, not merely replaying within a week.
# #8432: DLQ for the consent-events-in channel. Explicit rather than SmallRye's implicit
# `dead-letter-topic-consent-events-in`, because campaign-service consumes the same source topic
# on a channel of the same name — left implicit the two services' dead letters would share one
# topic and every alert over it would misattribute them.
#
# A CR is required, not optional: this cluster does not auto-create topics, so without it the DLQ
# send itself fails and the consumer wedges on the failure it was meant to park.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.consent.events.notification.dlq
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.kyc.events.notification.dlq
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
