# Inbound request topic for notification-service. Declared explicitly (the broker
# does not auto-create topics) so the Strimzi topic operator manages it and KEDA
# can read the consumer-group lag against it. Lives in the `messaging` namespace
# next to the Kafka cluster (the topic operator only watches its own namespace),
# labelled for the openbank-cluster. Single partition + RF 1 for the single-broker
# sandbox; prod should raise partitions for consumer parallelism and RF to 3.
#
# Producers: any service emitting a NotificationRequest (e.g. account-opened,
# kyc-approved, otp). None publishes here yet in the sandbox — the T2 pilot
# (ADR-0057) is exercised by injecting a test record to create lag and watch
# KEDA wake the consumer from zero, drain, and return to zero.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.notification.requests
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# ADR-0239 D2: the delivery-outcome topic. notification-service writes one event per TERMINAL
# status transition (SENT / SUPPRESSED / FAILED / BOUNCED) through its transactional outbox, so a
# published outcome always corresponds to a committed row.
#
# `.v1` is in the NAME rather than a header: the contract evolves additively within v1
# (openbank-contracts/openbank-notification-service/asyncapi.yaml), and a breaking change would
# be a new topic that consumers migrate onto deliberately rather than discover at runtime.
#
# Retention 7 days, `cleanup.policy: delete` — a change feed, not a source of truth. A consumer
# that needs the full delivery history reads it from the producing service's own store; this topic
# cannot be replayed beyond a week.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.notification.outcomes.v1
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
