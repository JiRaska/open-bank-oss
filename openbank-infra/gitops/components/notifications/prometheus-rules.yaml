# SPDX-License-Identifier: Apache-2.0
# PrometheusRule alerts for the notifications namespace.
#
# Written after a 2026-08-08 live check found 53 of 66 PUSH notifications in FAILED — an 81%
# failure rate, 11 of them SCA_APPROVAL — with no rule able to see it, because nothing exported
# delivery outcomes at all. `openbank_notification_delivery_total` (NotificationConsumer.countOutcome)
# is the counter these read; it is tagged by channel, template, outcome and reason.
#
# The two failure reasons are deliberately separate alerts. `no_active_device` is a registration
# problem (the party has no device token — no backend change can deliver that push) and
# `push_rejected` is a token/provider problem. Merging them into one "push is failing" rule is what
# would make the alert unactionable.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-notification-delivery-alerts
  namespace: notifications
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: notification-service
spec:
  groups:
    - name: openbank.notification.delivery
      rules:
        # SCA is the template where a lost push hurts most: it is the prompt telling the customer
        # a payment is waiting. It is NOT the only route — the app also lists live challenges via
        # GET /customer/v1/sca/pending — so a customer who opens the app can still approve. What
        # they lose is any notice that they need to. Deliberately worded to that, not to "the
        # payment cannot be authorised": an alert that overstates its own severity is one people
        # learn to discount.
        - alert: ScaApprovalPushUndeliverable
          expr: |
            increase(openbank_notification_delivery_total{
              template="SCA_APPROVAL", outcome="FAILED"
            }[15m]) > 0
          for: 0m
          labels:
            severity: critical
            service: notification
          annotations:
            summary: "An SCA approval push could not be delivered"
            description: >-
              An SCA_APPROVAL push ended FAILED (reason={{ $labels.reason }}) in the last 15m, so
              the customer was never prompted that a payment is waiting on them. They can still
              approve it by opening the app (pending-approvals list), but will not know to.
              `no_active_device` means the party has no registered device at all.

        - alert: PushDeliveryFailureRatioHigh
          expr: |
            sum(rate(openbank_notification_delivery_total{channel="PUSH", outcome="FAILED"}[1h]))
              /
            clamp_min(sum(rate(openbank_notification_delivery_total{channel="PUSH"}[1h])), 0.001)
              > 0.5
          for: 30m
          labels:
            severity: warning
            service: notification
          annotations:
            summary: "More than half of push notifications are failing"
            description: >-
              Over 50% of PUSH deliveries have failed for 30m. Split by the `reason` label:
              `no_active_device` points at device registration (the app), `push_rejected` at
              stale tokens or an APNs/FCM problem.

        # Low-volume blind spot: with few pushes a day the ratio rule above can sit under its
        # threshold while every single push fails. This one is about absolute count, so it still
        # fires when the estate is quiet. Deliberately NOT joined against a device-registry gauge —
        # no such metric is exported today, and an expression naming a metric that does not exist
        # fails by never firing, which reads exactly like health.
        - alert: PushFailingForWantOfADevice
          expr: |
            sum(increase(openbank_notification_delivery_total{
              channel="PUSH", reason="no_active_device"
            }[24h])) > 5
          for: 1h
          labels:
            severity: warning
            service: notification
          annotations:
            summary: "Pushes are failing because parties have no registered device"
            description: >-
              More than 5 pushes in 24h ended `no_active_device`. No backend change can deliver
              these — the mobile app has not registered a device token for those parties.
