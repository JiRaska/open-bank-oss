# ADR-0099 Tier 1 — dynamic DB credentials for notification-service (pilot)
#
# ESO fetches a short-lived Postgres credential (username + password) from
# OpenBao's database secrets engine at database/creds/notifications-db-vault-role
# and projects it into the `notifications-db-dynamic` Secret in this namespace.
#
# TTL / refresh: the OpenBao lease has a 24h default TTL (max 72h). ESO's
# refreshInterval of 1h keeps the Secret well ahead of expiry — ESO will acquire
# a new lease (new username/password pair) before the old one expires. Quarkus
# reconnects via Agroal connection pool on credential change; no restart required.
#
# This ExternalSecret is the PILOT for ADR-0099 Phase 1. Validate in sandbox
# before rolling out the same pattern to the remaining Phase 1 services (audit,
# balance, fx, account, transaction, ledger). Rollout order: lowest-risk-first.
#
# Prerequisites (runbook 0006 §3):
#   1. vault_admin role created in notifications-db with CREATEROLE.
#   2. bao write database/config/notifications-db ... (configure.sh does this).
#   3. bao write database/roles/notifications-db-vault-role ... (configure.sh).
#   4. ESO ClusterSecretStore `vault-kv` must be granted read on database/creds/*.
#      The `eso` policy covers `openbank/*` (KV); extend it to `database/creds/*`
#      per runbook 0006 §2 before this ExternalSecret can sync.
#
# NOTE: the notification-service Deployment currently reads POSTGRES_PASSWORD from
# the CNPG-generated Secret `notifications-db-app`. Once this ExternalSecret is
# verified to sync, update the Deployment env var to reference `notifications-db-dynamic`
# (key: password) and add a secret-reloader annotation for zero-downtime rotation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notifications-db-dynamic
  namespace: notifications
  annotations:
    openbank.io/adr: "0099"
    openbank.io/rotation-tier: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: notifications-db-dynamic
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          # Trigger Stakater Reloader to restart the Deployment when credentials rotate.
          secret.reloader.stakater.com/match: "true"
  data:
    - secretKey: username
      remoteRef:
        key: database/creds/notifications-db-vault-role
        property: username
    - secretKey: password
      remoteRef:
        key: database/creds/notifications-db-vault-role
        property: password
