# Single-owner Postgres for notification-service, reconciled by the cluster-wide
# CNPG operator. CNPG generates the `notifications-db-app` secret (username/
# password for the `openbank` owner) and a `notifications-db-rw` Service — both
# consumed by the notification-service Deployment for the reactive datasource and
# Flyway migrations. One instance for sandbox FinOps; prod should raise to 3 for HA.
#
# NB: the DB stays resident even while notification-service is scaled to zero
# (T2, ADR-0057). The compute saving is the *app* replica, not the DB; a future
# step could also gate the DB, but a single small Postgres is a modest, stable cost.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: notifications-db
  namespace: notifications
spec:
  # DB-layer observability (Dynatrace-parity #0): CNPG runs its built-in
  # Prometheus exporter on :9187 and creates a PodMonitor the operator owns.
  # kube-prometheus-stack selects PodMonitors cluster-wide (NilUsesHelmValues
  # =false), so this lights up cnpg_* metrics (connections, replication lag,
  # deadlocks, xid age, WAL archiving) with zero app changes.
  monitoring:
    enablePodMonitor: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_notifications
      owner: openbank

  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the notifications-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/notifications-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: notifications-db-daily
  namespace: notifications
spec:
  schedule: "0 19 2 * * *"
  backupOwnerReference: self
  cluster:
    name: notifications-db
