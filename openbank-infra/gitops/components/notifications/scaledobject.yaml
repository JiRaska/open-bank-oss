# KEDA ScaledObject — the FinOps T2 scale-to-zero policy for notification-service
# (ADR-0057). KEDA owns the target Deployment's replica count via a managed HPA:
#   - idle (no consumer-group lag for `cooldownPeriod`) -> scales to ZERO pods,
#     so Karpenter consolidates the node away (idle compute ~ $0);
#   - a record on openbank.notification.requests advances the topic end-offset,
#     lag > activationThreshold wakes the Deployment 0 -> 1, it drains, commits,
#     lag returns to 0, and after the cooldown KEDA scales back to zero.
#
# This was the async-consumer pattern the ADR named the highest-ROI / lowest-risk
# first target: scaling to zero on lag is invisible to callers (no synchronous hop),
# and notification is off the money path. That assumption no longer holds: the
# customer edge now serves a SYNCHRONOUS read — GET /customer/v1/notifications proxies
# to this service's REST list — so a scale-to-zero floor would 500 the in-app feed
# whenever the consumer is idle (the Kafka trigger never scales up for an HTTP read).
# Keep a warm floor of 1; KEDA still bursts 1->3 on Kafka backlog and back down to 1.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service
  namespace: notifications
  labels:
    app.kubernetes.io/name: notification-service
    openbank.io/finops-tier: T2
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 1          # warm floor: the customer-edge notification feed is a synchronous read
  maxReplicaCount: 3          # cap fan-out on a backlog burst
  pollingInterval: 15         # how often KEDA checks lag (seconds)
  cooldownPeriod: 120         # idle grace before scaling 1 -> 0
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: openbank-cluster-kafka-bootstrap.messaging.svc:9092
        # Quarkus SmallRye sets the Kafka group.id to quarkus.application.name
        # (openbank-notification-service), NOT the channel's group.id — so KEDA
        # must track THIS group to read the consumer-group lag, or it sees none.
        consumerGroup: openbank-notification-service
        topic: openbank.notification.requests
        lagThreshold: "5"                            # desired lag per replica
        activationLagThreshold: "1"                  # >=1 message wakes from zero
        offsetResetPolicy: earliest
