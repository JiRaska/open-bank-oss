# Slack/Teams oversight webhook URL for notification-service (ADR-0059), projected
# from Vault by the External Secrets Operator (ClusterSecretStore `vault-kv`) into
# the in-namespace Secret `notification-webhook`. The webhook URL is the sensitive
# asset (anyone with it can post to the channel) — it lives ONLY in Vault, never in
# Git or the Deployment manifest; only this reference does.
#
# Until an operator writes the Vault key the ExternalSecret stays pending and the
# Secret is absent — which is fine: the Deployment's secretKeyRef is `optional:true`
# and the feature is off (SLACK_WEBHOOK_ENABLED=false), so the pod starts and the
# webhook is a no-op. To enable: write the Vault key, then flip SLACK_WEBHOOK_ENABLED.
#
#   vault kv put secret/notification-service SLACK_WEBHOOK_URL=https://hooks.slack.com/services/XXX/YYY/ZZZ
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-webhook
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: notification-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: notification-service
        property: SLACK_WEBHOOK_URL
