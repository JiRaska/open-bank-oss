# Strimzi mTLS identity + ACLs for onboarding-service (ADR-0137, #2665 Tier 2c).
#
# onboarding-service is a pure consumer of three domain-event topics:
#   openbank.party.events  — party lifecycle events (party created/updated/erased)
#   openbank.kyc.events    — KYC state machine events
#   openbank.sca.events    — SCA state machine events
#
# Identity model (ADR-0137): one KafkaUser per service = one client cert = one
# principal for ALL Kafka traffic. ACLs grant Read+Describe on each topic and
# Read on each consumer group (one group per topic channel). Resources without
# ACLs remain open under allow.everyone.if.no.acl.found=true (kafka.yaml).
#
# These live in `messaging` (where the Strimzi User Operator watches); the User
# Operator mints a per-user Secret of the same name there (user.crt/key/p12 +
# user.password + ca.crt). Those secrets are projected into the `onboarding`
# namespace by External Secrets below.
---
# ── KafkaUser: onboarding-service ─────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the onboarding Rollout rolls pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: onboarding-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # party events consumer
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # kyc events consumer
      - resource:
          type: topic
          name: openbank.kyc.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # sca events consumer
      - resource:
          type: topic
          name: openbank.sca.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # kyb events consumer (ADR-0284 D6 — the business funnel projection)
      - resource:
          type: topic
          name: openbank.kyb.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # consumer groups (one per channel, matching application.yaml group.id)
      - resource:
          type: group
          name: onboarding-service-party
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: onboarding-service-kyc
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: onboarding-service-sca
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: onboarding-service-kyb
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `kyc-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.onboarding.kyc-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `party-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.onboarding.party-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `sca-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.onboarding.sca-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `kyb-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.onboarding.kyb-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── ExternalSecret: onboarding-service keystore ───────────────────────────────
# Projects the Strimzi-minted keystore Secret from `messaging` into `onboarding`.
# `dataFrom.extract` copies every key verbatim (preserves binary PKCS#12).
# deletionPolicy: Retain so a transient store/RBAC blip never deletes a live cert.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: onboarding-service-kafka-keystore
  namespace: onboarding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: onboarding-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: onboarding-service
---
# ── ExternalSecret: cluster CA truststore ─────────────────────────────────────
# Shared cluster-CA truststore — same for every client; one projection per namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: onboarding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
