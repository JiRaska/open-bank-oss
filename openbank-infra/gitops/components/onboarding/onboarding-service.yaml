# onboarding-service: read-model projection of party+kyc+sca events for the
# operator onboarding cockpit (ADR-0068). Consumes three Kafka topics and
# exposes a REST read API; no writes to other services.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: onboarding-service
  namespace: onboarding
  labels:
    app.kubernetes.io/name: onboarding-service
    app.kubernetes.io/part-of: onboarding
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onboarding-service
  strategy:
    canary:
      stableService: onboarding-service
      canaryService: onboarding-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onboarding-service
        app.kubernetes.io/part-of: onboarding
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: onboarding-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-onboarding-service:sandbox-76b5ff01
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8130
            - name: management
              containerPort: 8085
          env:
            # Declared explicitly rather than left to the libs default (`true`), issue #2394.
            # onboarding-service contains no @Authorize annotation, so there is no OPA decision to
            # make and no `opa` sidecar in this pod. With the default, AuthorizeInterceptor would
            # be armed to fail closed against a PDP that does not exist — harmless while the
            # annotation count is zero, and an instant 503/422 on whichever endpoint gets the
            # first one. Authorization today is JWT roles (@RolesAllowed on OnboardingResource).
            # Flip this to true in the SAME change that adds @Authorize + the rego rules + the
            # sidecar (ADR-0034 Phase 5), never before.
            - name: AUTHZ_ENFORCE
              value: "false"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://onboarding-db-rw.onboarding.svc:5432/openbank_onboarding
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://onboarding-db-rw.onboarding.svc:5432/openbank_onboarding
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onboarding-db-app
                  key: password
            # Flyway checksum mismatch on V1 (2026-07-10): the 2026-06-27 repo-wide MPL->Apache-2.0
            # relicense (60e0263f, #2276) flipped the SPDX header on every migration file including
            # this one, changing V1's checksum. onboarding-service hadn't been redeployed since, so
            # the mismatch was latent until this Kafka group.id fix's rollout hit it. Repair-at-start
            # re-baselines the recorded checksum to the current (relicensed) file — safe because the
            # relicense was a comment-only change, no SQL executed differently. Remove this once the
            # live schema_history row is repaired (one successful boot is enough; safe to leave
            # briefly if unsure, repair is a no-op once checksums already match).
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as the KafkaUser
            # 'onboarding-service'; keystore/truststore PKCS#12 are projected from
            # messaging by External Secrets (kafka-onboarding-mtls.yaml)
            # and mounted below. The app reads these env vars via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onboarding-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8130"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onboarding-service-oidc
                  key: OIDC_CLIENT_SECRET
            # party-service in-cluster URL (issue #3931). This Deployment carried no override,
            # so AbandonedRegistrationCleaner's PartyServiceClient used application.yaml's
            # default `openbank-party-service:8090` — a hostname no Service in this cluster has
            # ever had, on the wrong port. Same shape as customer-edge / statement-service.
            - name: PARTY_SERVICE_URL
              value: http://party-service.party.svc:8111
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # issue #686: group.id / auto.offset.reset override (onboarding-service-msg-override
            # ConfigMap, mounted below) as an external Quarkus config source, since the dotted
            # YAML keys in application.yaml silently never register as the plain MicroProfile
            # Config property Quarkus reads (ADR-0137 pattern, see transaction-service).
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: onboarding-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: onboarding-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service
  namespace: onboarding
  labels:
    app.kubernetes.io/name: onboarding-service
    app.kubernetes.io/part-of: onboarding
spec:
  selector:
    app.kubernetes.io/name: onboarding-service
  ports:
    - name: http
      port: 8130
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service-canary
  namespace: onboarding
  labels:
    app.kubernetes.io/name: onboarding-service
    app.kubernetes.io/part-of: onboarding
spec:
  selector:
    app.kubernetes.io/name: onboarding-service
  ports:
    - name: http
      port: 8130
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
