# Fix for the dotted-key YAML config bug (issue #686, fleet sweep).
#
# Quarkus's YAML config source (quarkus-config-yaml / SmallRye YamlConfigSource#flattenYaml)
# unconditionally quotes any mp.messaging.incoming.<channel> YAML leaf key containing a
# literal dot when registering it as a MicroProfile Config property. A YAML key written as
# `group.id: foo` under `mp.messaging.incoming.<channel>:` in application.yaml registers ONLY
# as `mp.messaging.incoming.<channel>."group.id"` (literal quotes in the property name) —
# never as the plain `mp.messaging.incoming.<channel>.group.id` that
# KafkaConnectorIncomingConfiguration.getGroupId() (and the auto.offset.reset equivalent)
# actually reads. group.id then silently falls back to Quarkus's default
# (quarkus.application.name = openbank-onboarding-service), which the Strimzi KafkaUser ACL
# (kafka-onboarding-mtls.yaml) does NOT grant Read on for any of the three groups below —
# so every consumer poll on all three channels gets a silent GroupAuthorizationException.
#
# Why a properties FILE and not env vars: this mirrors the pre-existing pattern already used for
# transaction-service's payment-scheme-accepted channel
# (openbank-infra/gitops/components/payments/transaction-service-msg-override.yaml). A properties
# file carries the exact dotted/hyphenated property names unambiguously, avoiding any reliance on
# MicroProfile Config's env-var-name reverse-mapping for channel discovery.
#
# Correction (round 2): an earlier version of this comment first cited nonexistent issues
# #2649/#2659, then over-corrected to claim env vars are "independently verified to work" here —
# that overstated it too. The genuine concern is real: quarkusio/quarkus#30106 and
# smallrye/smallrye-reactive-messaging#2028 document a live, unresolved upstream bug where an
# env-var override of a single leaf property (e.g. `retries`, here `group.id`/`auto.offset.reset`)
# on a HYPHENATED channel name crashes Quarkus at startup (`SRMSG00071`, "connector attribute must
# be set for channel <wrong split>") — regardless of whether the channel is already registered
# via YAML/annotations. Boot tests added during this sweep inject the override via a
# QuarkusTestResourceLifecycleManager config map, not a real OS env var, so they don't exercise
# this failure mode. This properties-file mechanism is the CORRECT choice for the hyphenated
# `party-events-in`/`kyc-events-in`/`sca-events-in` channels, not merely a stylistic alternative.
#
# config_ordinal=500 forces this source to outrank the baked application.yaml (~254).
# Loaded via QUARKUS_CONFIG_LOCATIONS on the Rollout (onboarding-service.yaml). Same pattern
# as transaction-service's msg-override ConfigMap
# (openbank-infra/gitops/components/payments/transaction-service-msg-override.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: onboarding-service-msg-override
  namespace: onboarding
  labels:
    app.kubernetes.io/name: onboarding-service
    app.kubernetes.io/part-of: onboarding
data:
  # NOT here yet: kyb-events-in. This ConfigMap is applied by Argo BEFORE auto-deploy bumps the
  # image, so naming a channel here that the RUNNING image has no connector for is SRMSG00071 —
  # a hard boot failure, not a degraded consumer (`msg-channel-image-parity` enforces exactly
  # this ordering). Add the two kyb-events-in lines in a follow-up, once an image carrying the
  # channel is deployed. Until then the channel runs on the fallback group id
  # (quarkus.application.name), which the KafkaUser grants Read on for that reason.
  override.properties: |
    config_ordinal=500
    mp.messaging.incoming.party-events-in.group.id=onboarding-service-party
    mp.messaging.incoming.party-events-in.auto.offset.reset=earliest
    mp.messaging.incoming.kyc-events-in.group.id=onboarding-service-kyc
    mp.messaging.incoming.kyc-events-in.auto.offset.reset=earliest
    mp.messaging.incoming.sca-events-in.group.id=onboarding-service-sca
    mp.messaging.incoming.sca-events-in.auto.offset.reset=earliest
