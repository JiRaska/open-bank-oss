# tax-reporting-service's OWN Keycloak client `openbank-tax-reporting` (ROLE_API only), the
# identity its default `quarkus.oidc-client` uses for the pension reporting reads (#12425,
# ADR-0337). Deliberately NOT the shared `account-service` KV entry (rules.yaml:
# oidc_secret_convention covers the shared openbank-services secret projected as
# OIDC_CLIENT_SECRET; this is a per-service principal, the #10486 pattern treasury and finrep use).
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id`, `client_secret`). The
# entry is written ONCE by the owner's provisioning script when the client is created in the live
# realm (runbook 0009, render-script variable TAX_REPORTING_CLIENT_SECRET); nothing in this repo
# mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE this
# manifest syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: per-service M2M client secret, rotated with the realm client.
    openbank.io/rotation-deadline: "2027-10-10"
  name: tax-reporting-service-m2m-oidc
  namespace: tax-reporting
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: tax-reporting-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_TAX_REPORTING_CLIENT_SECRET
      remoteRef:
        key: keycloak/tax-reporting-service
        property: client_secret
