# GoAlert outbound webhook URL from OpenBao → goalert-webhook-url Secret
# (ADR-0088 on-call; ntfy/Slack notification channel). From the openbank/goalert
# KV path (property `url`, alongside data-encryption-key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goalert-webhook-url
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: goalert-webhook-url
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: url
      remoteRef:
        key: goalert
        property: url
    # NOT here: the dead-man `heartbeat_url` (kube-prometheus-stack.yaml route `deadman`).
    # It is an in-cluster address with no credential value, and the template below is
    # `mergePolicy: Merge`, so ESO leaves a key it does not own untouched. The key is
    # written once into this Secret by the ops step that creates the GoAlert heartbeat
    # monitor (#11666). Keeping it out of the ExternalSecret also means a missing Vault
    # property can never fail the sync of the paging `url` above.
