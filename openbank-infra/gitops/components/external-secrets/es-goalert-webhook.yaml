# GoAlert outbound webhook URL from OpenBao → goalert-webhook-url Secret
# (ADR-0088 on-call; ntfy/Slack notification channel). From the openbank/goalert
# KV path (property `url`, alongside data-encryption-key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goalert-webhook-url
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: goalert-webhook-url
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: url
      remoteRef:
        key: goalert
        property: url
    # NOT here, and not in this Secret at all: the dead-man heartbeat URL lives in
    # Secret `alertmanager-deadman` (kube-prometheus-stack.yaml route `deadman`). ESO owns
    # this Secret and rewrites its whole data on sync, so any key written from outside is
    # deleted again — measured 2026-10-01.
