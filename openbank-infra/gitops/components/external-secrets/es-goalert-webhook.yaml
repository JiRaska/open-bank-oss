# GoAlert outbound webhook URL from OpenBao → goalert-webhook-url Secret
# (ADR-0088 on-call; ntfy/Slack notification channel). From the openbank/goalert
# KV path (property `url`, alongside data-encryption-key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goalert-webhook-url
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: goalert-webhook-url
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: url
      remoteRef:
        key: goalert
        property: url
    # Dead-man heartbeat (kube-prometheus-stack.yaml route `deadman`). Create the
    # heartbeat monitor in GoAlert (service openbank-alerts -> Heartbeat Monitors,
    # timeout 5m), then `bao kv patch openbank/goalert heartbeat_url=<url>`.
    # Until the property exists ESO reports SecretSyncedError for this object
    # (ExternalSecretNotReady fires) while the already-synced `url` key stays in
    # the live Secret — loud, not silent, by design.
    - secretKey: heartbeat_url
      remoteRef:
        key: goalert
        property: heartbeat_url
