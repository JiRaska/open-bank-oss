# ClusterSecretStore — the single cluster-wide handle ESO uses to read the
# OpenBao KV v2 mount `openbank`. Auth is the Kubernetes auth method: ESO's own
# ServiceAccount token is presented to OpenBao, which maps it (role `eso`) to a
# read-only policy scoped to the `openbank/*` KV path. No static token anywhere.
# Configured out-of-band by runbook 0005 (bao auth enable kubernetes + the eso
# role/policy); this manifest only points ESO at it.
#
# Cut over from Vault -> OpenBao (runbook 0005, step 5). OpenBao is API-compatible
# so the `vault` provider speaks to it unchanged; only the server Service moved
# from vault.vault.svc to openbao.vault.svc (both in ns `vault`). Rollback =
# revert this one line; Vault stays running untouched through the soak window.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-kv
spec:
  provider:
    vault:
      server: http://openbao.vault.svc:8200
      path: openbank
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
