# HolmesGPT's LiteLLM virtual key from OpenBao -> holmes-llm-secrets Secret.
#
# HolmesGPT used to call NVIDIA NIM directly with the copilot-service NIM key, i.e. cluster state
# and alert context left the cluster OUTSIDE the single egress gateway (ADR-0174/0175): no budget,
# no Langfuse trace, and a provider key outside ai-platform. It now authenticates to the in-cluster
# LiteLLM with its own virtual key (alias `holmesgpt`, seeded by
# openbank-infra/scripts/seed-litellm-virtual-keys.sh), so its spend is attributed, capped per day
# and traced like every other caller.
#
# Seed BEFORE this syncs: an unseeded property leaves LITELLM_API_KEY absent and the new Holmes pod
# fails CreateContainerConfigError — loud and Degraded in ArgoCD, deliberately not `optional: true`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-llm-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: holmes-llm-secrets
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: KEY_HOLMESGPT
