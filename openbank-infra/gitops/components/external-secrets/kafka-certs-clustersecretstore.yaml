# ClusterSecretStore for Kafka mTLS cert projection (ADR-0137).
#
# Unlike `vault-kv` (reads OpenBao), this store reads Kubernetes Secrets in the
# `messaging` namespace — specifically the keystores the Strimzi User Operator
# mints for each KafkaUser and the public cluster-CA truststore. The payment
# services run in `payments`, so the ExternalSecrets there
# (components/payments/kafka-mtls-externalsecrets.yaml) use this store to pull
# the certs across the namespace boundary. Cert rotation by Strimzi is picked up
# automatically on the ExternalSecret refreshInterval (pods reload on restart).
#
# Auth: ESO mints a short-lived token (TokenRequest) for the eso-kafka-cert-reader
# ServiceAccount in `messaging`, whose Role grants `get` on exactly the six
# secrets we project (see components/payments/kafka-scheme-accepted-acl.yaml).
# The in-cluster API CA comes from the kube-root-ca.crt ConfigMap that every
# namespace publishes.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kafka-messaging-certs
spec:
  provider:
    kubernetes:
      remoteNamespace: messaging
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: messaging
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-kafka-cert-reader
          namespace: messaging
