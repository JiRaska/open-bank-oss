# account-service OIDC client secret, sourced from Vault. Targets the SAME
# Secret name/key the Deployment already reads (account-service-oidc /
# OIDC_CLIENT_SECRET) so no app change is needed. creationPolicy: Owner — ESO
# creates and owns the Secret and re-creates it if anything deletes it. The
# IgnoreExtraneous annotation stops ArgoCD's prune from removing this ESO-owned
# Secret (it is not tracked in git).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: account-service-oidc
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: account-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 1: account-service's OWN Keycloak client `openbank-account` (ROLE_API only), used ONLY by
# the money-path rest-clients that select the named oidc-client `m2m`. Deliberately NOT the
# shared `account-service` KV entry: that holds the shared `openbank-services` secret, and a
# per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: account-service-m2m-oidc
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: account-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/account-service
        property: client_secret
