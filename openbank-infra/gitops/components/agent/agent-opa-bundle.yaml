# Source: opa/policies/agents.rego + openbank-libs/governance/agents.yaml + opa/bundle.manifest
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-opa-bundle
  namespace: platform
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: platform
  annotations:
    openbank.tech/policy-checksum: "1af1c79ed839da6b"
data:
  agents.rego: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    #
    # Agent tool-call authorization (ADR-0031 D2). This is the policy enforcement point in front
    # of the MCP /tools/call endpoint: before dispatching a tool, the endpoint queries
    #   data.openbank.agents.allow
    # with input { agent, tool, resource, plane, attributes }. Deny is the default; an allow
    # requires a matching rule below.
    #
    # Charters are loaded from openbank-libs/governance/agents.yaml as data (data.agents.agents[...]);
    # money_path / review come from rules.yaml (data.rules.*). The decision LOGIC here is verified by
    # agents_test.rego; what remains for ADR-0031 D8 phase 1 is wiring those YAML bundles into the live
    # OPA sidecar (the bundle build), not the policy itself.

    package openbank.agents

    import rego.v1

    # ---------------------------------------------------------------------------------------
    # Default deny (ADR-0031: deny-by-default). Everything below must explicitly allow.
    # ---------------------------------------------------------------------------------------
    default allow := false

    # Look up the calling agent's charter (from agents.yaml, loaded as data.agents.agents).
    # input.agent is bare on the MCP path (openbank-agent-service sets it directly from its own
    # config, e.g. "ui-assistant" -- AgentChatService.ASSISTANT_IDENTITY), but rest.rego's REST
    # bridge sources it from the JWT `sub` via AuthorizeInterceptor.principal.id, which for an
    # AI_AGENT is prefixed "agent:" (AuthorizeInterceptor.principalType()'s own convention, e.g.
    # "agent:onboarding" per its test). trim_prefix is a no-op when the prefix isn't present, so
    # this normalises both callers to the bare charter id without needing two lookup rules.
    charter contains a if {
    	some a in data.agents.agents
    	a.id == trim_prefix(input.agent, "agent:")
    }

    # The hard-forbidden tier is forbidden for ALL agents, regardless of charter (agents.yaml: tool_tiers.deny).
    hard_denied if input.tool in data.agents.tool_tiers.deny

    # A tool is explicitly denied by the agent's own charter (supports glob like "money.*", "*.write").
    charter_denied if {
    	some pattern in allowed_or_denied_patterns.deny
    	glob_match(pattern, input.tool)
    }

    # Every tools.allow / tools.deny pattern across the agent's charter(s) -- factored out so
    # charter_allowed and rest_action_allowed don't each re-walk `some a in charter` themselves.
    #
    # SCHEMA NOTE: this only matches charters whose tools.allow/deny are a flat list of pattern
    # STRINGS (compliance-officer, ledger-domain-engineer, ui-assistant, rca-investigator,
    # customer-copilot). The standalone background/control-plane agents (finops-agent, devops-agent,
    # control-liveness-sentinel, governance-auditor, release-steward, docs-truth-agent,
    # authz-policy-auditor, flaky-test-hunter) instead declare tools.allow as a list of
    # `{tier, resources}` objects -- `some pattern in a.tools.allow` binds `pattern` to the whole
    # object for those charters, which glob_match can never match against a string tool name, so
    # charter_allowed is always false for them here. This is intentionally NOT a security gap
    # (default-deny fails closed, not open) -- it is simply inert: none of those services call the
    # MCP /tools/call endpoint this package gates at all (confirmed: no reference to it in any of
    # their source trees). Their real, live authorization is the standard `@RolesAllowed` REST
    # security on each service's own endpoints. Their `agents.yaml` charter today documents intent
    # for governance/audit purposes, not a runtime-enforced grant -- same as every charter's
    # `requires_human` block, which no code path reads either. Wiring the tier+resources shape into
    # a live decision here is future work if/when these services are ever fronted by the MCP gateway.
    allowed_or_denied_patterns := {
    	"allow": {pattern |
    		some a in charter
    		some pattern in a.tools.allow
    	},
    	"deny": {pattern |
    		some a in charter
    		some pattern in a.tools.deny
    	},
    }

    # A tool is explicitly allowed by the agent's charter allowlist.
    charter_allowed if {
    	some pattern in allowed_or_denied_patterns.allow
    	glob_match(pattern, input.tool)
    }

    # rest.rego's "agent-charter-allows" rule reuses this package for a REST call from an
    # AI_AGENT principal by setting input.tool := input.action -- the raw REST action string
    # an @Authorize-annotated endpoint declares (e.g. "ledger.list", "account.read"). Charters
    # declare tools.allow in the MCP tool-tier vocabulary instead (agents.yaml tool_tiers.read,
    # e.g. "query.ledger.readonly") -- a different string space. glob_match("query.ledger.readonly",
    # "ledger.list") never matches (they're unrelated strings, not even a prefix/suffix
    # relationship), so charter_allowed alone could never grant a REST read no matter how
    # clearly the charter's tools.allow / data_scope intended it -- the moment ANY service a
    # charter reads flips OPA to enforce mode, every AI_AGENT read against it 403s. IMPORTANT:
    # rest.rego MUST delegate to this package's `allow` (which also applies hard_denied /
    # charter_denied / skill_ok), never to charter_allowed directly -- charter_allowed alone
    # skips those checks.
    charter_allowed if rest_action_allowed

    # rest_domains mirrors openbank-agent-service's own McpToolRegistry.capabilities map -- the
    # single place that already decided which REST-action service scopes each `query.*.readonly`
    # MCP capability is meant to cover (e.g. query.ledger.readonly also backs the
    # account/transaction/balance read tools, not just ledger). Keep the two in sync: a new
    # query.<x>.readonly tool, or a domain added to an existing one, needs an entry here too, or
    # the fleet regains this exact gap. dispute + complaint reads are now @Authorize-gated
    # (dispute.read/.list, complaint.read/.list) so query.disputes.readonly is live; catalog and
    # aml still have no @Authorize-gated read endpoint yet -- their entries are forward-looking and
    # inert until that service adopts @Authorize on its reads (tracked in issue #401). Where a
    # service's only real @Authorize action today is a WRITE (e.g. aml-service's
    # amlCase.updateDecision), the verified write-action prefix is listed alongside the bare
    # service name, since a future read endpoint may reuse either convention and both are inert
    # until then anyway.
    rest_domains := {
    	"query.ledger.readonly": {"ledger", "account", "transaction", "balance"},
    	"query.gl.readonly": {"ledger", "gl"},
    	"query.catalog.readonly": {"catalog"},
    	"query.compliance.readonly": {"aml", "amlCase", "sanctions"},
    	"query.payments.readonly": {"fx", "clearing", "clearingBatch", "sepa-instant", "sctInstPayment"},
    	"query.interest.readonly": {"interest"},
    	"query.disputes.readonly": {"dispute", "complaint"},
    	"query.balance.readonly": {"balance"},
    	"query.transaction.readonly": {"transaction"},
    }

    # Scoped to read verbs only -- a `*.readonly` tool must never bridge into a write action,
    # however permissive matching the domain prefix alone would otherwise be.
    rest_read_verbs := {"list", "read", "search"}

    # A charter tool pattern authorizes a REST action iff the action's service-scope prefix is
    # in that tool's mapped rest_domains set AND the verb is read-only.
    rest_action_allowed if {
    	some pattern in allowed_or_denied_patterns.allow
    	some scope in rest_domains[pattern]
    	startswith(input.tool, sprintf("%s.", [scope]))
    	some verb in rest_read_verbs
    	endswith(input.tool, sprintf(".%s", [verb]))
    }

    # run.skill is further constrained to the agent's `skills` allowlist (development plane).
    skill_ok if {
    	input.tool != "run.skill"
    } else if {
    	some a in charter
    	input.attributes.skill in a.skills
    }

    # ---------------------------------------------------------------------------------------
    # The decision. Allow only when nothing forbids AND the charter permits AND skill is in scope.
    # ---------------------------------------------------------------------------------------
    allow if {
    	not hard_denied
    	not charter_denied
    	charter_allowed
    	skill_ok
    }

    # ---------------------------------------------------------------------------------------
    # Decision object the MCP endpoint records into AuditEvent.payload.policy_decision (ADR-0031 D5).
    # Always emitted so a DENY is auditable, not silent.
    # ---------------------------------------------------------------------------------------
    decision := {
    	"allow": allow,
    	"agent": input.agent,
    	"tool": input.tool,
    	"resource": input.resource,
    	"reason": reason,
    }

    reason := "hard-denied tool tier" if hard_denied

    else := "denied by charter" if charter_denied

    else := "skill not in agent allowlist" if not skill_ok

    else := "no matching allow rule" if not charter_allowed

    else := "allowed by charter"

    # ---------------------------------------------------------------------------------------
    # Helper: simple glob match supporting a single trailing/embedded "*" (e.g. "money.*", "*.write").
    # Replace with the OPA built-in `glob.match` when the bundle build is wired.
    # ---------------------------------------------------------------------------------------
    glob_match(pattern, value) if pattern == value
    glob_match(pattern, value) if glob.match(pattern, ["."], value)
  agents-data.yaml: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    #
    # OpenBank AI-agent charters — the single, machine-readable source of truth for what each
    # agent may see, call, and do, and where a human must decide (ADR-0031).
    #
    # Sibling of rules.yaml: this file is consumed by BOTH the OPA policy bundle (which gates the
    # MCP /tools/call endpoint, ADR-0018 + ADR-0031 D2) and the agent runtime. A charter is written
    # ONCE here and never duplicated as prose.
    #
    # Governing principle (ADR-0031): agents propose, governance disposes. An agent never holds more
    # privilege than a human -- it holds less. Default is DENY; an allow requires a matching rule.
    #
    # Status of enforcement mirrors rules.yaml: a charter can be `advisory` (audit-only) before it
    # `block`s, so phase 1 (ADR-0031 D8) runs deny-by-default + audit with no agent acting yet.

    schema_version: 1
    source_of_truth: true
    related_adrs: [ADR-0017, ADR-0018, ADR-0021, ADR-0027, ADR-0029, ADR-0030, ADR-0031, ADR-0073, ADR-0088, ADR-0089]
    consumes: openbank-libs/governance/rules.yaml   # money_path_services, review, vuln_management

    # ---------------------------------------------------------------------------------------
    # Global defaults applied to every agent unless its charter overrides them.
    # ---------------------------------------------------------------------------------------
    defaults:
      pii: masked                         # uses openbank-libs/security/PiiMasking; raw PII never in scope
      policy_decision: deny               # deny-by-default; OPA must find a matching allow rule
      enforced: block                     # ADR-0031 D8 gate flipped (#700/#638): declaration now matches
                                          # the deployed AGENT_POLICY_ENFORCEMENT=block (reconcile #743).
                                          # A PDP connectivity error still degrades to advisory (fail-safe).
      audit:
        actor_type: AI_AGENT              # every action -> AuditEvent (ADR-0031 D5)
        capture: [model_id, model_version, prompt_hash, tool_calls, policy_decision]
      limits:
        kill_switch: true                 # per-agent + global halt without redeploy (ADR-0031 D7)

    # ---------------------------------------------------------------------------------------
    # Kill switch state (ADR-0031 D7). Declarative baseline; the immediate runtime override is the
    # agent_kill_switch table flipped via /api/v1/admin/agents (KillSwitchService), which wins over
    # this. Per-agent halt = set `enabled: false` on that agent's charter below.
    # ---------------------------------------------------------------------------------------
    global_controls:
      kill_switch_enabled: true           # false halts EVERY agent (config baseline)

    # ---------------------------------------------------------------------------------------
    # Open runtime stack (ADR-0031 D6). No single-vendor agent SDK; all components in-cluster.
    #
    # ⚠ THIS BLOCK IS THE TARGET (ADR-0031 D6), NOT THE AS-BUILT. Read the `# as-built:` notes.
    #
    # This file is embedded VERBATIM into 34 OPA bundle ConfigMaps (rules.yaml: opa_bundle_sync), so
    # anything asserted here is replicated fleet-wide as machine-readable policy data. An unmarked
    # target therefore reads as a live control to anything consuming those bundles — which is exactly
    # how the model_gateway block below came to assert a data-residency routing rule that has never
    # run (issue #1280, ADR-0174 §2, ADR-0175 §4). Per-key as-built status, verified 2026-07-16
    # against gitops and the live sandbox:
    # ---------------------------------------------------------------------------------------
    runtime:
      orchestration: temporal           # as-built: LIVE. temporal namespace up; agents are Temporal workflows.
      reasoning:     langgraph          # as-built: NOT DEPLOYED. Activities are hand-written Kotlin; no langgraph.
      guardrails:    [llama-guard, prompt-injection-filter]   # as-built: PARTIAL. PromptInjectionGuard.kt is real
                                        # (copilot-service). llama-guard is NOT deployed — its only occurrences are
                                        # inside the OPA bundles' embedded copy of THIS file, which is not evidence.
      memory_rag:    pgvector           # as-built: NOT DEPLOYED. No pgvector, no embeddings, no RAG. The copilot's
                                        # HelpKnowledgeBase is deterministic keyword scoring, by explicit choice.
      observability: langfuse           # as-built: NOT DEPLOYED. OTel only.
      identity:      spiffe-spire       # as-built: PARTIAL. AgentSvidVerifier.kt is real, but no SPIRE deployment
                                        # exists; the live agent identity is OpenBao's pki-agent CA (ADR-0031 D3b).

    # Licensing note (ADR-0136, supersedes the ADR-0031 D8 separate-repo plan): the AI agent SERVICES are
    # AGPL-3.0-only + a parallel commercial licence, IN-REPO (not a separate repo); the rest of the platform is
    # Apache-2.0. rules.yaml carries the denylist carve-out + the AGPL/Apache build-dependency boundary. This
    # charter config itself stays Apache-2.0.

    # ---------------------------------------------------------------------------------------
    # Model strategy -- hybrid, model-agnostic via an open LLM gateway (ADR-0031 D6).
    # No lock-in: tools via MCP, policy via Rego, models via the gateway.
    #
    # ⚠⚠ NONE OF THE `model_gateway_target` BLOCK BELOW IS DEPLOYED. Read `model_gateway_as_built`
    # first — it is the one that describes the running system.
    #
    # Renamed from `model_gateway` to `model_gateway_target` deliberately (issue #1280): under the old
    # name this block was embedded into 34 OPA bundles as policy data asserting
    # `routing: {sensitive_data: self_hosted}` — i.e. the platform machine-claimed a GDPR Chapter V
    # data-residency control that has never existed. A false control claim is worse than an absent one:
    # an absent control gets found, an asserted one gets relied on. Any consumer reading the bundles
    # must now hit `_target` / `_as_built` and cannot mistake the intent for the state.
    # ---------------------------------------------------------------------------------------
    model_gateway_as_built:            # verified 2026-08-03 against gitops AND the running Deployments
      gateway: litellm                 # in-cluster LiteLLM proxy, ai-platform ns, :4000 (ADR-0174/0175,
                                       # #2019). Deployed and serving. It is the only workload holding a
                                       # provider key and the only one with an internet egress hole
                                       # (ai-platform/networkpolicy-litellm-egress.yaml), so it is a real
                                       # choke point — and with agent-service routed (#2209/#3300) and
                                       # egress-locked (#2210) it is a *complete* one.
      routed:                          # read off the RUNNING Deployments' env, not off the manifests
        - copilot-service              # COPILOT_MODEL_ENDPOINT (#2062) — the customer-facing assistant
        - agent-service                # AGENT_MODEL_ENDPOINT (#2209, direct GROQ path removed #3300) —
                                       # verified live 2026-08-03: the running Deployment (image
                                       # sandbox-b52f989b) resolves http://litellm.ai-platform.svc:4000/v1
        - control-liveness-sentinel    # LIVENESS_MODEL_ENDPOINT
        - devops-agent                 # DEVOPS_MODEL_ENDPOINT
        - docs-truth-agent             # LLM_GATEWAY_URL
        - finops-agent                 # LLM_GATEWAY_URL
        - flaky-test-hunter            # LLM_GATEWAY_URL
        - governance-auditor           # LLM_GATEWAY_URL
        - release-steward              # LLM_GATEWAY_URL
        - authz-policy-auditor         # LLM_GATEWAY_URL
      egress_enforced: full            # ai-platform is egress-locked (litellm is the only internet
                                       # hole); agent-service too: agent-service-egress-allow-list
                                       # (#2210) is live in the platform namespace and the pod no longer
                                       # carries a provider key (#3300), so the gateway cannot be
                                       # bypassed. Verified live 2026-08-03.
      budgets_enforced_at: charter     # CharterRateLimiter in openbank-agent-service — NOT the gateway.
      providers:                       # both terminate INSIDE the gateway pod; no agent holds either key
        deepinfra:                     # api.deepinfra.com, deepseek-ai/DeepSeek-V3.2. US-hosted, no region
                                       # pinning, no DPA. Serves copilot + the ops agents.
          hosted: true                 # prompt data LEAVES THE EU. Licensed for synthetic data only —
                                       # see ADR-0175 §4/§5. Routing it through the gateway centralises
                                       # the exposure; it does not remove it.
        groq:                          # api.groq.com, llama-3.3-70b-versatile. US-hosted, same posture.
                                       # Serves agent-service's admin-UI assistant (#2209).
          hosted: true                 # prompt data LEAVES THE EU. Same licence and same caveat.
      routing: none                    # still no sensitive_data routing: the gateway serves two hosted
                                       # models and no self-hosted tier exists. ADR-0175 D3 stays open —
                                       # a choke point is where routing COULD be enforced, not routing.
      fallback: none                   # no cross-provider failover is configured. On failure
                                       # LlmDiagnosisAdapter returns null and the agent degrades to a
                                       # deterministic path (ADR-0174 §4).

    model_gateway_target:              # ADR-0031 D6 — the decision. NOT the state. Nothing here is deployed.
      tool: litellm                       # or equivalent open gateway in front of all models
      budgets_enforced_at: gateway        # tokens/run + runs/day from each charter
      models:
        hosted:      { provider: anthropic, use: "general reasoning, high capability" }
        self_hosted: { runtime: vllm, use: "sensitive / air-gapped / data-residency", in_cluster: true }
      routing:
        sensitive_data: self_hosted       # PII / money-path context stays on in-cluster open-weight
        default: hosted

    # ---------------------------------------------------------------------------------------
    # MCP tool catalog tiers (ADR-0031 D2). The OPA gate maps a tool to its tier; the `deny`
    # tier is never registered for an agent identity.
    # ---------------------------------------------------------------------------------------
    tool_tiers:
      read:           # read-only, PII masked
        - query.ledger.readonly
        - query.gl.readonly           # GL aggregate reads (trial balance) — grantable independently of journal posting (#1966 / #299)
        - query.catalog.readonly
        - read.logs
        - read.governance      # rules.yaml / coverage / vuln SLAs
        - query.compliance.readonly   # AML cases + sanctions screenings (read-only)
        - query.payments.readonly     # FX rates, clearing batches, SEPA Instant payments (read-only)
        - query.interest.readonly     # interest accruals (read-only)
        - query.disputes.readonly     # disputes / chargebacks (read-only)
        - query.observability.readonly # Prometheus metrics / Loki logs / Alertmanager alerts (read-only)
        - query.balance.readonly      # the signed-in customer's own balance (customer-copilot, edge-enforced ownership)
        - query.transaction.readonly  # the signed-in customer's own transactions (customer-copilot, edge-enforced ownership)
        - query.account.readonly      # PSD2 consent-scoped account list (openbank-mcp-service, ADR-0181)
        - query.consent.readonly      # the PSD2 consents the acting agent holds (openbank-mcp-service, ADR-0181)
        - verify.mandate              # bank-side AP2 mandate verification (openbank-ap2-service, ADR-0193) — evidence only, moves no funds
      write_proposal: # produces a reviewable artifact, never a direct effect
        - draft.ticket
        - gh.pr.open
        - draft.adr
        - git.branch
        - git.commit.signed
        - run.skill            # constrained to the agent's `skills` allowlist
      deny:           # hard-forbidden for ALL agents -- not registrable
        - money.transfer
        - money.post.ledger
        - gh.pr.merge
        - gh.pr.approve
        - secrets.read.raw

    # ---------------------------------------------------------------------------------------
    # Agents. plane = control (oversight, proposal-only) | development (per-domain engineering)
    #                | customer (customer-facing assistant, ADR-0089 — its own SCA-gated regime).
    # Each charter answers: data_scope (what it reads), tools (what it calls), requires_human
    # (what must be approved), limits (budget/quota).
    # ---------------------------------------------------------------------------------------
    agents:

      - id: compliance-officer
        plane: control
        charter: "AML/sanctions/GDPR/PSD2 oversight of the running bank; produces proposals only."
        data_scope:
          read: [transaction, sanction-screening, consent, audit, aml, sanctions, dispute, clearing, sepa-instant]
          pii: masked
        tools:
          allow: [query.ledger.readonly, query.gl.readonly, query.catalog.readonly, read.logs, read.governance,
                  draft.ticket, query.compliance.readonly, query.payments.readonly, query.disputes.readonly,
                  query.observability.readonly,   # Prometheus/Loki/Alertmanager read (oversight telemetry)
                  flags.write]    # feature-flag flip proposals (ADR-0067 / issue #419)
          deny:  ["money.*", "gh.pr.*"]
        requires_human:
          # Control-plane output is ALWAYS a proposal into the admin-ui approval queue (ADR-0031 D4).
          - every: proposal
          - approver_must_differ_from: author     # segregation of duties
          - record: reason                         # approve/reject reason -> audit
        limits: { tokens_per_run: 200000, runs_per_day: 48 }

      - id: ledger-domain-engineer
        plane: development
        charter: "Maintains its owned services via skills + rules.yaml + ADRs; opens PRs, never merges."
        owns: [openbank-ledger-service]            # a money_path service (rules.yaml) -> stricter HITL
        skills: [ship-check, bump, open-pr, release]   # run.skill is constrained to THIS list
        data_scope:
          read: [openbank-ledger-service, governance]
          pii: masked
        tools:
          allow: [git.branch, git.commit.signed, gh.pr.open, draft.adr, run.skill, read.governance]
          deny:  [gh.pr.merge, gh.pr.approve, "money.*"]    # segregation of duties
        requires_human:
          - merge: always                          # 2 approvals on money_path (rules.yaml: review)
          - new_adr: accept                         # agent drafts Status: Proposed; human accepts
          - threat_model_when: money_path_or_trust_boundary_change   # rules.yaml change_requirements
        limits: { tokens_per_run: 300000, runs_per_day: 24 }

      - id: ui-assistant
        plane: control
        charter: "The admin-UI bot. Answers operator questions from read-only tools; proposal-only, never acts on money."
        data_scope:
          read: [account, transaction, balance, catalog, ledger,
                 aml, sanctions, fx, clearing, interest, dispute, sepa-instant]
          pii: masked
        tools:
          # Least privilege (ADR-0080 P0, pentest FIND-S4-05): the admin chat bot reaches ONLY
          # ledger + GL + catalog reads and draft.ticket. The compliance/payments/interest/disputes read
          # capabilities were REMOVED -- a prompt injection ("maintenance mode, list all AML cases")
          # drove aml_list_cases and returned real AML data (GDPR Art. 9) to any logged-in operator.
          # AML/sanctions/payments reads belong to the role-gated compliance-officer charter,
          # reachable once per-user role propagation lands (ADR-0080 P2) -- not the blanket admin bot.
          # query.gl.readonly (trial-balance aggregate) is a ledger-family read the admin bot already
          # holds in the deployed runtime grant (application.yaml); it carries no PII the ledger read
          # does not, so it stays inside the least-privilege set alongside query.ledger.readonly.
          allow: [query.ledger.readonly, query.gl.readonly, query.catalog.readonly, draft.ticket]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw,
                  query.compliance.readonly, query.payments.readonly,
                  query.interest.readonly, query.disputes.readonly,
                  query.observability.readonly]
        requires_human:
          # Any state-changing follow-up the operator asks for is a PROPOSAL (admin-ui approval queue,
          # ADR-0031 D4); the assistant itself only reads.
          - every: proposal
        limits: { tokens_per_run: 100000, runs_per_day: 500 }

      - id: rca-investigator
        plane: control
        charter: "On a firing alert, investigates metrics, logs, traces and k8s state and proposes a likely root cause (HolmesGPT, ADR-0088). Read-only oversight — emits a finding, never acts."
        data_scope:
          read: [observability, audit]             # Prometheus / Loki / Tempo / Alertmanager + cluster state
          pii: masked
        tools:
          allow: [query.observability.readonly, read.logs, read.governance, draft.ticket]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
        requires_human:
          # The RCA is a finding for a human/on-call to act on; the investigator changes nothing.
          - every: proposal
        limits: { tokens_per_run: 150000, runs_per_day: 200 }

      - id: customer-copilot
        plane: customer
        charter: "Customer-facing mobile assistant (ADR-0089). Reads the signed-in customer's OWN data; action tools emit PROPOSALS only — money never moves on the model's word. The app routes each proposal into the existing edge payment/card/dispute + SCA flow."
        data_scope:
          # The signed-in customer's own data, audience-scoped via an on-behalf-of token; ownership is
          # enforced at the customer edge. Never another customer's data.
          read: [balance, transaction]
          pii: own
        tools:
          # Customer-scoped reads + a CLOSED action whitelist that produces an ActionProposal only.
          # Execution is HITL + SCA with dynamic linking bound to amount+payee (ADR-0021/0073) in the
          # edge flow — this agent never calls money.* directly. (These propose.* tools live in this
          # charter, NOT in the operator MCP tool_tiers: copilot is a distinct ADR-0089 regime.)
          allow: [query.balance.readonly, query.transaction.readonly,
                  propose.payment, propose.card_freeze, propose.dispute]
          deny:  ["money.*", "gh.pr.*", secrets.read.raw]
        requires_human:
          - every: proposal                          # ActionProposal on the reply, never a direct effect
          - sca: dynamic_linking                     # HITL + SCA bound to amount+payee before any state change
          - scope: customer_own                      # audience-scoped on-behalf-of token (one customer)
        limits: { tokens_per_run: 80000, runs_per_day: 1000 }

      - id: mcp-anonymous
        plane: customer
        charter: "The first-party MCP server's acting identity (ADR-0181). Exposes a curated, PSD2-consent-scoped tool set — read the granted accounts/balances/transactions/consents, and PROPOSE a payment — to governed AI agents over the Model Context Protocol. Reads only; propose.payment is a reviewable artifact a human + SCA disposes, never a debit."
        # `mcp-anonymous` is the phase-1 FIXED principal id McpEndpoint.resolveContext() sets
        # (ctx.agentId = "agent:mcp-anonymous"); the shared ADR-0034 PDP classifies it AI_AGENT and
        # rest.rego's agent bridge trims the "agent:" prefix, so this charter's `id` must stay
        # `mcp-anonymous` or every tools/call defaults to deny. Phase 2 (ADR-0126) replaces this single
        # placeholder with a per-agent OAuth 2.1 → PSD2-consent identity; each real caller then gets its
        # own charter and this one is retired.
        data_scope:
          # The accounts/consents the presented PSD2 consent grants; ownership is enforced at the
          # consent edge, never widened by the model. PII masked (defaults).
          read: [account, balance, transaction, consent]
          pii: masked
        tools:
          # Exact MCP capability strings the ADR-0034 PDP evaluates as input.action (McpToolRegistry
          # .capabilities). Deny-by-default: only these five are grantable; propose.payment emits a
          # reviewable proposal only (customer-copilot's ADR-0089 regime), never a direct money move.
          allow: [query.account.readonly, query.balance.readonly, query.transaction.readonly,
                  query.consent.readonly, propose.payment]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
        requires_human:
          - every: proposal                          # propose.payment surfaces a proposal, never a debit
          - sca: dynamic_linking                     # HITL + SCA bound to amount+payee before any state change
          - scope: consent_granted                   # reads never exceed the presented PSD2 consent
        limits: { tokens_per_run: 80000, runs_per_day: 1000 }

      - id: ap2-anonymous
        plane: customer
        charter: "The bank-side AP2 mandate verifier's acting identity (ADR-0193). Verifies a presented AP2 (Agent Payments Protocol) signed mandate — its signature chain + constraints (payee, amount cap, currency, expiry) — as an authorization-evidence type. Verification only: it moves NO funds; a valid verdict is an input to the SCA/payment decision, never a payment."
        # `ap2-anonymous` is the phase-1 FIXED principal id Ap2VerifyEndpoint sets when the X-Agent-Id
        # header is absent (ANONYMOUS_AGENT = "agent:ap2-anonymous"); the shared ADR-0034 PDP classifies
        # it AI_AGENT and rest.rego's agent bridge trims the "agent:" prefix, so this charter's `id` must
        # stay `ap2-anonymous` or every /ap2/verify defaults to deny. Phase 2 replaces this placeholder
        # with a per-agent OAuth 2.1 identity; each real caller then gets its own charter.
        data_scope:
          # The verifier reads nothing from the banking domain — it evaluates a presented mandate against
          # a presented payment and returns a verdict + evidence. No domain read scope.
          read: []
          pii: masked
        tools:
          # The single MCP-style capability the ADR-0034 PDP evaluates as input.action
          # (Ap2VerifyEndpoint.VERIFY_CAPABILITY). Deny-by-default: only verify.mandate is grantable.
          allow: [verify.mandate]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
        requires_human:
          # The verifier itself never executes; when a future ADR wires the verdict into the payment
          # path, agent-initiated execution stays behind HITL + SCA dynamic-linking above a threshold.
          - sca: dynamic_linking
        limits: { tokens_per_run: 80000, runs_per_day: 1000 }

      - id: finops-agent
        plane: control
        charter: "ADR-0112"
        description: >
          Proactive AWS cost monitoring and optimization agent. Detects NAT egress spikes,
          cross-AZ traffic anomalies, Karpenter node churn, EBS attachment failures, and
          CI runner pool pressure. Proposes IaC fixes as GitHub PRs through HITL queue.
          Never writes to AWS directly.
        enabled: true
        enforcement: block
        schedule:
          daily: "03:00 UTC"
          reactive: goalert-webhook       # triggered by GoAlert on cost/infra anomaly alert
        data_scope:
          read:
            - aws-cost-explorer-readonly  # ce:GetCostAndUsage, ce:GetCostForecast only
            - cloudwatch-metrics-readonly # GetMetricData for NAT/VPC FlowLogs
            - prometheus-query-readonly   # container_network_*, karpenter_*, kube_events
            - kubernetes-events-readonly  # FailedAttachVolume, node lifecycle events
            - langfuse-readonly           # token usage, cost per model/agent
          pii: none                       # cost/infra metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [aws-cost-explorer, cloudwatch, prometheus, kubernetes-events, langfuse]
            - tier: write_proposal
              resources: [github-pr]      # opens IaC diff PRs only; no AWS write, no k8s write
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct infra writes ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_infrastructure_change     # HITL mandatory; EU AI Act Art. 9
          - cost_impact_gt_100_usd        # explicit approval for >$100 estimated monthly saving/cost
        limits:
          tokens_per_run: 50000           # cap: agent must not cost more than it saves
          runs_per_day: 4
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - anomalies_detected
            - estimated_cost_impact_usd
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency (all proposals logged)"
          dora: "continuous monitoring; operational resilience cost controls"

      - id: devops-agent
        plane: control
        charter: "ADR-0119"
        description: >
          Proactive SSDLC, CI/CD and DORA reliability agent — the delivery-pipeline twin of the
          finops-agent (ADR-0112). Watches build/lint health, the four DORA metrics (deployment
          frequency, lead time, change failure rate, time-to-restore), runner-pool capacity,
          deploy/rollout health, SSDLC hygiene and recurring incidents. Diagnoses the root cause
          and proposes a DURABLE fix (a code/IaC PR, a runbook update, a tracking ticket) through
          the HITL queue. Never merges, applies or executes anything.
        enabled: true
        enforcement: block
        schedule:
          daily: "04:00 UTC"
          reactive: goalert-webhook       # triggered by GoAlert on a CI / deploy / runner anomaly alert
        data_scope:
          read:
            - prometheus-query-readonly   # ARC runner metrics, Argo Rollouts alerts, 5xx CFR proxy, ALERTS
            - github-actions-readonly     # workflow run conclusions/durations (exporter is the follow-up)
            - kubernetes-events-readonly  # deploy / rollout lifecycle events
            - read.governance             # rules.yaml, ADRs, runbooks — grounding for the proposal
          pii: none                       # pipeline / infra metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [prometheus, github-actions, kubernetes-events, governance, runbooks]
            - tier: write_proposal
              resources: [github-pr]      # opens code/IaC/runbook diff PRs only; no write, no merge
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct repo / infra writes ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_pipeline_or_infra_change  # HITL mandatory; a human merges every proposal
          - every: proposal               # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 6
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - dora_metric_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "ICT change management (Art. 8–10); operational resilience via proactive pipeline monitoring"

      - id: control-liveness-sentinel
        plane: control
        charter: "ADR-0163"
        description: >
          Fleet-wide correlator for the ADR-0160 liveness/drift-detection mechanisms — watches
          WorkflowLivenessWatchdog heartbeat gauges, the event-consumer-liveness and lineage-vs-code
          CI gate reports, and reconciliation drift-SLA windows. Surfaces a stale-or-silent control
          as a finding before it pages, and proposes a durable fix (a code/IaC PR wiring an
          unmonitored job into the watchdog, or a tracking ticket) through the HITL queue. Never
          writes to a control directly.
        enabled: true
        enforcement: block
        schedule:
          daily: "03:00 UTC"
          reactive: goalert-webhook       # triggered when a WorkflowLivenessWatchdog gauge itself pages
        data_scope:
          read:
            - prometheus-query-readonly   # openbank_workflow_liveness_last_success_age_seconds gauges
            - read.governance             # rules.yaml advisory allowlists (mechanisms 1/2), ADR-0160
          pii: none                       # control-heartbeat / CI-gate metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [prometheus, governance]
            - tier: write_proposal
              resources: [github-pr]      # opens code/IaC diff PRs or draft.ticket only; no write
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any control ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_control_or_pipeline_change  # HITL mandatory; a human merges every proposal
          - every: proposal                 # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 6
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - control_mechanism_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 24 testing of ICT systems — fleet-wide correlator for ADR-0160's detection controls"

      - id: governance-auditor
        plane: control
        charter: "ADR-0164"
        description: >
          Post-hoc auditor of merged-PR governance compliance. For every PR merged to main, re-verifies
          via the GitHub API that rules.yaml's own review rules were actually followed: approval count
          vs. the money-path/default requirement, docs/threat-models/<service>.md presence for a
          money-path change, merge-commit GPG verification, a linked issue in the PR body, and
          (best-effort) an admin/override-flag bypass. Phase-4 expands its money-path reach to
          READ-ONLY governance/config/audit metadata only — never transaction payloads, never write
          or act tools. Proposes a compliance-incident ticket through the HITL queue for a human to
          triage — a violation on an already-merged PR is a human decision, not a diff. Never merges,
          approves or re-runs anything.
        enabled: true
        enforcement: block
        schedule:
          daily: "04:30 UTC"
          reactive: pr-merged-webhook     # triggered per PR merge to main — this agent's natural trigger,
                                          # unlike the alert-driven goalert-webhook its siblings use
        data_scope:
          read:
            - github-prs-readonly        # merged-PR metadata: reviews, merge-commit verification, body, labels
            - read.governance            # rules.yaml review + money_path_services — the compliance bar itself
            - money-path-config-metadata # rollout/config/policy metadata for services in rules.yaml: money_path_services
            - audit-metadata             # masked audit/governance evidence only; never raw transaction payloads
          pii: masked                    # masked metadata may carry identifiers; raw customer/payment payloads stay out of scope
        tools:
          allow:
            - tier: read
              resources: [github, governance, audit]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a mechanical fix PR
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any PR/review/merge ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_compliance_incident       # HITL mandatory; a human triages every finding
          - every: proposal                 # segregation of duties: agent proposes, human disposes
          - approver_must_differ_from: author     # segregation of duties
          - record: reason                         # approve/reject reason -> audit
        limits:
          tokens_per_run: 50000
          runs_per_day: 24                # one per merge is common; daily catch-up sweep is one more
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - governance_check_type_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 5 governance and organisation — re-verifies the repo's own change-control governance was followed"

      - id: release-steward
        plane: control
        charter: "ADR-0165"
        description: >
          Periodic guardian of the release-please / version-axis invariants. Checks
          release-please-config.json vs .release-please-manifest.json lockstep, admin-ui
          package.json vs version.txt sync, a fleet-wide scan for services that set
          quarkus.application.version explicitly (proactively, ahead of the reactive
          check-app-version-override.sh CI gate), and open-PR openapi.yaml:info.version
          collision detection across every open PR touching a spec. Proposes a triage ticket
          for judgment-call drift (manifest baseline, version-sync side, which racing PR
          re-bumps) and, for the one mechanically fixable case (an explicit
          quarkus.application.version key), a scaffold PR through the HITL queue. Never
          edits version.txt, merges a release-please PR, or writes to openapi.yaml directly.
        enabled: true
        enforcement: block
        schedule:
          daily: "05:00 UTC"
          reactive: release-please-merge-webhook   # triggered by every release-please PR merge —
                                                    # this agent's natural trigger, the moment
                                                    # incidents 1/2 have historically been introduced
        data_scope:
          read:
            - read.governance             # release-please-config.json, .release-please-manifest.json,
                                           # per-service application.yaml (repo-checkout reads)
            - github-prs-readonly         # open PRs touching any openapi.yaml, for the collision check
          pii: none                       # release/version metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [governance, github]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a mechanical fix PR
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to version.txt/openapi.yaml/manifest ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_release_or_version_drift  # HITL mandatory; a human picks the correct baseline/side
          - every: proposal                 # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 12                # daily sweep + one per release-please merge is common
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - release_invariant_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 24 testing of ICT systems — fleet-wide re-verification for the repo's own release-engineering invariants"

      - id: docs-truth-agent
        plane: control
        charter: "ADR-0166"
        description: >
          Periodic ADR-status-vs-code drift detector. On a weekly sweep plus reactively when any
          docs/adr/*.md file changes, greps every ADR's Delivery-Status: line against the code/
          service/class/config key it names: a Shipped/Complete ADR whose named artifact doesn't
          exist or isn't wired up, a Planned/Partial ADR whose fully-built implementation already
          exists unmentioned (the ADR-0139/ADR-0140 feature-store incident), and a mismatch between
          an ADR's or doc's "enforced" claim and rules.yaml's own gate-graduation enforced flag.
          Findings are almost always a tracking ticket — correcting an ADR's substantive content is
          a human judgment call — with a rare mechanical PR reserved for the one unambiguous case:
          flipping just the Delivery-Status: line, nothing else in the file. Never edits ADR
          decision content, merges a PR, or writes to rules.yaml.
        enabled: true
        enforcement: block
        schedule:
          weekly: "06:00 UTC"
          reactive: adr-merge-webhook       # triggered by any merged change under docs/adr/*.md
        data_scope:
          read:
            - read.governance             # docs/adr/*.md Delivery-Status lines, rules.yaml enforced flags,
                                           # and a grep-based existence check of the artifacts they name
          pii: none                       # ADR prose and repo file/grep metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a Delivery-Status-only fix PR
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any ADR's decision content or rules.yaml ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_adr_status_correction     # HITL mandatory; a human reads the ADR and the code to judge the correct status
          - every: proposal               # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 4                 # weekly sweep + occasional ADR-merge reactive runs
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - adr_status_drift_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection — fleet-wide re-verification that architectural decision records still match the code they describe"

      - id: authz-policy-auditor
        plane: control
        charter: "ADR-0167"
        description: >
          Static analyzer for the fleet's OPA/Rego authorization policies (rest.rego, agents.rego,
          copilot_tool.rego) and the agents.yaml charters that feed them. Cross-references every rule
          condition against AuthorizeInterceptor's actual emitted principal-type/id vocabulary: a rule
          gated on a classification value the interceptor never emits, an agent-id comparison missing
          the trim_prefix normalization the REST bridge path needs, an agents.yaml charter's
          tools.allow/deny drifting from the tool_tiers registry, and a REST rule bypassing
          agents.allow by calling charter_allowed directly. Proposes a tracking ticket through the
          HITL queue for every finding -- this agent never opens a fix PR, even for the fleet's usual
          "one narrow mechanical case," because a wrong auto-fix on an authorization rule is a live
          security exposure. Never writes to a .rego policy or agents.yaml directly.
        enabled: true
        enforcement: block
        schedule:
          weekly: "07:00 UTC"
          reactive: policy-source-changed-webhook   # triggered when any .rego policy or agents.yaml changes
        data_scope:
          read:
            - read.governance             # openbank-infra/opa/policies/*.rego, openbank-libs/governance/
                                           # policies/*.rego, agents.yaml, and AuthorizeInterceptor.kt via
                                           # a repo checkout
          pii: none                       # policy source text and rule metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket ONLY -- never a fix PR (ADR-0167 Decision)
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any .rego policy or agents.yaml ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_authz_policy_finding      # HITL mandatory; a human reads the rego/charter diff and the
                                           # code path it gates before anything changes
          - every: proposal                 # segregation of duties: agent proposes, human disposes
          - two_person_review: authz_policy_findings   # stricter than every sibling agent's single-
                                           # approval HITL gate (mirrors rules.yaml review.
                                           # money_path_approvals: 2): a wrong disposition of an
                                           # authz-policy finding is a live security exposure, not a
                                           # documentation/cost/release nit, so this charter asks for a
                                           # second reviewer before a finding is closed out
        limits:
          tokens_per_run: 50000
          runs_per_day: 8                 # weekly sweep + occasional policy-source-changed reactive runs
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - authz_check_type_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 5 ICT risk management framework — fleet-wide static verification that authorization-policy rules can actually fire as intended"

      - id: flaky-test-hunter
        plane: development
        charter: "ADR-0168"
        description: >
          Static analyzer for fleet-wide silent-test-failure patterns in Kotlin test sources.
          Generalizes the check-test-runblocking-unit.sh CI guard (expression-body test functions
          using runBlocking/runTest/GlobalScope.launch/GlobalScope.async without an explicit ': Unit'
          return type, which JUnit5 silently drops instead of running) beyond its one hardcoded
          builder, flags Pact provider verification tests gated on pactbroker.url (always skipped by
          a local './gradlew test' run) and any provider with two colliding @Provider test classes,
          and cross-checks declared-vs-executed @Test counts per module. Proposes a tracking ticket
          through the HITL queue for nearly every finding -- guessing wrong on a fix here (suspend fun
          vs ': Unit', which @Provider class should own an interaction) risks silently masking a real
          bug instead of fixing it. Never writes to a test file directly.
        enabled: true
        enforcement: block
        schedule:
          weekly: "08:00 UTC"
          reactive: ci-test-suite-failure-webhook   # triggered when a CI test-suite run reports a failure
        data_scope:
          read:
            - read.governance             # every module's src/test/kotlin tree, .github/scripts/*.sh CI
                                           # guard scripts, and build/test-results/test/*.xml JUnit
                                           # reports via a repo checkout
          pii: none                       # test source text and JUnit report metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket by default; gh.pr.open stays wired but is
                                           # rarely used (ADR-0168 Decision)
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any test file ever
            - tier: execute
              resources: ["*"]            # never invokes a build/test run itself
        requires_human:
          - any_flaky_test_finding        # HITL mandatory; a human reads the test's intent before a fix lands
          - every: proposal                 # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 8                 # weekly sweep + occasional CI-test-suite-failure reactive runs
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - flaky_test_check_type_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 5 ICT risk management framework — fleet-wide static verification that a test suite's reported green state reflects tests that actually ran"
  manifest.json: |
    {"roots": ["openbank/agents", "openbank/copilot", "openbank/rest", "agents", "rules"]}
