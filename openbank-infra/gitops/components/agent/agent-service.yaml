# agent-service: the admin-UI AI assistant backend (ADR-0031 D6). A provider-agnostic
# model gateway + MCP tool registry + policy gate. In the sandbox it runs the free
# OpenAI-compatible Groq backend (llama-3.3-70b-versatile) **through the in-cluster LiteLLM
# gateway** (ADR-0174/0175, #1919): it presents a virtual key synced from OpenBao by ESO
# (es-agent-service), and the provider key lives only in the ai-platform gateway pod, which is
# the one workload allowed to leave the cluster. It is stateless (no DB, no Kafka): it only reads
# the banking domain services over their in-cluster ClusterIPs via the MCP tools.
# OIDC is disabled — the assistant endpoints carry no @RolesAllowed and the only caller
# is the admin-ui BFF over the in-cluster network. The gate ENFORCES
# (AGENT_POLICY_ENFORCEMENT=block, ADR-0080 P0): an in-process charter allow-list denies
# non-charter capabilities locally. This Deployment ALSO runs an OPA sidecar serving the
# agents.rego bundle over localhost:8181 — the Phase-2 external PDP (ADR-0031 D2). Either
# way the gate fails *safe*: a PDP connectivity error degrades to advisory (audits, never
# hard-blocks) so a dead/missing sidecar can't lock the assistant out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: platform
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/part-of: platform
      annotations:
        # Roll the pod when the OPA policy bundle changes (subPath mounts don't hot-reload).
        # Must match agent-opa-bundle's openbank.tech/policy-checksum (CI verifies, no drift).
        openbank.tech/policy-checksum: "e05f4db0c00ea4b8"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-agent-service:sandbox-f7beb2d9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8109
            - name: management
              containerPort: 8085
          env:
            # OIDC points at the in-cluster Keycloak (same posture as the other banking
            # services). Drives BOTH the resource-server validation AND the outbound
            # oidc-client (client-credentials) the MCP tool clients use to authenticate.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # openbank-services client secret — lets the agent mint a client-credentials
            # token (ROLE_OPERATOR) so its read tools reach the banking services as a
            # least-privilege service principal. Projected by the same ExternalSecret as the
            # LiteLLM virtual key, but sourced from the agent-service OpenBao path.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: OIDC_CLIENT_SECRET
                  # Optional so a timing gap (key added after deploy) doesn't CrashLoop the
                  # pod; until the key is present the service token can't be minted and the
                  # read tools return 401 — no worse than before. Add the key + restart -> real data.
                  optional: true
            # ADR-0080 P0 (pentest FIND-S4-05): enforce the policy gate. With the in-process
            # charter allow-list, a capability outside the ui-assistant charter (e.g. AML reads)
            # is denied locally — block makes that DENY actually stop the call. Allowed tools whose
            # only PDP is the (not-yet-deployed) OPA sidecar still proceed: a PDP connectivity error
            # degrades to advisory, so block does not lock out the assistant.
            - name: AGENT_POLICY_ENFORCEMENT
              value: block
            # ADR-0031 D9 phase 2: the scheduled compliance-officer oversight sweep. Proposal-only
            # output into the HITL queue; charter-rate-limited to 48 runs/day (every 30 min).
            - name: AGENT_OVERSIGHT_ENABLED
              value: "true"
            # Free OpenAI-compatible backend (Groq), reached through the in-cluster LiteLLM gateway
            # (ADR-0174/0175, #1919) — NOT api.groq.com directly. litellm-config maps this exact
            # model id to `groq/llama-3.3-70b-versatile`, so the model name is unchanged and this is
            # an endpoint + key change only. The provider key now lives solely in the ai-platform
            # gateway pod, which is the one workload permitted to leave the cluster.
            # Default flipped off the free Groq tier. That tier enforces 12k tokens/min, and a
            # tool round is 2+ completions each carrying the prompt, the tool schemas and the
            # (capped) results — so a burst of clicks trips it and the assistant answers "I'm being
            # rate-limited", which reads to an operator as the feature being broken. gpt-oss-120b
            # is paid, measured at 2.9s on a real Czech admin prompt (vs 9.6s for DeepSeek-V4-Pro)
            # and ~35x cheaper per output token than that stronger sibling. Both are in the picker;
            # this only decides what a fresh session starts with.
            - name: AGENT_DEFAULT_MODEL
              value: openai/gpt-oss-120b
            - name: AGENT_MODEL_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            # LiteLLM virtual key (OpenBao litellm/KEY_AGENT_SERVICE via ESO), not a provider key.
            # Optional so an un-seeded key degrades the chat call instead of CrashLooping the pod.
            # Model-based content safety on the operator plane (ADR-0265). Same gateway, same
            # virtual key as the chat model — no second credential and no second egress path.
            - name: AGENT_CONTENT_SAFETY_ENABLED
              value: "true"
            - name: AGENT_CONTENT_SAFETY_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: AGENT_CONTENT_SAFETY_MODEL
              value: meta-llama/llama-guard-4-12b
            # fail-closed stays FALSE here, deliberately: refusing an operator's read-only question
            # because a classifier is unreachable is worse than answering it, and the charter tool
            # allow-list, the OPA gate and the HITL proposal queue still bound what any answer can
            # cause. Every unavailable verdict is audited and counted regardless, so this is a
            # declared posture rather than a silent one.
            - name: AGENT_CONTENT_SAFETY_FAIL_CLOSED
              value: "false"
            - name: AGENT_CONTENT_SAFETY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: AGENT_MODEL_API_KEY
                  optional: true
            - name: AGENT_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: AGENT_MODEL_API_KEY
                  optional: true
            # MCP tool backends — in-cluster ClusterIPs. get_account hits account-service
            # (accounts ns, live); balance via balance-service (balances ns, live).
            - name: QUARKUS_REST_CLIENT_ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: QUARKUS_REST_CLIENT_BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            - name: QUARKUS_REST_CLIENT_TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            # Two more deployed services (real data): product-catalog (public reads) + ledger.
            - name: QUARKUS_REST_CLIENT_PRODUCT_CATALOG_URL
              value: http://product-catalog.accounts.svc:8104
            - name: QUARKUS_REST_CLIENT_LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # Extended MCP read coverage (aml/sanctions/clearing/sepa-instant are deployed;
            # fx/interest/dispute are not yet — their tools register and degrade to an honest
            # "Tool execution failed" until the service is onboarded).
            - name: QUARKUS_REST_CLIENT_AML_SERVICE_URL
              value: http://aml-service.aml.svc:8117
            - name: QUARKUS_REST_CLIENT_SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            - name: QUARKUS_REST_CLIENT_CLEARING_SERVICE_URL
              value: http://clearing-service.payments.svc:8124
            - name: QUARKUS_REST_CLIENT_SEPA_INSTANT_SERVICE_URL
              value: http://sepa-instant.payments.svc:8127
            - name: QUARKUS_REST_CLIENT_FX_SERVICE_URL
              value: http://fx-service.fx.svc:8119
            - name: QUARKUS_REST_CLIENT_INTEREST_SERVICE_URL
              value: http://interest-service.interest.svc:8125
            - name: QUARKUS_REST_CLIENT_DISPUTE_SERVICE_URL
              value: http://dispute-service.dispute.svc:8135
            # Observability stack (anonymous in-cluster read) — query.observability.readonly tools.
            - name: QUARKUS_REST_CLIENT_PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.observability.svc:9090
            - name: QUARKUS_REST_CLIENT_LOKI_URL
              value: http://loki.observability.svc:3100
            - name: QUARKUS_REST_CLIENT_ALERTMANAGER_URL
              value: http://kube-prometheus-stack-alertmanager.observability.svc:9093
            # Proposals store (ADR-0031 D4): single-owner CNPG agent-db in this namespace.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://agent-db-rw.platform.svc:5432/openbank_agent
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: agent-db-app, key: username } }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: agent-db-app, key: password } }
            # Cross-replica PoP nonce replay guard (ADR-0031 D3b, issue #4728): RedisNonceStore,
            # bound only when agent.identity.svid.nonce-store=redis (build-time, set below in the
            # image build step). Named agent-redis (not the bare per-ns `redis`) because
            # `platform` is a shared namespace — see redis.yaml.
            - name: QUARKUS_REDIS_HOSTS
              value: redis://agent-redis.platform.svc:6379
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Policy decision point: the OPA sidecar in this pod (localhost:8181), serving
            # the agents.rego bundle (ADR-0031 D2). AGENT_POLICY_ENFORCEMENT=block is already
            # set above (ADR-0080 P0); the gate degrades to advisory if this PDP is unreachable.
            - name: QUARKUS_REST_CLIENT_OPA_URL
              value: http://localhost:8181
            # ADR-0031 D9 P2 (Refs #703): Kafka event trigger for compliance-officer sweep.
            # Wakes the oversight sweep immediately when AML/sanctions events arrive, in addition
            # to the 30-minute scheduler cadence. Topic managed by Strimzi topic operator.
            #
            # ADR-0137 (issue #686): mTLS listener :9093, not the plaintext :9092 listener.
            # Since the ADR-0137 fleet sweep (#2665) completed, the broker authorizer runs with
            # allow.everyone.if.no.acl.found=false cluster-wide, so User:ANONYMOUS on :9092 is
            # denied on every topic — the consumer would never authenticate on :9092 at all.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "openbank-cluster-kafka-bootstrap.messaging.svc:9093"
            - name: AGENT_OVERSIGHT_KAFKA_ENABLED
              value: "true"
            # mTLS client identity (KafkaUser `agent-service`, kafka-agent-mtls.yaml) — same
            # pattern as kyc-service / fraud-service. Keystore + cluster-CA truststore are
            # Strimzi-minted in `messaging` and projected into `platform` by the ExternalSecrets
            # in kafka-agent-mtls.yaml (this namespace's first ESO Kafka-cert projection).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # Issue #686: image-independent convergence of the oversight-events consumer's
            # group.id / auto.offset.reset (agent-service-msg-override ConfigMap, mounted
            # below) as an external Quarkus config source, so a lagging deployed image also
            # picks up the fix without waiting for a rebuild. Optional in spirit (see
            # transaction-service-msg-override.yaml precedent) — if the file were absent,
            # Quarkus just warns and continues on the baked application.yaml values.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            # ADR-0031 D3b: pki-agent CA cert (base64-encoded PEM) — used by AgentSvidVerifier
            # to validate per-run OpenBao-issued certs. Public root; safe in the manifest.
            # Rotate by re-running the openbao-agent-identity-sync CronJob and updating here.
            - name: AGENT_IDENTITY_SVID_CA_CERT
              value: ""
            # ADR-0031 D3b enforced: callers MUST present a valid pki-agent PoP cert.
            # No SVID → rejected; the D3a header binding remains a defense-in-depth backstop
            # only (CN cross-check added in feat(agent) 1.12.0). Flip to false to revert.
            - name: AGENT_IDENTITY_SVID_ENFORCED
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy decision point (ADR-0031 D2 / ADR-0034 pattern). Serves the
        # agents.rego bundle (agent-opa-bundle ConfigMap) over localhost:8181. The
        # agent-service policy gate queries data.openbank.agents.decision per tool call.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (was 127.0.0.1) so kubelet httpGet probes can reach
            # OPA's /health endpoint. OPA has no `health` CLI subcommand (the previous exec
            # probe `/opa health …` failed with "unknown command", so the sidecar never went
            # Ready and the whole agent pod was stuck — ADR-0080 P2 fix). The image is scratch
            # (no shell/wget) so an in-container exec HTTP check isn't possible either.
            # Reachability is fenced by the agent NetworkPolicy; OPA serves only policy
            # decisions (data.openbank.agents.decision), no secrets.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem: true.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: agent-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: agent-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: agent-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: platform
  labels:
    app.kubernetes.io/name: agent-service
spec:
  selector:
    app.kubernetes.io/name: agent-service
  ports:
    - name: http
      port: 8109
      targetPort: http
