# ADR-0177 Phase 1 (workload identity, docs/adr/0177-workload-identity-m2m-auth.md):
# the pod identity Keycloak's 'kubernetes' identity provider (realm template,
# components/keycloak/realm-template.json) trusts. agent-service presents the
# projected ServiceAccount token from /var/run/secrets/tokens/sa-token
# (audience 'keycloak', mounted in agent-service.yaml) to Keycloak and exchanges
# it for its own access token per RFC 8693, instead of presenting the static
# __AGENT_CLIENT_SECRET__. The oidc-client secret path stays as the fallback
# until Phase 2; nothing in the service reads the token file yet — this SA +
# projection is the pilot wiring.
#
# This is the first per-service SA for workload identity in the repo (no prior
# projected serviceAccountToken pattern existed); keep new pilot services
# consistent with this shape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbank-agent
  namespace: platform
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: platform
    openbank.io/adr: "0177"
