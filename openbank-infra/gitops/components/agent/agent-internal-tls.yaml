#
# Private-CA client certificate for agent-service's mTLS calls to aml-service (8443, client auth
# REQUIRED). Same shape as sepa-payment-internal-tls: tls.crt/tls.key identify the caller,
# ca.crt trusts aml-service's aml-service-internal-tls server certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agent-internal-tls
  namespace: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: agent-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  commonName: agent-service.platform.svc
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
