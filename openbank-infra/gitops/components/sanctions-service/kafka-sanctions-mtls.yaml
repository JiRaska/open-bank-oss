# Strimzi mTLS identity + ACLs for sanctions-service (ADR-0137 #2665 Tier 2c).
#
# sanctions-service publishes openbank.sanctions.screening.event (outbox egress)
# to signal screening results consumed by downstream services.
#
# Identity model (ADR-0137): one KafkaUser = one client cert = one mTLS
# principal for ALL Kafka traffic from this service. The KafkaUser ACLs list
# only the explicitly locked-down topics; everything else remains open under
# allow.everyone.if.no.acl.found=true (kafka.yaml).
#
# The KafkaUser secret is minted by the Strimzi User Operator in `messaging`,
# then projected into the `sanctions` namespace by the ExternalSecrets below.
---
# ── KafkaUser: sanctions-service ─────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: KafkaUser (wave -2) must land before ExternalSecrets (wave -1)
    # so the source secret exists when ESO tries to extract it.
    argocd.argoproj.io/sync-wave: "-2"
  name: sanctions-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Outbox egress: publish sanctions screening events
      - resource:
          type: topic
          name: openbank.sanctions.screening.event
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── ExternalSecret: sanctions-service keystore ───────────────────────────
# Projects the Strimzi-minted per-user keystore (user.p12 + user.password)
# from `messaging` into `sanctions`. dataFrom.extract copies every key verbatim
# (binary PKCS#12 byte-for-byte — per-key data mapping risks mangling binaries).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: ExternalSecrets (wave -1) after KafkaUser (wave -2).
    argocd.argoproj.io/sync-wave: "-1"
  name: sanctions-service-kafka-keystore
  namespace: sanctions
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: sanctions-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: sanctions-service
---
# ── ExternalSecret: cluster CA truststore ────────────────────────────────
# Projects the shared cluster-CA truststore (ca.p12 + ca.password) from
# `messaging` into `sanctions`. Same secret is shared across all namespaces;
# deletionPolicy: Retain guards against a transient store/RBAC blip deleting
# a live truststore out from under a running pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: ExternalSecrets (wave -1) after KafkaUser (wave -2).
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: sanctions
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
