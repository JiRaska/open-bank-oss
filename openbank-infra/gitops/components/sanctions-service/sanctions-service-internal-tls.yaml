#
# Private-CA server certificate for sanctions-service's parallel east-west TLS listener (8443,
# client auth REQUIRED). The plain HTTP listener (8123) remains for the existing callers until
# their independently reviewed migrations complete; new consumers use 8443.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sanctions-service-internal-tls
  namespace: sanctions
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: sanctions-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - sanctions-service.sanctions.svc
    - sanctions-service.sanctions.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
