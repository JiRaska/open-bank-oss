apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanctions-api
  namespace: sanctions
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.open-bank.tech
      secretName: sanctions-api-tls
  rules:
    - host: api.open-bank.tech
      http:
        paths:
          - path: /api/v1/sanctions
            pathType: Prefix
            backend:
              service:
                name: sanctions-service
                port:
                  name: http
