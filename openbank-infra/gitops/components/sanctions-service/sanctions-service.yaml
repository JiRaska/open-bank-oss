# sanctions-service: OFAC/EU/UN sanctions screening API. Reactive Postgres +
# Flyway migrations, Redis for Idempotency-Key dedup, outbox dispatcher publishes
# openbank.sanctions.screening.event to Kafka. OIDC bearer-token validation via
# Keycloak internal leg. Port 8123.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sanctions-service
  namespace: sanctions
  labels:
    app.kubernetes.io/name: sanctions-service
    app.kubernetes.io/part-of: sanctions
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sanctions-service
  strategy:
    canary:
      stableService: sanctions-service
      canaryService: sanctions-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanctions-service
        app.kubernetes.io/part-of: sanctions
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-sanctions-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "6ce0388960a432fa"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sanctions-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-sanctions-service:sandbox-90771f5e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://sanctions-db-rw.sanctions.svc:5432/openbank_sanctions
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://sanctions-db-rw.sanctions.svc:5432/openbank_sanctions
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: password
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: password
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.sanctions.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as KafkaUser 'sanctions-service';
            # keystore/truststore PKCS#12 are projected from messaging by External Secrets
            # (kafka-sanctions-mtls.yaml) and mounted below. The app reads these via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanctions-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sanctions-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: AUTHZ_ENFORCE
              value: "false"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
        # OPA policy-decision sidecar (ADR-0034, issue #938 follow-up bootstrap). Serves
        # data.openbank.rest.allow for all @Authorize-annotated endpoints in
        # sanctions-service (sanctions.*). Bundle mounted from sanctions-opa-bundle
        # ConfigMap (gen-sanctions-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: "/health?bundles=true"
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/sanctions_rest_ext.rego
              subPath: sanctions_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: sanctions-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: sanctions-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-service
  namespace: sanctions
  labels:
    app.kubernetes.io/name: sanctions-service
spec:
  selector:
    app.kubernetes.io/name: sanctions-service
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-service-canary
  namespace: sanctions
  labels:
    app.kubernetes.io/name: sanctions-service
spec:
  selector:
    app.kubernetes.io/name: sanctions-service
  ports:
    - name: http
      port: 8123
      targetPort: http
