# sanctions-service: OFAC/EU/UN sanctions screening API. Reactive Postgres +
# Flyway migrations, Redis for Idempotency-Key dedup, outbox dispatcher publishes
# openbank.sanctions.screening.event to Kafka. OIDC bearer-token validation via
# Keycloak internal leg. Port 8123.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sanctions-service
  namespace: sanctions
  labels:
    app.kubernetes.io/name: sanctions-service
    app.kubernetes.io/part-of: sanctions
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sanctions-service
  strategy:
    canary:
      stableService: sanctions-service
      canaryService: sanctions-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanctions-service
        app.kubernetes.io/part-of: sanctions
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sanctions-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-sanctions-service:sandbox-fcfd3f94
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://sanctions-db-rw.sanctions.svc:5432/openbank_sanctions
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://sanctions-db-rw.sanctions.svc:5432/openbank_sanctions
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: password
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanctions-db-app
                  key: password
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.sanctions.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as KafkaUser 'sanctions-service';
            # keystore/truststore PKCS#12 are projected from messaging by External Secrets
            # (kafka-sanctions-mtls.yaml) and mounted below. The app reads these via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanctions-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sanctions-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: AUTHZ_ENFORCE
              value: "false"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: sanctions-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-service
  namespace: sanctions
  labels:
    app.kubernetes.io/name: sanctions-service
spec:
  selector:
    app.kubernetes.io/name: sanctions-service
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-service-canary
  namespace: sanctions
  labels:
    app.kubernetes.io/name: sanctions-service
spec:
  selector:
    app.kubernetes.io/name: sanctions-service
  ports:
    - name: http
      port: 8123
      targetPort: http
