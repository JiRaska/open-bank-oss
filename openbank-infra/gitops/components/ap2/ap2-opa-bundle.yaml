                                                # money itself — money-path for the same reason consent/vop are. Threat
                                                # model: docs/threat-models/openbank-delegation-service.md. four-eyes assessed:
                                                # delegation.offer/revoke are self-service with SCA-bound ceremonies on both
                                                # ends. The bank-side suspend was justified here as landing "via the fraud
                                                # pipeline, not an operator console" — that is NOT true (#4403): fraud scoring
                                                # is shadow-only and drives no suspension, so this exemption rested on a
                                                # control that does not exist. The exemption still holds on the narrower and
                                                # true ground that no operator suspend endpoint has shipped, so there is no
                                                # maker/checker pair to gate yet. Revisit when the operator backoffice
                                                # surface ships, and do not re-derive it from the fraud pipeline.
      - openbank-fraud-service                # ADR-0084: v4 rule engine live; scoring is SHADOW-ONLY on every rail. The domestic-payment
                                               # enforcement gate (issue #667) was MERGED AND THEN DELETED by 189fe7b03 (PR #2122,
                                               # closing issue #1917) — this comment credited it as merely flag-gated until #4403.
                                               # No fraud verdict changes any payment outcome today: the four wired rails call
                                               # POST /fraud/score and log the result. See ADR-0084's 2026-08-09 correction block.
                                               # four-eyes assessed (issue #938 follow-up): the only REST surface today is a stateless
                                               # POST /fraud/score (fraud.score) — no operator case-decision, rule-config, or manual
                                               # override endpoint exists yet, so there is nothing real to maker-checker gate. Revisit
                                               # once a fraud case-management endpoint ships (clearing a flag / disabling a rule /
                                               # forcing a decision would need `clear`/`override`/`disable` verbs added here then).
      - openbank-billing-service              # ADR-0143: fee assess/post/reverse shipped (phases 1a-2e); real-env e2e verification + four-eyes enforcement flip still gate production go-live
      - openbank-settlement-service           # issue #307: debit->credit->ledger-booking saga (ADR-0101), orchestrated by a real
                                               # Temporal workflow (SettlementWorkflowImpl) — not a bespoke non-Temporal saga.
                                               # four-eyes assessed (issue #938 follow-up): the only REST surface is
                                               # POST /settlements (settlement.create), which starts the (self-healing, self-
                                               # compensating) saga; there is no manual retry/force-complete/compensate endpoint to
                                               # gate. Revisit if such an operator override endpoint is ever added.
      - openbank-sanctions-service             # ADR-0116: real feed screening; four-eyes wired (issue #938 follow-up) on
                                                # sanctions.clear (deciding a screening hit) — the highest-risk action in this
                                                # service, since a wrongly-cleared true positive is a real sanctions violation.
      - openbank-vop-service                   # ADR-0171: Verification of Payee (IPR Art. 5c) — sits on the pre-execution path of
                                                # every euro credit transfer. Money-path for the same reason sca/consent/fraud are:
                                                # it gates money movement without moving money itself.
                                                # four-eyes assessed: the only REST surface is POST /vop/verify (vop.verify), a
                                                # read-shaped check that mints nothing and decides nothing a human could collude on
                                                # — there is nothing to maker-checker gate. The action that WOULD deserve a gate is
                                                # a runtime change to `openbank.vop.max-edit-distance`: widening it silently turns
                                                # genuine mismatches into reassuring amber warnings (threat model §3 Tampering).
                                                # It is gitops-only config today, so it is covered by PR review rather than
                                                # four_eyes.verbs; add a `vop.flip` verb here if it ever becomes operator-tunable.
      - openbank-standing-order-service        # issue #2188: StandingOrderDueConsumer POSTs a real SCT to
                                                # sepa-payment `/api/v1/sepa-payments` for every due order (#889, merged) —
                                                # initiates money movement like sdd, not adjacent to it. Same class as sdd:
                                                # it shapes the instruction, the irreversible debit lives downstream in a
                                                # gated money-path service. Threat model:
                                                # docs/threat-models/openbank-standing-order-service.md.
                                                # four-eyes assessed: the only money-moving path is the scheduler-driven
                                                # consumer (no human in the loop by design); the REST surface is
                                                # customer/operator CRUD on orders (create/amend/pause/resume/cancel), whose
                                                # effect is a FUTURE scheduled debit, not an immediate one — pausing or
                                                # cancelling an order REDUCES money movement. There is no operator
                                                # force-execute endpoint to maker-checker gate; add a verb here if one is
                                                # ever added. Runs AUTHZ_ENFORCE=false (advisory) — joins the #3679 cohort.
      - openbank-psd2-service                  # issue #2188 sibling sweep: PaymentInitiationService (PIS) calls

    money_path_action_prefixes:
      sepa-payment: [sepaPayment]
      sepa-instant: [sctInstPayment]
      clearing: [clearingBatch]
      sca: [device, scaChallenge]

    four_eyes:
      verbs:
        - transfer                          # outbound value movement (sepa/domestic/swift/instant)
        - post                              # ledger journal posting
        - reverse                           # ledger reversal
        - freeze                            # account freeze/unfreeze
        - release                           # release a held payment
        - flip                              # money-path feature-flag flip (ADR-0067 / issue #419)
        - transitionStatus                  # sepa-payment / domestic-payment lifecycle transition (issue #395)
        - recall                            # sepa-instant: recall a SETTLED payment (issue #395)
        - settle                            # clearing: settle a clearing batch (issue #395)
        - disburse                          # lending: loan payout (issue #395)
        - send                              # swift: send an outbound wire message (issue #395)
        - credit                            # balance: direct ledger-balance credit adjustment (issue #395)
        - debit                             # balance: direct ledger-balance debit adjustment (issue #395)
        - collateralRegister                # lending: collateral registration/edit feeds IFRS 9 LGD (issue #621)
        - convert                           # fx: execute a currency conversion at the current spot rate (issue #938 follow-up).
                                             # Confirmed no M2M caller (fx-service's own rego: "fx.convert... has NO in-repo M2M
                                             # caller today and stays human-only") — see the guardrail note below before adding
                                             # any further verb here.
        - grant                             # consent: create a new TPP<->customer data-access consent (renamed from consent.create,
                                             # issue #938 follow-up). Confirmed no M2M caller (consent-service's own rego: "consent.grant
                                             # and consent.revoke are NOT granted to M2M clients").
        - revoke                            # consent: operator-initiated revocation of a customer's active consent. Confirmed no M2M caller
                                             # (same rego note as consent.grant above).
        - sweep                             # transaction: move a duplicate party's balance to the surviving party during an
                                             # identity merge (ADR-0179). Confirmed no M2M caller — POST /transactions/merge-sweep
                                             # is a NEW endpoint introduced with this verb, admits only ROLE_OPERATOR/ROLE_ADMIN
                                             # (no ROLE_SERVICE), and has no in-repo caller other than a human operator console.
                                             # It exists as its own action precisely so the verb can be gated here: the equivalent
                                             # movement through transaction.create could NOT be, since `create` is on the M2M
                                             # payment rails — the distinct-operator-only-action pattern this guardrail prescribes.
        - clear                             # sanctions: decide a screening hit (CLEAR/HIT/POTENTIAL_HIT) — a wrongly-cleared true positive
                                             # is a real sanctions violation; distinct from `release` (payment-hold release) for clean audit
                                             # separation. Confirmed no M2M caller (@RolesAllowed on POST /sanctions/review admits only
                                             # ROLE_OPERATOR/ROLE_ADMIN, no ROLE_SERVICE).
        # GUARDRAIL (issue #938 follow-up — found while wiring sca-service): four_eyes_required is
        # computed by ACTION NAME ALONE (rest.rego money_path_scopes + endswith verb match), with NO
        # awareness of the caller's identity. A verb is only safe to add here if EVERY real-world
        # caller of that action across the WHOLE fleet is a human operator/admin session — if even one
        # legitimate M2M/automated caller exists, four-eyes enforcement (once ever flipped on for that
        # service) pauses that automated flow too, indistinguishably from the risky human path it was
        # meant to gate. sca-service's device.enroll and scaChallenge.consume were both assessed and
        # REJECTED for this reason: both are granted to customer-edge's M2M identity in base rest.rego
        # (edge-service-notification's device.* family, sca's own service-sca-edge-m2m rule) for
        # ordinary customer self-service device enrollment and — critically — scaChallenge.consume is
        # the payment settlement gate every real payment passes through. Gating either would silently
        # brick production automation the moment enforcement is ever turned on, not just close the
        # risky operator-console gap. Before adding a new verb: grep every service's own
        # gen-<service>-opa-bundle.sh for an M2M/SERVICE-identity rule granting that action; if one
        # exists (or plausibly could — consent.activate was ALSO excluded for this reason, no confirmed
        # caller found but the rego already reserves the grant), the risky path needs its own distinct
        # action (e.g. a dedicated operator-only "enrollOnBehalf" endpoint) before it can be four-eyes
        # gated safely — do not reuse the shared customer/M2M-facing action.
      #
      # actions: exact action names, gated independently of money_path_scopes (ADR-0176 D5).
      # `verbs` above only ever fires for an action whose SCOPE derives from money_path_services —
      # notification-service is not, and never will be, on that list (D5's own reasoning), so no verb
      # addition could reach opsmessage.compose. This generalises the featureflag.flip precedent two
      # blocks down (an exact action name, independent of money-path scope, already shipped with
      # ADR-0067) into a reusable list instead of a one-off inline clause. Read disjunctively with
      # `verbs` in rest.rego's four_eyes_required — a service can be gated by either mechanism, never
      # both computing the same answer twice.
      #
      # The GUARDRAIL above applies here too, unchanged: opsmessage.compose is its own action
      # namespace specifically so this list-membership can never accidentally cover an M2M-reachable
      # action — rest.rego's edge-service-notification rule grants notification.* to customer-edge's
      # M2M identity via a prefix match, and opsmessage.* was kept out of that family for exactly this
      # reason (ADR-0176 D4).
      actions:
        - catalog.publish                  # ADR-0257: human checker publishes immutable commercial terms;
                                             # core also enforces maker != checker for standalone installs.
        - opsmessage.compose                # ADR-0176 D5: operator-initiated customer messaging.
                                             # Confirmed no M2M caller — the only allow rule for this
                                             # action requires HUMAN + (ROLE_OPERATOR or ROLE_ADMIN) and
                                             # explicitly excludes any service-account-* principal id
                                             # (rest.rego operator-compose-message), the same exclusion
        - campaign.activate                 # ADR-0200 D5: marketing campaign activation reaches a cohort,
                                             # so its blast radius exceeds a single operator message —
                                             # four-eyes with the self-approval guard, human-only
                                             # (maker != checker), same mechanism as opsmessage.compose.
                                             # m2m-sanctions-screening uses for the opposite carve-out.
        - party.merge                       # ADR-0179: retire a duplicate identity into a survivor
                                             # (POST /api/v1/parties/{id}/merge). Gated HERE and not via
                                             # `verbs` for the same structural reason opsmessage.compose
                                             # is: party-service is not, and should not become, a
                                             # money_path_services entry (it moves no value), so the
                                             # verb clause can never derive a `party` scope and no verb
                                             # addition could ever reach this action.
                                             # Why it needs the gate at all: a merge is destructive OF
                                             # IDENTITY and irreversible in practice — one operator can
                                             # retire a real customer behind another party id, and every
                                             # downstream consumer follows `merged_into`. It carried only
                                             # @RolesAllowed(ROLE_OPERATOR, ROLE_ADMIN) + an audit event,
                                             # which records who did it but stops nobody.
                                             # GUARDRAIL check (the one above, applied): confirmed no M2M
                                             # caller. party-service's own rego states party.merge "has NO
                                             # in-repo M2M caller today"; the edge M2M identity is granted
                                             # only {party.consent.update, party:resolve} by the rule that
                                             # names it (service-edge-party-m2m), and the ADR-0179 sweep
                                             # counterpart transaction.merge-sweep is already gated by the
                                             # `sweep` verb — so both halves of the merge flow now pause
                                             # for a second approver, or neither does.
        - sdd.approve                       # #8359: confirm a B2B direct-debit mandate
                                             # (POST /api/v1/sdd/mandates/{id}/confirm) — the SDD B2B control
                                             # point: a wrongly-confirmed mandate authorises every future
                                             # collection against the debtor. Exact action, not the `approve`
                                             # verb: the verb would ALSO flag lending.approve (already
                                             # maker-checker in-app — an OPA second-approver pause on top
                                             # would stall the designed checker flow the day enforcement
                                             # flips) and pull non-money-path dispatch.approve into the
                                             # four-eyes-verb-grantable gate. GUARDRAIL check: human-only —
                                             # the edge rule (edge-service-sdd) deliberately excludes
                                             # sdd.approve ("a bank-side verification act, the edge exposes
                                             # no route for it"), operator-sdd-write excludes every
                                             # service-account-* principal, and the role_action_matrix
                                             # grants no sdd write at all. The money-moving sdd.authorise
                                             # is deliberately NOT gated — see the money_path_services
                                             # entry for the reasoning.
        - interest.create                   # #8359: bundles every operator write on the interest money
                                             # path — manual accrue, capitalize (posts real GL journals),
                                             # rate-config create (a mis-set rate moves money at scale on
                                             # every future accrual — the runtime analogue of vop's
                                             # max-edit-distance), and withholding remittance assemble
                                             # (triggers the real cash leg to the finanční úřad via the
                                             # settlement consumer). GUARDRAIL check: human-only, twice
                                             # over — operator-interest-write excludes service-account-*
                                             # and the interest_rest_ext prohibition vetoes the write set
                                             # for ANY service account at the allow head; fleet audit found
                                             # no M2M writer (agent-service's InterestServiceClient is
                                             # read-only). The accrual/capitalization SCHEDULERS call the
                                             # use cases in-process — they never pass the HTTP PEP, so this
                                             # gate cannot pause them.
        - interest.trigger                  # #8359: accrueAll (POST /api/v1/interest/accrue/all) — manual
                                             # mass accrual posting GL journals en masse. Same human-only
                                             # caller set as interest.create above (same allow rule, same
                                             # prohibition). The daily accrual scheduler is in-process and
                                             # unaffected.
        - device.enroll                     # #8360 / ADR-0280: enrol a device credential. Gated for every
                                             # caller EXCEPT the exemptions below — the risky path is the
                                             # human ops-console enroll-on-behalf (operator-sca-write), not
                                             # the customer self-service the edge M2M drives.
        - scaChallenge.consume              # #8360 / ADR-0280: spend an approved challenge (the ADR-0021
                                             # settlement gate). Gated for every caller except the exempt
                                             # automation identities below — a lone operator must not be
                                             # able to consume a challenge outside a real ceremony.
                                             # Exact actions, not verbs: `enroll`/`consume` happen to be
                                             # fleet-unique today, but a verb suffix would silently trap
                                             # any FUTURE money-path `*.consume` automation action.
      #
      # exemptions (ADR-0280): per-action list of principal ids for which four_eyes_required does NOT
      # fire — the verified M2M automation callers that must keep flowing when the action is gated.
      # rest.rego evaluates this map in every four-eyes clause; an action with no entry (or a bundle
      # whose rules.yaml predates the key) has no exemptions. Admission bar, checked at review: the id
      # must be a `service-account-*` identity with an in-repo identity-scoped allow rule for exactly
      # this action (the sca_rest_ext.rego pattern), never a role, never a human principal, and never
      # the shared backend client for an action only SOME of its users automate — the shared client's
      # exemption below covers consume because BOTH its callers (delegation grant-accept,
      # document-signing) are ceremonies, and no human path rides that identity.
      exemptions:
        device.enroll: [service-account-openbank-edge]                 # customer self-service enrollment
        scaChallenge.consume:                                          # ADR-0021 settlement gate + ceremonies
          - service-account-openbank-edge                              # scaGate before every money-path forward
          - service-account-openbank-services                          # delegation grant-accept, document-signing (#3734)

    feature_flags:
      # Disabling any of these via a flag flip is never permitted — they guard SCA (ADR-0021),
      # sanctions/AML screening (ADR-0032) and the fail-closed payment gate.
      prohibited_flag_combinations:
        - sca-enforcement-disabled
        - sanctions-screening-disabled
        - aml-screening-disabled
        - payment-gate-fail-open
      # Money-path flags whose flip needs four-eyes even when not outright prohibited.
      money_path_flags:
        - instant-payments-enabled
        - fx-revaluation-enabled
        - lending-disbursement-enabled

    authz:
      role_action_matrix:
        ROLE_OPERATOR:
          grant:
            - account.list
            - account.read
            - anacredit.list
            - anacredit.read
            - audit.read
            - card.list
            - card.read
            - device.list
            - dispatch.read
            - fx.list
            - fx.read
            - interest.list
            - interest.read
            - ledger.list
            - ledger.read
            - lending.list
            - lending.read
            - notification.list
            - notification.read
            # ADR-0224 D3 (E2E #2750): the staff OBO channel's MCP read tools — the capabilities
            # McpToolRegistry maps list_accounts/get_balance/list_transactions/list_consents to.
            # Without these the human tools/list fails closed to empty (query.marketing.readonly and
            # the propose.payment write stay ungranted on purpose).
            - query.account.readonly
            - query.balance.readonly
            - query.consent.readonly
            - query.transaction.readonly
            - sanctions.list
            - sanctions.read
            - sdd.list
            - sdd.read
            - statement.list
            - statement.read
            - swift.list
            - swift.read
            - transaction.list
            - transaction.read
          # ── write grants (phase 1.5, operator-<domain>-write + opsmessage pair) ──
            - account.approval.decide
            - account.authorize
            - account.close
            - account.create
            - account.freeze
            - account.search
            - account.unfreeze
            - account.update
            - balance.approval.decide
            - balance.credit
            - balance.debit
            - balance.hold
            - balance.holdRelease
            - balance.initialize
            - balance.reconciliation.run
            - billing.approval.decide
            - billing.post
            - billing.reverse
            - clearingBatch.approval.decide
            - clearingBatch.reconcile
            - clearingBatch.settle
            - clearingBatch.submit
            - clearingBatch.triggerCycle
            - fraud.score
            - fx.convert
            - identity.case.decide
            - identity.case.reopen
            - identity.eudi.issue
            - identity.eudi.poll
            - identity.eudi.request
            - identity.eudi.revoke
            - identity.eudi.verify
            - identity.link
            - identity.register
            - identity.resolve
            - interest.create
            - interest.delete
            - interest.trigger
            - ledger.create
            - ledger.replay
            - ledger.reverse
            - ledger.trigger
            - kyb.case.list                    # ADR-0284: business onboarding review queue
            - kyb.case.read
            - kyb.case.reject
            - kyb.case.review.resolve
            - kyb.lookup
            - lending.approve
            - lending.collateralDecide
            - lending.collateralRegister
            - lending.create
            - lending.disburse
            - lending.repay
            - lending.reschedule
            - lending.writeoff
            - party.approval.decide
            - party.consent.update
            - party.mandate.grant              # ADR-0284 D3: bind a representative to a legal-entity party
            - party.mandate.read
            - party.mandate.revoke
            - party.merge
            - party.update
            - sanctions.approval.decide
            - sanctions.clear
            - sanctions.create
            - sanctions.trigger
            - sanctions.update
            - sctInstPayment.approval.decide
            - sctInstPayment.create
            - sepaPayment.approval.decide
            - sepaPayment.create
            - sepaPayment.handleReturn
            - sepaPayment.transitionStatus
            - settlement.create
            - swift.approval.decide
            - transaction.create
            - transaction.reverse
            - opsmessage.compose
            - opsmessage.approval.decide
        ROLE_ADMIN:
          # One-line diff benefit: ADMIN = OPERATOR's full matrix (single level of inheritance,
          # see rest.rego matrix_grants) — no duplicated grant list to drift apart.
          inherits: ROLE_OPERATOR
          grant: []
        ROLE_COMPLIANCE:
          grant:
            - account.read
            - anacredit.read
            - audit.read
            - card.read
            - dispatch.read
            - fx.read
            - interest.read
            - ledger.read
            - lending.read
            - notification.read
            - sanctions.read
            - sdd.read
            - statement.read
            - swift.read
            - transaction.read
        # ── ADR-0223 phase 1.5: write grants (derived from the same coverage inventory) ──────────
        # operator-<domain>-write ext rules grant OPERATOR+ADMIN; desk rules grant their own roles.
        # All entries remain a strict subset of today's effective grants (shadow matrix-allows is
        # additive, so this changes no decision — it only moves the decision_reason mix toward the
        # matrix, which is what the D2(b) operator-read-any retirement triage consumes).
        ROLE_PAYMENTS:
          grant:
            # Payment desks' ext rules list ROLE_PAYMENTS alongside OPERATOR/ADMIN
            # (domestic-payment, sepa-payment, sepa-instant, clearing — gen-*-opa-bundle.sh heredocs)
            - sctInstPayment.create
            - sepaPayment.create
            - sepaPayment.handleReturn
            - sepaPayment.transitionStatus
            - clearingBatch.submit
            - clearingBatch.reconcile
            - clearingBatch.settle
        ROLE_KYC_OPENER:
          grant:
            - kycCase.updateCheck
            - kycCase.pepRescreen
        ROLE_KYC_REVIEWER:
          grant:
            - kyc.case.approve
            - kyc.case.reject
            - kyb.case.list                    # ADR-0284: the KYB review queue is the KYC reviewer's queue
            - kyb.case.read
            - kyb.case.reject
            - kyb.case.review.resolve
        ROLE_AUDITOR:
          grant:
            - audit.read
            - audit.verify
        ROLE_SUPERVISOR:
          grant:
            - balance.overdraftLimit
        ROLE_LENDING_OFFICER:
          grant:
            - lending.create
            - lending.read
            - lending.list
            - lending.repay
            - lending.disburse
            - lending.collateralRegister
            - lending.approval.read
        ROLE_CREDIT_RISK:
          grant:
            - lending.create
            - lending.read
            - lending.list
            - lending.repay
            - lending.approve
            - lending.writeoff
            - lending.collateralRegister
            - lending.collateralDecide
            - lending.approval.read
            - lending.approval.decide

    shared_m2m_write_prohibition:
      # GHSA-58jq-9hq3-66jr. rest.rego denies the shared M2M identity
      # (`service-account-openbank-services`, which carries ROLE_OPERATOR in the realm) when the
      # ONLY reasons admitting it are the role-only write reasons listed here.
      #
      # OPT-IN, and the reason a name pattern was rejected: matching every `operator-*-write`
      # would have 403'd transaction.create from six live callers (account-service's
      # welcome-bonus credit, sepa-instant, domestic-payment, swift, interest, sdd) and
      # settlement.create — both AUTHZ_ENFORCE=true money paths whose services have no
      # identity-scoped rule to fall back on. transaction-service's rego states the exposure
      # itself ("RESIDUAL RISK — shared identity, no per-caller narrowing"), which is precisely
      # why removing its only path is not the fix.
      #
      # A reason joins this list once its service carries a rule that NAMES the caller and
      # enumerates its actions, so denying the role-only path removes an over-grant rather than
      # the only path. Each entry below was verified to have such a rule.
      reasons:
        - operator-consent-write        # service-consent-m2m + service-consent-m2m-marketing
        - operator-ledger-write         # service-ledger-post / service-ledger-reverse
        - operator-balance-write        # service-balance-m2m
        - operator-fraud-write          # service-fraud-scoring
        # SAFE TODAY ONLY BY CO-ADMISSION, not by the rule named here: that rule covers
        # sepaPayment.handleReturn alone, but ROLE_OPERATOR also grants sepaPayment.create /
        # .transitionStatus / .approval.decide, so `matrix-allows` co-admits and this reason
        # never becomes the only one. standing-order POSTs sepaPayment.create via the shared
        # client. When ADR-0223 D2(b) retires those matrix grants, this entry starts denying it.
        - operator-sepa-payment-write   # service-sepa-payment-shared-client-m2m (see note above)
        # Restored once #3748 landed: service-sca-shared-client-m2m now admits the shared client
        # for scaChallenge.read AND scaChallenge.consume, so document-service's consume call
        # (ScaChallengeClient, oidc-client.client-id openbank-services) keeps an identity-scoped
        # reason and this entry no longer 403s the document-signing gate. device.list is covered
        # by matrix-allows. Still uncovered for the shared client: decide/initiate/verify and
        # device.enroll — no in-repo caller invokes them on that principal.
        - operator-sca-write            # service-sca-edge-m2m + service-sca-shared-client-m2m
      # NOT listed, and why. Each needs an identity-scoped rule for its real callers FIRST;
      # adding it here before that is a money-path outage, not a test failure.
      deferred:
        operator-transaction-write: "6 verified callers of transaction.create via the shared client; no identity-scoped rule exists"
        operator-settlement-write: "settlement.create is resourceless with no alternative rule"
        operator-swift-write: "no identity-scoped rule; callers unverified"
        operator-sepa-instant-write: "no identity-scoped rule; callers unverified"
        operator-billing-write: "no identity-scoped rule; callers unverified"
        operator-interest-write: "no identity-scoped rule; callers unverified"
        operator-lending-write: "no identity-scoped rule; callers unverified"
        operator-sanctions-write: "no identity-scoped rule; m2m-sanctions-screening covers create only"
        operator-identity-write: "no identity-scoped rule; callers unverified"
        operator-card-write: "no identity-scoped rule; callers unverified"
