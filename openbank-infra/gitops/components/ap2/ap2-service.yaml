# openbank-ap2-service: the bank-side AP2 (Agent Payments Protocol) mandate verifier
# (ADR-0193). A stateless JSON-RPC surface: POST /ap2/verify takes a presented signed
# mandate + the payment it authorizes and returns a verdict (valid + evidence + failures).
# It MOVES NO FUNDS — authorization evidence only. No DB, no Kafka.
#
# Every /ap2/verify call is authorized by the shared ADR-0034 PDP as an AI_AGENT principal —
# the OPA sidecar below (localhost:8181) serves data.openbank.rest.allow, bridging the
# verify.mandate capability to the ap2-anonymous charter (ADR-0193 phase 2). A PDP connectivity
# error still fails /ap2/verify CLOSED (503). OIDC tenant-disabled; only in-cluster callers
# (fenced by the generated NetworkPolicy). The image runs as numeric uid 100 (USER 100), so
# runAsNonRoot admits it; runAsUser is pinned for explicitness (matches agent-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap2-service
  namespace: platform
  labels:
    app.kubernetes.io/name: ap2-service
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ap2-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ap2-service
        app.kubernetes.io/part-of: platform
      annotations:
        # Roll the pod when the OPA policy bundle changes (subPath mounts don't hot-reload).
        # Kept in sync by gen-ap2-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "6be636644001ce02"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ap2-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-ap2-service:sandbox-4c86c6f7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8151
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8085
          env:
            # Parallel private-CA mTLS listener for east-west clients (first: card-processing-service's
            # agentic-commerce mandate verification, #8884). HTTP/8151 stays for existing callers until
            # their own reviewed migrations; same shape as document-service's 8443 listener. ASVS V9.1
            # forbids a NEW plaintext http:// env, so a caller can only be pointed here once this
            # listener exists.
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/internal-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/internal-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILES
              value: /mnt/internal-tls/ca.crt
            # MIRRORS the build-time value baked into this service's application.yaml
            # (quarkus.http.ssl.client-auth). That property is BUILD TIME fixed, so this env can
            # never set it — Quarkus ignores a differing runtime value and warns. It is kept, in
            # the same spelling, so the manifest states the listener's posture and cannot silently
            # disagree with the image.
            - name: QUARKUS_HTTP_SSL_CLIENT_AUTH
              value: required
            - name: QUARKUS_HTTP_SSL_PROTOCOLS
              value: TLSv1.3
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # ADR-0034 PDP: the OPA sidecar in this pod (localhost:8181), serving
            # data.openbank.rest.allow (ap2-opa-bundle ConfigMap) — the shared PDP bridges the
            # AI_AGENT verify.mandate capability to the ap2-anonymous charter (agents.rego). A PDP
            # connectivity error still fails /ap2/verify CLOSED (503).
            - name: OPA_URL
              value: http://localhost:8181
            # AP2 issuer trust list. Carries the demo issuer's public key so the sandbox demo
            # (openbank-ap2-service/demo/ap2-mandate-demo.py) verifies valid=true. Format:
            # `issuer=<x509-spki-base64>;...`. A test key — authorizes nothing real.
            - name: AP2_TRUST_LIST
              value: "demo-issuer=MCowBQYDK2VwAyEApZUA0ryfjfNx1Xy49S8m5v/Ckii44uzt2r+Z5dOtzCk="
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: internal-tls
              mountPath: /mnt/internal-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy-decision sidecar (ADR-0034 / ADR-0193 phase 2). Serves
        # data.openbank.rest.allow for the /ap2/verify gate — the shared PDP bridges the
        # AI_AGENT verify.mandate capability to the ap2-anonymous charter (agents.rego). Bundle
        # mounted from ap2-opa-bundle ConfigMap (gen-ap2-opa-bundle.sh). Bind 0.0.0.0 so kubelet
        # httpGet probes reach /health (the image is scratch — no shell for an exec probe);
        # reachability is fenced by the pod network, and OPA serves only policy decisions.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet: {path: "/health?bundles=true", port: 8181}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem: true.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: internal-tls
          secret:
            secretName: ap2-service-internal-tls
            optional: false
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: ap2-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: ap2-service
  namespace: platform
  labels:
    app.kubernetes.io/name: ap2-service
spec:
  selector:
    app.kubernetes.io/name: ap2-service
  ports:
    - name: http
      port: 8151
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
