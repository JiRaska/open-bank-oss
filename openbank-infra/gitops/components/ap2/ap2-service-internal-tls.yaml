#
# Private-CA server certificate for ap2-service's east-west mTLS listener (8443). The existing HTTP listener
# remains during the east-west TLS migration; new consumers use the parallel 8443 listener. Same shape as
# document-service-internal-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ap2-service-internal-tls
  namespace: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: ap2-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - ap2-service.platform.svc
    - ap2-service.platform.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
