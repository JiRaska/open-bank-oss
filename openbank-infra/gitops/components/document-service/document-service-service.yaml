# document-service: document lifecycle (generate/store/retrieve/sign) + templating
# for statements, contracts, letters, GDPR export letters, KYC forms (ADR-0161: object
# storage standard for application documents; ADR-0162: templating + e-signature
# architecture). Postgres-backed (document-service-db.yaml, single-owner CNPG
# cluster) — PostgresBlobStore is the ADR-0161 D1 default lightweight object-store
# adapter; a real S3-backed adapter is ADR-0161 D3, deliberately NOT wired here (no
# AWS credentials/IRSA in this pass — OBJECTSTORE_BACKEND stays at its default,
# postgres, until a real bucket exists). Publishes document lifecycle events to
# Kafka (openbank.documents.document.event, mTLS per kafka-document-service-mtls.yaml).
# Calls out to document-renderer (a separate Deployment in this same namespace, NOT a
# sidecar container) over plain HTTP for HTML->PDF rendering (ADR-0162 D3).
#
# WEASYPRINT_URL below is live config: PdfRenderPort's real implementation,
# HttpPdfRenderAdapter, POSTs to it on every DocumentRenderService.render() call
# (openbank-document-service/src/main/kotlin/.../infrastructure/render/HttpPdfRenderAdapter.kt).
# SCA_SERVICE_URL is likewise live: SignatureCeremonyService.recordDecision calls
# ScaVerificationAdapter -> sca-service on every SIGNED decision (ADR-0021/ADR-0162 D4).
#
# Not a money-path service (rules.yaml: money_path_services does not list it); OPA
# sidecar bundle is the minimal, no-service-extension shape (document-service-opa-bundle.yaml
# / gen-document-service-opa-bundle.sh — mirrors notification-service's bundle, which
# has no <svc>_rest_ext.rego of its own), relying on rest.rego's base allow reasons
# (operator-read-any, compliance-read-any, customer-self-action, etc.) until a
# document-domain-specific carve-out is actually needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: documents
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: documents
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service
        app.kubernetes.io/part-of: documents
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-document-service-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "8db63577c74178a4"
    spec:
      # ADR-0162 D4 (continued): a dedicated SA (not `default`) is what OpenBao's Kubernetes-auth
      # role `document-service-signing` is bound to — least-privilege, one identity per consumer.
      serviceAccountName: document-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: document-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-document-service:sandbox-f8d165dd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8143
            - name: management
              containerPort: 8088
          env:
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: QUARKUS_OIDC_CLIENT_ID
              value: openbank-services
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: document-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            # sca-service REST client base URL (application.yaml:
            # quarkus.rest-client.sca-service.url) — used by ScaChallengeClient /
            # ScaVerificationAdapter for every SIGNED signature-ceremony decision.
            # Without this, the config default (http://localhost:8121) doesn't
            # resolve in-cluster and SCA calls fail. Same in-cluster address as
            # consent-service's SCA_SERVICE_URL.
            - name: SCA_SERVICE_URL
              value: http://sca-service.sca.svc:8110
            # product-catalog REST client base URL (application.yaml:
            # quarkus.rest-client.product-catalog-api.url) — ADR-0162 D7: AccountCreatedConsumer's
            # ProductCatalogAdapter looks up documentTemplateCode for the account's product on
            # every account.created event. Routed via the KEDA HTTP interceptor (ADR-0083 T1
            # re-entry): the interceptor dispatches on Host, so a scaled-to-zero product-catalog
            # wakes instead of this adapter reading "no template -> no onboarding document"
            # (the silent onboarding breakage, 2026-06-24..2026-07-17).
            - name: PRODUCT_CATALOG_SERVICE_URL
              value: http://keda-add-ons-http-interceptor-proxy.keda:8080
            - name: PRODUCT_CATALOG_API_HOST_OVERRIDE
              value: product-catalog.accounts.svc
            # party-service / account-service REST client base URLs (application.yaml:
            # quarkus.rest-client.party-service-api / account-service-api) — fill the
            # RAMCOVA_SMLOUVA template's {{party.*}}/{{account.*}}/{{product.*}} clauses at sign
            # time (PartyAdapter/AccountAdapter, fail-open). Ports match the live Services
            # (party-service.party.svc:8111, account-service.accounts.svc:8100).
            - name: PARTY_SERVICE_URL
              value: http://party-service.party.svc:8111
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            # ADR-0162 D4 (continued): OpenBao pki-document-signing engine address for the client
            # electronic-signature adapter (OpenBaoClientSignatureAdapter). Declaring it here (rather
            # than relying only on the @ConfigProperty code default) is what makes gen-network-policies.py
            # emit the documents -> vault egress edge (ADR-0081) — a code-only default is invisible to it.
            - name: OPENBANK_SIGNATURE_CLIENT_PKI_BAO_ADDR
              value: http://openbao.vault.svc:8200
            # ADR-0162 D4 (continued): the bank's stable institutional PAdES-sealing identity,
            # projected from OpenBao KV via es-document-service-signing-keystore.yaml. Absent =
            # PdfBoxPadesSealAdapter falls back to a DEV-ONLY ephemeral cert (loud warning, never
            # silent) -- see that adapter's own doc comment. Do not set a blank-string default.
            - name: OPENBANK_SIGNATURE_KEYSTORE_PATH
              value: /mnt/signing-keystore/keystore.p12
            - name: OPENBANK_SIGNATURE_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-service-signing-keystore
                  key: keystore.password
                  optional: true
            # Seal keystore is seeded (OpenBao KV openbank/document-service-signing-seal), the
            # ExternalSecret syncs, and PdfBoxPadesSealAdapter loads the real org keystore at boot —
            # no ephemeral-seal fallback (issue #1296). OPENBANK_SIGNATURE_ALLOW_EPHEMERAL_SEALS is
            # therefore removed: its default (false, fail-closed at seal time) is now the correct
            # steady state, and the earlier explicit opt-in only existed to keep the demo alive while
            # the KV was unseeded. Do NOT set OPENBANK_SIGNATURE_REQUIRE_TRUSTED_ISSUER (a boot gate)
            # unless a real trusted-CA leaf replaces the self-signed org seal — assurance is ADR-0172
            # §5 "advanced" (AdES), not qualified.
            # Datasource: single document-service-db (document-service-db.yaml).
            # Reactive URL for the app (Panache); JDBC URL for Flyway. Both
            # username/password variants set, matching the billing-service pattern.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://document-service-db-rw.documents.svc:5432/openbank_documents
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://document-service-db-rw.documents.svc:5432/openbank_documents
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: document-service-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: document-service-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: document-service-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: document-service-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.documents.svc:6379
            # Kafka producer -> Strimzi bootstrap (ADR-0137: mTLS on :9093). Both
            # KAFKA_BOOTSTRAP_SERVERS and the QUARKUS_-prefixed form are set —
            # application.yaml declares quarkus.smallrye-reactive-messaging.kafka.bootstrap-servers
            # (-> QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS), and
            # KAFKA_BOOTSTRAP_SERVERS is kept alongside it for parity with every other
            # producer/consumer in the fleet (lending-service, onboarding-service,
            # notification-service — all set both).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as the KafkaUser
            # 'document-service'; keystore/truststore PKCS#12 are projected from
            # messaging by External Secrets (kafka-document-service-mtls.yaml) and
            # mounted below. The app reads these env vars via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # HTML->PDF rendering sidecar (ADR-0162 D3) — a separate Deployment
            # (document-renderer.yaml), not a pod-local container, reached over the
            # cluster network.
            - name: WEASYPRINT_URL
              value: http://document-renderer.documents.svc:8200
            # ADR-0161 D3: real S3-backed object storage is a deliberate follow-up
            # once a real bucket + IAM role exist. Left at its default (postgres) —
            # do NOT wire AWS credentials/IRSA in this pass.
            - name: OBJECTSTORE_BACKEND
              value: postgres
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034 Phase 5). AUTHZ_ENFORCE=true enables
            # the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is
            # the fine-grained PEP.
            - name: AUTHZ_ENFORCE
              value: "true"
            # #686 / #2945: load the account-created-in group.id override
            # (document-service-msg-override ConfigMap, mounted below) as an external Quarkus
            # config source, so the dotted YAML key's declared value actually reaches the Kafka
            # connector instead of silently falling back to quarkus.application.name.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: signing-keystore
              mountPath: /mnt/signing-keystore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in document-service. Bundle mounted from
        # document-service-opa-bundle ConfigMap (gen-document-service-opa-bundle.sh) —
        # the minimal shape (no service-specific rest-ext.rego), mirroring
        # notification-service.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: document-service-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: document-service-kafka-keystore
            items:
              - key: user.p12
                path: user.p12
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            items:
              - key: ca.p12
                path: ca.p12
        # optional: true — a not-yet-populated OpenBao KV secret must never block this volume
        # from mounting (an empty dir instead), since PdfBoxPadesSealAdapter's own fallback
        # already treats a missing keystore FILE the same as a missing config the same as a
        # missing volume: all three degrade to the ephemeral dev identity, never a crash.
        - name: signing-keystore
          secret:
            secretName: document-service-signing-keystore
            optional: true
        # No `items:` — project the whole ConfigMap, exactly as account-service and every other
        # msg-override consumer does. An `items:` block naming `keystore.p12` stood here, evidently
        # copy-pasted from the signing-keystore volume directly above: this ConfigMap holds ONE key,
        # `override.properties`, and never held a keystore. Kubernetes treats a named key that does
        # not exist as a hard mount failure, so the pod sat in ContainerCreating with
        # `MountVolume.SetUp failed for volume "msg-override": configmap references non-existent
        # config key: keystore.p12` — 173 times over 5h40m — and document-service was DOWN.
        # QUARKUS_CONFIG_LOCATIONS above expects /mnt/msg-config/override.properties, which the
        # whole-ConfigMap projection produces naturally.
        - name: msg-override
          configMap:
            name: document-service-msg-override
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-service
  namespace: documents
  labels:
    app.kubernetes.io/name: document-service
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: documents
  labels:
    app.kubernetes.io/name: document-service
spec:
  selector:
    app.kubernetes.io/name: document-service
  ports:
    - name: http
      port: 8143
      targetPort: http
    - name: management
      port: 8088
      targetPort: management
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: document-service
  namespace: documents
  labels:
    app.kubernetes.io/name: document-service
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: document-service
  podMetricsEndpoints:
    - port: management
      path: /q/metrics
