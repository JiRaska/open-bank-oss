# OIDC client secret for document-service (Keycloak client openbank-services).
# Same shared service-account secret used by the other app-plane services,
# stored in Vault under key `account-service`. Mirrors billing's
# oidc-externalsecret.yaml exactly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: document-service-oidc
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: document-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
