# Domain event topic produced by document-service (ADR-0161/ADR-0162). Declared
# explicitly (the broker does not auto-create topics — kafka.yaml, ADR-0137) so the
# Strimzi topic operator manages it and the producer's outbox dispatcher/readiness
# has somewhere to write. Lives in `messaging` (the topic operator only watches its
# own namespace), labelled for the openbank-cluster. Single partition + RF 1 for the
# single-broker sandbox; prod should raise partitions for parallelism and RF to 3.
#
# NOTE: an equivalent topic (openbank.statement.event, statement-service) was found
# live WITHOUT a matching KafkaTopic CR anywhere in the repo while researching this
# change — a pre-existing gap in that service's gitops, not intentional. This file
# avoids repeating that gap for document-service.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.documents.document.event
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
