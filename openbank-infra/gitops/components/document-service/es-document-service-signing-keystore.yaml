# ADR-0162 D4 (continued): the bank's stable institutional PAdES-sealing keystore, sourced from
# OpenBao KV (path `openbank/document-service-signing-seal`) — NOT the pki-document-signing PKI
# engine (that mints the CLIENT's one-time cert; this is the bank's own long-lived organizational
# identity). Same ClusterSecretStore (`vault-kv`) and mounted-PKCS12 pattern document-service
# already uses for its Kafka mTLS keystore.
#
# KV properties expected at `openbank/document-service-signing-seal`:
#   KEYSTORE_P12_BASE64 — the PKCS12 keystore file, base64-encoded (KV values are strings; the
#                          target template below decodes it back to raw bytes on projection)
#   KEYSTORE_PASSWORD    — the keystore/key password
# Seeded once, out-of-band, per docs/runbooks/0008-openbao-document-signing-pki.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: document-service-signing-keystore
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: document-service-signing-keystore
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        keystore.p12: "{{ .keystoreB64 | b64dec }}"
        keystore.password: "{{ .keystorePassword }}"
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: keystoreB64
      remoteRef:
        key: document-service-signing-seal
        property: KEYSTORE_P12_BASE64
    - secretKey: keystorePassword
      remoteRef:
        key: document-service-signing-seal
        property: KEYSTORE_PASSWORD
