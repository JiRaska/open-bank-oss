#
# Private-CA server certificate for document-service's east-west mTLS listener (8443). The existing HTTP listener
# remains during the east-west TLS migration; new consumers use the parallel 8443 listener. Same shape as
# account-service-internal-tls and party-service-internal-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: document-service-internal-tls
  namespace: documents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: document-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - document-service.documents.svc
    - document-service.documents.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
