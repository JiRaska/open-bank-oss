#
# Private-CA server certificate for the disclosure-export listener. The original HTTP listener
# remains for existing callers while delegation-service uses only this TLS listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: document-service-internal-tls
  namespace: documents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: document-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - document-service.documents.svc
    - document-service.documents.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
