# loyalty-service: the Lístek ledger (ADR-0282) — earn, redeem, expire, with the annual cap as an
# outcome. Reactive Postgres datasource + Flyway JDBC migrations against the single-owner CNPG
# cluster. Produces onto openbank.loyalty.events through the transactional outbox; consumes
# nothing. Calls no other service. OIDC bearer validation points at Keycloak; endpoints are
# guarded by @RolesAllowed, not @Authorize, so there is no OPA sidecar — nothing would query it.
# Reachable only in-cluster via ClusterIP, no ingress — the operator path is the admin-ui Lípa
# BFF (/api/loyalty), which calls loyalty-service.loyalty.svc:8157 over plain HTTP.
#
# The image pin below is a FIRST-REGISTRATION placeholder (listed in
# .github/scripts/fleet-attestation-placeholders.txt): auto-deploy builds the first image once
# openbank-loyalty-service is in ALL_SERVICES and its deploy PR rewrites this tag to the built
# sha. Until then Kyverno refuses the nonexistent tag and the pod does not exist — the same
# bootstrap risk-engine and wealth went through.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-service
  namespace: loyalty
  labels:
    app.kubernetes.io/name: loyalty-service
    app.kubernetes.io/part-of: loyalty
spec:
  replicas: 1
  # Terminate-first, deliberately: a one-replica Deployment under the default RollingUpdate needs
  # room for two pods, which a full cluster may not have. Not a pattern for multi-replica services.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loyalty-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loyalty-service
        app.kubernetes.io/part-of: loyalty
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loyalty-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-loyalty-service:sandbox-8b93bf77
          imagePullPolicy: IfNotPresent
          ports:
            # HTTP 8157 and management 8085 — both read off the service's own application.yaml
            # (quarkus.http.port / quarkus.management.port). HTTPS 8443 serves the internal TLS
            # certificate for callers that verify against openbank-ca.
            - name: http
              containerPort: 8157
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/loyalty-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/loyalty-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary. application.yaml defaults
            # both to localhost; an env source outranks it in SmallRye's ordinal.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://loyalty-db-rw.loyalty.svc:5432/openbank_loyalty
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://loyalty-db-rw.loyalty.svc:5432/openbank_loyalty
            - name: POSTGRES_USER
              value: openbank
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loyalty-db-app
                  key: password
            # Kafka: the outbox dispatcher produces onto openbank.loyalty.events -> Strimzi
            # bootstrap over mTLS (ADR-0137). The connector reads KAFKA_BOOTSTRAP_SERVERS.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loyalty-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # Set in application.yaml too; the deployed environment states it explicitly because
            # an unset dispatcher drops nothing loudly — attempt_count simply stays 0.
            - name: OPENBANK_OUTBOX_DISPATCH_ENABLED
              value: "true"
            # Keycloak runs in `iam`. A wrong host does not fail the boot (OIDC defers discovery
            # to the first request) — it fails every authenticated call later.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: loyalty-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: loyalty-tls
              mountPath: /mnt/loyalty-tls
              readOnly: true
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: loyalty-tls
          secret:
            secretName: loyalty-service-internal-tls
        - name: kafka-keystore
          secret:
            secretName: loyalty-service-kafka-keystore
            optional: false
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
  namespace: loyalty
  labels:
    app.kubernetes.io/name: loyalty-service
    app.kubernetes.io/part-of: loyalty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loyalty-service
  ports:
    - name: http
      port: 8157
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 8085
      targetPort: management
