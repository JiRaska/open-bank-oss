# Kafka mTLS identity + ACLs for openbank-loyalty-service (ADR-0137 Tier 2).
#
# loyalty-service PRODUCES openbank.loyalty.events (its outbox) and, since ADR-0310 D3,
# CONSUMES openbank.referral.qualified.v1 (group: openbank-loyalty-service, the SmallRye
# fallback group id — the channel sets no group.id key, see #2945) to earn Lístky for a
# qualified referral. Its DLQ topic for that channel needs its own Write ACL (#5745): without
# it the DLQ send itself fails and the consumer wedges on the failure it was meant to park.
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for all of this
# service's Kafka traffic. The Strimzi User Operator mints the per-user Secret of the same name in
# `messaging`; ESO projection into `loyalty` is done by kafka-mtls-externalsecrets.yaml.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: loyalty-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.loyalty.events
          patternType: literal
        operations: [Write, Describe]
      - resource:
          type: topic
          name: openbank.referral.qualified.v1
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-loyalty-service
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `referral-qualified-in` channel
      # (failure-strategy: dead-letter-queue, set in the service's application.yaml). Without
      # Write here the DLQ send itself FAILS and the consumer wedges on the very failure it
      # was meant to park.
      - resource:
          type: topic
          name: openbank.dlq.loyalty.referral-qualified-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
