# Single-owner Postgres for kyc-service, reconciled by the CNPG operator.
# CNPG generates the `kyc-db-app` secret and `kyc-db-rw` Service.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kyc-db
  namespace: kyc
spec:
  # DB-layer observability (Dynatrace-parity #0): CNPG runs its built-in
  # Prometheus exporter on :9187 and creates a PodMonitor the operator owns.
  # kube-prometheus-stack selects PodMonitors cluster-wide (NilUsesHelmValues
  # =false), so this lights up cnpg_* metrics (connections, replication lag,
  # deadlocks, xid age, WAL archiving) with zero app changes.
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_kyc
      owner: openbank
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the kyc-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/kyc-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kyc-db-daily
  namespace: kyc
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 26 2 * * *"
  backupOwnerReference: self
  cluster:
    name: kyc-db
