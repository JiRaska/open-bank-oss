# Kafka mTLS identity + ACLs for openbank-kyc-service (ADR-0137 #2665 Tier 2c).
#
# KYC consumes PARTY_CREATED events from openbank.party.events (group:
# kyc-service-party) to auto-open KYC cases (ADR-0068), and publishes KYC
# lifecycle events to openbank.kyc.events (consumed by onboarding-service).
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one
# principal for all of this service's Kafka traffic. ACLs are only needed for
# topics under locked-down ACL control; own domain-event topics need none.
#
# These resources live in `messaging` (where the Strimzi User Operator watches);
# the Strimzi User Operator mints a per-user Secret of the same name there
# (user.crt/key/p12 + user.password + ca.crt). Those secrets are projected into
# the `kyc` namespace by External Secrets below.
---
# ── KafkaUser: kyc-service ──────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the kyc Rollout rolls pods onto mTLS; lower waves sync first and
    # ArgoCD blocks on ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: kyc-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.kyc.events
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: kyc-service-party
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `party-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.kyc.party-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── ExternalSecret: kyc-service keystore ────────────────────────────────────
# Projects the Strimzi-minted kyc-service Secret from `messaging` into `kyc`.
# `dataFrom.extract` copies every key verbatim, preserving the binary PKCS#12
# payload byte-for-byte. deletionPolicy: Retain so a transient store/RBAC blip
# never deletes a live keystore out from under a running pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kyc-service-kafka-keystore
  namespace: kyc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kyc-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: kyc-service
---
# ── ExternalSecret: cluster CA truststore ───────────────────────────────────
# Shared cluster-CA truststore projected into `kyc` — identical pattern to
# every other namespace (payments, clearing, etc.).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: kyc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
