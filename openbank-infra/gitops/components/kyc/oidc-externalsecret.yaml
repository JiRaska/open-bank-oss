# OIDC client secret for kyc-service (Keycloak client openbank-services).
# Same shared service-account secret used by the other app-plane services,
# stored in Vault under key `account-service`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kyc-service-oidc
  namespace: kyc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: kyc-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #15723: kyc-service's OWN Keycloak client `openbank-kyc` (ROLE_API only), used ONLY by the
# rest-clients that select the named oidc-client `m2m` (the sanctions screens and the party
# register read). Deliberately NOT the shared `account-service` KV entry: that holds the shared
# `openbank-services` secret, and a per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kyc-service-m2m-oidc
  namespace: kyc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: kyc-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/kyc-service
        property: client_secret
