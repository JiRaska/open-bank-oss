# OIDC client secret for kyc-service (Keycloak client openbank-services).
# Same shared service-account secret used by the other app-plane services,
# stored in Vault under key `account-service`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kyc-service-oidc
  namespace: kyc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: kyc-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
