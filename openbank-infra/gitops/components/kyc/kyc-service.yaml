# kyc-service: KYC case lifecycle (open / check / approve / reject, four-eyes
# ADR-0068). Publishes KYC events to openbank.kyc.events via a transactional
# outbox (consumed by onboarding-service for the cockpit funnel). Namespace: kyc.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kyc-service
  namespace: kyc
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: kyc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-service
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  strategy:
    canary:
      stableService: kyc-service
      canaryService: kyc-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-service
        app.kubernetes.io/part-of: kyc
      annotations:
        # Rolls the pod when the OPA bundle changes (subPath mounts do not hot-reload).
        # Kept in sync by gen-kyc-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "dcfba5823c818e5d"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kyc-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-kyc-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8114
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://kyc-db-rw.kyc.svc:5432/openbank_kyc
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://kyc-db-rw.kyc.svc:5432/openbank_kyc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyc-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyc-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8114"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kyc-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # First-increment PEP screening (ADR-0116 delivery note): kyc-service calls
            # sanctions-service's already-imported OpenSanctions PEP_GLOBAL list via its
            # POST /api/v1/sanctions/screen. sanctions-service lives in the `sanctions`
            # namespace on :8123 — without this the PEP screen fails closed to MANUAL_REVIEW
            # (never a silent PASSED), but every new case would need an operator's attention.
            - name: SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            # Orphaned-party reconciliation (issue #5698): kyc-service enumerates the party
            # register hourly and reports parties that never got a KYC case, as
            # openbank_kyc_orphaned_parties. Read-only — it opens no cases. Without this the
            # rest-client falls back to its localhost dev default and every pass fails, which
            # shows up as a stale kyc-orphaned-party-detection liveness heartbeat rather than
            # as a silent "no orphans" (the gauges are not reset on a failed pass).
            - name: PARTY_SERVICE_URL
              value: http://party-service.party.svc:8111
            # Sandbox straight-through KYC (ADR-0116 §4): auto-approve cases opened from
            # PARTY_CREATED so onboarding activates without an operator. MUST be false in prod.
            - name: OPENBANK_KYC_AUTO_APPROVE
              value: "true"
            # #686: load the party-events-in group.id / auto.offset.reset override (see
            # kyc-service-msg-override ConfigMap, mounted below) as an external Quarkus config
            # source so the dotted YAML keys' true values reach MicroProfile Config unambiguously.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            # ADR-0034 Phase 5 / issue #1797: kyc-service shipped @Authorize with the app default
            # AUTHZ_ENFORCE=true and NO sidecar — so the PDP call failed and every kyc @Authorize
            # endpoint (updateCheck/pepRescreen/approve/reject) failed closed (HTTP 422). The `opa`
            # sidecar below now answers the PDP call; this explicit `false` keeps enforcement ADVISORY
            # (the interceptor logs "would DENY" without blocking) until the live decision log confirms
            # the deny population is empty, then a separate deliberate flip sets it true.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy decision point (ADR-0034 Phase 5 / issue #1797). Co-located sidecar the app
        # reaches on localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed). Bundle
        # mounted read-only from the kyc-opa-bundle ConfigMap generated by gen-kyc-opa-bundle.sh.
        # Mirrors statement-service's OPA sidecar (same image, probes, security context, subPath mounts).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/kyc_rest_ext.rego
              subPath: kyc_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: kyc-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: kyc-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: kyc-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-service
  namespace: kyc
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: kyc
spec:
  selector:
    app.kubernetes.io/name: kyc-service
  ports:
    - name: http
      port: 8114
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-service-canary
  namespace: kyc
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: kyc
spec:
  selector:
    app.kubernetes.io/name: kyc-service
  ports:
    - name: http
      port: 8114
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
