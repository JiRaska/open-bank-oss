# kyc-service: KYC case lifecycle (open / check / approve / reject, four-eyes
# ADR-0068). Publishes KYC events to openbank.kyc.events via a transactional
# outbox (consumed by onboarding-service for the cockpit funnel). Namespace: kyc.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kyc-service
  namespace: kyc
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: kyc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-service
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  strategy:
    canary:
      stableService: kyc-service
      canaryService: kyc-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-service
        app.kubernetes.io/part-of: kyc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kyc-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-kyc-service:sandbox-89a246d0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8114
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://kyc-db-rw.kyc.svc:5432/openbank_kyc
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://kyc-db-rw.kyc.svc:5432/openbank_kyc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyc-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyc-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_HTTP_PORT
              value: "8114"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kyc-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # First-increment PEP screening (ADR-0116 delivery note): kyc-service calls
            # sanctions-service's already-imported OpenSanctions PEP_GLOBAL list via its
            # POST /api/v1/sanctions/screen. sanctions-service lives in the `sanctions`
            # namespace on :8123 — without this the PEP screen fails closed to MANUAL_REVIEW
            # (never a silent PASSED), but every new case would need an operator's attention.
            - name: SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            # Sandbox straight-through KYC (ADR-0073): auto-approve cases opened from
            # PARTY_CREATED so onboarding activates without an operator. MUST be false in prod.
            - name: OPENBANK_KYC_AUTO_APPROVE
              value: "true"
            # #686: load the party-events-in group.id / auto.offset.reset override (see
            # kyc-service-msg-override ConfigMap, mounted below) as an external Quarkus config
            # source so the dotted YAML keys' true values reach MicroProfile Config unambiguously.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: kyc-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: kyc-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-service
  namespace: kyc
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: kyc
spec:
  selector:
    app.kubernetes.io/name: kyc-service
  ports:
    - name: http
      port: 8114
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-service-canary
  namespace: kyc
  labels:
    app.kubernetes.io/name: kyc-service
    app.kubernetes.io/part-of: kyc
spec:
  selector:
    app.kubernetes.io/name: kyc-service
  ports:
    - name: http
      port: 8114
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
