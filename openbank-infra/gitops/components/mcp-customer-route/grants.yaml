#
# The edge certificate for mcp.open-bank.tech and the grant letting the Gateway read it. Applied
# FIRST and on its own (go-live step 1), before any listener names the Secret: switching a listener
# in the same sync as its grant left langfuse's listener RefNotPermitted (2026-10-03). Its own
# Certificate: the host is not key-pinned by the mobile app, so a fresh key is harmless.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-edge-tls
  namespace: platform
spec:
  secretName: mcp-edge-tls
  dnsNames:
    - mcp.open-bank.tech
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# Named for mcp: `platform` is shared by agent, ap2, copilot and mcp.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mcp-edge-gateway-tls
  namespace: platform
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: mcp-edge-tls
