apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copilot-nvidia-api-key
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: copilot-nvidia-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: NVIDIA_API_KEY
      remoteRef:
        key: copilot
        property: NVIDIA_API_KEY
