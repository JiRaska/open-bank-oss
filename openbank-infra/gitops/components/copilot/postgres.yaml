# Single-owner Postgres for copilot-service, reconciled by the cluster-wide CNPG
# operator. CNPG generates the `copilot-db-app` secret (username/password for the
# `openbank` owner) and a `copilot-db-rw` Service — both consumed by the
# copilot-service Deployment for the reactive datasource and Flyway migrations.
# One instance for sandbox FinOps; prod should raise to 3 for HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: copilot-db
  namespace: platform
spec:
  # DB-layer observability: CNPG runs its built-in Prometheus exporter on :9187 and
  # creates a PodMonitor the operator owns, lighting up cnpg_* metrics with zero
  # app changes (same as every other single-owner cluster).
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_copilots
      owner: openbank
  # WAL archiving + base backups to S3. This cluster holds conversation_history — customer
  # chat transcripts, so it is a PII store, not an operational cache. Losing it loses every
  # resumable conversation; note the flip side, that a base backup keeps those transcripts
  # for the bucket's retention regardless of the app-level 90-day TTL. Credentials from EKS
  # Pod Identity on the copilot-db ServiceAccount (aws/envs/sandbox-platform/db-backups.tf).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/copilot-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
# Daily base backup at 04:20, off the fleet's busy window.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: copilot-db-daily
  namespace: platform
spec:
  schedule: "0 20 4 * * *"
  backupOwnerReference: self
  cluster:
    name: copilot-db
