# Redis idempotency/confirm cache for the copilot-service (ADR-0089 Track A). The
# redis-confirm image registers a Redis health check + client; with no
# quarkus.redis.hosts it defaults to localhost:6379, the readiness probe reports
# DOWN, and the canary never becomes ready. Ephemeral on purpose —
# persistence is disabled (--save "" --appendonly no), so a restart just clears
# in-flight confirm/idempotency keys, acceptable for the sandbox. Prod should use an
# operator-managed HA Redis. Named copilot-redis (not the bare per-ns `redis`) because
# `platform` is a shared namespace. Pinned to the valkey uid 999/gid 1000 for PSS
# restricted; /data is a writable emptyDir so the root fs can stay read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-redis
  namespace: platform
  labels:
    app.kubernetes.io/name: copilot-redis
    app.kubernetes.io/part-of: copilot-service
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545). This is a single-writer cache on an emptyDir
  # behind one ClusterIP Service: a SURGED second pod would answer half the traffic from an
  # empty keyspace, so surge is not a property worth keeping here. It also makes the roll
  # possible at all when the cluster has no room for two pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/valkey/valkey:8-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
        # Cache-layer observability (Dynatrace-parity #0). redis_exporter speaks the
        # Valkey/Redis protocol and exposes redis_* metrics on :9121. Non-alpine tag:
        # multi-arch (incl. arm64/Graviton) — the -alpine variant is amd64-only.
        - name: exporter
          image: docker.io/oliver006/redis_exporter:v1.62.0
          args: ["--redis.addr=redis://localhost:6379"]
          ports:
            - name: redis-metrics
              containerPort: 9121
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-redis
  namespace: platform
  labels:
    app.kubernetes.io/name: copilot-redis
spec:
  selector:
    app.kubernetes.io/name: copilot-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Cache-layer observability (Dynatrace-parity #0). Scrapes the redis_exporter sidecar
# so the copilot confirm cache is not a black box. The fleet PodMonitor only scrapes
# Quarkus services on the `management` port, so Valkey needs its own.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: copilot-redis-metrics
  namespace: platform
  labels:
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-redis
  namespaceSelector:
    matchNames:
      - platform
  podMetricsEndpoints:
    - port: redis-metrics
      path: /metrics
      interval: 30s
