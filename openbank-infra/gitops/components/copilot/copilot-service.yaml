# copilot-service: the customer-facing AI assistant backend (ADR-0089). The governed
# reasoning loop runs server-side behind a provider-agnostic model
# gateway. READ tools call the customer edge AS the customer (propagated bearer → ownership
# enforced at the edge, ADR-0065). The HTTP @Authorize gate queries the OPA sidecar
# (data.openbank.rest.allow) and the copilot tool-dispatch gate queries
# data.openbank.copilot.tool.allow — both served by the same sidecar (ADR-0034).
#
# The whole capability is OFF by default (COPILOT_ENABLED=false). It is money-path, so flipping
# it on is a four-eyes change to this manifest (GitOps PR). The flagd hot-reload toggle is a
# follow-up (#998); today the gate is this env var.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-service
  namespace: platform
  labels:
    app.kubernetes.io/name: copilot-service
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot-service
        app.kubernetes.io/part-of: platform
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-copilot-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "d78b2a9b94b05912"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copilot-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-copilot-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8131
            - name: management
              containerPort: 8085
          env:
            # Health + metrics are on the management interface (8085, openbank-libs default). Bind it
            # to the pod network so kubelet probes can reach it (libs leaves the host at 127.0.0.1).
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            # Redis confirm/idempotency cache (ADR-0089 Track A). The redis-confirm image
            # registers a Redis health check; without this it defaults to localhost:6379,
            # the readiness probe stays DOWN and the canary never goes ready. Points at the
            # copilot-redis Deployment in this namespace (redis.yaml).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://copilot-redis.platform.svc:6379
            # Money-path gate — OFF by default. Flip to "true" via a four-eyes GitOps PR to enable.
            - name: COPILOT_ENABLED
              value: "true"
            # Sandbox model: DeepInfra (OpenAI-compatible API), DeepSeek-V3.2 — fast, cheap (~$0.27/M),
            # no rate-limit issues on paid tier. Switch backends by updating COPILOT_MODEL_ENDPOINT +
            # model IDs only; no image rebuild.
            # Routed through the in-cluster LiteLLM gateway (ADR-0174/0175), which now IS deployed
            # (openbank-infra/gitops/components/ai-platform) and is the ONLY pod allowed to egress to
            # the US provider (networkpolicy-litellm-egress.yaml). copilot presents the LiteLLM virtual
            # key, not the DeepInfra key. Model id unchanged — litellm-config maps it to
            # deepinfra/deepseek-ai/DeepSeek-V3.2, so this is an endpoint + key change only (#1919).
            - name: COPILOT_MODEL_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: COPILOT_DEFAULT_MODEL
              value: deepseek-ai/DeepSeek-V3.2
            - name: COPILOT_MODEL_ID
              value: deepseek-ai/DeepSeek-V3.2
            # LiteLLM virtual key, projected from OpenBao (litellm/KEY_COPILOT_SERVICE) by ESO — the
            # provider key now lives only in ai-platform (ADR-0175). Optional so an un-seeded key does
            # not CrashLoop the pod — until it is set the model call degrades.
            - name: COPILOT_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: copilot-service-secrets
                  key: COPILOT_MODEL_API_KEY
                  optional: true
            # openbank-services client secret (ADR-0269 slice 4) — lets ConsentQueryClient and
            # CreditProfileReadClient's OidcClientRequestReactiveFilter mint a client-credentials
            # token for the two calls that do not propagate the customer's own bearer. Same shared
            # KV entry every other projection reads (rules.yaml: oidc_secret_convention, #3485).
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: copilot-service-secrets
                  key: OIDC_CLIENT_SECRET
                  # NOT optional (issue #2929): a missing key here must not silently degrade to
                  # UNAUTHENTICATED outbound calls — CrashLoop is the correct failure mode for a
                  # credential this security-relevant, not a quiet 401 from consent-service/
                  # analytics-sink.
                  optional: false
            # Postgres conversation history (#3710). The CNPG operator injects
            # copilot-db-app with PG_USER/PG_PASSWORD; REACTIVE_URL and JDBC_URL resolve them.
            #
            # The database name is `openbank_copilots`, PLURAL — that is what postgres.yaml's
            # `bootstrap.initdb.database` creates and it is the only database on the cluster.
            # These two URLs said `openbank_copilot` (singular) from the day #3710 added them,
            # so no pod carrying the conversation store has ever reached its schema. Flyway's
            # `migrate-at-start: true` retries the connection and then fails the boot, which is
            # why the sandbox has been serving from a pre-#3710 ReplicaSet while the newer one
            # CrashLoops: an erasure consumer cannot delete rows from a database its own pod
            # cannot open (issue #3881).
            - name: REACTIVE_URL
              value: postgresql://copilot-db-rw.platform.svc:5432/openbank_copilots
            - name: JDBC_URL
              value: jdbc:postgresql://copilot-db-rw.platform.svc:5432/openbank_copilots
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: copilot-db-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copilot-db-app
                  key: password
            - name: COPILOT_GUARDRAIL_MODE
              value: block
            # Model-based content safety (ADR-0265 slice 2). Llama Guard through the SAME gateway and
            # the SAME virtual key as the chat model — no second credential, no second egress.
            - name: COPILOT_CONTENT_SAFETY_ENABLED
              value: "true"
            - name: COPILOT_CONTENT_SAFETY_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: COPILOT_CONTENT_SAFETY_MODEL
              value: meta-llama/llama-guard-4-12b
            - name: COPILOT_CONTENT_SAFETY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: copilot-service-secrets
                  key: COPILOT_MODEL_API_KEY
                  optional: true
            # fail-closed=false on THIS surface, deliberately. Customer help: refusing to answer a
            # balance question because a classifier is unreachable is worse than answering it, and
            # the deterministic injection guard, the OPA tool gate and SCA all still stand between
            # the customer and any action. Every unavailable verdict is still audited and counted
            # (openbank_guardrail_classifications{decision="unavailable"}), so this is a declared
            # posture rather than a silent one. Flip to "true" on any state-changing surface.
            - name: COPILOT_CONTENT_SAFETY_FAIL_CLOSED
              value: "false"
            # Hybrid keyword + pgvector retrieval (ADR-0183 / ADR-0265 slice 4). Same gateway again;
            # the embedding route is priced and budgeted separately in litellm-config.yaml.
            - name: COPILOT_SEMANTIC_RETRIEVAL_ENABLED
              value: "true"
            - name: COPILOT_EMBEDDING_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: COPILOT_EMBEDDING_MODEL
              value: BAAI/bge-m3
            # MUST match V3__help_embeddings.sql's vector(1024). The adapter discards a batch whose
            # width disagrees rather than letting Postgres reject rows one at a time.
            - name: COPILOT_EMBEDDING_DIMENSIONS
              value: "1024"
            - name: COPILOT_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: copilot-service-secrets
                  key: COPILOT_MODEL_API_KEY
                  optional: true
            # Bearer-only resource server validating the CUSTOMER JWT — the openbank-customers realm
            # (same as the edge, ADR-0065), NOT the operator `openbank` realm. RS256/JWKS verification
            # needs no client secret (mirrors customer-edge), so no ESO secret dependency.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank-customers
            - name: QUARKUS_OIDC_CLIENT_ID
              value: openbank-edge
            - name: QUARKUS_OIDC_APPLICATION_TYPE
              value: service
            # Pin the public issuer URL so Quarkus OIDC verifies the JWT iss claim against the
            # external URL (kc.open-bank.tech), not the in-cluster keycloak.iam.svc URL.
            # Without this Quarkus falls back to token introspection (openbank-edge is a public
            # client → no secret → 401 at the introspect endpoint → every request rejected).
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: https://kc.open-bank.tech/realms/openbank-customers
            # Disable opaque-token introspection: this service only accepts customer JWTs.
            # openbank-edge is a public client with no secret, so introspection always fails 401;
            # disabling it makes Quarkus reject invalid JWTs immediately instead of attempting
            # a doomed introspect call.
            - name: QUARKUS_OIDC_ALLOW_TOKEN_INTROSPECTION
              value: "false"
            # READ tools call the customer edge AS the customer (bearer propagated, ADR-0089 D5).
            - name: CUSTOMER_EDGE_URL
              value: http://customer-edge.customer-edge.svc:8128
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034). AUTHZ_ENFORCE=true enables the
            # @Authorize HTTP interceptor to enforce decisions from data.openbank.rest.allow.
            - name: AUTHZ_ENFORCE
              value: "true"
            # ── PARTY_ERASED consumer (GDPR Art. 17 / ADR-0117, #3875, issue #3881) ──
            # Kafka consumer → Strimzi bootstrap (ADR-0137: mTLS on :9093). The plaintext
            # :9092 listener is denied for every principal cluster-wide, so there is no
            # non-mTLS path to fall back to. The keystore Secret is projected from
            # `messaging` by kafka-copilot-mtls.yaml; the truststore Secret is the one
            # agent-service already created in this namespace and is shared, not duplicated.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copilot-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # group.id / auto.offset.reset arrive as an external properties source, NOT as env
            # vars and NOT from application.yaml — see copilot-service-msg-override.yaml for
            # why both of those routes are broken for a hyphenated channel (#686).
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            httpGet:
              path: /q/health/started
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 640Mi
        # OPA policy-decision sidecar (ADR-0034). Serves:
        #   data.openbank.rest.allow         — for @Authorize interceptor (copilot.chat)
        #   data.openbank.copilot.tool.allow — for CopilotToolGate (get_balance, initiate_transfer…)
        # Both packages are in the same bundle; a single sidecar answers both query paths.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/copilot_rest_ext.rego
              subPath: copilot_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/copilot_tool.rego
              subPath: copilot_tool.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: copilot-opa-bundle
        # Projected by kafka-copilot-mtls.yaml's ExternalSecret from the Strimzi-minted
        # `copilot-service` Secret in `messaging`.
        - name: kafka-keystore
          secret:
            secretName: copilot-service-kafka-keystore
            items:
              - key: user.p12
                path: user.p12
        # Shared cluster-CA truststore — this Secret is created in `platform` by
        # components/agent/kafka-agent-mtls.yaml and is deliberately not redeclared here.
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            items:
              - key: ca.p12
                path: ca.p12
        - name: msg-override
          configMap:
            name: copilot-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-service
  namespace: platform
  labels:
    app.kubernetes.io/name: copilot-service
spec:
  selector:
    app.kubernetes.io/name: copilot-service
  ports:
    - name: http
      port: 8131
      targetPort: http
