# #10486 batch 6: copilot-service's OWN Keycloak client `openbank-copilot` (ROLE_API only), used ONLY
# by CreditProfileReadClient (named oidc-client `m2m`). KV layout is ADR-0099's `openbank/keycloak/<service>`,
# written once by the owner's provisioning script (runbook 0009); nothing in this repo holds the value.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: copilot-service-m2m-oidc
  namespace: platform
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: copilot-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/copilot-service
        property: client_secret
