# Public edge for the Pact Broker (ADR-0092). The CI runner pool (openbank-build)
# is MIXED — in-cluster ARC pods AND external runners (Hetzner VMs, Mac mini) — so
# the broker cannot be reached over cluster DNS alone; it needs a stable URL every
# runner can hit for publish / provider-verify / can-i-deploy. cert-manager mints a
# browser-trusted Let's Encrypt leaf; external-dns publishes the record from the
# rule below.
#
# Security posture: this is a deliberate, documented exception to ADR-0056's
# "no public pre-auth surface" default (ADR-0092). It is acceptable because the
# broker is gated by its own HTTP Basic auth (PACT_BROKER_BASIC_AUTH_*, synced from
# OpenBao) on every path except the DB-less /diagnostic/status/heartbeat, the
# payload is API contracts (not customer data), and it is a machine/CI endpoint.
# ssl-redirect forces https at the edge; KC-style security headers are set too
# (custom-headers ConfigMap below + controller HSTS/nosniff, no snippet).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pact-broker
  namespace: pact-broker
  annotations:
    # DNS moved to the Envoy Gateway route (httproute.yaml, 2026-10-04). This makes external-dns
    # ignore the Ingress; it stays as the rollback until a later change deletes it.
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/custom-headers: pact-broker/pact-broker-edge-headers-v1
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pact.open-bank.tech
      secretName: pact-broker-tls
  rules:
    - host: pact.open-bank.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pact-broker
                port:
                  number: 9292
---
# Edge response headers for this host, served by ingress-nginx's `custom-headers` annotation
# (ADR-0324 interim hardening) instead of a Critical-risk `configuration-snippet`. Keys must be
# in the controller's `global-allowed-response-headers` (apps/ingress-nginx.yaml) or the
# controller denies the location (503). HSTS and X-Content-Type-Options are NOT listed here:
# the controller sets both on every response (hsts-*, add-headers).
# IMMUTABLE, VERSIONED BY NAME, SYNC-WAVE -1 — all three are load-bearing. The controller
# re-reads this ConfigMap only when the Ingress that names it changes (custom-headers is not
# in its configmap-watch set and it runs with no resync period), so an in-place edit would
# never reach nginx. Change a header by adding `-v2` and pointing the annotation at it. The
# wave makes ArgoCD create the ConfigMap before the Ingress that references it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pact-broker-edge-headers-v1
  namespace: pact-broker
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
immutable: true
data:
  X-Frame-Options: "SAMEORIGIN"
  Referrer-Policy: "strict-origin-when-cross-origin"
  X-Robots-Tag: "noindex, nofollow"
