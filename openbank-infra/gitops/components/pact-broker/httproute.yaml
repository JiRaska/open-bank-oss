#
# pact.open-bank.tech on the shared Gateway (ADR-0324 Phase 1), the Gateway API
# translation of ingress.yaml. Same security posture as that file states (ADR-0092).
#
# IN DNS since the cutover (2026-10-04): external-dns publishes pact.open-bank.tech from this
# route, pointing at the Gateway's NLB. ingress.yaml now carries the
# `external-dns.kubernetes.io/controller: gateway-api-cutover-pending` annotation and keeps
# serving on ingress-nginx as the rollback (swap the annotation back).
#
# Annotation mapping from ingress.yaml:
#   ssl-redirect            -> the Gateway's http listener redirects every host (envoy-gateway)
#   custom-headers + the controller's HSTS / nosniff / hide-headers
#                           -> ResponseHeaderModifier below, same values
#   (nginx default) client_max_body_size 1m, proxy_read_timeout 60s
#                           -> BackendTrafficPolicy below; Envoy otherwise has no body cap
#                              and a 15s route timeout
#   tls / cluster-issuer    -> the Gateway's https-pact-broker listener moves to its OWN
#                              Certificate `pact-edge-tls` (below). Two steps, never one:
#                              this change issues it and lets the grant admit BOTH Secrets;
#                              only a later change points the listener at it. Switching the
#                              listener in the same sync as the grant left langfuse's
#                              listener RefNotPermitted (2026-10-03) because the Gateway and
#                              this namespace are different Argo apps with no ordering.
#
# Why its own Certificate: cert-manager runs with --enable-certificate-owner-ref, so
# `pact-broker-tls` is owned by the nginx Ingress; deleting that Ingress after the cutover would
# garbage-collect the Secret. No key pinning exists for this host, so a fresh key is harmless.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pact-edge-tls
  namespace: pact-broker
spec:
  secretName: pact-edge-tls
  dnsNames:
    - pact.open-bank.tech
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-gateway-tls
  namespace: pact-broker
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: pact-broker-tls
    - group: ""
      kind: Secret
      name: pact-edge-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pact-broker
  namespace: pact-broker
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https-pact-broker
  hostnames:
    - pact.open-bank.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Robots-Tag
                value: "noindex, nofollow"
            remove:
              - X-Powered-By
      backendRefs:
        - name: pact-broker
          port: 9292
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pact-broker
  namespace: pact-broker
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: pact-broker
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      requestTimeout: 60s
