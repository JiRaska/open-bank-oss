#
# pact.open-bank.tech on the shared Gateway (ADR-0324 Phase 1), the Gateway API
# translation of ingress.yaml. Same security posture as that file states (ADR-0092).
#
# NOT YET IN DNS. external-dns skips this route while it carries the controller annotation
# below, so the name still resolves to ingress-nginx and ingress.yaml keeps serving it.
# The route is reachable only on the Gateway's own NLB address until the cutover
# (steps in components/envoy-gateway/httproute-redirect.yaml).
#
# Annotation mapping from ingress.yaml:
#   ssl-redirect            -> the Gateway's http listener redirects every host (envoy-gateway)
#   custom-headers + the controller's HSTS / nosniff / hide-headers
#                           -> ResponseHeaderModifier below, same values
#   (nginx default) client_max_body_size 1m, proxy_read_timeout 60s
#                           -> BackendTrafficPolicy below; Envoy otherwise has no body cap
#                              and a 15s route timeout
#   tls / cluster-issuer    -> the Gateway's https-pact-broker listener serves the SAME
#                              Secret, admitted by the ReferenceGrant below
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: edge-gateway-tls
  namespace: pact-broker
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: pact-broker-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pact-broker
  namespace: pact-broker
  annotations:
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: https-pact-broker
  hostnames:
    - pact.open-bank.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Robots-Tag
                value: "noindex, nofollow"
            remove:
              - X-Powered-By
      backendRefs:
        - name: pact-broker
          port: 9292
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pact-broker
  namespace: pact-broker
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: pact-broker
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      requestTimeout: 60s
