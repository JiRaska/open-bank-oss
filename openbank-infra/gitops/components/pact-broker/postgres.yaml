# Single-owner Postgres for the Pact Broker, reconciled by the cluster-wide CNPG
# operator. Sandbox runs one instance for FinOps. CNPG generates the
# `pact-broker-db-app` secret (keys: username, password) for the `pact_broker`
# owner and a read-write Service `pact-broker-db-rw` — both consumed by the
# Pact Broker Deployment.
#
# No `backup:` block by design (ADR-0092): pact and verification data are fully
# reproducible — every CI build republishes the consumer pacts and provider
# verification results — so the broker DB carries no irreplaceable state and stays
# out of the backup-coverage obligation that money-path DBs carry.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pact-broker-db
  namespace: pact-broker
spec:
  # DB-layer observability: CNPG runs its built-in Prometheus exporter on :9187
  # and creates a PodMonitor the operator owns; kube-prometheus-stack selects it
  # cluster-wide, lighting up cnpg_* metrics with zero app changes.
  monitoring:
    enablePodMonitor: true
  instances: 1
  # ECR pull-through instead of ghcr.io — the ADR-0092 pilot for #1290. CNPG instance
  # pods are (correctly) excluded from the Kyverno ecr-pull-through-rewrite policy: the
  # operator reconciles the running pod's image against spec.imageName, so a mutating
  # webhook makes the pod permanently drift and it recreates it every ~10s (that is what
  # looped pact-broker-db and fraud-db when rewrite-ghcr landed). Setting the ref HERE is
  # the mechanism the policy's own comment asks for — "CNPG must own its image ref
  # end-to-end" — with no mutation and nothing to drift from.
  # Tag stays 16.14 = what this cluster actually runs. The 18.1 that was declared here
  # never applied (see the storage note below) and adopting it would be a Postgres MAJOR
  # upgrade — a separate, deliberate decision, not a side effect of changing a registry.
  imageName: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/ghcr/cloudnative-pg/postgresql:16.14
  storage:
    storageClass: gp3
    # 5Gi = the live PVC. It was declared 1Gi in 343aef3f8 while the volume was already
    # 5Gi, and CNPG's webhook refuses to shrink storage:
    #   spec.storage: Invalid value: "1Gi": can't shrink existing storage from 5Gi to 1Gi
    # Every sync of this Application has failed since 2026-06-30 as a result — 16 days,
    # invisibly, because the workload stayed Healthy and only sync status went Unknown.
    # That is also why the 18.1 above was never applied. Do not "tidy" this back down:
    # the declared size must track the volume, which can grow but never shrink.
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: pact_broker
      owner: pact_broker

  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the pact-broker-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/pact-broker-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pact-broker-db-daily
  namespace: pact-broker
spec:
  schedule: "0 19 2 * * *"
  backupOwnerReference: self
  cluster:
    name: pact-broker-db
