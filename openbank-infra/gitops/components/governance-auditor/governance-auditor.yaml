apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-auditor
  namespace: governance-auditor
  labels:
    app.kubernetes.io/name: governance-auditor
    app.kubernetes.io/part-of: governance-auditor
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: governance-auditor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governance-auditor
        app.kubernetes.io/part-of: governance-auditor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: governance-auditor
          # Pending first CI build (ADR-0164 initial PR) — build-push-service.sh publishes the
          # real sandbox-<sha> tag on merge; ArgoCD will not sync a healthy pod until then.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-governance-auditor:sandbox-f180c2bc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8143
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Postgres (CNPG govaudit-db) — findings + their HITL lifecycle survive pod restarts.
            # Reactive URL for the app (Panache); JDBC URL for Flyway migrations.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://govaudit-db-rw.governance-auditor.svc:5432/openbank_govaudit
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://govaudit-db-rw.governance-auditor.svc:5432/openbank_govaudit
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: govaudit-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: govaudit-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            # The periodic sweep. Set EXPLICITLY here rather than left to the application.yaml
            # default, because this is the only place an operator looks to answer "when does this
            # agent run" — and until now the answer was "it doesn't". The agent was trigger-only,
            # so its findings table was empty, which renders as "nothing to act on" rather than
            # "nothing has ever looked".
            # daily at 04:30 UTC, offset from the other control-plane agents, which share one LiteLLM
            # gateway and one Prometheus and each carry their own daily token budget.
            # Six fields (second minute hour day month weekday) — Quarkus, not crontab.
            - name: GOVERNANCE_AUDITOR_AUDIT_CRON
              value: "0 30 4 * * ?"
            - name: GITHUB_API_URL
              value: https://api.github.com
            - name: GITHUB_REPO
              value: JiRaska/open-bank-oss
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-governance
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: governance-auditor
  namespace: governance-auditor
  labels:
    app.kubernetes.io/name: governance-auditor
    app.kubernetes.io/part-of: governance-auditor
spec:
  selector:
    app.kubernetes.io/name: governance-auditor
  ports:
    - name: http
      port: 8143
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
