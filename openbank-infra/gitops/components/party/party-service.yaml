# party-service: customer and company registry, KYC status, name search (ADR-0055).
# Non-money-path; 1 replica sandbox.
# v0.2.0: adds GET /api/v1/parties/search — pg_trgm bounded name search.
# ADR-0098 Phase 4: migrated to Argo Rollout (canary, progressive delivery).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: party-service
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
    app.kubernetes.io/part-of: party
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: party-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-party-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "99a04e2659863108"
      labels:
        app.kubernetes.io/name: party-service
        app.kubernetes.io/part-of: party
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: party-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-party-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8111
            - name: management
              containerPort: 8085
          env:
            # TEMPORARY: party-service hadn't been redeployed since 2026-06-20 — well before
            # a repo-wide byte-level pass touched migration file contents without changing
            # their logical SQL (same relicense-class mechanism as #730/#882). V4/V7 checksum
            # mismatch confirmed via crash logs; both files show a single authoring commit,
            # have had no real content edit since. Remove once the live schema_history rows
            # are confirmed repaired (one clean boot is enough; safe to leave briefly, repair
            # is a no-op once checksums already match).
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://party-db-rw.party.svc:5432/openbank_parties
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://party-db-rw.party.svc:5432/openbank_parties
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: party-db-app
                  key: password
            - name: QUARKUS_HTTP_PORT
              value: "8111"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: party-service-oidc
                  key: OIDC_CLIENT_SECRET
            # GDPR Art. 15 aggregation hops (ADR-0118 §6). Declared here — not only in
            # application.yaml — because gen-network-policies.py derives the NetworkPolicy
            # edges from the env URLs a Deployment declares: without these two entries the
            # party → kyc / party → card-issuance calls are DROPPED by the VPC CNI agent
            # even when the M2M bearer is correct.
            - name: OPENBANK_KYC_SERVICE_URL
              value: http://kyc-service.kyc.svc:8114
            - name: OPENBANK_CARD_SERVICE_URL
              value: http://card-issuance-service.payments.svc:8118
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Kafka broker for the transactional-outbox dispatcher (party-outbox-out →
            # topic openbank.party.events; the direct party-events-out emitter was retired
            # by #4007, so this is now the ONLY way a party event leaves the service).
            # Without this the bootstrap defaults to
            # localhost, the producer can never connect, party events stay undispatched
            # in the outbox, and the onboarding-service funnel stays empty. Points at the
            # Strimzi bootstrap, same as onboarding-service.
            # Kafka → Strimzi tls:9093 (mTLS, ADR-0137 #2665 Tier 1). party-service was the
            # last plaintext:9092 client in the fleet, and 9092 authenticates as ANONYMOUS.
            # That was survivable only while its topics had no ACLs: Strimzi's simple
            # authorizer allows an unlisted principal ONLY on a topic no ACL names, so the
            # moment the party-service KafkaUser was created (its ACLs bind these very
            # topics to CN=party-service), ANONYMOUS lost access to them — and party-service
            # locked itself out of its own topics.
            #
            # Failure mode was total and silent from the outside: party.events could not be
            # produced and kyc/aml events could not be consumed, so a new customer's
            # party.created never left the outbox, no account was ever opened, no onboarding
            # document or signature ceremony was ever created, and KYC sat at NOT_STARTED
            # forever. Onboarding simply did not complete. Found by running a real
            # registration through the live sandbox, not by a failing check.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: party-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # ADR-0034 Phase 5: the OPA sidecar (below) is now wired, so @Authorize actually
            # reaches a PDP. Kept ADVISORY (false) for this rollout — party-service has M2M
            # callers (customer-edge: party.consent.update, party:resolve) whose allow-rules are
            # new and unproven in the live decision log. The interceptor evaluates + records every
            # decision but does NOT block while false, so the "would DENY" population can be
            # confirmed empty before the enforce flip (a separate, deliberate follow-up, per the
            # rules.yaml four_eyes / AUTHZ_ENFORCE guardrail). The app default is `true`, so this
            # explicit `false` is load-bearing.
            - name: AUTHZ_ENFORCE
              value: "false"
            # Redis for the four-eyes ApprovalStore (ADR-0155), backing the `party.merge`
            # gate. Load-bearing: the ApprovalConfig bean resolves with or without this, so
            # a missing Redis does not make the interceptor fall back to its documented
            # no-ApprovalStore log line — it makes every gated merge fail on a connection
            # error instead (issue #1354).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.party.svc:6379
            # ADR-0155 four-eyes ENFORCEMENT for party.merge. Deliberately LEFT AT THE APP
            # DEFAULT (false) by this change: the gate is wired end to end but inert until
            # this is set to "true", exactly as every other ApprovalStore-wired service in
            # the fleet ships it. Flipping it is a separate operational decision with two
            # preconditions — (1) a second ROLE_OPERATOR/ROLE_ADMIN identity must exist in
            # the running realm, since segregation of duties here is by identity and a
            # single-operator sandbox would deadlock every merge; (2) the admin-UI merge
            # action (issue #1984 item 4) must handle the 202 + X-Approval-Id retry, or the
            # console will read the pause as a failure.
            # - name: AUTHZ_FOUR_EYES_ENFORCE
            #   value: "true"
            # ADR-0179 merge account guard: party-service calls account-service to refuse a merge
            # while the retired party still owns an open account. The `.svc`-qualified URL is what
            # the network-policy generator's URL_RE scans to derive the party→accounts:8100 edge —
            # without this env the manifest carries no account URL (it defaults inside the image),
            # so the generator can't see the call and the guard connection times out under the
            # default-deny NetworkPolicy. Resolves identically to the in-image default.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            # #686 / #2945: load the kyc-events-in / aml-events-in / consent-events-in group.id
            # override (party-service-msg-override ConfigMap, mounted below) as an external
            # Quarkus config source, so the dotted YAML keys' declared values actually reach the
            # Kafka connector instead of silently falling back to quarkus.application.name.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # flagd feature-flag evaluator (ADR-0067) — first sidecar in the fleet, the
        # flag-eval counterpart to the planned OPA sidecar. Evaluates locally over OFREP
        # at :8016; the service's FlagdProvider points at localhost:8016. Flag-as-code is
        # mounted from the party-feature-flags ConfigMap; flagd hot-reloads on change.
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.11.4
          imagePullPolicy: IfNotPresent
          # flagd default ports (do not override): 8013 gRPC, 8014 management
          # (/healthz,/readyz), 8016 OFREP HTTP. The service's FlagdProvider speaks
          # OFREP, so it targets :8016 (see application.yaml openbank.flags.url).
          args:
            - "start"
            - "--uri"
            - "file:/etc/flagd/flags.json"
          ports:
            - name: ofrep
              containerPort: 8016
            - name: flagd-mgmt
              containerPort: 8014
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8014
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8014
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: feature-flags
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # OPA policy decision point (ADR-0034 Phase 5). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed). Bundle mounted
        # read-only from the party-opa-bundle ConfigMap generated by gen-party-opa-bundle.sh.
        # Mirrors account-service's OPA sidecar (same image, probes, security context).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/party_rest_ext.rego
              subPath: party_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: party-opa-bundle
        - name: feature-flags
          configMap:
            name: party-feature-flags
        # Already projected into this namespace 17 days ago by the ADR-0137 rollout — only
        # the Deployment above was never switched over to actually use them.
        - name: kafka-keystore
          secret:
            secretName: party-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: party-service-msg-override
  strategy:
    canary:
      stableService: party-service
      canaryService: party-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
---
apiVersion: v1
kind: Service
metadata:
  name: party-service
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
spec:
  selector:
    app.kubernetes.io/name: party-service
  ports:
    - name: http
      port: 8111
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: party-service-canary
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
spec:
  selector:
    app.kubernetes.io/name: party-service
  ports:
    - name: http
      port: 8111
      targetPort: http
