# party-service: customer and company registry, KYC status, name search (ADR-0055).
# Non-money-path; 1 replica sandbox.
# v0.2.0: adds GET /api/v1/parties/search — pg_trgm bounded name search.
# ADR-0098 Phase 4: migrated to Argo Rollout (canary, progressive delivery).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: party-service
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
    app.kubernetes.io/part-of: party
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: party-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: party-service
        app.kubernetes.io/part-of: party
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: party-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-party-service:sandbox-571cbd2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8111
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://party-db-rw.party.svc:5432/openbank_parties
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://party-db-rw.party.svc:5432/openbank_parties
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: party-db-app
                  key: password
            - name: QUARKUS_HTTP_PORT
              value: "8111"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: party-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Kafka broker for the transactional-outbox dispatcher (party-events-out →
            # topic openbank.party.events). Without this the bootstrap defaults to
            # localhost, the producer can never connect, party events stay undispatched
            # in the outbox, and the onboarding-service funnel stays empty. Points at the
            # Strimzi bootstrap, same as onboarding-service.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9092
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9092
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # flagd feature-flag evaluator (ADR-0067) — first sidecar in the fleet, the
        # flag-eval counterpart to the planned OPA sidecar. Evaluates locally over OFREP
        # at :8016; the service's FlagdProvider points at localhost:8016. Flag-as-code is
        # mounted from the party-feature-flags ConfigMap; flagd hot-reloads on change.
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.11.4
          imagePullPolicy: IfNotPresent
          # flagd default ports (do not override): 8013 gRPC, 8014 management
          # (/healthz,/readyz), 8016 OFREP HTTP. The service's FlagdProvider speaks
          # OFREP, so it targets :8016 (see application.yaml openbank.flags.url).
          args:
            - "start"
            - "--uri"
            - "file:/etc/flagd/flags.json"
          ports:
            - name: ofrep
              containerPort: 8016
            - name: flagd-mgmt
              containerPort: 8014
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8014
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8014
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: feature-flags
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: feature-flags
          configMap:
            name: party-feature-flags
  strategy:
    canary:
      stableService: party-service
      canaryService: party-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
---
apiVersion: v1
kind: Service
metadata:
  name: party-service
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
spec:
  selector:
    app.kubernetes.io/name: party-service
  ports:
    - name: http
      port: 8111
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: party-service-canary
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
spec:
  selector:
    app.kubernetes.io/name: party-service
  ports:
    - name: http
      port: 8111
      targetPort: http
