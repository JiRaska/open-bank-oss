# party-service: customer and company registry, KYC status, name search (ADR-0055).
# Non-money-path; 1 replica sandbox.
# v0.2.0: adds GET /api/v1/parties/search — pg_trgm bounded name search.
# ADR-0098 Phase 4: migrated to Argo Rollout (canary, progressive delivery).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: party-service
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
    app.kubernetes.io/part-of: party
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: party-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: party-service
        app.kubernetes.io/part-of: party
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: party-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-party-service:sandbox-31e6692a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8111
            - name: management
              containerPort: 8085
          env:
            # TEMPORARY: party-service hadn't been redeployed since 2026-06-20 — well before
            # a repo-wide byte-level pass touched migration file contents without changing
            # their logical SQL (same relicense-class mechanism as #730/#882). V4/V7 checksum
            # mismatch confirmed via crash logs; both files show a single authoring commit,
            # have had no real content edit since. Remove once the live schema_history rows
            # are confirmed repaired (one clean boot is enough; safe to leave briefly, repair
            # is a no-op once checksums already match).
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://party-db-rw.party.svc:5432/openbank_parties
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://party-db-rw.party.svc:5432/openbank_parties
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: party-db-app
                  key: password
            - name: QUARKUS_HTTP_PORT
              value: "8111"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: party-service-oidc
                  key: OIDC_CLIENT_SECRET
            # GDPR Art. 15 aggregation hops (ADR-0118 §6). Declared here — not only in
            # application.yaml — because gen-network-policies.py derives the NetworkPolicy
            # edges from the env URLs a Deployment declares: without these two entries the
            # party → kyc / party → card-issuance calls are DROPPED by the VPC CNI agent
            # even when the M2M bearer is correct.
            - name: OPENBANK_KYC_SERVICE_URL
              value: http://kyc-service.kyc.svc:8114
            - name: OPENBANK_CARD_SERVICE_URL
              value: http://card-issuance-service.payments.svc:8118
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Kafka broker for the transactional-outbox dispatcher (party-events-out →
            # topic openbank.party.events). Without this the bootstrap defaults to
            # localhost, the producer can never connect, party events stay undispatched
            # in the outbox, and the onboarding-service funnel stays empty. Points at the
            # Strimzi bootstrap, same as onboarding-service.
            # Kafka → Strimzi tls:9093 (mTLS, ADR-0137 #2665 Tier 1). party-service was the
            # last plaintext:9092 client in the fleet, and 9092 authenticates as ANONYMOUS.
            # That was survivable only while its topics had no ACLs: Strimzi's simple
            # authorizer allows an unlisted principal ONLY on a topic no ACL names, so the
            # moment the party-service KafkaUser was created (its ACLs bind these very
            # topics to CN=party-service), ANONYMOUS lost access to them — and party-service
            # locked itself out of its own topics.
            #
            # Failure mode was total and silent from the outside: party.events could not be
            # produced and kyc/aml events could not be consumed, so a new customer's
            # party.created never left the outbox, no account was ever opened, no onboarding
            # document or signature ceremony was ever created, and KYC sat at NOT_STARTED
            # forever. Onboarding simply did not complete. Found by running a real
            # registration through the live sandbox, not by a failing check.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: party-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # flagd feature-flag evaluator (ADR-0067) — first sidecar in the fleet, the
        # flag-eval counterpart to the planned OPA sidecar. Evaluates locally over OFREP
        # at :8016; the service's FlagdProvider points at localhost:8016. Flag-as-code is
        # mounted from the party-feature-flags ConfigMap; flagd hot-reloads on change.
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.11.4
          imagePullPolicy: IfNotPresent
          # flagd default ports (do not override): 8013 gRPC, 8014 management
          # (/healthz,/readyz), 8016 OFREP HTTP. The service's FlagdProvider speaks
          # OFREP, so it targets :8016 (see application.yaml openbank.flags.url).
          args:
            - "start"
            - "--uri"
            - "file:/etc/flagd/flags.json"
          ports:
            - name: ofrep
              containerPort: 8016
            - name: flagd-mgmt
              containerPort: 8014
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8014
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8014
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: feature-flags
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: feature-flags
          configMap:
            name: party-feature-flags
        # Already projected into this namespace 17 days ago by the ADR-0137 rollout — only
        # the Deployment above was never switched over to actually use them.
        - name: kafka-keystore
          secret:
            secretName: party-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: party-service
      canaryService: party-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
---
apiVersion: v1
kind: Service
metadata:
  name: party-service
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
spec:
  selector:
    app.kubernetes.io/name: party-service
  ports:
    - name: http
      port: 8111
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: party-service-canary
  namespace: party
  labels:
    app.kubernetes.io/name: party-service
spec:
  selector:
    app.kubernetes.io/name: party-service
  ports:
    - name: http
      port: 8111
      targetPort: http
