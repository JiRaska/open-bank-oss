apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: party-service-oidc
  namespace: party
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: party-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 5: party-service's OWN Keycloak client `openbank-party` (ROLE_API only), used ONLY by
# the rest-clients that select the named oidc-client `m2m`. KV layout is ADR-0099's
# `openbank/keycloak/<service>`, written once by the owner's provisioning script (runbook 0009).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: party-service-m2m-oidc
  namespace: party
  annotations:
    # ADR-0279 WS4 #18: this client's own secret; rotate it (kcadm regenerate + re-seed KV) by
    # this date.
    openbank.io/rotation-deadline: "2027-09-21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: party-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/party-service
        property: client_secret
