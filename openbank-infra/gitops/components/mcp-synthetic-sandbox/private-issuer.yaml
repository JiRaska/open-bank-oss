---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mcp-synthetic-root-bootstrap
  namespace: mcp-synthetic-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-synthetic-root-ca
  namespace: mcp-synthetic-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  commonName: OpenBank MCP Synthetic Sandbox Root CA
  isCA: true
  secretName: mcp-synthetic-root-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: mcp-synthetic-root-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mcp-synthetic-private-ca
  namespace: mcp-synthetic-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: mcp-synthetic-root-ca
