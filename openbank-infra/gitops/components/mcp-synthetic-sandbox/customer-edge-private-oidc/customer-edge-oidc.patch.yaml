---
# Rollout is a CRD. Guard the positions before changing the built-in environment list.
- op: test
  path: /spec/template/spec/containers/0/name
  value: customer-edge
- op: test
  path: /spec/template/spec/containers/0/env/14
  value:
    name: QUARKUS_CONFIG_LOCATIONS
    value: /mnt/msg-config/override.properties
- op: test
  path: /spec/template/spec/containers/0/env/15/name
  value: QUARKUS_OIDC_AUTH_SERVER_URL
- op: replace
  path: /spec/template/spec/containers/0/env/14/value
  value: /mnt/msg-config/override.properties,/mnt/mcp-oidc-config/private-oidc.properties
- op: replace
  path: /spec/template/spec/containers/0/env/15
  value:
    name: QUARKUS_OIDC_AUTH_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: customer-edge-mcp-oidc-origins
        key: discovery-url
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: QUARKUS_OIDC_TOKEN_ISSUER
    valueFrom:
      configMapKeyRef:
        name: customer-edge-mcp-oidc-origins
        key: issuer-url
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-oidc-config
    mountPath: /mnt/mcp-oidc-config
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: mcp-oidc-ca
    mountPath: /mnt/mcp-oidc-ca
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-oidc-config
    configMap:
      name: customer-edge-mcp-oidc-tls
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: mcp-oidc-ca
    secret:
      secretName: customer-edge-mcp-oidc-trust
      items:
        - key: ca.crt
          path: ca.crt
