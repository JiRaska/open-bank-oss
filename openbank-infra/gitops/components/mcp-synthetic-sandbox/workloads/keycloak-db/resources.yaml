apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mcp-synthetic-keycloak-db
  namespace: mcp-synthetic-sandbox
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  enableSuperuserAccess: false
  storage:
    storageClass: gp3
    size: 2Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-synthetic-keycloak-db-ingress
  namespace: mcp-synthetic-sandbox
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: mcp-synthetic-keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-synthetic-keycloak
      ports:
        - protocol: TCP
          port: 5432
