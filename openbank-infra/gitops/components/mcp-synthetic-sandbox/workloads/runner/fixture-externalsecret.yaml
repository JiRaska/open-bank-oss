apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-synthetic-fixture
  namespace: mcp-synthetic-sandbox
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-22"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: mcp-synthetic-fixture
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: passkey.json
      remoteRef:
        key: mcp-synthetic/runner
        property: passkey.json
    - secretKey: device.pem
      remoteRef:
        key: mcp-synthetic/runner
        property: device.pem
    - secretKey: party-id
      remoteRef:
        key: mcp-synthetic/runner
        property: party-id
    - secretKey: device-id
      remoteRef:
        key: mcp-synthetic/runner
        property: device-id
    - secretKey: read-tool-args.json
      remoteRef:
        key: mcp-synthetic/runner
        property: read-tool-args.json
    - secretKey: currency
      remoteRef:
        key: mcp-synthetic/runner
        property: currency
