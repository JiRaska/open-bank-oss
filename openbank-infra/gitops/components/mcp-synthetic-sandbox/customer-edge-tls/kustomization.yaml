---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: customer-edge-rollout.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      namespace: customer-edge
      name: customer-edge
  - path: customer-edge-service.yaml
    target:
      version: v1
      kind: Service
      namespace: customer-edge
      name: customer-edge
  - path: customer-edge-ingress-policy.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      namespace: customer-edge
      name: customer-edge-ingress-allow-list
