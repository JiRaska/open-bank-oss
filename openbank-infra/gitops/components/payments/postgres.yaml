# Daily base backups for the payments clusters (ADR-0035 / C5). WAL archiving alone is
# not restorable — PITR needs a base backup to replay WAL onto. Schedules are staggered
# across an off-peak 03:25–04:35 UTC window (the original fleet batches at 02:19) to spread
# the S3/NAT egress. CNPG cron is 6-field (sec min hour dom mon dow).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: transaction-db-daily
  namespace: payments
spec:
  schedule: "0 25 3 * * *"
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: transaction-db
---
