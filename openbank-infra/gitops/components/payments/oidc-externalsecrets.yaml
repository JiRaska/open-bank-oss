      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        # The shared `openbank-services` client secret, the same KV entry every payments service
        # reads. A per-service key here would be an entry nobody wrote: ESO answers "Secret does not
        # exist", the Secret is never created, and the pod sits in CreateContainerConfigError for its
        # whole life with no alert naming the cause (#3471).
        key: account-service
        property: OIDC_CLIENT_SECRET
