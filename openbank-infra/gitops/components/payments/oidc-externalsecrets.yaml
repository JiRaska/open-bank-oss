# ADR-0171: vop-service OIDC client secret (Verification of Payee).
# #1195 shipped the Rollout with `OIDC_CLIENT_SECRET <- secretKeyRef: vop-oidc` but no
# ExternalSecret to materialise it, so the pod sat in CreateContainerConfigError from its
# first admission — the image and the DB cluster were fine, the secret simply did not exist.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vop-oidc
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: vop-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 1: sepa-payment's OWN Keycloak client `openbank-sepa-payment` (ROLE_API only), used ONLY by
# the money-path rest-clients that select the named oidc-client `m2m`. Deliberately NOT the
# shared `account-service` KV entry: that holds the shared `openbank-services` secret, and a
# per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sepa-payment-m2m-oidc
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: sepa-payment-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/sepa-payment
        property: client_secret
---
