# OIDC client secrets for payment pipeline services, projected from Vault by the
# External Secrets Operator (ClusterSecretStore `vault-kv`). All services share
# the single Keycloak confidential client `openbank-services`, so the secret VALUE
# is the same one stored in Vault under key `account-service` — reuse it.
# creationPolicy Owner + deletionPolicy Retain mirrors ledger-service pattern.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transaction-service-oidc
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: transaction-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
