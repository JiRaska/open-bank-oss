# card-processing-service keystore (ADR-0283 phase 1, #8809). Projects the PKCS#12 Strimzi mints for
# the KafkaUser of the same name; without it the producer cannot connect on tls:9093 at all, because
# the cluster runs allow.everyone.if.no.acl.found=false.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: card-processing-service-kafka-keystore
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: card-processing-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: card-processing-service
---
