# Kafka mTLS keystores/truststore projected from `messaging` into `payments`
# (ADR-0137). Source secrets are minted by the Strimzi User Operator
# (per-KafkaUser keystores) and the Strimzi Cluster Operator (cluster-CA cert),
# read via the kafka-messaging-certs ClusterSecretStore (kubernetes provider).
#
# `dataFrom.extract` copies every key of the source secret verbatim, which
# preserves the BINARY PKCS#12 (`user.p12` / `ca.p12`) byte-for-byte — a
# per-key `data` mapping risks mangling binary values. The payment Rollouts
# mount `user.p12` as the SSL keystore and `ca.p12` as the truststore, and read
# `user.password` / `ca.password` as env (see payments-services.yaml).
#
# deletionPolicy: Retain so a transient store/RBAC blip never deletes a live
# keystore out from under a running money-path pod.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-1"
  name: transaction-service-kafka-keystore
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: transaction-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: transaction-service
