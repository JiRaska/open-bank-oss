# Kafka topics for the payment pipeline, owned by the Strimzi topic operator
# (must live in the `messaging` namespace where the operator watches).
# Topics are declared explicitly — the broker does NOT auto-create topics.
# Single partition + RF 1 for the single-broker sandbox; prod should raise
# partitions for parallelism and RF to 3. 7-day retention matches the default
# settlement window.
---
# transaction-service: saga-initiated events
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.transactions.transaction.initiated
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
