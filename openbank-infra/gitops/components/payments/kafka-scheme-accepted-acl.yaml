# Strimzi mTLS identities + ACLs for the `payment.scheme-accepted` money path
# (ADR-0108 threat model §2a; re-introduced under ADR-0137 TOGETHER WITH the
# tls:9093 listener + per-service client mTLS — the first removal in #2554 was
# premature because no TLS listener existed, so the anonymous consumer was the
# only thing the ACLs could deny).
#
# Threat (transaction-service threat model §2a): a rogue/misconfigured producer
# publishes a forged SchemeAcceptedEvent to `payment.scheme-accepted` and drives
# an unauthorised settlement in the money-path engine. SchemeAcceptedConsumer
# books it with no party-level SCA (system-initiated). Mitigation = only the
# four payment rails may Write, only transaction-service may Read.
#
# Identity model (ADR-0137): mTLS gives each *service* exactly one client cert =
# one KafkaUser = one principal for ALL of its Kafka traffic, so KafkaUsers are
# named after the service, not after a per-topic role. A KafkaUser's ACLs list
# everything that service may do, and a resource with NO matching ACL is DENIED to
# every principal (see kafka.yaml), so each service needs an ACL for EVERY topic it
# touches. This comment used to say the
# opposite — that resources without ACLs "stay open under
# allow.everyone.if.no.acl.found=true", so a service's own domain-event topics
# needed none. That was true until #2794 flipped the cluster to
# `allow.everyone.if.no.acl.found: "false"` (components/kafka/kafka.yaml:118) and
# was never corrected here. The stale prose is what made the missing producer
# grants below read as deliberate: domestic-payment's own event topic had no
# Write grant and 13 outbox rows went DEAD (#3271).
#
# These live in `messaging` (where the Strimzi User Operator watches); the User
# Operator mints a per-user Secret of the same name there (user.crt/key/p12 +
# user.password + ca.crt). Those secrets are projected into the `payments`
# namespace by External Secrets — see kafka-mtls-externalsecrets.yaml.
---
# ── Rail producers: Write to payment.scheme-accepted ────────────────────────
# NOTE: today the four rails settle over HTTP (SettlementAdapter →
# transaction-service REST), so they do not yet publish to this topic; these
# Write grants provision the ADR-0108 event path for when it is wired, and make
# the topic deny-by-default for everyone else in the meantime.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: sepa-payment
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Its own domain-event topic. Missing until #3271: with the cluster
      # deny-by-default, the outbox dispatcher could not publish at all.
      - resource: { type: topic, name: openbank.sepa.payment.events, patternType: literal }
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: sepa-instant
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # sepa-instant's own domain-event stream (kafka-producer-sct-inst-events-out ->
      # openbank.sepa.instant.events). Missing here, the producer got "Topic authorization
      # failed" once the cluster stopped allowing ANONYMOUS/no-ACL writes, and a submit blocked
      # on the failing publish. Prefix covers the events topic + any sibling instant streams.
      - resource:
          type: topic
          name: openbank.sepa.instant.
          patternType: prefix
        operations: [Write, Describe, Create]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: domestic-payment
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Its own domain-event topic. Missing until #3271, which measured the cost:
      # 13 outbox rows DEAD because every publish was denied.
      - resource: { type: topic, name: openbank.domestic.payment.events, patternType: literal }
        operations: [Write, Describe]
        host: "*"
      # Expand-first delegated-spend projection. ACLs may land before the consumer is activated;
      # absence of a mounted properties override keeps the workload inert.
      - resource:
          type: topic
          name: openbank.delegation.spend-reservation-state
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.dlq.domestic-payment.delegated-spend-reservation-state-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: domestic-payment-delegated-spend-binding
          patternType: literal
        operations: [Read]
        host: "*"
      # #8432: TRANSACTION_FAILED notification requests for a scheme-rejected payment. The topic
      # already carries ACLs, so without this grant every emit fails at runtime with
      # TOPIC_AUTHORIZATION_FAILED and no unit test can see it.
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: swift-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # swift-service's own domain-event stream (swift-events-out ->
      # openbank.payments.swift.event). Missing here, the producer gets "Topic
      # authorization failed" and a synchronous send HANGS on the failing publish —
      # same trap fixed for sepa-instant above (#1717).
      - resource:
          type: topic
          name: openbank.payments.swift.
          patternType: prefix
        operations: [Write, Describe, Create]
        host: "*"
---
# ── Consumer: transaction-service ───────────────────────────────────────────
# Reads scheme-accepted, writes its DLQ, and joins its dedicated consumer group.
# The group name MUST match the live SmallRye channel group.id — aligned to
# `transaction-scheme-accepted-cg` in transaction-service application.yaml under
# this same change (it was `openbank-transaction-service`; renaming is safe
# because the topic is empty — nothing produces to it yet).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: transaction-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Its own domain-event topic — consumed by audit-service and analytics-sink.
      - resource: { type: topic, name: openbank.transactions.transaction.initiated, patternType: literal }
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: payment.scheme-accepted.dlq
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: transaction-scheme-accepted-cg
          patternType: literal
        operations: [Read]
        host: "*"
---
# ── clearing-service (#2665 Tier 1) ─────────────────────────────────────────
# Produces openbank.clearing.batch.event (net settlement obligations to ledger) and — ADR-0281 —
# self-consumes it on channel `clearing-net-settlement-in` (group.id falls back to
# quarkus.application.name = openbank-clearing-service) to post the net-settlement journal, with
# an explicit per-channel DLQ (#5745).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: clearing-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.clearing.batch.event
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.clearing.batch.event
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: openbank-clearing-service
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: topic
          name: openbank.dlq.clearing-service.clearing-net-settlement-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── card-issuance-service (issue #686 sweep) ────────────────────────────────
# First mTLS wiring for this service — it has never had a KafkaUser before now
# (unlike the other five #686 services, which already had one with a wrong
# ACL/group mismatch). Consumes openbank.party.events (group: cardissuance-party,
# GDPR Art.17 erasure -> PartyEventConsumer anonymises cardholder PII) and
# produces its own domain events to openbank.cards.events, which is unlocked
# (no ACL needed, same identity model as every other service here). Required
# because the cluster's allow.everyone.if.no.acl.found is "false" (kafka.yaml) —
# without mTLS + this ACL the consumer cannot connect on tls:9093 at all, and
# plain:9092 denies User:ANONYMOUS on every topic fleet-wide.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Deployment rolls the pod onto mTLS; lower waves sync
    # first and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: card-issuance-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Its own domain-event topic.
      - resource: { type: topic, name: openbank.cards.events, patternType: literal }
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.delegation.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # DLQ for the delegation-events-in channel — same #1476 class as party-events-in.
      - resource:
          type: topic
          name: dead-letter-topic-delegation-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: cardissuance-party
          patternType: literal
        operations: [Read]
        host: "*"
      - resource:
          type: group
          name: cardissuance-delegation
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `party-events-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.card-issuance.party-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── standing-order-service (#889 / ONCE feature) ────────────────────────────
# Late mTLS wiring — same gap as card-issuance-service above. standing-order was
# listed as "non-deployed, RBAC pre-registered" in the ADR-0137 fleet sweep
# (kafka.yaml), then deployed anyway (recurring-order engine, #889; ONCE one-off
# payments) WITHOUT its mTLS manifests. On the plaintext listener it authenticates
# as User:ANONYMOUS, which allow.everyone.if.no.acl.found=false denies on every
# resource — so its execution-trigger consumer got GroupAuthorizationException on
# group `openbank-standing-order-service` and never joined, killing the whole
# standing-order execution pipeline in sandbox.
#
# Self-consume model (#889): the outbox dispatches due events to
# openbank.standing-orders.order.event (channel standing-order-events-out) and
# StandingOrderDueConsumer reads the SAME topic (channel standing-order-due-in) to
# initiate the real SEPA payment — so this one KafkaUser needs BOTH Write and Read
# on that topic, plus Read on its service-scoped consumer group (group.id falls
# back to quarkus.application.name = openbank-standing-order-service).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Deployment rolls the pod onto mTLS; lower waves sync
    # first and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: standing-order-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.standing-orders.order.event
          patternType: literal
        operations: [Read, Write, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-standing-order-service
          patternType: literal
        operations: [Read]
        host: "*"
      # #5745: SmallRye dead-letter topic for the `standing-order-due-in` channel (failure-strategy:
      # dead-letter-queue, set in the service's application.yaml). Without Write here the DLQ
      # send itself FAILS and the consumer wedges on the very failure it was meant to park —
      # the DLQ then makes things worse than the default `fail`, not better.
      - resource:
          type: topic
          name: openbank.dlq.standing-order.standing-order-due-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# ── External Secrets reader (ADR-0137) ──────────────────────────────────────
# The Strimzi User Operator writes the KafkaUser keystores (and the cluster CA
# truststore) as Secrets in THIS namespace (messaging), but the services run in
# `payments`. External Secrets' kubernetes provider reads them here on behalf of
# the ExternalSecrets in `payments` (kafka-mtls-externalsecrets.yaml), using the
# ServiceAccount below. Least privilege: `get` only, restricted by name to the
# five user keystores + the public cluster-CA cert secret — NOT list/watch, and
# NOT the CA *signing-key* secrets (openbank-cluster-cluster-ca /
# -clients-ca-...). If ESO logs an RBAC list/watch error for the kubernetes
# provider on this version, widen to list+watch on secrets (see runbook 0008).
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: eso-kafka-cert-reader
  namespace: messaging
  labels:
    app.kubernetes.io/part-of: payments
    openbank.io/purpose: kafka-mtls-cert-projection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: eso-kafka-cert-reader
  namespace: messaging
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    # DERIVED-CHECKED, not trusted: check-kafka-cert-reader-grant.py (gate
    # kafka-cert-reader-grant, enforced) compares this list BOTH ways against every
    # ExternalSecret that reads the kafka cert store. Adding a service without adding it
    # here is now a build failure rather than a pod that will not start (#2872/#2851);
    # a grant nothing reads fails too.
    resourceNames:
      - transaction-service
      - sepa-payment
      - sepa-instant
      - domestic-payment
      - swift-service
      # Tier 1 money-path services (#2665): ledger, balance, account, clearing
      - ledger-service
      - balance-service
      - account-service
      - clearing-service
      # Tier 2a (#2665): sca-service
      - sca-service
      - fx-service
      # Tier 2c (#2665): dispute-service
      - dispute-service
      - pid-service
      - interest-service
      - psd2-service
      - sanctions-service
      - statement-service
      - party-service
      - notification-service
      - aml-service
      - consent-service
      - fraud-service
      - lending-service
      - onboarding-service
      # Tier 2c (#2665): no-gitops services — RBAC pre-registered for when gitops is added
      - card-issuance-service
      - sdd-service
      - standing-order-service
      - tpp-registry-service
      - audit-service
      - kyc-service
      - anacredit-service               # issue #638: LoanStageEventConsumer (ADR-0037 follow-up)
      - agent-service                   # issue #686: oversight-triggers consumer, ns platform (first ESO client there)
      - document-service                # ADR-0161/0162: document lifecycle events, ns documents (first ESO client there)
      - customer-edge                   # ADR-0086 audit trail + ADR-0072 resume, ns customer-edge (first ESO Kafka client there); missed by the #2665 sweep
      - analytics-sink                  # ADR-0022/0069: analytics bronze consumer (party/kyc/consent/sca/documents/onboarding-funnel), ns analytics (first ESO client there)
      - campaign-service                # ADR-0200: campaign journey delivery requests, ns campaign (first ESO client there); missing entry blocked the whole sandbox rollout at sync-wave -1 (#2749)
      - copilot-service                 # issue #3881: PARTY_ERASED consumer (GDPR Art. 17, #3875), ns platform — second ESO Kafka client there after agent-service, sharing that namespace's kafka-cluster-ca-truststore rather than duplicating it
      - delegation-service              # ADR-0232: grant lifecycle producer, ns delegation (first ESO client there); same #2749 failure, observed again — the keystore ExternalSecret sat at SecretSyncedError and ArgoCD never advanced past sync-wave -1, so all 11 wave-0 resources stayed OutOfSync and no pod was ever created
      - engagement-service              # ADR-0220 D3.5: LendingArrearsEventConsumer + PartyErasureConsumer, ns engagement (first ESO Kafka client there); same #2749 class — grant this or the keystore ExternalSecret never syncs
      - security-scanner                # issue #3393: last fleet workload without a KafkaUser — scan-event + ICT-incident producer, ns security-scanner (first ESO client there)
      - kafka-ui                        # issue #3393: the cluster-browsing console, and the only workload that was actually SPEAKING on :9092 — every DESCRIBE denied as User:ANONYMOUS. Unusually, it runs IN `messaging`, so this projection does not cross a namespace; it goes through ESO anyway to stay in this inventory (see components/kafka/kafka-ui-mtls.yaml)
      - case-coordinator                # ADR-0244: proposal-events producer (case_outbox), ns platform — third ESO Kafka client there after agent-service and copilot-service, sharing that namespace's kafka-cluster-ca-truststore
      - billing-service                 # issue #4701: fee-event outbox producer, ns billing (first ESO client there); had been failing since the topic was introduced (SmallRye default localhost:9092, no KafkaUser/cert ever provisioned)
      # Incentive lifecycle producer. The corresponding ExternalSecret is staged without a
      # Deployment, so this narrowly permits ESO to project only this Strimzi-issued client key.
      - incentive-service
      - openbank-cluster-cluster-ca-cert
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: eso-kafka-cert-reader
  namespace: messaging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-kafka-cert-reader
subjects:
  - kind: ServiceAccount
    name: eso-kafka-cert-reader
    namespace: messaging
---
# Let the External Secrets controller mint short-lived tokens for the reader SA
# (the ClusterSecretStore authenticates via auth.serviceAccount → TokenRequest).
# Controller SA assumed to be external-secrets/external-secrets (the Helm
# default in apps/external-secrets.yaml) — verify before apply (runbook 0008).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: eso-kafka-cert-reader-tokenrequest
  namespace: messaging
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
    resourceNames: [eso-kafka-cert-reader]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the payments Rollouts roll pods onto mTLS; lower waves sync first
    # and ArgoCD blocks on the ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: eso-kafka-cert-reader-tokenrequest
  namespace: messaging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-kafka-cert-reader-tokenrequest
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
