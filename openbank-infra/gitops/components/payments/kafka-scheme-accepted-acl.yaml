# Strimzi KafkaUser ACLs for payment.scheme-accepted (issue #2013, ADR-0108 hardening).
#
# Threat: a rogue producer on this topic triggers an unauthorised settlement in
# transaction-service (§2a of the transaction-service threat model).
#
# Fix: mTLS client authentication + broker-level ACLs.
#   - PRODUCERS: sepa-payment, sepa-instant, domestic-payment, swift-service
#                (the four services that receive pacs.002 ACSC from the scheme)
#   - CONSUMER:  transaction-service (SchemeAcceptedConsumer, ADR-0108)
#
# Namespace: messaging — where the Strimzi User Operator watches.
# Cluster label must match the Kafka CR name (openbank-cluster).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: sepa-payment-scheme-accepted-producer
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: sepa-instant-scheme-accepted-producer
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: domestic-payment-scheme-accepted-producer
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: swift-service-scheme-accepted-producer
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: transaction-scheme-accepted-consumer
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: payment.scheme-accepted
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: payment.scheme-accepted.dlq
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: transaction-scheme-accepted-cg
          patternType: literal
        operations: [Read]
        host: "*"
