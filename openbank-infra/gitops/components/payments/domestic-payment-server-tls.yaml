# SPDX-License-Identifier: Apache-2.0
# Private-CA server identity for the parallel east-west mTLS listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: domestic-payment-server-tls
  namespace: payments
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: domestic-payment-server-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - domestic-payment.payments.svc
    - domestic-payment.payments.svc.cluster.local
  usages:
    - digital signature
    - server auth
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
