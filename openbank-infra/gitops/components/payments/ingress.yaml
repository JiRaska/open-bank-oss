# Public API Ingress for the payment pipeline (payments namespace).
# Routes /api/v1/sepa-payments, /api/v1/domestic-payments, /api/v1/sepa-instant-payments
# and /api/v1/transactions to the respective ClusterIP services. All paths require
# a bearer token (Keycloak openbank realm), and the SERVICES validate it via OIDC —
# the edge does NOT authenticate these requests (there is no auth-url here). The edge
# only terminates TLS and rate-limits.
#
# Separate from the admin-ui Ingress (admin.open-bank.tech) — this is the developer
# REST API surface, not the operator UI.
#
# TLS: letsencrypt-prod via cert-manager DNS-01; external-dns publishes the A record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api
  namespace: payments
  annotations:
    # DNS moved to the Envoy Gateway route (httproute.yaml), together with the three other
    # api.open-bank.tech Ingresses. This makes external-dns ignore this Ingress; it stays as the
    # rollback until a later change deletes it.
    external-dns.kubernetes.io/controller: gateway-api-cutover-pending
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Per-client rate limiting for the public sandbox API (auth-gated, but bound flood/cost).
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # No edge auth and no header rewriting, on purpose. Two annotations that claimed
    # otherwise were removed (#11258) because ingress-nginx never acted on either:
    #   - `auth-response-headers` only copies headers back from an `auth-url`
    #     sub-request; with no auth-url the controller skips the whole external-auth
    #     block, so it enforced nothing (auth is the services' OIDC check, above).
    #   - `proxy-set-headers` is a controller-ConfigMap key, not an Ingress annotation,
    #     and the `payments/payments-api-headers` ConfigMap it named never existed.
    # The original Host already reaches the backends: ingress-nginx sends
    # `proxy_set_header Host $best_http_host` for every location by default.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.open-bank.tech
      secretName: payments-api-tls
  rules:
    - host: api.open-bank.tech
      http:
        paths:
          # SEPA Credit Transfer (SCT) payments — POST /api/v1/sepa-payments
          - path: /api/v1/sepa-payments
            pathType: Prefix
            backend:
              service:
                name: sepa-payment
                port:
                  number: 8115
          # Czech domestic payments (CERTIS) — POST /api/v1/domestic-payments
          - path: /api/v1/domestic-payments
            pathType: Prefix
            backend:
              service:
                name: domestic-payment
                port:
                  number: 8116
          # SEPA Instant Credit Transfer (SCT Inst, 10s) — POST /api/v1/sepa-instant-payments
          - path: /api/v1/sepa-instant-payments
            pathType: Prefix
            backend:
              service:
                name: sepa-instant
                port:
                  number: 8127
          # Transaction saga read — GET /api/v1/transactions/{id}
          - path: /api/v1/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8102
