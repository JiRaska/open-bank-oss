# Private-CA client certificate for sepa-payment's mTLS calls to document-service (8443, client auth
# REQUIRED) — the DocumentPreviewAdapter payment-document preview (#10383). Same shape as notification-internal-tls and sca-internal-tls:
# tls.crt/tls.key identify the caller, ca.crt trusts document-service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sepa-payment-internal-tls
  namespace: payments
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: sepa-payment-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  commonName: sepa-payment.payments.svc
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
