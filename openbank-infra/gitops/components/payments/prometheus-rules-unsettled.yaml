# SPDX-License-Identifier: Apache-2.0
# Unsettled-booking age alerts, one PrometheusRule per payment rail (#13623).
#
# Each rail books its customer leg in transaction-service only on a strictly matched HTTP 201 +
# COMPLETED answer. Every other answer (mismatch, a FAILED replay, a 409, an unexpected status, a
# transport error) leaves the payment holding with its durable booking clock open. Because
# transaction-service replays the stored answer for a key, a deterministic failure is returned on
# every retry, so retrying never resolves it. These rules are what notices.
#
# Signals (emitted by each rail, Micrometer names in the service docs):
#   openbank_payment_booking_tracked_pending_oldest_age_seconds{rail}  -- oldest open booking clock
#   openbank_payment_refund_unsettled_oldest_age_seconds{rail,operation="refund"} -- SEPA returns
# Both are refreshed by a 30s @Scheduled sweep, hence `subject_period: 30s`. The [10m] min_over_time
# makes a single fresh pod, or one scrape of a value that has just crossed the line, unable to fire:
# the whole window must sit above the SLA. A cold pod reads NaN, which compares false and never
# fires; a sweep that stops refreshing is WorkflowLivenessStale's job (`sepa-booking-age`,
# `sepa-refund-unsettled-age`, `domestic-booking-age`, `swift-booking-age`), not this rule's.
#
# The age is a LOWER bound: rows with unknown historical coverage are counted separately in
# openbank_payment_booking_unknown_coverage and never suppress a known overdue age.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-sepa-payment-unsettled-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: sepa-payment
spec:
  groups:
    - name: openbank.sepa-payment.unsettled
      rules:
        - alert: SepaPaymentBookingUnsettled
          # SLA 30m. The obligation starts at scheme acceptance (ACSC): the money has left via the
          # scheme and the customer's debit is not booked, so the account shows funds it no longer
          # has. The adapter's own retries finish in under ~30 s and NOTHING retries after that
          # (the payment is held in PROCESSING), so any open clock older than a few minutes is
          # already permanent. 30m keeps a deploy or a short transaction-service outage quiet while
          # leaving the operator the rest of the business day to book inside PSD2 Art. 83's
          # end-of-next-business-day execution window.
          expr: |
            max by (rail) (
              min_over_time(openbank_payment_booking_tracked_pending_oldest_age_seconds{rail="SEPA"}[10m])
            ) > 1800
          labels:
            severity: critical
            service: sepa-payment
          annotations:
            subject_period: 30s
            summary: "SEPA payment accepted by the scheme but its debit is unbooked for over 30 minutes"
            description: >-
              The oldest SEPA payment with an open booking clock has waited at least {{ $value | humanizeDuration }}.
              It is held in PROCESSING and nothing retries it. Read the outcome under
              sepa-settlement-<paymentId> in transaction-service, then reconcile, reverse or re-drive.
              openbank_payment_unsettled_total{rail="SEPA"} says which answer it got.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0032-payment-rail-unsettled-booking.md#sepa-payment-outbound-booking"
        - alert: SepaPaymentRefundUnsettled
          # SLA 1h. The obligation starts when a pacs.004 return is received: the funds are back at
          # the bank, the customer is not yet credited. A 409/202/unproven reversal holds the payment
          # in its non-terminal recovery state (never RETURNED) and answers the sender 503; nothing
          # retries on its own. PSD2 Art. 87(2) wants the credit value-dated on the receipt day, so
          # one hour leaves room to re-drive the same day even for a late-afternoon return.
          expr: |
            max by (rail) (
              min_over_time(openbank_payment_refund_unsettled_oldest_age_seconds{rail="SEPA", operation="refund"}[10m])
            ) > 3600
          labels:
            severity: critical
            service: sepa-payment
          annotations:
            subject_period: 30s
            summary: "SEPA return received but the customer refund is unproven for over an hour"
            description: >-
              The oldest unresolved SEPA return has waited at least {{ $value | humanizeDuration }}. The payment
              is held out of RETURNED because no reversal was proven. Read the outcome under
              sepa-reversal-<paymentId> in transaction-service, then reconcile or re-drive the return.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0032-payment-rail-unsettled-booking.md#sepa-payment-refund-reversal"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-domestic-payment-unsettled-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: domestic-payment
spec:
  groups:
    - name: openbank.domestic-payment.unsettled
      rules:
        - alert: DomesticPaymentBookingUnsettled
          # SLA 1h. The obligation starts at SENT_TO_CLEARING: the payment has left through CERTIS
          # and the debit is not booked. Unlike SEPA this rail DOES retry -- the settlement activity
          # runs with unlimited attempts, backoff capped at 5 min, for 7 days -- so a transient
          # transaction-service outage heals itself. An hour is ~12 capped retries: past that the
          # answer is deterministic (a replayed mismatch or FAILED) and waiting the remaining week
          # for the workflow to fail only delays the operator. Distinct from
          # DomesticPaymentStuckInClearing, which watches the clearing STATUS age over a day.
          expr: |
            max by (rail) (
              min_over_time(openbank_payment_booking_tracked_pending_oldest_age_seconds{rail="DOMESTIC_CZK"}[10m])
            ) > 3600
          labels:
            severity: critical
            service: domestic-payment
          annotations:
            subject_period: 30s
            summary: "Domestic payment sent to clearing but its debit is unbooked for over an hour"
            description: >-
              The oldest domestic payment with an open booking clock has waited at least {{ $value | humanizeDuration }}.
              Temporal keeps retrying with the same key, which cannot fix a deterministic answer. Read the
              outcome under domestic-settlement-<paymentId> in transaction-service, then reconcile, reverse
              or re-drive. openbank_payment_unsettled_total{rail="DOMESTIC_CZK"} says which answer it got.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0032-payment-rail-unsettled-booking.md#domestic-payment-outbound-booking"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-swift-unsettled-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: swift-service
spec:
  groups:
    - name: openbank.swift.unsettled
      rules:
        - alert: SwiftBookingUnsettled
          # SLA 30m. The obligation starts at scheme acceptance (ACSC -> SENT): the MT103 has left and the
          # ordering customer's debit is not booked. swift-service makes ONE transaction-service call, with no
          # retry and no re-drive path, so a message whose clock is still open a few minutes later is held for
          # good. The age also covers two cases the outcome counter never sees: a message with no ordering
          # account id, and an unparseable value date, both return not-settled without calling
          # transaction-service. An MT103 carries an explicit value date (field 32A) the debit has to be booked
          # by, so 30m leaves the operator the same business day, matching SEPA's outbound SLA.
          expr: |
            max by (rail) (
              min_over_time(openbank_payment_booking_tracked_pending_oldest_age_seconds{rail="SWIFT"}[10m])
            ) > 1800
          labels:
            severity: critical
            service: swift-service
          annotations:
            subject_period: 30s
            summary: "SWIFT message accepted by the scheme but its debit is unbooked for over 30 minutes"
            description: >-
              The oldest SWIFT message with an open booking clock has waited at least {{ $value | humanizeDuration }}.
              It is held in SENT; nothing retries it and swift-service has no re-drive path. Read the outcome
              under swift-settlement-<messageId> in transaction-service, then reconcile or reverse.
              openbank_payment_unsettled_total{rail="SWIFT"} says which answer it got.
            runbook_url: "https://github.com/JiRaska/open-bank-oss/blob/main/docs/runbooks/0032-payment-rail-unsettled-booking.md#swift-outbound-booking"
