# SPDX-License-Identifier: Apache-2.0
# Per-service PrometheusRule alerts for the payments namespace (money-path, ADR-0077/0079).
# Covers: transaction-service, clearing-service, swift-service, sepa-payment, sepa-instant,
# domestic-payment, sdd-service. Complements the fleet-wide tier-1 rules with payment-rail
# specific saga and settlement observability.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-transaction-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: transaction-service
spec:
  groups:
    - name: openbank.transaction.health
      rules:
        - alert: TransactionServiceDown
          expr: up{job="observability/openbank-services", namespace="payments", container="transaction-service"} == 0
          for: 2m
          labels:
            severity: critical
            service: transaction
          annotations:
            summary: "transaction-service is unreachable"
            description: "transaction-service (payment saga orchestrator) has been unreachable for >2m — all payment rails are blocked."
        - alert: TransactionOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="transaction"} > 100
          for: 15m
          labels:
            severity: critical
            service: transaction
          annotations:
            summary: "transaction outbox backlog stuck"
            description: "transaction-service outbox has >100 unrelayed rows for >15m — payment events are not being dispatched."
        - alert: TransactionSagaStuck
          # A saga stuck >5m = payment is in a terminal-unknown state.
          expr: openbank_transaction_sagas_stuck_total > 0
          for: 5m
          labels:
            severity: critical
            service: transaction
          annotations:
            summary: "Payment sagas are stuck in transaction-service"
            description: "{{ $value }} payment saga(s) have been in an incomplete state for >5m — manual triage required."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-clearing-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: clearing-service
spec:
  groups:
    - name: openbank.clearing.health
      rules:
        - alert: ClearingServiceDown
          expr: up{job="observability/openbank-services", namespace="payments", container="clearing-service"} == 0
          for: 2m
          labels:
            severity: critical
            service: clearing
          annotations:
            summary: "clearing-service is unreachable"
            description: "clearing-service has been unreachable for >2m — end-of-day settlement batch is at risk."
        - alert: ClearingOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="clearing"} > 100
          for: 15m
          labels:
            severity: critical
            service: clearing
          annotations:
            summary: "clearing outbox backlog stuck"
            description: "clearing-service outbox has >100 unrelayed rows for >15m — settlement confirmations may be delayed."
        - alert: ClearingSettlementWindowMissed
          expr: |
            increase(openbank_clearing_settlements_completed_total[1h]) == 0
            and on() hour() >= 6 and on() hour() <= 18
          for: 30m
          labels:
            severity: warning
            service: clearing
          annotations:
            summary: "No settlements completed in 1h (business hours)"
            description: "clearing-service has not completed any settlement cycles in 1h during business hours."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-swift-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: swift-service
spec:
  groups:
    - name: openbank.swift.health
      rules:
        - alert: SwiftServiceDown
          expr: up{job="observability/openbank-services", namespace="payments", container="swift-service"} == 0
          for: 2m
          labels:
            severity: critical
            service: swift
          annotations:
            summary: "swift-service is unreachable"
            description: "swift-service has been unreachable for >2m — cross-border SWIFT MT/MX payments cannot be processed."
        - alert: SwiftOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="swift"} > 50
          for: 15m
          labels:
            severity: critical
            service: swift
          annotations:
            summary: "swift outbox backlog stuck"
            description: "swift-service outbox has >50 unrelayed rows for >15m — SWIFT confirmations are not being dispatched."
        - alert: SwiftMtMessageProcessingStalled
          # SWIFT MT messages must be acknowledged within SWIFT cut-off times.
          expr: |
            increase(openbank_swift_messages_processed_total[1h]) == 0
            and on() hour() >= 7 and on() hour() <= 17
          for: 30m
          labels:
            severity: warning
            service: swift
          annotations:
            summary: "No SWIFT messages processed in 1h (business hours)"
            description: "swift-service has not processed any MT/MX messages in 1h during business hours."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-domestic-payment-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: domestic-payment
spec:
  groups:
    # domestic-payment had NO rule in this file until #3273, despite the header above listing it.
    # It was not uncovered though: prometheus-rules-tier1.yaml already carries PaymentServiceDown,
    # HighErrorRate, HighLatencyP99 and both PaymentSLO*Burn for it. All of them were green while
    # seven payments sat in RECEIVED, the oldest for six weeks — green *correctly*, because a
    # fail-closed hold answers 2xx, emits no error span, has normal latency and a healthy pod.
    # Every rule that existed measured whether the service ANSWERS. None measured whether the work
    # it accepted PROGRESSES. These rules are that second question.
    - name: openbank.domestic-payment.progress
      rules:
        - alert: DomesticPaymentStrandedBeforeClearing
          # RECEIVED and VALIDATED are hand-off states: the Temporal workflow drives a payment
          # through both within seconds. An hour there means the workflow completed without
          # advancing it (a fail-closed screening hold) or never ran at all — neither of which any
          # error-rate or latency signal can see.
          expr: |
            max by (status) (
              openbank_domestic_payments_non_terminal_oldest_age_seconds{
                service="domestic", status=~"RECEIVED|VALIDATED"
              }
            ) > 3600
          for: 10m
          labels:
            severity: critical
            service: domestic-payment
          annotations:
            summary: "Domestic payment stranded in {{ $labels.status }} for over an hour"
            description: >-
              The oldest domestic payment in {{ $labels.status }} is {{ $value | humanizeDuration }} old.
              Customer funds are neither moved nor returned and nothing else alerts on this state.
              Check for an open AML case (alert_code SCREENING_UNAVAILABLE) and whether the Temporal
              workflow for that payment completed without advancing it.
        - alert: DomesticPaymentStuckInClearing
          # SENT_TO_CLEARING legitimately waits for a clearing cycle, so this threshold is a day
          # rather than an hour — it catches a missed cycle, not a slow one.
          expr: |
            openbank_domestic_payments_non_terminal_oldest_age_seconds{
              service="domestic", status="SENT_TO_CLEARING"
            } > 86400
          for: 30m
          labels:
            severity: warning
            service: domestic-payment
          annotations:
            summary: "Domestic payment awaiting clearing for over a day"
            description: >-
              The oldest domestic payment in SENT_TO_CLEARING is {{ $value | humanizeDuration }} old —
              at least one clearing cycle has been missed, or settlement is failing silently.
        - alert: DomesticPaymentOutboxBacklogStuck
          # The gauge has been published by DomesticPaymentOutboxBacklogGauge all along; nothing
          # read it. That is why 13 events reaching DEAD on a missing Kafka ACL (#3271) went
          # unnoticed until a customer asked where their payment was.
          expr: openbank_outbox_backlog{service="domestic"} > 100
          for: 15m
          labels:
            severity: critical
            service: domestic-payment
          annotations:
            summary: "domestic-payment outbox backlog stuck"
            description: "domestic-payment outbox has >100 unrelayed rows for >15m — payment events are not being dispatched."
---
# Fraud scoring across all four scored rails (#4221). One document rather than one per rail: the
# series carry `rail=` and `service=` labels, so the rule set is DERIVED from the labels the
# adapters emit instead of being a hand-kept list that reads as full coverage when it is short.
# fx-service lives in the `fx` namespace, not `payments` — a PrometheusRule's namespace does not
# scope which series its expressions see, so the rail belongs here with its siblings.
#
# Why these expressions and not a rate over an error counter: fraud scoring was completely dead for
# the entire life of the deployment (`fraud_scores` held zero rows) and no signal anywhere said so.
# An alert on the synthetic counter alone cannot fix that — Micrometer does not create a counter
# until its first increment and a pod restart resets it — so the standing question "is scoring
# degraded right now" is answered by a gauge read from adapter state. See FraudScoringMetrics, and
# FraudScoringMetricsTest, which asserts these exact series against a real Prometheus scrape.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-fraud-scoring-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: fraud-scoring
spec:
  groups:
    - name: openbank.fraud-scoring.availability
      rules:
        - alert: FraudScoringDegraded
          # 1 = the last attempt on this pod returned a verdict the adapter invented because
          # fraud-service was unreachable. Fail-open is deliberate (the verdict is observed, never
          # enforced), so this is not a payment incident — it is "the control is not running".
          expr: openbank_fraud_scoring_degraded == 1
          for: 10m
          labels:
            severity: warning
            service: '{{ $labels.service }}'
          annotations:
            summary: "Fraud scoring degraded on the {{ $labels.rail }} rail"
            description: >-
              {{ $labels.service }} has been returning SYNTHETIC fraud verdicts for >10m — payments on
              the {{ $labels.rail }} rail are completing unscored. The adapter fails open by design, so
              nothing is blocked and no error rate rises; this gauge is the only signal. Check
              fraud-service in the `fraud` namespace and the pod's FRAUD_SERVICE_URL.
        - alert: FraudScoringNeverAttempted
          # -1, the boot value, is a distinct state from a healthy 0 on purpose. This is the alert
          # that would have fired on the original defect: every consumer resolved fraud-service to
          # localhost, so scoring never happened, and "no fraud found" was indistinguishable from
          # "no fraud scoring". A rail with genuinely no traffic for an hour is the false positive
          # to expect here — which is itself worth knowing on a payment rail.
          expr: openbank_fraud_scoring_degraded == -1
          for: 1h
          labels:
            severity: warning
            service: '{{ $labels.service }}'
          annotations:
            summary: "{{ $labels.service }} has never scored a payment for fraud since it started"
            description: >-
              The fraud-scoring gauge on {{ $labels.service }} ({{ $labels.rail }}) has read
              NEVER_ATTEMPTED for >1h. Either the rail has taken no traffic at all, or the scoring
              call site is not being reached. Cross-check row growth in `fraud_scores`.
        - alert: FraudScoringMostlySynthetic
          # The counters exist at 0.0 from the first scrape (registered eagerly, not on first
          # increment), so this ratio is well-defined from boot rather than absent until a failure.
          expr: |
            sum by (service, rail) (rate(openbank_fraud_scoring_outcomes_total{result="synthetic"}[30m]))
              /
            clamp_min(sum by (service, rail) (rate(openbank_fraud_scoring_outcomes_total[30m])), 1e-9)
              > 0.5
          for: 15m
          labels:
            severity: warning
            service: '{{ $labels.service }}'
          annotations:
            summary: "Over half of {{ $labels.rail }} fraud scores are synthetic"
            description: >-
              {{ $value | humanizePercentage }} of fraud-scoring attempts on {{ $labels.service }}
              returned an invented verdict over the last 30m — a flapping fraud-service or an open
              circuit breaker, rather than a clean outage.
