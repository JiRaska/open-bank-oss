# SPDX-License-Identifier: Apache-2.0
# Per-service PrometheusRule alerts for the payments namespace (money-path, ADR-0077/0079).
# Covers: transaction-service, clearing-service, swift-service, sepa-payment, sepa-instant,
# domestic-payment, sdd-service, settlement-service. Complements the fleet-wide tier-1 rules with payment-rail
# specific saga and settlement observability.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-transaction-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: transaction-service
spec:
  groups:
    - name: openbank.transaction.health
      rules:
        - alert: TransactionServiceDown
          expr: up{job="observability/openbank-services", namespace="payments", container="transaction-service"} == 0
          for: 2m
          labels:
            severity: critical
            service: transaction
          annotations:
            summary: "transaction-service is unreachable"
            description: "transaction-service (payment saga orchestrator) has been unreachable for >2m — all payment rails are blocked."
        - alert: TransactionOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="transaction"} > 100
          for: 15m
          labels:
            severity: critical
            service: transaction
          annotations:
            summary: "transaction outbox backlog stuck"
            description: "transaction-service outbox has >100 unrelayed rows for >15m — payment events are not being dispatched."
        - alert: TransactionSagaStuck
          # A saga stuck >5m = payment is in a terminal-unknown state.
          #
          # The series is `openbank_transaction_sagas_stuck` — a GAUGE, no `_total` suffix. It read
          # `openbank_transaction_sagas_stuck_total` until #5733: nothing has ever emitted that
          # name, so this critical money-path alert could not fire, and an alert that cannot fire
          # looks exactly like one that is correctly quiet. StuckSagaGauge in transaction-service
          # now emits it, registered eagerly at startup so the series exists at 0 rather than being
          # absent (an absent series makes this comparison match nothing, not zero).
          expr: openbank_transaction_sagas_stuck > 0
          for: 5m
          labels:
            severity: critical
            service: transaction
          annotations:
            summary: "Payment sagas are stuck in transaction-service"
            description: "{{ $value }} payment saga(s) have been in an incomplete state for >5m — manual triage required."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-clearing-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: clearing-service
spec:
  groups:
    - name: openbank.clearing.health
      rules:
        - alert: ClearingServiceDown
          expr: up{job="observability/openbank-services", namespace="payments", container="clearing-service"} == 0
          for: 2m
          labels:
            severity: critical
            service: clearing
          annotations:
            summary: "clearing-service is unreachable"
            description: "clearing-service has been unreachable for >2m — end-of-day settlement batch is at risk."
        - alert: ClearingOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="clearing"} > 100
          for: 15m
          labels:
            severity: critical
            service: clearing
          annotations:
            summary: "clearing outbox backlog stuck"
            description: "clearing-service outbox has >100 unrelayed rows for >15m — settlement confirmations may be delayed."
        # ClearingSettlementWindowMissed was REMOVED in #5733. It watched
        # `openbank_clearing_settlements_completed_total`, which nothing emits, and instrumenting it
        # would not have made the alert meaningful: clearing cycles are not scheduled here.
        # `triggerClearingCycle` and `settleBatch` are on-demand REST operations (ClearingService)
        # and the service has no `@Scheduled` sweep and no `@Incoming` consumer, so "no settlement
        # completed in the last hour" is the NORMAL resting state, not a fault. The rule asserted a
        # cadence the code does not have.
        # If a scheduled clearing cycle is ever added, the right mechanism is the fleet-wide one:
        # register it with DomainMetrics.registerWorkflowLiveness (ADR-0160) and let the existing
        # WorkflowLivenessStale rule cover it — not a bespoke throughput alert per service.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-swift-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: swift-service
spec:
  groups:
    - name: openbank.swift.health
      rules:
        - alert: SwiftServiceDown
          expr: up{job="observability/openbank-services", namespace="payments", container="swift-service"} == 0
          for: 2m
          labels:
            severity: critical
            service: swift
          annotations:
            summary: "swift-service is unreachable"
            description: "swift-service has been unreachable for >2m — cross-border SWIFT MT/MX payments cannot be processed."
        - alert: SwiftOutboxBacklogStuck
          expr: openbank_outbox_backlog{service="swift"} > 50
          for: 15m
          labels:
            severity: critical
            service: swift
          annotations:
            summary: "swift outbox backlog stuck"
            description: "swift-service outbox has >50 unrelayed rows for >15m — SWIFT confirmations are not being dispatched."
        # SwiftMtMessageProcessingStalled was REMOVED in #5733, for the same reason as
        # ClearingSettlementWindowMissed above. It watched `openbank_swift_messages_processed_total`,
        # which nothing emits, and swift-service does not ingest messages on a cadence: every entry
        # point on SwiftService (send / acknowledge / reject) is REST-driven, with no `@Scheduled`
        # sweep and no `@Incoming` consumer. An hour with no MT/MX traffic is ordinary, so the rule
        # could only ever have been noise had the metric existed. Cut-off adherence is a per-message
        # property and belongs on a per-message age or latency signal, not on a throughput floor.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-domestic-payment-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: domestic-payment
spec:
  groups:
    # domestic-payment had NO rule in this file until #3273, despite the header above listing it.
    # It was not uncovered though: prometheus-rules-tier1.yaml already carries PaymentServiceDown,
    # HighErrorRate, HighLatencyP99 and both PaymentSLO*Burn for it. All of them were green while
    # seven payments sat in RECEIVED, the oldest for six weeks — green *correctly*, because a
    # fail-closed hold answers 2xx, emits no error span, has normal latency and a healthy pod.
    # Every rule that existed measured whether the service ANSWERS. None measured whether the work
    # it accepted PROGRESSES. These rules are that second question.
    - name: openbank.domestic-payment.progress
      rules:
        - alert: DomesticPaymentStrandedBeforeClearing
          # RECEIVED and VALIDATED are hand-off states: the Temporal workflow drives a payment
          # through both within seconds. An hour there means the workflow completed without
          # advancing it (a fail-closed screening hold) or never ran at all — neither of which any
          # error-rate or latency signal can see.
          expr: |
            max by (status) (
              openbank_domestic_payments_non_terminal_oldest_age_seconds{
                service="domestic", status=~"RECEIVED|VALIDATED"
              }
            ) > 3600
          for: 10m
          labels:
            severity: critical
            service: domestic-payment
          annotations:
            summary: "Domestic payment stranded in {{ $labels.status }} for over an hour"
            description: >-
              The oldest domestic payment in {{ $labels.status }} is {{ $value | humanizeDuration }} old.
              Customer funds are neither moved nor returned and nothing else alerts on this state.
              Check for an open AML case (alert_code SCREENING_UNAVAILABLE) and whether the Temporal
              workflow for that payment completed without advancing it.
        - alert: DomesticPaymentStuckInClearing
          # SENT_TO_CLEARING legitimately waits for a clearing cycle, so this threshold is a day
          # rather than an hour — it catches a missed cycle, not a slow one.
          expr: |
            openbank_domestic_payments_non_terminal_oldest_age_seconds{
              service="domestic", status="SENT_TO_CLEARING"
            } > 86400
          for: 30m
          labels:
            severity: warning
            service: domestic-payment
          annotations:
            summary: "Domestic payment awaiting clearing for over a day"
            description: >-
              The oldest domestic payment in SENT_TO_CLEARING is {{ $value | humanizeDuration }} old —
              at least one clearing cycle has been missed, or settlement is failing silently.
        - alert: DomesticPaymentOutboxBacklogStuck
          # The gauge has been published by DomesticPaymentOutboxBacklogGauge all along; nothing
          # read it. That is why 13 events reaching DEAD on a missing Kafka ACL (#3271) went
          # unnoticed until a customer asked where their payment was.
          expr: openbank_outbox_backlog{service="domestic"} > 100
          for: 15m
          labels:
            severity: critical
            service: domestic-payment
          annotations:
            summary: "domestic-payment outbox backlog stuck"
            description: "domestic-payment outbox has >100 unrelayed rows for >15m — payment events are not being dispatched."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-card-issuance-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: card-issuance-service
spec:
  groups:
    - name: openbank.card-issuance.outbox
      rules:
        # #4005. Every one of card-issuance's 24 outbox rows was parked in terminal DEAD by a
        # latched-open circuit breaker, so the service had published zero events for its entire
        # life — and the only outbox alert this repo had, *OutboxBacklogStuck, could not see it.
        # DEAD is excluded from openbank_outbox_backlog by design (it is not work waiting to be
        # done), so a service that dead-lettered everything reads as a flat, healthy 0 backlog.
        #
        # Deliberately the openbank_outbox_dead_lettered GAUGE and not the openbank_outbox_dead
        # counter: a counter answers "since this process started", it resets on every pod restart
        # while the rows remain, and Micrometer does not create a counter until its first
        # increment — measured 2026-08-09, openbank_outbox_dead_total had ZERO series fleet-wide
        # while card-issuance held 24 DEAD rows. An alert on it would have matched nothing,
        # forever, and read exactly like "no problem".
        #
        # Threshold is > 0, not a rate: dead-lettering is terminal (ADR-0050 N5), nothing retries
        # a DEAD row, and there is no automatic drain — a single one is a permanently lost event
        # until an operator requeues it via POST /api/v1/cards/outbox/requeue. The 15m `for:`
        # only outlives a rollout window, in which the old and new pod both publish the gauge.
        #
        # EXPECTED TO FIRE ON DEPLOY, 2026-08-09. card-issuance holds the #4005 backlog — rows that
        # were never published at all — so this goes critical ~15m after the first roll and stays
        # there until an operator drains them through the requeue endpoint this change ships. That
        # is intended, and it is also the one way this alert can go wrong: a critical that is always
        # on stops being read, and this repo has already produced one. Drain the backlog in the same
        # session as the deploy. If this note is still here and the alert is still firing, the
        # backlog was not drained — that is the bug, not the alert.
        - alert: CardIssuanceOutboxDeadLettered
          expr: openbank_outbox_dead_lettered{service="card-issuance"} > 0
          for: 15m
          labels:
            severity: critical
            service: card-issuance
          annotations:
            summary: "card-issuance outbox has dead-lettered rows"
            description: >-
              {{ $value }} card outbox row(s) are parked in terminal DEAD and will never be
              retried by anything — card issued/status/limit/control events are not reaching
              openbank.cards.events. Requeue is manual and attributable
              (POST /api/v1/cards/outbox/requeue, ROLE_ADMIN, X-Operator-Id required) because
              openbank-audit-service is not idempotent: a replay appends a second, permanently
              undeletable audit record per event. Establish whether these were ever delivered
              before requeueing.

        # card-processing's outbox carries the MONEY PATH's own events — card.authorised,
        # card.declined, card.cleared, card.hold_released, and the phase-3 token and dispute
        # lifecycle (ADR-0283). A DEAD row here is a movement of a customer's money that the
        # ledger, the audit trail and every downstream consumer never heard about, and the
        # authorisation row itself is committed, so nothing else in the platform disagrees.
        #
        # NO REQUEUE ENDPOINT EXISTS on this service yet, unlike card-issuance's. That is stated
        # in the annotation rather than hidden: the operator's action today is to investigate and
        # requeue at the database, and an alert that implied a one-click remedy it does not have
        # would waste the responder's first minutes. Adding the endpoint is its own change.
        #
        # `for: 15m` for the same reason as the sibling above: it outlives a rollout window, in
        # which the old and the new pod both publish the gauge.
        - alert: CardProcessingOutboxDeadLettered
          expr: openbank_outbox_dead_lettered{service="card-processing"} > 0
          for: 15m
          labels:
            severity: critical
            service: card-processing
          annotations:
            summary: "card-processing outbox has dead-lettered rows"
            description: >-
              {{ $value }} card money-path outbox row(s) are parked in terminal DEAD and will never
              be retried by anything. The authorisation, clearing or release they describe IS
              committed in card_authorizations, so the customer's money moved and no consumer was
              told — the ledger posting, the audit trail and the customer's app are all missing it.
              There is no requeue endpoint on this service yet (unlike card-issuance): establish
              from card_outbox.last_error why they died, and requeue at the database once the cause
              is fixed.
---
# Fraud scoring across all four scored rails (#4221). One document rather than one per rail: the
# series carry `rail=` and `service=` labels, so the rule set is DERIVED from the labels the
# adapters emit instead of being a hand-kept list that reads as full coverage when it is short.
# fx-service lives in the `fx` namespace, not `payments` — a PrometheusRule's namespace does not
# scope which series its expressions see, so the rail belongs here with its siblings.
#
# Why these expressions and not a rate over an error counter: fraud scoring was completely dead for
# the entire life of the deployment (`fraud_scores` held zero rows) and no signal anywhere said so.
# An alert on the synthetic counter alone cannot fix that — Micrometer does not create a counter
# until its first increment and a pod restart resets it — so the standing question "is scoring
# degraded right now" is answered by a gauge read from adapter state. See FraudScoringMetrics, and
# FraudScoringMetricsTest, which asserts these exact series against a real Prometheus scrape.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-fraud-scoring-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: fraud-scoring
spec:
  groups:
    - name: openbank.fraud-scoring.availability
      rules:
        - alert: FraudScoringDegraded
          # 1 = the last attempt on this pod returned a verdict the adapter invented because
          # fraud-service was unreachable. Fail-open is deliberate (the verdict is observed, never
          # enforced), so this is not a payment incident — it is "the control is not running".
          expr: openbank_fraud_scoring_degraded == 1
          for: 10m
          labels:
            severity: warning
            service: '{{ $labels.service }}'
          annotations:
            summary: "Fraud scoring degraded on the {{ $labels.rail }} rail"
            description: >-
              {{ $labels.service }} has been returning SYNTHETIC fraud verdicts for >10m — payments on
              the {{ $labels.rail }} rail are completing unscored. The adapter fails open by design, so
              nothing is blocked and no error rate rises; this gauge is the only signal. Check
              fraud-service in the `fraud` namespace and the pod's FRAUD_SERVICE_URL.
        - alert: FraudScoringNeverAttempted
          # -1, the boot value, is a distinct state from a healthy 0 on purpose. This is the alert
          # that would have fired on the original defect: every consumer resolved fraud-service to
          # localhost, so scoring never happened, and "no fraud found" was indistinguishable from
          # "no fraud scoring". A rail with genuinely no traffic for an hour is the false positive
          # to expect here — which is itself worth knowing on a payment rail.
          expr: openbank_fraud_scoring_degraded == -1
          for: 1h
          labels:
            severity: warning
            service: '{{ $labels.service }}'
          annotations:
            summary: "{{ $labels.service }} has never scored a payment for fraud since it started"
            description: >-
              The fraud-scoring gauge on {{ $labels.service }} ({{ $labels.rail }}) has read
              NEVER_ATTEMPTED for >1h. Either the rail has taken no traffic at all, or the scoring
              call site is not being reached. Cross-check row growth in `fraud_scores`.
        - alert: FraudScoringMostlySynthetic
          # The counters exist at 0.0 from the first scrape (registered eagerly, not on first
          # increment), so this ratio is well-defined from boot rather than absent until a failure.
          expr: |
            sum by (service, rail) (rate(openbank_fraud_scoring_outcomes_total{result="synthetic"}[30m]))
              /
            clamp_min(sum by (service, rail) (rate(openbank_fraud_scoring_outcomes_total[30m])), 1e-9)
              > 0.5
          for: 15m
          labels:
            severity: warning
            service: '{{ $labels.service }}'
          annotations:
            summary: "Over half of {{ $labels.rail }} fraud scores are synthetic"
            description: >-
              {{ $value | humanizePercentage }} of fraud-scoring attempts on {{ $labels.service }}
              returned an invented verdict over the last 30m — a flapping fraud-service or an open
              circuit breaker, rather than a clean outage.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-settlement-progress-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: settlement-service
spec:
  groups:
    # settlement-service — a declared money_path_service (rules.yaml) — had NO rule of its own and
    # emitted NO application metric at all until #5705. It was not un-monitored, which is what made
    # it hard to see: the pod is scraped by the fleet PodMonitor, `PaymentServiceDown` in
    # prometheus-rules-tier1.yaml covers `namespace="payments"` and so covers this container, and
    # both Pyrra money-path SLOs exist for it. Every one of those measures whether the service
    # ANSWERS. None measures whether the debit -> credit -> ledger-book saga it accepted PROGRESSES,
    # and a settlement whose workflow stopped advancing answers nothing at all — its originating
    # request returned 2xx in milliseconds, hours before.
    #
    # There is deliberately no SettlementServiceDown rule here: PaymentServiceDown already owns
    # `up{job="observability/openbank-services", namespace="payments"}`, and a second rule over the
    # same target would page twice for one outage.
    #
    # Scope: this document is the PROGRESS half of #5705 only — "is this settlement still moving".
    # The OUTCOME half ("what did settlements do") is PR #5723's saga-step and terminal-state
    # counters, which this deliberately does not duplicate; the two are complementary and the
    # rule names, the metric names and the PrometheusRule object name are disjoint so they can
    # land in either order. Nothing here is a throughput floor: that is the shape #5733 deleted
    # twice from this file (ClearingSettlementWindowMissed, SwiftMtMessageProcessingStalled).
    # settlement-service is REST- and Temporal-driven with no @Scheduled sweep and no @Incoming
    # consumer, so an idle hour is the normal resting state, not a fault. What an idle service
    # must still never have is a settlement that stopped advancing, and that is an age.
    - name: openbank.settlement.progress
      rules:
        - alert: SettlementStrandedMidSaga
          # PENDING / DEBITED / CREDITED are hand-off states the Temporal workflow drives through
          # in seconds. DEBITED is the one that matters most: the payer has been debited, the payee
          # has not been credited, and the funds are in neither account.
          #
          # 3h is derived from the code, not guessed. SettlementWorkflowImpl sets a per-activity
          # scheduleToCloseTimeout of 2h (SCHEDULE_TO_CLOSE_HOURS), so a settlement can legitimately
          # sit in any one of these states for up to 2h while its next activity retries before the
          # workflow gives up and compensates. 3h clears that ceiling with an hour of slack, so this
          # rule cannot fire on a slow-but-working retry — only on a settlement whose workflow is
          # gone (worker not polling, Temporal unreachable, or a run lost).
          expr: |
            max by (status) (
              openbank_settlement_non_terminal_oldest_age_seconds{
                service="settlement", status=~"PENDING|DEBITED|CREDITED"
              }
            ) > 10800
          for: 15m
          labels:
            severity: critical
            service: settlement
          annotations:
            summary: "Settlement stranded in {{ $labels.status }} for over three hours"
            description: >-
              The oldest settlement in {{ $labels.status }} is {{ $value | humanizeDuration }} old,
              past the 2h per-activity scheduleToClose ceiling of the settlement workflow. In DEBITED
              the payer's funds have left and have not arrived; in CREDITED the money has moved but
              was never booked to the general ledger. Check whether the Temporal worker for task
              queue `openbank-settlement` is polling and whether a run exists for `settlement-<id>`.
        - alert: SettlementStuckAfterCompensation
          # The *_REVERSED states mean the saga already unwound: money was moved and moved back.
          # LEDGER_REVERSAL_UNSUPPORTED joins them (#6037): the two balance reversals succeeded and
          # only the general-ledger posting was left standing, so no customer money is in limbo —
          # the GL needs a manual correcting entry, which is the same class of record-vs-ledger
          # disagreement. SettlementWorkflowImpl always calls rejectSettlement after compensating,
          # so these states are transient by construction and a row parked in one has a workflow
          # that died between the compensation and the terminal write.
          #
          # LEDGER_NOT_POSTED and LEDGER_STATE_UNKNOWN join them for #6410, and only became
          # reachable with it: the ledger compensation is now registered BEFORE bookToLedger runs,
          # so it can actually execute, and it reports which of the three situations the general
          # ledger is in rather than assuming the worst. Neither has customer money in limbo, so
          # both belong at this severity rather than with SettlementReversalFailed below —
          # LEDGER_NOT_POSTED because the ledger was asked and holds nothing, LEDGER_STATE_UNKNOWN
          # because the balance reversals are unaffected by a ledger that could not be reached.
          # LEDGER_STATE_UNKNOWN parked for 8h is the one to act on first: it means nobody has
          # established whether the GL carries this settlement, so it could still turn out to be
          # LEDGER_REVERSAL_UNSUPPORTED.
          #
          # REVERSAL_FAILED is deliberately NOT in this rule — there the money did not come back,
          # so it is critical, not warning. See SettlementReversalFailed below.
          #
          # 8h, again from the code: the longest legitimate compensation chain starts at
          # LEDGER_REVERSED and still owes reverseCredit + reverseDebit + rejectSettlement, three
          # activities at 2h scheduleToClose each. 8h clears that 6h worst case. Warning rather than
          # critical because no customer money is in limbo — only the settlement record is.
          expr: |
            max by (status) (
              openbank_settlement_non_terminal_oldest_age_seconds{
                service="settlement",
                status=~"REVERSED|CREDITED_REVERSED|LEDGER_REVERSED|LEDGER_REVERSAL_UNSUPPORTED|LEDGER_NOT_POSTED|LEDGER_STATE_UNKNOWN"
              }
            ) > 28800
          for: 30m
          labels:
            severity: warning
            service: settlement
          annotations:
            summary: "Settlement stuck in compensation state {{ $labels.status }} for over eight hours"
            description: >-
              The oldest settlement in {{ $labels.status }} is {{ $value | humanizeDuration }} old.
              Its compensations ran but it never reached REJECTED, so the settlements table now
              disagrees with the ledger about a settlement that was unwound. Reconcile before the
              next accounting-day close.
        - alert: SettlementReversalFailed
          # REVERSAL_FAILED is written by SettlementActivitiesImpl.compensate when a balance
          # reversal was ATTEMPTED AND REFUSED — the common cause is a payee who already spent the
          # credited funds, which balance-service answers 422 and no retry resolves. So unlike every
          # other state in this group the money has left an account and has NOT been returned, and
          # recovery is a collections/dispute process rather than a workflow that will finish.
          #
          # It is separated from SettlementStuckAfterCompensation because that rule's premise —
          # "funds are safe, only the record is wrong" — is false here. Same 8h threshold (a later
          # retry can still succeed and overwrite the status, and the remaining compensation chain
          # is the same 2h-per-activity ceiling), critical severity.
          #
          # This state published no series at all until SettlementStrandedGauge stopped hand-keeping
          # its NON_TERMINAL list: it was written before #6037 added this value, so the one money-path
          # state meaning "the money did not come back" was the one nothing could see.
          expr: |
            max by (status) (
              openbank_settlement_non_terminal_oldest_age_seconds{
                service="settlement", status="REVERSAL_FAILED"
              }
            ) > 28800
          for: 15m
          labels:
            severity: critical
            service: settlement
          annotations:
            summary: "Settlement reversal FAILED and the money has not been returned"
            description: >-
              The oldest settlement in REVERSAL_FAILED is {{ $value | humanizeDuration }} old. A
              balance compensation was attempted and refused, so funds moved and were not returned —
              this does not resolve itself. Identify the settlement, confirm which leg is
              outstanding, and start the collections/dispute path.
---
# ─────────────────────────────────────────────────────────────────────────────
# settlement-service (issue #5705)
#
# settlement-service is a declared money-path service that, until #5705, emitted no application
# metric of any kind: the pod was scraped, the Rollout was Healthy, ArgoCD was Green, and there was
# simply no series to query. Nothing here could distinguish "settlement is running normally" from
# "settlement has booked nothing for six hours".
#
# Every series below is registered EAGERLY by SettlementMetricsAdapter.bindTo() at @PostConstruct
# (the bean is @Startup because @ApplicationScoped is lazy), so it exists at 0.0 from the first
# scrape. That is load-bearing, not tidiness: Micrometer does not create a counter until its first
# increment, so `increase(openbank_settlement_terminal_total[6h]) == 0` written against a lazily
# created counter matches NOTHING on a service that has never booked anything — precisely the state
# these alerts exist to catch. SettlementMetricsAdapterTest asserts the rendered scrape text, so the
# exact strings below (dot->underscore, the `_total` suffix, tag order) come from Micrometer rather
# than from this file's idea of them.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-settlement-alerts
  namespace: payments
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: settlement-service
spec:
  groups:
    - name: openbank.settlement.health
      rules:
        - alert: SettlementSagaNotCompleting
          # THE alert for this service. Self-normalising by construction: it compares work accepted
          # against work finished, so it needs no business-hours guard and no uptime guard — a
          # freshly started pod has no originations either, making the first conjunct 0 and the
          # rule silent, rather than firing 15m after every deploy the way an unguarded
          # `increase(...) == 0` gauge alert does (the boot-time fourth state this repo has already
          # paid for once, ADR-0237 / #4208).
          #
          # This is the shape of the failure the saga makes invisible: originate() answers 202 with
          # a PENDING row and hands off to Temporal, so a worker that never picks work up (worker
          # not registered, wrong task queue, Temporal frontend unreachable) leaves every settlement
          # PENDING forever and produces no HTTP errors, no latency change and no log line anyone
          # is watching. Money is accepted and nothing settles.
          expr: |
            increase(openbank_settlement_originated_total{outcome="created"}[1h]) > 0
            and
            increase(openbank_settlement_terminal_total[1h]) == 0
          for: 15m
          labels:
            severity: critical
            service: settlement
          annotations:
            # Subject: incremented on the settlement request/activity path
            # (SettlementMetricsAdapter), not by any scheduler — no period to compare against.
            subject_period: continuous
            summary: "settlement-service accepted settlements but completed none"
            description: >-
              {{ $value }} settlement(s) were accepted in the last hour and not one reached a
              terminal state (booked or rejected). Suspect the Temporal worker: check that the
              settlement worker is registered on task queue `openbank-settlement` and that
              temporal-frontend.temporal.svc:7233 is reachable. Rows will be sitting in PENDING.

        - alert: SettlementNoBookingsInBusinessHours
          # The issue's literal ask — "settlement has processed nothing for six hours".
          #
          # The `> 0` guard is what separates "was settling and went quiet" from "has not settled
          # yet since it started", and it is required, not decorative. The counter is eagerly
          # registered, so on a fresh pod the series EXISTS and reads 0; without the guard
          # `increase(...) == 0` is true for every pod for the first six hours of its life and this
          # warning fires after every deploy during business hours. Same guard, same reason, as
          # AuditChainVerificationStale in components/observability/prometheus-rules-audit-chain.yaml.
          #
          # What the guard deliberately gives up: a pod that has NEVER booked anything since restart
          # is not covered here. That case is SettlementSagaNotCompleting's, which catches it within
          # the hour and at `critical` — so nothing is left uncovered by keeping this one narrow.
          expr: |
            increase(openbank_settlement_terminal_total{outcome="booked"}[6h]) == 0
            and openbank_settlement_terminal_total{outcome="booked"} > 0
            and on() hour() >= 6 and on() hour() <= 18
          for: 30m
          labels:
            severity: warning
            service: settlement
          annotations:
            # Subject: incremented on the settlement request/activity path
            # (SettlementMetricsAdapter), not by any scheduler — no period to compare against.
            subject_period: continuous
            summary: "No settlements booked in 6h (business hours)"
            description: >-
              settlement-service has booked nothing to the ledger for 6h during business hours,
              having booked normally earlier in this pod's life. Either upstream stopped
              originating settlements, or the saga is failing short of the ledger — cross-check
              openbank_settlement_saga_steps_total{outcome="failed"}.

        - alert: SettlementSagaStepsFailing
          # Temporal RETRIES a failing activity before it compensates, so a non-zero failure rate is
          # not by itself an incident — a sustained one is the only warning before customer money
          # gets moved and moved back. Warning, not critical: the compensation is the safety net
          # working, and SettlementCompensationsElevated below is what pages if it is actually used.
          expr: |
            sum by (step) (rate(openbank_settlement_saga_steps_total{outcome="failed"}[15m])) > 0
          for: 20m
          labels:
            severity: warning
            service: settlement
          annotations:
            # Subject: incremented on the settlement request/activity path
            # (SettlementMetricsAdapter), not by any scheduler — no period to compare against.
            subject_period: continuous
            summary: "settlement saga step {{ $labels.step }} is failing repeatedly"
            description: >-
              The `{{ $labels.step }}` activity has been failing continuously for 20m. Temporal is
              still retrying; once the attempts are exhausted the saga compensates and the
              settlement ends REJECTED. Check the downstream this step calls (balance-service for
              debit/credit, ledger-service for ledger_book).

        - alert: SettlementCompensationsElevated
          # A compensated saga MOVES CUSTOMER MONEY AND MOVES IT BACK, then ends in REJECTED — a
          # perfectly healthy-looking terminal state that no error rate and no HTTP status reports.
          # This is the one alert that reads that outcome as the incident it is.
          expr: |
            sum(rate(openbank_settlement_terminal_total{outcome="rejected"}[1h]))
              /
            clamp_min(sum(rate(openbank_settlement_terminal_total[1h])), 1e-9)
              > 0.1
          for: 30m
          labels:
            severity: critical
            service: settlement
          annotations:
            # Subject: incremented on the settlement request/activity path
            # (SettlementMetricsAdapter), not by any scheduler — no period to compare against.
            subject_period: continuous
            summary: "Over 10% of settlements are being rejected after compensation"
            description: >-
              {{ $value | humanizePercentage }} of settlements reaching a terminal state in the last
              hour were REJECTED after their compensations ran — each one debited and credited real
              accounts and then reversed them. Treat as a money-path incident, not a error-rate blip.
