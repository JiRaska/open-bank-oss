# ─────────────────────────────────────────────────────────────────────────────
# domestic-payment  (port 8116)
# Czech domestic payment (CERTIS/SIPO) instruction processor. Same pattern as
# sepa-payment with Czech-specific validation rules.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: domestic-payment
  namespace: payments
  labels:
    app.kubernetes.io/name: domestic-payment
    app.kubernetes.io/part-of: payments
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domestic-payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domestic-payment
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-domestic-payment-opa-bundle.sh via the trailing marker
        # comment (do not hand-edit, do not drop the marker).
        openbank.tech/policy-checksum: "9388193635286d16" # domestic-payment-opa-bundle
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: domestic-payment


          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-domestic-payment:sandbox-cf05a32f

          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8116
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://domestic-payment-db-rw.payments.svc:5432/openbank_domestic_payment
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://domestic-payment-db-rw.payments.svc:5432/openbank_domestic_payment
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domestic-payment-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as the KafkaUser
            # 'domestic-payment'; keystore/truststore PKCS#12 are projected from
            # messaging by External Secrets (kafka-mtls-externalsecrets.yaml)
            # and mounted below. The app reads these env vars via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domestic-payment-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: domestic-payment-oidc
                  key: OIDC_CLIENT_SECRET
            # createPayment dedupes on the Idempotency-Key header via Redis (in-namespace, see
            # redis.yaml) and screens via sanctions/aml — all defaulted to localhost, so the REST
            # path 500'd / held in RECEIVED. Wire them to the in-cluster services.
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.payments.svc:6379
            - name: SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            - name: AML_SERVICE_URL
              value: http://aml-service.aml.svc:8117
            # createPayment derives transferScope server-side (#2261) via an account-service
            # IBAN lookup. Defaulted to the in-cluster URL in application.yaml, but the edge was
            # never declared here, so gen-network-policies.py never opened accounts→payments —
            # the lookup hung until the caller timed out ("upstream unavailable"). Declare it.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            # Fraud scoring in SHADOW mode (ADR-0084 §4.1, issue #4221). Same omission as the
            # ACCOUNT_SERVICE_URL edge above and with the same consequence: no FRAUD_SERVICE_URL
            # here meant DomesticPaymentActivitiesImpl.shadowFraudScore resolved
            # `http://localhost:8133`, the fail-open adapter swallowed the refusal as
            # "shadow ALLOW", and the DOMESTIC rail scored nothing for its entire life.
            # Behaviour-neutral: shadowFraudScore only logs a non-ALLOW verdict. There is no
            # enforcement toggle: DOMESTIC_FRAUD_ENFORCEMENT_ENABLED named a control the Temporal
            # migration (#1917) had deleted, and #4221 removed the orphaned key rather than leave a
            # lever that does not move. Rebuilding enforcement is tracked in #4403.
            # Whether this rail is actually being scored is now visible in
            # openbank_fraud_scoring_degraded{service="domestic"} — see prometheus-rules.yaml.
            - name: FRAUD_SERVICE_URL
              value: http://fraud-service.fraud.svc:8133
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # ADR-0104 D4: real ISO 20022 pacs.008 → clearing-simulator → pacs.002 pipeline.
            # Fail-closed: gateway down ⇒ payment stays VALIDATED, never self-settles.
            - name: CLEARING_SIMULATOR_URL
              value: http://clearing-simulator.payments.svc:8139
            - name: DOMESTIC_SCHEME_SUBMISSION_ENABLED
              value: "true"
            # ADR-0108: book funds in transaction-service after scheme ACSC.
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in domestic-payment (domestic-payment.*).
        # Bundle mounted from domestic-payment-opa-bundle ConfigMap
        # (gen-domestic-payment-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/domestic_payment_rest_ext.rego
              subPath: domestic_payment_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: domestic-payment-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: domestic-payment-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: domestic-payment
      canaryService: domestic-payment-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
