# ─────────────────────────────────────────────────────────────────────────────
# clearing-simulator  (port 8139, mgmt 8087)
# ADR-0104 D3: the SEPA scheme counterparty SIMULATOR — receives a real ISO 20022
# pacs.008 from sepa-payment, XSD-validates it, and returns a realistic pacs.002
# (+ camt.054 on settle). Stateless (no DB/Kafka/Redis). This is the swap-point for
# a real scheme connector once licensed — it must NEVER be mistaken for a live rail.
# Plain Deployment (not a Rollout): a simulator needs no progressive delivery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearing-simulator
  namespace: payments
  labels:
    app.kubernetes.io/name: clearing-simulator
    app.kubernetes.io/part-of: payments
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clearing-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clearing-simulator
        app.kubernetes.io/part-of: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clearing-simulator
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-clearing-simulator:sandbox-1f66628d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8139
            - name: management
              containerPort: 8087
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clearing-simulator-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # ADR-0109: pacs.004 return simulator forwards R-transactions to sepa-payment.
            # Same wrong name+port as standing-order's copy above, corrected in #3966.
            - name: SEPA_PAYMENT_SERVICE_URL
              value: http://sepa-payment.payments.svc:8115
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
