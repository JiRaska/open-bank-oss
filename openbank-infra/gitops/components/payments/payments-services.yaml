# Payment pipeline services: transaction-service (saga orchestrator), sepa-payment,
# domestic-payment, sepa-instant (instruction processors), clearing-service (settlement).
# All co-located in the `payments` namespace. Each service has its own CNPG Postgres
# (see postgres.yaml) and connects to the shared Strimzi Kafka bus.
# Readiness probes use TCP on the http port (not /q/health/ready): Kafka producer/
# consumer health checks sit KO on idle topics — serve-before-traffic deadlock.
# Flyway-at-start guarantees DB connectivity before the port opens.
# Image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/<service>:sandbox-57d88d7
---
# ─────────────────────────────────────────────────────────────────────────────
# transaction-service  (port 8102)
# Saga orchestrator: coordinates the payment execution flow across ledger,
# compliance (sanctions/AML), and payment instruction services. Money-path.
# Referenced by agent-service at transaction-service.payments.svc:8102
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 2). Canary strategy
# — 10% 5 min → 30% 5 min → 100%. Dual Services preserve DNS.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: transaction-service
  namespace: payments
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: payments
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-service
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-transaction-opa-bundle.sh via the trailing marker comment
        # (do not hand-edit, do not drop the marker).
        openbank.tech/policy-checksum: "712d6e7a712a7696" # transaction-opa-bundle
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transaction-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-transaction-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8102
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://transaction-db-rw.payments.svc:5432/openbank_transactions
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://transaction-db-rw.payments.svc:5432/openbank_transactions
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as the KafkaUser
            # 'transaction-service'; keystore/truststore PKCS#12 are projected from
            # messaging by External Secrets (kafka-mtls-externalsecrets.yaml)
            # and mounted below. The app reads these env vars via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transaction-service-oidc
                  key: OIDC_CLIENT_SECRET
            # Redis for the four-eyes ApprovalStore (ADR-0155). Reuses the payments
            # namespace's existing shared Redis instance (redis.yaml), already used by
            # sepa-payment/domestic-payment/sepa-instant for idempotency.
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.payments.svc:6379
            # ADR-0137 image-independent convergence: load the scheme-accepted
            # group.id / DLQ-topic override (transaction-service-msg-override
            # ConfigMap, mounted below) as an external Quarkus config source so
            # the lagging image picks up main's values without a rebuild (#2664).
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            # Downstream money-path dependencies. Without these the rest-clients fall back to the
            # application.yaml localhost defaults, so the payment saga's ledger posting and balance
            # credit/debit silently fail and every transaction lands in COMPENSATED/FAILED.
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            - name: BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # ADR-0120 Phase 1: Temporal payment orchestration — flag ON.
            # Worker connects to temporal-frontend.temporal.svc:7233 (namespace=openbank-payments,
            # queue=openbank-payment-execution). NetworkPolicy allows payments→temporal:7233.
            # ADR-0209 D1 (#2572) moved the binding prefix to `openbank.temporal` — the
            # OPENBANK_TRANSACTION_ORCHESTRATION_TEMPORAL_* names below were read by nothing, so the
            # worker fell back to the @WithDefault localhost:7233 and the pod died at StartupEvent.
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: OPENBANK_TEMPORAL_NAMESPACE
              value: openbank-payments
            - name: OPENBANK_TEMPORAL_TASK_QUEUE
              value: openbank-payment-execution
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary,
            # already wired on this Rollout) aborts the rollout if enforce regresses the
            # error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for all
        # @Authorize-annotated endpoints in transaction-service (transaction.*). Bundle
        # mounted from transaction-opa-bundle ConfigMap (gen-transaction-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/transaction_rest_ext.rego
              subPath: transaction_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: transaction-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: transaction-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: transaction-service-msg-override
  strategy:
    canary:
      stableService: transaction-service
      canaryService: transaction-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
# Stable service — original DNS name preserved; Rollouts controller adds
# rollouts-pod-template-hash selector to pin to stable replica set.
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: payments
  annotations:
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  labels:
    app.kubernetes.io/name: transaction-service
spec:
  selector:
    app.kubernetes.io/name: transaction-service
  ports:
    - name: http
      port: 8102
      targetPort: http
---
# Canary service — Rollouts controller updates selector to canary replica set.
apiVersion: v1
kind: Service
metadata:
  name: transaction-service-canary
  namespace: payments
  annotations:
    argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
  labels:
    app.kubernetes.io/name: transaction-service
spec:
  selector:
    app.kubernetes.io/name: transaction-service
  ports:
    - name: http
      port: 8102
      targetPort: http
---
# ─────────────────────────────────────────────────────────────────────────────
# sepa-payment  (port 8115)
# SEPA Credit Transfer instruction processor. Validates, screens (sanctions/AML
# gate ADR-0032), and persists SCT payment records. Publishes events and
# consumes payment requests from Kafka.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sepa-payment
  namespace: payments
  labels:
    app.kubernetes.io/name: sepa-payment
    app.kubernetes.io/part-of: payments
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sepa-payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sepa-payment
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-sepa-payment-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "1da57bc489f7d41b"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Carrier image holds only the pinned pyroscope.jar; cp it into the shared
        # emptyDir the app -javaagents. Enable/disable profiling = pure gitops change.
        - name: pyroscope-agent
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-pyroscope-agent:2.5.4
          command: ["/bin/cp", "/pyroscope.jar", "/opt/pyroscope/pyroscope.jar"]
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /opt/pyroscope
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: sepa-payment


          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-sepa-payment:sandbox-90771f5e

          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8115
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://sepa-payment-db-rw.payments.svc:5432/openbank_sepa_payment
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://sepa-payment-db-rw.payments.svc:5432/openbank_sepa_payment
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sepa-payment-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as the KafkaUser
            # 'sepa-payment'; keystore/truststore PKCS#12 are projected from
            # messaging by External Secrets (kafka-mtls-externalsecrets.yaml)
            # and mounted below. The app reads these env vars via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sepa-payment-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sepa-payment-oidc
                  key: OIDC_CLIENT_SECRET
            # createPayment dedupes on the Idempotency-Key header via Redis (in-namespace, see
            # redis.yaml) and screens via sanctions/aml — all defaulted to localhost, so the REST
            # path 500'd. Wire them to the in-cluster services (mirrors domestic-payment below).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.payments.svc:6379
            - name: SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            - name: AML_SERVICE_URL
              value: http://aml-service.aml.svc:8117
            # #8505: the AML case adapter resolves debtorAccountId → owning party via
            # account-service (the SEPA port of domestic's #3274). Without this the @ConfigProperty
            # default already points at the in-cluster Service, but the explicit edge matches every
            # other URL here and survives a rename of the default.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            # Fraud scoring in SHADOW mode (ADR-0084 §4.1, issue #4221). This Rollout carried no
            # FRAUD_SERVICE_URL, so SepaPaymentActivitiesImpl's rest-client fell back to
            # application.yaml's `http://localhost:8133` — nothing listens there, the adapter is
            # fail-open, and every scoring call logged "shadow ALLOW / Connection refused" and
            # moved on. `fraud_scores` held 0 rows fleet-wide as a result. Behaviour-neutral to
            # wire: the verdict is only logged (`SEPA` rail), never acted on, until
            # SEPA_FRAUD_ENFORCEMENT_ENABLED flips — which is a separate runbook-gated change.
            - name: FRAUD_SERVICE_URL
              value: http://fraud-service.fraud.svc:8133
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Continuous profiling pilot (ADR-0082 §4). Agent jar copied in by the
            # init container below; itimer => no perf_events, no extra capabilities.
            # PYROSCOPE_APPLICATION_NAME MUST equal the OTel service.name so a Tempo
            # span resolves to its flame graph (tracesToProfiles join).
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/pyroscope/pyroscope.jar"
            - name: PYROSCOPE_APPLICATION_NAME
              value: openbank-sepa-payment
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc:4040
            - name: PYROSCOPE_FORMAT
              value: jfr
            - name: PYROSCOPE_PROFILER_EVENT
              value: itimer
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # ADR-0104 D3: build a real pacs.008 and submit it to the scheme gateway
            # (the in-namespace clearing-simulator). Same-namespace call, OIDC Bearer via
            # the shared openbank-services client. Flag flipped ON for the sandbox e2e —
            # money-path, four-eyes; fail-closed (gateway down ⇒ payment holds at VALIDATED).
            - name: CLEARING_SIMULATOR_URL
              value: http://clearing-simulator.payments.svc:8139
            - name: SEPA_SCHEME_SUBMISSION_ENABLED
              value: "true"
            # ADR-0108: after clearing-simulator returns ACSC (PROCESSING), book the outbound
            # debit in transaction-service then advance to COMPLETED. Same namespace.
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: pyroscope-agent
              mountPath: /opt/pyroscope
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in sepa-payment (sepaPayment.*).
        # Bundle mounted from sepa-payment-opa-bundle ConfigMap (gen-sepa-payment-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/sepa_payment_rest_ext.rego
              subPath: sepa_payment_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: sepa-payment-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: sepa-payment-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: pyroscope-agent
          emptyDir: {}
  strategy:
    canary:
      stableService: sepa-payment
      canaryService: sepa-payment-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
