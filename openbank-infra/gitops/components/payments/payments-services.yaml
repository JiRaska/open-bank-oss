# ─────────────────────────────────────────────────────────────────────────────
# settlement-service  (port 8138)
# ADR-0101 P3 — Temporal durable workflow for interbank settlement.
# Feature flag openbank.temporal.enabled=false by default.
# Temporal worker connects to temporal-frontend.temporal.svc:7233.
# Progressive delivery: Deployment→Rollout (ADR-0098). Dual Services preserve DNS.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: settlement-service
  namespace: payments
  labels:
    app.kubernetes.io/name: settlement-service
    app.kubernetes.io/part-of: payments
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settlement-service
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-settlement-opa-bundle.sh via the trailing marker comment
        # (do not hand-edit, do not drop the marker).
        openbank.tech/policy-checksum: "de3b08e046d3c830" # settlement-opa-bundle
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: settlement-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-settlement-service:sandbox-20932d10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8138
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://settlement-service-db-rw.payments.svc:5432/openbank_settlement
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://settlement-service-db-rw.payments.svc:5432/openbank_settlement
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: settlement-service-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: settlement-service-db-app
                  key: password
            # Flyway checksum mismatch on V1 (2026-07-11 bootstrap redeploy, #880):
            # settlement-service hadn't been redeployed since 2026-07-02, so a repo-wide
            # migration-file touch-up landed while it sat un-deployed. Repair-at-start
            # re-baselines the recorded checksum to the current file — safe, matching the
            # onboarding-service precedent (#730): git history shows this migration file
            # has had no real content edit since its original authoring commit. Remove
            # once the live schema_history row is confirmed repaired (one clean boot is
            # enough; safe to leave briefly, repair is a no-op once checksums already match).
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            # `KAFKA_BOOTSTRAP_SERVERS: …:9092` stood here and was dead (issue #3393):
            # openbank-settlement-service has no `mp.messaging` config and no Kafka client
            # anywhere under src/main, so it opened no connection and the value was never read.
            # It mattered only because it made settlement-service read as a plaintext-listener
            # client in every audit of who is still on :9092 — including
            # `gen-network-policies.py`, which derives the broker allow-list from exactly this
            # kind of env URL and so admitted `payments` on 9092 partly on its account.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: settlement-service-oidc
                  key: OIDC_CLIENT_SECRET
            # Downstream money-path dependencies (issue #3931). Until now this Rollout carried
            # NEITHER, so both rest-clients fell back to application.yaml's defaults — which
            # named `openbank-balance-service:8080` / `openbank-ledger-service:8080`, hostnames
            # no Service in this cluster has ever had. Every settlement debit/credit and every
            # GL posting therefore dialled an unresolvable name. Same shape and same values as
            # transaction-service above.
            - name: BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # Temporal go-live (ADR-0101 P3, runbook 0006 Gate 1): settlement now runs its
            # durable workflow. Namespace openbank-default + SERVER_URL + the temporal-platform
            # NetworkPolicy are already in place; rollback = set this back to "false".
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # GL accounts for the settlement double-entry. Both legs post to the customer
            # deposit-control account (2100 CZK); the payer/payee customer dimension rides on
            # each line's subAccountId (deposit-control sub-ledger, ADR-0039), so the SAME GL
            # account on debit and credit is correct — it is a per-customer transfer, not a
            # no-op. NOTE: CZK-only — a non-CZK settlement would need the matching per-currency
            # control account (2101 EUR / 2102 USD / 2103 GBP), as the ledger validates that a
            # line's base currency equals its GL account's currency.
            - name: SETTLEMENT_GL_DEBIT_ACCOUNT_ID
              value: "a0000000-0000-0000-0000-000000000002"
            - name: SETTLEMENT_GL_CREDIT_ACCOUNT_ID
              value: "a0000000-0000-0000-0000-000000000002"
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # the @Authorize-annotated endpoint in settlement-service (settlement.create).
        # Bundle mounted from settlement-opa-bundle ConfigMap (gen-settlement-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/settlement_rest_ext.rego
              subPath: settlement_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: settlement-opa-bundle
  strategy:
    canary:
      stableService: settlement-service
      canaryService: settlement-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
