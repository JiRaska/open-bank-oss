---
# ─────────────────────────────────────────────────────────────────────────────
# vop-service  (port 8149)
# Verification of Payee (ADR-0171) — Reg. (EU) 2024/886 Art. 5c. Checks a payee
# name against an IBAN before a credit transfer and answers
# match / close_match / no_match / no_data.
#
# Money-path (rules.yaml: money_path_services): it sits on the pre-execution path
# of every euro credit transfer. But note the failure semantics are the INVERSE of
# its neighbours: VoP fails OPEN (ADR-0171 §3). If this service, its DB, or the
# name lookup is down, callers get no_data plus a warning and payments still flow —
# it never holds a payment the way the sanctions gate does. Refusing every payment
# during a VoP outage would itself breach the IPR execution-time obligation.
#
# No Kafka: VoP publishes no events, so no KafkaUser / mTLS keystore mounts here.
# Redis IS required — it backs the per-requester rate limit, which is the
# enumeration control, not throughput management (see the threat model).
# Progressive delivery: Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: vop-service
  namespace: payments
  labels:
    app.kubernetes.io/name: vop-service
    app.kubernetes.io/part-of: payments
spec:
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vop-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vop-service
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-vop-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "43e115d669e1ff2b"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vop-service

          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-vop-service:sandbox-ab83fe6e

          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8149
            - name: management
              containerPort: 8086
          env:
            - name: JDBC_URL
              value: jdbc:postgresql://vop-db-rw.payments.svc:5432/openbank_vop
            - name: REACTIVE_URL
              value: vertx-reactive:postgresql://vop-db-rw.payments.svc:5432/openbank_vop
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vop-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vop-db-app
                  key: password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vop-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # ADR-0171 §4: the payee name is two hops away — account-service resolves
            # IBAN→partyId, party-service resolves partyId→legal/trading name.
            # account-service holds no holder name of its own.
            # Ports were TRANSPOSED and the party namespace pluralised (issue #3966): this read
            # `accounts.svc:8101` (8101 is ledger-service) and `parties.svc:8100` (8100 is
            # account-service, and namespace `parties` has never existed — it is `party`). So
            # neither hop of the lookup above could complete, in any environment: the same swap
            # was in application.yaml's defaults, so there was no fallback to be right.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: PARTY_SERVICE_URL
              value: http://party-service.party.svc:8111
            # Backs the per-requester rate limit. Shared, not in-process: a local counter
            # would give an attacker limit × replicas and reset on every pod roll.
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.payments.svc:6379
            - name: VOP_RATE_LIMIT_ENABLED
              value: "true"
            - name: VOP_RATE_LIMIT_RPM
              value: "60"
            # IBAN country prefixes we can answer for ourselves. Anything else has no EPC
            # VoP scheme link and honestly returns no_data / no_scheme_connectivity.
            - name: VOP_DOMESTIC_IBAN_PREFIXES
              value: "CZ"
            # OPA sidecar is deployed (ADR-0034 Phase 5). AUTHZ_ENFORCE=true from day one:
            # this service is new, so there is no legacy caller to break — none of the
            # "would DENY" shadow exposure that keeps the older rails at false (issue #750).
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # vop.verify. Bundle mounted from vop-opa-bundle ConfigMap (gen-vop-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/vop_rest_ext.rego
              subPath: vop_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: vop-opa-bundle
  strategy:
    canary:
      stableService: vop-service
      canaryService: vop-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
