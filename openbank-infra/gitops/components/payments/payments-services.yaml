# ─────────────────────────────────────────────────────────────────────────────
# card-issuance-service  (port 8118)
# Card lifecycle: issue + list (masked PAN) + suspend/resume (freeze/unfreeze).
# Customer-facing via customer-edge (/customer/v1/cards). Kafka + CNPG.
# Image pinned to the fleet tag for bootstrap; auto-deploy rewrites it once this
# manifest exists.
# mTLS to Strimzi (ADR-0137, issue #686): first Kafka wiring for this service —
# authenticates as the KafkaUser 'card-issuance-service'
# (kafka-scheme-accepted-acl.yaml); keystore/truststore PKCS#12 are projected
# from `messaging` by External Secrets (kafka-mtls-externalsecrets.yaml) and
# mounted below, same pattern as transaction-service.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-issuance-service
  namespace: payments
  labels:
    app.kubernetes.io/name: card-issuance-service
    app.kubernetes.io/part-of: payments
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: card-issuance-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: card-issuance-service
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-card-issuance-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "4177dc4fa9a19724"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: card-issuance-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-card-issuance-service:sandbox-062c26af
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8118
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://card-issuance-db-rw.payments.svc:5432/openbank_cards
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://card-issuance-db-rw.payments.svc:5432/openbank_cards
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: card-issuance-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137, issue #686). See application.yaml's
            # mp.messaging.connector.smallrye-kafka.* for how these map to the
            # SmallRye Kafka connector's SSL config.
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: card-issuance-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # issue #686: group.id/auto.offset.reset/client.id for party-events-in
            # (card-issuance-service-msg-override ConfigMap, mounted below) — see
            # application.yaml for why these can't be plain YAML keys. Optional
            # location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.payments.svc:6379
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: card-issuance-service-oidc
                  key: OIDC_CLIENT_SECRET
            # AES-256 key for the synthetic PAN/CVV vault (ADR-0194). card-issuance refuses to
            # boot without it rather than store PANs unencrypted, so this is a hard dependency of
            # the deployment, not an optional tuning knob — see card-issuance-pan-key.yaml.
            - name: OPENBANK_CARD_PAN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: card-issuance-pan-key
                  key: CARD_PAN_ENCRYPTION_KEY
            # ADR-0262: OpenBao Transit address for the envelope-encryption key source
            # (OpenBaoEnvelopeCardSecretCipher). Only consulted when
            # openbank.card.key-source=openbao-transit is built in — inert otherwise, but declaring
            # it here (rather than relying only on the @ConfigProperty code default) is what makes
            # gen-network-policies.py emit the payments -> vault egress edge, same pattern as
            # document-service's OPENBANK_SIGNATURE_CLIENT_PKI_BAO_ADDR.
            - name: OPENBANK_CARD_ENVELOPE_BAO_ADDR
              value: http://openbao.vault.svc:8200
            - name: PRODUCT_CATALOG_SERVICE_URL
              value: http://keda-add-ons-http-interceptor-proxy.keda:8080
            # ADR-0083 T1 re-entry: the interceptor dispatches on Host (see account-service).
            - name: PRODUCT_CATALOG_API_HOST_OVERRIDE
              value: product-catalog.accounts.svc
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar bootstrap (ADR-0034 Phase 5, issue #938). Advisory mode first
            # (AUTHZ_ENFORCE=false, @Authorize logs "would DENY" without blocking) — matches
            # every other service's rollout convention. Flip to true only after an observation
            # window with a clean advisory report.
            #
            # Advisory deliberately (#8470): ADR-0283 phase 0 makes this service money-path, so
            # the money-path authz-enforce gate now reads this value. It stays false because the
            # observation window above has not run — the card authorisation decision only started
            # shipping with ADR-0283, so there is no advisory report to confirm an empty
            # "would DENY" population yet. Flipping on the same PR that declares the service
            # money-path would enforce against a policy nobody has watched decide.
            # Flip target: 2026-10-05, with the other three advisory money-path services.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034, issue #938 bootstrap). Serves
        # data.openbank.rest.allow for all @Authorize-annotated endpoints in
        # card-issuance-service (card.*). Bundle mounted from card-issuance-opa-bundle
        # ConfigMap (gen-card-issuance-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: card-issuance-opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: card-issuance-opa-bundle
              mountPath: /bundle/card_issuance_rest_ext.rego
              subPath: card_issuance_rest_ext.rego
              readOnly: true
            - name: card-issuance-opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: card-issuance-opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: card-issuance-opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: card-issuance-opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: card-issuance-opa-bundle
          configMap:
            name: card-issuance-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: card-issuance-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: card-issuance-service-msg-override
