# ─────────────────────────────────────────────────────────────────────────────
# standing-order-service  (port 8121)
# Recurring-payment mandates (trvalý příkaz). Customer-facing via the edge
# (/customer/v1/standing-orders). Own CNPG DB (openbank_standing_orders) + the
# shared openbank-services OIDC client + the Strimzi bus.
#
# FIRST ROLLOUT NOTE: this module had no prior sandbox image. Build + push once:
#   openbank-infra/scripts/build-push-service.sh openbank-standing-order-service
# then set the image tag below (auto-deploy will keep it current after the first
# source change merges). Until the image exists ArgoCD shows this Deployment
# Degraded (ImagePullBackOff) — it is an isolated new workload, no blast radius.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: standing-order-service
  namespace: payments
  labels:
    app.kubernetes.io/name: standing-order-service
    app.kubernetes.io/part-of: payments
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: standing-order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: standing-order-service
        app.kubernetes.io/part-of: payments
      annotations:
        # Rolls the pod when the OPA bundle changes (ADR-0034). Value is stamped by
        # gen-standing-order-opa-bundle.sh — do not hand-edit.
        openbank.tech/policy-checksum: "94423dc48de41ff8" # standing-order-opa-bundle
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: standing-order-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-standing-order-service:sandbox-90771f5e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8121
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://standing-order-db-rw.payments.svc:5432/openbank_standing_orders
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://standing-order-db-rw.payments.svc:5432/openbank_standing_orders
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: standing-order-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137, #889). See application.yaml's
            # mp.messaging.connector.smallrye-kafka.* for how these map to the
            # SmallRye Kafka connector's SSL config. Without these the pod
            # authenticated as User:ANONYMOUS and deny-by-default blocked its
            # execution-trigger consumer group (GroupAuthorizationException).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: standing-order-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: standing-order-oidc
                  key: OIDC_CLIENT_SECRET
            # #889: initiate the real SEPA credit transfer for a due standing order.
            # Was `sepa-payment-service.payments.svc:8108` until #3966 — wrong on both halves.
            # The Service is `sepa-payment` (declared ~line 355 of this file) and it serves
            # 8115; 8108 is tpp-registry-service's port. So every due standing order's SEPA leg
            # dialled a name that does not exist, on a port that belongs to another service.
            - name: SEPA_PAYMENT_SERVICE_URL
              value: http://sepa-payment.payments.svc:8115
            # #889 follow-up: DOMESTIC/INTERNAL routing. The app only ever sends these two payment
            # types, so before this every real standing order was accepted, shown ACTIVE, and
            # silently failed on every due date — no rail existed for either. A creditor IBAN that
            # resolves through account-service never leaves the bank, so it books straight through
            # transaction-service as a same-day TRANSFER. Verified Service name/port against the
            # live cluster (account-service.accounts.svc:8100, transaction-service.payments.svc:8102)
            # rather than assumed, per the SEPA_PAYMENT_SERVICE_URL lesson two lines above.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.payments.svc:6379
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar bootstrap (ADR-0034 Phase 5, issue #1797). Advisory mode first
            # (AUTHZ_ENFORCE=false, @Authorize logs "would DENY" without blocking) — matches every
            # other service's rollout convention. Before this the pod inherited the libs default
            # enforce=true with NO sidecar, so standingOrder.pause failed closed on an unreachable
            # PDP. Flip to true only after an observation window with a clean advisory report.
            # Dated per #8470: flip target 2026-10-05 — its money-path effect is a FUTURE scheduled
            # debit and pause/cancel reduces money movement, so a bounded advisory window is safe.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 640Mi
        # OPA policy-decision sidecar (ADR-0034, issue #1797 bootstrap). Serves
        # data.openbank.rest.allow for standingOrder.pause (the service's only @Authorize
        # endpoint). Bundle mounted from standing-order-opa-bundle ConfigMap
        # (gen-standing-order-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: standing-order-opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: standing-order-opa-bundle
              mountPath: /bundle/standing_order_rest_ext.rego
              subPath: standing_order_rest_ext.rego
              readOnly: true
            - name: standing-order-opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: standing-order-opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: standing-order-opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: standing-order-opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: standing-order-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: opa-tmp
          emptyDir: {}
        - name: standing-order-opa-bundle
          configMap:
            name: standing-order-opa-bundle
