# Shared `openbank-services` Keycloak client secret. Required at container start:
# a missing Vault projection must fail closed rather than boot with the local-dev default.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: communication-service-oidc
  namespace: communication
  annotations:
    # ADR-0279 WS4 #18: a long-lived credential without a rotate-by date is an immortal one.
    #
    # READ THIS AS A REVIEW-BY DATE FOR THE SHARED ENTRY, NOT A PRIVATE ROTATION. The remoteRef
    # below reads the SHARED `account-service` KV entry — one realm client, one entry (#3485) — so
    # rotating it rotates for every service that pulls it, and doing so unilaterally on this date
    # would break them all. What is due on this date is the review: confirm the shared client secret
    # has been rotated fleet-wide since, or schedule that rotation as one coordinated change.
    openbank.io/rotation-deadline: "2027-09-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: communication-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
