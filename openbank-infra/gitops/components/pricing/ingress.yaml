apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/configuration-snippet: 'more_set_headers "Strict-Transport-Security:
      max-age=63072000; includeSubDomains; preload";

      more_set_headers "X-Frame-Options: SAMEORIGIN";

      more_set_headers "X-Content-Type-Options: nosniff";

      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

      '
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    openbank.io/edge-exposure: internal
  name: pricing-console
  namespace: pricing
spec:
  ingressClassName: nginx
  rules:
  - host: pricing.open-bank.tech
    http:
      paths:
      - backend:
          service:
            name: pricing-console
            port:
              number: 3100
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - pricing.open-bank.tech
    secretName: pricing-console-tls
