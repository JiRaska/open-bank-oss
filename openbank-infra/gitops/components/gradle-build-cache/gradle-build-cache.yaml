# ─────────────────────────────────────────────────────────────────────────────
# Gradle HTTP Build Cache (ADR-0043)
# ─────────────────────────────────────────────────────────────────────────────
# FinOps: without a remote build cache every CI runner downloads and compiles
# the full 30-module monorepo from scratch on every build, generating 5-15 GB
# of NAT Gateway traffic per job (Gradle deps + compilation artifacts). The
# in-cluster cache lets runners share task outputs: if the source hasn't changed
# the compiled artifact is served from here over the pod network — zero NAT.
#
# Implementation: nginx:alpine with the http_dav_module, which supports the
# Gradle HttpBuildCache wire protocol (GET/{key} → 200|404, PUT/{key} → 201).
# Storage: 50Gi gp3 PVC in eu-north-1a (co-located with the runner pool and the
# NAT Gateway so neither PVC AZ-binding nor cache-traffic crosses an AZ).
#
# Wiring: runners set GRADLE_REMOTE_CACHE_URL=http://gradle-build-cache.gradle-build-cache.svc.cluster.local:8080/cache/
# GRADLE_REMOTE_CACHE_PUSH=true, GRADLE_REMOTE_CACHE_INSECURE=true (plain HTTP
# inside the cluster is fine — no creds to leak, no public exposure).
# settings.gradle.kts already reads these vars and wires the HttpBuildCache.
#
# Cost: one nginx pod (~64Mi), 50Gi gp3 PVC (~$4.80/mo). Estimated saving:
# ~$1,000-1,400/month in NatGateway-Bytes (ADR-0043 phase 2).
---
apiVersion: v1
kind: Namespace
metadata:
  name: gradle-build-cache
  labels:
    app.kubernetes.io/part-of: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: gradle-build-cache
data:
  nginx.conf: |
    user  nginx;
    worker_processes  1;
    error_log  /dev/stderr warn;
    pid        /tmp/nginx.pid;

    events { worker_connections 256; }

    http {
      access_log /dev/stdout combined;
      client_max_body_size 512m;
      client_body_temp_path /tmp/nginx-client-body;

      server {
        listen 8080;

        # Gradle HttpBuildCache sends:
        #   GET  /cache/{key} → 200 (hit) or 404 (miss)
        #   PUT  /cache/{key} → 201 (stored)
        # The dav_module maps directly to these semantics.
        location /cache/ {
          alias /data/cache/;
          dav_methods PUT DELETE;
          dav_access user:rw group:rw all:rw;
          create_full_put_path on;
          # Gradle retries on 5xx — return 204 instead of 404 for missing dirs
          # is not needed; 404 on GET is the correct "cache miss" signal.
        }

        # Health probe for readiness/liveness.
        location /healthz {
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gradle-build-cache-data
  namespace: gradle-build-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradle-build-cache
  namespace: gradle-build-cache
  labels:
    app.kubernetes.io/name: gradle-build-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gradle-build-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gradle-build-cache
    spec:
      # Co-locate with the runner pool AZ (eu-north-1a) so the gp3 PVC binds
      # there and cache traffic never crosses an AZ ($0.01/GB cross-AZ charge).
      nodeSelector:
        topology.kubernetes.io/zone: eu-north-1a
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: data
              mountPath: /data/cache
            - name: tmp
              mountPath: /tmp
            # nginx creates its default temp dirs (proxy_temp, fastcgi_temp,
            # client_temp, …) under /var/cache/nginx at startup regardless of
            # config. Running as non-root (runAsUser 101) it cannot mkdir there
            # on the image's root-owned /var/cache/nginx → crashloop. Give it a
            # writable emptyDir (fsGroup 101 makes it group-writable).
            - name: cache
              mountPath: /var/cache/nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # ─── evictor ────────────────────────────────────────────────────────
        # Without this the cache grows monotonically and then dies: nginx serves
        # /data/cache as a plain directory, PUT writes a file, and NOTHING ever
        # deletes one. There is no maxSize, no LRU, no CronJob — by design there
        # never was.
        #
        # Measured 2026-08-02, after the PVC sat at 100% (48.90/48.91 GiB) for 76h
        # with KubePersistentVolumeFillingUp firing the whole time:
        #   PUT /cache/… -> 500   x72     ("No space left on device", nginx [crit])
        #   GET /cache/… -> 404   x33
        # So every write was failing and the hit rate was decaying toward zero —
        # a paid disk doing negative work, since a miss costs a full compile.
        #
        # 79795 files / 48.9G, of which 99% had not been written for 7 days and 95%
        # not for 14. A build cache's value is almost entirely in recent entries;
        # older ones key off source that has since changed. So eviction by age is
        # the right shape, and a bigger disk is not — it only moves the date.
        #
        # A SIDECAR rather than a CronJob because the PVC is ReadWriteOnce: a
        # separate pod cannot mount it while this one holds it, and pinning a
        # CronJob to the same node would be fragile. Same pod, same volume, no
        # scheduling coupling.
        #
        # `-mtime` (write time) not atime: relatime means reads do not reliably
        # update atime, so a true LRU is not available here. Age-since-stored is
        # the honest approximation.
        #
        # FinOps: $0. No extra storage, no extra node — the PVC stays 50Gi and
        # this replaces the growth that would otherwise have forced it up.
        - name: evictor
          image: docker.io/library/nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              # HIGH-WATER MARK (added 2026-08-16). The 14d age pass alone does not bound
              # the disk: it deletes whatever happens to be old, and says nothing about how
              # much is left. Measured 2026-08-16 the PVC was 100% full with /data/cache at
              # 48.9G of 50Gi, KubePersistentVolumeFillingUp had been critical for two days,
              # and the sidecar's own log showed the failure in plain sight — ten consecutive
              # passes reading "removed 33/11/5/25/20/38/54/43 entries older than 14d,
              # 50073MB -> 50073MB". It was deleting real files every time and the total never
              # moved, because inflow over six hours matched whatever aged out. An age policy
              # is a retention policy, not a capacity policy, and only the second one can keep
              # a fixed-size volume from filling.
              #
              # So: keep the 14d pass as the normal steady state, then walk the age threshold
              # DOWN (10, 7, 5, 3, 2, 1 days) until usage is under the high-water mark. Oldest
              # entries still go first, which is the same ordering the age pass already used —
              # this only makes the cut-off adaptive instead of fixed. `df` on the mount, not
              # `du` on the tree, is what the alert reads and what actually runs out.
              #
              # BusyBox `find` has no -printf and Alpine has no GNU sort -z, so a true
              # oldest-first walk is not available here; the descending-threshold loop is the
              # portable equivalent and needs no extra tooling in the image.
              HIGH_WATER=80   # percent used; evict down to this
              while true; do
                before=$(du -sm /data/cache 2>/dev/null | cut -f1)
                deleted=$(find /data/cache -type f -mtime +14 -delete -print 2>/dev/null | wc -l)
                used=$(df -P /data/cache | awk 'NR==2 {print $5+0}')
                extra=0
                for days in 10 7 5 3 2 1; do
                  [ "${used}" -le "${HIGH_WATER}" ] && break
                  n=$(find /data/cache -type f -mtime +${days} -delete -print 2>/dev/null | wc -l)
                  extra=$(( extra + n ))
                  used=$(df -P /data/cache | awk 'NR==2 {print $5+0}')
                  echo "evictor: high-water pass at ${days}d removed ${n}, now ${used}% used"
                done
                after=$(du -sm /data/cache 2>/dev/null | cut -f1)
                echo "evictor: removed ${deleted} entries older than 14d (+${extra} by high-water), ${before}MB -> ${after}MB, ${used}% used"
                # Above the mark with nothing left older than a day means inflow alone fills
                # the volume — eviction cannot fix that and the PVC genuinely needs to grow.
                if [ "${used}" -gt "${HIGH_WATER}" ]; then
                  echo "evictor: WARNING still ${used}% used after evicting everything older than 1d — the 50Gi PVC is undersized for current inflow, not merely unswept"
                fi
                sleep 21600
              done
          volumeMounts:
            - name: data
              mountPath: /data/cache
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: data
          persistentVolumeClaim:
            claimName: gradle-build-cache-data
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gradle-build-cache
  namespace: gradle-build-cache
  labels:
    app.kubernetes.io/name: gradle-build-cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gradle-build-cache
  ports:
    - name: http
      port: 8080
      targetPort: 8080
