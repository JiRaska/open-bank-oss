#
# Alerts for the keycloak-realm-drift CronJob (issue #2540).
#
# SEVERITY MUST BE `critical` OR `warning` — nothing else. Alertmanager routes only those two
# (kube-prometheus-stack.yaml); the top-level route's default receiver is `null`, so any other
# value is silently BLACK-HOLED. An alert that routes nowhere is indistinguishable from no alert,
# which is the exact failure class this detector exists to close.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-keycloak-realm-drift-alerts
  namespace: iam
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: keycloak-realm-drift
spec:
  groups:
    - name: openbank.iam.realmdrift
      rules:
        # Fires when the realm template and the running realm disagree in either direction — a
        # declared role the realm never got, or a live role no template declares.
        - alert: KeycloakRealmDrift
          # Latest run, not "any failed Job still exists". The old form keyed on the failed Job
          # OBJECT, which lives for ttlSecondsAfterFinished (48h) after the realm is fixed: the
          # 2026-09-29 drift was repaired live by 09-30 and the next two scans passed, yet this
          # kept firing on 10-01. A scan that is scheduled but has not succeeded since is the
          # drift signal; `for: 30m` covers the scan's own run time.
          expr: >-
            kube_cronjob_status_last_schedule_time{namespace="iam", cronjob="keycloak-realm-drift"}
              > kube_cronjob_status_last_successful_time{namespace="iam", cronjob="keycloak-realm-drift"}
          for: 30m
          labels:
            severity: warning
            component: iam
          annotations:
            summary: "Keycloak realm template and the running realm disagree"
            description: >-
              The daily realm parity scan failed. Either a role declared in
              gitops/components/keycloak/*realm-template*.json is not issued by the live realm
              (the grant never applied — --import-realm runs on cold start only, so the file
              change reached nothing), or a role exists live that no template declares (it works
              today and a cold-started cluster loses it). If the missing role is named by an
              @RolesAllowed, the endpoints that name it are degraded right now: they fall through
              to whatever other role the annotation lists, which is how ADR-0116's KYC four-eyes
              became unenforceable while every gate was green (#2540). Read the
              `keycloak-realm-drift` ConfigMap in the `iam` namespace for the per-role detail.
              It also fails when a SERVICE ACCOUNT holds ROLE_OPERATOR/ROLE_ADMIN the template
              does not grant (`privilegedServiceAccountDriftCount` > 0 — a matrix grant to a
              machine identity), or when a client named as `service-account-<x>` in rego lacks
              the `profile` default scope live (identity-gated rules never match) (#10486).

        # A Keycloak user deletion is a one-way door: passkeys and party links key on the user id,
        # so a deleted user can only be restored from backup, never recreated.
        - alert: KeycloakUserDeletion
          # Same "latest run" form as KeycloakRealmDrift: the watch runs every 10 minutes, so a
          # scheduled-but-not-succeeded run is the signal. `for: 5m` only rides over the run
          # itself — the restore window is what this alert buys, and it is measured in hours.
          expr: >-
            kube_cronjob_status_last_schedule_time{namespace="iam", cronjob="keycloak-user-deletion-watch"}
              > kube_cronjob_status_last_successful_time{namespace="iam", cronjob="keycloak-user-deletion-watch"}
          for: 5m
          labels:
            severity: critical
            component: iam
          annotations:
            summary: "Keycloak users were deleted (or admin events are off)"
            description: >-
              keycloak-user-deletion-watch failed: a user was deleted in openbank-customers, three
              or more in openbank inside 20 minutes, or admin events are disabled so deletions
              cannot be seen. Read the latest `keycloak-user-deletion-watch` Job log in `iam` for
              the user ids, timestamps and acting principal. A deleted user cannot be recreated
              with the same id — customer-edge passkeys and parties.keycloak_sub point at it — so
              recovery is a point-in-time restore of keycloak-db to just before the first
              deletion, then re-inserting those users. Staleness of the watch itself is
              covered by CronJobSuccessStale (openbank.tech/max-success-age-seconds).

        # A detector that quietly stops running is indistinguishable from a clean realm.
        - alert: KeycloakRealmDriftScanStale
          # 26h: the schedule is daily (03:40 UTC); allow one missed run plus slack.
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="iam",
            cronjob="keycloak-realm-drift"} > 93600
          for: 30m
          labels:
            severity: warning
            component: iam
          annotations:
            summary: "keycloak-realm-drift has not completed successfully in >26h"
            description: >-
              The realm parity scan has not had a successful run in over 26 hours. Treat the
              realm's conformance to its template as UNKNOWN, not healthy — an absent signal
              reads exactly like a clean one.
