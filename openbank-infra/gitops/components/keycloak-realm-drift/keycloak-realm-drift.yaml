# ---------------------------------------------------------------------------
# Keycloak realm drift detector (issue #2540).
#
# THE GAP THIS CLOSES
#   `check-roles-allowed-realm.py` compares every `@RolesAllowed` string to the realm TEMPLATE in
#   git. Nothing compared that template to the realm that actually runs — and the two drift by
#   construction, because Keycloak reads the templates via `--import-realm`, which runs on COLD
#   START ONLY. A role added to a template after the realm first came up is a file change that
#   reaches nothing. There is no reconciler and no ArgoCD hook.
#
#   ArgoCD reports Synced/Healthy throughout, correctly: the object it manages does match the
#   repo. The drift is one layer below what ArgoCD can see. And the template in git is not even
#   the artifact Keycloak reads — keycloak.yaml's `realm-import` volume projects the out-of-band
#   secrets `keycloak-realm-import` / `keycloak-customers-realm-import`, so the file the CI gate
#   reads and the file Keycloak imports are two unrelated objects. Reading the LIVE realm covers
#   both layers at once, but it cannot SEPARATE them — the live realm agreeing with the template
#   says nothing about what a rebuild would produce, because `--import-realm` has not fed the
#   running realm since the day it first came up. Since #3246 this job also reads the import
#   artifact directly (the same projected Secrets, mounted here too) and compares it to the
#   template, which is the only observation that can see a realm that is correct today and
#   unreproducible from git.
#
#   Measured 2026-07-26: ROLE_KYC, ROLE_KYC_OPENER, ROLE_KYC_REVIEWER and ROLE_SUPERVISOR were
#   declared and absent; ROLE_DEMO was live and undeclared. 20 `@RolesAllowed` sites named the
#   four missing roles and none 403'd — each also listed a live role — so ADR-0116's KYC
#   four-eyes silently degraded to ROLE_ADMIN/ROLE_OPERATOR and one identity could both open and
#   approve a case. Separation of duties, declared everywhere and enforced nowhere.
#
# WHY A CronJob AND NOT A CI GATE
#   The live realm is unreachable from a PR runner: the admin REST API is blocked at the nginx
#   edge by design (keycloak.yaml), no workflow holds cluster credentials, and the admin secret is
#   out-of-band. So the CAPTURE happens here, in-cluster, and the COMPARISON is ordinary
#   repo code — `.github/scripts/check-realm-role-parity.py`, unit-tested in both directions by
#   `openbank-infra/scripts/check_realm_role_parity_test.py`. This pod holds no logic worth
#   testing; it holds a credential and a network path.
#
# WHY IT FAILS THE JOB RATHER THAN JUST WRITING A REPORT
#   The sbom-drift-scanner lesson (2026-07-12): a finding that only lands in a ConfigMap is a
#   finding nobody acts on. The report is published FIRST, then the Job fails, so the alert fires
#   with the detail already readable.
#
# WHAT IT DELIBERATELY DOES NOT DO
#   It does not reconcile — neither the live realm nor the Vault copy. Detection first, on
#   purpose: a job that writes to the identity provider, or to the KV holding every client
#   secret, is a much larger blast radius and wants its own decision. #3246 settles the
#   DIRECTION (the repo template is authoritative, the Vault copy converges to it) and
#   docs/runbooks/0009-keycloak-realm-import-reconcile.md holds the procedure; the write itself
#   is a human's.
#   The import comparison reads NAMES only. It must never diff the documents: the template
#   carries `__PLACEHOLDER__` tokens exactly where the import artifact carries real client
#   secrets, and this job's report is published into a ConfigMap.
#
# NAMESPACE: `iam`, deliberately. Keycloak's ingress allow-list admits `podSelector: {}` — the
# whole of `iam` — so a same-namespace caller needs no NetworkPolicy change, and the generated
# policy (gen-network-policies.py derives edges from Deployments) would not have covered a
# CronJob anyway.
# ---------------------------------------------------------------------------

# ─── ServiceAccount ─────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-realm-drift
  namespace: iam
  labels:
    app.kubernetes.io/name: keycloak-realm-drift
    app.kubernetes.io/part-of: iam

---
# ─── RBAC: write the single report ConfigMap, nothing else ──────────────────
# No secret read verb is granted: the admin credential arrives via secretKeyRef on the pod spec,
# which the kubelet resolves — the ServiceAccount never needs API access to it. Granting `get`
# on secrets here would hand any future exec into this pod the bootstrap admin.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-realm-drift-configmap
  namespace: iam
  labels:
    app.kubernetes.io/name: keycloak-realm-drift
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["keycloak-realm-drift"]
    verbs: ["get", "patch", "update"]
  # create: resourceNames cannot gate create — needed for the first run only.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-realm-drift-configmap
  namespace: iam
  labels:
    app.kubernetes.io/name: keycloak-realm-drift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-realm-drift-configmap
subjects:
  - kind: ServiceAccount
    name: keycloak-realm-drift
    namespace: iam

---
# ─── CronJob ────────────────────────────────────────────────────────────────

apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-realm-drift
  namespace: iam
  labels:
    app.kubernetes.io/name: keycloak-realm-drift
    app.kubernetes.io/part-of: iam
spec:
  # 03:40 UTC daily — after sbom-drift-scanner's 03:10, so the two in-cluster drift reports do
  # not contend for the same window.
  schedule: "40 3 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # failedJobsHistoryLimit: 1 — keep the LATEST failure for triage, not an archive.
  # kube-prometheus-stack's KubeJobFailed fires per surviving failed Job OBJECT, so a
  # limit of 3 turns one recurring failure into three permanent alerts. Worse, the pods
  # are garbage-collected long before the Job object is, so the extra tombstones carry
  # no diagnostic value at all — only the alert. Measured 2026-08-02: KubeJobFailed was
  # 11 of the 37 firing alerts, 8 of them with pods=0 and the oldest dating to 07-12.
  # One failure per CronJob still alerts (a job that keeps failing should), the
  # duplicates stop.
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-realm-drift
        spec:
          serviceAccountName: keycloak-realm-drift
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Phase 1 — capture the live role sets and run the committed comparison.
            # The comparison logic is NOT inlined here: it lives in the repo, where it is
            # reviewable and unit-tested. This container clones the public repo (unauthenticated,
            # depth 1 — the same pattern sbom-drift-scanner uses) and executes it.
            - name: capture-and-compare
              image: docker.io/alpine/k8s:1.34.1
              command: ["/bin/sh", "-ec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
                - name: KC_URL
                  value: http://keycloak.iam.svc:8080
                - name: KC_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-bootstrap
                      key: admin-username
                - name: KC_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-bootstrap
                      key: admin-password
              args:
                - |
                  set -eu
                  echo "Cloning openbank-oss (public repo, unauthenticated, depth=1)..."
                  git clone --depth 1 --quiet \
                    https://github.com/JiRaska/open-bank-oss.git /tmp/repo

                  # `admin-cli` is the only client in the master realm that accepts a direct
                  # password grant (see the sandbox admin-token note in the repo runbook).
                  # --data-urlencode reads the value from the env, so the password is never an
                  # argv entry visible in `ps` or echoed by `set -x`.
                  echo "Requesting an admin token..."
                  TOKEN=$(curl -sS --fail-with-body \
                    -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
                    -d "client_id=admin-cli" -d "grant_type=password" \
                    --data-urlencode "username=${KC_ADMIN_USER}" \
                    --data-urlencode "password=${KC_ADMIN_PASSWORD}" \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

                  for REALM in openbank openbank-customers; do
                    echo "Capturing roles for realm ${REALM}..."
                    # briefRepresentation + an explicit max: Keycloak's default page size is 100,
                    # and a silently truncated page would read as "these roles are missing" —
                    # a detector's worst failure mode is inventing findings.
                    curl -sS --fail-with-body \
                      -H "Authorization: Bearer ${TOKEN}" \
                      "${KC_URL}/admin/realms/${REALM}/roles?briefRepresentation=true&first=0&max=2000" \
                      > "/work/${REALM}-realm-roles.json"

                    # CLIENT roles too. check-realm-role-parity.py's template_roles()
                    # flattens `roles.realm` AND `roles.client[*]` into ONE name set, so a
                    # capture of realm roles alone reports every client role as
                    # declared-not-live — permanently, and by construction rather than
                    # because anything drifted. `mcp-caller` (a client role on
                    # openbank-mcp-service, ADR-0224) sat that way: present in the live
                    # realm the whole time, reported missing on every run, and the
                    # CronJob failing on its own false positive took the ArgoCD app to
                    # Degraded for a day. The two sides of a comparison have to agree on
                    # scope; that is what actually broke here, not the realm.
                    #
                    # SKIP KEYCLOAK'S OWN CLIENTS. Measured on the sandbox 2026-08-02:
                    # the realm has 29 client roles and exactly ONE (`mcp-caller`) is ours
                    # — the other 28 come from realm-management, account, account-console
                    # and broker. Capturing them unfiltered trades one false
                    # declared-not-live for 28 false live-not-declared, which is worse.
                    # Filter by CLIENT IDENTITY rather than by role name, so a role we
                    # later define that happens to be called `view-users` is still checked
                    # instead of silently matching a built-in's name.
                    curl -sS --fail-with-body \
                      -H "Authorization: Bearer ${TOKEN}" \
                      "${KC_URL}/admin/realms/${REALM}/clients?briefRepresentation=true&first=0&max=2000" \
                      > "/work/${REALM}-clients.json"
                    rm -rf "/work/${REALM}-cr" && mkdir -p "/work/${REALM}-cr"
                    for CID in $(python3 -c "import json;B={'account','account-console','admin-cli','broker','realm-management','security-admin-console'};print(' '.join(c['id'] for c in json.load(open('/work/${REALM}-clients.json')) if c.get('clientId') not in B))"); do
                      curl -sS --fail-with-body \
                        -H "Authorization: Bearer ${TOKEN}" \
                        "${KC_URL}/admin/realms/${REALM}/clients/${CID}/roles?briefRepresentation=true&first=0&max=2000" \
                        > "/work/${REALM}-cr/${CID}.json"
                    done

                    # Merge into the single array load_live() expects. `uma_protection` is
                    # still expected here — Keycloak creates it on any of OUR clients that
                    # enables authorization services — so the checker's builtins filter
                    # carries it; see keycloak_builtins() in the script.
                    python3 -c "import glob,json;r=json.load(open('/work/${REALM}-realm-roles.json'));[r.extend(json.load(open(f))) for f in sorted(glob.glob('/work/${REALM}-cr/*.json'))];json.dump(r,open('/work/${REALM}-roles.json','w'));print('  %d role(s) (realm + client)' % len(r))"

                    # WHO holds those roles (#2540 follow-up). Role EXISTENCE and role
                    # ASSIGNMENT drift independently, and only the first is loud: a misplaced
                    # role leaves every gate green because both sides still define it.
                    # Service accounts are fetched separately on purpose — Keycloak never
                    # returns them from /users, so a capture that only walks /users leaves the
                    # checker unable to tell "absent" from "not looked at". It reports them as
                    # unchecked rather than as missing; that distinction is why they are here.
                    curl -sS --fail-with-body \
                      -H "Authorization: Bearer ${TOKEN}" \
                      "${KC_URL}/admin/realms/${REALM}/users?briefRepresentation=true&first=0&max=5000" \
                      > "/work/${REALM}-users.json"
                    REALM="${REALM}" TOKEN="${TOKEN}" KC_URL="${KC_URL}" python3 - <<'CAPTURE' > "/work/${REALM}-user-roles.json"
                  import json, os, urllib.request
                  realm, tok, url = os.environ["REALM"], os.environ["TOKEN"], os.environ["KC_URL"]
                  def get(path):
                      req = urllib.request.Request(f"{url}{path}", headers={"Authorization": f"Bearer {tok}"})
                      return json.load(urllib.request.urlopen(req))
                  out = {}
                  for u in json.load(open(f"/work/{realm}-users.json")):
                      out[u["username"]] = sorted(r["name"] for r in get(f"/admin/realms/{realm}/users/{u['id']}/role-mappings/realm"))
                  builtin = {"account", "account-console", "admin-cli", "broker", "realm-management", "security-admin-console"}
                  for c in json.load(open(f"/work/{realm}-clients.json")):
                      if c.get("clientId") in builtin or not c.get("serviceAccountsEnabled"):
                          continue
                      try:
                          sa = get(f"/admin/realms/{realm}/clients/{c['id']}/service-account-user")
                      except Exception:
                          continue
                      out[sa["username"]] = sorted(r["name"] for r in get(f"/admin/realms/{realm}/users/{sa['id']}/role-mappings/realm"))
                  json.dump(out, __import__("sys").stdout, indent=1, sort_keys=True)
                  CAPTURE
                    python3 -c "import json;print('  %d principal(s) with role mappings' % len(json.load(open('/work/${REALM}-user-roles.json'))))"
                  done

                  # --skip-annotations is NOT passed: the clone is a full checkout, so the
                  # @RolesAllowed cross-check runs and a role the code needs but the live realm
                  # does not issue is reported with its call sites.
                  cd /tmp/repo
                  python3 .github/scripts/check-realm-role-parity.py \
                    --root /tmp/repo \
                    --live "openbank=/work/openbank-roles.json" \
                    --live "openbank-customers=/work/openbank-customers-roles.json" \
                    > /work/final.json 2> /work/findings.txt \
                    || echo "findings" > /work/findings
                  cat /work/findings.txt

                  # Kept as a SECOND invocation rather than folded into the first: the two
                  # answer different questions and fail independently, and a combined exit code
                  # would make "which one went red" a log-reading exercise.
                  python3 .github/scripts/check-realm-user-role-parity.py \
                    --root /tmp/repo \
                    --live "openbank=/work/openbank-user-roles.json" \
                    --live "openbank-customers=/work/openbank-customers-user-roles.json" \
                    > /work/final-users.json 2> /work/findings-users.txt \
                    || echo "findings" > /work/findings
                  cat /work/findings-users.txt

                  # THIRD comparison (#3246): template vs the artifact Keycloak would IMPORT.
                  # The two above both read the LIVE realm, which `--import-realm` stopped
                  # feeding the day the realm first came up — so neither can see the import
                  # artifact at all. Measured 2026-08-03 it is a strict ANCESTOR of the
                  # template: openbank 4 roles / 2 clients / 1 user against 14 / 10 / 6.
                  # The artifacts are read from the SAME projected Secrets keycloak.yaml
                  # mounts, so this cannot compare a copy that has drifted from the one that
                  # deploys. The checker reads NAMES ONLY — the files hold real client
                  # secrets, and nothing derived from them may reach the report ConfigMap.
                  python3 .github/scripts/check-realm-import-parity.py \
                    --root /tmp/repo \
                    --import "openbank=/realm-import/openbank-realm.json" \
                    --import "openbank-customers=/realm-import/openbank-customers-realm.json" \
                    > /work/final-import.json 2> /work/findings-import.txt \
                    || echo "findings" > /work/findings
                  cat /work/findings-import.txt
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
                # The same projected pair keycloak.yaml mounts at /opt/keycloak/data/import.
                # No RBAC is added for it: the kubelet resolves a volume from the pod spec,
                # so the ServiceAccount still cannot read any Secret through the API. The
                # blast radius of this mount is bounded by the fact that this pod already
                # holds the bootstrap admin credential.
                - name: realm-import
                  mountPath: /realm-import
                  readOnly: true

          containers:
            # Phase 2 — publish the report, THEN fail. Order is load-bearing: the alert must fire
            # with the detail already readable, not with a promise of it.
            - name: publish
              image: docker.io/alpine/k8s:1.34.1
              command: ["/bin/sh", "-ec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  set -eu
                  python3 - <<'PY' > /tmp/final.json
                  import datetime, json, pathlib
                  raw = pathlib.Path("/work/final.json").read_text().strip()
                  report = json.loads(raw) if raw else {"realms": {}, "captureFailed": True}
                  report["scannedAt"] = datetime.datetime.now(datetime.timezone.utc).strftime(
                      "%Y-%m-%dT%H:%M:%SZ")
                  report["checkScope"] = (
                      "keycloak realm ROLE EXISTENCE + ROLE ASSIGNMENTS, template vs live; "
                      "plus ROLE/CLIENT/USER NAMES, template vs the import artifact (#3246)")
                  report["doesNotVerify"] = (
                      "client-role assignments; group membership; secret VALUES in the import "
                      "artifact (names only, deliberately — the artifact holds real credentials)")
                  findings = pathlib.Path("/work/findings.txt")
                  report["findings"] = findings.read_text().splitlines() if findings.is_file() else []
                  users_raw = pathlib.Path("/work/final-users.json")
                  raw_u = users_raw.read_text().strip() if users_raw.is_file() else ""
                  report["userRoleParity"] = json.loads(raw_u) if raw_u else {"captureFailed": True}
                  uf = pathlib.Path("/work/findings-users.txt")
                  report["userRoleFindings"] = uf.read_text().splitlines() if uf.is_file() else []
                  imp = pathlib.Path("/work/final-import.json")
                  raw_i = imp.read_text().strip() if imp.is_file() else ""
                  report["importParity"] = json.loads(raw_i) if raw_i else {"captureFailed": True}
                  imf = pathlib.Path("/work/findings-import.txt")
                  report["importFindings"] = imf.read_text().splitlines() if imf.is_file() else []
                  print(json.dumps(report, indent=2, sort_keys=True))
                  PY

                  cat /tmp/final.json
                  kubectl create configmap keycloak-realm-drift \
                    --namespace iam \
                    --from-file=keycloak-realm-drift.json=/tmp/final.json \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "Published."

                  if [ -f /work/findings ]; then
                    echo "ERROR: the realm template and the running realm disagree — see above." >&2
                    exit 1
                  fi
                  echo "Done: template and live realm agree."
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            # Byte-for-byte the volume keycloak.yaml projects into the Keycloak pod. Declared
            # the same way on purpose: a second copy of the realm JSON — fetched from Vault
            # here, or re-templated — would be free to disagree with the one that deploys,
            # which is the exact defect class #3246 is about.
            - name: realm-import
              projected:
                sources:
                  - secret:
                      name: keycloak-realm-import
                  - secret:
                      name: keycloak-customers-realm-import
