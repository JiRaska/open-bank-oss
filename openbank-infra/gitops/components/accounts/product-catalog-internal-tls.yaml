#
# Private-CA server certificate for product-catalog's east-west mTLS listener (8443). The existing HTTP
# listener remains during the east-west TLS migration; new consumers use the parallel 8443 listener.
# Same shape as account-service-internal-tls and document-service-internal-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: product-catalog-internal-tls
  namespace: accounts
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: product-catalog-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - product-catalog.accounts.svc
    - product-catalog.accounts.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
