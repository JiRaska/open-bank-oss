# Single-owner Postgres for product-catalog (cluster-wide CNPG operator, ADR-0009/0105 P1).
# Generates the product-catalog-db-app secret (username/password for the `openbank` owner) and a
# product-catalog-db-rw Service the Deployment uses. Must reconcile BEFORE the product-catalog
# image that carries the datasource config deploys, else Flyway-at-start fails on a missing DB.
# NOTE: no S3 WAL/backup here yet — that needs an EKS Pod Identity role (#863 pattern), tracked as a
# follow-up. The catalogue is fully reconstructible from the in-code ProductSeed (idempotent first-boot
# seeder), so a data-loss event re-seeds the canonical products on reboot rather than breaching a
# retention obligation.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-catalog-db
  namespace: accounts
spec:
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike or bulk load cannot fill the 2Gi volume (#1432).
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS
  # Pod Identity on the product-catalog-db ServiceAccount (aws/.../db-backups.tf) — barman reads the
  # SDK chain, no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/product-catalog-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openbank_products
      owner: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: product-catalog-db-daily
  namespace: accounts
spec:
  schedule: "0 39 3 * * *"
  backupOwnerReference: self
  cluster:
    name: product-catalog-db
