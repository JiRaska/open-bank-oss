# product-catalog: the system of record for bank products and the bank-wide fee
# schedule (GET /api/v1/fees, ADR-0051 fees vertical). Postgres-backed (ADR-0105 P1):
# its product-catalog-db CNPG cluster (product-catalog-db.yaml) must reconcile before
# this Deployment rolls the datasource-carrying image, else Flyway-at-start fails.
# Co-located in the `accounts` namespace so the admin-ui Kubernetes discovery lists it
# automatically.
# Quarkus management endpoints (health, metrics) bind to a separate port (8085).
# QUARKUS_MANAGEMENT_HOST=0.0.0.0 is required so kubelet probes can reach them.
#
# ADR-0083 T1 native pilot — ROLLED BACK to the JVM fast-jar image (open-bank-oss#253).
# The native image compiled and cold-started, but every HTTP request 500s at runtime
# (root cause still open in #253), so Fees / the fee-schedule vertical never served. Until
# #253 is fixed, this Deployment runs the standard JVM fast-jar image like the rest of the
# fleet. The startupProbe/readinessProbe are therefore restored to JVM-scoped headroom
# (a JVM + Flyway-at-start needs far more than the ~10s the native-tuned probe allowed, or
# the pod is killed before it becomes ready). The native-tuning was: startupProbe
# initialDelaySeconds 0 / periodSeconds 1 / failureThreshold 10 — do NOT reinstate without
# the native image. The `product-catalog-http-scaledobject.yaml` HTTPScaledObject
# (minReplicas: 0) stays; JVM cold-start is slower but the admin-ui auto-wakes it. The
# native pilot work is preserved (Dockerfile.native); it is simply not deployed to the fleet.
# Do NOT declare `openbank-product-catalog: T1` in `rules.yaml:finops_tiers.declared`.
#
# Verification of this rollback:
#  - sandbox-a407c3ae is the STANDARD JVM fast-jar build (build-push-service.sh),
#    the same pipeline the other ~40 fleet services run in production — not a
#    bespoke image. It carries a valid SBOM attestation (.att/.sig in ECR), so
#    Kyverno verify-openbank-image-sbom-attestation admits it (the exact policy
#    that was blocking statement-service on an un-attested tag).
#  - Probe budget: startupProbe 5s + 30×5s = 155s, well above a JVM boot + Flyway
#    migration; identical to the pre-native manifest that ran green. Resources
#    (256Mi req / 512Mi limit) are unchanged from that JVM baseline.
#  - Runtime SLA is only observable post-deploy: after merge, watch the ArgoCD
#    `accounts` app roll the new ReplicaSet, confirm the pod reaches Ready and
#    GET /api/v1/fees serves, and roll back this tag on failure. KEDA keeps it at
#    0 replicas until a request wakes it (the admin-ui auto-wake covers cold start).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: accounts
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: accounts
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/part-of: accounts
      annotations:
        # OTel auto-instrumentation pilot (Dynatrace-parity #3). The operator
        # injects the OTel Java agent (init-container) using the `openbank`
        # Instrumentation CR in this namespace — zero image rebuild. This is the
        # ONLY annotated workload; watch Tempo for product-catalog to confirm the
        # agent adds depth (JDBC/library spans) without duplicating the Quarkus
        # SDK's spans before annotating any other service.
        instrumentation.opentelemetry.io/inject-java: "openbank"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-catalog
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-product-catalog:sandbox-3179a5f2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8104
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            # Datasource (ADR-0105 P1). Reactive URL for the app (Panache); JDBC URL for Flyway.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://product-catalog-db-rw.accounts.svc:5432/openbank_products
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://product-catalog-db-rw.accounts.svc:5432/openbank_products
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: product-catalog-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: product-catalog-db-app, key: password}}
            # Resource-server auth (issue #401): validate caller bearer tokens against the realm's
            # JWKS. Pure resource server — no client secret needed. Egress to keycloak (iam ns) is
            # already permitted (accounts ns has no egress policy; account-service validates here too).
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            # JVM-scoped headroom (restored from the pre-native manifest): a JVM
            # cold start + Flyway-at-start needs well over the native-tuned 10s.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: accounts
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 8104
      targetPort: http
