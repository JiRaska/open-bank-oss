# product-catalog: the system of record for bank products and the bank-wide fee
# schedule (GET /api/v1/fees, ADR-0051 fees vertical). Postgres-backed (ADR-0105 P1):
# its product-catalog-db CNPG cluster (product-catalog-db.yaml) must reconcile before
# this Deployment rolls the datasource-carrying image, else Flyway-at-start fails.
# Co-located in the `accounts` namespace so the admin-ui Kubernetes discovery lists it
# automatically.
# Quarkus management endpoints (health, metrics) bind to a separate port (8085).
# QUARKUS_MANAGEMENT_HOST=0.0.0.0 is required so kubelet probes can reach them.
#
# ADR-0083 T1 native cutover (2026-07-06, #253). This Deployment now runs the
# Mandrel/GraalVM native image (openbank-product-catalog/Dockerfile.native), not the
# JVM fast-jar image every other service in the fleet still uses — the first native
# cutover in the repo. startupProbe/readinessProbe are tuned to match (initialDelaySeconds:
# 0, periodSeconds: 1 — a ~0.2-0.3s native process doesn't need the ~5s of JVM-scoped
# headroom the previous probe carried). Do NOT copy this probe config onto a JVM-image
# service without re-adding that headroom. The existing `product-catalog-http-scaledobject.yaml`
# HTTPScaledObject (minReplicas: 0) was already live against the old JVM image; this
# cutover is what actually makes its cold-start assumption true. Burn-in window before
# declaring `openbank-product-catalog: T1` in `rules.yaml:finops_tiers.declared` per the
# ADR's own Pilot plan step 5 — do not declare T1 from this manifest alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: accounts
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/part-of: accounts
      annotations:
        # OTel auto-instrumentation pilot (Dynatrace-parity #3). The operator
        # injects the OTel Java agent (init-container) using the `openbank`
        # Instrumentation CR in this namespace — zero image rebuild. This is the
        # ONLY annotated workload; watch Tempo for product-catalog to confirm the
        # agent adds depth (JDBC/library spans) without duplicating the Quarkus
        # SDK's spans before annotating any other service.
        instrumentation.opentelemetry.io/inject-java: "openbank"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-catalog
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-product-catalog:native-a2e14752
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8104
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
            # Datasource (ADR-0105 P1). Reactive URL for the app (Panache); JDBC URL for Flyway.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://product-catalog-db-rw.accounts.svc:5432/openbank_products
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://product-catalog-db-rw.accounts.svc:5432/openbank_products
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: product-catalog-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: product-catalog-db-app, key: password}}
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 0
            periodSeconds: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: accounts
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 8104
      targetPort: http
