# product-catalog: the system of record for bank products and the bank-wide fee
# schedule (GET /api/v1/fees, ADR-0051 fees vertical). Stateless in this phase —
# an in-memory seed store, no datasource — so it has no DB/Kafka/OIDC wiring.
# DB-backing is a planned follow-up. Co-located in the `accounts` namespace so
# the admin-ui Kubernetes discovery lists it automatically.
# Quarkus management endpoints (health, metrics) bind to a separate port (8085).
# QUARKUS_MANAGEMENT_HOST=0.0.0.0 is required so kubelet probes can reach them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: accounts
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/part-of: accounts
      annotations:
        # OTel auto-instrumentation pilot (Dynatrace-parity #3). The operator
        # injects the OTel Java agent (init-container) using the `openbank`
        # Instrumentation CR in this namespace — zero image rebuild. This is the
        # ONLY annotated workload; watch Tempo for product-catalog to confirm the
        # agent adds depth (JDBC/library spans) without duplicating the Quarkus
        # SDK's spans before annotating any other service.
        instrumentation.opentelemetry.io/inject-java: "openbank"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-catalog
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-product-catalog:sandbox-ec0e4ac2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8104
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: QUARKUS_MANAGEMENT_HOST
              value: "0.0.0.0"
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: accounts
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 8104
      targetPort: http
