# Accounts banking domain (ADR-0037: domain = namespace). App plane. Holds
# account-service plus its single-owner CNPG Postgres and a Redis idempotency
# cache, all co-located (R4).
apiVersion: v1
kind: Namespace
metadata:
  name: accounts
  labels:
    openbank.io/plane: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
