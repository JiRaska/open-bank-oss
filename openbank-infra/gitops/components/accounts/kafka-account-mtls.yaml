# Kafka mTLS identity + cert projection for account-service (ADR-0137, #2665 Tier 1).
#
# account-service topics:
#   Produces: openbank.accounts.account.created (two channels: account-events-out + account-outbox-out)
#             openbank.notification.requests (notification-requests-out)
#   Consumes: openbank.party.events (group: openbank-account-service, ADR-0073 party lifecycle)
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: account-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-account-service
          patternType: literal
        operations: [Read]
        host: "*"
---
# Project account-service keystore from `messaging` into `accounts` namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: account-service-kafka-keystore
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: account-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: account-service
---
# Shared cluster-CA truststore for all Kafka clients in `accounts`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
