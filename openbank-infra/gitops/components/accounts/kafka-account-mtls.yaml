# Kafka mTLS identity + cert projection for account-service (ADR-0137, #2665 Tier 1).
#
# account-service topics:
#   Produces: openbank.accounts.account.created (two channels: account-events-out + account-outbox-out)
#             openbank.notification.requests (notification-requests-out)
#             dead-letter-topic-party-events-in (SmallRye DLQ for party-events-in, failure-strategy)
#   Consumes: openbank.party.events (group: openbank-account-service, ADR-0267 §1 party lifecycle)
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: account-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Delegation-grant enforcement projection (ADR-0232 D3): the delegation-events-in
      # channel consumes ACCOUNT-scoped grant lifecycle events. DLQ gets its own Write ACL
      # below for the same reason as party-events-in (#1476).
      - resource:
          type: topic
          name: openbank.delegation.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: dead-letter-topic-delegation-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # SmallRye dead-letter topic for the party-events-in channel (failure-strategy:
      # dead-letter-queue). Without Write here, the DLQ send itself fails and the consumer
      # wedges on the very failure it was meant to park — the same ANONYMOUS-vs-ACL lockout
      # class that took party-service down (#1476). Default SmallRye name = dead-letter-topic-<channel>.
      - resource:
          type: topic
          name: dead-letter-topic-party-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-account-service
          patternType: literal
        operations: [Read]
        host: "*"
---
# Project account-service keystore from `messaging` into `accounts` namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: account-service-kafka-keystore
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: account-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: account-service
---
# Shared cluster-CA truststore for all Kafka clients in `accounts`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
