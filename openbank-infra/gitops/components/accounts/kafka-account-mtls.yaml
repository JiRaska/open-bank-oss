# Kafka mTLS identity + cert projection for account-service (ADR-0137, #2665 Tier 1).
#
# account-service topics:
#   Produces: openbank.accounts.account.created (two channels: account-events-out + account-outbox-out)
#             openbank.notification.requests (notification-requests-out)
#             openbank.dlq.account.party-events-in       (SmallRye DLQ for party-events-in)
#             openbank.dlq.account.delegation-events-in  (SmallRye DLQ for delegation-events-in)
#             dead-letter-topic-party-events-in / dead-letter-topic-delegation-events-in
#               — the pre-#5752 implicit names, RETAINED (see the ACLs below)
#   Consumes: openbank.party.events (group: openbank-account-service, ADR-0267 §1 party lifecycle)
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: account-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.accounts.account.created
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.party.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Delegation-grant enforcement projection (ADR-0232 D3): the delegation-events-in
      # channel consumes ACCOUNT-scoped grant lifecycle events. DLQ gets its own Write ACL
      # below for the same reason as party-events-in (#1476).
      - resource:
          type: topic
          name: openbank.delegation.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # #5752: the EXPLICIT per-service DLQ topics. SmallRye's implicit
      # `dead-letter-topic-<channel>` name is derived from the channel name alone, so
      # account-service and card-issuance-service (both consumers of `delegation-events-in`) were
      # writing dead letters into one topic, and `party-events-in` is declared by eight services.
      # Without Write here the DLQ send itself fails and the consumer wedges on the very failure it
      # was meant to park — the ANONYMOUS-vs-ACL lockout class that took party-service down (#1476).
      - resource:
          type: topic
          name: openbank.dlq.account.delegation-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.dlq.account.party-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # The two pre-#5752 implicit topics. RETAINED, not removed: under an Argo Rollout old and new
      # pods run side by side, so a pod on the previous ConfigMap can still write here mid-cutover,
      # and whatever is already parked in them has to stay drainable. Drop these two entries once
      # both topics are confirmed empty.
      - resource:
          type: topic
          name: dead-letter-topic-delegation-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # SmallRye dead-letter topic for the party-events-in channel (failure-strategy:
      # dead-letter-queue). Without Write here, the DLQ send itself fails and the consumer
      # wedges on the very failure it was meant to park — the same ANONYMOUS-vs-ACL lockout
      # class that took party-service down (#1476). Default SmallRye name = dead-letter-topic-<channel>.
      - resource:
          type: topic
          name: dead-letter-topic-party-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: group
          name: openbank-account-service
          patternType: literal
        operations: [Read]
        host: "*"
---
# Project account-service keystore from `messaging` into `accounts` namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: account-service-kafka-keystore
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: account-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: account-service
---
# Shared cluster-CA truststore for all Kafka clients in `accounts`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
