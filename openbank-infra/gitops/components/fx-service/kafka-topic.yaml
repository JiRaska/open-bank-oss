# Domain event topic produced by fx-service. Declared explicitly (the broker does not
# auto-create topics — kafka.yaml) so the Strimzi topic operator manages it and the
# outbox producer has a destination. The service's KafkaUser (kafka-fx-mtls.yaml) already
# grants Write/Describe on this topic — this CR was the missing piece. Single partition +
# RF 1 for the single-broker sandbox; prod should raise partitions for parallelism and RF
# to 3.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.fx.conversion.completed
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# ČNB/ECB fixing feed (ADR-0314 D5). One event per ingested fixing; the risk engine reads it to
# take reference rates from the stream. Retention 30 days so a consumer rebuilding a month of
# snapshots can replay it; the fx_rates table stays the state of record.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.fx.fixing.published
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
# ČNB policy rates and minimum-reserve facts (fx.cnb-policy-rate.published.v1). One event per new or
# revised (instrument, effectiveFrom) row, keyed by that pair. COMPACTED, not time-retained: the
# facts change a few times a year, and the risk engine reads the minimum-reserve ratio from them —
# a consumer that starts (or rebuilds) after a 30-day window must still find the ratio in effect
# since 2025-01-02. Compaction keeps the latest value per key, which is exactly the history.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.fx.cnb-policy-rate.published
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    min.compaction.lag.ms: 86400000
