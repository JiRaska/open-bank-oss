# OIDC client secret for fx-service, projected from Vault by the External Secrets Operator
# (ClusterSecretStore `vault-kv`) into the in-namespace Secret `fx-service-oidc`.
#
# This was the missing half of #2929: the Deployment already referenced `fx-service-oidc`, but
# nothing ever created it, and the ref was `optional: true` — so the pod booted clean with
# OIDC_CLIENT_SECRET unset, the default oidc-client stayed "not initialized", and the three
# rest-clients that carry OidcClientRequestReactiveFilter (sanctions, aml, fraud — the ADR-0032
# screening gate) had no Authorization header to send. Nothing logged it, because the path had
# never executed: fx_conversions is empty, so the gate would have failed on the FIRST conversion.
#
# All services share the single Keycloak confidential client `openbank-services`, so the secret
# VALUE is the one already stored in Vault under key `account-service` — reuse it rather than
# minting a second copy (no new Vault write). The value never enters Git; only this reference
# does. creationPolicy Owner + deletionPolicy Retain mirror every other *-oidc ExternalSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fx-service-oidc
  namespace: fx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: fx-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 batch 3: fx-service's OWN Keycloak client `openbank-fx` (ROLE_API only), used ONLY by
# the rest-client that selects the named oidc-client `m2m` (the AML case open (amlCase.create)). Deliberately NOT the
# shared `account-service` KV entry: that holds the shared `openbank-services` secret, and a
# per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). The entry is written ONCE by the owner's provisioning script when the
# client is created in the live realm (runbook 0009, "Per-service M2M client"); nothing in this
# repo mints or holds the value. The consuming env ref is `optional: false`: seed Vault BEFORE
# this manifest syncs, or the new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fx-service-m2m-oidc
  namespace: fx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: fx-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/fx-service
        property: client_secret
