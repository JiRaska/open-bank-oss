# fx-service onboarded to the cluster (ADR-0037 domain=namespace). Reactive
# Postgres + Flyway migrations on boot, Redis idempotency, Kafka outbox. OIDC bearer
# validation via the in-cluster Keycloak. Read MCP tools (agent-service) reach it here.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fx-service
  namespace: fx
  labels: {app.kubernetes.io/name: fx-service, app.kubernetes.io/part-of: fx}
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: fx-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fx-service, app.kubernetes.io/part-of: fx}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fx-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-fx-service:sandbox-bb1aacd1
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8119}
            - {name: management, containerPort: 8085}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://fx-db-rw.fx.svc:5432/openbank_fx
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://fx-db-rw.fx.svc:5432/openbank_fx
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: fx-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: fx-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: fx-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: fx-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.fx.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fx-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            - name: AML_SERVICE_URL
              value: http://aml-service.aml.svc:8117
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fx-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
          startupProbe: {tcpSocket: {port: management}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, periodSeconds: 15, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: kafka-keystore, mountPath: /mnt/kafka-keystore, readOnly: true}
            - {name: kafka-truststore, mountPath: /mnt/kafka-truststore, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 430Mi}
            limits: {cpu: "1", memory: 1536Mi}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: kafka-keystore
          secret:
            secretName: fx-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: fx-service
      canaryService: fx-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: fx-service
  namespace: fx
  labels: {app.kubernetes.io/name: fx-service}
spec:
  selector: {app.kubernetes.io/name: fx-service}
  ports: [{name: http, port: 8119, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: fx-service-canary
  namespace: fx
  labels: {app.kubernetes.io/name: fx-service}
spec:
  selector: {app.kubernetes.io/name: fx-service}
  ports: [{name: http, port: 8119, targetPort: http}]
