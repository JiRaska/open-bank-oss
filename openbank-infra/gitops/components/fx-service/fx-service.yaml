# fx-service onboarded to the cluster (ADR-0037 domain=namespace). Reactive
# Postgres + Flyway migrations on boot, Redis idempotency, Kafka outbox. OIDC bearer
# validation via the in-cluster Keycloak. Read MCP tools (agent-service) reach it here.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fx-service
  namespace: fx
  labels: {app.kubernetes.io/name: fx-service, app.kubernetes.io/part-of: fx}
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: fx-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fx-service, app.kubernetes.io/part-of: fx}
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-fx-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "949cfeb05d8621a5"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fx-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-fx-service:sandbox-d1e9ba89
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8119}
            - {name: management, containerPort: 8085}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://fx-db-rw.fx.svc:5432/openbank_fx
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://fx-db-rw.fx.svc:5432/openbank_fx
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: fx-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: fx-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: fx-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: fx-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.fx.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fx-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: SANCTIONS_SERVICE_URL
              value: http://sanctions-service.sanctions.svc:8123
            - name: AML_SERVICE_URL
              value: http://aml-service.aml.svc:8117
            # Fraud scoring in SHADOW mode (ADR-0084 §4.1, issue #4221). fx-service scores from
            # two call sites (FxActivitiesImpl and FxService, rail FX) and had no FRAUD_SERVICE_URL,
            # so both resolved application.yaml's `http://localhost:8133` and the fail-open adapter
            # logged "shadow ALLOW" on every conversion. Behaviour-neutral to wire — the verdict is
            # observed and logged, never acted on.
            - name: FRAUD_SERVICE_URL
              value: http://fraud-service.fraud.svc:8133
            # NOT optional (#2929). The three rest-clients behind the ADR-0032 screening gate
            # (sanctions, aml, fraud) carry OidcClientRequestReactiveFilter; without this value
            # the default oidc-client is "not initialized" and they send no Authorization header
            # at all. `optional: true` did not buy graceful degradation — it turned an
            # unprovisioned credential into a silent boot, and the failure would have surfaced on
            # the first FX conversion anyone performed. oidc-externalsecret.yaml provisions it.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fx-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: false
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe: {tcpSocket: {port: management}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, periodSeconds: 15, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: kafka-keystore, mountPath: /mnt/kafka-keystore, readOnly: true}
            - {name: kafka-truststore, mountPath: /mnt/kafka-truststore, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 430Mi}
            limits: {cpu: "1", memory: 1536Mi}
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in fx-service (fx.*). Bundle mounted from
        # fx-opa-bundle ConfigMap (gen-fx-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/fx_rest_ext.rego
              subPath: fx_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: fx-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: fx-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: fx-service
      canaryService: fx-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: fx-service
  namespace: fx
  labels: {app.kubernetes.io/name: fx-service}
spec:
  selector: {app.kubernetes.io/name: fx-service}
  ports: [{name: http, port: 8119, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: fx-service-canary
  namespace: fx
  labels: {app.kubernetes.io/name: fx-service}
spec:
  selector: {app.kubernetes.io/name: fx-service}
  ports: [{name: http, port: 8119, targetPort: http}]
