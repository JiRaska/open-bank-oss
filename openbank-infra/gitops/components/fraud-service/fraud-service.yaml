# fraud-service (ADR-0084, ADR-0037 domain=namespace). Reactive Postgres + Flyway migrations on
# boot. OIDC bearer validation via the in-cluster Keycloak. Phase 2 (ADR-0084 §2): subscribes to
# openbank.transactions.transaction.initiated to build per-account rolling velocity aggregates.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fraud-service
  namespace: fraud
  labels: {app.kubernetes.io/name: fraud-service, app.kubernetes.io/part-of: fraud}
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: fraud-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fraud-service, app.kubernetes.io/part-of: fraud}
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-fraud-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "a8496d92dad8fad5"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fraud-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-fraud-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8133}
            - {name: management, containerPort: 8085}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://fraud-db-rw.fraud.svc:5432/openbank_fraud
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://fraud-db-rw.fraud.svc:5432/openbank_fraud
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: fraud-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: fraud-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: fraud-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: fraud-db-app, key: password}}
            # ADR-0140 online feature store (FeatureStoreConfig -> ReactiveRedisDataSource).
            # Without quarkus.redis.hosts set, Quarkus's Redis extension deactivates the
            # `<default>` client bean entirely at build time; the resulting
            # io.quarkus.arc.InactiveBeanException surfaced only as a bare "Failed to start
            # application" with no cause printed, because openbank-libs-runtime's production
            # console log format omitted %e (fixed in this same PR) — root-caused via a live
            # QUARKUS_LOG_CONSOLE_FORMAT override that restored %e (sandbox fraud-service
            # crash-loop, 2026-07-09).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.fraud.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # #685 originally set these as MP_MESSAGING_INCOMING_TRANSACTION_SIGNAL_* env vars.
            # Switched here to loading a properties FILE via QUARKUS_CONFIG_LOCATIONS instead —
            # see fraud-service-msg-override.yaml — matching the pattern already established for
            # transaction-service (transaction-service-msg-override.yaml).
            #
            # Correction (round 2): an earlier version of this comment first cited nonexistent
            # issues #2649/#2659, then over-corrected to claim #685's original env-var fix was
            # "independently verified to work" — that overstated it too. The genuine concern is
            # real: quarkusio/quarkus#30106 and smallrye/smallrye-reactive-messaging#2028 document
            # a live, unresolved upstream bug where an env-var override of a single leaf property
            # on a HYPHENATED channel name crashes Quarkus at startup (`SRMSG00071`, "connector
            # attribute must be set for channel <wrong split>") — regardless of whether the channel
            # is already registered via YAML/annotations. #685's own regression test didn't catch
            # this because it injects the override via a QuarkusTestResourceLifecycleManager config
            # map, not a real OS env var, so it doesn't exercise this failure mode. This
            # properties-file mechanism is the CORRECT choice for the hyphenated
            # `transaction-signal` channel, not merely a stylistic alternative.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Re-added (ADR-0220 D3.5, #2749): fraud-service now has its first outbound rest-client
            # (AccountServiceClient, oidc-client block in application.yaml) — #2929 removed this
            # when there was none. See fraud-service-oidc.yaml (new in this PR, mirrors
            # balance-service/aml-service's identical shape) for the ExternalSecret this reads.
            - name: QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fraud-service-oidc
                  key: OIDC_CLIENT_SECRET
            # account-service listens on 8100 (its Service exposes http:8100) — same value every
            # other AccountServiceClient caller in this fleet uses (balance-service, aml-service).
            # Without this, AccountServiceClient falls back to application.yaml's
            # http://localhost:8100 default and every partyId lookup fails closed (fraud-hold
            # simply never raises — the fail-open contract by design, but silently so).
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe: {tcpSocket: {port: management}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, periodSeconds: 15, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 310Mi}
            limits: {cpu: "1", memory: 1536Mi}
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in fraud-service (fraud.*). Bundle
        # mounted from fraud-opa-bundle ConfigMap (gen-fraud-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/fraud_rest_ext.rego
              subPath: fraud_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: fraud-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: fraud-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: fraud-service-msg-override
  strategy:
    canary:
      stableService: fraud-service
      canaryService: fraud-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: fraud
  labels: {app.kubernetes.io/name: fraud-service}
spec:
  selector: {app.kubernetes.io/name: fraud-service}
  ports: [{name: http, port: 8133, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service-canary
  namespace: fraud
  labels: {app.kubernetes.io/name: fraud-service}
spec:
  selector: {app.kubernetes.io/name: fraud-service}
  ports: [{name: http, port: 8133, targetPort: http}]
