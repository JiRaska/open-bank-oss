# ADR-0220 D3.5 fraud-hold signal (issue #2749). fraud-service's first-ever published topic —
# the broker does not auto-create topics, so without this the KafkaUser ACL grant in
# kafka-fraud-mtls.yaml has nothing to point at and the topic operator never manages it.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.fraud.hold.changed
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Reference-only investigation lifecycle feed. Source details remain in fraud-service.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.fraud.investigation.case.references
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Separate Audit-only lifecycle evidence; Context has no read grant on this topic.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.fraud.investigation.case.audit
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
