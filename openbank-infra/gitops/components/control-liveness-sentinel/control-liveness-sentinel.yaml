apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-liveness-sentinel
  namespace: control-liveness-sentinel
  labels:
    app.kubernetes.io/name: control-liveness-sentinel
    app.kubernetes.io/part-of: control-liveness-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-liveness-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-liveness-sentinel
        app.kubernetes.io/part-of: control-liveness-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-liveness-sentinel
          # Pending first CI build (ADR-0163 initial PR) — build-push-service.sh publishes the
          # real sandbox-<sha> tag on merge; ArgoCD will not sync a healthy pod until then.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-control-liveness-sentinel:sandbox-pending
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8142
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.observability.svc:9093
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-liveness
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: control-liveness-sentinel
  namespace: control-liveness-sentinel
  labels:
    app.kubernetes.io/name: control-liveness-sentinel
    app.kubernetes.io/part-of: control-liveness-sentinel
spec:
  selector:
    app.kubernetes.io/name: control-liveness-sentinel
  ports:
    - name: http
      port: 8142
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
