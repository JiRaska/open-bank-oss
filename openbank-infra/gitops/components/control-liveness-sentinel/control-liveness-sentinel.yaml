apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-liveness-sentinel
  namespace: control-liveness-sentinel
  labels:
    app.kubernetes.io/name: control-liveness-sentinel
    app.kubernetes.io/part-of: control-liveness-sentinel
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-liveness-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-liveness-sentinel
        app.kubernetes.io/part-of: control-liveness-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-liveness-sentinel
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-control-liveness-sentinel:sandbox-e5b1ffc1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8144
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Postgres (CNPG liveness-db) — findings + their HITL lifecycle survive pod restarts.
            # Reactive URL for the app (Panache); JDBC URL for Flyway migrations.
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://liveness-db-rw.control-liveness-sentinel.svc:5432/openbank_liveness
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://liveness-db-rw.control-liveness-sentinel.svc:5432/openbank_liveness
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: liveness-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: liveness-db-app, key: password}}
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.observability.svc:9093
            - name: TEMPORAL_NAMESPACE
              value: openbank-liveness
            # The daily fleet-wide check (ADR-0163). Set EXPLICITLY here rather than left to the
            # application.yaml default, because this is the only place an operator looks to answer
            # "when does the sentinel run" — and until #3305 the answer was "it doesn't". The
            # service was trigger-only: measured 2026-08-02, the openbank-liveness Temporal
            # namespace held 0 schedules and 0 workflow executions, and `findings` was empty. An
            # empty findings table renders as "no stale controls", which is the healthiest-looking
            # possible answer to a question nothing had ever asked.
            # 03:15 is the ADR-0163 offset from finops-agent (03:00) and devops-agent (03:30):
            # the three agents share one LiteLLM gateway and one Prometheus.
            # Six fields (second minute hour day month weekday) — Quarkus cron, not crontab.
            - name: LIVENESS_CHECK_CRON
              value: "0 15 3 * * ?"
            # LLM backend — routed through the in-cluster LiteLLM gateway (ADR-0174/0175), which now
            # IS deployed (openbank-infra/gitops/components/ai-platform). The gateway holds the
            # provider key and is the only pod allowed to egress to the US provider; this agent
            # presents the LiteLLM virtual key. Model id unchanged (mapped to deepinfra/deepseek there).
            - name: LIVENESS_MODEL_ENDPOINT
              value: http://litellm.ai-platform.svc:4000/v1
            - name: LIVENESS_MODEL_ID
              value: deepseek-ai/DeepSeek-V3.2
            - name: LIVENESS_GITHUB_API_URL
              value: https://api.github.com
            - name: LIVENESS_GITHUB_OWNER
              value: JiRaska
            - name: LIVENESS_GITHUB_REPO
              value: open-bank-oss
            - name: LIVENESS_GITHUB_PROPOSAL_DIR
              value: docs/liveness-sentinel-proposals
            - name: LIVENESS_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: control-liveness-sentinel-secrets
                  key: LIVENESS_MODEL_API_KEY
            - name: LIVENESS_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: control-liveness-sentinel-secrets
                  key: LIVENESS_GITHUB_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: control-liveness-sentinel
  namespace: control-liveness-sentinel
  labels:
    app.kubernetes.io/name: control-liveness-sentinel
    app.kubernetes.io/part-of: control-liveness-sentinel
spec:
  selector:
    app.kubernetes.io/name: control-liveness-sentinel
  ports:
    - name: http
      port: 8144
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
