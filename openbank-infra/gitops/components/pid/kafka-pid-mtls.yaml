# Kafka mTLS identity + cert projection for openbank-pid-service (ADR-0137 #2665 Tier 2c).
#
# PID publishes outbox-drained events to two topics:
#   - party.events       (channel party-events-out)
#   - openbank.pid.events (channel pid-events-out)
#
# Neither topic is under scheme-accepted ACL control, so no Write ACLs are needed here;
# the KafkaUser is required solely to mint a client certificate for the tls:9093 listener.
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for all
# of this service's Kafka traffic. ACL entries are only required for locked-down topics;
# own domain-event topics inherit allow.everyone.if.no.acl.found=true.
#
# These resources live in `messaging` (where the Strimzi User Operator watches); the User
# Operator mints a per-user Secret of the same name there (user.crt/key/p12 + user.password
# + ca.crt). Those secrets are projected into the `pid` namespace by External Secrets below.
---
# ── KafkaUser: pid-service ──────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs (KafkaUsers→Strimzi secrets→ESO projection) must land
    # before the pid Deployment rolls pods onto mTLS; lower waves sync first and
    # ArgoCD blocks on ExternalSecrets reaching SecretSynced.
    argocd.argoproj.io/sync-wave: "-2"
  name: pid-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
---
# ── ExternalSecret: pid-service keystore ────────────────────────────────────
# Projects the Strimzi-minted pid-service Secret from `messaging` into `pid`.
# `dataFrom.extract` copies every key verbatim, preserving the binary PKCS#12
# payload byte-for-byte. deletionPolicy: Retain so a transient store/RBAC blip
# never deletes a live keystore out from under a running pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: pid-service-kafka-keystore
  namespace: pid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: pid-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: pid-service
---
# ── ExternalSecret: cluster CA truststore ───────────────────────────────────
# Shared cluster-CA truststore projected into `pid` — identical pattern to
# every other namespace (payments, kyc, etc.).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: pid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
