# OIDC client secret for pid-service. All services share the `openbank-services`
# Keycloak client, whose secret lives under the account-service Vault path — pid
# reuses it exactly as party-service does. Mapped to the QUARKUS_OIDC_CREDENTIALS_SECRET
# key the pid Deployment consumes (pid's application.yaml reads that env var).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pid-service-oidc
  namespace: pid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: pid-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: QUARKUS_OIDC_CREDENTIALS_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
