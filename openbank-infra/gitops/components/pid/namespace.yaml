# pid-service domain namespace (ADR-0002: domain = namespace).
# Holds pid-service (the identity golden record, ADR-0072 / ADR-0094) and its
# single-owner CNPG Postgres. Identity-critical; non-money-path per rules.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: pid
  labels:
    openbank.io/plane: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Single-owner Postgres for pid-service, reconciled by the CNPG operator.
# CNPG generates the `pid-db-app` secret and `pid-db-rw` Service.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pid-db
  namespace: pid
spec:
  # Without this there is no PodMonitor, so no scrape target, so no `up` and no `cnpg_*`
  # series -- and every alert in prometheus-rules-db.yaml, PostgresInstanceDown included,
  # is structurally incapable of firing for this cluster. Its backup state would read as
  # healthy by being unobservable (#7220).
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  # Two instances, not one (#9691). CNPG puts a `minAvailable: 1` PDB on the
  # primary; in a single-instance cluster the sole pod IS the primary, so
  # `disruptionsAllowed` is pinned at 0 permanently and no eviction can ever be
  # permitted. That is not a tuning choice, it is arithmetic — and it deadlocked
  # three node drains for 9-15 days while the cluster paid for both those nodes
  # and the idle replacements Karpenter had already provisioned. The replica is
  # also the switchover target a single-instance cluster never had.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  bootstrap:
    initdb:
      database: openbank_pid
      owner: openbank
  # Continuous WAL + base-backup to S3 (CNPG Barman). pid holds the identity golden
  # record (RČ blind index, party_external_ids — ADR-0072); restorability is a
  # production-readiness gap (prod-readiness C5). Mirrors components/party/namespace.yaml.
  # Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/pid-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
# Daily base backup — WAL archiving alone is not restorable (the C5 gap the comment above
# flags). Staggered off-peak (the fleet batches at 02:19). CNPG cron is 6-field.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pid-db-daily
  namespace: pid
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: pid-db
