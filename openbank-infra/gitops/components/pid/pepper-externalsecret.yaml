# Keyed blind-index pepper for the Czech RČ (ADR-0072 tier-1). HMAC-SHA256 key, distinct
# from any column-encryption key. Sourced from OpenBao KV (openbank/pid-service); pid reduces
# the RČ to HMAC-SHA256(pepper, RČ) so tier-1 deterministic dedup works without storing the RČ
# reversibly. Rotating it requires a re-index migration (ADR-0072) — versioned by the caller.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pid-service-pepper
  namespace: pid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: pid-service-pepper
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OPENBANK_PID_BIRTH_NUMBER_PEPPER
      remoteRef:
        key: pid-service
        property: BIRTH_NUMBER_PEPPER
