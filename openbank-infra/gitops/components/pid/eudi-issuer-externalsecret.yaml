# EUDI issuer signing key (eIDAS 2.0, ADR-0094). The EC P-256 PRIVATE JWK pid signs every
# credential AND the Token Status List with — the bank acting as a PID/(Q)EAA issuer. Sourced from
# OpenBao KV (openbank/pid-service, property EUDI_ISSUER_SIGNING_KEY_JWK), same path as the RČ pepper.
# Absent/blank ⇒ issuance + revocation publication are DISABLED fail-closed (a bank must never emit an
# unsigned credential); this ExternalSecret turns issuance ON in the sandbox.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pid-service-eudi-issuer
  namespace: pid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: pid-service-eudi-issuer
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OPENBANK_PID_EUDI_ISSUER_SIGNING_KEY_JWK
      remoteRef:
        key: pid-service
        property: EUDI_ISSUER_SIGNING_KEY_JWK
