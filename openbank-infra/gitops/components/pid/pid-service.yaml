# pid-service: identity golden record — party identification data, RČ blind-index
# dedup and identity resolution (ADR-0072), the EUDI-native identity hub (ADR-0094).
# Identity-critical; non-money-path; 1 replica sandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pid-service
  namespace: pid
  labels:
    app.kubernetes.io/name: pid-service
    app.kubernetes.io/part-of: pid
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pid-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pid-service
        app.kubernetes.io/part-of: pid
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-pid-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "b97149f1f7e02c17"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pid-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-pid-service:sandbox-f97335f5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8105
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://pid-db-rw.pid.svc:5432/openbank_pid
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://pid-db-rw.pid.svc:5432/openbank_pid
            - name: QUARKUS_DATASOURCE_USERNAME
              value: openbank
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pid-db-app
                  key: password
            - name: QUARKUS_HTTP_PORT
              value: "8105"
            # OPA sidecar is deployed (ADR-0034). AUTHZ_ENFORCE=true enables the
            # @Authorize HTTP interceptor to enforce decisions from data.openbank.rest.allow.
            # RBAC via @RolesAllowed remains the outer gate; OPA is the fine-grained PEP.
            - name: AUTHZ_ENFORCE
              value: "true"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: pid-service-oidc
                  key: QUARKUS_OIDC_CREDENTIALS_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Flyway checksum mismatch on V5-V9 (2026-07-16): the 2026-06-27 repo-wide
            # MPL->Apache-2.0 relicense (60e0263f, #2276) flipped the SPDX header on every
            # migration file. V5-V9 were applied 2026-06-16..06-22, i.e. BEFORE it, so their
            # recorded checksums are the pre-relicense ones; V1-V4 carry no header and still
            # match. pid-service hadn't been redeployed since, so the mismatch stayed latent
            # until this rollout hit it — same root cause and fix as onboarding-service V1
            # (#730). Verified before enabling this: the content at 60e0263f^ reproduces all
            # five recorded checksums exactly, and the delta to the current files is the
            # licence header lines only — no SQL executed differently. Remove once the live
            # schema_history rows are repaired (one successful boot is enough; repair is a
            # no-op after that).
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            # Kafka broker for the outbox dispatcher (party-events-out → topic party.events,
            # pid-events-out → topic openbank.pid.events). Strimzi bootstrap, mTLS port (ADR-0137).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pid-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # birth-number-pepper (ADR-0072 tier-1 RČ blind index), from OpenBao via the
            # pid-service-pepper ExternalSecret. Activates the deterministic RČ dedup tier
            # (HMAC-SHA256(pepper, RČ)); without it tier-1 is skipped with a WARN.
            - name: OPENBANK_PID_BIRTH_NUMBER_PEPPER
              valueFrom:
                secretKeyRef:
                  name: pid-service-pepper
                  key: OPENBANK_PID_BIRTH_NUMBER_PEPPER
            # EUDI issuer (eIDAS 2.0, ADR-0094) — the bank as a PID/(Q)EAA issuer. The EC P-256 PRIVATE
            # signing JWK from OpenBao via the pid-service-eudi-issuer ExternalSecret turns issuance +
            # revocation publication ON; absent ⇒ fail-closed (issuance disabled). issuer-id is the
            # credential `iss` and the status-list URI host; trusted-issuers is the sandbox trust
            # allow-list (public JWKS) the relying-party side verifies presentations against — it MUST
            # include our own issuer so a credential we issued can be re-presented and revocation-checked.
            - name: OPENBANK_PID_EUDI_ISSUER_SIGNING_KEY_JWK
              valueFrom:
                secretKeyRef:
                  name: pid-service-eudi-issuer
                  key: OPENBANK_PID_EUDI_ISSUER_SIGNING_KEY_JWK
            - name: OPENBANK_PID_EUDI_ISSUER_ID
              value: "https://pid.open-bank.tech"
            - name: OPENBANK_PID_EUDI_TRUSTED_ISSUERS
              value: '[{"iss":"https://pid.open-bank.tech","jwks":{"keys":[{"kty":"EC","crv":"P-256","kid":"sandbox-eudi-1","x":"KRKSYwfaxO5zBm8WRXcvmTfANKBHyaIqIPvThg3oN5I","y":"742yaWV4fxzMhJEK0S9zdtFUvNzTchdbszFqTFcUR7Q"}]}}]'
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in pid-service (identity.*, pid.resolve,
        # party.changeStatus). Bundle mounted from pid-opa-bundle ConfigMap.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/pid_rest_ext.rego
              subPath: pid_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: pid-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: pid-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: pid-service
  namespace: pid
  labels:
    app.kubernetes.io/name: pid-service
spec:
  selector:
    app.kubernetes.io/name: pid-service
  ports:
    - name: http
      port: 8105
      targetPort: http
