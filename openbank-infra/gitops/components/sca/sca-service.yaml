# sca-service: Strong Customer Authentication — decoupled device-approval challenge
# handler (ADR-0021). Issues SCA challenges (OTP, FIDO2 stub), records device
# approvals, and publishes challenge events. Internal ClusterIP only.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sca-service
  namespace: sca
  labels:
    app.kubernetes.io/name: sca-service
    app.kubernetes.io/part-of: sca
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sca-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sca-service
        app.kubernetes.io/part-of: sca
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sca-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-sca-service:sandbox-2fda5bc49
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8110
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://sca-db-rw.sca.svc:5432/openbank_sca
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://sca-db-rw.sca.svc:5432/openbank_sca
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sca-db-app
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9092
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sca-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.sca.svc:6379
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            - name: QUARKUS_HTTP_PORT
              value: "8110"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      stableService: sca-service
      canaryService: sca-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: sca-service
  namespace: sca
  labels:
    app.kubernetes.io/name: sca-service
spec:
  selector:
    app.kubernetes.io/name: sca-service
  ports:
    - name: http
      port: 8110
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sca-service-canary
  namespace: sca
  labels:
    app.kubernetes.io/name: sca-service
spec:
  selector:
    app.kubernetes.io/name: sca-service
  ports:
    - name: http
      port: 8110
      targetPort: http
