#
# Private-CA client certificate for sca-service's mTLS read of party-service (8443, client auth
# REQUIRED) — the device-enrolment natural-person check (#10281 item 1). Same shape as
# delegation-internal-tls: tls.crt/tls.key identify sca-service, ca.crt trusts party-service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sca-internal-tls
  namespace: sca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: sca-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  commonName: sca-service.sca.svc
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
