#
# Private-CA SERVER certificate for sca-service's east-west mTLS listener (8443). The existing HTTP
# listener remains during the east-west TLS migration; new consumers use the parallel 8443 listener.
# Distinct from sca-internal-tls in this same namespace, which is sca-service's CLIENT certificate
# for its read of party-service. Same shape as account-service-internal-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sca-service-internal-tls
  namespace: sca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: sca-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - sca-service.sca.svc
    - sca-service.sca.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
