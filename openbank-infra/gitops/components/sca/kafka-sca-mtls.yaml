# Kafka mTLS identity for sca-service (ADR-0137 Tier 2a — #2665).
# KafkaUser minted by the Strimzi User Operator in `messaging`; its keystore
# secret is projected into `sca` via ExternalSecret (kafka-messaging-certs
# ClusterSecretStore). The cluster-CA truststore is shared and also projected.
#
# ACLs: sca-service publishes the SCA enrollment lifecycle event (DEVICE_ENROLLED) to
# openbank.sca.events — the topic onboarding-service's read-model projection (ADR-0068)
# consumes. Bug fix (ADR-0160 #996 triage, 2026-07-13): this ACL previously granted Write
# only on openbank.sca.challenge.event (the distinct, not-yet-built OTP challenge lifecycle
# topic) — sca-service's application.yaml matched that same wrong topic name, so the
# enrollment event was published somewhere nobody (including onboarding, correctly listening
# on openbank.sca.events) ever consumed. Neither topic is ACL-locked
# (allow.everyone.if.no.acl.found=true covers both), but explicit Write+Describe here ensures
# the mTLS principal is used and positions the service for a future deny-by-default sweep. A
# future OTP-challenge feature adds its own explicit Write grant on
# openbank.sca.challenge.event when it is actually built — not speculatively kept here.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs must land before the sca Rollout rolls pods onto mTLS.
    argocd.argoproj.io/sync-wave: "-2"
  name: sca-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.sca.events
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # Decoupled/push SCA (#4): sca-service emits a "payment to approve" push request onto
      # openbank.notification.requests (notification-requests-out channel). That topic IS
      # ACL-locked (account-service writes it, notification-service reads it), so the
      # allow.everyone.if.no.acl.found fallback does NOT apply here — an explicit Write grant is
      # required or every emit fails with TOPIC_AUTHORIZATION_FAILED.
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# Keystore projection: Strimzi User Operator writes the per-user keystore Secret
# in `messaging`; ESO projects it into `sca` for pod volume mount.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the sca Rollout replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: sca-service-kafka-keystore
  namespace: sca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: sca-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: sca-service
---
# Shared cluster-CA truststore — same cert for every TLS client; projected from
# `messaging` into `sca` so pods can verify the broker certificate.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the sca Rollout replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: sca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
