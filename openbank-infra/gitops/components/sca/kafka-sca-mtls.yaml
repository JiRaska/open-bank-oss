# Kafka mTLS identity for sca-service (ADR-0137 Tier 2a — #2665).
# KafkaUser minted by the Strimzi User Operator in `messaging`; its keystore
# secret is projected into `sca` via ExternalSecret (kafka-messaging-certs
# ClusterSecretStore). The cluster-CA truststore is shared and also projected.
#
# ACLs: sca-service only publishes SCA challenge events; it does not consume
# scheme-accepted or any locked-down topic, so only Write+Describe on its own
# outbound topic is needed. openbank.sca.challenge.event is not ACL-locked
# (allow.everyone.if.no.acl.found=true covers it), but explicit Write+Describe
# here ensures the mTLS principal is used and positions the service for a future
# deny-by-default sweep.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # ADR-0137: certs must land before the sca Rollout rolls pods onto mTLS.
    argocd.argoproj.io/sync-wave: "-2"
  name: sca-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.sca.challenge.event
          patternType: literal
        operations: [Write, Describe]
        host: "*"
---
# Keystore projection: Strimzi User Operator writes the per-user keystore Secret
# in `messaging`; ESO projects it into `sca` for pod volume mount.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the sca Rollout replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: sca-service-kafka-keystore
  namespace: sca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: sca-service-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: sca-service
---
# Shared cluster-CA truststore — same cert for every TLS client; projected from
# `messaging` into `sca` so pods can verify the broker certificate.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0137: must be synced before the sca Rollout replaces pods.
    argocd.argoproj.io/sync-wave: "-1"
  name: kafka-cluster-ca-truststore
  namespace: sca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: kafka-cluster-ca-truststore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openbank-cluster-cluster-ca-cert
