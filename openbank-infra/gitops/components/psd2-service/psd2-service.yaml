# psd2-service onboarded to the cluster (ADR-0090, ADR-0037 domain=namespace). Berlin Group
# NextGenPSD2 XS2A (consent/AIS + PIS) + ČOBS Czech profile. Reactive Postgres + Flyway
# (PSD2 transactional outbox), Redis idempotency, Kafka outbox, OIDC bearer via in-cluster
# Keycloak. SANDBOX: eIDAS QSEAL enforcement is OFF (OPENBANK_PSD2_QSEAL_ENFORCE=false) — no
# real TPP certificates here; the QsealSignatureFilter stays advisory (verifies a cert if a TPP
# presents one, never rejects). Flip to true once eIDAS QSEAL certs/truststore are provisioned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psd2-service
  namespace: psd2
  labels: {app.kubernetes.io/name: psd2-service, app.kubernetes.io/part-of: psd2}
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: psd2-service}}
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-psd2-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "9b7bc02317e4abd7"
      labels: {app.kubernetes.io/name: psd2-service, app.kubernetes.io/part-of: psd2}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psd2-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-psd2-service:sandbox-22df9570
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8107}
            - {name: management, containerPort: 8085}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://psd2-db-rw.psd2.svc:5432/openbank_psd2
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://psd2-db-rw.psd2.svc:5432/openbank_psd2
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: psd2-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: psd2-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: psd2-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: psd2-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.psd2.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: psd2-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # NOT optional (#2929) — ConsentServiceRestClient carries
            # OidcClientRequestReactiveFilter, so without this value psd2 calls consent-service
            # with no Authorization header. oidc-externalsecret.yaml provisions it.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: psd2-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: false
            # eIDAS QSEAL message signing stays advisory in the sandbox (no TPP certs / truststore).
            - name: OPENBANK_PSD2_QSEAL_ENFORCE
              value: "false"
            # TPP registry lookup (eIDAS role/status). The namespace was `tpp` here until #3966;
            # it is `tpp-registry`, so this never resolved and the lookup has always failed.
            #
            # The comment that stood here said "Not yet deployed -> calls 503 until it lands",
            # and that was false when written or soon after: tpp-registry-service is deployed and
            # serving 8108 in namespace `tpp-registry`. Keeping the note is the point — a comment
            # that EXPLAINS AWAY the symptom is worse than none, because it retires the question.
            # The failing lookup looked accounted-for for as long as anyone read this file.
            - name: TPP_REGISTRY_SERVICE_URL
              value: http://tpp-registry-service.tpp-registry.svc:8108
            # Real consent-service client backing the AIS consent/validate gate (issue #1500).
            # M2M bearer via oidc-client openbank-services (OIDC_CLIENT_SECRET already set above).
            - name: CONSENT_SERVICE_URL
              value: http://consent-service.consent.svc:8106
            - name: QUARKUS_FLYWAY_MIGRATE_AT_START
              value: "true"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # ADR-0034 Phase 5 / issue #1797: the OPA sidecar (below) is now wired, so the 21
            # @Authorize methods on the AIS/PIS/consent surfaces actually reach a PDP. Before
            # this, psd2-service ran with the app default AUTHZ_ENFORCE=true (application.yaml:
            # authz.enforce: "${AUTHZ_ENFORCE:true}") and NO sidecar — so every PDP call to
            # localhost:8181 failed and the interceptor failed closed for every caller,
            # including a real eIDAS-authenticated TPP. Kept ADVISORY (false) for this rollout:
            # the interceptor evaluates and records every decision but does NOT block while
            # false, so the "would DENY" population can be confirmed empty in the live decision
            # log (openbank.authz.decisions, outcome=deny enforced=false) before the enforce
            # flip — a separate, deliberate follow-up per the rules.yaml AUTHZ_ENFORCE
            # guardrail. The app default is `true`, so this explicit `false` is load-bearing.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe: {tcpSocket: {port: management}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, periodSeconds: 15, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 430Mi}
            limits: {cpu: "1", memory: 1536Mi}
        # OPA policy decision point (ADR-0034 Phase 5 / issue #1797). Co-located sidecar the app
        # reaches on localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed; the
        # app's opa.url already defaults to http://localhost:8181). Bundle mounted read-only from
        # the psd2-opa-bundle ConfigMap generated by gen-psd2-opa-bundle.sh. Mirrors
        # statement-service / party-service (same image, args, probes, security context, subPath
        # mounts). No runAsUser here — it inherits the pod-level 1001/1001 above, which is what
        # satisfies runAsNonRoot for this image.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/psd2_rest_ext.rego
              subPath: psd2_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: psd2-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: psd2-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: psd2-service
  namespace: psd2
  labels: {app.kubernetes.io/name: psd2-service}
spec:
  selector: {app.kubernetes.io/name: psd2-service}
  ports: [{name: http, port: 8107, targetPort: http}]
