# OIDC client secret for psd2-service, projected from Vault by the External Secrets Operator
# (ClusterSecretStore `vault-kv`) into the in-namespace Secret `psd2-service-oidc`.
#
# Missing half of #2929, same shape as fx-service: the Deployment referenced `psd2-service-oidc`
# with `optional: true` and nothing ever created it, so the ConsentServiceRestClient — which
# carries OidcClientRequestReactiveFilter — had no M2M token to attach when psd2 calls
# consent-service.
#
# All services share the single Keycloak confidential client `openbank-services`, so the secret
# VALUE is the one already stored in Vault under key `account-service`. The value never enters
# Git; only this reference does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: psd2-service-oidc
  namespace: psd2
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: psd2-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
