# Redis (Valkey) idempotency cache for psd2-service. Ephemeral (sandbox).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: psd2
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: psd2}
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545). This is a single-writer cache on an emptyDir
  # behind one ClusterIP Service: a SURGED second pod would answer half the traffic from an
  # empty keyspace, so surge is not a property worth keeping here. It also makes the roll
  # possible at all when the cluster has no room for two pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: docker.io/valkey/valkey:8-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{name: redis, containerPort: 6379}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {tcpSocket: {port: redis}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: psd2
  labels: {app.kubernetes.io/name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
