# Single-owner Postgres for Keycloak, reconciled by the cluster-wide CNPG
# operator. Primary + hot standby (ADR-0325: a money-path platform database);
# prod may raise to 3. CNPG generates the `keycloak-db-app` secret (keys: username,
# password) for the `keycloak` owner and a read-write Service `keycloak-db-rw`
# — both consumed by the Keycloak Deployment.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: iam
spec:
  # DB-layer observability (Dynatrace-parity #0): CNPG runs its built-in
  # Prometheus exporter on :9187 and creates a PodMonitor the operator owns.
  # kube-prometheus-stack selects PodMonitors cluster-wide (NilUsesHelmValues
  # =false), so this lights up cnpg_* metrics (connections, replication lag,
  # deadlocks, xid age, WAL archiving) with zero app changes.
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  # HA (ADR-0159, ADR-0325): a platform database money-path services depend on
  # (rules.yaml: money_path_platform_databases). Keycloak cannot mint tokens without it, and every money-path
  # call is authenticated by a Keycloak-issued JWT, so it gets
  # the money-path shape: primary + hot standby on DIFFERENT nodes (required
  # hostname anti-affinity, applied in a staged ADR-0325 wave), soft AZ spread, and
  # switchover-first updates.
  instances: 2
  # ADR-0325: an update (image bump, config change) promotes the already-updated
  # standby first and only then restarts the old primary. CNPG's default,
  # `restart`, restarts the primary IN PLACE; on a single-instance cluster the
  # operator has no standby and restarts either way, so this is free there.
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  # ADR-0325 wave: required anti-affinity + zone spread. This changes the pod spec, so CNPG
  # rolls the standby first and then performs ONE switchover (a write pause of seconds).
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: keycloak-db
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    storageClass: gp3
    size: 5Gi
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      # WAL default (512MB) fills a 1Gi PVC; archive_mode=on means S3 holds
      # all WALs, so local retention can be minimal.
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak

  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the keycloak-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/keycloak-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
  namespace: iam
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 19 2 * * *"
  backupOwnerReference: self
  cluster:
    name: keycloak-db
