#
# ADR-0385 D3: client secret of `openbank-keycloak-mcp` (openbank realm, ROLE_API only), the M2M
# identity the customers-realm withheld-code authenticator uses to initiate and consume the
# MCP_CLIENT_CONNECT challenge at sca-service. Keycloak reads it as the server-level SPI option
# `--spi-authenticator--openbank-mcp-withheld-code--client-secret` (env in keycloak.yaml), never as
# realm configuration, so a realm admin cannot repoint it.
#
# Same OpenBao key the realm-import artifact uses for this client's placeholder
# (openbank-libs/governance/keycloak-realm-import-secret-sources.yaml), so the value the authenticator
# presents and the value the realm holds cannot be two copies. The value never enters Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: per-service M2M client secret, rotated with the realm client.
    open-bank.tech/rotation-deadline: "2027-11-22"
  name: keycloak-mcp-sca-client
  namespace: iam
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: keycloak-mcp-sca-client
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: keycloak/keycloak-mcp
        property: client_secret
