# Identity domain (ADR-0037 domain=namespace). Keycloak is the sole IdP; its
# single-owner CNPG Postgres is co-located here (R4). PSS restricted — the
# quay.io/keycloak image already runs as non-root, so the pod just needs an
# explicit restricted securityContext (set on the Deployment).
apiVersion: v1
kind: Namespace
metadata:
  name: iam
  labels:
    openbank.io/plane: infra
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
