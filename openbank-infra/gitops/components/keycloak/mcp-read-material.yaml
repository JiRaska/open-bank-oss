apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-mcp-read-issuer-oidc
  namespace: iam
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-22"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: keycloak-mcp-read-issuer-oidc
    creationPolicy: Owner
  data:
  - secretKey: MCP_READ_ISSUER_CLIENT_SECRET
    remoteRef:
      key: keycloak/mcp-read-issuer
      property: client_secret
      decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
