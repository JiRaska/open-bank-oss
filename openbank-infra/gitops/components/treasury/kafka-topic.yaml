# Money-market deal lifecycle events — published by treasury-service through its transactional
# outbox (ADR-0315 D6): treasury.deal.booked.v1 / confirmed.v1 / settled.v1 / matured.v1 /
# reversed.v1, keyed by dealId so one deal's events stay ordered on one partition. Read by audit-service.
#
# No DLQ topic here on purpose: this service has NO incoming channel. A dead-letter topic is
# wired in the same change that introduces a consumer's rethrow, never speculatively (#5745, #5752).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.treasury.deal.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Bank-own payment releases (contract 9.1, treasury.payment.released.v1) — written by
# treasury-service's outbox in the same transaction that moves the payment to RELEASED, read only
# by swift-service (the financial-institution transfer rail). Keyed by paymentId. Its consumer's
# dead-letter topic is openbank.dlq.swift-service.treasury-payments-in (kafka/kafka-dlq-topics.yaml).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.treasury.payments
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
