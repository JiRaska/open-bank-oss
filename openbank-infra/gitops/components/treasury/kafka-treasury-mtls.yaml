# Kafka mTLS identity + ACLs for openbank-treasury-service (ADR-0137 Tier 2).
#
# treasury-service only PRODUCES openbank.treasury.deal.events (its outbox). It consumes nothing,
# so it holds no Read ACL and needs no consumer group: the ACL set is the whole statement of what
# this identity can do.
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for all of this
# service's Kafka traffic. The Strimzi User Operator mints the per-user Secret of the same name in
# `messaging`; ESO projection into `treasury` is done by kafka-mtls-externalsecrets.yaml.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: treasury-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: openbank.treasury.deal.events
          patternType: literal
        operations: [Write, Describe]
