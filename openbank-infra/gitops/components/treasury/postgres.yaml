# Single-owner Postgres for treasury-service, reconciled by the cluster-wide CNPG operator. CNPG
# generates the `treasury-db-app` secret (username/password for the `openbank` owner) and a
# `treasury-db-rw` Service — both consumed by the treasury-service Deployment for the reactive
# datasource and Flyway migrations. One instance for sandbox FinOps; prod should raise to 3.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: treasury-db
  namespace: treasury
spec:
  monitoring:
    enablePodMonitor: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_treasury
      owner: openbank
  # WAL archiving + base backups to S3. A deal is the book of record for the bank's own
  # money-market positions and the source of every treasury journal (ADR-0315); governance.yaml
  # sets retention at 10 years. Credentials from EKS Pod Identity on the treasury-db ServiceAccount.
  #
  # A backup that has never been configured reports the SAME success as one that works: CNPG's
  # archiver is a no-op with a success exit code when no barmanObjectStore exists, and both the
  # ContinuousArchiving condition and pg_stat_archiver agree with it. Verify by listing the
  # objects (`aws s3 ls`), never by reading a condition.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/treasury-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: treasury-db-daily
  namespace: treasury
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 55 4 * * *"
  backupOwnerReference: self
  cluster:
    name: treasury-db
