# treasury-service: the bank's own money-market deals (ADR-0315). MONEY-PATH. Reactive Postgres
# datasource + Flyway JDBC migrations against the single-owner CNPG cluster. Posts deal settlement,
# maturity and reversal journals to ledger-service over its private-CA mTLS listener (8443) on its
# OWN M2M identity (Keycloak client openbank-treasury, ROLE_API only, whose whole ledger grant is
# ledger.create). Produces treasury.deal.* onto openbank.treasury.deal.events through the
# transactional outbox; consumes nothing. OIDC bearer validation points at Keycloak. Reachable
# only in-cluster via ClusterIP, no ingress — the staff path is admin-ui.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treasury-service
  namespace: treasury
  labels:
    app.kubernetes.io/name: treasury-service
    app.kubernetes.io/part-of: treasury
spec:
  replicas: 1
  # Terminate-first, deliberately. With the default RollingUpdate a ONE-replica Deployment must
  # schedule the new pod BEFORE it may stop the old one, so the rollout needs room for two pods —
  # and the old pod holds exactly the resources the new one needs. On a cluster with no spare room
  # that is a deadlock the rollout never escapes. The trade is a few seconds of unavailability per
  # deploy, which a single-replica service already has. A multi-replica money-path service must
  # NOT copy this.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: treasury-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-treasury-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "76ac72025f4ae4c0"
      labels:
        app.kubernetes.io/name: treasury-service
        app.kubernetes.io/part-of: treasury
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: treasury-service
          # First build lands via auto-deploy on the merge that adds openbank-treasury-service to
          # ALL_SERVICES; the auto-deploy gitops PR rewrites this pin to the built sha. Until then
          # the tag is the declared placeholder (fleet-attestation-placeholders.txt).
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-treasury-service:sandbox-0c783974
          imagePullPolicy: IfNotPresent
          ports:
            # HTTP 8160 and management 8090 — both read off the service's own application.yaml
            # (quarkus.http.port / quarkus.management.port). The management port is NOT the
            # fleet-common 8085 here; probes below target 8090 deliberately.
            - name: http
              containerPort: 8160
            - name: management
              containerPort: 8090
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary. The service's
            # application.yaml hardcodes localhost for both; these env vars override it, since an
            # env source outranks application.yaml in SmallRye's ordinal.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://treasury-db-rw.treasury.svc:5432/openbank_treasury
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://treasury-db-rw.treasury.svc:5432/openbank_treasury
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: treasury-db-app
                  key: password
            # Kafka: the outbox dispatcher produces the deal lifecycle -> Strimzi bootstrap
            # over mTLS (ADR-0137). The connector reads only KAFKA_BOOTSTRAP_SERVERS, never a
            # quarkus.* key.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: treasury-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # The outbox dispatcher defaults to DISABLED fleet-wide. Without this the deal
            # lifecycle never leaves treasury_outbox — no error, attempt_count stays 0 — and every
            # consumer stays permanently empty. Set in application.yaml too; this keeps the
            # deployed environment stating it explicitly.
            - name: OPENBANK_OUTBOX_DISPATCH_ENABLED
              value: "true"
            # ADR-0315 D9: SYNTHETIC counterparties settle and mature booked deals. The sandbox has
            # no real market connectivity; stated explicitly so the switch is a decision of this
            # environment, not an inherited default.
            - name: OPENBANK_TREASURY_SIMULATED_MARKET_ENABLED
              value: "true"
            # ledger-service's private-CA mTLS listener (8443, client auth REQUIRED); client cert
            # treasury-internal-tls, %prod TLS bucket ledger-authority. ASVS V9.1 forbids a new
            # plaintext edge, so the legacy HTTP/8101 port is not used.
            - name: LEDGER_SERVICE_URL
              value: https://ledger-service.ledger.svc:8443
            # Keycloak runs in `iam`, not `platform`. A wrong host does not fail the boot (OIDC
            # defers discovery to the first request) — it just makes every authenticated call
            # fail later with `Name does not resolve`.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: treasury-service-oidc
                  key: OIDC_CLIENT_SECRET
            # treasury's OWN Keycloak client (openbank-treasury, ROLE_API only) — the named
            # oidc-client `m2m` that mints the ledger bearer. optional: false so an unseeded Vault
            # entry is a loud CreateContainerConfigError, never a silently empty credential.
            # Provision the client and keycloak/treasury BEFORE this syncs (runbook 0009).
            - name: OIDC_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: treasury-service-m2m-oidc
                  key: OIDC_M2M_CLIENT_SECRET
                  optional: false
            # OPA sidecar enforced from the first rollout: treasury_rest_ext.rego grants deal
            # writes to real treasury staff only (dealer / approver), never a service-account and
            # never an AI agent.
            - name: AUTHZ_ENFORCE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: ledger-tls
              mountPath: /mnt/ledger-tls
              readOnly: true
        # OPA policy decision point (ADR-0034). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default). Bundle mounted read-only from the
        # treasury-opa-bundle ConfigMap generated by gen-treasury-opa-bundle.sh.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach /health.
            # The image is scratch (no shell), so an exec probe isn't possible. Reachability is
            # fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            # `--bundle` is REQUIRED, not decorative: without it OPA loads /bundle as a plain data
            # directory and merges every YAML into the root data document, so rules-data.yaml and
            # agents-data.yaml collide and the sidecar dies with `merge error`. In bundle mode the
            # roots declared in .manifest keep them apart. Mount paths below must match.
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/treasury_rest_ext.rego
              subPath: treasury_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Data files land under the bundle roots declared in .manifest (`agents`, `rules`) —
            # NOT flat in /bundle, which is what produced the merge error above.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ledger-tls
          secret:
            secretName: treasury-internal-tls
            optional: false
        - name: kafka-keystore
          secret:
            secretName: treasury-service-kafka-keystore
            optional: false
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            optional: false
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: treasury-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: treasury-service
  namespace: treasury
  labels:
    app.kubernetes.io/name: treasury-service
    app.kubernetes.io/part-of: treasury
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: treasury-service
  ports:
    - name: http
      port: 8160
      targetPort: http
    - name: management
      port: 8090
      targetPort: management
