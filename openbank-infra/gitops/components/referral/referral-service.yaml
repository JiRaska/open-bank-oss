# Referral/MGM first deployment stage. Replicas stay at zero until the image pipeline
# has produced and attested the pinned source image; activation is a separate reviewed step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: referral-service
  namespace: referral
  labels:
    app.kubernetes.io/name: referral-service
    app.kubernetes.io/part-of: referral
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: referral-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: referral-service
        app.kubernetes.io/part-of: referral
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: referral-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-referral-service:sandbox-c3f21ee6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8155
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8086
          env:
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/referral-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/referral-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://referral-db-rw.referral.svc:5432/openbank_referral
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://referral-db-rw.referral.svc:5432/openbank_referral
            - name: POSTGRES_USER
              value: openbank
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: referral-db-app
                  key: password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: referral-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_MANAGEMENT_PORT
              value: "8086"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: referral-tls
              mountPath: /mnt/referral-tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: referral-tls
          secret:
            secretName: referral-service-internal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: referral-service
  namespace: referral
  labels:
    app.kubernetes.io/name: referral-service
    app.kubernetes.io/part-of: referral
spec:
  selector:
    app.kubernetes.io/name: referral-service
  ports:
    - name: http
      port: 8155
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 8086
      targetPort: management
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: referral-service
  namespace: referral
  labels:
    app.kubernetes.io/name: referral-service
    app.kubernetes.io/part-of: referral
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: referral-service
  podMetricsEndpoints:
    - port: management
      path: /q/metrics
      interval: 30s
