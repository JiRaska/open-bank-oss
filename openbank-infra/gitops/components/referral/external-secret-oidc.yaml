# Shared `openbank-services` Keycloak client secret. Required at container start:
# a missing Vault projection must fail closed rather than boot with the local-dev default.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: referral-service-oidc
  namespace: referral
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: referral-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
