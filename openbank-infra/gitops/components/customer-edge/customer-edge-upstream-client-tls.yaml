apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: customer-edge-upstream-client-tls
  namespace: customer-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: customer-edge-upstream-client-tls
  duration: 2160h
  renewBefore: 360h
  commonName: customer-edge
  usages:
    - digital signature
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
