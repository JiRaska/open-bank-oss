# SPDX-License-Identifier: Apache-2.0
# Onboarding-funnel alerts (ADR-0069 Phase 2). The customer-edge OnboardingFunnelPublisher
# increments onboarding_funnel_events_total{step,action} on every app-reported funnel transition
# (step & action are closed allow-lists — bounded cardinality). customer-edge's /q/metrics is
# already scraped by the fleet PodMonitor (components/observability/podmonitor-openbank-services.yaml
# lists the customer-edge namespace), so these series reach Prometheus with no extra wiring.
#
# WHY here and not from ClickHouse: the warehouse funnel is for exploration; paging needs a live,
# cheap signal. The final framework-agreement signature is where the feedback said people fall off,
# so the primary alert watches its success ratio.
#
# NOTE: this PrometheusRule lives in the customer-edge namespace (next to the service that emits the
# metric). If this cluster's Prometheus restricts ruleNamespaceSelector, move it to the namespace
# that holds the other PrometheusRules (see components/payments/prometheus-rules.yaml, namespace
# payments) — the rules themselves are namespace-agnostic (metrics carry their own namespace label).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbank-onboarding-funnel-alerts
  namespace: customer-edge
  labels:
    app.kubernetes.io/part-of: openbank
    app.kubernetes.io/name: customer-edge
spec:
  groups:
    - name: openbank.onboarding.funnel
      rules:
        - alert: OnboardingSignConversionLow
          # Of the people who tried to sign the framework agreement in the last hour, fewer than 70%
          # succeeded — with enough attempts (>=10) that the ratio is meaningful, not sandbox noise.
          # This is the single metric the "people fall off at the signature" feedback maps to.
          #
          # `or vector(0)` on the NUMERATOR is what makes 0% conversion visible, and it is not
          # decoration: if not one signature has succeeded, no series carries
          # `action="SIGN_SUCCESS"` at all, so the division matches nothing and the whole
          # expression yields no result — silent in exactly the total-failure case it exists for.
          # `clamp_min` on the denominator cannot help; the missing side is the numerator.
          # Measured against a real all-failing series (`openbank_llm_requests_total` for the
          # #5736 model, 14 errors and 0 successes in 24h): the pre-fix form returns EMPTY, this
          # form returns 0. Same shape as #5733 / #5736.
          #
          # At t=0 on a cold pod every counter is 0, so the `>= 10` attempts guard below is false
          # and the rule is silent — `or vector(0)` adds no boot-time false positive.
          expr: |
            (
              (sum(increase(onboarding_funnel_events_total{step="SIGN", action="SIGN_SUCCESS"}[1h])) or vector(0))
              /
              clamp_min(sum(increase(onboarding_funnel_events_total{step="SIGN", action="SIGN_ATTEMPT"}[1h])), 1)
            ) < 0.70
            and
            sum(increase(onboarding_funnel_events_total{step="SIGN", action="SIGN_ATTEMPT"}[1h])) >= 10
          for: 15m
          labels:
            severity: warning
            service: customer-edge
          annotations:
            # Subject: incremented on the request path (OnboardingFunnelPublisher), not by any scheduler.
            subject_period: continuous
            summary: "Onboarding signature conversion below 70%"
            description: "Fewer than 70% of framework-agreement signature attempts succeeded in the last hour ({{ $value | humanizePercentage }}). Check sca-service / document-service and the sign-fail reasons on the admin onboarding board."
        - alert: OnboardingConsentToSignDropoffHigh
          # Big leak between agreeing to the terms (AGREEMENT completed) and actually reaching the
          # signature (SIGN viewed): >40% of people who consented never even open the sign screen.
          #
          # `or vector(0)` for the same reason as the rule above, and this spelling hides it
          # better: a 100% leak means NOBODY viewed the sign screen, so the `STEP_VIEWED` series
          # does not exist and `1 - (nothing / x)` is nothing, not 1 — blind at exactly the 100%
          # drop-off it is named for. Measured on the same real series: pre-fix EMPTY, post-fix 1.
          # At t=0 on a cold pod the `>= 20` completions guard below is false, so this stays
          # silent through a restart.
          expr: |
            (
              1 -
              (
                (sum(increase(onboarding_funnel_events_total{step="SIGN", action="STEP_VIEWED"}[6h])) or vector(0))
                /
                clamp_min(sum(increase(onboarding_funnel_events_total{step="AGREEMENT", action="STEP_COMPLETED"}[6h])), 1)
              )
            ) > 0.40
            and
            sum(increase(onboarding_funnel_events_total{step="AGREEMENT", action="STEP_COMPLETED"}[6h])) >= 20
          for: 30m
          labels:
            severity: warning
            service: customer-edge
          annotations:
            # Subject: incremented on the request path (OnboardingFunnelPublisher), not by any scheduler.
            subject_period: continuous
            summary: "High drop-off between consent and signature"
            description: "More than 40% of prospects who accepted the terms in the last 6h never reached the signature screen — a funnel leak between account creation and signing. Inspect the admin onboarding conversion board."
    # ADR-0192 screen feedback. Both alerts watch the DELIVERY of a user's report, not its content:
    # feedback is user-initiated, so a dropped submission is a lost user report, not a lost sample.
    - name: openbank.screen.feedback
      rules:
        - alert: FeedbackScreenshotStoreFailing
          # Screenshots are being promised by the app and not landing in object storage. In sandbox
          # the usual cause is that the bucket / EKS Pod Identity association was never provisioned
          # (Terraform, sandbox-platform) — the comment survives, the image does not.
          expr: |
            sum(increase(feedback_submissions_total{screenshot_status="STORE_FAILED"}[1h])) >= 3
          for: 15m
          labels:
            severity: warning
            service: customer-edge
          annotations:
            summary: "Feedback screenshots are not reaching object storage"
            description: "{{ $value }} feedback submissions in the last hour recorded screenshotStatus=STORE_FAILED. Check the feedback bucket, its lifecycle rule and the pod's s3:PutObject permission."
        - alert: FeedbackEmitFailing
          # The Kafka produce itself is failing — the whole submission (comment included) never
          # reaches analytics-sink. Missing/expired Write ACL on openbank.feedback.events is the
          # first thing to check: that exact gap silently hung the sepa-instant and swift submits.
          expr: |
            sum(increase(feedback_emit_failures_total[15m])) > 0
          for: 10m
          labels:
            severity: warning
            service: customer-edge
          annotations:
            summary: "Screen-feedback events are not reaching Kafka"
            description: "customer-edge failed to publish {{ $value }} feedback events in the last 15 minutes. Check the openbank.feedback.events topic and the customer-edge KafkaUser Write ACL."
