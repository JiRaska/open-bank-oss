# Single-owner Postgres for finops-agent (cluster-wide CNPG operator, ADR-0112 / ADR-0148).
# Generates the finops-db-app secret (username/password) + finops-db-rw Service the Deployment uses.
# Cost anomalies are operational telemetry, not regulated records, so the agent degrades to
# no-history on data loss rather than breaching a retention obligation — same posture as devops-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: finops-db
  namespace: finops-agent
spec:
  # DB-layer observability: CNPG's built-in Prometheus exporter on :9187 + a PodMonitor the operator
  # owns (selected cluster-wide), lighting up cnpg_* metrics with zero app changes.
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  instances: 1
  # ECR pull-through instead of ghcr.io (issue #1290). CNPG instance pods are (correctly) excluded
  # from the Kyverno ecr-pull-through-rewrite policy — the operator reconciles the pod image against
  # spec.imageName, so a mutating webhook would make the pod permanently drift. Setting the ref here
  # avoids that. Same tag (18.1) as devops-db.
  imageName: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/ghcr/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike or bulk load cannot fill the 2Gi volume (#1432).
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (#863 pattern). Credentials via EKS Pod Identity on the
  # finops-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain, no secret.
  # Pod Identity injects the creds only at pod ADMISSION, so if this cluster is created during a node
  # roll the DB pod may need one restart before WAL archiving succeeds (#1444/#1759).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/finops-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: openbank_finops
      owner: openbank
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: finops-db-daily
  namespace: finops-agent
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  cluster:
    name: finops-db
