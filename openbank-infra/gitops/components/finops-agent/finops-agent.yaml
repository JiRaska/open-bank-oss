apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-agent
  namespace: finops-agent
  labels:
    app.kubernetes.io/name: finops-agent
    app.kubernetes.io/part-of: finops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finops-agent
        app.kubernetes.io/part-of: finops-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finops-agent
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-finops-agent:sandbox-b17c4632
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8141
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.observability.svc:9093
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-finops
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: finops-agent
  namespace: finops-agent
  labels:
    app.kubernetes.io/name: finops-agent
    app.kubernetes.io/part-of: finops-agent
spec:
  selector:
    app.kubernetes.io/name: finops-agent
  ports:
    - name: http
      port: 8141
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
