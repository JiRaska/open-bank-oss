apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-agent
  namespace: finops-agent
  labels:
    app.kubernetes.io/name: finops-agent
    app.kubernetes.io/part-of: finops-agent
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finops-agent
        app.kubernetes.io/part-of: finops-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finops-agent
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-finops-agent:sandbox-b93d00d3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8141
            - name: management
              containerPort: 8085
          env:
            # Datasource. Without these the pod CrashLoopBackOffs: application.yaml
            # defaults every URL to localhost:5432, so Flyway's migrate-at-start
            # fails with `Connection refused` before the app ever serves. It sat
            # that way while postgres.yaml provisioned a healthy CNPG cluster for a
            # client that could not dial it — the file's own comment says the
            # Deployment uses finops-db-rw, and it did not.
            #
            # NOTE THE VARIABLE NAMES. This service reads JDBC_URL / REACTIVE_URL /
            # POSTGRES_USER / POSTGRES_PASSWORD (see its application.yaml), NOT the
            # QUARKUS_DATASOURCE_* names most siblings use. Copying the campaign
            # block verbatim would set variables nothing reads, leave the localhost
            # defaults in place, and look like a fix while changing nothing.
            #
            # Reactive is the app's own client (Panache); the JDBC leg exists only
            # for Flyway. Both point at the CNPG primary.
            - name: JDBC_URL
              value: jdbc:postgresql://finops-db-rw.finops-agent.svc:5432/openbank_finops
            - name: REACTIVE_URL
              value: postgresql://finops-db-rw.finops-agent.svc:5432/openbank_finops
            - name: POSTGRES_USER
              value: openbank
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finops-db-app
                  key: password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: TEMPORAL_HOST
              value: temporal-frontend.temporal.svc:7233
            - name: TEMPORAL_ENABLED
              value: "true"
            # The daily analysis sweep. Set EXPLICITLY here rather than left to the
            # application.yaml default, because this is the only place an operator looks to
            # answer "when does this agent run" — and until now the answer was "it doesn't".
            # The agent was trigger-only: measured 2026-08-02, the openbank-finops Temporal
            # namespace held 0 schedules and 0 workflow executions, and its result table was
            # empty — which renders as "nothing to act on" rather than "nothing has looked".
            # 03:00 UTC, offset 15 minutes from the control-liveness sentinel (03:15) and devops-agent (03:30):
            # the three share one LiteLLM gateway and one Prometheus.
            # Six fields (second minute hour day month weekday) — Quarkus, not crontab.
            - name: FINOPS_ANALYSIS_CRON
              value: "0 0 3 * * ?"
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: ALERTMANAGER_URL
              value: http://alertmanager-operated.observability.svc:9093
            - name: LLM_GATEWAY_URL
              value: http://litellm.ai-platform.svc:4000
            - name: TEMPORAL_NAMESPACE
              value: openbank-finops
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: finops-agent
  namespace: finops-agent
  labels:
    app.kubernetes.io/name: finops-agent
    app.kubernetes.io/part-of: finops-agent
spec:
  selector:
    app.kubernetes.io/name: finops-agent
  ports:
    - name: http
      port: 8141
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
