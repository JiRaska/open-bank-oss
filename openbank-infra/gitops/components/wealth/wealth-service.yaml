# wealth-service: customer-declared off-platform holdings (ADR-0301). Reactive Postgres datasource
# + Flyway JDBC migrations against the single-owner CNPG cluster. Produces the holding lifecycle
# onto openbank.wealth.events through the transactional outbox; consumes nothing today. Calls no
# other service. OIDC bearer validation points at Keycloak. Reachable only in-cluster via
# ClusterIP, no ingress — the customer path is customer-edge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealth-service
  namespace: wealth
  labels:
    app.kubernetes.io/name: wealth-service
    app.kubernetes.io/part-of: wealth
spec:
  replicas: 1
  # Terminate-first, deliberately. With the default RollingUpdate a ONE-replica Deployment must
  # schedule the new pod BEFORE it may stop the old one, so the rollout needs room for two pods —
  # and the old pod holds exactly the resources the new one needs. On a cluster with no spare room
  # that is a deadlock the rollout never escapes. The trade is a few seconds of unavailability per
  # deploy, which a single-replica service already has. A multi-replica money-path service must
  # NOT copy this.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wealth-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-wealth-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "db1b0275a3ad618a"
      labels:
        app.kubernetes.io/name: wealth-service
        app.kubernetes.io/part-of: wealth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wealth-service
          # First build lands via auto-deploy on the merge that adds openbank-wealth-service to
          # ALL_SERVICES; the auto-deploy gitops PR rewrites this pin to the built sha.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-wealth-service:sandbox-3630933e
          imagePullPolicy: IfNotPresent
          ports:
            # HTTP 8154 and management 8090 — both read off the service's own application.yaml
            # (quarkus.http.port / quarkus.management.port). The management port is NOT the
            # fleet-common 8085 here; probes below target 8090 deliberately.
            - name: http
              containerPort: 8154
            - name: management
              containerPort: 8090
          env:
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary. The service's
            # application.yaml hardcodes localhost for both; these env vars override it, since an
            # env source outranks application.yaml in SmallRye's ordinal.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://wealth-db-rw.wealth.svc:5432/openbank_wealth
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://wealth-db-rw.wealth.svc:5432/openbank_wealth
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wealth-db-app
                  key: password
            # Kafka: the outbox dispatcher produces the holding lifecycle -> Strimzi bootstrap
            # over mTLS (ADR-0137). The connector reads only KAFKA_BOOTSTRAP_SERVERS, never a
            # quarkus.* key.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wealth-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # The outbox dispatcher defaults to DISABLED fleet-wide. Without this the holding
            # lifecycle never leaves wealth_outbox — no error, attempt_count stays 0 — and every
            # consumer stays permanently empty. Set in application.yaml too; this keeps the
            # deployed environment stating it explicitly.
            - name: OPENBANK_OUTBOX_DISPATCH_ENABLED
              value: "true"
            # Keycloak runs in `iam`, not `platform`. A wrong host does not fail the boot (OIDC
            # defers discovery to the first request) — it just makes every authenticated call
            # fail later with `Name does not resolve`.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealth-service-oidc
                  key: OIDC_CLIENT_SECRET
            # OPA sidecar enforced from the first rollout: wealth_rest_ext.rego grants the four
            # customer actions to the edge principal only, and no service-account reaches a write
            # by any rule.
            - name: AUTHZ_ENFORCE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
        # OPA policy decision point (ADR-0034). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default). Bundle mounted read-only from the
        # wealth-opa-bundle ConfigMap generated by gen-wealth-opa-bundle.sh.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach /health.
            # The image is scratch (no shell), so an exec probe isn't possible. Reachability is
            # fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            # `--bundle` is REQUIRED, not decorative: without it OPA loads /bundle as a plain data
            # directory and merges every YAML into the root data document, so rules-data.yaml and
            # agents-data.yaml collide and the sidecar dies with `merge error`. In bundle mode the
            # roots declared in .manifest keep them apart. Mount paths below must match.
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/wealth_rest_ext.rego
              subPath: wealth_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Data files land under the bundle roots declared in .manifest (`agents`, `rules`) —
            # NOT flat in /bundle, which is what produced the merge error above.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: wealth-service-kafka-keystore
            optional: false
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
            optional: false
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: wealth-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: wealth-service
  namespace: wealth
  labels:
    app.kubernetes.io/name: wealth-service
    app.kubernetes.io/part-of: wealth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wealth-service
  ports:
    - name: http
      port: 8154
      targetPort: http
    - name: management
      port: 8090
      targetPort: management
