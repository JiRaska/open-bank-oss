#
# NetworkPolicy baseline for the argo-rollouts namespace (ADR-0081, ADR-0098).
#
# NOT generated by gen-network-policies.py — that script targets SERVICE namespaces
# only. Infrastructure namespaces (argo-rollouts, argocd, observability, etc.) are
# managed here manually with label openbank.io/derived: gitops-manual so the drift
# gate recognises them as intentionally hand-authored.
#
# INERT until the VPC CNI network-policy agent is enabled (manual platform-tofu
# apply, ADR-0060). Rollback = delete the NetworkPolicy objects.
---
# Argo Rollouts controller: allow intra-namespace traffic (ArgoCD sync probe) and
# Prometheus scrape on :8090 from the observability namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-rollouts-controller-ingress-allow-list
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/part-of: argo-rollouts
    openbank.io/derived: gitops-manual
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8090
---
# Argo Rollouts dashboard: allow intra-namespace traffic only (internal ClusterIP,
# no external Ingress per ADR-0056). Operators reach it via kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-rollouts-dashboard-ingress-allow-list
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/part-of: argo-rollouts
    openbank.io/derived: gitops-manual
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
