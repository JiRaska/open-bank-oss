#
# ADR-0387 D3: the JS renderer credential (Cloudflare Browser Run). Seeded once into OpenBao KV
# at `fetch-broker/browser-run` by the owner, out of band; nothing in this repo holds the value or
# the account-specific endpoint. Both keys are consumed ONLY by the openbank-fetch-broker
# Deployment (check-public-web-fetch.py enforces that no other workload references this secret).
#
# The renderer is OPTIONAL: until the KV entry exists this ExternalSecret stays unsynced, the pod
# mounts the keys with `optional: true`, and every `render: js` host answers NOT_RENDERABLE while
# plain HTTP fetching keeps working. Switching the renderer off later = delete the KV entry (or
# this file); no charter changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-run-api-token
  namespace: fetch-broker
  annotations:
    open-bank.tech/rotation-deadline: "2027-11-18"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: browser-run-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_token
      remoteRef:
        key: fetch-broker/browser-run
        property: api_token
    - secretKey: base_url
      remoteRef:
        key: fetch-broker/browser-run
        property: base_url
