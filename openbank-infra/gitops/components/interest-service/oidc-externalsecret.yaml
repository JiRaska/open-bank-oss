# OIDC client secret for interest-service (Keycloak client openbank-services).
# Same shared service-account secret used by the other app-plane services, stored in Vault
# under key `account-service`. Mirrors document-service/billing's oidc-externalsecret.yaml exactly.
#
# Why this was missing until #1618: interest-service never made an OUTBOUND M2M call before — the
# accrual engine (accrueAll) was a stub, and capitalization (its only other outbound path) never ran
# against real data. So the empty `interest-service-oidc` reference in the Deployment (optional:true)
# went unnoticed. Now the accrual run calls account-service (GET /accounts/active + /balance) via the
# OidcClientRequestReactiveFilter, which mints an openbank-services token from THIS secret — without
# it every accrual tick 401s at account-service and (fail-open) accrues nobody.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: interest-service-oidc
  namespace: interest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: interest-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# #10486 step 1: interest-service's OWN Keycloak client `openbank-interest`, used ONLY by the
# ledger rest-client (named oidc-client `ledger`) for the capitalization journal (ledger.create).
# Deliberately NOT the shared `account-service` entry above: that entry holds the shared
# `openbank-services` secret, and a per-service principal is the whole point of this client.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`), the path the Tier-2 secret rotator already reads and patches. The entry
# is written ONCE by the owner when the client is created in the live realm (runbook 0009's
# "Per-service M2M client" section); nothing in this repo mints or holds the value.
#
# The consuming env ref is `optional: false` on purpose: if this entry has not been seeded, the
# new pod stays in CreateContainerConfigError (loud) instead of booting with an empty secret and
# failing every capitalization post later (quiet). Seed Vault BEFORE this manifest syncs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: interest-service-ledger-oidc
  namespace: interest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: interest-service-ledger-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_LEDGER_CLIENT_SECRET
      remoteRef:
        key: keycloak/interest-service
        property: client_secret
