# interest-service onboarded to the cluster (ADR-0037 domain=namespace). Reactive
# Postgres + Flyway migrations on boot, Redis idempotency, Kafka outbox. OIDC bearer
# validation via the in-cluster Keycloak. Read MCP tools (agent-service) reach it here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interest-service
  namespace: interest
  labels: {app.kubernetes.io/name: interest-service, app.kubernetes.io/part-of: interest}
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: interest-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: interest-service, app.kubernetes.io/part-of: interest}
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-interest-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "732ca544ad7f368e"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: interest-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-interest-service:sandbox-54af76ea
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8125}
            - {name: management, containerPort: 8085}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://interest-db-rw.interest.svc:5432/openbank_interest
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://interest-db-rw.interest.svc:5432/openbank_interest
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: interest-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: interest-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: interest-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: interest-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.interest.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: interest-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: interest-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: true
            # ADR-0033 §D capitalization credit leg. Without this the rest-client fell back to
            # application.yaml's http://localhost:8101 inside this pod, so every capitalization
            # journal was a connection refused — the file's own comment already said a deployment
            # MUST set this. ledger-service's private-CA mTLS listener (8443, client auth REQUIRED,
            # client cert interest-internal-tls, %prod bucket ledger-authority). ledger.create for
            # the shared openbank-services service account is already allowed by service-ledger-post
            # in ledger_rest_ext.rego, so no policy change.
            - name: LEDGER_SERVICE_URL
              value: https://ledger-service.ledger.svc:8443
            # #999 withholding-tax remittance leg: the accrued tax is booked to the finanční úřad
            # through transaction-service. Without this the rest-client fell back to
            # http://localhost:8102 inside this pod, so WithholdingRemittanceSettlementConsumer's
            # POST /api/v1/transactions was a connection refused, retried three times and
            # dead-lettered — a due tax remittance that never moved money. transaction-service's
            # private-CA mTLS listener (8443, client auth REQUIRED, client cert
            # interest-internal-tls, %prod bucket transaction-authority).
            # TRANSPORT ONLY — authorization is NOT settled by this line. The route is
            # @RolesAllowed(ROLE_OPERATOR) as well as @Authorize(transaction.create), and RBAC is
            # the OUTER gate (AuthorizeInterceptor is a CDI interceptor at PLATFORM_AFTER+100),
            # so OPA is not what decides this call. Whether the shared openbank-services token
            # carries ROLE_OPERATOR in the live realm is unresolved — tracked in #10404.
            - name: TRANSACTION_SERVICE_URL
              value: https://transaction-service.payments.svc:8443
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Fleet directory for the daily accrual run (#1618): discovers ACTIVE accounts
            # (GET /accounts/active) and reads their booked balance (GET /accounts/{id}/balance).
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service.accounts.svc:8100"
            # CatalogInterestProfileSynchronizer, driven by CatalogInterestSnapshotScheduler,
            # reads product-catalog on every tick. Without this the app default (localhost:8104)
            # was dialled inside this pod and every sync failed (#10383). product-catalog's
            # private-CA mTLS listener (8443, client auth REQUIRED); client cert
            # interest-service-internal-tls, %prod TLS bucket catalog-authority. ASVS V9.1 forbids
            # a new plaintext http:// value here.
            - name: PRODUCT_CATALOG_URL
              value: https://product-catalog.accounts.svc:8443
            # OPA sidecar enforced (ADR-0034 Phase 5, issue #3679). Advisory since the Phase-5
            # sidecar bootstrap (issue #938); coverage verified before the flip: all five
            # @Authorize actions (interest.list/read/create/delete/trigger) are granted to
            # ROLE_OPERATOR by the rules.yaml role_action_matrix, reads additionally reach the
            # shared M2M client via operator-read-any, and no M2M writer exists.
            - name: AUTHZ_ENFORCE
              value: "true"
          startupProbe: {tcpSocket: {port: management}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, periodSeconds: 15, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: catalog-tls
              mountPath: /mnt/catalog-tls
              readOnly: true
            - name: ledger-tls
              mountPath: /mnt/ledger-tls
              readOnly: true
            # Same interest-internal-tls Secret, mounted a second time: one client identity, one
            # private CA, but each bucket's paths name the upstream it authenticates to.
            - name: transaction-tls
              mountPath: /mnt/transaction-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 360Mi}
            limits: {cpu: "1", memory: 1536Mi}
        # OPA policy-decision sidecar (ADR-0034, issue #938 bootstrap). Serves
        # data.openbank.rest.allow for all @Authorize-annotated endpoints in interest-service
        # (interest.*). Bundle mounted from interest-opa-bundle ConfigMap (gen-interest-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet: {path: "/health?bundles=true", port: 8181}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/interest_rest_ext.rego
              subPath: interest_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        # One client certificate, mounted twice: interest-internal-tls (#10397) identifies
        # interest-service to BOTH upstream listeners, which trust the one private CA. Each %prod
        # TLS bucket names its own path, so the mounts stay readable next to the config.
        - name: catalog-tls
          secret:
            secretName: interest-internal-tls
            optional: false
        - name: ledger-tls
          secret:
            secretName: interest-internal-tls
            optional: false
        - name: transaction-tls
          secret:
            secretName: interest-internal-tls
            optional: false
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: interest-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: interest-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: interest-service
  namespace: interest
  labels: {app.kubernetes.io/name: interest-service}
spec:
  selector: {app.kubernetes.io/name: interest-service}
  ports: [{name: http, port: 8125, targetPort: http}]
