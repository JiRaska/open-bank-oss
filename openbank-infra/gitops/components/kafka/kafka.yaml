# Single-broker KRaft Kafka for the sandbox. Strimzi 0.46+ is KRaft-only and
# requires KafkaNodePools (both annotations below). One dual-role node
# (controller+broker) for FinOps; prod should split roles and raise replicas to
# 3 with matching replication factors. Kafka version is intentionally omitted so
# the operator pins its own supported default. Bootstrap Service for clients:
# `openbank-cluster-kafka-bootstrap.messaging.svc:9092` (internal plaintext).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  # Strimzi copies this pool's labels — including ArgoCD's
  # `argocd.argoproj.io/instance` tracking label — onto every PVC it
  # provisions, which makes ArgoCD treat the broker's data volume as a
  # tracked-but-unmanaged resource and (with prune on) delete it. Stamp the
  # per-resource opt-out onto the PVCs so they survive a prune regardless of
  # the app's prune setting. Belt to the kafka Application's prune=false suspenders.
  template:
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        class: gp3
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      # 768Mi → 1152Mi (issue #809): measured steady-state ~1Gi — the request
      # must cover it so Karpenter's bin-packing stays honest.
      memory: 1152Mi
    limits:
      cpu: "1"
      memory: 1536Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: openbank-cluster
  namespace: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # SimpleAuthorizer for KafkaUser ACLs (ADR-0108 hardening, issue #2013;
    # ADR-0137 mTLS migration). KRaft inter-broker comms use the managed
    # controller listener and are unaffected by SimpleAuthorizer.
    #
    # Enforcement model: SimpleAuthorizer is deny-by-default for EVERY resource,
    # because `allow.everyone.if.no.acl.found: "false"` below (#2794). A topic
    # with no ACL at all is therefore denied to everyone, not open — so every
    # client needs a KafkaUser whose ACLs name every topic it touches.
    #
    # This comment previously described the opposite model ("allow-everyone only
    # for resources with NO ACL, because allow.everyone.if.no.acl.found=true
    # below"), which had been false since #2794 flipped the flag. That stale
    # prose is what made a set of missing producer grants read as deliberate:
    # domestic-payment's own event topic had no Write grant and 13 outbox rows
    # went DEAD before anyone looked (#3271).
    #
    # ACLs bind to the authenticated principal, not the listener, so the
    # plaintext listener below grants nothing: an unauthenticated client is
    # `User:ANONYMOUS`, which holds no ACL anywhere and is denied on every
    # resource (`… is Denied … based on rule DefaultDeny` in the broker log).
    authorization:
      type: simple
    # Broker-layer observability (Dynatrace-parity #0). Strimzi's bundled JMX
    # Prometheus exporter publishes broker metrics on :9404 (container port
    # `tcp-prometheus`); rules are in the kafka-metrics ConfigMap below. Lights
    # up under-replicated/offline partitions, request rates and throughput —
    # none of which were scraped before.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    listeners:
      # Anonymous plaintext listener — retained for backward compatibility.
      #
      # It grants NOTHING: a client here is `User:ANONYMOUS`, which holds no ACL
      # and is denied on every resource by the deny-by-default config below. So
      # "still on 9092" and "cannot use Kafka" are the same statement, and it is
      # not a hole — but it is an entry point that only ever produces silent
      # failures, which is why it should go.
      #
      # "All 33 deployed Kafka clients migrated to mTLS:9093 (ADR-0137 fleet
      # sweep complete)" stood here and was NOT true. Measured on the live
      # sandbox 2026-08-03 (#3393), three workloads still declared :9092:
      #   * security-scanner-service — no KafkaUser at all; both topic log
      #     segments are 0 bytes and dated their creation day, so it has never
      #     published anything. Given an identity in this change.
      #   * kafka-ui — the ONLY thing actually sending on :9092 today, and every
      #     request is refused (`Principal = User:ANONYMOUS is Denied operation =
      #     DESCRIBE … based on rule DefaultDeny`, once per 30s poll). The UI
      #     renders an empty cluster rather than an error. Needs its own
      #     KafkaUser before the listener can go (#3393 follow-up).
      #   * settlement-service — carries KAFKA_BOOTSTRAP_SERVERS but has no
      #     `mp.messaging` config and opens no connection; the env var is dead.
      # Removing the listener is still a follow-up step (runbook 0008), and it is
      # blocked on kafka-ui, not on the services.
      - name: plain
        port: 9092
        type: internal
        tls: false
      # mTLS listener (ADR-0137). Clients presenting a cluster-CA-signed client
      # cert authenticate as the matching KafkaUser principal; this is what the
      # payment.scheme-accepted producers/consumer use so their ACLs apply.
      # `authentication.type: tls` ⇒ mutual TLS, so a client with no client
      # cert cannot connect on this port at all. Reachable at
      # `openbank-cluster-kafka-bootstrap.messaging.svc:9093`.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      # Single broker ⇒ every replication factor must be 1 or topic creation
      # blocks. Raise all of these in prod alongside the 3-node pool.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Cluster-wide authorization posture: deny-by-default for ALL topics.
      # User:ANONYMOUS (plaintext) is denied on every topic including those
      # without explicit ACLs — which is why a client left on :9092 does not
      # merely lose its ACLs, it loses Kafka entirely (see the listener comment
      # above for the three that were still there on 2026-08-03). Non-deployed
      # services (card-issuance, sdd, standing-order, tpp-registry) are RBAC
      # pre-registered and will receive gitops mTLS manifests before their first
      # deploy.
      allow.everyone.if.no.acl.found: "false"
  # Consumer-lag visibility (Dynatrace-parity #0). The Kafka Exporter is a
  # separate pod (also on `tcp-prometheus`:9404) that turns consumer group
  # offsets into `kafka_consumergroup_lag` — the single most useful event-bus
  # health signal for the service fleet's outbox→topic consumers.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
  # Strimzi ships the entity operator with NO resources (BestEffort) — the pod
  # measures ~470Mi (topic ~210Mi + user ~260Mi) that the scheduler never saw,
  # eroding node headroom on whatever node it lands on (issue #809).
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 25m
          memory: 288Mi
        limits:
          cpu: 250m
          memory: 448Mi
---
# Domain event topic for account-service. Declared explicitly (the broker does
# not auto-create topics) so the topic operator manages it and the producer's
# readiness probe goes green. Single partition + RF 1 to match the single-broker
# sandbox; prod should raise partitions for parallelism and RF to 3.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.accounts.account.created
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Dead-letter topic for account-service's party-events-in channel (SmallRye
# failure-strategy: dead-letter-queue). A party event whose projection survives the
# consumer's bounded retry is parked here for inspection/replay instead of being dropped.
# Name is SmallRye's default (dead-letter-topic-<channel>) — set implicitly, not via a
# dotted `dead-letter-queue.topic` YAML key (that key is silently mis-quoted by SmallRye
# Config). Longer retention than the source topic: a DLQ record is a real incident that may
# outlive a 7-day window before someone replays it. No consumer by design — it is a
# quarantine, invisible to the event-consumer-liveness gate (that gate reads `outgoing:`
# channels, and this producer is the connector's implicit DLQ, not a declared channel).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dead-letter-topic-party-events-in
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
