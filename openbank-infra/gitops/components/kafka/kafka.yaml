# Single-broker KRaft Kafka for the sandbox. Strimzi 0.46+ is KRaft-only and
# requires KafkaNodePools (both annotations below). One dual-role node
# (controller+broker) for FinOps; prod should split roles and raise replicas to
# 3 with matching replication factors. Kafka version is intentionally omitted so
# the operator pins its own supported default. Bootstrap Service for clients:
# `openbank-cluster-kafka-bootstrap.messaging.svc:9093` (internal mTLS — the only
# listener; the plaintext :9092 one was removed in #3393).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  # Strimzi copies this pool's labels — including ArgoCD's
  # `argocd.argoproj.io/instance` tracking label — onto every PVC it
  # provisions, which makes ArgoCD treat the broker's data volume as a
  # tracked-but-unmanaged resource and (with prune on) delete it. Stamp the
  # per-resource opt-out onto the PVCs so they survive a prune regardless of
  # the app's prune setting. Belt to the kafka Application's prune=false suspenders.
  template:
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        class: gp3
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      # 768Mi → 1152Mi (issue #809): measured steady-state ~1Gi — the request
      # must cover it so Karpenter's bin-packing stays honest.
      memory: 1152Mi
    limits:
      cpu: "1"
      memory: 1536Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: openbank-cluster
  namespace: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # SimpleAuthorizer for KafkaUser ACLs (ADR-0108 hardening, issue #2013;
    # ADR-0137 mTLS migration). KRaft inter-broker comms use the managed
    # controller listener and are unaffected by SimpleAuthorizer.
    #
    # Enforcement model: SimpleAuthorizer is deny-by-default for EVERY resource,
    # because `allow.everyone.if.no.acl.found: "false"` below (#2794). A topic
    # with no ACL at all is therefore denied to everyone, not open — so every
    # client needs a KafkaUser whose ACLs name every topic it touches.
    #
    # This comment previously described the opposite model ("allow-everyone only
    # for resources with NO ACL, because allow.everyone.if.no.acl.found=true
    # below"), which had been false since #2794 flipped the flag. That stale
    # prose is what made a set of missing producer grants read as deliberate:
    # domestic-payment's own event topic had no Write grant and 13 outbox rows
    # went DEAD before anyone looked (#3271).
    #
    # ACLs bind to the authenticated principal, not the listener. That is why the
    # plaintext listener that used to sit below granted nothing while it existed —
    # an unauthenticated client is `User:ANONYMOUS`, which holds no ACL anywhere and
    # is denied on every resource (`… is Denied … based on rule DefaultDeny` in the
    # broker log) — and why removing it (#3393) changed no principal's authority.
    authorization:
      type: simple
    # Broker-layer observability (Dynatrace-parity #0). Strimzi's bundled JMX
    # Prometheus exporter publishes broker metrics on :9404 (container port
    # `tcp-prometheus`); rules are in the kafka-metrics ConfigMap below. Lights
    # up under-replicated/offline partitions, request rates and throughput —
    # none of which were scraped before.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    listeners:
      # There is no `plain` (9092) listener any more — runbook 0008's last step, done
      # here (#3393). What used to sit here was an anonymous plaintext listener kept
      # "for backward compatibility" with a comment claiming all 33 clients had already
      # migrated. That claim was false, and the listener granted nothing anyway: a
      # client on it is `User:ANONYMOUS`, which holds no ACL and is denied on every
      # resource by the deny-by-default config below. "Still on 9092" and "cannot use
      # Kafka" were the same statement — which is exactly why it had to go: it was an
      # entry point that could only ever produce silent failures.
      #
      # Measured on the live sandbox 2026-08-03 (#3393), three workloads still declared
      # :9092, and each is resolved before this removal rather than by it:
      #   * security-scanner-service — no KafkaUser at all; both topic log segments were
      #     0 bytes and dated their creation day, so it had never published anything.
      #     Given an identity and moved to :9093 in the parent change.
      #   * kafka-ui — the ONLY thing actually sending on :9092, refused on every
      #     request (`Principal = User:ANONYMOUS is Denied operation = DESCRIBE … based
      #     on rule DefaultDeny`, once per 30s poll) and rendering that as an empty
      #     cluster. Now `User:kafka-ui` on :9093 (components/kafka/kafka-ui-mtls.yaml).
      #   * settlement-service — carried KAFKA_BOOTSTRAP_SERVERS with no `mp.messaging`
      #     config and no Kafka client in its source at all; the env var was dead and is
      #     deleted (components/payments/payments-services.yaml).
      #
      # Strimzi rolls the broker to drop the listener. Anything that appears on :9092
      # after this fails to CONNECT instead of authenticating as ANONYMOUS and being
      # denied per request — a louder failure than the one being removed, which is the
      # point. Rollback is re-adding the four lines; it restores connectivity but not
      # authorization, so it is only ever worth doing to quiet a connection-error loop.
      #
      # mTLS listener (ADR-0137). Clients presenting a cluster-CA-signed client
      # cert authenticate as the matching KafkaUser principal; this is what the
      # payment.scheme-accepted producers/consumer use so their ACLs apply.
      # `authentication.type: tls` ⇒ mutual TLS, so a client with no client
      # cert cannot connect on this port at all. Reachable at
      # `openbank-cluster-kafka-bootstrap.messaging.svc:9093`.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      # Single broker ⇒ every replication factor must be 1 or topic creation
      # blocks. Raise all of these in prod alongside the 3-node pool.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Cluster-wide authorization posture: deny-by-default for ALL topics. A
      # topic with no ACL is denied to every principal, so this stays load-bearing
      # now that mTLS is the only way in: it is what makes an unlisted topic a
      # denial rather than a default-open. Non-deployed services (card-issuance,
      # sdd, standing-order, tpp-registry) are RBAC pre-registered and will
      # receive gitops mTLS manifests before their first deploy.
      allow.everyone.if.no.acl.found: "false"
  # Consumer-lag visibility (Dynatrace-parity #0). The Kafka Exporter is a
  # separate pod (also on `tcp-prometheus`:9404) that turns consumer group
  # offsets into `kafka_consumergroup_lag` — the single most useful event-bus
  # health signal for the service fleet's outbox→topic consumers.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
  # Strimzi ships the entity operator with NO resources (BestEffort) — the pod
  # measures ~470Mi (topic ~210Mi + user ~260Mi) that the scheduler never saw,
  # eroding node headroom on whatever node it lands on (issue #809).
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 25m
          memory: 288Mi
        limits:
          cpu: 250m
          memory: 448Mi
---
# Domain event topic for account-service. Declared explicitly (the broker does
# not auto-create topics) so the topic operator manages it and the producer's
# readiness probe goes green. Single partition + RF 1 to match the single-broker
# sandbox; prod should raise partitions for parallelism and RF to 3.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.accounts.account.created
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# billing-service's single outbox topic (#4217, ADR-0248) — carries all its events
# (billing.fee.post-intent.v1, billing.fee.reversal-intent.v1, and the new
# AnnualFeeSummaryReady) via its one "billing-events-out" channel. Single partition
# + RF 1 to match the single-broker sandbox; prod should raise partitions/RF.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.billing.fee.event
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Dead-letter topic for account-service's party-events-in channel (SmallRye
# failure-strategy: dead-letter-queue). A party event whose projection survives the
# consumer's bounded retry is parked here for inspection/replay instead of being dropped.
# Name is SmallRye's default (dead-letter-topic-<channel>) — set implicitly, not via a
# dotted `dead-letter-queue.topic` YAML key (that key is silently mis-quoted by SmallRye
# Config). Longer retention than the source topic: a DLQ record is a real incident that may
# outlive a 7-day window before someone replays it. No consumer by design — it is a
# quarantine, invisible to the event-consumer-liveness gate (that gate reads `outgoing:`
# channels, and this producer is the connector's implicit DLQ, not a declared channel).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dead-letter-topic-party-events-in
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
# ADR-0220 D2 feedback loop. No consumer exists yet (allowlisted in rules.yaml:
# event_consumer_liveness) — this is the first slice's producer, ahead of the analytics
# consumer ADR-0221's dashboards are meant to read from. Contract:
# openbank-contracts/openbank-engagement-service/asyncapi.yaml.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.engagement.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Incentive offer, inventory and reservation lifecycle evidence. This resource only declares the
# broker destination; incentive-service itself is not deployed by this PR. The producer-first
# consumer gap is explicitly tracked by #7210 and allowlisted in governance until the first real
# downstream projection removes that exception.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.incentive.events
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
# Campaign-owned commands consumed by engagement-service. A compacted key (the campaign send-log
# id) makes the placement idempotent across Temporal/Kafka retries while keeping the current slot
# materialisation recoverable.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: openbank.campaign.banner.placements
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
