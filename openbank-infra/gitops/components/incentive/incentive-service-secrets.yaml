#
# Runtime secret references for the future Incentive workload. These ExternalSecrets contain no
# secret value and do not create or activate a Deployment. The promo-code pepper is deliberately
# required by the application at startup; until its operator-owned Vault value exists, a later
# workload rollout must remain blocked rather than falling back to an unsafe default.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: incentive-service-promo-code-pepper
  namespace: incentive
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: incentive-service-promo-code-pepper
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: PROMO_CODE_PEPPER
      remoteRef:
        key: incentive-service
        property: PROMO_CODE_PEPPER
