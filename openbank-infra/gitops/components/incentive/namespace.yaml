# Incentive domain (ADR-0037: domain = namespace). This component intentionally contains no
# service Deployment, image reference, Service, or NetworkPolicy. Its secret projections are
# staged prerequisites only; a later reviewed workload still requires the signed image, backup
# identity, and externally seeded promo-code pepper to be independently evidenced.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # A clean manual/DR sync must create the namespace before the wave -1
    # ExternalSecrets that target it. Keep this earlier than every namespaced prerequisite.
    argocd.argoproj.io/sync-wave: "-3"
  name: incentive
  labels:
    openbank.io/plane: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
