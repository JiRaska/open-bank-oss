# Incentive domain (ADR-0037: domain = namespace). This component contains reviewed desired
# workload, image, Service, NetworkPolicy, and prerequisite secret projections, but its manual
# owning Application is not live evidence. Customer-edge wiring and traffic activation remain
# separately reviewed steps after manual sync and observed health.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # A clean manual/DR sync must create the namespace before the wave -1
    # ExternalSecrets that target it. Keep this earlier than every namespaced prerequisite.
    argocd.argoproj.io/sync-wave: "-3"
  name: incentive
  labels:
    openbank.io/plane: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
