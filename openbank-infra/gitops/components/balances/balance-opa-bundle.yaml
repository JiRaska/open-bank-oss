# GENERATED by gen-balance-opa-bundle.sh — do not hand-edit.
# Source: rest.rego + balance_rest_ext.rego + agents.rego + agents.yaml + rules.yaml + bundle.manifest
apiVersion: v1
kind: ConfigMap
metadata:
  name: balance-opa-bundle
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
    app.kubernetes.io/part-of: balances
  annotations:
    openbank.tech/policy-checksum: "94c7e43cae2f6dd2"
data:
  rest.rego: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    #
    # REST endpoint authorization (ADR-0034 D1). This is the policy enforcement point that
    # AuthorizeInterceptor in openbank-libs queries before letting a @Authorize-annotated
    # JAX-RS method proceed:
    #   data.openbank.rest.allow
    # with input { principal, action, resource?, attributes }. Deny is the default; an
    # allow requires a matching rule below.
    #
    # Co-located with openbank.agents (MCP /tools/call gate, ADR-0031) so a SINGLE OPA
    # sidecar serves both — the whole point of ADR-0034. Shared predicates (money_path,
    # value_band, four_eyes_required) live in openbank.shared so we never fork between
    # the human-actor and AI-actor planes.
    #
    # Charters / rules are loaded from openbank-libs/governance/ as data:
    #   - data.agents.*  ← agents.yaml (ADR-0031)
    #   - data.rules.*   ← rules.yaml  (money_path_services, value_bands, four_eyes)

    package openbank.rest

    import rego.v1

    # ---------------------------------------------------------------------------------------
    # Default deny (ADR-0034 D1: deny-by-default mirrors the agents.rego stance).
    # Every allow below must be triggered by an explicit rule; absence of a matching
    # rule yields {} which the Kotlin client maps to AuthzDecision(allow=false).
    # ---------------------------------------------------------------------------------------
    default allow := false

    # ---------------------------------------------------------------------------------------
    # allow as a structured object — the OpaSidecarPolicyDecisionPoint accepts either a
    # bare boolean (legacy) or this richer shape (preferred). reason and policy_version
    # are forwarded into AuditEvent so a post-incident SQL query like
    #   SELECT count(*) WHERE decision_reason ILIKE 'four-eyes%'
    # is trivially answerable.
    # ---------------------------------------------------------------------------------------
    allow := {
    	"allow": true,
    	"reason": reason,
    	"policy_version": policy_version,
    	"attributes": response_attributes,
    } if {
    	count(allowed_reasons) > 0

    	# Defense-in-depth: a prohibited action (e.g. flipping off SCA/sanctions via a feature
    	# flag, issue #419) can never be granted by ANY reason — not even operator-on-own-tenant
    	# with a tenant-matched resource. Gating the allow head, not each reason, makes this
    	# impossible to bypass by enriching the input (the prohibition is not just surfaced).
    	not prohibited

    	# Pick the lexicographically smallest reason so the complete rule produces a single
    	# deterministic output even when multiple allowed_reasons rules fire simultaneously
    	# (e.g. operator-on-own-tenant + operator-read-any for a tenant-scoped read).
    	reason := min(allowed_reasons)
    }

    # Surfaced on the allow object so OpaSidecarPolicyDecisionPoint (which reads
    # `result.attributes` generically) actually delivers it to AuthzDecision.attributes.
    # A fleet audit (issue #395) found four_eyes_required was computed below but never
    # reached this object — "attributes" was simply absent from the allow head — so no
    # caller anywhere could ever have acted on it, independent of any money_path_scopes
    # naming mismatch. Sparse on purpose: omitted (not `false`) when not required, matching
    # this file's existing audit-attribute style (cf. default policy_version above).
    default response_attributes := {}

    response_attributes := {"four_eyes_required": true} if four_eyes_required

    # policy_version is audit METADATA, never a gate. Resolve it via a defaulted rule so
    # a bundle that omits openbank.bundle.version cannot turn a legitimate allow into an
    # (undefined object head → default) DENY: referencing an undefined value inside the
    # allow object literal would make the whole head undefined and silently fail closed.
    # (object.get(data.openbank, ...) would self-reference this package → rego_recursion;
    # the narrow path below does not.)
    default policy_version := "unknown"

    policy_version := data.openbank.bundle.version

    # ---------------------------------------------------------------------------------------
    # Reasons — each rule that grants access publishes its name here so the audit trail
    # tells us WHICH rule fired, not just "allow=true".
    # ---------------------------------------------------------------------------------------
    allowed_reasons contains "operator-on-own-tenant" if {
    	input.principal.type == "HUMAN"
    	"ROLE_OPERATOR" in input.principal.roles

    	# Resource-scoped actions must target the operator's tenant; non-scoped
    	# (system-wide) actions are not granted by this rule.
    	input.resource
    	input.principal.attributes.tenant == input.resource.attributes.tenant
    }

    allowed_reasons contains "compliance-read-any" if {
    	input.principal.type == "HUMAN"
    	"ROLE_COMPLIANCE" in input.principal.roles
    	endswith(input.action, ".read")
    }

    # AI agents go through this same query when the agent's tool wraps a REST call
    # (ADR-0031 D5). The charter check is delegated to agents.rego so we don't
    # duplicate the charter logic — call it through the unified package boundary.
    allowed_reasons contains "agent-charter-allows" if {
    	input.principal.type == "AI_AGENT"

    	# Translate the REST input into the MCP input shape and reuse agents.allow --
    	# NOT charter_allowed: agents.allow ALSO applies hard_denied / charter_denied /
    	# skill_ok, none of which charter_allowed alone consults. Calling charter_allowed
    	# directly would let a fleet-wide hard-denied tool tier, or an agent's own
    	# tools.deny glob, silently reach a REST action anyway.
    	data.openbank.agents.allow with input as {
    		"agent": input.principal.id,
    		"tool": input.action,
    		"resource": input.resource,
    	}
    }

    # A party (HUMAN whose JWT `sub` is a partyId) may list or read its OWN resources.
    # The resource.id carries the path-parameter value extracted by AuthorizeInterceptor
    # (e.g. partyId for device.list); principal.id is the JWT `sub` claim — in the customer
    # realm (ADR-0065/0066) the sub IS the partyId, making the equality check sufficient.
    # Scoped to read-family verbs so self-service can never mutate another party's data.
    allowed_reasons contains "party-self-service" if {
    	input.principal.type == "HUMAN"
    	input.resource
    	input.principal.id == input.resource.id
    	some verb in {"list", "read"}
    	endswith(input.action, sprintf(".%v", [verb]))
    }

    # Operators and admins may list or read any resource on behalf of any party (support-desk
    # and onboarding cockpit paths, ADR-0068).
    allowed_reasons contains "operator-read-any" if {
    	input.principal.type == "HUMAN"
    	some role in {"ROLE_OPERATOR", "ROLE_ADMIN"}
    	role in input.principal.roles
    	some verb in {"list", "read"}
    	endswith(input.action, sprintf(".%v", [verb]))
    }

    # ADR-0176 D4: operator-initiated customer messaging is its own action namespace
    # (opsmessage.*), deliberately NOT notification.* — the edge-service-notification rule below
    # grants every notification.* action to customer-edge's M2M identity via a plain prefix match,
    # and opsmessage.compose must never be reachable that way. A namespace split alone is not
    # sufficient, though: service-account-openbank-edge is classified HUMAN (Keycloak
    # client_credentials tokens never produce principal.type == SERVICE — see
    # authz_policy.principal_type_service_unreachable in rules.yaml) and carries ROLE_OPERATOR in
    # the realm (openbank-infra/gitops/components/keycloak/realm-template.json), so a rule gated on
    # HUMAN + ROLE_OPERATOR alone would silently re-admit that exact M2M identity. The explicit
    # `service-account-` exclusion below is what actually keeps it out — same idiom as
    # m2m-sanctions-screening further down, used there for the opposite purpose (identifying M2M,
    # not excluding it).
    allowed_reasons contains "operator-compose-message" if {
    	input.principal.type == "HUMAN"
    	some role in {"ROLE_OPERATOR", "ROLE_ADMIN"}
    	role in input.principal.roles
    	not startswith(input.principal.id, "service-account-")
    	input.action == "opsmessage.compose"
    }

    # Checker side of the same four-eyes flow (ADR-0155 mechanism, ADR-0176 D5 trigger). Deciding
    # an approval is exactly as sensitive as issuing the request it gates, so it gets the identical
    # HUMAN + operator-role + non-service-account shape, not the broader operator-write-any this
    # service otherwise has no equivalent of.
    allowed_reasons contains "operator-decide-message-approval" if {
    	input.principal.type == "HUMAN"
    	some role in {"ROLE_OPERATOR", "ROLE_ADMIN"}
    	role in input.principal.roles
    	not startswith(input.principal.id, "service-account-")
    	input.action == "opsmessage.approval.decide"
    }

    # Authenticated customers may perform any `customer.*` action (initiate payments, enroll
    # devices, register, etc.). The JWT `sub` equals the partyId in the customer realm
    # (ADR-0065/0066). Per-handler IDOR guards (e.g. debtorAccountId ownership in
    # customer-edge) enforce resource-level isolation; OPA does not re-derive it here because
    # the resource parameter is not present on every customer action (many are non-scoped).
    # This rule intentionally does NOT cover operator or admin actions — those go through
    # operator-write or operator-read-any above.
    allowed_reasons contains "customer-self-action" if {
    	input.principal.type == "HUMAN"
    	startswith(input.action, "customer.")
    }

    # The customer-edge's M2M identity calling notification-, sca- or document-service on a
    # customer's behalf. The edge authenticates the CUSTOMER itself (customer-self-action above
    # + per-handler IDOR guards) and injects the authoritative partyId the downstream handlers
    # scope by — so this check only needs to recognise the edge principal.
    #
    # The `document.` family covers the onboarding framework agreement (ADR-0169/0170): the
    # app reads the PDF bytes and signs them through CustomerDocumentResource, which fetches
    # the metadata first and 404s a non-owner before ever streaming content — the per-handler
    # IDOR guard this rule relies on. `document.read` (metadata) previously slipped through
    # operator-read-any by accident of its name while `document.readContent` (the bytes) fell
    # outside that rule's {list, read} verb set and was denied, so the sign screen rendered
    # "getDocumentContent failed: 403" with no way to complete onboarding. Granting the family
    # to the edge identity — rather than widening operator-read-any's verb taxonomy — keeps the
    # reach on the edge principal instead of handing every ROLE_OPERATOR staff session the
    # contents of any customer's signed agreement.
    #
    # NOTE (found during ADR-0034 Phase 5 rollout, issue #266): AuthorizeInterceptor never
    # produces principal.type == "SERVICE" — M2M calls authenticate with a Keycloak
    # client_credentials JWT (openbank-edge), which the interceptor's principalType()
    # classifies as HUMAN (see AuthorizeInterceptor.kt), and the realm never issues a
    # ROLE_SERVICE role to any client — only ROLE_OPERATOR. A SERVICE-gated rule is therefore
    # structurally unreachable dead code.
    #
    # Gating on HUMAN + ROLE_OPERATOR alone is NOT safe here: real operator/admin staff also
    # carry ROLE_OPERATOR, and this rule's action families include device.enroll (SCA-service's
    # WebAuthn device registration) — granting that to any staff member is an account-takeover
    # primitive (an operator could enrol their own authenticator against a victim's account).
    # test_deny_operator_read_any_does_not_cover_write encodes exactly this invariant.
    #
    # Instead, match the edge's client_credentials principal precisely by identity:
    # AuthorizeInterceptor sets principal.id from the JWT's preferred_username, which for a
    # Keycloak service-account token is deterministically "service-account-<clientId>"
    # (verified against a live token from the openbank-edge client, ADR-0065/0034 issue #266)
    # — not forgeable by a human session, which authenticates through a different client.
    #
    # `signatureCeremony.` is here for the same reason `document.` is (#1249): the onboarding
    # agreement is read AND signed through the edge, and recordDecision's verb sits outside
    # operator-read-any's {list, read} set, so signing 403'd while reading the ceremony passed.
    # It is not an account-takeover primitive the way device.enroll is: document-service verifies
    # the signer's evidenceRef against sca-service (SignerVerificationPort, ADR-0021), the edge
    # forces partyRef from the caller's token and rejects a caller who is not one of the
    # ceremony's signers, so this grant cannot sign on someone else's behalf.
    allowed_reasons contains "edge-service-notification" if {
    	input.principal.type == "HUMAN"
    	input.principal.id == "service-account-openbank-edge"
    	some family in {"notification.", "device.", "document.", "signatureCeremony."}
    	startswith(input.action, family)
    }

    # The customer-edge proxying the customer's own PSD2 consent screen (ADR-0126): the app
    # lists who may access its account data and revokes a consent. Same edge principal, same
    # guard as edge-service-notification — the edge injects the caller's authoritative partyId
    # from the JWT (consent-service keys listByParty by that path partyId), and revoke is
    # ownership-enforced downstream (ConsentService throws ConsentNotOwnedByPartyException when
    # consent.partyId != command.partyId), so the edge can never read or revoke another party's
    # consent even with a guessed id. Scoped to the two exact actions the app uses — NOT the
    # `consent.` family — so this grant cannot create, activate, or validate consents on the
    # edge principal (least privilege; the edge exposes no route for those anyway).
    allowed_reasons contains "edge-service-consent" if {
    	input.principal.type == "HUMAN"
    	input.principal.id == "service-account-openbank-edge"
    	input.action in {"consent.list", "consent.revoke"}
    }

    # Any M2M service-account caller (e.g. account-service) may trigger a sanctions screen
    # (issue #746, found via issue #669's load benchmark). sanctions.create is called with
    # resource = "" — a resourceless system action — so operator-on-own-tenant (which requires
    # input.resource) can never fire for it, and no other rule covers a resourceless write.
    # Confirmed live: a client_credentials token from openbank-services (ROLE_OPERATOR, the same
    # identity account-service uses to call ledger/balance) got 403 policy-denied calling
    # sanctions.create directly, once AUTHZ_ENFORCE=true.
    #
    # Deliberately action-scoped to sanctions.create ONLY, not a "sanctions." family prefix:
    # sanctions.clear (renamed from sanctions.review, issue #938 follow-up — dismiss/confirm a
    # hit) and the list-refresh actions are real operator judgment calls, not a service-to-service
    # compliance check, and must stay behind a human session — widening this to the family would
    # let any M2M caller self-clear a sanctions hit.
    #
    # Deliberately NOT scoped to one hardcoded client id (unlike edge-service-notification):
    # sanctions.create is "run a compliance check" — not an account-takeover primitive like
    # device.enroll — and more than one service legitimately screens entities (account-service
    # today; kyc/onboarding/party are plausible future callers). Gating on the
    # "service-account-*" preferred_username prefix (deterministic for any Keycloak
    # client_credentials token, per the edge-service-notification note above — not forgeable by
    # a human password-grant session, whose preferred_username is the human's own username)
    # covers any M2M caller without a per-caller rule, while still excluding real operator/admin
    # staff sessions from this specific carve-out.
    allowed_reasons contains "m2m-sanctions-screening" if {
    	input.principal.type == "HUMAN"
    	startswith(input.principal.id, "service-account-")
    	input.action == "sanctions.create"
    }

    # NOTE: sanctions.create is not the only resourceless M2M `*.create`-shaped action with
    # this gap — ledger.create, fx.convert (renamed from fx.create, issue #938 follow-up),
    # lending.create, settlement.create, and others share the same shape and have the same
    # live "advisory: would DENY" masked-by-AUTHZ_ENFORCE=false exposure. Each needs its own
    # case-by-case rule (some may not be safe for any M2M caller the way sanctions.create is)
    # — tracked separately as issue #750, not folded in here.

    # ---------------------------------------------------------------------------------------
    # Money-path actions get the four-eyes gate from rules.yaml. This rule does NOT grant
    # access on its own — it AUGMENTS allow with a flag the interceptor surfaces back to
    # the caller via AuthzDecision.attributes, so the handler can require a second approver.
    # ---------------------------------------------------------------------------------------
    # Money-path service scopes, normalised to the action namespace: money_path_services in
    # rules.yaml uses the module name (openbank-ledger-service) but an action prefix is the
    # commit scope (ledger). Strip the `openbank-` prefix and a trailing `-service` so the
    # two align (e.g. openbank-ledger-service -> ledger).
    #
    # Five services' real @Authorize action prefix does NOT match that derived name (a
    # fleet audit, issue #395, found this silently disabled four-eyes for every one of
    # them): sepa-payment -> sepaPayment, sepa-instant -> sctInstPayment, domestic-payment
    # -> domesticPayment, clearing -> clearingBatch, sca -> device / scaChallenge. Two of
    # those aren't even a casing variant of the derived name, so this uses an explicit
    # override table (rules.yaml: money_path_action_prefixes) rather than a camelCase
    # guess — self-documenting, and rest_test.rego pins it so a future rename can't
    # silently drift back out of sync.
    money_path_scopes contains scope if {
    	some svc in data.rules.money_path_services
    	derived := trim_suffix(trim_prefix(svc, "openbank-"), "-service")
    	not data.rules.money_path_action_prefixes[derived]
    	scope := derived
    }

    money_path_scopes contains scope if {
    	some svc in data.rules.money_path_services
    	derived := trim_suffix(trim_prefix(svc, "openbank-"), "-service")
    	some scope in data.rules.money_path_action_prefixes[derived]
    }

    four_eyes_required if {
    	some scope in money_path_scopes
    	startswith(input.action, sprintf("%s.", [scope]))
    	some verb in data.rules.four_eyes.verbs
    	endswith(input.action, sprintf(".%s", [verb]))
    }

    # Feature-flag flip (ADR-0067 / issue #419): flipping a money-path flag is four-eyes-gated.
    # The target flag key is carried in input.attributes.flag.
    four_eyes_required if {
    	input.action == "featureflag.flip"
    	input.attributes.flag in data.rules.feature_flags.money_path_flags
    }

    # Exact-action four-eyes, independent of money-path scope (ADR-0176 D5). Generalises the
    # featureflag.flip clause above into a reusable list (data.rules.four_eyes.actions) rather than
    # a one-off inline check — for an action whose service will never appear in
    # money_path_services (opsmessage.compose today), the verb-based clause above can never match,
    # since it requires deriving a scope FROM money_path_services first. Undefined, not an error,
    # for any bundle whose rules.yaml predates this key — Rego membership over an undefined
    # collection simply does not fire.
    four_eyes_required if {
    	input.action in data.rules.four_eyes.actions
    }

    # ---------------------------------------------------------------------------------------
    # Prohibited feature-flag flips (ADR-0067 / issue #419). A flip that would DISABLE a
    # regulatory safety control (SCA, sanctions/AML screening, the fail-closed payment gate)
    # is forbidden outright — no four-eyes approval can switch these off via a flag. Surfaced
    # to the interceptor (like four_eyes_required); no allow reason ever fires for such an
    # action, so default-deny also blocks it.
    # ---------------------------------------------------------------------------------------
    prohibited if {
    	input.action == "featureflag.flip"
    	input.attributes.flag in data.rules.feature_flags.prohibited_flag_combinations
    }
  balance_rest_ext.rego: |
    # SPDX-License-Identifier: Apache-2.0
    # Balance-service REST extension (ADR-0034 Phase 5, issue #266).
    # Extends openbank.rest with balance-store allow reasons.
    # Mounted alongside rest.rego in the same OPA bundle — OPA merges same-package rules.
    #
    # Actions gated (BalanceResource / ReconciliationResource):
    #   balance.read                — get one/all currency balances (#accountId)
    #   balance.hold                — place a hold on funds (#accountId)
    #   balance.holdRelease         — release a hold (#holdId)
    #   balance.credit              — credit an account — THE money-moving primitive (#accountId)
    #   balance.debit                — debit an account — THE money-moving primitive (#accountId)
    #   balance.initialize          — seed a new pocket's balance row (#accountId)
    #   balance.overdraftLimit      — set the arranged overdraft limit (#accountId, supervisor-only)
    #   balance.reconciliation.read — latest control-account tie-out report
    #   balance.reconciliation.run  — on-demand tie-out re-run
    #
    # balance-service is the most-called money-primitive in the fleet: ledger/settlement/transaction
    # all post through balance.credit/balance.debit. None of the verbs above is in rules.yaml's
    # four_eyes.verbs list (transfer/post/reverse/freeze/release/flip) — the four-eyes gate lives on
    # the payment RAILS (domestic-payment.transitionStatus etc.), not on this shared primitive, so no
    # four-eyes logic belongs here.
    #
    # Base rest.rego already grants: operator-read-any / compliance-read-any for *.read (covers
    # balance.read + balance.reconciliation.read for OPERATOR/ADMIN/COMPLIANCE).

    package openbank.rest

    import rego.v1

    # Human operator/admin writes: the ops-console path for resolving a stuck hold, seeding a pocket
    # on behalf of an account, or (via credit/debit) a manual correction. Mirrors the existing
    # @RolesAllowed(SERVICE, OPERATOR, ADMIN) on every write endpoint below except overdraftLimit.
    allowed_reasons contains "operator-balance-write" if {
    	input.principal.type == "HUMAN"
    	some role in {"ROLE_OPERATOR", "ROLE_ADMIN"}
    	role in input.principal.roles
    	input.action in {
    		"balance.read",
    		"balance.hold",
    		"balance.holdRelease",
    		"balance.credit",
    		"balance.debit",
    		"balance.initialize",
    		"balance.reconciliation.read",
    		"balance.reconciliation.run",
    	}
    }

    # The overdraft-limit override is a supervisory action (existing @RolesAllowed(SUPERVISOR, ADMIN) —
    # NOT operator). Kept as its own rule so enforcing OPA never silently widens who can raise a
    # customer's overdraft limit.
    allowed_reasons contains "supervisor-overdraft-limit" if {
    	input.principal.type == "HUMAN"
    	some role in {"ROLE_SUPERVISOR", "ROLE_ADMIN"}
    	role in input.principal.roles
    	input.action == "balance.overdraftLimit"
    }

    # Viewer/auditor read path: the resource's own RBAC (@RolesAllowed) already admits ROLE_VIEWER on
    # both balance reads and ROLE_AUDITOR + ROLE_VIEWER on the reconciliation report — enforcing OPA
    # must not silently 403 a read RBAC already allows. Strictly read-only.
    allowed_reasons contains "viewer-balance-read" if {
    	input.principal.type == "HUMAN"
    	some role in {"ROLE_VIEWER", "ROLE_AUDITOR"}
    	role in input.principal.roles
    	input.action in {"balance.read", "balance.reconciliation.read"}
    }

    # M2M callers on the balance store (ALL verified in-repo via their REST client adapters):
    #   - settlement-service (BalanceRestClient, client_credentials via OidcClientRequestReactiveFilter):
    #     credit + debit — the settlement saga's debit-payer / credit-payee legs
    #     (SettlementActivitiesImpl).
    #   - transaction-service (BalanceCoverClient, same M2M filter): hold + holdRelease — the payment
    #     workflow's cover-hold lifecycle (booked debit/credit itself is driven by the ledger
    #     projection consumer, not REST, since ADR-0039 Phase D-2).
    #   - account-service (BalanceServiceClient): initialize — seeds a new pocket's balance row on
    #     account/pocket open; forwards the opening caller's own bearer token
    #     (BalanceAuthPropagationFilter), not a distinct M2M identity — covered by whichever rule
    #     matches the forwarded caller (this rule, or operator-balance-write for a human-initiated
    #     account open).
    #   - statement-service, agent-service (copilot), billing-service: read only (getBalance /
    #     getBalances) via their own M2M filters.
    #
    # NOTE (ADR-0034 Phase 5 rollout, issue #266): AuthorizeInterceptor.principalType() never produces
    # "SERVICE" — every authenticated principal that is not an AI agent is classified "HUMAN" (see
    # AuthorizeInterceptor.kt), and no Keycloak realm client is ever granted a ROLE_SERVICE role. A rule
    # gated on principal.type == "SERVICE" (or ROLE_SERVICE) is therefore structurally unreachable dead
    # code — caught fleet-wide by check-no-service-principal-type.sh (PR #403, Refs #266).
    #
    # All in-repo M2M callers above authenticate via the SAME `openbank-services` Keycloak client
    # (client_credentials grant), whose service-account is deterministically named
    # "service-account-openbank-services" (Keycloak's "service-account-<clientId>" convention) and
    # carries ROLE_OPERATOR (openbank-realm.json). Gating on HUMAN + ROLE_OPERATOR alone would NOT be
    # safe or precise: real operator/admin staff also carry ROLE_OPERATOR, so that alone cannot tell
    # "settlement-service" apart from "an operator's own session" in the audit trail (both would show
    # reason=operator-balance-write) even though the net authorization outcome for the actions this
    # rule grants happens to be identical to what operator-balance-write already allows. Matching the
    # exact principal.id gives the M2M path its own distinct, auditable reason instead.
    #
    # Deliberately NOT granted here: balance.overdraftLimit (no M2M caller — supervisor-only by
    # design), balance.reconciliation.run (the daily run is an in-process scheduler that never crosses
    # this HTTP boundary; an on-demand re-run is a human ops action), and balance.reconciliation.read —
    # @RolesAllowed on ReconciliationResource.latest() admits ROLE_SERVICE today (statement-service's
    # OWN closing-balance reconciliation was the suspect, but it calls the plain balance.read endpoint,
    # not this one — no in-repo M2M caller of GET /reconciliation/latest was found). Enforcing OPA
    # WITHOUT a rule for this identity here is a deliberate, conservative behavior change: if an
    # undiscovered caller needs it, it will now 403 instead of silently keep working. Flagged
    # prominently in the PR; extend this rule (with evidence) the moment a real caller is found.
    #
    # Residual risk (flagged prominently in the PR): ALL SIX verified M2M callers (settlement-service,
    # transaction-service, account-service, statement-service, agent-service, billing-service)
    # authenticate as this SAME service-account identity — there is no per-caller claim (e.g. a
    # distinct `azp`/client_id per caller service) forwarded to balance-service today. This rule
    # therefore cannot distinguish "settlement-service asking for balance.credit" from "any other
    # caller sharing this client asking for balance.credit" — it is scoped to the ACTION-CLASS the
    # verified callers collectively need (read/hold/holdRelease/credit/debit/initialize), not widened
    # to every balance action (no blanket allow), but within that class it cannot enforce "only
    # settlement-service may credit/debit". Tightening this requires per-caller identity — mTLS SPIFFE
    # (ADR-0017) or a dedicated OIDC client per caller service — tracked as a follow-up, NOT solved by
    # this PR.
    allowed_reasons contains "service-balance-m2m" if {
    	input.principal.type == "HUMAN"
    	input.principal.id == "service-account-openbank-services"
    	input.action in {
    		"balance.read",
    		"balance.hold",
    		"balance.holdRelease",
    		"balance.credit",
    		"balance.debit",
    		"balance.initialize",
    	}
    }
  agents.rego: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    #
    # Agent tool-call authorization (ADR-0031 D2). This is the policy enforcement point in front
    # of the MCP /tools/call endpoint: before dispatching a tool, the endpoint queries
    #   data.openbank.agents.allow
    # with input { agent, tool, resource, plane, attributes }. Deny is the default; an allow
    # requires a matching rule below.
    #
    # Charters are loaded from openbank-libs/governance/agents.yaml as data (data.agents.agents[...]);
    # money_path / review come from rules.yaml (data.rules.*). The decision LOGIC here is verified by
    # agents_test.rego; what remains for ADR-0031 D8 phase 1 is wiring those YAML bundles into the live
    # OPA sidecar (the bundle build), not the policy itself.

    package openbank.agents

    import rego.v1

    # ---------------------------------------------------------------------------------------
    # Default deny (ADR-0031: deny-by-default). Everything below must explicitly allow.
    # ---------------------------------------------------------------------------------------
    default allow := false

    # Look up the calling agent's charter (from agents.yaml, loaded as data.agents.agents).
    # input.agent is bare on the MCP path (openbank-agent-service sets it directly from its own
    # config, e.g. "ui-assistant" -- AgentChatService.ASSISTANT_IDENTITY), but rest.rego's REST
    # bridge sources it from the JWT `sub` via AuthorizeInterceptor.principal.id, which for an
    # AI_AGENT is prefixed "agent:" (AuthorizeInterceptor.principalType()'s own convention, e.g.
    # "agent:onboarding" per its test). trim_prefix is a no-op when the prefix isn't present, so
    # this normalises both callers to the bare charter id without needing two lookup rules.
    charter contains a if {
    	some a in data.agents.agents
    	a.id == trim_prefix(input.agent, "agent:")
    }

    # The hard-forbidden tier is forbidden for ALL agents, regardless of charter (agents.yaml: tool_tiers.deny).
    hard_denied if input.tool in data.agents.tool_tiers.deny

    # A tool is explicitly denied by the agent's own charter (supports glob like "money.*", "*.write").
    charter_denied if {
    	some pattern in allowed_or_denied_patterns.deny
    	glob_match(pattern, input.tool)
    }

    # Every tools.allow / tools.deny pattern across the agent's charter(s) -- factored out so
    # charter_allowed and rest_action_allowed don't each re-walk `some a in charter` themselves.
    #
    # SCHEMA NOTE: this only matches charters whose tools.allow/deny are a flat list of pattern
    # STRINGS (compliance-officer, ledger-domain-engineer, ui-assistant, rca-investigator,
    # customer-copilot). The standalone background/control-plane agents (finops-agent, devops-agent,
    # control-liveness-sentinel, governance-auditor, release-steward, docs-truth-agent,
    # authz-policy-auditor, flaky-test-hunter) instead declare tools.allow as a list of
    # `{tier, resources}` objects -- `some pattern in a.tools.allow` binds `pattern` to the whole
    # object for those charters, which glob_match can never match against a string tool name, so
    # charter_allowed is always false for them here. This is intentionally NOT a security gap
    # (default-deny fails closed, not open) -- it is simply inert: none of those services call the
    # MCP /tools/call endpoint this package gates at all (confirmed: no reference to it in any of
    # their source trees). Their real, live authorization is the standard `@RolesAllowed` REST
    # security on each service's own endpoints. Their `agents.yaml` charter today documents intent
    # for governance/audit purposes, not a runtime-enforced grant -- same as every charter's
    # `requires_human` block, which no code path reads either. Wiring the tier+resources shape into
    # a live decision here is future work if/when these services are ever fronted by the MCP gateway.
    allowed_or_denied_patterns := {
    	"allow": {pattern |
    		some a in charter
    		some pattern in a.tools.allow
    	},
    	"deny": {pattern |
    		some a in charter
    		some pattern in a.tools.deny
    	},
    }

    # A tool is explicitly allowed by the agent's charter allowlist.
    charter_allowed if {
    	some pattern in allowed_or_denied_patterns.allow
    	glob_match(pattern, input.tool)
    }

    # rest.rego's "agent-charter-allows" rule reuses this package for a REST call from an
    # AI_AGENT principal by setting input.tool := input.action -- the raw REST action string
    # an @Authorize-annotated endpoint declares (e.g. "ledger.list", "account.read"). Charters
    # declare tools.allow in the MCP tool-tier vocabulary instead (agents.yaml tool_tiers.read,
    # e.g. "query.ledger.readonly") -- a different string space. glob_match("query.ledger.readonly",
    # "ledger.list") never matches (they're unrelated strings, not even a prefix/suffix
    # relationship), so charter_allowed alone could never grant a REST read no matter how
    # clearly the charter's tools.allow / data_scope intended it -- the moment ANY service a
    # charter reads flips OPA to enforce mode, every AI_AGENT read against it 403s. IMPORTANT:
    # rest.rego MUST delegate to this package's `allow` (which also applies hard_denied /
    # charter_denied / skill_ok), never to charter_allowed directly -- charter_allowed alone
    # skips those checks.
    charter_allowed if rest_action_allowed

    # rest_domains mirrors openbank-agent-service's own McpToolRegistry.capabilities map -- the
    # single place that already decided which REST-action service scopes each `query.*.readonly`
    # MCP capability is meant to cover (e.g. query.ledger.readonly also backs the
    # account/transaction/balance read tools, not just ledger). Keep the two in sync: a new
    # query.<x>.readonly tool, or a domain added to an existing one, needs an entry here too, or
    # the fleet regains this exact gap. dispute + complaint reads are now @Authorize-gated
    # (dispute.read/.list, complaint.read/.list) so query.disputes.readonly is live; catalog and
    # aml still have no @Authorize-gated read endpoint yet -- their entries are forward-looking and
    # inert until that service adopts @Authorize on its reads (tracked in issue #401). Where a
    # service's only real @Authorize action today is a WRITE (e.g. aml-service's
    # amlCase.updateDecision), the verified write-action prefix is listed alongside the bare
    # service name, since a future read endpoint may reuse either convention and both are inert
    # until then anyway.
    rest_domains := {
    	"query.ledger.readonly": {"ledger", "account", "transaction", "balance"},
    	"query.gl.readonly": {"ledger", "gl"},
    	"query.catalog.readonly": {"catalog"},
    	"query.compliance.readonly": {"aml", "amlCase", "sanctions"},
    	"query.payments.readonly": {"fx", "clearing", "clearingBatch", "sepa-instant", "sctInstPayment"},
    	"query.interest.readonly": {"interest"},
    	"query.disputes.readonly": {"dispute", "complaint"},
    	"query.balance.readonly": {"balance"},
    	"query.transaction.readonly": {"transaction"},
    }

    # Scoped to read verbs only -- a `*.readonly` tool must never bridge into a write action,
    # however permissive matching the domain prefix alone would otherwise be.
    rest_read_verbs := {"list", "read", "search"}

    # A charter tool pattern authorizes a REST action iff the action's service-scope prefix is
    # in that tool's mapped rest_domains set AND the verb is read-only.
    rest_action_allowed if {
    	some pattern in allowed_or_denied_patterns.allow
    	some scope in rest_domains[pattern]
    	startswith(input.tool, sprintf("%s.", [scope]))
    	some verb in rest_read_verbs
    	endswith(input.tool, sprintf(".%s", [verb]))
    }

    # run.skill is further constrained to the agent's `skills` allowlist (development plane).
    skill_ok if {
    	input.tool != "run.skill"
    } else if {
    	some a in charter
    	input.attributes.skill in a.skills
    }

    # ---------------------------------------------------------------------------------------
    # The decision. Allow only when nothing forbids AND the charter permits AND skill is in scope.
    # ---------------------------------------------------------------------------------------
    allow if {
    	not hard_denied
    	not charter_denied
    	charter_allowed
    	skill_ok
    }

    # ---------------------------------------------------------------------------------------
    # Decision object the MCP endpoint records into AuditEvent.payload.policy_decision (ADR-0031 D5).
    # Always emitted so a DENY is auditable, not silent.
    # ---------------------------------------------------------------------------------------
    decision := {
    	"allow": allow,
    	"agent": input.agent,
    	"tool": input.tool,
    	"resource": input.resource,
    	"reason": reason,
    }

    reason := "hard-denied tool tier" if hard_denied

    else := "denied by charter" if charter_denied

    else := "skill not in agent allowlist" if not skill_ok

    else := "no matching allow rule" if not charter_allowed

    else := "allowed by charter"

    # ---------------------------------------------------------------------------------------
    # Helper: simple glob match supporting a single trailing/embedded "*" (e.g. "money.*", "*.write").
    # Replace with the OPA built-in `glob.match` when the bundle build is wired.
    # ---------------------------------------------------------------------------------------
    glob_match(pattern, value) if pattern == value
    glob_match(pattern, value) if glob.match(pattern, ["."], value)
  agents-data.yaml: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    #
    # OpenBank AI-agent charters — the single, machine-readable source of truth for what each
    # agent may see, call, and do, and where a human must decide (ADR-0031).
    #
    # Sibling of rules.yaml: this file is consumed by BOTH the OPA policy bundle (which gates the
    # MCP /tools/call endpoint, ADR-0018 + ADR-0031 D2) and the agent runtime. A charter is written
    # ONCE here and never duplicated as prose.
    #
    # Governing principle (ADR-0031): agents propose, governance disposes. An agent never holds more
    # privilege than a human -- it holds less. Default is DENY; an allow requires a matching rule.
    #
    # Status of enforcement mirrors rules.yaml: a charter can be `advisory` (audit-only) before it
    # `block`s, so phase 1 (ADR-0031 D8) runs deny-by-default + audit with no agent acting yet.

    schema_version: 1
    source_of_truth: true
    related_adrs: [ADR-0017, ADR-0018, ADR-0021, ADR-0027, ADR-0029, ADR-0030, ADR-0031, ADR-0073, ADR-0088, ADR-0089]
    consumes: openbank-libs/governance/rules.yaml   # money_path_services, review, vuln_management

    # ---------------------------------------------------------------------------------------
    # Global defaults applied to every agent unless its charter overrides them.
    # ---------------------------------------------------------------------------------------
    defaults:
      pii: masked                         # uses openbank-libs/security/PiiMasking; raw PII never in scope
      policy_decision: deny               # deny-by-default; OPA must find a matching allow rule
      enforced: block                     # ADR-0031 D8 gate flipped (#700/#638): declaration now matches
                                          # the deployed AGENT_POLICY_ENFORCEMENT=block (reconcile #743).
                                          # A PDP connectivity error still degrades to advisory (fail-safe).
      audit:
        actor_type: AI_AGENT              # every action -> AuditEvent (ADR-0031 D5)
        capture: [model_id, model_version, prompt_hash, tool_calls, policy_decision]
      limits:
        kill_switch: true                 # per-agent + global halt without redeploy (ADR-0031 D7)

    # ---------------------------------------------------------------------------------------
    # Kill switch state (ADR-0031 D7). Declarative baseline; the immediate runtime override is the
    # agent_kill_switch table flipped via /api/v1/admin/agents (KillSwitchService), which wins over
    # this. Per-agent halt = set `enabled: false` on that agent's charter below.
    # ---------------------------------------------------------------------------------------
    global_controls:
      kill_switch_enabled: true           # false halts EVERY agent (config baseline)

    # ---------------------------------------------------------------------------------------
    # Open runtime stack (ADR-0031 D6). No single-vendor agent SDK; all components in-cluster.
    #
    # ⚠ THIS BLOCK IS THE TARGET (ADR-0031 D6), NOT THE AS-BUILT. Read the `# as-built:` notes.
    #
    # This file is embedded VERBATIM into 34 OPA bundle ConfigMaps (rules.yaml: opa_bundle_sync), so
    # anything asserted here is replicated fleet-wide as machine-readable policy data. An unmarked
    # target therefore reads as a live control to anything consuming those bundles — which is exactly
    # how the model_gateway block below came to assert a data-residency routing rule that has never
    # run (issue #1280, ADR-0174 §2, ADR-0175 §4). Per-key as-built status, verified 2026-07-16
    # against gitops and the live sandbox:
    # ---------------------------------------------------------------------------------------
    runtime:
      orchestration: temporal           # as-built: LIVE. temporal namespace up; agents are Temporal workflows.
      reasoning:     langgraph          # as-built: NOT DEPLOYED. Activities are hand-written Kotlin; no langgraph.
      guardrails:    [llama-guard, prompt-injection-filter]   # as-built: PARTIAL. PromptInjectionGuard.kt is real
                                        # (copilot-service). llama-guard is NOT deployed — its only occurrences are
                                        # inside the OPA bundles' embedded copy of THIS file, which is not evidence.
      memory_rag:    pgvector           # as-built: NOT DEPLOYED. No pgvector, no embeddings, no RAG. The copilot's
                                        # HelpKnowledgeBase is deterministic keyword scoring, by explicit choice.
      observability: langfuse           # as-built: NOT DEPLOYED. OTel only.
      identity:      spiffe-spire       # as-built: PARTIAL. AgentSvidVerifier.kt is real, but no SPIRE deployment
                                        # exists; the live agent identity is OpenBao's pki-agent CA (ADR-0031 D3b).

    # Licensing note (ADR-0136, supersedes the ADR-0031 D8 separate-repo plan): the AI agent SERVICES are
    # AGPL-3.0-only + a parallel commercial licence, IN-REPO (not a separate repo); the rest of the platform is
    # Apache-2.0. rules.yaml carries the denylist carve-out + the AGPL/Apache build-dependency boundary. This
    # charter config itself stays Apache-2.0.

    # ---------------------------------------------------------------------------------------
    # Model strategy -- hybrid, model-agnostic via an open LLM gateway (ADR-0031 D6).
    # No lock-in: tools via MCP, policy via Rego, models via the gateway.
    #
    # ⚠⚠ NONE OF THE `model_gateway_target` BLOCK BELOW IS DEPLOYED. Read `model_gateway_as_built`
    # first — it is the one that describes the running system.
    #
    # Renamed from `model_gateway` to `model_gateway_target` deliberately (issue #1280): under the old
    # name this block was embedded into 34 OPA bundles as policy data asserting
    # `routing: {sensitive_data: self_hosted}` — i.e. the platform machine-claimed a GDPR Chapter V
    # data-residency control that has never existed. A false control claim is worse than an absent one:
    # an absent control gets found, an asserted one gets relied on. Any consumer reading the bundles
    # must now hit `_target` / `_as_built` and cannot mistake the intent for the state.
    # ---------------------------------------------------------------------------------------
    model_gateway_as_built:            # verified 2026-07-16 against gitops + the live sandbox
      gateway: none                    # no gateway. Agents call the provider endpoint directly.
                                       # LLM_GATEWAY_URL=http://litellm.ai-platform.svc:4000 is set on 5
                                       # agents and points at a Service that has never existed (#1280).
      budgets_enforced_at: charter     # CharterRateLimiter in openbank-agent-service — NOT a gateway.
      providers:
        deepinfra:                     # api.deepinfra.com, deepseek-ai/DeepSeek-V3.2. US-hosted, no region
                                       # pinning, no DPA. The single de-facto provider; chosen on cost.
          hosted: true                 # prompt data LEAVES THE EU. Licensed for synthetic data only —
                                       # see ADR-0175 §4/§5. There is NO technical control enforcing that.
      routing: none                    # no sensitive_data routing exists. See ADR-0175 D3.
      fallback: none                   # single provider. On failure LlmDiagnosisAdapter returns null and
                                       # the agent degrades to a deterministic path (ADR-0174 §4).

    model_gateway_target:              # ADR-0031 D6 — the decision. NOT the state. Nothing here is deployed.
      tool: litellm                       # or equivalent open gateway in front of all models
      budgets_enforced_at: gateway        # tokens/run + runs/day from each charter
      models:
        hosted:      { provider: anthropic, use: "general reasoning, high capability" }
        self_hosted: { runtime: vllm, use: "sensitive / air-gapped / data-residency", in_cluster: true }
      routing:
        sensitive_data: self_hosted       # PII / money-path context stays on in-cluster open-weight
        default: hosted

    # ---------------------------------------------------------------------------------------
    # MCP tool catalog tiers (ADR-0031 D2). The OPA gate maps a tool to its tier; the `deny`
    # tier is never registered for an agent identity.
    # ---------------------------------------------------------------------------------------
    tool_tiers:
      read:           # read-only, PII masked
        - query.ledger.readonly
        - query.gl.readonly           # GL aggregate reads (trial balance) — grantable independently of journal posting (#1966 / #299)
        - query.catalog.readonly
        - read.logs
        - read.governance      # rules.yaml / coverage / vuln SLAs
        - query.compliance.readonly   # AML cases + sanctions screenings (read-only)
        - query.payments.readonly     # FX rates, clearing batches, SEPA Instant payments (read-only)
        - query.interest.readonly     # interest accruals (read-only)
        - query.disputes.readonly     # disputes / chargebacks (read-only)
        - query.observability.readonly # Prometheus metrics / Loki logs / Alertmanager alerts (read-only)
        - query.balance.readonly      # the signed-in customer's own balance (customer-copilot, edge-enforced ownership)
        - query.transaction.readonly  # the signed-in customer's own transactions (customer-copilot, edge-enforced ownership)
        - query.account.readonly      # PSD2 consent-scoped account list (openbank-mcp-service, ADR-0181)
        - query.consent.readonly      # the PSD2 consents the acting agent holds (openbank-mcp-service, ADR-0181)
      write_proposal: # produces a reviewable artifact, never a direct effect
        - draft.ticket
        - gh.pr.open
        - draft.adr
        - git.branch
        - git.commit.signed
        - run.skill            # constrained to the agent's `skills` allowlist
      deny:           # hard-forbidden for ALL agents -- not registrable
        - money.transfer
        - money.post.ledger
        - gh.pr.merge
        - gh.pr.approve
        - secrets.read.raw

    # ---------------------------------------------------------------------------------------
    # Agents. plane = control (oversight, proposal-only) | development (per-domain engineering)
    #                | customer (customer-facing assistant, ADR-0089 — its own SCA-gated regime).
    # Each charter answers: data_scope (what it reads), tools (what it calls), requires_human
    # (what must be approved), limits (budget/quota).
    # ---------------------------------------------------------------------------------------
    agents:

      - id: compliance-officer
        plane: control
        charter: "AML/sanctions/GDPR/PSD2 oversight of the running bank; produces proposals only."
        data_scope:
          read: [transaction, sanction-screening, consent, audit, aml, sanctions, dispute, clearing, sepa-instant]
          pii: masked
        tools:
          allow: [query.ledger.readonly, query.gl.readonly, query.catalog.readonly, read.logs, read.governance,
                  draft.ticket, query.compliance.readonly, query.payments.readonly, query.disputes.readonly,
                  query.observability.readonly,   # Prometheus/Loki/Alertmanager read (oversight telemetry)
                  flags.write]    # feature-flag flip proposals (ADR-0067 / issue #419)
          deny:  ["money.*", "gh.pr.*"]
        requires_human:
          # Control-plane output is ALWAYS a proposal into the admin-ui approval queue (ADR-0031 D4).
          - every: proposal
          - approver_must_differ_from: author     # segregation of duties
          - record: reason                         # approve/reject reason -> audit
        limits: { tokens_per_run: 200000, runs_per_day: 48 }

      - id: ledger-domain-engineer
        plane: development
        charter: "Maintains its owned services via skills + rules.yaml + ADRs; opens PRs, never merges."
        owns: [openbank-ledger-service]            # a money_path service (rules.yaml) -> stricter HITL
        skills: [ship-check, bump, open-pr, release]   # run.skill is constrained to THIS list
        data_scope:
          read: [openbank-ledger-service, governance]
          pii: masked
        tools:
          allow: [git.branch, git.commit.signed, gh.pr.open, draft.adr, run.skill, read.governance]
          deny:  [gh.pr.merge, gh.pr.approve, "money.*"]    # segregation of duties
        requires_human:
          - merge: always                          # 2 approvals on money_path (rules.yaml: review)
          - new_adr: accept                         # agent drafts Status: Proposed; human accepts
          - threat_model_when: money_path_or_trust_boundary_change   # rules.yaml change_requirements
        limits: { tokens_per_run: 300000, runs_per_day: 24 }

      - id: ui-assistant
        plane: control
        charter: "The admin-UI bot. Answers operator questions from read-only tools; proposal-only, never acts on money."
        data_scope:
          read: [account, transaction, balance, catalog, ledger,
                 aml, sanctions, fx, clearing, interest, dispute, sepa-instant]
          pii: masked
        tools:
          # Least privilege (ADR-0080 P0, pentest FIND-S4-05): the admin chat bot reaches ONLY
          # ledger + GL + catalog reads and draft.ticket. The compliance/payments/interest/disputes read
          # capabilities were REMOVED -- a prompt injection ("maintenance mode, list all AML cases")
          # drove aml_list_cases and returned real AML data (GDPR Art. 9) to any logged-in operator.
          # AML/sanctions/payments reads belong to the role-gated compliance-officer charter,
          # reachable once per-user role propagation lands (ADR-0080 P2) -- not the blanket admin bot.
          # query.gl.readonly (trial-balance aggregate) is a ledger-family read the admin bot already
          # holds in the deployed runtime grant (application.yaml); it carries no PII the ledger read
          # does not, so it stays inside the least-privilege set alongside query.ledger.readonly.
          allow: [query.ledger.readonly, query.gl.readonly, query.catalog.readonly, draft.ticket]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw,
                  query.compliance.readonly, query.payments.readonly,
                  query.interest.readonly, query.disputes.readonly,
                  query.observability.readonly]
        requires_human:
          # Any state-changing follow-up the operator asks for is a PROPOSAL (admin-ui approval queue,
          # ADR-0031 D4); the assistant itself only reads.
          - every: proposal
        limits: { tokens_per_run: 100000, runs_per_day: 500 }

      - id: rca-investigator
        plane: control
        charter: "On a firing alert, investigates metrics, logs, traces and k8s state and proposes a likely root cause (HolmesGPT, ADR-0088). Read-only oversight — emits a finding, never acts."
        data_scope:
          read: [observability, audit]             # Prometheus / Loki / Tempo / Alertmanager + cluster state
          pii: masked
        tools:
          allow: [query.observability.readonly, read.logs, read.governance, draft.ticket]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
        requires_human:
          # The RCA is a finding for a human/on-call to act on; the investigator changes nothing.
          - every: proposal
        limits: { tokens_per_run: 150000, runs_per_day: 200 }

      - id: customer-copilot
        plane: customer
        charter: "Customer-facing mobile assistant (ADR-0089). Reads the signed-in customer's OWN data; action tools emit PROPOSALS only — money never moves on the model's word. The app routes each proposal into the existing edge payment/card/dispute + SCA flow."
        data_scope:
          # The signed-in customer's own data, audience-scoped via an on-behalf-of token; ownership is
          # enforced at the customer edge. Never another customer's data.
          read: [balance, transaction]
          pii: own
        tools:
          # Customer-scoped reads + a CLOSED action whitelist that produces an ActionProposal only.
          # Execution is HITL + SCA with dynamic linking bound to amount+payee (ADR-0021/0073) in the
          # edge flow — this agent never calls money.* directly. (These propose.* tools live in this
          # charter, NOT in the operator MCP tool_tiers: copilot is a distinct ADR-0089 regime.)
          allow: [query.balance.readonly, query.transaction.readonly,
                  propose.payment, propose.card_freeze, propose.dispute]
          deny:  ["money.*", "gh.pr.*", secrets.read.raw]
        requires_human:
          - every: proposal                          # ActionProposal on the reply, never a direct effect
          - sca: dynamic_linking                     # HITL + SCA bound to amount+payee before any state change
          - scope: customer_own                      # audience-scoped on-behalf-of token (one customer)
        limits: { tokens_per_run: 80000, runs_per_day: 1000 }

      - id: mcp-anonymous
        plane: customer
        charter: "The first-party MCP server's acting identity (ADR-0181). Exposes a curated, PSD2-consent-scoped tool set — read the granted accounts/balances/transactions/consents, and PROPOSE a payment — to governed AI agents over the Model Context Protocol. Reads only; propose.payment is a reviewable artifact a human + SCA disposes, never a debit."
        # `mcp-anonymous` is the phase-1 FIXED principal id McpEndpoint.resolveContext() sets
        # (ctx.agentId = "agent:mcp-anonymous"); the shared ADR-0034 PDP classifies it AI_AGENT and
        # rest.rego's agent bridge trims the "agent:" prefix, so this charter's `id` must stay
        # `mcp-anonymous` or every tools/call defaults to deny. Phase 2 (ADR-0126) replaces this single
        # placeholder with a per-agent OAuth 2.1 → PSD2-consent identity; each real caller then gets its
        # own charter and this one is retired.
        data_scope:
          # The accounts/consents the presented PSD2 consent grants; ownership is enforced at the
          # consent edge, never widened by the model. PII masked (defaults).
          read: [account, balance, transaction, consent]
          pii: masked
        tools:
          # Exact MCP capability strings the ADR-0034 PDP evaluates as input.action (McpToolRegistry
          # .capabilities). Deny-by-default: only these five are grantable; propose.payment emits a
          # reviewable proposal only (customer-copilot's ADR-0089 regime), never a direct money move.
          allow: [query.account.readonly, query.balance.readonly, query.transaction.readonly,
                  query.consent.readonly, propose.payment]
          deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
        requires_human:
          - every: proposal                          # propose.payment surfaces a proposal, never a debit
          - sca: dynamic_linking                     # HITL + SCA bound to amount+payee before any state change
          - scope: consent_granted                   # reads never exceed the presented PSD2 consent
        limits: { tokens_per_run: 80000, runs_per_day: 1000 }

      - id: finops-agent
        plane: control
        charter: "ADR-0112"
        description: >
          Proactive AWS cost monitoring and optimization agent. Detects NAT egress spikes,
          cross-AZ traffic anomalies, Karpenter node churn, EBS attachment failures, and
          CI runner pool pressure. Proposes IaC fixes as GitHub PRs through HITL queue.
          Never writes to AWS directly.
        enabled: true
        enforcement: block
        schedule:
          daily: "03:00 UTC"
          reactive: goalert-webhook       # triggered by GoAlert on cost/infra anomaly alert
        data_scope:
          read:
            - aws-cost-explorer-readonly  # ce:GetCostAndUsage, ce:GetCostForecast only
            - cloudwatch-metrics-readonly # GetMetricData for NAT/VPC FlowLogs
            - prometheus-query-readonly   # container_network_*, karpenter_*, kube_events
            - kubernetes-events-readonly  # FailedAttachVolume, node lifecycle events
            - langfuse-readonly           # token usage, cost per model/agent
          pii: none                       # cost/infra metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [aws-cost-explorer, cloudwatch, prometheus, kubernetes-events, langfuse]
            - tier: write_proposal
              resources: [github-pr]      # opens IaC diff PRs only; no AWS write, no k8s write
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct infra writes ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_infrastructure_change     # HITL mandatory; EU AI Act Art. 9
          - cost_impact_gt_100_usd        # explicit approval for >$100 estimated monthly saving/cost
        limits:
          tokens_per_run: 50000           # cap: agent must not cost more than it saves
          runs_per_day: 4
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - anomalies_detected
            - estimated_cost_impact_usd
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency (all proposals logged)"
          dora: "continuous monitoring; operational resilience cost controls"

      - id: devops-agent
        plane: control
        charter: "ADR-0119"
        description: >
          Proactive SSDLC, CI/CD and DORA reliability agent — the delivery-pipeline twin of the
          finops-agent (ADR-0112). Watches build/lint health, the four DORA metrics (deployment
          frequency, lead time, change failure rate, time-to-restore), runner-pool capacity,
          deploy/rollout health, SSDLC hygiene and recurring incidents. Diagnoses the root cause
          and proposes a DURABLE fix (a code/IaC PR, a runbook update, a tracking ticket) through
          the HITL queue. Never merges, applies or executes anything.
        enabled: true
        enforcement: block
        schedule:
          daily: "04:00 UTC"
          reactive: goalert-webhook       # triggered by GoAlert on a CI / deploy / runner anomaly alert
        data_scope:
          read:
            - prometheus-query-readonly   # ARC runner metrics, Argo Rollouts alerts, 5xx CFR proxy, ALERTS
            - github-actions-readonly     # workflow run conclusions/durations (exporter is the follow-up)
            - kubernetes-events-readonly  # deploy / rollout lifecycle events
            - read.governance             # rules.yaml, ADRs, runbooks — grounding for the proposal
          pii: none                       # pipeline / infra metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [prometheus, github-actions, kubernetes-events, governance, runbooks]
            - tier: write_proposal
              resources: [github-pr]      # opens code/IaC/runbook diff PRs only; no write, no merge
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct repo / infra writes ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_pipeline_or_infra_change  # HITL mandatory; a human merges every proposal
          - every: proposal               # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 6
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - dora_metric_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "ICT change management (Art. 8–10); operational resilience via proactive pipeline monitoring"

      - id: control-liveness-sentinel
        plane: control
        charter: "ADR-0163"
        description: >
          Fleet-wide correlator for the ADR-0160 liveness/drift-detection mechanisms — watches
          WorkflowLivenessWatchdog heartbeat gauges, the event-consumer-liveness and lineage-vs-code
          CI gate reports, and reconciliation drift-SLA windows. Surfaces a stale-or-silent control
          as a finding before it pages, and proposes a durable fix (a code/IaC PR wiring an
          unmonitored job into the watchdog, or a tracking ticket) through the HITL queue. Never
          writes to a control directly.
        enabled: true
        enforcement: block
        schedule:
          daily: "03:00 UTC"
          reactive: goalert-webhook       # triggered when a WorkflowLivenessWatchdog gauge itself pages
        data_scope:
          read:
            - prometheus-query-readonly   # openbank_workflow_liveness_last_success_age_seconds gauges
            - read.governance             # rules.yaml advisory allowlists (mechanisms 1/2), ADR-0160
          pii: none                       # control-heartbeat / CI-gate metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [prometheus, governance]
            - tier: write_proposal
              resources: [github-pr]      # opens code/IaC diff PRs or draft.ticket only; no write
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any control ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_control_or_pipeline_change  # HITL mandatory; a human merges every proposal
          - every: proposal                 # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 6
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - control_mechanism_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 24 testing of ICT systems — fleet-wide correlator for ADR-0160's detection controls"

      - id: governance-auditor
        plane: control
        charter: "ADR-0164"
        description: >
          Post-hoc auditor of merged-PR governance compliance. For every PR merged to main, re-verifies
          via the GitHub API that rules.yaml's own review rules were actually followed: approval count
          vs. the money-path/default requirement, docs/threat-models/<service>.md presence for a
          money-path change, merge-commit GPG verification, a linked issue in the PR body, and
          (best-effort) an admin/override-flag bypass. Proposes a compliance-incident ticket through
          the HITL queue for a human to triage — a violation on an already-merged PR is a human
          decision, not a diff. Never merges, approves or re-runs anything.
        enabled: true
        enforcement: block
        schedule:
          daily: "04:30 UTC"
          reactive: pr-merged-webhook     # triggered per PR merge to main — this agent's natural trigger,
                                          # unlike the alert-driven goalert-webhook its siblings use
        data_scope:
          read:
            - github-prs-readonly        # merged-PR metadata: reviews, merge-commit verification, body, labels
            - read.governance            # rules.yaml review + money_path_services — the compliance bar itself
          pii: none                       # PR/review metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [github, governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a mechanical fix PR
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any PR/review/merge ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_compliance_incident       # HITL mandatory; a human triages every finding
          - every: proposal                 # segregation of duties: agent proposes, human disposes
          - approver_must_differ_from: author     # segregation of duties
          - record: reason                         # approve/reject reason -> audit
        limits:
          tokens_per_run: 50000
          runs_per_day: 24                # one per merge is common; daily catch-up sweep is one more
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - governance_check_type_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 5 governance and organisation — re-verifies the repo's own change-control governance was followed"

      - id: release-steward
        plane: control
        charter: "ADR-0165"
        description: >
          Periodic guardian of the release-please / version-axis invariants. Checks
          release-please-config.json vs .release-please-manifest.json lockstep, admin-ui
          package.json vs version.txt sync, a fleet-wide scan for services that set
          quarkus.application.version explicitly (proactively, ahead of the reactive
          check-app-version-override.sh CI gate), and open-PR openapi.yaml:info.version
          collision detection across every open PR touching a spec. Proposes a triage ticket
          for judgment-call drift (manifest baseline, version-sync side, which racing PR
          re-bumps) and, for the one mechanically fixable case (an explicit
          quarkus.application.version key), a scaffold PR through the HITL queue. Never
          edits version.txt, merges a release-please PR, or writes to openapi.yaml directly.
        enabled: true
        enforcement: block
        schedule:
          daily: "05:00 UTC"
          reactive: release-please-merge-webhook   # triggered by every release-please PR merge —
                                                    # this agent's natural trigger, the moment
                                                    # incidents 1/2 have historically been introduced
        data_scope:
          read:
            - read.governance             # release-please-config.json, .release-please-manifest.json,
                                           # per-service application.yaml (repo-checkout reads)
            - github-prs-readonly         # open PRs touching any openapi.yaml, for the collision check
          pii: none                       # release/version metadata only; no customer data in scope
        tools:
          allow:
            - tier: read
              resources: [governance, github]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a mechanical fix PR
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to version.txt/openapi.yaml/manifest ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_release_or_version_drift  # HITL mandatory; a human picks the correct baseline/side
          - every: proposal                 # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 12                # daily sweep + one per release-please merge is common
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - release_invariant_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 24 testing of ICT systems — fleet-wide re-verification for the repo's own release-engineering invariants"

      - id: docs-truth-agent
        plane: control
        charter: "ADR-0166"
        description: >
          Periodic ADR-status-vs-code drift detector. On a weekly sweep plus reactively when any
          docs/adr/*.md file changes, greps every ADR's Delivery-Status: line against the code/
          service/class/config key it names: a Shipped/Complete ADR whose named artifact doesn't
          exist or isn't wired up, a Planned/Partial ADR whose fully-built implementation already
          exists unmentioned (the ADR-0139/ADR-0140 feature-store incident), and a mismatch between
          an ADR's or doc's "enforced" claim and rules.yaml's own gate-graduation enforced flag.
          Findings are almost always a tracking ticket — correcting an ADR's substantive content is
          a human judgment call — with a rare mechanical PR reserved for the one unambiguous case:
          flipping just the Delivery-Status: line, nothing else in the file. Never edits ADR
          decision content, merges a PR, or writes to rules.yaml.
        enabled: true
        enforcement: block
        schedule:
          weekly: "06:00 UTC"
          reactive: adr-merge-webhook       # triggered by any merged change under docs/adr/*.md
        data_scope:
          read:
            - read.governance             # docs/adr/*.md Delivery-Status lines, rules.yaml enforced flags,
                                           # and a grep-based existence check of the artifacts they name
          pii: none                       # ADR prose and repo file/grep metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a Delivery-Status-only fix PR
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any ADR's decision content or rules.yaml ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_adr_status_correction     # HITL mandatory; a human reads the ADR and the code to judge the correct status
          - every: proposal               # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 4                 # weekly sweep + occasional ADR-merge reactive runs
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - adr_status_drift_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection — fleet-wide re-verification that architectural decision records still match the code they describe"

      - id: authz-policy-auditor
        plane: control
        charter: "ADR-0167"
        description: >
          Static analyzer for the fleet's OPA/Rego authorization policies (rest.rego, agents.rego,
          copilot_tool.rego) and the agents.yaml charters that feed them. Cross-references every rule
          condition against AuthorizeInterceptor's actual emitted principal-type/id vocabulary: a rule
          gated on a classification value the interceptor never emits, an agent-id comparison missing
          the trim_prefix normalization the REST bridge path needs, an agents.yaml charter's
          tools.allow/deny drifting from the tool_tiers registry, and a REST rule bypassing
          agents.allow by calling charter_allowed directly. Proposes a tracking ticket through the
          HITL queue for every finding -- this agent never opens a fix PR, even for the fleet's usual
          "one narrow mechanical case," because a wrong auto-fix on an authorization rule is a live
          security exposure. Never writes to a .rego policy or agents.yaml directly.
        enabled: true
        enforcement: block
        schedule:
          weekly: "07:00 UTC"
          reactive: policy-source-changed-webhook   # triggered when any .rego policy or agents.yaml changes
        data_scope:
          read:
            - read.governance             # openbank-infra/opa/policies/*.rego, openbank-libs/governance/
                                           # policies/*.rego, agents.yaml, and AuthorizeInterceptor.kt via
                                           # a repo checkout
          pii: none                       # policy source text and rule metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket ONLY -- never a fix PR (ADR-0167 Decision)
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any .rego policy or agents.yaml ever
            - tier: execute
              resources: ["*"]
        requires_human:
          - any_authz_policy_finding      # HITL mandatory; a human reads the rego/charter diff and the
                                           # code path it gates before anything changes
          - every: proposal                 # segregation of duties: agent proposes, human disposes
          - two_person_review: authz_policy_findings   # stricter than every sibling agent's single-
                                           # approval HITL gate (mirrors rules.yaml review.
                                           # money_path_approvals: 2): a wrong disposition of an
                                           # authz-policy finding is a live security exposure, not a
                                           # documentation/cost/release nit, so this charter asks for a
                                           # second reviewer before a finding is closed out
        limits:
          tokens_per_run: 50000
          runs_per_day: 8                 # weekly sweep + occasional policy-source-changed reactive runs
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - authz_check_type_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 5 ICT risk management framework — fleet-wide static verification that authorization-policy rules can actually fire as intended"

      - id: flaky-test-hunter
        plane: development
        charter: "ADR-0168"
        description: >
          Static analyzer for fleet-wide silent-test-failure patterns in Kotlin test sources.
          Generalizes the check-test-runblocking-unit.sh CI guard (expression-body test functions
          using runBlocking/runTest/GlobalScope.launch/GlobalScope.async without an explicit ': Unit'
          return type, which JUnit5 silently drops instead of running) beyond its one hardcoded
          builder, flags Pact provider verification tests gated on pactbroker.url (always skipped by
          a local './gradlew test' run) and any provider with two colliding @Provider test classes,
          and cross-checks declared-vs-executed @Test counts per module. Proposes a tracking ticket
          through the HITL queue for nearly every finding -- guessing wrong on a fix here (suspend fun
          vs ': Unit', which @Provider class should own an interaction) risks silently masking a real
          bug instead of fixing it. Never writes to a test file directly.
        enabled: true
        enforcement: block
        schedule:
          weekly: "08:00 UTC"
          reactive: ci-test-suite-failure-webhook   # triggered when a CI test-suite run reports a failure
        data_scope:
          read:
            - read.governance             # every module's src/test/kotlin tree, .github/scripts/*.sh CI
                                           # guard scripts, and build/test-results/test/*.xml JUnit
                                           # reports via a repo checkout
          pii: none                       # test source text and JUnit report metadata only; no customer data
        tools:
          allow:
            - tier: read
              resources: [governance]
            - tier: write_proposal
              resources: [github-pr]      # opens draft.ticket by default; gh.pr.open stays wired but is
                                           # rarely used (ADR-0168 Decision)
          deny:
            - tier: write
              resources: ["*"]            # explicit: no direct write to any test file ever
            - tier: execute
              resources: ["*"]            # never invokes a build/test run itself
        requires_human:
          - any_flaky_test_finding        # HITL mandatory; a human reads the test's intent before a fix lands
          - every: proposal                 # segregation of duties: agent proposes, human disposes
        limits:
          tokens_per_run: 50000
          runs_per_day: 8                 # weekly sweep + occasional CI-test-suite-failure reactive runs
          kill_switch: true
        audit:
          capture:
            - model_id
            - prompt_hash
            - tool_calls
            - policy_decision
            - findings_detected
            - flaky_test_check_type_impacted
            - human_approved_by
        compliance:
          eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
          dora: "Art. 9 ICT risk detection; Art. 5 ICT risk management framework — fleet-wide static verification that a test suite's reported green state reflects tests that actually ran"
  rules-data.yaml: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright (c) OpenBank contributors. Licensed under the Apache License, Version 2.0.
    #
    # OpenBank governance rules — the single, machine-readable source of truth.
    #
    # This file is consumed by BOTH the CI gates and the CLAUDE.md agent guidance, so a
    # convention is written ONCE here and never duplicated as prose. CONTRIBUTING.md and the
    # PR template are the human narrative; THIS file is authoritative for automation.
    #
    # Governing principle (ADR-0029): derive from code -> enforce in CI -> sign the evidence
    # -> surface in UI. Nothing computable is typed twice; nothing shipped is unprovenanced.
    #
    # Status of enforcement: see `enforced` flag per rule. Gates flip to enforced only after
    # the producing layer (ADR-0029 D7) exists, so a rule can be `advisory` before it `block`s.

    schema_version: 1
    source_of_truth: true
    related_adrs: [ADR-0005, ADR-0014, ADR-0020, ADR-0029, ADR-0030, ADR-0031, ADR-0040, ADR-0043, ADR-0052, ADR-0053, ADR-0054, ADR-0060, ADR-0082, ADR-0088]

    # ---------------------------------------------------------------------------------------
    # Conventional Commits — the vocabulary (mirrors CONTRIBUTING.md, authoritative here).
    # ---------------------------------------------------------------------------------------
    commits:
      format: "<type>(<scope>): <imperative summary>"
      # scope = service name without the `openbank-` prefix (e.g. ledger, psd2, sepa-payment),
      # or `libs`, `infra`, `admin-ui`, `docs`, `ci`. The scope SELECTS the released component.
      scope_required: true
      types:
        feat:     { semver_bump: minor, changelog: true,  description: "new functionality" }
        fix:      { semver_bump: patch, changelog: true,  description: "bug fix" }
        perf:     { semver_bump: patch, changelog: true,  description: "performance, no behavior change" }
        refactor: { semver_bump: patch, changelog: false, description: "internal restructure, no behavior change" }
        docs:     { semver_bump: none,  changelog: false, description: "documentation only" }
        test:     { semver_bump: none,  changelog: false, description: "tests only" }
        chore:    { semver_bump: none,  changelog: false, description: "build / tooling" }
        build:    { semver_bump: none,  changelog: false, description: "build system / dependencies" }
        ci:       { semver_bump: none,  changelog: false, description: "CI configuration" }
        security: { semver_bump: patch, changelog: true,  description: "security fix (often private until disclosed)" }
      # A footer `BREAKING CHANGE:` (or `!` after type/scope) forces a MAJOR bump regardless of type.
      breaking_change_marker: "!"
      breaking_change_footer: "BREAKING CHANGE:"

    # ---------------------------------------------------------------------------------------
    # Branch naming (CONTRIBUTING.md). <scope> = service name without `openbank-`.
    # ---------------------------------------------------------------------------------------
    branches:
      pattern: "^(feat|fix|chore|docs|refactor|test|security|ci|perf)/[a-z0-9-]+$"
      no_direct_commits_to: [main]
      no_direct_commits_enforced: true  # branch protection live (issue #282, github-governance.tf)

    # ---------------------------------------------------------------------------------------
    # SemVer per service (ADR-0029 D2). Independent per-service versioning.
    # ---------------------------------------------------------------------------------------
    versioning:
      scheme: semver
      strategy: per_service                 # each openbank-*-service is its own release unit
      source_file: version.txt              # per-service file; build reads it into quarkus.application.version
      # openbank-admin-ui is a release unit too (a Next.js control-plane app, scope `admin-ui`).
      # It has no quarkus.application.version; its runtime-readable analog is package.json:version,
      # which MUST equal version.txt (the build-push script fails fast on drift). The build stamps
      # version.txt into BUILD_VERSION -> /api/build-info -> the version chip in the UI (ADR-0029
      # "derive from code / show in UI").
      # Two independent version axes (ADR-0048): the deployable-artifact release version and the
      # public REST-contract version. They move on different cadences and must NOT be conflated
      # (the former amended ADR-0029 D2's "collapse three into one").
      release_invariant:
        # The deployable artifact's release SemVer. These MUST be equal for a released service.
        # quarkus.application.version is DERIVED from version.txt at build time (the
        # openbank.quarkus-service convention plugin sets the Gradle project version from
        # version.txt; the Quarkus plugin stamps it in). It must NOT be set explicitly in a
        # service application.yaml — an explicit value shadows the derived one and desyncs on
        # every release-please bump. Enforced: .github/scripts/check-app-version-override.sh.
        - "version.txt"
        - "quarkus.application.version"   # build-derived from version.txt; never set in application.yaml
        - "git release tag"
        - "container image tag"
      api_invariant:
        # The public REST contract major. The OpenAPI document major, the runtime config and the
        # URL /api/v{N} segment MUST agree. (openapi.yaml:info.version is NO LONGER on the release axis.)
        - "major(openapi.yaml:info.version)"
        - "openbank.api.version"
        - "URL /api/v{N} segment"
      released_unit_marker: version.txt     # a module is a released component IFF it has a version.txt
      release_tool: release-please
      release_mode: components              # monorepo, per-component releases
      # Layer B wiring — release-please owns the RELEASE axis only (version.txt, CHANGELOG, git tag).
      # It does NOT touch openapi.yaml:info.version — that is the api_invariant axis (ADR-0048 / oasdiff).
      release_config: release-please-config.json        # root; packages == the version.txt modules
      release_manifest: .release-please-manifest.json   # root; current release version per component
      release_workflow: .github/workflows/release-please.yml
      release_doc: openbank-libs/governance/RELEASE.md  # human-readable rule
      enforced: active                      # Layer B is WIRED (was: planned)

    # ---------------------------------------------------------------------------------------
    # "Change X => require Y" — the rules that stop forgotten artifacts (ADR-0029 D1/D4).
    # Each maps a kind of change to the artifacts a PR MUST also contain.
    # ---------------------------------------------------------------------------------------
    change_requirements:
      api_change:
        detect: ["@Path", "@GET|@POST|@PUT|@DELETE|@PATCH", "request/response DTO under */rest/* or */api/*"]
        require:
          - "openapi.yaml updated"
          # API-contract bump classified from the OpenAPI diff (ADR-0048 D5), NOT from commit type:
          #   breaking  => new URL major (/api/v{N+1}) + deprecate predecessor
          #   additive  => info.version MINOR within the same /v{N}
          #   editorial => info.version PATCH
          - "api contract bump per OpenAPI diff"
          - "api_invariant holds: major(openapi.yaml:info.version) == openbank.api.version == URL /api/v{N}"
          - "consumer-driven contract test updated (Pact)"   # ADR-0029 D3
          # Pact provider verification: ONE @Provider test per provider. Separate HTTP and message
          # test classes that share @Provider + @PactBroker (no interaction-type filter) BOTH pull every
          # pact the broker holds for that provider — the HTTP class then tries to verify the message pact
          # via HttpTestTarget and fails the state-change callback (UnsupportedOperationException). Use one
          # class that picks the target per interaction (context.interaction.isAsynchronousMessage() ?
          # MessageTestTarget(listOf("<pkg>")) : HttpTestTarget(...)). Package-scope MessageTestTarget
          # (classpath-wide ClassGraph scan throws on JDK 25). Latent: ktlint runs before tests.
          - "single @Provider verification test per provider; per-interaction target for mixed HTTP+message"
        contract_diff_tool: oasdiff
        gate: api-contract
        enforced: enforce                   # ADR-0144 graduation, ahead of the 2026-08-15 target
        # .github/scripts/check-api-contract.py runs with --enforce in the "Validate manifests"
        # job on every PR (oasdiff 1.22.0, pinned + checksum-verified): classification and
        # api_invariant findings are ::error and fail the build.
        #
        # Why it graduated early: while advisory, the rule was being ignored — 11 of the 12 most
        # recent spec-changing commits added or altered endpoints without moving info.version at
        # all (e.g. #1161 added PATCH /api/v1/parties/{id}/consent and left 1.6.0 -> 1.6.0). An
        # advisory gate that everyone walks past is worse than none: it reports the rule is held
        # when it is not.
        #
        # The gate is DIFF-SCOPED, so that history is not retroactively a failure — only a PR's
        # own spec change is classified. The cost of enforcement is therefore one line per
        # spec-touching PR (bump info.version to match what the diff did), which the error
        # message spells out.
        ci_producer: ".github/scripts/check-api-contract.py"
      db_backup_association:
        detect: ["openbank-infra/gitops/**/*.yaml (kind: Cluster, postgresql.cnpg.io)"]
        require:
          - "a CNPG cluster declaring barmanObjectStore -> the managed bucket has a matching
             aws_eks_pod_identity_association in db-backups.tf"
        gate: db-backup-associations
        enforced: advisory
        target_enforce_date: "2026-08-15"   # ADR-0144
        ci_producer: "openbank-infra/scripts/check-db-backup-associations.py"
        # Backup credentials arrive via EKS Pod Identity, granted per (namespace, serviceAccount) by
        # a HAND-MAINTAINED map in db-backups.tf. Nothing linked that map to the gitops manifests, so
        # a new database could declare a backup, copy `inheritFromIAMRole: true` from a sibling,
        # report Ready + Healthy — and silently never back up. There is no failure until someone
        # needs a restore. Three clusters were in that state (#1444); sdd-db failed every WAL archive
        # for three days.
        #
        # NOT diff-scoped, unlike db_change/api_contract: the defect is a MISSING pair across two
        # trees, so a PR adding only the gitops half never touches the .tf side and a diff-scoped
        # gate would see nothing. It runs against whole repo state instead.
        #
        # Deliberately NOT solved by a discovered for_each in Terraform — both routes are blocked:
        # data.kubernetes_resources returns `objects` as a dynamic type (unknown at plan, so it
        # cannot key a for_each; a tofu plan of that design read "0 to add, 35 to destroy"), and
        # yamldecode cannot parse the 30-of-42 multi-doc manifests. Same lesson as the OPA generator
        # gate (#1184): the list must be checked mechanically, not remembered.
      db_change:
        detect: ["src/main/resources/db/migration/*.sql", "Flyway/Liquibase changeset"]
        require:
          - "new Flyway migration (forward)"
          - "rollback note in PR"
        gate: db-migration
        enforced: advisory
        target_enforce_date: "2026-08-15"   # ADR-0144
        # The rollback note lives IN the migration, as a `-- Rollback:` comment — single-line or
        # spanning the following comment lines. blocked_on used to call for a PR-BODY-parsing check,
        # but the established practice is in-file (96 of 214 migrations when the gate was written,
        # and every recent one), the file IS part of the PR, and an in-file note is strictly better:
        # it sits next to the migration forever, where whoever rolls it back is already looking.
        # The gate also covers the "forward" half of the requirement above — editing an
        # already-committed migration is a finding, since Flyway checksums the whole file.
        # Flipping to enforced = pass --enforce in ci.yml (one-line change).
        ci_producer: "openbank-infra/scripts/check-db-migration.py"
      event_change:
        detect: ["*.avsc", "Avro/JSON schema under */schema/* or */avro/*", "Kotlin data class extending DomainEvent (the actual event contract today — JSON on Kafka via the outbox)"]
        require:
          - "schema versioned backward-compatibly"
          - "breaking event change ships as a NEW versioned event (-vN topic, ADR-0006), never an in-place edit"
        gate: schema-compat
        enforced: advisory
        target_enforce_date: "2026-09-15"   # ADR-0144
        # CI producer is LIVE (advisory): .github/scripts/check-event-schema-compat.py runs in
        # the "Validate manifests" job on every PR — diff-scoped over DomainEvent data classes
        # (removed/renamed props, type changes, non-nullable-no-default additions = replay break,
        # eventType renames) and *.avsc files (field default rules). Flip to enforced = --enforce.
        ci_producer: ".github/scripts/check-event-schema-compat.py"
      event_consumer_liveness:
        # ADR-0160 mechanism 1. standing-order-service published standing-order.due.v1 every day
        # for weeks with zero consumers anywhere in the fleet — full CRUD, passing tests, docs, a
        # scheduler doc-comment claiming a downstream consumed it — and nothing checked the claim
        # against the actual fleet (issue #889). This is a fleet-wide scan, not diff-scoped: any
        # Kafka topic published by ANY service's mp.messaging.outgoing (or dispatched via an
        # outbox to a declared topic) must have at least one @Incoming consumer somewhere in the
        # fleet (a matching topic:/topics: declaration), or be explicitly allowlisted below with a
        # one-line reason (external sink, deliberately audit-only, or a tracked future-work gap).
        detect: ["any <service>/src/main/resources/application.yaml mp.messaging.outgoing topic"]
        require:
          - "topic has >=1 real @Incoming consumer fleet-wide, or an allowlist entry with a reason"
        gate: event-consumer-liveness
        # GRADUATED to enforce 2026-07-14 (ADR-0144): the #996 fleet-sweep triage that started with
        # issue #889 brought unallowlisted violations to zero across three rounds (#1005 sca topic
        # mismatch, #1007/#1032/#1050 audit-service fan-out, #1054 fx-service dead-stub producer fix,
        # this PR's fx.conversion.completed/documents.document.event/payments.swift.event consumers)
        # — same graduation path check-outbox-dispatch-enabled.sh proved out. check-event-consumer-
        # liveness.py --root . --enforce reports 0 fleet-wide; ci.yml now passes --enforce.
        enforced: enforce
        # CI producer is LIVE and enforced: .github/scripts/check-event-consumer-liveness.py runs in
        # the "Validate manifests" job on every PR — fleet-wide scan (not diff-scoped). A new topic
        # published with no consumer and no allowlist entry now fails the build.
        ci_producer: ".github/scripts/check-event-consumer-liveness.py"
        # #996 triage findings, classified LEGITIMATE_NO_CONSUMER (not the #889 failure class):
        allowlist:
          - topic: "openbank.psd2.events"
            reason: "psd2-service docs consistently describe this as audit-trail + external TPP-webhook delivery, not an intra-fleet reaction — no OpenBank service is meant to consume it."
          - topic: "openbank.tpp.registry.event"
            reason: "tpp-registry-service's own docs say the publish side is dormant (\"no domain events are emitted yet\" — outbox transport exists but unused). Not the #889 pattern (a working publish going nowhere): nothing is actually published today. Re-triage once the publish side is wired."
          - topic: "openbank.pid.events"
            reason: "Confirmed dead code, not a live gap: PidOutboxRepository.persistInTransaction (the only writer for this channel) has zero callers across all 5 pid-service use cases — grep-verified. pid-service's real domain events flow through a separate, actually-used PartyEventPublisher to party.events instead. application.yaml even documents the emitter exists only so the unwired @Channel doesn't crash the app at boot. Candidate for future cleanup (remove the dead channel), not a #889-class gap."
      lineage_code_audit:
        # ADR-0160 mechanism 2. standing-order-service's governance.yaml declares a downstream edge to
        # transaction-service (relationType: api) — copy-pasted boilerplate with no backing
        # @RegisterRestClient anywhere in the service. Nothing checked the claim against the actual
        # fleet, same root cause as issue #889 (a different unverified claim, same failure shape: prose
        # describing runtime behaviour, never checked against code). Fleet-wide scan, not diff-scoped:
        # every governance.yaml lineage.downstream edge (relationType api|topic) must be backed by
        # grep-verifiable code in the SAME service (a matching @RegisterRestClient configKey for api;
        # an actual topic produced/consumed in common with the target service for topic — a topic edge
        # doesn't name the specific topic, just the service, so it's a service-level cross-reference),
        # or be explicitly allowlisted below with a one-line reason (a REST call made through a
        # shared/generic client this heuristic's exact-match can't see, or a genuinely-stale edge
        # already tracked for cleanup elsewhere).
        detect: ["any <service>/governance.yaml lineage.downstream edge"]
        require:
          - "api edge has a matching @RegisterRestClient(configKey) in the same service, or an allowlist entry with a reason"
          - "topic edge has an actual topic overlap with the target service (per mechanism 1's producer/consumer map), or an allowlist entry with a reason"
        gate: lineage-code-audit
        enforced: advisory
        target_enforce_date: "2026-10-15"   # ADR-0144 — later than mechanism 1's date: first scan found a much higher (34/48) violation rate, expect a longer triage
        # CI producer is LIVE (advisory): .github/scripts/check-governance-lineage.py runs in the
        # "Validate manifests" job on every PR — fleet-wide scan (not diff-scoped), reuses mechanism 1's
        # topic map via importlib (check-event-consumer-liveness.py's build_topic_maps), findings are
        # ::warning annotations. First scan (2026-07-13): 34 of 48 downstream edges have no backing code
        # found — consistent with mechanism 1's own first-scan rate (13/18, ~72%), i.e. this fleet's
        # governance.yaml lineage data really is this stale, not primarily a heuristic false-positive
        # rate. ALL still unallowlisted below (real triage tracked as a fleet-sweep issue, not resolved
        # by fiat). Flip to enforced once triage brings unallowlisted violations to zero = pass
        # --enforce to the script in ci.yml (one-line change), same as every other ADR-0144 gate here.
        blocked_on: "issue #1021 triaged the original 34: 4 were a topic-normalization bug in the
          checker itself (fixed), 19 are stale governance.yaml edges (corrected/removed), 6 below are
          real dependencies the heuristic's exact-match can't see, and 4 are genuine gaps tracked as
          their own issues, not fixed here. A follow-up scan found 7 more edges outside the original
          34 (the *->admin-ui reversed-direction shape) — not yet triaged."
        ci_producer: ".github/scripts/check-governance-lineage.py"
        allowlist:
          - edge: "openbank-copilot-service->balance-service:api"
            reason: "Reached only through CustomerEdgeRestClient (configKey=customer-edge), a shared BFF client with no per-target configKey — GET /customer/v1/balances/{accountId}."
          - edge: "openbank-copilot-service->fx-service:api"
            reason: "Same shared CustomerEdgeRestClient (configKey=customer-edge) as balance-service above — GET /customer/v1/fx/rates."
          - edge: "openbank-copilot-service->ledger-service:api"
            reason: "Same shared CustomerEdgeRestClient (configKey=customer-edge) — GET /customer/v1/statements/{accountId}."
          - edge: "openbank-copilot-service->transaction-service:api"
            reason: "Same shared CustomerEdgeRestClient (configKey=customer-edge) — listTransactions()."
          - edge: "openbank-interest-service->account-service:api"
            reason: "Reaches the account indirectly through TransactionServiceClient (configKey=transaction-service), which books the withholding-tax remittance cash leg — never a direct account-service call."
          - edge: "openbank-transaction-service->account-service:api"
            reason: "Validation is implemented via BalanceCoverClient (configKey=balance-service) placing/releasing holds, a sibling of account-service — never a direct account-service call."
      service_code_change:
        detect: ["<service>/src/main/**"]
        require:
          - "<service>/version.txt bumped per commit type"
          - "test added/updated for new behavior"
        gate: version-bump
        enforced: advisory
        target_enforce_date: "2026-10-01"   # ADR-0144
        blocked_on: "the version-bump half is effectively covered by release-please + check-app-version-override.sh; 'test added for new behavior' has no automated diff-aware detector (not yet written) — may get redefined to lean on the coverage ratchet gate instead of a literal test-added check"
      release_scope_mismatch:
        # The inverse failure mode of service_code_change above: release-please attributes a
        # commit to a component by the FILES IT TOUCHES under that component's directory,
        # regardless of the typed scope (RELEASE.md) — so a feat/fix/perf/security (or
        # breaking-marked) commit that only touches <service>/src/test/**, a root file like
        # <service>/openapi.yaml, or gitops/docs outside the service dir entirely still makes
        # release-please propose a release, even though only <service>/src/main/** should
        # (rule 2). Observed live: PR #547 (feat(finrep): register ArgoCD Application — touched
        # only a src/test boot-smoke test + gitops/docs outside the package dir) -> PR #551
        # (finrep-service 0.4.0 proposed for an unchanged artifact). Harmless SemVer inflation,
        # not a broken invariant — but the same mechanism misfires for any test-only or
        # openapi.yaml-only PR typed feat/fix, so it is worth catching at PR time rather than
        # correcting release-please output by hand (which rule 3 forbids anyway).
        detect: ["<service>/** changed", "PR title type in {feat,fix,perf,security} or a breaking marker/footer", "no changed file under <service>/src/main/** (or openbank-admin-ui/src/**)"]
        require:
          - "use a non-releasing type (test/docs/chore/refactor/build/ci) when the PR doesn't touch the release-worthy subtree"
          - "or split the src/main change and the non-src/main change into separate commits/PRs when both a release and a non-releasing change are intended"
        gate: release-scope-mismatch
        enforced: advisory
        target_enforce_date: "2026-10-01"   # ADR-0144, same timeline as service_code_change (same root-cause class)
        # CI producer is LIVE (advisory): openbank-infra/scripts/check-release-scope-mismatch.py runs
        # in the "Validate manifests" job on every PR, right after release-registration consistency.
        # Classifies from the PR title (the default squash-commit subject). Findings are ::warning
        # annotations. Flip to enforced = pass --enforce to the script in ci.yml (one-line change).
        ci_producer: "openbank-infra/scripts/check-release-scope-mismatch.py"
      service_config_change:
        # SmallRye Config / SnakeYAML do NOT merge duplicate mapping keys — the LAST
        # occurrence wins and earlier ones are SILENTLY dropped to library defaults, so
        # a boot smoke-test does not catch it. Forbidden at ANY nesting level in every
        # service application.yaml. Regression guard for #1170 (dup quarkus.http dropped
        # the port) and #1193 (dup top-level openbank: dropped rate-limit/resilience).
        detect: ["<service>/src/main/resources/application.yaml"]
        require:
          - "no duplicate mapping key at any level (merge duplicate blocks into one key)"
        gate: duplicate-yaml-keys                              # .github/scripts/check-duplicate-yaml-keys.sh
        # Enforced: the #1193 sweep is complete (openbank: blocks + the quarkus.http:
        # second layer in sca/tpp-registry/consent/pid) and the guard reports 0 fleet-wide,
        # so ci.yml runs check-duplicate-yaml-keys.sh with --enforce (hard gate).
        enforced: enforce
      money_path_or_trust_boundary_change:
        detect: ["money_path service src/main/**", "new service", "trust boundary change"]
        require:
          - "docs/threat-models/<service>.md present/updated"   # ADR-0030 D2
        gate: threat-model
        enforced: enforce                   # check-threat-models.py live in CI; all 13 money-path services have valid threat models
      trust_boundary_diff_change:
        # ADR-0030 D2, diff-aware half (issue #265). The coverage gate above proves a threat
        # model EXISTS; this one proves it is UPDATED in the same PR when a money-path
        # service's trust boundaries move: new/changed inbound REST endpoints
        # (infrastructure/rest/**), a new outbound HTTP/gRPC edge (infrastructure/client/**,
        # client-flavoured adapters), authn/listener/transport keys
        # (oidc|auth|authz|opa|http|kafka|security) in application.yaml, or the service's
        # NetworkPolicy / Deployment/Rollout manifest under openbank-infra/gitops/components/.
        detect: ["money-path <service> trust-boundary paths in the PR diff"]
        require:
          - "docs/threat-models/<service>.md updated in the SAME PR"   # ADR-0030 D2
        gate: threat-model-diff
        enforced: advisory
        target_enforce_date: "2026-09-15"   # ADR-0144
        # CI producer is LIVE (advisory): openbank-infra/scripts/check-threat-model-diff.py runs
        # in the "Validate manifests" job on every PR, right after the coverage gate — diff-scoped
        # (3-dot against the PR base). Findings are ::warning annotations. Flip to enforced =
        # pass --enforce to the script in ci.yml (one-line change).
        ci_producer: "openbank-infra/scripts/check-threat-model-diff.py"
      new_service_with_outbox:
        # A service that extends AbstractOutboxEntity / uses OutboxDispatcher but does NOT
        # set openbank.outbox.dispatch-enabled=true silently never dispatches events —
        # no error, no log, attempt_count stays 0. This is the #1 new-service silent failure.
        detect: ["new <service>/ directory", "AbstractOutboxEntity subclass in src/main/**"]
        require:
          - "openbank.outbox.dispatch-enabled: true in <service>/src/main/resources/application.yaml"
        gate: outbox-dispatch-enabled
        # check-outbox-dispatch-enabled.sh landed and reports 0 violations fleet-wide
        # (2026-07-02) — the first gate this ADR-0144 sweep graduated on its own merge day.
        enforced: enforce
      admin_ui_code_change:
        # admin-ui is a released component (scope `admin-ui`); the version-bump discipline that
        # applies to every service applies here too. Changing app code under
        # openbank-admin-ui/src/** ⇒ bump openbank-admin-ui/version.txt per commit type, and keep
        # package.json:version equal to it (release_invariant; build-push-admin-ui.sh enforces).
        detect: ["openbank-admin-ui/src/**"]
        require:
          - "openbank-admin-ui/version.txt bumped per commit type"
          - "openbank-admin-ui/package.json version == version.txt"
          - "test added/updated for new behavior"
        gate: version-bump
        enforced: advisory
        target_enforce_date: "2026-10-01"   # ADR-0144
        blocked_on: "the version.txt==package.json half is already enforced (check-admin-ui-version-sync.sh, ci.yml); 'test added for new behavior' has no automated detector, same gap as service_code_change"
      admin_ui_docs_currency:
        # Documentation must stay current. Any change to a process or an admin-ui
        # section must update that section's documentation in the SAME PR — applies
        # to ALL admin-ui sections (docs/*, dashboards, process pages). Diagrams and
        # compliance scorecards are part of the section's documentation.
        detect:
          - "openbank-admin-ui/src/app/**/page.tsx"
          - "process spec / lens / controls[] under docs/*"
          - "process diagram (*.mmd) or process.yaml manifest"
        require:
          - "the section's documentation (copy, diagram, scorecard) updated in the same PR"
          - "compliance scorecard reflects current live/partial/planned status"
        gate: docs-currency
        enforced: advisory
        target_enforce_date: "2026-09-15"   # ADR-0144
        blocked_on: "no CI checker for section-documentation currency (not yet written) — likely needs a docs-touched-when-page-touched heuristic, not a strict diff rule"
      clock_injection:
        # ADR-0100 (DST Layer 1): no Instant.now() / LocalDateTime.now() / System.currentTimeMillis()
        # in domain or application layer of money-path services. All time must flow from an injected
        # java.time.Clock CDI bean (the pattern ledger/dispute already follow) so the DST harness can
        # virtualise it. A centralised libs Clock producer is tracked in #1612. Kotlin stdlib
        # Clock.System.now() is equally forbidden — use injected Clock.
        detect:
          - "money_path service src/main/kotlin/**/domain/**"
          - "money_path service src/main/kotlin/**/application/**"
          - "Instant.now()|LocalDateTime.now()|System.currentTimeMillis()|Clock.System.now()"
        require:
          - "injected java.time.Clock CDI bean used (centralised libs Clock producer tracked in #1612)"
          - "no Instant.now() / LocalDateTime.now() / System.currentTimeMillis() / Clock.System.now() in domain or application layer"
        gate: dst-clock-injection
        enforced: enforce                   # ADR-0100 simulation harness live (#1725); gate clean fleet-wide
      money_path_ledger_economics:
        # THE RULE: a change to how a money-path service posts to the ledger must be covered by a test that
        # asserts the resulting GL ACCOUNT BALANCES, not merely which journals were emitted.
        #
        # WHY. #1236 (lending, 2026-07-16) shipped a reschedule that silently forgave already-earned
        # interest — Dr Interest Income where the receivable should have been capitalised — and EVERY check
        # was green. Its tests asserted mechanics: posting kinds, ordering, reference strings,
        # idempotency-key equality. The defective code satisfied all of them perfectly: it emitted exactly
        # the right KIND of journal and merely pointed one leg at the wrong account. No test asked the only
        # question that matters — after this flow, what does the general ledger say? Reverted in #1247,
        # re-landed correctly in #1253.
        #
        # The failure mode is specific and repeatable: net profit is UNCHANGED, so nothing looks wrong,
        # while the CLASSIFICATION is wrong — a credit concession lands in a revenue line. Interest Income
        # and Loan Loss Expense are separately-reported FINREP lines. A mechanics test cannot see this; a
        # balance test fails on it immediately.
        #
        # THE PATTERN: capture the postings, replay them through the service's real journal factory (the
        # same mapping production uses), net debits/credits per account, assert each balance against a
        # hardcoded expected value. Reference implementation:
        # openbank-lending-service/src/test/kotlin/.../LendingGlOutcomeTest.kt.
        #
        # A BALANCE TEST IS NOT AUTOMATICALLY AN ECONOMIC TEST. Two traps, both found by review ON THE
        # REFERENCE IMPLEMENTATION ITSELF — and this entry previously recommended the first one as a virtue:
        #   * A whole-ledger "debits == credits" assertion is TAUTOLOGICAL when the factory emits one debit
        #     and one credit of equal value per posting: identically zero for every input, INCLUDING a leg
        #     mapped to the wrong account — the very defect being guarded against. Assert per-account
        #     balances against literals instead. The balanced-journal property belongs in the factory's own
        #     test, where an unbalanced branch could actually appear.
        #   * A mutation can turn a test red FOR THE WRONG REASON — the unguarded flow dying on an unstubbed
        #     mock before it ever reaches the ledger, so "no postings were made" passes vacuously. Stub
        #     enough that the DEFECTIVE path runs, and assert the wrong balance it actually produces.
        detect:
          - "money_path service change to a ledger PostingKind, its GL account mapping, or a posting flow"
        require:
          - "a test asserting the GL ACCOUNT BALANCES the flow produces, not only the journals it emits"
          - "a new PostingKind covered by a balance assertion, not only a mapping assertion"
          - "the test proven to fail against the defect it guards — AND for the right reason, not on an unstubbed mock"
        gate: none
        # Deliberately NOT a CI gate. "This test asserts economics" is not detectable by a regex, and a gate
        # that pretended to check it — grepping for balance assertions, say — would pass a test asserting the
        # WRONG balances, or one going red on an unstubbed mock. That is worse than an honest convention: it would read as coverage while providing
        # none, which is the same class of failure it exists to prevent. Enforced by review, under the
        # money-path two-approval rule.
        enforced: convention
      release_please_merge:
        # A release-please merge commit that reorders the tail of .release-please-manifest.json can
        # SILENTLY drop a component line while it stays in release-please-config.json. The
        # release-registration gate (rule #3, ADR-0029) runs against repo STATE, not the diff, so it then
        # fails on EVERY open PR; release-please also loses the version baseline and proposes a REGRESSED
        # version (observed: transaction-service 1.10.0 -> a fresh 1.0.0, #2342/#2351). After ANY RP merge,
        # config and manifest MUST stay in lockstep (same component set). Restore a dropped line with its
        # version.txt value (= latest git tag) as baseline.
        detect: ["release-please merge to main", ".release-please-manifest.json change"]
        require:
          - "release-please-config.json and .release-please-manifest.json list the SAME components (lockstep)"
          - "check-release-registration.py reports equal counts (modules==config==manifest)"
          - "no released component proposes a version BELOW its latest git tag"
        gate: release-registration                            # openbank-infra/scripts/check-release-registration.py
        enforced: enforce

    # ---------------------------------------------------------------------------------------
    # Money-path services (from CODEOWNERS critical paths) — stricter rules apply.
    # Two approvals, mandatory threat model, mutation testing, higher coverage floor.
    # ---------------------------------------------------------------------------------------
    money_path_services:
      - openbank-ledger-service
      - openbank-transaction-service
      - openbank-account-service
      - openbank-balance-service
      - openbank-sepa-payment
      - openbank-sepa-instant
      - openbank-domestic-payment
      - openbank-clearing-service
      - openbank-swift-service
      - openbank-fx-service
      - openbank-lending-service
      - openbank-sdd-service                  # issue #1478: SddCollectionDebitConsumer posts a real debit via
                                               # TransactionServiceClient for every authorised direct-debit collection
                                               # (#1027, merged) — moves funds directly, not adjacent to it like
                                               # sca/consent/vop below. Four-eyes not yet assessed for this service;
                                               # revisit under issue #938's follow-up sweep.
      - openbank-interest-service              # issue #1478: capitalize()/write-off post real GL journals
                                               # (LendingJournalFactory-equivalent), and withholding-tax remittance
                                               # (#999, in progress) will book a cash leg via transaction-service.
                                               # Four-eyes not yet assessed for this service; revisit under issue
                                               # #938's follow-up sweep.
      - openbank-sca-service                  # four-eyes assessed (issue #938 follow-up), NOT wired: device.enroll and
                                               # scaChallenge.consume are both real-payment/self-service actions with a
                                               # confirmed M2M automated caller (customer-edge) — gating either would brick
                                               # production automation once enforcement is ever flipped on, not just close
                                               # the risky operator-console gap. See the four_eyes.verbs guardrail note below.
      - openbank-consent-service               # four-eyes wired (issue #938 follow-up) on consent.grant/consent.revoke —
                                                # both confirmed human-operator-only (no M2M caller). consent.activate
                                                # deliberately left ungated: its rego already reserves an M2M grant for a
                                                # possible SCA-completion-callback caller.
      - openbank-fraud-service                # ADR-0084: v4 rule engine live; domestic-payment enforcement gate merged (issue #667, flag default-off pending risk-team threshold calibration)
                                               # four-eyes assessed (issue #938 follow-up): the only REST surface today is a stateless
                                               # POST /fraud/score (fraud.score) — no operator case-decision, rule-config, or manual
                                               # override endpoint exists yet, so there is nothing real to maker-checker gate. Revisit
                                               # once a fraud case-management endpoint ships (clearing a flag / disabling a rule /
                                               # forcing a decision would need `clear`/`override`/`disable` verbs added here then).
      - openbank-billing-service              # ADR-0143: fee assess/post/reverse shipped (phases 1a-2e); real-env e2e verification + four-eyes enforcement flip still gate production go-live
      - openbank-settlement-service           # issue #307: debit->credit->ledger-booking saga (ADR-0101), orchestrated by a real
                                               # Temporal workflow (SettlementWorkflowImpl) — not a bespoke non-Temporal saga.
                                               # four-eyes assessed (issue #938 follow-up): the only REST surface is
                                               # POST /settlements (settlement.create), which starts the (self-healing, self-
                                               # compensating) saga; there is no manual retry/force-complete/compensate endpoint to
                                               # gate. Revisit if such an operator override endpoint is ever added.
      - openbank-sanctions-service             # ADR-0116: real feed screening; four-eyes wired (issue #938 follow-up) on
                                                # sanctions.clear (deciding a screening hit) — the highest-risk action in this
                                                # service, since a wrongly-cleared true positive is a real sanctions violation.
      - openbank-vop-service                   # ADR-0171: Verification of Payee (IPR Art. 5c) — sits on the pre-execution path of
                                                # every euro credit transfer. Money-path for the same reason sca/consent/fraud are:
                                                # it gates money movement without moving money itself.
                                                # four-eyes assessed: the only REST surface is POST /vop/verify (vop.verify), a
                                                # read-shaped check that mints nothing and decides nothing a human could collude on
                                                # — there is nothing to maker-checker gate. The action that WOULD deserve a gate is
                                                # a runtime change to `openbank.vop.max-edit-distance`: widening it silently turns
                                                # genuine mismatches into reassuring amber warnings (threat model §3 Tampering).
                                                # It is gitops-only config today, so it is covered by PR review rather than
                                                # four_eyes.verbs; add a `vop.flip` verb here if it ever becomes operator-tunable.

    # ---------------------------------------------------------------------------------------
    # SLOs (issue #669 — operational evidence, scope item 3). Governed data: a single
    # availability + latency target applied uniformly across every money_path_services entry
    # above (no separate service list here — money_path_services is the one list, to avoid the
    # two-lists-drift class of bug rule #7 exists to prevent). Reconciled into Prometheus
    # multi-window burn-rate rules by Pyrra (ADR-0088 D2), one ServiceLevelObjective pair
    # (availability + latency) per service in
    # openbank-infra/gitops/components/observability/pyrra-slo-money-path.yaml.
    # check-slo-registry.sh (CI, required) fails if a money-path service is missing either SLO
    # object, or if an existing object's target/window drifts from the values below — so
    # dashboards/alerts derive from this governed data, never a hand-edited PrometheusRule.
    #
    # Targets are REFERENCE defaults, not calibrated against real production incident or
    # traffic history — this is a reference implementation with no live customer traffic (same
    # honesty disclosure as the openbank-lending-service PD/LGD placeholders). Revisit once the
    # load-benchmark / DR-drill scope of issue #669 produces real numbers.
    slo:
      availability_target: "99.9"           # percent of non-error requests, uniform fleet-wide
      availability_window: 30d
      latency_target_percent: "99"          # percent of requests faster than latency_threshold_seconds
      # tighter than the fleet HighLatencyP99 alert (2s, prometheus-rules-tier1.yaml) by design:
      # the SLO burn-rate should page before the blunter absolute-latency alert does.
      latency_threshold_seconds: 1
      latency_window: 30d

    # ---------------------------------------------------------------------------------------
    # Alert delivery (ADR-0082 / ADR-0088). Keep this section terse: rules.yaml is embedded
    # verbatim into every OPA sidecar bundle ConfigMap. Full rationale lives in ci_producer.
    # ---------------------------------------------------------------------------------------
    alerting:
      # At least one Alertmanager route matching severity=critical must end at a receiver that
      # egresses the cluster (external integration, or a webhook with a literal non-cluster
      # URL; a url_file counts as unprovable). In-perimeter paging (GoAlert -> ntfy, ADR-0088
      # D1) may stay alongside it, but not as the only leg. Guards the "severity inversion":
      # critical routed only to no-Ingress in-cluster receivers (ADR-0056) while warning
      # reached Slack, so the most severe alerts were the least likely to be seen.
      critical_alerts_must_egress: true
      enforced: enforce
      ci_producer: ".github/scripts/check-critical-alert-egress.py"
      checked_manifest: "openbank-infra/gitops/apps/kube-prometheus-stack.yaml"

    review:
      default_approvals: 1
      money_path_approvals: 2               # CONTRIBUTING.md + branch protection
      self_merge_forbidden_on: [CODEOWNERS_protected]

    # ---------------------------------------------------------------------------------------
    # Money-path action-prefix overrides (issue #395). rest.rego derives a scope from each
    # money_path_services entry by stripping `openbank-` and a trailing `-service`
    # (openbank-ledger-service -> ledger) and matches it against the @Authorize action
    # prefix (the part before the first `.`). A fleet audit found 5 services whose real
    # prefix does not equal that derived name — two (clearing, sca) aren't even a casing
    # variant of it — which silently disabled four_eyes_required for every one of them.
    # List the REAL @Authorize prefix(es) here for any service where it differs; rest.rego
    # uses this instead of the derived name for that service, and rest_test.rego pins each
    # entry against the service's actual source so a rename can't silently drift back out
    # of sync. Only list a service here when it diverges — everything else keeps using the
    # derived name.
    money_path_action_prefixes:
      sepa-payment: [sepaPayment]
      sepa-instant: [sctInstPayment]
      clearing: [clearingBatch]
      sca: [device, scaChallenge]
      # domestic-payment: intentionally NOT listed here (removed 2026-07-08, found while
      # auditing issue #413). Its @Authorize actions were independently renamed from
      # domesticPayment.* to domestic-payment.* (kebab-case, matching the derived scope)
      # by a later change — the override entry this table used to carry (domesticPayment)
      # had gone stale and was silently breaking the scope match again (input.action
      # "domestic-payment.transitionStatus" no longer starts with the overridden
      # "domesticPayment." scope). Now correctly covered by the default derived-name rule
      # below — do not re-add an override here unless the action prefix diverges again.

    # ---------------------------------------------------------------------------------------
    # Four-eyes (dual control) for the unified OPA authz PEP (ADR-0034 D1; rest.rego reads
    # data.rules.four_eyes.verbs). A money-path action whose verb is listed here is flagged
    # `four_eyes_required` so the handler demands a second approver (maker-checker). This is
    # an AUGMENTATION flag, not an allow/deny on its own. NOTE: rest.rego normalises the
    # money_path_services entries (strips the `openbank-` prefix and a trailing `-service`,
    # or applies the money_path_action_prefixes override above) to the action scope
    # namespace, e.g. `openbank-ledger-service` -> `ledger`.
    #
    # transfer/post/reverse/freeze/release/flip were the originally-designed vocabulary, but
    # a fleet audit (issue #395) found real @Authorize verbs rarely spell it that way — only
    # ledger.reverse, transaction.reverse and account.freeze literally matched. The verbs
    # below were added to cover the real money-moving action each service actually emits.
    four_eyes:
      verbs:
        - transfer                          # outbound value movement (sepa/domestic/swift/instant)
        - post                              # ledger journal posting
        - reverse                           # ledger reversal
        - freeze                            # account freeze/unfreeze
        - release                           # release a held payment
        - flip                              # money-path feature-flag flip (ADR-0067 / issue #419)
        - transitionStatus                  # sepa-payment / domestic-payment lifecycle transition (issue #395)
        - recall                            # sepa-instant: recall a SETTLED payment (issue #395)
        - settle                            # clearing: settle a clearing batch (issue #395)
        - disburse                          # lending: loan payout (issue #395)
        - send                              # swift: send an outbound wire message (issue #395)
        - credit                            # balance: direct ledger-balance credit adjustment (issue #395)
        - debit                             # balance: direct ledger-balance debit adjustment (issue #395)
        - collateralRegister                # lending: collateral registration/edit feeds IFRS 9 LGD (issue #621)
        - convert                           # fx: execute a currency conversion at the current spot rate (issue #938 follow-up).
                                             # Confirmed no M2M caller (fx-service's own rego: "fx.convert... has NO in-repo M2M
                                             # caller today and stays human-only") — see the guardrail note below before adding
                                             # any further verb here.
        - grant                             # consent: create a new TPP<->customer data-access consent (renamed from consent.create,
                                             # issue #938 follow-up). Confirmed no M2M caller (consent-service's own rego: "consent.grant
                                             # and consent.revoke are NOT granted to M2M clients").
        - revoke                            # consent: operator-initiated revocation of a customer's active consent. Confirmed no M2M caller
                                             # (same rego note as consent.grant above).
        - sweep                             # transaction: move a duplicate party's balance to the surviving party during an
                                             # identity merge (ADR-0179). Confirmed no M2M caller — POST /transactions/merge-sweep
                                             # is a NEW endpoint introduced with this verb, admits only ROLE_OPERATOR/ROLE_ADMIN
                                             # (no ROLE_SERVICE), and has no in-repo caller other than a human operator console.
                                             # It exists as its own action precisely so the verb can be gated here: the equivalent
                                             # movement through transaction.create could NOT be, since `create` is on the M2M
                                             # payment rails — the distinct-operator-only-action pattern this guardrail prescribes.
        - clear                             # sanctions: decide a screening hit (CLEAR/HIT/POTENTIAL_HIT) — a wrongly-cleared true positive
                                             # is a real sanctions violation; distinct from `release` (payment-hold release) for clean audit
                                             # separation. Confirmed no M2M caller (@RolesAllowed on POST /sanctions/review admits only
                                             # ROLE_OPERATOR/ROLE_ADMIN, no ROLE_SERVICE).
        # GUARDRAIL (issue #938 follow-up — found while wiring sca-service): four_eyes_required is
        # computed by ACTION NAME ALONE (rest.rego money_path_scopes + endswith verb match), with NO
        # awareness of the caller's identity. A verb is only safe to add here if EVERY real-world
        # caller of that action across the WHOLE fleet is a human operator/admin session — if even one
        # legitimate M2M/automated caller exists, four-eyes enforcement (once ever flipped on for that
        # service) pauses that automated flow too, indistinguishably from the risky human path it was
        # meant to gate. sca-service's device.enroll and scaChallenge.consume were both assessed and
        # REJECTED for this reason: both are granted to customer-edge's M2M identity in base rest.rego
        # (edge-service-notification's device.* family, sca's own service-sca-edge-m2m rule) for
        # ordinary customer self-service device enrollment and — critically — scaChallenge.consume is
        # the payment settlement gate every real payment passes through. Gating either would silently
        # brick production automation the moment enforcement is ever turned on, not just close the
        # risky operator-console gap. Before adding a new verb: grep every service's own
        # gen-<service>-opa-bundle.sh for an M2M/SERVICE-identity rule granting that action; if one
        # exists (or plausibly could — consent.activate was ALSO excluded for this reason, no confirmed
        # caller found but the rego already reserves the grant), the risky path needs its own distinct
        # action (e.g. a dedicated operator-only "enrollOnBehalf" endpoint) before it can be four-eyes
        # gated safely — do not reuse the shared customer/M2M-facing action.
      #
      # actions: exact action names, gated independently of money_path_scopes (ADR-0176 D5).
      # `verbs` above only ever fires for an action whose SCOPE derives from money_path_services —
      # notification-service is not, and never will be, on that list (D5's own reasoning), so no verb
      # addition could reach opsmessage.compose. This generalises the featureflag.flip precedent two
      # blocks down (an exact action name, independent of money-path scope, already shipped with
      # ADR-0067) into a reusable list instead of a one-off inline clause. Read disjunctively with
      # `verbs` in rest.rego's four_eyes_required — a service can be gated by either mechanism, never
      # both computing the same answer twice.
      #
      # The GUARDRAIL above applies here too, unchanged: opsmessage.compose is its own action
      # namespace specifically so this list-membership can never accidentally cover an M2M-reachable
      # action — rest.rego's edge-service-notification rule grants notification.* to customer-edge's
      # M2M identity via a prefix match, and opsmessage.* was kept out of that family for exactly this
      # reason (ADR-0176 D4).
      actions:
        - opsmessage.compose                # ADR-0176 D5: operator-initiated customer messaging.
                                             # Confirmed no M2M caller — the only allow rule for this
                                             # action requires HUMAN + (ROLE_OPERATOR or ROLE_ADMIN) and
                                             # explicitly excludes any service-account-* principal id
                                             # (rest.rego operator-compose-message), the same exclusion
                                             # m2m-sanctions-screening uses for the opposite carve-out.

    # ---------------------------------------------------------------------------------------
    # Feature-flag flip governance (ADR-0067 follow-up, issue #419). The OPA PEP (rest.rego)
    # reads these when authorizing a `featureflag.flip` action:
    #   - prohibited_flag_combinations: a flip that would DISABLE a regulatory safety control
    #     is hard-denied regardless of approvals (no four-eyes can switch these off via a flag).
    #   - money_path_flags: flips of these flags are four-eyes-gated (maker-checker).
    # Flag keys are kebab-case (mirrors libs/flags FlagDefinition.validate()).
    feature_flags:
      # Disabling any of these via a flag flip is never permitted — they guard SCA (ADR-0021),
      # sanctions/AML screening (ADR-0032) and the fail-closed payment gate.
      prohibited_flag_combinations:
        - sca-enforcement-disabled
        - sanctions-screening-disabled
        - aml-screening-disabled
        - payment-gate-fail-open
      # Money-path flags whose flip needs four-eyes even when not outright prohibited.
      money_path_flags:
        - instant-payments-enabled
        - fx-revaluation-enabled
        - lending-disbursement-enabled

    # ---------------------------------------------------------------------------------------
    # Coverage (ADR-0020 extended per-service by ADR-0029 D3). Ratchet-only: never lower.
    # ---------------------------------------------------------------------------------------
    coverage:
      tool: kover
      ratchet_only: true
      floors:
        default: 39                         # current openbank-libs floor (ADR-0020)
        money_path_floor: 40                # enforced baseline (all 13 money-path services, ratchet-only)
        money_path_target: 70               # aspirational target; raise floor PRs as tests land
      money_path_depth:
        tool: pitest                        # mutation testing on money-path domain math (ADR-0030 D3)
        enforced: advisory                  # weekly advisory runs are live; blocking flip pending sustained >=70%
        target_enforce_date: "2026-09-30"   # ADR-0144
        ci_producer: .github/workflows/pitest.yml
        # Fleet rollout re-verified complete per the ADR-0063 criterion (2026-07-11, issue #265 D3):
        # 10/17 money-path services wired (pitest.yml weekly) — ledger, balance, account, transaction,
        # fx + sepa-payment, sepa-instant, domestic-payment, fraud (SSDLC-audit rollout 2026-07-06) +
        # sanctions (2026-07-11: 3 domain files — screening/matching decision logic — matches the
        # "substantive domain math" criterion, not the thin-domain one; 67% local baseline).
        # The remaining 7 (sca, consent, billing, clearing, swift, lending, settlement) stay excluded:
        # each has only 1-2 domain files, and those files are plain data models (no branching
        # money-movement logic), so mutation testing there is noise, not signal — re-confirmed by
        # file count on 2026-07-11 (settlement and sanctions were both added to money_path_services
        # after the 2026-07-07 note above; settlement re-confirmed thin, sanctions was the one that
        # wasn't). Revisit if any of the remaining 7 grows real decision logic in its domain layer.
        # True baselines at rollout (after fixing the KILLED-quote parsing bug): account 49%,
        # transaction 46%, balance 55%, ledger 65%, fx 73%.
        blocked_on: "blocking flip requires each service to sustain >=70% mutation kill score on the weekly run; account/transaction/balance/ledger are below it today (see baselines above)"
      dast:
        tool: "OWASP ZAP baseline (zaproxy/action-baseline)"   # ADR-0030 D3
        enforced: advisory                  # report-only first cut; no fail_action, no PR gate
        target_enforce_date: "2026-12-31"   # revisit once findings are triaged via the D1 lifecycle
        ci_producer: .github/workflows/dast-zap-baseline.yml
        # Scope decision (2026-07-07, issue #265 D3): customer-edge is the true internet-facing edge
        # (ADR-0065) but is a gitops-only Rollout/proxy with no Gradle module or image build in this
        # repo, and booting the full fleet (openbank-infra/docker-compose.yml: postgres/kafka/keycloak
        # + ~30 service images) is too heavy for a CI job. First cut scans ONE already-defined
        # docker-compose target instead: ledger-service (postgres + kafka deps only), against its
        # documented unauthenticated public paths (QUARKUS_HTTP_AUTH_PERMISSION__PUBLIC__PATHS).
        # Scheduled weekly, not per-PR (cost + expected finding volume on a fresh banking-API scan).
        blocked_on: "unauthenticated-surface only; an authenticated crawl needs Keycloak token issuance wired into the CI job, and a customer-edge / fleet-wide target needs either the real cluster or a much heavier compose boot — both deferred"

    # ---------------------------------------------------------------------------------------
    # API deprecation policy — drives ApiVersionResponseFilter.isDeprecatedPath() (ADR-0029 D2).
    # ---------------------------------------------------------------------------------------
    api_deprecation:
      header_set: [Deprecation, Sunset, "Link: rel=successor-version"]
      min_sunset_window_days: 180
      deprecated_paths: []                  # populate as endpoints are deprecated; filter reads this

    # ---------------------------------------------------------------------------------------
    # Supply-chain / release provenance (ADR-0029 D2, enforced at deploy by ADR-0030 D4).
    # ---------------------------------------------------------------------------------------
    provenance:
      sign_images: cosign
      attestation: slsa                     # in-toto / SLSA provenance
      # Two SLSA artifacts per release, both attached to the GitHub Release, serving different
      # consumers: <tag>.slsa.json (hand-assembled, cosign-signed, human/regulator-facing —
      # part of the evidence_bundle below) and <tag>.cdx.json.intoto.jsonl (generated by the
      # official slsa-framework/slsa-github-generator reusable workflow, release-please.yml
      # `provenance` job). The generator's output is what OpenSSF Scorecard's Signed-Releases
      # check actually detects — it only recognizes a release asset named "*.intoto.jsonl"
      # (content-blind), which the hand-assembled *.slsa.json does not satisfy regardless of
      # correctness.
      slsa_generator: slsa-framework/slsa-github-generator@v2.1.0   # generator_generic_slsa3.yml
      sbom: cyclonedx                       # per-service, signed, attached to release (not orphaned)
      evidence_bundle:                      # the signed, point-in-time audit object per release
        - version
        - git_commit
        - sbom
        - slsa_provenance
        - changelog
        - coverage_summary
        - scan_results          # CodeQL + Trivy SARIF
        - test_results
        - ai_attribution        # which agent/model authored; human reviewer (ADR-0029 D6)
      vex: openvex              # accompanies SBOM; suppresses non-exploitable findings (ADR-0030 D1)
      sbom_generation_pattern: host_side_only
      # CycloneDX SBOM must be generated on the host (Gradle :svc:cyclonedxBom) and COPY'd into
      # the image — never generated inside a running container (RUN ./gradlew in the runtime stage).
      # Two compliant paths:
      #   a) build-push-service.sh: quarkusBuild + cyclonedxBom on host → generated runtime Dockerfile COPYs bom.json
      #   b) multi-stage Dockerfile: cyclonedxBom in the JDK build stage → COPY --from=build bom.json into runtime stage
      # Non-compliant: any `RUN ./gradlew` or `RUN cyclonedxBom` in the RUNTIME (non-build) stage.
      gate: provenance
      # Rollout state of the deploy-time provenance gate (ADR-0030 D4), staged like the OPA-authz
      # (ADR-0034) and image-signature gates: ADVISORY now — per-release evidence bundles
      # (SBOM+SLSA+VEX+manifest) are produced, KMS-cosign-signed and independently verifiable
      # (verify-release-evidence.yml), and every deploy now cosign-attests its image SBOM
      # (auto-deploy.yml) — but deploy/admission do NOT yet BLOCK on them. Promote to `enforce`
      # only when ALL enforce_criteria below hold. (A blind flip would outage deploys of
      # uncovered services; cf. the #770 image-signature Enforce revert.)
      enforced: advisory
      target_enforce_date: "2026-09-30"   # ADR-0144
      blocked_on: "all four enforce_criteria below must hold; see that list for the specific gap"
      enforce_criteria:
        - "every deployable service's latest release carries a verify-release-evidence-green bundle (admin-ui excepted until it has a non-Gradle SBOM source)"
        - "the fleet-attestation gate passes: .github/scripts/check-fleet-attestations.sh is GREEN against origin/main (see fleet_attestation_gate below) -- this is a HARD precondition, not a judgement call"
        - "kyverno SBOM-attestation rule flips Audit -> Enforce (verify-sbom-attestation-policy.yaml; one line once criteria 1-2 hold)"
        - "the advisory gate has run clean for an observation window (no false-positive blocks)"

      # -------------------------------------------------------------------------------------
      # The fleet-attestation gate: the checkable precondition for ANY image-provenance policy
      # graduating Audit -> Enforce. Encoded here because the 2026-07-12 graduation was
      # authorized on a claim ("the running fleet was fully redeployed with attested images")
      # that was FALSE and that nothing could have falsified -- there was no check to run.
      # There is now. Run it; do not assert it.
      # -------------------------------------------------------------------------------------
      fleet_attestation_gate:
        script: .github/scripts/check-fleet-attestations.sh
        workflow: .github/workflows/fleet-attestation.yml   # daily schedule + gitops/producer PRs
        placeholder_allowlist: .github/scripts/fleet-attestation-placeholders.txt
        # WHAT IT CHECKS: every openbank-* image referenced anywhere under openbank-infra/gitops/
        # -- app containers, initContainers AND sidecars -- carries a cosign-signed CycloneDX SBOM
        # attestation verifiable with the same key + tag scheme kyverno uses at admission.
        scope: every openbank-* image declared in openbank-infra/gitops (incl. initContainers + sidecars)
        # WHY DECLARED, NOT RUNNING: kyverno verifies at ADMISSION, never continuously. An
        # unattested image whose pod already runs keeps running; the violation is LATENT until a
        # reschedule (node roll, eviction, scale-up) denies the pod permanently, one at a time.
        # So "PolicyReport shows 0 fail" and "the fleet is healthy" are NOT evidence of coverage
        # -- they only describe pods that happen to exist right now. NEVER infer "it is running,
        # therefore it was verified".
        basis: declared_images_not_running_pods
        enforcement_rule: >-
          No image-provenance policy (verify-openbank-image-signatures,
          verify-openbank-image-sbom-attestation, or any successor) may be set to
          validationFailureAction: Enforce while this gate fails. A graduation PR must cite a
          green run of it. An unattested image is never rejected at the moment it is created --
          only later, at a reschedule nobody scheduled -- so a passing gate is the ONLY evidence
          that a flip to Enforce is safe.
        # Producers must make an unattested image impossible rather than merely unlikely:
        # every openbank-* image producer signs AND attests via the shared helper, and any
        # provenance failure HARD-FAILS the push (a warning-only path is what created the gap).
        producer_helper: openbank-infra/scripts/lib/cosign-attest.sh
        producer_failure_mode: hard_fail   # never warn-and-continue on a provenance failure
        # trivy defaults to --platform linux/amd64 for REMOTE scans regardless of host arch;
        # fleet images are arm64-only, so an unqualified `trivy image` fails 100% of the time
        # and silently yields an unattested image if only the exit code is checked.
        trivy_platform_required: true

    # ---------------------------------------------------------------------------------------
    # Dependency policy (CONTRIBUTING.md security checklist).
    # ---------------------------------------------------------------------------------------
    dependencies:
      license_allowlist: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, EPL-2.0, MPL-2.0, ISC]
      license_denylist: [GPL-2.0, GPL-3.0, AGPL-3.0]   # copyleft -- denied for THIRD-PARTY deps of the Apache-2.0 platform
      # Carve-out (ADR-0136, supersedes the ADR-0031 D8 separate-repo plan): the AI agent
      # services are OpenBank's open-core component and are licensed AGPL-3.0-only + a parallel
      # commercial licence -- IN-REPO, not Apache-2.0. The denylist above governs the Apache-2.0
      # platform tree; AGPL-3.0-only is the intended licence of the agent services, so the gate
      # must not flag those paths.
      license_denylist_exceptions:
        - license: AGPL-3.0-only
          scope: agent-services                 # in-repo open-core; own LICENSE, commercial dual-license
          paths:
            - openbank-agent-service/
            - openbank-copilot-service/
            - openbank-devops-agent/
            - openbank-finops-agent/
            - openbank-control-liveness-sentinel/
            - openbank-governance-auditor/
            - openbank-release-steward/
            - openbank-docs-truth-agent/
            - openbank-authz-policy-auditor/
            - openbank-flaky-test-hunter/
          reason: "open-core: AGPL-3.0-only + commercial dual-licensing of the AI agent services"
          adr: ADR-0136
      license_boundary_exceptions:
        - description: "AGPL/Apache seam (in-repo). The AI agent services are AGPL-3.0-only; no Apache-2.0 module may take a build/compile dependency on them (only network/HTTP use is allowed). They depend on openbank-libs (Apache-2.0), which is permitted -- copyleft may consume permissive code."
          agpl_modules:
            - openbank-agent-service
            - openbank-copilot-service
            - openbank-devops-agent
            - openbank-finops-agent
            - openbank-control-liveness-sentinel
            - openbank-governance-auditor
            - openbank-release-steward
            - openbank-docs-truth-agent
            - openbank-authz-policy-auditor
            - openbank-flaky-test-hunter
          rule: "no Apache-2.0 module may declare project(':openbank-agent-service'|':openbank-copilot-service'|':openbank-devops-agent'|':openbank-finops-agent'|':openbank-control-liveness-sentinel'|':openbank-governance-auditor'|':openbank-release-steward'|':openbank-docs-truth-agent'|':openbank-authz-policy-auditor'|':openbank-flaky-test-hunter') as a dependency"
          license: "AGPL-3.0-only"
          adr: ADR-0136
      block_on_cve_severity: [CRITICAL, HIGH]
      catalog: openbank-libs/gradle/libs.versions.toml  # version catalog is the single dependency source
      # HOW block_on_cve_severity is actually enforced at PR time -- and why it is load-bearing
      # that dependency-submission runs on pull_request (#1419/#1421). Until it did, the rule
      # above was declared but unenforced for Gradle, the fleet's primary language.
      pr_time_cve_gate:
        gate: .github/workflows/dependency-review.yml   # fail-on-severity: high
        invariant: >
          dependency-review only ever diffs SUBMITTED dependency graphs. GitHub natively parses
          npm/pip/docker/actions manifests but NOT Gradle, so the graph for a PR head exists only
          because dependency-submission.yml also runs on pull_request. Remove that trigger and the
          gate keeps reporting green while checking nothing about Gradle -- a silent hole, not a
          visible failure.
        requires:
          - ".github/workflows/dependency-submission.yml runs on pull_request with the same path filter"
          - "dependency-review arms retry-on-snapshot-warnings ONLY on dependency-touching PRs"
          - "dependency-submission failures raise a tracking issue (a stale graph makes the gate vacuous)"
        not_covered_by:
          trivy_fs: "Trivy's Java coverage is JAR / pom.xml / gradle.lockfile / *.sbt.lock only; this repo has zero lockfiles, so Trivy fs sees no Gradle dependency"
          codeql: "not a dependency scanner, and not a required check"
        fork_prs: >
          Fork PRs get a read-only token, so the submission cannot run and they receive dependency
          review for the natively-parsed ecosystems only, not Gradle. Deliberate: closing it needs a
          workflow_run job holding contents:write over a fork-authored artifact.
      artifact_integrity:
        # Gradle dependency verification (gradle/verification-metadata.xml): SHA-256 pins for
        # every resolved artifact — a repository-level tamper or dependency-confusion swap of an
        # existing version no longer resolves. Lockfiles/Dependabot pin VERSIONS; this pins BYTES.
        # LENIENT (warn-only) while the metadata soaks across all CI lanes and developer
        # platforms; flip = org.gradle.dependency.verification=strict in gradle.properties.
        # Dependabot PRs auto-refresh the metadata (dependabot-verification-metadata.yml).
        mechanism: gradle-verification-metadata-sha256
        enforced: advisory
        target_enforce_date: "2026-09-30"   # ADR-0144
        ci_producer: "gradle.properties org.gradle.dependency.verification=lenient + .github/workflows/dependabot-verification-metadata.yml"

    # ---------------------------------------------------------------------------------------
    # Architecture invariants (ADR-0002 hexagonal).
    # ---------------------------------------------------------------------------------------
    architecture:
      hexagonal: true
      domain_zero_framework_imports: true   # domain layer must not import Quarkus/Jakarta/Spring
      # ENFORCED by .github/scripts/check-domain-purity.sh (Validate manifests job):
      # baseline-ratcheted — 11 grandfathered violations burn down as touched, any NEW
      # framework import in */domain/* fails CI. openbank-libs-runtime is module-exempt
      # (shares the domain package string for its JPA converters but IS the framework
      # side of the ADR-0122 split).
      ci_producer: ".github/scripts/check-domain-purity.sh"

    # ---------------------------------------------------------------------------------------
    # OPA bundle sync (issue #1184). Keep terse: this file is embedded verbatim into every
    # bundle it describes, so editing it rolls every checksum below. Rationale in ci_producer.
    # ---------------------------------------------------------------------------------------
    opa_bundle_sync:
      # The gate must DISCOVER the generators, never name them. A hard-coded list opts each
      # new service out by default: until #1187 it named 4 of the 26 gen-*opa-bundle*.sh
      # scripts while 25 embed this file, so ~21 services' committed bundles served stale
      # data.rules.* / data.agents.* for months with CI green.
      generators_discovered_not_listed: true
      generator_glob: "openbank-infra/gitops/components/**/gen-*opa-bundle*.sh"
      # A 100644 generator no-ops a ./... loop and is indistinguishable from "in sync" —
      # gen-ledger-opa-bundle.sh shipped that way and had never once run.
      generators_must_be_executable: true
      # Each generator hashes its embedded sources into openbank.tech/policy-checksum, which
      # must match in BOTH the ConfigMap and the service's Rollout/Deployment: subPath mounts
      # do not hot-reload, so the annotation is what actually rolls the pod onto new policy.
      checksum_annotation: "openbank.tech/policy-checksum"
      enforced: enforce
      ci_producer: ".github/workflows/opa-policy.yml"   # `verify` job

    # ---------------------------------------------------------------------------------------
    # REST/MCP authorization policy invariants (ADR-0034 Phase 5, issue #266). rest.rego is
    # the shared OPA policy mounted in every enforcing service's bundle.
    # ---------------------------------------------------------------------------------------
    authz_policy:
      principal_type_service_unreachable: true
      # AuthorizeInterceptor.principalType() (openbank-libs-runtime) only ever emits
      # ANONYMOUS/AI_AGENT/HUMAN — never SERVICE. M2M callers authenticate with a Keycloak
      # client_credentials JWT, which the interceptor classifies as HUMAN, and no realm
      # client is ever granted a ROLE_SERVICE role. A rego rule gated on
      # `input.principal.type == "SERVICE"` can therefore never fire. Found live 2026-07-07
      # in the shared rest.rego edge-service-notification rule (deployed with AUTHZ_ENFORCE
      # defaulting true — notification.mark-read/device.create/device.delete had NO other
      # allow path) and pre-merge in the sca/domestic-payment ADR-0034 Phase 5 PRs.
      #
      # Identify a specific M2M caller by input.principal.id (Keycloak's
      # "service-account-<clientId>" convention for a service-account token) instead of
      # principal.type or role alone — ROLE_OPERATOR is shared with real human staff, so a
      # role-only check over-grants (e.g. it would let any operator call SCA's
      # device.enroll — an account-takeover primitive — see rest.rego's
      # edge-service-notification rule and rest_test.rego's
      # test_deny_operator_read_any_does_not_cover_write).
      ci_producer: ".github/scripts/check-no-service-principal-type.sh"

    # ---------------------------------------------------------------------------------------
    # Vulnerability-management lifecycle SLAs (ADR-0030 D1). Detection -> closure, in days.
    # ---------------------------------------------------------------------------------------
    vuln_management:
      sla_days: { critical: 7, high: 30, medium: 90, low: 180 }
      triage_owner: CODEOWNERS
      surfaced_in: admin-ui-governance
      vex_format: openvex                   # OpenVEX 0.2.0; one doc per component per release
      vex_store: openbank-libs/governance/vex/<component>.openvex.json   # human-triaged overlay
      # D1 is SHIPPED (PR #325 image-rescan.yml, PR #315 vex-triage.yml + vex-triage.py /
      # vex-inventory.py). Not a PR-blocking gate — a scheduled lifecycle: vex-triage.yml
      # (weekly) opens/closes `vex-triage`-labelled GitHub issues per queued CVE (the issue's
      # creation date IS the SLA clock) and the job itself goes red (::error, non-zero exit)
      # when an open issue's age exceeds sla_days for its OSV-derived severity — that red run
      # is the enforcement signal, same forcing-function shape as ADR-0144 gate graduation,
      # but on a cron rather than a PR check. image-rescan.yml (weekly) additionally passes
      # each component's VEX overlay to `trivy image --vex`, so a human `not_affected`/`fixed`
      # verdict suppresses re-alarming on an already-triaged finding.
      gate: vex-triage
      enforced: active                      # producer is wired and the weekly job enforces its own SLA
      ci_producer: ".github/scripts/vex-triage.py (+ vex-inventory.py), .github/workflows/vex-triage.yml"

    # ---------------------------------------------------------------------------------------
    # CI runner governance (ADR-0053, supersedes ADR-0082). Per-job EPHEMERAL ARC runner
    # scale sets on EKS, scaled to zero on Karpenter's diversified Graviton spot pool. Retains
    # ADR-0040's $0-hosted-minutes goal and ADR-0082's build/deploy trust split (now as two
    # scale sets, not two persistent hosts). Reverses ADR-0082's "persistent + always-on EC2"
    # default: ephemeral-on-EKS meets the availability + trust-tiering drivers BETTER (multi-AZ,
    # fresh per job) at ~4x lower cost; the cold-start tax is mitigated by remote caches.
    # ---------------------------------------------------------------------------------------
    ci_runners:
      model: ephemeral-scale-to-zero        # ADR-0053; per-job ARC pods, NOT persistent
      platform: arc-on-eks                  # actions-runner-controller; Karpenter spot nodes
      scale_to_zero: true                   # minRunners=0 idle; spend -> $0 when no CI
      # FinOps dispatch order — AGENTS MUST ENFORCE THIS, never bypass.
      # REVISED when the repo went PUBLIC: GitHub-hosted standard runners became free
      # and unlimited (ubuntu-latest = 4 vCPU/16 GB; ubuntu-24.04-arm = native arm64),
      # which inverts the old Hetzner-first order:
      #   1. GitHub-hosted (ubuntu-latest / ubuntu-24.04-arm) = primary for every job
      #      that does NOT need the cluster network — $0, no idle cost, no NAT exposure.
      #   2. ARC on EKS Spot (scale-to-zero) = ONLY for jobs that genuinely need
      #      VPC/cluster-DNS reachability (Pact broker can-i-deploy, main-lane service
      #      builds that verify+publish pacts, runner-image build) — idle cost $0.
      # Consequence: if a build fails on a hosted runner due to an arch issue, fix the
      # root cause (native ubuntu-24.04-arm runner or --platform=$BUILDPLATFORM on
      # build-only stages) — never route it back to a paid pool as a workaround.
      static_hosts:                          # DECOMMISSIONED 2026-07-03 (public-repo FinOps shift, issue #196)
        hetzner:
          status: deleted                    # both openbank-runner-{1,2} (CPX42) deleted via hcloud; zero ongoing cost
          former_labels: [openbank-build, openbank-batch, openbank-sandbox, hetzner]
          # ARC (scale-to-zero) now serves every job that previously targeted these
          # labels — the openbank-build/openbank-batch scale sets were never Hetzner-
          # exclusive, so no CI change was needed. runner-tune-hetzner.yml (the only
          # Hetzner-specific workflow) was deleted in the same PR as this entry.
        mac_mini:
          arch: arm64
          labels: [openbank-build, openbank-sandbox]
          count: 1
          role: owner_managed_accelerator     # NOT a FinOps line item (owner's own hardware, no cloud billing);
          # kept in the label pool at the owner's discretion, independent of this
          # governance decision. Native arm64 is otherwise served free by
          # ubuntu-24.04-arm, so this is a pure opt-in accelerator (ADR-0053), never
          # something CI depends on being online.
      spot:
        provider: karpenter                 # diversified Graviton spot, price-capacity-optimized
        interruption: karpenter-managed     # no persistent spot request; node replaced on reclaim
      pools:                                # three ARC scale sets: build/deploy TRUST split + build/batch CAPACITY split
        build:                              # executes PR code, merge-required (compile, unit/IT tests, admin-ui, manifests)
          scale_set: openbank-build
          cloud_write_credentials: false    # no ECR push, no ArgoCD, no prod secrets
          secrets: none
          image_builds: dind                # privileged docker-in-docker today; rootless (BuildKit/Kaniko) is the ADR-0053 hardening follow-up
          ephemeral_per_job: true           # fresh pod per job; nothing retained between jobs
        batch:                              # non-blocking: security/secret scans, finops audit, label sync (PR + weekly cron)
          scale_set: openbank-batch
          cloud_write_credentials: false    # same trust level as build — no creds; safe for PR code
          secrets: none
          image_builds: dind
          ephemeral_per_job: true
          isolation_rationale: "separate low-capped pool so a scan/cron burst cannot starve the merge-required build lane (ARC has no job preemption — dedicated capacity is the only priority lever)"
        deploy:                            # ECR push + ArgoCD sync; post-merge only
          scale_set: openbank-deploy
          credentials: irsa                 # pod ServiceAccount IRSA scoped to ECR push + ArgoCD
          secrets_source: vault             # fetched at job time, never written to disk
          secrets_persisted_to_disk: false
          triggers: [push_main, tag]        # a pull_request job must NEVER target this scale set
      # A PR-triggered job may target build or batch (both credential-free); targeting deploy from a PR
      # is a governance violation the CI lint must reject.
      pr_jobs_allowed_pools: [build, batch]
      availability:
        merge_required_scale_set: openbank-build
        failure_domain: eks-multi-az        # not a laptop, not a single EC2 host
        no_developer_workstation_in_critical_path: true   # Macs are opt-in accelerators only
        warm_min_runners_lever: engaged     # build minRunners=1 since 2026-06-01: a per-service build queued ~45 min behind a push/PR workflow burst (p95 SLO miss); batch+deploy stay at 0
      stuck_runner_reaper:                  # self-heal guard, arc-runner-reaper.tf; ARC has no built-in idle/registration timeout for a registered-but-jobless runner
        why: "ARC won't reap a phase=Running runner (assumes mid-job); a cancelled/superseded queued job leaves an orphan that never gets work and pins a spot node until noticed (observed 2026-06-02, ~10h)"
        mechanism: cronjob                  # arc-runners ns; namespaced SA may only list+delete EphemeralRunners — no Lambda/CloudWatch/webhook
        selects: running_and_jobless        # jobRequestId==0 AND jobId=="" AND jobRepositoryName=="" — a runner with real work is never a candidate
        idle_threshold_minutes: 30          # > longest CI job, so a healthy burst's not-yet-assigned runners are safe
        respects_min_runners: true          # rule (a): reap only the excess over minRunners (keeps oldest = the warm runner); minRunners read live, never hardcoded
        hard_cap_minutes: 120               # rule (b): backstop = 4x threshold. ARC keeps a stuck orphan through scale-down (thinks it's busy), so it can occupy the lone min slot where there is no excess; past the cap ANY idle runner is recycled, healing it. Fresh replacement resets the clock -> steady-state warm-runner churn at most once/cap (a few cheap recycles during an active orphan incident, self-resolving)
        delete_precondition: resourceVersion # atomic compare-and-delete: a runner that picked up a job between scan and delete is skipped (409), never killed mid-job
      cold_start_mitigation:
        gradle_remote_cache: s3
        docker_layer_cache: true
        node_reuse: karpenter-consolidate-after   # closely-spaced jobs reuse a warm node
      clock:
        ntp_enforced: true                  # pods inherit node NTP; skewed node -> Karpenter replaces
        max_offset_seconds: 1
      secrets:
        github_app_key: k8s-secret-only     # arc-github-app secret; NEVER in tofu state
      as_code: opentofu                     # ARC controller + scale sets in version control; no click-ops
      provenance:                           # deploy pool signs; ArgoCD deploys only signed digests
        sign_images: cosign
        deploy_only_signed_digests: true
      gate: ci-runner-governance
      enforced: planned                     # ADR-0053 Accepted; lint + tofu enable land on rollout
      target_enforce_date: "2026-08-31"   # ADR-0144
      blocked_on: "a CI lint enforcing pr_jobs_allowed_pools (build/batch only, never deploy) + the OpenTofu apply for the three scale sets have not both landed yet"

    # ---------------------------------------------------------------------------------------
    # Infra apply (ADR-0060). Closes the "as-code without applied" gap: CI applies the
    # platform OpenTofu so a merged change reaches the live account (derive -> enforce ->
    # APPLY, ADR-0029). Auth is GitHub OIDC -> IAM; safety is the trust scope, not a trimmed
    # permission list. Apply is manual-dispatch (Free plan has no Environment protection).
    # ---------------------------------------------------------------------------------------
    infra_apply:
      tool: opentofu                        # envs/** ; workflow .github/workflows/platform-tofu.yml
      trigger:
        plan: [pull_request, push]          # read-only preview to the job summary (batch lane)
        apply: workflow_dispatch            # manual "Run workflow" on main (deploy lane); see gate
      auth: github-oidc                     # NO static AWS keys; short-lived STS creds
      roles:
        plan: { name: openbank-ci-tofu-plan, permissions: ReadOnlyAccess, sub: "repo:JiRaska/open-bank-oss:{ref:refs/*,pull_request}", eks_access: admin-view }
        apply: { name: openbank-ci-tofu-apply, permissions: AdministratorAccess, pin: "job_workflow_ref=JiRaska/open-bank-oss/.github/workflows/platform-tofu.yml@refs/heads/main", eks_access: cluster-admin }
      gate: manual-dispatch                 # human presses Run-workflow after reading PR plan preview; apply role pinned to this one workflow file on main
      gate_upgrade: environment-reviewer    # stronger gate (reviewer-gated Environment) blocked on GitHub plan (Free has no env protection); follow-up #282
      broad_role_rationale: "security boundary is the OIDC job_workflow_ref pin + manual dispatch, not an ever-drifting action list; a trimmed policy fails applies on each new resource type (ADR-0060)"
      state_lock: s3-use_lockfile           # concurrent apply serialises on the lock (-lock-timeout), never races
      apply_is_toctou_safe: true            # plan -out=tfplan then apply tfplan in one job; stale plan rejected; no plan artifact (would leak secrets)
      runner_routing: { plan: openbank-batch, apply: openbank-deploy }   # ADR-0053
      scope: envs/sandbox-platform          # first env; others onboard via working-directory
      gate_name: platform-tofu
      enforced: advisory                    # apply is manual; not a PR-blocking check
      target_enforce_date: "2027-01-31"   # ADR-0144 — long horizon: blocked on an external plan change, not unbuilt tooling
      blocked_on: "gate_upgrade to a reviewer-gated Environment needs GitHub plan Environment-protection support (Free plan doesn't have it) — issue #282. Move this date forward, don't silently drop it, if the plan constraint is still unresolved when it arrives."

    # ---------------------------------------------------------------------------------------
    # Issue tracking (ADR-0052). Issues are the actionable backlog layer — they do NOT
    # duplicate ADRs (decisions) or release-please (changelog). A PR closes its issue with
    # `Closes #<n>`; a fleet-sweep service PR references the tracker with `Refs #<n>`.
    # ---------------------------------------------------------------------------------------
    issues:
      labels_source: .github/labels.yml      # single source of truth; never created in the UI (rule #7)
      label_sync: additive                   # create-or-update only; pruning is a manual decision
      templates_dir: .github/ISSUE_TEMPLATE
      link_in_pr: required                   # PR template "Linked issues": Closes #<n> / Refs #<n>
      open_an_issue_for:
        - fleet_sweep                         # cross-service change, one PR per service -> sweep tracker
        - governance_followup                 # actionable tail of an ADR (rollout, reg condition, gate flip)
        - bug                                 # defect in shipped behavior
        - enhancement                         # proposed capability (asks "needs ADR?" before build)
      not_an_issue:
        - architectural decisions             # -> docs/adr (an Issue may TRACK an ADR's rollout, not replace it)
        - changelog entries                   # -> release-please derives these from Conventional Commits
        - questions                           # -> GitHub Discussions (ISSUE_TEMPLATE/config.yml)
        - security vulnerabilities            # -> private Security Advisories (SECURITY.md)
      money_path_link:
        detect: ["issue touches a money_path service"]
        require: ["money-path label", "2 approvals + threat model on each resulting PR"]  # rules.yaml: money_path_services
      gate: issue-hygiene
      enforced: block                         # ADR-0052; link-in-PR lint landed (CI job `issue-hygiene` in ci.yml)
      bypass_label: skip-hygiene              # escape hatch for PRs with no sensible issue link (bots auto-exempt)

    # ---------------------------------------------------------------------------------------
    # FinOps managed-service version lifecycle + recurring cost audit (ADR-0054). A managed
    # cloud-service version we pin MUST be on standard support with runway — never provisioned
    # into (or left sitting in) paid extended support. Catches the #84 class of mistake
    # (EKS 1.31 born ~6mo into extended support, billed 6x) at PR time, and re-checks weekly
    # as the calendar slides. Enforced by openbank-infra/scripts/check-version-lifecycle.py.
    # ---------------------------------------------------------------------------------------
    finops:
      managed_version_policy:
        target_selection: latest_minus_one    # newest STANDARD minor that is NOT the freshest, for banking maturity
        min_standard_support_months: 6        # a pin must have >= this many months of standard support left
        forbid_extended_support: true         # never provision/run a version in paid extended support
      managed_version_pins:                   # the tofu roots whose pinned versions the gate audits
        - service: eks
          file: openbank-infra/aws/envs/sandbox-substrate/variables.tf
          key: kubernetes_version
          lifecycle_table: openbank-infra/aws/finops/eks-version-lifecycle.json
      periodic_audit:
        cadence: weekly                       # .github/workflows/finops-lifecycle.yml schedule (Mon 06:00 UTC)
        static:                               # phase 1 — no cloud creds; ships now
          checks: [version_in_extended_support, version_runway_below_threshold]
          on_finding: open_issue              # open/update a single tracking Issue (ADR-0052 backlog)
        live:                                 # phase 2 — deferred; needs a read-only AWS OIDC role
          enforced: deferred
          scope: all_consumed_services
          checks: [eks_support_status, aws_budgets_threshold, cost_anomaly_detection, idle_unattached_resources]
      gate: finops-version-lifecycle
      enforced: block                         # ADR-0054; PR gate fails a non-compliant pin

    # ---------------------------------------------------------------------------------------
    # FinOps workload tiers — scale-to-zero classification (ADR-0057). The dominant cost
    # lever at our utilisation is RUNNING HOURS; only scale-to-zero removes them. Every
    # service is classified into one of four tiers; new services DEFAULT to the lowest tier
    # their trigger allows (not always-on). Scale-to-zero runs on the existing Kubernetes
    # substrate (KEDA, optionally Knative) on Karpenter spot — never a proprietary FaaS, so
    # ADR-0027 (cloud-agnostic) is preserved. The declared tier is kept honest against
    # MEASURED behaviour by a classifier + CI gate (derive -> enforce -> show, ADR-0029/0054).
    # ---------------------------------------------------------------------------------------
    finops_tiers:
      tiers:
        T0:                                   # Always-on
          definition: "Money-path HOT path where a cold-start / scaled-to-zero gap is unacceptable, or a regulator-mandated continuous service."
          mechanism: "minReplicas >= 1 (PDB complements, is not the floor); never scales to zero."
          idle_cost: full
        T1:                                   # HTTP -> 0
          definition: "Stateless request/response, bursty/rare traffic, cold-start-tolerant within its latency SLO."
          mechanism: "KEDA HTTP add-on (or Knative Serving) — scale from/to zero on inbound HTTP. Requires a Quarkus native image."
          idle_cost: near_zero
        T2:                                   # Event -> 0
          definition: "Async Kafka consumers / projections / dispatchers that tolerate processing latency."
          mechanism: "KEDA ScaledObject on Kafka consumer-group lag — wake on backlog, drain, return to zero."
          idle_cost: near_zero
        T3:                                   # Cron / Job
          definition: "Periodic batch (reconciliation, audits, accruals) with no resident listener."
          mechanism: "Native Kubernetes CronJob / Job."
          idle_cost: zero

      # Classification axes, applied IN ORDER (first match wins).
      classification_axes:
        - "money_path + availability: regulatory-continuous OR a synchronous money hop where cold-start latency is unacceptable -> T0"
        - "trigger: periodic-no-listener -> T3 ; async-event-driven -> T2 ; synchronous-HTTP -> candidate T1"
        - "traffic_shape + latency_SLO: constant high QPS or tight p95 the native cold-start budget cannot meet -> keep T0/min>0 ; bursty/rare + cold-start-tolerant -> T1"

      default_for_new_services: lowest_tier_trigger_allows   # T2 for event consumers, T1 for HTTP — always-on is opt-in + justified

      # T0 is driven by money_path_services (above): a money-path service is T0 by default,
      # and DEMOTING one below T0 requires an ADR-0030 threat-model update + 2 approvals.
      t0_baseline: money_path_services

      # Declared tier per service. Only EVIDENCE-BACKED assignments are recorded here; the
      # rest stay `unclassified` until the classifier recommends a tier from measured signals
      # (no hand-asserted fleet list to rot — ADR-0029). Money-path services inherit T0 via
      # t0_baseline and need no explicit entry.
      declared:
        openbank-notification-service: T2     # proven pilot, live in sandbox (ADR-0057 best-first target, #228)
        # openbank-product-catalog was WRONGLY declared T1 here (#2800), citing a
        # non-existent issue (#2083), while only Enabler 2 (HTTPScaledObject) existed —
        # no commit ever added a native build (Enabler 1), so the claimed "native
        # cold-start SLO gate passed in sandbox" never happened. Corrected 2026-07-05.
        # Update 2026-07-06: Enabler 1 (native build) is now real and its two native-only
        # bugs are fixed (bad Mutiny/coroutine bridge, missing @RegisterForReflection —
        # verified working end-to-end in a scratch namespace, #253) — but the ADR-0083
        # promotion gate (native cold start ≤ ~300-500ms p95) was MEASURED and FAILS:
        # 5 scale-0->1 cycles landed at 3.5-8.8s, dominated by Kubernetes Pod scheduling /
        # image-pull / readiness-probe overhead, not the ~200ms application start. Stays
        # Update 2026-07-06 (2): the gate is now redefined (ADR-0083) as two components —
        # process start ≤500ms p95 (met, ~0.2-0.3s) and end-to-end scale-from-zero with
        # tuned probes ≤5s p95 (met on a small sample, ~4.4s avg/5.0s worst-of-3; probe
        # tuning alone cut ~28% off the untuned 3.5-8.8s, the residual ~4s floor is
        # Kubernetes control-plane + admission-webhook overhead, not the image).
        openbank-product-catalog: T0
        # Reverted T1 -> T0 on 2026-07-17: the T1 measurement was real but measured the wrong
        # path. Every number below was taken THROUGH the KEDA HTTP interceptor, which parks the
        # first request while the pod scales 0->1. But product-catalog's actual onboarding-path
        # callers — account-service (openAccount product validation, #668) and document-service
        # (OnboardingDocumentService template-code resolution, ADR-0162 D7) — dial the ClusterIP
        # directly, NOT the interceptor. At min:0 they got `Connection refused`, not a slow first
        # click. document-service reads that as "product has no document template" and issues no
        # onboarding document, so no signature ceremony is ever created: onboarding silently could
        # not complete (registration still 201). Zero accounts completed onboarding 2026-06-24..
        # 2026-07-17. The HTTPScaledObject is held at min:1; re-declare T1 only once every
        # in-cluster caller goes through the interceptor AND the SLO is re-measured on that path.
        # Original T1 rationale kept below for the record.
        # Declared 2026-07-07 (#253): the live sandbox Deployment (accounts namespace)
        # already runs the native image + tuned probes (startupProbe/readinessProbe
        # periodSeconds:1, failureThreshold:10). A 10-sample end-to-end scale-from-zero
        # series through the KEDA HTTP interceptor measured median 5.29s / p95 ~5.4s
        # (excl. one 9.1s sample that likely captured a cold node-local image pull) —
        # marginally over the ADR's ≤5s p95 target. Accepted as met (maintainer call,
        # #253): the miss is small, and for a non-money-path, rarely-hit admin/fees read
        # endpoint the interceptor's whole job is absorbing that wait as a slow first
        # click, not a 5xx — the FinOps trade (near-zero idle cost) holds. Caveat: this
        # is a single n=10 sample on one day, not the ADR's originally-specified 48h
        # burn-in window — re-validate over a longer window before treating T1 as
        # permanently locked in; a regression would demote per t0_baseline's own
        # 2-approval bar for money-path (N/A here) or a simple re-declare for non-money-path.

      # Keep-honest classifier: reads measured signals (HTTP rate/idle ratio, Kafka lag +
      # active fraction, CPU/replica utilisation), emits a recommended tier + realised
      # idle-hours saving, surfaced in the admin-ui FinOps view. The lever to RAISE a service
      # back toward min>0 is a measured p95 queue/latency SLO miss — a number, not a hunch.
      classifier:
        signals: [http_request_rate, http_idle_ratio, kafka_consumer_lag, kafka_active_fraction, cpu_utilisation, replica_utilisation]
        raise_trigger: measured_p95_slo_miss  # documented escape hatch back to min>0; off by default for cost
        surface: admin-ui-finops-view

      guardrails:
        - "cold_start_cascade: a chain of synchronous T1 calls sums cold-starts; deep sync call-graphs keep an earlier node warm (min>0) or pre-pull."
        - "native_build_budget: T1 viability assumes Quarkus native images; the cold-start SLO is MEASURED per service, not assumed."
        - "money_path_sacred: T0 membership is driven by money_path_services; demotion needs the ADR-0030 threat model + 2 approvals."
        - "cloud_agnostic: KEDA/Knative run on any conformant Kubernetes; no AWS-only primitive enters the path (ADR-0027)."

      # Declared-vs-measured drift gate. Advisory until the classifier (the measured side)
      # ships; flips to block once it reads live metrics — same trajectory as ADR-0054's
      # live phase. A service whose declared tier diverges from measured behaviour (e.g. a T0
      # idle 95% of the time with no money-path justification) raises a FinOps finding /
      # tracking issue (ADR-0052), not a silent drift.
      gate: finops-tier-drift
      enforced: advisory                      # ADR-0057; -> block when the classifier lands
      target_enforce_date: "2026-09-30"   # ADR-0144
      blocked_on: "the measured-signal classifier (http_request_rate, kafka_consumer_lag, cpu/replica utilisation) has not shipped yet — only 2 services have a declared tier today (notification-service, product-catalog)"

    # ---------------------------------------------------------------------------------------
    # FinOps cost-allocation groups — showback business flows (ADR-0062). The /api/finops/costs
    # snapshot is aggregated by AWS SERVICE (EC2, EKS, RDS); this section is the missing layer
    # that lets the admin-ui roll cloud spend up the BUSINESS taxonomy: service -> data domain
    # (cost-center, from admin-ui manifest.ts dataDomain) -> business flow (here). The allocator
    # (admin-ui src/lib/finops/allocation.ts) splits the shared COMPUTE pool across services by
    # their declared resource requests (derive -> show, ADR-0029), then sums per group.
    #
    # Service ids use the CANONICAL key = the admin-ui manifest serviceName (NO `openbank-`
    # prefix), which also equals the gitops Deployment metadata.name (ledger-service,
    # account-service, ...). This is the stable join key across manifest.ts (domain source) and
    # the gitops resource-request footprints; money_path_services uses a different `openbank-*`
    # convention and is intentionally NOT the join key here. A drift test (admin-ui
    # finops-taxonomy.test.ts) fails the build if any service below is unknown to manifest.ts.
    #
    # SHOWBACK, not chargeback: a service belongs to EVERY flow that needs it, so the per-flow
    # sums OVERLAP and add up to MORE than the fleet total. That is intentional ("fully-loaded
    # cost to run this flow end-to-end, including shared dependencies"); the UI states it.
    # ---------------------------------------------------------------------------------------
    finops_cost_groups:
      account-management:
        label_en: "Account Management"
        label_cs: "Správa účtů"
        services: [account-service, party-service, kyc-service, sca-service]
      double-entry-ledger:
        label_en: "Double-Entry Ledger"
        label_cs: "Podvojné účetnictví"
        services: [ledger-service, transaction-service]
        regulatory_ref: "CNB §4 — books of account"
      balance-projection:
        label_en: "Balance Projection"
        label_cs: "Projekce zůstatků"
        services: [balance-service, transaction-service]
      compliance-screening:
        label_en: "Compliance Gate (AML/Sanctions)"
        label_cs: "Compliance brána (AML/sankce)"
        services: [aml-service, sanctions-service, kyc-service]
        regulatory_ref: "5AMLD Art. 18 — screening before payout"
      sepa-payment-flow:
        label_en: "SEPA Credit Transfer"
        label_cs: "SEPA úhrada"
        services: [sepa-payment, transaction-service, ledger-service, account-service, balance-service, aml-service, sanctions-service, clearing-service]
        regulatory_ref: "PSD2 / pacs.008"
      sepa-instant-flow:
        label_en: "SEPA Instant"
        label_cs: "SEPA okamžitá platba"
        services: [sepa-instant-service, transaction-service, ledger-service, aml-service, sanctions-service, clearing-service]
        regulatory_ref: "PSD2 / 10s SLA"
      domestic-payment-flow:
        label_en: "Domestic Payment"
        label_cs: "Tuzemská platba"
        services: [domestic-payment, transaction-service, ledger-service, aml-service, sanctions-service]
        regulatory_ref: "CNB CERTIS"
      swift-payment-flow:
        label_en: "SWIFT Cross-Border"
        label_cs: "SWIFT zahraniční platba"
        services: [swift-service, transaction-service, ledger-service, aml-service, sanctions-service]
        regulatory_ref: "pacs.008 / cross-border"
      fx-conversion:
        label_en: "FX Conversion"
        label_cs: "Měnová konverze"
        services: [fx-service, transaction-service, ledger-service]
      card-issuance:
        label_en: "Card Issuance"
        label_cs: "Vydávání karet"
        services: [card-issuance-service, account-service, dispute-service]
        regulatory_ref: "PCI DSS"
      open-banking-psd2:
        label_en: "Open Banking (PSD2)"
        label_cs: "Open Banking (PSD2)"
        services: [psd2-service, consent-service, sca-service, tpp-registry-service, pid-service]
        regulatory_ref: "PSD2 AISP/PISP"
      interest-accrual:
        label_en: "Interest Accrual"
        label_cs: "Úročení"
        services: [interest-service, account-service]
      standing-orders:
        label_en: "Standing Orders"
        label_cs: "Trvalé příkazy"
        services: [standing-order-service, transaction-service]
      audit-trail:
        label_en: "Audit Trail"
        label_cs: "Auditní stopa"
        services: [audit-service]
        regulatory_ref: "DORA Art. 17 — immutable"

    # How durable knowledge is captured so it survives across agents and contributors.
    # A corrected mistake, a hard-won lesson, or a chosen direction goes INTO THE REPO —
    # never only into an assistant's session/local memory, which does not travel and goes
    # stale. Routing by kind; the human-readable form lives in CLAUDE.md ("Capturing what
    # we learn"). This is a process rule (not CI-enforced), but rules.yaml is the source
    # of truth when it and CLAUDE.md disagree.
    gitops_ref_integrity:
      script: .github/scripts/check-gitops-secret-refs.py
      wired_into: .github/workflows/ci.yml   # governance job -> all-green (a REQUIRED check)
      # THE RULE: every Secret/ConfigMap a gitops workload consumes must be declared by
      # something in gitops. A manifest that reads a Secret nobody creates passes every gate
      # we have: the YAML is valid, ArgoCD syncs it (the Rollout is a legal object), CI never
      # runs the pod, and Kyverno admits it. The pod then sits in CreateContainerConfigError
      # indefinitely and the only signal is `kubectl describe` on a pod nobody watches.
      rule: >-
        Every secretKeyRef / configMapKeyRef / envFrom / volume reference in a gitops workload
        must resolve to a Secret or ConfigMap declared in gitops -- directly, or via the
        operator that derives it (ExternalSecret target, cert-manager Certificate secretName,
        CNPG Cluster credentials).
      basis: referenced_implies_declared
      # NOTE: rules.yaml is embedded VERBATIM (comments included) into all 27 OPA bundle
      # ConfigMaps, so prose here is duplicated 27x and moves every policy-checksum. The full
      # rationale -- why a grep cannot do this, the CNPG `vop-db-app` case that makes a naive
      # guard unusable, and the allowlist justification -- lives in the script header, where it
      # is stored once. Keep this block to the rule itself.
      # PRIOR ART: vop-service, 2026-07-16 -- shipped in #1195 consuming `vop-oidc`, a name that
      # appeared exactly ONCE in the repo, at the point of consumption. Its sibling gap (absent
      # from ALL_SERVICES, #1229) is guarded by deploy_coverage below; this is the same shape one
      # layer down. Verified by REVERT: with #1232's ExternalSecret removed the guard fails
      # naming `Secret payments/vop-oidc`; restored, it passes.
      incident: 2026-07-16

    deploy_coverage:
      script: .github/scripts/check-deploy-coverage.sh
      wired_into: .github/workflows/ci.yml   # governance job -> all-green (a REQUIRED check)
      allowlist: .github/scripts/deploy-coverage-allowlist.txt   # built by a DIFFERENT pipeline
      baseline: .github/scripts/deploy-coverage-baseline.txt     # known debt -- SHRINK-ONLY
      # THE RULE: a released component (registered in release-please-config.json) whose image is
      # referenced anywhere under openbank-infra/gitops/ MUST appear in auto-deploy.yml's
      # ALL_SERVICES. ALL_SERVICES is hand-maintained; nothing kept it in sync with the package
      # list, so a service could be merged, released and given an ArgoCD manifest while NOTHING
      # ever built it. Every push then "succeeds" and deploys nothing -- there is no build
      # failure, because there is no build. The gitops tag simply rots in place.
      rule: >-
        Every released component with a gitops workload image reference must be listed in
        ALL_SERVICES in .github/workflows/auto-deploy.yml, or allowlisted with the pipeline
        that builds it instead.
      # WHY THIS RULE AND NOT "every service needs a Dockerfile": a per-service Dockerfile is NOT
      # used to build. auto-deploy and build-push-service.sh generate their own from a canonical
      # template and only grep the per-service file for EXPOSE, defaulting to 8080 when absent --
      # and EXPOSE is image metadata Kubernetes ignores; the manifest's containerPort is what
      # binds. Six healthy services (devops-agent, finops-agent, fraud-service, lending-service,
      # sdd-service, settlement-service) carry no Dockerfile and run fine. A Dockerfile rule would
      # fail all six for nothing and be switched off within a week.
      basis: released_and_deployed_implies_built
      # ALLOWLIST vs BASELINE -- deliberately two files, and the distinction is the point:
      #   allowlist = "something ELSE builds this"  -> permanent, legitimate (admin-ui)
      #   baseline  = "NOTHING builds this, yet"    -> debt, must shrink to empty
      # Collapsing them turns the guard into a rubber stamp: every "we will wire it up later"
      # lands beside a legitimate exception and is never revisited. That is exactly how
      # ALL_SERVICES drifted six times.
      ratchet: >-
        The baseline may only shrink. The guard FAILS if a baselined component is no longer
        violating (delete the entry) and FAILS on any violation that is in neither list. Adding
        a baseline entry is not a fix; it is a reviewable admission of debt.
      # PRIOR ART -- this class recurred six times before it was guarded, each time fixed by hand
      # and recorded in an auto-deploy.yml comment. A comment is not a control (see
      # knowledge_capture): the 6 ADR-0163/0164-0168 control agents; document-service;
      # clearing-simulator (24 days of pushes deployed nothing, and it went unattested straight
      # through the 2026-07-12 Enforce graduation -- one reschedule from an outage);
      # finrep-service; vop-service (merged 2026-07-16, one hour before this guard existed).
      incident: 2026-07-16

    deploy_reconcile:
      probe: .github/scripts/auto-deploy-reconcile-lag.sh
      test: .github/scripts/test-auto-deploy-reconcile-lag.sh
      wired_into: .github/workflows/ci.yml            # test -> governance job (a REQUIRED check)
      schedule: .github/workflows/auto-deploy.yml     # cron "23 */3 * * *" -> the reconcile trigger
      # THE RULE (issue #2020): the per-push auto-deploy run is ONE-SHOT. A service can be
      # correctly detected, built and pushed, then blocked at the can-i-deploy contract gate by a
      # TRANSIENT verification lag -- its build wave republished its consumer pact, and the
      # counterpart provider version then in sandbox verified it only minutes later, on its own
      # deploy. The gate's verdict ("no verified pact between the latest main consumer and the
      # version currently in sandbox") is CORRECT at that instant, but nothing re-drives the
      # deploy once the provider catches up, so the service rots on its stale image until a human
      # hand-bumps gitops. Observed live: #1990 (notification-service per-party push prefs, +V11
      # migration + /api/v1/preferences) built image sandbox-6de0d5e9, was blocked against the
      # account-service then in sandbox, and ran the pre-#1990 image until PR #2017 hand-bumped
      # it -- the broker later reported the pair verified/deployable, proving a timing race, not a
      # contract break.
      rule: >-
        A scheduled reconcile re-offers every deployable service whose gitops image tag is behind
        main to the SAME build-push -> can-i-deploy -> gitops-pr path, so a strand left by a
        transient gate block self-heals the moment the gate clears.
      # WHY THIS IS NOT "weaken the gate": the gate is untouched. A service still genuinely blocked
      # stays blocked (and keeps its #1420 left-behind escalation) on every tick; reconcile only
      # re-presents it, so it deploys the moment -- and only the moment -- the contract clears.
      basis: a_transiently_blocked_deploy_must_self_heal_not_wait_for_a_human
      # The candidate set is enumerated from the gitops manifest pins intersected with
      # ALL_SERVICES (never a second copy of that list -- deploy_coverage above already guards
      # its drift), and capped oldest-first per tick so the first run does not fan out the whole
      # standing backlog (23 stranded services at 2026-07-24) in one shot. The deferred remainder
      # is logged, never silently dropped, and drains on later ticks.
      incident: 2026-07-24

    identifier_intent_guard:
      script: .github/scripts/check-new-random-uuid.sh
      wired_into: .github/workflows/ci.yml   # Validate manifests job -> all-green (a REQUIRED check)
      # THE RULE (ADR-0106, #1699): a PR must not ADD a bare java.util.UUID.randomUUID() in
      # src/main -- new code mints identifiers via com.openbank.libs.domain.identifiers.Ids
      # (newId() for durable/indexed ids, randomId() for idempotency keys/nonces/tokens).
      # Diff-scoped on purpose: it inspects only lines a PR adds, so it never fails on the
      # ~100 pre-existing call sites that migrate to Ids as-touched.
      rule: >-
        Added lines under */src/main/*.kt (excluding the Ids wrapper itself) must not contain
        a bare UUID.randomUUID() call.
      basis: new_identifier_code_uses_the_sanctioned_wrapper
      # KNOWN GAP: the guard skips a FULL-LINE comment (a line whose trimmed content starts
      # with `//`), fixed by PR #1475 after a false positive on PR #1430 -- a comment merely
      # describing that a sibling call site still uses UUID.randomUUID() tripped the guard with
      # zero code change. It does NOT skip an INLINE trailing comment on real code
      # (`val x = foo()  // still uses UUID.randomUUID() elsewhere`) -- that line still matches.
      # Left unfixed deliberately: the guard is diff-scoped to src/main, so a false negative
      # here has low blast radius, and stripping a trailing `// ...` risks breaking on `//`
      # inside a string literal. Tracked, not silently accepted -- see issue below.
      known_gap: issue-1511
      incident: 2026-07-17

    knowledge_capture:
      principle: >
        A corrected non-obvious mistake, a hard-won lesson, or a direction we keep must be
        committed to the repo where every agent and contributor reads it. Act on the
        authoritative origin/main state, never a local/session snapshot or private memory.
      routing:
        - kind: operational_footgun        # "learned the hard way"
          home: "CLAUDE.md (root, or <service>/CLAUDE.md when scoped)"
          form: "one-line bullet in the matching pitfall section — symptom + fix, imperative"
        - kind: hard_rule                  # checkable invariant
          home: "rules.yaml (authoritative)"
          enforce: "add a CI guard/test where feasible; summarize in CLAUDE.md"
        - kind: recurring_workflow
          home: ".claude/skills/"
          form: "a runnable skill that encodes the steps so they aren't re-derived each time"
      not_a_home:
        - "assistant session/local memory — does not travel to other agents or contributors, and may be stale"
  manifest.json: |
    {"roots": ["openbank/agents", "openbank/copilot", "openbank/rest", "agents", "rules"]}
