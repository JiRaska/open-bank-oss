# Single-owner Postgres for balance-service, reconciled by the cluster-wide CNPG
# operator. CNPG generates the `balances-db-app` secret (username/password for
# the `openbank` owner) and a `balances-db-rw` Service — both consumed by the
# balance-service Deployment for the reactive datasource and Flyway migrations.
# One instance for sandbox FinOps; prod should raise to 3 for HA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: balances-db
  namespace: balances
spec:
  # DB-layer observability (Dynatrace-parity #0): CNPG runs its built-in
  # Prometheus exporter on :9187 and creates a PodMonitor the operator owns.
  # kube-prometheus-stack selects PodMonitors cluster-wide (NilUsesHelmValues
  # =false), so this lights up cnpg_* metrics (connections, replication lag,
  # deadlocks, xid age, WAL archiving) with zero app changes.
  monitoring:
    enablePodMonitor: true
  # HA (ADR-0159): primary + hot standby with async streaming replication and
  # CNPG-managed automated failover. `enablePodAntiAffinity` + required
  # `kubernetes.io/hostname` keeps the two pods on DIFFERENT NODES — that is both
  # the HA guarantee and the fix for the single-instance un-drainable-PDB node-roll
  # block (issue #809): with a standby present the PDB permits one disruption, so
  # Karpenter drains/rolls a DB-hosting node without the manual delete-primary dance.
  # The topologySpreadConstraint softly spreads the pair across AZs when capacity
  # allows. Async replication (no minSyncReplicas) keeps the write path independent
  # of standby health; synchronous is deferred to a production decision (ADR-0159).
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: balances-db
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
  bootstrap:
    initdb:
      database: openbank_balances
      owner: openbank
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the balances-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/balances-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: balances-db-daily
  namespace: balances
spec:
  schedule: "0 12 2 * * *"
  backupOwnerReference: self
  cluster:
    name: balances-db
