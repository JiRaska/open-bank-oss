# balance-service: authoritative operational-money store (ADR-0024 N3). Reactive
# Postgres datasource + Flyway JDBC migrations against the single-owner CNPG
# cluster, and an app-level outbox dispatcher that publishes balance events to
# the Strimzi Kafka bus. OIDC bearer-token validation points at Keycloak over the
# in-cluster http leg. account-service seeds pocket balances here on account open
# (best-effort) and the balance projection also reconstructs from
# `openbank.accounts.account.created`. Endpoints are unsecured for now (no
# @RolesAllowed) — reachable only in-cluster via ClusterIP, no ingress.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: balance-service
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
    app.kubernetes.io/part-of: balances
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: balance-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: balance-service
        app.kubernetes.io/part-of: balances
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: balance-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-balance-service:sandbox-7f06f8b1b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8103
            - name: management
              containerPort: 8085
          env:
            # One-shot Flyway repair: the live DB was created by the 0.1.0 image and
            # carries a V5 history row whose checksum predates the V4->V5
            # hibernate_sequences renumber. The DDL is equivalent, so repair the
            # history checksums (no re-run) before migrating forward to 1.2.1.
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary; username
            # is the `openbank` owner, password from the CNPG-generated app secret.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://balances-db-rw.balances.svc:5432/openbank_balances
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://balances-db-rw.balances.svc:5432/openbank_balances
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: balances-db-app
                  key: password
            # Kafka → Strimzi tls:9093 (mTLS, ADR-0137 #2665 Tier 1).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: balance-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC resource-server: validate bearer tokens over the internal http
            # leg; shares the openbank-services client with account-service.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # OIDC CLIENT (outbound M2M): the ownership-check call to account-service
            # (getBalances → AccountServiceClient.getPartyId) fetches a service token via
            # client_credentials. Without this it falls back to the app.yaml default
            # http://localhost:8080 → ConnectException → 500 on every balance read.
            - name: QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # account-service listens on 8100 (its Service exposes http:8100); 8102 is
            # transaction-service's port — the wrong value made getPartyId time out → 500.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: balance-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is TCP on http, not /q/health/ready: the Kafka producer's
          # readiness sits KO until the first event is sent (lazy connect), which
          # with an idle outbox would never flip. Flyway-at-start guarantees DB
          # connectivity before the port opens. Liveness uses http health.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-keystore
          secret:
            secretName: balance-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
  strategy:
    canary:
      stableService: balance-service
      canaryService: balance-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: balance-service
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
spec:
  selector:
    app.kubernetes.io/name: balance-service
  ports:
    - name: http
      port: 8103
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: balance-service-canary
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
spec:
  selector:
    app.kubernetes.io/name: balance-service
  ports:
    - name: http
      port: 8103
      targetPort: http
