# balance-service: authoritative operational-money store (ADR-0024 N3). Reactive
# Postgres datasource + Flyway JDBC migrations against the single-owner CNPG
# cluster, and an app-level outbox dispatcher that publishes balance events to
# the Strimzi Kafka bus. OIDC bearer-token validation points at Keycloak over the
# in-cluster http leg. account-service seeds pocket balances here on account open
# (best-effort) and the balance projection also reconstructs from
# `openbank.accounts.account.created`. Every endpoint is @RolesAllowed AND, as of
# ADR-0034 Phase 5 (issue #266), OPA-enforced (AUTHZ_ENFORCE=true) — reachable
# only in-cluster via ClusterIP, no ingress.
# Progressive delivery: Deployment→Rollout (ADR-0098 Phase 3). Dual Services preserve DNS.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: balance-service
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
    app.kubernetes.io/part-of: balances
spec:
  # Abort and roll back automatically if pods haven't become healthy within
  # 10 minutes (ADR-0098). Prevents a crashlooping canary from blocking at
  # 10% indefinitely with no signal.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: balance-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: balance-service
        app.kubernetes.io/part-of: balances
      annotations:
        # Rolls the pods when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-balance-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "65d7d837961c94d2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: balance-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-balance-service:sandbox-ab06d055
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8103
            - name: management
              containerPort: 8085
          env:
            # One-shot Flyway repair: the live DB was created by the 0.1.0 image and
            # carries a V5 history row whose checksum predates the V4->V5
            # hibernate_sequences renumber. The DDL is equivalent, so repair the
            # history checksums (no re-run) before migrating forward to 1.2.1.
            - name: QUARKUS_FLYWAY_REPAIR_AT_START
              value: "true"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary; username
            # is the `openbank` owner, password from the CNPG-generated app secret.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://balances-db-rw.balances.svc:5432/openbank_balances
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://balances-db-rw.balances.svc:5432/openbank_balances
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: balances-db-app
                  key: password
            # Redis for the four-eyes ApprovalStore (ADR-0155).
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.balances.svc:6379
            # Kafka → Strimzi tls:9093 (mTLS, ADR-0137 #2665 Tier 1).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: balance-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # OIDC resource-server: validate bearer tokens over the internal http
            # leg; shares the openbank-services client with account-service.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # OIDC CLIENT (outbound M2M): the ownership-check call to account-service
            # (getBalances → AccountServiceClient.getPartyId) fetches a service token via
            # client_credentials. Without this it falls back to the app.yaml default
            # http://localhost:8080 → ConnectException → 500 on every balance read.
            - name: QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # account-service listens on 8100 (its Service exposes http:8100); 8102 is
            # transaction-service's port — the wrong value made getPartyId time out → 500.
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: balance-service-oidc
                  key: OIDC_CLIENT_SECRET
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # OPA sidecar is deployed (ADR-0034 Phase 5, issue #266). AUTHZ_ENFORCE=true
            # enables the @Authorize HTTP interceptor to enforce decisions from
            # data.openbank.rest.allow. RBAC via OIDC remains the outer gate; OPA is the
            # fine-grained PEP. The money-path canary analysis (openbank-money-path-canary)
            # aborts the rollout if enforce regresses the error rate.
            - name: AUTHZ_ENFORCE
              value: "true"
            # #686 / #2945: load the ledger-events-in / balance-init-in group.id override
            # (balance-service-msg-override ConfigMap, mounted below) as an external Quarkus
            # config source, so the dotted YAML keys' declared values actually reach the Kafka
            # connector instead of silently falling back to quarkus.application.name.
            # Optional location: if the file is absent Quarkus warns and continues.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # Readiness is TCP on http, not /q/health/ready: the Kafka producer's
          # readiness sits KO until the first event is sent (lazy connect), which
          # with an idle outbox would never flip. Flyway-at-start guarantees DB
          # connectivity before the port opens. Liveness uses http health.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
        # OPA policy-decision sidecar (ADR-0034). Serves data.openbank.rest.allow for
        # all @Authorize-annotated endpoints in balance-service (balance.*). Bundle
        # mounted from balance-opa-bundle ConfigMap (gen-balance-opa-bundle.sh).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach
            # /health. The image is scratch (no shell), so an exec probe isn't possible.
            # Reachability is fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/balance_rest_ext.rego
              subPath: balance_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: balance-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: balance-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: balance-service-msg-override
  strategy:
    canary:
      stableService: balance-service
      canaryService: balance-service-canary
      analysis:
        templates:
          - clusterScope: true
            templateName: openbank-money-path-canary
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: balance-service
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
spec:
  selector:
    app.kubernetes.io/name: balance-service
  ports:
    - name: http
      port: 8103
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: balance-service-canary
  namespace: balances
  labels:
    app.kubernetes.io/name: balance-service
spec:
  selector:
    app.kubernetes.io/name: balance-service
  ports:
    - name: http
      port: 8103
      targetPort: http
