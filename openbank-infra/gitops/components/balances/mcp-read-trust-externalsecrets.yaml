apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: balance-mcp-client-trust
  namespace: balances
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-22"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: balance-mcp-client-trust
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: keycloak/mcp-balance-client-trust
        property: ca.crt
---
