# OIDC client secret for finrep-service, projected from Vault by the External Secrets Operator
# (ClusterSecretStore `vault-kv`) into the in-namespace Secret `finrep-service-oidc`.
#
# Added by #2929. finrep-service's LedgerClient carries OidcClientRequestReactiveFilter (ADR-0184 FINREP/COREP render reads the ledger trial balance), and had no client secret at all — the M2M token it mints could never be minted.
#
# All services share the single Keycloak confidential client `openbank-services`, so the secret
# VALUE is the one already stored in Vault under key `account-service` — reuse it rather than
# minting a second copy (no new Vault write). The value never enters Git; only this reference does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: finrep-service-oidc
  namespace: finrep
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: finrep-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# ADR-0313 D6: finrep's OWN M2M identity (Keycloak client openbank-finrep, ROLE_API only) for the
# risk engine's snapshot list and Pillar 1 capital (COREP C 02.00). Its whole upstream grant is
# `service-finrep-risk-read` in risk_rest_ext.rego: risk.snapshot.read and nothing else. Not the
# shared openbank-services secret on purpose — a grant to that one would open risk figures to every
# backend holding it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: per-service M2M client secret, rotated with the realm client.
    openbank.io/rotation-deadline: "2027-09-26"
  name: finrep-service-m2m-oidc
  namespace: finrep
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: finrep-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_M2M_CLIENT_SECRET
      remoteRef:
        key: keycloak/finrep
        property: client_secret
