# OIDC client secret for finrep-service, projected from Vault by the External Secrets Operator
# (ClusterSecretStore `vault-kv`) into the in-namespace Secret `finrep-service-oidc`.
#
# Added by #2929. finrep-service's LedgerClient carries OidcClientRequestReactiveFilter (ADR-0184 FINREP/COREP render reads the ledger trial balance), and had no client secret at all — the M2M token it mints could never be minted.
#
# All services share the single Keycloak confidential client `openbank-services`, so the secret
# VALUE is the one already stored in Vault under key `account-service` — reuse it rather than
# minting a second copy (no new Vault write). The value never enters Git; only this reference does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: finrep-service-oidc
  namespace: finrep
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: finrep-service-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
