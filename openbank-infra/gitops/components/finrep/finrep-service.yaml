apiVersion: apps/v1
kind: Deployment
metadata:
  name: finrep-service
  namespace: finrep
  labels:
    app.kubernetes.io/name: finrep-service
    app.kubernetes.io/part-of: finrep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finrep-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finrep-service
        app.kubernetes.io/part-of: finrep
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finrep-service
          image: openbank-finrep-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8140
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: finrep-service
  namespace: finrep
  labels:
    app.kubernetes.io/name: finrep-service
    app.kubernetes.io/part-of: finrep
spec:
  selector:
    app.kubernetes.io/name: finrep-service
  ports:
    - name: http
      port: 8140
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
