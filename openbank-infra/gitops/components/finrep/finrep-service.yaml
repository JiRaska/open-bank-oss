# finrep-service has never been built/pushed via openbank-infra/scripts/build-push-service.sh
# (this is its first ArgoCD registration, ADR-0097). The image tag below is a placeholder,
# following the same first-registration pattern as developer-portal's `sandbox-sec1` — it
# does NOT point at a real pushed image yet. Run `build-push-service.sh finrep --bump` (or the
# CI auto-deploy pipeline) to build+push the real `sandbox-<git-sha>` image and rewrite this
# tag before relying on this Deployment actually coming up (Kyverno blocks even ArgoCD's dry-run
# diff for a nonexistent tag, so the app sticks at sync status Unknown, not ImagePullBackOff — see PR #547 reviewer notes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finrep-service
  namespace: finrep
  labels:
    app.kubernetes.io/name: finrep-service
    app.kubernetes.io/part-of: finrep
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finrep-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finrep-service
        app.kubernetes.io/part-of: finrep
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finrep-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-finrep-service:sandbox-c700d8fc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8140
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Declared explicitly rather than left to the libs default (`true`), issue #2394.
            # finrep-service contains no @Authorize annotation, so there is no OPA decision to
            # make and no `opa` sidecar in this pod. With the default, AuthorizeInterceptor would
            # be armed to fail closed against a PDP that does not exist — harmless while the
            # annotation count is zero, and an instant 503/422 on whichever endpoint gets the
            # first one. Authorization today is JWT roles (@RolesAllowed on FinrepResource /
            # CorepResource). Flip this to true in the SAME change that adds @Authorize + the
            # rego rules + the sidecar (ADR-0034 Phase 5), never before.
            - name: AUTHZ_ENFORCE
              value: "false"
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # NOT optional (#2929). LedgerClient carries OidcClientRequestReactiveFilter, so
            # without this value the oidc-client never initializes and the ledger call goes out
            # with no Authorization header. The ref was absent entirely until now.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finrep-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: finrep-service
  namespace: finrep
  labels:
    app.kubernetes.io/name: finrep-service
    app.kubernetes.io/part-of: finrep
spec:
  selector:
    app.kubernetes.io/name: finrep-service
  ports:
    - name: http
      port: 8140
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
