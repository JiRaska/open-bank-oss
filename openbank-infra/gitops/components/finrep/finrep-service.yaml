# finrep-service has never been built/pushed via openbank-infra/scripts/build-push-service.sh
# (this is its first ArgoCD registration, ADR-0097). The image tag below is a placeholder,
# following the same first-registration pattern as developer-portal's `sandbox-sec1` — it
# does NOT point at a real pushed image yet. Run `build-push-service.sh finrep --bump` (or the
# CI auto-deploy pipeline) to build+push the real `sandbox-<git-sha>` image and rewrite this
# tag before relying on this Deployment actually coming up (Kyverno blocks even ArgoCD's dry-run
# diff for a nonexistent tag, so the app sticks at sync status Unknown, not ImagePullBackOff — see PR #547 reviewer notes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finrep-service
  namespace: finrep
  labels:
    app.kubernetes.io/name: finrep-service
    app.kubernetes.io/part-of: finrep
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finrep-service
  template:
    metadata:
      annotations:
        openbank.tech/policy-checksum: "73bdd709fd44fdee"
      labels:
        app.kubernetes.io/name: finrep-service
        app.kubernetes.io/part-of: finrep
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finrep-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-finrep-service:sandbox-e27b7ab3@sha256:70f474f0479f22b713606cd334ec6350385358170426cdcf361f3a385343dece
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8140
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # Enforced after an advisory window with no would-DENY decision logged.
            - name: AUTHZ_ENFORCE
              value: "true"
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service.ledger.svc:8101
            # Supervisory submission store (finrep/postgres.yaml): reactive + JDBC (Flyway) legs onto
            # the same CNPG primary; env outranks application.yaml's localhost defaults.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://finrep-db-rw.finrep.svc:5432/openbank_finrep
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://finrep-db-rw.finrep.svc:5432/openbank_finrep
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finrep-db-app
                  key: password
            # ADR-0313 D6: COREP C 02.00 reads the risk engine's Pillar 1 result over the engine's
            # private-CA mTLS listener (8443, client auth REQUIRED; ASVS V9.1 forbids a new plaintext
            # edge), authenticating with finrep-internal-tls (mounted at /mnt/internal-tls, named by the
            # %prod `risk-authority` TLS bucket) and, at the application layer, as finrep's own identity
            # (openbank-finrep, granted risk.snapshot.read by identity in risk_rest_ext.rego).
            - name: RISK_ENGINE_URL
              value: https://risk-engine.risk.svc:8443
            - name: OPENBANK_FINREP_RISK_ENGINE_ENABLED
              value: "true"
            # NOT optional: a missing keycloak/finrep entry is a loud CreateContainerConfigError,
            # never a silently empty credential. Provision the client and keycloak/finrep BEFORE
            # this syncs (runbook 0009).
            - name: OIDC_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finrep-service-m2m-oidc
                  key: OIDC_M2M_CLIENT_SECRET
                  optional: false
            # NOT optional (#2929). LedgerClient carries OidcClientRequestReactiveFilter, so
            # without this value the oidc-client never initializes and the ledger call goes out
            # with no Authorization header. The ref was absent entirely until now.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finrep-service-oidc
                  key: OIDC_CLIENT_SECRET
                  optional: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: internal-tls
              mountPath: /mnt/internal-tls
              readOnly: true
        # OPA sidecar for the advisory regulatory report decisions (ADR-0034).
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Keep decision and management APIs inside the pod. Kubelet probes use the read-only listener.
            - --addr=127.0.0.1:8181
            - --diagnostic-addr=0.0.0.0:8282
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
            - name: opa-diagnostics
              containerPort: 8282
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: opa-diagnostics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: opa-diagnostics
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/finrep_rest_ext.rego
              subPath: finrep_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Each data file is mounted under its declared bundle root.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        # Client certificate for the risk-engine 8443 mTLS edge (finrep-internal-tls).
        - name: internal-tls
          secret:
            secretName: finrep-internal-tls
            optional: false
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: finrep-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: finrep-service
  namespace: finrep
  labels:
    app.kubernetes.io/name: finrep-service
    app.kubernetes.io/part-of: finrep
spec:
  selector:
    app.kubernetes.io/name: finrep-service
  ports:
    - name: http
      port: 8140
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
