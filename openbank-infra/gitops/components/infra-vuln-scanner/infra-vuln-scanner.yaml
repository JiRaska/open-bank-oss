# ---------------------------------------------------------------------------
# Infra vulnerability scanner — daily Grype scan of the infrastructure image
# fleet, published as ConfigMap `infra-vulns-v2` in the admin-ui namespace
# (ADR-0077 §Architecture evolution, issue #671).
#
# The BFF independently re-reads ready pod image IDs and accepts v2 findings
# only when the complete digest set still matches. The old v1 ConfigMap is
# retained as explicitly unverified legacy data during migration.
#
# RBAC design:
#   - infra-vuln-scanner-configmap Role (admin-ui ns): write the single
#     infra-vulns ConfigMap.
#   - infra-vuln-scanner-pod-reader ClusterRole + per-namespace RoleBindings:
#     list pods in each infra namespace to discover the live image+tag.
#     Never granted as a ClusterRoleBinding; confers no cross-namespace view.
#   - admin-ui-discovery ClusterRole + RoleBinding (admin-ui ns): the existing
#     admin-ui SA gets a one-time read on the ConfigMap so the Next.js BFF can
#     read the live scan result (no API change; the BFF already reads via fs).
#
# Image discovery uses Ready pod status.containerStatuses.imageID digests.
# No tag or hardcoded fallback is treated as a current scan.
# ---------------------------------------------------------------------------

# ─── ServiceAccount ─────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-vuln-scanner
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
    app.kubernetes.io/part-of: admin-ui

---
# ─── RBAC: write the single ConfigMap ───────────────────────────────────────

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-vuln-scanner-configmap
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["infra-vulns", "infra-vulns-v2"]
    verbs: ["get", "patch", "update"]
  # create: resourceNames cannot gate create — belt-and-braces for first-run
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-vuln-scanner-configmap
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-vuln-scanner-configmap
subjects:
  - kind: ServiceAccount
    name: infra-vuln-scanner
    namespace: admin-ui

---
# ─── RBAC: read pods in infra namespaces (never ClusterRoleBinding) ─────────
# Defined as ClusterRole so it can be reused across per-namespace RoleBindings
# without duplicating the rules.  Each namespace binding is explicit below.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-vuln-scanner-pod-reader
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# messaging: kafka (Strimzi broker), schema-registry (Apicurio), kafka-ui
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-vuln-scanner-pod-reader
  namespace: messaging
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-vuln-scanner-pod-reader
subjects:
  - kind: ServiceAccount
    name: infra-vuln-scanner
    namespace: admin-ui

---
# iam: Keycloak
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-vuln-scanner-pod-reader
  namespace: iam
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-vuln-scanner-pod-reader
subjects:
  - kind: ServiceAccount
    name: infra-vuln-scanner
    namespace: admin-ui

---
# vault: OpenBao
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-vuln-scanner-pod-reader
  namespace: vault
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-vuln-scanner-pod-reader
subjects:
  - kind: ServiceAccount
    name: infra-vuln-scanner
    namespace: admin-ui

---
# observability: Grafana, Prometheus, Loki, Tempo, Alloy, Pyroscope, GlitchTip
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-vuln-scanner-pod-reader
  namespace: observability
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-vuln-scanner-pod-reader
subjects:
  - kind: ServiceAccount
    name: infra-vuln-scanner
    namespace: admin-ui

---
# accounts: find a running CNPG postgres pod to resolve the exact image tag
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-vuln-scanner-pod-reader
  namespace: accounts
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-vuln-scanner-pod-reader
subjects:
  - kind: ServiceAccount
    name: infra-vuln-scanner
    namespace: admin-ui

---
# The BFF independently reads current pod imageIDs to validate the scanner's
# findings. Namespace bindings keep this read limited to the scanned infra fleet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-ui-infra-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-infra-pod-reader
  namespace: accounts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-infra-pod-reader
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-infra-pod-reader
  namespace: messaging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-infra-pod-reader
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-infra-pod-reader
  namespace: iam
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-infra-pod-reader
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-infra-pod-reader
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-infra-pod-reader
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-infra-pod-reader
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-ui-infra-pod-reader
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui
---
# ─── RBAC: admin-ui SA reads the live ConfigMap (for the BFF route) ─────────
# The admin-ui Deployment mounts the ConfigMap as a volume (optional:true), so
# this binding is a belt-and-suspenders for any future direct-API read path.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-vulns-configmap-reader
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["infra-vulns"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-ui-infra-vulns-reader
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-vulns-configmap-reader
subjects:
  - kind: ServiceAccount
    name: admin-ui
    namespace: admin-ui

---
# ─── CronJob ────────────────────────────────────────────────────────────────

apiVersion: batch/v1
kind: CronJob
metadata:
  name: infra-vuln-scanner
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: infra-vuln-scanner
    app.kubernetes.io/part-of: admin-ui
  annotations:
    # Budget for CronJobSuccessStale (prometheus-rules-jobs.yaml): two missed runs of '15 2 * * *' plus slack.
    openbank.tech/max-success-age-seconds: "180000"
spec:
  # 02:15 UTC daily — after cost-collector (23:50 Prague = 21:50 UTC) and
  # before peak traffic. spec.timeZone GA in Kubernetes 1.27+.
  schedule: "15 2 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # failedJobsHistoryLimit: 1 — keep the LATEST failure for triage, not an archive.
  # kube-prometheus-stack's KubeJobFailed fires per surviving failed Job OBJECT, so a
  # limit of 3 turns one recurring failure into three permanent alerts. Worse, the pods
  # are garbage-collected long before the Job object is, so the extra tombstones carry
  # no diagnostic value at all — only the alert. Measured 2026-08-02: KubeJobFailed was
  # 11 of the 37 firing alerts, 8 of them with pods=0 and the oldest dating to 07-12.
  # One failure per CronJob still alerts (a job that keeps failing should), the
  # duplicates stop.
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # 48h self-delete so a failed Job cannot become a permanent KubeJobFailed tombstone;
      # rationale in openbank-infra/gitops/components/observability/cronjob-rum-attribute-audit.yaml.
      ttlSecondsAfterFinished: 172800
      # Grype scans can take several minutes per image if the vuln DB needs
      # refreshing. Allow up to 30 min total; fail cleanly rather than hang.
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: infra-vuln-scanner
        spec:
          serviceAccountName: infra-vuln-scanner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # Two-phase design:
          #   init/fetch-grype + init/scan — grype binary run in alpine/k8s: scans each infra
          #                image, writes /results/infra-vulns.json.
          #   main/publish — alpine/k8s: publishes the JSON to the ConfigMap
          #                  via kubectl apply (no Grype dependency needed in
          #                  the publish container — least capability).
          initContainers:
            # anchore/grype:<v> is FROM scratch: no /bin/sh, no python3, no
            # kubectl, so the scan script below could never start there (runc:
            # `exec: "/bin/sh": stat /bin/sh: no such file or directory`, every
            # run since this CronJob existed). The `-debug` variant of the SAME
            # release carries busybox, used only to copy the static grype binary
            # into a shared emptyDir; the scan then runs in alpine/k8s, which
            # has sh + python3 + kubectl.
            # v0.94.0 could not load today's grype DB either (`unable to migrate:
            # UNIQUE constraint failed: operating_systems...`, exit 1 on every
            # image), so the version moves with the fix. Reproduced locally:
            # v0.94.0 scans 0 images, v0.118.0 scans postgres + valkey.
            - name: fetch-grype
              image: docker.io/anchore/grype:v0.118.0-debug
              command: ["/busybox/cp", "/grype", "/tools/grype"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
            - name: scan
              image: docker.io/alpine/k8s:1.34.12
              command: ["/bin/sh", "-ec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
                - name: PATH
                  value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                # Grype DB cache; must be writable (read-only root fs off for this
                # container because grype writes its vuln DB to $HOME/.cache).
                - name: GRYPE_DB_CACHE_DIR
                  value: /tmp/grype-db
              args:
                - |
                  set -eu
                  # The old v1 ConfigMap remains untouched while consumers learn v2.
                  cat > /tmp/agg.py << 'PYEOF'
                  import hashlib, json, os, re, subprocess, sys
                  from datetime import datetime, timezone

                  COMPONENTS = {
                      "postgres": ("accounts", "ghcr.io/cloudnative-pg/postgresql"),
                      "valkey": ("accounts", "docker.io/valkey/valkey"),
                      "kafka": ("messaging", "quay.io/strimzi/kafka"),
                      "schema-registry": ("messaging", "docker.io/apicurio/apicurio-registry-sql"),
                      "kafka-ui": ("messaging", "ghcr.io/kafbat/kafka-ui"),
                      "keycloak": ("iam", "quay.io/keycloak/keycloak"),
                      "openbao": ("vault", "quay.io/openbao/openbao"),
                      "grafana": ("observability", "docker.io/grafana/grafana"),
                      "prometheus": ("observability", "quay.io/prometheus/prometheus"),
                      "loki": ("observability", "docker.io/grafana/loki"),
                      "tempo": ("observability", "docker.io/grafana/tempo"),
                      "alloy": ("observability", "docker.io/grafana/alloy"),
                  }
                  DIGEST = re.compile(r"@(?P<digest>sha256:[a-f0-9]{64})$")

                  def command(*args, timeout=120):
                      p = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
                      if p.returncode != 0:
                          raise RuntimeError(f"{args[0]} failed with exit {p.returncode}")
                      return p.stdout

                  def instant():
                      return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

                  def repository(image):
                      image = image.split("@", 1)[0]
                      last_colon = image.rfind(":")
                      return image[:last_colon] if last_colon > image.rfind("/") else image

                  def normalized_repository(image):
                      if not isinstance(image, str) or not re.fullmatch(r"[a-z0-9][a-z0-9._:/@-]*", image):
                          return None
                      ref = repository(image)
                      parts = ref.split("/")
                      if len(parts) < 2:
                          return None
                      host = parts.pop(0) if "." in parts[0] or ":" in parts[0] else "docker.io"
                      if re.fullmatch(r"[a-z0-9-]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com", host):
                          origin = parts.pop(0) if parts else ""
                          if origin not in ("ghcr", "quay", "dockerhub"):
                              return None
                          host = {"ghcr": "ghcr.io", "quay": "quay.io", "dockerhub": "docker.io"}[origin]
                      return host + "/" + "/".join(parts)

                  def active_images(pods, expected_repository):
                      found = {}
                      for pod in pods.get("items", []):
                          status = pod.get("status", {})
                          if status.get("phase") != "Running" or not any(
                              c.get("type") == "Ready" and c.get("status") == "True"
                              for c in status.get("conditions", [])):
                              continue
                          by_name = {c.get("name"): c for c in status.get("containerStatuses", [])}
                          for spec in pod.get("spec", {}).get("containers", []):
                              image = spec.get("image", "")
                              if normalized_repository(image) != expected_repository:
                                  continue
                              entry = by_name.get(spec.get("name"), {})
                              match = DIGEST.search(entry.get("imageID", "")) if entry.get("ready") else None
                              if not match:
                                  raise RuntimeError("ready infra container has no registry digest")
                              digest = match.group("digest")
                              ref = repository(image) + "@" + digest
                              if digest in found and found[digest] != ref:
                                  raise RuntimeError("ambiguous registry identity for digest")
                              found[digest] = ref
                      return found

                  def grype_scan(ref):
                      raw = command("grype", ref, "-o", "json", "-q", timeout=600)
                      report = json.loads(raw)
                      if not isinstance(report.get("matches"), list):
                          raise RuntimeError("invalid Grype match report")
                      counts = {"critical": 0, "high": 0, "medium": 0, "low": 0, "total": 0}
                      top = []
                      for match in report["matches"]:
                          severity = match.get("vulnerability", {}).get("severity")
                          if not isinstance(severity, str):
                              raise RuntimeError("missing Grype severity")
                          severity = severity.lower()
                          counts["total"] += 1
                          if severity in counts:
                              counts[severity] += 1
                          if severity in ("critical", "high") and len(top) < 5:
                              vuln = match["vulnerability"]
                              fixes = vuln.get("fix", {}).get("versions", [])
                              top.append({"id": vuln.get("id", "?"), "severity": severity,
                                          "fixedIn": fixes[0] if fixes else None})
                      return counts, top, hashlib.sha256(raw.encode()).hexdigest()

                  version = json.loads(command("grype", "version", "-o", "json"))["version"]
                  # The scanner's emptyDir starts without a database on every run.
                  command("grype", "db", "update", timeout=600)
                  db_fetched_at = instant()
                  status = json.loads(command("grype", "db", "status", "-o", "json"))
                  if status.get("valid") is not True or not status.get("path"):
                      raise RuntimeError("Grype DB provenance unavailable")
                  with open(status["path"], "rb") as db_file:
                      db_hash = hashlib.file_digest(db_file, "sha256").hexdigest()
                  namespaces = {ns for ns, _ in COMPONENTS.values()}
                  pods = {ns: json.loads(command("kubectl", "get", "pods", "-n", ns, "-o", "json"))
                          for ns in namespaces}
                  images = {}
                  for component, (namespace, expected_repository) in COMPONENTS.items():
                      found = active_images(pods[namespace], expected_repository)
                      if not found:
                          # Missing components are explicit unknowns, not zeros.
                          continue
                      scans = []
                      for digest, ref in sorted(found.items()):
                          counts, top, report_hash = grype_scan(ref)
                          scans.append({"digest": digest, "reportSha256": report_hash,
                                        "top": top, **counts})
                      images[component] = {"scans": scans}
                  if not images:
                      raise RuntimeError("no live infrastructure image scanned")
                  with open(status["path"], "rb") as db_file:
                      if hashlib.file_digest(db_file, "sha256").hexdigest() != db_hash:
                          raise RuntimeError("Grype DB changed during scan")
                  snapshot = {"schema": "openbank.infra-vulns.runtime/v2",
                              "scannedAt": instant(),
                              "scanner": {"name": "grype", "version": version,
                                          "db": {"schemaVersion": int(status["schemaVersion"]),
                                                 "sha256": db_hash, "fetchedAt": db_fetched_at}},
                              "images": images}
                  with open("/results/infra-vulns-v2.json", "w") as out:
                      json.dump(snapshot, out, separators=(",", ":"))
                  print(f"Published-ready v2 scan: {len(images)} live components", flush=True)
                  PYEOF

                  python3 /tmp/agg.py
              volumeMounts:
                - name: results
                  mountPath: /results
                - name: tmp
                  mountPath: /tmp
                - name: tools
                  mountPath: /tools
                  readOnly: true

          containers:
            - name: publish
              image: docker.io/alpine/k8s:1.34.12
              command: ["/bin/sh", "-ec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  echo "Publishing infra-vulns-v2 ConfigMap..."
                  kubectl create configmap infra-vulns-v2 \
                    --namespace admin-ui \
                    --from-file=infra-vulns-v2.json=/results/infra-vulns-v2.json \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "Done."
              volumeMounts:
                - name: results
                  mountPath: /results
                  readOnly: true
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: results
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: tools
              emptyDir: {}
