# dispute-service onboarded to the cluster (ADR-0037 domain=namespace). Reactive
# Postgres + Flyway migrations on boot, Redis idempotency, Kafka outbox. OIDC bearer
# validation via the in-cluster Keycloak. Read MCP tools (agent-service) reach it here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispute-service
  namespace: dispute
  labels: {app.kubernetes.io/name: dispute-service, app.kubernetes.io/part-of: dispute}
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes while reporting 1/1 READY.
  # No HA to lose: this workload is already unavailable for the moment its pod is replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: dispute-service}}
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-dispute-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "0c2811478d6b5c7b"
      labels: {app.kubernetes.io/name: dispute-service, app.kubernetes.io/part-of: dispute}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dispute-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-dispute-service:sandbox-ab83fe6e
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8135}
            - {name: management, containerPort: 8085}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://dispute-db-rw.dispute.svc:5432/openbank_dispute
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://dispute-db-rw.dispute.svc:5432/openbank_dispute
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: dispute-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_REACTIVE_USERNAME
              valueFrom: {secretKeyRef: {name: dispute-db-app, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-db-app, key: password}}
            - name: QUARKUS_DATASOURCE_REACTIVE_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-db-app, key: password}}
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.dispute.svc:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            # mTLS to Strimzi (ADR-0137). Authenticates as the KafkaUser
            # 'dispute-service'; keystore/truststore PKCS#12 are projected from
            # messaging by External Secrets (kafka-dispute-mtls.yaml)
            # and mounted below. The app reads these env vars via ${...} in
            # application.yaml (mp.messaging.connector.smallrye-kafka.*).
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka/keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispute-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka/truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # OIDC_CLIENT_SECRET removed (#2929): dispute-service has no rest-client carrying
            # OidcClientRequestReactiveFilter, so it mints no M2M token and never read this. The
            # ref pointed at a Secret nothing creates, which is only ever confusing — a service
            # that needs no client credential should not claim one.
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # ADR-0034 Phase 5 / issue #1797: the OPA sidecar (below) is now wired, so the 14
            # @Authorize methods on DisputeResource + ComplaintResource actually reach a PDP.
            # Before this, dispute-service ran with the app default AUTHZ_ENFORCE=true
            # (application.yaml: authz.enforce: "${AUTHZ_ENFORCE:true}") and NO sidecar — the
            # live pod had exactly one container — so every PDP call to localhost:8181 failed
            # and the interceptor failed closed for every caller, including the customer-edge
            # dispute list the mobile app depends on. Kept ADVISORY (false) for this rollout:
            # the interceptor evaluates and records every decision but does NOT block while
            # false, so the "would DENY" population can be confirmed empty in the live decision
            # log (openbank.authz.decisions, outcome=deny enforced=false) before the enforce
            # flip — a separate, deliberate follow-up per the rules.yaml AUTHZ_ENFORCE
            # guardrail. The app default is `true`, so this explicit `false` is load-bearing.
            - name: AUTHZ_ENFORCE
              value: "false"
          startupProbe: {tcpSocket: {port: management}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /q/health/live, port: management}, periodSeconds: 15, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka/keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka/truststore
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 430Mi}
            limits: {cpu: "1", memory: 1536Mi}
        # OPA policy decision point (ADR-0034 Phase 5 / issue #1797). Co-located sidecar the app
        # reaches on localhost:8181 (AuthorizeInterceptor default — no OPA_URL env needed; the
        # app's opa.url already defaults to http://localhost:8181). Bundle mounted read-only from
        # the dispute-opa-bundle ConfigMap generated by gen-dispute-opa-bundle.sh. Mirrors
        # psd2-service / statement-service / party-service (same image, args, probes, security
        # context, subPath mounts). No runAsUser here — it inherits the pod-level 1001/1001
        # above, which is what satisfies runAsNonRoot for this image.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/dispute_rest_ext.rego
              subPath: dispute_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: dispute-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: dispute-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: dispute-service
  namespace: dispute
  labels: {app.kubernetes.io/name: dispute-service}
spec:
  selector: {app.kubernetes.io/name: dispute-service}
  ports: [{name: http, port: 8135, targetPort: http}]
