# The on-call Slack webhook for the digest message — the SAME OpenBao path Alertmanager's own
# receiver uses (external-secrets/es-alertmanager-slack.yaml), projected into this namespace so
# nothing new has to be seeded. Optional at the pod (see the CronJob): the envelope for the
# weekly RCA is the control; the Slack message is a courtesy copy of it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digest-slack
  namespace: alert-digest
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: digest-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK
      remoteRef:
        key: alertmanager
        property: SLACK_WEBHOOK
