# openbank-mcp-service: the first-party Model Context Protocol server (ADR-0181). A
# stateless JSON-RPC surface (initialize / tools/list / tools/call / ping) exposing a
# curated, consent-scoped tool set to governed AI agents. No DB, no Kafka.
#
# PHASE 2 (ADR-0181): the ADR-0034 OPA sidecar below serves data.openbank.rest.allow over
# localhost:8181, so `tools/call` is now authorized (not fail-closed): the shared PDP evaluates
# each capability as an AI_AGENT action against the `mcp-anonymous` charter (agents.yaml). A PDP
# outage still fails CLOSED in McpEndpoint (never fail-open on a money-adjacent surface). OIDC is
# tenant-disabled in the image config, so the endpoint carries no auth in phase 1 and the only
# caller is the in-cluster network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-service
  namespace: platform
  labels:
    app.kubernetes.io/name: mcp-service
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545): with one replica the default maxSurge 1 /
  # maxUnavailable 0 needs room for two pods, and the old pod holds exactly those
  # resources - on a full cluster the rollout never completes and reports 1/1 READY.
  # This workload is single-replica BY CONSTRAINT: it holds per-pod in-memory state, so
  # scaling it past 1 needs the #3467-class fix first, not a replica bump.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-service
        app.kubernetes.io/part-of: platform
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-mcp-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "355c3f9e3043443a"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-service
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-mcp-service:sandbox-3b62a4a5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8150
            - name: management
              containerPort: 8085
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            # ADR-0224 D2: the agent-session store — CNPG `mcp-db` cluster (postgres.yaml here),
            # its operator-generated mcp-db-app secret carries username/password.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://mcp-db-rw.platform.svc:5432/openbank_mcp
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://mcp-db-rw.platform.svc:5432/openbank_mcp
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mcp-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-db-app
                  key: password
            # ADR-0224: admit staff OBO tokens at the resolver. Flip ONLY with the full
            # chain live: realm permission (#2762), this service's session store (#2843),
            # and the admin-ui OBO_MCP_ENABLED relay (#2850).
            - name: MCP_OBO_ENABLED
              value: "true"
            # ADR-0034 PDP: the OPA sidecar in this pod (localhost:8181), serving
            # data.openbank.rest.allow (mcp-opa-bundle ConfigMap). A PDP connectivity error
            # still fails CLOSED in McpEndpoint (money-adjacent surface — never fail-open).
            - name: OPA_URL
              value: http://localhost:8181
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4317
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # ADR-0195 step 3: outbound M2M targets for RealAccountReadPort's downstream calls —
            # NOT consumed yet (the port is @Vetoed until step 4's CDI cutover), but declared here
            # now so gen-network-policies.py opens the cross-namespace edges ahead of that cutover
            # (CLAUDE.md: a URL that lives only in application.yaml gets no NetworkPolicy edge at
            # all — it must be in this env block, .svc form, for the generator to see it).
            - name: QUARKUS_REST_CLIENT_ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            - name: QUARKUS_REST_CLIENT_BALANCE_SERVICE_URL
              value: http://balance-service.balances.svc:8103
            - name: QUARKUS_REST_CLIENT_TRANSACTION_SERVICE_URL
              value: http://transaction-service.payments.svc:8102
            - name: QUARKUS_REST_CLIENT_CONSENT_SERVICE_URL
              value: http://consent-service.consent.svc:8106
            # openbank-services client secret (shared M2M identity, ADR-0104 D3 — the SAME client
            # transaction-service/lending-service/settlement-service/agent-service already use) —
            # lets RealAccountReadPort's OidcClientRequestReactiveFilter mint a client-credentials
            # token. Own ExternalSecret (es-mcp-service.yaml), own OpenBao KV copy — the OpenBao
            # value itself is a manual follow-up (mirrors agent-service's own bootstrap comment).
            # Optional so the timing gap before that key is seeded doesn't CrashLoop the pod; until
            # then a downstream M2M call 401s — no worse than the port being unwired, and it isn't
            # wired yet regardless (still @Vetoed).
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-service-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: true
          startupProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # OPA policy-decision sidecar (ADR-0034 / ADR-0181 phase 2). Serves
        # data.openbank.rest.allow for the MCP tools/call gate — the shared PDP bridges the
        # AI_AGENT capability to the mcp-anonymous charter (agents.rego). Bundle mounted from
        # mcp-opa-bundle ConfigMap (gen-mcp-opa-bundle.sh). Bind 0.0.0.0 so kubelet httpGet
        # probes reach /health (the image is scratch — no shell for an exec probe); reachability
        # is fenced by the pod network, and OPA serves only policy decisions, no secrets.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.17.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet: {path: "/health?bundles=true", port: 8181}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem: true.
            - name: opa-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: mcp-opa-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: platform
  labels:
    app.kubernetes.io/name: mcp-service
spec:
  selector:
    app.kubernetes.io/name: mcp-service
  ports:
    - name: http
      port: 8150
      targetPort: http
