apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-read-nonce
  namespace: platform
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-22"
spec:
  data:
  - remoteRef:
      key: keycloak/mcp-read-nonce
      property: key
    secretKey: key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: mcp-read-nonce
