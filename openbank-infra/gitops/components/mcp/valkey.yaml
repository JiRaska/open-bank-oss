# Cross-replica DPoP replay store and customer budgets for mcp-service (ADR-0383 P4, ADR-0385).
# ValkeyDpopReplayStore backs the customer channel's single-use jti claim so a replayed DPoP proof is
# rejected on every replica, not just the one that first saw it.
#
# Ephemeral on purpose (--save "" --appendonly no), and that has a cost worth stating plainly: a
# Valkey restart or OOM-kill EMPTIES the keyspace, which REOPENS replay for every proof still inside
# its window (up to 365 s) and RESETS every D5.3 budget. That is a real, bounded weakening, recorded
# as a residual in the mcp-service threat model and in 05-operations; prod should use an
# operator-managed HA store with persistence.
#
# Memory: --maxmemory sits well below the container limit (128mb vs 192Mi) so Valkey refuses writes
# before the kernel OOM-kills it, and --maxmemory-policy noeviction is explicit: an evicting policy
# would silently delete live replay entries. A full store answers errors, which mcp-service turns
# into 503 (fail closed).
#
# Auth: requirepass from the mcp-customer-store-valkey Secret (generated in-cluster by the ESO Password
# generator in customer-store-externalsecret.yaml, no OpenBao copy), rendered into a tmpfs config
# file, never argv. The Secret ref is REQUIRED here, so until ESO has created the Secret this pod
# does not start — it never runs unauthenticated. Named mcp-valkey (not the bare per-ns `redis`)
# because `platform` is a shared namespace; ingress admits only mcp-service pods
# (open-bank.tech/same-namespace-ingress-from, read by gen-network-policies.py).
# Pinned to the valkey uid 999/gid 1000 for PSS restricted; /data is a writable emptyDir so the root
# fs can stay read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-valkey
  namespace: platform
  labels:
    app.kubernetes.io/name: mcp-valkey
    app.kubernetes.io/part-of: mcp-service
  annotations:
    open-bank.tech/same-namespace-ingress-from: mcp-service
    # The exporter port is reachable only by the Prometheus pods (not admin-ui, not all of
    # observability) — read by gen-network-policies.py (#16791 security review).
    open-bank.tech/metrics-ingress-prometheus-only: "true"
spec:
  replicas: 1
  # Terminate-first, deliberately (#3545). This is a single-writer cache on an emptyDir
  # behind one ClusterIP Service: a SURGED second pod would answer half the traffic from an
  # empty keyspace, so surge is not a property worth keeping here. It also makes the roll
  # possible at all when the cluster has no room for two pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9.1.3-alpine
          # The password must never reach argv: kubelet-expanded `$(VAR)` args land in
          # /proc/1/cmdline and `crictl inspect`. So a POSIX-sh wrapper writes every setting,
          # requirepass included, into a memory-medium emptyDir (/conf, never on disk), drops the
          # variable from its environment and execs valkey-server on the file. `$VALKEY_PASSWORD`
          # below is shell syntax, NOT kubelet `$(...)` syntax, so argv carries only this script.
          # An empty password refuses to start rather than run unauthenticated. The generated value
          # is 48 letters/digits, so it can never contain `"` or a newline.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              [ -n "${VALKEY_PASSWORD:-}" ] || { echo "VALKEY_PASSWORD empty: refusing to start unauthenticated" >&2; exit 1; }
              [ -n "${METRICS_PASSWORD:-}" ] || { echo "METRICS_PASSWORD empty: refusing to start" >&2; exit 1; }
              umask 077
              {
                echo 'save ""'
                echo 'appendonly no'
                echo 'dir /data'
                echo 'maxmemory 128mb'
                echo 'maxmemory-policy noeviction'
                # No slowlog: a replay/budget store has no use for it, and an entry would carry a slow
                # command's arguments (jti, hashed key names).
                echo 'slowlog-log-slower-than -1'
                printf 'requirepass "%s"\n' "$VALKEY_PASSWORD"
                # The exporter's OWN user: read-only server introspection, no key or channel access,
                # no data or admin commands, and NO `CONFIG GET` (measured: it returns `requirepass` in
                # clear). No `CLIENT LIST` either (client addresses/names): the exporter only calls it
                # with --export-client-list, which is off. `SLOWLOG GET` is granted only because v1.92.1
                # calls it on every scrape with no flag to stop it (without it ACL LOG fills with a denial
                # per scrape); with slowlog disabled above it can only ever read an empty log. It never
                # holds the requirepass/default credential.
                printf 'user metrics on >%s resetkeys resetchannels -@all +ping +info +client|setname +slowlog|get +slowlog|len +latency|latest +latency|histogram +command|info +commandlog|len\n' "$METRICS_PASSWORD"
              } > /conf/valkey.conf
              unset VALKEY_PASSWORD METRICS_PASSWORD
              exec valkey-server /conf/valkey.conf
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-customer-store-valkey
                  key: valkey_password
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-customer-store-metrics
                  key: metrics_password
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /conf
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
        # Memory ratio for MCPValkeyMemoryNearMax (prometheus-rules-mcp-valkey.yaml): the fleet's
        # redis_exporter sidecar (copilot-redis pattern). Non-alpine tag: multi-arch. It logs in as the
        # least-privilege `metrics` ACL user with its own generated password (env, never argv), and its
        # multi-target endpoint is disabled.
        - name: exporter
          image: docker.io/oliver006/redis_exporter:v1.92.1
          # --disable-scrape-endpoint: no multi-target `/scrape?target=` — it would let anything that
          # reaches :9121 point the exporter, with its credential, at an arbitrary host.
          # --config-command=-: no CONFIG GET (the metrics user may not run it; maxmemory comes from INFO).
          args: ["--redis.addr=redis://localhost:6379", "--disable-scrape-endpoint", "--config-command=-"]
          env:
            - name: REDIS_USER
              value: metrics
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-customer-store-metrics
                  key: metrics_password
          ports:
            - name: redis-metrics
              containerPort: 9121
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          emptyDir: {}
        # The rendered config holds requirepass: tmpfs, so it never touches the node's disk.
        - name: conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-valkey
  namespace: platform
  labels:
    app.kubernetes.io/name: mcp-valkey
spec:
  selector:
    app.kubernetes.io/name: mcp-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Scrapes the redis_exporter sidecar for MCPValkeyMemoryNearMax. The fleet PodMonitor only scrapes
# Quarkus `management` ports, so the store needs its own (copilot-redis pattern).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-valkey-metrics
  namespace: platform
  labels:
    app.kubernetes.io/part-of: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-valkey
  namespaceSelector:
    matchNames:
      - platform
  podMetricsEndpoints:
    - port: redis-metrics
      path: /metrics
      interval: 30s
