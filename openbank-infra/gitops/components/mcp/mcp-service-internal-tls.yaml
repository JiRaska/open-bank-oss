#
# Private-CA SERVER certificate for mcp-service's mTLS listener (8443, client auth REQUIRED), the only
# listener the customer MCP route may target (ADR-0383 D5, #16847). The edge gateway presents its own
# client certificate (envoy-gateway/edge-backend-client-tls.yaml) and mcp-service honours the edge's
# client-address header only from that certificate's pinned DNS SAN (MCP_EDGE_GATEWAY_IDENTITY).
# Plain 8150 stays for the existing in-cluster callers.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-service-internal-tls
  namespace: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: mcp-service-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
  dnsNames:
    - mcp-service.platform.svc
    - mcp-service.platform.svc.cluster.local
  issuerRef:
    name: openbank-ca
    kind: ClusterIssuer
    group: cert-manager.io
