# SPDX-License-Identifier: Apache-2.0
# Project the same exchange credential used by the customers realm import.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-customer-exchange-oidc
  namespace: platform
  annotations:
    open-bank.tech/rotation-deadline: "2027-11-25"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: mcp-customer-exchange-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/mcp-service-customer-exchange
        property: client_secret
