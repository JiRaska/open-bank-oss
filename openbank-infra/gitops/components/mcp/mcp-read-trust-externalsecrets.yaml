apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-bound-read-server-trust
  namespace: platform
  annotations:
    open-bank.tech/rotation-deadline: "2027-02-22"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: mcp-bound-read-server-trust
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: keycloak/mcp-bound-read-server-trust
        property: ca.crt
