#
# ESO chart >= 0.17.0 serves external-secrets.io/v1 only (check-eso-crd-api-version).
# ADR-0383 P4 (#16590): secrets of the customer MCP channel's shared store (mcp-valkey).
#
# CLUSTER-GENERATED, not OpenBao. Both values only have to be random and shared between mcp-valkey
# and the mcp-service replicas; neither has a holder outside this Secret, so an OpenBao copy would
# add a manual write step and no consumer. ESO's Password generator draws one 48-character seed
# in-cluster (letters and digits, no symbols) and `refreshPolicy: CreatedOnce` keeps it stable.
# The template derives the two keys from it with DOMAIN-SEPARATED SHA-256, so the Valkey password and
# the key-name HMAC secret are never the same value:
#   valkey_password  = sha256("mcp-valkey-password:" + seed)  -> 64 hex chars (32 bytes)
#   key_hmac_secret  = sha256("mcp-key-hmac:" + seed)         -> 64 hex chars (32 bytes)
# Hex only: safe inside a redis:// URI and inside the Valkey wrapper's quoted config line.
# Consumers: mcp-valkey (REQUIRED refs: it never starts unauthenticated) and mcp-service (OPTIONAL
# refs: it runs with the customer channel off until the Secret exists; enabling the channel without
# them refuses to boot).
# ROTATION: delete Secret platform/mcp-customer-store (ESO regenerates it), then restart mcp-valkey
# AND every mcp-service pod. The restart empties the store (live replay entries and budgets reset,
# and old HMAC'd keys are orphaned), so rotate with the customer channel drained. No other holder.
# Fields per the generators.external-secrets.io/v1alpha1 CRDs of chart 2.11.0
# (apps/external-secrets.yaml): Password requires allowRepeat, length and noUpper.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-customer-store-seed
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: in-cluster store secrets with no external holder; rotate per ROTATION above.
    open-bank.tech/rotation-deadline: "2027-11-19"
  name: mcp-customer-store
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-customer-store
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        valkey_password: '{{ printf "mcp-valkey-password:%s" .password | sha256sum }}'
        key_hmac_secret: '{{ printf "mcp-key-hmac:%s" .password | sha256sum }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-customer-store-seed
