# ADR-0383 P4 (#16590): secrets of the customer MCP channel's shared store. Nothing in this repo holds
# a value. Provisioning: the owner writes both properties once to KV `mcp-service/customer-store`
# (each a random value of at least 32 bytes), the same KV path convention as ADR-0099:
#   valkey_password  -> mcp-valkey `--requirepass` and mcp-service QUARKUS_REDIS_PASSWORD
#   key_hmac_secret  -> mcp-service MCP_CUSTOMER_KEY_HMAC_SECRET (pseudonymises Valkey key names)
# Until it is written, mcp-valkey does not start (required ref) and mcp-service runs with the
# customer channel off (optional refs); enabling the channel without them refuses to boot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-customer-store
  namespace: platform
  annotations:
    # Rotating key_hmac_secret orphans live Valkey entries for one proof window (365 s); rotate the
    # password and the HMAC secret with the customer channel drained.
    open-bank.tech/rotation-deadline: "2027-11-19"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: mcp-customer-store
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: mcp-service/customer-store
        property: valkey_password
    - secretKey: MCP_CUSTOMER_KEY_HMAC_SECRET
      remoteRef:
        key: mcp-service/customer-store
        property: key_hmac_secret
