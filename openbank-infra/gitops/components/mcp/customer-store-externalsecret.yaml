# ESO chart >= 0.17.0 serves external-secrets.io/v1 only (check-eso-crd-api-version).
# ADR-0383 P4 (#16590): secrets of the customer MCP channel's shared store (mcp-valkey).
#
# CLUSTER-GENERATED, not OpenBao — the account-ref pattern (account-ref-externalsecret.yaml, #16863),
# once per secret. Neither value has a holder outside the cluster, so an OpenBao copy would add a
# manual write step and no consumer. INDEPENDENT Password generators, one per value, each 48
# letters/digits (no symbols: safe in a redis:// URI and in the Valkey wrapper's quoted config line),
# `refreshPolicy: CreatedOnce` so the value stays stable across pods and restarts.
#
# One ExternalSecret / Secret per value rather than one: a generator's single output key is `password`,
# so two generators in one ExternalSecret collide on it; one Secret per generator is the shape the
# fleet already runs.
#   mcp-customer-store-valkey / valkey_password  -> mcp-valkey requirepass (REQUIRED ref: it never
#       starts unauthenticated), its exporter, and mcp-service QUARKUS_REDIS_PASSWORD (optional ref)
#   mcp-customer-store-hmac   / key_hmac_secret  -> mcp-service MCP_CUSTOMER_KEY_HMAC_SECRET (optional)
#   mcp-customer-store-metrics / metrics_password -> mcp-valkey `metrics` ACL user (REQUIRED) and its
#       redis_exporter sidecar; that user can run only INFO-class introspection, no data commands
# mcp-service runs with the customer channel off until both exist; enabling it without them refuses
# to boot.
#
# ROTATION (channel drained):
#   valkey password: delete Secret platform/mcp-customer-store-valkey, then restart mcp-valkey and
#     every mcp-service pod. The Valkey restart empties the store (replay entries and budgets reset).
#   metrics password: delete Secret platform/mcp-customer-store-metrics, then restart mcp-valkey
#     (same store-emptying effect as the valkey password).
#   key HMAC secret: delete Secret platform/mcp-customer-store-hmac, then restart every mcp-service
#     pod. Keys hashed with the old secret are orphaned until they expire (<= 1 day + 10 s).
# Fields per the generators.external-secrets.io/v1alpha1 CRDs of chart 2.11.0
# (apps/external-secrets.yaml): Password requires allowRepeat, length and noUpper.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-customer-store-valkey-password
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: in-cluster Valkey password with no external holder; rotate per ROTATION above.
    open-bank.tech/rotation-deadline: "2027-11-19"
  name: mcp-customer-store-valkey
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-customer-store-valkey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        valkey_password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-customer-store-valkey-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-customer-store-key-hmac
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: in-cluster key-name HMAC secret with no external holder; rotate per ROTATION above.
    open-bank.tech/rotation-deadline: "2027-11-19"
  name: mcp-customer-store-hmac
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-customer-store-hmac
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        key_hmac_secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-customer-store-key-hmac
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-customer-store-metrics-password
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: in-cluster exporter ACL password with no external holder; rotate per ROTATION above.
    open-bank.tech/rotation-deadline: "2027-11-19"
  name: mcp-customer-store-metrics
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-customer-store-metrics
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        metrics_password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-customer-store-metrics-password
