#
# ESO chart >= 0.17.0 serves external-secrets.io/v1 only (check-eso-crd-api-version).
# HMAC key for mcp-service's caller-scoped account handles (`accountRef`, #16678).
#
# CLUSTER-GENERATED, not OpenBao. The key only has to be random and identical across mcp-service
# replicas; it has no holder outside this Secret, so an OpenBao copy would add a manual write step
# and no consumer. ESO's Password generator draws it in-cluster (48 characters = 48 bytes, above
# the 32-byte minimum AccountRefKeyConfig enforces) and `refreshPolicy: CreatedOnce` keeps it stable,
# so refs keep resolving across pods and restarts. While the Secret is absent the deployment's
# optional secretKeyRef lets the service start on a per-process key (WARN + gauge
# openbank_mcp_account_ref_ephemeral_key=1); refs then fail closed across pods.
# ROTATION: delete Secret platform/mcp-service-account-ref (ESO regenerates it), then restart the
# mcp-service pods. Every outstanding accountRef is refused afterwards; a model re-reads
# list_accounts. No other holder to update.
# Fields per the generators.external-secrets.io/v1alpha1 CRDs of chart 2.11.0
# (apps/external-secrets.yaml): Password requires allowRepeat, length and noUpper.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-service-account-ref-key
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: in-cluster HMAC key with no external holder; rotate per ROTATION above.
    open-bank.tech/rotation-deadline: "2027-11-19"
  name: mcp-service-account-ref
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-service-account-ref
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      data:
        OPENBANK_MCP_ACCOUNT_REF_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-service-account-ref-key
