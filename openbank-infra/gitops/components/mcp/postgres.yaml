# Single-owner Postgres for mcp-service (ADR-0224 D2 agent-session store), reconciled by the
# CNPG operator. CNPG generates the `mcp-db-app` secret and `mcp-db-rw` Service.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mcp-db
  namespace: platform
spec:
  monitoring:
    enablePodMonitor: true
    # FinOps/observability: cnpg_pg_settings_setting is one series per Postgres GUC per
    # instance — 24 963 series on 2026-09-12, the largest metric name in a 645 k-series
    # Prometheus (12 h retention, no long-term store). Exactly ONE of those GUCs is read
    # by anything here: `max_connections`, by the PostgresConnectionsSaturated alert
    # (prometheus-rules-db.yaml) and by dashboard-openbank-postgres. Everything else is
    # static configuration whose authoritative copy is this manifest, so it is dropped at
    # scrape. RE2 has no negative lookahead, hence mark-then-drop rather than one regex.
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__, name]
        regex: cnpg_pg_settings_setting;max_connections
        targetLabel: __tmp_cnpg_keep
        replacement: "1"
      - sourceLabels: [__name__, __tmp_cnpg_keep]
        regex: cnpg_pg_settings_setting;
        action: drop
      - regex: __tmp_cnpg_keep
        action: labeldrop
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    storageClass: gp3
    size: 2Gi
  # The service connects to database `openbank_mcp` (QUARKUS_DATASOURCE_*_URL); without this
  # initdb CNPG bootstraps the default `app` database and the pod crashloops with
  # PSQLException: database "openbank_mcp" does not exist (surfaced by the ADR-0224 E2E, #2750).
  # Applies at cluster bootstrap only — an existing cluster needs the database created by hand.
  bootstrap:
    initdb:
      database: openbank_mcp
      owner: app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      # Bound WAL so a checkpoint spike cannot fill the 2Gi volume (#1432) — mandatory once
      # archiving is on, because an archive that falls behind keeps segments on the volume.
      max_wal_size: "512MB"
  # WAL archiving + daily base backups to S3 (ADR-0035, #863 pattern). Credentials via EKS Pod
  # Identity on the mcp-db ServiceAccount (aws/.../db-backups.tf) — barman reads the SDK chain,
  # no secret. Sandbox S3 lifecycle expires after 35d; prod needs compliance retention.
  #
  # This cluster had NO backup of any kind until #3555: `instances: 1`, no replica, no WAL
  # archive, so a lost EBS volume or a failed node reclaim was total data loss. It went unseen
  # because docs/runbooks/svc-mcp.md promised on-call "RPO target: <= 5 min (continuous
  # archiving)" — the runbook generator decided "has a backup" with a whole-file substring test
  # that matched the OPA bundle's embedded rules.yaml prose (#3508 removed the embed, #3551 made
  # the detection structural, and only then did the gap become visible as a gap).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://openbank-sandbox-db-backups/mcp-db
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mcp-db-daily
  namespace: platform
spec:
  # CNPG reads this only at creation: without it the cluster has no recovery
  # point until the first scheduled run, while Ready and ContinuousArchiving
  # both read True. Adding it to a cluster that already exists is inert.
  immediate: true
  schedule: "0 44 4 * * *"
  backupOwnerReference: self
  cluster:
    name: mcp-db
