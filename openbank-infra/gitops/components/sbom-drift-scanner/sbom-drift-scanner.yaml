    namespace: admin-ui

---
# ─── CronJob ────────────────────────────────────────────────────────────────

apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbom-drift-scanner
  namespace: admin-ui
  labels:
    app.kubernetes.io/name: sbom-drift-scanner
    app.kubernetes.io/part-of: admin-ui
spec:
  # 03:10 UTC daily — after infra-vuln-scanner's 02:15 slot, before peak traffic.
  schedule: "10 3 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # failedJobsHistoryLimit: 1 — keep the LATEST failure for triage, not an archive.
  # kube-prometheus-stack's KubeJobFailed fires per surviving failed Job OBJECT, so a
  # limit of 3 turns one recurring failure into three permanent alerts. Worse, the pods
  # are garbage-collected long before the Job object is, so the extra tombstones carry
  # no diagnostic value at all — only the alert. Measured 2026-08-02: KubeJobFailed was
  # 11 of the 37 firing alerts, 8 of them with pods=0 and the oldest dating to 07-12.
  # One failure per CronJob still alerts (a job that keeps failing should), the
  # duplicates stop.
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sbom-drift-scanner
        spec:
          serviceAccountName: sbom-drift-scanner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # Single-phase design (see the design note above for why this isn't
          # multi-tool like infra-vuln-scanner): everything needed — kubectl
          # for pod discovery, git for the unauthenticated public-repo clone —
          # is already bundled in alpine/k8s, so one init container does the
          # whole compare and the main container just publishes it.
          initContainers:
            - name: discover-and-compare
              image: docker.io/alpine/k8s:1.34.1
              command: ["/bin/sh", "-ec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  set -eu
                  echo "Cloning openbank-oss (public repo, unauthenticated, depth=1)..."
                  git clone --depth 1 --quiet \
                    https://github.com/JiRaska/open-bank-oss.git /tmp/repo

                  cat > /tmp/compare.py << 'PYEOF'
                  import json, re, subprocess

                  # (service id, namespace, gitops manifest path, container name in
                  # the manifest — usually == service id, but the manifest's own
                  # `- name:` key is the ground truth to grep against).
                  COMPONENTS = [
                      ("ledger-service", "ledger",
                       "openbank-infra/gitops/components/ledger/ledger-service.yaml"),
                      ("transaction-service", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("account-service", "accounts",
                       "openbank-infra/gitops/components/accounts/account-service.yaml"),
                      ("balance-service", "balances",
                       "openbank-infra/gitops/components/balances/balance-service.yaml"),
                      ("sepa-payment", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("sepa-instant", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("domestic-payment", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("clearing-service", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("swift-service", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("fx-service", "fx",
                       "openbank-infra/gitops/components/fx-service/fx-service.yaml"),
                      ("lending-service", "lending",
                       "openbank-infra/gitops/components/lending/lending-service.yaml"),
                      ("sca-service", "sca",
                       "openbank-infra/gitops/components/sca/sca-service.yaml"),
                      ("consent-service", "consent",
                       "openbank-infra/gitops/components/consent/consent-service.yaml"),
                      ("fraud-service", "fraud",
                       "openbank-infra/gitops/components/fraud-service/fraud-service.yaml"),
                      ("billing-service", "billing",
                       "openbank-infra/gitops/components/billing/billing-service.yaml"),
                      ("settlement-service", "payments",
                       "openbank-infra/gitops/components/payments/payments-services.yaml"),
                      ("sanctions-service", "sanctions",
                       "openbank-infra/gitops/components/sanctions-service/sanctions-service.yaml"),
                  ]

                  def running_image(svc, ns):
                      """The service's own container's running image (tag form), by
                      container NAME — not index 0, several money-path pods run an OPA
                      sidecar that isn't consistently container[0] (confirmed live)."""
                      try:
                          jsonpath = f'{{.items[0].status.containerStatuses[?(@.name=="{svc}")].image}}'
                          out = subprocess.run(
                              ["kubectl", "get", "pods", "-n", ns,
                               "-l", f"app.kubernetes.io/name={svc}",
                               "--field-selector=status.phase=Running",
                               "-o", f"jsonpath={jsonpath}"],
                              capture_output=True, text=True, timeout=15,
                          )
                          image = out.stdout.strip()
                          return image or None
                      except Exception as e:
                          print(f"  WARN: pod lookup failed for {ns}/{svc}: {e}")
                          return None

                  def declared_image(svc, manifest_path):
                      """The image this service's container currently declares in the
                      gitops manifest on origin/main (the checked-out clone)."""
                      try:
                          with open(f"/tmp/repo/{manifest_path}") as f:
                              text = f.read()
                          # Find the `- name: <svc>` container block, then its own
                          # `image:` line (not a sidecar's, further down/up in the file).
                          block_re = re.compile(
                              rf'-\s*name:\s*{re.escape(svc)}\b.*?image:\s*(\S+)',
                              re.DOTALL,
                          )
                          m = block_re.search(text)
                          return m.group(1) if m else None
                      except Exception as e:
                          print(f"  WARN: manifest read failed for {manifest_path}: {e}")
                          return None

                  results = {}
                  for svc, ns, manifest_path in COMPONENTS:
                      print(f"[{svc}] comparing running pod vs gitops...", flush=True)
                      running = running_image(svc, ns)
                      if not running:
                          print(f"  SKIP {svc}: no running pod found", flush=True)
                          results[svc] = {"status": "no-pod-found"}
                          continue
                      declared = declared_image(svc, manifest_path)
                      in_sync = bool(declared) and running == declared
                      print(f"  running={running} declared={declared} inSync={in_sync}", flush=True)
                      results[svc] = {
                          "status": "checked",
                          "runningImage": running,
                          "declaredImage": declared,
                          "inSync": in_sync,
                      }

                  # Findings that must not sit silently in a ConfigMap.
                  #
                  # `no-pod-found` for a money-path service is NOT a benign skip: a service
                  # with zero running pods is either scaled to zero or unable to start at all
                  # (e.g. denied at admission). sepa-payment reported `no-pod-found` on the
                  # morning of 2026-07-12 while it was in fact down and un-admittable, and
                  # because this job exited 0 and only wrote a ConfigMap, nothing escalated.
                  # Anything actionable now FAILS the Job, which surfaces via the
                  # SbomDriftScannerFailing / kube_job_failed alert (prometheus-rules.yaml).
                  drifted = [s for s, r in results.items()
                             if r.get("status") == "checked" and not r.get("inSync")]
                  missing = [s for s, r in results.items()
                             if r.get("status") == "no-pod-found"]

                  summary = {
                      # State plainly what this report does and does NOT cover, so a reader
                      # of the ConfigMap cannot mistake it for an SBOM/attestation check.
                      "checkScope": "gitops-image-tag-sync-only",
                      "doesNotVerify": "SBOM attestations — see CI gate fleet-attestation.yml",
                      "coverage": "money-path services only (not the full openbank-* fleet)",
                      "scannedAt": None,
                      "services": results,
                      "driftedServices": drifted,
                      "noPodServices": missing,
                      "ok": not drifted and not missing,
                  }
                  with open("/work/final.json", "w") as f:
                      json.dump(summary, f)
                  print(f"Written /work/final.json: {len(results)} services", flush=True)

                  if drifted or missing:
                      print(f"FAIL drifted={drifted} noPod={missing}", flush=True)
                      # Exit AFTER writing the report: the publish container still needs it,
                      # so the ConfigMap reflects the failure rather than going stale.
                      raise SystemExit(1)
                  print("OK: every money-path service runs its declared image.", flush=True)
                  PYEOF

                  # `|| true`: a findings-exit must still let the publish container run and
                  # surface the report. The Job is failed explicitly by the publish container
                  # once it has published, so the alert fires WITH a readable report attached.
                  python3 /tmp/compare.py || echo "findings" > /work/findings
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp

          containers:
            - name: publish
              image: docker.io/alpine/k8s:1.34.1
              command: ["/bin/sh", "-ec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  set -eu
                  NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  sed "s/\"scannedAt\": null/\"scannedAt\": \"${NOW}\"/" /work/final.json > /tmp/final.json

                  echo "Publishing sbom-drift ConfigMap..."
                  cat /tmp/final.json
                  kubectl create configmap sbom-drift \
                    --namespace admin-ui \
                    --from-file=sbom-drift.json=/tmp/final.json \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "Published."

                  # Publish FIRST, then fail — so the alert fires with the report already
                  # readable in the ConfigMap. A finding that only ever lands in a ConfigMap
                  # is a finding nobody acts on; this Job failing is what raises the alarm
                  # (SbomDriftScannerFailing in prometheus-rules.yaml).
                  if [ -f /work/findings ]; then
                    echo "ERROR: drift or missing pods detected — see the report above." >&2
                    exit 1
                  fi
                  echo "Done."
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
