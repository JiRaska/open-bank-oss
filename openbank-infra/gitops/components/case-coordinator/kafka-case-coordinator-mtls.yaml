# Kafka mTLS identity + ACLs for case-coordinator-agent (ADR-0137 fleet gate, ADR-0244).
#
# case-coordinator-agent produces terminal HITL proposals and consumes the strict agent-audit
# stream only for kill-switch set/clear events (ADR-0244 D7).
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for all of
# this service's Kafka traffic. The User resources live in `messaging` (where the Strimzi User
# Operator watches); the minted secrets are projected into `platform` by the ExternalSecrets
# below — the same cross-namespace pattern agent-service established for this namespace.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # Certs (KafkaUser → Strimzi secret → ESO projection) must land before the Deployment
    # rolls pods onto mTLS; lower waves sync first.
    argocd.argoproj.io/sync-wave: "-2"
  name: case-coordinator
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Produce case-terminal HITL proposals (ADR-0244 D7).
      - resource:
          type: topic
          name: proposal-events
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.agent.audit.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      # Runtime kill-switch events: case-coordinator consumes `agent.killswitch.set` / `.cleared`
      # emitted by agent-service and traps failures to its DLQ.
      - resource:
          type: topic
          name: agent-kill-switch-events-in
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: openbank.dlq.case-coordinator.agent-kill-switch-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
      # Phase 1 deploy uses SmallRye's fallback group id. A properties-file override is a
      # separate second deploy after the image containing the channel is live (SRMSG00071).
      - resource:
          type: group
          name: case-coordinator-agent
          patternType: literal
        operations: [Read]
        host: "*"
---
# ── ExternalSecret: case-coordinator keystore ───────────────────────────────
# `dataFrom.extract` copies every key of the source secret verbatim, preserving the BINARY
# PKCS#12 (`user.p12`) byte-for-byte. deletionPolicy: Retain so a transient store/RBAC blip
# never deletes a live keystore out from under a running pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: case-coordinator-kafka-keystore
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kafka-messaging-certs
  target:
    name: case-coordinator-kafka-keystore
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: case-coordinator
---
# The cluster CA truststore Secret lives in namespace `platform` and is declared ONCE,
# by the `agent` component (agent/kafka-agent-mtls.yaml, #696). It is not repeated here.
#
# It used to be: this file carried a byte-identical copy (#4236), so ExternalSecret
# platform/kafka-cluster-ca-truststore was in the desired state of TWO Applications.
# ArgoCD tracked it for `agent` and answered `SharedResourceWarning` on
# `case-coordinator`, which therefore reported OutOfSync permanently — a real drift
# signal spent on a copy that was never going to differ. Both Applications sync into
# `platform`, so whichever ran last would have won silently had they ever diverged.
#
# case-coordinator-service consumes the Secret by name; it does not need to declare it.
