# ExternalSecrets for case-coordinator-agent (platform namespace).
#
# OIDC_CLIENT_SECRET: the shared `openbank-services` realm client, read out of the shared
# `account-service` Vault KV entry — the same entry 28 other services read (the delegation
# external-secret-oidc.yaml comment documents why a per-service KV entry does not exist).
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: case-coordinator-oidc
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: case-coordinator-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# CASE_COORDINATOR_MODEL_API_KEY: LiteLLM virtual key for the synthesis model call
# (ADR-0244 D9). Reuses the shared agent-plane key (KEY_AGENT_SERVICE) — a per-service
# LiteLLM virtual key is a Vault admin action, not something this repo can provision.
# The service degrades the synthesis call (never crashloops) if the key is absent.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: case-coordinator-litellm
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: case-coordinator-litellm
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: CASE_COORDINATOR_MODEL_API_KEY
      remoteRef:
        key: litellm
        property: KEY_AGENT_SERVICE
