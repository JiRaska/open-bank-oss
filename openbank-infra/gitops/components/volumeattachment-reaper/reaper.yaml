# Stale VolumeAttachment reaper (ADR-0325 follow-up, #11304).
#
# WHY. When Karpenter deletes a Node after a spot interruption, the EC2 instance
# is already terminated (its EBS volumes are physically detached), but the
# VolumeAttachment objects that named that node can linger. The attach-detach
# controller then refuses to attach the same volume to the node the pod was
# rescheduled onto ("Waiting for detach ... already exclusively attached to one
# node"). Measured 2026-09-28 across five spot interruptions: single-instance
# CNPG primaries (tpp-registry, kyb, audit, ...) stayed down until a human
# deleted those objects by hand, twice.
#
# WHAT. Every 2 minutes, delete a VolumeAttachment only if the Node it names
# does not exist, checked twice 20 s apart so one transient API answer cannot
# trigger a delete. A VolumeAttachment for a node that does not exist has no
# real attachment behind it, so deleting it releases nothing that is in use.
# It never touches an attachment on a live node, NotReady or not.
#
# RBAC is the minimum: read Nodes, list and delete VolumeAttachments.
apiVersion: v1
kind: Namespace
metadata:
  name: volumeattachment-reaper
  labels:
    app.kubernetes.io/part-of: volumeattachment-reaper
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volumeattachment-reaper
  namespace: volumeattachment-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volumeattachment-reaper
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volumeattachment-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volumeattachment-reaper
subjects:
  - kind: ServiceAccount
    name: volumeattachment-reaper
    namespace: volumeattachment-reaper
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volumeattachment-reaper
  namespace: volumeattachment-reaper
  labels:
    app.kubernetes.io/part-of: volumeattachment-reaper
  annotations:
    # Budget for CronJobSuccessStale (prometheus-rules-jobs.yaml): two missed runs of '*/2 * * * *' plus slack.
    openbank.tech/max-success-age-seconds: "900"
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 90
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: volumeattachment-reaper
        spec:
          restartPolicy: Never
          serviceAccountName: volumeattachment-reaper
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              # Same image and pin as finops-scaledown: kubectl plus a real shell.
              image: docker.io/alpine/k8s:1.34.12
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  stale() {
                    local nodes
                    nodes=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
                    # Refuse to act on an empty node list: that is an API problem, not
                    # a cluster with no nodes, and it would mark every attachment stale.
                    [ -n "$nodes" ] || { echo '{"event":"abort","reason":"empty node list"}'; exit 1; }
                    kubectl get volumeattachments -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.nodeName}{"\n"}{end}' \
                      | while read -r va node; do
                          case " $nodes " in *" $node "*) ;; *) echo "$va $node";; esac
                        done | sort
                  }
                  first=$(stale); sleep 20; second=$(stale)
                  both=$(comm -12 <(printf '%s\n' "$first") <(printf '%s\n' "$second") | sed '/^$/d')
                  if [ -z "$both" ]; then echo '{"event":"noop"}'; exit 0; fi
                  printf '%s\n' "$both" | while read -r va node; do
                    echo "{\"event\":\"delete\",\"volumeattachment\":\"${va}\",\"missing_node\":\"${node}\"}"
                    kubectl delete volumeattachment "$va" --wait=false
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          volumes:
            - name: tmp
              emptyDir: {}
          nodeSelector:
            workload: observability
          tolerations:
            - key: workload
              operator: Equal
              value: observability
              effect: NoSchedule
