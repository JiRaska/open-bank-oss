# pension-service OIDC client secret from Vault -> pension-service-oidc Secret (key
# OIDC_CLIENT_SECRET), shared openbank-services realm client. The remoteRef key is the shared
# `account-service` entry, as for every service (rules.yaml: oidc_secret_convention).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # ADR-0279 #18: Shared openbank-services client secret. Rotated with the realm client; the
    # date is the outer bound, not a promise it lives that long.
    openbank.io/rotation-deadline: "2027-09-05"
  name: pension-service-oidc
  namespace: pension
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: pension-service-oidc
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: account-service
        property: OIDC_CLIENT_SECRET
---
# ADR-0334 S8: pension-service's OWN Keycloak client `openbank-pension` (ROLE_API only), used ONLY
# by the pension-fund-service rest-client (FundAdministrationPort: holdings read, unit orders).
# pension-fund-service admits those actions for service-account-openbank-pension alone, never the
# shared `openbank-services` account, so this is deliberately NOT the shared `account-service` KV
# entry.
#
# KV layout is ADR-0099's `openbank/keycloak/<service>` (keys `client_id` = the client's Keycloak
# UUID, `client_secret`). Written ONCE by the owner's provisioning when the client is created in
# the live realm (runbook 0009, "Per-service M2M client"); nothing in this repo mints or holds the
# value. The consuming env ref is `optional: false`: seed Vault BEFORE this manifest syncs, or the
# new pod stays in CreateContainerConfigError.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # First rotation is due within 30 days; rollout and rotation remain tracked by #12350.
    openbank.io/rotation-deadline: "2026-11-08"
  name: pension-service-m2m-oidc
  namespace: pension
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: pension-service-m2m-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_PENSION_CLIENT_SECRET
      remoteRef:
        key: keycloak/pension-service
        property: client_secret
