# pension-service: participant-side pension contracts (ADR-0334 S1). Reactive Postgres datasource
# + Flyway JDBC migrations against the single-owner CNPG cluster. Publishes and consumes nothing
# yet and calls no other service. OIDC bearer validation points at Keycloak. Reachable only
# in-cluster via ClusterIP, no ingress — the customer path is customer-edge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pension-service
  namespace: pension
  labels:
    app.kubernetes.io/name: pension-service
    app.kubernetes.io/part-of: pension
spec:
  replicas: 1
  # Terminate-first, deliberately. With the default RollingUpdate a ONE-replica Deployment must
  # schedule the new pod BEFORE it may stop the old one, so the rollout needs room for two pods —
  # and the old pod holds exactly the resources the new one needs. On a cluster with no spare room
  # that is a deadlock the rollout never escapes. The trade is a few seconds of unavailability per
  # deploy, which a single-replica service already has. A multi-replica money-path service must
  # NOT copy this.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pension-service
  template:
    metadata:
      annotations:
        # Rolls the pod when the OPA bundle changes — subPath mounts do NOT hot-reload.
        # Kept in sync by gen-pension-opa-bundle.sh (do not hand-edit).
        openbank.tech/policy-checksum: "99c3cb3f4c27e8e8"
      labels:
        app.kubernetes.io/name: pension-service
        app.kubernetes.io/part-of: pension
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pension-service
          # First build lands via auto-deploy on the merge that adds openbank-pension-service to
          # ALL_SERVICES; the auto-deploy gitops PR rewrites this pin to the built sha.
          image: 265175468565.dkr.ecr.eu-north-1.amazonaws.com/openbank-pension-service:sandbox-000000000
          imagePullPolicy: IfNotPresent
          ports:
            # HTTP 8171 and management 8090 — both read off the service's own application.yaml
            # (quarkus.http.port / quarkus.management.port). The management port is NOT the
            # fleet-common 8085 here; probes below target 8090 deliberately.
            - name: http
              containerPort: 8171
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8090
          env:
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /mnt/internal-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /mnt/internal-tls/tls.key
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            # Keep old callers working until the separately verified HTTPS cutover.
            - name: QUARKUS_HTTP_INSECURE_REQUESTS
              value: enabled
            - name: QUARKUS_HTTP_SSL_PROTOCOLS
              value: TLSv1.3
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_RELOAD_PERIOD
              value: 1h
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4317"
            # Onboarding/transfer (S2) and exit (S5) workflows on the shared Temporal cluster. The
            # namespace is registered by the temporal-namespace-registration Job and paired with the
            # `pension` entry in temporal-platform-ingress (without it the worker's gRPC is dropped).
            # Each workflow family polls its own task queue (ADR-0334 S8).
            - name: OPENBANK_TEMPORAL_ENABLED
              value: "true"
            - name: OPENBANK_TEMPORAL_SERVER_URL
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: OPENBANK_TEMPORAL_NAMESPACE
              value: openbank-pension
            - name: OPENBANK_PENSION_ONBOARDING_TASK_QUEUE
              value: pension-onboarding
            - name: OPENBANK_PENSION_EXIT_TASK_QUEUE
              value: pension-exit
            - name: OPENBANK_PENSION_WORKER_ENABLED
              value: "true"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # Reactive + JDBC (Flyway) legs onto the same CNPG primary. The service's
            # application.yaml hardcodes localhost for both; these env vars override it, since an
            # env source outranks application.yaml in SmallRye's ordinal.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://pension-db-rw.pension.svc:5432/openbank_pension
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://pension-db-rw.pension.svc:5432/openbank_pension
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pension-db-app
                  key: password
            # Keycloak runs in `iam`, not `platform`. A wrong host does not fail the boot (OIDC
            # defers discovery to the first request) — it just makes every authenticated call
            # fail later with `Name does not resolve`.
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak.iam.svc:8080/realms/openbank
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pension-service-oidc
                  key: OIDC_CLIENT_SECRET
            # ADR-0334 S8: pension-service's OWN client (openbank-pension, ROLE_API only) for the
            # FundAdministrationPort REST adapter to pension-fund-service. optional: false so an
            # unseeded Vault entry is a loud CreateContainerConfigError, never an empty credential.
            - name: OIDC_PENSION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pension-service-m2m-oidc
                  key: OIDC_PENSION_CLIENT_SECRET
                  optional: false
            - name: PENSION_FUND_SERVICE_URL
              value: http://pension-fund-service.pension-fund.svc:8162
            # #12378 payment adapters (pension-service's own OIDC client).
            - name: STANDING_ORDER_SERVICE_URL
              value: http://standing-order-service.payments.svc:8121
            - name: SDD_SERVICE_URL
              value: http://sdd-service.sdd.svc:8129
            - name: DOMESTIC_PAYMENT_URL
              value: http://domestic-payment.payments.svc:8116
            # Kafka mTLS (ADR-0137, kafka-pension-mtls.yaml) — consumes domestic-payment status
            # changes only, and writes only its own dead-letter topic.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS
              value: openbank-cluster-kafka-bootstrap.messaging.svc:9093
            - name: KAFKA_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: /mnt/kafka-keystore/user.p12
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pension-service-kafka-keystore
                  key: user.password
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: /mnt/kafka-truststore/ca.p12
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-ca-truststore
                  key: ca.password
            # issue #686: group.id / auto.offset.reset come from the pension-service-msg-override
            # ConfigMap (a properties file), never dotted YAML keys or env vars.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /mnt/msg-config/override.properties
            # Identity and SCA checks (#12377), authenticated as openbank-pension.
            - name: SCA_SERVICE_URL
              value: http://sca-service.sca.svc:8110
            - name: PARTY_SERVICE_URL
              value: http://party-service.party.svc:8111
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service.accounts.svc:8100
            # OPA sidecar enforced from the first rollout: pension_rest_ext.rego grants the
            # participant actions to the edge principal only, and no service-account reaches a
            # write by any rule.
            - name: AUTHZ_ENFORCE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: internal-tls
              mountPath: /mnt/internal-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: kafka-keystore
              mountPath: /mnt/kafka-keystore
              readOnly: true
            - name: kafka-truststore
              mountPath: /mnt/kafka-truststore
              readOnly: true
            - name: msg-override
              mountPath: /mnt/msg-config
              readOnly: true
        # OPA policy decision point (ADR-0034). Co-located sidecar the app reaches on
        # localhost:8181 (AuthorizeInterceptor default). Bundle mounted read-only from the
        # pension-opa-bundle ConfigMap generated by gen-pension-opa-bundle.sh.
        - name: opa
          image: docker.io/openpolicyagent/opa:1.21.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            # Bind on the pod network (not 127.0.0.1) so kubelet httpGet probes reach /health.
            # The image is scratch (no shell), so an exec probe isn't possible. Reachability is
            # fenced by the NetworkPolicy; OPA serves only policy decisions.
            - --addr=0.0.0.0:8181
            - --log-level=info
            # `--bundle` is REQUIRED, not decorative: without it OPA loads /bundle as a plain data
            # directory and merges every YAML into the root data document, so rules-data.yaml and
            # agents-data.yaml collide and the sidecar dies with `merge error`. In bundle mode the
            # roots declared in .manifest keep them apart. Mount paths below must match.
            - --bundle
            - /bundle
          ports:
            - name: opa
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle/rest.rego
              subPath: rest.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/pension_rest_ext.rego
              subPath: pension_rest_ext.rego
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/agents.rego
              subPath: agents.rego
              readOnly: true
            # Data files land under the bundle roots declared in .manifest (`agents`, `rules`) —
            # NOT flat in /bundle, which is what produced the merge error above.
            - name: opa-bundle
              mountPath: /bundle/agents/data.yaml
              subPath: agents-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/rules/data.yaml
              subPath: rules-data.yaml
              readOnly: true
            - name: opa-bundle
              mountPath: /bundle/.manifest
              subPath: manifest.json
              readOnly: true
            # OPA writes temp files during bundle load — required with readOnlyRootFilesystem.
            - name: opa-tmp
              mountPath: /tmp
      volumes:
        - name: internal-tls
          secret:
            secretName: pension-service-internal-tls
        - name: tmp
          emptyDir: {}
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: pension-opa-bundle
        - name: kafka-keystore
          secret:
            secretName: pension-service-kafka-keystore
        - name: kafka-truststore
          secret:
            secretName: kafka-cluster-ca-truststore
        - name: msg-override
          configMap:
            name: pension-service-msg-override
---
apiVersion: v1
kind: Service
metadata:
  name: pension-service
  namespace: pension
  labels:
    app.kubernetes.io/name: pension-service
    app.kubernetes.io/part-of: pension
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pension-service
  ports:
    - name: http
      port: 8171
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
    - name: management
      port: 8090
      targetPort: management
