# Kafka mTLS identity + ACLs for openbank-pension-service (ADR-0137 Tier 2, ADR-0334, #12392).
#
# pension-service PRODUCES participant notices onto openbank.notification.requests
# (delivery stays with notification-service) and CONSUMES domestic payment status
# changes to record payout settlement. The latter uses a dedicated consumer group
# and dead-letter topic (#12378, #12392).
#
# Identity model (ADR-0137): one KafkaUser = one mTLS client cert = one principal for
# all of this service's Kafka traffic. The Strimzi User Operator mints the per-user
# Secret of the same name in `messaging`; kafka-mtls-externalsecrets.yaml projects it
# into `pension`.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  annotations:
    # Certs (KafkaUsers→Strimzi secrets→ESO projection) must land before the
    # pension-service pods roll onto mTLS; lower waves sync first.
    argocd.argoproj.io/sync-wave: "-2"
  name: pension-service
  namespace: messaging
  labels:
    strimzi.io/cluster: openbank-cluster
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Produce participant notices → notification-service consumes (#12392).
      - resource:
          type: topic
          name: openbank.notification.requests
          patternType: literal
        operations: [Write, Describe]
      # Payout settlement: consume domestic-payment status changes (#12378).
      - resource:
          type: topic
          name: openbank.domestic.payment.events
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: group
          name: pension-service-domestic-payment
          patternType: literal
        operations: [Read]
        host: "*"
      # The consumer must be able to write its own dead-letter records (#5745).
      - resource:
          type: topic
          name: openbank.dlq.pension.domestic-payment-events-in
          patternType: literal
        operations: [Write, Describe]
        host: "*"
