      timeout: 5s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────
  # Analytics sink (event-fed warehouse writer — ADR-0022/0023)
  # Consumes the same outbox/domain-event topics as the audit service and writes the bronze
  # log to ClickHouse. Owns no OLTP database (no postgres/flyway). The three build-time gates
  # are enabled here so all the real adapters run end-to-end: F1 ClickHouse sink, F6 Vault
  # crypto-shred, F7 Apicurio schema governance. HTTP on 8134.
  # ─────────────────────────────────────────────
  analytics-sink:
    build:
      context: ..
      dockerfile: openbank-infra/docker/services/standalone-service.Dockerfile
      args:
        SERVICE_DIR: openbank-analytics-sink
    image: openbank/analytics-sink:local
    container_name: openbank-analytics-sink
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_SMALLRYE_REACTIVE_MESSAGING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # F1 — durable bronze over the ClickHouse HTTP interface.
      ANALYTICS_SINK_TYPE: clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: openbank_analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CHANGE_ME_LOCAL_DEV_ONLY}
      # F6 — crypto-shred via Vault Transit API (engine + analytics-* policy provisioned in
      # openbao/init). ANALYTICS_VAULT_* are the analytics-sink's own config property names
      # (VaultCryptoErasure adapter) — unchanged; only the backing service is OpenBao now.
      ANALYTICS_ERASURE_BACKEND: vault
      ANALYTICS_VAULT_URL: http://openbao:8200
      ANALYTICS_VAULT_TOKEN: ${BAO_DEV_ROOT_TOKEN}
      ANALYTICS_VAULT_TRANSIT_MOUNT: transit
      ANALYTICS_VAULT_KEY_PREFIX: analytics
      # F7 — schema governance catalogue loaded from the Apicurio registry.
      ANALYTICS_SCHEMA_BACKEND: apicurio
      ANALYTICS_SCHEMA_APICURIO_URL: http://schema-registry:8081
      ANALYTICS_SCHEMA_APICURIO_GROUP: default
      QUARKUS_DEV_UI_ENABLED: "false"
      QUARKUS_HTTP_PORT: 8134
      QUARKUS_LOG_LEVEL: INFO
      QUARKUS_LOG_CONSOLE_JSON: "false"
      QUARKUS_MANAGEMENT_ENABLED: "true"
      QUARKUS_MANAGEMENT_PORT: 8085
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/openbank
      QUARKUS_OIDC_CLIENT_ID: openbank-services
      QUARKUS_OIDC_CREDENTIALS_SECRET: changeme_local_oidc_client_dev_only
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      QUARKUS_SHUTDOWN_TIMEOUT: 30S
    ports:
      - "8134:8134"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      openbao:
        condition: service_healthy
      schema-registry:
        condition: service_started
    networks:
      - openbank-net
    # Probe liveness, not readiness: readiness is intentionally lag-gated (F8 / DORA RPO),
    # so on a cold start replaying history it stays DOWN until caught up — that is healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/q/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

