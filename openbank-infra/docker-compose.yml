      QUARKUS_HTTP_HEADER__X_CONTENT_TYPE_OPTIONS__VALUE: nosniff
      QUARKUS_HTTP_HEADER__X_FRAME_OPTIONS__VALUE: DENY
      QUARKUS_HTTP_HEADER__X_XSS_PROTECTION__VALUE: "1; mode=block"
      QUARKUS_HTTP_HEADER__REFERRER_POLICY__VALUE: strict-origin-when-cross-origin
      QUARKUS_HTTP_HEADER__PERMISSIONS_POLICY__VALUE: "geolocation=(), microphone=(), camera=()"
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'"
      QUARKUS_HTTP_HEADER__STRICT_TRANSPORT_SECURITY__VALUE: "max-age=31536000; includeSubDomains"
    ports:
      - "8120:8120"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - openbank-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  product-catalog:
    build:
      context: ..
      dockerfile: openbank-infra/docker/services/standalone-service.Dockerfile
      args:
        SERVICE_DIR: openbank-product-catalog
    image: openbank/product-catalog:local
    container_name: openbank-product-catalog
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: 8104
      QUARKUS_DEV_UI_ENABLED: "false"
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      QUARKUS_SHUTDOWN_TIMEOUT: 30S
      QUARKUS_HTTP_HEADER__X_CONTENT_TYPE_OPTIONS__VALUE: nosniff
      QUARKUS_HTTP_HEADER__X_FRAME_OPTIONS__VALUE: DENY
      QUARKUS_HTTP_HEADER__X_XSS_PROTECTION__VALUE: "1; mode=block"
      QUARKUS_HTTP_HEADER__REFERRER_POLICY__VALUE: strict-origin-when-cross-origin
      QUARKUS_HTTP_HEADER__PERMISSIONS_POLICY__VALUE: "geolocation=(), microphone=(), camera=()"
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'"
      QUARKUS_HTTP_HEADER__STRICT_TRANSPORT_SECURITY__VALUE: "max-age=31536000; includeSubDomains"
    ports:
      - "8104:8104"
    networks:
      - openbank-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8104/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  admin-ui:
    build:
      context: ..
      dockerfile: openbank-admin-ui/Dockerfile
      args:
        BUILD_VERSION: ${ADMIN_UI_VERSION:-0.1.0-local}
        BUILD_GIT_SHA: ${ADMIN_UI_GIT_SHA:-unknown}
        BUILD_DATE: ${ADMIN_UI_BUILD_DATE:-unknown}
    image: openbank/admin-ui:local
    container_name: openbank-admin-ui
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: openbank_nextauth_secret_local_dev_only
      KEYCLOAK_CLIENT_ID: openbank-admin-ui
      KEYCLOAK_CLIENT_SECRET: changeme_local_admin_ui_dev_only
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: openbank
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      SERVICES_HOST: container
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - openbank-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  kafka_data:
  valkey_data:
  openbao_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  openbank-net:
    driver: bridge
    ipam:
      config:
        # DO NOT use 172.20.0.0/16 here. On the ephemeral EKS CI runners (ADR-0053)
        # this compose stack runs inside dind, sharing the runner pod's network
        # namespace — and 172.20.0.0/16 is the cluster Service CIDR (kube-dns is
        # 172.20.0.10). A docker bridge on that CIDR installs a more-specific route
        # that black-holes all traffic to kube-dns, killing pod DNS mid-build:
        # `docker compose up` / Testcontainers pulls and the runner's job-completion
        # callback then hang until the 35-min job timeout. This range is private,
        # outside both the Service CIDR and the VPC CIDR (10.80.0.0/16), and away
        # from the common home/Docker-Desktop 192.168.{0,1}.x ranges.
        - subnet: 192.168.240.0/20
