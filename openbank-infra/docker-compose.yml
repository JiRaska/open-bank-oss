# OpenBank Local Development Environment
# Usage: make up | make down | make logs | make ps
# Requirements: Docker Desktop >= 4.x, docker-compose v2, 16GB RAM recommended

services:

  # ─────────────────────────────────────────────
  # PostgreSQL (CloudNativePG emulated locally)
  # ─────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.3-alpine}
    container_name: openbank-postgres
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=500
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=256MB
        -c wal_buffers=8MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
    environment:
      POSTGRES_USER: openbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbank"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Kafka (KRaft mode — no ZooKeeper)
  # ─────────────────────────────────────────────
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    container_name: openbank-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data
      CLUSTER_ID: "f4mXx4bST5Sp1bNgFMn8sQ"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Apicurio Schema Registry
  # ─────────────────────────────────────────────
  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.2.Final
    container_name: openbank-schema-registry
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: 8081
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # ClickHouse (analytics warehouse — bronze/silver, ADR-0022/0023)
  # The store of record for the analytics layer. The bronze/silver/integrity_anchors/
  # reload_proposals DDL is source-controlled in openbank-analytics-sink and applied here
  # once, on first init, via /docker-entrypoint-initdb.d. Container port stays 8123; the
  # host publish uses 8129 because 8123 is already taken by sanctions-service.
  # ─────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: openbank-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: openbank_analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CHANGE_ME_LOCAL_DEV_ONLY}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../openbank-analytics-sink/src/main/resources/clickhouse/V1__analytics_bronze_silver.sql:/docker-entrypoint-initdb.d/01-analytics.sql:ro
    ports:
      - "8129:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Valkey (Redis-compatible cache)
  # ─────────────────────────────────────────────
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:7.2-alpine}
    container_name: openbank-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # OpenBao (dev mode for local) — same LF/MPL-2.0 fork production runs
  # (runbook 0005, openbank-infra/gitops/apps/openbao.yaml pins quay.io/openbao/openbao:2.5.4).
  # ─────────────────────────────────────────────
  openbao:
    image: quay.io/openbao/openbao:2.5.4
    container_name: openbank-openbao
    restart: unless-stopped
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data:/openbao/data
      - ./docker/openbao/init:/openbao/init:ro
    command: >
      sh -c "bao server -dev &
             sleep 3 &&
             export BAO_ADDR=http://127.0.0.1:8200 &&
             export BAO_TOKEN=${BAO_DEV_ROOT_TOKEN} &&
             export BAO_DEV_ROOT_TOKEN=${BAO_DEV_ROOT_TOKEN} &&
             sh /openbao/init/init.sh &&
             wait"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Keycloak (IAM)
  # ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: openbank-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/openbank_keycloak
      KC_DB_USERNAME: openbank
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KC_CACHE: local
      JAVA_OPTS_APPEND: "-Xms256m -Xmx384m"
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Kafka UI (development convenience)
  # ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: openbank-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: openbank-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xmx128m -Xms64m"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: openbank-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--storage.tsdb.retention.time=7d'
      - '--query.max-concurrency=2'
      - '--storage.tsdb.min-block-duration=2h'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: openbank-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_RENDERING_CONCURRENT_RENDER_LIMIT: "2"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Loki (log aggregation)
  # ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: openbank-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Tempo (distributed tracing)
  # ─────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: openbank-tempo
    restart: unless-stopped
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Kafka topic initializer (one-shot)
  # ─────────────────────────────────────────────
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    container_name: openbank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    command: ["bash", "/create-topics.sh"]
    networks:
      - openbank-net
    restart: "no"

  # ─────────────────────────────────────────────
  # OPA — agent policy engine (ADR-0018 + ADR-0031 D2/D8)
  # Serves the agent-charter decision API that gates the MCP /tools/call endpoint.
  # The charters in openbank-libs/governance/agents.yaml are the single source of truth:
  # mounted at the `agents` data namespace (data.agents.*), the shape agents.rego expects.
  # Dormant by default — agent-service ships agent.policy.opa.enabled=false (build-time), so it
  # still uses deny-by-default and never calls this sidecar until enforcement is switched on.
  # ─────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:1.17.0
    container_name: openbank-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "-b"
      - "/bundle"
    volumes:
      # Layout mirrors openbank-infra/opa/build-bundle.sh; new non-test policies must be added here too.
      - ../openbank-libs/governance/agents-opa-data.yaml:/bundle/agents/data.yaml:ro
      - ../openbank-libs/governance/rules.yaml:/bundle/rules/data.yaml:ro
      - ./opa/policies/agents.rego:/bundle/agents.rego:ro
      - ../openbank-libs/governance/policies/rest.rego:/bundle/rest.rego:ro
      - ./opa/bundle.manifest:/bundle/.manifest:ro
    ports:
      - "8181:8181"
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Temporal (payment orchestration, ADR-0120 Phase 5) — dev-mode single binary, in-memory,
  # no separate Postgres/Cassandra. This is LOCAL DEV ONLY; the sandbox EKS cluster runs the
  # real Temporal Helm release (openbank-infra/gitops/components/temporal/temporal-helmrelease.yaml)
  # with CNPG-backed persistence. Was previously absent from docker-compose entirely — transaction-
  # service's PaymentWorkerRegistrar would register a worker that never dispatched (issue #669
  # load-benchmark: `POST /api/v1/transactions` blocks until its PaymentWorkflow completes, so
  # without this every local write hangs).
  # --namespace pre-registers `openbank-payments` in addition to the always-created `default`
  # namespace, matching transaction-service's TemporalConfig default (TEMPORAL_NAMESPACE).
  temporal:
    image: temporalio/temporal:1.7.3
    container_name: openbank-temporal
    restart: unless-stopped
    command: server start-dev --ip 0.0.0.0 --namespace openbank-payments
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - openbank-net

  # ─────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────
  account-service:
    build:
      context: ..
      dockerfile: openbank-infra/docker/services/standalone-service.Dockerfile
      args:
        SERVICE_DIR: openbank-account-service
    image: openbank/account-service:local
    container_name: openbank-account-service
    restart: unless-stopped
    stop_grace_period: 35s
    stop_signal: SIGTERM
    environment:
      QUARKUS_MANAGEMENT_ENABLED: "true"
      QUARKUS_HTTP_HEADER__X_CONTENT_TYPE_OPTIONS__VALUE: nosniff
      QUARKUS_HTTP_HEADER__X_FRAME_OPTIONS__VALUE: DENY
      QUARKUS_HTTP_HEADER__X_XSS_PROTECTION__VALUE: "1; mode=block"
      QUARKUS_HTTP_HEADER__REFERRER_POLICY__VALUE: strict-origin-when-cross-origin
      QUARKUS_HTTP_HEADER__PERMISSIONS_POLICY__VALUE: "geolocation=(), microphone=(), camera=()"
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'"
      QUARKUS_HTTP_HEADER__STRICT_TRANSPORT_SECURITY__VALUE: "max-age=31536000; includeSubDomains"
      QUARKUS_MANAGEMENT_PORT: "8085"
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/openbank
      QUARKUS_DEV_UI_ENABLED: "false"
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/openbank_accounts
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/openbank_accounts
      QUARKUS_DATASOURCE_USERNAME: openbank
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_HTTP_PORT: "8100"
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      QUARKUS_REDIS_HOSTS: redis://:${VALKEY_PASSWORD}@valkey:6379
      QUARKUS_SHUTDOWN_TIMEOUT: 30S
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # sanctions-service listens on 8123 (its own QUARKUS_HTTP_PORT below), not the stale
      # :8110 fallback in account-service's application.yaml default (fixed alongside this).
      SANCTIONS_SERVICE_URL: http://sanctions-service:8123
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      sanctions-service:
        condition: service_healthy
    networks:
      - openbank-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  aml-service:
    build:
      context: ..
      dockerfile: openbank-infra/docker/services/standalone-service.Dockerfile
      args:
        SERVICE_DIR: openbank-aml-service
    image: openbank/aml-service:local
    container_name: openbank-aml-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: 5
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/openbank_aml
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_REACTIVE_MAX_SIZE: 5
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/openbank_aml
      QUARKUS_DATASOURCE_USERNAME: openbank
      QUARKUS_DEV_UI_ENABLED: "false"
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_HTTP_AUTH_PERMISSION__PUBLIC__PATHS: "/api/v1/info,/q/health,/q/health/*,/api/v1/aml,/api/v1/aml/*"
      QUARKUS_HTTP_AUTH_PERMISSION__PUBLIC__POLICY: permit
      QUARKUS_HTTP_AUTH_PROACTIVE: "false"
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'"
      QUARKUS_HTTP_HEADER__PERMISSIONS_POLICY__VALUE: "geolocation=(), microphone=(), camera=()"
      QUARKUS_HTTP_HEADER__REFERRER_POLICY__VALUE: strict-origin-when-cross-origin
      QUARKUS_HTTP_HEADER__STRICT_TRANSPORT_SECURITY__VALUE: "max-age=31536000; includeSubDomains"
      QUARKUS_HTTP_HEADER__X_CONTENT_TYPE_OPTIONS__VALUE: nosniff
      QUARKUS_HTTP_HEADER__X_FRAME_OPTIONS__VALUE: DENY
      QUARKUS_HTTP_HEADER__X_XSS_PROTECTION__VALUE: "1; mode=block"
      QUARKUS_HTTP_PORT: 8117
      QUARKUS_LOG_LEVEL: INFO
      QUARKUS_LOG_CONSOLE_JSON: "false"
      QUARKUS_MANAGEMENT_ENABLED: "true"
      QUARKUS_MANAGEMENT_PORT: 8085
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/openbank
      QUARKUS_OIDC_CLIENT_ID: openbank-services
      QUARKUS_OIDC_CREDENTIALS_SECRET: changeme_local_oidc_client_dev_only
      QUARKUS_OIDC_ENABLED: "false"
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      QUARKUS_REDIS_HOSTS: redis://:${VALKEY_PASSWORD}@valkey:6379
      QUARKUS_SHUTDOWN_TIMEOUT: 30S
    ports:
      - "8117:8117"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - openbank-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  audit-service:
    build:
      context: ..
      dockerfile: openbank-infra/docker/services/standalone-service.Dockerfile
      args:
        SERVICE_DIR: openbank-audit-service
    image: openbank/audit-service:local
    container_name: openbank-audit-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: 5
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/openbank_audit
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_REACTIVE_MAX_SIZE: 5
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/openbank_audit
      QUARKUS_DATASOURCE_USERNAME: openbank
      QUARKUS_DEV_UI_ENABLED: "false"
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_HTTP_AUTH_PERMISSION__PUBLIC__PATHS: "/api/v1/info,/q/health,/q/health/*,/api/v1/audit,/api/v1/audit/*"
      QUARKUS_HTTP_AUTH_PERMISSION__PUBLIC__POLICY: permit
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'"
      QUARKUS_HTTP_HEADER__PERMISSIONS_POLICY__VALUE: "geolocation=(), microphone=(), camera=()"
      QUARKUS_HTTP_HEADER__REFERRER_POLICY__VALUE: strict-origin-when-cross-origin
      QUARKUS_HTTP_HEADER__STRICT_TRANSPORT_SECURITY__VALUE: "max-age=31536000; includeSubDomains"
      QUARKUS_HTTP_HEADER__X_CONTENT_TYPE_OPTIONS__VALUE: nosniff
      QUARKUS_HTTP_HEADER__X_FRAME_OPTIONS__VALUE: DENY
      QUARKUS_HTTP_HEADER__X_XSS_PROTECTION__VALUE: "1; mode=block"
      QUARKUS_HTTP_PORT: 8113
      QUARKUS_LOG_LEVEL: INFO
      QUARKUS_LOG_CONSOLE_JSON: "false"
      QUARKUS_MANAGEMENT_ENABLED: "true"
      QUARKUS_MANAGEMENT_PORT: 8085
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/openbank
      QUARKUS_OIDC_CLIENT_ID: openbank-services
      QUARKUS_OIDC_CREDENTIALS_SECRET: changeme_local_oidc_client_dev_only
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      QUARKUS_SHUTDOWN_TIMEOUT: 30S
    ports:
      - "8113:8113"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
