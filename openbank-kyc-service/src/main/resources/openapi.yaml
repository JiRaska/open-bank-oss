openapi: 3.1.0
info:
  title: KYC Service API
  version: 1.9.0
  description: Know Your Customer case management — open cases, run checks, approve/reject.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8114
    description: Local development
tags:
  - name: KYC

paths:
  /api/v1/kyc/cases:
    get:
      tags: [KYC]
      summary: List KYC cases (paginated). Optional ?status= filter for onboarding cockpit funnel views (ADR-0068).
      operationId: listKycCases
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter by KYC case status. When omitted all cases are returned.
          schema:
            type: string
            enum: [OPEN, DOCUMENTS_REQUIRED, UNDER_REVIEW, APPROVED, REJECTED, EXPIRED]
      responses:
        '200':
          description: Paginated KYC cases with the applied status filter echoed when present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCasePage'
    post:
      tags: [KYC]
      summary: Open a KYC case
      operationId: openKycCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCaseRequest'
      responses:
        '201':
          description: Case opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCaseResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/kyc/cases/{id}:
    get:
      tags: [KYC]
      summary: Get KYC case by ID
      operationId: getKycCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      responses:
        '200':
          description: KYC case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/kyc/cases/party/{partyId}:
    get:
      tags: [KYC]
      summary: Get KYC case by party
      operationId: getKycCaseByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: KYC case for party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/kyc/cases/{id}/checks/{checkType}:
    put:
      tags: [KYC]
      summary: Update a check result
      operationId: updateCheck
      parameters:
        - $ref: '#/components/parameters/caseId'
        - name: checkType
          in: path
          required: true
          schema:
            type: string
            enum: [IDENTITY, ADDRESS, PEP_SCREENING, SANCTIONS_SCREENING, ADVERSE_MEDIA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckRequest'
      responses:
        '200':
          description: Check updated

  /api/v1/kyc/cases/{caseId}/approve:
    post:
      tags: [KYC]
      summary: Approve a KYC case (four-eyes enforced, ADR-0068)
      operationId: approveKycCase
      description: >
        Only cases in UNDER_REVIEW status may be approved. The approver identity is derived from
        the authenticated session — not from the request body — to satisfy the ČNB four-eyes mandate
        (AML Act No. 253/2008 Coll., §8 KYC documentation obligations). A reason of at least
        10 characters is mandatory for the regulatory audit trail.
      parameters:
        - $ref: '#/components/parameters/caseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycCaseApprovalRequest'
      responses:
        '200':
          description: Case approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCaseResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden — caller lacks ROLE_OPERATOR, ROLE_KYC or ROLE_ADMIN
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidStateTransition'

  /api/v1/kyc/cases/{caseId}/pep-rescreen:
    post:
      tags: [KYC]
      summary: Re-screen a KYC case's party name against the PEP_GLOBAL list (first increment, ADR-0116)
      operationId: rescreenKycCasePep
      description: >
        Screens openbank-sanctions-service's OpenSanctions-derived PEP_GLOBAL list only — this is
        a first, free-data-source PEP check, not a paid commercial vendor feed
        (Refinitiv/ComplyAdvantage/etc.), not identity-document verification, and not continuous
        real-time monitoring. Operator-triggered, distinct from the periodic re-KYC programme
        (ADR-0116 §5), which still requires a Temporal scheduled workflow. A match sets
        PEP_SCREENING to MANUAL_REVIEW and escalates riskLevel to at least HIGH.
      parameters:
        - $ref: '#/components/parameters/caseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PepRescreenRequest'
      responses:
        '200':
          description: Case re-screened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCaseResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden — caller lacks ROLE_OPERATOR, ROLE_ADMIN, ROLE_KYC_OPENER or ROLE_COMPLIANCE
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/kyc/cases/{caseId}/reject:
    post:
      tags: [KYC]
      summary: Reject a KYC case (four-eyes enforced, ADR-0068)
      operationId: rejectKycCase
      description: >
        Only cases in UNDER_REVIEW status may be rejected. The rejector identity is derived from
        the authenticated session. A reason of at least 10 characters is mandatory for the
        regulatory audit trail (ČNB AML/KYC §8).
      parameters:
        - $ref: '#/components/parameters/caseIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycCaseApprovalRequest'
      responses:
        '200':
          description: Case rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycCaseResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden — caller lacks ROLE_OPERATOR, ROLE_KYC or ROLE_ADMIN
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidStateTransition'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    caseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    caseIdParam:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The party already has an active (non-terminal) KYC case
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidStateTransition:
      description: >
        The case is not in the required state for this operation. Approve and reject require
        UNDER_REVIEW status (four-eyes gate, ADR-0068).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    OpenCaseRequest:
      type: object
      required: [partyId]
      properties:
        partyId:
          type: string
          format: uuid
    UpdateCheckRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >
            The new CheckStatus. Values are the domain `CheckStatus` constants verbatim —
            `KycResource.updateCheck` calls `CheckStatus.valueOf(req.status)`, so anything else
            is rejected with 400.
          enum: [PENDING, PASSED, FAILED, MANUAL_REVIEW]
        result:
          type: string
          description: Free-text outcome note recorded against the check. Optional.

    KycCaseApprovalRequest:
      type: object
      required: [reason]
      description: >
        Request body for approve and reject operations. The approver/rejector identity is derived
        from the authenticated session — the caller must not supply their own identity. The reason
        is mandatory (minimum 10 characters) for the ČNB four-eyes audit trail (ADR-0068).
      properties:
        reason:
          type: string
          minLength: 10
          description: >
            Mandatory explanation for the approval/rejection decision. Minimum 10 characters.
            Stored in the KYC case audit trail to satisfy ČNB AML/KYC §8 documentation obligations
            (AML Act No. 253/2008 Coll.).

    PepRescreenRequest:
      type: object
      required: [partyName]
      description: >
        Party legal name to screen against openbank-sanctions-service's PEP_GLOBAL list. Kept out
        of KycCaseResponse (the case aggregate carries no party name — see ADR-0116).
      properties:
        partyName:
          type: string

    KycCasePage:
      type: object
      required: [items, total, page, size, statusFilter]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KycCaseResponse'
        total:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
        size:
          type: integer
        statusFilter:
          type: [string, 'null']
          enum: [OPEN, DOCUMENTS_REQUIRED, UNDER_REVIEW, APPROVED, REJECTED, EXPIRED, null]

    KycCaseResponse:
      type: object
      required: [id, partyId, status, riskLevel, assignedTo, checks, notes, reviewedBy, reviewedAt, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, DOCUMENTS_REQUIRED, UNDER_REVIEW, APPROVED, REJECTED, EXPIRED]
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH, VERY_HIGH]
        assignedTo:
          type: [string, 'null']
        checks:
          type: array
          items:
            $ref: '#/components/schemas/KycCheckResponse'
        notes:
          type: [string, 'null']
        reviewedBy:
          type: [string, 'null']
        reviewedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KycCheckResponse:
      type: object
      required: [id, caseId, checkType, status, result, provider, performedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        checkType:
          type: string
          enum: [IDENTITY, ADDRESS, PEP_SCREENING, SANCTIONS_SCREENING, ADVERSE_MEDIA]
        status:
          type: string
          enum: [PENDING, PASSED, FAILED, MANUAL_REVIEW]
        result:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        performedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
