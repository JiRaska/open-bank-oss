quarkus:
  application:
    name: openbank-kyc-service
  http:
    port: 8114
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_kyc
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_kyc
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token for the PEP screening call to openbank-sanctions-service
  # (ADR-0116 first-increment PEP check). Mirrors the same oidc-client block already used by
  # openbank-domestic-payment / openbank-sepa-payment / openbank-fx-service / openbank-account-service
  # (ADR-0032 §D) — without it the rest-client has no Authorization header and the downstream
  # /api/v1/sanctions/screen call 401s. Disabled under %test; units mock PepScreeningPort directly.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    sanctions-service:
      url: ${SANCTIONS_SERVICE_URL:http://localhost:8123}
      scope: jakarta.inject.Singleton
    # Party register enumeration for the #5698 orphaned-party reconciliation (read-only).
    party-service:
      url: ${PARTY_SERVICE_URL:http://localhost:8111}
      scope: jakarta.inject.Singleton
  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-kyc-service
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      # PARTY_CREATED → auto-open a KYC case (ADR-0068). earliest so a case is opened even
      # for parties created before this consumer first joined the group; openCaseForParty is
      # idempotent so replaying the topic does not create duplicate cases.
      #
      # client.id / group.id / auto.offset.reset are deliberately NOT set here: Quarkus's YAML
      # config source unconditionally quotes any leaf key containing a literal dot (e.g.
      # `group.id`) when registering it as a MicroProfile Config property, so it silently
      # registers as `mp.messaging.incoming.party-events-in."group.id"` — never the plain
      # `mp.messaging.incoming.party-events-in.group.id` that KafkaConnectorIncomingConfiguration
      # actually reads. group.id then silently fell back to quarkus.application.name
      # (openbank-kyc-service), which the KafkaUser ACL (kafka-kyc-mtls.yaml) never granted Read
      # on group kyc-service-party — a silent GroupAuthorizationException on every poll (#686).
      # These are instead set via the kyc-service-msg-override ConfigMap (QUARKUS_CONFIG_LOCATIONS
      # properties file, see openbank-infra/gitops/components/kyc/kyc-service-msg-override.yaml),
      # whose flat key=value lines carry the exact dotted property name unambiguously.
      party-events-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.kyc.party-events-in
        connector: smallrye-kafka
        topic: openbank.party.events
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
    outgoing:
      # The `kyc-events-out` channel that used to sit here — a bare @Channel emitter fired AFTER
      # the repository had already committed — was removed with issue #4007. KYC lifecycle events
      # are now written to `kyc_outbox` inside the state-change transaction and relayed on
      # `kyc-outbox-out` below, which targets the same topic. Two publishers on one topic would
      # race, and only one of them can be atomic.
      kyc-outbox-out:
        connector: smallrye-kafka
        client.id: kyc-outbox-service-${quarkus.uuid}
        topic: openbank.kyc.events
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
      # Customer-facing KYC outcome notifications (#8432), drained by notification-service off
      # openbank.notification.requests — the same envelope account-service, campaign-service and
      # sca-service publish. NOT the outbox above: that channel is single-destination and
      # OutboxMessage carries no topic, so a notification request cannot ride it without teaching
      # the shared outbox contract about destinations.
      #
      # That topic IS ACL-locked, so this needs an explicit Write grant on the kyc-service
      # KafkaUser (added in openbank-infra/gitops/components/kyc/kafka-kyc-mtls.yaml). Without it
      # every emit fails at runtime with TOPIC_AUTHORIZATION_FAILED and no test can see it.
      notification-requests-out:
        connector: smallrye-kafka
        client.id: kyc-service-notif-${quarkus.uuid}
        topic: openbank.notification.requests
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    oidc:
      enabled: false
    oidc-client:
      enabled: false
  openbank:
    kyc:
      # kyc-service does NOT set quarkus.scheduler.enabled=false under %test, so every @Scheduled
      # bean fires during unrelated suites. This reconciliation calls party-service over REST, which
      # no test JVM serves, so leaving it on would log a connection error every tick of every test
      # class. OrphanedPartyDetectionSchedulerIT re-enables it, with a shrunk cron and a stub port.
      orphan-detection:
        enabled: false
openbank:
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"
  outbox:
    dispatch-enabled: true
  retention:
    kyc:
      enabled: "${RETENTION_KYC_ENABLED:true}"
      retention-years: "${RETENTION_KYC_YEARS:5}"
      cron: "${RETENTION_KYC_CRON:0 30 3 * * ?}"
      dry-run: "${RETENTION_KYC_DRY_RUN:false}"
  kyc:
    # Cross-service reconciliation: parties with no KYC case at all (issue #5698). Read-only —
    # it publishes openbank_kyc_orphaned_parties and never opens a case (remediation is a
    # human-gated replay). Hourly; the grace period keeps a party that was created seconds ago,
    # whose PARTY_CREATED is still in flight, from being counted as stranded.
    orphan-detection:
      enabled: "${KYC_ORPHAN_DETECTION_ENABLED:true}"
      cron: "${KYC_ORPHAN_DETECTION_CRON:0 15 * * * ?}"
      grace-period: "${KYC_ORPHAN_DETECTION_GRACE:PT1H}"
      page-size: "${KYC_ORPHAN_DETECTION_PAGE_SIZE:100}"
      max-pages: "${KYC_ORPHAN_DETECTION_MAX_PAGES:500}"

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"
