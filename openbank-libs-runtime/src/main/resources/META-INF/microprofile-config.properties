# Shared defaults for all openbank-*-service modules that depend on openbank-libs-runtime.
# Service-specific application.yaml entries take precedence over these values.

# Structured console logging — every line is ONE JSON object, produced by the JSON encoder of the
# quarkus-logging-json extension (added to every service by the openbank.quarkus-service
# convention plugin). The encoder escapes quotes, backslashes and control characters in the
# message and in every MDC value, so whatever text a log statement carries stays inside the
# field it was logged in.
#
# `quarkus.log.console.json` is read ONLY by that extension. Without it on the classpath the key
# is accepted and does nothing — the console falls back to the text pattern below. The
# `json-logging-extension-present` gate (.github/gates/gates.yaml) and StructuredLogEncodingIT
# in openbank-ledger-service keep the key and the extension together.
#
# Shape of a line (what Grafana Alloy parses, gitops/apps/alloy.yaml):
#   top level : timestamp, level, logger, message, threadName, threadId, stackTrace (on error)
#   mdc       : traceId, spanId (quarkus-opentelemetry), correlationId, requestId
#               (CorrelationIdRequestFilter) — nested, as `mdc.traceId` etc.
# The key names are a contract with the log pipeline: Alloy lifts `level` into a stream label
# and `mdc.traceId` / `mdc.spanId` / `mdc.correlationId` into structured metadata. Renaming or
# flattening one here silently empties a label there.
quarkus.log.console.json=true
# The logger category keeps the name `logger` rather than the encoder's default `loggerName`.
quarkus.log.console.json.key-overrides=logger-name=logger
# One string field with the full stack trace instead of a nested object per cause and frame.
quarkus.log.console.json.exception-output-type=formatted
# Dropped: constant per pod (the pod labels already carry them) or never set.
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,ndc,hostName,processName,processId

# Text fallback, used ONLY where JSON is switched off (dev mode below, or a service that opts
# out). Deliberately plain text: a pattern cannot escape what it interpolates, so it must never
# be shaped like JSON. %e keeps the exception message and stack trace in the output.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p traceId=%X{traceId} corrId=%X{correlationId} [%c{3.}] %s%e%n

# Plain text for local development — override at service level to customise further.
%dev.quarkus.log.console.json=false
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} corrId=%X{correlationId} [%c{2.}] %s%e%n

# Startup warm-up (#11890) is off under %test fleet-wide: a @QuarkusTest suite should not pay for
# it, and its async self-calls would race test assertions. A test profile that measures it turns
# it back on explicitly. Ordinal 100 here, so any service config still overrides.
%test.openbank.warmup.enabled=false
