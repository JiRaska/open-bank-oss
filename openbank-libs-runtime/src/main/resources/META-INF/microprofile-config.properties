# Shared defaults for all openbank-*-service modules that depend on openbank-libs-runtime.
# Service-specific application.yaml entries take precedence over these values.

# Structured JSON log format — correlates with OTel traces (traceId/spanId injected by
# quarkus-opentelemetry) and HTTP correlation headers (correlationId/requestId injected by
# CorrelationIdRequestFilter in openbank-libs-runtime).
#
# %e (exception) is REQUIRED here: without it, any log.error(msg, throwable)/log.warn(msg,
# throwable) call — including Quarkus's own "Failed to start application" boot-failure log —
# silently drops the exception's message and stack trace in production, leaving only the bare
# message with no way to diagnose the actual cause. Root-caused via a sandbox fraud-service
# crash-loop (2026-07-09) that looked like "no stack trace ever printed, even at TRACE" until a
# live QUARKUS_LOG_CONSOLE_FORMAT override adding %e revealed a routine
# io.quarkus.arc.InactiveBeanException. %e appends its own leading newline, so it is placed
# just before the closing "}" — this keeps the line JSON-shaped when no exception is present
# (the common case) and only extends onto follow-up lines when one occurs.
quarkus.log.console.format={"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","logger":"%c{3.}","message":"%s","traceId":"%X{traceId}","spanId":"%X{spanId}","correlationId":"%X{correlationId}","requestId":"%X{requestId}"}%e%n

# Plain text for local development — override at service level to customise further.
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} corrId=%X{correlationId} [%c{2.}] %s%e%n
