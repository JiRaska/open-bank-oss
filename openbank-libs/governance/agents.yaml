    enforcement: block
    schedule:
      weekly: "06:00 UTC"
      reactive: adr-merge-webhook       # triggered by any merged change under docs/adr/*.md
    data_scope:
      read:
        - read.governance             # docs/adr/*.md Delivery-Status lines, rules.yaml enforced flags,
                                       # and a grep-based existence check of the artifacts they name
      pii: none                       # ADR prose and repo file/grep metadata only; no customer data
    tools:
      allow:
        - tier: read
          resources: [governance]
        - tier: write_proposal
          resources: [github-pr]      # opens draft.ticket (primary) or, rarely, a Delivery-Status-only fix PR
      deny:
        - tier: write
          resources: ["*"]            # explicit: no direct write to any ADR's decision content or rules.yaml ever
        - tier: execute
          resources: ["*"]
    requires_human:
      - any_adr_status_correction     # HITL mandatory; a human reads the ADR and the code to judge the correct status
      - every: proposal               # segregation of duties: agent proposes, human disposes
    limits:
      tokens_per_run: 50000
      runs_per_day: 4                 # weekly sweep + occasional ADR-merge reactive runs
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - findings_detected
        - adr_status_drift_impacted
        - human_approved_by
    compliance:
      eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
      dora: "Art. 9 ICT risk detection — fleet-wide re-verification that architectural decision records still match the code they describe"

  - id: authz-policy-auditor
    plane: control
    model: deepseek-ai/DeepSeek-V3.2
    charter: "ADR-0167"
    description: >
      Static analyzer for the fleet's OPA/Rego authorization policies (rest.rego, agents.rego,
      copilot_tool.rego) and the agents.yaml charters that feed them. Cross-references every rule
      condition against AuthorizeInterceptor's actual emitted principal-type/id vocabulary: a rule
      gated on a classification value the interceptor never emits, an agent-id comparison missing
      the trim_prefix normalization the REST bridge path needs, an agents.yaml charter's
      tools.allow/deny drifting from the tool_tiers registry, and a REST rule bypassing
      agents.allow by calling charter_allowed directly. Proposes a tracking ticket through the
      HITL queue for every finding -- this agent never opens a fix PR, even for the fleet's usual
      "one narrow mechanical case," because a wrong auto-fix on an authorization rule is a live
      security exposure. Never writes to a .rego policy or agents.yaml directly.
    enabled: true
    enforcement: block
    schedule:
      weekly: "07:00 UTC"
      reactive: policy-source-changed-webhook   # triggered when any .rego policy or agents.yaml changes
    data_scope:
      read:
        - read.governance             # openbank-infra/opa/policies/*.rego, openbank-libs/governance/
                                       # policies/*.rego, agents.yaml, and AuthorizeInterceptor.kt via
                                       # a repo checkout
      pii: none                       # policy source text and rule metadata only; no customer data
    tools:
      allow:
        - tier: read
          resources: [governance]
        - tier: write_proposal
          resources: [github-pr]      # opens draft.ticket ONLY -- never a fix PR (ADR-0167 Decision)
      deny:
        - tier: write
          resources: ["*"]            # explicit: no direct write to any .rego policy or agents.yaml ever
        - tier: execute
          resources: ["*"]
    requires_human:
      - any_authz_policy_finding      # HITL mandatory; a human reads the rego/charter diff and the
                                       # code path it gates before anything changes
      - every: proposal                 # segregation of duties: agent proposes, human disposes
      - two_person_review: authz_policy_findings   # stricter than every sibling agent's single-
                                       # approval HITL gate (mirrors rules.yaml review.
                                       # money_path_approvals: 2): a wrong disposition of an
                                       # authz-policy finding is a live security exposure, not a
                                       # documentation/cost/release nit, so this charter asks for a
                                       # second reviewer before a finding is closed out
    limits:
      tokens_per_run: 50000
      runs_per_day: 8                 # weekly sweep + occasional policy-source-changed reactive runs
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - findings_detected
        - authz_check_type_impacted
        - human_approved_by
    compliance:
      eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
      dora: "Art. 9 ICT risk detection; Art. 5 ICT risk management framework — fleet-wide static verification that authorization-policy rules can actually fire as intended"

  - id: flaky-test-hunter
    plane: development
    model: deepseek-ai/DeepSeek-V3.2
    charter: "ADR-0168"
    description: >
      Static analyzer for fleet-wide silent-test-failure patterns in Kotlin test sources.
      Generalizes the check-test-runblocking-unit.sh CI guard (expression-body test functions
      using runBlocking/runTest/GlobalScope.launch/GlobalScope.async without an explicit ': Unit'
      return type, which JUnit5 silently drops instead of running) beyond its one hardcoded
      builder, flags Pact provider verification tests gated on pactbroker.url (always skipped by
      a local './gradlew test' run) and any provider with two colliding @Provider test classes,
      and cross-checks declared-vs-executed @Test counts per module. Proposes a tracking ticket
      through the HITL queue for nearly every finding -- guessing wrong on a fix here (suspend fun
      vs ': Unit', which @Provider class should own an interaction) risks silently masking a real
      bug instead of fixing it. Never writes to a test file directly.
    enabled: true
    enforcement: block
    schedule:
      weekly: "08:00 UTC"
      reactive: ci-test-suite-failure-webhook   # triggered when a CI test-suite run reports a failure
    data_scope:
      read:
        - read.governance             # every module's src/test/kotlin tree, .github/scripts/*.sh CI
                                       # guard scripts, and build/test-results/test/*.xml JUnit
                                       # reports via a repo checkout
      pii: none                       # test source text and JUnit report metadata only; no customer data
    tools:
      allow:
        - tier: read
          resources: [governance]
        - tier: write_proposal
          resources: [github-pr]      # opens draft.ticket by default; gh.pr.open stays wired but is
                                       # rarely used (ADR-0168 Decision)
      deny:
        - tier: write
          resources: ["*"]            # explicit: no direct write to any test file ever
        - tier: execute
          resources: ["*"]            # never invokes a build/test run itself
    requires_human:
      - any_flaky_test_finding        # HITL mandatory; a human reads the test's intent before a fix lands
      - every: proposal                 # segregation of duties: agent proposes, human disposes
    limits:
      tokens_per_run: 50000
      runs_per_day: 8                 # weekly sweep + occasional CI-test-suite-failure reactive runs
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - findings_detected
        - flaky_test_check_type_impacted
        - human_approved_by
    compliance:
      eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, not Annex III high-risk"
      dora: "Art. 9 ICT risk detection; Art. 5 ICT risk management framework — fleet-wide static verification that a test suite's reported green state reflects tests that actually ran"

  - id: case-coordinator
    plane: control
    charter: "ADR-0244"
    description: >
      Owns a running Temporal case workflow: invites chartered agents to contribute,
      enforces the per-case-class budget and deadline, judges convergence, and emits
      exactly one HITL proposal per case. Every swarm is bounded to one disposition
      target; pre-emption is deterministic and replay-safe. The coordinator never
      coordinates a case it opened; who detected is never who converged.
    enabled: true
    enforcement: block
    data_scope:
      read:
        - case-workflow-history       # Temporal workflow history of cases it coordinates
        - agent-proposals-readonly    # existing proposal queue metadata (no raw payload)
        - read.governance             # agents.yaml case classes and charter capabilities
      pii: masked
    tools:
      allow:
        - tier: read
          resources: [case-workflow, governance]
        - tier: write_proposal
          resources: [agent-proposal]   # emits one HITL proposal per case
        - tier: execute
          resources: [case-workflow-signal]  # sends deterministic pre-emption / convergence signals
      deny:
        - tier: write
          resources: ["*"]             # never writes to a business record directly
        - tier: execute
          resources: [money.*, gh.pr.*, secrets.*]
    case_capabilities:
      # The coordinator is the only charter that may open, coordinate, and synthesize a case.
      # Other agents may be granted case.join (and later case.contribute) in their own charters.
      - case.open
      - case.coordinate
      - case.synthesize
      - case.preempt
    requires_human:
      - every: proposal               # every synthesized proposal is a HITL proposal
      - approver_must_differ_from: author
      - record: reason
    limits:
      tokens_per_run: 50000
      runs_per_day: 48                # one per active case hour is common; cap prevents runaway
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - case_id
        - disposition_target
        - case_class
        - contributions_received
        - synthesis_cited_contribution_ids
        - human_approved_by
    compliance:
      eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; proposal-only, human disposes; not Annex III high-risk"
      dora: "ICT change management (Art. 8–10); operational resilience via durable, bounded case coordination"

  # ── Business plane (ADR-0284 D9) ────────────────────────────────────────────────────────────
  # A third plane beside control and development, and the distinction is not cosmetic: these two
  # read BUSINESS data — a company's register extract, its beneficial owners, a customer's own
  # accounts — where the control plane reads telemetry and CI artefacts. Neither has a runtime
  # yet. The charters land first on purpose: an agent's powers are cheap to bound before anyone
  # writes the loop that uses them, and expensive afterwards.
  - id: kyb-analyst
    plane: business
    model: deepseek-ai/DeepSeek-V3.2
    charter: "ADR-0284"
    description: >
      Drafts a disposition proposal for a business-onboarding case that reached MANUAL_REVIEW:
      reads the register extract, the declared data, the beneficial-ownership finding and any
      sanctions hits, and proposes "resolve with N signers", "reject — entity dissolved" or
      "request a power of attorney", each with the evidence it rests on cited by id. Joins the
      review as an ADR-0244 case participant; the operator disposes. Nothing about a case changes
      on the model's word.

      Its second job is narrower and more useful: a representation rule the Czech parser marked
      UNKNOWN is shown to the model, which proposes the signature count. An ACCEPTED proposal
      becomes a new pinned parser test — so the judgement is captured as DATA and re-checked by
      CI forever, instead of being trusted at runtime on the next case that looks like it.
    enabled: false                     # no runtime yet; the charter bounds it before it is built
    enforcement: block
    data_scope:
      read:
        - kyb-case-readonly            # cases in MANUAL_REVIEW only — never a live customer's
        - registry-extract-readonly    # what the public register answered, verbatim
        - ubo-finding-readonly         # beneficial owners, incl. SELF_DECLARATION and UNAVAILABLE
        - sanctions-hit-readonly       # the screening result, not the screening list
      pii: masked                      # names of representatives are masked; ids are not
    tools:
      allow:
        - tier: read
          resources: [kyb, governance]
        - tier: write_proposal
          resources: [case-thread]     # a proposal on the ADR-0244 case thread; no case write
      deny:
        - tier: write
          resources: ["*"]             # explicit: never resolves a review, never rejects a case
        - tier: execute
          resources: ["*"]
    case_capabilities:
      - case.join                      # participates; only case-coordinator opens or synthesizes
    requires_human:
      - every: proposal                # the operator resolves or rejects, never the agent
      - approver_must_differ_from: author
      - record: reason
    limits:
      tokens_per_run: 50000
      runs_per_day: 48
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - case_id
        - proposed_disposition
        - cited_evidence_ids
        - human_approved_by
    compliance:
      # Annex III(5)(b) is creditworthiness of NATURAL PERSONS and Annex III(5)(a) is access to
      # essential public services — neither covers onboarding due diligence on a legal entity, and
      # the operator makes every decision either way. Art. 14 human oversight is the control that
      # matters here, and it is structural: the agent has no write tier at all.
      eu_ai_act: "Art. 9 — risk management; Art. 13 — transparency; Art. 14 — human oversight; proposal-only, not Annex III high-risk"
      aml: "5AMLD Art. 13 customer due diligence — the agent PREPARES the file an obliged person then assesses; it performs no CDD step itself"
      dora: "Art. 8–10 ICT risk — read-only over an existing case store, no new data path"

  - id: business-copilot
    plane: business
    model: deepseek-ai/DeepSeek-V3.2
    charter: "ADR-0284"
    description: >
      customer-copilot (ADR-0089) wearing the business hat. Same on-behalf-of token, now carrying
      the acting-for entity, and the same proposal-only action tools: "send the invoice from the
      company account" produces an ActionProposal the edge routes into the existing payment + SCA
      flow, never a debit.

      The scope rule is the whole charter: it reads the ENTITY the caller is currently acting for
      and nothing else. A person who runs two companies and holds a personal account must not see
      one from inside another — the mandate resolved at the edge decides which, and the model is
      never asked to pick.
    enabled: false                     # no runtime yet; the charter bounds it before it is built
    enforcement: block
    data_scope:
      # The entity the caller is acting for, resolved from the mandate at the edge — NOT every
      # entity they hold a mandate over, and never the caller's personal party in the same breath.
      read: [balance, transaction, business-profile]
      pii: own
    tools:
      allow: [query.balance.readonly, query.transaction.readonly,
              propose.payment, propose.card_freeze, propose.dispute]
      deny: ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
    requires_human:
      - every: proposal                # ActionProposal on the reply, never a direct effect
      - sca: dynamic_linking           # HITL + SCA bound to amount+payee before any state change
      - scope: acting_for_entity       # one entity per session; the mandate at the edge decides
    limits:
      tokens_per_run: 80000
      runs_per_day: 1000
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - acting_for_party_id
        - mandate_id
        - proposed_action
        - human_approved_by
    compliance:
      eu_ai_act: "Art. 13 — transparency; Art. 14 — human oversight; proposal-only, not Annex III high-risk"
      psd2: "SCA with dynamic linking (RTS Art. 5) is applied by the edge to every proposal that would move money; the agent itself initiates nothing"
      gdpr: "Art. 5(1)(c) data minimisation — one acting-for entity per session, never the caller's other companies or their personal party"
