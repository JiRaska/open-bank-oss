#
# OpenBank AI-agent charters — the single, machine-readable source of truth for what each
# agent may see, call, and do, and where a human must decide (ADR-0031).
#
# Sibling of rules.yaml: this file is consumed by BOTH the OPA policy bundle (which gates the
# MCP /tools/call endpoint, ADR-0018 + ADR-0031 D2) and the agent runtime. A charter is written
# ONCE here and never duplicated as prose.
#
# Governing principle (ADR-0031): agents propose, governance disposes. An agent never holds more
# privilege than a human -- it holds less. Default is DENY; an allow requires a matching rule.
#
# Status of enforcement mirrors rules.yaml: a charter can be `advisory` (audit-only) before it
# `block`s, so phase 1 (ADR-0031 D8) runs deny-by-default + audit with no agent acting yet.

schema_version: 1
source_of_truth: true
related_adrs: [ADR-0017, ADR-0018, ADR-0021, ADR-0027, ADR-0029, ADR-0030, ADR-0031, ADR-0073, ADR-0088, ADR-0089]
consumes: openbank-libs/governance/rules.yaml   # money_path_services, review, vuln_management

# ---------------------------------------------------------------------------------------
# Global defaults applied to every agent unless its charter overrides them.
# ---------------------------------------------------------------------------------------
defaults:
  pii: masked                         # uses openbank-libs/security/PiiMasking; raw PII never in scope
  policy_decision: deny               # deny-by-default; OPA must find a matching allow rule
  enforced: block                     # ADR-0031 D8 gate flipped (#700/#638): declaration now matches
                                      # the deployed AGENT_POLICY_ENFORCEMENT=block (reconcile #743).
                                      # A PDP connectivity error still degrades to advisory (fail-safe).
  audit:
    actor_type: AI_AGENT              # every action -> AuditEvent (ADR-0031 D5)
    capture: [model_id, model_version, prompt_hash, tool_calls, policy_decision]
  limits:
    kill_switch: true                 # per-agent + global halt without redeploy (ADR-0031 D7)

# ---------------------------------------------------------------------------------------
# Kill switch state (ADR-0031 D7). Declarative baseline; the immediate runtime override is the
# agent_kill_switch table flipped via /api/v1/admin/agents (KillSwitchService), which wins over
# this. Per-agent halt = set `enabled: false` on that agent's charter below.
# ---------------------------------------------------------------------------------------
global_controls:
  kill_switch_enabled: true           # false halts EVERY agent (config baseline)

# ---------------------------------------------------------------------------------------
# Open runtime stack (ADR-0031 D6). No single-vendor agent SDK; all components in-cluster.
#
# ⚠ THIS BLOCK IS THE TARGET (ADR-0031 D6), NOT THE AS-BUILT. Read the `# as-built:` notes.
#
# This file is embedded VERBATIM into 34 OPA bundle ConfigMaps (rules.yaml: opa_bundle_sync), so
# anything asserted here is replicated fleet-wide as machine-readable policy data. An unmarked
# target therefore reads as a live control to anything consuming those bundles — which is exactly
# how the model_gateway block below came to assert a data-residency routing rule that has never
# run (issue #1280, ADR-0174 §2, ADR-0175 §4). Per-key as-built status, verified 2026-07-16
# against gitops and the live sandbox:
# ---------------------------------------------------------------------------------------
runtime:
  orchestration: temporal           # as-built: LIVE. temporal namespace up; agents are Temporal workflows.
  # RENAMED from `langgraph` by ADR-0265. LangGraph is a Python library and this fleet is
  # Kotlin/Quarkus with Temporal already owning durable execution; adopting it would have bought a
  # graph abstraction at the price of a second language runtime, image, CI lane, dependency-scanning
  # surface and threat model. So the DECLARATION was corrected to name what runs rather than the
  # platform being bent to make a label true.
  # as-built: PARTIAL. `openbank-libs-domain/.../reasoning/ReasoningGraph.kt` is real and tested —
  # nodes, state-threaded edges, a step cap and a visit path, deterministic so it can run inside a
  # Temporal workflow. Today's shipped agent loops are still the hand-written Kotlin ones
  # (AgentChatService's bounded model-tool loop, the control-plane workflows' straight-line
  # pipelines); migrating them onto the graph is tracked in #5671, and this line will say LIVE only
  # once at least one shipped loop actually runs on it.
  reasoning:     kotlin-graph-over-temporal
  # as-built: LIVE as of ADR-0265 slice 2, both halves. PromptInjectionGuard.kt (deterministic
  # patterns) has always been real; llama-guard is now served through the LiteLLM gateway and wired
  # into copilot-service on both the input and the output side. It is OFF unless
  # COPILOT_CONTENT_SAFETY_ENABLED is set, and when off every classification reports `unavailable`
  # rather than `safe` — visible in openbank_guardrail_classifications{decision="unavailable"}.
  guardrails:    [llama-guard, prompt-injection-filter]
  # as-built: LIVE as of ADR-0265 slice 4 (executing ADR-0183). pgvector on the copilot's existing
  # CNPG cluster, hybrid keyword + vector retrieval, embeddings through the same governed gateway.
  # Off unless COPILOT_SEMANTIC_RETRIEVAL_ENABLED; the keyword scorer remains the fallback and every
  # fallback is counted (openbank_copilot_retrieval_total{mode="keyword_only"}).
  memory_rag:    pgvector
  # as-built: LIVE as of ADR-0265 slice 3 — self-hosted Langfuse v2 in ai-platform, fed server-side
  # by the LiteLLM callback, so every caller already routed through the gateway is traced with no
  # application change. CAVEAT worth keeping in the declaration: ingestion has no telemetry of its
  # own (Langfuse v2 exposes no Prometheus endpoint, LiteLLM's callback metrics are Enterprise), so
  # a green pod is not evidence that traces are landing — runbook 0012 has the manual check, #5671
  # tracks closing it.
  observability: langfuse
  identity:      spiffe-spire       # as-built: PARTIAL, and ADR-0265 deliberately did NOT change this.
                                    # AgentSvidVerifier.kt is real, but no SPIRE deployment exists; the live
                                    # agent identity is OpenBao's pki-agent CA (ADR-0031 D3b), which enforces
                                    # the property SPIFFE stands for. Replacing a working mechanism to make a
                                    # label true is the wrong trade; the label stays flagged instead.

# Licensing note (ADR-0136, supersedes the ADR-0031 D8 separate-repo plan): the AI agent SERVICES are
# AGPL-3.0-only + a parallel commercial licence, IN-REPO (not a separate repo); the rest of the platform is
# Apache-2.0. rules.yaml carries the denylist carve-out + the AGPL/Apache build-dependency boundary. This
# charter config itself stays Apache-2.0.

# ---------------------------------------------------------------------------------------
# Model strategy -- hybrid, model-agnostic via an open LLM gateway (ADR-0031 D6).
# No lock-in: tools via MCP, policy via Rego, models via the gateway.
#
# ⚠⚠ NONE OF THE `model_gateway_target` BLOCK BELOW IS DEPLOYED. Read `model_gateway_as_built`
# first — it is the one that describes the running system.
#
# Renamed from `model_gateway` to `model_gateway_target` deliberately (issue #1280): under the old
# name this block was embedded into 34 OPA bundles as policy data asserting
# `routing: {sensitive_data: self_hosted}` — i.e. the platform machine-claimed a GDPR Chapter V
# data-residency control that has never existed. A false control claim is worse than an absent one:
# an absent control gets found, an asserted one gets relied on. Any consumer reading the bundles
# must now hit `_target` / `_as_built` and cannot mistake the intent for the state.
# ---------------------------------------------------------------------------------------
model_gateway_as_built:            # verified 2026-07-25 against gitops AND the running Deployments
  gateway: litellm                 # in-cluster LiteLLM proxy, ai-platform ns, :4000 (ADR-0174/0175,
                                   # #2019). Deployed and serving. It is the only workload holding a
                                   # provider key and the only one with an internet egress hole
                                   # (ai-platform/networkpolicy-litellm-egress.yaml), so it is a real
                                   # choke point — but see `egress_enforced` before treating it as a
                                   # *complete* one.
  routed:                          # read off the RUNNING Deployments' env, not off the manifests
    - copilot-service              # COPILOT_MODEL_ENDPOINT (#2062) — the customer-facing assistant
    - control-liveness-sentinel    # LIVENESS_MODEL_ENDPOINT
    - devops-agent                 # DEVOPS_MODEL_ENDPOINT
    - docs-truth-agent             # LLM_GATEWAY_URL
    - finops-agent                 # LLM_GATEWAY_URL
    - flaky-test-hunter            # LLM_GATEWAY_URL
    - governance-auditor           # LLM_GATEWAY_URL
    - release-steward              # LLM_GATEWAY_URL
    - authz-policy-auditor         # LLM_GATEWAY_URL
    - agent-service                # AGENT_MODEL_ENDPOINT. Promoted only after re-reading the LIVE
                                   # Deployment, which is what the previous note required: it now
                                   # resolves http://litellm.ai-platform.svc:4000/v1, the baked-in
                                   # api.groq.com URL having been removed by #3300.
  not_routed: []                   # every agent reaches a model through the gateway
  egress_enforced: full            # `platform` is no longer the hole. networkpolicy/
                                   # agent-service-egress-allow-list (#2210) is present in that
                                   # namespace, so the pod can no longer bypass the gateway; with
                                   # ai-platform already egress-locked, the choke point is closed.
  budgets_enforced_at: charter     # CharterRateLimiter in openbank-agent-service — NOT the gateway.
  providers:                       # both terminate INSIDE the gateway pod; no agent holds either key
    deepinfra:                     # api.deepinfra.com, deepseek-ai/DeepSeek-V3.2. US-hosted, no region
                                   # pinning, no DPA. Serves copilot + the ops agents.
      hosted: true                 # prompt data LEAVES THE EU. Licensed for synthetic data only —
                                   # see ADR-0175 §4/§5. Routing it through the gateway centralises
                                   # the exposure; it does not remove it.
    groq:                          # api.groq.com, llama-3.3-70b-versatile. US-hosted, same posture.
                                   # Serves agent-service's admin-UI assistant (#2209).
      hosted: true                 # prompt data LEAVES THE EU. Same licence and same caveat.
  routing: none                    # still no sensitive_data routing: the gateway serves two hosted
                                   # models and no self-hosted tier exists. ADR-0175 D3 stays open —
                                   # a choke point is where routing COULD be enforced, not routing.
  fallback: none                   # no cross-provider failover is configured. On failure
                                   # LlmDiagnosisAdapter returns null and the agent degrades to a
                                   # deterministic path (ADR-0174 §4).

model_gateway_target:              # ADR-0031 D6 — the decision. NOT the state. Nothing here is deployed.
  tool: litellm                       # or equivalent open gateway in front of all models
  budgets_enforced_at: gateway        # tokens/run + runs/day from each charter
  models:
    hosted:      { provider: anthropic, use: "general reasoning, high capability" }
    self_hosted: { runtime: vllm, use: "sensitive / air-gapped / data-residency", in_cluster: true }
  routing:
    sensitive_data: self_hosted       # PII / money-path context stays on in-cluster open-weight
    default: hosted

# ---------------------------------------------------------------------------------------
# MCP tool catalog tiers (ADR-0031 D2). The OPA gate maps a tool to its tier; the `deny`
# tier is never registered for an agent identity.
# ---------------------------------------------------------------------------------------
tool_tiers:
  read:           # read-only, PII masked
    - query.ledger.readonly
    - query.gl.readonly           # GL aggregate reads (trial balance) — grantable independently of journal posting (#1966 / #299)
    - query.catalog.readonly
    - read.logs
    - read.governance      # rules.yaml / coverage / vuln SLAs
    - query.compliance.readonly   # AML cases + sanctions screenings (read-only)
    - query.payments.readonly     # FX rates, clearing batches, SEPA Instant payments (read-only)
    - query.interest.readonly     # interest accruals (read-only)
    - query.disputes.readonly     # disputes / chargebacks (read-only)
    - query.observability.readonly # Prometheus metrics / Loki logs / Alertmanager alerts (read-only)
    - query.balance.readonly      # the signed-in customer's own balance (customer-copilot, edge-enforced ownership)
    - query.transaction.readonly  # the signed-in customer's own transactions (customer-copilot, edge-enforced ownership)
    - query.account.readonly      # PSD2 consent-scoped account list (openbank-mcp-service, ADR-0181)
    - query.consent.readonly      # the PSD2 consents the acting agent holds (openbank-mcp-service, ADR-0181)
    - verify.mandate              # bank-side AP2 mandate verification (openbank-ap2-service, ADR-0193) — evidence only, moves no funds
  write_proposal: # produces a reviewable artifact, never a direct effect
    - draft.ticket
    - gh.pr.open
    - draft.adr
    - git.branch
    - git.commit.signed
    - run.skill            # constrained to the agent's `skills` allowlist
  deny:           # hard-forbidden for ALL agents -- not registrable
    - money.transfer
    - money.post.ledger
    - gh.pr.merge
    - gh.pr.approve
    - secrets.read.raw

# ---------------------------------------------------------------------------------------
# Case classes for agent swarm coordination (ADR-0244). A case is one long-running
# Temporal workflow opened for a single disposition target. Default budgets and
# convergence thresholds live here; per-class overrides are merged over default.
# Every case names exactly one class. The case-coordinator charter owns convergence
# judgement and budget enforcement; other charters may be granted case.join (and later
# case.contribute) once the signal-handling wiring lands.
# ---------------------------------------------------------------------------------------
case_classes:
  default:
    budget:
      tokens_per_case: 500000
      max_contributions: 100
      wall_clock_minutes: 60
    concurrency:
      max_open_cases: 10
    convergence:
      contested_rate_threshold: 0.30   # suspend case-open for this class above 30% contested
  classes:
    fraud-investigation:
      budget:
        tokens_per_case: 1000000
        max_contributions: 200
        wall_clock_minutes: 120
      concurrency:
        max_open_cases: 5
      convergence:
        contested_rate_threshold: 0.25
    aml-alert:
      budget:
        tokens_per_case: 300000
        max_contributions: 50
        wall_clock_minutes: 30
      concurrency:
        max_open_cases: 20
      convergence:
        contested_rate_threshold: 0.40
    incident-response:
      budget:
        tokens_per_case: 200000
        max_contributions: 40
        wall_clock_minutes: 20
      concurrency:
        max_open_cases: 15
      convergence:
        contested_rate_threshold: 0.35

# ---------------------------------------------------------------------------------------
# Agents. plane = control (oversight, proposal-only) | development (per-domain engineering)
#                | customer (customer-facing assistant, ADR-0089 — its own SCA-gated regime).
# Each charter answers: data_scope (what it reads), tools (what it calls), requires_human
# (what must be approved), limits (budget/quota). Swarm participants additionally declare
# case_capabilities (ADR-0244).
# ---------------------------------------------------------------------------------------
agents:

  - id: compliance-officer
    plane: control
    # model: the LLM this agent invokes when run. Charter-declared so the policy gate can record
    # it on every agent.mcp.tool_call audit event (ADR-0031 D5, issue #3667) without consulting
    # the model gateway at gate time. Value is the LiteLLM model id the gateway serves.
    model: llama-3.3-70b-versatile
    charter: "AML/sanctions/GDPR/PSD2 oversight of the running bank; produces proposals only."
    data_scope:
      read: [transaction, sanction-screening, consent, audit, aml, sanctions, dispute, clearing, sepa-instant]
      pii: masked
    tools:
      allow: [query.ledger.readonly, query.gl.readonly, query.catalog.readonly, read.logs, read.governance,
              draft.ticket, query.compliance.readonly, query.payments.readonly, query.disputes.readonly,
              query.observability.readonly,   # Prometheus/Loki/Alertmanager read (oversight telemetry)
              flags.write]    # feature-flag flip proposals (ADR-0067 / issue #419)
      deny:  ["money.*", "gh.pr.*"]
    requires_human:
      # Control-plane output is ALWAYS a proposal into the admin-ui approval queue (ADR-0031 D4).
      - every: proposal
      - approver_must_differ_from: author     # segregation of duties
      - record: reason                         # approve/reject reason -> audit
    limits: { tokens_per_run: 200000, runs_per_day: 48 }

  - id: ledger-domain-engineer
    plane: development
    model: llama-3.3-70b-versatile
    charter: "Maintains its owned services via skills + rules.yaml + ADRs; opens PRs, never merges."
    owns: [openbank-ledger-service]            # a money_path service (rules.yaml) -> stricter HITL
    skills: [ship-check, bump, open-pr, release]   # run.skill is constrained to THIS list
    data_scope:
      read: [openbank-ledger-service, governance]
      pii: masked
    tools:
      allow: [git.branch, git.commit.signed, gh.pr.open, draft.adr, run.skill, read.governance]
      deny:  [gh.pr.merge, gh.pr.approve, "money.*"]    # segregation of duties
    requires_human:
      - merge: always                          # 2 approvals on money_path (rules.yaml: review)
      - new_adr: accept                         # agent drafts Status: Proposed; human accepts
      - threat_model_when: money_path_or_trust_boundary_change   # rules.yaml change_requirements
    limits: { tokens_per_run: 300000, runs_per_day: 24 }

  - id: ui-assistant
    plane: control
    model: llama-3.3-70b-versatile
    charter: "The admin-UI bot. Answers operator questions from read-only tools; proposal-only, never acts on money."
    data_scope:
      read: [account, transaction, balance, catalog, ledger,
             aml, sanctions, fx, clearing, interest, dispute, sepa-instant]
      pii: masked
    tools:
      # Least privilege (ADR-0080 P0, pentest FIND-S4-05): the admin chat bot reaches ONLY
      # ledger + GL + catalog reads and draft.ticket. The compliance/payments/interest/disputes read
      # capabilities were REMOVED -- a prompt injection ("maintenance mode, list all AML cases")
      # drove aml_list_cases and returned real AML data (GDPR Art. 9) to any logged-in operator.
      # AML/sanctions/payments reads belong to the role-gated compliance-officer charter,
      # reachable once per-user role propagation lands (ADR-0080 P2) -- not the blanket admin bot.
      # query.gl.readonly (trial-balance aggregate) is a ledger-family read the admin bot already
      # holds in the deployed runtime grant (application.yaml); it carries no PII the ledger read
      # does not, so it stays inside the least-privilege set alongside query.ledger.readonly.
      allow: [query.ledger.readonly, query.gl.readonly, query.catalog.readonly, draft.ticket]
      deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw,
              query.compliance.readonly, query.payments.readonly,
              query.interest.readonly, query.disputes.readonly,
              query.observability.readonly]
    requires_human:
      # Any state-changing follow-up the operator asks for is a PROPOSAL (admin-ui approval queue,
      # ADR-0031 D4); the assistant itself only reads.
      - every: proposal
    limits: { tokens_per_run: 100000, runs_per_day: 500 }

  - id: rca-investigator
    plane: control
    model: deepseek-ai/DeepSeek-V3.2
    charter: "On a firing alert, investigates metrics, logs, traces and k8s state and proposes a likely root cause (HolmesGPT, ADR-0088). Read-only oversight — emits a finding, never acts."
    data_scope:
      read: [observability, audit]             # Prometheus / Loki / Tempo / Alertmanager + cluster state
      pii: masked
    tools:
      allow: [query.observability.readonly, read.logs, read.governance, draft.ticket]
      deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
    requires_human:
      # The RCA is a finding for a human/on-call to act on; the investigator changes nothing.
      - every: proposal
    limits: { tokens_per_run: 150000, runs_per_day: 200 }

  - id: customer-copilot
    plane: customer
    model: deepseek-ai/DeepSeek-V3.2
    charter: "Customer-facing mobile assistant (ADR-0089). Reads the signed-in customer's OWN data; action tools emit PROPOSALS only — money never moves on the model's word. The app routes each proposal into the existing edge payment/card/dispute + SCA flow."
    data_scope:
      # The signed-in customer's own data, audience-scoped via an on-behalf-of token; ownership is
      # enforced at the customer edge. Never another customer's data.
      read: [balance, transaction]
      pii: own
    tools:
      # Customer-scoped reads + a CLOSED action whitelist that produces an ActionProposal only.
      # Execution is HITL + SCA with dynamic linking bound to amount+payee (ADR-0021/0073) in the
      # edge flow — this agent never calls money.* directly. (These propose.* tools live in this
      # charter, NOT in the operator MCP tool_tiers: copilot is a distinct ADR-0089 regime.)
      allow: [query.balance.readonly, query.transaction.readonly,
              propose.payment, propose.card_freeze, propose.dispute]
      deny:  ["money.*", "gh.pr.*", secrets.read.raw]
    requires_human:
      - every: proposal                          # ActionProposal on the reply, never a direct effect
      - sca: dynamic_linking                     # HITL + SCA bound to amount+payee before any state change
      - scope: customer_own                      # audience-scoped on-behalf-of token (one customer)
    limits: { tokens_per_run: 80000, runs_per_day: 1000 }

  - id: mcp-anonymous
    plane: customer
    model: unknown
    charter: "The first-party MCP server's acting identity (ADR-0181). Exposes a curated, PSD2-consent-scoped tool set — read the granted accounts/balances/transactions/consents, and PROPOSE a payment — to governed AI agents over the Model Context Protocol. Reads only; propose.payment is a reviewable artifact a human + SCA disposes, never a debit."
    # `mcp-anonymous` is the phase-1 FIXED principal id McpEndpoint.resolveContext() sets
    # (ctx.agentId = "agent:mcp-anonymous"); the shared ADR-0034 PDP classifies it AI_AGENT and
    # rest.rego's agent bridge trims the "agent:" prefix, so this charter's `id` must stay
    # `mcp-anonymous` or every tools/call defaults to deny. Phase 2 (ADR-0126) replaces this single
    # placeholder with a per-agent OAuth 2.1 → PSD2-consent identity; each real caller then gets its
    # own charter and this one is retired.
    data_scope:
      # The accounts/consents the presented PSD2 consent grants; ownership is enforced at the
      # consent edge, never widened by the model. PII masked (defaults).
      read: [account, balance, transaction, consent]
      pii: masked
    tools:
      # Exact MCP capability strings the ADR-0034 PDP evaluates as input.action (McpToolRegistry
      # .capabilities). Deny-by-default: only these five are grantable; propose.payment emits a
      # reviewable proposal only (customer-copilot's ADR-0089 regime), never a direct money move.
      allow: [query.account.readonly, query.balance.readonly, query.transaction.readonly,
              query.consent.readonly, propose.payment]
      deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
    requires_human:
      - every: proposal                          # propose.payment surfaces a proposal, never a debit
      - sca: dynamic_linking                     # HITL + SCA bound to amount+payee before any state change
      - scope: consent_granted                   # reads never exceed the presented PSD2 consent
    limits: { tokens_per_run: 80000, runs_per_day: 1000 }

  - id: ap2-anonymous
    plane: customer
    model: unknown
    charter: "The bank-side AP2 mandate verifier's acting identity (ADR-0193). Verifies a presented AP2 (Agent Payments Protocol) signed mandate — its signature chain + constraints (payee, amount cap, currency, expiry) — as an authorization-evidence type. Verification only: it moves NO funds; a valid verdict is an input to the SCA/payment decision, never a payment."
    # `ap2-anonymous` is the phase-1 FIXED principal id Ap2VerifyEndpoint sets when the X-Agent-Id
    # header is absent (ANONYMOUS_AGENT = "agent:ap2-anonymous"); the shared ADR-0034 PDP classifies
    # it AI_AGENT and rest.rego's agent bridge trims the "agent:" prefix, so this charter's `id` must
    # stay `ap2-anonymous` or every /ap2/verify defaults to deny. Phase 2 replaces this placeholder
    # with a per-agent OAuth 2.1 identity; each real caller then gets its own charter.
    data_scope:
      # The verifier reads nothing from the banking domain — it evaluates a presented mandate against
      # a presented payment and returns a verdict + evidence. No domain read scope.
      read: []
      pii: masked
    tools:
      # The single MCP-style capability the ADR-0034 PDP evaluates as input.action
      # (Ap2VerifyEndpoint.VERIFY_CAPABILITY). Deny-by-default: only verify.mandate is grantable.
      allow: [verify.mandate]
      deny:  ["money.*", "gh.pr.*", "*.write", secrets.read.raw]
    requires_human:
      # The verifier itself never executes; when a future ADR wires the verdict into the payment
      # path, agent-initiated execution stays behind HITL + SCA dynamic-linking above a threshold.
      - sca: dynamic_linking
    limits: { tokens_per_run: 80000, runs_per_day: 1000 }

  # Card scheme release-bulletin watcher (ADR-0283 phase 4, issue #8812).
  #
  # WHY IT EXISTS: the card networks publish mandates twice a year with hard effective dates, and
  # working out which of them touch this platform is a manual read of two long PDFs that nobody's
  # job covers. Missing one is not a defect anybody can see until the date passes.
  #
  # WHY IT IS PROPOSAL-ONLY: a mandate has to be INTERPRETED against our capability ports, and a
  # wrong interpretation applied automatically would change a control nobody reviewed. It files an
  # issue citing the bulletin and the capability it mapped to, so a human checks the mapping rather
  # than trusting it.
  #
  # `enabled: false` ON PURPOSE: no bulletin feed is wired yet (there is no public machine-readable
  # source, and the portal feeds need a developer account). A charter that claims to run while its
  # input does not exist is the shape this repo has been burnt by — an agent reporting nothing is
  # indistinguishable from an agent finding nothing. Flip this on in the PR that wires the feed.
  - id: card-scheme-bulletin-agent
    plane: control
    model: deepseek-ai/DeepSeek-V3.2
    charter: ADR-0283
    description: >
      Reads the card networks' periodic release bulletins and maps each mandate onto this platform's
      capability ports, filing one governance issue per mandate with its effective date. Read-only:
      it proposes an issue and never edits a port, a policy or a manifest.
    enabled: false
    enforcement: block
    schedule:
      weekly: Monday 07:00 UTC
    data_scope:
      read:
        - read.governance
      pii: none
    tools:
      allow:
        - tier: read
          resources:
            - read.governance
        - tier: write_proposal
          resources:
            - draft.ticket
      deny:
        - tier: write
          resources:
            - '*'
        - tier: execute
          resources:
            - '*'
    requires_human:
      - any_mandate_interpretation
      - any_port_or_adapter_change
    limits:
      tokens_per_run: 40000
      runs_per_day: 1
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - bulletin_reference
        - mandate_effective_date
        - mapped_capability_id
    compliance:
      eu_ai_act: >
        Art. 13 — transparency: every filed issue cites the bulletin it came from and the capability
        it was mapped to, so a reader can check the mapping rather than trust it.
      dora: ICT third-party change awareness — a scheme mandate is a supplier-imposed change

  # Card dispute evidence assembler (ADR-0283 phase 4, issue #8812).
  #
  # WHY IT EXISTS: a chargeback is won or lost on the evidence filed before the network's respond-by
  # date, and assembling it is a manual hunt across the authorisation row, the clearing, the
  # merchant descriptor and whatever the customer sent in. The deadline is the network's and it does
  # not pause while somebody looks for the paperwork.
  #
  # WHY IT PROPOSES AND NEVER FILES: `POST /api/v1/card-disputes/{id}/evidence` reaches the scheme,
  # and a submission is not retractable. The agent drafts the bundle and a human files it — the
  # requires_human list below is the same boundary card-processing enforces at the endpoint, stated
  # where the charter can be read.
  #
  # `enabled: false` ON PURPOSE, and this is the honest part. The desk and the endpoint exist as of
  # ADR-0283 phase 3, but the EVIDENCE does not: there is no document store this agent can read, the
  # 3-D Secure result is not persisted anywhere it could reach, and openbank-dispute-service — which
  # holds what the customer actually said — is not wired to the scheme case at all (#8869). An agent
  # switched on now would assemble a bundle out of an authorisation row and call it evidence, and
  # nothing downstream could tell that apart from a real one. Flip this on in the PR that gives it
  # something to read.
  - id: card-dispute-evidence-agent
    plane: control
    model: deepseek-ai/DeepSeek-V3.2
    charter: ADR-0283
    description: >
      Drafts the evidence bundle for an open card chargeback — the authorisation, the clearing that
      followed it, the merchant as the network identifies it — and proposes it against the case's
      respond-by date. Read-only: it prepares a draft and never files evidence with a scheme.
    enabled: false
    enforcement: block
    schedule:
      daily: "06:00 UTC"
    data_scope:
      read:
        - read.governance
      # The card is referenced by its card-issuance id and the party by id; no name, address or
      # document number is in scope. Keeping the PAN outside card-processing is what keeps this
      # agent outside the cardholder-data environment too.
      pii: none
    tools:
      allow:
        - tier: read
          resources:
            - read.governance
        - tier: write_proposal
          resources:
            - draft.ticket
      deny:
        - tier: write
          resources:
            - '*'
        - tier: execute
          resources:
            - '*'
    requires_human:
      - any_evidence_submission
      - any_dispute_status_change
    limits:
      tokens_per_run: 40000
      runs_per_day: 4
      kill_switch: true
    audit:
      capture:
        - model_id
        - prompt_hash
        - tool_calls
        - policy_decision
        - network_case_id
        - respond_by_date
    compliance:
      eu_ai_act: >
        Art. 13 — transparency: a drafted bundle names every record it drew on, so a reviewer checks
        the assembly rather than trusting it. Art. 14 — human oversight: filing stays a human act,
        because a submission to a scheme cannot be withdrawn.
      dora: ICT change awareness — a missed representment window is a financial loss with a date on it

  - id: finops-agent
