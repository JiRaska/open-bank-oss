# SPDX-License-Identifier: Apache-2.0
# Where each Keycloak client secret placeholder in the realm templates comes from (issue #3246).
#
# The realm Keycloak rebuilds from is NOT the committed template: it is the import artifact in
# OpenBao (keycloak-realm-import / keycloak-customers-realm-import), which nobody derives from
# the template. A client added here without also reaching that artifact leaves a cold-started
# realm without it, and the nightly keycloak-realm-drift job goes red a day later. This file
# makes the secret source of every placeholder an explicit, reviewed fact at PR time, and it is
# the mapping a future derived (ESO-templated) import artifact needs.
#
# Each entry: openbao: <kv path> (property client_secret, mount openbank)  OR
#             unrecorded: <reason, >= 20 chars>  — a known gap, never for a NEW client.
# Enforced by .github/scripts/check-realm-import-secret-sources.py (gate realm-import-secret-sources).
# After adding a client, an operator adds it to the OpenBao import artifact (owner SSO, additive
# merge): docs/runbooks/0009-keycloak-realm-import-reconcile.md.

