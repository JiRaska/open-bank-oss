# Regulatory obligations register — what a Czech universal bank must report, to whom, and why.
#
# WHY THIS FILE EXISTS
#   The regulatory catalogue in admin-ui (`REPORT_CATALOG`) was built from what the platform could
#   already produce, so a duty with no code (CEÚ, GSFT) was invisible to every inventory taken from
#   the code. This register starts from the LAW instead: each entry is one obligation, sourced to
#   the legal text and the authority's technical specification, and THEN mapped onto the reports
#   and services that cover it. A gap is therefore a row with `coverage.status: missing`, not an
#   absence nobody notices.
#
# DERIVED SURFACES — edit this file, never them
#   - docs/compliance/regulatory-obligations.md   (.github/scripts/gen-regulatory-obligations-doc.py)
#   - openbank-admin-ui/regulatory-obligations.json (openbank-admin-ui/scripts/generate-regulatory-obligations.mjs)
#   Enforced by gate `regulatory-obligations-register` (check-regulatory-obligations.py).
#
# HONESTY RULES
#   - `cadence_confidence` says how the deadline was established: `verified` (checked against the
#     cited source), `known-eu` (well-established EU text, not re-checked), `unverified` (a lead,
#     not a fact). Never upgrade a value without checking the source.
#   - `coverage.status` describes `origin/main`, not open PRs:
#       filed-return   a backend computes the return and it appears in the regulatory catalogue
#       bff-only       the catalogue offers it, but the figures are computed in the admin-ui BFF
#                      (declared debt, ADR-0367 decision 2)
#       data-only      a backend computes the underlying data or metric, but no return exists
#       missing        nothing in the platform produces it
#       external       deliberately handled outside the core-banking platform (e.g. general ledger
#                      tax filings, statutory accounts)
#       conditional    applies only under a business model this platform does not run today;
#                      `applicability` names the trigger
#   - `reports` lists ids from the admin-ui regulatory catalogue; the checker fails on an unknown id
#     and on any catalogue entry that no obligation claims.
#
# Watched by agent `regulatory-obligations-watcher` (agents.yaml), which proposes issues for
# changes in the cited sources and never edits this file outside a reviewed PR.

schema_version: 1

statuses: [filed-return, bff-only, data-only, missing, external, conditional]
kinds: [periodic-aggregate, granular-feed, event, register, disclosure]
confidences: [verified, known-eu, unverified]

authorities:
  cnb: { cs: Česká národní banka, en: Czech National Bank, url: https://www.cnb.cz/ }
  gsft: { cs: Garanční systém finančního trhu, en: Financial Market Guarantee System, url: https://www.gsft.cz/ }
  fau: { cs: Finanční analytický úřad, en: Financial Analytical Office, url: https://www.fau.gov.cz/ }
  fs: { cs: Finanční správa ČR, en: Czech Financial Administration, url: https://www.financnisprava.gov.cz/ }
  uoou: { cs: Úřad pro ochranu osobních údajů, en: Office for Personal Data Protection, url: https://uoou.gov.cz/ }
  nukib: { cs: Národní úřad pro kybernetickou a informační bezpečnost, en: National Cyber and Information Security Agency, url: https://nukib.gov.cz/ }
  csu: { cs: Český statistický úřad, en: Czech Statistical Office, url: https://csu.gov.cz/ }
  courts: { cs: "Soudy, exekutoři a orgány činné v trestním řízení", en: "Courts, bailiffs and law enforcement", url: null }
  social: { cs: "ČSSZ, zdravotní pojišťovny, úřady práce", en: "Social security, health insurers, labour offices", url: null }
  trade-repository: { cs: Registr obchodních údajů, en: Trade repository, url: null }
  public: { cs: Veřejnost a klienti, en: Public and clients, url: null }

areas:
  - { id: register, cs: Centrální registry, en: Central registers }
  - { id: deposit-insurance, cs: Pojištění vkladů a řešení krize, en: Deposit insurance and resolution }
  - { id: prudential, cs: Obezřetnostní výkaznictví (EBA/ČNB), en: Prudential reporting (EBA/CNB) }
  - { id: statistics, cs: Statistické výkaznictví, en: Statistical reporting }
  - { id: payments, cs: Platební styk, en: Payments }
  - { id: ict, cs: Provozní odolnost a ICT, en: Operational resilience and ICT }
  - { id: aml, cs: AML a mezinárodní sankce, en: AML and international sanctions }
  - { id: tax, cs: Daně a výměna informací, en: Tax and information exchange }
  - { id: requests, cs: Součinnost s orgány veřejné moci, en: Information requests from public bodies }
  - { id: disclosure, cs: Uveřejňování a klientské informace, en: Disclosure and client information }
  - { id: markets, cs: Trhy a distribuce, en: Markets and distribution }

obligations:
  # ── Central registers ──────────────────────────────────────────────────────────────────────
  - id: cnb-ceu-account-register
    area: register
    name: { cs: Centrální evidence účtů – denní přehled změn, en: Central Register of Accounts – daily change feed }
    authority: cnb
    legal_basis: zákon č. 300/2016 Sb. § 3; vyhláška č. 30/2017 Sb. ve znění vyhlášky č. 163/2021 Sb.
    sources:
      law: https://www.zakonyprolidi.cz/cs/2016-300
      spec: https://www.cnb.cz/cs/statistika/metodicke-informace/centralni-evidence-uctu/
    cadence: Každý pracovní den do 12:00 za změny předchozího pracovního dne.
    cadence_confidence: verified
    kind: granular-feed
    transport: SDAT
    personal_data: yes
    applicability: always
    coverage: { status: missing, reports: [], services: [openbank-tax-reporting-service], tracking: ADR-0367 }
    note: Registrový feed, ne součet za období — hlásí se delta stavu účtů a osob s nimi spojených. Syntetické klienty (ADR-0252) je nutné vyloučit.
  - id: cnb-ceu-initial-load
    area: register
    name: { cs: CEÚ – úplné předání stavu, en: CEÚ – full snapshot }
    authority: cnb
    legal_basis: vyhláška č. 30/2017 Sb.
    sources:
      law: https://www.zakonyprolidi.cz/cs/2017-30
      spec: https://www.cnb.cz/cs/statistika/metodicke-informace/centralni-evidence-uctu/
    cadence: Při zahájení činnosti a na žádost ČNB.
    cadence_confidence: unverified
    kind: register
    transport: SDAT
    personal_data: yes
    applicability: always
    coverage: { status: missing, reports: [], services: [openbank-tax-reporting-service], tracking: ADR-0367 }
  - id: cnb-anacredit
    area: register
    name: { cs: AnaCredit – granulární údaje o úvěrech, en: AnaCredit granular credit data }
    authority: cnb
    legal_basis: národní rámec ČNB pro AnaCredit podle vzoru nařízení ECB (EU) 2016/867
    sources:
      law: https://eur-lex.europa.eu/eli/reg/2016/867/oj
      spec: https://www.cnb.cz/cs/statistika/anacredit/vykazovani_do_anacredit/index.html
    cadence: Měsíčně, část údajů čtvrtletně.
    cadence_confidence: unverified
    kind: granular-feed
    transport: SDAT
    personal_data: partial
    applicability: always
    coverage: { status: data-only, reports: [], services: [openbank-anacredit-service], tracking: null }
    note: Služba existuje, ale v regulatorním katalogu není a nemá záznam podání.
  - id: cnb-central-credit-register
    area: register
    name: { cs: Centrální registr úvěrů, en: Central Credit Register }
    authority: cnb
    legal_basis: zákon č. 6/1993 Sb. § 41
    sources:
      law: https://www.zakonyprolidi.cz/cs/1993-6
      spec: null
    cadence: Měsíčně; ověřit, zda není sloučen s AnaCredit.
    cadence_confidence: unverified
    kind: granular-feed
    transport: SDAT
    personal_data: partial
    applicability: always
    coverage: { status: missing, reports: [], services: [], tracking: null }

