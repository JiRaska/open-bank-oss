  # ── Regulatory requirements (ADR-0379) ─────────────────────────────────────────────
  # The requirement list the compliance page used to hard-code, each now a control with its
  # evidence. Declared status from an evidence audit of origin/main on 2026-11-15, corrected after an independent spot check of 25 items: `enforced`
  # where a test or gate was opened and confirmed to assert the behaviour, `partial` where the
  # evidence covers part of it or was not fully confirmed, `planned` where nothing exists. The
  # displayed verdict is still computed from evidence_refs, never taken from these lines.
  - id: req-psd2-sca-30eur
    title: "SCA for payments over 30 EUR"
    category: "Payments and PSD2"
    frameworks: [PSD2]
