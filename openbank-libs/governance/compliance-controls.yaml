#
# Compliance control catalogue — the source-of-truth mapping from regulatory
# obligations to the platform controls that satisfy them, and to the evidence
# that proves each control. Surfaced read-only in the admin-ui Control Tower
# (/docs/control-tower) joined with derived signals (security-graph.json).
#
# Governance-as-code (ADR-0029): this catalogue is authored, but a control's
# live STATUS is derived where a `derivedFrom` key points at a machine-readable
# signal — so the Control Tower shows reality, not an aspirational claim. Honest
# by construction: controls not yet enforced are marked `audit`/`planned`, never
# dressed up as `enforced`.
#
# status vocabulary:
#   enforced — control is active and blocking in the running platform
#   partial  — control exists but is not yet fully enforced everywhere
#   audit    — control runs in report-only mode (surfaces gaps, does not block)
#   planned  — designed/decided (ADR) but not yet deployed
#
# derivedFrom (optional) — a dotted path into security-graph.json; when present
# the UI overrides the authored status with the live-derived one:
#   supplyChain.enforced         (bool)  → enforced / audit
#
# The istio.* and network.defaultDeny signals that used to live here were
# removed 2026-07 (see PR fixing this file): generate-security-graph.mjs
# parses openbank-infra/k8s/base/{istio,network-policies}.yaml, a manifest
# tree that is never applied to the sandbox (no ArgoCD Application or
# Terraform resource references it — confirmed against origin/main). Those
# signals were not "live", just a second copy of an aspirational file
# re-parsed at Docker build time — so a `derivedFrom` on them could silently
# flip an honestly-authored `partial` control to `enforced`. Controls that
# depend on cluster-mesh reality are authored directly below instead, until
# a real live probe exists.

# evidence_refs (ADR-0379) — machine-checkable pointers to what demonstrates the
# control, as opposed to `evidence` (prose) and `evidenceSource` (a hint). Each
# entry is { kind, ref }:
#   gate      a `.github/gates/gates.yaml` id — the strongest kind: it runs on
#             every PR, and its mode (enforced/advisory) is shown with it
#   workflow  a file under `.github/workflows/`
#   test      a test file under a test source set (`*/src/test/`, `*/e2e/`)
#   adr       a four-digit ADR number under `docs/adr/`
#   path      a repo path (file or directory) that exists
# Every ref must resolve — gate `compliance-trace` fails otherwise. The admin-ui
# compliance hub computes a verdict from these: a control declared `enforced` or
# `partial` with no gate, workflow or test behind it renders as `unverified`.
#
# max_evidence_age_days (optional) — the newest passing run of a cited gate must be
# at most this old, read from the gate-health snapshot (ADR-0255). A gate whose
# latest run failed does not count. Where the age cannot be read, a positive claim
# renders `unverified` too: an unobservable age is not a fresh one.

schema: openbank.compliance-controls/v1

# Regulatory frameworks referenced by the controls below (for the legend).
frameworks:
  - id: DORA
    name: "DORA (Digital Operational Resilience Act)"
  - id: NIS2
    name: "NIS2 Directive"
  - id: PSD2
    name: "PSD2 / SCA-RTS"
  - id: GDPR
    name: "GDPR"
  - id: AMLD
    name: "AML / 5AMLD"
  - id: EBA-ICT
    name: "EBA Guidelines on ICT and security risk management"
  - id: PCI-DSS
    name: "PCI DSS"
  - id: CNB
    name: "Czech National Bank rules (payments, accounts)"
  - id: FATCA-CRS
    name: "FATCA / CRS tax information exchange"

controls:
  - id: net-segmentation
    title: "Network segmentation (default-deny)"
    category: "Network security"
    frameworks: [NIS2, DORA]
    references: ["NIS2 Art. 21", "DORA Art. 9"]
    evidence: "Pod-scoped ingress allow-lists derived from declared GitOps edges (ADR-0081), every service namespace covered; VPC CNI enforcement via platform-tofu"
    evidenceSource: "openbank-infra/scripts/gen-network-policies.py"
    status: partial
    evidence_refs:
      - { kind: gate, ref: "gen-network-policies-drift-gate" }
      - { kind: gate, ref: "netpol-coverage-kpi" }
      - { kind: gate, ref: "network-policy-code-edges" }
      - { kind: adr, ref: "0081" }

  - id: encryption-in-transit
    title: "Encryption in transit (mTLS everywhere)"
    category: "Cryptography"
    frameworks: [NIS2, DORA, PCI-DSS]
    references: ["NIS2 Art. 21", "DORA Art. 9", "PCI DSS 4.0 Req. 4"]
    evidence: "TLS terminated at ingress-nginx (cert-manager, letsencrypt-prod) for north-south traffic. East-west traffic between pods is NOT encrypted — no service mesh is deployed to the sandbox (openbank-infra/k8s/base/istio.yaml exists but is wired into neither ArgoCD nor Terraform; ADR-0098 notes explicitly that no mesh is deployed). In-cluster isolation today comes from NetworkPolicy default-deny (see net-segmentation), not from encryption."
    evidenceSource: "openbank-infra/gitops/components/*/ingress.yaml"
    status: planned
    evidence_refs:
      - { kind: gate, ref: "mtls-bearer-only" }
      - { kind: gate, ref: "mtls-keeps-http-port" }
      - { kind: adr, ref: "0137" }

  - id: strong-auth
    title: "Strong customer / service authentication"
    category: "Identity & access"
    frameworks: [PSD2, EBA-ICT]
    references: ["PSD2 RTS Art. 4", "EBA ICT 3.4.2"]
    evidence: "Keycloak-issued JWT bearer tokens validated per-service via quarkus-oidc, wired to the openbank Keycloak realm fleet-wide (every service build.gradle.kts + application.yaml); sca-service for SCA. Not a mesh-edge check — no service mesh is deployed (see encryption-in-transit)"
    evidenceSource: "openbank-*-service/src/main/resources/application.yaml (oidc.auth-server-url)"
    status: enforced
    evidence_refs:
      - { kind: gate, ref: "oidc-client-configured" }
      - { kind: gate, ref: "oidc-tls-verification-profile-scoped" }
      - { kind: adr, ref: "0021" }
      - { kind: adr, ref: "0086" }
    max_evidence_age_days: 14

  - id: authz-least-privilege
    title: "Least-privilege authorization (default-deny)"
    category: "Identity & access"
    frameworks: [EBA-ICT, DORA]
    references: ["EBA ICT 3.4.3", "DORA Art. 9"]
    evidence: "NetworkPolicy default-deny gates L3/L4 access fleet-wide (see net-segmentation); OPA fine-grained L7 authz is enforced on a subset of services, still advisory on others (ADR-0034 Phase 5) — not a mesh AuthorizationPolicy, no service mesh is deployed"
    evidenceSource: "openbank-infra/scripts/gen-network-policies.py + openbank-infra/opa/"
    status: partial
    evidence_refs:
      - { kind: gate, ref: "authz-enforce-money-path" }
      - { kind: gate, ref: "authz-enforce-pdp-sidecar-parity" }
      - { kind: gate, ref: "opa-bundle-parses" }
      - { kind: adr, ref: "0034" }
      - { kind: adr, ref: "0223" }

  - id: secrets-management
    title: "Centralised secrets management (no secrets in git)"
    category: "Cryptography"
    frameworks: [DORA, EBA-ICT, PCI-DSS]
    references: ["DORA Art. 9", "EBA ICT 3.4.4", "PCI DSS 4.0 Req. 3"]
    evidence: "HashiCorp Vault (KMS auto-unseal) + External Secrets Operator; git holds only references"
    evidenceSource: "openbank-infra/gitops/apps/vault.yaml"
