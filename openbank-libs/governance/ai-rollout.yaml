#
# Curated AI-governance rollout narrative for the admin-ui IAOps route (ADR-0031).
#
# WHY THIS FILE EXISTS
#   The machine-checkable facts (agent charters, prompt-registry coverage, evals baseline
#   presence, registry-prompt loading) are DERIVED by .github/scripts/gen-ai-governance-snapshot.py.
#   The human narrative here is NOT machine-checkable prose: decision detail strings,
#   compliance rows, and audit-trail copy that must stay editorially curated while the
#   generator validates and embeds it into openbank-admin-ui/ai-governance-snapshot.json.
#
# Governing rule: the phase number lives in EXACTLY ONE authoritative place — here. The route
# consumes the generated JSON only; no hand-maintained status block remains in route.ts.

adrRef: ADR-0031
adrStatus: Accepted
phase:
  current: 2
  total: 5
  label: Read-only oversight active — HITL proposal queue live; HolmesGPT + copilot deployed (proposal-only, no autonomous state-changing action)
  agentsActing: 0
  # This is the governance-approved roadmap, not a live runtime attestation. A phase may move
  # only after its listed criteria are independently checked; the UI never treats a charter or
  # a stub as proof that a future phase is ready.
  roadmap:
    - number: 1
      status: complete
      title: Safety foundations
      outcome: Deny-by-default charters, policy gate, identity binding and audit are enforced.
    - number: 2
      status: active
      title: Read-only oversight and human queue
      outcome: Agents prepare evidence and proposals; a human makes every disposition.
    - number: 3
      status: blocked
      title: One non-money development agent
      outcome: Needs a deployed development agent with a real, policy-gated PR path and recorded human merge.
    - number: 4
      status: blocked
      title: Expanded development, including money-path work
      outcome: Needs phase-3 proof plus enforced two-person review and a threat model for every money-path contribution.
    - number: 5
      status: planned
      title: Independently verifiable provenance
      outcome: Needs asymmetric third-party-verifiable audit anchors and AI attribution in release evidence.

# This is deliberately a DIFFERENT ruler from phase.current. It measures whether the
# protective governance control families exist; it never grants an agent permission to
# change state. Keeping both numbers visible prevents the usual false choice between
# "the platform is only at 2/5" and "agents may autonomously act".
controlMaturity:
  current: 4
  total: 5
  label: Four core governance control families are built; independently verifiable provenance remains partial.
  achieved:
    - D1
    - D2
    - D3
    - D4
  remaining: D5 still needs asymmetric, third-party-verifiable audit anchors and AI-attribution in release evidence.

decisions:
  - id: D1
    title: Agents as code (agents.yaml + charter)
    status: built
    detail: >-
      agents.yaml is the machine-readable source of truth: per-agent plane, data scope,
      tool allow/deny, requires_human, limits.
  - id: D2
    title: Policy-gated MCP (OPA before every tools/call)
    status: built
    detail: >-
      AgentPolicyGate enforces + audits every tool call. AGENT_POLICY_ENFORCEMENT=block in
      both the deployment and the agents.yaml declaration (reconciled #743), via an
      in-process charter allow-list (ADR-0080, #700) plus an OPA sidecar serving the
      agents.rego bundle over localhost:8181 as the external PDP (#638). Fails safe — a PDP
      connectivity error degrades to advisory.
  - id: D3
    title: Verifiable agent identity (SPIFFE/SVID + CN cross-check)
    status: built
    detail: >-
      D3a + D3b live and enforcing. D3a: AgentIdentityBinding ties X-Agent-Id to operator's
      verified Keycloak roles (deny-by-default); rejected assertion audited
      (agent.identity.rejected) and discloses no tools. D3b (#2488/#2495): pki-agent OpenBao
      PKI engine issues short-TTL X.509 certs (CN=agent-id, 300s, no_store); McpEndpoint
      verifies chain against pki-agent CA + SHA256withECDSA proof-of-possession + CN→role
      cross-check (svid_cn_binding audit); AGENT_IDENTITY_SVID_ENFORCED=true (no fallback).
      E2E verified in sandbox: T1 no-SVID→0 tools, T2 CN=ui-assistant→12 tools, T3
      CN=compliance-officer→0 tools + DENIED audit. Remaining: author≠approver GH branch
      protection rule (Free plan constraint, not a code gap).
  - id: D4
    title: Human-in-the-loop (two channels)
    status: built
    detail: >-
      Development plane reuses GitHub PR + CODEOWNERS + branch protection (live for humans).
      Control-plane approval queue shipped in admin-ui (/approvals + /api/agent/proposals,
      #657): agent proposals are recorded for explicit human approval with segregation of
      duties (approver ≠ author).
  - id: D5
    title: AI-attributed, tamper-evident audit
    status: partial
    detail: >-
      Every tool-call decision (agent.mcp.tool_call), tool-execution outcome
      (agent.mcp.tool_exec) and model completion emits an AuditEvent (actorType=AI_AGENT)
      with model_id, prompt_hash, policy_decision. Hash-chain live
      (audit_entries.record_hash/prev_hash, V5) + periodic externally-signed anchors
      (audit_anchor, V6): GET /api/v1/audit/anchors/verify detects wholesale rewrites.
      The sandbox deployment requests the AWS KMS asymmetric signer, and the implementation
      records the immutable KMS key identity with each signature. Remaining: independently
      attested runtime evidence of captured KMS-signed anchors and AI-attribution payload
      fields in the release evidence bundle.
  - id: D6
    title: Open, model-agnostic stack
    status: partial
    detail: >-
      Model-gateway port + OpenAI-compatible provider are built (provider-agnostic).
      Temporal, LangGraph, vLLM+LiteLLM, Langfuse, guardrails and pgvector RAG are planned.
  - id: D7
    title: Observability, budgets, kill switch
    status: partial
    detail: >-
      Budget enforcement live (CharterRateLimiter: runs_per_day pre-flight + tokens_per_run).
      Kill switch live (KillSwitchService): config baseline (agents.yaml enabled /
      global_controls) + runtime break-glass (/api/v1/admin/agents), gate pre-flight DENY +
      audit. Per-run OTel tracing remains.
  - id: D8
    title: Licensing & IP (AGPL agent services, open-core)
    status: built
    detail: >-
      Open-core split shipped (ADR-0136, superseding the ADR-0031 D8 separate-repo plan):
      the four agent services (agent, copilot, devops, finops) are AGPL-3.0-only in-repo +
      commercial dual-license; the rest of the platform stays Apache-2.0 (ADR-0123). The
      AGPL/Apache boundary is enforced by dependency direction — no Apache module
      build-depends on an agent service; agents only consume Apache openbank-libs. rules.yaml
      records the denylist carve-out and boundary. DCO for now; a CLA for the AGPL services
      follows if external contributors appear.
  - id: D9
    title: Phasing (blast radius grows with controls)
    status: partial
    detail: >-
      Phase 1 controls live and ENFORCING (deny-by-default + block); the phase-2 HITL
      proposal queue is shipped. The first read-only oversight agent — HolmesGPT
      (rca-investigator, ADR-0088), which investigates alerts and proposes a root cause
      without acting — is now deployed, and the customer-facing copilot (ADR-0089) runs in
      its own SCA-gated regime (proposes; the bank disposes). No agent takes state-changing
      action yet. Phases 3–5 (dev agent → money-path → tamper-evidence) follow.

compliance:
  - framework: PCI DSS
    requirement: Req. 7 least privilege · Req. 10 audit trail
    control: Per-agent tool gating (deny-by-default) + AI-attributed AuditEvent on every action.
    status: partial
  - framework: DORA
    requirement: Art. 8–10 ICT risk & change · Art. 17 incident reconstruction · Art. 28–30 third-party model provider
    control: Charters as code, traceId on every run, model provider treated as ICT third party.
    status: partial
  - framework: GDPR
    requirement: Art. 30 records of processing · Art. 25/32 data protection
    control: Agent actions in the audit log; PII masked on every agent data scope (PiiMasking).
    status: built
  - framework: PSD2
    requirement: SCA / consent stay human-gated
    control: Agents may propose but never act on money-path; SCA/consent paths excluded from agent tools.
    status: built
  - framework: CNB
    requirement: Auditability & operational resilience of automated decisioning
    control: Append-only audit + deny-by-default + kill switch (declared).
    status: partial
  - framework: EU AI Act
    requirement: Classified per agent · Art. 14 oversight · Art. 12 logging · Art. 13 transparency (Annex III high-risk only)
    control: Oversight/dev agents are proposal-only (likely limited risk); HITL + AI-attributed audit cover any high-risk flow. No agent touches creditworthiness scoring.
    status: partial

auditTrail:
  capture:
    - actorType=AI_AGENT
    - actorId (agent)
    - operation
    - model_id
    - model_version
    - prompt_hash
    - tool_calls[]
    - policy_decision (ALLOW/DENY)
    - result
    - traceId
  pipeline:
    - agent-service emits AuditEvent
    - Kafka audit-events-out
    - audit-service append-only store
    - release evidence bundle (ai_attribution)
  live:
    - Tool-call decisions audited (agent.mcp.tool_call)
    - Tool-execution outcomes audited (agent.mcp.tool_exec)
    - Model completions audited (agent.model.complete)
    - Audit envelope + Kafka pipeline
    - Hash-chain (record_hash/prev_hash, V5)
    - Externally-signed anchors (V6; AWS KMS signer configured in sandbox)
  planned:
    - By-actor live query endpoint (audit-service)
    - Independently attested runtime evidence of KMS-signed anchors
    - ai_attribution populated in evidence bundle
    - Approval decisions (human_approver, reason)
