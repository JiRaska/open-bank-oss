# Production Readiness — manuální atestace (M-dimenze).
#
# Tohle je JEDINÉ místo, kde se zralost zadává ručně. Derived signály (kód, testy,
# openapi, flyway, backup-config, netpol, scrape) bere collector přímo z repu a sem
# NEPATŘÍ. Sem patří jen fakta, která z repu odvodit nejdou a někdo je musí dosvědčit:
#   restore_drill  — proběhl ověřený obnov ze zálohy?
#   dr_drill       — proběhl cvičený failover (RPO/RTO změřeno)?
#   pentest        — externí/automatizovaný pentest
#   oncall         — on-call rotace + auditovaný break-glass
#   coverage_floor — money-path coverage práh atestován
#   slo_defined    — definované SLO + burn-rate alerty
#   contract_verified / code_complete — viz collector
#
# ANTI-ROT: každá atestace MÁ date + ttl_days. Po expiraci collector NEzapočítá
# bank-grade bonus a dimenze spadne zpět na derived skóre. Zelená není navždy.
#
# Formát (jeden řádek na atestaci):
#   <service>:
#     <key>: { date: YYYY-MM-DD, ttl_days: N, by: <kdo>, ref: <PR/runbook> }
#
# Pentest atestace vydaná CI lanou (`by: ci-*`) NESÍ navíc `ops: N` — počet
# skutečně otestovaných operací z běhu (Selected minus auth-blocked; lane ho od
# #5769 zapisuje strojově do fuzz-reports/<svc>-ops*.json). Pod prahem
# (5 operací) patří místo toho `not_fuzzable: "<důvod>"` — jinak zelená lane,
# která otestovala jednu operaci, obnovuje atestaci donekonečna, aniž by
# cokoli testovala (#5769). Gate `readiness-attestation-format` to vynucuje.
#
# <service> je KRÁTKÉ jméno (`consent`, ne `consent-service`) — collector hledá pod
# `openbank-<service>-service`. Špatné jméno = atestace neplatí pro nic a nikde to
# nekřičí; přesně tak byla `consent-service:` mrtvá od svého vzniku (#2365).
# Formát i čerstvost hlídá `.github/scripts/check-readiness-attestations.py`
# (gate `readiness-attestation-format`, enforced): chybějící pole, budoucí datum,
# neexistující služba/klíč a neresolvovatelný `ref` shodí build; expirace varuje
# (a po 30 dnech po expiraci už shodí — to už není výpadek, ale mrtvý záznam).
#
# Příklad (zakomentovaný — odkomentuj AŽ to fakt proběhne, ne dřív):
#
# ledger:
#   restore_drill: { date: 2026-06-20, ttl_days: 180, by: jiri, ref: runbook-0006 }
#   dr_drill:      { date: 2026-06-20, ttl_days: 180, by: jiri, ref: runbook-0006 }
#   pentest:       { date: 2026-05-01, ttl_days: 365, by: ext,  ref: schemathesis-fleet }

ledger:
  restore_drill: { date: 2026-07-26, ttl_days: 180, by: jiri, ref: docs/bcp/dr-test-log.md }
  pentest:       { date: 2026-08-18, ttl_days: 21, by: ci-zap-baseline, ref: https://github.com/JiRaska/open-bank-oss/actions/runs/32173390301 }

consent:
  pentest:       { date: 2026-09-03, ttl_days: 21, by: ci-schemathesis, ops: 14, ref: https://github.com/JiRaska/open-bank-oss/actions/runs/33720692606 }

# --- zbytek zatím prázdný: žádná další M-dimenze není dosvědčena (a to je pravda) ---
# Pozn. k `by:` u automatizovaných běhů — atestant je scheduled CI lane, ne člověk:
#   ci-schemathesis = api-fuzz.yml (weekly Tue+Thu; consent-service je v default fuzz setu)
#   ci-zap-baseline = dast-zap-baseline.yml (weekly; target = ledger-service v docker-compose)
# TTL 21 dní je záměrně krátké: když lane umře, atestace vyprší a dimenze spadne zpět
# na derived skóre — zelená přežije jen živou lane.
