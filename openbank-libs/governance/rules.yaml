#
# OpenBank governance rules — the single, machine-readable source of truth.
#
# This file is consumed by BOTH the CI gates and the CLAUDE.md agent guidance, so a
# convention is written ONCE here and never duplicated as prose. CONTRIBUTING.md and the
# PR template are the human narrative; THIS file is authoritative for automation.
#
# Governing principle (ADR-0029): derive from code -> enforce in CI -> sign the evidence
# -> surface in UI. Nothing computable is typed twice; nothing shipped is unprovenanced.
#
# Status of enforcement: see `enforced` flag per rule. Gates flip to enforced only after
# the producing layer (ADR-0029 D7) exists, so a rule can be `advisory` before it `block`s.

schema_version: 1
source_of_truth: true
related_adrs: [ADR-0005, ADR-0014, ADR-0020, ADR-0029, ADR-0030, ADR-0031, ADR-0040, ADR-0043, ADR-0052, ADR-0053, ADR-0054, ADR-0060, ADR-0082, ADR-0088]

# ---------------------------------------------------------------------------------------
# Conventional Commits — the vocabulary (mirrors CONTRIBUTING.md, authoritative here).
# ---------------------------------------------------------------------------------------
commits:
  format: "<type>(<scope>): <imperative summary>"
  # scope = service name without the `openbank-` prefix (e.g. ledger, psd2, sepa-payment),
  # or `libs`, `infra`, `admin-ui`, `docs`, `ci`. The scope SELECTS the released component.
  scope_required: true
  types:
    feat:     { semver_bump: minor, changelog: true,  description: "new functionality" }
    fix:      { semver_bump: patch, changelog: true,  description: "bug fix" }
    perf:     { semver_bump: patch, changelog: true,  description: "performance, no behavior change" }
    refactor: { semver_bump: patch, changelog: false, description: "internal restructure, no behavior change" }
    docs:     { semver_bump: none,  changelog: false, description: "documentation only" }
    test:     { semver_bump: none,  changelog: false, description: "tests only" }
    chore:    { semver_bump: none,  changelog: false, description: "build / tooling" }
    build:    { semver_bump: none,  changelog: false, description: "build system / dependencies" }
    ci:       { semver_bump: none,  changelog: false, description: "CI configuration" }
    security: { semver_bump: patch, changelog: true,  description: "security fix (often private until disclosed)" }
  # A footer `BREAKING CHANGE:` (or `!` after type/scope) forces a MAJOR bump regardless of type.
  breaking_change_marker: "!"
  breaking_change_footer: "BREAKING CHANGE:"

# ---------------------------------------------------------------------------------------
# Branch naming (CONTRIBUTING.md). <scope> = service name without `openbank-`.
# ---------------------------------------------------------------------------------------
branches:
  pattern: "^(feat|fix|chore|docs|refactor|test|security|ci|perf)/[a-z0-9-]+$"
  no_direct_commits_to: [main]
  no_direct_commits_enforced: true  # branch protection live (issue #282, github-governance.tf)

# ---------------------------------------------------------------------------------------
# SemVer per service (ADR-0029 D2). Independent per-service versioning.
# ---------------------------------------------------------------------------------------
versioning:
  scheme: semver
  strategy: per_service                 # each openbank-*-service is its own release unit
  source_file: version.txt              # per-service file; build reads it into quarkus.application.version
  # openbank-admin-ui is a release unit too (a Next.js control-plane app, scope `admin-ui`).
  # It has no quarkus.application.version; its runtime-readable analog is package.json:version,
  # which MUST equal version.txt (the build-push script fails fast on drift). The build stamps
  # version.txt into BUILD_VERSION -> /api/build-info -> the version chip in the UI (ADR-0029
  # "derive from code / show in UI").
  # Two independent version axes (ADR-0048): the deployable-artifact release version and the
  # public REST-contract version. They move on different cadences and must NOT be conflated
  # (the former amended ADR-0029 D2's "collapse three into one").
  release_invariant:
    # The deployable artifact's release SemVer. These MUST be equal for a released service.
    # quarkus.application.version is DERIVED from version.txt at build time (the
    # openbank.quarkus-service convention plugin sets the Gradle project version from
    # version.txt; the Quarkus plugin stamps it in). It must NOT be set explicitly in a
    # service application.yaml — an explicit value shadows the derived one and desyncs on
    # every release-please bump. Enforced: .github/scripts/check-app-version-override.sh.
    - "version.txt"
    - "quarkus.application.version"   # build-derived from version.txt; never set in application.yaml
    - "git release tag"
    - "container image tag"
  api_invariant:
    # The public REST contract major. The OpenAPI document major, the runtime config and the
    # URL /api/v{N} segment MUST agree. (openapi.yaml:info.version is NO LONGER on the release axis.)
    - "major(openapi.yaml:info.version)"
    - "openbank.api.version"
    - "URL /api/v{N} segment"
  released_unit_marker: version.txt     # a module is a released component IFF it has a version.txt
  release_tool: release-please
  release_mode: components              # monorepo, per-component releases
  # Layer B wiring — release-please owns the RELEASE axis only (version.txt, CHANGELOG, git tag).
  # It does NOT touch openapi.yaml:info.version — that is the api_invariant axis (ADR-0048 / oasdiff).
  release_config: release-please-config.json        # root; packages == the version.txt modules
  release_manifest: .release-please-manifest.json   # root; current release version per component
  release_workflow: .github/workflows/release-please.yml
  release_doc: openbank-libs/governance/RELEASE.md  # human-readable rule
  enforced: active                      # Layer B is WIRED (was: planned)

# ---------------------------------------------------------------------------------------
# "Change X => require Y" — the rules that stop forgotten artifacts (ADR-0029 D1/D4).
# Each maps a kind of change to the artifacts a PR MUST also contain.
# ---------------------------------------------------------------------------------------
change_requirements:
  api_change:
    detect: ["@Path", "@GET|@POST|@PUT|@DELETE|@PATCH", "request/response DTO under */rest/* or */api/*"]
    require:
      - "openapi.yaml updated"
      # API-contract bump classified from the OpenAPI diff (ADR-0048 D5), NOT from commit type:
      #   breaking  => new URL major (/api/v{N+1}) + deprecate predecessor
      #   additive  => info.version MINOR within the same /v{N}
      #   editorial => info.version PATCH
      - "api contract bump per OpenAPI diff"
      - "api_invariant holds: major(openapi.yaml:info.version) == openbank.api.version == URL /api/v{N}"
      - "consumer-driven contract test updated (Pact)"   # ADR-0029 D3
      # Pact provider verification: ONE @Provider test per provider. Separate HTTP and message
      # test classes that share @Provider + @PactBroker (no interaction-type filter) BOTH pull every
      # pact the broker holds for that provider — the HTTP class then tries to verify the message pact
      # via HttpTestTarget and fails the state-change callback (UnsupportedOperationException). Use one
      # class that picks the target per interaction (context.interaction.isAsynchronousMessage() ?
      # MessageTestTarget(listOf("<pkg>")) : HttpTestTarget(...)). Package-scope MessageTestTarget
      # (classpath-wide ClassGraph scan throws on JDK 25). Latent: ktlint runs before tests.
      - "single @Provider verification test per provider; per-interaction target for mixed HTTP+message"
    contract_diff_tool: oasdiff
    gate: api-contract
    enforced: enforce                   # ADR-0144 graduation, ahead of the 2026-08-15 target
    # .github/scripts/check-api-contract.py runs with --enforce in the "Validate manifests"
    # job on every PR (oasdiff 1.22.0, pinned + checksum-verified): classification and
    # api_invariant findings are ::error and fail the build.
    #
    # Why it graduated early: while advisory, the rule was being ignored — 11 of the 12 most
    # recent spec-changing commits added or altered endpoints without moving info.version at
    # all (e.g. #1161 added PATCH /api/v1/parties/{id}/consent and left 1.6.0 -> 1.6.0). An
    # advisory gate that everyone walks past is worse than none: it reports the rule is held
    # when it is not.
    #
    # The gate is DIFF-SCOPED, so that history is not retroactively a failure — only a PR's
    # own spec change is classified. The cost of enforcement is therefore one line per
    # spec-touching PR (bump info.version to match what the diff did), which the error
    # message spells out.
    ci_producer: ".github/scripts/check-api-contract.py"
    # A fourth class, `correction`, sits between breaking and additive: a breaking DOCUMENT diff
    # in a PR that changes NOTHING ELSE in the service. It requires MINOR, not MAJOR.
    #
    # Why it had to exist. `breaking` and the D2 invariant are jointly unsatisfiable for a spec
    # that never described the running service. Measured on aml-service (#2312/#2313) with the
    # pinned oasdiff: red at 1.0.0 because a MAJOR is demanded, red at 2.0.0 because D2 rejects a
    # major the served URL has not moved to. There is no third value. Worse, the only document
    # that went green was one that kept a phantom `status` enum value and a `default` the server
    # does not use — the gate was not merely blocking the correction, it was requiring the
    # falsehood, and aml shipped four GATE-CONSTRAINED concessions because of it.
    #
    # Why it is safe. A spec-only PR leaves the running server byte-identical, so no client that
    # works today can stop working; what "breaks" is a client generated from a document that
    # never described this server, and that client was already broken. Touch any other file in
    # the service — Kotlin, application.yaml, a test — and the normal breaking rule applies
    # unchanged. Only CHANGELOG.md and version.txt are exempt, because release-please writes them
    # and neither can change what is served.
    #
    # Why it is not an escape hatch. The discriminator is the diff, not a declaration: there is no
    # marker file and no PR-body token asserting that a spec "was never served". ~22 specs are
    # correction candidates (#2314), so anything a human asserts once would become the default
    # path 22 times over.
    #
    # It opens no new hole: landing a breaking change as code in one PR and the spec in another
    # already escapes this gate, which is scoped to spec diffs. What it does NOT check is whether
    # the corrected document is TRUE — openapi_route_conformance (below) covers the route set,
    # and nothing yet covers schemas.
    #
    # Unit tests: openbank-infra/scripts/check_api_contract_test.py, run by the
    # "governance-script unit tests" CI step. The negative cases are the point — a
    # reclassification that fires too eagerly disables the gate for real breaking changes.
  openapi_route_conformance:
    detect: ["openbank-*/src/main/resources/openapi.yaml", "JAX-RS @Path / @GET / @POST resource classes"]
    require:
      - "every route a resource class answers is published in that service's openapi.yaml"
      - "every route openapi.yaml promises is declared by a resource class"
    gate: openapi-route-conformance
    enforced: enforce                 # ADR-0144 graduation, ahead of the 2026-09-30 target (#2314)
    ci_producer: ".github/scripts/check-openapi-route-conformance.py"
    baseline: ".github/openapi-route-conformance-baseline.txt"
    # api_contract (above) classifies a spec's version bump against the PREVIOUS REVISION of the
    # same document. Nothing asked whether the document is TRUE. ADR-0005 says "CI lints it with
    # Spectral so docs cannot drift from runtime" — there is no Spectral config in this repo and
    # no workflow references it, so that control has never existed. The #2280 failure class:
    # check whether anything reads the artifact before assuming a green covers it.
    #
    # What the drift actually was, measured on the day this landed: 114 route-level findings
    # across 44 services. aml-service published request/response schemas whose fields exist
    # nowhere in the code (#2312, fixed in #2317); copilot-service served the human-in-the-loop
    # confirm for a money-path action proposal without publishing it (#2323) and declared a 501
    # its streaming endpoint cannot return (#2351, fixed in #2353). Worst single pattern: 10 of
    # the 15 services with an ApprovalResource serve PATCH /api/v1/<svc>/approvals/{id} — the
    # four-eyes control — without publishing it, most of them money-path.
    #
    # ROUTE SET ONLY. It does not read schemas, so an invented request field passes clean (that
    # was the whole aml defect); it does not read status codes, so a documented response the
    # handler cannot produce passes clean. A reflection test is the floor, not the ceiling — the
    # schema half needs the Quarkus-generated document
    # (quarkus.smallrye-openapi.store-schema-directory, a dependency the whole fleet already has
    # and nothing uses). Do not let a green here be read as "this spec is true".
    #
    # NOT diff-scoped, like db_backup_association and unlike api_contract/db_change: the defect
    # is a MISSING pair across two trees, so a PR touching only Kotlin never touches the spec and
    # a diff-scoped gate would see nothing.
    #
    # ENFORCED AGAINST A DECLARED BASELINE (#2314). 104 pre-existing findings could not be a
    # merge blocker on day one, and correcting a spec is blocked on the unsatisfiable-bump gap
    # (#2313) — but leaving it advisory is the shape this repo has already ruled against: an
    # advisory check over a GENERATED comparison has no judgement left to exercise, it just makes
    # the drift mergeable (#2216). So the gate runs with --enforce against
    # .github/openapi-route-conformance-baseline.txt, which declares those 104 findings verbatim.
    # A finding NOT in that file fails the build (new drift, the thing the gate is for); a
    # baseline line with no matching finding ALSO fails (the debt was paid — delete the line), so
    # the declaration cannot outlive the debt. The baseline does not narrow what the gate LOOKS
    # AT — every service is compared every run — which is what separates it from the
    # pact-drift-check scope bug (#2284). #2314 closes when the file is empty.
  openapi_request_schema_conformance:
    detect: ["openbank-*/src/main/resources/openapi.yaml", "the JAX-RS request-body DTO the resource actually deserializes into"]
    require:
      - "every property a request-body schema declares exists on the DTO the resource parses"
      - "every property the DTO has is declared on the request-body schema"
    gate: openapi-request-schema-conformance
    enforced: advisory
    target_enforce_date: "2026-09-30"
    ci_producer: ".github/scripts/check-openapi-request-schema-conformance.py"
    # openapi_route_conformance (above) is ROUTE SET ONLY — it does not read schemas, so aml's
    # invented request/response fields passed it clean (#2312). This is the request half of that
    # gap, using the document Quarkus itself generates
    # (quarkus.smallrye-openapi.store-schema-directory) as ground truth instead of guessing.
    # `:build` already runs `quarkusBuild` in its task graph (confirmed via --dry-run), so wiring
    # this into `_service-ci.yml`'s existing build step costs no extra build time.
    #
    # NOT the response half, and that is a decision, not a gap left for later. 457 handler methods
    # fleet-wide return a raw jakarta.ws.rs.core.Response, which erases the body type at the JVM
    # level — the scanner that produces the generated document has no static type to build a
    # response schema from and emits an EMPTY schema for those. Measured directly on aml-service:
    # AmlCaseResponse does not appear anywhere in the generated document, even though it is real
    # and correct. A generic response-schema gate over this fleet cannot distinguish "no schema
    # published" from "the scanner could not see the type" — it would report the majority of
    # correct endpoints as findings. The response half needs a per-endpoint contract test that
    # asserts the DTO shape directly, the pattern `CopilotApiContractTest` and the fx/aml
    # provider-verified pacts already use, not a generic diff.
    #
    # `required` is also deliberately not compared: SmallRye OpenAPI's scanner has no
    # jackson-module-kotlin integration, so it does not read Kotlin nullability and marks nearly
    # every constructor parameter required regardless of `?`. Measured on aml: `accountId: UUID?`
    # comes back required. Comparing required-ness would be near-100% noise. Property NAME
    # presence, by contrast, is unaffected by this and reliable in both directions.
    #
    # Found on the day this landed, not hypothetically: openbank-balance-service's
    # `PlaceHoldRequest` publishes a phantom `expiresAt` and omits the real, USED
    # `referenceId`/`ttlSeconds` — confirmed against `BalanceResource.placeHold`, which reads
    # `body.referenceId` and `body.ttlSeconds` directly. A caller following the published spec
    # cannot construct a valid request.
  db_backup_association:
    detect: ["openbank-infra/gitops/**/*.yaml (kind: Cluster, postgresql.cnpg.io)"]
    require:
      - "a CNPG cluster declaring barmanObjectStore -> the managed bucket has a matching
         aws_eks_pod_identity_association in db-backups.tf"
    gate: db-backup-associations
    enforced: enforce
    enforced_since: "2026-08-16"        # ADR-0144 — producer has run enforced in CI
    ci_producer: "openbank-infra/scripts/check-db-backup-associations.py"
    # Backup credentials arrive via EKS Pod Identity, granted per (namespace, serviceAccount) by
    # a HAND-MAINTAINED map in db-backups.tf. Nothing linked that map to the gitops manifests, so
    # a new database could declare a backup, copy `inheritFromIAMRole: true` from a sibling,
    # report Ready + Healthy — and silently never back up. There is no failure until someone
    # needs a restore. Three clusters were in that state (#1444); sdd-db failed every WAL archive
    # for three days.
    #
    # NOT diff-scoped, unlike db_change/api_contract: the defect is a MISSING pair across two
    # trees, so a PR adding only the gitops half never touches the .tf side and a diff-scoped
    # gate would see nothing. It runs against whole repo state instead.
    #
    # Deliberately NOT solved by a discovered for_each in Terraform — both routes are blocked:
    # data.kubernetes_resources returns `objects` as a dynamic type (unknown at plan, so it
    # cannot key a for_each; a tofu plan of that design read "0 to add, 35 to destroy"), and
    # yamldecode cannot parse the 30-of-42 multi-doc manifests. Same lesson as the OPA generator
    # gate (#1184): the list must be checked mechanically, not remembered.
  cnpg_backup_declared:
    applies_to: "every CNPG Cluster manifest under openbank-infra/gitops"
    requires:
      - "spec.backup.barmanObjectStore.destinationPath is set, OR the cluster carries
         openbank.io/backup-exempt-reason with a non-empty reason"
    gate: cnpg-backup-declared-gate
    # GRADUATED EARLY, 13 days before its 2026-09-15 date, because the same PR made the gate
    # able to fail at all. It carried `mode: enforced` from the day it was added (#4993) while
    # invoking its checker without --enforce, so a finding exited 0 and the gate was green by
    # construction. Leaving this record on `advisory` after fixing that would have reproduced,
    # in the very PR that reports it, the drift the sibling entry below documents.
    #
    # The graduation condition is met and was measured, not assumed: 0 findings across all 61
    # CNPG Cluster manifests on 2026-09-02, and the gate is falsifiable — stripping the
    # `backup:` block from a real cluster manifest takes it red.
    enforced: enforced
    ci_producer: "openbank-infra/scripts/check-cnpg-backup-declared.py"
    # The sibling of db_backup_association, for the case that rule CANNOT see. Its producer
    # scans for clusters that DECLARE a barmanObjectStore and skips the rest (`if not dest:
    # continue`), so a database that never asked to be backed up is not a mismatched pair and
    # is passed over. The rule that exists to make an unrecoverable database visible is
    # therefore blind to the most unrecoverable kind.
    #
    # Measured against the sandbox 2026-08-16, two independent probes agreeing: 59 live CNPG
    # clusters, 57 with a recovery point, 0 declared-but-unrecoverable, 2 with no backup
    # declared at all -- while db_backup_association reported clean across all of it.
    #
    # The exemption is an ANNOTATION ON THE CLUSTER, not an entry in a list kept beside the
    # manifests: a separate list is free to drift from what it describes with nothing to
    # notice, and an annotation cannot outlive the cluster it excuses.
    #
    # Advisory until 2026-09-15 for one specific reason, not caution: exactly one cluster is
    # in scope and unresolved -- engagement-db -- and whether it should be backed up or is
    # genuinely disposable is an owner's decision, not something a contributor should settle
    # to unblock a gate. Enforcing before that answer would fail every PR on an open question.
    # glitchtip-pg is live and also unbacked, but is deployed by a third-party chart and is
    # outside the gitops tree, so no gitops-scoped rule can reach it; that gap needs a runtime
    # control and is not silently counted as covered here.
  db_change:
    detect: ["src/main/resources/db/migration/*.sql", "Flyway/Liquibase changeset"]
    require:
      - "new Flyway migration (forward)"
      - "rollback note in PR"
    gate: db-migration
    enforced: enforce
    enforced_since: "2026-08-16"        # ADR-0144 — rollback/forward-only guard graduated
    # The rollback note lives IN the migration, as a `-- Rollback:` comment — single-line or
    # spanning the following comment lines. blocked_on used to call for a PR-BODY-parsing check,
    # but the established practice is in-file (96 of 214 migrations when the gate was written,
    # and every recent one), the file IS part of the PR, and an in-file note is strictly better:
    # it sits next to the migration forever, where whoever rolls it back is already looking.
    # The gate also covers the "forward" half of the requirement above — editing an
    # already-committed migration is a finding, since Flyway checksums the whole file.
    # Flipping to enforced = pass --enforce in ci.yml (one-line change).
    ci_producer: "openbank-infra/scripts/check-db-migration.py"
  event_change:
    detect: ["*.avsc", "Avro/JSON schema under */schema/* or */avro/*", "Kotlin data class extending DomainEvent (the actual event contract today — JSON on Kafka via the outbox)"]
    require:
      - "schema versioned backward-compatibly"
      - "breaking event change ships as a NEW versioned event (-vN topic, ADR-0006), never an in-place edit"
    gate: schema-compat
    enforced: advisory
    target_enforce_date: "2026-09-15"   # ADR-0144
    # GRADUATION EVIDENCE, measured 2026-09-05. Replayed check-event-schema-compat.py over the
    # REAL population — the 20 commits in 90 days touching a file that contains `DomainEvent(`,
    # found with `git grep -l`, not by path name — and the gate was demonstrably exercised:
    # 59 event-class property-set changes across DelegationEvents, ConsentEvents and others.
    # It flagged none, correctly: every delta was an ADDED field, which is backward compatible.
    # False positives on real history: 0 of 20. Same evidence shape #3438 used before
    # graduating threat-model-diff.
    #
    # Two caveats worth carrying, because the first four attempts at this measurement all
    # produced clean-looking numbers that meant nothing:
    #   * it only became meaningful after #8713 fixed a parser blind spot — a KDoc inside a
    #     constructor parameter list hid the parameter after it, so 15 properties fleet-wide
    #     were invisible and REMOVING one produced no finding at all;
    #   * selecting commits by path name (`*Event*.kt`, `*/events/*`) gave 40 commits of which
    #     ZERO touched an event file. Select the population from the code, never from names.
    #
    # NOT evidenced: no commit in the window REMOVED or retyped a field, so those paths rest on
    # the gate's own --self-test (17 cases), not on history.
    # CI producer is LIVE (advisory): .github/scripts/check-event-schema-compat.py runs in
    # the "Validate manifests" job on every PR — diff-scoped over DomainEvent data classes
    # (removed/renamed props, type changes, non-nullable-no-default additions = replay break,
    # eventType renames), *.avsc files (field default rules), and — since ADR-0260 picked
    # JSON Schema as the fleet's event-schema format, not Avro — */schema/*.schema.json files
    # (compare_json_schema: removed properties, type changes, a property becoming required, all
    # compared per-`oneOf`-branch so a header-discriminated topic's several message shapes are
    # each checked). The JSON Schema path is the ONLY compatibility check reachable for a
    # producer whose event class does not extend DomainEvent — e.g.
    # openbank-document-service's DocumentGenerated/SignatureCeremonyCompleted, structurally
    # invisible to the DomainEvent comparator the same way SepaPaymentCreatedEvent is on the
    # money-path side. Still no rules.yaml gate registration change: this is the SAME `gate:
    # schema-compat` / `event_change` rule extended to a new input shape, not a new gate — a
    # second advisory entry for the identical detect scope would be the #3009 duplicate-gate
    # mistake. Flip to enforced = --enforce.
    ci_producer: ".github/scripts/check-event-schema-compat.py"
  event_consumer_liveness:
    # ADR-0160 mechanism 1. standing-order-service published standing-order.due.v1 every day
    # for weeks with zero consumers anywhere in the fleet — full CRUD, passing tests, docs, a
    # scheduler doc-comment claiming a downstream consumed it — and nothing checked the claim
    # against the actual fleet (issue #889). This is a fleet-wide scan, not diff-scoped: any
    # Kafka topic published by ANY service's mp.messaging.outgoing (or dispatched via an
    # outbox to a declared topic) must have at least one @Incoming consumer somewhere in the
    # fleet (a matching topic:/topics: declaration), or be explicitly allowlisted below with a
    # one-line reason (external sink, deliberately audit-only, or a tracked future-work gap).
    detect: ["any <service>/src/main/resources/application.yaml mp.messaging.outgoing topic"]
    require:
      - "topic has >=1 real @Incoming consumer fleet-wide, or an allowlist entry with a reason"
    gate: event-consumer-liveness
    # GRADUATED to enforce 2026-07-14 (ADR-0144): the #996 fleet-sweep triage that started with
    # issue #889 brought unallowlisted violations to zero across three rounds (#1005 sca topic
    # mismatch, #1007/#1032/#1050 audit-service fan-out, #1054 fx-service dead-stub producer fix,
    # this PR's fx.conversion.completed/documents.document.event/payments.swift.event consumers)
    # — same graduation path check-outbox-dispatch-enabled.sh proved out. check-event-consumer-
    # liveness.py --root . --enforce reports 0 fleet-wide; ci.yml now passes --enforce.
    enforced: enforce
    # CI producer is LIVE and enforced: .github/scripts/check-event-consumer-liveness.py runs in
    # the "Validate manifests" job on every PR — fleet-wide scan (not diff-scoped). A new topic
    # published with no consumer and no allowlist entry now fails the build.
    ci_producer: ".github/scripts/check-event-consumer-liveness.py"
    # #996 triage findings, classified LEGITIMATE_NO_CONSUMER (not the #889 failure class):
    allowlist:
      # openbank.psd2.events left the allowlist in #8510: the producer itself was deleted
      # (the psd2_outbox apparatus had zero writers), so there is no topic left to exempt.
      # openbank.kyb.events left the allowlist here: onboarding-service now consumes it
      # (BusinessOnboardingEventConsumer, channel kyb-events-in, ADR-0284 D6). The entry said
      # to remove it with the first consumer PR, and the gate fails on a stale entry too.
      - topic: "openbank.tpp.registry.event"
        reason: "tpp-registry-service's own docs say the publish side is dormant (\"no domain events are emitted yet\" — outbox transport exists but unused). Not the #889 pattern (a working publish going nowhere): nothing is actually published today. Re-triage once the publish side is wired."
      - topic: "proposal-events"
        reason: "ADR-0244 agent-swarm case workflow, first slice (#4181/#4215). The producer is now fully deployed and the exemption is about the CONSUMER side only: openbank-infra/gitops/components/case-coordinator/kafka-case-coordinator-mtls.yaml declares the KafkaUser with Write+Describe on this topic and says in words \"producer-only ... No consumer side\", and kafka-topic.yaml (the Strimzi KafkaTopic, which does exist) says \"Consumer: none yet\". The intended consumer is the oversight/review surface ADR-0244 D7 describes; the ADR-0031 approval queue reads proposals through agent-service's store/REST today. Same shape as the delegation.events and incentive.events entries above. CORRECTED 2026-08-31 (#7740): this reason previously rested on three facts that are all false on main — the topic IS declared under openbank-infra/ (kafka-topic.yaml + the mTLS ACL), openbank-case-coordinator-agent IS in auto-deploy.yml's ALL_SERVICES, and its KafkaUser DOES exist. The conclusion survived its own evidence, which is the failure mode: a stale justification reads as a verified one. Re-triage: remove this entry with the first real consumer PR, and rename the topic to the fleet's openbank.<domain>.<event> convention before the first deploy, while it is still free."
      - topic: "openbank.loyalty.events"
        reason: "ADR-0282 phase 2, first slice. The Lístek ledger publishes earn, benefit-grant and expiry events; the services that would react to them (billing for the IFRS 15 provisioning journal, interest and fx for benefit delivery) are money-path and belong to a later slice, so a consumer written now would have nothing to do. ADR-0006's own sequencing is producers before consumers (#1916). Not the #889 class — the absence is the plan, not an oversight. Re-triage: remove this entry with the first delivering-engine PR (#8793)."
      - topic: "openbank.pid.events"
        reason: "Confirmed dead code, not a live gap: PidOutboxRepository.persistInTransaction (the only writer for this channel) has zero callers across all 5 pid-service use cases — grep-verified. pid-service's real domain events flow through a separate, actually-used PartyEventPublisher to party.events instead. application.yaml even documents the emitter exists only so the unwired @Channel doesn't crash the app at boot. Candidate for future cleanup (remove the dead channel), not a #889-class gap."
  lineage_code_audit:
    # ADR-0160 mechanism 2. standing-order-service's governance.yaml declares a downstream edge to
    # transaction-service (relationType: api) — copy-pasted boilerplate with no backing
    # @RegisterRestClient anywhere in the service. Nothing checked the claim against the actual
    # fleet, same root cause as issue #889 (a different unverified claim, same failure shape: prose
    # describing runtime behaviour, never checked against code). Fleet-wide scan, not diff-scoped:
    # every governance.yaml lineage.downstream edge (relationType api|topic) must be backed by
    # grep-verifiable code in the SAME service (a matching @RegisterRestClient configKey for api;
    # an actual topic produced/consumed in common with the target service for topic — a topic edge
    # doesn't name the specific topic, just the service, so it's a service-level cross-reference),
    # or be explicitly allowlisted below with a one-line reason (a REST call made through a
    # shared/generic client this heuristic's exact-match can't see, or a genuinely-stale edge
    # already tracked for cleanup elsewhere).
    # BOTH directions since #2315. An `upstream` edge on S naming T is a claim about T's code, so
    # it is verified in T — exactly as if T had declared the mirrored downstream edge. Treating
    # "someone else's code" as out of scope meant 63 upstream edges across 23 services were opened
    # by nothing, and a service declaring ONLY upstream was skipped outright; aml-service had 3 of
    # its 6 upstream edges wrong (#2312). Both directions normalize to one <source>-><target>
    # key, so a relationship declared from both ends is one check and one allowlist entry.
    detect: ["any <service>/governance.yaml lineage.downstream or lineage.upstream edge"]
    require:
      - "api edge has a matching @RegisterRestClient(configKey) in the same service, or an allowlist entry with a reason"
      - "topic edge has an actual topic overlap with the target service (per mechanism 1's producer/consumer map), or an allowlist entry with a reason"
      - "an edge naming no in-tree service directory (github, prometheus, temporal) is reported as its own class, never counted as code drift"
      - "an allowlist entry below whose edge is no longer declared, or is now backed by code the audit can see, is itself a finding — delete it"
    gate: lineage-code-audit
    enforced: enforced   # ADR-0144 graduation, issue #3982 — ahead of the 2026-10-15 target date
    # CI producer is LIVE (advisory): .github/scripts/check-governance-lineage.py runs in the
    # "Validate manifests" job on every PR — fleet-wide scan (not diff-scoped), reuses mechanism 1's
    # topic map via importlib (check-event-consumer-liveness.py's build_topic_maps), findings are
    # ::warning annotations. First scan (2026-07-13): 34 of 48 downstream edges have no backing code
    # found — consistent with mechanism 1's own first-scan rate (13/18, ~72%), i.e. this fleet's
    # governance.yaml lineage data really is this stale, not primarily a heuristic false-positive
    # rate. ALL still unallowlisted below (real triage tracked as a fleet-sweep issue, not resolved
    # by fiat). Flip to enforced once triage brings unallowlisted violations to zero = pass
    # --enforce to the script in ci.yml (one-line change), same as every other ADR-0144 gate here.
    # ENFORCED since #3982, which drained the backlog below. Re-measured on main that day the
    # scan read 31 unallowlisted violations of 103 declared edges, not the 30 of 101 the issue
    # filed — and the triage found the issue's default action (delete the edge) would have been
    # WRONG for a third of them:
    #   - 11 were REVERSED, not absent: the relationship is real and backed, declared with source
    #     and target swapped (finrep<->ledger, delegation<->sca/pid, party<->account/kyc,
    #     transaction<->fx, account<->transaction, onboarding<->party, notification<->consent,
    #     document<->sca/product-catalog, and the three customer-edge BFF hops). Deleting those
    #     would have removed 11 true dependencies from the lineage view, the service map and the
    #     catalog graph — the same failure the issue was raised about, in the other direction.
    #     They were flipped to the correct side instead.
    #   - 3 of the 11 (customer-edge) are ALSO invisible to the heuristic: it is a BFF with zero
    #     @RegisterRestClient interfaces, hopping via Vert.x WebClient — allowlisted below.
    #   - 1 was ASPIRATIONAL (case-coordinator-agent -> agent-service: no client, no gitops
    #     component, declared ahead of ADR-0244's code).
    #   - 2 findings were ONE relationship counted twice (psd2/sca under two `openbank-`
    #     spellings), and the transaction/account allowlist entry did not cover the same
    #     relationship declared from the other end. Edge keys are canonicalized to the service
    #     DIRECTORY name now, which is what made the docstring's "checked and allowlisted ONCE"
    #     claim true: 103 declarations collapse to 81 distinct relationships, not 103.
    #   - the rest were genuinely stale and were deleted, each with an in-place note saying what
    #     was checked (clients + the service's Deployment env, an independent witness).
    # Two heuristic blind spots were fixed in the same pass: a trailing `-api` on a configKey
    # (nine in the fleet) read as no backing code at all, and the un-canonicalized key above.
    # NetworkPolicies do NOT derive from this data — gen-network-policies.py reads the GitOps
    # Deployment env — so a lineage edit cannot change what traffic is allowed. The readers are
    # admin-ui (lineage view, service map, catalog graph, generate-service-graph.mjs,
    # generate-governance.mjs) and openbank-infra/scripts/generate-service-runbooks.py.
    prior_backlog: "issue #1021 triaged the original 34: 4 were a topic-normalization bug in the
      checker itself (fixed), 19 are stale governance.yaml edges (corrected/removed), 6 below are
      real dependencies the heuristic's exact-match can't see, and 4 are genuine gaps tracked as
      their own issues, not fixed here. A follow-up scan found 7 more edges outside the original
      34 (the *->admin-ui reversed-direction shape) — not yet triaged. #2315 then added the
      upstream direction: the first upstream scan surfaced 24 further unbacked edges (26 total
      unallowlisted, of which 2 are the pre-existing downstream findings) plus 10 edges naming an
      external system — all untriaged, which is why target_enforce_date is unchanged and this
      stays advisory. Re-measured 2026-08-08 (#3931): 103 relationships checked, 31 unallowlisted,
      5 allowlisted, 11 naming no in-tree service. Triage of those 31 is #3982; the mode flip is its
      last step, not a separate decision. NOTE the runner reports this gate PASS, not WARN — it is
      advisory INSIDE the script (::warning + exit 0 without --enforce) as well as by mode:, so its
      31 findings are invisible to anyone reading the gate verdict rather than the gate output.
      That is what produced this issue's own 'finds nothing, can graduate free' premise."
    ci_producer: ".github/scripts/check-governance-lineage.py"
    allowlist:
      - edge: "openbank-copilot-service->openbank-balance-service:api"
        reason: "Reached only through CustomerEdgeRestClient (configKey=customer-edge), a shared BFF client with no per-target configKey — GET /customer/v1/balances/{accountId}."
      - edge: "openbank-copilot-service->openbank-fx-service:api"
        reason: "Same shared CustomerEdgeRestClient (configKey=customer-edge) as balance-service above — GET /customer/v1/fx/rates."
      - edge: "openbank-copilot-service->openbank-ledger-service:api"
        reason: "Same shared CustomerEdgeRestClient (configKey=customer-edge) — GET /customer/v1/statements/{accountId}."
      - edge: "openbank-copilot-service->openbank-transaction-service:api"
        reason: "Same shared CustomerEdgeRestClient (configKey=customer-edge) — listTransactions()."
      - edge: "openbank-transaction-service->openbank-account-service:api"
        reason: "Validation is implemented via BalanceCoverClient (configKey=balance-service) placing/releasing holds, a sibling of account-service — never a direct account-service call."
      - edge: "openbank-customer-edge->openbank-account-service:api"
        reason: "customer-edge is a BFF with ZERO @RegisterRestClient interfaces — every hop is a Vert.x WebClient built from openbank.edge.account-service-url (CustomerEdgeResource); the Deployment env's ACCOUNT_SERVICE_URL is the independent witness."
      - edge: "openbank-customer-edge->openbank-party-service:api"
        reason: "Same Vert.x WebClient BFF shape as account-service above — openbank.edge.party-service-url / PARTY_SERVICE_URL."
      - edge: "openbank-customer-edge->openbank-sca-service:api"
        reason: "Same Vert.x WebClient BFF shape — openbank.edge.sca-service-url / SCA_SERVICE_URL."
  service_code_change:
    detect: ["<service>/src/main/**"]
    require:
      - "<service>/version.txt bumped per commit type"
      - "test added/updated for new behavior"
    gate: version-bump
    enforced: advisory
    target_enforce_date: "2026-10-01"   # ADR-0144
    blocked_on: "the version-bump half is effectively covered by release-please + check-app-version-override.sh; 'test added for new behavior' has no automated diff-aware detector (not yet written) — may get redefined to lean on the coverage ratchet gate instead of a literal test-added check"
  release_scope_mismatch:
    # The inverse failure mode of service_code_change above: release-please attributes a
    # commit to a component by the FILES IT TOUCHES under that component's directory,
    # regardless of the typed scope (RELEASE.md) — so a feat/fix/perf/security (or
    # breaking-marked) commit that only touches <service>/src/test/**, a root file like
    # <service>/openapi.yaml, or gitops/docs outside the service dir entirely still makes
    # release-please propose a release, even though only <service>/src/main/** should
    # (rule 2). Observed live: PR #547 (feat(finrep): register ArgoCD Application — touched
    # only a src/test boot-smoke test + gitops/docs outside the package dir) -> PR #551
    # (finrep-service 0.4.0 proposed for an unchanged artifact). Harmless SemVer inflation,
    # not a broken invariant — but the same mechanism misfires for any test-only or
    # openapi.yaml-only PR typed feat/fix, so it is worth catching at PR time rather than
    # correcting release-please output by hand (which rule 3 forbids anyway).
    detect: ["<service>/** changed", "PR title type in {feat,fix,perf,security} or a breaking marker/footer", "no changed file under <service>/src/main/** (or openbank-admin-ui/src/**)"]
    require:
      - "use a non-releasing type (test/docs/chore/refactor/build/ci) when the PR doesn't touch the release-worthy subtree"
      - "or split the src/main change and the non-src/main change into separate commits/PRs when both a release and a non-releasing change are intended"
    gate: release-scope-mismatch
    enforced: advisory
    target_enforce_date: "2026-10-01"   # ADR-0144, same timeline as service_code_change (same root-cause class)
    # CI producer is LIVE (advisory): openbank-infra/scripts/check-release-scope-mismatch.py runs
    # in the "Validate manifests" job on every PR, right after release-registration consistency.
    # Classifies from the PR title (the default squash-commit subject). Findings are ::warning
    # annotations. Flip to enforced = pass --enforce to the script in ci.yml (one-line change).
    ci_producer: "openbank-infra/scripts/check-release-scope-mismatch.py"
  service_config_change:
    # SmallRye Config / SnakeYAML do NOT merge duplicate mapping keys — the LAST
    # occurrence wins and earlier ones are SILENTLY dropped to library defaults, so
    # a boot smoke-test does not catch it. Forbidden at ANY nesting level in every
    # service application.yaml. Regression guard for #1170 (dup quarkus.http dropped
    # the port) and #1193 (dup top-level openbank: dropped rate-limit/resilience).
    detect: ["<service>/src/main/resources/application.yaml"]
    require:
      - "no duplicate mapping key at any level (merge duplicate blocks into one key)"
    gate: duplicate-yaml-keys                              # .github/scripts/check-duplicate-yaml-keys.sh
    # Enforced: the #1193 sweep is complete (openbank: blocks + the quarkus.http:
    # second layer in sca/tpp-registry/consent/pid) and the guard reports 0 fleet-wide,
    # so ci.yml runs check-duplicate-yaml-keys.sh with --enforce (hard gate).
    enforced: enforce
  money_path_or_trust_boundary_change:
    detect: ["money_path service src/main/**", "new service", "trust boundary change"]
    require:
      - "docs/threat-models/<service>.md present/updated"   # ADR-0030 D2
    gate: threat-model
    enforced: enforce                   # check-threat-models.py live in CI; all 13 money-path services have valid threat models
  trust_boundary_diff_change:
    # ADR-0030 D2, diff-aware half (issue #265). The coverage gate above proves a threat
    # model EXISTS; this one proves it is UPDATED in the same PR when a money-path
    # service's trust boundaries move: new/changed inbound REST endpoints
    # (infrastructure/rest/**), a new outbound HTTP/gRPC edge (infrastructure/client/**,
    # client-flavoured adapters), authn/listener/transport keys
    # (oidc|auth|authz|opa|http|kafka|security) in application.yaml, or the service's
    # NetworkPolicy / Deployment/Rollout manifest under openbank-infra/gitops/components/.
    detect: ["money-path <service> trust-boundary paths in the PR diff"]
    require:
      - "docs/threat-models/<service>.md updated in the SAME PR"   # ADR-0030 D2
    gate: threat-model-updated-on-trust-boundary-change
    enforced: enforced
    # GRADUATED in #3431, after the #3438 scope fix took the false-positive rate from 7-of-60
    # to 2-of-60 (both survivors real). This block said `advisory` with a target_enforce_date
    # of 2026-09-15 and described findings as "::warning annotations" with the flip still to
    # come — all three were already untrue. The gate runs `mode: enforced` AND passes
    # --enforce (both are required, #2392), so findings are ::error and fail the build.
    # Corrected 2026-09-02, found by reading gates.yaml against this file rather than either
    # alone: nothing cross-checks a rule's `enforced:` against the mode of the gate that
    # implements it, so this record could drift for as long as it did.
    ci_producer: "openbank-infra/scripts/check-threat-model-diff.py"
  mp_messaging_dotted_keys:
    # SmallRye reactive-messaging config written as a DOTTED key
    # (`mp.messaging.incoming.x.topic: …`) inside a nested YAML mapping is silently ignored by
    # SnakeYAML — the channel keeps its default and the consumer subscribes to nothing, with no
    # error at boot (issue #686). The guard rewrites the shape it can prove wrong.
    detect: ["<service>/src/main/resources/application.yaml", "mp.messaging.* written as a dotted key under a nested mapping"]
    require:
      - "mp.messaging channel config expressed as nested YAML, not a dotted key inside a mapping"
    gate: dotted-mp-messaging-keys
    enforced: advisory
    target_enforce_date: "2026-09-30"   # ADR-0144
    # RE-MEASURED 2026-09-05, and this note had gone stale in exactly the way it warns about.
    # Both issues it sequences on are CLOSED (#3928, #3931), and the count is not 16:
    # `check-dotted-mp-messaging-keys.sh --enforce` reports 171 occurrences today.
    #
    # 171 is not "the debt grew 10x" — the two gates count different things, which IS the point:
    #   * kafka-dotted-key-ratchet (ENFORCED) baselines today's set as an operational decision
    #     (#2945) and fails only on a NEW occurrence. It reports clean: 11 baselined, 0 new.
    #   * dotted-mp-messaging-key-guard (ADVISORY, this rule) has NO baseline at all and counts
    #     every occurrence, including the ones its enforced sibling deliberately accepted.
    #
    # So graduating this on 2026-09-30 would fail the build on 171 occurrences the enforced gate
    # has already decided to keep. The previous note's recommendation — retire the advisory
    # duplicate rather than graduate two overlapping gates — is therefore confirmed by
    # measurement. What is NOT established here is how many of the 171 are genuine defects
    # rather than the accepted set; that needs a ruling on the Kafka semantics and is the real
    # work behind this date.
    blocked_on: "graduating would fail the build on 171 occurrences (measured 2026-09-05) that the
      ENFORCED sibling kafka-dotted-key-ratchet deliberately baselines (11 entries, 0 new, #2945);
      this advisory gate has no baseline. #3928 and #3931, which the previous note sequenced on,
      are both closed. The action is to retire this duplicate, not to flip it — how many of the 171
      are genuine defects rather than the accepted set is unsettled."
    # Registered here as part of issue #2392: this gate ran advisory with no rules.yaml rule at
    # all, so check-gate-graduation.sh could not see it and it had no deadline. That class is now
    # itself gated by .github/scripts/check-advisory-gate-registration.py.
    ci_producer: ".github/scripts/check-dotted-mp-messaging-keys.sh"
  role_only_write_rule_naming:
    # GHSA-58jq-9hq3-66jr. `service-account-openbank-services` — the identity nearly every
    # backend service authenticates as — carries ROLE_OPERATOR in the realm, and
    # AuthorizeInterceptor classifies every client_credentials JWT as HUMAN. So a rego rule
    # granting a write on `type == HUMAN` + that role admitted ANY backend service to ANY write
    # in that domain. rest.rego now prohibits that at the `allow` head, but it identifies such
    # rules BY NAME (`operator-<domain>-write`) — which makes the naming convention
    # load-bearing, and it turns out the convention was never actually followed.
    detect: ["openbank-libs/governance/policies/rest.rego", "<component>/*_rest_ext.rego", "<component>/gen-*-opa-bundle.sh heredocs"]
    require:
      - "a role-only write rule is named operator-<domain>-write, or pins its caller with input.principal.id"
    gate: role-only-write-rule-naming
    # GRADUATED with a baseline, caught by the mirror direction of check-advisory-gate-registration
    # (#7941): the gate has run `mode: enforced` while this rule still read advisory with a stale
    # target date — the permanent-advisory defect ADR-0144 exists to prevent, with a fleet-wide
    # graduation-check outage armed on the date (#7897).
    enforced: enforce
    enforced_since: "2026-09-05"
    # The enforcement carries a baseline: 8 role-only WRITE rules predate the naming convention and
    # are baselined in the script (the count was 18 in the first revision; re-deriving empirically
    # found 10 unreachable by the shared identity — they bar service-accounts outright, gate on a
    # role it does not hold, or are reads). NEW violations fail; the 8 shrink as each is renamed and
    # its real callers confirmed — AUTHZ_ENFORCE is true on most of these services, so renaming one
    # without that confirmation is a money-path outage, not a test failure.
    ci_producer: ".github/scripts/check-operator-write-naming.py"
  new_service_with_outbox:
    # A service that extends AbstractOutboxEntity / uses OutboxDispatcher but does NOT
    # set openbank.outbox.dispatch-enabled=true silently never dispatches events —
    # no error, no log, attempt_count stays 0. This is the #1 new-service silent failure.
    detect: ["new <service>/ directory", "AbstractOutboxEntity subclass in src/main/**"]
    require:
      - "openbank.outbox.dispatch-enabled: true in <service>/src/main/resources/application.yaml"
    gate: outbox-dispatch-enabled
    # check-outbox-dispatch-enabled.sh landed and reports 0 violations fleet-wide
    # (2026-07-02) — the first gate this ADR-0144 sweep graduated on its own merge day.
    enforced: enforce
  admin_ui_code_change:
    # admin-ui is a released component (scope `admin-ui`); the version-bump discipline that
    # applies to every service applies here too. Changing app code under
    # openbank-admin-ui/src/** ⇒ bump openbank-admin-ui/version.txt per commit type, and keep
    # package.json:version equal to it (release_invariant; build-push-admin-ui.sh enforces).
    detect: ["openbank-admin-ui/src/**"]
    require:
      - "openbank-admin-ui/version.txt bumped per commit type"
      - "openbank-admin-ui/package.json version == version.txt"
      - "test added/updated for new behavior"
    gate: version-bump
    enforced: advisory
    target_enforce_date: "2026-10-01"   # ADR-0144
    blocked_on: "the version.txt==package.json half is already enforced (check-admin-ui-version-sync.sh, ci.yml); 'test added for new behavior' has no automated detector, same gap as service_code_change"
  admin_ui_docs_currency:
    # Documentation must stay current. Any change to a process or an admin-ui
    # section must update that section's documentation in the SAME PR — applies
    # to ALL admin-ui sections (docs/*, dashboards, process pages). Diagrams and
    # compliance scorecards are part of the section's documentation.
    detect:
      - "openbank-admin-ui/src/app/**/page.tsx"
      - "process spec / lens / controls[] under docs/*"
      - "process diagram (*.mmd) or process.yaml manifest"
    require:
      - "the section's documentation (copy, diagram, scorecard) updated in the same PR"
      - "compliance scorecard reflects current live/partial/planned status"
    gate: docs-currency
    enforced: advisory
    target_enforce_date: "2026-09-15"   # ADR-0144
    # MEASURED 2026-09-04, and the number is the argument: 451 commits in 30 days touch an
    # admin-ui `page.tsx`, and of a 60-commit sample only 3 (5%) also touch docs/, a .mmd
    # diagram or process.yaml. So the rule as written — "the section's documentation updated
    # in the same PR" — would fail 95% of admin-ui page commits, and the
    # docs-touched-when-page-touched heuristic this note proposes would fail exactly the same
    # 95%: it IS that rule. A gate that reddens 19 of every 20 PRs in a tree is not a control,
    # it is a thing people learn to click past (the same reasoning that keeps
    # check-entity-column-names.py checking a decidable convention instead of guessing).
    #
    # What is missing is therefore not a checker but a DEFINITION of currency that a machine
    # can decide and that a normal page edit does not violate — e.g. scoping to pages whose
    # documented CONTROLS changed, rather than to any page edit. Until that exists this date
    # cannot be met by writing code, and moving it without saying so would make this record
    # the fourth stale one found this week.
    blocked_on: "the rule as written is not enforceable: measured 2026-09-04, a strict or heuristic docs-touched-when-page-touched gate fails 95% of admin-ui page commits (451 page.tsx commits in 30 days; 3 of a 60-commit sample also touched docs). Needs a decidable definition of currency scoped to changed controls, not a checker"
  clock_injection:
    # ADR-0100 (DST Layer 1): no Instant.now() / LocalDateTime.now() / System.currentTimeMillis()
    # in domain or application layer of money-path services. All time must flow from an injected
    # java.time.Clock CDI bean (the pattern ledger/dispute already follow) so the DST harness can
    # virtualise it. A centralised libs Clock producer is tracked in #1612. Kotlin stdlib
    # Clock.System.now() is equally forbidden — use injected Clock.
    detect:
      - "money_path service src/main/kotlin/**/domain/**"
      - "money_path service src/main/kotlin/**/application/**"
      - "Instant.now()|LocalDateTime.now()|System.currentTimeMillis()|Clock.System.now()"
    require:
      - "injected java.time.Clock CDI bean used (centralised libs Clock producer tracked in #1612)"
      - "no Instant.now() / LocalDateTime.now() / System.currentTimeMillis() / Clock.System.now() in domain or application layer"
    gate: dst-clock-injection
    enforced: enforce                   # ADR-0100 simulation harness live (#1725); gate clean fleet-wide
  money_path_ledger_economics:
    # THE RULE: a change to how a money-path service posts to the ledger must be covered by a test that
    # asserts the resulting GL ACCOUNT BALANCES, not merely which journals were emitted.
    #
    # WHY. #1236 (lending, 2026-07-16) shipped a reschedule that silently forgave already-earned
    # interest — Dr Interest Income where the receivable should have been capitalised — and EVERY check
    # was green. Its tests asserted mechanics: posting kinds, ordering, reference strings,
    # idempotency-key equality. The defective code satisfied all of them perfectly: it emitted exactly
    # the right KIND of journal and merely pointed one leg at the wrong account. No test asked the only
    # question that matters — after this flow, what does the general ledger say? Reverted in #1247,
    # re-landed correctly in #1253.
    #
    # The failure mode is specific and repeatable: net profit is UNCHANGED, so nothing looks wrong,
    # while the CLASSIFICATION is wrong — a credit concession lands in a revenue line. Interest Income
    # and Loan Loss Expense are separately-reported FINREP lines. A mechanics test cannot see this; a
    # balance test fails on it immediately.
    #
    # THE PATTERN: capture the postings, replay them through the service's real journal factory (the
    # same mapping production uses), net debits/credits per account, assert each balance against a
    # hardcoded expected value. Reference implementation:
    # openbank-lending-service/src/test/kotlin/.../LendingGlOutcomeTest.kt.
    #
    # A BALANCE TEST IS NOT AUTOMATICALLY AN ECONOMIC TEST. Two traps, both found by review ON THE
    # REFERENCE IMPLEMENTATION ITSELF — and this entry previously recommended the first one as a virtue:
    #   * A whole-ledger "debits == credits" assertion is TAUTOLOGICAL when the factory emits one debit
    #     and one credit of equal value per posting: identically zero for every input, INCLUDING a leg
    #     mapped to the wrong account — the very defect being guarded against. Assert per-account
    #     balances against literals instead. The balanced-journal property belongs in the factory's own
    #     test, where an unbalanced branch could actually appear.
    #   * A mutation can turn a test red FOR THE WRONG REASON — the unguarded flow dying on an unstubbed
    #     mock before it ever reaches the ledger, so "no postings were made" passes vacuously. Stub
    #     enough that the DEFECTIVE path runs, and assert the wrong balance it actually produces.
    detect:
      - "money_path service change to a ledger PostingKind, its GL account mapping, or a posting flow"
    require:
      - "a test asserting the GL ACCOUNT BALANCES the flow produces, not only the journals it emits"
      - "a new PostingKind covered by a balance assertion, not only a mapping assertion"
      - "the test proven to fail against the defect it guards — AND for the right reason, not on an unstubbed mock"
    gate: none
    # Deliberately NOT a CI gate. "This test asserts economics" is not detectable by a regex, and a gate
    # that pretended to check it — grepping for balance assertions, say — would pass a test asserting the
    # WRONG balances, or one going red on an unstubbed mock. That is worse than an honest convention: it would read as coverage while providing
    # none, which is the same class of failure it exists to prevent. Enforced by review, under the
    # money-path two-approval rule.
    enforced: convention
  release_please_merge:
    # A release-please merge commit that reorders the tail of .release-please-manifest.json can
    # SILENTLY drop a component line while it stays in release-please-config.json. The
    # release-registration gate (rule #3, ADR-0029) runs against repo STATE, not the diff, so it then
    # fails on EVERY open PR; release-please also loses the version baseline and proposes a REGRESSED
    # version (observed: transaction-service 1.10.0 -> a fresh 1.0.0, #2342/#2351). After ANY RP merge,
    # config and manifest MUST stay in lockstep (same component set). Restore a dropped line with its
    # version.txt value (= latest git tag) as baseline.
    detect: ["release-please merge to main", ".release-please-manifest.json change"]
    require:
      - "release-please-config.json and .release-please-manifest.json list the SAME components (lockstep)"
      - "check-release-registration.py reports equal counts (modules==config==manifest)"
      - "no released component proposes a version BELOW its latest git tag"
    gate: release-registration                            # openbank-infra/scripts/check-release-registration.py
    enforced: enforce

# ---------------------------------------------------------------------------------------
# Money-path services (from CODEOWNERS critical paths) — stricter rules apply.
# Two approvals, mandatory threat model, mutation testing, higher coverage floor.
# ---------------------------------------------------------------------------------------
money_path_services:
  - openbank-ledger-service
  - openbank-transaction-service
  - openbank-account-service
  - openbank-balance-service
  - openbank-sepa-payment
  - openbank-sepa-instant
  - openbank-domestic-payment
  - openbank-clearing-service
  - openbank-swift-service
  - openbank-fx-service
  - openbank-lending-service
  - openbank-sdd-service                  # issue #1478: SddCollectionDebitConsumer posts a real debit via
                                           # TransactionServiceClient for every authorised direct-debit collection
                                           # (#1027, merged) — moves funds directly, not adjacent to it like
                                           # sca/consent/vop below. Threat model:
                                           # docs/threat-models/openbank-sdd-service.md.
                                           # four-eyes assessed (#8359): sdd.approve (B2B mandate confirmation —
                                           # the act that authorises all future debits on a mandate) WIRED via
                                           # four_eyes.actions below. sdd.authorise assessed, NOT wired: it is
                                           # the bulk authorisation of inbound collections whose DESIGNED caller
                                           # is clearing automation (sdd_rest_ext.rego header documents that
                                           # caller is simply not built yet — the consent.activate "plausibly
                                           # could" case), so gating it today buys nothing (no caller exists)
                                           # and plants the exact trap the four_eyes.verbs guardrail describes
                                           # for the day that caller ships. When it does, the operator
                                           # authorise-by-hand path gets its OWN distinct action and THAT is
                                           # gated. sdd.create/update/delete are edge-reachable customer
                                           # self-service (M2M grant in edge-service-sdd) with effect on FUTURE
                                           # debits only — ungateable per the guardrail, same shape as
                                           # standing-order order CRUD. The debit itself is event-driven
                                           # (SddCollectionDebitConsumer), no HTTP PEP on that path.
  - openbank-interest-service              # issue #1478: capitalize()/write-off post real GL journals
                                           # (LendingJournalFactory-equivalent), and withholding-tax remittance
                                           # (#999, merged) books a cash leg via transaction-service.
                                           # Threat model: docs/threat-models/openbank-interest-service.md.
                                           # four-eyes assessed (#8359): interest.create (manual accrue,
                                           # capitalize — posts real GL journals, rate-config create — shapes
                                           # all future accrual amounts, withholding remittance assemble —
                                           # triggers the real cash leg) and interest.trigger (manual mass
                                           # accrual) WIRED via four_eyes.actions below; both are human-only
                                           # (operator-interest-write excludes service accounts outright AND
                                           # the interest_rest_ext prohibition vetoes them at the allow head;
                                           # fleet audit found no M2M writer — agent-service's client is
                                           # read-only). The daily accrual / monthly capitalization schedulers
                                           # and the remittance settlement consumer call the use cases
                                           # IN-PROCESS, so the HTTP-layer gate never touches automation.
                                           # interest.delete (deactivateRateConfig) NOT wired: it stops future
                                           # accrual — reduces money movement, standing-order pause precedent.
                                           # interest.read/list are reads. Runs AUTHZ_ENFORCE=true (flipped in
                                           # #3695); four-eyes enforcement stays off fleet-wide
                                           # (authz.four-eyes.enforce, ADR-0155) — wiring sets the flag only.
  - openbank-sca-service                  # four-eyes assessed (issue #938 follow-up) and WIRED since #8360
                                           # via ADR-0280's per-action service-account exemptions: device.enroll
                                           # and scaChallenge.consume are in four_eyes.actions below, with
                                           # four_eyes.exemptions carrying their verified M2M callers
                                           # (service-account-openbank-edge for both, the shared backend client
                                           # for scaChallenge.consume's delegation/document ceremonies, #3734).
                                           # What remains gated is exactly the path the stalemate left open:
                                           # the human ops-console caller (operator-sca-write) — enroll a device
                                           # on behalf of a party, or spend an approved challenge — pauses for a
                                           # second approver once authz.four-eyes.enforce (ADR-0155) is enabled,
                                           # while the SCA settlement gate and self-service enrollment keep
                                           # flowing. Threat model: docs/threat-models/openbank-sca-service.md.
                                           # four_eyes.exemptions exists to close this class of stalemate — do
                                           # not use it to exempt a HUMAN principal, and do not exempt a
                                           # service-account id whose client is shared with a human-reachable
                                           # flow.
  - openbank-consent-service               # four-eyes wired (issue #938 follow-up) on consent.grant/consent.revoke.
                                            # UPDATED (ADR-0206): no longer exclusively human-operator — the shared
                                            # M2M principal may now call both, but ONLY for
                                            # grantee=party-service:marketing-comms (consent-opa-bundle.yaml's
                                            # service-consent-m2m-marketing rule), a low-risk SCA-exempt marketing
                                            # toggle (ADR-0205 D1). AUTHZ_FOUR_EYES_ENFORCE is false today for
                                            # consent-service (consent-service.yaml has no override), so this M2M
                                            # path is not currently blocked by the maker/checker pause — but if
                                            # four-eyes enforcement is ever flipped on for this service, the
                                            # party-service forwarder (no human in the loop) would stall on the
                                            # missing second approver. Flag that rollout precondition before
                                            # flipping AUTHZ_FOUR_EYES_ENFORCE here. consent.activate deliberately
                                            # left ungated: its rego already reserves an M2M grant for a possible
                                            # SCA-completion-callback caller.
  - openbank-delegation-service            # ADR-0232: mints payment rights (customer-to-party grants) without moving
                                            # money itself — money-path for the same reason consent/vop are. Threat
                                            # model: docs/threat-models/openbank-delegation-service.md. four-eyes assessed:
                                            # delegation.offer/revoke are self-service with SCA-bound ceremonies on both
                                            # ends. The bank-side suspend was justified here as landing "via the fraud
                                            # pipeline, not an operator console" — that is NOT true (#4403): fraud scoring
                                            # is shadow-only and drives no suspension, so this exemption rested on a
                                            # control that does not exist. The exemption still holds on the narrower and
                                            # true ground that no operator suspend endpoint has shipped, so there is no
                                            # maker/checker pair to gate yet. Revisit when the operator backoffice
                                            # surface ships, and do not re-derive it from the fraud pipeline.
  - openbank-fraud-service                # ADR-0084: v4 rule engine live; scoring is SHADOW-ONLY on every rail. The domestic-payment
                                           # enforcement gate (issue #667) was MERGED AND THEN DELETED by 189fe7b03 (PR #2122,
                                           # closing issue #1917) — this comment credited it as merely flag-gated until #4403.
                                           # No fraud verdict changes any payment outcome today: the four wired rails call
                                           # POST /fraud/score and log the result. See ADR-0084's 2026-08-09 correction block.
                                           # four-eyes assessed (issue #938 follow-up): the only REST surface today is a stateless
                                           # POST /fraud/score (fraud.score) — no operator case-decision, rule-config, or manual
                                           # override endpoint exists yet, so there is nothing real to maker-checker gate. Revisit
                                           # once a fraud case-management endpoint ships (clearing a flag / disabling a rule /
                                           # forcing a decision would need `clear`/`override`/`disable` verbs added here then).
  - openbank-billing-service              # ADR-0143: fee assess/post/reverse shipped (phases 1a-2e); real-env e2e verification + four-eyes enforcement flip still gate production go-live
  - openbank-settlement-service           # issue #307: debit->credit->ledger-booking saga (ADR-0101), orchestrated by a real
                                           # Temporal workflow (SettlementWorkflowImpl) — not a bespoke non-Temporal saga.
                                           # four-eyes assessed (issue #938 follow-up): the only REST surface is
                                           # POST /settlements (settlement.create), which starts the (self-healing, self-
                                           # compensating) saga; there is no manual retry/force-complete/compensate endpoint to
                                           # gate. Revisit if such an operator override endpoint is ever added.
  - openbank-sanctions-service             # ADR-0116: real feed screening; four-eyes wired (issue #938 follow-up) on
                                            # sanctions.clear (deciding a screening hit) — the highest-risk action in this
                                            # service, since a wrongly-cleared true positive is a real sanctions violation.
  - openbank-vop-service                   # ADR-0171: Verification of Payee (IPR Art. 5c) — sits on the pre-execution path of
                                            # every euro credit transfer. Money-path for the same reason sca/consent/fraud are:
                                            # it gates money movement without moving money itself.
                                            # four-eyes assessed: the only REST surface is POST /vop/verify (vop.verify), a
                                            # read-shaped check that mints nothing and decides nothing a human could collude on
                                            # — there is nothing to maker-checker gate. The action that WOULD deserve a gate is
                                            # a runtime change to `openbank.vop.max-edit-distance`: widening it silently turns
                                            # genuine mismatches into reassuring amber warnings (threat model §3 Tampering).
                                            # It is gitops-only config today, so it is covered by PR review rather than
                                            # four_eyes.verbs; add a `vop.flip` verb here if it ever becomes operator-tunable.
  - openbank-standing-order-service        # issue #2188: StandingOrderDueConsumer POSTs a real SCT to
                                            # sepa-payment `/api/v1/sepa-payments` for every due order (#889, merged) —
                                            # initiates money movement like sdd, not adjacent to it. Same class as sdd:
                                            # it shapes the instruction, the irreversible debit lives downstream in a
                                            # gated money-path service. Threat model:
                                            # docs/threat-models/openbank-standing-order-service.md.
                                            # four-eyes assessed: the only money-moving path is the scheduler-driven
                                            # consumer (no human in the loop by design); the REST surface is
                                            # customer/operator CRUD on orders (create/amend/pause/resume/cancel), whose
                                            # effect is a FUTURE scheduled debit, not an immediate one — pausing or
                                            # cancelling an order REDUCES money movement. There is no operator
                                            # force-execute endpoint to maker-checker gate; add a verb here if one is
                                            # ever added. Runs AUTHZ_ENFORCE=false (advisory) — joins the #3679 cohort.
  - openbank-psd2-service                  # issue #2188 sibling sweep: PaymentInitiationService (PIS) calls
                                            # transactionClient.initiatePayment for SCT/SCT_INST/domestic/SIPO — it
                                            # initiates real payments like sdd/standing-order do, consent- and
                                            # SCA-gated upstream (ADR-0090, ADR-0126). Already treated as money-path
                                            # by the OPA-bundle converge work (#3422); this makes the list agree.
                                            # Threat model: docs/threat-models/openbank-psd2-service.md.
                                            # four-eyes assessed: initiation is TPP-driven under an eIDAS consent with
                                            # SCA on the debtor — a maker/checker pair does not exist for a
                                            # customer-consented machine flow; the bank-side actions that WOULD deserve
                                            # a gate (TPP revocation, consent termination by an operator) are not
                                            # wired as operator verbs today. Runs AUTHZ_ENFORCE=false (advisory) —
                                            # joins the #3679 cohort.
  - openbank-card-issuance-service         # ADR-0283 phase 0 (#8808): ships the card authorisation decision
                                            # (POST /cards/{id}/authorizations, CardAuthorizationPolicy) and
                                            # SCA-gated limit/control changes (ADR-0194) — it decides whether money
                                            # may move, which is money-path for the same reason sca/consent/vop/
                                            # delegation are. Threat model: docs/threat-models/openbank-card-issuance-service.md.
                                            # four-eyes assessed: card.block/suspend/resume/outbox.requeue REDUCE or
                                            # repair money movement; card.create/activate are SCA-bound customer
                                            # ceremonies (ADR-0194). No operator endpoint raises a limit or a control
                                            # without the cardholder's SCA today — add a verb here when one ships.
                                            # Runs AUTHZ_ENFORCE=false (advisory) — joins the #3679 cohort.

# ---------------------------------------------------------------------------------------
# SLOs (issue #669 — operational evidence, scope item 3). Governed data: a single
# availability + latency target applied uniformly across every money_path_services entry
# above (no separate service list here — money_path_services is the one list, to avoid the
# two-lists-drift class of bug rule #7 exists to prevent). Reconciled into Prometheus
# multi-window burn-rate rules by Pyrra (ADR-0088 D2), one ServiceLevelObjective pair
# (availability + latency) per service in
# openbank-infra/gitops/components/observability/pyrra-slo-money-path.yaml.
# check-slo-registry.sh (CI, required) fails if a money-path service is missing either SLO
# object, or if an existing object's target/window drifts from the values below — so
# dashboards/alerts derive from this governed data, never a hand-edited PrometheusRule.
#
# Targets are REFERENCE defaults, not calibrated against real production incident or
# traffic history — this is a reference implementation with no live customer traffic (same
# honesty disclosure as the openbank-lending-service PD/LGD placeholders — those are now
# governed by the calibration process in openbank-lending-service docs
# 07-risk-model-calibration, issue #8364). Revisit once the
# load-benchmark / DR-drill scope of issue #669 produces real numbers.
slo:
  availability_target: "99.9"           # percent of non-error requests, uniform fleet-wide
  availability_window: 30d
  latency_target_percent: "99"          # percent of requests faster than latency_threshold_seconds
  # tighter than the fleet HighLatencyP99 alert (2s, prometheus-rules-tier1.yaml) by design:
  # the SLO burn-rate should page before the blunter absolute-latency alert does.
  latency_threshold_seconds: 1
  latency_window: 30d

# ---------------------------------------------------------------------------------------
# Alert delivery (ADR-0082 / ADR-0088). Keep this section terse: rules.yaml is embedded
# verbatim into every OPA sidecar bundle ConfigMap. Full rationale lives in ci_producer.
# ---------------------------------------------------------------------------------------
alerting:
  # At least one Alertmanager route matching severity=critical must end at a receiver that
  # egresses the cluster (external integration, or a webhook with a literal non-cluster
  # URL; a url_file counts as unprovable). In-perimeter paging (GoAlert -> ntfy, ADR-0088
  # D1) may stay alongside it, but not as the only leg. Guards the "severity inversion":
  # critical routed only to no-Ingress in-cluster receivers (ADR-0056) while warning
  # reached Slack, so the most severe alerts were the least likely to be seen.
  critical_alerts_must_egress: true
  enforced: enforce
  ci_producer: ".github/scripts/check-critical-alert-egress.py"
  checked_manifest: "openbank-infra/gitops/apps/kube-prometheus-stack.yaml"

  # An alert can also fail by never reaching its subject. Every top-level key an ArgoCD
  # Application hands a Helm chart via `helm.valuesObject` must demonstrably change the
  # rendered output; Helm discards an unknown key with no error and no ArgoCD diff.
  # apps/argo-rollouts.yaml spelled `metrics` at the top level where the chart wants
  # `controller.metrics`, so no ServiceMonitor was ever created, Prometheus held zero
  # rollout_* series, and three Rollout alerts covered 0 of 21 Rollouts while reading
  # `health: ok` — an expression over an absent metric is an empty result, not an error
  # (#4584). Measured by rendering with and without each key, never by schema comparison,
  # which false-positives on free-form chart sub-trees.
  helm_values_keys_must_have_effect: true
  helm_values_ci_producer: ".github/scripts/check-helm-values-keys.py"
  helm_values_checked_manifests: "openbank-infra/gitops/apps/*.yaml"

review:
  default_approvals: 1
  money_path_approvals: 2
  self_merge_forbidden_on: [CODEOWNERS_protected]

  # ENFORCEMENT STATUS: aspirational, NOT enforced. Stated here because a governance file
  # that describes a control it does not have is worse than one that admits the gap — an
  # auditor, a threat model, or the next contributor reads the number above as a gate.
  #
  # The `main-protection` ruleset carries `required_approving_review_count: 0` and
  # `require_code_owner_review: false`, so nothing blocks a merge on approvals. The comment
  # that used to sit on the line above claimed "CONTRIBUTING.md + branch protection"; the
  # branch-protection half has never been true. Measured 2026-08-02: ALL NINE money-path PRs
  # merged since issue #2183 was filed (2026-07-25) carried zero approvals — a 0% compliance
  # rate, not occasional drift. #2183 has the full table.
  #
  # WHY IT IS NOT SIMPLY TURNED ON: the repository has exactly one account with write access,
  # and GitHub does not allow approving your own pull request. Setting the count to 2 — or to
  # 1 — would make `main` unmergeable except via `gh pr merge --admin`, including the ~half of
  # all merges opened by `openbank-gitops-bot` (deploys, release-please). The result would not
  # be a stricter control; it would normalise the admin bypass that this repo's own rules
  # forbid, and remove even the signal that something was overridden. Enforcing an
  # unsatisfiable requirement is a worse position than an admitted gap.
  #
  # COMPENSATING CONTROLS actually in force on a money-path change (each independently
  # verifiable, unlike the approval count): the five required status checks; the ADR-0030
  # threat model requirement; the money-path-only gates in .github/gates/gates.yaml
  # (clock-injection, SLO registry, OPA bundle sync); and the runtime four-eyes gate on
  # money-path verbs (`four_eyes.verbs` below), which is a *separate* mechanism from GitHub
  # review — though note #3349: its self-approval guard has no test that ever feeds it a
  # maker approving themselves.
  #
  # REVISIT TRIGGER — this is a capacity gap, not a policy decision, so it expires on a fact,
  # not on a date: the moment a second account holds write access, set
  # `required_approving_review_count: 1` with `require_code_owner_review: true` on
  # `main-protection`, confirm a bot PR can still merge, and only then raise money-path to 2.
  # Tracked in #2183.
  enforcement_status: aspirational_not_enforced
  enforcement_blocker: single_write_access_account
  enforcement_tracking_issue: 2183

# ---------------------------------------------------------------------------------------
# Money-path action-prefix overrides (issue #395). rest.rego derives a scope from each
# money_path_services entry by stripping `openbank-` and a trailing `-service`
# (openbank-ledger-service -> ledger) and matches it against the @Authorize action
# prefix (the part before the first `.`). A fleet audit found 5 services whose real
# prefix does not equal that derived name — two (clearing, sca) aren't even a casing
# variant of it — which silently disabled four_eyes_required for every one of them.
# List the REAL @Authorize prefix(es) here for any service where it differs; rest.rego
# uses this instead of the derived name for that service, and rest_test.rego pins each
# entry against the service's actual source so a rename can't silently drift back out
# of sync. Only list a service here when it diverges — everything else keeps using the
# derived name.
money_path_action_prefixes:
  sepa-payment: [sepaPayment]
  sepa-instant: [sctInstPayment]
  clearing: [clearingBatch]
  sca: [device, scaChallenge]
  # domestic-payment: intentionally NOT listed here (removed 2026-07-08, found while
  # auditing issue #413). Its @Authorize actions were independently renamed from
  # domesticPayment.* to domestic-payment.* (kebab-case, matching the derived scope)
  # by a later change — the override entry this table used to carry (domesticPayment)
  # had gone stale and was silently breaking the scope match again (input.action
  # "domestic-payment.transitionStatus" no longer starts with the overridden
  # "domesticPayment." scope). Now correctly covered by the default derived-name rule
  # below — do not re-add an override here unless the action prefix diverges again.

# ---------------------------------------------------------------------------------------
# Four-eyes (dual control) for the unified OPA authz PEP (ADR-0034 D1; rest.rego reads
# data.rules.four_eyes.verbs). A money-path action whose verb is listed here is flagged
# `four_eyes_required` so the handler demands a second approver (maker-checker). This is
# an AUGMENTATION flag, not an allow/deny on its own. NOTE: rest.rego normalises the
# money_path_services entries (strips the `openbank-` prefix and a trailing `-service`,
# or applies the money_path_action_prefixes override above) to the action scope
# namespace, e.g. `openbank-ledger-service` -> `ledger`.
#
# transfer/post/reverse/freeze/release/flip were the originally-designed vocabulary, but
# a fleet audit (issue #395) found real @Authorize verbs rarely spell it that way — only
# ledger.reverse, transaction.reverse and account.freeze literally matched. The verbs
# below were added to cover the real money-moving action each service actually emits.
four_eyes:
  verbs:
    - transfer                          # outbound value movement (sepa/domestic/swift/instant)
    - post                              # ledger journal posting
    - reverse                           # ledger reversal
    - freeze                            # account freeze/unfreeze
    - release                           # release a held payment
    - flip                              # money-path feature-flag flip (ADR-0067 / issue #419)
    - transitionStatus                  # sepa-payment / domestic-payment lifecycle transition (issue #395)
    - recall                            # sepa-instant: recall a SETTLED payment (issue #395)
    - settle                            # clearing: settle a clearing batch (issue #395)
    - disburse                          # lending: loan payout (issue #395)
    - send                              # swift: send an outbound wire message (issue #395)
    - credit                            # balance: direct ledger-balance credit adjustment (issue #395)
    - debit                             # balance: direct ledger-balance debit adjustment (issue #395)
    - collateralRegister                # lending: collateral registration/edit feeds IFRS 9 LGD (issue #621)
    - convert                           # fx: execute a currency conversion at the current spot rate (issue #938 follow-up).
                                         # Confirmed no M2M caller (fx-service's own rego: "fx.convert... has NO in-repo M2M
                                         # caller today and stays human-only") — see the guardrail note below before adding
                                         # any further verb here.
    - grant                             # consent: create a new TPP<->customer data-access consent (renamed from consent.create,
                                         # issue #938 follow-up). Confirmed no M2M caller (consent-service's own rego: "consent.grant
                                         # and consent.revoke are NOT granted to M2M clients").
    - revoke                            # consent: operator-initiated revocation of a customer's active consent. Confirmed no M2M caller
                                         # (same rego note as consent.grant above).
    - sweep                             # transaction: move a duplicate party's balance to the surviving party during an
                                         # identity merge (ADR-0179). Confirmed no M2M caller — POST /transactions/merge-sweep
                                         # is a NEW endpoint introduced with this verb, admits only ROLE_OPERATOR/ROLE_ADMIN
                                         # (no ROLE_SERVICE), and has no in-repo caller other than a human operator console.
                                         # It exists as its own action precisely so the verb can be gated here: the equivalent
                                         # movement through transaction.create could NOT be, since `create` is on the M2M
                                         # payment rails — the distinct-operator-only-action pattern this guardrail prescribes.
    - clear                             # sanctions: decide a screening hit (CLEAR/HIT/POTENTIAL_HIT) — a wrongly-cleared true positive
                                         # is a real sanctions violation; distinct from `release` (payment-hold release) for clean audit
                                         # separation. Confirmed no M2M caller (@RolesAllowed on POST /sanctions/review admits only
                                         # ROLE_OPERATOR/ROLE_ADMIN, no ROLE_SERVICE).
    # GUARDRAIL (issue #938 follow-up — found while wiring sca-service): four_eyes_required is
    # computed by ACTION NAME ALONE (rest.rego money_path_scopes + endswith verb match), with NO
    # awareness of the caller's identity. A verb is only safe to add here if EVERY real-world
    # caller of that action across the WHOLE fleet is a human operator/admin session — if even one
    # legitimate M2M/automated caller exists, four-eyes enforcement (once ever flipped on for that
    # service) pauses that automated flow too, indistinguishably from the risky human path it was
    # meant to gate. sca-service's device.enroll and scaChallenge.consume were both assessed and
    # REJECTED for this reason: both are granted to customer-edge's M2M identity in base rest.rego
    # (edge-service-notification's device.* family, sca's own service-sca-edge-m2m rule) for
    # ordinary customer self-service device enrollment and — critically — scaChallenge.consume is
    # the payment settlement gate every real payment passes through. Gating either would silently
    # brick production automation the moment enforcement is ever turned on, not just close the
    # risky operator-console gap. Before adding a new verb: grep every service's own
    # gen-<service>-opa-bundle.sh for an M2M/SERVICE-identity rule granting that action; if one
    # exists (or plausibly could — consent.activate was ALSO excluded for this reason, no confirmed
    # caller found but the rego already reserves the grant), the risky path needs its own distinct
    # action (e.g. a dedicated operator-only "enrollOnBehalf" endpoint) before it can be four-eyes
    # gated safely — do not reuse the shared customer/M2M-facing action.
  #
  # actions: exact action names, gated independently of money_path_scopes (ADR-0176 D5).
  # `verbs` above only ever fires for an action whose SCOPE derives from money_path_services —
  # notification-service is not, and never will be, on that list (D5's own reasoning), so no verb
  # addition could reach opsmessage.compose. This generalises the featureflag.flip precedent two
  # blocks down (an exact action name, independent of money-path scope, already shipped with
  # ADR-0067) into a reusable list instead of a one-off inline clause. Read disjunctively with
  # `verbs` in rest.rego's four_eyes_required — a service can be gated by either mechanism, never
  # both computing the same answer twice.
  #
  # The GUARDRAIL above applies here too, unchanged: opsmessage.compose is its own action
  # namespace specifically so this list-membership can never accidentally cover an M2M-reachable
  # action — rest.rego's edge-service-notification rule grants notification.* to customer-edge's
  # M2M identity via a prefix match, and opsmessage.* was kept out of that family for exactly this
  # reason (ADR-0176 D4).
  actions:
    - catalog.publish                  # ADR-0257: human checker publishes immutable commercial terms;
                                         # core also enforces maker != checker for standalone installs.
    - opsmessage.compose                # ADR-0176 D5: operator-initiated customer messaging.
                                         # Confirmed no M2M caller — the only allow rule for this
                                         # action requires HUMAN + (ROLE_OPERATOR or ROLE_ADMIN) and
                                         # explicitly excludes any service-account-* principal id
                                         # (rest.rego operator-compose-message), the same exclusion
    - campaign.activate                 # ADR-0200 D5: marketing campaign activation reaches a cohort,
                                         # so its blast radius exceeds a single operator message —
                                         # four-eyes with the self-approval guard, human-only
                                         # (maker != checker), same mechanism as opsmessage.compose.
                                         # m2m-sanctions-screening uses for the opposite carve-out.
    - party.merge                       # ADR-0179: retire a duplicate identity into a survivor
                                         # (POST /api/v1/parties/{id}/merge). Gated HERE and not via
                                         # `verbs` for the same structural reason opsmessage.compose
                                         # is: party-service is not, and should not become, a
                                         # money_path_services entry (it moves no value), so the
                                         # verb clause can never derive a `party` scope and no verb
                                         # addition could ever reach this action.
                                         # Why it needs the gate at all: a merge is destructive OF
                                         # IDENTITY and irreversible in practice — one operator can
                                         # retire a real customer behind another party id, and every
                                         # downstream consumer follows `merged_into`. It carried only
                                         # @RolesAllowed(ROLE_OPERATOR, ROLE_ADMIN) + an audit event,
                                         # which records who did it but stops nobody.
                                         # GUARDRAIL check (the one above, applied): confirmed no M2M
                                         # caller. party-service's own rego states party.merge "has NO
                                         # in-repo M2M caller today"; the edge M2M identity is granted
                                         # only {party.consent.update, party:resolve} by the rule that
                                         # names it (service-edge-party-m2m), and the ADR-0179 sweep
                                         # counterpart transaction.merge-sweep is already gated by the
                                         # `sweep` verb — so both halves of the merge flow now pause
                                         # for a second approver, or neither does.
    - sdd.approve                       # #8359: confirm a B2B direct-debit mandate
                                         # (POST /api/v1/sdd/mandates/{id}/confirm) — the SDD B2B control
                                         # point: a wrongly-confirmed mandate authorises every future
                                         # collection against the debtor. Exact action, not the `approve`
                                         # verb: the verb would ALSO flag lending.approve (already
                                         # maker-checker in-app — an OPA second-approver pause on top
                                         # would stall the designed checker flow the day enforcement
                                         # flips) and pull non-money-path dispatch.approve into the
                                         # four-eyes-verb-grantable gate. GUARDRAIL check: human-only —
                                         # the edge rule (edge-service-sdd) deliberately excludes
                                         # sdd.approve ("a bank-side verification act, the edge exposes
                                         # no route for it"), operator-sdd-write excludes every
                                         # service-account-* principal, and the role_action_matrix
                                         # grants no sdd write at all. The money-moving sdd.authorise
                                         # is deliberately NOT gated — see the money_path_services
                                         # entry for the reasoning.
    - interest.create                   # #8359: bundles every operator write on the interest money
                                         # path — manual accrue, capitalize (posts real GL journals),
                                         # rate-config create (a mis-set rate moves money at scale on
                                         # every future accrual — the runtime analogue of vop's
                                         # max-edit-distance), and withholding remittance assemble
                                         # (triggers the real cash leg to the finanční úřad via the
                                         # settlement consumer). GUARDRAIL check: human-only, twice
                                         # over — operator-interest-write excludes service-account-*
                                         # and the interest_rest_ext prohibition vetoes the write set
                                         # for ANY service account at the allow head; fleet audit found
                                         # no M2M writer (agent-service's InterestServiceClient is
                                         # read-only). The accrual/capitalization SCHEDULERS call the
                                         # use cases in-process — they never pass the HTTP PEP, so this
                                         # gate cannot pause them.
    - interest.trigger                  # #8359: accrueAll (POST /api/v1/interest/accrue/all) — manual
                                         # mass accrual posting GL journals en masse. Same human-only
                                         # caller set as interest.create above (same allow rule, same
                                         # prohibition). The daily accrual scheduler is in-process and
                                         # unaffected.
    - device.enroll                     # #8360 / ADR-0280: enrol a device credential. Gated for every
                                         # caller EXCEPT the exemptions below — the risky path is the
                                         # human ops-console enroll-on-behalf (operator-sca-write), not
                                         # the customer self-service the edge M2M drives.
    - scaChallenge.consume              # #8360 / ADR-0280: spend an approved challenge (the ADR-0021
                                         # settlement gate). Gated for every caller except the exempt
                                         # automation identities below — a lone operator must not be
                                         # able to consume a challenge outside a real ceremony.
                                         # Exact actions, not verbs: `enroll`/`consume` happen to be
                                         # fleet-unique today, but a verb suffix would silently trap
                                         # any FUTURE money-path `*.consume` automation action.
  #
  # exemptions (ADR-0280): per-action list of principal ids for which four_eyes_required does NOT
  # fire — the verified M2M automation callers that must keep flowing when the action is gated.
  # rest.rego evaluates this map in every four-eyes clause; an action with no entry (or a bundle
  # whose rules.yaml predates the key) has no exemptions. Admission bar, checked at review: the id
  # must be a `service-account-*` identity with an in-repo identity-scoped allow rule for exactly
  # this action (the sca_rest_ext.rego pattern), never a role, never a human principal, and never
  # the shared backend client for an action only SOME of its users automate — the shared client's
  # exemption below covers consume because BOTH its callers (delegation grant-accept,
  # document-signing) are ceremonies, and no human path rides that identity.
  exemptions:
    device.enroll: [service-account-openbank-edge]                 # customer self-service enrollment
    scaChallenge.consume:                                          # ADR-0021 settlement gate + ceremonies
      - service-account-openbank-edge                              # scaGate before every money-path forward
      - service-account-openbank-services                          # delegation grant-accept, document-signing (#3734)

# ---------------------------------------------------------------------------------------
# Feature-flag flip governance (ADR-0067 follow-up, issue #419). The OPA PEP (rest.rego)
# reads these when authorizing a `featureflag.flip` action:
#   - prohibited_flag_combinations: a flip that would DISABLE a regulatory safety control
#     is hard-denied regardless of approvals (no four-eyes can switch these off via a flag).
#   - money_path_flags: flips of these flags are four-eyes-gated (maker-checker).
# Flag keys are kebab-case (mirrors libs/flags FlagDefinition.validate()).
feature_flags:
  # Disabling any of these via a flag flip is never permitted — they guard SCA (ADR-0021),
  # sanctions/AML screening (ADR-0032) and the fail-closed payment gate.
  prohibited_flag_combinations:
    - sca-enforcement-disabled
    - sanctions-screening-disabled
    - aml-screening-disabled
    - payment-gate-fail-open
  # Money-path flags whose flip needs four-eyes even when not outright prohibited.
  money_path_flags:
    - instant-payments-enabled
    - fx-revaluation-enabled
    - lending-disbursement-enabled

# ---------------------------------------------------------------------------------------
# Coverage (ADR-0020 extended per-service by ADR-0029 D3). Ratchet-only: never lower.
# ---------------------------------------------------------------------------------------
coverage:
  tool: kover
  ratchet_only: true
  # ADR-0273: one privacy-preserving evidence envelope joins CI execution, real Testcontainers
  # starts, performance/mutation runs and sandbox synthetics.  It is additive: raw JUnit and Kover
  # stay independently consumable until the projection has proven itself across the fleet.
  test_intelligence:
    schema: openbank-libs/governance/test-intelligence-run.schema.json
    producer: .github/scripts/collect-test-run-evidence.py
    fleet_ci: .github/workflows/_service-ci.yml
    runtime_library: openbank-libs-testing
    projection: openbank-admin-ui
    states: [passed, failed, skipped, not-run, stale, blocked, unknown]
    provenance_required: [commit, workflow, run_attempt, collected_at]
    testcontainers_runtime_proof: required-when-shared-resource-is-used
    run_history: immutable-per-attempt-artifact-30-days
    browser_failure_diagnostics: metadata-only-authenticated-artifact-7-days
    compatibility: raw-junit-and-kover-remain-readable-during-expand-migrate-verify
  floors:
    default: 39                         # current openbank-libs floor (ADR-0020)
    money_path_floor: 40                # enforced baseline (all 13 money-path services, ratchet-only)
    money_path_target: 70               # aspirational target; raise floor PRs as tests land
  money_path_depth:
    tool: pitest                        # mutation testing on money-path domain math (ADR-0030 D3)
    enforced: advisory                  # weekly advisory runs are live; blocking flip pending sustained >=70%
    target_enforce_date: "2026-09-30"   # ADR-0144
    ci_producer: .github/workflows/pitest.yml
    # Fleet rollout re-verified complete per the ADR-0063 criterion (2026-07-11, issue #265 D3):
    # 10/17 money-path services wired (pitest.yml weekly) — ledger, balance, account, transaction,
    # fx + sepa-payment, sepa-instant, domestic-payment, fraud (SSDLC-audit rollout 2026-07-06) +
    # sanctions (2026-07-11: 3 domain files — screening/matching decision logic — matches the
    # "substantive domain math" criterion, not the thin-domain one; 67% local baseline).
    # The remaining 7 (sca, consent, billing, clearing, swift, lending, settlement) stay excluded.
    #
    # This list used to be justified by one blanket claim — "each has only 1-2 domain files, and
    # those files are plain data models (no branching money-movement logic)". The file count was
    # re-confirmed; the NO-BRANCHING half was never measured, and it is FALSE for three of the
    # seven (#2395). Measured on 2026-07-26, counting `if (` / `when (` / `require(` / `check(`
    # over every `src/main/kotlin/**/domain/**.kt` in each module — a deliberately narrow matcher,
    # so these are lower bounds:
    #
    #     service     domain files   branch sites
    #     sca                    2             11
    #     consent                2              6
    #     swift                  1              5
    #     clearing               3              1
    #     billing                2              0
    #     lending                1              0
    #     settlement             1              0
    #
    # So the exclusion rests on a DIFFERENT judgement, and it is stated here rather than hidden
    # behind an inaccurate blanket: what sca, consent and swift branch on is input VALIDATION and
    # state-transition legality, not money-movement arithmetic — pitest's value is in the
    # arithmetic, and no pitest plugin is wired for any of the 7. billing needs its own reason:
    # its domain layer genuinely does not branch, but its real fee-waiver logic (ADR-0143 phase 2)
    # lives in `application/usecase/FeeAssessmentService`, OUTSIDE pitest's `domain.*`
    # targetClasses — so widening the target would be the fix there, not adding the module.
    #
    # Revisit if any of the 7 grows money-movement ARITHMETIC in its domain layer; a rising branch
    # count alone is not the trigger, and re-measure before repeating any claim in this block.
    # (Historical note: settlement and sanctions were both added to money_path_services after the
    # 2026-07-07 note above; settlement re-confirmed thin, sanctions was the one that wasn't.)
    # True baselines at rollout (after fixing the KILLED-quote parsing bug): account 49%,
    # transaction 46%, balance 55%, ledger 65%, fx 73%.
    # Re-measured 2026-09-03 against the last weekly run (33289385445, 2026-08-30). The previous
    # text named account/transaction/balance/ledger and was wrong in BOTH directions: account
    # (49 -> 70) and transaction (46 -> 76) have since cleared, while interest, sanctions and
    # sepa-payment were never named and are below. ledger has gone the wrong way, 65 -> 63.
    #
    #     balance   60%  (46/76)      account     70%  (103/146)
    #     interest  60%  (36/60)      fx          72%  (62/85)
    #     ledger    63%  (180/283)    domestic    74%  (49/66)
    #     sanctions 69%  (34/49)      sdd         75%  (46/61)
    #     sepa-pay  69%  (44/63)      transaction 76%  (80/104)
    #                                 sepa-instant 77% (35/45)
    #                                 fraud       89%  (41/46)
    #
    # So the flip is blocked by FIVE services, not four, and the two the record has been
    # pointing at for a month are no longer among them. Read the weekly run before quoting a
    # number here; these move.
    blocked_on: "blocking flip requires each service to sustain >=70% mutation kill score on the weekly run; balance 60, interest 60, ledger 63, sanctions 69 and sepa-payment 69 are below it as of run 33289385445 (2026-08-30)"
  dast:
    tool: "OWASP ZAP baseline (zaproxy/action-baseline)"   # ADR-0030 D3
    enforced: advisory                  # report-only first cut; no fail_action, no PR gate
    target_enforce_date: "2026-12-31"   # revisit once findings are triaged via the D1 lifecycle
    ci_producer: .github/workflows/dast-zap-baseline.yml
    # Scope decision (2026-07-07, issue #265 D3): customer-edge is the true internet-facing edge
    # (ADR-0065) but is a gitops-only Rollout/proxy with no Gradle module or image build in this
    # repo, and booting the full fleet (openbank-infra/docker-compose.yml: postgres/kafka/keycloak
    # + ~30 service images) is too heavy for a CI job. First cut scans ONE already-defined
    # docker-compose target instead: ledger-service (postgres + kafka deps only), against its
    # documented unauthenticated public paths (QUARKUS_HTTP_AUTH_PERMISSION__PUBLIC__PATHS).
    # Scheduled weekly, not per-PR (cost + expected finding volume on a fresh banking-API scan).
    blocked_on: "unauthenticated-surface only; an authenticated crawl needs Keycloak token issuance wired into the CI job, and a customer-edge / fleet-wide target needs either the real cluster or a much heavier compose boot — both deferred"

# ---------------------------------------------------------------------------------------
# API deprecation policy — drives ApiVersionResponseFilter.isDeprecatedPath() (ADR-0029 D2).
# ---------------------------------------------------------------------------------------
api_deprecation:
  header_set: [Deprecation, Sunset, "Link: rel=successor-version"]
  min_sunset_window_days: 180
  deprecated_paths:
    - /api/v1/products                  # product-catalog v2 successor; sunset 2027-02-10
    - /api/v1/fees                      # product-catalog v2 pricing successor; sunset 2027-02-10

# ---------------------------------------------------------------------------------------
# Supply-chain / release provenance (ADR-0029 D2, enforced at deploy by ADR-0030 D4).
# ---------------------------------------------------------------------------------------
provenance:
  sign_images: cosign
  attestation: slsa                     # in-toto / SLSA provenance
  # Two SLSA artifacts per release, both attached to the GitHub Release, serving different
  # consumers: <tag>.slsa.json (hand-assembled, cosign-signed, human/regulator-facing —
  # part of the evidence_bundle below) and <tag>.cdx.json.intoto.jsonl (generated by the
  # official slsa-framework/slsa-github-generator reusable workflow, release-please.yml
  # `provenance` job). The generator's output is what OpenSSF Scorecard's Signed-Releases
  # check actually detects — it only recognizes a release asset named "*.intoto.jsonl"
  # (content-blind), which the hand-assembled *.slsa.json does not satisfy regardless of
  # correctness.
  slsa_generator: slsa-framework/slsa-github-generator@v2.1.0   # generator_generic_slsa3.yml
  sbom: cyclonedx                       # per-service, signed, attached to release (not orphaned)
  evidence_bundle:                      # the signed, point-in-time audit object per release
    - version
    - git_commit
    - sbom
    - slsa_provenance
    - changelog
    - coverage_summary
    - scan_results          # CodeQL + Trivy SARIF
    - test_results
    - ai_attribution        # which agent/model authored; human reviewer (ADR-0029 D6)
  vex: openvex              # accompanies SBOM; suppresses non-exploitable findings (ADR-0030 D1)
  sbom_generation_pattern: host_side_only
  # CycloneDX SBOM must be generated on the host (Gradle :svc:cyclonedxBom) and COPY'd into
  # the image — never generated inside a running container (RUN ./gradlew in the runtime stage).
  # Two compliant paths:
  #   a) build-push-service.sh: quarkusBuild + cyclonedxBom on host → generated runtime Dockerfile COPYs bom.json
  #   b) multi-stage Dockerfile: cyclonedxBom in the JDK build stage → COPY --from=build bom.json into runtime stage
  # Non-compliant: any `RUN ./gradlew` or `RUN cyclonedxBom` in the RUNTIME (non-build) stage.
  gate: provenance
  # Rollout state of the deploy-time provenance gate (ADR-0030 D4), staged like the OPA-authz
  # (ADR-0034) and image-signature gates: ADVISORY now — per-release evidence bundles
  # (SBOM+SLSA+VEX+manifest) are produced, KMS-cosign-signed and independently verifiable
  # (verify-release-evidence.yml), and every deploy now cosign-attests its image SBOM
  # (auto-deploy.yml) — but deploy/admission do NOT yet BLOCK on them. Promote to `enforce`
  # only when ALL enforce_criteria below hold. (A blind flip would outage deploys of
  # uncovered services; cf. the #770 image-signature Enforce revert.)
  enforced: advisory
  target_enforce_date: "2026-09-30"   # ADR-0144
  blocked_on: "all four enforce_criteria below must hold; see that list for the specific gap"
  enforce_criteria:
    - "every deployable service's latest release carries a verify-release-evidence-green bundle (admin-ui excepted until it has a non-Gradle SBOM source)"
    - "the fleet-attestation gate passes: .github/scripts/check-fleet-attestations.sh is GREEN against origin/main (see fleet_attestation_gate below) -- this is a HARD precondition, not a judgement call"
    - "kyverno SBOM-attestation rule flips Audit -> Enforce (verify-sbom-attestation-policy.yaml; one line once criteria 1-2 hold)"
    - "the advisory gate has run clean for an observation window (no false-positive blocks)"

  # -------------------------------------------------------------------------------------
  # The fleet-attestation gate: the checkable precondition for ANY image-provenance policy
  # graduating Audit -> Enforce. Encoded here because the 2026-07-12 graduation was
  # authorized on a claim ("the running fleet was fully redeployed with attested images")
  # that was FALSE and that nothing could have falsified -- there was no check to run.
  # There is now. Run it; do not assert it.
  # -------------------------------------------------------------------------------------
  fleet_attestation_gate:
    script: .github/scripts/check-fleet-attestations.sh
    workflow: .github/workflows/fleet-attestation.yml   # daily schedule + gitops/producer PRs
    placeholder_allowlist: .github/scripts/fleet-attestation-placeholders.txt
    # WHAT IT CHECKS: every openbank-* image referenced anywhere under openbank-infra/gitops/
    # -- app containers, initContainers AND sidecars -- carries a cosign-signed CycloneDX SBOM
    # attestation verifiable with the same key + tag scheme kyverno uses at admission.
    scope: every openbank-* image declared in openbank-infra/gitops (incl. initContainers + sidecars)
    # WHY DECLARED, NOT RUNNING: kyverno verifies at ADMISSION, never continuously. An
    # unattested image whose pod already runs keeps running; the violation is LATENT until a
    # reschedule (node roll, eviction, scale-up) denies the pod permanently, one at a time.
    # So "PolicyReport shows 0 fail" and "the fleet is healthy" are NOT evidence of coverage
    # -- they only describe pods that happen to exist right now. NEVER infer "it is running,
    # therefore it was verified".
    basis: declared_images_not_running_pods
    enforcement_rule: >-
      No image-provenance policy (verify-openbank-image-signatures,
      verify-openbank-image-sbom-attestation, or any successor) may be set to
      validationFailureAction: Enforce while this gate fails. A graduation PR must cite a
      green run of it. An unattested image is never rejected at the moment it is created --
      only later, at a reschedule nobody scheduled -- so a passing gate is the ONLY evidence
      that a flip to Enforce is safe.
    # Producers must make an unattested image impossible rather than merely unlikely:
    # every openbank-* image producer signs AND attests via the shared helper, and any
    # provenance failure HARD-FAILS the push (a warning-only path is what created the gap).
    producer_helper: openbank-infra/scripts/lib/cosign-attest.sh
    producer_failure_mode: hard_fail   # never warn-and-continue on a provenance failure
    # trivy defaults to --platform linux/amd64 for REMOTE scans regardless of host arch;
    # fleet images are arm64-only, so an unqualified `trivy image` fails 100% of the time
    # and silently yields an unattested image if only the exit code is checked.
    trivy_platform_required: true

# ---------------------------------------------------------------------------------------
# Dependency policy (CONTRIBUTING.md security checklist).
# ---------------------------------------------------------------------------------------
dependencies:
  license_allowlist: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, EPL-2.0, MPL-2.0, ISC]
  license_denylist: [GPL-2.0, GPL-3.0, AGPL-3.0]   # copyleft -- denied for THIRD-PARTY deps of the Apache-2.0 platform
  # Carve-out (ADR-0136, supersedes the ADR-0031 D8 separate-repo plan): the AI agent
  # services are OpenBank's open-core component and are licensed AGPL-3.0-only + a parallel
  # commercial licence -- IN-REPO, not Apache-2.0. The denylist above governs the Apache-2.0
  # platform tree; AGPL-3.0-only is the intended licence of the agent services, so the gate
  # must not flag those paths.
  license_denylist_exceptions:
    - license: AGPL-3.0-only
      scope: agent-services                 # in-repo open-core; own LICENSE, commercial dual-license
      # DERIVED from license_boundary_exceptions[0].agpl_modules below (one entry each, with a
      # trailing slash). check-license-headers.py fails if the two lists disagree -- they drifted
      # apart from the tree once already (#2280).
      paths:
        - openbank-agent-service/
        - openbank-case-coordinator-agent/
        - openbank-copilot-service/
        - openbank-devops-agent/
        - openbank-finops-agent/
        - openbank-control-liveness-sentinel/
        - openbank-governance-auditor/
        - openbank-release-steward/
        - openbank-docs-truth-agent/
        - openbank-authz-policy-auditor/
        - openbank-flaky-test-hunter/
        - openbank-ap2-service/
        - openbank-mcp-service/
      reason: "open-core: AGPL-3.0-only + commercial dual-licensing of the AI agent services"
      adr: ADR-0136
  license_boundary_exceptions:
    - description: "AGPL/Apache seam (in-repo). The AI agent services are AGPL-3.0-only; no Apache-2.0 module may take a build/compile dependency on them (only network/HTTP use is allowed). They depend on openbank-libs (Apache-2.0), which is permitted -- copyleft may consume permissive code."
      # CANONICAL list of the in-repo AGPL-3.0-only modules -- the single source of truth for
      # which components sit outside the root Apache-2.0 LICENSE. NOTICE and README deliberately
      # do NOT enumerate them (they point here instead), because a hand-maintained second copy
      # is what let the published NOTICE claim 4 modules while the tree carried 12 (#2280).
      # Adding a module here means: give it its own LICENSE, stamp AGPL-3.0-only headers
      # (scripts/add-license-headers.sh is path-aware from this list), and keep the paths list above
      # in sync. Enforced by .github/scripts/check-license-headers.py.
      agpl_modules:
        - openbank-agent-service            # ADR-0136
        - openbank-case-coordinator-agent   # ADR-0244
        - openbank-copilot-service          # ADR-0136
        - openbank-devops-agent             # ADR-0136
        - openbank-finops-agent             # ADR-0136
        - openbank-control-liveness-sentinel
        - openbank-governance-auditor
        - openbank-release-steward
        - openbank-docs-truth-agent
        - openbank-authz-policy-auditor
        - openbank-flaky-test-hunter
        - openbank-ap2-service              # ADR-0193 -- same agent plane as mcp-service
        - openbank-mcp-service              # ADR-0181 -- explicitly inside the ADR-0136 boundary
      rule: "no Apache-2.0 module may declare project(':openbank-agent-service'|':openbank-case-coordinator-agent'|':openbank-copilot-service'|':openbank-devops-agent'|':openbank-finops-agent'|':openbank-control-liveness-sentinel'|':openbank-governance-auditor'|':openbank-release-steward'|':openbank-docs-truth-agent'|':openbank-authz-policy-auditor'|':openbank-flaky-test-hunter'|':openbank-ap2-service'|':openbank-mcp-service') as a dependency"
      license: "AGPL-3.0-only"
      adr: ADR-0136
  block_on_cve_severity: [CRITICAL, HIGH]
  catalog: openbank-libs/gradle/libs.versions.toml  # version catalog is the single dependency source
  # HOW block_on_cve_severity is actually enforced at PR time -- and why it is load-bearing
  # that dependency-submission runs on pull_request (#1419/#1421). Until it did, the rule
  # above was declared but unenforced for Gradle, the fleet's primary language.
  pr_time_cve_gate:
    gate: .github/workflows/dependency-review.yml   # fail-on-severity: high
    invariant: >
      dependency-review only ever diffs SUBMITTED dependency graphs. GitHub natively parses
      npm/pip/docker/actions manifests but NOT Gradle, so the graph for a PR head exists only
      because dependency-submission.yml also runs on pull_request. Remove that trigger and the
      gate keeps reporting green while checking nothing about Gradle -- a silent hole, not a
      visible failure.
    requires:
      - ".github/workflows/dependency-submission.yml runs on pull_request with a manifest path filter"
      - "its push:[main] trigger is DELIBERATELY UNFILTERED -- see base_snapshot below (#2833)"
      - "dependency-review arms retry-on-snapshot-warnings ONLY on dependency-touching PRs"
      - "dependency-submission failures raise a tracking issue (a stale graph makes the gate vacuous)"
    base_snapshot: >
      Snapshots are looked up by EXACT SHA and the compare endpoint is three-dot, so the graph
      the gate diffs against is the MERGE-BASE of the PR -- an arbitrary main commit. While the
      push:[main] trigger carried the same manifest path filter as the pull_request one, only
      ~2% of main commits produced a snapshot (measured: 1 of 50), so the merge-base almost
      never had one and the action silently fell back to reporting the ENTIRE head graph as
      additions. That is how the allowlist below was accreted. The push trigger is therefore
      unfiltered: every main commit submits, so the merge-base always resolves. Ancestry of
      pull_request.base.sha is NOT a factor -- three-dot compare resolves the merge-base itself.
    scope: >
      detachedConfiguration* and the root buildscript `classpath` are EXCLUDED from the
      submitted graph (dependency-graph-exclude-configurations). `configurations.all {
      resolutionStrategy { force(...) } }` -- how openbank.dependency-vulnerability-pins applies
      the fleet patch floors -- cannot reach a detachedConfiguration, so those resolve their own
      older versions of the same modules and submit coordinates no service can load. Measured:
      105 of 1389 resolved coordinates came only from a detached configuration and carried 24 of
      30 findings; filtering both took the graph 1235 -> 1091 and findings 30 -> 3.
      Test coverage is NOT reduced -- testCompileClasspath / testRuntimeClasspath /
      integrationTest* are all still submitted.
      Excluding `classpath` IS a deliberate narrowing: a vulnerable BUILD plugin never ships but
      does run on CI runners, and this gate is about what ships. Revisit if build-time supply
      chain becomes an explicit goal.
    allowlist: >
      allow-ghsas is DELIBERATELY EMPTY. It held seven suppressions (json-smart 2.5.0,
      netty-handler 4.2.1, netty-codec-http2 4.1.119), every one silencing a coordinate that
      only ever existed via a detached/buildscript configuration -- removed at source by the
      scope filter above instead. An allow-ghsas entry is a PERMANENT FLEET-WIDE suppression: it
      hides the pre-existing false positive it was added for AND a future PR that genuinely
      introduces the same GHSA on a real classpath, so each entry buys quiet with a hole.
      Before adding one, run the extractor's own diagnostic
      (:ForceDependencyResolutionPlugin_resolveAllDependencies + SimpleDependencyGraphPlugin)
      and read `resolvedBy` in dependency-resolution.json: a single entry naming a detached or
      buildscript configuration is a graph artifact -- widen the scope filter, do not allowlist.
      Entries naming a real *Classpath are a genuine finding -- bump the pin.
    not_covered_by:
      trivy_fs: "Trivy's Java coverage is JAR / pom.xml / gradle.lockfile / *.sbt.lock only; this repo has zero lockfiles, so Trivy fs sees no Gradle dependency"
      codeql: "not a dependency scanner, and not a required check"
    fork_prs: >
      Fork PRs get a read-only token, so the submission cannot run and they receive dependency
      review for the natively-parsed ecosystems only, not Gradle. Deliberate: closing it needs a
      workflow_run job holding contents:write over a fork-authored artifact.
  artifact_integrity:
    # Gradle dependency verification (gradle/verification-metadata.xml): SHA-256 pins for
    # every resolved artifact — a repository-level tamper or dependency-confusion swap of an
    # existing version no longer resolves. Lockfiles/Dependabot pin VERSIONS; this pins BYTES.
    # LENIENT (warn-only) while the metadata soaks across all CI lanes and developer
    # platforms; flip = org.gradle.dependency.verification=strict in gradle.properties.
    # Dependabot PRs auto-refresh the metadata (dependabot-verification-metadata.yml).
    mechanism: gradle-verification-metadata-sha256
    enforced: advisory
    target_enforce_date: "2026-09-30"   # ADR-0144
    ci_producer: "gradle.properties org.gradle.dependency.verification=lenient + .github/workflows/dependabot-verification-metadata.yml"

# ---------------------------------------------------------------------------------------
# Architecture invariants (ADR-0002 hexagonal).
# ---------------------------------------------------------------------------------------
architecture:
  hexagonal: true
  domain_zero_framework_imports: true   # domain layer must not import Quarkus/Jakarta/Spring
  # ENFORCED by .github/scripts/check-domain-purity.py (Validate manifests job):
  # baseline-ratcheted — grandfathered violations burn down as touched, any NEW
  # framework reference fails CI. Scope is every per-service */domain/* package PLUS
  # the whole openbank-libs-domain module; openbank-libs-runtime is module-exempt
  # (shares the domain package string for its JPA converters but IS the framework
  # side of the ADR-0122 split). Both an `import` and a fully-qualified reference
  # count — #3670 hid `jakarta.interceptor.InterceptorBinding` in the second form,
  # in a libs-domain package the old `*/domain/*` scope never opened.
  ci_producer: ".github/scripts/check-domain-purity.py"

# ---------------------------------------------------------------------------------------
# OPA bundle sync (issue #1184). Keep terse: this file is embedded verbatim into every
# bundle it describes, so editing it rolls every checksum below. Rationale in ci_producer.
# ---------------------------------------------------------------------------------------
opa_bundle_sync:
  # The gate must DISCOVER the generators, never name them. A hard-coded list opts each
  # new service out by default: until #1187 it named 4 of the 26 gen-*opa-bundle*.sh
  # scripts while 25 embed this file, so ~21 services' committed bundles served stale
  # data.rules.* / data.agents.* for months with CI green.
  generators_discovered_not_listed: true
  generator_glob: "openbank-infra/gitops/components/**/gen-*opa-bundle*.sh"
  # What the bundles embed is NOT this file: it is the derived subset
  # openbank-libs/governance/rules-opa-data.yaml — the top-level keys some
  # .rego reads as data.rules.<key>, copied out verbatim. Embedding all 168 KB
  # meant a one-line edit to any of the ~30 keys OPA never reads restamped 39
  # ConfigMaps and 39 pod-roll annotations, in the same *-service.yaml files the
  # auto-deploy bot bumps image pins in, so governance PRs re-conflicted faster
  # than they could be resolved (#3357; only 16 of the last 80 revisions of this
  # file changed anything OPA reads). It also put every bundle over 200 KB
  # against the 262144-byte annotation ceiling that had already frozen five
  # Applications' policy. The key set is DERIVED from the .rego sources, never
  # listed — a hand-kept list goes stale, and a missing key makes
  # data.rules.<key> undefined, which in Rego is a rule that silently stops
  # firing rather than an error.
  policy_input_subset: "openbank-libs/governance/rules-opa-data.yaml"
  policy_input_generator: ".github/scripts/gen-rules-opa-data.py"
  policy_input_keys_derived_not_listed: true
  # The identical treatment for agents.yaml (#3927), which was the larger half and was
  # left standing when #3357 landed: 50390 B embedded and hashed into all 42 bundles, of
  # which ~5.6 KB is reachable by any policy. agents.rego never reads an agent object
  # wholesale — it reads a.id, a.skills, a.tools.allow, a.tools.deny — so the subset is
  # taken one level DOWN from top-level keys, unlike rules.yaml's. Consequence: a
  # charter's description, model binding, limits, schedule, compliance or audit block no
  # longer restamps a single bundle or rolls a single pod.
  agents_policy_input_subset: "openbank-libs/governance/agents-opa-data.yaml"
  agents_policy_input_generator: ".github/scripts/gen-agents-opa-data.py"
  # A field projection cannot be justified by verbatim extraction the way rules.yaml's
  # is, so the generator proves it instead: it evaluates the real policy over an input
  # matrix derived from the charters under BOTH documents and requires every MCP and
  # REST decision to be identical before it writes. --self-test falsifies that proof.
  agents_policy_input_proved_by_differential_evaluation: true
  # A 100644 generator no-ops a ./... loop and is indistinguishable from "in sync" —
  # gen-ledger-opa-bundle.sh shipped that way and had never once run.
  generators_must_be_executable: true
  # Each generator hashes its embedded sources into openbank.tech/policy-checksum, which
  # must match in BOTH the ConfigMap and the service's Rollout/Deployment: subPath mounts
  # do not hot-reload, so the annotation is what actually rolls the pod onto new policy.
  checksum_annotation: "openbank.tech/policy-checksum"
  enforced: enforce
  ci_producer: ".github/workflows/opa-policy.yml"   # `verify` job

# ---------------------------------------------------------------------------------------
# REST/MCP authorization policy invariants (ADR-0034 Phase 5, issue #266). rest.rego is
# the shared OPA policy mounted in every enforcing service's bundle.
# ---------------------------------------------------------------------------------------
authz_policy:
  principal_type_service_unreachable: true
  # AuthorizeInterceptor.principalType() (openbank-libs-runtime) only ever emits
  # ANONYMOUS/AI_AGENT/HUMAN — never SERVICE. M2M callers authenticate with a Keycloak
  # client_credentials JWT, which the interceptor classifies as HUMAN, and no realm
  # client is ever granted a ROLE_SERVICE role. A rego rule gated on
  # `input.principal.type == "SERVICE"` can therefore never fire. Found live 2026-07-07
  # in the shared rest.rego edge-service-notification rule (deployed with AUTHZ_ENFORCE
  # defaulting true — notification.mark-read/device.create/device.delete had NO other
  # allow path) and pre-merge in the sca/domestic-payment ADR-0034 Phase 5 PRs.
  #
  # Identify a specific M2M caller by input.principal.id (Keycloak's
  # "service-account-<clientId>" convention for a service-account token) instead of
  # principal.type or role alone — ROLE_OPERATOR is shared with real human staff, so a
  # role-only check over-grants (e.g. it would let any operator call SCA's
  # device.enroll — an account-takeover primitive — see rest.rego's
  # edge-service-notification rule and rest_test.rego's
  # test_deny_operator_read_any_does_not_cover_write).
  ci_producer: ".github/scripts/check-no-service-principal-type.sh"

  # psd2_rest_ext.rego grants five actions — psd2.list/read/create/initiate/delete — to an
  # ANONYMOUS principal, because a TPP authenticates by eIDAS QWAC (mTLS) and carries no
  # bearer, so it reaches OPA as ANONYMOUS. That grant is safe ONLY because EidasMtlsFilter
  # (@Priority(AUTHENTICATION)) has already 401'd a missing or unauthorized TPP on the path
  # prefixes it gates. Until issue #2169 that invariant lived in a rego comment: an
  # @Authorize(action = "psd2.initiate") added on a path the filter does NOT gate — a new
  # admin route, a debug endpoint, anything under `open-banking/sandbox/` — would hand
  # payment initiation to a genuinely unauthenticated caller with every CI gate green.
  #
  # The guard derives BOTH sides from source: the action set out of the rego rule, the gated
  # prefixes (and their negated exclusions) out of EidasMtlsFilter's `gated` predicate. It
  # keeps no copy of either — a guard whose scope is a hand-kept list of the thing it checks
  # reads as passing when the list is short. Kotlin comments are stripped (block comments
  # NEST) so an @Authorize quoted in a KDoc is never reported as an endpoint, and a run that
  # matches zero endpoints FAILS rather than passing vacuously.
  # 0 violations on origin/main at introduction — a regression guard. ENFORCED.
  anonymous_grants_require_upstream_authn: true
  anonymous_grant_ci_producer: ".github/scripts/check-psd2-anonymous-grant-paths.py"

# ---------------------------------------------------------------------------------------
# Scheduled-method invariants (issue #2148, fleet sweep #2187).
# ---------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------
# Temporal worker disable-switch naming (audit Top-50 E46). Every service that registers a
# Temporal worker at StartupEvent carries a switch so tests / the fuzz harness / DR manifests
# can boot without Temporal. The name MUST be derivable: `openbank.<service>.worker.enabled`.
# An invented-per-service name forces every consumer to hard-code a drifting name list — the
# 2026-08-18 fuzz run shipped 6 "failures" that never sent a request, partly on this.
# Enforced by .github/scripts/check-temporal-worker-switch-naming.py (gate
# temporal-worker-switch-naming). Allowlist entries fail stale in either direction.
# ---------------------------------------------------------------------------------------
temporal_worker_switch_naming:
  convention: "openbank.<service>.worker.enabled"
  allowlist: []
  # The one pre-convention name, lending's `lending.origination.worker.enabled`, was renamed
  # to `openbank.lending.worker.enabled` in the same audit follow-up that introduced the gate;
  # the allowlist mechanism stays (and fails stale in either direction) for the next exception
  # that genuinely cannot be renamed.

scheduled_methods:
  no_runblocking_in_scheduled_body: true
  # Quarkus invokes a plain (non-`suspend`) @Scheduled method on a bare `executor-thread`,
  # which carries NO Vert.x context. A body of `runBlocking { … }` therefore runs the
  # coroutine on that thread, and the first reactive Hibernate-Reactive/Panache call inside
  # throws `HR000068: This method should exclusively be invoked from a Vert.x EventLoop
  # thread`. The job aborts having done nothing, and does so silently — the throw lands
  # before whatever per-item try/catch the job has, or is swallowed by its own outer catch
  # into one ERROR line.
  #
  # Found live five times. #2148: StandingOrderExecutionScheduler.sweep() — no due standing
  # order had EVER executed (PR #2180). The #2187 sweep then found the same shape in the
  # daily sub-ledger tie-out control and the daily FX revaluation (ledger, PR #2190), the
  # statutory ČNB fixing ingestion (fx, PR #2191) and the monthly billing cycle (PR #2194).
  # None had ever run.
  #
  # This is a GATE and not a documented lesson because the natural test does not fail: a test
  # that calls the method directly supplies a Vert.x context the scheduler does not, so it
  # passes against the broken code — which is exactly how all five hid behind green suites.
  # Regression coverage must drive the REAL cron via a @TestProfile that shrinks the cron
  # expression (pattern: StandingOrderExecutionSweepIT, LedgerSchedulerVertxContextIT).
  #
  # FIX: make the method a `suspend fun` — Quarkus dispatches a suspending @Scheduled method
  # on a proper (duplicated) Vert.x context. Unanimous fleet convention: every other reactive
  # @Scheduled method here is `suspend` or returns `Uni`. Preferred over
  # `VertxContextSupport.subscribeAndAwait`, which swaps one blocking bridge for another,
  # pins the scheduler worker for the whole run, and throws if ever called FROM an event-loop
  # thread (so it breaks the day the method gains @NonBlocking or a virtual thread).
  #
  # An entry below is a genuine exception, not a deferral: a service with no reactive
  # persistence on its classpath at all, where `runBlocking` bridges deliberately BLOCKING
  # clients and `suspend` would be the wrong change. Same individually-justified-exception
  # idiom as the ktlint/detekt baselines and event_consumer_liveness.allowlist. A stale entry
  # is itself a violation.
  runblocking_allowlist:
    - method: "openbank-analytics-sink/src/main/kotlin/com/openbank/analytics/infrastructure/reconcile/ReconciliationJob.kt#scheduled"
      reason: >-
        analytics-sink deliberately DROPS hibernate-reactive-panache, reactive-pg-client and
        jdbc-postgresql (build.gradle.kts) — it has no OLTP datasource to reach. The
        reconciliation reads the warehouse and the WORM archive over blocking clients.

  no_reactive_from_nonsuspend_scheduled_body: true
  # The SAME defect without the `runBlocking` spelling — and keying the first version of this
  # gate on that spelling is precisely how it walked past. #2913:
  # ConsentExpirationJob.sweepExpiredConsents() built a Uni and `subscribe()`d it, with no
  # `runBlocking` anywhere. `subscribe()` reads as "hand this off, it runs elsewhere" and does
  # not: the subscription starts on the CALLER's thread, which is the contextless
  # executor-thread. The hourly consent-expiration sweep had therefore never once succeeded
  # (GDPR Art. 17 / PSD2 RTS Art. 10 — expired consents stayed ACTIVE and the ConsentExpired
  # event never reached a single consumer), and the sweep for that shape found two more:
  # notification-service's device-token sweep (ADR-0135) and its dead-letter janitor
  # (ADR-0050 N5). Neither had ever purged a row.
  #
  # RULE: a @Scheduled method that starts reactive work must be `suspend` — or declared to
  # return `Uni<…>`, the other shape Quarkus dispatches on a proper (duplicated) Vert.x context,
  # which four services already use. The gate checks that PROPERTY rather than one forbidden
  # identifier, so the next spelling is covered too.
  #
  # Same exception idiom as runblocking_allowlist above, and a stale entry is a violation in
  # either direction.
  nonsuspend_reactive_allowlist: []
  ci_producer: ".github/scripts/check-no-runblocking-in-scheduled.py"

  # The structural reason the HR000068 class was invisible (#2204). `quarkus.scheduler.enabled:
  # false` under %test is a reasonable default — it stops crons firing during unrelated tests —
  # but it leaves only DIRECT method calls, and a direct call supplies the very Vert.x context
  # the scheduler does not. So `scheduler.sweep()` in a test passes against a body that can
  # never work as a cron. The guard above catches ONE defect shape; only running the real cron
  # catches the next.
  #
  # Rule: a service that disables the scheduler under %test AND has an @Scheduled method must
  # have at least one test that sets `quarkus.scheduler.enabled=true` (a @TestProfile with a
  # shrunken cron, as LedgerSchedulerVertxContextIT / BillingCycleSweepVertxContextIT do).
  #
  # Measured 2026-07-26: 11 services qualify, only 2 exercise it. The other 9 are baselined in
  # the producer — the list may only SHRINK, and a stale entry (a service that now IS covered)
  # is reported too, so the debt cannot quietly become permanent.
  #
  # Detection is narrow on purpose: only `quarkus.scheduler.enabled` set to `true` counts. A
  # looser sweep for the string `scheduler.enabled` scored card-issuance as covered on
  # `scheduler(enabled = false).enforceRetention()` — a direct call with an unrelated feature
  # flag, i.e. exactly what this rule rejects.
  scheduler_exercised_in_tests: true
  scheduler_exercised_ci_producer: ".github/scripts/check-scheduler-exercised.py"

  # ADR-0237 (issue #3345): every domain @Scheduled job registers the ADR-0160
  # mechanism-3 workflow-liveness gauge, so a job that stops succeeding — or never
  # starts — is an alert, not an archaeological find. The two guards above prove a
  # job CAN run; this one proves it DID. Without a gate, adoption rots the day the
  # sweep lands: the next scheduler added without a heartbeat is invisible to the
  # staleness rule and to the control-liveness-sentinel (its documented known gap
  # is exactly this adoption rate).
  #
  # RATCHET, not a sweep-gate: the files without a heartbeat at introduction
  # (first scan 2026-08-03, 37; 16 as of 2026-08-08, money-path block empty) are
  # baselined in the producer with their adoption PRs shrinking the list; a NEW
  # domain @Scheduled job with no registerWorkflowLiveness is red, and a healed
  # entry that was not removed from the baseline is red too — the list cannot rot
  # in either direction. Exempt by role, not by name: outbox dispatchers/backlog
  # gauges (own openbank.outbox.backlog freshness) and two allowlisted producers
  # (audit-chain gauge — own three-rule alerting; the sentinel's own scheduler —
  # circularity).
  #
  # ENFORCED as of 2026-08-08 (#3931), ahead of the 2026-09-30 ADR-0144 target.
  # `enforced: advisory` here was NOT a statement that findings were tolerated —
  # the producer already exited 1 on both ratchet branches, and `mode: advisory`
  # in gates.yaml converted that to a warning at the runner. That is precisely how
  # #3875's heartbeat-less ConversationRetentionScheduler, and later
  # account-service's SavingsProposalExpiryScheduler, merged while the gate said
  # so. The mode is now split from the baseline: the baseline grandfathers, the
  # mode blocks.
  liveness_adoption:
    gate: scheduler-liveness-adoption
    enforced: enforce
    ci_producer: ".github/scripts/check-scheduler-liveness.py"


# ---------------------------------------------------------------------------------------
# k6 performance smoke gate (issue #3348 / ADR-0243).
# A failed weekly run opens a new issue. Once failure rate DCG stabilises, this
# graduates to an enforced PR gate.
# ---------------------------------------------------------------------------------------
postgres_extensions:
  # An UNTRUSTED extension cannot be created by the role Flyway connects as. PostgreSQL splits
  # extensions into trusted (`uuid-ossp`, `pgcrypto`, `pg_trgm`, `unaccent`, … — a database OWNER
  # may create them) and untrusted (`vector`, `postgis`, `postgres_fdw`, `plpython3u`, … —
  # SUPERUSER only). Every local path connects as superuser (Dev Services, PostgreSQLContainer,
  # docker-compose), so a migration creating an untrusted extension is GREEN on every laptop and in
  # CI, and fails only in the cluster, where CloudNativePG hands the application a non-superuser
  # role. The pod then crashloops on what reads as a migration bug, and nothing in the diff points
  # at the connecting ROLE.
  #
  # Measured against the exact image the fleet runs (ghcr.io/cloudnative-pg/postgresql:18.1, which
  # already bundles pgvector 0.8.1) while adding semantic retrieval to copilot-service:
  #   as owner:      ERROR: permission denied to create extension "vector"
  #                  HINT:  Must be superuser to create this extension.
  #   as superuser:  CREATE EXTENSION
  #   as owner, already installed: NOTICE: extension "vector" already exists, skipping
  #
  # BOTH halves are required, and the third line above is why they compose: the CNPG `Database`
  # resource creates the extension over the operator's superuser connection, and the migration's
  # `CREATE EXTENSION IF NOT EXISTS` short-circuits before the permission check, which is what keeps
  # local dev and the test containers working. Delete the resource and the deployed migration fails
  # at its first statement; delete the migration line and every developer's database breaks.
  untrusted_needs_cnpg_database_resource: true
  gate: untrusted-pg-extension
  enforced: true
  ci_producer: ".github/scripts/check-untrusted-pg-extension.py"
  # Classification is per-extension and must be VERIFIED the way the pgvector one was — by running
  # CREATE EXTENSION as a non-superuser against the real image — not inferred from documentation.
  # The list lives in the checker; adding an entry there is the deliberate act.

litellm_gateway:
  # LiteLLM parses `--config` ONCE at startup and the ConfigMap is a plain volume mount, so a config
  # edit reaches the pod's filesystem and changes nothing: the proxy keeps serving the model list it
  # booted with. The caller of a newly added route gets `model not found` while ArgoCD reports
  # Synced and Healthy and the ConfigMap in the cluster genuinely contains the new route — the same
  # silent-degradation shape as an `optional: true` secret ref.
  #
  # The manifest has carried "BUMP THIS whenever litellm-config.yaml changes" in a comment since
  # #1919. Prose is not a control: three routes were added in one week (llama-3.3, llama-guard,
  # bge-m3) and each depended on somebody remembering it.
  config_change_requires_revision_bump: true
  revision_annotation: "openbank.tech/litellm-config-revision"
  gate: litellm-config-revision
  enforced: true
  ci_producer: ".github/scripts/check-litellm-config-revision.py"
  # Any DIFFERENT value rolls the pod, so the gate deliberately does not check direction or
  # monotonicity — a legitimate revert must not be blocked by a numbering rule.

perf_gate:
  pilot_services:
    - openbank-product-catalog
  detect: ["openbank-*/src/test/k6/*-smoke.js", ".github/workflows/perf-gate.yml"]
  require:
    - "k6 smoke script exists in src/test/k6/ matching perf-gate expectations"
    - "weekly scheduled run reports into perf-reports-* artifact"
  gate: perf-gate
  enforced: advisory
  target_enforce_date: "2026-11-01"
  ci_producer: ".github/workflows/perf-gate.yml"


# ---------------------------------------------------------------------------------------
# Kafka topic existence (issue #2598). A service may only reference a topic that exists.
# ---------------------------------------------------------------------------------------
external_feeds:
  # A third-party URL in a service's application.yaml is unfalsifiable by every test layer this
  # repo has. A unit test stubs the client, an IT serves a local fixture, and a consumer pact
  # answers whatever path it is asked for (the #2283 asymmetry). The upstreams here are foreign
  # government feeds with no pact and no contract, so fetching them is the only thing that can be
  # wrong out loud.
  #
  # Found live: openbank-fx-service's statutory CNB fixing URL was a 404 for the entire life of
  # the service — the path segment `kurzy-devizoveho-trhu` appears TWICE in CNB's URL and the
  # config carried it once. Every layer stayed green: a 404 is a valid HTTP response, so the
  # rest-client succeeded and the @CircuitBreaker never opened (its requestVolumeThreshold of 4
  # can never be filled by a once-daily caller anyway); CNB serves the 404 as a 58 KB HTML page,
  # the parser rejected it, and the scheduler's catch swallowed that into one ERROR line.
  # Downstream, FxRevaluationService found no rate, logged "skipping its revaluation leg" and
  # returned posted=false — a successful-looking run of a job that revalued nothing. The only
  # evidence anywhere was a table that stopped growing, and nothing alerts on that (#2204).
  #
  # TWO PROPERTIES, deliberately in different lanes:
  declaration_drift_is_blocking: true
  # Every external URL in an openbank-*/src/main/resources/application.yaml must be declared
  # either in the watch's FEEDS (probed) or in NOT_PROBED (with a reason). Offline, deterministic,
  # enforced in `Validate manifests`. This is the derived-scope rule: a gate whose coverage set is
  # maintained separately from the artifacts it covers reads as PASSING when the set is short,
  # never as unchecked.
  liveness_never_blocks_merge: true
  # Fetching is a property of the internet at this moment, so a dead feed escalates onto its issue
  # instead of gating a merge — a third party having a bad day must not wedge the repo, and a
  # scheduled job that is red every day is a red addressed to nobody.
  probe_asserts_payload_shape: true
  # A 200 proves a server answered, not that the answer is the feed. Each declared feed carries a
  # matcher the real payload must satisfy, and --self-test drives every matcher against payloads
  # it MUST reject — including the exact CNB HTML error page that read as success for 46 days.
  probe_reads_url_from_committed_config: true
  # The declaration names the YAML path, never the URL. A second copy moves together with the
  # first, so the probe would keep passing against a URL the service does not use — the same
  # vacuous shape as deriving both halves of a pact from one annotation.
  ci_producer: .github/scripts/check-external-feeds.py

incluster_hostnames:
  # The in-cluster half of external_feeds (above). Same unfalsifiability, different upstream: a
  # hostname naming another SERVICE in this cluster is stubbed by the unit test, overridden to
  # localhost by the IT, and never sent by a consumer pact — so it is wrong only at the moment a
  # pod dials it, and the symptom is a connect timeout in one log line.
  #
  # Found live (issue #1916): openbank-analytics-sink's application.yaml documented the Apicurio
  # schema registry as "provisioned in openbank-infra as service schema-registry:8081" and
  # defaulted ANALYTICS_SCHEMA_APICURIO_URL to http://localhost:8081. The Service is
  # `apicurio-registry` on 8080 in namespace `messaging`. Wrong host AND wrong port, stated twice
  # (prose and value), with nothing in the repo able to contradict either.
  #
  # THE RULE: every in-cluster hostname in an openbank-*/src/main/resources/application.yaml must
  # resolve to a Service that openbank-infra/gitops/ declares.
  hostname_must_resolve_to_declared_service: true
  #
  # Unlike external_feeds this needs no network — the set of names that CAN resolve is fully
  # declared in gitops, so the claim is decidable offline and deterministically.
  known_set_is_derived_from_gitops: true
  # kind: Service, plus the endpoints CNPG (<name>-rw/-ro/-r) and Strimzi
  # (<name>-kafka-bootstrap/-brokers) synthesise from their CRs. There is NO hand-kept list of
  # service names in the checker: a gate whose scope is maintained separately from the artifacts
  # it covers reads as PASSING when the list is short, never as unchecked.
  asserts_against_parsed_yaml_not_file_text: true
  # A whole-file grep cannot tell config from the prose ABOUT config, and this repo has been burnt
  # in both directions (#2450 flagged the comment explaining the bug; #3072 matched the comment
  # above the line it was asserting on, so deleting the line stayed green). The checker reads
  # yaml.safe_load_all output, which drops comments by construction, and --self-test pins it with
  # a fixture whose only bogus host is in a comment.
  #
  # ENFORCED since #3931 (ahead of the 2026-10-31 target), which drained all 6 findings to zero.
  #
  # The triage note that stood here graded every finding as a dead default "the deployed pods
  # override by env". Checked against the deployed manifests, that held for three of the six —
  # account-service's sanctions + product-catalog clients and card-issuance's product-catalog
  # client. The other three were LIVE: settlement-service's Rollout and onboarding-service's
  # Deployment carried no *_SERVICE_URL env at all, so `openbank-balance-service:8080`,
  # `openbank-ledger-service:8080` and `openbank-party-service:8090` were the values those pods
  # actually dialled — names that resolve in no namespace, on ports that are wrong even for the
  # right name (balance-service is 8103, ledger-service 8101, party-service 8111). Every
  # settlement debit/credit, every settlement GL posting, and onboarding's abandoned-registration
  # party lookup were pointed at nothing.
  #
  # THE LESSON, which is why this text stays rather than being deleted with the findings: an
  # advisory gate's "all of these are benign" note is itself an unverified claim, and advisory
  # mode is exactly what removes the pressure to verify it. Grading a finding by the SHAPE of the
  # config line (a bare `openbank-<svc>` default that some peers do override) instead of by the
  # deployed manifest gets the benign cases right and the live ones wrong, silently. Same class as
  # the "gate that has only ever passed is unfalsified" rule in root CLAUDE.md, one level up: here
  # the gate fired correctly and the TRIAGE was the unfalsified artifact.
  #
  # The fix follows the fleet convention rather than inventing one: application.yaml keeps a
  # localhost dev default (what transaction/billing/statement/lending/fx/kyc already do), and the
  # in-cluster URL is supplied by the workload's env in openbank-infra/gitops. NetworkPolicies are
  # derived from those env URLs, so gen-network-policies.py was re-run (onboarding gained ingress
  # to party; payments already had balances/ledger).
  enforced: enforced
  enforced_since: "2026-08-07"        # #3931
  original_target_enforce_date: "2026-10-31"   # ADR-0144 — met early
  ci_producer: .github/scripts/check-incluster-hostnames.py

noop_outcomes:
  # ADR-0252 phase 0 (#4348). `PushResult.skipped()` — returned whenever the APNs adapter is
  # disabled — carried `success = true`, and the fan-out asked `count { success }`. Every push in
  # an environment without APNs credentials was therefore counted as delivered: the row committed
  # SENT with `sentAt` set, and the outcome event announced a delivery that never left the process.
  #
  # It was unrecoverable from telemetry for three reasons that generalise to every adapter of this
  # shape: the disabled path is the QUIET one so there is no error to find; the channel emitted no
  # metric of its own so nothing disagreed with the row; and a 200 from APNs means *accepted*, not
  # delivered — the provider issues no receipt, so delivery is not observable server-side at all.
  #
  # THE RULE: a skipped / disabled / dry-run / no-op outcome gets its OWN enum value and must never
  # share a boolean with a real success. Name the metric for what can actually be established —
  # `accepted`, never `delivered` — and alert on the success state ("adapter skipping and accepting
  # nothing"), because at 100% skip there is no error rate to alert on.
  distinct_enum_value_required: true
  aggregation_must_not_fold_noop_into_success: true
  sanctioned_shape: "PushSendOutcome { ACCEPTED, SKIPPED, FAILED }"
  #
  # The baseline in the script is EMPTY: the fleet measured clean on 2026-08-22 (notification was
  # fixed by #4348; billing's BillingAssessment.skipped never had a success boolean beside it). So
  # this gate carries no remediation debt and exists purely to keep the class from recurring — an
  # empty baseline is the stronger claim, and --self-test is what makes it evidence rather than an
  # assertion, since a gate that has never gone red proves nothing by being green.
  baseline_is_empty_by_measurement: true
  ci_producer: .github/scripts/check-noop-not-success.py

kafka_dotted_keys:
  # SmallRye Config's YAML source quotes any leaf map key containing a literal dot, so
  # `group.id: foo` under `mp.messaging.incoming.<channel>:` registers as the property
  # `…<channel>."group.id"` — quotes included — and KafkaConnectorIncomingConfiguration's plain
  # getOptionalValue("group.id", …) never finds it. Nothing errors; the connector silently uses
  # its own default (#686).
  #
  # THE RULE: a dotted `group.id` / `auto.offset.reset` must either resolve to the same value its
  # fallback produces, or be set from a real config source — a `<svc>-msg-override.yaml` ConfigMap
  # carrying override.properties with config_ordinal=500. Do NOT simply delete the YAML key: local
  # dev and tests read it fine, and it is only the deployed path that breaks.
  must_match_fallback_or_be_overridden: true
  #
  # WHY IT IS A RATCHET rather than a sweep. Six services currently satisfy the rule for
  # `group.id` only by COINCIDENCE — the value they wanted equals quarkus.application.name, which
  # is exactly what the fallback produces — and that holds until a service is renamed or a channel
  # wants its own group (which is what transaction-service did). The SAME six declare
  # `auto.offset.reset: earliest`, where no such coincidence is available, so the effective value
  # is the connector default and not the one in the file.
  #
  # Those six are NOT a pending tidy-up. Forcing `earliest` onto a consumer group that has been
  # running as the default re-reads the topic from the beginning — a mass replay on money-path
  # channels, and a deliberate per-channel operational decision (#2945). So they are baselined in
  # the script against that issue, a NEW occurrence fails, and a baseline entry that becomes
  # covered is reported too, so the list cannot rot in either direction.
  baseline_is_checked_both_ways: true
  ci_producer: .github/scripts/check-kafka-dotted-keys.py

kafka_topics:
  referenced_topics_must_be_declared: true
  # A Kafka consumer subscribed to a topic that does not exist does NOT error. It joins its
  # consumer group, reports healthy, and receives nothing — forever. There is no runtime
  # signal that can distinguish it from a topic with no traffic: pod ready, group joined,
  # lag zero, metrics flat. So this is only catchable statically, before the merge.
  #
  # Found live: openbank-analytics-sink subscribed to `openbank.account.events` and
  # `openbank.transaction.events`. NEITHER has ever existed — the real topics are
  # `openbank.accounts.account.created` and `openbank.transactions.transaction.initiated`,
  # both declared, both produced, both already consumed by audit-service. The sink ran for
  # weeks green while no ACCOUNT_OPENED and no TRANSACTION row ever reached bronze_events,
  # which silently made ADR-0210 D2's account->party resolution dead code and left Customer
  # 360 structurally unable to show a customer's accounts or transactions (PR #2629).
  #
  # Same failure shape as a client pointed at a REST path that does not exist — the one that
  # shipped finrep's call to `/api/v1/ledger/trial-balance` (see the contract-test notes in
  # CLAUDE.md). There the answer was to make the provider replay the contract at PR time;
  # here it is to compare the name a service asks for against the set declared to exist.
  #
  # `openbank-infra/gitops` carries a KafkaTopic CR for every topic, so the declared set is
  # authoritative and complete — that is what makes this checkable without a live broker.
  #
  # ENFORCED from the day it was written, not advisory. The fleet is at zero unresolved
  # topics, so there is no judgement left to exercise; an advisory verdict over a checkable
  # fact only makes the next violation mergeable.
  scope: |
    Every dotted topic name in a `topics:`/`topic:` key of any
    openbank-*/src/main/resources/application.yaml must resolve to a KafkaTopic CR
    (metadata.name or spec.topicName) under openbank-infra/gitops.
  # EMPTY, and that is the point. An entry needs a reason, and the check fails on a stale
  # declaration in BOTH directions — a name listed here that IS declared is itself reported —
  # so a temporary exception cannot quietly become permanent. Same idiom as the pact gate's
  # KNOWN_UNCOVERED and the runblocking_allowlist above.
  allowed_absent: []
  # The check ships with a --selftest that feeds it inputs it MUST flag and inputs it must
  # NOT, run on every CI invocation: once the fleet is clean the flagging branch would
  # otherwise never execute again, and a gate that has only ever passed is unfalsified.
  ci_producer: ".github/scripts/check-kafka-topics-exist.py"

# ---------------------------------------------------------------------------------------
# Vulnerability-management lifecycle SLAs (ADR-0030 D1). Detection -> closure, in days.
# ---------------------------------------------------------------------------------------
vuln_management:
  sla_days: { critical: 7, high: 30, medium: 90, low: 180 }
  triage_owner: CODEOWNERS
  surfaced_in: admin-ui-governance
  vex_format: openvex                   # OpenVEX 0.2.0; one doc per component per release
  vex_store: openbank-libs/governance/vex/<component>.openvex.json   # human-triaged overlay
  # D1 is SHIPPED (PR #325 image-rescan.yml, PR #315 vex-triage.yml + vex-triage.py /
  # vex-inventory.py). Not a PR-blocking gate — a scheduled lifecycle: vex-triage.yml
  # (weekly) opens/closes `vex-triage`-labelled GitHub issues per queued CVE (the issue's
  # creation date IS the SLA clock) and the job itself goes red (::error, non-zero exit)
  # when an open issue's age exceeds sla_days for its OSV-derived severity — that red run
  # is the enforcement signal, same forcing-function shape as ADR-0144 gate graduation,
  # but on a cron rather than a PR check. image-rescan.yml (weekly) additionally passes
  # each component's VEX overlay to `trivy image --vex`, so a human `not_affected`/`fixed`
  # verdict suppresses re-alarming on an already-triaged finding.
  gate: vex-triage
  enforced: active                      # producer is wired and the weekly job enforces its own SLA
  ci_producer: ".github/scripts/vex-triage.py (+ vex-inventory.py), .github/workflows/vex-triage.yml"

# ---------------------------------------------------------------------------------------
# CI runner governance (ADR-0053, supersedes ADR-0082). Per-job EPHEMERAL ARC runner
# scale sets on EKS, scaled to zero on Karpenter's diversified Graviton spot pool. Retains
# ADR-0040's $0-hosted-minutes goal and ADR-0082's build/deploy trust split (now as two
# scale sets, not two persistent hosts). Reverses ADR-0082's "persistent + always-on EC2"
# default: ephemeral-on-EKS meets the availability + trust-tiering drivers BETTER (multi-AZ,
# fresh per job) at ~4x lower cost; the cold-start tax is mitigated by remote caches.
# ---------------------------------------------------------------------------------------
ci_runners:
  model: ephemeral-scale-to-zero        # ADR-0053; per-job ARC pods, NOT persistent
  platform: arc-on-eks                  # actions-runner-controller; Karpenter spot nodes
  scale_to_zero: true                   # minRunners=0 idle; spend -> $0 when no CI
  # FinOps dispatch order — AGENTS MUST ENFORCE THIS, never bypass.
  # REVISED when the repo went PUBLIC: GitHub-hosted standard runners became free
  # and unlimited (ubuntu-latest = 4 vCPU/16 GB; ubuntu-24.04-arm = native arm64),
  # which inverts the old Hetzner-first order:
  #   1. GitHub-hosted (ubuntu-latest / ubuntu-24.04-arm) = primary for every job
  #      that does NOT need the cluster network — $0, no idle cost, no NAT exposure.
  #   2. ARC on EKS Spot (scale-to-zero) = ONLY for jobs that genuinely need
  #      VPC/cluster-DNS reachability (Pact broker can-i-deploy, main-lane service
  #      builds that verify+publish pacts, runner-image build) — idle cost $0.
  # Consequence: if a build fails on a hosted runner due to an arch issue, fix the
  # root cause (native ubuntu-24.04-arm runner or --platform=$BUILDPLATFORM on
  # build-only stages) — never route it back to a paid pool as a workaround.
  static_hosts:                          # DECOMMISSIONED 2026-07-03 (public-repo FinOps shift, issue #196)
    hetzner:
      status: deleted                    # both openbank-runner-{1,2} (CPX42) deleted via hcloud; zero ongoing cost
      former_labels: [openbank-build, openbank-batch, openbank-sandbox, hetzner]
      # ARC (scale-to-zero) now serves every job that previously targeted these
      # labels — the openbank-build/openbank-batch scale sets were never Hetzner-
      # exclusive, so no CI change was needed. runner-tune-hetzner.yml (the only
      # Hetzner-specific workflow) was deleted in the same PR as this entry.
    mac_mini:
      arch: arm64
      labels: [openbank-build, openbank-sandbox]
      count: 1
      role: owner_managed_accelerator     # NOT a FinOps line item (owner's own hardware, no cloud billing);
      # kept in the label pool at the owner's discretion, independent of this
      # governance decision. Native arm64 is otherwise served free by
      # ubuntu-24.04-arm, so this is a pure opt-in accelerator (ADR-0053), never
      # something CI depends on being online.
  spot:
    provider: karpenter                 # diversified Graviton spot, price-capacity-optimized
    interruption: karpenter-managed     # no persistent spot request; node replaced on reclaim
  pools:                                # three ARC scale sets: build/deploy TRUST split + build/batch CAPACITY split
    build:                              # executes PR code, merge-required (compile, unit/IT tests, admin-ui, manifests)
      scale_set: openbank-build
      cloud_write_credentials: false    # no ECR push, no ArgoCD, no prod secrets
      secrets: none
      image_builds: dind                # privileged docker-in-docker today; rootless (BuildKit/Kaniko) is the ADR-0053 hardening follow-up
      ephemeral_per_job: true           # fresh pod per job; nothing retained between jobs
    batch:                              # non-blocking: security/secret scans, finops audit, label sync (PR + weekly cron)
      scale_set: openbank-batch
      cloud_write_credentials: false    # same trust level as build — no creds; safe for PR code
      secrets: none
      image_builds: dind
      ephemeral_per_job: true
      isolation_rationale: "separate low-capped pool so a scan/cron burst cannot starve the merge-required build lane (ARC has no job preemption — dedicated capacity is the only priority lever)"
    dr:                                # quarterly resilience lanes: dr-restore-verify, chaos drill, attestation evidence (ADR-0277)
      scale_set: openbank-dr
      cloud_write_credentials: false    # no IRSA/cloud role on the pod SA at all
      secrets: none
      cluster_api: restore_verify_namespaces_only   # Role+RoleBinding in gitops components/platform, Kyverno-pinned
      ephemeral_per_job: true
      triggers: [schedule, workflow_dispatch]       # NEVER PR code — excluded from pr_jobs_allowed_pools by construction
      isolation_rationale: "cluster-reachable lane for DORA restore/chaos evidence; a credentialled lane PR code must never reach (#6458 class, ADR-0277)"
    deploy:                            # ECR push + ArgoCD sync; post-merge only
      scale_set: openbank-deploy
      credentials: irsa                 # pod ServiceAccount IRSA scoped to ECR push + ArgoCD
      secrets_source: vault             # fetched at job time, never written to disk
      secrets_persisted_to_disk: false
      triggers: [push_main, tag]        # a pull_request job must NEVER target this scale set
  # A PR-triggered job may target build or batch (both credential-free); targeting deploy from a PR
  # is a governance violation the CI lint must reject.
  pr_jobs_allowed_pools: [build, batch]
  availability:
    merge_required_scale_set: openbank-build
    failure_domain: eks-multi-az        # not a laptop, not a single EC2 host
    no_developer_workstation_in_critical_path: true   # Macs are opt-in accelerators only
    warm_min_runners_lever: engaged     # build minRunners=1 since 2026-06-01: a per-service build queued ~45 min behind a push/PR workflow burst (p95 SLO miss); batch+deploy stay at 0
  stuck_runner_reaper:                  # self-heal guard, arc-runner-reaper.tf; ARC has no built-in idle/registration timeout for a registered-but-jobless runner
    why: "ARC won't reap a phase=Running runner (assumes mid-job); a cancelled/superseded queued job leaves an orphan that never gets work and pins a spot node until noticed (observed 2026-06-02, ~10h)"
    mechanism: cronjob                  # arc-runners ns; namespaced SA may only list+delete EphemeralRunners — no Lambda/CloudWatch/webhook
    selects: running_and_jobless        # jobRequestId==0 AND jobId=="" AND jobRepositoryName=="" — a runner with real work is never a candidate
    idle_threshold_minutes: 30          # > longest CI job, so a healthy burst's not-yet-assigned runners are safe
    respects_min_runners: true          # rule (a): reap only the excess over minRunners (keeps oldest = the warm runner); minRunners read live, never hardcoded
    hard_cap_minutes: 120               # rule (b): backstop = 4x threshold. ARC keeps a stuck orphan through scale-down (thinks it's busy), so it can occupy the lone min slot where there is no excess; past the cap ANY idle runner is recycled, healing it. Fresh replacement resets the clock -> steady-state warm-runner churn at most once/cap (a few cheap recycles during an active orphan incident, self-resolving)
    delete_precondition: resourceVersion # atomic compare-and-delete: a runner that picked up a job between scan and delete is skipped (409), never killed mid-job
  cold_start_mitigation:
    gradle_remote_cache: s3
    docker_layer_cache: true
    node_reuse: karpenter-consolidate-after   # closely-spaced jobs reuse a warm node
  clock:
    ntp_enforced: true                  # pods inherit node NTP; skewed node -> Karpenter replaces
    max_offset_seconds: 1
  secrets:
    github_app_key: k8s-secret-only     # arc-github-app secret; NEVER in tofu state
  as_code: opentofu                     # ARC controller + scale sets in version control; no click-ops
  provenance:                           # deploy pool signs; ArgoCD deploys only signed digests
    sign_images: cosign
    deploy_only_signed_digests: true
  gate: ci-runner-governance
  enforced: planned                     # ADR-0053 Accepted; lint + tofu enable land on rollout
  target_enforce_date: "2026-11-30"   # ADR-0144. Moved from 2026-08-31, which passed with the
                                      # blocker unresolved and turned an enforced gate red on every
                                      # PR regardless of its diff. Extending the horizon is the
                                      # sanctioned move here; the alternative -- flipping `enforced`
                                      # to satisfy the date -- would claim a control this repo does
                                      # not have.
  blocked_on: "the CI lint enforcing pr_jobs_allowed_pools (build/batch only, never deploy) does not exist: no file under .github/scripts or .github/gates references that key (control: money_path_services is referenced by two, so the probe sees rule keys). The OpenTofu half is less clear than this line used to claim -- arc-runners.tf and arc-runner-reaper.tf are in the tree, but a committed .tf is not an applied one, and that is not checkable from this repository. Corroborating evidence that the pools are not fully provisioned: #6458 records openbank-batch as a declared pool with no capacity and no consumer."

# ---------------------------------------------------------------------------------------
# Infra apply (ADR-0060). Closes the "as-code without applied" gap: CI applies the
# platform OpenTofu so a merged change reaches the live account (derive -> enforce ->
# APPLY, ADR-0029). Auth is GitHub OIDC -> IAM; safety is the trust scope, not a trimmed
# permission list. Apply is manual-dispatch (Free plan has no Environment protection).
# ---------------------------------------------------------------------------------------
infra_apply:
  tool: opentofu                        # envs/** ; workflow .github/workflows/platform-tofu.yml
  trigger:
    plan: [pull_request, push]          # read-only preview to the job summary (batch lane)
    apply: workflow_dispatch            # manual "Run workflow" on main (deploy lane); see gate
  auth: github-oidc                     # NO static AWS keys; short-lived STS creds
  roles:
    plan: { name: openbank-ci-tofu-plan, permissions: ReadOnlyAccess, sub: "repo:JiRaska/open-bank-oss:{ref:refs/*,pull_request}", eks_access: admin-view }
    apply: { name: openbank-ci-tofu-apply, permissions: AdministratorAccess, pin: "job_workflow_ref=JiRaska/open-bank-oss/.github/workflows/platform-tofu.yml@refs/heads/main", eks_access: cluster-admin }
  gate: manual-dispatch                 # human presses Run-workflow after reading PR plan preview; apply role pinned to this one workflow file on main
  gate_upgrade: environment-reviewer    # stronger gate (reviewer-gated Environment) blocked on GitHub plan (Free has no env protection); follow-up #282
  broad_role_rationale: "security boundary is the OIDC job_workflow_ref pin + manual dispatch, not an ever-drifting action list; a trimmed policy fails applies on each new resource type (ADR-0060)"
  state_lock: s3-use_lockfile           # concurrent apply serialises on the lock (-lock-timeout), never races
  apply_is_toctou_safe: true            # plan -out=tfplan then apply tfplan in one job; stale plan rejected; no plan artifact (would leak secrets)
  runner_routing: { plan: openbank-batch, apply: openbank-deploy }   # ADR-0053
  scope: envs/sandbox-platform          # first env; others onboard via working-directory
  gate_name: platform-tofu
  enforced: advisory                    # apply is manual; not a PR-blocking check
  target_enforce_date: "2027-01-31"   # ADR-0144 — long horizon: blocked on an external plan change, not unbuilt tooling
  blocked_on: "gate_upgrade to a reviewer-gated Environment needs GitHub plan Environment-protection support (Free plan doesn't have it) — issue #282. Move this date forward, don't silently drop it, if the plan constraint is still unresolved when it arrives."

# ---------------------------------------------------------------------------------------
# Issue tracking (ADR-0052). Issues are the actionable backlog layer — they do NOT
# duplicate ADRs (decisions) or release-please (changelog). A PR closes its issue with
# `Closes #<n>`; a fleet-sweep service PR references the tracker with `Refs #<n>`.
# ---------------------------------------------------------------------------------------
issues:
  labels_source: .github/labels.yml      # single source of truth; never created in the UI (rule #7)
  label_sync: additive                   # create-or-update only; pruning is a manual decision
  templates_dir: .github/ISSUE_TEMPLATE
  link_in_pr: required                   # PR template "Linked issues": Closes #<n> / Refs #<n>
  open_an_issue_for:
    - fleet_sweep                         # cross-service change, one PR per service -> sweep tracker
    - governance_followup                 # actionable tail of an ADR (rollout, reg condition, gate flip)
    - bug                                 # defect in shipped behavior
    - enhancement                         # proposed capability (asks "needs ADR?" before build)
  not_an_issue:
    - architectural decisions             # -> docs/adr (an Issue may TRACK an ADR's rollout, not replace it)
    - changelog entries                   # -> release-please derives these from Conventional Commits
    - questions                           # -> GitHub Discussions (ISSUE_TEMPLATE/config.yml)
    - security vulnerabilities            # -> private Security Advisories (SECURITY.md)
  money_path_link:
    detect: ["issue touches a money_path service"]
    require: ["money-path label", "2 approvals + threat model on each resulting PR"]  # rules.yaml: money_path_services
  gate: issue-hygiene
  enforced: block                         # ADR-0052; link-in-PR lint landed (CI job `issue-hygiene` in ci.yml)
  bypass_label: skip-hygiene              # escape hatch for PRs with no sensible issue link (bots auto-exempt)

# ---------------------------------------------------------------------------------------
# FinOps managed-service version lifecycle + recurring cost audit (ADR-0054). A managed
# cloud-service version we pin MUST be on standard support with runway — never provisioned
# into (or left sitting in) paid extended support. Catches the #84 class of mistake
# (EKS 1.31 born ~6mo into extended support, billed 6x) at PR time, and re-checks weekly
# as the calendar slides. Enforced by openbank-infra/scripts/check-version-lifecycle.py.
# ---------------------------------------------------------------------------------------
finops:
  managed_version_policy:
    target_selection: latest_minus_one    # newest STANDARD minor that is NOT the freshest, for banking maturity
    min_standard_support_months: 6        # a pin must have >= this many months of standard support left
    forbid_extended_support: true         # never provision/run a version in paid extended support
  managed_version_pins:                   # the tofu roots whose pinned versions the gate audits
    - service: eks
      file: openbank-infra/aws/envs/sandbox-substrate/variables.tf
      key: kubernetes_version
      lifecycle_table: openbank-infra/aws/finops/eks-version-lifecycle.json
  periodic_audit:
    cadence: weekly                       # .github/workflows/finops-lifecycle.yml schedule (Mon 06:00 UTC)
    static:                               # phase 1 — no cloud creds; ships now
      checks: [version_in_extended_support, version_runway_below_threshold]
      on_finding: open_issue              # open/update a single tracking Issue (ADR-0052 backlog)
    live:                                 # phase 2 — deferred; needs a read-only AWS OIDC role
      enforced: deferred
      scope: all_consumed_services
      checks: [eks_support_status, aws_budgets_threshold, cost_anomaly_detection, idle_unattached_resources]
  gate: finops-version-lifecycle
  enforced: block                         # ADR-0054; PR gate fails a non-compliant pin

# ---------------------------------------------------------------------------------------
# FinOps workload tiers — scale-to-zero classification (ADR-0057). The dominant cost
# lever at our utilisation is RUNNING HOURS; only scale-to-zero removes them. Every
# service is classified into one of four tiers; new services DEFAULT to the lowest tier
# their trigger allows (not always-on). Scale-to-zero runs on the existing Kubernetes
# substrate (KEDA, optionally Knative) on Karpenter spot — never a proprietary FaaS, so
# ADR-0027 (cloud-agnostic) is preserved. The declared tier is kept honest against
# MEASURED behaviour by a classifier + CI gate (derive -> enforce -> show, ADR-0029/0054).
# ---------------------------------------------------------------------------------------
finops_tiers:
  tiers:
    T0:                                   # Always-on
      definition: "Money-path HOT path where a cold-start / scaled-to-zero gap is unacceptable, or a regulator-mandated continuous service."
      mechanism: "minReplicas >= 1 (PDB complements, is not the floor); never scales to zero."
      idle_cost: full
    T1:                                   # HTTP -> 0
      definition: "Stateless request/response, bursty/rare traffic, cold-start-tolerant within its latency SLO."
      mechanism: "KEDA HTTP add-on (or Knative Serving) — scale from/to zero on inbound HTTP. Requires a Quarkus native image."
      idle_cost: near_zero
    T2:                                   # Event -> 0
      definition: "Async Kafka consumers / projections / dispatchers that tolerate processing latency."
      mechanism: "KEDA ScaledObject on Kafka consumer-group lag — wake on backlog, drain, return to zero."
      idle_cost: near_zero
    T3:                                   # Cron / Job
      definition: "Periodic batch (reconciliation, audits, accruals) with no resident listener."
      mechanism: "Native Kubernetes CronJob / Job."
      idle_cost: zero

  # Classification axes, applied IN ORDER (first match wins).
  classification_axes:
    - "money_path + availability: regulatory-continuous OR a synchronous money hop where cold-start latency is unacceptable -> T0"
    - "trigger: periodic-no-listener -> T3 ; async-event-driven -> T2 ; synchronous-HTTP -> candidate T1"
    - "traffic_shape + latency_SLO: constant high QPS or tight p95 the native cold-start budget cannot meet -> keep T0/min>0 ; bursty/rare + cold-start-tolerant -> T1"

  default_for_new_services: lowest_tier_trigger_allows   # T2 for event consumers, T1 for HTTP — always-on is opt-in + justified

  # T0 is driven by money_path_services (above): a money-path service is T0 by default,
  # and DEMOTING one below T0 requires an ADR-0030 threat-model update + 2 approvals.
  t0_baseline: money_path_services

  # Declared tier per service. Only EVIDENCE-BACKED assignments are recorded here; the
  # rest stay `unclassified` until the classifier recommends a tier from measured signals
  # (no hand-asserted fleet list to rot — ADR-0029). Money-path services inherit T0 via
  # t0_baseline and need no explicit entry.
  declared:
    openbank-notification-service: T2     # proven pilot, live in sandbox (ADR-0057 best-first target, #228)
    # ADR-0173 D3 reconciliation (2026-07-29): card-issuance carries a live HTTPScaledObject
    # with an openbank.io/finops-tier: T1 label and was missing here. Not money-path, so T1
    # is declarable on the evidence of the live scaled object + classifier-measured idle —
    # HELD AT min:1 (warm floor) pending a cold-start SLO re-measurement on the current path,
    # the same hold product-catalog carries below.
    openbank-card-issuance-service: T1      # live HTTPScaledObject (payments/card-issuance-http), held at min:1 — see ADR-0173 D3
    # sdd-service and interest-service ALSO carry T1-labeled HTTPScaledObjects (sdd/ and
    # interest/ namespaces) — but both are money_path_services, so they inherit T0 via
    # t0_baseline and a T1 label on the deployment is the drift ADR-0173 D3 describes:
    # demoting either below T0 requires an ADR-0030 threat-model update + 2 approvals, and
    # neither has happened. Their scaled objects run min:1 (= T0 behaviour today); the label
    # means nothing until the demotion process runs. NOT declared here on purpose — an
    # explicit T1 entry would silently demote a money-path service, exactly what
    # money_path_sacred exists to block (check-finops-tiers.py flags it).
    # openbank-product-catalog was WRONGLY declared T1 here (#2800), citing a
    # non-existent issue (#2083), while only Enabler 2 (HTTPScaledObject) existed —
    # no commit ever added a native build (Enabler 1), so the claimed "native
    # cold-start SLO gate passed in sandbox" never happened. Corrected 2026-07-05.
    # Update 2026-07-06: Enabler 1 (native build) is now real and its two native-only
    # bugs are fixed (bad Mutiny/coroutine bridge, missing @RegisterForReflection —
    # verified working end-to-end in a scratch namespace, #253) — but the ADR-0083
    # promotion gate (native cold start ≤ ~300-500ms p95) was MEASURED and FAILS:
    # 5 scale-0->1 cycles landed at 3.5-8.8s, dominated by Kubernetes Pod scheduling /
    # image-pull / readiness-probe overhead, not the ~200ms application start. Stays
    # Update 2026-07-06 (2): the gate is now redefined (ADR-0083) as two components —
    # process start ≤500ms p95 (met, ~0.2-0.3s) and end-to-end scale-from-zero with
    # tuned probes ≤5s p95 (met on a small sample, ~4.4s avg/5.0s worst-of-3; probe
    # tuning alone cut ~28% off the untuned 3.5-8.8s, the residual ~4s floor is
    # Kubernetes control-plane + admission-webhook overhead, not the image).
    openbank-product-catalog: T0
    # Reverted T1 -> T0 on 2026-07-17: the T1 measurement was real but measured the wrong
    # path. Every number below was taken THROUGH the KEDA HTTP interceptor, which parks the
    # first request while the pod scales 0->1. But product-catalog's actual onboarding-path
    # callers — account-service (openAccount product validation, #668) and document-service
    # (OnboardingDocumentService template-code resolution, ADR-0162 D7) — dial the ClusterIP
    # directly, NOT the interceptor. At min:0 they got `Connection refused`, not a slow first
    # click. document-service reads that as "product has no document template" and issues no
    # onboarding document, so no signature ceremony is ever created: onboarding silently could
    # not complete (registration still 201). Zero accounts completed onboarding 2026-06-24..
    # 2026-07-17. The HTTPScaledObject is held at min:1; re-declare T1 only once every
    # in-cluster caller goes through the interceptor AND the SLO is re-measured on that path.
    # Original T1 rationale kept below for the record.
    # Declared 2026-07-07 (#253): the live sandbox Deployment (accounts namespace)
    # already runs the native image + tuned probes (startupProbe/readinessProbe
    # periodSeconds:1, failureThreshold:10). A 10-sample end-to-end scale-from-zero
    # series through the KEDA HTTP interceptor measured median 5.29s / p95 ~5.4s
    # (excl. one 9.1s sample that likely captured a cold node-local image pull) —
    # marginally over the ADR's ≤5s p95 target. Accepted as met (maintainer call,
    # #253): the miss is small, and for a non-money-path, rarely-hit admin/fees read
    # endpoint the interceptor's whole job is absorbing that wait as a slow first
    # click, not a 5xx — the FinOps trade (near-zero idle cost) holds. Caveat: this
    # is a single n=10 sample on one day, not the ADR's originally-specified 48h
    # burn-in window — re-validate over a longer window before treating T1 as
    # permanently locked in; a regression would demote per t0_baseline's own
    # 2-approval bar for money-path (N/A here) or a simple re-declare for non-money-path.

  # Keep-honest classifier: reads measured signals (HTTP rate/idle ratio, Kafka lag +
  # active fraction, CPU/replica utilisation), emits a recommended tier + realised
  # idle-hours saving, surfaced in the admin-ui FinOps view. The lever to RAISE a service
  # back toward min>0 is a measured p95 queue/latency SLO miss — a number, not a hunch.
  classifier:
    signals: [http_request_rate, http_idle_ratio, kafka_consumer_lag, kafka_active_fraction, cpu_utilisation, replica_utilisation]
    raise_trigger: measured_p95_slo_miss  # documented escape hatch back to min>0; off by default for cost
    surface: admin-ui-finops-view

  guardrails:
    - "cold_start_cascade: a chain of synchronous T1 calls sums cold-starts; deep sync call-graphs keep an earlier node warm (min>0) or pre-pull."
    - "native_build_budget: T1 viability assumes Quarkus native images; the cold-start SLO is MEASURED per service, not assumed."
    - "money_path_sacred: T0 membership is driven by money_path_services; demotion needs the ADR-0030 threat model + 2 approvals."
    - "cloud_agnostic: KEDA/Knative run on any conformant Kubernetes; no AWS-only primitive enters the path (ADR-0027)."

  # Declared-vs-measured drift gate. Advisory until the classifier (the measured side)
  # ships; flips to block once it reads live metrics — same trajectory as ADR-0054's
  # live phase. A service whose declared tier diverges from measured behaviour (e.g. a T0
  # idle 95% of the time with no money-path justification) raises a FinOps finding /
  # tracking issue (ADR-0052), not a silent drift.
  gate: finops-tier-drift
  enforced: advisory                      # ADR-0057; -> block when the classifier lands
  target_enforce_date: "2026-09-30"   # ADR-0144
  blocked_on: "the measured-signal classifier shipped 2026-07-29 (finops-tier-classifier CronJob, daily report in the admin-ui) — the advisory gate now reads its findings; 3 services have a declared tier today (notification-service T2, product-catalog T0, card-issuance T1-held-at-min:1)"
  # Added by issue #2392: the rule carried `enforced`/`target_enforce_date` but never named the
  # script that produces the finding, so nothing tied the advisory CI step to this deadline.
  ci_producer: "openbank-infra/scripts/check-finops-tiers.py"

# ---------------------------------------------------------------------------------------
# FinOps cost-allocation groups — showback business flows (ADR-0062). The /api/finops/costs
# snapshot is aggregated by AWS SERVICE (EC2, EKS, RDS); this section is the missing layer
# that lets the admin-ui roll cloud spend up the BUSINESS taxonomy: service -> data domain
# (cost-center, from admin-ui manifest.ts dataDomain) -> business flow (here). The allocator
# (admin-ui src/lib/finops/allocation.ts) splits the shared COMPUTE pool across services by
# their declared resource requests (derive -> show, ADR-0029), then sums per group.
#
# Service ids use the CANONICAL key = the admin-ui manifest serviceName (NO `openbank-`
# prefix), which also equals the gitops Deployment metadata.name (ledger-service,
# account-service, ...). This is the stable join key across manifest.ts (domain source) and
# the gitops resource-request footprints; money_path_services uses a different `openbank-*`
# convention and is intentionally NOT the join key here. A drift test (admin-ui
# finops-taxonomy.test.ts) fails the build if any service below is unknown to manifest.ts.
#
# SHOWBACK, not chargeback: a service belongs to EVERY flow that needs it, so the per-flow
# sums OVERLAP and add up to MORE than the fleet total. That is intentional ("fully-loaded
# cost to run this flow end-to-end, including shared dependencies"); the UI states it.
# ---------------------------------------------------------------------------------------
finops_cost_groups:
  account-management:
    label_en: "Account Management"
    label_cs: "Správa účtů"
    services: [account-service, party-service, kyc-service, sca-service]
  double-entry-ledger:
    label_en: "Double-Entry Ledger"
    label_cs: "Podvojné účetnictví"
    services: [ledger-service, transaction-service]
    regulatory_ref: "CNB §4 — books of account"
  balance-projection:
    label_en: "Balance Projection"
    label_cs: "Projekce zůstatků"
    services: [balance-service, transaction-service]
  compliance-screening:
    label_en: "Compliance Gate (AML/Sanctions)"
    label_cs: "Compliance brána (AML/sankce)"
    services: [aml-service, sanctions-service, kyc-service]
    regulatory_ref: "5AMLD Art. 18 — screening before payout"
  sepa-payment-flow:
    label_en: "SEPA Credit Transfer"
    label_cs: "SEPA úhrada"
    services: [sepa-payment, transaction-service, ledger-service, account-service, balance-service, aml-service, sanctions-service, clearing-service]
    regulatory_ref: "PSD2 / pacs.008"
  sepa-instant-flow:
    label_en: "SEPA Instant"
    label_cs: "SEPA okamžitá platba"
    services: [sepa-instant-service, transaction-service, ledger-service, aml-service, sanctions-service, clearing-service]
    regulatory_ref: "PSD2 / 10s SLA"
  domestic-payment-flow:
    label_en: "Domestic Payment"
    label_cs: "Tuzemská platba"
    services: [domestic-payment, transaction-service, ledger-service, aml-service, sanctions-service]
    regulatory_ref: "CNB CERTIS"
  swift-payment-flow:
    label_en: "SWIFT Cross-Border"
    label_cs: "SWIFT zahraniční platba"
    services: [swift-service, transaction-service, ledger-service, aml-service, sanctions-service]
    regulatory_ref: "pacs.008 / cross-border"
  fx-conversion:
    label_en: "FX Conversion"
    label_cs: "Měnová konverze"
    services: [fx-service, transaction-service, ledger-service]
  card-issuance:
    label_en: "Card Issuance"
    label_cs: "Vydávání karet"
    services: [card-issuance-service, account-service, dispute-service]
    regulatory_ref: "PCI DSS"
  open-banking-psd2:
    label_en: "Open Banking (PSD2)"
    label_cs: "Open Banking (PSD2)"
    services: [psd2-service, consent-service, sca-service, tpp-registry-service, pid-service]
    regulatory_ref: "PSD2 AISP/PISP"
  interest-accrual:
    label_en: "Interest Accrual"
    label_cs: "Úročení"
    services: [interest-service, account-service]
  standing-orders:
    label_en: "Standing Orders"
    label_cs: "Trvalé příkazy"
    services: [standing-order-service, transaction-service]
  audit-trail:
    label_en: "Audit Trail"
    label_cs: "Auditní stopa"
    services: [audit-service]
    regulatory_ref: "DORA Art. 17 — immutable"

# How durable knowledge is captured so it survives across agents and contributors.
# A corrected mistake, a hard-won lesson, or a chosen direction goes INTO THE REPO —
# never only into an assistant's session/local memory, which does not travel and goes
# stale. Routing by kind; the human-readable form lives in CLAUDE.md ("Capturing what
# we learn"). This is a process rule (not CI-enforced), but rules.yaml is the source
# of truth when it and CLAUDE.md disagree.
gitops_ref_integrity:
  script: .github/scripts/check-gitops-secret-refs.py
  wired_into: .github/workflows/ci.yml   # governance job -> all-green (a REQUIRED check)
  # THE RULE: every Secret/ConfigMap a gitops workload consumes must be declared by
  # something in gitops. A manifest that reads a Secret nobody creates passes every gate
  # we have: the YAML is valid, ArgoCD syncs it (the Rollout is a legal object), CI never
  # runs the pod, and Kyverno admits it. The pod then sits in CreateContainerConfigError
  # indefinitely and the only signal is `kubectl describe` on a pod nobody watches.
  rule: >-
    Every secretKeyRef / configMapKeyRef / envFrom / volume reference in a gitops workload
    must resolve to a Secret or ConfigMap declared in gitops -- directly, or via the
    operator that derives it (ExternalSecret target, cert-manager Certificate secretName,
    CNPG Cluster credentials).
  basis: referenced_implies_declared
  # NOTE: rules.yaml is embedded VERBATIM (comments included) into all 27 OPA bundle
  # ConfigMaps, so prose here is duplicated 27x and moves every policy-checksum. The full
  # rationale -- why a grep cannot do this, the CNPG `vop-db-app` case that makes a naive
  # guard unusable, and the allowlist justification -- lives in the script header, where it
  # is stored once. Keep this block to the rule itself.
  # PRIOR ART: vop-service, 2026-07-16 -- shipped in #1195 consuming `vop-oidc`, a name that
  # appeared exactly ONCE in the repo, at the point of consumption. Its sibling gap (absent
  # from ALL_SERVICES, #1229) is guarded by deploy_coverage below; this is the same shape one
  # layer down. Verified by REVERT: with #1232's ExternalSecret removed the guard fails
  # naming `Secret payments/vop-oidc`; restored, it passes.
  incident: 2026-07-16

pr_build_cloud_credentials:
  script: .github/scripts/check-pr-build-cloud-credentials.py
  wired_into: .github/gates/gates.yaml    # gate id pr-build-cloud-credentials, group security, enforced
  rule: >-
    The reusable `_service-ci.yml` build job, which executes pull-request code on GitHub-hosted
    runners, must not assume a cloud role or log in to a cloud registry. Credentialed cache,
    contract and deployment work belongs only to a separately trusted lane.
  basis: untrusted_code_must_not_receive_deploy_credentials

oidc_secret_convention:
  script: .github/scripts/check-oidc-secret-convention.py
  wired_into: .github/gates/gates.yaml    # gate id oidc-secret-convention, group gitops, enforced
  # THE DECISION (issue #3485). The OIDC client secret lives in ONE KV entry, `account-service`,
  # and every ExternalSecret reads it from there. Not because that name is apt -- it is a
  # historical accident -- but because the fleet has exactly one Keycloak confidential client,
  # `openbank-services`, and therefore exactly one secret VALUE. A per-service key name promises
  # a per-service credential that does not exist, while costing a KV write nobody is prompted to
  # make. Independent rotation is the only thing the per-service form buys, and nothing can use
  # it while all 39 projections hold the same client's secret.
  rule: >-
    Under openbank-infra/gitops/components/, an ExternalSecret data entry projecting the OIDC
    client secret (remoteRef.property or secretKey == OIDC_CLIENT_SECRET) must read
    remoteRef.key: account-service.
  basis: one_client_implies_one_kv_entry
  baseline: in-script BASELINE dict -- 10 pre-existing per-service entries, SHRINK-ONLY
  # WHY BASELINED AND NOT MIGRATED. Changing a live ExternalSecret's remoteRef re-projects the
  # Secret and rolls the pod. Nothing in this repo can see what those 10 KV entries hold, so the
  # switch is safe only if `account-service` is current -- likely (28 live consumers) but not
  # verified from here, and being wrong breaks authentication on 10 services at once. The gate
  # therefore FREEZES today's split rather than moving it: the losing side cannot grow, and a
  # migration done later must delete its baseline entry or the gate fails on the stale
  # exemption. Migration is tracked on #3485.
  # PRIOR ART: openbank-delegation-service, 2026-08 -- shipped `remoteRef.key: delegation-service`,
  # an entry nobody had written. ESO answered `Secret does not exist`, the Secret was never
  # created, the pod sat in CreateContainerConfigError for its entire life, and ~12 alerts fired
  # without one of them naming the cause. Fixed in #3471 by pointing at the shared entry.
  # gitops_ref_integrity cannot catch this: the ExternalSecret DOES declare the Secret, it just
  # never materialises -- the defect is one layer out, in the KV key the ref names.
  incident: 2026-08-01

deploy_coverage:
  script: .github/scripts/check-deploy-coverage.sh
  wired_into: .github/workflows/ci.yml   # governance job -> all-green (a REQUIRED check)
  allowlist: .github/scripts/deploy-coverage-allowlist.txt   # built by a DIFFERENT pipeline
  baseline: .github/scripts/deploy-coverage-baseline.txt     # known debt -- SHRINK-ONLY
  # THE RULE: a released component (registered in release-please-config.json) whose image is
  # referenced anywhere under openbank-infra/gitops/ MUST appear in auto-deploy.yml's
  # ALL_SERVICES. ALL_SERVICES is hand-maintained; nothing kept it in sync with the package
  # list, so a service could be merged, released and given an ArgoCD manifest while NOTHING
  # ever built it. Every push then "succeeds" and deploys nothing -- there is no build
  # failure, because there is no build. The gitops tag simply rots in place.
  rule: >-
    Every released component with a gitops workload image reference must be listed in
    ALL_SERVICES in .github/workflows/auto-deploy.yml, or allowlisted with the pipeline
    that builds it instead.
  # WHY THIS RULE AND NOT "every service needs a Dockerfile": a per-service Dockerfile is NOT
  # used to build. auto-deploy and build-push-service.sh generate their own from a canonical
  # template and only grep the per-service file for EXPOSE, defaulting to 8080 when absent --
  # and EXPOSE is image metadata Kubernetes ignores; the manifest's containerPort is what
  # binds. Six healthy services (devops-agent, finops-agent, fraud-service, lending-service,
  # sdd-service, settlement-service) carry no Dockerfile and run fine. A Dockerfile rule would
  # fail all six for nothing and be switched off within a week.
  basis: released_and_deployed_implies_built
  # ALLOWLIST vs BASELINE -- deliberately two files, and the distinction is the point:
  #   allowlist = "something ELSE builds this"  -> permanent, legitimate (admin-ui)
  #   baseline  = "NOTHING builds this, yet"    -> debt, must shrink to empty
  # Collapsing them turns the guard into a rubber stamp: every "we will wire it up later"
  # lands beside a legitimate exception and is never revisited. That is exactly how
  # ALL_SERVICES drifted six times.
  ratchet: >-
    The baseline may only shrink. The guard FAILS if a baselined component is no longer
    violating (delete the entry) and FAILS on any violation that is in neither list. Adding
    a baseline entry is not a fix; it is a reviewable admission of debt.
  # PRIOR ART -- this class recurred six times before it was guarded, each time fixed by hand
  # and recorded in an auto-deploy.yml comment. A comment is not a control (see
  # knowledge_capture): the 6 ADR-0163/0164-0168 control agents; document-service;
  # clearing-simulator (24 days of pushes deployed nothing, and it went unattested straight
  # through the 2026-07-12 Enforce graduation -- one reschedule from an outage);
  # finrep-service; vop-service (merged 2026-07-16, one hour before this guard existed).
  incident: 2026-07-16

deploy_reconcile:
  probe: .github/scripts/auto-deploy-reconcile-lag.sh
  test: .github/scripts/test-auto-deploy-reconcile-lag.sh
  wired_into: .github/workflows/ci.yml            # test -> governance job (a REQUIRED check)
  schedule: .github/workflows/auto-deploy.yml     # cron "23 */3 * * *" -> the reconcile trigger
  # THE RULE (issue #2020): the per-push auto-deploy run is ONE-SHOT. A service can be
  # correctly detected, built and pushed, then blocked at the can-i-deploy contract gate by a
  # TRANSIENT verification lag -- its build wave republished its consumer pact, and the
  # counterpart provider version then in sandbox verified it only minutes later, on its own
  # deploy. The gate's verdict ("no verified pact between the latest main consumer and the
  # version currently in sandbox") is CORRECT at that instant, but nothing re-drives the
  # deploy once the provider catches up, so the service rots on its stale image until a human
  # hand-bumps gitops. Observed live: #1990 (notification-service per-party push prefs, +V11
  # migration + /api/v1/preferences) built image sandbox-6de0d5e9, was blocked against the
  # account-service then in sandbox, and ran the pre-#1990 image until PR #2017 hand-bumped
  # it -- the broker later reported the pair verified/deployable, proving a timing race, not a
  # contract break.
  rule: >-
    A scheduled reconcile re-offers every deployable service whose gitops image tag is behind
    main to the SAME build-push -> can-i-deploy -> gitops-pr path, so a strand left by a
    transient gate block self-heals the moment the gate clears.
  # WHY THIS IS NOT "weaken the gate": the gate is untouched. A service still genuinely blocked
  # stays blocked (and keeps its #1420 left-behind escalation) on every tick; reconcile only
  # re-presents it, so it deploys the moment -- and only the moment -- the contract clears.
  basis: a_transiently_blocked_deploy_must_self_heal_not_wait_for_a_human
  # The candidate set is enumerated from the gitops manifest pins intersected with
  # ALL_SERVICES (never a second copy of that list -- deploy_coverage above already guards
  # its drift), and capped oldest-first per tick so the first run does not fan out the whole
  # standing backlog (23 stranded services at 2026-07-24) in one shot. The deferred remainder
  # is logged, never silently dropped, and drains on later ticks.
  incident: 2026-07-24

identifier_intent_guard:
  script: .github/scripts/check-new-random-uuid.py
  wired_into: .github/workflows/ci.yml   # Validate manifests job -> all-green (a REQUIRED check)
  # THE RULE (ADR-0106, #1699): a PR must not ADD a bare java.util.UUID.randomUUID() in
  # src/main -- new code mints identifiers via com.openbank.libs.domain.identifiers.Ids
  # (newId() for durable/indexed ids, randomId() for idempotency keys/nonces/tokens).
  # Diff-scoped on purpose: it inspects only lines a PR adds, so it never fails on the
  # ~100 pre-existing call sites that migrate to Ids as-touched.
  rule: >-
    Added lines under */src/main/*.kt (excluding the Ids wrapper itself) must not contain
    a bare UUID.randomUUID() call.
  basis: new_identifier_code_uses_the_sanctioned_wrapper
  # CODE-ABOUT-CODE: Kotlin comments are stripped before matching, nesting-aware, reusing
  # check-roles-allowed-realm.py's stripper by import rather than a second copy of it.
  # History of the gap this closes: PR #1475 taught the old bash/awk matcher to skip a
  # FULL-LINE `//` comment, after a false positive on #1430 where prose noting that a
  # sibling call site still uses UUID.randomUUID() tripped the guard with zero code change.
  # An INLINE trailing comment and a KDoc were left matching (issue-1511), on the reasoning
  # that stripping a trailing `// ...` with a regex breaks on `//` inside a string literal.
  # That gap then cost a real change: on #4308 a KDoc in card-issuance quoted
  # openbank-audit-service's own id-minting call verbatim, as the evidence for why outbox
  # requeue cannot be automatic, and the gate read the explanation of the defect as this
  # file committing it. It was worked around by rewording the prose (b0e6c02ac) -- the wrong
  # direction, since the file was correct and the checker was not. A real stripper closes
  # all three shapes at once, so the guard is now Python and the gap is gone.
  # Residual, inherited with the shared stripper: it does not model string literals, so
  # `"...//..."` blanks the rest of that line and an unbalanced `"/*"` opens a block. Both
  # fail toward a false NEGATIVE, never toward flagging correct code.
  falsified: >-
    --self-test drives real base/HEAD commit pairs through the gate's own matcher: a bare call
    in src/main MUST be flagged, #4308's KDoc MUST NOT be, and a KDoc with a nested comment
    MUST NOT be. With no stripping 4 cases go red; with a NON-nesting stripper the nested-KDoc
    case alone goes red.
  incident: 2026-07-17

governance_manifest:
  generator: openbank-admin-ui/scripts/generate-governance.mjs
  schema_source: openbank-admin-ui/scripts/governance-schema.mjs   # Zod; the JSON Schema is DERIVED from it
  derived_artifact: openbank-libs/governance/governance.schema.json
  # Was ci.yml's conditional `ui-build` job until #4083. The gate's subject is every module
  # with a version.txt, but the job fires only for openbank-admin-ui/, */governance.yaml or
  # the governance schema — so a PR adding a service and omitting governance.yaml made the
  # job ABSENT, not skipped, and the aggregate check read green.
  wired_into: .github/gates/gates.yaml   # gate id `governance-manifest`, group `lint`, enforced
  gate_script: .github/scripts/check-governance-manifest.sh
  # THE RULE (ADR-0071 + ADR-0196, issue #2165): a per-service governance.yaml declares only
  # facts, and every fact the code can settle is cross-checked against the tree at generation
  # time. A curatorial field nobody verifies decays into fiction, and the decay is invisible
  # precisely because the gate stays green -- 51 modules named a `<x>_schema` that existed in
  # no migration and no config, and 8 named the wrong datastore outright, all while green.
  rule: >-
    Each released module (a directory with version.txt) has a governance.yaml valid against
    the Zod schema, and no declaration may contradict the code: ownsNoDatabase vs the presence
    of src/main/resources/db/migration/V*.sql; databaseName vs the Postgres URL in
    application.yaml or the module's GitOps manifest; primaryDatastore vs the wiring that
    exists; databaseLineage.ownedDatabases vs the module's own databaseName;
    databaseLineage.dependentDatabases vs the databases the fleet declares; and a
    non-placeholder retentionPolicy whenever the module stores anything.
  basis: declared_governance_is_verified_against_code_not_trusted
  notes:
    # `ownsNoDatabase`, not `stateless`: customer-edge owns no database yet keeps durable
    # passkey credentials in Redis. The two claims are not the same and only one is true.
    - a_module_that_owns_no_database_asserts_it_explicitly
    # Where the tree cannot settle a claim the manifest records databaseNameEvidence:
    # declared-only and counts it in totals.unverifiedDatabaseNames -- surfaced, not hidden.
    - unverifiable_claims_are_reported_never_presented_as_facts
    # Every rule has a fixture that makes it fire (src/test/generate-governance.test.ts).
    # This gate's every historical defect lived on its failure path.
    - each_rule_has_a_test_that_fails_without_it
  incident: 2026-07-25

# A function this repo describes as ENFORCING something must have a production caller. Nothing
# else notices when it does not: it compiles, it is a bean method, its port declares it, and its
# unit tests are green — about a function no request reaches. Coverage inverts the signal, since a
# well-tested unreachable guard scores HIGHER than a lightly-tested reachable one.
# Enforced by .github/scripts/check-enforcement-reachability.py (gate: enforcement-reachability).
enforcement_reachability:
  principle: >
    Reachability is a property of the call graph, not of the code's docstring. An entry declares
    what was MEASURED, and the gate fails in both directions — a `reachable` entry that loses its
    last caller, and an `unreachable` entry that quietly gains one — so a known gap can neither rot
    into permanent furniture nor be closed without the record being updated.
  declared:
    - symbol: isAuthorizedForAmount
      module: openbank-account-service
      status: unreachable
      issue: 3615
      declared_in:
        - openbank-account-service/src/main/kotlin/com/openbank/account/application/usecase/AuthorizationService.kt
        - openbank-account-service/src/main/kotlin/com/openbank/account/application/port/in/AccountPorts.kt
      why: >
        ADR-0232 D3's amount-aware guard and the only enforcer of perTransactionLimit in
        account-service. Measured 2026-08-03: every call site is in AuthorizationServiceDelegationTest.
        The endpoint that looks like its front door, GET /api/v1/accounts/{id}/authorizations/check,
        calls the amount-free isAuthorized instead, and no money-moving service reads a delegation
        grant at all — so there is no debit for a limit check to attach to yet. Flip to `reachable`
        when the delegated payment path lands (#3615), not before.

readiness_attestations:
  principle: >
    openbank-libs/governance/attestations.yaml is the ONLY hand-entered input to the
    production-readiness matrix — every other dimension the collector scores is derived from the
    repo. An entry there raises a money-path dimension from 2 to 3, and the runbooks, the OpenSSF
    gap doc and the threat models all read the resulting matrix as fact. No gate can prove the
    attested event happened; this one makes a fabrication require a deliberate lie — a real date,
    a resolvable reference, a service that exists — rather than a careless line (#2365).
  file: openbank-libs/governance/attestations.yaml
  consumer: openbank-admin-ui/scripts/collect-prod-readiness.mjs
  ci_producer: .github/scripts/check-readiness-attestations.py   # gate readiness-attestation-format
  service_key: >
    The SHORT name the collector looks up (`consent`, never `consent-service`) — it resolves the
    directory as openbank-<key>-service. A wrong key is invisible from both ends: the file reads
    as attested and the matrix reads as underscored, and neither points at the other. Measured
    2026-08-06: `consent-service:` had matched nothing since the day it was written; renaming the
    one key flips consent C7 from 2 to 3.
  required_fields: [date, ttl_days, by, ref]
  attestation_keys:                       # exactly the keys collect-prod-readiness.mjs consults;
    - code_complete                       # any other key parses fine and influences nothing
    - coverage_floor
    - contract_verified
    - restore_drill
    - dr_drill
    - pentest
    - slo_defined
    - oncall
  ref_must_resolve_to: >
    a URL, a #issue, an existing repo path, or runbook-NNNN matching docs/runbooks/NNNN-*.md.
    An entry whose ref resolves to nothing is treated as absent — a sentence is not evidence.
  exercise_attestation_keys: [restore_drill, dr_drill]
  exercise_ref_rule: >
    restore_drill and dr_drill assert that an EXERCISE happened on a date, so a runbook-NNNN
    ref is rejected for them (gate readiness-attestation-format, R7): a runbook is the plan,
    undated and byte-identical whether or not anyone ever ran it. Cite the drill record — an
    entry in docs/bcp/dr-test-log.md or docs/bcp/chaos-test-log.md dated the same day, a run
    URL, or a #issue — and a drill-log ref whose log carries no entry for that date is
    rejected too, because a log the attestation names but never received the record is the
    same silence as no evidence. Measured 2026-08-19 (#5673): the fleet's only drill
    attestation cited runbook-0003, which is the PostgreSQL 16->18 major-upgrade procedure,
    and it was raising a money-path readiness dimension from 2 to 3. ADR-0242, ADR-0253.
  enforcement: >
    AUTHORING defects FAIL the build (missing field, non-date, future date, unknown service,
    unknown attestation key, unresolvable ref): each is introduced and fixable by the PR that
    writes it. DECAY only WARNS, because the collector's TTL is already the real enforcement —
    an expired entry stops counting, so a lapse cannot buy a green cell, and failing the whole
    fleet the morning a pentest TTL rolls over is the alert-fatigue trade this repo has already
    paid for. Expired for more than 30 days IS an error: that is stale bookkeeping, not a lapse.
  never: >
    Do not write an entry ahead of the event to raise the count. A green cell bought with a
    fabricated line is worse than a red one, because the red one is true.

knowledge_capture:
  principle: >
    A corrected non-obvious mistake, a hard-won lesson, or a direction we keep must be
    committed to the repo where every agent and contributor reads it. Act on the
    authoritative origin/main state, never a local/session snapshot or private memory.
  routing:
    - kind: operational_footgun        # "learned the hard way"
      home: "CLAUDE.md (root, or <service>/CLAUDE.md when scoped)"
      form: "one-line bullet in the matching pitfall section — symptom + fix, imperative"
    - kind: hard_rule                  # checkable invariant
      home: "rules.yaml (authoritative)"
      enforce: "add a CI guard/test where feasible; summarize in CLAUDE.md"
    - kind: recurring_workflow
      home: ".claude/skills/"
      form: "a runnable skill that encodes the steps so they aren't re-derived each time"
  not_a_home:
    - "assistant session/local memory — does not travel to other agents or contributors, and may be stale"

# ADR-0223 D2 (phase 1, shadow): the role→action matrix as data. Seeded as the EXACT read
# half of today's operator-read-any (ROLE_OPERATOR/ROLE_ADMIN: every .list/.read) and
# compliance-read-any (ROLE_COMPLIANCE: every .read) — the action inventory is derived from
# the fleet-wide @Authorize coverage report (openbank-infra/scripts/authz-coverage-report.py),
# making this a provable subset of today's effective grants: rest.rego's matrix-allows reason
# grants nothing new, and decision_reason telemetry shows where the matrix already carries
# the call. Write grants (operator-<domain>-write etc.) join in phase 1.5 after the D2(b)
# triage; the retirement of operator-read-any itself is D2(c), a separate PR.
authz:
  role_action_matrix:
    ROLE_OPERATOR:
      grant:
        - account.list
        - account.read
        - anacredit.list
        - anacredit.read
        - audit.read
        - card.list
        - card.read
        - device.list
        - dispatch.read
        - fx.list
        - fx.read
        - interest.list
        - interest.read
        - ledger.list
        - ledger.read
        - lending.list
        - lending.read
        - notification.list
        - notification.read
        # ADR-0224 D3 (E2E #2750): the staff OBO channel's MCP read tools — the capabilities
        # McpToolRegistry maps list_accounts/get_balance/list_transactions/list_consents to.
        # Without these the human tools/list fails closed to empty (query.marketing.readonly and
        # the propose.payment write stay ungranted on purpose).
        - query.account.readonly
        - query.balance.readonly
        - query.consent.readonly
        - query.transaction.readonly
        - sanctions.list
        - sanctions.read
        - sdd.list
        - sdd.read
        - statement.list
        - statement.read
        - swift.list
        - swift.read
        - transaction.list
        - transaction.read
      # ── write grants (phase 1.5, operator-<domain>-write + opsmessage pair) ──
        - account.approval.decide
        - account.authorize
        - account.close
        - account.create
        - account.freeze
        - account.search
        - account.unfreeze
        - account.update
        - balance.approval.decide
        - balance.credit
        - balance.debit
        - balance.hold
        - balance.holdRelease
        - balance.initialize
        - balance.reconciliation.run
        - billing.approval.decide
        - billing.post
        - billing.reverse
        - clearingBatch.approval.decide
        - clearingBatch.reconcile
        - clearingBatch.settle
        - clearingBatch.submit
        - clearingBatch.triggerCycle
        - fraud.score
        - fx.convert
        - identity.case.decide
        - identity.case.reopen
        - identity.eudi.issue
        - identity.eudi.poll
        - identity.eudi.request
        - identity.eudi.revoke
        - identity.eudi.verify
        - identity.link
        - identity.register
        - identity.resolve
        - interest.create
        - interest.delete
        - interest.trigger
        - ledger.create
        - ledger.replay
        - ledger.reverse
        - ledger.trigger
        - kyb.case.list                    # ADR-0284: business onboarding review queue
        - kyb.case.read
        - kyb.case.reject
        - kyb.case.review.resolve
        - kyb.lookup
        - lending.approve
        - lending.collateralDecide
        - lending.collateralRegister
        - lending.create
        - lending.disburse
        - lending.repay
        - lending.reschedule
        - lending.writeoff
        - party.approval.decide
        - party.consent.update
        - party.mandate.grant              # ADR-0284 D3: bind a representative to a legal-entity party
        - party.mandate.read
        - party.mandate.revoke
        - party.merge
        - party.update
        - sanctions.approval.decide
        - sanctions.clear
        - sanctions.create
        - sanctions.trigger
        - sanctions.update
        - sctInstPayment.approval.decide
        - sctInstPayment.create
        - sepaPayment.approval.decide
        - sepaPayment.create
        - sepaPayment.handleReturn
        - sepaPayment.transitionStatus
        - settlement.create
        - swift.approval.decide
        - transaction.create
        - transaction.reverse
        - opsmessage.compose
        - opsmessage.approval.decide
    ROLE_ADMIN:
      # One-line diff benefit: ADMIN = OPERATOR's full matrix (single level of inheritance,
      # see rest.rego matrix_grants) — no duplicated grant list to drift apart.
      inherits: ROLE_OPERATOR
      grant: []
    ROLE_COMPLIANCE:
      grant:
        - account.read
        - anacredit.read
        - audit.read
        - card.read
        - dispatch.read
        - fx.read
        - interest.read
        - ledger.read
        - lending.read
        - notification.read
        - sanctions.read
        - sdd.read
        - statement.read
        - swift.read
        - transaction.read
    # ── ADR-0223 phase 1.5: write grants (derived from the same coverage inventory) ──────────
    # operator-<domain>-write ext rules grant OPERATOR+ADMIN; desk rules grant their own roles.
    # All entries remain a strict subset of today's effective grants (shadow matrix-allows is
    # additive, so this changes no decision — it only moves the decision_reason mix toward the
    # matrix, which is what the D2(b) operator-read-any retirement triage consumes).
    ROLE_PAYMENTS:
      grant:
        # Payment desks' ext rules list ROLE_PAYMENTS alongside OPERATOR/ADMIN
        # (domestic-payment, sepa-payment, sepa-instant, clearing — gen-*-opa-bundle.sh heredocs)
        - sctInstPayment.create
        - sepaPayment.create
        - sepaPayment.handleReturn
        - sepaPayment.transitionStatus
        - clearingBatch.submit
        - clearingBatch.reconcile
        - clearingBatch.settle
    ROLE_KYC_OPENER:
      grant:
        - kycCase.updateCheck
        - kycCase.pepRescreen
    ROLE_KYC_REVIEWER:
      grant:
        - kyc.case.approve
        - kyc.case.reject
        - kyb.case.list                    # ADR-0284: the KYB review queue is the KYC reviewer's queue
        - kyb.case.read
        - kyb.case.reject
        - kyb.case.review.resolve
    ROLE_AUDITOR:
      grant:
        - audit.read
        - audit.verify
    ROLE_SUPERVISOR:
      grant:
        - balance.overdraftLimit
    ROLE_LENDING_OFFICER:
      grant:
        - lending.create
        - lending.read
        - lending.list
        - lending.repay
        - lending.disburse
        - lending.collateralRegister
        - lending.approval.read
    ROLE_CREDIT_RISK:
      grant:
        - lending.create
        - lending.read
        - lending.list
        - lending.repay
        - lending.approve
        - lending.writeoff
        - lending.collateralRegister
        - lending.collateralDecide
        - lending.approval.read
        - lending.approval.decide

# PROMOTED TO A TOP-LEVEL KEY (2026-08-07). rest.rego reads this as
# `data.rules.shared_m2m_write_prohibition.reasons`, and gen-rules-opa-data.py selects only
# TOP-LEVEL keys of this file into the derived rules-opa-data.yaml that OPA actually mounts.
# Nested under `change_requirements:` it was never emitted, so `role_only_write_reason` was
# never true, `prohibited`'s `every` clause was false, and the guard had never once fired in
# the cluster. gen-rules-opa-data.py had been warning about exactly this on every run.
shared_m2m_write_prohibition:
  # GHSA-58jq-9hq3-66jr. rest.rego denies the shared M2M identity
  # (`service-account-openbank-services`, which carries ROLE_OPERATOR in the realm) when the
  # ONLY reasons admitting it are the role-only write reasons listed here.
  #
  # OPT-IN, and the reason a name pattern was rejected: matching every `operator-*-write`
  # would have 403'd transaction.create from six live callers (account-service's
  # welcome-bonus credit, sepa-instant, domestic-payment, swift, interest, sdd) and
  # settlement.create — both AUTHZ_ENFORCE=true money paths whose services have no
  # identity-scoped rule to fall back on. transaction-service's rego states the exposure
  # itself ("RESIDUAL RISK — shared identity, no per-caller narrowing"), which is precisely
  # why removing its only path is not the fix.
  #
  # A reason joins this list once its service carries a rule that NAMES the caller and
  # enumerates its actions, so denying the role-only path removes an over-grant rather than
  # the only path. Each entry below was verified to have such a rule.
  reasons:
    - operator-consent-write        # service-consent-m2m + service-consent-m2m-marketing
    - operator-ledger-write         # service-ledger-post / service-ledger-reverse
    - operator-balance-write        # service-balance-m2m
    - operator-fraud-write          # service-fraud-scoring
    # SAFE TODAY ONLY BY CO-ADMISSION, not by the rule named here: that rule covers
    # sepaPayment.handleReturn alone, but ROLE_OPERATOR also grants sepaPayment.create /
    # .transitionStatus / .approval.decide, so `matrix-allows` co-admits and this reason
    # never becomes the only one. standing-order POSTs sepaPayment.create via the shared
    # client. When ADR-0223 D2(b) retires those matrix grants, this entry starts denying it.
    - operator-sepa-payment-write   # service-sepa-payment-shared-client-m2m (see note above)
    # Restored once #3748 landed: service-sca-shared-client-m2m now admits the shared client
    # for scaChallenge.read AND scaChallenge.consume, so document-service's consume call
    # (ScaChallengeClient, oidc-client.client-id openbank-services) keeps an identity-scoped
    # reason and this entry no longer 403s the document-signing gate. device.list is covered
    # by matrix-allows. Still uncovered for the shared client: decide/initiate/verify and
    # device.enroll — no in-repo caller invokes them on that principal.
    - operator-sca-write            # service-sca-edge-m2m + service-sca-shared-client-m2m
  # NOT listed, and why. Each needs an identity-scoped rule for its real callers FIRST;
  # adding it here before that is a money-path outage, not a test failure.
  deferred:
    operator-transaction-write: "6 verified callers of transaction.create via the shared client; no identity-scoped rule exists"
    operator-settlement-write: "settlement.create is resourceless with no alternative rule"
    operator-swift-write: "no identity-scoped rule; callers unverified"
    operator-sepa-instant-write: "no identity-scoped rule; callers unverified"
    operator-billing-write: "no identity-scoped rule; callers unverified"
    operator-interest-write: "no identity-scoped rule; callers unverified"
    operator-lending-write: "no identity-scoped rule; callers unverified"
    operator-sanctions-write: "no identity-scoped rule; m2m-sanctions-screening covers create only"
    operator-identity-write: "no identity-scoped rule; callers unverified"
    operator-card-write: "no identity-scoped rule; callers unverified"
    # These DO carry an identity-pinned rule, but "a rule exists" is not "the rule covers the
    # actions the role-only path was serving". Listing them on that basis would repeat, one
    # level down, the guess that made the first revision break transaction.create. Each needs
    # its identity-scoped rule read against its real callers before it moves up.
    operator-fx-write: "2 identity-pinned rules; action coverage vs real callers unverified"
    operator-account-write: "2 identity-pinned rules; action coverage unverified"
    operator-clearing-write: "1 identity-pinned rule; action coverage unverified"
    operator-domestic-payment-write: "1 identity-pinned rule; action coverage unverified"
    operator-party-write: "1 identity-pinned rule, but onboarding-service PUTs party.kyc-status via the shared client (latent: AUTHZ_ENFORCE=false there today)"
  adr: ADR-0034

# Every WRITE action that `authz.role_action_matrix` (above) grants to a role an M2M
# service-account holds — and therefore, via rest.rego's `matrix-allows`, to every caller
# presenting that service-account's token rather than to a named human (#3765, #3734).
#
# This register is NOT an exemption list and does not make any entry below safe. It exists
# because the grant is otherwise invisible: a write action added to the ROLE_OPERATOR grant
# list reads as staff authorization, and the policy layer cannot object — `matrix-allows` is
# a base-layer reason, so `shared_m2m_write_prohibition.reasons` (which is keyed by reason
# name) can never list it without vetoing every legitimate matrix-granted call, and no
# per-service `*_rest_ext.rego` can veto a rule that lives in base rest.rego. Listing the
# action here is the only place the decision becomes an explicit, reviewable act.
#
# The set below was MEASURED, not assembled: derived from the matrix by
# .github/scripts/check-matrix-write-grants.py, and cross-checked action-by-action against
# the live bundle ConfigMaps with `opa eval` (see the tables on #3765). Adding an entry is
# a security decision on a money path; removing an action from the matrix requires removing
# it here too, and the gate fails on a stale entry in either direction.
#
# The gate derives its role scope from every Keycloak realm JSON in the tree, so it does not
# need to be told which roles matter. Worth knowing while reading this: the three realms do
# NOT agree today — the deployed gitops template gives `service-account-openbank-services`
# only ROLE_API, while the docker and CI realms also give it ROLE_OPERATOR, and
# `service-account-openbank-edge` carries ROLE_OPERATOR in the deployed template. The union
# is used, because a role assignment that exists in any environment is an exposure there.
shared_m2m_matrix_write_grants:
  gate: matrix-write-grants
  enforced: enforced
  ci_producer: ".github/scripts/check-matrix-write-grants.py"
  adr: ADR-0223
  declared:
    - account.approval.decide
    - account.authorize
    - account.close
    - account.create
    - account.freeze
    - account.search
    - account.unfreeze
    - account.update
    - balance.approval.decide
    - balance.credit
    - balance.debit
    - balance.hold
    - balance.holdRelease
    - balance.initialize
    - balance.reconciliation.run
    - billing.approval.decide
    - billing.post
    - billing.reverse
    - clearingBatch.approval.decide
    - clearingBatch.reconcile
    - clearingBatch.settle
    - clearingBatch.submit
    - clearingBatch.triggerCycle
    - fraud.score
    - fx.convert
    - identity.case.decide
    - identity.case.reopen
    - identity.eudi.issue
    - identity.eudi.poll
    - identity.eudi.request
    - identity.eudi.revoke
    - identity.eudi.verify
    - identity.link
    - identity.register
    - identity.resolve
    - interest.create
    - interest.delete
    - interest.trigger
    - kyb.case.reject
    - kyb.case.review.resolve
    - kyb.lookup
    - ledger.create
    - ledger.replay
    - ledger.reverse
    - ledger.trigger
    - lending.approve
    - lending.collateralDecide
    - lending.collateralRegister
    - lending.create
    - lending.disburse
    - lending.repay
    - lending.reschedule
    - lending.writeoff
    - opsmessage.approval.decide
    - opsmessage.compose
    - party.approval.decide
    - party.consent.update
    - party.mandate.grant
    - party.mandate.revoke
    - party.merge
    - party.update
    - sanctions.approval.decide
    - sanctions.clear
    - sanctions.create
    - sanctions.trigger
    - sanctions.update
    - sctInstPayment.approval.decide
    - sctInstPayment.create
    - sepaPayment.approval.decide
    - sepaPayment.create
    - sepaPayment.handleReturn
    - sepaPayment.transitionStatus
    - settlement.create
    - swift.approval.decide
    - transaction.create
    - transaction.reverse

# Docker-dev and CI Keycloak realm JSONs vs the deployed gitops template (issue #2540
# gate-scope follow-up). check-roles-allowed-realm.py, check-realm-role-parity.py,
# check-realm-user-role-parity.py and check-realm-template-importable.py all glob only
# `openbank-infra/gitops/components/keycloak/*realm-template*.json`. Two other tracked realm
# JSONs — openbank-infra/docker/keycloak/realm/openbank-realm.json (local dev) and
# .github/workflows/keycloak/openbank-realm.json (CI/api-fuzz) — grant roles to the shared
# M2M service account (`service-account-openbank-services`) and neither was read by any check.
# Measured 2026-08-16: both grant it ROLE_OPERATOR beyond the template's ROLE_API, and the CI
# realm additionally grants ROLE_COMPLIANCE (15 role_action_matrix actions, see above) — a
# third, unreviewed answer to "what does the shared client hold".
realm_devci_artifact_parity:
  detect: [
    "openbank-infra/gitops/components/keycloak/*realm-template*.json",
    "openbank-infra/docker/keycloak/realm/openbank-realm.json",
    ".github/workflows/keycloak/openbank-realm.json",
  ]
  require:
    - "every realm role the docker-dev or CI realm JSON declares also exists in the deployed gitops template"
    - "every realm role the docker-dev or CI realm JSON grants a service-account-* principal is also granted to that principal in the deployed gitops template"
  gate: realm-devci-artifact-parity
  # ADVISORY, and deliberately not on a graduation path to enforce: whether the docker/CI
  # realms should track the template, and the #3246 owner-gated Vault reconcile that would
  # make the template authoritative in practice, are both open policy calls (issue #2540)
  # this gate does not make. The date below is the review point for the DETECTOR (is the
  # comparison still accurate, has either open question resolved), not a promise to flip
  # --enforce — same shape as pr_file_overlap below.
  enforced: advisory
  target_enforce_date: "2027-02-16"   # ADR-0144 — review the detector, not a flip to enforce
  ci_producer: ".github/scripts/check-realm-devci-artifact-parity.py"

# ---------------------------------------------------------------------------------------
pr_file_overlap:
  # Every check in this repo is scoped to ONE pull request, computed against ONE base. So
  # two PRs editing the same file are invisible to CI, and the failures that produces are
  # exactly the ones git calls CLEAN: a duplicate guard merged twice (#2984 vs #3009, the
  # second fully green), a list whose two neighbouring entries merge to one
  # (.release-please-manifest.json, 56 -> 55), or two spec PRs claiming the same
  # openapi info.version because each was classified against its own creation-time base
  # (#481 x #524, and again from an ALREADY-MERGED PR in #3055).
  #
  # The habit that catches these — "what else touched this file today" — was manual. This
  # makes it automatic: one REST call per open PR, no model, no clone.
  detect: ["any pull_request: this PR's changed files vs every other OPEN PR's"]
  require:
    - "an overlap is reported with the competing PR number, not silently merged past"
    - "an overlap on a shared registry (gates.yaml, rules.yaml, the release manifests, gitops) needs an explicit merge ORDER; whoever lands second re-reads the file on origin/main and confirms their entry survived"
    - "an overlap on an openapi.yaml means info.version is re-read from LIVE origin/main, never from the PR's base"
  gate: pr-file-overlap
  # ADVISORY, and deliberately not on a graduation path to enforce. Enforcing would red BOTH
  # PRs the moment two of them touched rules.yaml, and neither author could clear it without
  # the other merging first — the queue-deadlock shape this repo has already paid for. The
  # date below is the review point for the CLASSIFIER (are the reports still true and
  # actionable), not a promise to flip --enforce.
  enforced: advisory
  target_enforce_date: "2026-11-01"   # ADR-0144 — review the classifier, not a flip to enforce
  # CI producer is LIVE (advisory): .github/scripts/check-pr-file-overlap.py runs in the
  # `gates (lint)` shard on every pull_request. It compares the BLOB SHA of each overlapping
  # file at both PR heads, so an overlap where the content already agrees is reported as
  # such rather than as a divergence — the file list itself comes from the merge-base, so a
  # competing PR that already merged still appears in it (#3103's security.yml matched main
  # byte for byte). Exit 2 means the open-PR enumeration FAILED and is not a clean verdict.
  ci_producer: ".github/scripts/check-pr-file-overlap.py"
  # Paths whose overlap is an ordering problem rather than a coincidence. This is a list of
  # external FACTS (which files are shared registries), not the gate's scope — the gate reads
  # every overlapping file either way, so a path missing here is still reported, only without
  # the louder header. Kept in sync with SERIALIZED in the script.
  serialized_paths:
    - ".github/gates/gates.yaml"
    - "openbank-libs/governance/rules.yaml"
    - "openbank-libs/governance/agents.yaml"
    - ".release-please-manifest.json"
    - "release-please-config.json"
    - ".github/workflows/ci.yml"
    - ".github/workflows/auto-deploy.yml"
    - "openbank-infra/gitops/"

# ---------------------------------------------------------------------------
# AGENT CASE COLLABORATION (ADR-0271 proposal; no live grants)
#
# This matrix is an independent authorization boundary, intersected with each
# principal's agents.yaml case_capabilities by the case-coordinator-only OPA bundle.
# Empty is intentional: the policy and PEP may be reviewed without silently creating
# a production grant. Every entry requires a separate authorization review.
agent_case_capability_matrix: []

# ---------------------------------------------------------------------------
# AUTONOMOUS AGENT PULL REQUESTS (gate: agent-pr-guard, enforced)
#
# The repo runs scheduled, unattended agents that open PRs around the clock. Until now the
# only thing keeping unattended work off the money path was a PreToolUse hook on the
# maintainer's laptop — which does not exist in a cloud session or on a runner, and which a
# command-string matcher cannot see through anyway. `main`'s ruleset does not supply the
# control either: required_approving_review_count is 0 and the admin bypass actor is the
# same identity an agent authenticates as.
#
# So the rule lives here and is enforced as a required check. A red required check cannot be
# cleared by the agent that tripped it and cannot be cleared by `--auto`.
#
# The PROTECTED SERVICE SET IS DERIVED from money_path_services above (prefix/suffix
# stripped), so onboarding a money-path service extends the guard with no edit here.
# `extra_protected_tokens` is a hand-kept list of external FACTS — services that are high
# blast radius without being money-path by that list's definition. The gate's SCOPE is not
# hand-kept: an undeclared machine account fails the check rather than passing it.
autonomous_agent_prs:
  detect:
    - 'any pull_request whose author is a declared agent account, or whose head branch carries a declared agent prefix'
  require:
    - an agent-authored PR that touches a protected path fails the check and waits for a human
    - a machine account in neither agent_accounts nor automation_accounts fails the check — it must be classified first
    - an unreadable author, branch or file list is exit 2 (undetermined), never a pass
  gate: agent-pr-guard
  enforced: block
  ci_producer: .github/scripts/check-agent-pr-guard.py
  # Autonomous coding agents. Adding a login here is a governance-path change, which this
  # very guard blocks an agent from making.
  agent_accounts:
    - openbank-agent-bot[bot]
  # Deterministic automation. These legitimately touch money-path paths and their content is
  # generated rather than authored; blocking them deadlocks the release queue for no safety.
  automation_accounts:
    - release-please[bot]
    - openbank-gitops-bot[bot]
    - dependabot[bot]
    - github-actions[bot]
  # Coverage for an agent running under a HUMAN account, which is the state today — every
  # open PR in this repo is authored by the maintainer's login. Without this an identity-only
  # scope would cover nothing at all.
  agent_branch_prefixes:
    - agent/
  # High blast radius, not money-path by the list above.
  extra_protected_tokens:
    - payment
    - kyc
    - party
    - card-issuance
    - aml
    - tax
    - dispute
  # Governance sources and gate machinery: a gate can be defanged by editing its script
  # without touching any YAML, so the scripts directory is in scope alongside the manifests.
  governance_path_globs:
    - openbank-libs/governance/*
    - .github/gates/*
    - .github/scripts/*
    # An agent's PROMPT is its program. `.github/agent-prompts/` holds the instructions the
    # scheduled issue worker and PR steward actually execute — "never merge", "never close an
    # issue", "run the guard's self-test before picking". An agent able to edit these could
    # delete its own restraints in a diff that looks like a docs tweak.
    #
    # This was MISSING and asserted to be present: #6453 and runbook 0015 both claimed the
    # prompts were protected "so the worker cannot edit its own mandate". Nobody had run the
    # guard against those paths, and it tripped no clause at all (measured 2026-08-22 on #6512,
    # a PR touching only this directory, which the guard waved through).
    - .github/agent-prompts/*
