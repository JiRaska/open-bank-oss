#
# OpenBank governance rules — the single, machine-readable source of truth.
#
# This file is consumed by BOTH the CI gates and the CLAUDE.md agent guidance, so a
# convention is written ONCE here and never duplicated as prose. CONTRIBUTING.md and the
# PR template are the human narrative; THIS file is authoritative for automation.
#
# Governing principle (ADR-0029): derive from code -> enforce in CI -> sign the evidence
# -> surface in UI. Nothing computable is typed twice; nothing shipped is unprovenanced.
#
# Status of enforcement: see `enforced` flag per rule. Gates flip to enforced only after
# the producing layer (ADR-0029 D7) exists, so a rule can be `advisory` before it `block`s.

schema_version: 1
source_of_truth: true
related_adrs: [ADR-0005, ADR-0014, ADR-0020, ADR-0029, ADR-0030, ADR-0031, ADR-0040, ADR-0043, ADR-0052, ADR-0053, ADR-0054, ADR-0060, ADR-0082, ADR-0088]

# ---------------------------------------------------------------------------------------
# Conventional Commits — the vocabulary (mirrors CONTRIBUTING.md, authoritative here).
# ---------------------------------------------------------------------------------------
commits:
  format: "<type>(<scope>): <imperative summary>"
  # scope = service name without the `openbank-` prefix (e.g. ledger, psd2, sepa-payment),
  # or `libs`, `infra`, `admin-ui`, `docs`, `ci`. The scope SELECTS the released component.
  scope_required: true
  types:
    feat:     { semver_bump: minor, changelog: true,  description: "new functionality" }
    fix:      { semver_bump: patch, changelog: true,  description: "bug fix" }
    perf:     { semver_bump: patch, changelog: true,  description: "performance, no behavior change" }
    refactor: { semver_bump: patch, changelog: false, description: "internal restructure, no behavior change" }
    docs:     { semver_bump: none,  changelog: false, description: "documentation only" }
    test:     { semver_bump: none,  changelog: false, description: "tests only" }
    chore:    { semver_bump: none,  changelog: false, description: "build / tooling" }
    build:    { semver_bump: none,  changelog: false, description: "build system / dependencies" }
    ci:       { semver_bump: none,  changelog: false, description: "CI configuration" }
    security: { semver_bump: patch, changelog: true,  description: "security fix (often private until disclosed)" }
  # A footer `BREAKING CHANGE:` (or `!` after type/scope) forces a MAJOR bump regardless of type.
  breaking_change_marker: "!"
  breaking_change_footer: "BREAKING CHANGE:"

# ---------------------------------------------------------------------------------------
# Branch naming (CONTRIBUTING.md). <scope> = service name without `openbank-`.
# ---------------------------------------------------------------------------------------
branches:
  pattern: "^(feat|fix|chore|docs|refactor|test|security|ci|perf)/[a-z0-9-]+$"
  no_direct_commits_to: [main]
  no_direct_commits_enforced: true  # branch protection live (issue #282, github-governance.tf)

# ---------------------------------------------------------------------------------------
# SemVer per service (ADR-0029 D2). Independent per-service versioning.
# ---------------------------------------------------------------------------------------
versioning:
  scheme: semver
  strategy: per_service                 # each openbank-*-service is its own release unit
  source_file: version.txt              # per-service file; build reads it into quarkus.application.version
  # openbank-admin-ui is a release unit too (a Next.js control-plane app, scope `admin-ui`).
  # It has no quarkus.application.version; its runtime-readable analog is package.json:version,
  # which MUST equal version.txt (the build-push script fails fast on drift). The build stamps
  # version.txt into BUILD_VERSION -> /api/build-info -> the version chip in the UI (ADR-0029
  # "derive from code / show in UI").
  # Two independent version axes (ADR-0048): the deployable-artifact release version and the
  # public REST-contract version. They move on different cadences and must NOT be conflated
  # (the former amended ADR-0029 D2's "collapse three into one").
  release_invariant:
    # The deployable artifact's release SemVer. These MUST be equal for a released service.
    # quarkus.application.version is DERIVED from version.txt at build time (the
    # openbank.quarkus-service convention plugin sets the Gradle project version from
    # version.txt; the Quarkus plugin stamps it in). It must NOT be set explicitly in a
    # service application.yaml — an explicit value shadows the derived one and desyncs on
    # every release-please bump. Enforced: .github/scripts/check-app-version-override.sh.
    - "version.txt"
    - "quarkus.application.version"   # build-derived from version.txt; never set in application.yaml
    - "git release tag"
    - "container image tag"
  api_invariant:
    # The public REST contract major. The OpenAPI document major, the runtime config and the
    # URL /api/v{N} segment MUST agree. (openapi.yaml:info.version is NO LONGER on the release axis.)
    - "major(openapi.yaml:info.version)"
    - "openbank.api.version"
    - "URL /api/v{N} segment"
  released_unit_marker: version.txt     # a module is a released component IFF it has a version.txt
  release_tool: release-please
  release_mode: components              # monorepo, per-component releases
  # Layer B wiring — release-please owns the RELEASE axis only (version.txt, CHANGELOG, git tag).
  # It does NOT touch openapi.yaml:info.version — that is the api_invariant axis (ADR-0048 / oasdiff).
  release_config: release-please-config.json        # root; packages == the version.txt modules
  release_manifest: .release-please-manifest.json   # root; current release version per component
  release_workflow: .github/workflows/release-please.yml
  release_doc: openbank-libs/governance/RELEASE.md  # human-readable rule
  enforced: active                      # Layer B is WIRED (was: planned)

# ---------------------------------------------------------------------------------------
# "Change X => require Y" — the rules that stop forgotten artifacts (ADR-0029 D1/D4).
# Each maps a kind of change to the artifacts a PR MUST also contain.
# ---------------------------------------------------------------------------------------
change_requirements:
  api_change:
    detect: ["@Path", "@GET|@POST|@PUT|@DELETE|@PATCH", "request/response DTO under */rest/* or */api/*"]
    require:
      - "openapi.yaml updated"
      # API-contract bump classified from the OpenAPI diff (ADR-0048 D5), NOT from commit type:
      #   breaking  => new URL major (/api/v{N+1}) + deprecate predecessor
      #   additive  => info.version MINOR within the same /v{N}
      #   editorial => info.version PATCH
      - "api contract bump per OpenAPI diff"
      - "api_invariant holds: major(openapi.yaml:info.version) == openbank.api.version == URL /api/v{N}"
      - "consumer-driven contract test updated (Pact)"   # ADR-0029 D3
      # Pact provider verification: ONE @Provider test per provider. Separate HTTP and message
      # test classes that share @Provider + @PactBroker (no interaction-type filter) BOTH pull every
      # pact the broker holds for that provider — the HTTP class then tries to verify the message pact
      # via HttpTestTarget and fails the state-change callback (UnsupportedOperationException). Use one
      # class that picks the target per interaction (context.interaction.isAsynchronousMessage() ?
      # MessageTestTarget(listOf("<pkg>")) : HttpTestTarget(...)). Package-scope MessageTestTarget
      # (classpath-wide ClassGraph scan throws on JDK 25). Latent: ktlint runs before tests.
      - "single @Provider verification test per provider; per-interaction target for mixed HTTP+message"
    contract_diff_tool: oasdiff
    gate: api-contract
    enforced: enforce                   # ADR-0144 graduation, ahead of the 2026-08-15 target
    # .github/scripts/check-api-contract.py runs with --enforce in the "Validate manifests"
    # job on every PR (oasdiff 1.22.0, pinned + checksum-verified): classification and
    # api_invariant findings are ::error and fail the build.
    #
    # Why it graduated early: while advisory, the rule was being ignored — 11 of the 12 most
    # recent spec-changing commits added or altered endpoints without moving info.version at
    # all (e.g. #1161 added PATCH /api/v1/parties/{id}/consent and left 1.6.0 -> 1.6.0). An
    # advisory gate that everyone walks past is worse than none: it reports the rule is held
    # when it is not.
    #
    # The gate is DIFF-SCOPED, so that history is not retroactively a failure — only a PR's
    # own spec change is classified. The cost of enforcement is therefore one line per
    # spec-touching PR (bump info.version to match what the diff did), which the error
    # message spells out.
    ci_producer: ".github/scripts/check-api-contract.py"
    # A fourth class, `correction`, sits between breaking and additive: a breaking DOCUMENT diff
    # in a PR that changes NOTHING ELSE in the service. It requires MINOR, not MAJOR.
    #
    # Why it had to exist. `breaking` and the D2 invariant are jointly unsatisfiable for a spec
    # that never described the running service. Measured on aml-service (#2312/#2313) with the
    # pinned oasdiff: red at 1.0.0 because a MAJOR is demanded, red at 2.0.0 because D2 rejects a
    # major the served URL has not moved to. There is no third value. Worse, the only document
    # that went green was one that kept a phantom `status` enum value and a `default` the server
    # does not use — the gate was not merely blocking the correction, it was requiring the
    # falsehood, and aml shipped four GATE-CONSTRAINED concessions because of it.
    #
    # Why it is safe. A spec-only PR leaves the running server byte-identical, so no client that
    # works today can stop working; what "breaks" is a client generated from a document that
    # never described this server, and that client was already broken. Touch any other file in
    # the service — Kotlin, application.yaml, a test — and the normal breaking rule applies
    # unchanged. Only CHANGELOG.md and version.txt are exempt, because release-please writes them
    # and neither can change what is served.
    #
    # Why it is not an escape hatch. The discriminator is the diff, not a declaration: there is no
    # marker file and no PR-body token asserting that a spec "was never served". ~22 specs are
    # correction candidates (#2314), so anything a human asserts once would become the default
    # path 22 times over.
    #
    # It opens no new hole: landing a breaking change as code in one PR and the spec in another
    # already escapes this gate, which is scoped to spec diffs. What it does NOT check is whether
    # the corrected document is TRUE — openapi_route_conformance (below) covers the route set,
    # and nothing yet covers schemas.
    #
    # Unit tests: openbank-infra/scripts/check_api_contract_test.py, run by the
    # "governance-script unit tests" CI step. The negative cases are the point — a
    # reclassification that fires too eagerly disables the gate for real breaking changes.
  openapi_route_conformance:
    detect: ["openbank-*/src/main/resources/openapi.yaml", "JAX-RS @Path / @GET / @POST resource classes"]
    require:
      - "every route a resource class answers is published in that service's openapi.yaml"
      - "every route openapi.yaml promises is declared by a resource class"
    gate: openapi-route-conformance
    enforced: enforce                 # ADR-0144 graduation, ahead of the 2026-09-30 target (#2314)
    ci_producer: ".github/scripts/check-openapi-route-conformance.py"
    baseline: ".github/openapi-route-conformance-baseline.txt"
    # api_contract (above) classifies a spec's version bump against the PREVIOUS REVISION of the
    # same document. Nothing asked whether the document is TRUE. ADR-0005 says "CI lints it with
    # Spectral so docs cannot drift from runtime" — there is no Spectral config in this repo and
    # no workflow references it, so that control has never existed. The #2280 failure class:
    # check whether anything reads the artifact before assuming a green covers it.
    #
    # What the drift actually was, measured on the day this landed: 114 route-level findings
    # across 44 services. aml-service published request/response schemas whose fields exist
    # nowhere in the code (#2312, fixed in #2317); copilot-service served the human-in-the-loop
    # confirm for a money-path action proposal without publishing it (#2323) and declared a 501
    # its streaming endpoint cannot return (#2351, fixed in #2353). Worst single pattern: 10 of
    # the 15 services with an ApprovalResource serve PATCH /api/v1/<svc>/approvals/{id} — the
    # four-eyes control — without publishing it, most of them money-path.
    #
    # ROUTE SET ONLY. It does not read schemas, so an invented request field passes clean (that
    # was the whole aml defect); it does not read status codes, so a documented response the
    # handler cannot produce passes clean. A reflection test is the floor, not the ceiling — the
    # schema half needs the Quarkus-generated document
    # (quarkus.smallrye-openapi.store-schema-directory, a dependency the whole fleet already has
    # and nothing uses). Do not let a green here be read as "this spec is true".
    #
    # NOT diff-scoped, like db_backup_association and unlike api_contract/db_change: the defect
    # is a MISSING pair across two trees, so a PR touching only Kotlin never touches the spec and
    # a diff-scoped gate would see nothing.
    #
    # ENFORCED AGAINST A DECLARED BASELINE (#2314). 104 pre-existing findings could not be a
    # merge blocker on day one, and correcting a spec is blocked on the unsatisfiable-bump gap
    # (#2313) — but leaving it advisory is the shape this repo has already ruled against: an
    # advisory check over a GENERATED comparison has no judgement left to exercise, it just makes
    # the drift mergeable (#2216). So the gate runs with --enforce against
    # .github/openapi-route-conformance-baseline.txt, which declares those 104 findings verbatim.
    # A finding NOT in that file fails the build (new drift, the thing the gate is for); a
    # baseline line with no matching finding ALSO fails (the debt was paid — delete the line), so
    # the declaration cannot outlive the debt. The baseline does not narrow what the gate LOOKS
    # AT — every service is compared every run — which is what separates it from the
    # pact-drift-check scope bug (#2284). #2314 closes when the file is empty.
  openapi_request_schema_conformance:
    detect: ["openbank-*/src/main/resources/openapi.yaml", "the JAX-RS request-body DTO the resource actually deserializes into"]
    require:
      - "every property a request-body schema declares exists on the DTO the resource parses"
      - "every property the DTO has is declared on the request-body schema"
    gate: openapi-request-schema-conformance
    enforced: advisory
    target_enforce_date: "2026-09-30"
    ci_producer: ".github/scripts/check-openapi-request-schema-conformance.py"
    # openapi_route_conformance (above) is ROUTE SET ONLY — it does not read schemas, so aml's
    # invented request/response fields passed it clean (#2312). This is the request half of that
    # gap, using the document Quarkus itself generates
    # (quarkus.smallrye-openapi.store-schema-directory) as ground truth instead of guessing.
    # `:build` already runs `quarkusBuild` in its task graph (confirmed via --dry-run), so wiring
    # this into `_service-ci.yml`'s existing build step costs no extra build time.
    #
    # NOT the response half, and that is a decision, not a gap left for later. 457 handler methods
    # fleet-wide return a raw jakarta.ws.rs.core.Response, which erases the body type at the JVM
    # level — the scanner that produces the generated document has no static type to build a
    # response schema from and emits an EMPTY schema for those. Measured directly on aml-service:
    # AmlCaseResponse does not appear anywhere in the generated document, even though it is real
    # and correct. A generic response-schema gate over this fleet cannot distinguish "no schema
    # published" from "the scanner could not see the type" — it would report the majority of
    # correct endpoints as findings. The response half needs a per-endpoint contract test that
    # asserts the DTO shape directly, the pattern `CopilotApiContractTest` and the fx/aml
    # provider-verified pacts already use, not a generic diff.
    #
    # `required` is also deliberately not compared: SmallRye OpenAPI's scanner has no
    # jackson-module-kotlin integration, so it does not read Kotlin nullability and marks nearly
    # every constructor parameter required regardless of `?`. Measured on aml: `accountId: UUID?`
    # comes back required. Comparing required-ness would be near-100% noise. Property NAME
    # presence, by contrast, is unaffected by this and reliable in both directions.
    #
    # Found on the day this landed, not hypothetically: openbank-balance-service's
    # `PlaceHoldRequest` publishes a phantom `expiresAt` and omits the real, USED
    # `referenceId`/`ttlSeconds` — confirmed against `BalanceResource.placeHold`, which reads
    # `body.referenceId` and `body.ttlSeconds` directly. A caller following the published spec
    # cannot construct a valid request.
  db_backup_association:
    detect: ["openbank-infra/gitops/**/*.yaml (kind: Cluster, postgresql.cnpg.io)"]
    require:
      - "a CNPG cluster declaring barmanObjectStore -> the managed bucket has a matching
         aws_eks_pod_identity_association in db-backups.tf"
    gate: db-backup-associations
    enforced: enforce
    enforced_since: "2026-08-16"        # ADR-0144 — producer has run enforced in CI
    ci_producer: "openbank-infra/scripts/check-db-backup-associations.py"
    # Backup credentials arrive via EKS Pod Identity, granted per (namespace, serviceAccount) by
    # a HAND-MAINTAINED map in db-backups.tf. Nothing linked that map to the gitops manifests, so
    # a new database could declare a backup, copy `inheritFromIAMRole: true` from a sibling,
    # report Ready + Healthy — and silently never back up. There is no failure until someone
    # needs a restore. Three clusters were in that state (#1444); sdd-db failed every WAL archive
    # for three days.
    #
    # NOT diff-scoped, unlike db_change/api_contract: the defect is a MISSING pair across two
    # trees, so a PR adding only the gitops half never touches the .tf side and a diff-scoped
    # gate would see nothing. It runs against whole repo state instead.
    #
    # Deliberately NOT solved by a discovered for_each in Terraform — both routes are blocked:
    # data.kubernetes_resources returns `objects` as a dynamic type (unknown at plan, so it
    # cannot key a for_each; a tofu plan of that design read "0 to add, 35 to destroy"), and
    # yamldecode cannot parse the 30-of-42 multi-doc manifests. Same lesson as the OPA generator
    # gate (#1184): the list must be checked mechanically, not remembered.
  cnpg_backup_declared:
    applies_to: "every CNPG Cluster manifest under openbank-infra/gitops"
    requires:
      - "spec.backup.barmanObjectStore.destinationPath is set, OR the cluster carries
         openbank.io/backup-exempt-reason with a non-empty reason"
    gate: cnpg-backup-declared-gate
    # GRADUATED EARLY, 13 days before its 2026-09-15 date, because the same PR made the gate
    # able to fail at all. It carried `mode: enforced` from the day it was added (#4993) while
    # invoking its checker without --enforce, so a finding exited 0 and the gate was green by
    # construction. Leaving this record on `advisory` after fixing that would have reproduced,
    # in the very PR that reports it, the drift the sibling entry below documents.
    #
    # The graduation condition is met and was measured, not assumed: 0 findings across all 61
    # CNPG Cluster manifests on 2026-09-02, and the gate is falsifiable — stripping the
    # `backup:` block from a real cluster manifest takes it red.
    enforced: enforced
    ci_producer: "openbank-infra/scripts/check-cnpg-backup-declared.py"
    # The sibling of db_backup_association, for the case that rule CANNOT see. Its producer
    # scans for clusters that DECLARE a barmanObjectStore and skips the rest (`if not dest:
    # continue`), so a database that never asked to be backed up is not a mismatched pair and
    # is passed over. The rule that exists to make an unrecoverable database visible is
    # therefore blind to the most unrecoverable kind.
    #
    # Measured against the sandbox 2026-08-16, two independent probes agreeing: 59 live CNPG
    # clusters, 57 with a recovery point, 0 declared-but-unrecoverable, 2 with no backup
    # declared at all -- while db_backup_association reported clean across all of it.
    #
    # The exemption is an ANNOTATION ON THE CLUSTER, not an entry in a list kept beside the
    # manifests: a separate list is free to drift from what it describes with nothing to
    # notice, and an annotation cannot outlive the cluster it excuses.
    #
    # Advisory until 2026-09-15 for one specific reason, not caution: exactly one cluster is
    # in scope and unresolved -- engagement-db -- and whether it should be backed up or is
    # genuinely disposable is an owner's decision, not something a contributor should settle
    # to unblock a gate. Enforcing before that answer would fail every PR on an open question.
    # glitchtip-pg is live and also unbacked, but is deployed by a third-party chart and is
    # outside the gitops tree, so no gitops-scoped rule can reach it; that gap needs a runtime
    # control and is not silently counted as covered here.
  db_change:
    detect: ["src/main/resources/db/migration/*.sql", "Flyway/Liquibase changeset"]
    require:
      - "new Flyway migration (forward)"
      - "rollback note in PR"
    gate: db-migration
    enforced: enforce
    enforced_since: "2026-08-16"        # ADR-0144 — rollback/forward-only guard graduated
    # The rollback note lives IN the migration, as a `-- Rollback:` comment — single-line or
    # spanning the following comment lines. blocked_on used to call for a PR-BODY-parsing check,
    # but the established practice is in-file (96 of 214 migrations when the gate was written,
    # and every recent one), the file IS part of the PR, and an in-file note is strictly better:
    # it sits next to the migration forever, where whoever rolls it back is already looking.
    # The gate also covers the "forward" half of the requirement above — editing an
    # already-committed migration is a finding, since Flyway checksums the whole file.
    # Flipping to enforced = pass --enforce in ci.yml (one-line change).
    ci_producer: "openbank-infra/scripts/check-db-migration.py"
  event_change:
    detect: ["*.avsc", "Avro/JSON schema under */schema/* or */avro/*", "Kotlin data class extending DomainEvent (the actual event contract today — JSON on Kafka via the outbox)"]
    require:
      - "schema versioned backward-compatibly"
      - "breaking event change ships as a NEW versioned event (-vN topic, ADR-0006), never an in-place edit"
    gate: schema-compat
    enforced: advisory
    target_enforce_date: "2026-09-15"   # ADR-0144
    # CI producer is LIVE (advisory): .github/scripts/check-event-schema-compat.py runs in
    # the "Validate manifests" job on every PR — diff-scoped over DomainEvent data classes
    # (removed/renamed props, type changes, non-nullable-no-default additions = replay break,
    # eventType renames), *.avsc files (field default rules), and — since ADR-0260 picked
    # JSON Schema as the fleet's event-schema format, not Avro — */schema/*.schema.json files
    # (compare_json_schema: removed properties, type changes, a property becoming required, all
    # compared per-`oneOf`-branch so a header-discriminated topic's several message shapes are
    # each checked). The JSON Schema path is the ONLY compatibility check reachable for a
    # producer whose event class does not extend DomainEvent — e.g.
    # openbank-document-service's DocumentGenerated/SignatureCeremonyCompleted, structurally
    # invisible to the DomainEvent comparator the same way SepaPaymentCreatedEvent is on the
    # money-path side. Still no rules.yaml gate registration change: this is the SAME `gate:
    # schema-compat` / `event_change` rule extended to a new input shape, not a new gate — a
    # second advisory entry for the identical detect scope would be the #3009 duplicate-gate
    # mistake. Flip to enforced = --enforce.
    ci_producer: ".github/scripts/check-event-schema-compat.py"
  event_consumer_liveness:
    # ADR-0160 mechanism 1. standing-order-service published standing-order.due.v1 every day
    # for weeks with zero consumers anywhere in the fleet — full CRUD, passing tests, docs, a
    # scheduler doc-comment claiming a downstream consumed it — and nothing checked the claim
    # against the actual fleet (issue #889). This is a fleet-wide scan, not diff-scoped: any
    # Kafka topic published by ANY service's mp.messaging.outgoing (or dispatched via an
    # outbox to a declared topic) must have at least one @Incoming consumer somewhere in the
    # fleet (a matching topic:/topics: declaration), or be explicitly allowlisted below with a
    # one-line reason (external sink, deliberately audit-only, or a tracked future-work gap).
    detect: ["any <service>/src/main/resources/application.yaml mp.messaging.outgoing topic"]
    require:
      - "topic has >=1 real @Incoming consumer fleet-wide, or an allowlist entry with a reason"
    gate: event-consumer-liveness
    # GRADUATED to enforce 2026-07-14 (ADR-0144): the #996 fleet-sweep triage that started with
    # issue #889 brought unallowlisted violations to zero across three rounds (#1005 sca topic
    # mismatch, #1007/#1032/#1050 audit-service fan-out, #1054 fx-service dead-stub producer fix,
    # this PR's fx.conversion.completed/documents.document.event/payments.swift.event consumers)
    # — same graduation path check-outbox-dispatch-enabled.sh proved out. check-event-consumer-
    # liveness.py --root . --enforce reports 0 fleet-wide; ci.yml now passes --enforce.
    enforced: enforce
    # CI producer is LIVE and enforced: .github/scripts/check-event-consumer-liveness.py runs in
    # the "Validate manifests" job on every PR — fleet-wide scan (not diff-scoped). A new topic
    # published with no consumer and no allowlist entry now fails the build.
    ci_producer: ".github/scripts/check-event-consumer-liveness.py"
    # #996 triage findings, classified LEGITIMATE_NO_CONSUMER (not the #889 failure class):
    allowlist:
      # openbank.psd2.events left the allowlist in #8510: the producer itself was deleted
      # (the psd2_outbox apparatus had zero writers), so there is no topic left to exempt.

