#
# THE JOURNEY CATALOG (ADR-0252) — every customer journey the platform checks in production,
# and every one it does not yet check, with the reason.
#
# WHY THIS FILE EXISTS
#   Two customer-visible failures were found by customers: push reached one device, and a
#   domestic payment failed silently. The platform checked neither. What it did check was
#   `probes-synthetic.yaml` — four blackbox targets answering HTTP — plus a k6 journey that
#   ran `iterations: 1` once on ArgoCD sync. So "is the front door open?" was continuously
#   verified and "can a customer be paid or notified?" never was.
#
# WHAT AN ENTRY MEANS
#   A journey is a customer-visible capability that a machine exercises on a schedule in
#   production. `status: active` means it runs; `status: planned` means it does not, and the
#   entry then has to say what blocks it. A planned entry is not an aspiration — it is this
#   file refusing to let a gap be invisible, which is the failure mode that produced both
#   outages.
#
# WHY THE GAPS ARE LISTED HERE RATHER THAN OMITTED
#   The repo's hardest-won gate rule is that a gate whose SCOPE is a hand-kept list reads as
#   PASSING when the list is short (pact-drift-check, #2284). A catalog holding only the two
#   journeys that happen to run would report full coverage of a platform that moves money it
#   never checks. Listing the unbuilt ones inverts that: the file's own gate
#   (check-journey-catalog.py) fails on a planned entry with no blocker, so the gap can be
#   deferred but not forgotten.
#
#   This is NOT yet coverage derived from the set of customer-visible capabilities — that is
#   the harder half, and until it exists this list is still hand-kept and can still be short
#   without anyone noticing. Tracked in #4348. Read the coverage claim accordingly.
#
# FIELDS
#   id             stable slug. Names the CronJob (`journey-<id>`) and the alert labels.
#   title          what a human calls it.
#   capability     the customer-visible thing this proves works. One sentence, no hedging.
#   status         active | planned
#   severity       page | ticket — what a red run is worth waking someone for.
#   money_moving   true when the journey initiates a real payment or ledger posting.
#   cronjob        path to the manifest that runs it — the CronJob and the ConfigMap holding
#                  its k6 script live in that one file (active only). The script is embedded
#                  rather than kept as a sibling .js so there is no second copy to drift.
#                  CI extracts this exact ConfigMap scalar for the PR and post-GitOps-merge
#                  calls; the periodic CronJob mounts it directly. One executable artifact,
#                  three call sites, enforced by check-journey-catalog.py.
#   schedule       cron expression, mirrored from the manifest (active only).
#   target_schedule intended cadence once a planned journey's blocker is removed. It is shown
#                  in Test Intelligence but never interpreted as proof that a scheduler exists.
#   falsification  how to make this journey go red on purpose. A journey that has only ever
#                  been green is unfalsified — the same rule gates.yaml applies to CI gates.
#   runtime_note    an active journey's known, evidence-backed runtime prerequisite. It is
#                  rendered beside the live Kubernetes verdict; it never turns a red run
#                  into a planned or passing one.
#   blocked_by     what prevents this from running (planned only).

version: 1

journeys:
  - id: public-edge
    title: "Public edge reachability"
    capability: >-
      The public API, the customer edge and the admin UI answer as themselves — a service
      that is up but serving the wrong thing (an ingress pointing at a dead backend, an
      edge returning 5xx instead of an auth challenge) is caught here.
    status: active
    severity: page
    money_moving: false
    cronjob: openbank-infra/gitops/components/observability/cronjob-journey-public-edge.yaml
    schedule: "*/5 * * * *"
    falsification: >-
      Set the API_BASE env on the CronJob's container to a host that resolves but serves 502
      (or scale the customer-edge Rollout to zero) and the run must exit non-zero within one
      schedule interval. The script reads API_BASE / CUSTOMER_BASE / ADMIN_BASE from __ENV
      with the production hosts as defaults, so this is executable rather than a description.
      The checks assert status < 500, so a backend outage fails the run while an auth
      challenge does not. Measured against grafana/k6:1.2.0: a failing threshold exits 99, a
      passing run exits 0.

  - id: product-catalog-read
    title: "Product catalog read path"
    capability: >-
      The sandbox product catalog can serve a non-mutating product list through its real
      HTTP handler and Postgres-backed projection. This is deliberately a service journey,
      not a claim about an authenticated customer or a payment.
    status: active
    severity: ticket
    money_moving: false
    cronjob: openbank-infra/gitops/components/observability/cronjob-journey-product-catalog-read.yaml
    schedule: "*/10 * * * *"
    runtime_note: >-
      The in-cluster network edge is live, but this protected endpoint requires a dedicated
      read-only client-credentials identity. Until the identity owner provisions that separate
      Vault-backed secret, failed runs mean missing authentication evidence — not a green
      catalog or network result. Tracked by #7324.
    falsification: >-
      Scale the product-catalog Deployment to zero, break its database connectivity, or set
      CATALOG_BASE to a route that returns 5xx. The exact mounted k6 program must fail its
      status, JSON-shape, and latency thresholds within one scheduled interval.

  - id: admin-ui-sso-boundary
    title: "Admin UI SSO boundary"
    capability: >-
      The public Admin UI reaches and renders its Keycloak SSO boundary in a real browser. This
      proves the unauthenticated hand-off only; it does not claim an authenticated operator flow.
    status: active
    severity: ticket
    money_moving: false
    workflow: .github/workflows/admin-ui-browser-synthetic.yml
    schedule: "13 */2 * * *"
    environment: sandbox
    falsification: >-
      Return a 5xx from the Admin UI, remove the Keycloak SSO boundary, or point the browser
      target at a host that cannot render it. The scheduled Chromium run must fail and retain
      its immutable evidence envelope.
    runtime_note: >-
      This is deliberately credential-free. A separate least-privilege canary identity is still
      required before an authenticated operator journey can be claimed.

  # ---------------------------------------------------------------------------------------
  # PLANNED — the journeys that would have caught the two reported outages. Both need a
  # synthetic party that can hold an account and a device, which is ADR-0252 phase 1.
  # ---------------------------------------------------------------------------------------
  - id: domestic-payment
    title: "Domestic payment between two customers"
    capability: >-
      One customer can pay another: the payment is accepted, screened, posted to the ledger
      and visible on both balances. This is the journey whose absence let a failed payment
      between two real customers go unreported until they said so.
    status: planned
    severity: page
    money_moving: true
    target_schedule: "*/15 * * * *"
    falsification: >-
      Blackhole the payment topic, or point the screening client at a dead host: the journey
      must go red rather than time out silently, and it must fail on the missing balance
      change rather than only on a transport error.
    blocked_by: >-
      ADR-0252 phase 1 (#4348) — needs bank-owned synthetic parties with the SYNTHETIC taint
      propagated to the ledger and the regulatory aggregates. Running this before the taint
      exists would post synthetic movements into FINREP/COREP and the AML baseline.

  - id: push-delivery
    title: "Push notification reaches a device"
    capability: >-
      A notification requested for a party is delivered to a real device and acknowledged by
      the app. Not "APNs returned 200" — the outage that motivated ADR-0252 had APNs
      returning 200 for every send while exactly one phone ever rang.
    status: planned
    severity: page
    money_moving: false
    target_schedule: "*/15 * * * *"
    falsification: >-
      Revoke the APNs signing key in the sandbox, or set APNS_ENABLED=false: the journey must
      go red. Phase 0 already makes the second case visible as a metric
      (PushChannelSkippedOnly); this journey is what proves the whole path, device included.
    blocked_by: >-
      ADR-0252 phase 3 (#4348) — needs the canary device fleet and the /probe/ack endpoint.
      Delivery is not observable server-side at any effort: APNs issues no receipt, so no
      amount of in-cluster probing can substitute for a device acknowledging the push.

  - id: customer-authentication
    title: "Customer login and strong authentication"
    capability: >-
      A customer can authenticate, obtain the intended scopes and complete an SCA challenge
      without a real person's credentials or device being used as monitoring infrastructure.
    status: planned
    severity: page
    money_moving: false
    target_schedule: "*/15 * * * *"
    falsification: >-
      Remove the synthetic client's SCA policy or break the challenge callback route: the
      journey must fail on the missing authenticated session, not merely accept an OIDC redirect.
    blocked_by: >-
      ADR-0252 phase 1 and phase 3 (#4348) — requires a bank-owned synthetic identity plus a
      canary authenticator whose secrets are held outside the script and whose sessions are tainted.

  - id: account-overview
    title: "Account overview and balances"
    capability: >-
      An authenticated customer can list their accounts and see a balance consistent with the
      ledger after the read-model propagation window.
    status: planned
    severity: page
    money_moving: false
    target_schedule: "*/15 * * * *"
    falsification: >-
      Pause the balance projection consumer: authentication and account listing may still pass,
      but the journey must fail when the expected ledger-backed balance does not converge.
    blocked_by: >-
      ADR-0252 phase 1 (#4348) — needs a durable synthetic party/account fixture and a cleanup
      contract; a shared real account would make the assertion nondeterministic.

  - id: sepa-credit-transfer
    title: "SEPA credit-transfer lifecycle"
    capability: >-
      A customer can submit a SEPA transfer and observe its governed state progression through
      screening, posting and outbound hand-off.
    status: planned
    severity: page
    money_moving: true
    target_schedule: "0 * * * *"
    falsification: >-
      Blackhole the SEPA instruction event after acceptance: the journey must fail on a stuck
      lifecycle state and unchanged ledger, not report success from the initial HTTP response.
    blocked_by: >-
      ADR-0252 phase 1 (#4348) — synthetic taint must survive the payment, Kafka, ledger and
      regulatory projections before an hourly transfer can safely run.

  - id: standing-order-lifecycle
    title: "Standing-order creation and execution"
    capability: >-
      A customer can create a standing order and its due execution becomes a posted payment
      exactly once, including scheduler and idempotency behavior.
    status: planned
    severity: page
    money_moving: true
    target_schedule: "15 3 * * *"
    falsification: >-
      Disable the real scheduler or replay the due trigger: the journey must fail on no posting
      or a duplicate posting, including when the create endpoint itself remains healthy.
    blocked_by: >-
      ADR-0252 phase 1 (#4348) plus a governed synthetic-clock/test-window contract. Moving the
      production clock or leaving daily synthetic orders behind is not an acceptable probe.

  - id: consent-revocation
    title: "Consent grant and revocation"
    capability: >-
      A customer can grant a bounded consent, use it, revoke it and have subsequent access denied
      across the consent and authorization projections.
    status: planned
    severity: page
    money_moving: false
    target_schedule: "0 * * * *"
    falsification: >-
      Stop the revocation event consumer: the revoke request can still return success, but the
      journey must fail when the previously authorised read remains possible.
    blocked_by: >-
      ADR-0252 phase 1 (#4348) — needs synthetic customer/client identities, deterministic grants
      and guaranteed cleanup so monitoring cannot accumulate live permissions.

  - id: psd2-ais
    title: "PSD2 account-information access"
    capability: >-
      A synthetic regulated client can complete the AIS authorization flow and retrieve only the
      accounts and balances permitted by its consent.
    status: planned
    severity: page
    money_moving: false
    target_schedule: "*/15 * * * *"
    falsification: >-
      Break the consent-to-scope mapping or present an untrusted client certificate: the journey
      must reject over-broad or unauthenticated access and fail if valid AIS access stops working.
    blocked_by: >-
      Requires a bank-owned synthetic TPP identity, test trust chain and consent fixture managed
      by ADR-0252 phase 1 (#4348); production TPP credentials cannot be probe material.

  - id: loan-origination
    title: "Loan application to decision"
    capability: >-
      A synthetic applicant can submit an application and observe the asynchronous workflow reach
      an auditable terminal decision with all required controls invoked.
    status: planned
    severity: ticket
    money_moving: false
    target_schedule: "30 4 * * *"
    falsification: >-
      Suspend one workflow activity or its event consumer: the journey must fail on the missing
      terminal state and identify the stalled stage, not time out without provenance.
    blocked_by: >-
      Needs a synthetic applicant dataset with retention/deletion rules and deterministic policy
      outcomes; ADR-0252 phase 1 (#4348) currently defines parties, not this richer fixture.

  - id: statement-download
    title: "Statement generation and download"
    capability: >-
      A customer can request a statement, wait for generation and download a non-empty document
      whose account and period match the request.
    status: planned
    severity: ticket
    money_moving: false
    target_schedule: "0 5 * * *"
    falsification: >-
      Stop document generation or object-store access: the journey must fail on the missing or
      mismatched document rather than treating request acceptance as completion.
    blocked_by: >-
      Needs a stable synthetic account history and an isolated document-retention prefix with
      deterministic cleanup; tracked with the ADR-0252 phase-1 fixture work (#4348).

  - id: mobile-critical-path
    title: "Mobile login, overview and payment UI"
    capability: >-
      The shipped customer app can start, authenticate a canary, render account state and submit
      a synthetic payment on Android and iOS through the same public edge customers use.
    status: planned
    severity: page
    money_moving: true
    target_schedule: "0 * * * *"
    falsification: >-
      Ship a build with a broken navigation route or point one platform at an invalid edge path:
      the device journey must fail for that platform even when backend synthetics remain green.
    blocked_by: >-
      ADR-0252 phase 3 (#4348) — requires managed Android/iOS canary devices, signed builds,
      synthetic credentials and acknowledgement/cleanup. JVM screenshot tests cannot substitute.

  - id: admin-operator-access
    title: "Admin operator sign-in and Test Intelligence access"
    capability: >-
      A least-privilege bank-owned operator can complete the sandbox SSO flow and reach the
      Test Intelligence workspace with the intended role boundary. This proves the deployed
      admin browser path, independently of the Admin UI's CI Playwright evidence.
    status: planned
    severity: ticket
    money_moving: false
    target_schedule: "*/30 * * * *"
    falsification: >-
      Remove the operator role mapping, break the SSO callback, or deny the Test Intelligence
      API: the journey must fail after authentication on the missing protected workspace or its
      authorization boundary, not pass merely because the public login page returned HTML.
    blocked_by: >-
      Needs a least-privilege bank-owned Keycloak canary identity plus a browser-capable,
      digest-pinned runner isolated from the current protocol-only k6 CronJob. The existing
      read-only k6 pod has no Chromium runtime; adding one without a separate security and
      credential boundary would turn a monitoring gap into a privileged browser foothold.

# ---------------------------------------------------------------------------------------
# MONEY-PATH ACCOUNTABILITY (ADR-0252 phase 2, #4348)
#
# WHY THIS BLOCK EXISTS
#   The journeys above are the ones we run or intend to run. That says nothing about the
#   services nobody has considered — and a catalog is a coverage claim, so the services it
#   never mentions are the dangerous ones. This block forces the money path to be ACCOUNTED
#   for: every service in `rules.yaml: money_path_services` is either covered by a journey
#   above (`covered_by`) or listed here with the reason it is not.
#
#   check-journey-coverage.py enforces the set BOTH WAYS against rules.yaml — a money-path
#   service missing from this file fails the gate, and a stale entry for a service that is no
#   longer money-path fails it too. That is the difference between a list that can quietly get
#   short and one that cannot: a new money-path service is red until a human decides what
#   watches it.
#
#   What this does NOT claim: that a service listed as `covered_by` is well covered, or that
#   the money path is the whole of the customer-visible surface. Deriving the full capability
#   set is still unbuilt (#4348). This closes the gap that matters most first.
money_path_accountability:

  # All twenty-three share one blocker today, so it is stated once rather than pasted
  # twenty-three times — a per-service copy of the same sentence is not more information, and
  # it drifts. Where a service's situation genuinely differs, it gets its own `note`.
  default_blocker: >-
    ADR-0252 phase 1 (#4348) — no journey can drive a money-path service in production until
    bank-owned synthetic parties exist and the SYNTHETIC taint reaches the ledger and the
    regulatory aggregates. Until then, exercising these paths would post synthetic movements
    into FINREP/COREP/AnaCredit and the AML baseline.

  services:
    - service: openbank-ledger-service
    - service: openbank-transaction-service
    - service: openbank-account-service
    - service: openbank-balance-service
    - service: openbank-sepa-payment
    - service: openbank-sepa-instant
    - service: openbank-domestic-payment
      note: >-
        The reported outage. A failed payment between two customers went unnoticed until they
        said so; `domestic-payment` above is the journey that covers it once phase 1 lands.
    - service: openbank-clearing-service
    - service: openbank-swift-service
    - service: openbank-fx-service
      note: >-
        Its ČNB fixing URL was a 404 for the service's whole life and every test layer stayed
        green (#2204). A journey here would have to assert the SHAPE of the fetched rate, not
        that a request succeeded — a 404 is a valid HTTP response.
    - service: openbank-lending-service
    - service: openbank-sdd-service
    - service: openbank-interest-service
    - service: openbank-sca-service
      note: >-
        Highest-value target after the payment itself: where push carries the SCA challenge,
        a broken push channel is a broken authentication factor, not a UX defect. Depends on
        `push-delivery` (phase 3) as much as on phase 1.
    - service: openbank-consent-service
    - service: openbank-delegation-service
    - service: openbank-fraud-service
    - service: openbank-billing-service
    - service: openbank-settlement-service
    - service: openbank-sanctions-service
      note: >-
        A control path, so a journey must prove it RUNS for synthetic traffic rather than
        being skipped for it — the one place where the taint must never suppress anything.
    - service: openbank-vop-service
    - service: openbank-standing-order-service
    - service: openbank-psd2-service
      note: >-
        Also the PSD2 RTS Art. 32(4) interface whose quarterly availability statistics this
        programme is meant to generate, so its journey is evidence as well as monitoring.
