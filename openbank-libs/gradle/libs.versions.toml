[versions]
kotlin = "2.3.20"
quarkus = "3.37.2"
quarkus-plugin = "3.37.2"
coroutines = "1.8.1"
# 2.22.1 (Dependabot #75 follow-up): 2.22.0 itself carries a GHSA fixed in 2.22.1 — same
# patch series Quarkus 3.37.2's BOM resolves jackson-databind/jackson-core to
# (enforcedPlatform); this floors the modules that declare Jackson directly (libs-domain)
# on the same version, closing GHSA-hgj6-7826-r7m5 / GHSA-j3rv-43j4-c7qm /
# GHSA-rmj7-2vxq-3g9f / etc.
jackson = "2.22.1"
# WebAuthn RP verification (ADR-0066 F2, customer-edge native passkey). Pinned to 0.28.x —
# 0.31.x switched ObjectConverter to the Jackson 3 "tools.jackson" fork, which conflicts
# with Quarkus 3.37's Jackson 2.x (jackson-databind/jackson-core, pinned above); 0.28.5
# is the newest release still on classic com.fasterxml.jackson.
webauthn4j = "0.28.5.RELEASE"
# JUG — UUIDv7 (RFC 9562) generation for time-ordered identifiers (ADR-0106). FasterXML,
# Apache-2.0, same org as Jackson (already a core dep). Vetted generator instead of a
# hand-rolled one: intra-millisecond monotonicity (RFC 9562 §6.2) is subtle to get right.
java-uuid-generator = "5.1.0"
junit = "5.11.0"
# 3.27.7 (issue #461): closes GHSA-rqfh-9r24-8c9r. Test-only dependency.
assertj = "3.27.7"
mockk = "1.13.12"
kover = "0.9.1"
wiremock = "3.9.2"
avro = "1.11.3"
apicurio-registry = "2.6.2.Final"
testcontainers = "1.20.4"
# 4.7.3 (issue #461 follow-up): the only route org.apache.tika:tika-core enters the
# project dependency graph as a real classpath dependency (pact-consumer/pact-provider
# pull it transitively for content-type matching) — 4.6.17 resolves tika-core 2.9.1,
# vulnerable to GHSA-f58c-gq56-vjjf (XXE, critical). 4.7.3 resolves tika-core 3.2.3.
# Distinct from the tika-core pulled by the cyclonedx Gradle plugin's own SBOM
# classpath (gradle/osv-scanner.toml) — that one is a separate, non-project-resolvable
# occurrence and still needs a cyclonedx plugin version bump.
pact = "4.7.3"
# Static analysis (SAST gate — detekt for correctness rules, ktlint for formatting).
# detekt 1.23.8 bundles its own kotlin-compiler-embeddable, so it parses sources
# independently of the project Kotlin version (2.3.x here).
detekt = "1.23.8"
ktlint-plugin = "13.1.0"
# pitest-plugin = "1.15.0"       # deferred: crashes on Gradle 9.5 (ADR-0063 Phase 2)
# pitest-junit5-plugin = "1.2.1" # deferred: see above
# AWS SDK v2, Apache-2.0 (ADR-0161 D2): S3ObjectStore, the production ObjectStorePort
# adapter. 2.29.52 is a recent stable 2.x pin at time of writing — verify/bump via
# Dependabot rather than treating it as hand-curated forever. S3Presigner ships inside
# this same `s3` artifact in SDK v2, so no separate presigner module is needed.
aws-sdk = "2.29.52"
# Handlebars.java, Apache-2.0 (ADR-0162 D2): the logic-less template engine behind
# openbank-document-service's TemplateRenderPort. No custom helpers are ever registered
# (see HandlebarsTemplateRenderer) — that is what keeps it free of arbitrary code
# execution, not the library version. 4.4.0 is a recent stable pin — verify/bump via
# Dependabot rather than treating it as hand-curated forever.
handlebars = "4.5.2"
# Apache PDFBox, Apache-2.0 (ADR-0162 D4 phase 1): PAdES-B PDF signing in
# PdfBoxPadesSealAdapter. 3.0.3 is the current stable 3.x line — PDDocument loading moved
# to org.apache.pdfbox.Loader in 3.x (the 2.x `PDDocument.load(...)` statics were removed).
pdfbox = "3.0.3"
# Bouncy Castle (bcprov/bcpkix jdk18on), Bouncy Castle License (MIT-style, permissive — NOT
# GPL/AGPL, so it clears the dependency denylist) (ADR-0162 D4 phase 1): the CMS/PKCS7
# detached-signature generator PdfBoxPadesSealAdapter uses to build the PAdES-B seal, and
# the X.509 cert builder for the dev-only ephemeral certificate path. Distinct from EU DSS
# (LGPL-2.1, phase 2 QES — legal sign-off required, ADR-0162 D4) — do not conflate the two.
# 1.84 deliberately matches the version already resolved (and verified in
# gradle/verification-metadata.xml) as a transitive dependency elsewhere in this build, rather
# than introducing a second, differently-pinned BC version with its own fresh verification gap.
bouncycastle = "1.84"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "coroutines" }

quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-kotlin = { module = "io.quarkus:quarkus-kotlin" }
# Quarkus 3.9+ renamed quarkus-resteasy-reactive → quarkus-rest; the old
# coordinates were dropped from the BOM in 3.20. Aliases preserved so
# build.gradle.kts callers don't need to change.
quarkus-resteasy-reactive = { module = "io.quarkus:quarkus-rest" }
quarkus-resteasy-reactive-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
# Both kotlin and java variants — Kotlin extension auto-pulls the Java one as transitive
# in 3.20, but in 3.33 it does not. Some entities import the Java types directly, so we
# declare both explicitly.
quarkus-hibernate-reactive-panache = { module = "io.quarkus:quarkus-hibernate-reactive-panache-kotlin" }
quarkus-hibernate-orm-panache = { module = "io.quarkus:quarkus-hibernate-orm-panache-kotlin" }
quarkus-hibernate-reactive-panache-base = { module = "io.quarkus:quarkus-hibernate-reactive-panache" }
quarkus-agroal = { module = "io.quarkus:quarkus-agroal" }
quarkus-reactive-pg-client = { module = "io.quarkus:quarkus-reactive-pg-client" }
quarkus-flyway = { module = "io.quarkus:quarkus-flyway" }
quarkus-jdbc-postgresql = { module = "io.quarkus:quarkus-jdbc-postgresql" }
quarkus-smallrye-kafka = { module = "io.quarkus:quarkus-messaging-kafka" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-micrometer-registry-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
quarkus-opentelemetry = { module = "io.quarkus:quarkus-opentelemetry" }
quarkus-oidc = { module = "io.quarkus:quarkus-oidc" }
quarkus-oidc-client-reactive-filter = { module = "io.quarkus:quarkus-rest-client-oidc-filter" }
quarkus-redis-client = { module = "io.quarkus:quarkus-redis-client" }
webauthn4j-core = { module = "com.webauthn4j:webauthn4j-core", version.ref = "webauthn4j" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
quarkus-smallrye-openapi = { module = "io.quarkus:quarkus-smallrye-openapi" }
quarkus-vault = { module = "io.quarkiverse.vault:quarkus-vault" }
quarkus-mailer = { module = "io.quarkus:quarkus-mailer" }
quarkus-rest-client-reactive = { module = "io.quarkus:quarkus-rest-client" }
quarkus-rest-client-reactive-jackson = { module = "io.quarkus:quarkus-rest-client-jackson" }
quarkus-smallrye-fault-tolerance = { module = "io.quarkus:quarkus-smallrye-fault-tolerance" }
quarkus-cache = { module = "io.quarkus:quarkus-cache" }
quarkus-scheduler = { module = "io.quarkus:quarkus-scheduler" }

jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }

avro = { module = "org.apache.avro:avro", version.ref = "avro" }
apicurio-registry-avro = { module = "io.apicurio:apicurio-registry-serdes-avro-serde", version.ref = "apicurio-registry" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
quarkus-test-security = { module = "io.quarkus:quarkus-test-security" }
# @OidcSecurity/@Claim — simulates a validated OIDC bearer token's JsonWebToken claims in a
# @QuarkusTest without a real IdP round-trip (ADR-0195 step 4, openbank-mcp-service).
quarkus-test-security-oidc = { module = "io.quarkus:quarkus-test-security-oidc" }
rest-assured-kotlin = { module = "io.rest-assured:kotlin-extensions" }
# In-memory reactive-messaging connector for outbox dispatch ITs (ADR-0050): swaps the Kafka
# leg so the test asserts exactly what was produced (key/headers) without a live broker.
smallrye-reactive-messaging-inmemory = { module = "io.smallrye.reactive:smallrye-reactive-messaging-in-memory" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
# Per-job isolated test infra (fleet sweep, issue #578): @QuarkusTest ITs spin their
# own PostgreSQL + Redpanda (Kafka API) per JVM instead of sharing one compose stack.
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-redpanda = { module = "org.testcontainers:redpanda", version.ref = "testcontainers" }

# Consumer-driven contract testing — Pact JVM (ADR-0063)
pact-consumer = { module = "au.com.dius.pact.consumer:junit5", version.ref = "pact" }
pact-provider = { module = "au.com.dius.pact.provider:junit5", version.ref = "pact" }

# S3 client for the ObjectStorePort production adapter (ADR-0161 D2). Not added to any
# service build.gradle.kts by this ADR — only openbank-libs-runtime compiles against it
# (compileOnly, see its build.gradle.kts comment); a consuming service opts in itself.
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }

# Logic-less HTML template engine (ADR-0162 D2) — openbank-document-service only.
handlebars = { module = "com.github.jknack:handlebars", version.ref = "handlebars" }

# PAdES-B PDF signing (ADR-0162 D4 phase 1) — openbank-document-service only.
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }

# CMS/PKCS7 signature generation + X.509 cert building for PAdES-B sealing (ADR-0162 D4
# phase 1) — openbank-document-service only. bcpkix depends on bcprov; both declared
# explicitly for clarity/reproducibility.
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus-plugin" }
jandex = { id = "org.kordamp.gradle.jandex", version = "2.0.0" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
cyclonedx = { id = "org.cyclonedx.bom", version = "2.3.0" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
# pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }  # deferred Gradle 9
