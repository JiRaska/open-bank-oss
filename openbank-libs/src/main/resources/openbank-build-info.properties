# Build-time tech-stack snapshot baked into the libs JAR. Values come from
# libs.versions.toml via a Gradle expand at processResources. BuildInfo
# (com.openbank.libs.util.BuildInfo) loads this once at class init and
# augments it with runtime JVM info.
kotlin.version=@kotlinVersion@
quarkus.version=@quarkusVersion@
quarkus.lts=@quarkusLts@
quarkus.support.until=@quarkusSupportUntil@
gradle.version=@gradleVersion@
build.time=@buildTime@
git.commit=@gitCommit@
libs.version=@libsVersion@
