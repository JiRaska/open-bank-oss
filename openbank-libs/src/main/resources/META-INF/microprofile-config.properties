# OpenBank shared defaults (ADR-0049 D2). Loaded from openbank-libs jar via
# MicroProfile Config (ordinal 100). Service application.yaml (ordinal 250) always wins.

# HTTP Security headers — identical in all 28 services
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-XSS-Protection".value=1; mode=block
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=()
quarkus.http.header."Content-Security-Policy".value=default-src 'self'
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# Management endpoint (/q health, metrics, info)
quarkus.management.enabled=true
quarkus.management.port=8085
quarkus.management.host=127.0.0.1
quarkus.management.root-path=/q

# Dev UI disabled in shared default
quarkus.dev-ui.enabled=false

# SmallRye Health UI
quarkus.smallrye-health.ui.enable=true
quarkus.smallrye-health.root-path=/q/health

# Structured JSON logging (ADR-0077 Phase 3 / ADR-0082). With json=true Quarkus
# uses the structured formatter (correct escaping — never hand-roll JSON via a
# format string), and the OpenTelemetry trace context (traceId, spanId, sampled)
# plus our correlationId are emitted under the nested "mdc" object. Grafana Alloy
# lifts mdc.traceId / mdc.spanId / mdc.correlationId into Loki *structured
# metadata*, which is what makes the bidirectional log<->trace jump work without
# those high-cardinality ids ever becoming Loki stream labels.
# NOTE: the previous quarkus.log.console.format=... line was INERT (the text
# format is ignored whenever json=true) and has been removed to avoid confusion.
quarkus.log.level=INFO
quarkus.log.console.json=true
quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name:unknown}
quarkus.log.console.json.additional-field."service.version".value=${quarkus.application.version:unknown}

# OpenTelemetry — enabled by default, endpoint injected via env (ADR-0077)
# In-cluster: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo.observability.svc:4317
# Locally/test: override OTEL_EXPORTER_OTLP_ENDPOINT or set quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:0.1}
quarkus.otel.propagators=tracecontext,baggage
# Tests keep SDK disabled to avoid OTLP connection noise
%test.quarkus.otel.sdk.disabled=true

# OIDC defaults — service-specific credentials stay in service application.yaml
quarkus.oidc.auth-server-url=${OIDC_SERVER_URL:http://localhost:8080/realms/openbank}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:openbank-services}
quarkus.oidc.tls.verification=required
%dev.quarkus.oidc.tls.verification=none

# CORS defaults
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Idempotency-Key

# Flyway retry defaults
quarkus.flyway.connect-retries=10
quarkus.flyway.connect-retries-interval=2S
