quarkus:
  application:
    name: openbank-consent-service

  http:
    port: 8106
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key

    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
    limits:
      max-body-size: 10M
    idle-timeout: 60S
    read-timeout: 30S

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/openbank_consents
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_consents

  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
    locations: db/migration

  hibernate-orm:
    database:
      generation: none

  redis:
    hosts: redis://localhost:6379

  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  smallrye-reactive-messaging:
    kafka:
      bootstrap-servers: localhost:29092

  shutdown:
    timeout: 30S

  smallrye-health:
    root-path: /q/health

  log:
    level: INFO
    console:
      format: '%d{HH:mm:ss} %-5p [%c{3.}] %s%e%n'
      json: false

  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-consent-service
        service.version: 0.5.1

  rest-client:
    sca-service:
      url: ${SCA_SERVICE_URL:http://localhost:8110}
      connect-timeout: 2000
      read-timeout: 2000

  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      consent-events-out:
        connector: smallrye-kafka
        client.id: consent-service-${quarkus.uuid}
        topic: openbank.consent.events
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
        format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"
    oidc:
      enabled: false

"%test":
  quarkus:
    datasource:
      reactive:
        url: vertx-reactive:postgresql://localhost:5433/openbank_consents_test
    management:
      enabled: false
    oidc:
      enabled: false

openbank:
  # Opt in to the libs-runtime OPA sidecar PolicyDecisionPoint producer (replaces the
  # per-service AuthzProducer; same opa.url / opa.path / opa.timeout-ms keys and defaults).
  authz:
    opa-pdp-producer:
      enabled: true
  consent:
    idempotency-ttl-seconds: 86400
  outbox:
    dispatch-enabled: true
  rate-limit:
    enabled: true
    max-concurrent-requests: 150
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second approver),
  # independent of the base allow/deny enforce toggle above. Stays false by default — same
  # deliberate, separate rollout decision every other money-path service in the fleet makes
  # (billing-service's/sepa-payment's application.yaml have the identical comment); flipping
  # this is a runbook-gated follow-up, not bundled with the ApprovalStore wiring itself.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"
"%prod":
  quarkus:
    http:
      # East-west mTLS: the 8443 listener must VALIDATE the caller's certificate, not merely offer
      # TLS. `quarkus.http.ssl.client-auth` is a BUILD-TIME property, so the container env
      # QUARKUS_HTTP_SSL_CLIENT_AUTH could never set it — Quarkus fixes the value into the image at
      # build time and ignores a differing runtime value, leaving the listener at the default
      # `none`. It therefore has to live in the file the image is built from.
      #
      # Under `%prod` specifically, and NOT at the top level: `quarkus.http.ssl.*` makes Quarkus
      # treat TLS as intended, and with no certificate configured it then refuses to start
      # ("Cannot set quarkus.http.insecure-requests without enabling SSL") — which is every dev run
      # and every @QuarkusTest. `prod` is the active profile during quarkusBuild, so the value is
      # still baked into the image; `test` and `dev` simply never see it.
      ssl:
        client-auth: required
      # Keep the plain-HTTP port. With client-auth REQUIRED, Quarkus defaults
      # `insecure-requests` to `disabled` and drops the HTTP listener entirely, so the
      # readiness probe and every in-cluster plaintext caller get `connection refused`.
      # mTLS applies to the 8443 listener only. Runtime property; see #10441.
      insecure-requests: enabled
