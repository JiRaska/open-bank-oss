openapi: 3.1.0
info:
  title: Consent Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.0 -> 1.1): additive
  # endpoint only (PATCH /approvals/{id}, ADR-0155 four-eyes) — no breaking change.
  version: 1.7.0
  description: >-
    Data sharing consent lifecycle — create, activate, reject, revoke, validate. PATCH
    /approvals/{id} decides a four-eyes approval paused by the platform's ADR-0155 maker-checker
    gate on `consent.grant` / `consent.revoke` (maker != checker).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8106
    description: Local development
tags:
  - name: Consents

paths:
  /api/v1/consents:
    post:
      tags: [Consents]
      summary: Create a consent
      operationId: createConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
      responses:
        '201':
          description: Consent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/{id}:
    get:
      tags: [Consents]
      summary: Get consent by ID
      operationId: getConsent
      parameters:
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: Consent detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Consents]
      summary: Revoke a consent
      operationId: revokeConsent
      parameters:
        - $ref: '#/components/parameters/consentId'
      responses:
        '204':
          description: Consent revoked
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/party/{partyId}/grantee/{granteeId}/active:
    get:
      tags: [Consents]
      summary: Whether a party holds an ACTIVE consent for a grantee covering a scope (ADR-0198 D4)
      description: >-
        Answers the question a sender actually has. `POST /{id}/validate` is keyed by consent id,
        which a service deciding whether to send a marketing message does not hold — it has a
        partyId and a channel. Reaching validate would mean listing every consent the party holds,
        PSD2 account access included, to answer a yes/no about marketing. This returns the yes/no
        and nothing else: no consent id, no scopes, no validity window, so the answer cannot be
        cached in place of the per-send check ADR-0198 requires.
      operationId: hasActiveConsent
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: granteeId
          in: path
          required: true
          description: e.g. the fixed internal marketing grantee `party-service:marketing-comms` (ADR-0205 D3)
          schema:
            type: string
        - name: scope
          in: query
          required: true
          schema:
            type: string
            # Must list EVERY ConsentScope value: the api gate (issue #5962) compares this enum
            # against the Kotlin one and fails on either direction of drift. A partial list here
            # advertised a smaller consent vocabulary than the service actually accepts.
            enum: [ACCOUNTS_READ, BALANCES_READ, TRANSACTIONS_READ, STATEMENTS_READ,
                   PAYMENT_ACCOUNTS_READ, STANDING_ORDERS_READ, DIRECT_DEBITS_READ,
                   PAYMENTS_INITIATE, PAYMENTS_STATUS_READ, DOMESTIC_PAYMENT_INITIATE,
                   SIPO_PAYMENT_INITIATE, FUNDS_CONFIRMATION,
                   AGENT_QUERY, AGENT_INITIATE, AGENT_NOTIFY, AGENT_ANALYZE,
                   TELEMETRY_RUM,
                   MARKETING_COMMS_EMAIL, MARKETING_COMMS_PUSH, MARKETING_COMMS_INAPP,
                   CREDIT_OFFERS, CREDIT_PROFILE_USE, CREDIT_AI_AGENT]
      responses:
        '200':
          description: Whether the consent exists, is active now, and covers the scope
          content:
            application/json:
              schema:
                type: object
                required: [granted]
                properties:
                  granted:
                    type: boolean
        '400':
          description: Unknown scope
  /api/v1/consents/party/{partyId}:
    get:
      tags: [Consents]
      summary: List consents for a party
      operationId: listConsentsByParty
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Consents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/grantee/{granteeId}:
    get:
      tags: [Consents]
      summary: List consents by grantee (TPP ID)
      operationId: listConsentsByGrantee
      parameters:
        - name: granteeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/{id}/activate:
    post:
      tags: [Consents]
      summary: Activate a consent
      operationId: activateConsent
      parameters:
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: Activated
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/{id}/reject:
    post:
      tags: [Consents]
      summary: Reject a consent
      operationId: rejectConsent
      parameters:
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: Rejected
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/{id}/validate:
    post:
      tags: [Consents]
      summary: Validate an active consent
      operationId: validateConsent
      parameters:
        - $ref: '#/components/parameters/consentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  reason:
                    type: string
                    nullable: true
                    description: Human-readable denial reason (present when valid=false).
                  code:
                    type: string
                    nullable: true
                    description: Machine denial code, e.g. CONSENT_NOT_ACTIVE (present when valid=false).
                  scopes:
                    type: array
                    nullable: true
                    description: Granted scopes (present when valid=true).
                    items:
                      type: string
                  grantedAccounts:
                    type: array
                    nullable: true
                    description: Covered account IBANs; null (when valid) = all of the party's accounts.
                    items:
                      type: string
                  frequencyPerDay:
                    type: integer
                    nullable: true
                    description: PSD2 RTS Art. 10 AISP per-day read cap (4); null for non-AISP consents.
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/consents/approvals/{id}:
    patch:
      tags: [Consents]
      summary: >-
        Approve or reject a pending four-eyes approval for a gated consent action
        (consent.grant / consent.revoke, ADR-0155)
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        '200':
          description: The decided approval
        '404':
          description: No pending approval with that id
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/suppressions:
    post:
      tags: [Suppressions]
      summary: Create a do-not-contact suppression (ADR-0219 D3)
      operationId: createSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuppressionRequest'
      responses:
        '201':
          description: Suppression created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '400':
          description: Invalid entry (ALL takes no value; SCOPE/TOPIC require one)
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/suppressions/party/{partyId}:
    get:
      tags: [Suppressions]
      summary: List a party's active suppressions — the contact-policy gate's read
      operationId: listActiveSuppressions
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active suppression entries (empty when none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuppressionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/suppressions/{id}/revoke:
    post:
      tags: [Suppressions]
      summary: Revoke a suppression entry
      operationId: revokeSuppression
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The revoked entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '404':
          description: No suppression with that id
        '409':
          description: Already revoked
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    consentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: Authenticated but denied by the OPA authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateConsentRequest:
      type: object
      required: [partyId, granteeId, scopes, expiresAt]
      properties:
        partyId:
          type: string
          format: uuid
        granteeId:
          type: string
        scopes:
          type: array
          items:
            type: string
          example: [accounts:read, transactions:read]
        expiresAt:
          type: string
          format: date-time
        accountIds:
          type: array
          items:
            type: string
            format: uuid

    ConsentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        granteeId:
          type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, REJECTED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    CreateSuppressionRequest:
      type: object
      required: [partyId, scope, reason, source]
      properties:
        partyId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [ALL, SCOPE, TOPIC]
        value:
          type: string
          description: Scope or topic name — required for SCOPE/TOPIC, must be absent for ALL.
        reason:
          type: string
          enum: [CUSTOMER_OPTOUT, COMPLAINT, RM_MANAGED, LEGAL_HOLD, DECEASED]
        source:
          type: string
          description: Origin surface (preference-centre, complaints flow, RM workbench).

    SuppressionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [ALL, SCOPE, TOPIC]
        value:
          type: string
          nullable: true
        reason:
          type: string
          enum: [CUSTOMER_OPTOUT, COMPLAINT, RM_MANAGED, LEGAL_HOLD, DECEASED]
        source:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
