openapi: 3.0.3
info:
  title: OpenBank Communication Service
  version: 1.0.0
paths:
  /api/v1/personas/{personaKey}/style-versions:
    post:
      summary: Draft a new style version for a persona (D3 lint runs before persistence)
      parameters: [{name: personaKey, in: path, required: true, schema: {type: string}}]
      responses: {"201": {description: Created}, "400": {description: Rejected by lint or validation}}
  /api/v1/personas/style-versions/{id}/submit:
    post:
      summary: DRAFT -> IN_REVIEW, the maker's declaration this is ready for a checker
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Submitted}, "409": {description: Conflict}}
  /api/v1/personas/style-versions/{id}/publish:
    post:
      summary: Publish (four-eyes-gated, commstyle.publish; the draft's own maker is refused)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Published}, "202": {description: Paused pending a checker decision}, "409": {description: Conflict}}
  /api/v1/personas/style-versions/{id}/retire:
    post:
      summary: Retire a still-published version without a replacement
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Retired}, "409": {description: Conflict}}
  /api/v1/personas/{personaKey}/published:
    get:
      summary: The composed, published style a consumer caches (D5)
      parameters: [{name: personaKey, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: The published style}, "404": {description: No published version}}
  /api/v1/communications/approvals:
    get:
      summary: Checker's pending four-eyes approval queue (ADR-0227 D2), oldest first
      parameters: [{name: limit, in: query, required: false, schema: {type: integer}}]
      responses: {"200": {description: Pending approvals}}
  /api/v1/communications/approvals/{id}:
    patch:
      summary: Approve or reject a pending commstyle.publish approval
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Decided}, "404": {description: No such pending approval}}
