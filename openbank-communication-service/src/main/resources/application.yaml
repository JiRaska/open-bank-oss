quarkus:
  application:
    name: openbank-communication-service
  http:
    port: 8158
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PATCH,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:openbank}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: ${REACTIVE_URL:postgresql://localhost:5432/openbank_communication}
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openbank_communication}
  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  redis:
    hosts: ${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
  oidc:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  swagger-ui:
    always-include: true
    path: /api/docs
  management:
    enabled: true
    port: 8086
    host: 0.0.0.0
    root-path: /q
  shutdown:
    timeout: 30S

# ADR-0155 four-eyes mechanism, opted into by commstyle.publish (ADR-0285 D3). Unlike every
# other four-eyes-wired service (lending, balance, notification, ...), which ship this OFF by
# default and flip it as a separate operational decision, D3 calls four-eyes on publish
# MANDATORY, not phased — a style/playbook version that skips a second pair of eyes is exactly
# the injection-vector risk this ADR exists to close. Default true; still env-overridable for
# an operational break-glass, matching the fleet-wide knob shape.
authz:
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:true}"

"%dev":
  quarkus:
    oidc:
      enabled: false

"%test":
  quarkus:
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_communication_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_communication_it
    devservices:
      enabled: false
    management:
      enabled: false
    oidc:
      enabled: false
  # No OPA sidecar in a bare @QuarkusTest, so the PDP is unresolvable; enforce=false makes
  # AuthorizeInterceptor proceed advisory instead of failing 503 (matches the fleet-wide default
  # every non-agent service ships in production too — mine only deviates for
  # authz.four-eyes.enforce, D3's own mandate, not for the general allow/deny gate). The domain
  # maker!=checker check in CommunicationStyleService.publish is unconditional regardless, so an
  # IT still exercises the real security-relevant branch; it does not exercise the OPA-mediated
  # 202/X-Approval-Id pause, which is the shared AuthorizeInterceptor's own tested mechanism, not
  # this service's.
  authz:
    enforce: false
