openapi: 3.1.0
info:
  title: FX Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). The note here used to describe the
  # 1.2 -> 1.3 bump and was never updated through four more; it now records the CURRENT one.
  # Minor bump (1.7 -> 1.8): additive only — GET /fx/approvals (the checker's queue, issue #5679)
  # plus two additive fields on ApprovalResponse (makerId, createdAt), and a shared
  # ApprovalResponse schema now $ref'd from PATCH /approvals/{id} too. No breaking change.
  version: 1.8.0
  description: >-
    Foreign exchange rates and currency conversion. On convert, the converting party's name is
    synchronously screened against the sanctions lists (ADR-0032): a clean party settles the
    conversion (SETTLED), a sanctions hit fails it (FAILED) with a CRITICAL AML case opened, and a
    sub-threshold potential hit or a screening-service outage holds the conversion in PENDING for
    review (fail-closed — never settled un-screened). PATCH /approvals/{id} decides a four-eyes
    approval paused by the platform's ADR-0155 maker-checker gate on `fx.convert` (maker != checker).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8119
    description: Local development
tags:
  - name: FX

paths:
  /api/v1/fx/rates:
    get:
      tags: [FX]
      summary: Get all FX rates
      operationId: getAllRates
      responses:
        '200':
          description: All rates
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/rates/{base}/{quote}:
    get:
      tags: [FX]
      summary: Get rate for currency pair
      operationId: getRate
      parameters:
        - name: base
          in: path
          required: true
          schema:
            type: string
            example: EUR
        - name: quote
          in: path
          required: true
          schema:
            type: string
            example: CZK
        - name: source
          in: query
          required: false
          description: >-
            CNB returns the central-bank fixing (the exact stored direction, never derived).
            Omitted returns the commercial quote, which may be derived by inverting the stored pair.
          schema:
            type: string
            enum: [CNB]
        - name: asOf
          in: query
          required: false
          description: >-
            Business day (ISO yyyy-MM-dd) the fixing must have been in effect on, i.e. the row whose
            stored validity window contains the start of that day in the CNB publication zone.
            Omitted returns the latest fixing still valid now. Requires source=CNB — any other
            source is answered 400 rather than silently ignoring the date (#3921). A day with no
            fixing in effect is 404, NOT a fallback to the newest one.
          schema:
            type: string
            format: date
            example: '2026-05-30'
      responses:
        '200':
          description: Exchange rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          description: >-
            asOf is not an ISO yyyy-MM-dd date, or was supplied without source=CNB. Both are
            rejected rather than ignored — a silently-dropped date parameter reads as a correct
            backfill while the caller is answered at today's rate (#3921).
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/convert:
    post:
      tags: [FX]
      summary: Convert amount between currencies
      operationId: convertCurrency
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
      responses:
        '200':
          description: Conversion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/rates/{base}/{quote}/history:
    get:
      tags: [FX]
      summary: Historical rates for a currency pair, newest first (including derived inverse pairs)
      operationId: getRateHistory
      parameters:
        - name: base
          in: path
          required: true
          schema: {type: string, example: EUR}
        - name: quote
          in: path
          required: true
          schema: {type: string, example: CZK}
        - name: source
          in: query
          description: Filter by ingestion source (omit for all sources)
          schema:
            type: string
            enum: [ECB, CNB, INTERNAL, REUTERS, BLOOMBERG]
        - name: from
          in: query
          description: ISO-8601 instant — lower bound on validFrom (inclusive)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: ISO-8601 instant — upper bound on validFrom (inclusive)
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          description: Maximum records to return (1–365, default 100)
          schema: {type: integer, default: 100}
        - name: offset
          in: query
          description: Zero-based page offset
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Historical rate records (empty list if none stored yet)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FxRateHistoryItem'
        '400':
          description: Bad query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/cnb/ingest:
    post:
      tags: [FX]
      summary: Ingest the ČNB fixing for a given day (idempotent)
      description: >-
        Pulls the ČNB central-bank fixing (kurz devizového trhu) and stores it. Idempotent — a
        repeated call for the same day does not double-book. Requires ROLE_OPERATOR or ROLE_ADMIN
        (authorize action `fx.trigger`). The same work runs on a scheduler; this is the operator
        re-drive.
      operationId: ingestCnbFixing
      parameters:
        - name: date
          in: query
          description: Fixing day to ingest. Omit for the latest published fixing.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The ingestion result
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/cnb/rates/{base}:
    get:
      tags: [FX]
      summary: The latest ingested ČNB fixing for {base}/CZK
      description: >-
        The quote currency is always CZK — this is the central-bank fixing, not the tradable
        rate served by `/api/v1/fx/rates/{base}/{quote}`. Requires ROLE_VIEWER, ROLE_OPERATOR,
        ROLE_ADMIN or ROLE_PAYMENTS (authorize action `fx.read`).
      operationId: getCnbRate
      parameters:
        - name: base
          in: path
          required: true
          description: Base currency, case-insensitive.
          schema:
            type: string
            example: EUR
      responses:
        '200':
          description: The stored ČNB fixing for {base}/CZK
        '404':
          description: No ČNB rate has been ingested for that pair

  /api/v1/fx/conversions/{id}:
    get:
      tags: [FX]
      summary: Get conversion by ID
      operationId: getConversion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversion detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/approvals:
    get:
      tags: [FX]
      summary: >-
        List pending four-eyes approvals, oldest first — the checker's queue (ADR-0227 D2).
        Without it a decision parked at 202 is discoverable only by whoever was handed its id.
      description: >-
        PENDING maker-checker approvals on `fx.convert`, oldest first. The read side of the
        unified approval inbox — deciding stays on PATCH /api/v1/fx/approvals/{id}. Requires
        ROLE_OPERATOR or ROLE_ADMIN.
      operationId: listPendingApprovals
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fx/approvals/{id}:
    patch:
      tags: [FX]
      summary: Approve or reject a pending four-eyes approval for an FX conversion (ADR-0155)
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          # Keeps the `application/json`/ApiError body the shared `Forbidden` response declares —
          # narrowing this to a description-only response would DROP a declared media type, which
          # oasdiff classifies as breaking and would force a major bump on an additive PR.
          description: >-
            The caller is the maker of this approval, or the OPA policy decision denied the action
            (ADR-0034). Segregation of duties is enforced in RedisApprovalStore.decide, not
            per-service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden — the OPA policy decision denied this action (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ExchangeRateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Identifier of the stored rate row. NULL when the quote was derived by inverting
            the stored pair (#3374) — a derived quote has no row of its own.
        derivedFrom:
          type: string
          format: uuid
          nullable: true
          description: >-
            Identifier of the stored rate this quote was derived from, present exactly when the
            pair was answered by inverting the stored direction (#3374). NULL for a stored quote.
        baseCurrency:
          type: string
        quoteCurrency:
          type: string
        bidRate:
          type: number
        askRate:
          type: number
        rate:
          type: number
        spread:
          type: number
        validFrom:
          type: string
          format: date-time
          description: >-
            Start of this rate's validity window. For a CNB fixing this is the fixing's own business
            day at midnight in the publication zone, i.e. the fixing's identity in time — ledger
            reads it to publish `openbank_fx_fixing_age_seconds` and to key the revaluation entry on
            the fixing it actually marked at (#3921).
        validTo:
          type: string
          format: date-time
        validAt:
          type: string
          format: date-time

    ConvertRequest:
      type: object
      required: [partyId, partyName, fromCurrency, toCurrency, fromAmountMinorUnits]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          nullable: true
        partyName:
          type: string
          description: Name of the converting party, screened against the sanctions lists (ADR-0032).
        fromCurrency:
          type: string
        toCurrency:
          type: string
        fromAmountMinorUnits:
          type: integer
          format: int64

    ConversionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        fromCurrency:
          type: string
        toCurrency:
          type: string
        fromAmount:
          type: number
        toAmount:
          type: number
        appliedRate:
          type: number
        status:
          type: string
          enum: [PENDING, SETTLED, FAILED, REVERSED]
        convertedAt:
          type: string
          format: date-time

    FxRateHistoryItem:
      type: object
      description: A single historical FX rate snapshot (one row of the append-only fx_rates table).
      properties:
        id:
          type: string
          format: uuid
        baseCurrency:
          type: string
          example: EUR
        quoteCurrency:
          type: string
          example: CZK
        bidRate:
          type: string
          description: Bank buy rate (decimal string)
        askRate:
          type: string
          description: Bank sell rate (decimal string)
        midRate:
          type: string
          description: Mid-point of bid and ask — computed val on FxRate domain object, always present
        rateType:
          type: string
          enum: [SPOT, FORWARD, INDICATIVE, INTERBANK]
        source:
          type: string
          enum: [ECB, CNB, INTERNAL, REUTERS, BLOOMBERG]
        validFrom:
          type: string
          format: date-time
          description: When this rate became valid
        validTo:
          type: string
          format: date-time
          description: When this rate expired (or far-future for open-ended rates)
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ApprovalResponse:
      type: object
      description: >-
        A four-eyes approval record (ADR-0155). `makerId` is the principal that requested the
        gated action; a DIFFERENT principal must decide it — enforced in
        RedisApprovalStore.decide, so the queue is readable by anyone who may decide, including
        the maker (seeing a request is not authority over it).
      required: [id, action, status]
      properties:
        id:
          type: string
          description: The value the maker replays as the X-Approval-Id header once approved.
        action:
          type: string
          example: fx.convert
        resourceId:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED]
        makerId:
          type: string
          nullable: true
        createdAt:
          type: string
          description: >-
            Request time. The store expires a PENDING approval after 24h, so age is the only
            visible sign of one about to lapse.
        decidedBy:
          type: string
          nullable: true
