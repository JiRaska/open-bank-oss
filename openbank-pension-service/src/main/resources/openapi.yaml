    put:
      tags: [Pension funding]
      operationId: enrolEmployer
      summary: Authorise an employer to contribute to this contract through its bulk files
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/EmployerPartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateCancelRequest'
      description: >-
        SCA-bound: scaChallengeId must sign `pension-employer-enrolment:<sha256(pension-employer-enrolment|contractId|employerPartyId)>`.
        An already enrolled employer is a no-op.
      responses:
        '204':
          description: Done
        '403': { description: SCA_REJECTED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
