          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Death claims
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeathClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pension death claims]
      operationId: notifyDeath
      summary: "Register a death with evidence (operator); freezes the contract"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyDeathRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeathClaim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/death-claims/{claimId}:
    get:
      tags: [Pension death claims]
      operationId: getDeathClaim
      summary: "One death claim"
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeathClaim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/death-claims/{claimId}/claimants:
    put:
      tags: [Pension death claims]
      operationId: replaceClaimants
      summary: "Replace claimants; shares must total 100"
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimantsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeathClaim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/death-claims/{claimId}/claimants/{claimantId}/verification:
    post:
      tags: [Pension death claims]
      operationId: verifyClaimant
      summary: "KYC-light verification of one claimant"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/ClaimantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyClaimantRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeathClaim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/death-claims/{claimId}/approve:
    post:
      tags: [Pension death claims]
      operationId: approveDeathClaim
      summary: "Four-eyes approval; values the contract and starts the payouts"
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeathClaim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CustomerPartyId:
      name: X-Customer-Party-Id
      in: header
      required: true
      description: The participant party, stamped by the customer edge from the token it validated.
      schema:
        type: string
        format: uuid
    CustomerPartyIdOptional:
      name: X-Customer-Party-Id
      in: header
      required: false
      description: |
        The participant party, stamped by the customer edge. Required for every caller without a
        staff role; a contract belonging to another party answers 404, exactly as an unknown id.
        Staff may omit it to read; every change acts for the participant.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every POST. The first successful response for a key (per caller, participant,
        method and path) is stored, and a retry with the same key is answered from it without
        running the operation again (header `Idempotent-Replayed: true`). A failed attempt is not
        stored, so a corrected retry runs.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ContractId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OnboardingStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OnboardingStatus' }
    TransferStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/TransferStatus' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

    FundingContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployerPartyId:
      name: employerPartyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxYear:
      name: year
      in: path
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2200 }
    UnmatchedStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [OPEN, ASSIGNED, RETURNED] }
    ClawbackOn:
      name: on
      in: query
      required: false
      schema: { type: string, format: date }

    ExitContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimantId:
      name: claimantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Forbidden:
      description: SCA, own-account or role check failed
    Contract:
      description: The contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contract'
    BadRequest:
      description: Malformed request, a missing required field, or a pack rule refused it
    Unauthorized:
      description: Missing or invalid bearer token
    NotFound:
      description: No such contract
    Conflict:
      description: The contract's current state forbids this transition

  schemas:
    ProductLine:
      type: string
      enum: [DPS, DIP]
    ProviderType:
      type: string
      enum: [PENSION_COMPANY, BANK, INVESTMENT_FIRM, MANAGEMENT_COMPANY, INSURANCE_COMPANY]
    ContractStatus:
      type: string
      enum: [DRAFT, PENDING_ACTIVATION, ACTIVE, SUSPENDED, TERMINATING, PAID_OUT, TRANSFERRED_OUT, CLOSED]
    ContributionFrequency:
      type: string
      enum: [MONTHLY, QUARTERLY, ANNUALLY]
    IncentivePeriod:
      type: string
      enum: [MONTH, QUARTER, YEAR]
    Schedule:
      type: object
      required: [amount, currency, frequency]
      properties:
        amount: { type: number, minimum: 0, maximum: 1000000000 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        employerAmount: { type: number, minimum: 0, maximum: 1000000000 }
    Beneficiary:
      type: object
      required: [name, sharePercent]
      properties:
        name: { type: string, minLength: 1 }
        partyId: { type: string, format: uuid }
        sharePercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
    CreateContractRequest:
      type: object
      required: [productLine, jurisdiction, providerEntityId, providerType, birthDate, schedule, strategyCode]
      properties:
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string, description: Jurisdiction code selecting the pack }
        providerEntityId: { type: string, format: uuid }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        birthDate: { type: string, format: date }
        residencyCountry: { type: string }
        residencyEvidence:
          type: array
          items: { type: string }
        hasGuardian: { type: boolean }
        schedule: { $ref: '#/components/schemas/Schedule' }
        strategyCode: { type: string, minLength: 1 }
        beneficiaries:
          type: array
          description: Shares must total 100 when any are given.
          items: { $ref: '#/components/schemas/Beneficiary' }
    ElectStrategyRequest:
      type: object
      required: [strategyCode]
      properties:
        strategyCode: { type: string, minLength: 1 }
        effectiveFrom: { type: string, format: date, description: Defaults to today; never in the past }
    IncentiveEvaluationRequest:
      type: object
      required: [contribution, period]
      properties:
        contribution: { type: number, minimum: 0, maximum: 1000000000 }
        period: { $ref: '#/components/schemas/IncentivePeriod' }
        employerContributionAnnual: { type: number, minimum: 0, maximum: 1000000000 }
        sharedCapUsed:
          type: object
          description: Annual cap already consumed by other products, per shared-cap group.
          additionalProperties: { type: number, minimum: 0, maximum: 1000000000 }
    StrategyElection:
      type: object
      properties:
        strategyCode: { type: string }
        effectiveFrom: { type: string, format: date }
        electedAt: { type: string, format: date-time }
    Contract:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        participantPartyId: { type: string, format: uuid }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        packVersion: { type: integer }
        providerEntityId: { type: string, format: uuid }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        status: { $ref: '#/components/schemas/ContractStatus' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        currentStrategy: { $ref: '#/components/schemas/StrategyElection' }
        strategyHistory:
          type: array
          items: { $ref: '#/components/schemas/StrategyElection' }
        beneficiaries:
          type: array
          items: { $ref: '#/components/schemas/Beneficiary' }
        startDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncentiveResult:
      type: object
      properties:
        incentiveId: { type: string }
        type: { type: string, enum: [MATCHING, FLAT, TAX_RELIEF, EMPLOYER_EXEMPTION] }
        period: { $ref: '#/components/schemas/IncentivePeriod' }
        amount: { type: number }
        indicativeSaving: { type: [number, 'null'] }
        claimChannel: { type: string, enum: [STATE_AGENCY_BATCH, TAX_RETURN, PAYROLL, NONE] }
        explanation: { type: string }
    OnboardingStatus:
      type: string
      enum: [STARTED, QUESTIONNAIRE_SUBMITTED, KID_ISSUED, KID_ACCEPTED, SIGNED, ACTIVATED, REJECTED, WITHDRAWN, EXPIRED, TRANSFER_FAILED, ABANDONED]
    TransferStatus:
      type: string
      enum: [AWAITING_CONSENT, REQUESTED, SENT, ACCEPTED, FUNDS_RECEIVED, VALUATED, SETTLED, COMPLETED, REJECTED, TIMED_OUT, CANCELLED, FAILED]
    OnboardingKind:
      type: string
      enum: [NEW_CONTRACT, TRANSFER_IN]
    EsgPreference:
      type: string
      enum: [NONE, CONSIDER, REQUIRED]
    StartApplicationRequest:
      type: object
      required: [productLine, jurisdiction, providerEntityId, providerType, schedule, birthDate]
      properties:
        kind: { $ref: '#/components/schemas/OnboardingKind' }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        providerEntityId: { type: string, format: uuid }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        schedule:
          type: object
          required: [amount, currency, frequency]
          properties:
            amount: { type: number }
            currency: { type: string }
            frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
            employerAmount: { type: number }
        birthDate: { type: string, format: date }
        residencyCountry: { type: string }
        residencyEvidence: { type: array, items: { type: string } }
        onBehalfOfPartyId:
          type: string
          format: uuid
          description: A guardian applying for a ward; honoured only after party-service verifies the relation.
        transferIn:
          type: object
          required: [providerId, providerName, contractNumber]
          properties:
            providerId: { type: string }
            providerName: { type: string }
            contractNumber: { type: string }
    QuestionnaireRequest:
      type: object
      required: [riskAppetite, lossTolerance, financialSituationStable]
      properties:
        knowledgeLevel: { type: integer, minimum: 0, maximum: 3 }
        experienceLevel: { type: integer, minimum: 0, maximum: 3 }
        riskAppetite: { type: integer, minimum: 0, maximum: 3 }
        lossTolerance: { type: integer, minimum: 0, maximum: 3 }
        financialSituationStable: { type: boolean }
        esgPreference: { $ref: '#/components/schemas/EsgPreference' }
    ChooseStrategyRequest:
      type: object
      properties:
        strategyCode: { type: string, description: Omitted to accept the recommendation }
        acknowledgeWarning: { type: boolean }
        language: { type: string }
    AcceptKidRequest:
      type: object
      required: [documentId]
      properties:
        documentId: { type: string }
    SignRequest:
      type: object
      required: [scaChallengeId]
      properties:
        scaChallengeId: { type: string }
    TransferConsentRequest:
      type: object
      required: [scaChallengeId]
      properties:
        scaChallengeId: { type: string }
    StrategyRecommendation:
      type: object
      properties:
        recommendedStrategy: { type: string }
        suitableStrategies: { type: array, items: { type: string } }
        maxRiskClass: { type: integer }
        yearsToRetirement: { type: integer }
        reasons:
          type: array
          items:
            type: string
            enum: [LIFECYCLE_DEFAULT, HIGHEST_SUITABLE_RISK, SUSTAINABLE_PREFERRED, NO_SUITABLE_STRATEGY_FALLBACK_MOST_CONSERVATIVE, NO_SUSTAINABLE_STRATEGY_AVAILABLE]
    OnboardingApplication:
      type: object
      properties:
        applicationId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OnboardingKind' }
        status: { $ref: '#/components/schemas/OnboardingStatus' }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        packVersion: { type: integer }
        rejectionReasons: { type: array, items: { type: string } }
        recommendedStrategy: { type: [string, 'null'] }
        chosenStrategy: { type: [string, 'null'] }
        unsuitableChoiceAcknowledged: { type: boolean }
        keyInformationDocumentId: { type: [string, 'null'] }
        keyInformationDocumentSha256: { type: [string, 'null'] }
        kidAcceptedAt: { type: [string, 'null'], format: date-time }
        signedAt: { type: [string, 'null'], format: date-time }
        contractId: { type: [string, 'null'], format: uuid }
        transferRequestId: { type: [string, 'null'], format: uuid }
        coolingOffEndsOn: { type: [string, 'null'], format: date }
        expiresOn: { type: string, format: date }
        closedReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QuestionnaireResponse:
      type: object
      properties:
        application: { $ref: '#/components/schemas/OnboardingApplication' }
        recommendation: { $ref: '#/components/schemas/StrategyRecommendation' }
    OperatorApplication:
      type: object
      properties:
        partyId: { type: string, format: uuid }
        application: { $ref: '#/components/schemas/OnboardingApplication' }
    TransferOutRequest:
      type: object
      required: [contractId, receivingProviderId, receivingProviderName, receivingContractNumber]
      properties:
        contractId: { type: string, format: uuid }
        receivingProviderId: { type: string }
        receivingProviderName: { type: string }
        receivingContractNumber: { type: string }
        scaChallengeId: { type: string, description: Required when the participant requests it }
    CounterpartyResponseRequest:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        reason: { type: string }
    IncentiveHistoryEntry:
      type: object
      required: [incentiveId, year, amount]
      properties:
        incentiveId: { type: string }
        year: { type: integer }
        amount: { type: number }
    FundsReceivedRequest:
      type: object
      required: [amount, currency, originalStartDate]
      properties:
        amount: { type: number }
        currency: { type: string }
        originalStartDate: { type: string, format: date }
        incentiveHistory: { type: array, items: { $ref: '#/components/schemas/IncentiveHistoryEntry' } }
    TransferRequest:
      type: object
      properties:
        transferId: { type: string, format: uuid }
        direction: { type: string, enum: [IN, OUT] }
        origin: { type: string, enum: [PARTICIPANT, RECEIVING_PROVIDER] }
        contractId: { type: string, format: uuid }
        counterpartyProviderId: { type: string }
        counterpartyProviderName: { type: string }
        counterpartyContractNumber: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        deadline: { type: string, format: date }
        grossAmount: { type: [number, 'null'] }
        fee: { type: [number, 'null'] }
        netAmount: { type: [number, 'null'] }
        currency: { type: string }
        originalStartDate: { type: [string, 'null'], format: date }
        incentiveHistory: { type: array, items: { $ref: '#/components/schemas/IncentiveHistoryEntry' } }
        failureReason: { type: [string, 'null'] }
        compensation: { type: string, enum: [NONE, CONTRACT_CLOSED, CEDING_CANCELLED_AND_CONTRACT_CLOSED, REDEMPTION_REVERSED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # --- ADR-0334 S3 ---
    PaymentReference:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        reference: { type: string }
    Mandate:
      type: object
      properties:
        mandateId: { type: string }
    MandateSetupRequest:
      type: object
      required: [kind, debtorIban, amount, currency, firstCollection]
      properties:
        kind: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT] }
        debtorIban: { type: string }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        firstCollection: { type: string, format: date }
    Contribution:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        paymentId: { type: string }
        source: { type: string, enum: [PARTICIPANT, EMPLOYER, STATE, TRANSFER_IN] }
        channel: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT, BANK_TRANSFER, EMPLOYER_BATCH, STATE_INCENTIVE, TRANSFER] }
        amount: { type: number }
        currency: { type: string }
        valueDate: { type: string, format: date }
        taxYear: { type: integer }
        employerPartyId: { type: [string, 'null'], format: uuid }
        subscriptionOrderId: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
    IncomingPayment:
      type: object
      required: [paymentId, amount, currency, valueDate]
      properties:
        paymentId: { type: string, maxLength: 120, description: "Idempotency key; a redelivered payment credits once." }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        valueDate: { type: string, format: date }
        reference: { type: string, maxLength: 64 }
        channel: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT, BANK_TRANSFER, EMPLOYER_BATCH, STATE_INCENTIVE, TRANSFER] }
        payerAccount: { type: string, maxLength: 64 }
    Receipt:
      type: object
      properties:
        outcome: { type: string, enum: [CREDITED, DUPLICATE, UNMATCHED] }
        contribution: { $ref: '#/components/schemas/Contribution' }
        unmatched: { $ref: '#/components/schemas/UnmatchedPayment' }
    UnmatchedPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string }
        amount: { type: number }
        currency: { type: string }
        valueDate: { type: string, format: date }
        reference: { type: [string, 'null'] }
        reason: { type: string, enum: [NO_REFERENCE, UNKNOWN_REFERENCE, CONTRACT_NOT_ACCEPTING, CURRENCY_MISMATCH, EMPLOYER_LINE, EMPLOYER_NOT_AUTHORISED] }
        status: { type: string, enum: [OPEN, ASSIGNED, RETURNED] }
        resolvedContractId: { type: [string, 'null'], format: uuid }
        resolvedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    EmployerBatchRequest:
      type: object
      required: [employerPartyId, payment, lines]
      properties:
        employerPartyId: { type: string, format: uuid }
        payment: { $ref: '#/components/schemas/IncomingPayment' }
        lines:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [contractReference, amount]
            properties:
              contractReference: { type: string, maxLength: 64 }
              amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
    EmployerLineResult:
      type: object
      properties:
        lineNo: { type: integer }
        contractReference: { type: string }
        amount: { type: number }
        outcome: { type: string, enum: [CREDITED, DUPLICATE, UNMATCHED] }
    AssignUnmatchedRequest:
      type: object
      required: [contractId]
      properties:
        contractId: { type: string, format: uuid }
    ClaimRunRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
    ReceiptFileRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: string }
    IncentiveClaim:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        incentiveId: { type: string }
        period: { type: string }
        basis: { type: number }
        claimedAmount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING, SUBMITTED, RECEIVED, REJECTED, RETURNED] }
        batchId: { type: [string, 'null'], format: uuid }
        receivedAmount: { type: [number, 'null'] }
        rejectionReason: { type: [string, 'null'] }
    IncentiveStatus:
      type: object
      properties:
        claims:
          type: array
          items: { $ref: '#/components/schemas/IncentiveClaim' }
        balances:
          type: array
          items:
            type: object
            properties:
              incentiveId: { type: string }
              received: { type: number }
              returned: { type: number }
              net: { type: number }
    ClaimBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        claimFormat: { type: string }
        period: { type: string }
        claimIds:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [SUBMITTED, RECONCILED] }
        payload: { type: string }
        createdAt: { type: string, format: date-time }
    ClaimRun:
      type: object
      properties:
        claimsCreated: { type: integer }
