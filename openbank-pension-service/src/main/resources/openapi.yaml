    put:
      tags: [Pension exit]
      operationId: changePayoutAccount
      summary: Move the remaining payments of a running scheduled payout to another verified own account
      description: |
        SCA-bound: `scaChallengeId` must be signed over this payout and the new IBAN, and the IBAN
        must be a verified account of the participant. Fraud controls: the change is HELD for
        3 days and applies only to installments due after that; the participant is notified at
        once; a single payment or anything already signed is never redirected; a concurrent
        confirmation, installment or second change loses with 409 (optimistic lock).
