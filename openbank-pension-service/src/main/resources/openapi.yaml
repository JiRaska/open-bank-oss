        ownContributions: { type: number }
        employerContributions: { type: number }
        stateIncentives: { type: number }
        projectedValue: { type: number }
    Simulation:
      type: object
      properties:
        illustrative: { type: boolean, const: true }
        disclaimer: { type: string }
        jurisdiction: { type: string }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        packVersion: { type: integer }
        currency: { type: string }
        horizonYears: { type: integer }
        requestedStrategy: { type: [string, 'null'] }
        projections:
          type: array
          items: { $ref: '#/components/schemas/StrategyProjection' }
