openapi: 3.1.0
info:
  title: OpenBank Pension Service API
  # 1.0.0: first contract (ADR-0334 slice S1, issue #12350).
  version: 1.0.0
  description: |
    Participant-side pension contracts (ADR-0334). A contract is created under the jurisdiction
    pack in force on its creation date and PINS that pack version for life; incentive evaluation
    and the early-termination preview always use the pinned version. Pack values are reference
    data pending legal review, not advice.
servers:
  - url: http://localhost:8171
tags:
  - name: Pension
security:
  - bearerAuth: []

paths:
  /api/v1/pension/contracts:
    post:
      tags: [Pension]
      operationId: createContract
      summary: Create a DRAFT contract under the jurisdiction pack in force today
      description: |
        Refused with 400 when no pack is in force for the jurisdiction and product line, when the
        provider type is not permitted by the pack, when the currency differs from the pack's, or
        when the participant fails the pack's eligibility rules.
      parameters:
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Draft contract created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/pension/contracts/{id}:
    get:
      tags: [Pension]
      operationId: getContract
      summary: Read one contract with its strategy history
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/contracts/{id}/submit:
    post:
      tags: [Pension]
      operationId: submitContract
      summary: DRAFT -> PENDING_ACTIVATION
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/contracts/{id}/activate:
    post:
      tags: [Pension]
      operationId: activateContract
      summary: PENDING_ACTIVATION -> ACTIVE; the start date is set today
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/contracts/{id}/suspend:
    post:
      tags: [Pension]
      operationId: suspendContributions
      summary: "Pause contributions: ACTIVE -> SUSPENDED"
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/contracts/{id}/resume:
    post:
      tags: [Pension]
      operationId: resumeContributions
      summary: "Resume contributions: SUSPENDED -> ACTIVE"
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/contracts/{id}/strategy:
    put:
      tags: [Pension]
      operationId: electStrategy
      summary: Elect or change the investment strategy; earlier elections stay as history
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectStrategyRequest'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/contracts/{id}/incentive-evaluation:
    post:
      tags: [Pension]
      operationId: evaluateIncentives
      summary: Evaluate the pinned pack's incentives for one contribution amount
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncentiveEvaluationRequest'
      responses:
        '200':
          description: One result per incentive rule of the pinned pack
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncentiveResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/contracts/{id}/early-termination:
    post:
      tags: [Pension]
      operationId: requestEarlyTermination
      summary: "Surrender preview; with confirm=true the contract moves to TERMINATING"
      description: |
        The unit register is not built yet (ADR-0334 pension-fund-service), so the current value
        and the incentive history are supplied by the caller; the preview is arithmetic over the
        pinned pack, not a valuation.
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EarlyTerminationRequest'
      responses:
        '200':
          description: Surrender preview, and the contract after the optional transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarlyTermination'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --- ADR-0334 S3: contributions & state incentives (info.version bumped once at integration) ---
  /api/v1/pension/funding/contracts/{contractId}/payment-reference:
    get:
      tags: [Pension funding]
      operationId: getPaymentReference
      summary: The reference a payer quotes so a payment matches this contract
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReference'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/funding/contracts/{contractId}/contributions:
    get:
      tags: [Pension funding]
      operationId: listContributions
      summary: Every contribution credited to the contract, oldest first
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contribution'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/funding/contracts/{contractId}/mandates:
    post:
      tags: [Pension funding]
      operationId: setUpMandate
      summary: Set up a standing order or SEPA direct debit quoting the contract reference
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateSetupRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/contracts/{contractId}/employers/{employerPartyId}:
    put:
      tags: [Pension funding]
      operationId: enrolEmployer
      summary: Authorise an employer to contribute to this contract through its bulk files
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/EmployerPartyId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '204':
          description: Done
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/contracts/{contractId}/incentives:
    get:
      tags: [Pension funding]
      operationId: getIncentiveStatus
      summary: Incentive claims and the per-incentive ledger balance
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncentiveStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/funding/contracts/{contractId}/tax-years/{year}:
    get:
      tags: [Pension funding]
      operationId: getTaxYear
      summary: Contributions by source, incentives and deductible amount for one tax year
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/TaxYear'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxYearSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/funding/contracts/{contractId}/tax-years/{year}/external-cap-usage:
    put:
      tags: [Pension funding]
      operationId: declareExternalCapUsage
      summary: Declare shared-cap usage at other providers for the tax year
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/TaxYear'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCapUsageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxYearSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/operations/payments:
    post:
      tags: [Pension funding operations]
      operationId: ingestPayment
      summary: Ingest a payment from the collection account; matched by reference or parked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingPayment'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
  /api/v1/pension/funding/operations/employer-batches:
    post:
      tags: [Pension funding operations]
      operationId: ingestEmployerBatch
      summary: One employer's bulk contribution file covering one payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerBatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployerLineResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
  /api/v1/pension/funding/operations/unmatched:
    get:
      tags: [Pension funding operations]
      operationId: listUnmatched
      summary: The unmatched-payment queue, optionally filtered by status
      parameters:
        - $ref: '#/components/parameters/UnmatchedStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnmatchedPayment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
  /api/v1/pension/funding/operations/unmatched/{id}/assign:
    post:
      tags: [Pension funding operations]
      operationId: assignUnmatched
      summary: Attribute a parked payment to a contract and credit it
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUnmatchedRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/operations/unmatched/{id}/return:
    post:
      tags: [Pension funding operations]
      operationId: returnUnmatched
      summary: Mark a parked payment for return to the payer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmatchedPayment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/operations/claim-runs:
    post:
      tags: [Pension funding operations]
      operationId: runClaims
      summary: Generate the claims of a closed month and file every PENDING claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRunRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimRun'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
  /api/v1/pension/funding/operations/claim-batches:
    get:
      tags: [Pension funding operations]
      operationId: listClaimBatches
      summary: Filed claim batches, newest first, with their filed payload
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimBatch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
  /api/v1/pension/funding/operations/claim-batches/{id}/receipt:
    post:
      tags: [Pension funding operations]
      operationId: applyClaimReceipt
      summary: Apply the agency's receipt file, crediting accepted claims and rejecting the rest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptFileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimBatch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/operations/claims/{id}/return:
    post:
      tags: [Pension funding operations]
      operationId: returnClaim
      summary: Return a received incentive to the agency; writes a RETURNED ledger entry
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncentiveClaim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pension/funding/operations/contracts/{contractId}/clawback-preview:
    get:
      tags: [Pension funding operations]
      operationId: previewClawback
      summary: What an early exit on the given date would have to return, per incentive
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/ClawbackOn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClawbackItem'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pension/funding/operations/contracts/{contractId}/tax-years/{year}/certificate:
    post:
      tags: [Pension funding operations]
      operationId: issueTaxCertificate
      summary: Freeze a closed tax year and issue its tax certificate
      parameters:
        - $ref: '#/components/parameters/FundingContractId'
        - $ref: '#/components/parameters/TaxYear'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxYearSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff only
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CustomerPartyId:
      name: X-Customer-Party-Id
      in: header
      required: true
      description: The participant party, stamped by the customer edge from the token it validated.
      schema:
        type: string
        format: uuid
    CustomerPartyIdOptional:
      name: X-Customer-Party-Id
      in: header
      required: false
      description: |
        The participant party, stamped by the customer edge. Required for every caller without a
        staff role; a contract belonging to another party answers 404, exactly as an unknown id.
        Staff may omit it to read; every change acts for the participant.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every POST. On create, a retry with the same key for the same participant
        returns the contract the first attempt created. Lifecycle actions are idempotent by state:
        a retry that finds the contract already in the target state returns it unchanged.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ContractId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FundingContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployerPartyId:
      name: employerPartyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxYear:
      name: year
      in: path
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2200 }
    UnmatchedStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [OPEN, ASSIGNED, RETURNED] }
    ClawbackOn:
      name: on
      in: query
      required: false
      schema: { type: string, format: date }

  responses:
    Contract:
      description: The contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contract'
    BadRequest:
      description: Malformed request, a missing required field, or a pack rule refused it
    Unauthorized:
      description: Missing or invalid bearer token
    NotFound:
      description: No such contract
    Conflict:
      description: The contract's current state forbids this transition

  schemas:
    ProductLine:
      type: string
      enum: [DPS, DIP]
    ProviderType:
      type: string
      enum: [PENSION_COMPANY, BANK, INVESTMENT_FIRM, MANAGEMENT_COMPANY, INSURANCE_COMPANY]
    ContractStatus:
      type: string
      enum: [DRAFT, PENDING_ACTIVATION, ACTIVE, SUSPENDED, TERMINATING, PAID_OUT, TRANSFERRED_OUT, CLOSED]
    ContributionFrequency:
      type: string
      enum: [MONTHLY, QUARTERLY, ANNUALLY]
    IncentivePeriod:
      type: string
      enum: [MONTH, QUARTER, YEAR]
    Schedule:
      type: object
      required: [amount, currency, frequency]
      properties:
        amount: { type: number, minimum: 0, maximum: 1000000000 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        employerAmount: { type: number, minimum: 0, maximum: 1000000000 }
    Beneficiary:
      type: object
      required: [name, sharePercent]
      properties:
        name: { type: string, minLength: 1 }
        partyId: { type: string, format: uuid }
        sharePercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
    CreateContractRequest:
      type: object
      required: [productLine, jurisdiction, providerEntityId, providerType, birthDate, schedule, strategyCode]
      properties:
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string, description: Jurisdiction code selecting the pack }
        providerEntityId: { type: string, format: uuid }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        birthDate: { type: string, format: date }
        residencyCountry: { type: string }
        residencyEvidence:
          type: array
          items: { type: string }
        hasGuardian: { type: boolean }
        schedule: { $ref: '#/components/schemas/Schedule' }
        strategyCode: { type: string, minLength: 1 }
        beneficiaries:
          type: array
          description: Shares must total 100 when any are given.
          items: { $ref: '#/components/schemas/Beneficiary' }
    ElectStrategyRequest:
      type: object
      required: [strategyCode]
      properties:
        strategyCode: { type: string, minLength: 1 }
        effectiveFrom: { type: string, format: date, description: Defaults to today; never in the past }
    IncentiveEvaluationRequest:
      type: object
      required: [contribution, period]
      properties:
        contribution: { type: number, minimum: 0, maximum: 1000000000 }
        period: { $ref: '#/components/schemas/IncentivePeriod' }
        employerContributionAnnual: { type: number, minimum: 0, maximum: 1000000000 }
        sharedCapUsed:
          type: object
          description: Annual cap already consumed by other products, per shared-cap group.
          additionalProperties: { type: number, minimum: 0, maximum: 1000000000 }
    EarlyTerminationRequest:
      type: object
      required: [currentValue]
      properties:
        currentValue: { type: number, minimum: 0, maximum: 1000000000 }
        incentivesReceived:
          type: object
          description: Incentive id -> (calendar year -> amount received).
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        confirm: { type: boolean, description: When true the contract moves to TERMINATING }
    StrategyElection:
      type: object
      properties:
        strategyCode: { type: string }
        effectiveFrom: { type: string, format: date }
        electedAt: { type: string, format: date-time }
    Contract:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        participantPartyId: { type: string, format: uuid }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        packVersion: { type: integer }
        providerEntityId: { type: string, format: uuid }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        status: { $ref: '#/components/schemas/ContractStatus' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        currentStrategy: { $ref: '#/components/schemas/StrategyElection' }
        strategyHistory:
          type: array
          items: { $ref: '#/components/schemas/StrategyElection' }
        beneficiaries:
          type: array
          items: { $ref: '#/components/schemas/Beneficiary' }
        startDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncentiveResult:
      type: object
      properties:
        incentiveId: { type: string }
        type: { type: string, enum: [MATCHING, FLAT, TAX_RELIEF, EMPLOYER_EXEMPTION] }
        period: { $ref: '#/components/schemas/IncentivePeriod' }
        amount: { type: number }
        indicativeSaving: { type: [number, 'null'] }
        claimChannel: { type: string, enum: [STATE_AGENCY_BATCH, TAX_RETURN, PAYROLL, NONE] }
        explanation: { type: string }
    EarlyTermination:
      type: object
      properties:
        contract: { $ref: '#/components/schemas/Contract' }
        payoutConditionsMet: { type: boolean }
        ageAtExit: { type: integer }
        durationMonths: { type: integer }
        earlyWithdrawalAllowed: { type: boolean }
        currentValue: { type: number }
        fee: { type: number }
        clawbacks:
          type: array
          items:
            type: object
            properties:
              incentiveId: { type: string }
              mode: { type: string, enum: [RETURN_ALL, RECAPTURE_YEARS] }
              amount: { type: number }
        estimatedNetPayout: { type: number }
        notes:
          type: array
          items: { type: string }

    # --- ADR-0334 S3 ---
    PaymentReference:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        reference: { type: string }
    Mandate:
      type: object
      properties:
        mandateId: { type: string }
    MandateSetupRequest:
      type: object
      required: [kind, debtorIban, amount, currency, firstCollection]
      properties:
        kind: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT] }
        debtorIban: { type: string }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        firstCollection: { type: string, format: date }
    Contribution:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        paymentId: { type: string }
        source: { type: string, enum: [PARTICIPANT, EMPLOYER, STATE, TRANSFER_IN] }
        channel: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT, BANK_TRANSFER, EMPLOYER_BATCH, STATE_INCENTIVE] }
        amount: { type: number }
        currency: { type: string }
        valueDate: { type: string, format: date }
        taxYear: { type: integer }
        employerPartyId: { type: [string, 'null'], format: uuid }
        subscriptionOrderId: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
    IncomingPayment:
      type: object
      required: [paymentId, amount, currency, valueDate]
      properties:
        paymentId: { type: string, maxLength: 120, description: "Idempotency key; a redelivered payment credits once." }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        valueDate: { type: string, format: date }
        reference: { type: string, maxLength: 64 }
        channel: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT, BANK_TRANSFER, EMPLOYER_BATCH, STATE_INCENTIVE] }
        payerAccount: { type: string, maxLength: 64 }
    Receipt:
      type: object
      properties:
        outcome: { type: string, enum: [CREDITED, DUPLICATE, UNMATCHED] }
        contribution: { $ref: '#/components/schemas/Contribution' }
        unmatched: { $ref: '#/components/schemas/UnmatchedPayment' }
    UnmatchedPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string }
        amount: { type: number }
        currency: { type: string }
        valueDate: { type: string, format: date }
        reference: { type: [string, 'null'] }
        reason: { type: string, enum: [NO_REFERENCE, UNKNOWN_REFERENCE, CONTRACT_NOT_ACCEPTING, CURRENCY_MISMATCH, EMPLOYER_LINE, EMPLOYER_NOT_AUTHORISED] }
        status: { type: string, enum: [OPEN, ASSIGNED, RETURNED] }
        resolvedContractId: { type: [string, 'null'], format: uuid }
        resolvedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    EmployerBatchRequest:
      type: object
      required: [employerPartyId, payment, lines]
      properties:
        employerPartyId: { type: string, format: uuid }
        payment: { $ref: '#/components/schemas/IncomingPayment' }
        lines:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [contractReference, amount]
            properties:
              contractReference: { type: string, maxLength: 64 }
              amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
    EmployerLineResult:
      type: object
      properties:
        lineNo: { type: integer }
        contractReference: { type: string }
        amount: { type: number }
        outcome: { type: string, enum: [CREDITED, DUPLICATE, UNMATCHED] }
    AssignUnmatchedRequest:
      type: object
      required: [contractId]
      properties:
        contractId: { type: string, format: uuid }
    ClaimRunRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
    ReceiptFileRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: string }
    IncentiveClaim:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        incentiveId: { type: string }
        period: { type: string }
        basis: { type: number }
        claimedAmount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING, SUBMITTED, RECEIVED, REJECTED, RETURNED] }
        batchId: { type: [string, 'null'], format: uuid }
        receivedAmount: { type: [number, 'null'] }
        rejectionReason: { type: [string, 'null'] }
    IncentiveStatus:
      type: object
      properties:
        claims:
          type: array
          items: { $ref: '#/components/schemas/IncentiveClaim' }
        balances:
          type: array
          items:
            type: object
            properties:
              incentiveId: { type: string }
              received: { type: number }
              returned: { type: number }
              net: { type: number }
    ClaimBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        claimFormat: { type: string }
        period: { type: string }
        claimIds:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [SUBMITTED, RECONCILED] }
        payload: { type: string }
        createdAt: { type: string, format: date-time }
    ClaimRun:
      type: object
      properties:
        claimsCreated: { type: integer }
        batches:
          type: array
          items: { $ref: '#/components/schemas/ClaimBatch' }
        unfiledFormats:
          type: array
          items: { type: string }
    ExternalCapUsageRequest:
      type: object
      required: [usage]
      properties:
        usage:
          type: object
          additionalProperties: { type: number, minimum: 0 }
    TaxYearSummary:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        taxYear: { type: integer }
        currency: { type: string }
        participantContributions: { type: number }
        employerContributions: { type: number }
        stateIncentives: { type: number }
        transferIn: { type: number }
        deductibleAmount: { type: number }
        indicativeTaxSaving: { type: [number, 'null'] }
        sharedCapUsedElsewhere:
          type: object
          additionalProperties: { type: number }
        employerExemptions:
          type: array
          items:
            type: object
            properties:
              employerPartyId: { type: string, format: uuid }
              contributed: { type: number }
              exempt: { type: number }
              taxable: { type: number }
        employerExempt: { type: number }
        employerTaxable: { type: number }
        finalized: { type: boolean }
        certificateDocumentId: { type: [string, 'null'] }
    ClawbackItem:
      type: object
      properties:
        incentiveId: { type: string }
        kind: { type: string, enum: [RETURN_TO_AGENCY, TAX_RECAPTURE] }
        amount: { type: number }
        taxYears:
          type: array
          items: { type: integer }
