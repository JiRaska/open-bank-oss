    post:
      tags: [Pension funding]
      operationId: cancelMandate
      summary: Cancel a standing order or SEPA direct-debit mandate of this contract (SCA-bound)
      description: >-
        The mandate must have been set up for this contract; any other id is a 404. The SCA
        challenge signs SHA-256 of `pension-mandate-cancel|{contractId}|{mandateId}` (#12378).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FundingContractId'
        - name: mandateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateCancelRequest'
      responses:
        '200':
          description: Cancelled (or already cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Strong customer authentication failed.
        '404': { $ref: '#/components/responses/NotFound' }
