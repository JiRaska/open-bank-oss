        monthlyContribution: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        employerMonthlyContribution: { type: number, minimum: 0, maximum: 1000000 }
        horizonYears: { type: integer, minimum: 1, maximum: 60 }
    StrategyProjection:
      type: object
      properties:
        strategyCode: { type: string }
