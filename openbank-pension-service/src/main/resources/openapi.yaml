openapi: 3.1.0
info:
  title: OpenBank Pension Service API
  # 1.0.0: first contract (ADR-0334 slice S1, issue #12350).
  # 1.1.0: integration of slices S2 (onboarding, transfers), S3 (contributions, incentives) and S5
  #        (termination, payout, death) plus the S8 routes: contract list, simulation, payout
  #        account change, operator payout and death-claim lists, Idempotency-Key on every POST.
  #        The removed /activate and /early-termination routes were published in
  #        pension-service-v0.2.0 (API 1.0.0); their removal requires the 2.0.0 migration below.
  # 1.2.0: final integration of follow-ups F1-F7 (schedule and beneficiary changes, payment adapters,
  #        identity and SCA adapters, documents and notices, CZ state contribution and returns,
  #        annuity partners, questionnaire). These additions and SCA-bound requirements
  #        were incorporated into the 2.0.0 contract migration below.
  # 1.3.0: additive (#12350) — participant valuation and unit transactions per contract, composed
  #        from pension-fund-service, and the staff operator mandates list. MINOR per ADR-0048.
  # 2.0.0: MAJOR (ADR-0048 D5/D2) — URL major moves to /api/v2. Measured against main, where
  #        1.0.0 is released (pension-service 0.2.0): oasdiff reports three ERR-level changes —
  #        POST /contracts/{id}/activate and /early-termination removed without deprecation, and
  #        PUT /contracts/{id}/strategy gains a required request parameter (SCA). /activate
  #        cannot stay: it activates a contract outside the onboarding workflow and so skips KID,
  #        SCA and cooling-off. No deprecation window either, for the same reason, and no
  #        exemption applies (check-api-contract.py has none for an undeployed service). /api/v1
  #        is therefore not served at all; every route moved unchanged to /api/v2.
  version: 2.0.0
  description: |
    Participant-side pension contracts (ADR-0334). A contract is created under the jurisdiction
    pack in force on its creation date and PINS that pack version for life; incentive evaluation
    and every exit quote always use the pinned version. Pack values are reference
    data pending legal review, not advice.
    Contract and onboarding creation accept only the deployment's configured providerEntityId;
    a different providerEntityId is a bad request. This creation constraint does not provide
    multi-provider authorization or isolation of existing data.
servers:
  - url: http://localhost:8171
tags:
  - name: Pension
  - name: Pension onboarding
  - name: Pension transfers
  - name: Pension provider transfers
  - name: Pension operations
  - name: Pension valuation
  - name: Pension exit
  - name: Pension death claims
  - name: Pension simulation
  - name: Pension contract changes
  - name: Pension annuity
security:
  - bearerAuth: []

paths:
  /api/v2/pension/contracts:
    get:
      tags: [Pension]
      operationId: listContracts
      summary: The participant's own contracts (edge), or staff - contracts by status, newest first
      parameters:
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ContractStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Contracts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pension]
      operationId: createContract
      summary: Create a DRAFT contract under the jurisdiction pack in force today
      description: |
        Refused with 400 when no pack is in force for the jurisdiction and product line, when the
        provider type is not permitted by the pack, when the currency differs from the pack's, or
        when the participant fails the pack's eligibility rules.
      parameters:
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Draft contract created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/pension/contracts/{id}:
    get:
      tags: [Pension]
      operationId: getContract
      summary: Read one contract with its strategy history
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/pension/contracts/{id}/submit:
    post:
      tags: [Pension]
      operationId: submitContract
      summary: DRAFT -> PENDING_ACTIVATION
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{id}/suspend:
    post:
      tags: [Pension]
      operationId: suspendContributions
      summary: "Pause contributions: ACTIVE -> SUSPENDED"
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{id}/resume:
    post:
      tags: [Pension]
      operationId: resumeContributions
      summary: "Resume contributions: SUSPENDED -> ACTIVE"
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{id}/strategy:
    put:
      tags: [Pension]
      operationId: electStrategy
      summary: Elect or change the investment strategy; earlier elections stay as history
      description: >-
        One guarded path for every strategy change: ownership, idempotent replay of an applied change,
        the suitability gate (409 REASSESSMENT_REQUIRED with reason and applicationId; 409
        WARNINGS_REQUIRED with the warnings to show and acknowledge; 403 STRATEGY_NOT_PERMITTED under
        MiFID or without an assessment), then a single-use SCA challenge over
        `pension-strategy-change:<sha256(pension-strategy-change|contractId|strategyCode|effectiveFrom|SORTED,ACKS)>`.
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectStrategyRequest'
      responses:
        '200': { $ref: '#/components/responses/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'SCA_REJECTED or STRATEGY_NOT_PERMITTED' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{id}/incentive-evaluation:
    post:
      tags: [Pension]
      operationId: evaluateIncentives
      summary: Evaluate the pinned pack's incentives for one contribution amount
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncentiveEvaluationRequest'
      responses:
        '200':
          description: One result per incentive rule of the pinned pack
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncentiveResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/pension/onboarding/applications:
    post:
      tags: [Pension onboarding]
      operationId: startOnboardingApplication
      summary: Start an application; eligibility and KYC are checked at once
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartApplicationRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: A collaborator this step depends on is not available (stub integration off) }
  /api/v2/pension/onboarding/applications/{id}:
    get:
      tags: [Pension onboarding]
      operationId: getOnboardingApplication
      summary: Status of one of the caller's applications
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/questionnaire:
    post:
      tags: [Pension onboarding]
      operationId: submitPensionQuestionnaire
      summary: Answer the suitability / appropriateness / ESG questionnaire
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionnaireRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionnaireResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The answers contradict each other; review or confirm the listed inconsistencies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InconsistentAnswers' }
    get:
      tags: [Pension onboarding]
      operationId: getPensionQuestionnaire
      summary: The question set with prefill (years to retirement), saved draft, progress and consistency hints
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: lang
          in: query
          required: false
          description: Text language (cs default, en)
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionnaireView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/questionnaire/draft:
    put:
      tags: [Pension onboarding]
      operationId: savePensionQuestionnaireDraft
      summary: Save partial answers (save-and-resume); nothing is scored until submission
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: lang
          in: query
          required: false
          description: Text language (cs default, en)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionnaireDraftRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionnaireView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/profile:
    get:
      tags: [Pension onboarding]
      operationId: getPensionRiskProfile
      summary: Risk profile (class 1-7), the answers that set it, and the recommended strategy; 409 when stale
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: lang
          in: query
          required: false
          description: Text language (cs default, en)
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskProfileView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/warnings:
    get:
      tags: [Pension onboarding]
      operationId: getPensionStrategyWarnings
      summary: The warnings choosing a strategy would require, worded for display
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
        - name: strategyCode
          in: query
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          description: Text language (cs default, en)
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuestionnaireWarning' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/warnings/acknowledge:
    post:
      tags: [Pension onboarding]
      operationId: acknowledgePensionStrategyWarnings
      summary: Acknowledge the warnings a strategy choice requires; the hash of the wording shown is recorded
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeWarningsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/recommendation:
    get:
      tags: [Pension onboarding]
      operationId: getPensionRecommendation
      summary: Strategy recommendation from risk profile and years to retirement
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyRecommendation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/strategy:
    post:
      tags: [Pension onboarding]
      operationId: choosePensionStrategy
      summary: Choose the strategy and issue its key-information document
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChooseStrategyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: A collaborator this step depends on is not available (stub integration off) }
  /api/v2/pension/onboarding/applications/{id}/kid/accept:
    post:
      tags: [Pension onboarding]
      operationId: acceptPensionKid
      summary: Accept the issued key-information document
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptKidRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/sign:
    post:
      tags: [Pension onboarding]
      operationId: signPensionApplication
      summary: SCA-sign the contract (and transfer request); starts the workflow
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: The SCA challenge was not verified (rejected, already spent, or bound elsewhere) }
        '503': { description: A collaborator this step depends on is not available (stub integration off) }
  /api/v2/pension/onboarding/applications/{id}/withdraw:
    post:
      tags: [Pension onboarding]
      operationId: withdrawPensionApplication
      summary: Withdraw within the cooling-off period
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/onboarding/applications/{id}/abandon:
    post:
      tags: [Pension onboarding]
      operationId: abandonPensionApplication
      summary: Abandon an unsigned application
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/transfers/out:
    post:
      tags: [Pension transfers]
      operationId: requestPensionTransferOut
      summary: Request a transfer-out of the caller's contract (SCA-signed)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOutRequest' }
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: The SCA challenge was not verified (rejected, already spent, or bound elsewhere) }
        '503': { description: A collaborator this step depends on is not available (stub integration off) }
  /api/v2/pension/transfers/{id}/consent:
    post:
      tags: [Pension transfers]
      operationId: consentPensionTransferOut
      summary: SCA-consent to a provider-requested transfer-out
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferConsentRequest' }
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller's role or principal may not use this route }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: The SCA challenge was not verified (rejected, already spent, or bound elsewhere) }
  /api/v2/pension/transfers/{id}:
    get:
      tags: [Pension transfers]
      operationId: getPensionTransfer
      summary: Status of one of the caller's transfers
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/CustomerPartyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
