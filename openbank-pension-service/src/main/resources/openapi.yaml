    SimulationRequest:
      type: object
      required: [jurisdiction, productLine, monthlyContribution, horizonYears]
      properties:
        jurisdiction: { type: string, minLength: 2, maxLength: 8 }
        productLine: { $ref: '#/components/schemas/ProductLine' }
