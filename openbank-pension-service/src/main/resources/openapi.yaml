        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: payoutId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
