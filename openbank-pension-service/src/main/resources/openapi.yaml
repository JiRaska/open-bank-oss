    post:
      tags: [Pension contract changes]
      operationId: previewContributionScheduleChange
      summary: Validate a contribution-schedule change and return what to sign
      description: |
        Validates amount, frequency, collection day and start date against the pinned pack's
        contributionLimits (monthly equivalent within min/max; fails closed when the pack declares none)
        and its incentive rules (a change that lowers the annual state incentive needs
        `acknowledgeIncentiveReduction: true`). Returns the effective date - the first collection day at
        least the pack's notice period ahead, never the cycle in progress - and `documentSha256`, the
        document the participant signs under SCA. Changes nothing.
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleChangeRequest' }
      responses:
        '200':
          description: Validate a contribution-schedule change and return what to sign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleChangePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{contractId}/contribution-schedule/changes:
    post:
      tags: [Pension contract changes]
      operationId: changeContributionSchedule
      summary: Agree a contribution-schedule change under SCA
      description: |
        Re-validates on the current state and requires `scaChallengeId` signed over the preview's
        `documentSha256` (a stale preview fails SCA). Effective from the next collection cycle; a
        not-yet-effective earlier change becomes SUPERSEDED; history is append-only. Idempotent per
        `Idempotency-Key`. A concurrent second change loses with 409.
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleChangeRequest' }
      responses:
        '201':
          description: Agree a contribution-schedule change under SCA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContributionScheduleVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{contractId}/beneficiaries:
    get:
      tags: [Pension contract changes]
      operationId: getBeneficiaries
      summary: Current beneficiary designation with the designation history
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200':
          description: Current beneficiary designation with the designation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/pension/contracts/{contractId}/beneficiaries/preview:
    post:
      tags: [Pension contract changes]
      operationId: previewBeneficiaryChange
      summary: Validate a complete ordered beneficiary designation and return what to sign
      description: |
        The body is the WHOLE new list in order (add, remove and reorder are all a new list; an empty
        list removes every designation). Shares must be positive, carry at most two decimals and total
        exactly 100; nobody twice; never the participant. Identity is minimal (GDPR): name and an
        optional known partyId only. Refused (409) once a death claim exists. Changes nothing.
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryChangeRequest' }
      responses:
        '200':
          description: Validate a complete ordered beneficiary designation and return what to sign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryChangePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{contractId}/beneficiaries/changes:
    post:
      tags: [Pension contract changes]
      operationId: changeBeneficiaries
      summary: Replace the beneficiary designation under SCA
      description: |
        Requires `scaChallengeId` signed over the preview's `documentSha256`. Written together with
        the contract's designation in one transaction that re-checks no death claim was registered
        meanwhile (409). History is append-only. Idempotent per `Idempotency-Key`.
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CustomerPartyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryChangeRequest' }
      responses:
        '201':
          description: Replace the beneficiary designation under SCA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryDesignationVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/operator/contracts/{contractId}/contribution-schedule:
    get:
      tags: [Pension operations]
      operationId: operatorGetContributionSchedule
      summary: Staff - contribution schedule with change history (read only)
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Staff - contribution schedule with change history (read only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContributionScheduleView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/pension/operator/contracts/{contractId}/beneficiaries:
    get:
      tags: [Pension operations]
      operationId: operatorGetBeneficiaries
      summary: Staff - beneficiary designation with history (read only)
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Staff - beneficiary designation with history (read only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- #12383: partner-agnostic annuity integration --------------------------------------------
  /api/v2/pension/contracts/{contractId}/exit/payouts/{payoutId}/annuity:
    get:
      tags: [Pension annuity]
      operationId: getAnnuityPurchase
      summary: The offers, the selection and the purchase progress of one annuity payout
      parameters:
        - $ref: '#/components/parameters/ExitContractId'
        - $ref: '#/components/parameters/PayoutId'
        - $ref: '#/components/parameters/CustomerPartyIdOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityPurchase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/pension/contracts/{contractId}/exit/payouts/{payoutId}/annuity/offers:
    post:
      tags: [Pension annuity]
      operationId: requestAnnuityOffers
      summary: Ask every eligible partner insurer for offers, in parallel
      description: |
        For a QUOTED payout in the ANNUITY form; the premium is the quote's net amount. Every
        ACTIVE partner whose jurisdiction, currency, premium band, dates and annuity types fit is
        asked the same question, bounded by a timeout; partial results are returned and every
        partner that failed, timed out or answered off-request is listed in `partnerFailures`.
        Offers are listed in the disclosed `presentationOrder`; none is recommended. A new
        request replaces earlier offers and clears a selection.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExitContractId'
        - $ref: '#/components/parameters/PayoutId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnuityOffersRequest' }
      responses:
        '200':
          description: The collected offers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityPurchase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{contractId}/exit/payouts/{payoutId}/annuity/selection:
    post:
      tags: [Pension annuity]
      operationId: selectAnnuityOffer
      summary: Select one offer under SCA
      description: |
        `scaChallengeId` must be signed over the offer's `selectionHash`, which binds this payout,
        the partner, the offer id, the premium and the monthly amount. The payout confirmation
        then requires this selection, still valid and for the same premium.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExitContractId'
        - $ref: '#/components/parameters/PayoutId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnuitySelectionRequest' }
      responses:
        '200':
          description: The selection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityPurchase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/contracts/{contractId}/exit/payouts/{payoutId}/annuity/cancellation:
    post:
      tags: [Pension annuity]
      operationId: cancelAnnuityPolicy
      summary: Cancel the issued policy within the partner's cooling-off period (SCA)
      description: |
        `scaChallengeId` must be signed over `cancellationHash`. The premium the partner returns is
        paid to the participant's signed payout account (the contract is already paid out).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExitContractId'
        - $ref: '#/components/parameters/PayoutId'
        - $ref: '#/components/parameters/CustomerPartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnuityCancellationRequest' }
      responses:
        '200':
          description: The cancelled purchase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityPurchase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/operator/annuity-providers:
    get:
      tags: [Pension operations]
      operationId: listAnnuityProviders
      summary: Partner insurers, optionally by status (staff)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AnnuityProviderStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AnnuityProvider' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pension operations]
      operationId: createAnnuityProvider
      summary: Register a partner insurer as DRAFT (maker)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnnuityProviderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityProvider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/operator/annuity-providers/{partnerId}:
    get:
      tags: [Pension operations]
      operationId: getAnnuityProvider
      summary: One partner insurer (staff)
      parameters:
        - $ref: '#/components/parameters/AnnuityPartnerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pension operations]
      operationId: amendAnnuityProvider
      summary: Propose new terms; the approved version stays live until a different person approves them
      parameters:
        - $ref: '#/components/parameters/AnnuityPartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnuityProviderTerms' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityProvider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/operator/annuity-providers/{partnerId}/activation-request:
    post:
      tags: [Pension operations]
      operationId: requestAnnuityProviderActivation
      summary: Request activation (maker); the adapter kind must exist in this build
      parameters:
        - $ref: '#/components/parameters/AnnuityPartnerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: PENDING_ACTIVATION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/operator/annuity-providers/{partnerId}/activation-approval:
    post:
      tags: [Pension operations]
      operationId: approveAnnuityProviderActivation
      summary: Approve activation (checker); 403 when the approver edited the terms or requested activation
      parameters:
        - $ref: '#/components/parameters/AnnuityPartnerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/pension/operator/annuity-providers/{partnerId}/disable:
    post:
      tags: [Pension operations]
      operationId: disableAnnuityProvider
      summary: Stop asking this partner for quotes (purchases in flight continue)
      parameters:
        - $ref: '#/components/parameters/AnnuityPartnerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/pension/operator/annuity-purchases:
    get:
      tags: [Pension operations]
      operationId: listAnnuityPurchases
      summary: Annuity purchases newest first, optionally by status (staff)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AnnuityPurchaseStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AnnuityPurchase' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v2/pension/operator/annuity-purchases/{purchaseId}/sync:
    post:
      tags: [Pension operations]
      operationId: syncAnnuityPurchase
      summary: Ask the partner where an in-flight purchase or a cancellation refund stands, and apply it
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The purchase after the sync
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityPurchase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CustomerPartyId:
      name: X-Customer-Party-Id
      in: header
      required: true
      description: The participant party, stamped by the customer edge from the token it validated.
      schema:
        type: string
        format: uuid
    CustomerPartyIdOptional:
      name: X-Customer-Party-Id
      in: header
      required: false
      description: |
        The participant party, stamped by the customer edge. Required for every caller without a
        staff role; a contract belonging to another party answers 404, exactly as an unknown id.
        Staff may omit it to read; every change acts for the participant.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every POST. The first successful response for a key (per caller, participant,
        method and path) is stored, and a retry with the same key is answered from it without
        running the operation again (header `Idempotent-Replayed: true`). A failed attempt is not
        stored, so a corrected retry runs.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ContractId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OnboardingStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OnboardingStatus' }
    TransferStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/TransferStatus' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

    FundingContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployerPartyId:
      name: employerPartyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxYear:
      name: year
      in: path
      required: true
      schema: { type: integer, minimum: 2000, maximum: 2200 }
    UnmatchedStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [OPEN, ASSIGNED, RETURNED] }
    ClawbackOn:
      name: on
      in: query
      required: false
      schema: { type: string, format: date }

    ExitContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimantId:
      name: claimantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AnnuityPartnerId:
      name: partnerId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }

  responses:
    Forbidden:
      description: SCA, own-account or role check failed
    Contract:
      description: The contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Contract'
    BadRequest:
      description: Malformed request, a missing required field, or a pack rule refused it
    Unauthorized:
      description: Missing or invalid bearer token
    NotFound:
      description: No such contract
    Conflict:
      description: The contract's current state forbids this transition

  schemas:
    ContractValuation:
      type: object
      required: [contractId, currency, status, holdings, pendingOrders]
      properties:
        contractId: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [VALUED, NO_HOLDINGS, NAV_NOT_PUBLISHED, CURRENCY_MISMATCH] }
        totalValue:
          type: [number, 'null']
          description: Set only for VALUED (sum of published-NAV values) and NO_HOLDINGS (zero).
        asOf: { type: [string, 'null'], format: date, description: Latest NAV date among priced holdings }
        holdings: { type: array, items: { $ref: '#/components/schemas/FundHoldingValuation' } }
        pendingOrders: { type: array, items: { $ref: '#/components/schemas/PendingFundOrder' } }
    FundHoldingValuation:
      type: object
      required: [fundId, units, navStatus, currency]
      properties:
        fundId: { type: string, format: uuid }
        units: { type: number }
        navStatus: { type: string, enum: [PUBLISHED, NOT_PUBLISHED] }
        navPerUnit: { type: [number, 'null'] }
        navDate: { type: [string, 'null'], format: date }
        value: { type: [number, 'null'] }
        currency: { type: string }
    PendingFundOrder:
      type: object
      required: [orderId, fundId, type]
      properties:
        orderId: { type: string, format: uuid }
        fundId: { type: string, format: uuid }
        type: { type: string, enum: [SUBSCRIBE, REDEEM, SWITCH_OUT, SWITCH_IN] }
        amount: { type: [number, 'null'] }
        units: { type: [number, 'null'] }
        placedAt: { type: [string, 'null'], format: date-time }
    UnitTransaction:
      type: object
      required: [id, fundId, type, units, amount, navPerUnit, pricedAt]
      properties:
        id: { type: string, format: uuid }
        fundId: { type: string, format: uuid }
        type: { type: string, enum: [SUBSCRIBE, REDEEM, SWITCH_OUT, SWITCH_IN, FEE] }
        units: { type: number }
        amount: { type: number }
        navPerUnit: { type: number }
        pricedAt: { type: string, format: date-time }
    UnitTransactionPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UnitTransaction' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    PaymentMandateListItem:
      type: object
      required: [id, contractId, kind, externalId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        kind: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT] }
        externalId: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductLine:
      type: string
      enum: [DPS, DIP]
    ProviderType:
      type: string
      enum: [PENSION_COMPANY, BANK, INVESTMENT_FIRM, MANAGEMENT_COMPANY, INSURANCE_COMPANY]
    ContractStatus:
      type: string
      enum: [DRAFT, PENDING_ACTIVATION, ACTIVE, SUSPENDED, TERMINATING, PAID_OUT, TRANSFERRED_OUT, CLOSED]
    ContributionFrequency:
      type: string
      enum: [MONTHLY, QUARTERLY, ANNUALLY]
    IncentivePeriod:
      type: string
      enum: [MONTH, QUARTER, YEAR]
    Schedule:
      type: object
      required: [amount, currency, frequency]
      properties:
        amount: { type: number, minimum: 0, maximum: 1000000000 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        employerAmount: { type: number, minimum: 0, maximum: 1000000000 }
    Beneficiary:
      type: object
      required: [name, sharePercent]
      properties:
        name: { type: string, minLength: 1 }
        partyId: { type: string, format: uuid }
        sharePercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
    CreateContractRequest:
      type: object
      required: [productLine, jurisdiction, providerEntityId, providerType, birthDate, schedule, strategyCode]
      properties:
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string, description: Jurisdiction code selecting the pack }
        providerEntityId:
          type: string
          format: uuid
          description: Provider legal entity. Creation requires the deployment's configured providerEntityId.
        providerType: { $ref: '#/components/schemas/ProviderType' }
        birthDate: { type: string, format: date }
        residencyCountry: { type: string }
        residencyEvidence:
          type: array
          items: { type: string }
        hasGuardian: { type: boolean }
        schedule: { $ref: '#/components/schemas/Schedule' }
        strategyCode: { type: string, minLength: 1 }
        beneficiaries:
          type: array
          description: Shares must total 100 when any are given.
          items: { $ref: '#/components/schemas/Beneficiary' }
    ElectStrategyRequest:
      type: object
      required: [strategyCode]
      properties:
        strategyCode: { type: string, minLength: 1 }
        effectiveFrom: { type: string, format: date, description: Defaults to today; never in the past }
        scaChallengeId: { type: string, description: 'Single-use challenge over pension-strategy-change:<hash>' }
        acknowledgedWarnings:
          type: array
          items: { type: string, enum: [STRATEGY_ABOVE_PROFILE, PRODUCT_NOT_APPROPRIATE, SUSTAINABILITY_PREFERENCE_NOT_MET] }
        language: { type: string, description: 'Language the warnings were shown in (cs / en)' }
    IncentiveEvaluationRequest:
      type: object
      required: [contribution, period]
      properties:
        contribution: { type: number, minimum: 0, maximum: 1000000000 }
        period: { $ref: '#/components/schemas/IncentivePeriod' }
        employerContributionAnnual: { type: number, minimum: 0, maximum: 1000000000 }
        sharedCapUsed:
          type: object
          description: Annual cap already consumed by other products, per shared-cap group.
          additionalProperties: { type: number, minimum: 0, maximum: 1000000000 }
    StrategyElection:
      type: object
      properties:
        strategyCode: { type: string }
        effectiveFrom: { type: string, format: date }
        electedAt: { type: string, format: date-time }
    Contract:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        participantPartyId: { type: string, format: uuid }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        packVersion: { type: integer }
        providerEntityId:
          type: string
          format: uuid
          description: Provider legal entity. Creation requires the deployment's configured providerEntityId.
        providerType: { $ref: '#/components/schemas/ProviderType' }
        status: { $ref: '#/components/schemas/ContractStatus' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        currentStrategy: { $ref: '#/components/schemas/StrategyElection' }
        strategyHistory:
          type: array
          items: { $ref: '#/components/schemas/StrategyElection' }
        beneficiaries:
          type: array
          items: { $ref: '#/components/schemas/Beneficiary' }
        startDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncentiveResult:
      type: object
      properties:
        incentiveId: { type: string }
        type: { type: string, enum: [MATCHING, FLAT, TAX_RELIEF, EMPLOYER_EXEMPTION] }
        period: { $ref: '#/components/schemas/IncentivePeriod' }
        amount: { type: number }
        indicativeSaving: { type: [number, 'null'] }
        claimChannel: { type: string, enum: [STATE_AGENCY_BATCH, TAX_RETURN, PAYROLL, NONE] }
        explanation: { type: string }
    OnboardingStatus:
      type: string
      enum: [STARTED, QUESTIONNAIRE_SUBMITTED, KID_ISSUED, KID_ACCEPTED, SIGNED, ACTIVATED, REJECTED, WITHDRAWN, EXPIRED, TRANSFER_FAILED, ABANDONED]
    TransferStatus:
      type: string
      enum: [AWAITING_CONSENT, REQUESTED, SENT, ACCEPTED, FUNDS_RECEIVED, VALUATED, SETTLED, COMPLETED, REJECTED, TIMED_OUT, CANCELLED, FAILED]
    OnboardingKind:
      type: string
      enum: [NEW_CONTRACT, TRANSFER_IN]
    EsgPreference:
      type: string
      enum: [NONE, CONSIDER, REQUIRED]
    StartApplicationRequest:
      type: object
      required: [productLine, jurisdiction, providerEntityId, providerType, schedule, birthDate]
      properties:
        kind: { $ref: '#/components/schemas/OnboardingKind' }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        providerEntityId:
          type: string
          format: uuid
          description: Provider legal entity. Creation requires the deployment's configured providerEntityId.
        providerType: { $ref: '#/components/schemas/ProviderType' }
        schedule:
          type: object
          required: [amount, currency, frequency]
          properties:
            amount: { type: number }
            currency: { type: string }
            frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
            employerAmount: { type: number }
        birthDate: { type: string, format: date }
        residencyCountry: { type: string }
        residencyEvidence: { type: array, items: { type: string } }
        onBehalfOfPartyId:
          type: string
          format: uuid
          description: A guardian applying for a ward; honoured only after party-service verifies the relation.
        transferIn:
          type: object
          required: [providerId, providerName, contractNumber]
          properties:
            providerId: { type: string }
            providerName: { type: string }
            contractNumber: { type: string }
    QuestionnaireRequest:
      type: object
      description: >-
        Either `answers` (the data-driven question set, issue #12384) or the legacy 0..3 scales
        (riskAppetite, lossTolerance, financialSituationStable required) for clients not yet migrated.
      properties:
        answers:
          type: object
          description: Question id -> option code, from GET .../questionnaire
          additionalProperties: { type: string }
        confirmInconsistencies:
          type: array
          items: { type: string }
        language: { type: string }
        knowledgeLevel: { type: integer, minimum: 0, maximum: 3 }
        experienceLevel: { type: integer, minimum: 0, maximum: 3 }
        riskAppetite: { type: integer, minimum: 0, maximum: 3 }
        lossTolerance: { type: integer, minimum: 0, maximum: 3 }
        financialSituationStable: { type: boolean }
        esgPreference: { $ref: '#/components/schemas/EsgPreference' }
    ChooseStrategyRequest:
      type: object
      properties:
        strategyCode: { type: string, description: Omitted to accept the recommendation }
        acknowledgeWarning: { type: boolean }
        language: { type: string }
    AcceptKidRequest:
      type: object
      required: [documentId]
      properties:
        documentId: { type: string }
    SignRequest:
      type: object
      required: [scaChallengeId]
      properties:
        scaChallengeId: { type: string }
    TransferConsentRequest:
      type: object
      required: [scaChallengeId]
      properties:
        scaChallengeId: { type: string }
    StrategyRecommendation:
      type: object
      properties:
        recommendedStrategy: { type: string }
        suitableStrategies: { type: array, items: { type: string } }
        maxRiskClass: { type: integer }
        yearsToRetirement: { type: integer }
        reasons:
          type: array
          items:
            type: string
            enum: [LIFECYCLE_DEFAULT, HIGHEST_SUITABLE_RISK, SUSTAINABLE_PREFERRED, NO_SUITABLE_STRATEGY_FALLBACK_MOST_CONSERVATIVE, NO_SUSTAINABLE_STRATEGY_AVAILABLE]
    OnboardingApplication:
      type: object
      properties:
        applicationId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OnboardingKind' }
        status: { $ref: '#/components/schemas/OnboardingStatus' }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        jurisdiction: { type: string }
        packVersion: { type: integer }
        rejectionReasons: { type: array, items: { type: string } }
        recommendedStrategy: { type: [string, 'null'] }
        chosenStrategy: { type: [string, 'null'] }
        unsuitableChoiceAcknowledged: { type: boolean }
        keyInformationDocumentId: { type: [string, 'null'] }
        keyInformationDocumentSha256: { type: [string, 'null'] }
        kidAcceptedAt: { type: [string, 'null'], format: date-time }
        signedAt: { type: [string, 'null'], format: date-time }
        contractId: { type: [string, 'null'], format: uuid }
        transferRequestId: { type: [string, 'null'], format: uuid }
        coolingOffEndsOn: { type: [string, 'null'], format: date }
        expiresOn: { type: string, format: date }
        closedReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QuestionnaireResponse:
      type: object
      properties:
        application: { $ref: '#/components/schemas/OnboardingApplication' }
        recommendation: { $ref: '#/components/schemas/StrategyRecommendation' }
        profile: { $ref: '#/components/schemas/RiskProfileView' }
    QuestionnaireDraftRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties: { type: string }
    AcknowledgeWarningsRequest:
      type: object
      required: [strategyCode, warnings]
      properties:
        strategyCode: { type: string }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/WarningCode' }
        language: { type: string }
    WarningCode:
      type: string
      enum: [STRATEGY_ABOVE_PROFILE, PRODUCT_NOT_APPROPRIATE, SUSTAINABILITY_PREFERENCE_NOT_MET]
    QuestionnaireWarning:
      type: object
      properties:
        code: { $ref: '#/components/schemas/WarningCode' }
        text: { type: string }
    InconsistentAnswers:
      type: object
      properties:
        error: { type: string }
        inconsistencies:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              questions: { type: array, items: { type: string } }
    QuestionDimension:
      type: string
      enum: [OBJECTIVE, RISK_WILLINGNESS, LOSS_CAPACITY, FINANCIAL_SITUATION, SAVINGS, KNOWLEDGE, EXPERIENCE, SUSTAINABILITY]
    QuestionnaireView:
      type: object
      properties:
        questionSetId: { type: string }
        questionSetVersion: { type: integer }
        legalReviewStatus: { type: string, enum: [REQUIRES_LEGAL_REVIEW, REVIEWED] }
        steps:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              title: { type: string }
              optional: { type: boolean }
              questions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    dimension: { $ref: '#/components/schemas/QuestionDimension' }
                    instrumentClass: { type: string, nullable: true }
                    text: { type: string }
                    help: { type: string, nullable: true }
                    required: { type: boolean }
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          code: { type: string }
                          text: { type: string }
                          illustrationCzk: { type: number, nullable: true }
        answers:
          type: object
          additionalProperties: { type: string }
        progress:
          type: object
          properties:
            answered: { type: integer }
            required: { type: integer }
            missingRequired: { type: array, items: { type: string } }
            nextStep: { type: string, nullable: true }
            complete: { type: boolean }
        prefill:
          type: object
          properties:
            birthDate: { type: string, format: date }
            yearsToRetirement: { type: integer }
            retirementAge: { type: integer }
            previousAnswersAvailable: { type: boolean }
        inconsistencies:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              questions: { type: array, items: { type: string } }
              message: { type: string }
    RiskProfileView:
      type: object
      properties:
        assessmentId: { type: string, format: uuid }
        questionSetId: { type: string, nullable: true }
        questionSetVersion: { type: integer, nullable: true }
        riskClass: { type: integer, minimum: 1, maximum: 7 }
        riskLabel: { type: string, enum: [CONSERVATIVE, BALANCED, DYNAMIC] }
        why:
          type: array
          items:
            type: object
            properties:
              dimension: { $ref: '#/components/schemas/QuestionDimension' }
              questionId: { type: string }
              question: { type: string }
              answer: { type: string }
              maxRiskClass: { type: integer }
        financialSituationStable: { type: boolean }
        appropriate:
          type: boolean
          nullable: true
          description: Null when appropriateness depends on the selected strategy's published instrument classes.
        competence:
          type: array
          items:
            type: object
            properties:
              instrumentClass: { type: string }
              knowledge: { type: integer }
              experience: { type: integer }
        sustainability:
          type: object
          nullable: true
          properties:
            optionCode: { type: string, nullable: true }
            categories:
              type: array
              items: { type: string, enum: [TAXONOMY_ALIGNED, SFDR_SUSTAINABLE, PAI_CONSIDERED] }
            minSharePercent: { type: integer, nullable: true }
        savingsCzk: { type: number, nullable: true }
        lossSharePercent: { type: integer, nullable: true }
        lossCapacityCzk: { type: number, nullable: true }
        confirmedInconsistencies: { type: array, items: { type: string } }
        recommendation: { $ref: '#/components/schemas/StrategyRecommendation' }
        recommendedStrategyWarnings:
          type: array
          items: { $ref: '#/components/schemas/QuestionnaireWarning' }
        assessedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date }
    OperatorApplication:
      type: object
      properties:
        partyId: { type: string, format: uuid }
        application: { $ref: '#/components/schemas/OnboardingApplication' }
    TransferOutRequest:
      type: object
      required: [contractId, receivingProviderId, receivingProviderName, receivingContractNumber]
      properties:
        contractId: { type: string, format: uuid }
        receivingProviderId: { type: string }
        receivingProviderName: { type: string }
        receivingContractNumber: { type: string }
        scaChallengeId: { type: string, description: Required when the participant requests it }
    CounterpartyResponseRequest:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        reason: { type: string }
    IncentiveHistoryEntry:
      type: object
      required: [incentiveId, year, amount]
      properties:
        incentiveId: { type: string }
        year: { type: integer }
        amount: { type: number }
    FundsReceivedRequest:
      type: object
      required: [amount, currency, originalStartDate]
      properties:
        amount: { type: number }
        currency: { type: string }
        originalStartDate: { type: string, format: date }
        incentiveHistory: { type: array, items: { $ref: '#/components/schemas/IncentiveHistoryEntry' } }
    TransferRequest:
      type: object
      properties:
        transferId: { type: string, format: uuid }
        direction: { type: string, enum: [IN, OUT] }
        origin: { type: string, enum: [PARTICIPANT, RECEIVING_PROVIDER] }
        contractId: { type: string, format: uuid }
        counterpartyProviderId: { type: string }
        counterpartyProviderName: { type: string }
        counterpartyContractNumber: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        deadline: { type: string, format: date }
        grossAmount: { type: [number, 'null'] }
        fee: { type: [number, 'null'] }
        netAmount: { type: [number, 'null'] }
        currency: { type: string }
        originalStartDate: { type: [string, 'null'], format: date }
        incentiveHistory: { type: array, items: { $ref: '#/components/schemas/IncentiveHistoryEntry' } }
        failureReason: { type: [string, 'null'] }
        compensation: { type: string, enum: [NONE, CONTRACT_CLOSED, CEDING_CANCELLED_AND_CONTRACT_CLOSED, REDEMPTION_REVERSED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # --- ADR-0334 S3 ---
    PaymentReference:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        reference: { type: string }
    Mandate:
      type: object
      properties:
        mandateId: { type: string, description: The standing-order / sdd mandate id downstream. }
        id: { type: string, format: uuid, description: "pension-service's own mandate id (the cancel route takes it, #12378)." }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
    MandateCancelRequest:
      type: object
      required: [scaChallengeId]
      properties:
        scaChallengeId:
          type: string
          description: SCA challenge signing this contract's cancellation of this mandate (single use).
    MandateSetupRequest:
      type: object
      required: [kind, debtorIban, amount, currency, firstCollection, scaChallengeId]
      properties:
        scaChallengeId:
          type: string
          description: >-
            Single-use sca-service APPROVAL challenge raised with approvalRequestId
            `pension-mandate-setup:<sha256>` over `pension-mandate-setup|contractId|kind|IBAN|amount|CURRENCY|firstCollection`
            (IBAN without spaces, upper case; amount without trailing zeros). Missing or not verified = 403,
            before any account lookup.
        kind: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT] }
        debtorIban: { type: string }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        firstCollection: { type: string, format: date }
        debtorName:
          type: string
          description: >-
            Account holder's name; required for DIRECT_DEBIT. The debit account itself is resolved
            server-side from debtorIban and must be a verified account of the participant (#12378);
            no account id is accepted from the caller.
    Contribution:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        paymentId: { type: string }
        source: { type: string, enum: [PARTICIPANT, EMPLOYER, STATE, TRANSFER_IN] }
        channel: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT, BANK_TRANSFER, EMPLOYER_BATCH, STATE_INCENTIVE, TRANSFER] }
        amount: { type: number }
        currency: { type: string }
        valueDate: { type: string, format: date }
        taxYear: { type: integer }
        employerPartyId: { type: [string, 'null'], format: uuid }
        subscriptionOrderId: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
    IncomingPayment:
      type: object
      required: [paymentId, amount, currency, valueDate]
      properties:
        paymentId: { type: string, maxLength: 120, description: "Idempotency key; a redelivered payment credits once." }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        valueDate: { type: string, format: date }
        reference: { type: string, maxLength: 64 }
        channel: { type: string, enum: [STANDING_ORDER, DIRECT_DEBIT, BANK_TRANSFER, EMPLOYER_BATCH, STATE_INCENTIVE, TRANSFER] }
        payerAccount: { type: string, maxLength: 64 }
    Receipt:
      type: object
      properties:
        outcome: { type: string, enum: [CREDITED, DUPLICATE, UNMATCHED] }
        contribution: { $ref: '#/components/schemas/Contribution' }
        unmatched: { $ref: '#/components/schemas/UnmatchedPayment' }
    UnmatchedPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string }
        amount: { type: number }
        currency: { type: string }
        valueDate: { type: string, format: date }
        reference: { type: [string, 'null'] }
        reason: { type: string, enum: [NO_REFERENCE, UNKNOWN_REFERENCE, CONTRACT_NOT_ACCEPTING, CURRENCY_MISMATCH, EMPLOYER_LINE, EMPLOYER_NOT_AUTHORISED] }
        status: { type: string, enum: [OPEN, ASSIGNED, RETURNED] }
        resolvedContractId: { type: [string, 'null'], format: uuid }
        resolvedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    EmployerBatchRequest:
      type: object
      required: [employerPartyId, payment, lines]
      properties:
        employerPartyId: { type: string, format: uuid }
        payment: { $ref: '#/components/schemas/IncomingPayment' }
        lines:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [contractReference, amount]
            properties:
              contractReference: { type: string, maxLength: 64 }
              amount: { type: number, exclusiveMinimum: 0, maximum: 999999999.99, multipleOf: 0.01 }
    EmployerLineResult:
      type: object
      properties:
        lineNo: { type: integer }
        contractReference: { type: string }
        amount: { type: number }
        outcome: { type: string, enum: [CREDITED, DUPLICATE, UNMATCHED] }
    AssignUnmatchedRequest:
      type: object
      required: [contractId]
      properties:
        contractId: { type: string, format: uuid }
    ClaimRunRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
    ReceiptFileRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: string }
    IneligibilityRequest:
      type: object
      required: [ineligibleFrom]
      properties:
        ineligibleFrom: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', description: First month without entitlement (YYYY-MM) }
    ReturnReportRequest:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
    StateContributionReturn:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        claimId: { type: [string, 'null'], format: uuid }
        cause: { type: string, enum: [CONTRACT_TERMINATED, INELIGIBILITY_DISCOVERED] }
        amount: { type: number }
        currency: { type: string }
        discoveredOn: { type: string, format: date }
        dueBy: { type: string, format: date, description: Statutory deadline (ZDPS §18(2)/(3)) }
        status: { type: string, enum: [DUE, REPORTED, CONFIRMED, SETTLED] }
        reportId: { type: [string, 'null'], format: uuid }
    ReturnReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        month: { type: string }
        returnIds: { type: array, items: { type: string, format: uuid } }
        payload: { type: string, description: Filed document in the placeholder cz-mf-state-contribution-v1 format }
        channelReference: { type: [string, 'null'], description: 'MANUAL:sha256:… means nothing was transmitted' }
        resultApplied: { type: boolean }
        createdAt: { type: string, format: date-time }
    ReturnReportRun:
      type: object
      properties:
        filed: { type: boolean }
        report:
          oneOf:
            - $ref: '#/components/schemas/ReturnReport'
            - type: 'null'
    StateContributionDeadlines:
      type: object
      properties:
        claimsPastFilingDeadline: { type: integer }
        claimsPastExpectedPayment: { type: integer }
        returnsOverdue: { type: integer }
    IncentiveClaim:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        incentiveId: { type: string }
        period: { type: string }
        basis: { type: number }
        claimedAmount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING, SUBMITTED, RECEIVED, REJECTED, RETURNED] }
        batchId: { type: [string, 'null'], format: uuid }
        receivedAmount: { type: [number, 'null'] }
        rejectionReason: { type: [string, 'null'] }
    IncentiveStatus:
      type: object
      properties:
        claims:
          type: array
          items: { $ref: '#/components/schemas/IncentiveClaim' }
        balances:
          type: array
          items:
            type: object
            properties:
              incentiveId: { type: string }
              received: { type: number }
              returned: { type: number }
              net: { type: number }
    ClaimBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        claimFormat: { type: string }
        period: { type: string }
        claimIds:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [SUBMITTED, RECONCILED] }
        payload: { type: string }
        createdAt: { type: string, format: date-time }
    ClaimRun:
      type: object
      properties:
        claimsCreated: { type: integer }
        batches:
          type: array
          items: { $ref: '#/components/schemas/ClaimBatch' }
        unfiledFormats:
          type: array
          items: { type: string }
    ExternalCapUsageRequest:
      type: object
      required: [usage]
      properties:
        usage:
          type: object
          additionalProperties: { type: number, minimum: 0 }
    AnnualStatement:
      type: object
      required: [contractId, year, documentId, sha256, issuedAt]
      properties:
        contractId: { type: string, format: uuid }
        year: { type: integer }
        documentId:
          type: string
          description: document-service's id of the rendered statement
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: document-service's SHA-256 of the stored statement
        issuedAt: { type: string, format: date-time }
    TaxYearSummary:
      type: object
      properties:
        contractId: { type: string, format: uuid }
        taxYear: { type: integer }
        currency: { type: string }
        participantContributions: { type: number }
        employerContributions: { type: number }
        stateIncentives: { type: number }
        transferIn: { type: number }
        deductibleAmount: { type: number }
        indicativeTaxSaving: { type: [number, 'null'] }
        sharedCapUsedElsewhere:
          type: object
          additionalProperties: { type: number }
        employerExemptions:
          type: array
          items:
            type: object
            properties:
              employerPartyId: { type: string, format: uuid }
              contributed: { type: number }
              exempt: { type: number }
              taxable: { type: number }
        employerExempt: { type: number }
        employerTaxable: { type: number }
        finalized: { type: boolean }
        certificateDocumentId: { type: [string, 'null'] }
    ClawbackItem:
      type: object
      properties:
        incentiveId: { type: string }
        kind: { type: string, enum: [RETURN_TO_AGENCY, TAX_RECAPTURE] }
        amount: { type: number }
        taxYears:
          type: array
          items: { type: integer }
    Money:
      type: number
      description: Two decimals, rounded HALF_EVEN once per component.
    PayoutForm:
      type: string
      enum: [LUMP_SUM, ANNUITY, PHASED_WITHDRAWAL, FIXED_PERIOD_PENSION, EARLY_WITHDRAWAL, SURRENDER]
    ExitSignRequest:
      type: object
      required: [scaChallengeId, payoutIban]
      properties:
        scaChallengeId: { type: string, description: "SCA challenge bound to the quoteHash" }
        payoutIban: { type: string }
    PayoutQuoteRequest:
      type: object
      required: [form]
      properties:
        form: { $ref: '#/components/schemas/PayoutForm' }
        amount: { $ref: '#/components/schemas/Money' }
        months: { type: integer }
    PayoutEligibility:
      type: object
      properties:
        conditionsMet: { type: boolean }
        ageYears: { type: integer }
        durationMonths: { type: integer, format: int64 }
        reasons: { type: array, items: { type: string } }
        allowedForms: { type: array, items: { $ref: '#/components/schemas/PayoutForm' } }
        partialWithdrawalAllowed: { type: boolean }
    TerminationQuote:
      type: object
      properties:
        redemptionValue: { $ref: '#/components/schemas/Money' }
        surrenderFee: { $ref: '#/components/schemas/Money' }
        incentiveReturn: { $ref: '#/components/schemas/Money' }
        deductionRecapture: { $ref: '#/components/schemas/Money' }
        employerExemptRecapture: { $ref: '#/components/schemas/Money' }
        totalDeductions: { $ref: '#/components/schemas/Money' }
        netPayout: { $ref: '#/components/schemas/Money' }
        shortfall: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        packVersion: { type: integer }
    TerminationNotice:
      type: object
      properties:
        noticeId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        status: { type: string, enum: [QUOTED, SIGNED, REDEEMED, PAID, COMPLETED, EXPIRED, SUPERSEDED] }
        quote: { $ref: '#/components/schemas/TerminationQuote' }
        quoteHash: { type: string }
        quoteExpiresAt: { type: string, format: date-time }
        signedAt: { type: string, format: date-time, nullable: true }
        effectiveDate: { type: string, format: date, nullable: true }
        paymentRef: { type: string, nullable: true }
    Installment:
      type: object
      properties:
        seq: { type: integer }
        dueDate: { type: string, format: date }
        gross: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [PENDING, PAID] }
    Payout:
      type: object
      properties:
        payoutId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        form: { $ref: '#/components/schemas/PayoutForm' }
        status: { type: string, enum: [QUOTED, CONFIRMED, IN_PAYMENT, COMPLETED, EXPIRED, REVERSED] }
        currentValue: { $ref: '#/components/schemas/Money' }
        grossAmount: { $ref: '#/components/schemas/Money' }
        taxBase: { type: string, enum: [NONE, GAINS, GROSS] }
        taxableAmount: { $ref: '#/components/schemas/Money' }
        taxWithheld: { $ref: '#/components/schemas/Money' }
        netAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        months: { type: integer, nullable: true }
        quoteHash: { type: string }
        quoteExpiresAt: { type: string, format: date-time }
        installments: { type: array, items: { $ref: '#/components/schemas/Installment' } }
        annuityPolicyRef: { type: string, nullable: true }
        annuityMonthlyAmount: { type: number, nullable: true }
        paymentRef: { type: string, nullable: true }
        payoutAccountLast4: { type: [string, 'null'], description: Last four characters of the SIGNED payout account (S8) }
        pendingAccountLast4: { type: [string, 'null'], description: A held account change (S8) - last four characters }
        pendingAccountFrom: { type: [string, 'null'], format: date, description: First due date the held change applies to }
    PayoutStatement:
      type: object
      properties:
        payoutId: { type: string, format: uuid }
        form: { $ref: '#/components/schemas/PayoutForm' }
        status: { type: string }
        currency: { type: string }
        grossQuoted: { $ref: '#/components/schemas/Money' }
        taxWithheldQuoted: { $ref: '#/components/schemas/Money' }
        netQuoted: { $ref: '#/components/schemas/Money' }
        netPaid: { $ref: '#/components/schemas/Money' }
        taxWithheldPaid: { $ref: '#/components/schemas/Money' }
        netOutstanding: { $ref: '#/components/schemas/Money' }
        installmentsPaid: { type: integer }
        installmentsTotal: { type: integer }
    NotifyDeathRequest:
      type: object
      required: [contractId, dateOfDeath, evidenceRef]
      properties:
        contractId: { type: string, format: uuid }
        dateOfDeath: { type: string, format: date }
        evidenceRef: { type: string }
    ClaimantRequest:
      type: object
      required: [name, sharePercent]
      properties:
        name: { type: string }
        partyId: { type: string, format: uuid }
        sharePercent: { type: number }
        estate: { type: boolean }
    ClaimantsRequest:
      type: object
      required: [claimants]
      properties:
        claimants: { type: array, items: { $ref: '#/components/schemas/ClaimantRequest' } }
    VerifyClaimantRequest:
      type: object
      required: [name, birthDate, identityDocumentRef, iban]
      properties:
        name: { type: string }
        birthDate: { type: string, format: date }
        identityDocumentRef: { type: string }
        iban: { type: string }
    Claimant:
      type: object
      properties:
        claimantId: { type: string, format: uuid }
        name: { type: string }
        sharePercent: { type: number }
        estate: { type: boolean }
        verification: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        gross: { type: number, nullable: true }
        tax: { type: number, nullable: true }
        net: { type: number, nullable: true }
        paymentRef: { type: string, nullable: true }
    DeathClaim:
      type: object
      properties:
        claimId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        status: { type: string, enum: [NOTIFIED, APPROVED, IN_PAYMENT, SETTLED] }
        dateOfDeath: { type: string, format: date }
        notifiedBy: { type: string }
        approvedBy: { type: string, nullable: true }
        valuation: { type: number, nullable: true }
        incentiveReturn: { $ref: '#/components/schemas/Money' }
        claimants: { type: array, items: { $ref: '#/components/schemas/Claimant' } }
    SimulationRequest:
      type: object
      required: [jurisdiction, productLine, monthlyContribution, horizonYears]
      properties:
        jurisdiction: { type: string, minLength: 2, maxLength: 8 }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        strategyCode: { type: string, maxLength: 64, description: Marked as requested; must be offered by the pack }
        monthlyContribution: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        employerMonthlyContribution: { type: number, minimum: 0, maximum: 1000000 }
        horizonYears: { type: integer, minimum: 1, maximum: 60 }
    StrategyProjection:
      type: object
      properties:
        strategyCode: { type: string }
        riskClass: { type: integer }
        assumedAnnualReturn: { type: number, description: Provider assumption, not a forecast }
        ownContributions: { type: number }
        employerContributions: { type: number }
        stateIncentives: { type: number }
        projectedValue: { type: number }
    Simulation:
      type: object
      properties:
        illustrative: { type: boolean, const: true }
        disclaimer: { type: string }
        jurisdiction: { type: string }
        productLine: { $ref: '#/components/schemas/ProductLine' }
        packVersion: { type: integer }
        currency: { type: string }
        horizonYears: { type: integer }
        requestedStrategy: { type: [string, 'null'] }
        projections:
          type: array
          items: { $ref: '#/components/schemas/StrategyProjection' }
    ScheduleChangeRequest:
      type: object
      required: [amount, frequency, dayOfMonth]
      properties:
        amount: { type: number, minimum: 0, description: Participant contribution per collection }
        frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28 }
        startDate: { type: string, format: date, description: Earliest start; the next cycle on or after it applies }
        acknowledgeIncentiveReduction: { type: boolean, default: false }
        scaChallengeId: { type: string, maxLength: 128, description: Required on /changes only }
    ScheduleChangePreview:
      type: object
      properties:
        amount: { type: number }
        employerAmount: { type: number }
        currency: { type: string }
        frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        dayOfMonth: { type: integer }
        effectiveFrom: { type: string, format: date }
        annualIncentiveBefore: { type: number }
        annualIncentiveAfter: { type: number }
        incentiveWarnings: { type: array, items: { type: string } }
        documentSha256: { type: string, description: The document to sign under SCA }
    ContributionScheduleVersion:
      type: object
      properties:
        seq: { type: integer }
        amount: { type: number }
        employerAmount: { type: number }
        currency: { type: string }
        frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        dayOfMonth: { type: integer }
        effectiveFrom: { type: string, format: date }
        status: { type: string, enum: [SCHEDULED, SUPERSEDED] }
        changedAt: { type: string, format: date-time }
    ContributionScheduleView:
      type: object
      properties:
        original:
          type: object
          description: The schedule agreed at signing; applies until the first change takes effect
          properties:
            amount: { type: number }
            employerAmount: { type: number }
            currency: { type: string }
            frequency: { $ref: '#/components/schemas/ContributionFrequency' }
        inForce:
          oneOf:
            - { $ref: '#/components/schemas/ContributionScheduleVersion' }
            - { type: 'null' }
        pending:
          oneOf:
            - { $ref: '#/components/schemas/ContributionScheduleVersion' }
            - { type: 'null' }
        history: { type: array, items: { $ref: '#/components/schemas/ContributionScheduleVersion' } }
    BeneficiaryChangeRequest:
      type: object
      required: [beneficiaries]
      properties:
        beneficiaries: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Beneficiary' } }
        scaChallengeId: { type: string, maxLength: 128, description: Required on /changes only }
    BeneficiaryChangePreview:
      type: object
      properties:
        beneficiaries: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
        documentSha256: { type: string, description: The document to sign under SCA }
    BeneficiaryDesignationVersion:
      type: object
      properties:
        seq: { type: integer }
        beneficiaries: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
        changedAt: { type: string, format: date-time }
    BeneficiaryView:
      type: object
      properties:
        current: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
        history: { type: array, items: { $ref: '#/components/schemas/BeneficiaryDesignationVersion' } }
    # ---- #12383 annuity marketplace ----
    AnnuityType:
      type: string
      enum: [LIFELONG, FIXED_TERM, GUARANTEE_PERIOD, JOINT_LIFE, INDEXED]
    AnnuityProviderStatus:
      type: string
      enum: [DRAFT, PENDING_ACTIVATION, ACTIVE, DISABLED]
    AnnuityPurchaseStatus:
      type: string
      enum: [OFFERED, SELECTED, APPLIED, PREMIUM_SENT, ACTIVE, CANCELLED, FAILED]
    AnnuityOffersRequest:
      type: object
      properties:
        annuityTypes: { type: array, items: { $ref: '#/components/schemas/AnnuityType' } }
        guaranteeMonths: { type: [integer, 'null'], minimum: 0 }
        termMonths: { type: [integer, 'null'], minimum: 1 }
        jointLifeBirthDate: { type: [string, 'null'], format: date }
        survivorShare: { type: [number, 'null'], minimum: 0, maximum: 1 }
    AnnuitySelectionRequest:
      type: object
      required: [partnerId, offerId, scaChallengeId]
      properties:
        partnerId: { type: string }
        offerId: { type: string }
        scaChallengeId: { type: string }
    AnnuityCancellationRequest:
      type: object
      required: [scaChallengeId]
      properties:
        scaChallengeId: { type: string }
    AnnuityOffer:
      type: object
      properties:
        partnerId: { type: string }
        partnerName: { type: string }
        offerId: { type: string }
        annuityType: { $ref: '#/components/schemas/AnnuityType' }
        premium: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        monthlyAmount: { $ref: '#/components/schemas/Money' }
        guaranteeMonths: { type: integer }
        termMonths: { type: [integer, 'null'] }
        indexationRate: { type: number }
        survivorShare: { type: [number, 'null'] }
        oneOffFee: { $ref: '#/components/schemas/Money' }
        annualFeeRate: { type: number }
        guaranteedTotal: { $ref: '#/components/schemas/Money' }
        validUntil: { type: string, format: date-time }
        illustrative: { type: boolean, description: True when the figures are not a binding insurer price }
        providerVersion: { type: integer, description: The approved partner version this offer was quoted under (signed) }
        selectionHash: { type: string, description: What an SCA challenge selecting this offer must be signed over }
    AnnuityPartnerFailure:
      type: object
      properties:
        partnerId: { type: string }
        reason: { type: string }
    AnnuityPurchase:
      type: object
      properties:
        payoutId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AnnuityPurchaseStatus' }
        premium: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        quotedAt: { type: string, format: date-time }
        presentationOrder: { type: string, description: The disclosed partner-neutral order of offers }
        offers: { type: array, items: { $ref: '#/components/schemas/AnnuityOffer' } }
        partnerFailures: { type: array, items: { $ref: '#/components/schemas/AnnuityPartnerFailure' } }
        selectedPartnerId: { type: [string, 'null'] }
        selectedOfferId: { type: [string, 'null'] }
        applicationRef: { type: [string, 'null'] }
        premiumPaymentRef: { type: [string, 'null'] }
        policyRef: { type: [string, 'null'] }
        policyMonthlyAmount: { type: [number, 'null'] }
        coolingOffEndsOn: { type: [string, 'null'], format: date }
        cancellationHash: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        compensation: { type: string, enum: [NONE, RETURNED_TO_CONTRACT, RETURNED_TO_CLIENT] }
        disclaimer: { type: string }
    AnnuityProviderTerms:
      type: object
      required: [legalName, legalEntityPartyId, licenceRef, licenceAuthority, jurisdictions, supportedTypes,
                 currency, minPremium, maxPremium, coolingOffDays, premiumIban, adapter, effectiveFrom]
      properties:
        legalName: { type: string }
        legalEntityPartyId: { type: string, format: uuid, description: The insurer's legal entity in party-service }
        licenceRef: { type: string }
        licenceAuthority: { type: string }
        jurisdictions: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
        supportedTypes: { type: array, items: { $ref: '#/components/schemas/AnnuityType' } }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        minPremium: { type: number }
        maxPremium: { type: number }
        coolingOffDays: { type: integer, minimum: 0, maximum: 60 }
        premiumIban: { type: string }
        adapter: { type: string, description: 'Adapter kind, e.g. reference-rest (simulator exists only in dev/test builds)' }
        endpointUrl: { type: [string, 'null'], description: HTTPS base URL of a reference-protocol partner }
        adapterSettings: { type: object, additionalProperties: { type: string }, description: Non-secret adapter parameters }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    CreateAnnuityProviderRequest:
      type: object
      required: [partnerId, terms]
      properties:
        partnerId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }
        terms: { $ref: '#/components/schemas/AnnuityProviderTerms' }
    AnnuityProvider:
      type: object
      description: |
        Versioned under four-eyes: `liveTerms` is the approved version quoting and purchase use;
        `proposedTerms` is a pending edit, invisible to the marketplace until a different person
        approves it. Offers pin the live version (`providerVersion`) and the selection SCA signs it.
      properties:
        partnerId: { type: string }
        status: { $ref: '#/components/schemas/AnnuityProviderStatus' }
        liveVersion: { type: [integer, 'null'] }
        liveTerms: { oneOf: [{ $ref: '#/components/schemas/AnnuityProviderTerms' }, { type: 'null' }] }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        proposedVersion: { type: [integer, 'null'] }
        proposedTerms: { oneOf: [{ $ref: '#/components/schemas/AnnuityProviderTerms' }, { type: 'null' }] }
        proposedBy: { type: [string, 'null'] }
        activationRequestedBy: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
