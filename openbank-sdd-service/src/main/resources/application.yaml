quarkus:
  application:
    name: openbank-sdd-service
  http:
    port: 8129
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_sdd
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_sdd
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none
  # Outbound service-to-service token (#1000): the transaction-service rest-client mints an
  # openbank-services M2M token (ROLE_OPERATOR) via this oidc-client. Disabled under %test (units
  # call the consumer directly; the boot IT never books a debit).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
  rest-client:
    transaction-service:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8102}
      scope: jakarta.inject.Singleton
  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-sdd-service
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8086
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    # Dedicated IT Postgres on the warm CI stack (ADR-0043); CI auto-creates any
    # openbank_*_it database referenced here. Dev Services stay OFF — tests hit
    # localhost:5432 exactly as on a workstation.
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/openbank_sdd_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_sdd_it
    management:
      enabled: false
    devservices:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    # ADR-0050: disable the @Scheduled outbox tick under test so the integration test
    # drives dispatcher.dispatch() explicitly and never races the assertions.
    scheduler:
      enabled: false
  openbank:
    outbox:
      # Enable dispatch in tests so SddOutboxDispatchIT can drive dispatcher.dispatch() directly.
      dispatch-enabled: true

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:true}"

openbank:
  sdd:
    expiry-cron: "0 15 3 * * ?"
    expiry:
      enabled: false
  outbox:
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      sdd-events-out:
        connector: smallrye-kafka
        client.id: sdd-service-${quarkus.uuid}
        topic: openbank.sdd.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # #1000: self-consume the collection-authorised events this service itself publishes, and
      # book the debtor-side debit. group.id / auto.offset.reset deliberately NOT set as YAML keys
      # (SmallRye's dotted-key footgun, #686/#703) — defaults are what we want: group.id falls back
      # to quarkus.application.name (a service-scoped consumer group), auto.offset.reset stays
      # `latest` so a fresh deploy does not replay historical authorisations and re-debit them.
      sdd-collection-authorised-in:
        # #5745: rethrow only helps if the connector PARKS the record. SmallRye's DEFAULT
        # failure-strategy is `fail`, which STOPS the channel — so a consumer that rethrows
        # without this line trades silent data loss for a wedged partition. The topic name is
        # EXPLICIT because SmallRye's implicit `dead-letter-topic-<channel>` is derived from the
        # channel name alone, and channel names repeat across services (party-events-in exists in
        # eight) — two services would dead-letter into one topic. NESTED, not the dotted leaf
        # `dead-letter-queue.topic:` — SmallRye's YAML source quotes a leaf key containing a dot,
        # registering it as ..."dead-letter-queue.topic" which the connector never reads (#686).
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: openbank.dlq.sdd.sdd-collection-authorised-in
        connector: smallrye-kafka
        topic: openbank.sdd.event
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
