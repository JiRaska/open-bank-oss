openapi: 3.1.0
info:
  title: AML Service API
  version: 1.2.0
  description: >-
    Anti-Money Laundering screening case lifecycle — submit, review, and decide AML cases.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8117
    description: Local development
tags:
  - name: AML Cases

security:
  - bearerAuth: []

paths:
  /api/v1/aml/cases:
    post:
      tags: [AML Cases]
      summary: Submit an AML screening case
      operationId: createAmlCase
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAmlCaseRequest'
      responses:
        '201':
          description: Case created
          headers:
            Location:
              description: URI of the created case
              schema:
                type: string
                format: uri-reference
            X-Idempotency-Replayed:
              description: Present with value `true` when the stored response for this Idempotency-Key is replayed.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [AML Cases]
      summary: List AML screening cases
      operationId: listAmlCases
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AmlCaseStatus'
        - name: partyId
          in: query
          schema:
            type: string
            format: uuid
        - name: screeningType
          in: query
          schema:
            $ref: '#/components/schemas/ScreeningType'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of AML cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/aml/cases/{caseId}:
    get:
      tags: [AML Cases]
      summary: Get AML case by ID
      operationId: getAmlCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      responses:
        '200':
          description: AML case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/aml/cases/{caseId}/decision:
    put:
      tags: [AML Cases]
      summary: Update AML case decision
      operationId: updateAmlDecision
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAmlDecisionRequest'
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-supplied key; `AmlCaseResource.createCase` rejects a blank or absent value.
        A repeat with the same key replays the stored 201 response.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Caller lacks a required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Invalid AML case status transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    AmlCaseStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, CLEARED, BLOCKED, ESCALATED]

    ScreeningType:
      type: string
      enum: [CUSTOMER_ONBOARDING, TRANSACTION_MONITORING, PERIODIC_REVIEW, MANUAL_INVESTIGATION]

    AmlRiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    CreateAmlCaseRequest:
      type: object
      required: [partyId, customerReference, screeningType, riskLevel, alertCode]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        customerReference:
          type: string
        screeningType:
          $ref: '#/components/schemas/ScreeningType'
        riskLevel:
          $ref: '#/components/schemas/AmlRiskLevel'
        alertCode:
          type: string
        alertDetail:
          type: string
          nullable: true
        matchedEntity:
          type: string
          nullable: true

    UpdateAmlDecisionRequest:
      type: object
      description: >-
        `decidedBy` is additionally rejected when blank, and `decisionReason` is mandatory when
        `targetStatus` is BLOCKED — both enforced in `AmlCase.transitionTo`.
      required: [targetStatus, decidedBy]
      properties:
        targetStatus:
          $ref: '#/components/schemas/AmlCaseStatus'
        decisionReason:
          type: string
          nullable: true
          description: Required when targetStatus is BLOCKED.
        assignedAnalyst:
          type: string
          nullable: true
        decidedBy:
          type: string

    AmlCaseResponse:
      type: object
      required:
        - id
        - idempotencyKey
        - partyId
        - customerReference
        - screeningType
        - riskLevel
        - status
        - alertCode
        - screenedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        customerReference:
          type: string
        screeningType:
          $ref: '#/components/schemas/ScreeningType'
        riskLevel:
          $ref: '#/components/schemas/AmlRiskLevel'
        status:
          $ref: '#/components/schemas/AmlCaseStatus'
        alertCode:
          type: string
        alertDetail:
          type: string
          nullable: true
        matchedEntity:
          type: string
          nullable: true
        decisionReason:
          type: string
          nullable: true
        assignedAnalyst:
          type: string
          nullable: true
        decidedBy:
          type: string
          nullable: true
        screenedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [traceId, status, code, message]
      properties:
        traceId:
          type: string
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue:
          nullable: true
