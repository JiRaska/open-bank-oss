openapi: 3.1.0
info:
  title: AML Service API
  version: 1.0.0
  description: Anti-Money Laundering case management — create, review, and update AML case decisions.
  license:
    name: MPL-2.0
    url: https://www.mozilla.org/MPL/2.0/
servers:
  - url: http://localhost:8106
    description: Local development
tags:
  - name: AML

paths:
  /api/v1/aml/cases:
    post:
      tags: [AML]
      summary: Create an AML case
      operationId: createAmlCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAmlCaseRequest'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
    get:
      tags: [AML]
      summary: List AML cases
      operationId: listAmlCases
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, UNDER_REVIEW, CLOSED, ESCALATED, SAR_FILED]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of AML cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmlCaseResponse'

  /api/v1/aml/cases/{caseId}:
    get:
      tags: [AML]
      summary: Get AML case by ID
      operationId: getAmlCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      responses:
        '200':
          description: AML case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/aml/cases/{caseId}/decision:
    put:
      tags: [AML]
      summary: Update AML case decision
      operationId: updateAmlDecision
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: Decision updated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    CreateAmlCaseRequest:
      type: object
      required: [partyId, triggerType, riskScore]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        triggerType:
          type: string
          enum: [TRANSACTION_THRESHOLD, UNUSUAL_PATTERN, SANCTIONS_HIT, MANUAL]
        riskScore:
          type: number
          minimum: 0
          maximum: 100
        notes:
          type: string

    UpdateDecisionRequest:
      type: object
      required: [decision, analystId]
      properties:
        decision:
          type: string
          enum: [NO_ACTION, MONITOR, CLOSE, ESCALATE, FILE_SAR]
        analystId:
          type: string
          format: uuid
        notes:
          type: string

    AmlCaseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          nullable: true
        triggerType:
          type: string
        status:
          type: string
        riskScore:
          type: number
        decision:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
