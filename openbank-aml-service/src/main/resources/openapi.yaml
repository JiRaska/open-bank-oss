openapi: 3.1.0
info:
  title: AML Service API
  version: 1.7.0
  description: >-
    Anti-Money Laundering screening case lifecycle — submit, review, and decide AML cases.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8117
    description: Local development
tags:
  - name: AML Cases
  - name: AML Monitoring
  - name: AML Reports

security:
  - bearerAuth: []

paths:
  /api/v1/aml/cases:
    post:
      tags: [AML Cases]
      summary: Submit an AML screening case
      description: >-
        Idempotent on the Idempotency-Key header. The key is bound to a fingerprint of the request
        (method, path, canonical body) and claimed atomically: a retry with the same body replays
        the stored 201, reusing the key with a different body is refused with 409
        IDEMPOTENCY_KEY_REUSED, and a duplicate arriving while the first is still processing is
        refused with 409 IDEMPOTENCY_REQUEST_IN_PROGRESS.
        A key in a namespace the service writes itself (`tm:`, `payment-hold:`) is
        refused with 400: those cases are opened by the service's own jobs and consumers only.
        The all-zero UUID is refused as `partyId`.
      operationId: createAmlCase
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAmlCaseRequest'
      responses:
        '201':
          description: Case created
          headers:
            Location:
              description: URI of the created case
              schema:
                type: string
                format: uri-reference
            X-Idempotency-Replayed:
              description: Present with value `true` when the stored response for this Idempotency-Key is replayed.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Idempotency-Key conflict (#10916), distinguished by `code`.
            IDEMPOTENCY_KEY_REUSED — the key was already used for a different request (method,
            path or canonical body differ); no case is opened and the stored response is not
            replayed. IDEMPOTENCY_REQUEST_IN_PROGRESS — the same request is still being processed
            under this key; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [AML Cases]
      summary: List AML screening cases
      operationId: listAmlCases
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AmlCaseStatus'
        - name: partyId
          in: query
          schema:
            type: string
            format: uuid
        - name: partyResolved
          in: query
          description: >-
            `false` narrows to cases whose owning party is not established, `true` to cases whose
            party is; omit it for both.
          schema:
            type: boolean
        - name: screeningType
          in: query
          schema:
            $ref: '#/components/schemas/ScreeningType'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of AML cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/aml/cases/{caseId}:
    get:
      tags: [AML Cases]
      summary: Get AML case by ID
      operationId: getAmlCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      responses:
        '200':
          description: AML case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/aml/cases/{caseId}/decision:
    put:
      tags: [AML Cases]
      summary: Update AML case decision
      description: >-
        Single-analyst decision. On a case the held-payment intake opened, CLEARED and BLOCKED are
        refused with 409: such a case is decided by two analysts through
        /api/v1/aml/cases/{caseId}/hold-decision/proposal and /hold-decision/confirmation (ADR-0374).
      operationId: updateAmlDecision
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAmlDecisionRequest'
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/aml/cases/{caseId}/hold-decision/proposal:
    post:
      tags: [AML Cases]
      summary: Propose the decision on a held payment's case (four-eyes, first analyst)
      description: >-
        ADR-0374 point 3. Only a case the held-payment intake opened. Records the proposal; changes no
        status and emits no event. A later proposal replaces a pending one. Human compliance staff only.
      operationId: proposeHoldDecision
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldDecisionRequest'
      responses:
        '201':
          description: Proposal recorded; a different analyst confirms it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldDecisionProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [AML Cases]
      summary: Read the pending decision proposal of a held payment's case
      operationId: getHoldDecisionProposal
      parameters:
        - $ref: '#/components/parameters/caseId'
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldDecisionProposalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/aml/cases/{caseId}/hold-decision/confirmation:
    post:
      tags: [AML Cases]
      summary: Confirm the proposed decision on a held payment's case (four-eyes, second analyst)
      description: >-
        A different analyst than the proposer restates the pending proposal's outcome and reason. Only
        this moves the case to CLEARED or BLOCKED and emits aml.case.status_changed.v1. 409 when the
        caller proposed it, when the restated outcome or reason differ from the pending proposal, or
        when there is none.
      operationId: confirmHoldDecision
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldDecisionRequest'
      responses:
        '200':
          description: Case decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/aml/monitoring/cases/{caseId}/disposition-proposals:
    post:
      tags: [AML Monitoring]
      summary: Propose how a case opened by the monitoring evaluation is closed
      operationId: proposeMonitoringDisposition
      parameters:
        - name: caseId
          in: path
          required: true
          description: AML case id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeDispositionRequest'
      responses:
        '201':
          description: Proposal recorded; a second, different person decides it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositionProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/aml/monitoring/outcomes:
    get:
      tags: [AML Monitoring]
      summary: The outcome vocabulary a disposition or a report outcome is chosen from
      description: >-
        The pinned revision `outcomeCode` is resolved against. A client offers exactly these
        codes rather than keeping its own copy.
      operationId: getMonitoringOutcomeVocabulary
      responses:
        '200':
          description: The outcome vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeCatalogueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/aml/monitoring/disposition-proposals:
    get:
      tags: [AML Monitoring]
      summary: Disposition proposals awaiting a decision
      operationId: listPendingMonitoringDispositions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Pending proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DispositionProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/aml/monitoring/disposition-proposals/{proposalId}/decision:
    post:
      tags: [AML Monitoring]
      summary: Approve or reject a disposition proposal as a second, different person
      operationId: decideMonitoringDisposition
      parameters:
        - name: proposalId
          in: path
          required: true
          description: Disposition proposal id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideDispositionRequest'
      responses:
        '200':
          description: Proposal decided; on approval the case was moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositionProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRule'

  /api/v1/aml/reports:
    post:
      tags: [AML Reports]
      summary: Draft a suspicious-transaction report
      operationId: draftSuspiciousTransactionReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftReportRequest'
      responses:
        '201':
          description: Report drafted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [AML Reports]
      summary: List suspicious-transaction reports
      operationId: listSuspiciousTransactionReports
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/ReportState'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/aml/reports/{reportId}:
    get:
      tags: [AML Reports]
      summary: Get a suspicious-transaction report
      operationId: getSuspiciousTransactionReport
      parameters:
        - name: reportId
          in: path
          required: true
          description: Report id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/aml/reports/{reportId}/approval:
    post:
      tags: [AML Reports]
      summary: Approve a drafted report as a second, different person
      operationId: approveSuspiciousTransactionReport
      parameters:
        - name: reportId
          in: path
          required: true
          description: Report id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRule'

  /api/v1/aml/reports/{reportId}/filing:
    post:
      tags: [AML Reports]
      summary: Record that an approved report was filed outside this system
      operationId: recordSuspiciousTransactionReportFiling
      parameters:
        - name: reportId
          in: path
          required: true
          description: Report id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordFilingRequest'
      responses:
        '200':
          description: Filing recorded. The system submits nothing itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRule'

  /api/v1/aml/reports/{reportId}/withdrawal:
    post:
      tags: [AML Reports]
      summary: Withdraw a report that was not filed
      operationId: withdrawSuspiciousTransactionReport
      parameters:
        - name: reportId
          in: path
          required: true
          description: Report id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawReportRequest'
      responses:
        '200':
          description: Report withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRule'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-supplied key; `AmlCaseResource.createCase` rejects a blank or absent value.
        Keys starting with `aml-` and ending with `-FRAUD_REVIEW` are reserved for the
        domestic-payment service's own authenticated machine identity; other callers receive 403,
        including callers otherwise permitted to create cases. This check also applies to retries.
        A permitted repeat with the same key replays the stored 201 response.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Caller lacks a required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Invalid AML case status transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BusinessRule:
      description: A business rule refused the action, for example the approver is the proposer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    AmlCaseStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, CLEARED, BLOCKED, ESCALATED]

    ScreeningType:
      type: string
      enum: [CUSTOMER_ONBOARDING, TRANSACTION_MONITORING, PERIODIC_REVIEW, MANUAL_INVESTIGATION]

    AmlRiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    CreateAmlCaseRequest:
      type: object
      required: [partyId, customerReference, screeningType, riskLevel, alertCode]
      properties:
        partyId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        customerReference:
          type: string
        screeningType:
          $ref: '#/components/schemas/ScreeningType'
        riskLevel:
          $ref: '#/components/schemas/AmlRiskLevel'
        alertCode:
          type: string
        alertDetail:
          type: string
          nullable: true
        matchedEntity:
          type: string
          nullable: true

    UpdateAmlDecisionRequest:
      type: object
      description: >-
        `decisionReason` is mandatory when `targetStatus` is BLOCKED. The decider is the
        authenticated caller. A case opened by the monitoring pack evaluation can only be moved to
        UNDER_REVIEW here; closing or escalating it goes through a disposition proposal.
      required: [targetStatus]
      properties:
        targetStatus:
          $ref: '#/components/schemas/AmlCaseStatus'
        decisionReason:
          type: string
          nullable: true
          description: Required when targetStatus is BLOCKED.
        assignedAnalyst:
          type: string
          nullable: true
        decidedBy:
          type: string
          deprecated: true
          description: Ignored. The decider is taken from the authenticated caller.

    HoldDisposition:
      type: string
      enum: [CLEAR, BLOCK]
      description: CLEAR releases the held payment (case CLEARED); BLOCK rejects it (case BLOCKED).
    HoldDecisionRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          $ref: '#/components/schemas/HoldDisposition'
        reason:
          type: string
          minLength: 1
    HoldDecisionProposalResponse:
      type: object
      required: [caseId, status, outcome, reason, proposedBy, proposedAt]
      properties:
        caseId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AmlCaseStatus'
        outcome:
          $ref: '#/components/schemas/HoldDisposition'
        reason:
          type: string
        proposedBy:
          type: string
        proposedAt:
          type: string
          format: date-time
    OutcomeCatalogueResponse:
      type: object
      required: [vocabularyId, vocabularyRevision, vocabularyHash, entries]
      properties:
        vocabularyId:
          type: string
        vocabularyRevision:
          type: integer
        vocabularyHash:
          type: string
        entries:
          type: array
          items:
            type: object
            required: [code, label, meaning]
            properties:
              code:
                type: string
              label:
                type: string
              meaning:
                type: string

    AmlCaseResponse:
      type: object
      required:
        - id
        - idempotencyKey
        - partyId
        - customerReference
        - screeningType
        - riskLevel
        - status
        - alertCode
        - screenedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        partyId:
          type: string
          format: uuid
          description: >-
            The party the case is about. Meaningful only when `partyResolved` is true: while the
            party is not established this is the all-zero UUID (or, on older cases, a copy of
            `accountId`), which identifies nobody.
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        customerReference:
          type: string
        screeningType:
          $ref: '#/components/schemas/ScreeningType'
        riskLevel:
          $ref: '#/components/schemas/AmlRiskLevel'
        status:
          $ref: '#/components/schemas/AmlCaseStatus'
        alertCode:
          type: string
        alertDetail:
          type: string
          nullable: true
        matchedEntity:
          type: string
          nullable: true
        decisionReason:
          type: string
          nullable: true
        assignedAnalyst:
          type: string
          nullable: true
        decidedBy:
          type: string
          nullable: true
        screenedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        requiresFourEyesDisposition:
          type: boolean
          description: >-
            True when the case can be closed or escalated only through an approved four-eyes
            disposition proposal (`/api/v1/aml/monitoring/...`). For such a case `PUT /decision`
            accepts only UNDER_REVIEW.
        partyResolved:
          type: boolean
          description: >-
            False while the owning party of the case is not established, for example a held payment
            whose rail could not name the debtor's party. The service resolves it from `accountId`
            afterwards; until then `partyId` does not identify a party.

    ApiError:
      type: object
      required: [traceId, status, code, message]
      properties:
        traceId:
          type: string
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue:
          nullable: true

    CaseDisposition:
      type: string
      enum: [CLEAR, REPORT]

    ProposalState:
      type: string
      enum: [PROPOSED, APPROVED, REJECTED, WITHDRAWN, EXECUTED]

    ReportState:
      type: string
      enum: [DRAFT, APPROVED, FILED, WITHDRAWN]

    DecisionOutcome:
      type: object
      description: A code of one pinned revision of the decision-outcome vocabulary.
      required: [vocabularyId, vocabularyRevision, vocabularyHash, code]
      properties:
        vocabularyId:
          type: string
        vocabularyRevision:
          type: integer
        vocabularyHash:
          type: string
        code:
          type: string

    ProposeDispositionRequest:
      type: object
      required: [disposition, outcomeCode]
      properties:
        disposition:
          $ref: '#/components/schemas/CaseDisposition'
        outcomeCode:
          type: string
          description: A code of the decision-outcome vocabulary. An unknown code is refused.
        note:
          type: string
          nullable: true

    DecideDispositionRequest:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
        reason:
          type: string
          nullable: true

    DispositionProposalResponse:
      type: object
      required: [proposalId, caseId, disposition, outcome, state, proposedBy, proposedAt]
      properties:
        proposalId:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        disposition:
          $ref: '#/components/schemas/CaseDisposition'
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        note:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/ProposalState'
        proposedBy:
          type: string
        proposedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decisionReason:
          type: string
          nullable: true
        executedAt:
          type: string
          format: date-time
          nullable: true

    ReportedMovement:
      type: object
      description: A booked movement, by the booking's own key.
      required: [journalEntryId, accountId, currency]
      properties:
        journalEntryId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        currency:
          type: string

    DraftReportRequest:
      type: object
      required: [partyId, narrative, caseIds]
      properties:
        partyId:
          type: string
          format: uuid
        narrative:
          type: string
        caseIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        movements:
          type: array
          items:
            $ref: '#/components/schemas/ReportedMovement'

    RecordFilingRequest:
      type: object
      required: [filingReference, filedAt, outcomeCode]
      properties:
        filingReference:
          type: string
          description: The reference under which the officer filed the report outside this system.
        filedAt:
          type: string
          format: date-time
        outcomeCode:
          type: string

    WithdrawReportRequest:
      type: object
      required: [outcomeCode]
      properties:
        outcomeCode:
          type: string

    ReportResponse:
      type: object
      required: [reportId, partyId, state, narrative, caseIds, movements, draftedBy, draftedAt, updatedAt]
      properties:
        reportId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ReportState'
        narrative:
          type: string
        caseIds:
          type: array
          items:
            type: string
            format: uuid
        movements:
          type: array
          items:
            $ref: '#/components/schemas/ReportedMovement'
        draftedBy:
          type: string
        draftedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        filingReference:
          type: string
          nullable: true
        filedAt:
          type: string
          format: date-time
          nullable: true
        filingRecordedBy:
          type: string
          nullable: true
        filingRecordedAt:
          type: string
          format: date-time
          nullable: true
        withdrawnBy:
          type: string
          nullable: true
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
        outcome:
          allOf:
            - $ref: '#/components/schemas/DecisionOutcome'
