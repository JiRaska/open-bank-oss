# Per-service governance manifest (ADR-0071). Declarative, curatorial facts only —
# derived fields (Flyway/apiVersion) and runtime drift live elsewhere. Schema:
# openbank-libs/governance/governance.schema.json
dataDomain: compliance
primaryDatastore: PostgreSQL
schemaName: aml_schema
dataLineageRole: both
dataClassification: restricted
retentionPolicy: 10 years
evidenceExported: true
lineage:
  upstream:
    - serviceName: sepa-payment
      relationType: api
      description: screens
    - serviceName: sepa-instant
      relationType: api
      description: screens
    - serviceName: domestic-payment
      relationType: api
      description: screens
    - serviceName: fx-service
      relationType: api
      description: screens
    - serviceName: agent-service
      relationType: api
      description: reads
    - serviceName: party-service
      relationType: topic
      description: triggers
schemaLineage:
  ownedSchemas:
    - aml_schema
  dependentSchemas:
    - sepa_schema
    - domestic_schema
    - swift_schema
    - sepa_instant_schema
