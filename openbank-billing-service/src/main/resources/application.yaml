quarkus:
  application:
    # version derives from version.txt — must NOT be set here (rules.yaml: release_invariant).
    name: openbank-billing-service
  http:
    port: 8132
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-billing-service
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs
  scheduler:
    enabled: true
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false

  # Inbound resource-server: the assess/post endpoints require a valid token.
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: ${OIDC_TLS_VERIFICATION:none}

  # Outbound service-to-service auth (client-credentials). The PII read clients and the ledger
  # posting client (@RegisterProvider OidcClientRequestReactiveFilter) mint an openbank-services token.
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080/realms/openbank}
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client
    tls:
      verification: ${OIDC_TLS_VERIFICATION:none}

  rest-client:
    product-catalog:
      url: ${PRODUCT_CATALOG_SERVICE_URL:http://localhost:8104}
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8100}
    balance-service:
      url: ${BALANCE_SERVICE_URL:http://localhost:8103}
    ledger-service:
      url: ${LEDGER_SERVICE_URL:http://localhost:8101}

  # Persistence (ADR-0143 phase 2c): billing_cycle_assessment / assessed_fee / billing_outbox.
  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_billing
      # Pool self-heal (#1682). Quarkus leaves all three levers OFF by default, so a
      # transient DB blip that poisons pooled connections leaves them dead forever —
      # the reactive pool has no way to purge them and wedges the service until a pod
      # restart (billing sat unable to reach a healthy billing-db for ~8h, 0 restarts).
      # idle-timeout evicts a dead idle connection within the cleaner period so the next
      # acquire opens a fresh one; max-lifetime is the hard ceiling on how long any wedge
      # can survive; max-size bounds the pool so a reconnect storm can't grow it unbounded.
      idle-timeout: 5M
      max-lifetime: 30M
      max-size: 20
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_billing
  flyway:
    migrate-at-start: true
    validate-on-migrate: false
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none

  # Four-eyes ApprovalStore backing store (ADR-0155).
  redis:
    hosts: redis://localhost:6379

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    outgoing:
      # ADR-0248: billing-service's first Kafka topic — there was no existing one to reuse (every
      # prior outbox row here posts to ledger-service over REST, never Kafka). Named for the
      # service, not the one event type it carries today, mirroring openbank-interest-service's
      # "one topic, eventType discriminates" convention (openbank.interest.accrual.event) in case
      # billing gains a second Kafka-published event later.
      billing-events-out:
        connector: smallrye-kafka
        client.id: billing-service-${quarkus.uuid}
        topic: openbank.billing.fee.event
        value.serializer: org.apache.kafka.common.serialization.StringSerializer
        key.serializer: org.apache.kafka.common.serialization.StringSerializer

opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
  # ADR-0155: four-eyes ENFORCEMENT (blocking a maker's request pending a second approver),
  # independent of the base allow/deny enforce toggle above. Stays false by default — same
  # deliberate, separate rollout decision every other money-path service in the fleet makes
  # (sepa-payment's application.yaml has the identical comment); flipping this is a runbook-gated
  # follow-up, not bundled with the ApprovalStore wiring itself.
  four-eyes:
    enforce: "${AUTHZ_FOUR_EYES_ENFORCE:false}"

billing:
  ledger:
    # System-actor id recorded as the journal's createdBy (ADR-0143 step 4) and the two leaf GL
    # accounts every fee journal debits/credits. Placeholder defaults (the "a0000000-…" family the
    # ledger seeds, see LendingLedgerConfig for the identical convention); operators override to
    # the real chart of accounts per environment.
    system-actor-id: ${BILLING_LEDGER_SYSTEM_ACTOR_ID:00000000-0000-0000-0000-0000000000bb}
    gl:
      # Deposit-control (2100, same seeded account as settlement/transaction/interest use), not
      # a separate fee-receivable asset account — subAccountId is only valid on deposit-control
      # legs (ADR-0039 Phase B); "1400" was never a seeded GL account, so every real fee posting
      # 422'd against ledger-service. Fixed alongside the pact coverage for this edge (issue #468).
      fee-receivable: ${BILLING_GL_FEE_RECEIVABLE_ACCOUNT_ID:a0000000-0000-0000-0000-000000000002}
      # 4003, not the older 4001 — V1__init_ledger.sql seeded 4001 with gen_random_uuid(), so no
      # fixed UUID could ever reference it (issue #468). V15 adds a stable-UUID replacement.
      fee-income: ${BILLING_GL_FEE_INCOME_ACCOUNT_ID:a0000000-0000-0000-0000-000000004003}

openbank:
  outbox:
    # Bare literal `true` (not an env-var-with-default) — matches every other dispatch-gated
    # service in the fleet (interest/sepa-payment/standing-order) and satisfies
    # check-outbox-dispatch-enabled.sh's regression guard, which only recognizes a literal
    # `true`/`"true"` here by design: the flag must be baked into the image, not left to an
    # environment that might forget to set an override env var (the exact footgun the check
    # exists to catch — a silently-false default with attempt_count stuck at 0, no error).
    dispatch-enabled: true
    poll-interval: 5s
    initial-delay: 5s
  billing:
    scheduler:
      # Disabled by default — the scheduler cannot charge anyone on default config.
      # Batch source (BillingCycleScheduler KDoc, ADR-0143 / issue #548): account-ids CSV set
      # -> deliberate manual override; CSV empty + discovery-enabled=true -> the batch is
      # discovered from account-service's fleet-wide GET /api/v1/accounts/active; neither -> no-op.
      enabled: "${BILLING_SCHEDULER_ENABLED:false}"
      cron: "${BILLING_SCHEDULER_CRON:0 0 3 1 * ?}"
      account-ids: "${BILLING_SCHEDULER_ACCOUNT_IDS:}"
      currency: "${BILLING_SCHEDULER_CURRENCY:CZK}"
      # Fleet-wide discovered sweep charges EVERY active account — its own opt-in on top of
      # `enabled`, so flipping the scheduler on for a scoped manual run can never fan out.
      discovery-enabled: "${BILLING_SCHEDULER_DISCOVERY_ENABLED:false}"
      discovery-page-size: "${BILLING_SCHEDULER_DISCOVERY_PAGE_SIZE:100}"
    annual-fee-summary:
      scheduler:
        # ADR-0248. Disabled by default — see AnnualFeeSummaryScheduler's class KDoc for why this
        # is a firmer requirement than the usual "safe default", not boilerplate: an accidental
        # fire in dev/test/staging publishes a real PAD Art. 5 push-duty event per active account.
        enabled: "${BILLING_ANNUAL_FEE_SUMMARY_SCHEDULER_ENABLED:false}"
        # Default: 05:00 Europe/Prague on Jan 15th — well after the December cycle's fees have
        # posted, so the prior year's data is settled before the sweep reads it.
        cron: "${BILLING_ANNUAL_FEE_SUMMARY_SCHEDULER_CRON:0 0 5 15 1 ?}"
        currency: "${BILLING_ANNUAL_FEE_SUMMARY_SCHEDULER_CURRENCY:CZK}"
        discovery-page-size: "${BILLING_ANNUAL_FEE_SUMMARY_SCHEDULER_DISCOVERY_PAGE_SIZE:100}"

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false

"%test":
  quarkus:
    management:
      enabled: false
    # No Keycloak under @QuarkusTest — the boot smoke does not drive the security layer.
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    datasource:
      username: openbank
      password: openbank_secret
      reactive:
        url: postgresql://localhost:5432/openbank_billing_it
      jdbc:
        url: jdbc:postgresql://localhost:5432/openbank_billing_it
    devservices:
      enabled: false
    # ADR-0050: disable the @Scheduled outbox/cycle ticks under test so an IT drives the dispatch
    # explicitly and never races the assertions (mirrors openbank-interest-service).
    scheduler:
      enabled: false
