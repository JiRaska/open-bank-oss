quarkus:
  application:
    name: openbank-billing-service
    version: 0.1.0
  http:
    port: 8132
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"
  log:
    level: INFO
  smallrye-openapi:
    path: /q/openapi
  swagger-ui:
    always-include: true
    path: /api/docs

"%test":
  quarkus:
    management:
      enabled: false
