openapi: 3.1.0
info:
  title: Billing Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048). Minor bump (1.2 -> 1.3): additive
  # endpoint only (POST /fees/reverse) — phase 2e, no breaking change.
  version: 1.5.0
  description: >-
    Runtime product fee assessment, posting and reversal (ADR-0143). POST /api/v1/fees/assess
    computes an account's fee assessment from live account/balance/catalog reads and returns it
    (dry run — no ledger posting). POST /api/v1/fees/post (phase 2c-ii) persists the assessment
    and commits the atomic intent-to-post to the transactional outbox, which then posts a balanced
    journal to the ledger; it carries the four-eyes `billing.post` action (maker != checker),
    decided via PATCH /api/v1/fees/approvals/{id}. POST /api/v1/fees/reverse (phase 2e) reverses a
    wrongly-charged, already-POSTED fee via a compensating journal (exact reverse GL direction);
    it carries the four-eyes `billing.reverse` action, decided the same way.
servers:
  - url: http://localhost:8132
    description: Local development
paths:
  /api/v1/info:
    get:
      summary: Service identity and version (served by openbank-libs).
      responses:
        "200":
          description: Service info.
  /api/v1/fees/assess:
    post:
      summary: Assess (dry-run) an account's product fees for a billing cycle. Posts nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: cycleId
          in: query
          required: true
          description: Billing cycle identifier, at most 64 characters.
          schema: { type: string }
        - name: accountId
          in: query
          required: true
          description: Account identifier, at most 64 characters.
          schema: { type: string }
        - name: currency
          in: query
          required: true
          description: >-
            ISO 4217 alphabetic code. Case-insensitive on input, normalised to upper case before it
            is persisted, so one currency can never be stored under two spellings.
          schema: { type: string }
      responses:
        "200":
          description: The computed assessment (assessed fees + chargeable journal commands).
        "400":
          description: >-
            Missing required query parameter, an id longer than 64 characters, or a currency
            that is not a known ISO 4217 code.
        "401":
          description: Unauthenticated.
        "403":
          description: Authenticated but denied by the OPA authorization policy (ADR-0034).
  /api/v1/fees/post:
    post:
      summary: >-
        Assess and commit the intent-to-post for a billing cycle/account/currency (ADR-0143
        phase 2c-ii). Idempotent: a second call for the same cycle/account/currency returns the
        already-persisted assessment. Subject to the four-eyes `post` verb — a maker's call may
        be paused (202, PendingApproval) pending a distinct checker's decision via
        /fees/approvals/{id}, then retried with an X-Approval-Id header.
      security:
        - bearerAuth: []
      parameters:
        - name: cycleId
          in: query
          required: true
          description: Billing cycle identifier, at most 64 characters.
          schema: { type: string }
        - name: accountId
          in: query
          required: true
          description: Account identifier, at most 64 characters.
          schema: { type: string }
        - name: currency
          in: query
          required: true
          description: >-
            ISO 4217 alphabetic code. Case-insensitive on input, normalised to upper case before it
            is persisted, so one currency can never be stored under two spellings.
          schema: { type: string }
      responses:
        "200":
          description: The persisted assessment (assessed fees, each with its posting status).
        "202":
          description: Four-eyes pending — a second, distinct principal must approve via /fees/approvals/{id}.
        "400":
          description: >-
            Missing required query parameter, an id longer than 64 characters, or a currency
            that is not a known ISO 4217 code.
        "401":
          description: Unauthenticated.
        "403":
          description: Authenticated but denied by the OPA authorization policy (ADR-0034).
  /api/v1/fees/reverse:
    post:
      summary: >-
        Reverse an already-POSTED fee via a compensating ledger journal (ADR-0143 phase 2e).
        Idempotent: reversing an already-REVERSAL_PENDING/REVERSED fee returns the existing fee
        unchanged rather than posting a second compensating journal. Subject to the four-eyes
        `reverse` verb — a maker's call may be paused (202, PendingApproval) pending a distinct
        checker's decision via /fees/approvals/{id}, then retried with an X-Approval-Id header.
      security:
        - bearerAuth: []
      parameters:
        - { name: idempotencyKey, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "200":
          description: The reversed fee (posting status REVERSAL_PENDING, awaiting outbox dispatch).
        "202":
          description: Four-eyes pending — a second, distinct principal must approve via /fees/approvals/{id}.
        "400":
          description: Missing idempotencyKey query parameter or reason body field.
        "401":
          description: Unauthenticated.
        "403":
          description: Authenticated but denied by the OPA authorization policy (ADR-0034).
        "404":
          description: No assessed fee with that idempotencyKey.
        "409":
          description: The fee exists but was never POSTED (waived, zero, still PENDING, or FAILED) — nothing to reverse.
  /api/v1/fees/approvals:
    get:
      summary: List pending billing approvals, oldest first (ADR-0227 D2).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Pending billing approvals, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalResponse' }
        "401":
          description: Unauthenticated.
        "403":
          description: Authenticated but denied by the OPA authorization policy (ADR-0034).
  /api/v1/fees/approvals/{id}:
    patch:
      summary: Approve or reject a pending four-eyes approval for a fee posting (ADR-0155).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        "200":
          description: The decided approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalResponse' }
        "401":
          description: Unauthenticated.
        "403":
          description: Authenticated but denied by the OPA authorization policy (ADR-0034).
        "404":
          description: No pending approval with that id.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApprovalResponse:
      type: object
      description: >-
        A four-eyes billing approval. makerId identifies who requested the fee action; the shared
        ApprovalStore requires a different authenticated principal to decide it.
      required: [id, action, status]
      properties:
        id: { type: string }
        action:
          type: string
          description: The gated billing action this approval was raised for.
        resourceId: { type: string, nullable: true }
        status: { type: string }
        makerId: { type: string, nullable: true }
        createdAt:
          type: string
          format: date-time
          description: Request time; pending approvals expire after 24 hours.
        decidedBy: { type: string, nullable: true }
