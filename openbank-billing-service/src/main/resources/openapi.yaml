openapi: 3.1.0
info:
  title: Billing Service API
  # major == openbank.api.version == URL /api/v1 (ADR-0048).
  version: 1.0.0
  description: >-
    Runtime product fee assessment and posting (ADR-0143). Phase 2b is the service skeleton;
    the fee-assessment / posting endpoints (POST /api/v1/fees/assess) land in phase 2c.
servers:
  - url: http://localhost:8132
    description: Local development
paths:
  /api/v1/info:
    get:
      summary: Service identity and version (served by openbank-libs).
      responses:
        "200":
          description: Service info.
