quarkus:
  application:
    name: openbank-fraud-service
  http:
    port: 8133
    cors:
      ~: true
      origins: "http://localhost:3000"
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      headers: Content-Type,Authorization,Idempotency-Key
    header:
      X-Content-Type-Options:
        value: nosniff
      X-Frame-Options:
        value: DENY
      X-XSS-Protection:
        value: "1; mode=block"
      Referrer-Policy:
        value: strict-origin-when-cross-origin
      Permissions-Policy:
        value: "geolocation=(), microphone=(), camera=()"
      Content-Security-Policy:
        value: "default-src 'self'"
      Strict-Transport-Security:
        value: "max-age=31536000; includeSubDomains"

  datasource:
    db-kind: postgresql
    username: openbank
    password: ${POSTGRES_PASSWORD:CHANGE_ME_LOCAL_DEV_ONLY}
    reactive:
      url: postgresql://localhost:5432/openbank_fraud
    jdbc:
      url: jdbc:postgresql://localhost:5432/openbank_fraud
  flyway:
    migrate-at-start: true
    connect-retries: 10
    connect-retries-interval: 2S
  hibernate-orm:
    database:
      generation: none
  oidc:
    auth-server-url: http://localhost:8080/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    tls:
      verification: none

  # ADR-0140 online feature store: FeatureStoreConfig @Produces an OnlineFeatureStore from
  # ReactiveRedisDataSource. Quarkus DEACTIVATES that synthetic bean at build time when neither
  # `quarkus.redis.hosts` nor `hosts-provider-name` is set, and boot then dies with
  # `InactiveBeanException: Bean is not active` — not a config warning, a hard start failure.
  # It was reaching this service from two places OUTSIDE this file and nowhere inside it: the
  # gitops env (`QUARKUS_REDIS_HOSTS`) and PostgresRedisTestResource's Testcontainers override.
  # Every environment that worked supplied it out-of-band, so nothing that reads this repo could
  # tell the service needs Redis at all — which is exactly how the api-fuzz harness, whose Redis
  # provisioning is derived from this file, ran fraud-service twice without it and never sent a
  # single request (run 33720692606). The expression form keeps the deployed value authoritative:
  # QUARKUS_REDIS_HOSTS still wins, and the fallback is the fleet default the other 30 services
  # declare literally.
  redis:
    hosts: ${QUARKUS_REDIS_HOSTS:redis://localhost:6379}

  shutdown:
    timeout: 30S
  log:
    level: INFO
    console:
      json: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
    resource:
      attributes:
        service.name: openbank-fraud-service
  swagger-ui:
    always-include: true
    path: /api/docs
  rest-client:
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8100}
      scope: jakarta.inject.Singleton
  management:
    enabled: true
    port: 8085
    host: 0.0.0.0
    root-path: /q
  dev-ui:
    enabled: false
  # Outbound M2M token for the account-service partyId lookup (ContactPolicyGate-style pattern
  # every other rest-client caller in this fleet uses — see aml-service's identical block).
  oidc-client:
    auth-server-url: ${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8080}/realms/openbank
    client-id: openbank-services
    credentials:
      secret: ${OIDC_CLIENT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY}
    grant:
      type: client

mp:
  messaging:
    connector:
      smallrye-kafka:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
        ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
        ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    incoming:
      transaction-signal:
        connector: smallrye-kafka
        topic: openbank.transactions.transaction.initiated
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # DLQ: stale signals degrade counters gracefully; processing failures go to DLQ
        failure-strategy: dead-letter-queue
        # group.id / auto.offset.reset / dead-letter-queue.topic are deliberately NOT set as YAML
        # keys here — see openbank-infra/gitops/components/fraud-service/fraud-service-msg-override.yaml
        # (loaded via QUARKUS_CONFIG_LOCATIONS) for why and where they're set instead, matching the
        # pattern already established for transaction-service's payment-scheme-accepted channel.
        #
        # Correction (round 2): an earlier version of this comment first cited nonexistent issues
        # #2649/#2659, then over-corrected to claim PR #685's original env-var fix was
        # "independently verified to work" — that overstated it too. The genuine concern is real:
        # quarkusio/quarkus#30106 and smallrye/smallrye-reactive-messaging#2028 document a live,
        # unresolved upstream bug where an env-var override of a single leaf property (e.g.
        # `retries`, here `group.id`/`auto.offset.reset`/`dead-letter-queue.topic`) on a HYPHENATED
        # channel name crashes Quarkus at startup (`SRMSG00071`, "connector attribute must be set
        # for channel <wrong split>") — regardless of whether the channel is already registered
        # via YAML/annotations. #685's own regression test didn't catch this because it injects
        # the override via a QuarkusTestResourceLifecycleManager config map, not a real OS env var,
        # so it doesn't exercise this failure mode. This properties-file mechanism is the CORRECT
        # choice for the hyphenated `transaction-signal` channel, not merely a stylistic
        # alternative or a required-but-optional correction.
        # Summary: SmallRye Config's YAML source unconditionally quotes any leaf map key
        # containing a literal dot (`group.id` becomes the registered property name `"group.id"`,
        # quotes included — true whether or not the YAML key itself is quoted), so
        # KafkaConnectorIncomingConfiguration's plain config.getOptionalValue("group.id", ...) never
        # finds it. Confirmed empirically that all three keys silently resolved to empty this way.
        # group.id then fell back to Quarkus's default (quarkus.application.name), which the
        # fraud-service KafkaUser ACL never granted — every poll hit
        # org.apache.kafka.common.errors.GroupAuthorizationException forever, fail-silent until the
        # failure landed inside Quarkus's synchronous startup window, which is fatal (PR #635's
        # sandbox "Failed to start application" crash-loop; PR #635 did not cause this bug).
    outgoing:
      fraud-outbox-out:
        connector: smallrye-kafka
        client.id: fraud-service-${quarkus.uuid}
        topic: openbank.fraud.hold.changed
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      level: DEBUG
      console:
        json: false
    oidc:
      enabled: false
"%test":
  quarkus:
    management:
      enabled: false
    oidc:
      enabled: false
    oidc-client:
      enabled: false
    devservices:
      enabled: false
  mp:
    messaging:
      incoming:
        transaction-signal:
          connector: smallrye-kafka
          enabled: false
  openbank:
    outbox:
      dispatch-enabled: false
openbank:
  # Every service with an outbox entity must flip this explicitly — it defaults to false, and a
  # service that forgets ships an outbox that fills forever with no error anywhere.
  outbox:
    dispatch-enabled: true
  fraud-hold:
    # ADR-0220 D3.5's targeting-exclusion signal (issue #2749) — deliberately conservative:
    # triggers on repeated REVIEW, not a new DECLINE rule (no rule in FraudRuleEngine produces
    # DECLINE today, and adding one changes real scoring behaviour, not just adds a signal).
    # Marketing-suppression-only: this never touches account/payment restrictions.
    review-threshold: 3
    window-days: 30
    ttl-days: 30
  # ML / shadow scoring (ADR-0139 phase-1b) — READ THIS BEFORE TRUSTING A "shadow score" NUMBER.
  # The in-process ONNX adapter had NEVER loaded in a deployed environment up to #3618: the
  # fleet runtime image was eclipse-temurin:*-jre-alpine (musl) and onnxruntime's
  # libonnxruntime.so is linked against glibc, so OrtEnvironment.getEnvironment() threw
  # UnsatisfiedLinkError at startup and scoreShadow() returned null for every request. Verdicts
  # were therefore rules-only for the whole life of the adapter — measured on arm64: alpine
  # fails on libstdc++.so.6, alpine + `apk add libstdc++` then fails on ld-linux-aarch64.so.1,
  # and only a glibc base loads it (#3354). #3618 moved the base to eclipse-temurin:25-jre and
  # gates it with .github/scripts/verify-image-native-libs.py, which resolves every NEEDED
  # entry before a push. That proves the library CAN load; it is not yet a measurement of a
  # deployed pod scoring, so treat a shadow score as unverified until one is observed. No
  # verdict has ever differed because of this — the bundled model reproduces the previous
  # pure-Kotlin logistic exactly.
  # openbank.ml.require-signature (ADR-0141 model-card pinning) only takes effect once it does.
  rate-limit:
    enabled: true
    max-concurrent-requests: 100
  api:
    version: "1"
  build:
    time: "${BUILD_TIME:unknown}"
  git:
    commit: "${GIT_COMMIT:unknown}"

# OPA sidecar (ADR-0034). Advisory mode by default.
opa:
  url: "${OPA_URL:http://localhost:8181}"
  path: "${OPA_PATH:/v1/data/openbank/rest/allow}"
  timeout-ms: "${OPA_TIMEOUT_MS:500}"
authz:
  enforce: "${AUTHZ_ENFORCE:false}"
