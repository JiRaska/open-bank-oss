openapi: 3.1.0
info:
  title: Fraud Service API
  version: 1.6.0
  description: >-
    Real-time transaction fraud scoring (ADR-0084). Returns a verdict
    (ALLOW/CHALLENGE/REVIEW/DECLINE) for a payment intent. Phase 1 is a deterministic, versioned
    rule set with a single always-ALLOW baseline rule; the service is not yet wired into any
    payment surface.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8133
    description: Local development
tags:
  - name: Fraud

paths:
  /api/v1/fraud/cases:
    post:
      tags: [Fraud]
      operationId: openFraudInvestigationCase
      summary: Open a manual investigation from an existing REVIEW score
      description: Creates no fraud finding and does not change a payment or temporary hold.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvestigationPurpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFraudInvestigationRequest'
      responses:
        '201':
          description: Case opened, or the case already linked to this score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudInvestigationCase'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No eligible REVIEW score with an account was found }
  /api/v1/fraud/cases/{caseId}:
    get:
      tags: [Fraud]
      operationId: getFraudInvestigationCase
      summary: Read current investigation status after live case-scoped Context authorization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/InvestigationPurpose'
      responses:
        '200':
          description: Current source status without score details or party identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudInvestigationCase'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Case not found after authorization }
        '503': { description: Context assignment or policy check unavailable }
  /api/v1/fraud/cases/{caseId}/evidence:
    get:
      tags: [Fraud]
      operationId: getFraudInvestigationEvidence
      summary: Read source-owned score associations after live case-scoped Context authorization
      description: Account and counterparty identifiers are evidence leads, never a fraud finding.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/InvestigationPurpose'
      responses:
        '200':
          description: Source-owned associations for this exact assigned case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudInvestigationEvidence'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Role, policy, assignment or current open-case check denied }
        '404': { description: Case not found after authorization }
        '503': { description: Context assignment or policy check unavailable }
  /api/v1/fraud/cases/{caseId}/match-assigned:
    get:
      tags: [Fraud]
      operationId: matchAssignedFraudCases
      summary: Match only already assigned open cases by source-owned account or counterparty equality
      description: >-
        Requires the dedicated Context service-account token in Authorization and the human
        investigator bearer in X-Investigator-Authorization. The root requires live case-scoped
        authorization. Fraud fetches the bounded assigned candidate set directly from Context;
        the caller cannot choose candidate IDs. Each returned candidate must be independently
        authorized before disclosure. The response
        contains no account or counterparty identifiers.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/InvestigationPurpose'
        - $ref: '#/components/parameters/InvestigatorAuthorization'
      responses:
        '200':
          description: At most four matching case IDs, with a source-side truncation flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudAssignedMatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Role, policy, root assignment or current open-case check denied }
        '404': { description: Root case not found after authorization }
        '503': { description: Context assignment or policy check unavailable }
  /api/v1/fraud/cases/{caseId}/close-without-finding:
    post:
      tags: [Fraud]
      operationId: closeFraudInvestigationCaseWithoutFinding
      summary: Close an assigned case without declaring fraud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/InvestigationPurpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Case closed, or already closed without a finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudInvestigationCase'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Case not found after authorization }
        '503': { description: Context assignment or policy check unavailable }
  /api/v1/fraud/review-queue:
    get:
      tags: [Fraud]
      operationId: reviewQueue
      summary: Analyst review queue — newest REVIEW verdicts (ADR-0230)
      description: >-
        Read-only analyst queue of payments the engine flagged REVIEW (newest first).
        Requires ROLE_COMPLIANCE, ROLE_OPERATOR or ROLE_ADMIN.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Pending REVIEW verdicts }
        '403': { description: Forbidden }
  /api/v1/fraud/score:
    post:
      tags: [Fraud]
      summary: Score a payment intent and return a fraud verdict
      operationId: scoreFraud
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreFraudRequest'
      responses:
        '200':
          description: Fraud verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreFraudResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvestigationPurpose:
      name: X-Investigation-Purpose
      in: header
      required: true
      schema: { type: string, enum: [FRAUD_INVESTIGATION] }
    InvestigatorAuthorization:
      name: X-Investigator-Authorization
      in: header
      required: true
      description: Human bearer independently checked against the assigned root case.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retry identifier. Opening is also deduplicated by score; closing is idempotent by case.
      schema: { type: string, minLength: 1, maxLength: 128 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: >-
        The request body failed validation at the HTTP boundary — e.g. `currency`
        is not a 3-letter ISO 4217 code, or `rail` is blank
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: >-
        Caller lacks a required role, or is authenticated but denied by the OPA
        authorization policy (ADR-0034)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    OpenFraudInvestigationRequest:
      type: object
      required: [scoreId]
      properties:
        scoreId: { type: string, format: uuid }
    FraudAssignedMatchResponse:
      type: object
      required: [candidateIds, inspectedCandidates, truncated]
      properties:
        candidateIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { type: string, format: uuid }
        inspectedCandidates: { type: integer, minimum: 0, maximum: 256 }
        truncated: { type: boolean }
    FraudInvestigationCase:
      type: object
      required: [caseId, scoreId, status, revision, openedAt]
      properties:
        caseId: { type: string, format: uuid }
        scoreId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CLOSED_NO_FINDING] }
        revision: { type: integer, format: int64, minimum: 1 }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    FraudInvestigationEvidence:
      type: object
      required: [caseId, scoreId, accountId, status, revision, openedAt]
      properties:
        caseId: { type: string, format: uuid }
        scoreId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        counterpartyId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [OPEN, CLOSED_NO_FINDING] }
        revision: { type: integer, format: int64, minimum: 1 }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    ScoreFraudRequest:
      type: object
      required: [amount, currency, rail]
      properties:
        amount:
          type: string
          description: Payment amount as a decimal string (e.g. "1250.00")
          example: "1250.00"
        currency:
          type: string
          description: >-
            ISO-4217 currency code — exactly three upper-case letters. Enforced by
            `FraudResource.validate` (400); `fraud_scores.currency` is a `varchar(3)`,
            so anything longer used to overflow the column and answer 500. Stated as
            prose, not a `pattern`, on purpose: adding a request-side constraint is a
            BREAKING oasdiff change (major + a `/api/v2` URL), and the spec was never
            the wrong side here — the missing guard was.
          example: "CZK"
        rail:
          type: string
          description: Payment rail / type (e.g. SEPA, SEPA_INSTANT, DOMESTIC, FX). Must be non-blank.
          example: "SEPA_INSTANT"
        accountId:
          type: string
          format: uuid
          nullable: true
        counterpartyId:
          type: string
          format: uuid
          nullable: true

    ScoreFraudResponse:
      type: object
      required: [verdict, score, reasons, ruleVersion]
      properties:
        verdict:
          type: string
          enum: [ALLOW, CHALLENGE, REVIEW, DECLINE]
        score:
          type: integer
          description: Deterministic numeric risk score (0 = no risk)
        reasons:
          type: array
          items:
            type: string
          description: Human-readable reasons for rules that fired
        ruleVersion:
          type: string
          description: Version of the rule set that produced the verdict
          example: "v0"

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
